 ["Kathanar","The traditional Malayalam title of a priest among the St Thomas Christians, still used with affection in Kerala.",
  "കത്തനാർ","മാർത്തോമ്മാ ക്രിസ്ത്യാനികൾക്കിടയിൽ വൈദികനുള്ള പരമ്പരാഗത മലയാളം സ്ഥാനപ്പേര്; ഇന്നും സ്നേഹത്തോടെ ഉപയോഗിക്കുന്നു."],
 ["Malpan","A teacher of the Syriac language, Scripture and liturgy. In earlier centuries Malpans trained the future priests in their own houses or parish seminaries.",
  "മല്പാൻ","സുറിയാനിഭാഷയും വേദപുസ്തകവും ആരാധനക്രമവും പഠിപ്പിക്കുന്ന ഗുരു. മുൻനൂറ്റാണ്ടുകളിൽ മല്പാന്മാർ തങ്ങളുടെ ഭവനങ്ങളിലും ഇടവകപ്പഠനശാലകളിലും വൈദികാർഥികളെ പരിശീലിപ്പിച്ചിരുന്നു."],
 ["Trisagion","“Holy God, Holy Mighty One, Holy Immortal One, have mercy on us.” This thrice-holy hymn is sung before the readings, as the Church joins the praise of the angels.",
  "ത്രിശുദ്ധകീർത്തനം","“പരിശുദ്ധനായ ദൈവമേ, പരിശുദ്ധനായ ബലവാനേ, പരിശുദ്ധനായ അമർത്യനേ, ഞങ്ങളുടെമേൽ കൃപ ചെയ്യണമേ.” മാലാഖമാരുടെ സ്തുതിയിൽ സഭ പങ്കുചേർന്നുകൊണ്ടു വായനകൾക്കു മുമ്പ് ഈ കീർത്തനം ആലപിക്കുന്നു."],
 ["Kusappa","Prayers of humility and supplication said quietly by the priest, bowing, as he prepares to enter the Anaphora. He confesses his unworthiness and asks for God's mercy.",
  "കൂശാപ്പ","അനാഫൊറയിലേക്കു പ്രവേശിക്കാൻ ഒരുങ്ങുമ്പോൾ വൈദികൻ കുനിഞ്ഞുനിന്നു നിശ്ശബ്ദമായി ചൊല്ലുന്ന എളിമയുടെയും യാചനയുടെയും പ്രാർഥനകൾ. തന്റെ അയോഗ്യത ഏറ്റുപറഞ്ഞ് അദ്ദേഹം ദൈവകരുണ യാചിക്കുന്നു."],
 ["G'hantha and Qanona","The G'hantha are the prayers of the Anaphora said by the priest with bowed head; each ends with a Qanona, a doxology sung aloud, to which the people answer “Amen”.",
  "ഗ്ഹാന്തായും കാനോനയും","അനാഫൊറയിൽ വൈദികൻ തലകുനിച്ചു ചൊല്ലുന്ന പ്രാർഥനകളാണു ഗ്ഹാന്താ; ഓരോന്നും ഉച്ചത്തിൽ ആലപിക്കുന്ന സ്തുതിയായ കാനോനയോടെ അവസാനിക്കുന്നു, ജനം “ആമ്മേൻ” എന്നു പ്രത്യുത്തരിക്കുന്നു."],
 ["Kaikasthuri","The Peace given before the Anaphora. It passes from the altar to the people, each receiving it with joined hands from the next, as a sign of reconciliation before the offering (Matthew 5:23-24).",
  "കൈക്കസ്തൂരി","അനാഫൊറയ്ക്കു മുമ്പു നൽകുന്ന സമാധാനം. ബലിപീഠത്തിൽനിന്നു ജനത്തിലേക്ക് അതു കടന്നുപോകുന്നു; ഓരോരുത്തരും അടുത്തയാളിൽനിന്നു കൂപ്പിയ കൈകളിൽ സ്വീകരിക്കുന്നു. കാഴ്ചയർപ്പണത്തിനു മുമ്പുള്ള അനുരഞ്ജനത്തിന്റെ അടയാളം (മത്താ 5:23-24)."],
 ["Epiclesis","The invocation of the Holy Spirit in the Anaphora, asking that he come upon the offering and upon the people, so that the gifts may be for the forgiveness of sins and new life.",
  "റൂഹാക്ഷണപ്രാർഥന","അനാഫൊറയിൽ റൂഹാദ്ക്കുദ്ശായെ വിളിച്ചപേക്ഷിക്കുന്ന പ്രാർഥന. അവിടുന്നു കാഴ്ചവസ്തുക്കളുടെമേലും ജനത്തിന്റെമേലും ആവസിച്ച്, അവ പാപമോചനത്തിനും നവജീവനുമായി ഭവിക്കാൻ യാചിക്കുന്നു."],
 ["Breaking and signing","After the Anaphora the priest breaks the consecrated Bread and signs the Precious Blood with the Body and the Body with the Blood, proclaiming the one Christ who died and rose again.",
  "വിഭജനവും മുദ്രണവും","അനാഫൊറയ്ക്കുശേഷം വൈദികൻ കൂദാശ ചെയ്ത അപ്പം മുറിച്ച്, തിരുശരീരംകൊണ്ടു തിരുരക്തത്തെയും തിരുരക്തംകൊണ്ടു തിരുശരീരത്തെയും മുദ്രണം ചെയ്യുന്നു; മരിച്ച് ഉയിർത്ത ഏകമിശിഹായെ ഇതു പ്രഘോഷിക്കുന്നു."],
 ["Huttama","“Sealing”. The concluding prayer and blessing of the Holy Qurbana, by which the priest sends the people forth in peace.",
  "ഹുത്താമ","“മുദ്ര”. വിശുദ്ധ കുർബാനയുടെ സമാപനപ്രാർഥനയും ആശീർവാദവും; അതുവഴി വൈദികൻ ജനത്തെ സമാധാനത്തിൽ പറഞ്ഞയയ്ക്കുന്നു."],
 ["Hudra","“Cycle”. The book of the Liturgy of the Hours for the Sundays, feasts and seasons of the whole liturgical year.",
  "ഹൂദ്ര","“ചക്രം”. ആരാധനാവത്സരത്തിലെ ഞായറാഴ്ചകൾക്കും തിരുനാളുകൾക്കും കാലങ്ങൾക്കുമുള്ള യാമപ്രാർഥനാഗ്രന്ഥം."],
 ["Gazza","“Treasury”. The book of the Hours containing the hymns and prayers for the feasts of the Lord, of Our Lady and of the saints.",
  "ഗസ്സ","“ഭണ്ഡാരം”. കർത്താവിന്റെയും പരിശുദ്ധ കന്യകയുടെയും വിശുദ്ധരുടെയും തിരുനാളുകൾക്കുള്ള ഗീതങ്ങളും പ്രാർഥനകളും അടങ്ങിയ യാമപ്രാർഥനാഗ്രന്ഥം."],
 ["Kaskol","“Containing all”. The book of the Hours for ordinary weekdays, arranged in a two-week cycle.",
  "കശ്കോൽ","“എല്ലാം അടങ്ങിയത്”. സാധാരണ ആഴ്ചദിവസങ്ങൾക്കുള്ള യാമപ്രാർഥനാഗ്രന്ഥം; രണ്ടാഴ്ചത്തെ ചക്രമായി ക്രമീകരിച്ചിരിക്കുന്നു."],
 ["Suvara","“Annunciation”. The first season of the liturgical year: four Sundays before Christmas, recalling the announcements to Zechariah, Mary and Joseph, and then the Nativity itself.",
  "മംഗളവാർത്തക്കാലം","ആരാധനാവത്സരത്തിലെ ആദ്യകാലം (സുവാറ): പിറവിത്തിരുനാളിനു മുമ്പുള്ള നാലു ഞായറാഴ്ചകൾ. സഖറിയായ്ക്കും മറിയത്തിനും യൗസേപ്പിനും ലഭിച്ച മംഗളവാർത്തകളും തുടർന്ന് ഈശോയുടെ പിറവിയും അനുസ്മരിക്കുന്നു."],
 ["Denha","“Dawning” or Epiphany, 6 January: the baptism of the Lord in the Jordan, when the Trinity was revealed. The season of Denha follows until the Great Fast. In Kerala its eve is kept as Rakkuli, with lamps and a night bath.",
  "ദനഹാ","“ഉദയം”, ജനുവരി 6: യോർദാനിലെ ഈശോയുടെ മാമ്മോദീസായും പരിശുദ്ധ ത്രിത്വത്തിന്റെ വെളിപ്പെടുത്തലും. തുടർന്നു വലിയ നോമ്പുവരെ ദനഹാക്കാലം. കേരളത്തിൽ തലേന്നു രാത്രി ദീപങ്ങളോടും രാക്കുളിയോടുംകൂടി ആഘോഷിക്കുന്നു."],
 ["Pethurtha","“Looking back”. The Sunday on which the Great Fast is welcomed: the faithful are reconciled with one another and take leave of festive food before the fast begins the next day.",
  "പേത്തുർത്താ","“തിരിഞ്ഞുനോട്ടം”. വലിയ നോമ്പിനെ സ്വാഗതം ചെയ്യുന്ന ഞായർ. പിറ്റേന്നു നോമ്പ് ആരംഭിക്കുന്നതിനു മുമ്പു വിശ്വാസികൾ പരസ്പരം അനുരഞ്ജനപ്പെടുകയും ആഘോഷഭക്ഷണത്തോടു വിടപറയുകയും ചെയ്യുന്നു."],
 ["Sauma Rabba","The Great Fast of fifty days before Easter. In the Syro-Malabar Church it begins on a Monday, when ashes are blessed and placed on the forehead.",
  "വലിയ നോമ്പ്","ഉയിർപ്പുതിരുനാളിനു മുമ്പുള്ള അമ്പതു ദിവസത്തെ ഉപവാസം (സൗമാ റബ്ബാ). സീറോ മലബാർ സഭയിൽ ഇത് ഒരു തിങ്കളാഴ്ച ആരംഭിക്കുന്നു; അന്നു ചാരം ആശീർവദിച്ചു നെറ്റിയിൽ പൂശുന്നു."],
 ["Qyamtha","“Resurrection”. The season of seven weeks from Easter to Pentecost, the season of joy in the risen Lord.",
  "ഉയിർപ്പുകാലം","“ഖ്യാംതാ”. ഉയിർപ്പുതിരുനാൾമുതൽ പന്തക്കുസ്താവരെയുള്ള ഏഴ് ആഴ്ചകൾ; ഉത്ഥിതനായ കർത്താവിൽ ആനന്ദിക്കുന്ന കാലം."],
 ["Sliha","“Apostles”. The season of seven weeks after Pentecost, recalling the coming of the Holy Spirit and the mission of the apostles to the nations.",
  "ശ്ലീഹാക്കാലം","പന്തക്കുസ്തായ്ക്കുശേഷമുള്ള ഏഴ് ആഴ്ചകൾ; റൂഹാദ്ക്കുദ്ശായുടെ ആഗമനവും ജനതകളിലേക്കുള്ള ശ്ലീഹന്മാരുടെ ദൗത്യവും അനുസ്മരിക്കുന്നു."],
 ["Qaitha","“Summer”. The season after Sliha, the time of the Church's growth and fruitfulness. The Dukrana of St Thomas falls in it, and in Kerala the season is often called Kaitha.",
  "കൈത്താക്കാലം","“വേനൽ”. ശ്ലീഹാക്കാലത്തിനുശേഷം സഭയുടെ വളർച്ചയെയും ഫലസമൃദ്ധിയെയും ധ്യാനിക്കുന്ന കാലം. മാർ തോമാശ്ലീഹായുടെ ദുക്റാന ഈ കാലത്തിലാണ്."],
 ["Eliya-Sleeva-Moses","The season that looks toward the end of time and the second coming of Christ. It takes its name from Elijah, from the Cross whose feast falls on 14 September, and from Moses.",
  "ഏലിയാ-സ്ലീവാ-മൂശെക്കാലം","ലോകാവസാനത്തെയും മിശിഹായുടെ രണ്ടാം വരവിനെയും ഉറ്റുനോക്കുന്ന കാലം. ഏലിയായുടെയും സെപ്റ്റംബർ 14-നു തിരുനാൾ ആഘോഷിക്കുന്ന സ്ലീവായുടെയും മൂശെയുടെയും പേരിൽ അറിയപ്പെടുന്നു."],
 ["Qudash Edta","“Dedication of the Church”. The last season of the year, four weeks in which the Church, the Bride of Christ, is seen in her glory, presented to the Father.",
  "പള്ളിക്കൂദാശക്കാലം","“ഖൂദാശ് ഏദ്താ”. ആരാധനാവത്സരത്തിലെ അവസാനകാലം; മിശിഹായുടെ മണവാട്ടിയായ സഭയെ മഹത്ത്വത്തിൽ പിതാവിനു സമർപ്പിക്കുന്നതു ധ്യാനിക്കുന്ന നാല് ആഴ്ചകൾ."],
 ["Mamodisa","Baptism, the first of the sacraments. In the Syro-Malabar Church the child is baptised, and anointed with the holy Myron in one celebration.",
  "മാമ്മോദീസാ","കൂദാശകളിൽ ആദ്യത്തേത്. സീറോ മലബാർ സഭയിൽ ഒരേ ആഘോഷത്തിൽ കുഞ്ഞിനു മാമ്മോദീസാ നൽകുകയും വിശുദ്ധ മൂറോൻകൊണ്ടു തൈലാഭിഷേകം നടത്തുകയും ചെയ്യുന്നു."],
 ["Raze","“Mysteries”. The East Syriac word for the sacraments, the holy signs through which Christ gives his life; the Holy Qurbana is the Mystery of mysteries.",
  "റാസേ","“രഹസ്യങ്ങൾ”. കൂദാശകൾക്കുള്ള പൗരസ്ത്യസുറിയാനിപദം; മിശിഹാ തന്റെ ജീവൻ നൽകുന്ന വിശുദ്ധ അടയാളങ്ങൾ. വിശുദ്ധ കുർബാന രഹസ്യങ്ങളുടെ രഹസ്യമാണ്."]
],
smk:[
 ["Tablitho","A consecrated slab of wood or stone, anointed by the bishop with holy Moorono, laid on the altar. The Holy Qurbono is offered upon it.",
  "തബ്ലീസാ","മെത്രാൻ വിശുദ്ധ മൂറോൻകൊണ്ട് അഭിഷേകം ചെയ്ത്, ബലിപീഠത്തിൽ വയ്ക്കുന്ന മരത്തിലോ കല്ലിലോ ഉള്ള പലക. വി. കുർബാന അതിന്മേലാണ് അർപ്പിക്കുന്നത്."],
 ["Kasa and Pilaso","The chalice (Kasa) for the wine and the paten (Pilaso) for the bread, consecrated vessels used only for the holy Mysteries.",
  "കാസായും പീലാസായും","വീഞ്ഞിനുള്ള പാനപാത്രമാണു കാസാ; അപ്പത്തിനുള്ള തളികയാണു പീലാസാ. വിശുദ്ധ രഹസ്യങ്ങൾക്കു മാത്രം ഉപയോഗിക്കുന്ന കൂദാശ ചെയ്ത പാത്രങ്ങൾ."],
 ["Shushepo","The veils that cover the chalice and paten. The large veil over the gifts is lifted and waved over them at the beginning of the Anaphora, recalling the stone rolled from the tomb and the descent of the Spirit.",
  "ശോശപ്പാ","കാസായെയും പീലാസായെയും മൂടുന്ന വിരികൾ. കാഴ്ചവസ്തുക്കളുടെമേലുള്ള വലിയ വിരി അനാഫൊറയുടെ ആരംഭത്തിൽ ഉയർത്തി അവയുടെമേൽ വീശുന്നു; കല്ലറയിൽനിന്ന് ഉരുട്ടിമാറ്റിയ കല്ലും പരിശുദ്ധാത്മാവിന്റെ ആഗമനവും ഇത് ഓർമിപ്പിക്കുന്നു."],
 ["Marvahtho","Liturgical fans of metal, often with small bells, held by the servers and shaken at solemn moments. They stand for the seraphim who surround the throne of God.",
  "മർവഹസ്സാ","ശുശ്രൂഷികൾ പിടിച്ച്, ആഘോഷമായ നിമിഷങ്ങളിൽ ഇളക്കുന്ന, പലപ്പോഴും ചെറുമണികളുള്ള ലോഹവിശറികൾ. ദൈവസിംഹാസനത്തെ ചുറ്റിനിൽക്കുന്ന സെറാഫുകളെ അവ സൂചിപ്പിക്കുന്നു."],
 ["Etro","“Incense”. The prayer said as incense is offered after the Sedro, asking that our prayer rise before God like fragrant smoke.",
  "ഏത്രോ","“ധൂപം”. സെദറായ്ക്കുശേഷം ധൂപം അർപ്പിക്കുമ്പോൾ ചൊല്ലുന്ന പ്രാർഥന; നമ്മുടെ പ്രാർഥന സുഗന്ധധൂപംപോലെ ദൈവസന്നിധിയിൽ ഉയരാൻ യാചിക്കുന്നു."],
 ["Kothino","The long white tunic worn by the priest and deacon, recalling the robe of baptism and the purity of those who serve at the altar.",
  "കൂത്തിനോ","വൈദികനും ശെമ്മാശനും ധരിക്കുന്ന നീണ്ട വെള്ളക്കുപ്പായം; മാമ്മോദീസാവസ്ത്രത്തെയും ബലിപീഠത്തിൽ ശുശ്രൂഷിക്കുന്നവരുടെ വിശുദ്ധിയെയും ഓർമിപ്പിക്കുന്നു."],
 ["Hamnikho and Uroro","The priest's stole (Hamnikho), worn around the neck and falling in front, and the deacon's stole (Uroro), worn over the left shoulder. They are the signs of their orders.",
  "ഹമ്നിക്കോയും ഊറാറായും","കഴുത്തിലൂടെ മുമ്പിലേക്കു തൂക്കി വൈദികൻ ധരിക്കുന്ന സ്റ്റോളാണു ഹമ്നിക്കോ; ഇടത്തേ തോളിൽ ശെമ്മാശൻ ധരിക്കുന്നത് ഊറാറാ. അവരുടെ പട്ടത്തിന്റെ അടയാളങ്ങളാണിവ."],
 ["Zunoro and Zende","The girdle (Zunoro) around the waist and the cuffs (Zende) on the wrists, signs of readiness and of hands set apart for holy service.",
  "സുന്നാറായും സന്ദേയും","അരയിൽ കെട്ടുന്ന അരപ്പട്ടയാണു സുന്നാറാ; കൈത്തണ്ടയിൽ അണിയുന്നവയാണു സന്ദേ. ശുശ്രൂഷയ്ക്കുള്ള ഒരുക്കത്തിന്റെയും വിശുദ്ധകർമത്തിനായി വേർതിരിച്ച കൈകളുടെയും അടയാളങ്ങൾ."],
 ["Phayno","The cope-like outer vestment worn by the celebrant over all the others. In Kerala it is commonly called the Kappa.",
  "കാപ്പാ","മറ്റെല്ലാ വസ്ത്രങ്ങൾക്കും മുകളിൽ കാർമികൻ ധരിക്കുന്ന മേലങ്കിപോലെയുള്ള പുറംവസ്ത്രം (സുറിയാനിയിൽ ഫൈനോ)."],
 ["Masnapso","The hood worn by bishops, embroidered with crosses, a sign of the monastic life and of the bishop's office as shepherd.",
  "മസ്നപ്സാ","കുരിശുകൾ തുന്നിച്ചേർത്ത, മെത്രാന്മാർ ധരിക്കുന്ന ശിരോവസ്ത്രം; സന്യാസജീവിതത്തിന്റെയും ഇടയനെന്ന മെത്രാന്റെ ശുശ്രൂഷയുടെയും അടയാളം."],
 ["Phenqitho","The book of the Hours for Sundays, feasts and the great seasons of the year, in several volumes. The Shehimo serves for ordinary weekdays.",
  "പെങ്കീസാ","ഞായറാഴ്ചകൾക്കും തിരുനാളുകൾക്കും ആണ്ടുവട്ടത്തിലെ പ്രധാന കാലങ്ങൾക്കുമുള്ള, പല വാല്യങ്ങളുള്ള യാമപ്രാർഥനാഗ്രന്ഥം. സാധാരണ ദിവസങ്ങൾക്കുള്ളതു ശ്ഹീമോ."],
 ["Kukilion","A set of psalm verses sung with Alleluias, followed by a short hymn (Eqbo). Kukilions are sung in the Hoosoyo and in the services of the great feasts.",
  "കുക്കിലിയോൻ","ഹല്ലേലുയ്യാകളോടുകൂടി ആലപിക്കുന്ന സങ്കീർത്തനവാക്യങ്ങളും തുടർന്നുള്ള ചെറുഗീതവും (എക്ബോ) ചേർന്ന ഘടകം. ഹൂസോയോയിലും വലിയ തിരുനാളുകളിലെ ശുശ്രൂഷകളിലും ഇവ ആലപിക്കുന്നു."],
 ["Thuyobo","The order of preparation, in which the priest prepares the bread and wine at the altar before the public celebration of the Qurbono begins.",
  "തുയോബോ","ഒരുക്കശുശ്രൂഷ. വി. കുർബാനയുടെ പരസ്യ ആഘോഷം ആരംഭിക്കുന്നതിനു മുമ്പു വൈദികൻ ബലിപീഠത്തിൽ അപ്പവും വീഞ്ഞും ഒരുക്കുന്നു."],
 ["Trisagion","“Holy are you, O God; holy are you, Almighty; holy are you, Immortal; you who were crucified for us, have mercy on us.” Sung before the readings in the Qurbono.",
  "ത്രിശുദ്ധകീർത്തനം","“ദൈവമേ, നീ പരിശുദ്ധനാകുന്നു; ബലവാനേ, നീ പരിശുദ്ധനാകുന്നു; മരണമില്ലാത്തവനേ, നീ പരിശുദ്ധനാകുന്നു; ഞങ്ങൾക്കുവേണ്ടി ക്രൂശിക്കപ്പെട്ടവനേ, ഞങ്ങളോടു കരുണ ചെയ്യണമേ.” വി. കുർബാനയിൽ വായനകൾക്കു മുമ്പ് ആലപിക്കുന്നു."],
 ["Kiss of peace","At the start of the Anaphora the peace is passed from the altar to the people, hand to hand, as a sign that we come to the offering reconciled (Matthew 5:23-24). In Kerala it is called Kaikasthuri.",
  "സമാധാനം (കൈക്കസ്തൂരി)","അനാഫൊറയുടെ ആരംഭത്തിൽ ബലിപീഠത്തിൽനിന്നു ജനത്തിലേക്കു കൈമാറി സമാധാനം നൽകുന്നു; അനുരഞ്ജിതരായി നാം കാഴ്ചയർപ്പണത്തിനു വരുന്നു എന്നതിന്റെ അടയാളം (മത്താ 5:23-24)."],
 ["Epiclesis","The calling down of the Holy Spirit upon the bread and wine. The priest prays “Answer me, O Lord” three times and moves his hands over the gifts, like the Spirit hovering over the waters.",
  "റൂഹാക്ഷണം","അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയുംമേൽ പരിശുദ്ധാത്മാവിനെ വിളിച്ചിറക്കുന്ന പ്രാർഥന. “കർത്താവേ, എനിക്ക് ഉത്തരമരുളണമേ” എന്നു മൂന്നു പ്രാവശ്യം പ്രാർഥിച്ചുകൊണ്ടു വൈദികൻ കാഴ്ചവസ്തുക്കളുടെമേൽ കൈകൾ ചലിപ്പിക്കുന്നു; ജലത്തിനുമീതേ ചലിച്ച ആത്മാവിനെപ്പോലെ."],
 ["Holy things to the holy","The priest lifts up the consecrated Mysteries and proclaims that the holy gifts are for the holy people of God; the people answer that only one is holy, the Father, the Son and the Holy Spirit.",
  "വിശുദ്ധമായവ വിശുദ്ധർക്ക്","കൂദാശ ചെയ്യപ്പെട്ട രഹസ്യങ്ങൾ ഉയർത്തി, വിശുദ്ധമായ ദാനങ്ങൾ ദൈവത്തിന്റെ വിശുദ്ധജനത്തിനുള്ളതാണെന്നു വൈദികൻ പ്രഘോഷിക്കുന്നു; പിതാവും പുത്രനും പരിശുദ്ധാത്മാവുമായ ഏകൻ മാത്രമാണു പരിശുദ്ധൻ എന്നു ജനം പ്രത്യുത്തരിക്കുന്നു."],
 ["Hoothomo","“Seal”. The concluding prayer and blessing of the Qurbono or of an Hour, sending the people away in peace.",
  "ഹൂത്തോമോ","“മുദ്ര”. വി. കുർബാനയുടെയോ യാമപ്രാർഥനയുടെയോ സമാപനപ്രാർഥനയും ആശീർവാദവും; ജനത്തെ സമാധാനത്തിൽ പറഞ്ഞയയ്ക്കുന്നു."],
 ["The seven Hours","The West Syriac day begins in the evening: Ramsho (evening), Soothoro (night rest), Lilyo (night), Sapro (morning), and the third, sixth and ninth hours.",
  "ഏഴു യാമങ്ങൾ","പാശ്ചാത്യസുറിയാനി പാരമ്പര്യത്തിൽ ദിവസം സന്ധ്യയോടെ ആരംഭിക്കുന്നു: റംശോ (സന്ധ്യ), സൂത്താറാ (ഉറക്കത്തിനു മുമ്പ്), ലെലിയോ (രാത്രി), സപ്രോ (പ്രഭാതം), മൂന്നാം, ആറാം, ഒമ്പതാം മണിനേരങ്ങൾ."],
 ["Shamshono","The deacon, who serves at the altar, reads the Epistle, leads the people's prayers and calls them to stand with awe.",
  "ശെമ്മാശൻ","ബലിപീഠത്തിൽ ശുശ്രൂഷിക്കുകയും ലേഖനം വായിക്കുകയും ജനത്തിന്റെ പ്രാർഥനകൾ നയിക്കുകയും ഭയഭക്തിയോടെ നിൽക്കാൻ അവരെ ക്ഷണിക്കുകയും ചെയ്യുന്ന ഡീക്കൻ."],
 ["Corepiscopo","An honorary title given to senior priests for their service to the Church. A Corepiscopo wears a distinctive cap and cross.",
  "കോറെപ്പിസ്കോപ്പാ","സഭയ്ക്കു ചെയ്ത സേവനത്തിനു മുതിർന്ന വൈദികർക്കു നൽകുന്ന ബഹുമതിസ്ഥാനം. കോറെപ്പിസ്കോപ്പാമാർ പ്രത്യേക തൊപ്പിയും കുരിശും ധരിക്കുന്നു."],
 ["Ramban","A celibate priest-monk. In the Malankara tradition a priest chosen as bishop is first made a Ramban before his episcopal ordination.",
  "റമ്പാൻ","ബ്രഹ്മചാരിയായ സന്യാസവൈദികൻ. മലങ്കര പാരമ്പര്യത്തിൽ മെത്രാനായി തിരഞ്ഞെടുക്കപ്പെടുന്ന വൈദികനെ മെത്രാഭിഷേകത്തിനു മുമ്പു റമ്പാനാക്കുന്നു."],
 ["Suboro","“Annunciation”. The weeks before Christmas, recalling the announcements to Zechariah and to Mary, the Visitation, the birth of John and the revelation to Joseph.",
  "സൂബോറോ","“അറിയിപ്പ്”. ക്രിസ്മസിനു മുമ്പുള്ള ആഴ്ചകൾ; സഖറിയായ്ക്കും മറിയത്തിനുമുള്ള മംഗളവാർത്ത, സന്ദർശനം, യോഹന്നാന്റെ ജനനം, യൗസേപ്പിനുള്ള വെളിപ്പെടുത്തൽ എന്നിവ അനുസ്മരിക്കുന്നു."],
 ["Yeldo","The Nativity of our Lord, 25 December. It is preceded by the Yeldo fast and celebrated with the service of the fire, recalling the light that came into the world.",
  "യൽദോ","നമ്മുടെ കർത്താവിന്റെ ജനനത്തിരുനാൾ, ഡിസംബർ 25. യൽദോ നോമ്പിനുശേഷം, ലോകത്തിലേക്കു വന്ന പ്രകാശത്തെ അനുസ്മരിപ്പിക്കുന്ന തീജ്വാലശുശ്രൂഷയോടെ ആഘോഷിക്കുന്നു."],
 ["Denho","“Dawning”. The feast of the Lord's baptism in the Jordan, 6 January, with the solemn blessing of water.",
  "ദെൻഹോ","“ഉദയം”. ജനുവരി 6-ന് യോർദാനിലെ കർത്താവിന്റെ മാമ്മോദീസായുടെ തിരുനാൾ; ജലത്തിന്റെ ആഘോഷമായ വാഴ്വോടെ."],
 ["Kothine and the Great Lent","The Great Lent of fifty days opens with Kothine Sunday, recalling the wedding at Cana (John 2), where the Lord changed water into wine.",
  "കൊത്തിനേയും വലിയ നോമ്പും","അമ്പതു ദിവസത്തെ വലിയ നോമ്പ് കൊത്തിനേ ഞായറോടെ ആരംഭിക്കുന്നു; കർത്താവു വെള്ളം വീഞ്ഞാക്കിയ കാനായിലെ കല്യാണം (യോഹ 2) അന്ന് അനുസ്മരിക്കുന്നു."],
 ["Shubqono","“Forgiveness”. The service on the first day of Great Lent, in which the clergy and people ask forgiveness of one another before beginning the fast.",
  "ശുബ്കോനോ","“ക്ഷമ”. വലിയ നോമ്പിന്റെ ആദ്യദിനത്തിലെ ശുശ്രൂഷ; ഉപവാസം ആരംഭിക്കുന്നതിനു മുമ്പു വൈദികരും ജനവും പരസ്പരം ക്ഷമ ചോദിക്കുന്നു."],
 ["Shoonoyo","“Departure”. The feast of the falling asleep and assumption of the Mother of God on 15 August, preceded by a fast.",
  "ശൂനോയോ","“യാത്ര”. ആഗസ്റ്റ് 15-നു ദൈവമാതാവിന്റെ നിദ്രയുടെയും സ്വർഗാരോപണത്തിന്റെയും തിരുനാൾ; നോമ്പോടെ ഒരുങ്ങുന്നു."],
 ["Moorono","The holy chrism, consecrated by the Major Archbishop-Catholicos with the bishops. It is used in Baptism, in the consecration of altars and churches and in ordinations.",
  "മൂറോൻ","മേജർ ആർച്ച്ബിഷപ്-കാതോലിക്കോസ് മെത്രാന്മാരോടൊപ്പം കൂദാശ ചെയ്യുന്ന വിശുദ്ധ തൈലം. മാമ്മോദീസായിലും ബലിപീഠങ്ങളുടെയും ദേവാലയങ്ങളുടെയും കൂദാശയിലും പട്ടംകൊടയിലും ഉപയോഗിക്കുന്നു."],
 ["Kantheela","“Lamp”. The anointing of the sick, in which oil is blessed with prayers and lights, and the sick are anointed for healing of body and soul (James 5:14-15).",
  "കന്തീല","“ദീപം”. രോഗീലേപനം. പ്രാർഥനകളോടും ദീപങ്ങളോടുംകൂടി എണ്ണ ആശീർവദിച്ച്, ശരീരത്തിന്റെയും ആത്മാവിന്റെയും സൗഖ്യത്തിനായി രോഗികളെ അഭിഷേകം ചെയ്യുന്നു (യാക്കോ 5:14-15)."]
],
lat:[
 ["Alb","The long white garment worn by priests, deacons and servers. Its name means “white”; it recalls the baptismal garment.",
  "ആൽബ്","വൈദികരും ഡീക്കന്മാരും ശുശ്രൂഷികളും ധരിക്കുന്ന നീണ്ട വെള്ളവസ്ത്രം. “വെള്ള” എന്നാണ് ഇതിന്റെ അർഥം; മാമ്മോദീസാവസ്ത്രത്തെ ഇത് ഓർമിപ്പിക്കുന്നു."],
 ["Stole","A long band of cloth in the colour of the day. A priest or bishop wears it around the neck, hanging in front; a deacon wears it across the body from the left shoulder.",
  "സ്റ്റോൾ","അന്നത്തെ ആരാധനക്രമനിറത്തിലുള്ള നീണ്ട നാട. വൈദികനും മെത്രാനും കഴുത്തിലൂടെ മുമ്പിലേക്കു തൂക്കി ധരിക്കുന്നു; ഡീക്കൻ ഇടത്തേ തോളിൽനിന്നു ശരീരത്തിനു കുറുകെ."],
 ["Chasuble","The outer vestment of the priest at Mass, worn over the alb and stole, in the colour of the day. It is a sign of the charity that covers all things.",
  "കാസുല","ആൽബിനും സ്റ്റോളിനും മുകളിൽ, അന്നത്തെ നിറത്തിൽ, ദിവ്യബലിയിൽ വൈദികൻ ധരിക്കുന്ന പുറംവസ്ത്രം. എല്ലാറ്റിനെയും ആവരണം ചെയ്യുന്ന സ്നേഹത്തിന്റെ അടയാളം."],
 ["Dalmatic","The outer vestment of the deacon, with wide sleeves, worn over the alb and stole on solemn occasions.",
  "ഡാൽമാറ്റിക്","ആഘോഷവേളകളിൽ ആൽബിനും സ്റ്റോളിനും മുകളിൽ ഡീക്കൻ ധരിക്കുന്ന, വീതിയുള്ള കൈകളോടുകൂടിയ പുറംവസ്ത്രം."],
 ["Chalice and paten","The chalice is the cup that holds the wine to become the Blood of Christ; the paten is the plate that holds the bread to become his Body.",
  "കാസയും പീലാസയും","ക്രിസ്തുവിന്റെ രക്തമായി മാറുന്ന വീഞ്ഞു വയ്ക്കുന്ന പാനപാത്രമാണു കാസ; അവിടുത്തെ ശരീരമായി മാറുന്ന അപ്പം വയ്ക്കുന്ന തളികയാണു പീലാസ."],
 ["Ciborium","A covered vessel like a chalice that holds the consecrated hosts for Communion and for reservation in the tabernacle.",
  "സിബോറിയം","ദിവ്യകാരുണ്യസ്വീകരണത്തിനും സക്രാരിയിൽ സൂക്ഷിക്കുന്നതിനുമായി കൂദാശ ചെയ്ത ഓസ്തികൾ വയ്ക്കുന്ന, കാസപോലെയുള്ള അടപ്പുള്ള പാത്രം."],
 ["Corporal and purificator","The corporal is the square white linen spread on the altar, on which the chalice and paten rest; the purificator is the linen used to wipe the chalice.",
  "കോർപ്പറലും പ്യൂരിഫിക്കേറ്ററും","കാസയും പീലാസയും വയ്ക്കാനായി ബലിപീഠത്തിൽ വിരിക്കുന്ന ചതുരത്തിലുള്ള വെള്ളത്തുണിയാണു കോർപ്പറൽ; കാസ തുടയ്ക്കുന്ന തുണിയാണു പ്യൂരിഫിക്കേറ്റർ."],
 ["Monstrance","A vessel, often shaped like a sun with rays, in which the consecrated Host is shown for adoration and carried in procession.",
  "അരുളിക്ക","ആരാധനയ്ക്കായി കൂദാശ ചെയ്ത തിരുവോസ്തി പ്രദർശിപ്പിക്കുകയും പ്രദക്ഷിണമായി സംവഹിക്കുകയും ചെയ്യുന്ന, പലപ്പോഴും കിരണങ്ങളുള്ള സൂര്യന്റെ ആകൃതിയിലുള്ള പാത്രം."],
 ["Tabernacle and sanctuary lamp","The tabernacle is the locked, worthy place where the Blessed Sacrament is reserved for the sick and for adoration. A lamp burns beside it always, showing that the Lord is present.",
  "സക്രാരിയും സക്രാരിവിളക്കും","രോഗികൾക്കും ആരാധനയ്ക്കുമായി ദിവ്യകാരുണ്യം സൂക്ഷിക്കുന്ന, പൂട്ടിയ യോഗ്യമായ ഇടമാണു സക്രാരി. കർത്താവിന്റെ സാന്നിധ്യം അറിയിച്ചുകൊണ്ട് അതിനരികിൽ എപ്പോഴും ഒരു വിളക്ക് എരിയുന്നു."],
 ["Thurible and incense","The thurible is the censer on chains in which incense is burned. Incense honours the altar, the Gospel, the gifts, the priest and the people, and is a sign of prayer rising to God (Psalm 141:2).",
  "ധൂപക്കലശവും ധൂപവും","ധൂപം പുകയ്ക്കുന്ന, ചങ്ങലകളുള്ള പാത്രമാണു ധൂപക്കലശം. ബലിപീഠത്തെയും സുവിശേഷത്തെയും കാഴ്ചവസ്തുക്കളെയും വൈദികനെയും ജനത്തെയും ധൂപം ആദരിക്കുന്നു; ദൈവത്തിലേക്ക് ഉയരുന്ന പ്രാർഥനയുടെ അടയാളം (സങ്കീ 141:2)."],
 ["Roman Missal","The book used at the altar, containing the prayers of the Mass for every day and season, with the Eucharistic Prayers and the rubrics.",
  "റോമൻ മിസ്സാൾ","ബലിപീഠത്തിൽ ഉപയോഗിക്കുന്ന ഗ്രന്ഥം; എല്ലാ ദിവസങ്ങൾക്കും കാലങ്ങൾക്കുമുള്ള ദിവ്യബലിപ്രാർഥനകളും ദിവ്യകാരുണ്യപ്രാർഥനകളും നിർദേശങ്ങളും അതിലുണ്ട്."],
 ["Book of the Gospels","A worthy book containing the Gospel readings. It is carried in the entrance procession, placed on the altar, and proclaimed from the ambo by the deacon or priest.",
  "സുവിശേഷഗ്രന്ഥം","സുവിശേഷവായനകൾ അടങ്ങിയ യോഗ്യമായ ഗ്രന്ഥം. പ്രവേശനപ്രദക്ഷിണത്തിൽ സംവഹിച്ചു ബലിപീഠത്തിൽ വയ്ക്കുകയും ഡീക്കനോ വൈദികനോ വചനവേദിയിൽനിന്ന് അതു പ്രഘോഷിക്കുകയും ചെയ്യുന്നു."],
 ["Ordinary of the Mass","The parts of the Mass that remain the same every day, such as the Kyrie, Gloria, Creed, Sanctus and Agnus Dei. The parts that change with the day, such as the readings and the Collect, are called the Proper.",
  "ദിവ്യബലിയുടെ സ്ഥിരഭാഗങ്ങൾ","കരുണയുടെ യാചന, മഹത്ത്വഗീതം, വിശ്വാസപ്രമാണം, പരിശുദ്ധൻ, ദൈവത്തിന്റെ കുഞ്ഞാട് എന്നിങ്ങനെ എല്ലാ ദിവസവും മാറാതെ നിൽക്കുന്ന ഭാഗങ്ങൾ. വായനകൾ, സമാഹാരപ്രാർഥന തുടങ്ങി ദിവസമനുസരിച്ചു മാറുന്നവ പ്രത്യേകഭാഗങ്ങൾ എന്നറിയപ്പെടുന്നു."],
 ["Penitential Act and Kyrie","At the beginning of Mass the people acknowledge their sins and ask God's mercy, often with the ancient Greek cry “Kyrie, eleison”: “Lord, have mercy”.",
  "അനുതാപശുശ്രൂഷയും കരുണയുടെ യാചനയും","ദിവ്യബലിയുടെ ആരംഭത്തിൽ ജനം തങ്ങളുടെ പാപങ്ങൾ ഏറ്റുപറഞ്ഞു ദൈവകരുണ യാചിക്കുന്നു; പലപ്പോഴും “കീരിയേ എലെയിസോൻ”, “കർത്താവേ, കരുണയായിരിക്കണമേ” എന്ന പുരാതന ഗ്രീക്ക് യാചനയോടെ."],
 ["Gloria","“Glory to God in the highest”, the hymn of the angels at Bethlehem (Luke 2:14), sung on Sundays outside Advent and Lent, and on solemnities and feasts.",
  "മഹത്ത്വഗീതം","“അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്ത്വം”: ബേത്‌ലെഹെമിലെ മാലാഖമാരുടെ ഗീതം (ലൂക്കാ 2:14). ആഗമനകാലത്തിനും നോമ്പുകാലത്തിനും പുറത്തുള്ള ഞായറാഴ്ചകളിലും മഹോത്സവങ്ങളിലും തിരുനാളുകളിലും ആലപിക്കുന്നു."],
 ["Collect","The opening prayer of the Mass, in which the priest “collects” the silent prayers of all into one prayer to the Father, through Christ, in the Holy Spirit.",
  "സമാഹാരപ്രാർഥന","ദിവ്യബലിയിലെ പ്രാരംഭപ്രാർഥന. എല്ലാവരുടെയും നിശ്ശബ്ദപ്രാർഥനകൾ ഒന്നിച്ചുചേർത്തു ക്രിസ്തുവിലൂടെ, പരിശുദ്ധാത്മാവിൽ, പിതാവിനു വൈദികൻ അർപ്പിക്കുന്നു."],
 ["Credo","“I believe”. The profession of faith, usually the Nicene-Constantinopolitan Creed, said or sung on Sundays and solemnities after the homily. The Apostles' Creed may also be used.",
  "വിശ്വാസപ്രമാണം","“ഞാൻ വിശ്വസിക്കുന്നു”. ഞായറാഴ്ചകളിലും മഹോത്സവങ്ങളിലും വചനസന്ദേശത്തിനുശേഷം ചൊല്ലുകയോ ആലപിക്കുകയോ ചെയ്യുന്ന വിശ്വാസപ്രഖ്യാപനം; സാധാരണയായി നിഖ്യാ-കോൺസ്റ്റാന്റിനോപ്പിൾ വിശ്വാസപ്രമാണം. ശ്ലീഹന്മാരുടെ വിശ്വാസപ്രമാണവും ഉപയോഗിക്കാം."],
 ["Preparation of the Gifts","The bread and wine, with the gifts of the people, are brought to the altar; the priest places them there with blessings to God, mixes a little water with the wine and washes his hands.",
  "കാഴ്ചസമർപ്പണം","ജനത്തിന്റെ കാഴ്ചകളോടൊപ്പം അപ്പവും വീഞ്ഞും ബലിപീഠത്തിലേക്കു കൊണ്ടുവരുന്നു; ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ടു വൈദികൻ അവ അവിടെ വയ്ക്കുകയും വീഞ്ഞിൽ അൽപം വെള്ളം ചേർക്കുകയും കൈ കഴുകുകയും ചെയ്യുന്നു."],
 ["Preface","The opening hymn of thanksgiving of the Eucharistic Prayer, beginning “Lift up your hearts”. It changes with the season and feast and leads into the Sanctus.",
  "ആമുഖഗീതം","“നിങ്ങളുടെ ഹൃദയങ്ങൾ ഉയർത്തുവിൻ” എന്ന ക്ഷണത്തോടെ ആരംഭിക്കുന്ന, ദിവ്യകാരുണ്യപ്രാർഥനയുടെ പ്രാരംഭസ്തോത്രം. കാലത്തിനും തിരുനാളിനുമനുസരിച്ചു മാറുന്ന ഇതു പരിശുദ്ധൻ എന്ന ഗീതത്തിലേക്കു നയിക്കുന്നു."],
 ["Sanctus","“Holy, Holy, Holy Lord God of hosts”, the song of the seraphim (Isaiah 6:3) joined to the cry of Palm Sunday, “Blessed is he who comes” (Matthew 21:9).",
  "പരിശുദ്ധൻ","“പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ, സൈന്യങ്ങളുടെ കർത്താവായ ദൈവം”: സെറാഫുകളുടെ ഗീതവും (ഏശ 6:3) “കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗൃഹീതൻ” എന്ന ഓശാനവിളിയും (മത്താ 21:9) ചേർന്ന ഗീതം."],
 ["Epiclesis","The invocation of the Holy Spirit. With hands extended over the bread and wine, the priest asks the Father to send the Spirit so that they become the Body and Blood of Christ; later he prays that those who receive may become one body.",
  "പരിശുദ്ധാത്മാവിനെ വിളിച്ചപേക്ഷിക്കൽ","അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയുംമേൽ കൈകൾ നീട്ടി, അവ ക്രിസ്തുവിന്റെ ശരീരവും രക്തവുമാകാൻ ആത്മാവിനെ അയയ്ക്കണമേ എന്നു വൈദികൻ പിതാവിനോടു പ്രാർഥിക്കുന്നു (എപ്പിക്ലേസിസ്); പിന്നീട്, സ്വീകരിക്കുന്നവർ ഏകശരീരമാകാനും പ്രാർഥിക്കുന്നു."],
 ["Consecration","The institution narrative, in which the priest speaks the words of Christ at the Last Supper over the bread and wine. They become his Body and Blood, and are shown to the people for adoration.",
  "കൂദാശാവചനങ്ങൾ","അന്ത്യഅത്താഴത്തിലെ ക്രിസ്തുവിന്റെ വാക്കുകൾ വൈദികൻ അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയുംമേൽ ഉച്ചരിക്കുന്ന സ്ഥാപനവിവരണം. അവ അവിടുത്തെ ശരീരവും രക്തവുമായി മാറുന്നു; ആരാധനയ്ക്കായി ജനത്തെ കാണിക്കുന്നു."],
 ["Mystery of Faith","The people's acclamation after the consecration, proclaiming the death and resurrection of the Lord until he comes again.",
  "വിശ്വാസരഹസ്യം","കൂദാശാവചനങ്ങൾക്കുശേഷം, കർത്താവു വീണ്ടും വരുന്നതുവരെ അവിടുത്തെ മരണവും ഉത്ഥാനവും പ്രഘോഷിക്കുന്ന ജനത്തിന്റെ പ്രത്യുത്തരം."],
 ["Anamnesis","“Remembrance”. The prayer that follows, in which the Church, obeying the Lord's command “Do this in memory of me”, recalls his passion, resurrection and ascension and offers the holy sacrifice to the Father.",
  "അനാംനേസിസ് (സ്മരണ)","“എന്റെ ഓർമയ്ക്കായി ഇതു ചെയ്യുവിൻ” എന്ന കല്പന അനുസരിച്ചു സഭ കർത്താവിന്റെ പീഡാനുഭവവും ഉത്ഥാനവും സ്വർഗാരോഹണവും അനുസ്മരിച്ചു വിശുദ്ധബലി പിതാവിനു സമർപ്പിക്കുന്ന പ്രാർഥന."],
 ["Doxology and Great Amen","“Through him, and with him, and in him...” The priest lifts up the Body and Blood of Christ in praise of the Father, and the people make it their own with the Great Amen.",
  "സ്തുതിഗീതവും മഹത്തായ ആമേനും","“ക്രിസ്തുവിലൂടെ, ക്രിസ്തുവിനോടുകൂടെ, ക്രിസ്തുവിൽ...” പിതാവിനെ സ്തുതിച്ചുകൊണ്ടു വൈദികൻ ക്രിസ്തുവിന്റെ ശരീരവും രക്തവും ഉയർത്തുന്നു; മഹത്തായ “ആമേൻ” വഴി ജനം അത് ഏറ്റുപറയുന്നു."],
 ["Agnus Dei","“Lamb of God, you take away the sins of the world”, sung while the priest breaks the consecrated Host (John 1:29).",
  "ദൈവത്തിന്റെ കുഞ്ഞാട്","“ലോകത്തിന്റെ പാപങ്ങൾ നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാടേ” (യോഹ 1:29): വൈദികൻ കൂദാശ ചെയ്ത ഓസ്തി മുറിക്കുമ്പോൾ ആലപിക്കുന്ന ഗീതം."],
 ["Benediction","A rite of Eucharistic adoration: the Host is exposed in the monstrance, hymns such as “Tantum ergo” are sung with incense, and the priest blesses the people with the Blessed Sacrament.",
  "ദിവ്യകാരുണ്യ ആശീർവാദം","ദിവ്യകാരുണ്യാരാധനയുടെ ഒരു കർമം: തിരുവോസ്തി അരുളിക്കയിൽ പ്രതിഷ്ഠിച്ച്, ധൂപത്തോടെ “താന്തും എർഗോ” പോലെയുള്ള ഗീതങ്ങൾ ആലപിച്ച്, ദിവ്യകാരുണ്യംകൊണ്ടു വൈദികൻ ജനത്തെ ആശീർവദിക്കുന്നു."],
 ["Genuflection","Bending the right knee to the ground as an act of adoration, made before the Blessed Sacrament in the tabernacle.",
  "മുട്ടുകുത്തൽ","ആരാധനയുടെ അടയാളമായി വലത്തേ മുട്ടു നിലത്തു കുത്തുന്നത്; സക്രാരിയിലെ ദിവ്യകാരുണ്യത്തിനു മുമ്പിൽ ചെയ്യുന്നു."],
 ["Advent","The four weeks before Christmas, which begin the liturgical year: a time of joyful waiting for the Lord who came at Bethlehem and will come again in glory.",
  "ആഗമനകാലം","ആരാധനാവത്സരം ആരംഭിക്കുന്ന, ക്രിസ്മസിനു മുമ്പുള്ള നാല് ആഴ്ചകൾ: ബേത്‌ലെഹെമിൽ വന്നവനും മഹത്ത്വത്തിൽ വീണ്ടും വരാനിരിക്കുന്നവനുമായ കർത്താവിനെ ആനന്ദത്തോടെ കാത്തിരിക്കുന്ന കാലം."],
 ["Christmas season","From the Nativity of the Lord on 25 December to the feast of the Baptism of the Lord, including Mary, Mother of God (1 January) and the Epiphany.",
  "ക്രിസ്മസ്കാലം","ഡിസംബർ 25-ലെ കർത്താവിന്റെ ജനനത്തിരുനാൾമുതൽ കർത്താവിന്റെ മാമ്മോദീസാത്തിരുനാൾവരെ; ദൈവമാതാവായ മറിയത്തിന്റെ മഹോത്സവവും (ജനുവരി 1) പ്രത്യക്ഷീകരണത്തിരുനാളും അതിലുൾപ്പെടുന്നു."],
 ["Lent and Ash Wednesday","Forty days of prayer, fasting and almsgiving in preparation for Easter. Lent begins on Ash Wednesday, when ashes are placed on the forehead with the words “Repent, and believe in the Gospel”.",
  "നോമ്പുകാലവും വിഭൂതിബുധനും","ഉയിർപ്പുതിരുനാളിന് ഒരുക്കമായി പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും നാല്പതു ദിവസങ്ങൾ. “അനുതപിച്ചു സുവിശേഷത്തിൽ വിശ്വസിക്കുവിൻ” എന്ന വാക്കുകളോടെ നെറ്റിയിൽ ചാരം പൂശുന്ന വിഭൂതിബുധനാഴ്ച ഇത് ആരംഭിക്കുന്നു."],
 ["Easter season","The fifty days from Easter Sunday to Pentecost, kept as one great Sunday of joy. The paschal candle burns at the liturgy throughout.",
  "ഉയിർപ്പുകാലം","ഉയിർപ്പുഞായർമുതൽ പന്തക്കുസ്താവരെയുള്ള അമ്പതു ദിവസം; ആനന്ദത്തിന്റെ ഒരു വലിയ ഞായറായി ആചരിക്കുന്നു. ഈ കാലം മുഴുവൻ ആരാധനയിൽ ഉയിർപ്പുതിരി കത്തുന്നു."],
 ["Holy day of obligation","A day on which Catholics are bound to take part in Mass: every Sunday, and certain solemnities fixed by the bishops of each country.",
  "കടമുള്ള ദിവസം","കത്തോലിക്കർ ദിവ്യബലിയിൽ പങ്കെടുക്കാൻ കടപ്പെട്ടിരിക്കുന്ന ദിവസം: എല്ലാ ഞായറാഴ്ചകളും ഓരോ രാജ്യത്തെയും മെത്രാന്മാർ നിശ്ചയിക്കുന്ന ചില മഹോത്സവങ്ങളും."],
 ["Eucharistic fast","Out of reverence, those receiving Holy Communion abstain from food and drink for at least one hour beforehand; water and medicine do not break the fast.",
  "ദിവ്യകാരുണ്യ ഉപവാസം","ആദരവിന്റെ അടയാളമായി ദിവ്യകാരുണ്യം സ്വീകരിക്കുന്നവർ കുറഞ്ഞത് ഒരു മണിക്കൂർ മുമ്പുമുതൽ ഭക്ഷണപാനീയങ്ങൾ വർജിക്കുന്നു; വെള്ളവും മരുന്നും ഉപവാസം ലംഘിക്കുന്നില്ല."],
 ["Lector and acolyte","Lay ministries instituted by the bishop: the lector proclaims the readings other than the Gospel; the acolyte serves at the altar and may help give Holy Communion.",
  "വായനക്കാരനും അൾത്താരശുശ്രൂഷകനും","മെത്രാൻ സ്ഥാപിക്കുന്ന അൽമായശുശ്രൂഷകൾ: സുവിശേഷമൊഴികെയുള്ള വായനകൾ വായനക്കാരൻ പ്രഘോഷിക്കുന്നു; അൾത്താരശുശ്രൂഷകൻ ബലിപീഠത്തിൽ ശുശ്രൂഷിക്കുകയും ദിവ്യകാരുണ്യവിതരണത്തിൽ സഹായിക്കുകയും ചെയ്യാം."]

GLOSS.smc.ta=[["தூய குர்பானா","காணிக்கை எனப் பொருள்படும் சிரியச் சொல். கிழக்குத் திருஅவையிடமிருந்து பெற்ற கிழக்குச் சிரிய மரபைச் சேர்ந்த சீரோ-மலபார் திருஅவையின் நற்கருணை வழிபாடு."],["ராசா","மறைபொருள். பெரிய திருநாள்களில் கொண்டாடப்படும் தூய குர்பானாவின் மிகச் சிறப்பான வடிவம்."],["தக்சா","ஒழுங்கு. தூய குர்பானாவின் பாடம் அடங்கிய வழிபாட்டு நூல்."],["மத்பஹா","பீடம் இருக்கும் திருத்தூயகம். உயர்த்தப்பட்டுத் தனியாக அமைக்கப்பட்டது; விண்ணகத்தின் அடையாளம்."],["கெஸ்த்ரோமா","திருத்தூயகத்துக்கும் ஆலய மையப் பகுதிக்கும் இடைப்பட்ட இடம்; விண்ணுக்கும் மண்ணுக்கும் இடையிலான பேரின்ப வீட்டின் அடையாளம்."],["ஹைக்கலா","விசுவாசிகள் நிற்கும் ஆலய மையப் பகுதி; மண்ணின் அடையாளம், திருப்பயணம் செல்லும் இறைமக்களின் அடையாளம்."],["பேமா","பழைய கிழக்குச் சிரிய ஆலயத்தில் மையப் பகுதியின் நடுவில், இறைவார்த்தை அறிவிக்கப்பட்ட உயர்ந்த மேடை."],["மார் தோமா சிலுவை","கிறிஸ்துவின் உடல் இல்லாத, மேலே புறாவுடன், பெரும்பாலும் தாமரை மேல் நிற்கும் சிலுவை. உயிர்த்த கிறிஸ்துவையும் தூய ஆவியின் கொடையையும் அறிவிக்கிறது."],["மார் அத்தாய் மார் மாரியின் அனஃபோரா","எதேசாவின் திருத்தூதர்களுக்கு உரியதாகக் கருதப்படும், திருஅவையின் மிகப் பழமையான நற்கருணை மன்றாட்டுகளுள் ஒன்று; சீரோ-மலபார் குர்பானாவின் முதன்மை அனஃபோரா."],["லாகு மாரா","ஆண்டவரே, உமக்கு. தூய குர்பானாவின் தொடக்கத்தில் பாடப்படும் கிறிஸ்துவின் புகழ்ப்பாடல்."],["கரோசூத்தா","திருத்தொண்டர் அல்லது பணியாளர் அறிவிக்கும் மன்றாட்டு வரிசை; மக்கள் சிறு பதிலுரையால் பதில் தருகின்றனர்."],["ஓனீத்தா","வழிபாட்டுப் பாடல் அல்லது பல்லவி. காணிக்கைப் பவனியின்போது ஓனீத்தா த்ராசே பாடப்படுகிறது."],["துக்ரானா","நினைவு. ஒரு புனிதரின் திருநாள், பொதுவாக அவர் இறந்த நாள். புனித தோமாவின் துக்ரானா ஜூலை 3."],["ரம்சா, லெல்யா, சப்ரா","கிழக்குச் சிரிய மரபில் திருப்புகழ்மாலையின் மாலை, இரவு, காலைச் செபங்கள்."],["மூன்னு நோம்பு","பெரிய நோன்புக்கு முந்தைய மூன்றாம் வாரத்தின் திங்கள் முதல் புதன் வரை கடைப்பிடிக்கப்படும் நினிவே மக்களின் மூன்று நாள் நோன்பு (யோனா 3)."],["பெசஹா","பாஸ்கா. ஆண்டவர் தூய குர்பானாவை ஏற்படுத்திய பெரிய வியாழன். கேரள இல்லங்களில் பெசஹா அப்பமும் பாலும் ஆசீர்வதிக்கப்பட்டுப் பகிரப்படுகின்றன."]];
GLOSS.smc.hi=[["पवित्र कुर्बाना","भेंट अर्थवाला सीरियाई शब्द। पूर्व की कलीसिया से प्राप्त पूर्वी सीरियाई परंपरा की सीरो-मलबार कलीसिया की यूखरिस्तीय धर्मविधि।"],["राज़ा","रहस्य। पवित्र कुर्बाना का सबसे समारोही रूप, जो महान पर्वों पर मनाया जाता है।"],["तक्सा","क्रम। पवित्र कुर्बाना का पाठ रखनेवाली धर्मविधिक पुस्तक।"],["मद्बहा","पवित्र-स्थान, जहाँ वेदी है। यह ऊँचा और अलग रखा जाता है, स्वर्ग का चिह्न।"],["केस्त्रोमा","पवित्र-स्थान और मध्य-भाग के बीच का स्थान, स्वर्ग और पृथ्वी के बीच परादीस का चिह्न।"],["हैकला","मध्य-भाग, जहाँ विश्वासी खड़े होते हैं; पृथ्वी और तीर्थयात्री ईश-प्रजा का चिह्न।"],["बेमा","प्राचीन पूर्वी सीरियाई गिरजाघर में मध्य-भाग के बीच ऊँचा मंच, जहाँ से ईश-वचन घोषित होता था।"],["मार थोमा क्रूस","मसीह के शरीर के बिना क्रूस, ऊपर कपोत सहित, प्रायः कमल पर। यह पुनर्जीवित मसीह और पवित्र आत्मा के वरदान की घोषणा करता है।"],["मार अद्दाई और मार मारी का अनाफ़ोरा","कलीसिया की सबसे प्राचीन यूखरिस्तीय प्रार्थनाओं में से एक, एदेस्सा के प्रेरितों से जुड़ी; सीरो-मलबार कुर्बाना का मुख्य अनाफ़ोरा।"],["लाखु मारा","हे प्रभु, तुझको। पवित्र कुर्बाना के आरंभ में गाया जानेवाला मसीह का स्तुति-गीत।"],["करोज़ूथा","उपयाजक या सेवक द्वारा घोषित लिटनी, जिसका लोग छोटे उत्तर से जवाब देते हैं।"],["ओनीथा","धर्मविधि का गीत या अंतरा। भेंट-जुलूस के समय ओनीथा द्राज़े गाया जाता है।"],["दुक्राना","स्मरण। किसी संत का पर्व, प्रायः उनकी मृत्यु का दिन। संत थोमस का दुक्राना 3 जुलाई को है।"],["रम्शा, लेल्या, सप्रा","पूर्वी सीरियाई परंपरा में घंटों की प्रार्थना की संध्या, रात्रि और प्रातः प्रार्थनाएँ।"],["मून्नु नोम्बु","नीनवे के लोगों का तीन दिन का उपवास, महान उपवास से पहले तीसरे सप्ताह के सोमवार से बुधवार तक (योना 3)।"],["पेसहा","पास्का। पुण्य गुरुवार, जब प्रभु ने पवित्र कुर्बाना स्थापित की। केरल के घरों में पेसहा अप्पम और दूध आशीर्वादित कर बाँटे जाते हैं।"]];
GLOSS.smk.ta=[["தூய குர்பானா (குர்போனோ)","மேற்குச் சிரிய (அந்தியோக்கிய) மரபில் சீரோ-மலங்கரக் கத்தோலிக்கத் திருஅவையின் நற்கருணை வழிபாடு."],["புனித யாக்கோபின் அனஃபோரா","ஆண்டவரின் சகோதரரும் எருசலேமின் முதல் ஆயருமான புனித யாக்கோபுக்கு உரிய நற்கருணை மன்றாட்டு; மேற்குச் சிரிய அனஃபோராக்களின் தாய். மலங்கர வழிபாட்டுக்கு வேறு பல அனஃபோராக்களும் உண்டு."],["த்ரோனோஸ்","அரியணை. தூய மறைபொருள்கள் ஒப்புக்கொடுக்கப்படும் பீடம், கடவுளின் அரியணை."],["மத்பஹோ","வழிபாட்டின் முக்கியத் தருணங்களில் மூடித் திறக்கப்படும் திரையால் மையப் பகுதியிலிருந்து பிரிக்கப்பட்ட திருத்தூயகம்."],["ப்ரோமியோனும் செத்ரோவும்","குர்பானாவிலும் புகழ்மாலையிலும் தூபத்தோடு சொல்லப்படும் தொடக்கச் செபமும் (ப்ரோமியோன்) நீண்ட விளக்கச் செபமும் (செத்ரோ)."],["ஹூசோயோ","தம் மக்களின் செபங்களை ஏற்குமாறு கடவுளை வேண்டும், தூபத்தோடு கூடிய மன்னிப்பு, ஒப்புரவு வழிபாடு."],["கௌமா","தூயவராம் கடவுளே என்ற மூவுலகத் தூயர் புகழோடு தொடங்கி, கூரியலேசோனும் ஆண்டவர் கற்பித்த செபமும் தொடரும் செப அலகு."],["ஷெஹிமோ","சாதாரண வார நாள்களுக்கான அன்றாடச் செப நூல். ஞாயிறுகள், திருநாள்கள், காலங்களுக்கான நூல் பெங்கீத்தோ."],["கோலோ","குறிப்பிட்ட மெட்டில் பாடப்படும் பாடல். ஷெஹிமோ ஆண்டு முழுவதும் மாறும் கோலோக்களாக அமைந்துள்ளது."],["போவூத்தோ","புனித எஃப்ரேம், செரூகின் புனித யாக்கோபு, புனித பாலாய் ஆகியோருக்கு உரிய வேண்டுதல் பாடல்கள்; புகழ்மாலையில் பாடப்படுகின்றன."],["துப்தேன்","அனஃபோராவில் வாழ்வோர், புனிதர்கள், இறந்த விசுவாசிகள் ஆகியோரின் ஆடம்பர நினைவுகள்."],["கூதோஷ் ஈத்தோவும் ஹூதோஷ் ஈத்தோவும்","திருஅவையின் புனிதப்படுத்தலும் புதுப்பித்தலும்: திருவழிபாட்டு ஆண்டைத் தொடங்கும் இரு ஞாயிறுகள்."],["ஹாஷோ","பாடுகள். ஹாஷோ வாரம் என்பது ஓசன்னா ஞாயிறு முதல் உயிர்ப்பு வரையிலான புனித வாரம்."],["கியோம்த்தோ","ஆண்டவரின் உயிர்ப்பும், அதைத் தொடரும் ஐம்பது நாள் காலமும்."],["ஸ்லீபோ","சிலுவை. திருச்சிலுவைக் காலம் திருவழிபாட்டு ஆண்டை நிறைவுசெய்கிறது."],["1930 மறு ஒன்றிப்பு","1930 செப்டம்பர் 20 அன்று பேராயர் மார் இவானியோஸும் தோழர்களும் தங்கள் மேற்குச் சிரிய வழிபாட்டைக் காத்துக்கொண்டு கத்தோலிக்கத் திருஅவையோடு முழு ஒன்றிப்புக்குள் நுழைந்தனர். 2005 முதல் இத்திருஅவை மேஜர் பேராயர்-கத்தோலிக்கோஸ் தலைமையிலான மேஜர் பேராயர் திருஅவை."]];
GLOSS.smk.hi=[["पवित्र कुर्बाना (कुर्बोनो)","पश्चिमी सीरियाई (अंताकियाई) परंपरा में सीरो-मलंकरा काथलिक कलीसिया की यूखरिस्तीय धर्मविधि।"],["संत याकूब का अनाफ़ोरा","प्रभु के भाई और येरूसालेम के पहले धर्माध्यक्ष संत याकूब से जुड़ी यूखरिस्तीय प्रार्थना; पश्चिमी सीरियाई अनाफ़ोराओं की जननी। मलंकरा धर्मविधि में अन्य कई अनाफ़ोरा भी हैं।"],["थ्रोनोस","सिंहासन। वेदी, ईश्वर का सिंहासन, जिस पर पवित्र रहस्य अर्पित होते हैं।"],["मद्बहो","पवित्र-स्थान, जो एक पर्दे से मध्य-भाग से अलग है; धर्मविधि के महान क्षणों में पर्दा खोला-बंद किया जाता है।"],["प्रोमियोन और सेद्रो","कुर्बाना और घंटों की प्रार्थना में धूप के साथ बोली जानेवाली आरंभिक प्रार्थना (प्रोमियोन) और लंबी व्याख्यात्मक प्रार्थना (सेद्रो)।"],["हूसोयो","धूप के साथ क्षमा और मेल-मिलाप की उपासना, जिसमें ईश्वर से अपनी प्रजा की प्रार्थनाएँ स्वीकार करने की विनती होती है।"],["कौमा","प्रार्थना की एक इकाई, जो पवित्र है तू, हे ईश्वर, इस त्रिसंध्य स्तुति से आरंभ होकर कुरियेलायसोन और प्रभु की प्रार्थना तक जाती है।"],["शेहिमो","साधारण सप्ताह-दिनों की दैनिक प्रार्थना-पुस्तक। रविवारों, पर्वों और कालों की पुस्तक पेंकीथो है।"],["कोलो","निश्चित धुन पर गाया जानेवाला गीत। शेहिमो पूरे वर्ष बदलते कोलो में व्यवस्थित है।"],["बोवूथो","संत एफ़्रेम, सरूग के संत याकूब और संत बलाई से जुड़े निवेदन-गीत, जो घंटों की प्रार्थना में गाए जाते हैं।"],["थुब्देन","अनाफ़ोरा में जीवितों, संतों और दिवंगत विश्वासियों के समारोही स्मरण।"],["कूदोश ईत्तो और हूदोश ईत्तो","कलीसिया का पवित्रीकरण और नवीकरण: धर्मविधिक वर्ष आरंभ करनेवाले दो रविवार।"],["हाशो","दुखभोग। हाशो सप्ताह होसन्ना रविवार से पुनरुत्थान तक का पवित्र सप्ताह है।"],["क्यौम्थो","प्रभु का पुनरुत्थान, और उसके बाद का पचास दिनों का काल।"],["स्लीबो","क्रूस। पवित्र क्रूस का काल धर्मविधिक वर्ष को समाप्त करता है।"],["1930 का पुनर्मिलन","20 सितंबर 1930 को महाधर्माध्यक्ष मार इवानियोस और उनके साथी अपनी पश्चिमी सीरियाई धर्मविधि रखते हुए काथलिक कलीसिया के साथ पूर्ण सहभागिता में आए। 2005 से यह कलीसिया मेजर आर्चबिशप-काथोलिकोस के नेतृत्व में मेजर आर्चएपिस्कोपल कलीसिया है।"]];
GLOSS.lat.de=[["Heilige Messe","Die Feier der Eucharistie im Römischen Ritus, in zwei Hauptteilen: Wortgottesdienst und Eucharistiefeier."],["Lektionar und Lesejahre","Die Sonntagslesungen folgen einem Dreijahreszyklus (Lesejahre A, B und C, mit Matthäus, Markus und Lukas); die ersten Lesungen an Werktagen einem Zweijahreszyklus (I und II)."],["Antwortpsalm","Der nach der ersten Lesung gesungene oder gesprochene Psalm mit einem Kehrvers des Volkes. Er gehört zum Wort Gottes und ist kein zusätzliches Lied."],["Ruf vor dem Evangelium","Das Halleluja mit Vers, das das Evangelium begrüßt. In der Fastenzeit ersetzt ein anderer Ruf das Halleluja."],["Homilie","Die Auslegung der Lesungen und der Liturgie durch Bischof, Priester oder Diakon, die Gottes Wort auf das Leben anwendet."],["Fürbitten","Das Allgemeine Gebet der Gläubigen, in dem das Volk sein Taufpriestertum ausübt und für Kirche, Welt, Notleidende und die Gemeinde betet."],["Eucharistisches Hochgebet","Die Mitte der Messe: Präfation, Sanctus, Anrufung des Heiligen Geistes (Epiklese), Einsetzungsbericht und Wandlung, Gedächtnis, Interzessionen und Schlussdoxologie, beantwortet mit dem großen Amen."],["Liturgische Farben","Grün im Jahreskreis; Violett im Advent und in der Fastenzeit; Weiß (oder Gold) an Weihnachten, Ostern und an Festen des Herrn, Marias und der Heiligen, die nicht Märtyrer waren; Rot am Palmsonntag, Karfreitag, Pfingsten und an Festen der Apostel und Märtyrer; Rosa am Dritten Adventssonntag und am Vierten Fastensonntag."],["Hochfest, Fest, Gedenktag","Die drei Rangstufen der Feiern. Das Hochfest ist die höchste; ein Gedenktag kann geboten oder nicht geboten sein."],["Zeit im Jahreskreis","Die gezählten Wochen außerhalb der geprägten Zeiten, in denen die Kirche dem öffentlichen Leben und der Lehre Christi folgt."],["Österliches Triduum","Die drei heiligen Tage von der Abendmahlsmesse am Gründonnerstag bis zum Abend des Ostersonntags: der Höhepunkt des Kirchenjahres."],["Stundengebet","Das tägliche Gebet der Kirche, das die Stunden des Tages heiligt; Laudes (Morgenlob) und Vesper (Abendlob) sind seine beiden Angelpunkte."],["Ambo, Altar, Tabernakel","Der Ambo ist der Ort des Wortes; der Altar der Ort des Opfers und der Tisch des Herrn; der Tabernakel bewahrt das Allerheiligste für die Kranken und zur Anbetung."],["Adventskranz","Ein Kranz aus immergrünen Zweigen mit vier Kerzen, die an den Adventssonntagen nacheinander entzündet werden: das wachsende Licht vor Weihnachten."]];
GLOSS.lat.it=[["Santa Messa","La celebrazione dell'Eucaristia nel Rito Romano, in due parti principali: la Liturgia della Parola e la Liturgia eucaristica."],["Lezionario e cicli","Le letture domenicali seguono un ciclo triennale (Anni A, B e C, con Matteo, Marco e Luca); le prime letture feriali un ciclo biennale (I e II)."],["Salmo responsoriale","Il salmo cantato o recitato dopo la prima lettura, con un ritornello ripetuto dal popolo. Fa parte della Parola di Dio, non è un canto aggiunto."],["Acclamazione al Vangelo","L'Alleluia con il versetto che accoglie il Vangelo. In Quaresima un'altra acclamazione sostituisce l'Alleluia."],["Omelia","La spiegazione delle letture e della liturgia, tenuta da un vescovo, un sacerdote o un diacono, che applica la Parola di Dio alla vita."],["Preghiera universale","La preghiera dei fedeli, in cui il popolo esercita il sacerdozio battesimale pregando per la Chiesa, il mondo, chi è nel bisogno e la comunità locale."],["Preghiera eucaristica","Il centro della Messa: prefazio, Santo, invocazione dello Spirito Santo (epiclesi), racconto dell'istituzione e consacrazione, memoriale, intercessioni e dossologia finale, a cui risponde il grande Amen."],["Colori liturgici","Verde nel Tempo Ordinario; viola in Avvento e Quaresima; bianco (o oro) a Natale, a Pasqua e nelle feste del Signore, di Maria e dei santi non martiri; rosso la Domenica delle Palme, il Venerdì Santo, a Pentecoste e nelle feste degli apostoli e dei martiri; rosaceo nella III domenica di Avvento e nella IV di Quaresima."],["Solennità, festa, memoria","I tre gradi delle celebrazioni. La solennità è il più alto; la memoria può essere obbligatoria o facoltativa."],["Tempo Ordinario","Le settimane numerate al di fuori dei tempi forti, in cui la Chiesa segue la vita pubblica e l'insegnamento di Cristo."],["Triduo pasquale","I tre giorni santi dalla Messa vespertina nella Cena del Signore del Giovedì Santo alla sera della domenica di Pasqua: il culmine dell'anno liturgico."],["Liturgia delle Ore","La preghiera quotidiana della Chiesa che santifica le ore del giorno; le Lodi e i Vespri ne sono i due cardini."],["Ambone, altare, tabernacolo","L'ambone è il luogo della Parola; l'altare è il luogo del sacrificio e la mensa del Signore; il tabernacolo custodisce il Santissimo per i malati e per l'adorazione."],["Corona d'Avvento","Una corona di rami sempreverdi con quattro candele, accese una alla volta nelle domeniche di Avvento: la luce che cresce mentre si avvicina il Natale."]];

SXL.de.chr=["Weihnachtszeit","Von der Geburt des Herrn bis zur Taufe des Herrn: das fleischgewordene Wort, die Heilige Familie, die Gottesmutter Maria und die Erscheinung des Herrn. Farbe: Weiß."];
SXL.de.ot=["Zeit im Jahreskreis","Die gezählten Wochen, in denen die Kirche Sonntag für Sonntag dem öffentlichen Leben und der Lehre Christi folgt. Farbe: Grün, die Farbe des Wachstums."];
SXL.de.lent=["Fastenzeit","Vierzig Tage Gebet, Fasten und Almosen ab Aschermittwoch, die die Taufbewerber auf die Taufe und alle Gläubigen auf Ostern vorbereiten. Farbe: Violett."];
SXL.de.holy=["Karwoche","Vom Palmsonntag bis zum Österlichen Triduum: der Einzug des Herrn in Jerusalem, das Letzte Abendmahl, sein Leiden und Sterben und die Feier der Osternacht."];
SXL.de.east=["Osterzeit","Fünfzig Tage österlicher Freude, von der Auferstehung bis Pfingsten, gefeiert wie ein einziger großer Sonntag. Farbe: Weiß."];
SXL.it.adv=["Avvento","Quattro settimane di gioiosa attesa del Signore: della sua venuta alla fine dei tempi e della celebrazione della sua nascita a Natale. Colore: viola."];
SXL.it.chr=["Tempo di Natale","Dalla Natività al Battesimo del Signore: il Verbo fatto carne, la Santa Famiglia, Maria Madre di Dio e l'Epifania. Colore: bianco."];
SXL.it.ot=["Tempo Ordinario","Le settimane numerate in cui la Chiesa segue, domenica dopo domenica, la vita pubblica e l'insegnamento di Cristo. Colore: verde, il colore della crescita."];
SXL.it.lent=["Quaresima","Quaranta giorni di preghiera, digiuno ed elemosina dal Mercoledì delle Ceneri, che preparano i catecumeni al Battesimo e tutti i fedeli alla Pasqua. Colore: viola."];
SXL.it.holy=["Settimana Santa","Dalla Domenica delle Palme al Triduo pasquale: l'ingresso del Signore in Gerusalemme, l'Ultima Cena, la passione e morte, e la Veglia della risurrezione."];
SXL.it.east=["Tempo di Pasqua","Cinquanta giorni di gioia pasquale, dalla Risurrezione alla Pentecoste, celebrati come un'unica grande domenica. Colore: bianco."];
