put("2026-12-06","en",{title:"Sunday of the Birth of John the Baptist",readTitle:EN.rt,
 readings:[[EN.eg,"Luke 1:67–80","The song of Zechariah (Benedictus)"],[EN.ot,"Exodus 2:1–10","The birth of Moses"],[EN.ot,"1 Samuel 1:19–28","Hannah gives Samuel to the Lord"],[EN.ot,"Psalm 127:1–5","Children are a heritage from the Lord"],[EN.ot,"Isaiah 62:1–12","You shall be called by a new name"],[EN.ce,"1 John 4:1–6","Test the spirits"],[EN.pa,"Galatians 4:21–31","Children of the promise"],[EN.go,"Luke 1:57–66","His name is John"]],
 alt:"Fourth Sunday of Suboro. The Twenty-Five Days Nombu continues.",
 verse:"And you, child, will be called the prophet of the Most High; for you will go before the Lord to prepare his ways.",cite:"Luke 1:76",
 theo:["Elizabeth's time comes and she bears a son. The neighbours rejoice, because “the Lord had shown his great mercy to her”. The child whose birth seemed impossible is born, and his name is chosen not by custom but by God: “His name is John”, which means “God is gracious”.","For nine months Zechariah had been silent. When he writes “His name is John” on a tablet, obeying the angel's word, “immediately his mouth was opened and his tongue freed, and he began to speak, praising God.” Doubt had closed his mouth; obedience opens it. His first words are praise, the Benedictus that the Church still prays every morning: “Blessed be the Lord God of Israel, for he has looked favorably on his people and redeemed them.”","The Old Testament readings show God's way with children of promise. Moses was drawn out of the water to deliver his people. Hannah, who prayed for a son, gives him back: “For this child I prayed… therefore I have lent him to the LORD” (1 Samuel 1:27–28). The psalm says: “Sons are indeed a heritage from the LORD, the fruit of the womb a reward.” Every child is a gift and has a mission from God.","Zechariah's song ends looking towards Christ: “By the tender mercy of our God, the dawn from on high will break upon us, to give light to those who sit in darkness and in the shadow of death.” John is not the light; he prepares for the Dawn. The Church in this season is called to the same task: to point beyond herself to Christ who comes."],
 conn:[["Three children, one pattern.","Moses, Samuel and John: each born in a dark time, each given to God from the beginning, each preparing God's people for a new beginning."],["A name from God.","God changes or chooses names to show a mission: Abram becomes Abraham (Genesis 17:5), and Isaiah promises Jerusalem “a new name that the mouth of the LORD will give” (Isaiah 62:2)."],["The Benedictus and the Magnificat.","Mary sang after the Visitation, Zechariah after John's birth. Both songs bless God for remembering his covenant with Abraham."],["Children of the promise.","Paul contrasts the children of slavery and of promise (Galatians 4:28). John, born by God's promise, prepares for the One who makes us all children of the promise."]],
 altar:["Zechariah's tongue was loosed to bless God. At every Holy Qurbono our tongues too are freed for praise, and we receive the One whom John announced: “the dawn from on high” comes to us under the signs of bread and wine."],
 outline:[["Opening","Ask: what is the meaning of your name, and who chose it?"],["Point 1 · “His name is John”","God is gracious. A child's name is a vocation, not only a family tradition."],["Point 2 · Silence to praise","Zechariah's tongue is freed when he obeys. Our doubts close us; obedience opens us to praise."],["Point 3 · Every child is a gift","Moses, Samuel, John; Psalm 127. A word for parents and for the unborn."],["Point 4 · Preparing for the Dawn","The Benedictus: we, like John, point beyond ourselves to Christ."],["Take-home line","“God is gracious; I will prepare his way.”"]],
 live:[["Bless God each morning (Luke 1:68)","Pray the Benedictus, or at least its first verse, every morning this week."],["Pray for children (Psalm 127:3)","Bless each child in your home by name with the sign of the cross before they sleep."],["Prepare the way","Make a good Confession during this Nombu, so that Christ finds a straight path to your heart."]],
 fathers:[["St Augustine","John was the voice, Christ the Word. The voice passes, the Word remains; John speaks so that the Word may be heard (Sermon 293)."],["St Bede the Venerable","He explains that Zechariah's tongue was loosed when he confirmed the name given by God, and that the Church sings his canticle daily to praise God's mercy (Homilies on the Gospels II, 20)."]],
 magis:[["Catechism 717–720","John, filled with the Holy Spirit from his mother's womb, is “more than a prophet”; in him the Holy Spirit concludes the speaking through the prophets."],["Evangelium Vitae 45","John leaping in his mother's womb shows that human life is a gift from the very beginning, and that God's love reaches the child before birth."],["Catechism 2214–2216","The divine fatherhood is the source of human fatherhood; children are a gift, and parents are called to receive and form them."]],
 saints:[["This week (fixed dates)","6 Dec: St Nicholas. 7 Dec: St Ambrose. 8 Dec: the Immaculate Conception of the Blessed Virgin Mary. Confirm others in the 2026–27 lectionary."]],
 prayer:"Lord God, you gave Zechariah and Elizabeth a son and named him John, for you are gracious. Loose our tongues to bless you, bless the children you entrust to us, and prepare our hearts for the Dawn from on high, your Son Jesus Christ. Amen."},
 {quick:["“His name is John”: God is gracious.","Zechariah's silence ends in praise when he obeys.","Every child is a gift with a mission from God."],action:"Pray the first verse of the Benedictus every morning this week.",question:"What do I need to obey so that my tongue may be freed to praise?",
  special:"Fourth Sunday of Suboro: the Birth of John the Baptist. The Twenty-Five Days Nombu continues.",
  illus:["An illustration","In many Kerala families the grandfather or the parish priest chooses the child's baptismal name, often a saint's name. Zechariah reminds us that the deepest name comes from God, and carries a mission."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 1:57–64.",explain:"Baby John was born, and his father Zechariah, who could not speak for many months, wrote “His name is John”. Then he could speak again, and he praised God!",intention:"We thank God for every child in our family, and pray for each one by name.",ask:"Ask: “What does my name mean? Which saint am I named after?”"},
  catechism:[["CCC 523","John, the Lord's precursor."],["CCC 2156–2159","The Christian name given at Baptism."]],
  kidsaint:["St Nicholas (6 Dec)","A bishop in Myra (in today's Turkey) in the fourth century, loved for his secret kindness to the poor and to children. Lesson: give in secret, as St Nicholas did, and God sees."],
  term:["Benedictus (the Song of Zechariah)","Luke 1:68–79, named after its first word in Latin, “Blessed”. The Church prays it every morning in many traditions as a song of praise for the coming of Christ, “the dawn from on high”."],
  termMore:["Why John before Christmas?","The Syro-Malankara lectionary follows the order of Luke's Gospel through Suboro: the message to Zechariah, the Annunciation, the Visitation, the birth of John, the message to Joseph, and then the Nativity."]},
 {homily:["Dear brothers and sisters, today we celebrate a birthday: the birth of John the Baptist. The neighbours rejoiced with Elizabeth, because God had shown her great mercy. And then came a small argument about the name. The relatives said, “Call him Zechariah, after his father.” Elizabeth said, “No; he is to be called John.”","Zechariah, still unable to speak, asked for a tablet and wrote: “His name is John.” And immediately his mouth was opened, his tongue was freed, and he began to praise God. For nine months his doubt had kept him silent. When he obeyed the word of God, he could speak again, and his first words were praise.","Our readings speak of other children of promise: Moses drawn out of the water, Samuel whom Hannah gave back to the Lord. The psalm says, “Children are a heritage from the Lord.” Dear parents, your children are not your possession; they are God's gift, and each one has a mission. Bless them, pray for them by name, and help them discover what God wants of them.","John's father sang of the coming of “the dawn from on high” to give light to those who sit in darkness. That is what we wait for in this Nombu. Like John, let us prepare the way: with a good Confession, with prayer, with kindness. And let our tongues, like Zechariah's, be freed to bless the Lord. Amen."],
  kids:["Children, do you know what your name means? John's name means “God is kind”. His father Zechariah could not talk for many months.","When baby John was born, Zechariah wrote on a board: “His name is John.” And suddenly he could talk again! The first thing he did was to praise God.","Tonight, ask your parents why they chose your name. And let's say together: “Thank you, God, for my name!”"]});

put("2026-12-06","ml",{title:"സ്നാപകയോഹന്നാന്റെ ജനനത്തിന്റെ ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 1:67–80","സഖറിയായുടെ കീർത്തനം"],[ML.ot,"പുറപ്പാട് 2:1–10","മോശയുടെ ജനനം"],[ML.ot,"1 സാമുവൽ 1:19–28","ഹന്നാ സാമുവലിനെ കർത്താവിനു സമർപ്പിക്കുന്നു"],[ML.ot,"സങ്കീർത്തനം 127:1–5","മക്കൾ കർത്താവിന്റെ ദാനം"],[ML.ot,"ഏശയ്യാ 62:1–12","നീ പുതിയ പേരിൽ വിളിക്കപ്പെടും"],[ML.ce,"1 യോഹന്നാൻ 4:1–6","ആത്മാക്കളെ പരിശോധിക്കുവിൻ"],[ML.pa,"ഗലാത്തിയാ 4:21–31","വാഗ്ദാനത്തിന്റെ മക്കൾ"],[ML.go,"ലൂക്കാ 1:57–66","യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്"]],
 alt:"സൂബോറോയിലെ നാലാം ഞായർ. ഇരുപത്തഞ്ചു നോമ്പ് തുടരുന്നു.",
 verse:"നീയോ, കുഞ്ഞേ, അത്യുന്നതന്റെ പ്രവാചകൻ എന്നു വിളിക്കപ്പെടും. കർത്താവിനു വഴിയൊരുക്കാൻ അവിടുത്തെ മുമ്പേ നീ പോകും.",cite:"ലൂക്കാ 1:76",
 theo:["“എലിസബത്തിനു പ്രസവസമയമായി; അവൾ ഒരു പുത്രനെ പ്രസവിച്ചു.” കർത്താവ് അവളോടു വലിയ കരുണ കാണിച്ചതുകൊണ്ട് അയൽക്കാർ സന്തോഷിക്കുന്നു. ജനനം അസാധ്യമെന്നു തോന്നിയ ശിശു ജനിക്കുന്നു; അവന്റെ പേര് ആചാരപ്രകാരമല്ല, ദൈവമാണു തിരഞ്ഞെടുക്കുന്നത്: “ദൈവം കൃപയുള്ളവൻ” എന്നർഥമുള്ള യോഹന്നാൻ.","ഒമ്പതു മാസം സഖറിയാ മൂകനായിരുന്നു. ദൂതന്റെ വാക്ക് അനുസരിച്ച് അവൻ ഒരു എഴുത്തുപലകയിൽ “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്” എന്ന് എഴുതിയപ്പോൾ, “തത്ക്ഷണം അവന്റെ വായ് തുറക്കപ്പെട്ടു. നാവ് സ്വതന്ത്രമായി. അവൻ ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ട് സംസാരിക്കാൻ തുടങ്ങി.” സംശയം അവന്റെ വായ് അടച്ചു; അനുസരണം അതു തുറക്കുന്നു. അവന്റെ ആദ്യവാക്കുകൾ സ്തുതിയാണ്; സഭ ഇന്നും എല്ലാ പ്രഭാതത്തിലും പ്രാർഥിക്കുന്ന കീർത്തനം: “ഇസ്രായേലിന്റെ ദൈവമായ കർത്താവ് വാഴ്ത്തപ്പെട്ടവൻ. അവിടുന്ന് തന്റെ ജനത്തെ സന്ദർശിച്ചു രക്ഷിച്ചു.”","വാഗ്ദാനത്തിന്റെ മക്കളോടുള്ള ദൈവത്തിന്റെ വഴി പഴയനിയമവായനകൾ കാണിക്കുന്നു. തന്റെ ജനത്തെ മോചിപ്പിക്കാൻ മോശ വെള്ളത്തിൽനിന്ന് എടുക്കപ്പെട്ടു. ഒരു പുത്രനുവേണ്ടി പ്രാർഥിച്ച ഹന്നാ അവനെ തിരികെ നൽകുന്നു: “ഈ കുഞ്ഞിനു വേണ്ടിയാണു ഞാൻ പ്രാർഥിച്ചത്; എന്റെ പ്രാർഥന കർത്താവ് കേട്ടു. ആകയാൽ, ഞാൻ അവനെ കർത്താവിനു സമർപ്പിച്ചിരിക്കുന്നു” (1 സാമു 1:27–28). സങ്കീർത്തനം പറയുന്നു: “കർത്താവിന്റെ ദാനമാണ് മക്കൾ, ഉദരഫലം ഒരു സമ്മാനവും.” ഓരോ കുഞ്ഞും ഒരു ദാനമാണ്; ഓരോരുത്തർക്കും ദൈവത്തിൽനിന്ന് ഒരു ദൗത്യമുണ്ട്.","സഖറിയായുടെ ഗീതം ക്രിസ്തുവിലേക്കു നോക്കിക്കൊണ്ട് അവസാനിക്കുന്നു: “നമ്മുടെ ദൈവത്തിന്റെ കാരുണ്യാതിരേകംകൊണ്ട് ഉയരത്തിൽ നിന്നുള്ള ഉദയരശ്മി നമ്മെ സന്ദർശിക്കുമ്പോൾ ഇരുളിലും, മരണത്തിന്റെ നിഴലിലും ഇരിക്കുന്നവർക്കു പ്രകാശം വീശാനും…” യോഹന്നാൻ പ്രകാശമല്ല; ഉദയത്തിനായി ഒരുക്കുന്നവനാണ്. ഈ കാലത്തു സഭയും അതേ ദൗത്യത്തിലേക്കാണു വിളിക്കപ്പെടുന്നത്: തന്നെക്കാൾ അപ്പുറം, വരുന്ന ക്രിസ്തുവിലേക്കു ചൂണ്ടിക്കാണിക്കുക."],
 conn:[["മൂന്നു ശിശുക്കൾ, ഒരേ മാതൃക.","മോശ, സാമുവൽ, യോഹന്നാൻ: ഓരോരുത്തരും ഇരുണ്ട ഒരു കാലത്തു ജനിച്ചു; ആരംഭംമുതൽ ദൈവത്തിനു നൽകപ്പെട്ടു; ദൈവജനത്തെ ഒരു പുതിയ ആരംഭത്തിനായി ഒരുക്കി."],["ദൈവത്തിൽനിന്നുള്ള ഒരു പേര്.","ദൗത്യം കാണിക്കാൻ ദൈവം പേരുകൾ മാറ്റുകയോ തിരഞ്ഞെടുക്കുകയോ ചെയ്യുന്നു: അബ്രാം അബ്രാഹമാകുന്നു (ഉൽപ 17:5); “കർത്താവ് നൽകുന്ന പുതിയ പേര്” ഏശയ്യാ ജറുസലെമിനു വാഗ്ദാനം ചെയ്യുന്നു (ഏശ 62:2)."],["സഖറിയായുടെ കീർത്തനവും മറിയത്തിന്റെ സ്തോത്രഗീതവും.","സന്ദർശനത്തിനുശേഷം മറിയവും യോഹന്നാന്റെ ജനനത്തിനുശേഷം സഖറിയായും പാടി. അബ്രാഹത്തോടുള്ള ഉടമ്പടി ഓർത്തതിനു രണ്ടു ഗീതങ്ങളും ദൈവത്തെ വാഴ്ത്തുന്നു."],["വാഗ്ദാനത്തിന്റെ മക്കൾ.","അടിമത്തത്തിന്റെ മക്കളെയും വാഗ്ദാനത്തിന്റെ മക്കളെയും പൗലോസ് താരതമ്യം ചെയ്യുന്നു (ഗലാ 4:28). ദൈവവാഗ്ദാനത്താൽ ജനിച്ച യോഹന്നാൻ, നമ്മെയെല്ലാം വാഗ്ദാനത്തിന്റെ മക്കളാക്കുന്നവനുവേണ്ടി ഒരുക്കുന്നു."]],
 altar:["ദൈവത്തെ വാഴ്ത്താൻ സഖറിയായുടെ നാവു സ്വതന്ത്രമായി. ഓരോ വിശുദ്ധ കുർബാനയിലും സ്തുതിക്കായി നമ്മുടെ നാവുകളും സ്വതന്ത്രമാകുന്നു; യോഹന്നാൻ അറിയിച്ചവനെ നാം സ്വീകരിക്കുന്നു: “ഉയരത്തിൽനിന്നുള്ള ഉദയരശ്മി” അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയും അടയാളങ്ങളിൽ നമ്മിലേക്കു വരുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: നിങ്ങളുടെ പേരിന്റെ അർഥമെന്താണ്? ആരാണ് അതു തിരഞ്ഞെടുത്തത്?"],["ഒന്നാം ആശയം · “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്”","ദൈവം കൃപയുള്ളവൻ. ഒരു കുഞ്ഞിന്റെ പേര് കുടുംബപാരമ്പര്യം മാത്രമല്ല, ഒരു ദൈവവിളിയാണ്."],["രണ്ടാം ആശയം · മൗനത്തിൽനിന്നു സ്തുതിയിലേക്ക്","അനുസരിക്കുമ്പോൾ സഖറിയായുടെ നാവു സ്വതന്ത്രമാകുന്നു. നമ്മുടെ സംശയങ്ങൾ നമ്മെ അടയ്ക്കുന്നു; അനുസരണം സ്തുതിക്കായി നമ്മെ തുറക്കുന്നു."],["മൂന്നാം ആശയം · ഓരോ കുഞ്ഞും ഒരു ദാനം","മോശ, സാമുവൽ, യോഹന്നാൻ; സങ്കീർത്തനം 127. മാതാപിതാക്കൾക്കും ജനിക്കാത്ത ശിശുക്കൾക്കുംവേണ്ടി ഒരു വാക്ക്."],["നാലാം ആശയം · ഉദയത്തിനായി ഒരുങ്ങുക","സഖറിയായുടെ കീർത്തനം: യോഹന്നാനെപ്പോലെ നാമും നമ്മെക്കാൾ അപ്പുറം ക്രിസ്തുവിലേക്കു ചൂണ്ടിക്കാണിക്കുന്നു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ദൈവം കൃപയുള്ളവനാണ്; ഞാൻ അവിടുത്തേക്കു വഴിയൊരുക്കും.”"]],
 live:[["എല്ലാ പ്രഭാതത്തിലും ദൈവത്തെ വാഴ്ത്തുക (ലൂക്കാ 1:68)","ഈ ആഴ്ച എല്ലാ പ്രഭാതത്തിലും സഖറിയായുടെ കീർത്തനം, അല്ലെങ്കിൽ അതിന്റെ ആദ്യവാക്യമെങ്കിലും, പ്രാർഥിക്കുക."],["മക്കൾക്കുവേണ്ടി പ്രാർഥിക്കുക (സങ്കീ 127:3)","വീട്ടിലെ ഓരോ കുഞ്ഞിനെയും ഉറങ്ങുംമുമ്പു പേരുചൊല്ലി കുരിശുവരച്ച് ആശീർവദിക്കുക."],["വഴിയൊരുക്കുക","ഈ നോമ്പിൽ നല്ല ഒരു കുമ്പസാരം നടത്തുക; ക്രിസ്തുവിനു നിന്റെ ഹൃദയത്തിലേക്കു നേരായ ഒരു വഴി ഒരുങ്ങട്ടെ."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","യോഹന്നാൻ സ്വരമായിരുന്നു, ക്രിസ്തു വചനവും. സ്വരം കടന്നുപോകുന്നു, വചനം നിലനിൽക്കുന്നു; വചനം കേൾക്കപ്പെടാൻവേണ്ടിയാണു യോഹന്നാൻ സംസാരിക്കുന്നത് (പ്രസംഗം 293)."],["വന്ദ്യനായ വിശുദ്ധ ബീഡ്","ദൈവം നൽകിയ പേര് ഉറപ്പിച്ചപ്പോഴാണു സഖറിയായുടെ നാവു സ്വതന്ത്രമായതെന്നും, ദൈവകരുണയെ സ്തുതിക്കാൻ സഭ അനുദിനം അദ്ദേഹത്തിന്റെ കീർത്തനം പാടുന്നുവെന്നും അദ്ദേഹം വിശദീകരിക്കുന്നു (സുവിശേഷപ്രസംഗങ്ങൾ II, 20)."]],
 magis:[["മതബോധനഗ്രന്ഥം 717–720","അമ്മയുടെ ഉദരത്തിൽവച്ചുതന്നെ പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ യോഹന്നാൻ “പ്രവാചകനിലും വലിയവനാണ്”; പ്രവാചകന്മാരിലൂടെയുള്ള സംസാരം പരിശുദ്ധാത്മാവ് അവനിൽ പൂർത്തിയാക്കുന്നു."],["ജീവന്റെ സുവിശേഷം (എവാഞ്ചേലിയും വീത്തേ) 45","അമ്മയുടെ ഉദരത്തിൽ യോഹന്നാൻ കുതിച്ചുചാടുന്നതു മനുഷ്യജീവൻ ആരംഭംമുതൽ ഒരു ദാനമാണെന്നും, ജനനത്തിനു മുമ്പേ ദൈവസ്നേഹം ശിശുവിനെ സ്പർശിക്കുന്നുവെന്നും കാണിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 2214–2216","ദൈവികപിതൃത്വമാണു മാനുഷികപിതൃത്വത്തിന്റെ ഉറവിടം; മക്കൾ ഒരു ദാനമാണ്; അവരെ സ്വീകരിക്കാനും രൂപപ്പെടുത്താനും മാതാപിതാക്കൾ വിളിക്കപ്പെട്ടിരിക്കുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഡിസംബർ 6: വിശുദ്ധ നിക്കോളാസ്. ഡിസംബർ 7: വിശുദ്ധ അംബ്രോസ്. ഡിസംബർ 8: വാഴ്ത്തപ്പെട്ട കന്യകാമറിയത്തിന്റെ അമലോദ്ഭവം. മറ്റുള്ളവ 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ ദൈവമേ, സഖറിയായ്ക്കും എലിസബത്തിനും അങ്ങ് ഒരു പുത്രനെ നൽകി; അങ്ങു കൃപയുള്ളവനാകയാൽ അവന് യോഹന്നാൻ എന്നു പേരിട്ടു. അങ്ങയെ വാഴ്ത്താൻ ഞങ്ങളുടെ നാവുകളെ സ്വതന്ത്രമാക്കണമേ; അങ്ങു ഞങ്ങളെ ഭരമേൽപിക്കുന്ന മക്കളെ അനുഗ്രഹിക്കണമേ; ഉയരത്തിൽനിന്നുള്ള ഉദയരശ്മിയായ അങ്ങയുടെ പുത്രൻ യേശുമിശിഹായ്ക്കായി ഞങ്ങളുടെ ഹൃദയങ്ങളെ ഒരുക്കണമേ. ആമേൻ."},
 {quick:["“യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്”: ദൈവം കൃപയുള്ളവൻ.","അനുസരിക്കുമ്പോൾ സഖറിയായുടെ മൗനം സ്തുതിയിൽ അവസാനിക്കുന്നു.","ഓരോ കുഞ്ഞും ദൈവത്തിൽനിന്നുള്ള ദൗത്യമുള്ള ഒരു ദാനമാണ്."],action:"ഈ ആഴ്ച എല്ലാ പ്രഭാതത്തിലും സഖറിയായുടെ കീർത്തനത്തിന്റെ ആദ്യവാക്യം പ്രാർഥിക്കുക.",question:"സ്തുതിക്കായി എന്റെ നാവു സ്വതന്ത്രമാകാൻ ഞാൻ എന്താണ് അനുസരിക്കേണ്ടത്?",
  special:"സൂബോറോയിലെ നാലാം ഞായർ: സ്നാപകയോഹന്നാന്റെ ജനനം. ഇരുപത്തഞ്ചു നോമ്പ് തുടരുന്നു.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പല കുടുംബങ്ങളിലും വല്യപ്പച്ചനോ ഇടവകവികാരിയോ ആണു കുഞ്ഞിന്റെ മാമ്മോദീസാപ്പേരു തിരഞ്ഞെടുക്കുന്നത്; പലപ്പോഴും ഒരു വിശുദ്ധന്റെ പേര്. ഏറ്റവും ആഴമുള്ള പേരു ദൈവത്തിൽനിന്നു വരുന്നുവെന്നും അത് ഒരു ദൗത്യം വഹിക്കുന്നുവെന്നും സഖറിയാ നമ്മെ ഓർമിപ്പിക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 1:57–64.",explain:"കുഞ്ഞായ യോഹന്നാൻ ജനിച്ചു; മാസങ്ങളോളം സംസാരിക്കാൻ കഴിയാതിരുന്ന അവന്റെ അപ്പൻ സഖറിയാ “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്” എന്ന് എഴുതി. അപ്പോൾ അവനു വീണ്ടും സംസാരിക്കാനായി; അവൻ ദൈവത്തെ സ്തുതിച്ചു!",intention:"നമ്മുടെ കുടുംബത്തിലെ ഓരോ കുഞ്ഞിനുംവേണ്ടി ദൈവത്തിനു നന്ദി പറഞ്ഞ്, ഓരോരുത്തർക്കുംവേണ്ടി പേരുചൊല്ലി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “എന്റെ പേരിന്റെ അർഥമെന്താണ്? ഏതു വിശുദ്ധന്റെ പേരാണ് എനിക്കുള്ളത്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 523","കർത്താവിന്റെ മുന്നോടിയായ യോഹന്നാൻ."],["മതബോധനഗ്രന്ഥം 2156–2159","മാമ്മോദീസയിൽ നൽകുന്ന ക്രൈസ്തവനാമം."]],
  kidsaint:["വിശുദ്ധ നിക്കോളാസ് (ഡിസംബർ 6)","നാലാം നൂറ്റാണ്ടിൽ മീറായിലെ (ഇന്നത്തെ തുർക്കിയിൽ) മെത്രാൻ; ദരിദ്രരോടും കുഞ്ഞുങ്ങളോടുമുള്ള രഹസ്യമായ ദയയാൽ സ്നേഹിക്കപ്പെട്ടവൻ. പാഠം: വിശുദ്ധ നിക്കോളാസിനെപ്പോലെ രഹസ്യമായി കൊടുക്കുക; ദൈവം കാണുന്നു."],
  term:["സഖറിയായുടെ കീർത്തനം (ബെനഡിക്തുസ്)","ലൂക്കാ 1:68–79; “വാഴ്ത്തപ്പെട്ടവൻ” എന്ന ലത്തീൻ ആദ്യവാക്കിൽനിന്നാണ് ഈ പേര്. “ഉയരത്തിൽനിന്നുള്ള ഉദയരശ്മി”യായ ക്രിസ്തുവിന്റെ വരവിനുള്ള സ്തുതിഗീതമായി പല പാരമ്പര്യങ്ങളിലും സഭ ഇത് എല്ലാ പ്രഭാതത്തിലും പ്രാർഥിക്കുന്നു."],
  termMore:["ക്രിസ്മസിനു മുമ്പ് എന്തുകൊണ്ടു യോഹന്നാൻ?","സീറോ മലങ്കര വായനാപുസ്തകം സൂബോറോയിലൂടെ ലൂക്കായുടെ സുവിശേഷക്രമം പിന്തുടരുന്നു: സഖറിയായ്ക്കുള്ള സന്ദേശം, മംഗളവാർത്ത, സന്ദർശനം, യോഹന്നാന്റെ ജനനം, ജോസഫിനുള്ള സന്ദേശം, പിന്നെ തിരുപ്പിറവി."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു നാം ഒരു ജന്മദിനം ആഘോഷിക്കുന്നു: സ്നാപകയോഹന്നാന്റെ ജനനം. കർത്താവ് എലിസബത്തിനോടു വലിയ കരുണ കാണിച്ചതുകൊണ്ട് അയൽക്കാർ അവളോടൊപ്പം സന്തോഷിച്ചു. പിന്നെ പേരിനെച്ചൊല്ലി ഒരു ചെറിയ തർക്കമുണ്ടായി. ബന്ധുക്കൾ പറഞ്ഞു: “അപ്പന്റെ പേരായ സഖറിയാ എന്നു വിളിക്കാം.” എലിസബത്ത് പറഞ്ഞു: “അങ്ങനെയല്ല, അവൻ യോഹന്നാൻ എന്നു വിളിക്കപ്പെടണം.”","അപ്പോഴും സംസാരിക്കാൻ കഴിയാതിരുന്ന സഖറിയാ ഒരു എഴുത്തുപലക വരുത്തി എഴുതി: “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്.” തത്ക്ഷണം അവന്റെ വായ് തുറക്കപ്പെട്ടു; നാവു സ്വതന്ത്രമായി; അവൻ ദൈവത്തെ വാഴ്ത്താൻ തുടങ്ങി. ഒമ്പതു മാസം അവന്റെ സംശയം അവനെ മൗനിയാക്കി. ദൈവവചനം അനുസരിച്ചപ്പോൾ അവനു വീണ്ടും സംസാരിക്കാനായി; അവന്റെ ആദ്യവാക്കുകൾ സ്തുതിയായിരുന്നു.","വാഗ്ദാനത്തിന്റെ മറ്റു മക്കളെപ്പറ്റിയും നമ്മുടെ വായനകൾ പറയുന്നു: വെള്ളത്തിൽനിന്ന് എടുക്കപ്പെട്ട മോശ, ഹന്നാ കർത്താവിനു തിരികെ നൽകിയ സാമുവൽ. സങ്കീർത്തനം പറയുന്നു: “കർത്താവിന്റെ ദാനമാണ് മക്കൾ.” പ്രിയ മാതാപിതാക്കളേ, നിങ്ങളുടെ മക്കൾ നിങ്ങളുടെ സ്വത്തല്ല; ദൈവത്തിന്റെ ദാനമാണ്; ഓരോരുത്തർക്കും ഒരു ദൗത്യമുണ്ട്. അവരെ ആശീർവദിക്കുക, പേരുചൊല്ലി അവർക്കുവേണ്ടി പ്രാർഥിക്കുക, ദൈവം അവരിൽനിന്ന് എന്താഗ്രഹിക്കുന്നുവെന്നു കണ്ടെത്താൻ അവരെ സഹായിക്കുക.","ഇരുളിൽ ഇരിക്കുന്നവർക്കു പ്രകാശം വീശാൻ “ഉയരത്തിൽനിന്നുള്ള ഉദയരശ്മി” വരുന്നതിനെപ്പറ്റി യോഹന്നാന്റെ അപ്പൻ പാടി. ഈ നോമ്പിൽ നാം കാത്തിരിക്കുന്നത് അതിനായാണ്. യോഹന്നാനെപ്പോലെ നമുക്കു വഴിയൊരുക്കാം: നല്ല ഒരു കുമ്പസാരത്താൽ, പ്രാർഥനയാൽ, ദയയാൽ. സഖറിയായുടേതുപോലെ കർത്താവിനെ വാഴ്ത്താൻ നമ്മുടെ നാവുകളും സ്വതന്ത്രമാകട്ടെ. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങളുടെ പേരിന്റെ അർഥം അറിയാമോ? യോഹന്നാൻ എന്ന പേരിന്റെ അർഥം “ദൈവം ദയയുള്ളവൻ” എന്നാണ്. അവന്റെ അപ്പൻ സഖറിയായ്ക്കു മാസങ്ങളോളം സംസാരിക്കാനായില്ല.","കുഞ്ഞായ യോഹന്നാൻ ജനിച്ചപ്പോൾ സഖറിയാ ഒരു പലകയിൽ എഴുതി: “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്.” പെട്ടെന്ന് അവനു വീണ്ടും സംസാരിക്കാനായി! അവൻ ആദ്യം ചെയ്തതു ദൈവത്തെ സ്തുതിക്കുകയാണ്.","ഇന്നു രാത്രി, എന്തുകൊണ്ടാണ് ഈ പേരു തിരഞ്ഞെടുത്തതെന്ന് അപ്പനോടും അമ്മയോടും ചോദിക്കുക. നമുക്ക് ഒന്നിച്ചു പറയാം: “ദൈവമേ, എന്റെ പേരിനു നന്ദി!”"]});

/* ================= APPARITION OF THE ANGEL TO ST JOSEPH · 13 December 2026 ================= */
put("2026-12-13","en",{title:"Sunday of the Apparition of the Angel to St Joseph",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 1:18–25","The angel appears to Joseph"],[EN.ot,"Genesis 37:5–11","The dreams of Joseph, son of Jacob"],[EN.ot,"Sirach 7:11–17","Humility and fidelity"],[EN.ot,"1 Samuel 3:10–18","“Speak, for your servant is listening”"],[EN.ot,"Isaiah 45:20–25","Turn to me and be saved"],[EN.ce,"1 Peter 2:11–17","Live honourably among the nations"],[EN.pa,"Galatians 1:11–24","Called through his grace"],[EN.go,"Matthew 1:18–25","Joseph takes Mary as his wife"]],
 alt:"Fifth Sunday of Suboro.",
 verse:"Joseph, son of David, do not be afraid to take Mary as your wife, for the child conceived in her is from the Holy Spirit.",cite:"Matthew 1:20",
 theo:["Luke told us the story through Mary; Matthew tells it through Joseph. Joseph discovers that Mary, his betrothed, is with child, and he does not yet know how. St Matthew describes him in one word: he was “a righteous man”. His righteousness is shown in mercy: “unwilling to expose her to public disgrace, he planned to dismiss her quietly.”","Then God speaks to him in a dream: “Joseph, son of David, do not be afraid to take Mary as your wife, for the child conceived in her is from the Holy Spirit. She will bear a son, and you are to name him Jesus, for he will save his people from their sins.” Joseph is given two tasks: to receive Mary and to name the child. By naming him, Joseph gives Jesus his legal place in the house of David.","Joseph never speaks a word in the Gospels. But he acts: “When Joseph awoke from sleep, he did as the angel of the Lord commanded him; he took her as his wife.” His obedience is immediate and complete. Like the young Samuel he says, in deeds if not in words, “Speak, for your servant is listening.” The patriarch Joseph, the dreamer of Genesis, saved his family by going down to Egypt; this Joseph will save the Holy Family by taking them to Egypt.","Matthew adds: “All this took place to fulfill what had been spoken by the Lord through the prophet: ‘Look, the virgin shall conceive and bear a son, and they shall name him Emmanuel,’ which means, ‘God is with us.’” Through Joseph's quiet faith, God-with-us receives a home, a family name and a father's protection."],
 conn:[["Two Josephs, two dreamers.","Joseph son of Jacob dreamed and was sent ahead to Egypt to save his family (Genesis 37; 45:5). Joseph of Nazareth dreams and takes the Child to Egypt to save him (Matthew 2:13–15)."],["Samuel's listening heart.","“Speak, for your servant is listening” (1 Samuel 3:10) describes Joseph exactly: he listens and obeys."],["Son of David.","The angel calls Joseph “son of David”. Through Joseph's legal fatherhood, Jesus is heir to the promise made to David (2 Samuel 7:12–16)."],["Called before birth.","Paul says God “set me apart before I was born and called me through his grace” (Galatians 1:15). Joseph too was chosen in God's plan for a hidden but essential mission."]],
 altar:["Joseph received Mary and the Child into his home without fully understanding. At the Holy Qurbono we receive Christ under the humble signs of bread and wine, with the same faith that does not need to see everything in order to trust."],
 outline:[["Opening","Ask: how do we react when life does not go according to our plan?"],["Point 1 · A righteous man is merciful","Joseph's righteousness is not harshness but mercy (Matthew 1:19). A word on gossip and protecting others' dignity."],["Point 2 · God speaks in the night","Joseph listens in the dream. Do we give God room to speak: silence, prayer, Scripture?"],["Point 3 · Immediate obedience","“He did as the angel commanded.” Faith without delay."],["Point 4 · Fathers today","Joseph gives a name, a home and protection. A word to fathers and to all who care for others' children."],["Take-home line","“Speak, Lord; your servant is listening.”"]],
 live:[["Protect someone's dignity (Matthew 1:19)","Refuse to pass on one piece of gossip this week; speak well of the person instead."],["Listen before sleeping (1 Samuel 3:10)","End each day with five minutes of silence, saying: “Speak, Lord, your servant is listening.”"],["Honour fathers","Pray for the fathers of your family and parish; fathers, bless your children before Christmas."]],
 fathers:[["St John Chrysostom","Joseph's righteousness, he says, is shown in his gentleness: he wished to spare Mary even the least shame, a sign of true virtue (Homilies on Matthew 4)."],["St Bernard of Clairvaux","He compares the two Josephs: the first kept bread for Egypt; the second guarded the Living Bread from heaven for the whole world (Homilies in Praise of the Virgin Mother 2, 16)."]],
 magis:[["Redemptoris Custos 3–4","St John Paul II: Joseph's “obedience of faith” parallels Mary's; by taking Mary as his wife he took part in the mystery of the Incarnation."],["Patris Corde (2020)","Pope Francis describes Joseph as a beloved, tender, obedient, accepting, creatively courageous and working father, “in the shadow”."],["Catechism 437, 497","The angel announced to Joseph the Child conceived by the Holy Spirit; Jesus is the Christ, son of David."]],
 saints:[["This week (fixed dates)","13 Dec: St Lucy. 14 Dec: St John of the Cross. 18 Dec: the Miraculous Cross of Mylapore (as in the 2025–26 lectionary). Confirm in the 2026–27 lectionary."]],
 prayer:"Lord God, you entrusted your Son and the Virgin Mary to the faithful care of Joseph, the righteous man. Give us his listening heart, his merciful justice and his prompt obedience, and bless all fathers with his tender strength. Amen."},
 {quick:["Joseph the righteous man is merciful.","God speaks to Joseph in a dream; he listens.","Joseph obeys at once and gives Jesus a home and a name."],action:"Refuse one piece of gossip this week and speak well of that person.",question:"Do I give God enough silence to speak to me?",
  special:"Fifth Sunday of Suboro: the Apparition of the Angel to St Joseph.",
  illus:["An illustration","A father in the Gulf works twelve hours a day and calls home every night to pray with his children over the phone. No one writes about him, but his family stands because of him. That is Joseph's way."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 1:20–24.",explain:"An angel told Joseph in a dream to take care of Mary and her baby. Joseph woke up and did what God said straight away. He became the father who took care of Jesus.",intention:"We pray for our father and grandfathers, and for all fathers who work far from home.",ask:"Ask: “How can we thank our father this week?”"},
  catechism:[["CCC 497","The virginal conception announced to Joseph."],["CCC 1655–1658","The family, the domestic Church."]],
  kidsaint:["St Lucy (13 Dec)","A young Christian of Syracuse in Sicily who gave her riches to the poor and died as a martyr around the year 304. Her name means “light”. Lesson: be a light by your goodness."],
  term:["The Just Man (Saddiq)","Matthew calls Joseph “righteous” or “just”, in Hebrew tsaddiq: one whose whole life is in harmony with God's will. In Joseph, justice and mercy meet."],
  termMore:["Joseph in the Syriac tradition","The Syriac Fathers honour Joseph as the guardian of the Mystery; St Ephrem's Nativity hymns imagine him caring for the Child and marvelling at him."]},
 {homily:["Dear brothers and sisters, this Sunday the Gospel turns from Mary to Joseph. Joseph has made his plans: he is betrothed to Mary, he is preparing a home. Then he discovers that she is with child, and he does not understand.","What does he do? St Matthew says that Joseph, being a righteous man and unwilling to expose her to public disgrace, decided to send her away quietly. Notice: his righteousness is mercy. He does not want to shame her. How different from our world, where people love to expose others on social media and in gossip!","Then God speaks to him in a dream: “Joseph, son of David, do not be afraid to take Mary as your wife.” And Joseph, who never speaks a word in the Gospels, simply obeys: he woke up and did as the angel commanded. No delay, no argument. Like young Samuel he could say: “Speak, Lord, your servant is listening.”","Joseph gave Jesus a home, a family name and a father's protection. Dear fathers, your quiet work, your sacrifices, your faithfulness are part of God's plan. And all of us: let us give God some silence each night, so that, like Joseph, we may hear him and obey. Amen."],
  kids:["Children, Joseph was a carpenter who loved Mary. One night an angel came to him in a dream and said: “Don't be afraid! Take care of Mary and her baby Jesus.”","When Joseph woke up, he did exactly what God said, straight away. He became Jesus' father on earth. He kept Jesus safe and taught him to work.","Let's thank God for our fathers. And let's be like Joseph: when Mummy or Daddy asks, do it straight away! Let's say: “Like Joseph, I will listen and obey!”"]});

put("2026-12-13","ml",{title:"വിശുദ്ധ യൗസേപ്പിനു ദൂതൻ പ്രത്യക്ഷപ്പെട്ടതിന്റെ ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 1:18–25","ദൂതൻ ജോസഫിനു പ്രത്യക്ഷപ്പെടുന്നു"],[ML.ot,"ഉൽപത്തി 37:5–11","യാക്കോബിന്റെ മകൻ ജോസഫിന്റെ സ്വപ്നങ്ങൾ"],[ML.ot,"പ്രഭാഷകൻ 7:11–17","വിനയവും വിശ്വസ്തതയും"],[ML.ot,"1 സാമുവൽ 3:10–18","“അരുളിച്ചെയ്താലും, അങ്ങയുടെ ദാസനിതാ ശ്രവിക്കുന്നു”"],[ML.ot,"ഏശയ്യാ 45:20–25","എന്നിലേക്കു തിരിഞ്ഞു രക്ഷപെടുക"],[ML.ce,"1 പത്രോസ് 2:11–17","ജനതകളുടെ ഇടയിൽ മാന്യമായി ജീവിക്കുക"],[ML.pa,"ഗലാത്തിയാ 1:11–24","അവിടുത്തെ കൃപയാൽ വിളിക്കപ്പെട്ടു"],[ML.go,"മത്തായി 1:18–25","ജോസഫ് മറിയത്തെ ഭാര്യയായി സ്വീകരിക്കുന്നു"]],
 alt:"സൂബോറോയിലെ അഞ്ചാം ഞായർ.",
 verse:"ദാവീദിന്റെ പുത്രനായ ജോസഫ്, മറിയത്തെ ഭാര്യയായി സ്വീകരിക്കാൻ ശങ്കിക്കേണ്ടാ. അവൾ ഗർഭംധരിച്ചിരിക്കുന്നത് പരിശുദ്ധാത്മാവിൽനിന്നാണ്.",cite:"മത്തായി 1:20",
 theo:["ലൂക്കാ മറിയത്തിലൂടെയാണു കഥ പറഞ്ഞത്; മത്തായി ജോസഫിലൂടെ പറയുന്നു. തന്റെ പ്രതിശ്രുതവധുവായ മറിയം ഗർഭിണിയാണെന്നു ജോസഫ് അറിയുന്നു; എങ്ങനെയെന്ന് അവന് അറിഞ്ഞുകൂടാ. ഒറ്റവാക്കിൽ വിശുദ്ധ മത്തായി അവനെ വിവരിക്കുന്നു: അവൻ “നീതിമാൻ” ആയിരുന്നു. കരുണയിലാണ് അവന്റെ നീതി വെളിപ്പെടുന്നത്: “അവളെ അപമാനിതയാക്കാൻ ഇഷ്ടപ്പെടായ്കയാലും അവളെ രഹസ്യമായി ഉപേക്ഷിക്കാൻ തീരുമാനിച്ചു.”","അപ്പോൾ ദൈവം സ്വപ്നത്തിൽ അവനോടു സംസാരിക്കുന്നു: “ദാവീദിന്റെ പുത്രനായ ജോസഫ്, മറിയത്തെ ഭാര്യയായി സ്വീകരിക്കാൻ ശങ്കിക്കേണ്ടാ. അവൾ ഗർഭംധരിച്ചിരിക്കുന്നത് പരിശുദ്ധാത്മാവിൽനിന്നാണ്. അവൾ ഒരു പുത്രനെ പ്രസവിക്കും. നീ അവന് യേശു എന്നു പേരിടണം. എന്തെന്നാൽ, അവൻ തന്റെ ജനത്തെ അവരുടെ പാപങ്ങളിൽ നിന്നു മോചിപ്പിക്കും.” ജോസഫിനു രണ്ടു ദൗത്യങ്ങൾ നൽകപ്പെടുന്നു: മറിയത്തെ സ്വീകരിക്കുക, ശിശുവിനു പേരിടുക. പേരിടുന്നതിലൂടെ ജോസഫ് യേശുവിനു ദാവീദിന്റെ ഭവനത്തിൽ നിയമപരമായ സ്ഥാനം നൽകുന്നു.","സുവിശേഷങ്ങളിൽ ജോസഫ് ഒരു വാക്കുപോലും സംസാരിക്കുന്നില്ല. പക്ഷേ അവൻ പ്രവർത്തിക്കുന്നു: “ജോസഫ് നിദ്രയിൽനിന്ന് ഉണർന്ന്, കർത്താവിന്റെ ദൂതൻ കൽപിച്ചതുപോലെ പ്രവർത്തിച്ചു; അവൻ തന്റെ ഭാര്യയെ സ്വീകരിച്ചു.” അവന്റെ അനുസരണം ഉടനടിയുള്ളതും പൂർണവുമാണ്. ബാലനായ സാമുവലിനെപ്പോലെ, വാക്കുകളിലല്ലെങ്കിലും പ്രവൃത്തികളിൽ, അവൻ പറയുന്നു: “അരുളിച്ചെയ്താലും, അങ്ങയുടെ ദാസനിതാ ശ്രവിക്കുന്നു.” ഉൽപത്തിയിലെ സ്വപ്നദർശിയായ ജോസഫ് ഈജിപ്തിലേക്കു പോയി തന്റെ കുടുംബത്തെ രക്ഷിച്ചു; ഈ ജോസഫ് തിരുക്കുടുംബത്തെ ഈജിപ്തിലേക്കു കൊണ്ടുപോയി രക്ഷിക്കും.","മത്തായി കൂട്ടിച്ചേർക്കുന്നു: “ദൈവം നമ്മോടുകൂടെ എന്നർഥമുള്ള എമ്മാനുവേൽ എന്ന് അവൻ വിളിക്കപ്പെടും എന്നു കർത്താവ് പ്രവാചകൻമുഖേന അരുളിച്ചെയ്തതു പൂർത്തിയാകാൻവേണ്ടിയാണ് ഇതെല്ലാം സംഭവിച്ചത്.” ജോസഫിന്റെ നിശ്ശബ്ദവിശ്വാസത്തിലൂടെ, നമ്മോടുകൂടെയുള്ള ദൈവത്തിന് ഒരു ഭവനവും കുടുംബനാമവും ഒരു പിതാവിന്റെ സംരക്ഷണവും ലഭിക്കുന്നു."],
 conn:[["രണ്ടു ജോസഫുമാർ, രണ്ടു സ്വപ്നദർശികൾ.","യാക്കോബിന്റെ മകൻ ജോസഫ് സ്വപ്നം കണ്ടു; കുടുംബത്തെ രക്ഷിക്കാൻ മുമ്പേ ഈജിപ്തിലേക്ക് അയയ്ക്കപ്പെട്ടു (ഉൽപ 37; 45:5). നസറത്തിലെ ജോസഫ് സ്വപ്നം കാണുന്നു; ശിശുവിനെ രക്ഷിക്കാൻ അവനെ ഈജിപ്തിലേക്കു കൊണ്ടുപോകുന്നു (മത്താ 2:13–15)."],["സാമുവലിന്റെ ശ്രവിക്കുന്ന ഹൃദയം.","“അരുളിച്ചെയ്താലും, അങ്ങയുടെ ദാസനിതാ ശ്രവിക്കുന്നു” (1 സാമു 3:10) എന്നതു ജോസഫിനെ കൃത്യമായി വിവരിക്കുന്നു: അവൻ ശ്രവിക്കുന്നു, അനുസരിക്കുന്നു."],["ദാവീദിന്റെ പുത്രൻ.","ദൂതൻ ജോസഫിനെ “ദാവീദിന്റെ പുത്രൻ” എന്നു വിളിക്കുന്നു. ജോസഫിന്റെ നിയമപരമായ പിതൃത്വത്തിലൂടെ യേശു ദാവീദിനു നൽകപ്പെട്ട വാഗ്ദാനത്തിന്റെ അവകാശിയാകുന്നു (2 സാമു 7:12–16)."],["ജനനത്തിനു മുമ്പേ വിളിക്കപ്പെട്ടു.","ജനനത്തിനു മുമ്പേ ദൈവം തന്നെ വേർതിരിച്ചു കൃപയാൽ വിളിച്ചുവെന്നു പൗലോസ് പറയുന്നു (ഗലാ 1:15). മറഞ്ഞതെങ്കിലും അനിവാര്യമായ ഒരു ദൗത്യത്തിനായി ദൈവികപദ്ധതിയിൽ ജോസഫും തിരഞ്ഞെടുക്കപ്പെട്ടു."]],
 altar:["പൂർണമായി മനസ്സിലാക്കാതെതന്നെ ജോസഫ് മറിയത്തെയും ശിശുവിനെയും തന്റെ ഭവനത്തിൽ സ്വീകരിച്ചു. വിശുദ്ധ കുർബാനയിൽ അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയും എളിയ അടയാളങ്ങളിൽ നാം ക്രിസ്തുവിനെ സ്വീകരിക്കുന്നു; ആശ്രയിക്കാൻ എല്ലാം കാണേണ്ടതില്ലാത്ത അതേ വിശ്വാസത്തോടെ."],
 outline:[["ആരംഭം","ചോദിക്കുക: ജീവിതം നമ്മുടെ പദ്ധതിപോലെ നടക്കാതാകുമ്പോൾ നാം എങ്ങനെ പ്രതികരിക്കുന്നു?"],["ഒന്നാം ആശയം · നീതിമാൻ കരുണയുള്ളവനാണ്","ജോസഫിന്റെ നീതി കാർക്കശ്യമല്ല, കരുണയാണ് (മത്താ 1:19). പരദൂഷണത്തെപ്പറ്റിയും മറ്റുള്ളവരുടെ അന്തസ്സു സംരക്ഷിക്കുന്നതിനെപ്പറ്റിയും ഒരു വാക്ക്."],["രണ്ടാം ആശയം · രാത്രിയിൽ ദൈവം സംസാരിക്കുന്നു","സ്വപ്നത്തിൽ ജോസഫ് ശ്രവിക്കുന്നു. സംസാരിക്കാൻ നാം ദൈവത്തിന് ഇടം നൽകുന്നുണ്ടോ: മൗനം, പ്രാർഥന, വചനം?"],["മൂന്നാം ആശയം · ഉടനടിയുള്ള അനുസരണം","“ദൂതൻ കൽപിച്ചതുപോലെ പ്രവർത്തിച്ചു.” താമസമില്ലാത്ത വിശ്വാസം."],["നാലാം ആശയം · ഇന്നത്തെ പിതാക്കന്മാർ","ജോസഫ് ഒരു പേരും ഭവനവും സംരക്ഷണവും നൽകുന്നു. പിതാക്കന്മാരോടും മറ്റുള്ളവരുടെ മക്കളെ പരിപാലിക്കുന്ന എല്ലാവരോടും ഒരു വാക്ക്."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, അരുളിച്ചെയ്താലും; അങ്ങയുടെ ദാസനിതാ ശ്രവിക്കുന്നു.”"]],
 live:[["ഒരാളുടെ അന്തസ്സു കാക്കുക (മത്താ 1:19)","ഈ ആഴ്ച ഒരു പരദൂഷണം കൈമാറാൻ വിസമ്മതിക്കുക; പകരം ആ വ്യക്തിയെപ്പറ്റി നല്ലതു പറയുക."],["ഉറങ്ങുംമുമ്പു ശ്രവിക്കുക (1 സാമു 3:10)","“കർത്താവേ, അരുളിച്ചെയ്താലും; അങ്ങയുടെ ദാസനിതാ ശ്രവിക്കുന്നു” എന്നു പറഞ്ഞ് ഓരോ ദിവസവും അഞ്ചു മിനിറ്റ് മൗനത്തോടെ അവസാനിപ്പിക്കുക."],["പിതാക്കന്മാരെ ബഹുമാനിക്കുക","നിന്റെ കുടുംബത്തിലെയും ഇടവകയിലെയും പിതാക്കന്മാർക്കുവേണ്ടി പ്രാർഥിക്കുക; പിതാക്കന്മാരേ, ക്രിസ്മസിനു മുമ്പു നിങ്ങളുടെ മക്കളെ ആശീർവദിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","ജോസഫിന്റെ നീതി അവന്റെ സൗമ്യതയിൽ വെളിപ്പെടുന്നുവെന്ന് അദ്ദേഹം പറയുന്നു: മറിയത്തിന് ഏറ്റവും ചെറിയ അപമാനംപോലും വരാതിരിക്കാൻ അവൻ ആഗ്രഹിച്ചു; യഥാർഥ പുണ്യത്തിന്റെ അടയാളം (മത്തായിയെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 4)."],["ക്ലെയർവോയിലെ വിശുദ്ധ ബെർണാർഡ്","രണ്ടു ജോസഫുമാരെ അദ്ദേഹം താരതമ്യം ചെയ്യുന്നു: ആദ്യത്തെയാൾ ഈജിപ്തിനായി അപ്പം സൂക്ഷിച്ചു; രണ്ടാമത്തെയാൾ ലോകം മുഴുവനുംവേണ്ടി സ്വർഗത്തിൽനിന്നുള്ള ജീവനുള്ള അപ്പത്തെ കാത്തു (കന്യകാമാതാവിന്റെ സ്തുതിക്കുള്ള പ്രസംഗങ്ങൾ 2, 16)."]],
 magis:[["രക്ഷകന്റെ കാവൽക്കാരൻ (റിഡംപ്തോറിസ് കുസ്തോസ്) 3–4","വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ: ജോസഫിന്റെ “വിശ്വാസത്തിന്റെ അനുസരണം” മറിയത്തിന്റേതിനു സമാന്തരമാണ്; മറിയത്തെ ഭാര്യയായി സ്വീകരിച്ചതിലൂടെ മനുഷ്യാവതാരരഹസ്യത്തിൽ അവൻ പങ്കുചേർന്നു."],["പിതൃഹൃദയത്തോടെ (പാത്രിസ് കോർദേ, 2020)","സ്നേഹമുള്ള, ആർദ്രതയുള്ള, അനുസരണമുള്ള, സ്വീകരിക്കുന്ന, സർഗാത്മകധൈര്യമുള്ള, അധ്വാനിക്കുന്ന, “നിഴലിലുള്ള” പിതാവായി ഫ്രാൻസിസ് മാർപാപ്പ ജോസഫിനെ വിവരിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 437, 497","പരിശുദ്ധാത്മാവിനാൽ ഗർഭംധരിക്കപ്പെട്ട ശിശുവിനെപ്പറ്റി ദൂതൻ ജോസഫിനെ അറിയിച്ചു; യേശു ദാവീദിന്റെ പുത്രനായ ക്രിസ്തുവാണ്."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഡിസംബർ 13: വിശുദ്ധ ലൂസി. ഡിസംബർ 14: കുരിശിന്റെ വിശുദ്ധ യോഹന്നാൻ. ഡിസംബർ 18: മൈലാപ്പൂരിലെ അദ്ഭുതകുരിശ് (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ). 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ ദൈവമേ, അങ്ങയുടെ പുത്രനെയും കന്യകാമറിയത്തെയും നീതിമാനായ ജോസഫിന്റെ വിശ്വസ്തസംരക്ഷണത്തിന് അങ്ങ് ഏൽപിച്ചു. അവന്റെ ശ്രവിക്കുന്ന ഹൃദയവും കരുണയുള്ള നീതിയും ഉടനടിയുള്ള അനുസരണവും ഞങ്ങൾക്കു നൽകണമേ; എല്ലാ പിതാക്കന്മാരെയും അവന്റെ ആർദ്രമായ ശക്തിയാൽ അനുഗ്രഹിക്കണമേ. ആമേൻ."},
 {quick:["നീതിമാനായ ജോസഫ് കരുണയുള്ളവനാണ്.","ദൈവം സ്വപ്നത്തിൽ ജോസഫിനോടു സംസാരിക്കുന്നു; അവൻ ശ്രവിക്കുന്നു.","ജോസഫ് ഉടനെ അനുസരിക്കുന്നു; യേശുവിന് ഒരു ഭവനവും പേരും നൽകുന്നു."],action:"ഈ ആഴ്ച ഒരു പരദൂഷണം കൈമാറാൻ വിസമ്മതിച്ച് ആ വ്യക്തിയെപ്പറ്റി നല്ലതു പറയുക.",question:"എന്നോടു സംസാരിക്കാൻ ആവശ്യമായ മൗനം ഞാൻ ദൈവത്തിനു നൽകുന്നുണ്ടോ?",
  special:"സൂബോറോയിലെ അഞ്ചാം ഞായർ: വിശുദ്ധ യൗസേപ്പിനു ദൂതൻ പ്രത്യക്ഷപ്പെട്ടത്.",
  illus:["ഒരു ഉദാഹരണം","ഗൾഫിലുള്ള ഒരു പിതാവ് ദിവസം പന്ത്രണ്ടു മണിക്കൂർ ജോലി ചെയ്യുന്നു; എല്ലാ രാത്രിയും മക്കളോടൊപ്പം ഫോണിലൂടെ പ്രാർഥിക്കാൻ വീട്ടിലേക്കു വിളിക്കുന്നു. ആരും അദ്ദേഹത്തെപ്പറ്റി എഴുതുന്നില്ല; പക്ഷേ അദ്ദേഹം നിമിത്തമാണ് ആ കുടുംബം നിലനിൽക്കുന്നത്. ഇതാണു ജോസഫിന്റെ വഴി."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 1:20–24.",explain:"മറിയത്തെയും അവളുടെ കുഞ്ഞിനെയും പരിപാലിക്കാൻ ഒരു ദൂതൻ സ്വപ്നത്തിൽ ജോസഫിനോടു പറഞ്ഞു. ജോസഫ് ഉണർന്ന് ദൈവം പറഞ്ഞതുപോലെ ഉടനെ ചെയ്തു. യേശുവിനെ പരിപാലിച്ച അപ്പനായി അവൻ.",intention:"നമ്മുടെ അപ്പനും വല്യപ്പന്മാർക്കും, വീട്ടിൽനിന്ന് അകലെ ജോലി ചെയ്യുന്ന എല്ലാ പിതാക്കന്മാർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമുക്ക് അപ്പനോട് എങ്ങനെ നന്ദി പറയാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 497","ജോസഫിനെ അറിയിച്ച കന്യാഗർഭധാരണം."],["മതബോധനഗ്രന്ഥം 1655–1658","ഗാർഹികസഭയായ കുടുംബം."]],
  kidsaint:["വിശുദ്ധ ലൂസി (ഡിസംബർ 13)","തന്റെ സമ്പത്തു ദരിദ്രർക്കു നൽകി, ഏകദേശം 304-ൽ രക്തസാക്ഷിയായി മരിച്ച സിസിലിയിലെ സിറാക്കൂസിൽനിന്നുള്ള ഒരു യുവക്രിസ്ത്യാനി. അവളുടെ പേരിന്റെ അർഥം “വെളിച്ചം” എന്നാണ്. പാഠം: നിന്റെ നന്മയാൽ ഒരു വെളിച്ചമാകുക."],
  term:["നീതിമാൻ (സദ്ദീക്ക്)","മത്തായി ജോസഫിനെ “നീതിമാൻ” എന്നു വിളിക്കുന്നു; ഹീബ്രുവിൽ “സദ്ദീക്ക്”: ജീവിതം മുഴുവൻ ദൈവഹിതവുമായി ഇണങ്ങിയവൻ. ജോസഫിൽ നീതിയും കരുണയും സന്ധിക്കുന്നു."],
  termMore:["സുറിയാനി പാരമ്പര്യത്തിൽ ജോസഫ്","രഹസ്യത്തിന്റെ കാവൽക്കാരനായി സുറിയാനി പിതാക്കന്മാർ ജോസഫിനെ ആദരിക്കുന്നു; മാർ അപ്രേമിന്റെ തിരുപ്പിറവിഗീതങ്ങൾ ശിശുവിനെ പരിപാലിക്കുകയും അവനെക്കുറിച്ച് അദ്ഭുതപ്പെടുകയും ചെയ്യുന്ന ജോസഫിനെ സങ്കൽപിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഈ ഞായറാഴ്ച സുവിശേഷം മറിയത്തിൽനിന്നു ജോസഫിലേക്കു തിരിയുന്നു. ജോസഫ് തന്റെ പദ്ധതികൾ തയ്യാറാക്കിയിരുന്നു: മറിയവുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞു; ഒരു ഭവനം ഒരുക്കുകയായിരുന്നു. അപ്പോഴാണ് അവൾ ഗർഭിണിയാണെന്ന് അവൻ അറിയുന്നത്; അവനു മനസ്സിലാകുന്നില്ല.","അവൻ എന്തു ചെയ്യുന്നു? വിശുദ്ധ മത്തായി പറയുന്നു: ജോസഫ് നീതിമാനാകയാലും അവളെ അപമാനിതയാക്കാൻ ഇഷ്ടപ്പെടായ്കയാലും അവളെ രഹസ്യമായി ഉപേക്ഷിക്കാൻ തീരുമാനിച്ചു. ശ്രദ്ധിക്കുക: അവന്റെ നീതി കരുണയാണ്. അവളെ അപമാനിക്കാൻ അവൻ ആഗ്രഹിക്കുന്നില്ല. സാമൂഹികമാധ്യമങ്ങളിലും പരദൂഷണത്തിലും മറ്റുള്ളവരെ തുറന്നുകാട്ടാൻ ഇഷ്ടപ്പെടുന്ന നമ്മുടെ ലോകത്തിൽനിന്ന് എത്ര വ്യത്യസ്തം!","അപ്പോൾ ദൈവം സ്വപ്നത്തിൽ അവനോടു സംസാരിക്കുന്നു: “ദാവീദിന്റെ പുത്രനായ ജോസഫ്, മറിയത്തെ ഭാര്യയായി സ്വീകരിക്കാൻ ശങ്കിക്കേണ്ടാ.” സുവിശേഷങ്ങളിൽ ഒരു വാക്കുപോലും സംസാരിക്കാത്ത ജോസഫ് ലളിതമായി അനുസരിക്കുന്നു: നിദ്രയിൽനിന്ന് ഉണർന്ന്, ദൂതൻ കൽപിച്ചതുപോലെ പ്രവർത്തിച്ചു. താമസമില്ല, തർക്കമില്ല. ബാലനായ സാമുവലിനെപ്പോലെ അവനു പറയാമായിരുന്നു: “അരുളിച്ചെയ്താലും, അങ്ങയുടെ ദാസനിതാ ശ്രവിക്കുന്നു.”","ജോസഫ് യേശുവിന് ഒരു ഭവനവും കുടുംബനാമവും ഒരു പിതാവിന്റെ സംരക്ഷണവും നൽകി. പ്രിയ പിതാക്കന്മാരേ, നിങ്ങളുടെ നിശ്ശബ്ദമായ അധ്വാനവും ത്യാഗങ്ങളും വിശ്വസ്തതയും ദൈവികപദ്ധതിയുടെ ഭാഗമാണ്. നമ്മളെല്ലാവരും: ജോസഫിനെപ്പോലെ ദൈവത്തെ കേട്ട് അനുസരിക്കാൻ, എല്ലാ രാത്രിയും ദൈവത്തിന് അൽപം മൗനം നൽകാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, മറിയത്തെ സ്നേഹിച്ച ഒരു ആശാരിയായിരുന്നു ജോസഫ്. ഒരു രാത്രി ഒരു ദൂതൻ സ്വപ്നത്തിൽ വന്നു പറഞ്ഞു: “പേടിക്കേണ്ട! മറിയത്തെയും കുഞ്ഞായ യേശുവിനെയും നോക്കിക്കൊള്ളുക.”","ഉണർന്നപ്പോൾ ദൈവം പറഞ്ഞതുപോലെ ജോസഫ് ഉടനെ ചെയ്തു. ഭൂമിയിൽ യേശുവിന്റെ അപ്പനായി. അവൻ യേശുവിനെ സുരക്ഷിതനായി കാത്തു; പണിയെടുക്കാൻ പഠിപ്പിച്ചു.","നമ്മുടെ അപ്പന്മാർക്കായി നമുക്കു ദൈവത്തിനു നന്ദി പറയാം. ജോസഫിനെപ്പോലെയാകാം: അമ്മയോ അപ്പനോ പറയുമ്പോൾ ഉടനെ ചെയ്യുക! നമുക്കു പറയാം: “ജോസഫിനെപ്പോലെ ഞാൻ കേട്ട് അനുസരിക്കും!”"]});

/* ================= SUNDAY BEFORE YALDO · 20 December 2026 ================= */
put("2026-12-20","en",{title:"Sunday before Yaldo",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 1:1–17","The genealogy of Jesus Christ"],[EN.ot,"Genesis 46:8–27","Jacob's family goes down to Egypt"],[EN.ot,"1 Kings 9:3–7","God's promise to the house of David"],[EN.ot,"Jeremiah 23:5–8","A righteous Branch for David"],[EN.ot,"Isaiah 11:1–9","A shoot from the stump of Jesse"],[EN.ac,"Acts 3:20–26","In your descendants all families shall be blessed"],[EN.pa,"Hebrews 7:14–17","Our Lord descended from Judah"],[EN.go,"Luke 2:1–5","Joseph and Mary go up to Bethlehem"]],
 alt:"Sixth Sunday of Suboro. In the 2025–26 lectionary this Sunday was also kept as Bible Sunday. Yaldo falls on Friday 25 December.",
 verse:"A shoot shall come out from the stump of Jesse, and a branch shall grow out of his roots.",cite:"Isaiah 11:1",
 theo:["On the last Sunday before Yaldo the Church reads names: the long genealogy of Jesus, and the list of Jacob's family going down to Egypt. These lists can seem dry, but they say something essential: God's salvation enters real history, through real families, over many generations.","The prophets used the image of a tree. The royal house of David had been cut down like a stump; but Isaiah says, “A shoot shall come out from the stump of Jesse, and a branch shall grow out of his roots.” Jeremiah repeats it: “I will raise up for David a righteous Branch.” When everything seemed dead, God was preparing new life from the old root.","Luke brings the promise to a dusty road. Because of a decree of Caesar Augustus, “Joseph also went from the town of Nazareth in Galilee to Judea, to the city of David called Bethlehem… He went to be registered with Mary, to whom he was engaged and who was expecting a child.” The emperor thinks he is counting his subjects; in fact he is bringing the Son of David to the town where the prophet Micah said the ruler of Israel would be born.","Peter in Acts recalls God's word to Abraham: “In your descendants all the families of the earth shall be blessed” (Acts 3:25). The genealogy does not end with Jesus; it continues in us, the Church, who by Baptism are grafted into this family tree. As Yaldo approaches, we prepare not only to remember a birth, but to welcome the Saviour into our own family history."],
 conn:[["Down to Egypt, up to Bethlehem.","Jacob's family went down to Egypt with God's promise: “I myself will go down with you” (Genesis 46:4). Now the Son of God comes down into our history, and his family goes up to Bethlehem."],["The Spirit on the Branch.","Isaiah 11:2 describes the Spirit resting on the shoot of Jesse, the source of the gifts of the Spirit."],["The peaceable kingdom.","“The wolf shall live with the lamb” (Isaiah 11:6): the Child of Bethlehem brings a peace that heals even creation."],["A priest from Judah.","Hebrews 7:14 notes that our Lord came from Judah, not Levi: a new priesthood “according to the order of Melchizedek”."]],
 altar:["Bethlehem means “house of bread”. The Son of David born there gives himself as the Bread of Life. As we go up to Yaldo, each Holy Qurbono is our journey to Bethlehem."],
 outline:[["Opening","Ask: do you know the names of your great-grandparents? Why do families keep these names?"],["Point 1 · God works through families","The genealogies: saints and sinners, Jews and foreigners. Your family history is not outside God's plan."],["Point 2 · New life from a stump","Isaiah 11. When something in our life seems cut down, God can make it sprout."],["Point 3 · The road to Bethlehem","The emperor's decree serves God's plan. God uses even inconvenient events."],["Point 4 · Bible Sunday","The Word that became flesh speaks to us in Scripture. Practical: keep a Bible open at home."],["Take-home line","“My family is part of God's story.”"]],
 live:[["Pray for your family tree","Write the names of your grandparents and great-grandparents and pray for them, living and departed."],["Read the Christmas Gospel at home","On Christmas Eve, read Luke 2:1–20 together as a family before the crib."],["Finish the Nombu well","Make your Christmas Confession this week and plan one act of charity for Yaldo."]],
 fathers:[["St Irenaeus of Lyons","Luke traces Christ's genealogy back to Adam to show that Christ “recapitulates” in himself all the nations and generations of humanity, from the beginning (Against Heresies III, 22, 3)."],["St Ephrem the Syrian","In his Nativity hymns he sings of the Shoot from the root of Jesse, through whom the old trunk of humanity blossoms again (Hymns on the Nativity)."]],
 magis:[["Catechism 525–526","Jesus was born in a humble stable in Bethlehem; to become a child in relation to God is the condition for entering the kingdom."],["Dei Verbum 25","Ignorance of the Scriptures is ignorance of Christ (St Jerome); the faithful are urged to frequent reading of the divine Scriptures."],["Catechism 1213, 1267","By Baptism we become members of the Body of Christ, the family of God."]],
 saints:[["This week","25 Dec (Friday): Yaldo, the Nativity of our Lord, Holy Qurbono for the people. 26 Dec: Exaltation of Mary, Mother of God. 27 Dec: Commemoration of the infants killed by Herod (as in the 2025–26 lectionary). Confirm in the 2026–27 lectionary."]],
 prayer:"Lord God, from the stump of Jesse you made a Branch to grow, and through many generations you prepared the birth of your Son. Bless our families and our ancestors, make your Word live in our homes, and lead us like Joseph and Mary to Bethlehem, to welcome the Saviour. Amen."},
 {quick:["God's salvation comes through real families and real history.","From the cut-down stump of Jesse, God makes new life sprout.","Even Caesar's decree brings Mary and Joseph to Bethlehem."],action:"Read Luke 2:1–20 together as a family on Christmas Eve.",question:"Where in my family history do I need God to make something new sprout?",
  special:"Sixth Sunday of Suboro, the Sunday before Yaldo (Christmas, Friday 25 December).",
  illus:["An illustration","At a Kerala family reunion the eldest member reads out the names of the ancestors who brought the faith to the family. The young people discover that their faith has a history. The genealogy of Jesus does the same for the whole Church."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 2:1–5.",explain:"Joseph and Mary had to travel a long way to Bethlehem, because the emperor wanted to count everyone. God used that journey so that Jesus would be born in Bethlehem, the town of King David.",intention:"We pray for our grandparents and great-grandparents who passed on the faith to us.",ask:"Ask: “Who taught our family to pray? Let us thank God for them.”"},
  catechism:[["CCC 437","The angel announces the birth of the Messiah in the city of David."],["CCC 131–133","The Holy Scripture in the life of the Church."]],
  kidsaint:["St Jerome","A great scholar who lived in Bethlehem and spent his life translating the Bible so that everyone could read it. He said that not knowing the Scriptures means not knowing Christ. Lesson: read a little of the Bible every day."],
  term:["Yaldo (യൽദോ)","Syriac for “birth”: the feast of the Nativity of our Lord, 25 December. The season of Yaldo–Denho follows, until the Baptism of the Lord (Denho, 6 January)."],
  termMore:["The genealogies","Matthew traces Jesus' line from Abraham through David; Luke traces it back to Adam. Both show that Jesus is the Son of David and the Saviour of all humanity."]},
 {homily:["Dear brothers and sisters, on this last Sunday before Yaldo, the Church gives us a list of names: the family of Jacob going down to Egypt, and the genealogy of Jesus. Some of us may wonder why. But these names tell us something beautiful: God did not save the world from a distance. He came through a family, generation after generation.","Isaiah uses a picture every farmer in Kerala knows. A tree is cut down; only a stump remains. Then one day a green shoot appears. “A shoot shall come out from the stump of Jesse.” When the house of David seemed finished, God was preparing the Saviour. When something in our life seems cut down, God can still make it sprout.","Then St Luke tells us how Mary and Joseph came to Bethlehem. Not by their own plan, but because the emperor ordered a census. A very inconvenient journey for a woman expecting a child! Yet God used it so that his Son would be born in the city of David, as the prophet had promised. God can use even the inconvenient events of our lives.","This week, pray for your family tree: for grandparents and great-grandparents who passed on the faith. Make your Christmas Confession. And on Christmas Eve, gather your family and read the Gospel of the Nativity together. Let us go to Bethlehem, the house of bread, to welcome the Saviour. Amen."],
  kids:["Children, do you know the names of your grandparents? Jesus had grandparents and great-great-grandparents too! The Bible gives a long list of them, all the way back to Abraham and King David.","Mary and Joseph had to walk a long way to Bethlehem. It was hard, but God had a plan: Jesus would be born in the town of King David.","This Christmas, let's thank God for our family. Let's say together: “Thank you, God, for my family!”"]});

put("2026-12-20","ml",{title:"യൽദോയ്ക്കു മുമ്പുള്ള ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 1:1–17","യേശുക്രിസ്തുവിന്റെ വംശാവലി"],[ML.ot,"ഉൽപത്തി 46:8–27","യാക്കോബിന്റെ കുടുംബം ഈജിപ്തിലേക്ക്"],[ML.ot,"1 രാജാക്കന്മാർ 9:3–7","ദാവീദിന്റെ ഭവനത്തോടുള്ള ദൈവവാഗ്ദാനം"],[ML.ot,"ജറെമിയാ 23:5–8","ദാവീദിനു നീതിയുടെ ശാഖ"],[ML.ot,"ഏശയ്യാ 11:1–9","ജസ്സെയുടെ കുറ്റിയിൽനിന്ന് ഒരു മുള"],[ML.ac,"അപ്പ. പ്രവ. 3:20–26","നിന്റെ സന്തതിയിലൂടെ എല്ലാ കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും"],[ML.pa,"ഹെബ്രായർ 7:14–17","നമ്മുടെ കർത്താവ് യൂദായിൽനിന്ന്"],[ML.go,"ലൂക്കാ 2:1–5","ജോസഫും മറിയവും ബേത്‌ലെഹെമിലേക്ക്"]],
 alt:"സൂബോറോയിലെ ആറാം ഞായർ. 2025–26-ലെ വായനാപുസ്തകത്തിൽ ഈ ഞായർ ബൈബിൾ ഞായറായും ആചരിച്ചിരുന്നു. യൽദോ ഡിസംബർ 25 വെള്ളിയാഴ്ച.",
 verse:"ജസ്സെയുടെ കുറ്റിയിൽനിന്ന് ഒരു മുള കിളിർത്തുവരും; അവന്റെ വേരിൽനിന്ന് ഒരു ശാഖ പൊട്ടിക്കിളിർക്കും.",cite:"ഏശയ്യാ 11:1",
 theo:["യൽദോയ്ക്കു മുമ്പുള്ള അവസാന ഞായറാഴ്ച സഭ പേരുകൾ വായിക്കുന്നു: യേശുവിന്റെ നീണ്ട വംശാവലിയും ഈജിപ്തിലേക്കു പോകുന്ന യാക്കോബിന്റെ കുടുംബത്തിന്റെ പട്ടികയും. ഈ പട്ടികകൾ വിരസമായി തോന്നാം; പക്ഷേ അവ അനിവാര്യമായ ഒരു കാര്യം പറയുന്നു: അനേകം തലമുറകളിലൂടെ, യഥാർഥ കുടുംബങ്ങളിലൂടെ, ദൈവത്തിന്റെ രക്ഷ യഥാർഥ ചരിത്രത്തിലേക്കു പ്രവേശിക്കുന്നു.","പ്രവാചകന്മാർ ഒരു വൃക്ഷത്തിന്റെ ചിത്രം ഉപയോഗിച്ചു. ദാവീദിന്റെ രാജഭവനം ഒരു കുറ്റിപോലെ വെട്ടിവീഴ്ത്തപ്പെട്ടിരുന്നു; എന്നാൽ ഏശയ്യാ പറയുന്നു: “ജസ്സെയുടെ കുറ്റിയിൽനിന്ന് ഒരു മുള കിളിർത്തുവരും; അവന്റെ വേരിൽനിന്ന് ഒരു ശാഖ പൊട്ടിക്കിളിർക്കും.” ജറെമിയാ ആവർത്തിക്കുന്നു: “ഇതാ, ഞാൻ ദാവീദിന്റെ വംശത്തിൽ നീതിയുടെ ശാഖ മുളപ്പിക്കുന്ന ദിവസം വരുന്നു.” എല്ലാം മരിച്ചുവെന്നു തോന്നിയപ്പോൾ, പഴയ വേരിൽനിന്നു ദൈവം പുതിയ ജീവൻ ഒരുക്കുകയായിരുന്നു.","ലൂക്കാ വാഗ്ദാനത്തെ പൊടിനിറഞ്ഞ ഒരു വഴിയിലേക്കു കൊണ്ടുവരുന്നു. അഗസ്റ്റസ് സീസറിന്റെ ഒരു കല്പന നിമിത്തം, ജോസഫ് ദാവീദിന്റെ കുടുംബത്തിലും വംശത്തിലുംപെട്ടവനായിരുന്നതിനാൽ, “പേരെഴുതിക്കാനായി ഗലീലിയിലെ പട്ടണമായ നസറത്തിൽനിന്നു യൂദയായിൽ ദാവീദിന്റെ പട്ടണമായ ബേത്‌ലെഹെമിലേക്ക് ഗർഭിണിയായ ഭാര്യ മറിയത്തോടുകൂടെ പോയി.” തന്റെ പ്രജകളെ എണ്ണുകയാണെന്നു ചക്രവർത്തി കരുതുന്നു; വാസ്തവത്തിൽ, ഇസ്രായേലിന്റെ ഭരണാധികാരി ജനിക്കുമെന്നു മിക്കാ പ്രവാചകൻ പറഞ്ഞ പട്ടണത്തിലേക്ക് അവൻ ദാവീദിന്റെ പുത്രനെ എത്തിക്കുകയാണ്: “ബേത്‌ലെഹെം-എഫ്രാത്താ, യൂദാഭവനങ്ങളിൽ നീ ചെറുതാണെങ്കിലും ഇസ്രായേലിനെ ഭരിക്കേണ്ടവൻ എനിക്കായി നിന്നിൽനിന്നു പുറപ്പെടും” (മിക്കാ 5:2).","നിന്റെ സന്തതിയിലൂടെ ഭൂമിയിലെ എല്ലാ കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടുമെന്ന് അബ്രാഹത്തോടുള്ള ദൈവവചനം അപ്പസ്തോലപ്രവർത്തനങ്ങളിൽ പത്രോസ് അനുസ്മരിക്കുന്നു (അപ്പ 3:25). വംശാവലി യേശുവിൽ അവസാനിക്കുന്നില്ല; മാമ്മോദീസയാൽ ഈ കുടുംബവൃക്ഷത്തിൽ ഒട്ടിച്ചുചേർക്കപ്പെട്ട സഭയായ നമ്മിൽ അതു തുടരുന്നു. യൽദോ അടുക്കുമ്പോൾ ഒരു ജനനം അനുസ്മരിക്കാൻ മാത്രമല്ല, നമ്മുടെ സ്വന്തം കുടുംബചരിത്രത്തിലേക്കു രക്ഷകനെ സ്വീകരിക്കാനുമാണു നാം ഒരുങ്ങുന്നത്."],
 conn:[["ഈജിപ്തിലേക്ക് ഇറങ്ങി, ബേത്‌ലെഹെമിലേക്കു കയറി.","ദൈവവാഗ്ദാനത്തോടെയാണ് യാക്കോബിന്റെ കുടുംബം ഈജിപ്തിലേക്കു പോയത്: “ഈജിപ്തിലേക്കു പോകാൻ ഭയപ്പെടേണ്ടാ” (ഉൽപ 46:3). ഇപ്പോൾ ദൈവപുത്രൻ നമ്മുടെ ചരിത്രത്തിലേക്ക് ഇറങ്ങിവരുന്നു; അവിടുത്തെ കുടുംബം ബേത്‌ലെഹെമിലേക്കു കയറിപ്പോകുന്നു."],["ശാഖയുടെമേൽ ആത്മാവ്.","ജസ്സെയുടെ മുളയുടെമേൽ ആവസിക്കുന്ന ആത്മാവിനെ ഏശയ്യാ 11:2 വിവരിക്കുന്നു; ആത്മാവിന്റെ ദാനങ്ങളുടെ ഉറവിടം."],["സമാധാനരാജ്യം.","“ചെന്നായും ആട്ടിൻകുട്ടിയും ഒന്നിച്ചു വസിക്കും” (ഏശ 11:6): സൃഷ്ടിയെപ്പോലും സൗഖ്യപ്പെടുത്തുന്ന സമാധാനമാണു ബേത്‌ലെഹെമിലെ ശിശു കൊണ്ടുവരുന്നത്."],["യൂദായിൽനിന്ന് ഒരു പുരോഹിതൻ.","നമ്മുടെ കർത്താവു ലേവിയിൽനിന്നല്ല, യൂദായിൽനിന്നാണു വന്നതെന്നു ഹെബ്രായർ 7:14 സൂചിപ്പിക്കുന്നു: “മെൽക്കിസെദേക്കിന്റെ ക്രമപ്രകാരമുള്ള” ഒരു പുതിയ പൗരോഹിത്യം."]],
 altar:["ബേത്‌ലെഹെം എന്നതിന്റെ അർഥം “അപ്പത്തിന്റെ ഭവനം” എന്നാണ്. അവിടെ ജനിച്ച ദാവീദിന്റെ പുത്രൻ ജീവന്റെ അപ്പമായി തന്നെത്തന്നെ നൽകുന്നു. യൽദോയിലേക്കു നാം നീങ്ങുമ്പോൾ ഓരോ വിശുദ്ധ കുർബാനയും നമ്മുടെ ബേത്‌ലെഹെം യാത്രയാണ്."],
 outline:[["ആരംഭം","ചോദിക്കുക: നിങ്ങളുടെ വല്യപ്പച്ചന്മാരുടെ പേരുകൾ അറിയാമോ? കുടുംബങ്ങൾ എന്തിനാണ് ഈ പേരുകൾ സൂക്ഷിക്കുന്നത്?"],["ഒന്നാം ആശയം · ദൈവം കുടുംബങ്ങളിലൂടെ പ്രവർത്തിക്കുന്നു","വംശാവലികൾ: വിശുദ്ധരും പാപികളും യഹൂദരും വിജാതീയരും. നിന്റെ കുടുംബചരിത്രം ദൈവികപദ്ധതിക്കു പുറത്തല്ല."],["രണ്ടാം ആശയം · കുറ്റിയിൽനിന്നു പുതുജീവൻ","ഏശയ്യാ 11. നമ്മുടെ ജീവിതത്തിൽ എന്തെങ്കിലും വെട്ടിവീഴ്ത്തപ്പെട്ടുവെന്നു തോന്നുമ്പോൾ ദൈവത്തിന് അതു മുളപ്പിക്കാനാകും."],["മൂന്നാം ആശയം · ബേത്‌ലെഹെമിലേക്കുള്ള വഴി","ചക്രവർത്തിയുടെ കല്പന ദൈവികപദ്ധതിക്ക് ഉപകരിക്കുന്നു. അസൗകര്യമുള്ള സംഭവങ്ങൾപോലും ദൈവം ഉപയോഗിക്കുന്നു."],["നാലാം ആശയം · ബൈബിൾ ഞായർ","മാംസമായിത്തീർന്ന വചനം വിശുദ്ധഗ്രന്ഥത്തിൽ നമ്മോടു സംസാരിക്കുന്നു. പ്രായോഗികമായി: വീട്ടിൽ ഒരു ബൈബിൾ തുറന്നുവയ്ക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“എന്റെ കുടുംബം ദൈവത്തിന്റെ കഥയുടെ ഭാഗമാണ്.”"]],
 live:[["നിന്റെ കുടുംബവൃക്ഷത്തിനായി പ്രാർഥിക്കുക","നിന്റെ വല്യപ്പച്ചന്മാരുടെയും വല്യമ്മച്ചിമാരുടെയും അവരുടെ മാതാപിതാക്കളുടെയും പേരുകൾ എഴുതി, ജീവിച്ചിരിക്കുന്നവർക്കും മരിച്ചവർക്കുംവേണ്ടി പ്രാർഥിക്കുക."],["വീട്ടിൽ ക്രിസ്മസ് സുവിശേഷം വായിക്കുക","ക്രിസ്മസ് രാവിൽ പുൽക്കൂടിനു മുമ്പിൽ കുടുംബമൊന്നിച്ചു ലൂക്കാ 2:1–20 വായിക്കുക."],["നോമ്പു നന്നായി പൂർത്തിയാക്കുക","ഈ ആഴ്ച ക്രിസ്മസ് കുമ്പസാരം നടത്തുക; യൽദോയ്ക്കായി ഒരു ഉപവിപ്രവൃത്തി ആസൂത്രണം ചെയ്യുക."]],
 fathers:[["ലിയോൺസിലെ വിശുദ്ധ ഇരണേവൂസ്","ആരംഭംമുതലുള്ള മനുഷ്യവംശത്തിന്റെ എല്ലാ ജനതകളെയും തലമുറകളെയും ക്രിസ്തു തന്നിൽ “സംഗ്രഹിക്കുന്നു” എന്നു കാണിക്കാനാണു ലൂക്കാ ക്രിസ്തുവിന്റെ വംശാവലി ആദംവരെ പിന്നോട്ടു കൊണ്ടുപോകുന്നത് (പാഷണ്ഡതകൾക്കെതിരേ III, 22, 3)."],["മാർ അപ്രേം","ജസ്സെയുടെ വേരിൽനിന്നുള്ള മുളയെപ്പറ്റി അദ്ദേഹം തിരുപ്പിറവിഗീതങ്ങളിൽ പാടുന്നു; അതിലൂടെ മനുഷ്യവംശത്തിന്റെ പഴയ തായ്ത്തടി വീണ്ടും പൂക്കുന്നു (തിരുപ്പിറവിഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 525–526","ബേത്‌ലെഹെമിലെ എളിയ ഒരു കാലിത്തൊഴുത്തിലാണ് യേശു ജനിച്ചത്; ദൈവത്തിനു മുമ്പിൽ ശിശുവാകുക എന്നതാണു രാജ്യത്തിൽ പ്രവേശിക്കാനുള്ള വ്യവസ്ഥ."],["ദൈവാവിഷ്കരണം (ദേയി വെർബും) 25","വിശുദ്ധഗ്രന്ഥത്തെക്കുറിച്ചുള്ള അജ്ഞത ക്രിസ്തുവിനെക്കുറിച്ചുള്ള അജ്ഞതയാണ് (വിശുദ്ധ ജെറോം); വിശുദ്ധഗ്രന്ഥം കൂടെക്കൂടെ വായിക്കാൻ വിശ്വാസികൾ ആഹ്വാനം ചെയ്യപ്പെടുന്നു."],["മതബോധനഗ്രന്ഥം 1213, 1267","മാമ്മോദീസയാൽ നാം ക്രിസ്തുവിന്റെ ശരീരത്തിലെ, ദൈവകുടുംബത്തിലെ, അംഗങ്ങളാകുന്നു."]],
 saints:[["ഈ ആഴ്ച","ഡിസംബർ 25 (വെള്ളി): യൽദോ, നമ്മുടെ കർത്താവിന്റെ തിരുപ്പിറവി; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. ഡിസംബർ 26: ദൈവമാതാവായ മറിയത്തിന്റെ പുകഴ്ച. ഡിസംബർ 27: ഹേറോദേസ് കൊന്ന ശിശുക്കളുടെ ഓർമ (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ). 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ ദൈവമേ, ജസ്സെയുടെ കുറ്റിയിൽനിന്ന് അങ്ങ് ഒരു ശാഖ മുളപ്പിച്ചു; അനേകം തലമുറകളിലൂടെ അങ്ങയുടെ പുത്രന്റെ ജനനം ഒരുക്കി. ഞങ്ങളുടെ കുടുംബങ്ങളെയും പൂർവികരെയും അനുഗ്രഹിക്കണമേ; അങ്ങയുടെ വചനം ഞങ്ങളുടെ ഭവനങ്ങളിൽ ജീവിക്കട്ടെ; രക്ഷകനെ സ്വീകരിക്കാൻ ജോസഫിനെയും മറിയത്തെയുംപോലെ ഞങ്ങളെ ബേത്‌ലെഹെമിലേക്കു നയിക്കണമേ. ആമേൻ."},
 {quick:["യഥാർഥ കുടുംബങ്ങളിലൂടെയും യഥാർഥ ചരിത്രത്തിലൂടെയുമാണു ദൈവത്തിന്റെ രക്ഷ വരുന്നത്.","വെട്ടിവീഴ്ത്തപ്പെട്ട ജസ്സെയുടെ കുറ്റിയിൽനിന്നു ദൈവം പുതുജീവൻ മുളപ്പിക്കുന്നു.","സീസറിന്റെ കല്പനപോലും മറിയത്തെയും ജോസഫിനെയും ബേത്‌ലെഹെമിലെത്തിക്കുന്നു."],action:"ക്രിസ്മസ് രാവിൽ കുടുംബമൊന്നിച്ചു ലൂക്കാ 2:1–20 വായിക്കുക.",question:"എന്റെ കുടുംബചരിത്രത്തിൽ ദൈവം എന്തെങ്കിലും പുതുതായി മുളപ്പിക്കേണ്ടത് എവിടെയാണ്?",
  special:"സൂബോറോയിലെ ആറാം ഞായർ, യൽദോയ്ക്കു (ക്രിസ്മസ്, ഡിസംബർ 25 വെള്ളി) മുമ്പുള്ള ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","ഒരു കേരളകുടുംബസംഗമത്തിൽ, കുടുംബത്തിലേക്കു വിശ്വാസം കൊണ്ടുവന്ന പൂർവികരുടെ പേരുകൾ ഏറ്റവും മുതിർന്നയാൾ വായിക്കുന്നു. തങ്ങളുടെ വിശ്വാസത്തിന് ഒരു ചരിത്രമുണ്ടെന്നു യുവജനങ്ങൾ കണ്ടെത്തുന്നു. സഭയ്ക്കു മുഴുവൻ യേശുവിന്റെ വംശാവലി ചെയ്യുന്നതും അതുതന്നെ."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 2:1–5.",explain:"എല്ലാവരെയും എണ്ണാൻ ചക്രവർത്തി ആഗ്രഹിച്ചതുകൊണ്ടു മറിയത്തിനും ജോസഫിനും ബേത്‌ലെഹെമിലേക്കു വളരെ ദൂരം യാത്ര ചെയ്യേണ്ടിവന്നു. ദാവീദുരാജാവിന്റെ പട്ടണമായ ബേത്‌ലെഹെമിൽ യേശു ജനിക്കാൻ ദൈവം ആ യാത്ര ഉപയോഗിച്ചു.",intention:"നമുക്കു വിശ്വാസം കൈമാറിത്തന്ന വല്യപ്പച്ചന്മാർക്കും വല്യമ്മച്ചിമാർക്കും പൂർവികർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മുടെ കുടുംബത്തെ പ്രാർഥിക്കാൻ പഠിപ്പിച്ചത് ആരാണ്? അവർക്കായി ദൈവത്തിനു നന്ദി പറയാം.”"},
  catechism:[["മതബോധനഗ്രന്ഥം 437","ദാവീദിന്റെ പട്ടണത്തിൽ മിശിഹായുടെ ജനനം ദൂതൻ അറിയിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 131–133","സഭയുടെ ജീവിതത്തിൽ വിശുദ്ധഗ്രന്ഥം."]],
  kidsaint:["വിശുദ്ധ ജെറോം","ബേത്‌ലെഹെമിൽ ജീവിച്ച്, എല്ലാവർക്കും വായിക്കാൻ കഴിയുംവിധം ബൈബിൾ വിവർത്തനം ചെയ്യാൻ ജീവിതം ചെലവഴിച്ച മഹാപണ്ഡിതൻ. വിശുദ്ധഗ്രന്ഥം അറിയാതിരിക്കുന്നതു ക്രിസ്തുവിനെ അറിയാതിരിക്കലാണെന്ന് അദ്ദേഹം പറഞ്ഞു. പാഠം: എല്ലാ ദിവസവും ബൈബിൾ അൽപം വായിക്കുക."],
  term:["യൽദോ","“ജനനം” എന്നതിന്റെ സുറിയാനിപദം: നമ്മുടെ കർത്താവിന്റെ തിരുപ്പിറവിത്തിരുനാൾ, ഡിസംബർ 25. തുടർന്നു കർത്താവിന്റെ മാമ്മോദീസയായ ദനഹാ (ജനുവരി 6) വരെ യൽദോ–ദനഹാക്കാലം."],
  termMore:["വംശാവലികൾ","മത്തായി യേശുവിന്റെ വംശം അബ്രാഹംമുതൽ ദാവീദിലൂടെ പിന്തുടരുന്നു; ലൂക്കാ ആദംവരെ പിന്നോട്ടു പോകുന്നു. യേശു ദാവീദിന്റെ പുത്രനും മനുഷ്യവംശം മുഴുവന്റെയും രക്ഷകനുമാണെന്ന് ഇരുവരും കാണിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, യൽദോയ്ക്കു മുമ്പുള്ള ഈ അവസാന ഞായറാഴ്ച സഭ നമുക്ക് ഒരു പേരുപട്ടിക നൽകുന്നു: ഈജിപ്തിലേക്കു പോകുന്ന യാക്കോബിന്റെ കുടുംബവും യേശുവിന്റെ വംശാവലിയും. എന്തിനെന്നു നമ്മിൽ ചിലർ അദ്ഭുതപ്പെട്ടേക്കാം. പക്ഷേ ഈ പേരുകൾ മനോഹരമായ ഒന്നു പറയുന്നു: ദൈവം ദൂരെനിന്നല്ല ലോകത്തെ രക്ഷിച്ചത്. തലമുറതലമുറയായി ഒരു കുടുംബത്തിലൂടെയാണ് അവിടുന്നു വന്നത്.","കേരളത്തിലെ ഓരോ കർഷകനും അറിയാവുന്ന ഒരു ചിത്രം ഏശയ്യാ ഉപയോഗിക്കുന്നു. ഒരു മരം വെട്ടിവീഴ്ത്തപ്പെടുന്നു; ഒരു കുറ്റി മാത്രം ശേഷിക്കുന്നു. പിന്നെ ഒരുനാൾ ഒരു പച്ചമുള പ്രത്യക്ഷപ്പെടുന്നു. “ജസ്സെയുടെ കുറ്റിയിൽനിന്ന് ഒരു മുള കിളിർത്തുവരും.” ദാവീദിന്റെ ഭവനം അവസാനിച്ചുവെന്നു തോന്നിയപ്പോൾ ദൈവം രക്ഷകനെ ഒരുക്കുകയായിരുന്നു. നമ്മുടെ ജീവിതത്തിൽ എന്തെങ്കിലും വെട്ടിവീഴ്ത്തപ്പെട്ടുവെന്നു തോന്നുമ്പോഴും ദൈവത്തിന് അതു മുളപ്പിക്കാനാകും.","മറിയവും ജോസഫും ബേത്‌ലെഹെമിൽ എങ്ങനെ എത്തിയെന്നു വിശുദ്ധ ലൂക്കാ പറയുന്നു. സ്വന്തം പദ്ധതിയനുസരിച്ചല്ല; ചക്രവർത്തി ഒരു ജനസംഖ്യാകണക്കെടുപ്പിനു കല്പിച്ചതുകൊണ്ട്. ഗർഭിണിയായ ഒരു സ്ത്രീക്കു വളരെ അസൗകര്യമുള്ള ഒരു യാത്ര! എങ്കിലും പ്രവാചകൻ വാഗ്ദാനം ചെയ്തതുപോലെ തന്റെ പുത്രൻ ദാവീദിന്റെ പട്ടണത്തിൽ ജനിക്കാൻ ദൈവം അത് ഉപയോഗിച്ചു. നമ്മുടെ ജീവിതത്തിലെ അസൗകര്യമുള്ള സംഭവങ്ങൾപോലും ദൈവത്തിന് ഉപയോഗിക്കാനാകും.","ഈ ആഴ്ച നിന്റെ കുടുംബവൃക്ഷത്തിനായി പ്രാർഥിക്കുക: വിശ്വാസം കൈമാറിത്തന്ന വല്യപ്പച്ചന്മാർക്കും വല്യമ്മച്ചിമാർക്കും പൂർവികർക്കുംവേണ്ടി. ക്രിസ്മസ് കുമ്പസാരം നടത്തുക. ക്രിസ്മസ് രാവിൽ കുടുംബത്തെ ഒരുമിച്ചുകൂട്ടി തിരുപ്പിറവിയുടെ സുവിശേഷം ഒന്നിച്ചു വായിക്കുക. രക്ഷകനെ സ്വീകരിക്കാൻ അപ്പത്തിന്റെ ഭവനമായ ബേത്‌ലെഹെമിലേക്കു നമുക്കു പോകാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങളുടെ വല്യപ്പച്ചന്മാരുടെയും വല്യമ്മച്ചിമാരുടെയും പേരുകൾ അറിയാമോ? യേശുവിനും വല്യപ്പച്ചന്മാരും അവരുടെ അപ്പന്മാരുമുണ്ടായിരുന്നു! അബ്രാഹംവരെയും ദാവീദുരാജാവുവരെയും നീളുന്ന ഒരു വലിയ പട്ടിക ബൈബിൾ തരുന്നു.","മറിയത്തിനും ജോസഫിനും ബേത്‌ലെഹെമിലേക്കു വളരെ ദൂരം നടക്കേണ്ടിവന്നു. അതു വിഷമമായിരുന്നു; പക്ഷേ ദൈവത്തിന് ഒരു പദ്ധതിയുണ്ടായിരുന്നു: ദാവീദുരാജാവിന്റെ പട്ടണത്തിൽ യേശു ജനിക്കും.","ഈ ക്രിസ്മസിനു നമ്മുടെ കുടുംബത്തിനായി ദൈവത്തിനു നന്ദി പറയാം. നമുക്ക് ഒന്നിച്ചു പറയാം: “ദൈവമേ, എന്റെ കുടുംബത്തിനു നന്ദി!”"]});

put("2026-12-25","en",{title:"Yaldo · The Nativity of our Lord",readTitle:EN.rt,
 readings:[[EN.eg,"John 1:6–18","The Word became flesh"],[EN.ot,"Genesis 21:1–8","The birth of Isaac: God brings laughter"],[EN.ot,"2 Kings 4:8–17","A son promised to the Shunammite woman"],[EN.ot,"Micah 5:1–4","From Bethlehem shall come a ruler"],[EN.ot,"Isaiah 9:1–7","For a child has been born for us"],[EN.ac,"Acts 3:20–26","God raised up his servant to bless you"],[EN.pa,"Hebrews 7:14–17","A priest for ever"],[EN.go,"Matthew 2:1–12","The Magi worship the Child"]],
 alt:"Yaldo, the Nativity of our Lord. Holy Qurbono for the people. The season of Yaldo–Denho begins.",
 verse:"And the Word became flesh and lived among us, and we have seen his glory, the glory as of a father's only son, full of grace and truth.",cite:"John 1:14",
 theo:["Tonight and today the Church sings the mystery she has waited for since Qudos Eetho: “The Word became flesh and lived among us.” The eternal Son of the Father, through whom all things were made, becomes a child, born of the Virgin Mary in Bethlehem. God has not sent a message only; he has come himself.","The prophets had seen it from far away. Isaiah: “The people who walked in darkness have seen a great light… For a child has been born for us, a son given to us… and he is named Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.” Micah: from little Bethlehem shall come one “whose origin is from of old, from ancient days”. The Child is truly man, born in time, and truly God, born of the Father before all ages.","The Old Testament births read today, Isaac to old Sarah and a son to the Shunammite woman, were births of joy against all expectation. Sarah said: “God has brought laughter for me.” In Bethlehem the joy is greater, because this Child is not only a gift of God; he is God the Gift.","In the Malankara lectionary the Gospel of Yaldo is the coming of the Magi. Strangers from the East follow a star, kneel before the Child with Mary his mother, and offer gold, frankincense and myrrh: gold for a king, incense for God, myrrh for one who will die. From the first day, Christ is revealed to the nations. Our ancestors in India received the same faith from the East; today we kneel with the Magi."],
 conn:[["The Light in the darkness.","“The light shines in the darkness, and the darkness did not overcome it” (John 1:5) fulfils Isaiah 9:2: the people in darkness have seen a great light."],["Bethlehem, the house of bread.","The Child laid in a manger, a feeding trough, will give himself as the Bread of Life (John 6:51)."],["Kings bring gifts.","Psalm 72:10 and Isaiah 60:3 foresee kings and nations coming to the light of the Lord; the Magi are their first fruits."],["A priest for ever.","Hebrews 7: the Child of Judah is the eternal High Priest. The One born in Bethlehem will offer himself on the altar of the Cross."]],
 altar:["Every Holy Qurbono is a Yaldo: the Word who became flesh in Mary's womb becomes present on the altar under the signs of bread and wine. The shepherds came to see; the Magi came to adore. We come to receive."],
 outline:[["Opening","The wait is over: from Qudos Eetho through Suboro to this night."],["Point 1 · God came himself","Not a message, but the Word made flesh. True God and true man."],["Point 2 · Light in darkness","Isaiah 9 and John 1. Name the darkness people carry tonight: grief, debt, migration, illness."],["Point 3 · The Magi","Christ for all nations. Gold, incense, myrrh: what will I offer?"],["Point 4 · Bethlehem and the altar","The manger and the altar: the Bread of Life."],["Take-home line","“God is with us; the Light has come.”"]],
 live:[["Bring someone to the Child","Invite one person who is alone this Christmas to your home or table."],["Offer your gifts","Give one gift this week to someone who cannot repay you."],["Keep the crib","Pray before the crib at home every night until Denho."]],
 fathers:[["St Ephrem the Syrian","“Blessed is the Child who gladdened Bethlehem today!” In his Nativity hymns he marvels that the Lord of all lies in the arms of Mary, the Ancient of Days a little child (Hymns on the Nativity)."],["St Leo the Great","“Our Saviour, dearly beloved, was born today: let us rejoice. There is no room for sadness on the birthday of Life… Christian, recognise your dignity” (Sermon 21 on the Nativity)."]],
 magis:[["Catechism 456–460","The Word became flesh to save us, to make us know God's love, to be our model of holiness, and to make us partakers of the divine nature."],["Catechism 525–528","Christmas and the Epiphany: Jesus born in poverty, revealed to the shepherds and to the nations."],["Admirabile Signum (2019)","Pope Francis on the meaning of the Christmas crib: it shows God's tenderness and invites us to become small."]],
 saints:[["The days after Yaldo","26 Dec: the Exaltation of Mary, Mother of God. 27 Dec: Commemoration of the Infants killed by Herod (as in the 2025–26 lectionary)."]],
 prayer:"Lord Jesus Christ, eternal Word made flesh, born of the Virgin Mary in Bethlehem, we kneel before you with the shepherds and the Magi. Fill our homes with your light, our hearts with your peace, and our lives with your joy. Glory to God in the highest, and on earth peace. Amen."},
 {quick:["The Word became flesh: God came himself.","The Light shines in the darkness, and the darkness has not overcome it.","The Magi kneel: Christ is born for all nations."],action:"Invite someone who is alone to share your Christmas meal.",question:"What gift will I bring to the Child this Christmas?",
  special:"Yaldo, the Nativity of our Lord: a day of obligation; Holy Qurbono for the people.",
  illus:["An illustration","On Christmas night every Kerala home hangs a star at the door. A small paper star says to every passer-by: here a family is waiting for Christ. The Magi followed a star to a house where they found the Child; may our stars lead others to him."],kids:"",diaspora:"",
  family:{read:"Read together at the crib: Luke 2:1–14.",explain:"Jesus, God's Son, was born as a little baby in Bethlehem. Angels sang, shepherds came, and later wise men brought gifts. God loves us so much that he came to be with us.",intention:"We pray for families who are sad or alone this Christmas, and for peace in the world.",ask:"Ask: “What gift can each of us give Jesus this year?”"},
  catechism:[["CCC 456–460","Why the Word became flesh."],["CCC 525–528","The mysteries of Jesus' infancy."]],
  kidsaint:["The Wise Men","Learned men from the East who followed a star a long way to find the newborn King. When they found Jesus with Mary, they knelt down and gave him their best gifts. Lesson: look for Jesus, and give him your best."],
  term:["The Fire Service of Yaldo","In the Malankara tradition the night service of Yaldo includes a fire, lit with frankincense and often with the palm leaves kept from Hosanna Sunday, while the Gloria of the angels is sung. It proclaims Christ, the Light of the world, born in the night."],
  termMore:["Yaldo–Denho","The second season of the Syro-Malankara year: from the Nativity (Yaldo) through the Baptism of the Lord (Denho, 6 January), celebrating God's manifestation in Christ."]},
 {homily:["Dear brothers and sisters, a happy and blessed Yaldo to all of you! Since Qudos Eetho we have walked through the season of Suboro: the angel in the Temple, the angel in Nazareth, the Visitation, the birth of John, the dream of Joseph. Tonight the waiting is over. “The Word became flesh and lived among us.”","God did not send us only a letter or a messenger. He came himself. The One who made the stars lies in a manger. The One whom heaven cannot contain is held in Mary's arms. That is the wonder of this night: the eternal Son of God is truly one of us, true God and true man.","Isaiah said: “The people who walked in darkness have seen a great light.” Many of us bring some darkness to church tonight: a grave visited this year, a son or daughter far away, a debt, an illness, a broken relationship. The Light has come exactly for that darkness. And the darkness has not overcome it.","Our Gospel tells of the Magi, strangers from the East, who followed a star and knelt before the Child with Mary his mother. They offered gold, frankincense and myrrh. What will we offer? Perhaps a reconciliation, a new start at prayer, a gift to someone in need. Come, let us adore him. And in a few moments, at this altar, the same Lord comes to us as the Bread of Life. Glory to God in the highest! Amen."],
  kids:["Children, happy Christmas! Tonight we celebrate Jesus' birthday. God loved us so much that he sent his Son as a tiny baby, born in Bethlehem.","Angels sang, shepherds came running, and wise men followed a bright star to bring him gifts: gold, incense and myrrh.","What gift can you give Jesus? A kind heart, a prayer, sharing your toys! Let's sing with the angels: “Glory to God in the highest!”"]});

put("2026-12-25","ml",{title:"യൽദോ · നമ്മുടെ കർത്താവിന്റെ തിരുപ്പിറവി",readTitle:ML.rt,
 readings:[[ML.eg,"യോഹന്നാൻ 1:6–18","വചനം മാംസമായി"],[ML.ot,"ഉൽപത്തി 21:1–8","ഇസഹാക്കിന്റെ ജനനം: ദൈവം സന്തോഷം നൽകുന്നു"],[ML.ot,"2 രാജാക്കന്മാർ 4:8–17","ഷൂനേംകാരിക്ക് ഒരു പുത്രന്റെ വാഗ്ദാനം"],[ML.ot,"മിക്കാ 5:1–4","ബേത്‌ലെഹെമിൽനിന്ന് ഒരു ഭരണാധികാരി"],[ML.ot,"ഏശയ്യാ 9:1–7","നമുക്ക് ഒരു ശിശു ജനിച്ചിരിക്കുന്നു"],[ML.ac,"അപ്പ. പ്രവ. 3:20–26","നിങ്ങളെ അനുഗ്രഹിക്കാൻ ദൈവം തന്റെ ദാസനെ ഉയർത്തി"],[ML.pa,"ഹെബ്രായർ 7:14–17","എന്നേക്കും പുരോഹിതൻ"],[ML.go,"മത്തായി 2:1–12","ജ്ഞാനികൾ ശിശുവിനെ ആരാധിക്കുന്നു"]],
 alt:"യൽദോ, നമ്മുടെ കർത്താവിന്റെ തിരുപ്പിറവി. ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. യൽദോ–ദനഹാക്കാലം ആരംഭിക്കുന്നു.",
 verse:"വചനം മാംസമായി നമ്മുടെയിടയിൽ വസിച്ചു. അവന്റെ മഹത്വം നമ്മൾ ദർശിച്ചു - കൃപയും സത്യവും നിറഞ്ഞതും പിതാവിന്റെ ഏകജാതന്റേതുമായ മഹത്വം.",cite:"യോഹന്നാൻ 1:14",
 theo:["കൂദോശ് ഈത്തോമുതൽ കാത്തിരുന്ന രഹസ്യം ഈ രാത്രിയിലും പകലിലും സഭ പാടുന്നു: “വചനം മാംസമായി നമ്മുടെയിടയിൽ വസിച്ചു.” സകലവും ആരിലൂടെ സൃഷ്ടിക്കപ്പെട്ടുവോ, പിതാവിന്റെ ആ നിത്യപുത്രൻ ബേത്‌ലെഹെമിൽ കന്യകാമറിയത്തിൽനിന്നു ജനിച്ച് ഒരു ശിശുവാകുന്നു. ദൈവം ഒരു സന്ദേശം മാത്രമല്ല അയച്ചത്; അവിടുന്നുതന്നെ വന്നു.","പ്രവാചകന്മാർ ദൂരെനിന്ന് ഇതു കണ്ടിരുന്നു. ഏശയ്യാ: “അന്ധകാരത്തിൽ കഴിഞ്ഞ ജനം മഹത്തായ ഒരു പ്രകാശം കണ്ടു… നമുക്ക് ഒരു ശിശു ജനിച്ചിരിക്കുന്നു. നമുക്ക് ഒരു പുത്രൻ നൽകപ്പെട്ടിരിക്കുന്നു… വിസ്മയനീയനായ ഉപദേഷ്ടാവ്, ശക്തനായ ദൈവം, നിത്യനായ പിതാവ്, സമാധാനത്തിന്റെ രാജാവ് എന്ന് അവൻ വിളിക്കപ്പെടും.” മിക്കാ: ചെറിയ ബേത്‌ലെഹെമിൽനിന്നു “പണ്ടേ, യുഗങ്ങൾക്കുമുൻപേ, ഉള്ളവൻ” പുറപ്പെടും. ശിശു കാലത്തിൽ ജനിച്ച യഥാർഥ മനുഷ്യനും, യുഗങ്ങൾക്കുമുമ്പേ പിതാവിൽനിന്നു ജനിച്ച യഥാർഥ ദൈവവുമാണ്.","ഇന്നു വായിക്കുന്ന പഴയനിയമജനനങ്ങൾ, വൃദ്ധയായ സാറായ്ക്ക് ഇസഹാക്കും ഷൂനേംകാരിക്ക് ഒരു പുത്രനും, എല്ലാ പ്രതീക്ഷകൾക്കുമെതിരേയുള്ള സന്തോഷത്തിന്റെ ജനനങ്ങളായിരുന്നു. സാറാ പറഞ്ഞു: “എനിക്കു സന്തോഷിക്കാൻ ദൈവം വക നൽകിയിരിക്കുന്നു.” ബേത്‌ലെഹെമിലെ സന്തോഷം അതിലും വലുതാണ്; കാരണം ഈ ശിശു ദൈവത്തിന്റെ ഒരു ദാനം മാത്രമല്ല; ദാനമായ ദൈവംതന്നെയാണ്.","മലങ്കര വായനാപുസ്തകത്തിൽ യൽദോയുടെ സുവിശേഷം ജ്ഞാനികളുടെ വരവാണ്. കിഴക്കുനിന്നുള്ള അപരിചിതർ ഒരു നക്ഷത്രത്തെ പിന്തുടരുന്നു; “ശിശുവിനെ അമ്മയായ മറിയത്തോടുകൂടി കാണുകയും അവനെ കുമ്പിട്ട് ആരാധിക്കുകയും ചെയ്തു. നിക്ഷേപപാത്രങ്ങൾ തുറന്ന് പൊന്നും കുന്തുരുക്കവും മീറയും കാഴ്ചയർപ്പിച്ചു.” രാജാവിനു പൊന്ന്, ദൈവത്തിനു കുന്തുരുക്കം, മരിക്കാനിരിക്കുന്നവനു മീറ. ആദ്യദിവസംമുതൽ ക്രിസ്തു ജനതകൾക്കു വെളിപ്പെടുത്തപ്പെടുന്നു. ഭാരതത്തിലെ നമ്മുടെ പൂർവികർക്കും അതേ വിശ്വാസം ലഭിച്ചു; ഇന്നു നാം ജ്ഞാനികളോടൊപ്പം മുട്ടുകുത്തുന്നു."],
 conn:[["ഇരുളിലെ വെളിച്ചം.","“ആ വെളിച്ചം ഇരുളിൽ പ്രകാശിക്കുന്നു; അതിനെ കീഴടക്കാൻ ഇരുളിനു കഴിഞ്ഞില്ല” (യോഹ 1:5) എന്നത് ഏശയ്യാ 9:2 നിറവേറ്റുന്നു: അന്ധകാരത്തിൽ കഴിഞ്ഞ ജനം മഹത്തായ ഒരു പ്രകാശം കണ്ടു."],["അപ്പത്തിന്റെ ഭവനമായ ബേത്‌ലെഹെം.","പുൽത്തൊട്ടിയിൽ കിടത്തപ്പെട്ട ശിശു ജീവന്റെ അപ്പമായി തന്നെത്തന്നെ നൽകും (യോഹ 6:51)."],["രാജാക്കന്മാർ കാഴ്ചകൾ കൊണ്ടുവരുന്നു.","രാജാക്കന്മാരും ജനതകളും കർത്താവിന്റെ പ്രകാശത്തിലേക്കു വരുന്നതു സങ്കീർത്തനം 72:10-ഉം ഏശയ്യാ 60:3-ഉം മുൻകൂട്ടി കാണുന്നു: “ജനതകൾ നിന്റെ പ്രകാശത്തിലേക്കും രാജാക്കന്മാർ നിന്റെ ഉദയശോഭയിലേക്കും വരും.” ജ്ഞാനികൾ അവരുടെ ആദ്യഫലമാണ്."],["എന്നേക്കും പുരോഹിതൻ.","ഹെബ്രായർ 7: യൂദായുടെ ശിശു നിത്യപ്രധാനപുരോഹിതനാണ്. ബേത്‌ലെഹെമിൽ ജനിച്ചവൻ കുരിശിന്റെ ബലിപീഠത്തിൽ തന്നെത്തന്നെ അർപ്പിക്കും."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയും ഒരു യൽദോയാണ്: മറിയത്തിന്റെ ഉദരത്തിൽ മാംസമായ വചനം അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയും അടയാളങ്ങളിൽ ബലിപീഠത്തിൽ സന്നിഹിതനാകുന്നു. ആട്ടിടയന്മാർ കാണാൻ വന്നു; ജ്ഞാനികൾ ആരാധിക്കാൻ വന്നു. നാം സ്വീകരിക്കാൻ വരുന്നു."],
 outline:[["ആരംഭം","കാത്തിരിപ്പ് അവസാനിച്ചു: കൂദോശ് ഈത്തോമുതൽ സൂബോറോയിലൂടെ ഈ രാത്രിവരെ."],["ഒന്നാം ആശയം · ദൈവം തന്നെ വന്നു","ഒരു സന്ദേശമല്ല, മാംസമായ വചനം. യഥാർഥ ദൈവവും യഥാർഥ മനുഷ്യനും."],["രണ്ടാം ആശയം · ഇരുളിൽ വെളിച്ചം","ഏശയ്യാ 9-ഉം യോഹന്നാൻ 1-ഉം. ഈ രാത്രി ആളുകൾ വഹിക്കുന്ന ഇരുളിനു പേരു പറയുക: ദുഃഖം, കടം, പ്രവാസം, രോഗം."],["മൂന്നാം ആശയം · ജ്ഞാനികൾ","എല്ലാ ജനതകൾക്കുമുള്ള ക്രിസ്തു. പൊന്ന്, കുന്തുരുക്കം, മീറ: ഞാൻ എന്താണു കാഴ്ചവയ്ക്കുക?"],["നാലാം ആശയം · ബേത്‌ലെഹെമും ബലിപീഠവും","പുൽത്തൊട്ടിയും ബലിപീഠവും: ജീവന്റെ അപ്പം."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ദൈവം നമ്മോടുകൂടെ; വെളിച്ചം വന്നിരിക്കുന്നു.”"]],
 live:[["ഒരാളെ ശിശുവിന്റെ അടുത്തേക്കു കൊണ്ടുവരുക","ഈ ക്രിസ്മസിന് ഒറ്റയ്ക്കായിരിക്കുന്ന ഒരാളെ നിന്റെ വീട്ടിലേക്കോ ഭക്ഷണമേശയിലേക്കോ ക്ഷണിക്കുക."],["നിന്റെ കാഴ്ചകൾ അർപ്പിക്കുക","തിരികെ നൽകാൻ കഴിയാത്ത ഒരാൾക്ക് ഈ ആഴ്ച ഒരു സമ്മാനം നൽകുക."],["പുൽക്കൂട് സൂക്ഷിക്കുക","ദനഹാവരെ എല്ലാ രാത്രിയും വീട്ടിലെ പുൽക്കൂടിനു മുമ്പിൽ പ്രാർഥിക്കുക."]],
 fathers:[["മാർ അപ്രേം","“ഇന്നു ബേത്‌ലെഹെമിനെ ആനന്ദിപ്പിച്ച ശിശു വാഴ്ത്തപ്പെട്ടവൻ!” സകലത്തിന്റെയും കർത്താവു മറിയത്തിന്റെ കരങ്ങളിൽ കിടക്കുന്നതിലും, പുരാതനനായവൻ ഒരു കൊച്ചുശിശുവായതിലും അദ്ദേഹം തിരുപ്പിറവിഗീതങ്ങളിൽ വിസ്മയിക്കുന്നു (തിരുപ്പിറവിഗീതങ്ങൾ)."],["മഹാനായ വിശുദ്ധ ലെയോ","പ്രിയപ്പെട്ടവരേ, നമ്മുടെ രക്ഷകൻ ഇന്നു ജനിച്ചു: നമുക്ക് ആനന്ദിക്കാം. ജീവന്റെ ജന്മദിനത്തിൽ ദുഃഖത്തിന് ഇടമില്ല… ക്രിസ്ത്യാനീ, നിന്റെ മഹത്വം തിരിച്ചറിയുക (തിരുപ്പിറവിപ്രസംഗം 21)."]],
 magis:[["മതബോധനഗ്രന്ഥം 456–460","നമ്മെ രക്ഷിക്കാനും ദൈവസ്നേഹം അറിയിക്കാനും വിശുദ്ധിയുടെ മാതൃകയാകാനും ദൈവികസ്വഭാവത്തിൽ നമ്മെ പങ്കുകാരാക്കാനുമാണു വചനം മാംസമായത്."],["മതബോധനഗ്രന്ഥം 525–528","ക്രിസ്മസും ദനഹായും: ദാരിദ്ര്യത്തിൽ ജനിച്ച്, ആട്ടിടയന്മാർക്കും ജനതകൾക്കും വെളിപ്പെടുത്തപ്പെട്ട യേശു."],["അദ്ഭുതകരമായ അടയാളം (അദ്മിരാബിലെ സിഞ്ഞും, 2019)","ക്രിസ്മസ് പുൽക്കൂടിന്റെ അർഥത്തെപ്പറ്റി ഫ്രാൻസിസ് മാർപാപ്പ: അതു ദൈവത്തിന്റെ ആർദ്രത കാണിക്കുന്നു; ചെറുതാകാൻ നമ്മെ ക്ഷണിക്കുന്നു."]],
 saints:[["യൽദോയ്ക്കുശേഷമുള്ള ദിവസങ്ങൾ","ഡിസംബർ 26: ദൈവമാതാവായ മറിയത്തിന്റെ പുകഴ്ച. ഡിസംബർ 27: ഹേറോദേസ് കൊന്ന ശിശുക്കളുടെ ഓർമ (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ)."]],
 prayer:"മാംസമായ നിത്യവചനവും ബേത്‌ലെഹെമിൽ കന്യകാമറിയത്തിൽനിന്നു ജനിച്ചവനുമായ കർത്താവായ യേശുമിശിഹായേ, ആട്ടിടയന്മാരോടും ജ്ഞാനികളോടുമൊപ്പം ഞങ്ങൾ അങ്ങയുടെ മുമ്പിൽ മുട്ടുകുത്തുന്നു. ഞങ്ങളുടെ ഭവനങ്ങളെ അങ്ങയുടെ പ്രകാശംകൊണ്ടും ഹൃദയങ്ങളെ അങ്ങയുടെ സമാധാനംകൊണ്ടും ജീവിതങ്ങളെ അങ്ങയുടെ സന്തോഷംകൊണ്ടും നിറയ്ക്കണമേ. അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്വം! ഭൂമിയിൽ ദൈവകൃപ ലഭിച്ചവർക്കു സമാധാനം! ആമേൻ."},
 {quick:["വചനം മാംസമായി: ദൈവം തന്നെ വന്നു.","വെളിച്ചം ഇരുളിൽ പ്രകാശിക്കുന്നു; ഇരുളിന് അതിനെ കീഴടക്കാനായില്ല.","ജ്ഞാനികൾ മുട്ടുകുത്തുന്നു: എല്ലാ ജനതകൾക്കുംവേണ്ടി ക്രിസ്തു ജനിച്ചിരിക്കുന്നു."],action:"ഒറ്റയ്ക്കായിരിക്കുന്ന ഒരാളെ നിന്റെ ക്രിസ്മസ് ഭക്ഷണത്തിലേക്കു ക്ഷണിക്കുക.",question:"ഈ ക്രിസ്മസിനു ഞാൻ ശിശുവിന് എന്തു കാഴ്ചയാണു കൊണ്ടുവരുക?",
  special:"യൽദോ, നമ്മുടെ കർത്താവിന്റെ തിരുപ്പിറവി: കടമുള്ള ദിവസം; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന.",
  illus:["ഒരു ഉദാഹരണം","ക്രിസ്മസ് രാത്രിയിൽ കേരളത്തിലെ ഓരോ വീടും വാതിൽക്കൽ ഒരു നക്ഷത്രം തൂക്കുന്നു. ഒരു ചെറിയ കടലാസുനക്ഷത്രം വഴിപോക്കരോടെല്ലാം പറയുന്നു: ഇവിടെ ഒരു കുടുംബം ക്രിസ്തുവിനായി കാത്തിരിക്കുന്നു. ജ്ഞാനികൾ ഒരു നക്ഷത്രത്തെ പിന്തുടർന്ന് ശിശുവിനെ കണ്ടെത്തിയ ഭവനത്തിലെത്തി; നമ്മുടെ നക്ഷത്രങ്ങൾ മറ്റുള്ളവരെ അവിടുത്തെ അടുത്തേക്കു നയിക്കട്ടെ."],kids:"",diaspora:"",
  family:{read:"പുൽക്കൂടിനു മുമ്പിൽ ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 2:1–14.",explain:"ദൈവപുത്രനായ യേശു ബേത്‌ലെഹെമിൽ ഒരു കുഞ്ഞുവാവയായി ജനിച്ചു. മാലാഖമാർ പാടി, ആട്ടിടയന്മാർ വന്നു, പിന്നീടു ജ്ഞാനികൾ സമ്മാനങ്ങളുമായി വന്നു. നമ്മോടൊപ്പമായിരിക്കാൻ വരുന്നത്ര ദൈവം നമ്മെ സ്നേഹിക്കുന്നു.",intention:"ഈ ക്രിസ്മസിനു ദുഃഖിതരോ ഒറ്റയ്ക്കോ ആയ കുടുംബങ്ങൾക്കും ലോകസമാധാനത്തിനുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ വർഷം നമ്മളോരോരുത്തർക്കും യേശുവിന് എന്തു സമ്മാനം നൽകാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 456–460","വചനം മാംസമായത് എന്തിന്."],["മതബോധനഗ്രന്ഥം 525–528","യേശുവിന്റെ ബാല്യത്തിലെ രഹസ്യങ്ങൾ."]],
  kidsaint:["ജ്ഞാനികൾ","പുതുതായി ജനിച്ച രാജാവിനെ കണ്ടെത്താൻ ഒരു നക്ഷത്രത്തെ പിന്തുടർന്നു വളരെ ദൂരം യാത്ര ചെയ്ത കിഴക്കുനിന്നുള്ള പണ്ഡിതന്മാർ. മറിയത്തോടൊപ്പം യേശുവിനെ കണ്ടപ്പോൾ അവർ മുട്ടുകുത്തി അവരുടെ ഏറ്റവും നല്ല സമ്മാനങ്ങൾ നൽകി. പാഠം: യേശുവിനെ അന്വേഷിക്കുക; നിന്റെ ഏറ്റവും നല്ലത് അവിടുത്തേക്കു നൽകുക."],
  term:["യൽദോയിലെ തീജ്വാലാശുശ്രൂഷ","മലങ്കര പാരമ്പര്യത്തിൽ യൽദോയുടെ രാത്രിശുശ്രൂഷയിൽ, മാലാഖമാരുടെ സ്തുതിഗീതം പാടുമ്പോൾ, കുന്തുരുക്കവും പലപ്പോഴും ഓശാന ഞായറിൽനിന്നു സൂക്ഷിച്ച കുരുത്തോലയുംകൊണ്ട് അഗ്നി കത്തിക്കുന്നു. രാത്രിയിൽ ജനിച്ച ലോകത്തിന്റെ പ്രകാശമായ ക്രിസ്തുവിനെ അതു പ്രഘോഷിക്കുന്നു."],
  termMore:["യൽദോ–ദനഹാ","സീറോ മലങ്കര വർഷത്തിലെ രണ്ടാം കാലം: തിരുപ്പിറവിമുതൽ (യൽദോ) കർത്താവിന്റെ മാമ്മോദീസവരെ (ദനഹാ, ജനുവരി 6), ക്രിസ്തുവിലുള്ള ദൈവത്തിന്റെ വെളിപ്പെടുത്തൽ ആഘോഷിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, നിങ്ങൾക്കെല്ലാവർക്കും സന്തോഷവും അനുഗ്രഹവും നിറഞ്ഞ യൽദോ! കൂദോശ് ഈത്തോമുതൽ സൂബോറോക്കാലത്തിലൂടെ നാം നടന്നു: ദേവാലയത്തിലെ ദൂതൻ, നസറത്തിലെ ദൂതൻ, സന്ദർശനം, യോഹന്നാന്റെ ജനനം, ജോസഫിന്റെ സ്വപ്നം. ഈ രാത്രി കാത്തിരിപ്പ് അവസാനിച്ചു. “വചനം മാംസമായി നമ്മുടെയിടയിൽ വസിച്ചു.”","ദൈവം നമുക്ക് ഒരു കത്തോ ഒരു ദൂതനെയോ മാത്രമല്ല അയച്ചത്. അവിടുന്നുതന്നെ വന്നു. നക്ഷത്രങ്ങളെ സൃഷ്ടിച്ചവൻ ഒരു പുൽത്തൊട്ടിയിൽ കിടക്കുന്നു. സ്വർഗത്തിന് ഉൾക്കൊള്ളാനാകാത്തവനെ മറിയം കൈകളിൽ വഹിക്കുന്നു. അതാണ് ഈ രാത്രിയുടെ അദ്ഭുതം: ദൈവത്തിന്റെ നിത്യപുത്രൻ യഥാർഥത്തിൽ നമ്മിലൊരാളാണ്, യഥാർഥ ദൈവവും യഥാർഥ മനുഷ്യനും.","ഏശയ്യാ പറഞ്ഞു: “അന്ധകാരത്തിൽ കഴിഞ്ഞ ജനം മഹത്തായ ഒരു പ്രകാശം കണ്ടു.” നമ്മിൽ പലരും ഈ രാത്രി എന്തെങ്കിലും ഇരുളുമായാണു പള്ളിയിൽ വന്നിരിക്കുന്നത്: ഈ വർഷം സന്ദർശിച്ച ഒരു കല്ലറ, ദൂരെയുള്ള ഒരു മകനോ മകളോ, ഒരു കടം, ഒരു രോഗം, തകർന്ന ഒരു ബന്ധം. ആ ഇരുളിനുവേണ്ടിത്തന്നെയാണു വെളിച്ചം വന്നിരിക്കുന്നത്. ഇരുളിന് അതിനെ കീഴടക്കാനായില്ല.","ഒരു നക്ഷത്രത്തെ പിന്തുടർന്ന്, അമ്മയായ മറിയത്തോടുകൂടി ശിശുവിന്റെ മുമ്പിൽ മുട്ടുകുത്തിയ, കിഴക്കുനിന്നുള്ള അപരിചിതരായ ജ്ഞാനികളെപ്പറ്റി നമ്മുടെ സുവിശേഷം പറയുന്നു. അവർ പൊന്നും കുന്തുരുക്കവും മീറയും കാഴ്ചയർപ്പിച്ചു. നാം എന്താണ് അർപ്പിക്കുക? ഒരുപക്ഷേ ഒരു അനുരഞ്ജനം, പ്രാർഥനയിൽ ഒരു പുതിയ തുടക്കം, ആവശ്യക്കാരനു ഒരു സമ്മാനം. വരുവിൻ, നമുക്ക് അവിടുത്തെ ആരാധിക്കാം. അൽപസമയത്തിനകം ഈ ബലിപീഠത്തിൽ അതേ കർത്താവു ജീവന്റെ അപ്പമായി നമ്മിലേക്കു വരുന്നു. അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്വം! ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഹാപ്പി ക്രിസ്മസ്! ഇന്നു നാം യേശുവിന്റെ ജന്മദിനം ആഘോഷിക്കുന്നു. ദൈവം നമ്മെ അത്രയധികം സ്നേഹിച്ചതുകൊണ്ടു തന്റെ പുത്രനെ ബേത്‌ലെഹെമിൽ ജനിച്ച ഒരു കുഞ്ഞുവാവയായി അയച്ചു.","മാലാഖമാർ പാടി, ആട്ടിടയന്മാർ ഓടിവന്നു, ജ്ഞാനികൾ തിളങ്ങുന്ന ഒരു നക്ഷത്രത്തെ പിന്തുടർന്നു സമ്മാനങ്ങൾ കൊണ്ടുവന്നു: പൊന്ന്, കുന്തുരുക്കം, മീറ.","യേശുവിനു നിങ്ങൾക്ക് എന്തു സമ്മാനം നൽകാം? ദയയുള്ള ഒരു ഹൃദയം, ഒരു പ്രാർഥന, കളിപ്പാട്ടങ്ങൾ പങ്കുവയ്ക്കൽ! മാലാഖമാരോടൊപ്പം നമുക്കു പാടാം: “അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്വം!”"]});
