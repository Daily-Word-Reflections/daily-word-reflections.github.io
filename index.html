put("2026-12-27","en",{title:"First Sunday after Yaldo",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 2:19–23","The return from Egypt to Nazareth"],[EN.ot,"Genesis 21:8–14","Isaac grows; Hagar and Ishmael"],[EN.ot,"Judges 13:24–14:4","The boy Samson grows and the Lord blesses him"],[EN.ot,"Psalm 122:1–9","Let us go to the house of the Lord"],[EN.ot,"Zechariah 8:3–12","Old and young in the streets of Jerusalem"],[EN.ce,"1 Peter 5:5–11","Clothe yourselves with humility"],[EN.pa,"Hebrews 3:1–6","Christ, faithful as a Son over God's house"],[EN.go,"Luke 2:41–52","The boy Jesus in the Temple"]],
 alt:"Season of Yaldo–Denho. Today is also the Commemoration of the Infants killed by Herod (27 December, as in the 2025–26 lectionary).",
 verse:"Then he went down with them and came to Nazareth, and was obedient to them. His mother treasured all these things in her heart.",cite:"Luke 2:51",
 theo:["Two days after Yaldo the Church turns to the hidden life of the Holy Family. Matthew tells how Joseph, warned in a dream, brought the Child and his mother back from Egypt and “made his home in a town called Nazareth”. Luke shows the family going up each year to Jerusalem for the Passover. The Son of God grows up in an ordinary family, in an ordinary village, keeping the ordinary feasts of his people.","At twelve, Jesus stays behind in the Temple. After three days of anxious searching his parents find him “sitting among the teachers, listening to them and asking them questions.” Mary says, “Your father and I have been searching for you in great anxiety.” Jesus answers: “Why were you searching for me? Did you not know that I must be in my Father's house?” His first recorded words reveal who his true Father is.","And yet, the Gospel says, “he went down with them and came to Nazareth, and was obedient to them.” The eternal Son obeys a carpenter and a village woman. Hebrews says Christ is “faithful over God's house as a son, and we are his house”. The family of Nazareth is the school where the Son of God learned to be human: to work, to pray, to obey and to grow “in wisdom and in years, and in divine and human favor”.","Zechariah's vision of Jerusalem is a picture of a blessed family and city: “Old men and old women shall again sit in the streets… and the streets of the city shall be full of boys and girls playing.” Families where the old are honoured and children are safe and joyful are signs of God's kingdom. Today we also remember the infants killed by Herod: the Church has always honoured them as martyrs, and with them we pray for every threatened child."],
 conn:[["Out of Egypt.","Like Israel, and like Joseph son of Jacob, the Child goes down to Egypt and comes up again (Hosea 11:1; Matthew 2:15). He relives his people's story to save it."],["Growing in grace.","Samson grew “and the LORD blessed him” (Judges 13:24); Isaac grew and was weaned (Genesis 21:8); Jesus “increased in wisdom and in years” (Luke 2:52)."],["Going up to the house of the Lord.","Psalm 122, “I was glad when they said to me, Let us go to the house of the LORD”, was a pilgrim song. The Holy Family sang such psalms on the road to Jerusalem."],["Mary's heart.","Twice Luke says Mary kept these things in her heart (2:19, 51). She is the first contemplative of the Gospel."]],
 altar:["The boy Jesus said he must be in his Father's house. Every Sunday we too are called to our Father's house, the church, to listen and to receive. Families who come to Holy Qurbono together are walking the road of Nazareth to Jerusalem."],
 outline:[["Opening","Ask parents: have you ever lost a child for a few minutes in a crowd? Recall that fear."],["Point 1 · God in an ordinary family","Nazareth: work, prayer, obedience, feasts. Holiness is possible at home."],["Point 2 · “My Father's house”","Jesus' first words: his identity and mission. Teach children that the church is their Father's house."],["Point 3 · Obedience and growth","The Son of God obeyed. Children obey, parents listen, all grow."],["Point 4 · The Holy Innocents","Pray for every threatened child: the unborn, the abused, children of war."],["Take-home line","“Our home can be a Nazareth.”"]],
 live:[["Pray together as a family","Choose one fixed time for family prayer every day this week, even ten minutes."],["Bring children to the Father's house","Come to Holy Qurbono as a family, sitting together, and talk about the Gospel on the way home."],["Honour the elderly (Zechariah 8:4)","Visit or call grandparents and older relatives during this Christmas season."]],
 fathers:[["St Ambrose of Milan","He notes that Jesus, at twelve, shows his divinity in the Temple and his humanity in submitting to his parents: the One who is Lord of all becomes subject out of love (Exposition of the Gospel of Luke 2)."],["St Ephrem the Syrian","He sings of the Child of Nazareth who grew in the house of Joseph, the Son of the Most High obeying a carpenter, and of Mary who was mother and disciple at once (Hymns on the Nativity)."]],
 magis:[["Catechism 531–534","The hidden life at Nazareth: Jesus shares the condition of the vast majority of people, a daily life of manual work, obedience and prayer; the finding in the Temple reveals his total consecration to the Father."],["Amoris Laetitia 65–66","The Holy Family of Nazareth is a model and a light for every family; the covenant of love is lived in daily life."],["Catechism 1655–1666","The Christian family as the domestic Church."]],
 saints:[["This week (fixed dates)","27 Dec: Commemoration of the Infants killed by Herod. 1 Jan: Naming of our Lord; New Year. 2 Jan: Mar Baselios and Mar Gregory, name day of our Major Archbishop-Catholicos Moran Mor Baselios Cardinal Cleemis. 3 Jan: St Kuriakose Elias Chavara. Confirm in the 2026–27 lectionary."]],
 prayer:"Lord Jesus, you grew up in the home of Mary and Joseph at Nazareth, obedient to them and busy with your Father's affairs. Bless our families: make our homes places of prayer, work and love, protect every child, and honour every elder. Amen."},
 {quick:["The Son of God grew up in an ordinary family at Nazareth.","“I must be in my Father's house”: Jesus' first words.","He went down to Nazareth and was obedient: holiness at home."],action:"Set a fixed time for family prayer every day this week.",question:"Is my home a little Nazareth?",
  special:"First Sunday after Yaldo. Commemoration of the Infants killed by Herod.",
  illus:["An illustration","A Kerala father once lost his small son at a crowded church festival. For an hour he ran from stall to stall. When he found the boy sitting calmly near the altar, he did not know whether to scold him or hold him. Mary and Joseph knew that feeling."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 2:41–52.",explain:"When Jesus was twelve, he stayed behind in the Temple, and his parents searched for him for three days. Jesus said the Temple was his Father's house. Then he went home with them and obeyed them.",intention:"We pray for our family, that we may love, obey and help one another like the Holy Family.",ask:"Ask: “How can each of us make our home more like Nazareth this week?”"},
  catechism:[["CCC 531–534","The hidden life at Nazareth."],["CCC 2204–2206","The Christian family, a communion of persons."]],
  kidsaint:["The Holy Family of Nazareth","Jesus, Mary and Joseph lived in a small house. Joseph worked as a carpenter, Mary cared for the home, and Jesus helped and obeyed them. They prayed together and went to the Temple. Lesson: your family can be holy too."],
  term:["Nazareth","The small village in Galilee where Jesus grew up and lived about thirty years. Christians were first nicknamed “Nazarenes” (Acts 24:5); in Kerala the old name “Nasrani” for St Thomas Christians comes from the same word."],
  termMore:["The Holy Innocents","The children of Bethlehem killed by Herod (Matthew 2:16–18). The Church honours them as the first martyrs for Christ, who died not speaking but in his place."]},
 {homily:["Dear brothers and sisters, two days after Yaldo, the Church takes us into the house at Nazareth. The Son of God did not grow up in a palace. He lived in a small village, in a carpenter's home, with Mary and Joseph, keeping the feasts of his people.","Every year they went up to Jerusalem for the Passover. When Jesus was twelve, he stayed behind in the Temple. Parents here know the fear Mary and Joseph felt: three days of searching! When they found him, Jesus said: “Did you not know that I must be in my Father's house?” These are his first words in the Gospel. He knew who his true Father was.","And yet the next verse says: “he went down with them and came to Nazareth, and was obedient to them.” The Lord of heaven obeyed a carpenter and a village mother. For about thirty years he lived a hidden life of work, prayer and obedience. Holiness does not begin in great deeds; it begins at home.","Today we also remember the little children killed by Herod. Let us pray for every child in danger: the unborn, children who suffer violence, children of war and hunger. And let us make our homes little Nazareths: with daily family prayer, respect for elders, and joy for children. Amen."],
  kids:["Children, when Jesus was twelve, he went with Mary and Joseph to the big Temple in Jerusalem. On the way home, they couldn't find him! They searched for three days.","They found Jesus in the Temple, listening and asking questions. He said: “This is my Father's house!” Then he went home and obeyed Mary and Joseph.","Jesus obeyed his parents. Can you do that too? Let's say: “Like Jesus, I will love and obey!”"]});

put("2026-12-27","ml",{title:"യൽദോയ്ക്കുശേഷമുള്ള ഒന്നാം ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 2:19–23","ഈജിപ്തിൽനിന്നു നസറത്തിലേക്കുള്ള മടക്കം"],[ML.ot,"ഉൽപത്തി 21:8–14","ഇസഹാക്ക് വളരുന്നു; ഹാഗാറും ഇസ്മായേലും"],[ML.ot,"ന്യായാധിപന്മാർ 13:24–14:4","ബാലനായ സാംസൺ വളരുന്നു; കർത്താവ് അവനെ അനുഗ്രഹിക്കുന്നു"],[ML.ot,"സങ്കീർത്തനം 122:1–9","കർത്താവിന്റെ ആലയത്തിലേക്കു നമുക്കു പോകാം"],[ML.ot,"സഖറിയാ 8:3–12","ജറുസലെമിന്റെ തെരുവുകളിൽ വൃദ്ധരും കുട്ടികളും"],[ML.ce,"1 പത്രോസ് 5:5–11","വിനയം ധരിക്കുവിൻ"],[ML.pa,"ഹെബ്രായർ 3:1–6","ദൈവഭവനത്തിൽ പുത്രനെപ്പോലെ വിശ്വസ്തനായ ക്രിസ്തു"],[ML.go,"ലൂക്കാ 2:41–52","ബാലനായ യേശു ദേവാലയത്തിൽ"]],
 alt:"യൽദോ–ദനഹാക്കാലം. ഇന്നു ഹേറോദേസ് കൊന്ന ശിശുക്കളുടെ ഓർമയുമാണ് (ഡിസംബർ 27, 2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ).",
 verse:"പിന്നെ അവൻ അവരോടൊപ്പം പുറപ്പെട്ട് നസറത്തിൽ വന്ന്, അവർക്ക് വിധേയനായി ജീവിച്ചു. അവന്റെ അമ്മ ഇക്കാര്യങ്ങളെല്ലാം ഹൃദയത്തിൽ സംഗ്രഹിച്ചു.",cite:"ലൂക്കാ 2:51",
 theo:["യൽദോയ്ക്കു രണ്ടു ദിവസത്തിനുശേഷം സഭ തിരുക്കുടുംബത്തിന്റെ മറഞ്ഞ ജീവിതത്തിലേക്കു തിരിയുന്നു. സ്വപ്നത്തിൽ മുന്നറിയിപ്പു ലഭിച്ച ജോസഫ് ശിശുവിനെയും അമ്മയെയും ഈജിപ്തിൽനിന്നു തിരികെ കൊണ്ടുവന്ന്, “നസ്രത്ത് എന്ന പട്ടണത്തിൽ… ചെന്നുപാർത്തു” എന്നു മത്തായി പറയുന്നു. പെസഹായ്ക്ക് എല്ലാ വർഷവും ജറുസലെമിലേക്കു പോകുന്ന കുടുംബത്തെ ലൂക്കാ കാണിക്കുന്നു. ദൈവപുത്രൻ ഒരു സാധാരണ കുടുംബത്തിൽ, ഒരു സാധാരണ ഗ്രാമത്തിൽ, തന്റെ ജനത്തിന്റെ സാധാരണ തിരുനാളുകൾ ആചരിച്ചു വളരുന്നു.","പന്ത്രണ്ടാം വയസ്സിൽ യേശു ദേവാലയത്തിൽ തങ്ങുന്നു. ഉത്കണ്ഠയോടെയുള്ള മൂന്നു ദിവസത്തെ അന്വേഷണത്തിനുശേഷം, “അവൻ ഉപാധ്യായന്മാരുടെ ഇടയിലിരുന്ന്, അവർ പറയുന്നതു കേൾക്കുകയും അവരോടു ചോദ്യങ്ങൾ ചോദിക്കുകയും” ചെയ്യുന്നതായി മാതാപിതാക്കൾ കണ്ടെത്തുന്നു. യേശു ഉത്തരം നൽകുന്നു: “നിങ്ങൾ എന്തിനാണ് എന്നെ അന്വേഷിച്ചത്? ഞാൻ എന്റെ പിതാവിന്റെ കാര്യങ്ങളിൽ വ്യാപൃതനായിരിക്കേണ്ടതാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലേ?” രേഖപ്പെടുത്തപ്പെട്ട അവിടുത്തെ ആദ്യവാക്കുകൾ അവിടുത്തെ യഥാർഥ പിതാവ് ആരെന്നു വെളിപ്പെടുത്തുന്നു.","എങ്കിലും സുവിശേഷം പറയുന്നു: “പിന്നെ അവൻ അവരോടൊപ്പം പുറപ്പെട്ട് നസറത്തിൽ വന്ന്, അവർക്ക് വിധേയനായി ജീവിച്ചു.” നിത്യപുത്രൻ ഒരു ആശാരിയെയും ഒരു ഗ്രാമീണസ്ത്രീയെയും അനുസരിക്കുന്നു. “ക്രിസ്തുവാകട്ടെ, അവിടുത്തെ ഭവനത്തിൽ പുത്രനെപ്പോലെയാണ്… നാം അവിടുത്തെ ഭവനമായിരിക്കും” എന്നു ഹെബ്രായലേഖനം പറയുന്നു (ഹെബ്രാ 3:6). ദൈവപുത്രൻ മനുഷ്യനായിരിക്കാൻ പഠിച്ച വിദ്യാലയമാണു നസറത്തിലെ കുടുംബം: അധ്വാനിക്കാൻ, പ്രാർഥിക്കാൻ, അനുസരിക്കാൻ, “ജ്ഞാനത്തിലും പ്രായത്തിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതിയിലും” വളരാൻ.","സഖറിയായുടെ ജറുസലെം ദർശനം അനുഗൃഹീതമായ ഒരു കുടുംബത്തിന്റെയും നഗരത്തിന്റെയും ചിത്രമാണ്: “വൃദ്ധന്മാരും വൃദ്ധകളും… ജറുസലെമിന്റെ തെരുവുകളിൽ വീണ്ടും ഇരിക്കും. കളിച്ചുല്ലസിക്കുന്ന ബാലികാബാലന്മാരെക്കൊണ്ട് നഗരവീഥികൾ നിറയും.” വൃദ്ധർ ആദരിക്കപ്പെടുകയും കുട്ടികൾ സുരക്ഷിതരും സന്തുഷ്ടരുമായിരിക്കുകയും ചെയ്യുന്ന കുടുംബങ്ങൾ ദൈവരാജ്യത്തിന്റെ അടയാളങ്ങളാണ്. ഹേറോദേസ് കൊന്ന ശിശുക്കളെയും ഇന്നു നാം ഓർക്കുന്നു: സഭ എന്നും അവരെ രക്തസാക്ഷികളായി ആദരിച്ചിട്ടുണ്ട്; അവരോടൊപ്പം ഭീഷണി നേരിടുന്ന ഓരോ കുഞ്ഞിനുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു."],
 conn:[["ഈജിപ്തിൽനിന്ന്.","ഇസ്രായേലിനെപ്പോലെയും യാക്കോബിന്റെ മകൻ ജോസഫിനെപ്പോലെയും ശിശു ഈജിപ്തിലേക്കു പോയി തിരികെ വരുന്നു (ഹോസി 11:1; മത്താ 2:15). തന്റെ ജനത്തിന്റെ കഥ രക്ഷിക്കാൻ അവിടുന്ന് അതു വീണ്ടും ജീവിക്കുന്നു."],["കൃപയിൽ വളരുന്നു.","“കുട്ടി വളർന്നു; കർത്താവ് അവനെ അനുഗ്രഹിച്ചു” (ന്യായാ 13:24, സാംസൺ); ഇസഹാക്ക് വളർന്നു (ഉൽപ 21:8); യേശു “ജ്ഞാനത്തിലും പ്രായത്തിലും” വളർന്നു (ലൂക്കാ 2:52)."],["കർത്താവിന്റെ ആലയത്തിലേക്ക്.","“കർത്താവിന്റെ ആലയത്തിലേക്കു നമുക്കു പോകാമെന്ന് അവർ പറഞ്ഞപ്പോൾ ഞാൻ സന്തോഷിച്ചു” എന്ന സങ്കീർത്തനം 122 ഒരു തീർഥാടനഗീതമായിരുന്നു. ജറുസലെമിലേക്കുള്ള വഴിയിൽ തിരുക്കുടുംബം ഇത്തരം സങ്കീർത്തനങ്ങൾ പാടിയിരുന്നു."],["മറിയത്തിന്റെ ഹൃദയം.","മറിയം ഇക്കാര്യങ്ങൾ ഹൃദയത്തിൽ സംഗ്രഹിച്ചുവെന്നു ലൂക്കാ രണ്ടു പ്രാവശ്യം പറയുന്നു (2:19, 51). സുവിശേഷത്തിലെ ആദ്യത്തെ ധ്യാനാത്മാവ് അവളാണ്."]],
 altar:["താൻ പിതാവിന്റെ ഭവനത്തിലായിരിക്കണമെന്നു ബാലനായ യേശു പറഞ്ഞു. ഓരോ ഞായറാഴ്ചയും ശ്രവിക്കാനും സ്വീകരിക്കാനുമായി നാമും നമ്മുടെ പിതാവിന്റെ ഭവനമായ ദേവാലയത്തിലേക്കു വിളിക്കപ്പെടുന്നു. ഒന്നിച്ചു വിശുദ്ധ കുർബാനയ്ക്കു വരുന്ന കുടുംബങ്ങൾ നസറത്തിൽനിന്നു ജറുസലെമിലേക്കുള്ള വഴിയിലാണു നടക്കുന്നത്."],
 outline:[["ആരംഭം","മാതാപിതാക്കളോടു ചോദിക്കുക: ഒരു തിരക്കിൽ കുറച്ചു മിനിറ്റു നിങ്ങൾക്ക് ഒരു കുഞ്ഞിനെ നഷ്ടപ്പെട്ടിട്ടുണ്ടോ? ആ ഭയം ഓർക്കുക."],["ഒന്നാം ആശയം · സാധാരണ ഒരു കുടുംബത്തിൽ ദൈവം","നസറത്ത്: അധ്വാനം, പ്രാർഥന, അനുസരണം, തിരുനാളുകൾ. വീട്ടിൽ വിശുദ്ധി സാധ്യമാണ്."],["രണ്ടാം ആശയം · “എന്റെ പിതാവിന്റെ കാര്യങ്ങളിൽ”","യേശുവിന്റെ ആദ്യവാക്കുകൾ: അവിടുത്തെ വ്യക്തിത്വവും ദൗത്യവും. ദേവാലയം അവരുടെ പിതാവിന്റെ ഭവനമാണെന്നു കുട്ടികളെ പഠിപ്പിക്കുക."],["മൂന്നാം ആശയം · അനുസരണവും വളർച്ചയും","ദൈവപുത്രൻ അനുസരിച്ചു. കുട്ടികൾ അനുസരിക്കുന്നു, മാതാപിതാക്കൾ ശ്രവിക്കുന്നു, എല്ലാവരും വളരുന്നു."],["നാലാം ആശയം · വിശുദ്ധ ശിശുക്കൾ","ഭീഷണി നേരിടുന്ന ഓരോ കുഞ്ഞിനുംവേണ്ടി പ്രാർഥിക്കുക: ജനിക്കാത്തവർ, പീഡിപ്പിക്കപ്പെടുന്നവർ, യുദ്ധത്തിന്റെ മക്കൾ."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“നമ്മുടെ വീടും ഒരു നസറത്താകാം.”"]],
 live:[["കുടുംബമൊന്നിച്ചു പ്രാർഥിക്കുക","ഈ ആഴ്ച എല്ലാ ദിവസവും കുടുംബപ്രാർഥനയ്ക്കു നിശ്ചിതമായ ഒരു സമയം തിരഞ്ഞെടുക്കുക; പത്തു മിനിറ്റെങ്കിലും."],["കുട്ടികളെ പിതാവിന്റെ ഭവനത്തിലേക്കു കൊണ്ടുവരുക","ഒരു കുടുംബമായി, ഒന്നിച്ചിരുന്നു വിശുദ്ധ കുർബാനയിൽ പങ്കെടുക്കുക; വീട്ടിലേക്കുള്ള വഴിയിൽ സുവിശേഷത്തെപ്പറ്റി സംസാരിക്കുക."],["വൃദ്ധരെ ആദരിക്കുക (സഖ 8:4)","ഈ ക്രിസ്മസ്‌കാലത്തു വല്യപ്പച്ചന്മാരെയും വല്യമ്മച്ചിമാരെയും പ്രായമായ ബന്ധുക്കളെയും സന്ദർശിക്കുകയോ വിളിക്കുകയോ ചെയ്യുക."]],
 fathers:[["മിലാനിലെ വിശുദ്ധ അംബ്രോസ്","പന്ത്രണ്ടാം വയസ്സിൽ ദേവാലയത്തിൽ യേശു തന്റെ ദൈവത്വവും മാതാപിതാക്കൾക്കു വിധേയനാകുന്നതിൽ തന്റെ മനുഷ്യത്വവും വെളിപ്പെടുത്തുന്നുവെന്ന് അദ്ദേഹം സൂചിപ്പിക്കുന്നു: സകലത്തിന്റെയും കർത്താവു സ്നേഹത്താൽ വിധേയനാകുന്നു (ലൂക്കാസുവിശേഷവ്യാഖ്യാനം 2)."],["മാർ അപ്രേം","ജോസഫിന്റെ ഭവനത്തിൽ വളർന്ന നസറത്തിലെ ശിശുവിനെപ്പറ്റി, ഒരു ആശാരിയെ അനുസരിക്കുന്ന അത്യുന്നതന്റെ പുത്രനെപ്പറ്റി, ഒരേസമയം അമ്മയും ശിഷ്യയുമായ മറിയത്തെപ്പറ്റി അദ്ദേഹം പാടുന്നു (തിരുപ്പിറവിഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 531–534","നസറത്തിലെ മറഞ്ഞ ജീവിതം: ബഹുഭൂരിപക്ഷം മനുഷ്യരുടെയും അവസ്ഥ, കായികാധ്വാനത്തിന്റെയും അനുസരണത്തിന്റെയും പ്രാർഥനയുടെയും അനുദിനജീവിതം, യേശു പങ്കുവയ്ക്കുന്നു; ദേവാലയത്തിലെ കണ്ടെത്തൽ പിതാവിനുള്ള അവിടുത്തെ സമ്പൂർണസമർപ്പണം വെളിപ്പെടുത്തുന്നു."],["സ്നേഹത്തിന്റെ ആനന്ദം (അമോറിസ് ലെത്തീസ്യ) 65–66","നസറത്തിലെ തിരുക്കുടുംബം ഓരോ കുടുംബത്തിനും മാതൃകയും വെളിച്ചവുമാണ്; സ്നേഹത്തിന്റെ ഉടമ്പടി അനുദിനജീവിതത്തിലാണു ജീവിക്കപ്പെടുന്നത്."],["മതബോധനഗ്രന്ഥം 1655–1666","ഗാർഹികസഭയായ ക്രൈസ്തവകുടുംബം."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഡിസംബർ 27: ഹേറോദേസ് കൊന്ന ശിശുക്കളുടെ ഓർമ. ജനുവരി 1: നമ്മുടെ കർത്താവിന്റെ നാമകരണം; പുതുവർഷം. ജനുവരി 2: മാർ ബസേലിയോസും മാർ ഗ്രിഗോറിയോസും; നമ്മുടെ മേജർ ആർച്ച്ബിഷപ്-കാതോലിക്കോസ് മോറാൻ മോർ ബസേലിയോസ് കർദിനാൾ ക്ലീമിസ് ബാവായുടെ നാമഹേതുകത്തിരുനാൾ. ജനുവരി 3: വിശുദ്ധ ചാവറ കുര്യാക്കോസ് ഏലിയാസ്. 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ യേശുവേ, മറിയത്തിനും ജോസഫിനും വിധേയനായും അങ്ങയുടെ പിതാവിന്റെ കാര്യങ്ങളിൽ വ്യാപൃതനായും അങ്ങു നസറത്തിലെ അവരുടെ ഭവനത്തിൽ വളർന്നു. ഞങ്ങളുടെ കുടുംബങ്ങളെ അനുഗ്രഹിക്കണമേ: ഞങ്ങളുടെ ഭവനങ്ങളെ പ്രാർഥനയുടെയും അധ്വാനത്തിന്റെയും സ്നേഹത്തിന്റെയും ഇടങ്ങളാക്കണമേ; ഓരോ കുഞ്ഞിനെയും സംരക്ഷിക്കണമേ; ഓരോ വൃദ്ധനെയും ആദരിക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കണമേ. ആമേൻ."},
 {quick:["ദൈവപുത്രൻ നസറത്തിലെ സാധാരണ ഒരു കുടുംബത്തിൽ വളർന്നു.","“എന്റെ പിതാവിന്റെ കാര്യങ്ങളിൽ”: യേശുവിന്റെ ആദ്യവാക്കുകൾ.","അവിടുന്നു നസറത്തിൽ ചെന്ന് അവർക്കു വിധേയനായി: വീട്ടിലെ വിശുദ്ധി."],action:"ഈ ആഴ്ച എല്ലാ ദിവസവും കുടുംബപ്രാർഥനയ്ക്കു നിശ്ചിതമായ ഒരു സമയം വയ്ക്കുക.",question:"എന്റെ വീട് ഒരു ചെറിയ നസറത്താണോ?",
  special:"യൽദോയ്ക്കുശേഷമുള്ള ഒന്നാം ഞായർ. ഹേറോദേസ് കൊന്ന ശിശുക്കളുടെ ഓർമ.",
  illus:["ഒരു ഉദാഹരണം","തിരക്കേറിയ ഒരു പള്ളിപ്പെരുന്നാളിനിടയിൽ ഒരു കേരളീയപിതാവിനു തന്റെ കൊച്ചുമകനെ നഷ്ടപ്പെട്ടു. ഒരു മണിക്കൂർ അദ്ദേഹം ഓരോ കടയിലേക്കും ഓടി. ബലിപീഠത്തിനരികെ ശാന്തമായിരിക്കുന്ന മകനെ കണ്ടെത്തിയപ്പോൾ ശകാരിക്കണോ കെട്ടിപ്പിടിക്കണോ എന്ന് അദ്ദേഹത്തിന് അറിയില്ലായിരുന്നു. മറിയത്തിനും ജോസഫിനും ആ വികാരം അറിയാമായിരുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 2:41–52.",explain:"യേശുവിനു പന്ത്രണ്ടു വയസ്സായപ്പോൾ അവിടുന്നു ദേവാലയത്തിൽ തങ്ങി; മാതാപിതാക്കൾ മൂന്നു ദിവസം അവിടുത്തെ അന്വേഷിച്ചു. ദേവാലയം തന്റെ പിതാവിന്റെ ഭവനമാണെന്ന് യേശു പറഞ്ഞു. പിന്നെ അവരോടൊപ്പം വീട്ടിൽ പോയി അവരെ അനുസരിച്ചു.",intention:"തിരുക്കുടുംബത്തെപ്പോലെ പരസ്പരം സ്നേഹിക്കാനും അനുസരിക്കാനും സഹായിക്കാനും നമ്മുടെ കുടുംബത്തിനുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമ്മുടെ വീടിനെ നസറത്തുപോലെയാക്കാൻ നമ്മളോരോരുത്തർക്കും എന്തു ചെയ്യാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 531–534","നസറത്തിലെ മറഞ്ഞ ജീവിതം."],["മതബോധനഗ്രന്ഥം 2204–2206","വ്യക്തികളുടെ കൂട്ടായ്മയായ ക്രൈസ്തവകുടുംബം."]],
  kidsaint:["നസറത്തിലെ തിരുക്കുടുംബം","യേശുവും മറിയവും ജോസഫും ഒരു ചെറിയ വീട്ടിലാണു ജീവിച്ചത്. ജോസഫ് ആശാരിയായി ജോലി ചെയ്തു; മറിയം വീടു നോക്കി; യേശു അവരെ സഹായിക്കുകയും അനുസരിക്കുകയും ചെയ്തു. അവർ ഒന്നിച്ചു പ്രാർഥിക്കുകയും ദേവാലയത്തിൽ പോകുകയും ചെയ്തു. പാഠം: നിന്റെ കുടുംബത്തിനും വിശുദ്ധമാകാം."],
  term:["നസറത്ത്","യേശു വളരുകയും ഏകദേശം മുപ്പതു വർഷം ജീവിക്കുകയും ചെയ്ത ഗലീലിയിലെ ചെറിയ ഗ്രാമം. ക്രൈസ്തവർ ആദ്യം “നസറായന്മാർ” എന്നു വിളിക്കപ്പെട്ടു (അപ്പ 24:5); കേരളത്തിലെ മാർ തോമാ ക്രിസ്ത്യാനികളുടെ പഴയ പേരായ “നസ്രാണി” അതേ വാക്കിൽനിന്നാണ്."],
  termMore:["വിശുദ്ധ ശിശുക്കൾ","ഹേറോദേസ് കൊന്ന ബേത്‌ലെഹെമിലെ ശിശുക്കൾ (മത്താ 2:16–18). സംസാരിച്ചുകൊണ്ടല്ല, ക്രിസ്തുവിനു പകരമായി മരിച്ച, ക്രിസ്തുവിനുവേണ്ടിയുള്ള ആദ്യരക്തസാക്ഷികളായി സഭ അവരെ ആദരിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, യൽദോയ്ക്കു രണ്ടു ദിവസത്തിനുശേഷം സഭ നമ്മെ നസറത്തിലെ ഭവനത്തിലേക്കു കൊണ്ടുപോകുന്നു. ദൈവപുത്രൻ ഒരു കൊട്ടാരത്തിലല്ല വളർന്നത്. ഒരു ചെറിയ ഗ്രാമത്തിൽ, ഒരു ആശാരിയുടെ വീട്ടിൽ, മറിയത്തോടും ജോസഫിനോടുമൊപ്പം, തന്റെ ജനത്തിന്റെ തിരുനാളുകൾ ആചരിച്ച് അവിടുന്നു ജീവിച്ചു.","എല്ലാ വർഷവും അവർ പെസഹായ്ക്കു ജറുസലെമിലേക്കു പോയിരുന്നു. യേശുവിനു പന്ത്രണ്ടു വയസ്സായപ്പോൾ അവിടുന്നു ദേവാലയത്തിൽ തങ്ങി. മറിയവും ജോസഫും അനുഭവിച്ച ഭയം ഇവിടെയുള്ള മാതാപിതാക്കൾക്കറിയാം: മൂന്നു ദിവസത്തെ അന്വേഷണം! അവിടുത്തെ കണ്ടെത്തിയപ്പോൾ യേശു പറഞ്ഞു: “ഞാൻ എന്റെ പിതാവിന്റെ കാര്യങ്ങളിൽ വ്യാപൃതനായിരിക്കേണ്ടതാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലേ?” സുവിശേഷത്തിൽ അവിടുത്തെ ആദ്യവാക്കുകളാണിവ. തന്റെ യഥാർഥ പിതാവ് ആരെന്ന് അവിടുത്തേക്കറിയാമായിരുന്നു.","എങ്കിലും അടുത്ത വാക്യം പറയുന്നു: “പിന്നെ അവൻ അവരോടൊപ്പം പുറപ്പെട്ട് നസറത്തിൽ വന്ന്, അവർക്ക് വിധേയനായി ജീവിച്ചു.” സ്വർഗത്തിന്റെ കർത്താവ് ഒരു ആശാരിയെയും ഒരു ഗ്രാമീണ അമ്മയെയും അനുസരിച്ചു. ഏകദേശം മുപ്പതു വർഷം അധ്വാനത്തിന്റെയും പ്രാർഥനയുടെയും അനുസരണത്തിന്റെയും മറഞ്ഞ ജീവിതം അവിടുന്നു ജീവിച്ചു. വിശുദ്ധി ആരംഭിക്കുന്നതു വലിയ പ്രവൃത്തികളിലല്ല; വീട്ടിലാണ്.","ഹേറോദേസ് കൊന്ന കൊച്ചുകുഞ്ഞുങ്ങളെയും ഇന്നു നാം ഓർക്കുന്നു. അപകടത്തിലായിരിക്കുന്ന ഓരോ കുഞ്ഞിനുംവേണ്ടി നമുക്കു പ്രാർഥിക്കാം: ജനിക്കാത്തവർ, അക്രമം സഹിക്കുന്ന കുട്ടികൾ, യുദ്ധത്തിന്റെയും പട്ടിണിയുടെയും മക്കൾ. നമ്മുടെ വീടുകളെ ചെറിയ നസറത്തുകളാക്കാം: അനുദിന കുടുംബപ്രാർഥനയാലും വൃദ്ധരോടുള്ള ആദരവിനാലും കുട്ടികൾക്കുള്ള സന്തോഷത്താലും. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശുവിനു പന്ത്രണ്ടു വയസ്സായപ്പോൾ അവിടുന്നു മറിയത്തോടും ജോസഫിനോടുമൊപ്പം ജറുസലെമിലെ വലിയ ദേവാലയത്തിലേക്കു പോയി. തിരികെ വരുമ്പോൾ അവർക്ക് യേശുവിനെ കാണാനില്ല! മൂന്നു ദിവസം അവർ അന്വേഷിച്ചു.","ദേവാലയത്തിൽ കേട്ടും ചോദ്യങ്ങൾ ചോദിച്ചും ഇരിക്കുന്ന യേശുവിനെ അവർ കണ്ടെത്തി. അവിടുന്നു പറഞ്ഞു: “ഇത് എന്റെ പിതാവിന്റെ ഭവനമാണ്!” പിന്നെ വീട്ടിൽ പോയി മറിയത്തെയും ജോസഫിനെയും അനുസരിച്ചു.","യേശു തന്റെ മാതാപിതാക്കളെ അനുസരിച്ചു. നിങ്ങൾക്കും അങ്ങനെ ചെയ്യാമോ? നമുക്കു പറയാം: “യേശുവിനെപ്പോലെ ഞാൻ സ്നേഹിക്കും, അനുസരിക്കും!”"]});

/* ================= NAMING OF OUR LORD · 1 January 2027 ================= */
put("2027-01-01","en",{title:"The Naming of our Lord · New Year's Day",readTitle:EN.rt,
 readings:[[EN.pa,"Ephesians 4:17–24","Put on the new self"],[EN.go,"Luke 2:21–24","He was called Jesus"]],
 alt:"Feast of the Naming of our Lord, eight days after Yaldo. New Year begins. Also the World Day of Peace in the universal Church.",
 verse:"After eight days had passed, it was time to circumcise the child; and he was called Jesus, the name given by the angel before he was conceived in the womb.",cite:"Luke 2:21",
 theo:["On the eighth day after his birth the Child was circumcised according to the Law and given his name: Jesus, “the name given by the angel before he was conceived”. The Son of God enters fully into the covenant of his people and receives a name that is a mission: Yeshua, “the Lord saves”. As the angel told Joseph: “you are to name him Jesus, for he will save his people from their sins” (Matthew 1:21).","At the start of a new year the Church gives us not a resolution but a Name. St Peter would later proclaim: “There is salvation in no one else, for there is no other name under heaven given among mortals by which we must be saved” (Acts 4:12). Every year, every plan, every fear can be placed under this Name.","St Paul's reading tells us how to begin anew: “put away your former way of life, your old self… and clothe yourselves with the new self, created according to the likeness of God in true righteousness and holiness” (Ephesians 4:22–24). A new calendar does not make a new person; Christ does. The New Year is a chance to put on Christ again.","Luke also says that Mary and Joseph brought the Child to Jerusalem to present him to the Lord, offering the sacrifice of the poor, “a pair of turtledoves or two young pigeons”. The Holy Family begins every new stage by offering it to God. So may we offer this year to him."],
 conn:[["The eighth day.","Circumcision on the eighth day (Genesis 17:12) marked entry into Abraham's covenant. For Christians the eighth day became the day of the Resurrection and of the new creation."],["Joshua and Jesus.","Jesus is the same name as Joshua, who led Israel into the promised land (Joshua 1:1–9). Jesus leads us into the true promised land."],["The name above every name.","Paul sings that God gave Christ “the name that is above every name, so that at the name of Jesus every knee should bend” (Philippians 2:9–10)."],["The offering of the poor.","The two birds (Leviticus 12:8) show that the Holy Family was poor. The Son of God was born among the poor."]],
 altar:["We begin the new year at the altar, where the Name of Jesus is invoked over bread and wine and he becomes present. To receive Holy Communion on the first day of the year is to place the whole year in his hands."],
 outline:[["Opening","New Year greetings: what do people usually wish for? Health, wealth, success."],["Point 1 · A Name, not a wish","Jesus: “the Lord saves”. Begin the year under his Name."],["Point 2 · Put on the new self","Ephesians 4: a new year needs a new heart, not only a new calendar."],["Point 3 · Offer the year","Like Mary and Joseph presenting the Child, offer the year to God."],["Point 4 · Peace","World Day of Peace: pray and work for peace in families and nations."],["Take-home line","“Jesus, I begin this year in your Name.”"]],
 live:[["Begin each day with the Name","Begin each morning this year with the sign of the cross and the prayer “Lord Jesus Christ, Son of God, have mercy on me.”"],["One old habit to put off (Ephesians 4:22)","Name one habit of the “old self” to leave behind this year, and one virtue to put on."],["Bless the house","Ask the priest to bless your home during the season of Denho, or bless it yourselves with prayer and holy water."]],
 fathers:[["St Bernard of Clairvaux","The name of Jesus is light, food and medicine: “Jesus is honey in the mouth, music in the ear, a song of joy in the heart” (Sermons on the Song of Songs 15)."],["St Ephrem the Syrian","He praises the Name of the Son, sweet to those who love him, and the circumcision of the Lord who fulfilled the Law in himself (Hymns on the Nativity)."]],
 magis:[["Catechism 430–435","Jesus means “God saves”; the name of Jesus contains everything; it is at the heart of Christian prayer."],["Catechism 527","The circumcision of Jesus is the sign of his incorporation into Abraham's descendants and prefigures Christian Baptism."],["Message for the World Day of Peace","Each year on 1 January the Pope issues a message for peace; read it on vatican.va (see Papal documents)."]],
 saints:[["Around this day","2 Jan: Mar Baselios and Mar Gregory; name day of our Major Archbishop-Catholicos Moran Mor Baselios Cardinal Cleemis. 3 Jan: St Kuriakose Elias Chavara."]],
 prayer:"Lord Jesus, at your Naming you received the Name that saves. We begin this year in your Name: forgive our past, clothe us with the new self, bless our families and our work, and give peace to our world. Amen."},
 {quick:["Jesus means “the Lord saves”.","Begin the year with a Name, not just a wish.","Put off the old self and put on the new."],action:"Name one old habit to leave behind and one virtue to put on this year.",question:"Under whose name will I live this year?",
  special:"The Naming of our Lord and New Year's Day. World Day of Peace.",
  illus:["An illustration","In many Kerala homes the first thing written in a new notebook or account book is a cross, or “Jesus” at the top of the first page. It is a small act of faith: everything that follows is placed under his Name."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 2:21; Matthew 1:21.",explain:"When Jesus was eight days old, Mary and Joseph gave him the name the angel had told them: Jesus, which means “God saves”.",intention:"We offer this new year to Jesus and pray for peace in our family and in the world.",ask:"Ask: “What good thing will each of us try to do this year?”"},
  catechism:[["CCC 430–435","The name of Jesus."],["CCC 2666–2668","Prayer in the name of Jesus."]],
  kidsaint:["St Basil the Great (2 Jan)","A bishop in Caesarea who built a whole “new city” for the poor and sick, with hospitals and kitchens. Lesson: begin the new year by helping someone in need."],
  term:["The Holy Name of Jesus","Jesus (Yeshua) means “the Lord saves”. Christians pray in this Name, bow at it, and begin their work under it. The ancient Jesus Prayer is: “Lord Jesus Christ, Son of God, have mercy on me, a sinner.”"],
  termMore:["Why eight days?","Jewish boys were circumcised and named on the eighth day (Leviticus 12:3). The feast falls on 1 January, the octave day of Yaldo, which is also the civil New Year."]},
 {homily:["Dear brothers and sisters, a blessed New Year to all of you! On this first day of the year, the Church celebrates the Naming of our Lord. Eight days after his birth, the Child was circumcised and given the name the angel had announced: Jesus.","In Hebrew, Jesus means “the Lord saves”. The angel told Joseph: “you are to name him Jesus, for he will save his people from their sins.” So on New Year's Day the Church does not give us a list of resolutions; she gives us a Name. St Peter says: “There is no other name under heaven given among mortals by which we must be saved.”","St Paul tells us what a real new beginning looks like: put away the old self, and clothe yourselves with the new self, created in the likeness of God. A new calendar does not make a new person. Only Christ makes us new. Let each of us name one old habit to put off, and one virtue to put on, this year.","And like Mary and Joseph, who brought the Child to offer him to the Lord, let us offer this whole year to God: our families, our work, our health, our plans. Today is also the World Day of Peace. May the Prince of Peace give peace to our homes and to our world. Jesus, we begin this year in your Name. Amen."],
  kids:["Children, happy New Year! Today we remember the day baby Jesus got his name. Do you know what “Jesus” means? “God saves!”","Mary and Joseph gave him that name because an angel told them to. Jesus came to save us and help us be good.","This year, let's start every day by saying: “Jesus, I love you!” Let's say it together now: “Jesus, I love you!”"]});

put("2027-01-01","ml",{title:"നമ്മുടെ കർത്താവിന്റെ നാമകരണം · പുതുവത്സരദിനം",readTitle:ML.rt,
 readings:[[ML.pa,"എഫേസോസ് 4:17–24","പുതിയ മനുഷ്യനെ ധരിക്കുവിൻ"],[ML.go,"ലൂക്കാ 2:21–24","അവന് യേശു എന്നു പേരു നൽകി"]],
 alt:"യൽദോയ്ക്ക് എട്ടു ദിവസത്തിനുശേഷമുള്ള നമ്മുടെ കർത്താവിന്റെ നാമകരണത്തിരുനാൾ. പുതുവർഷം ആരംഭിക്കുന്നു. സാർവത്രികസഭയിൽ ലോകസമാധാനദിനവുമാണ്.",
 verse:"ശിശുവിന്റെ പരിച്ഛേദനത്തിനുള്ള എട്ടാംദിവസം ആയപ്പോൾ, അവൻ ഗർഭത്തിൽ ഉരുവാകുന്നതിനുമുമ്പ്, ദൂതൻ നിർദേശിച്ചിരുന്ന, യേശു എന്ന പേര് അവനു നൽകി.",cite:"ലൂക്കാ 2:21",
 theo:["ജനനത്തിനുശേഷം എട്ടാം ദിവസം നിയമപ്രകാരം ശിശു പരിച്ഛേദനം ചെയ്യപ്പെടുകയും “അവൻ ഗർഭത്തിൽ ഉരുവാകുന്നതിനുമുമ്പ്, ദൂതൻ നിർദേശിച്ചിരുന്ന” യേശു എന്ന പേരു സ്വീകരിക്കുകയും ചെയ്തു. ദൈവപുത്രൻ തന്റെ ജനത്തിന്റെ ഉടമ്പടിയിലേക്കു പൂർണമായി പ്രവേശിക്കുന്നു; ഒരു ദൗത്യമായ ഒരു പേരു സ്വീകരിക്കുന്നു: യേശുവാ, “കർത്താവു രക്ഷിക്കുന്നു.” ദൂതൻ ജോസഫിനോടു പറഞ്ഞതുപോലെ: “നീ അവന് യേശു എന്നുപേരിടണം. എന്തെന്നാൽ, അവൻ തന്റെ ജനത്തെ അവരുടെ പാപങ്ങളിൽ നിന്നു മോചിപ്പിക്കും” (മത്താ 1:21).","ഒരു പുതുവർഷത്തിന്റെ ആരംഭത്തിൽ സഭ നമുക്കു നൽകുന്നത് ഒരു തീരുമാനമല്ല, ഒരു നാമമാണ്. വിശുദ്ധ പത്രോസ് പിന്നീടു പ്രഘോഷിച്ചു: “ആകാശത്തിനു കീഴെ മനുഷ്യരുടെയിടയിൽ നമുക്കു രക്ഷയ്ക്കുവേണ്ടി മറ്റൊരു നാമവും നൽകപ്പെട്ടിട്ടില്ല” (അപ്പ 4:12). ഓരോ വർഷവും ഓരോ പദ്ധതിയും ഓരോ ഭയവും ഈ നാമത്തിനു കീഴിൽ സമർപ്പിക്കാം.","പുതുതായി എങ്ങനെ ആരംഭിക്കണമെന്നു വിശുദ്ധ പൗലോസിന്റെ വായന പറയുന്നു: പഴയ ജീവിതരീതിയും പഴയ മനുഷ്യനെയും ഉപേക്ഷിച്ച്, യഥാർഥമായ നീതിയിലും വിശുദ്ധിയിലും ദൈവത്തിന്റെ സാദൃശ്യത്തിൽ സൃഷ്ടിക്കപ്പെട്ട പുതിയ മനുഷ്യനെ ധരിക്കുവിൻ (എഫേ 4:22–24). ഒരു പുതിയ കലണ്ടർ ഒരു പുതിയ മനുഷ്യനെ സൃഷ്ടിക്കുന്നില്ല; ക്രിസ്തുവാണു സൃഷ്ടിക്കുന്നത്. ക്രിസ്തുവിനെ വീണ്ടും ധരിക്കാനുള്ള അവസരമാണു പുതുവർഷം.","“മോശയുടെ നിയമമനുസരിച്ച്, ശുദ്ധീകരണത്തിനുള്ള ദിവസങ്ങൾ പൂർത്തിയായപ്പോൾ, അവർ അവനെ കർത്താവിനു സമർപ്പിക്കാൻ ജറുസലെമിലേക്കു കൊണ്ടുപോയി” എന്നും, ദരിദ്രരുടെ ബലിയായ ഒരു ജോടി ചെങ്ങാലികളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ അർപ്പിച്ചുവെന്നും ലൂക്കാ പറയുന്നു. ഓരോ പുതിയ ഘട്ടവും തിരുക്കുടുംബം ദൈവത്തിനു സമർപ്പിച്ചാണ് ആരംഭിക്കുന്നത്. നമുക്കും ഈ വർഷം അവിടുത്തേക്കു സമർപ്പിക്കാം."],
 conn:[["എട്ടാം ദിവസം.","എട്ടാം ദിവസത്തെ പരിച്ഛേദനം (ഉൽപ 17:12) അബ്രാഹത്തിന്റെ ഉടമ്പടിയിലേക്കുള്ള പ്രവേശനം കുറിച്ചു. ക്രൈസ്തവർക്ക് എട്ടാം ദിവസം ഉത്ഥാനത്തിന്റെയും പുതിയ സൃഷ്ടിയുടെയും ദിവസമായി."],["ജോഷ്വയും യേശുവും.","ഇസ്രായേലിനെ വാഗ്ദത്തദേശത്തേക്കു നയിച്ച ജോഷ്വയുടെ പേരുതന്നെയാണ് യേശു (ജോഷ്വ 1:1–9). യഥാർഥ വാഗ്ദത്തദേശത്തേക്ക് യേശു നമ്മെ നയിക്കുന്നു."],["എല്ലാ നാമങ്ങൾക്കും ഉപരിയായ നാമം.","എല്ലാ നാമങ്ങൾക്കും ഉപരിയായ നാമം ദൈവം ക്രിസ്തുവിനു നൽകിയെന്നും യേശുവിന്റെ നാമത്തിൽ എല്ലാ മുട്ടുകളും മടങ്ങുമെന്നും പൗലോസ് പാടുന്നു (ഫിലി 2:9–10)."],["ദരിദ്രരുടെ കാഴ്ച.","രണ്ടു പക്ഷികൾ (ലേവ്യ 12:8) തിരുക്കുടുംബം ദരിദ്രമായിരുന്നുവെന്നു കാണിക്കുന്നു. ദൈവപുത്രൻ ദരിദ്രരുടെ ഇടയിൽ ജനിച്ചു."]],
 altar:["ബലിപീഠത്തിങ്കലാണു നാം പുതുവർഷം ആരംഭിക്കുന്നത്; അവിടെ അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയുംമേൽ യേശുവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കപ്പെടുന്നു; അവിടുന്നു സന്നിഹിതനാകുന്നു. വർഷത്തിന്റെ ആദ്യദിവസം വിശുദ്ധ കുർബാന സ്വീകരിക്കുന്നതു വർഷം മുഴുവൻ അവിടുത്തെ കരങ്ങളിൽ ഏൽപിക്കലാണ്."],
 outline:[["ആരംഭം","പുതുവത്സരാശംസകൾ: ആളുകൾ സാധാരണ എന്താണ് ആശംസിക്കുന്നത്? ആരോഗ്യം, സമ്പത്ത്, വിജയം."],["ഒന്നാം ആശയം · ഒരു ആശംസയല്ല, ഒരു നാമം","യേശു: “കർത്താവു രക്ഷിക്കുന്നു.” അവിടുത്തെ നാമത്തിൽ വർഷം ആരംഭിക്കുക."],["രണ്ടാം ആശയം · പുതിയ മനുഷ്യനെ ധരിക്കുക","എഫേസോസ് 4: ഒരു പുതുവർഷത്തിനു പുതിയ കലണ്ടർ മാത്രമല്ല, പുതിയ ഹൃദയം വേണം."],["മൂന്നാം ആശയം · വർഷം സമർപ്പിക്കുക","ശിശുവിനെ സമർപ്പിച്ച മറിയത്തെയും ജോസഫിനെയുംപോലെ വർഷം ദൈവത്തിനു സമർപ്പിക്കുക."],["നാലാം ആശയം · സമാധാനം","ലോകസമാധാനദിനം: കുടുംബങ്ങളിലും രാഷ്ട്രങ്ങളിലും സമാധാനത്തിനായി പ്രാർഥിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“യേശുവേ, അങ്ങയുടെ നാമത്തിൽ ഞാൻ ഈ വർഷം ആരംഭിക്കുന്നു.”"]],
 live:[["നാമത്തോടെ ഓരോ ദിവസവും ആരംഭിക്കുക","ഈ വർഷം ഓരോ പ്രഭാതവും കുരിശുവരച്ച് “ദൈവപുത്രനായ കർത്താവായ യേശുമിശിഹായേ, എന്റെമേൽ കരുണയുണ്ടാകണമേ” എന്ന പ്രാർഥനയോടെ ആരംഭിക്കുക."],["ഉപേക്ഷിക്കാൻ ഒരു പഴയ ശീലം (എഫേ 4:22)","ഈ വർഷം ഉപേക്ഷിക്കേണ്ട “പഴയ മനുഷ്യന്റെ” ഒരു ശീലത്തിനും ധരിക്കേണ്ട ഒരു പുണ്യത്തിനും പേരു പറയുക."],["ഭവനം ആശീർവദിക്കുക","ദനഹാക്കാലത്തു നിങ്ങളുടെ ഭവനം ആശീർവദിക്കാൻ വൈദികനോട് ആവശ്യപ്പെടുക; അല്ലെങ്കിൽ പ്രാർഥനയോടും വിശുദ്ധജലത്തോടുംകൂടെ നിങ്ങൾതന്നെ ആശീർവദിക്കുക."]],
 fathers:[["ക്ലെയർവോയിലെ വിശുദ്ധ ബെർണാർഡ്","യേശുവിന്റെ നാമം വെളിച്ചവും ഭക്ഷണവും ഔഷധവുമാണ്: യേശു വായിൽ തേനും കാതിൽ സംഗീതവും ഹൃദയത്തിൽ ആനന്ദഗീതവുമാണ് (ഉത്തമഗീതപ്രസംഗങ്ങൾ 15)."],["മാർ അപ്രേം","തന്നെ സ്നേഹിക്കുന്നവർക്കു മധുരമുള്ള പുത്രന്റെ നാമത്തെയും, നിയമം തന്നിൽ പൂർത്തിയാക്കിയ കർത്താവിന്റെ പരിച്ഛേദനത്തെയും അദ്ദേഹം സ്തുതിക്കുന്നു (തിരുപ്പിറവിഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 430–435","യേശു എന്നതിന്റെ അർഥം “ദൈവം രക്ഷിക്കുന്നു” എന്നാണ്; യേശുനാമം എല്ലാം ഉൾക്കൊള്ളുന്നു; അതു ക്രൈസ്തവപ്രാർഥനയുടെ ഹൃദയത്തിലാണ്."],["മതബോധനഗ്രന്ഥം 527","യേശുവിന്റെ പരിച്ഛേദനം അബ്രാഹത്തിന്റെ സന്തതികളിലേക്കുള്ള അവിടുത്തെ ഉൾച്ചേരലിന്റെ അടയാളവും ക്രൈസ്തവമാമ്മോദീസയുടെ മുന്നോടിയുമാണ്."],["ലോകസമാധാനദിനസന്ദേശം","എല്ലാ വർഷവും ജനുവരി 1-ന് മാർപാപ്പ സമാധാനത്തിനായി ഒരു സന്ദേശം നൽകുന്നു; vatican.va-യിൽ വായിക്കുക (മാർപാപ്പമാരുടെ രേഖകൾ കാണുക)."]],
 saints:[["ഈ ദിവസങ്ങളിൽ","ജനുവരി 2: മാർ ബസേലിയോസും മാർ ഗ്രിഗോറിയോസും; നമ്മുടെ മേജർ ആർച്ച്ബിഷപ്-കാതോലിക്കോസ് മോറാൻ മോർ ബസേലിയോസ് കർദിനാൾ ക്ലീമിസ് ബാവായുടെ നാമഹേതുകത്തിരുനാൾ. ജനുവരി 3: വിശുദ്ധ ചാവറ കുര്യാക്കോസ് ഏലിയാസ്."]],
 prayer:"കർത്താവായ യേശുവേ, നാമകരണത്തിൽ രക്ഷിക്കുന്ന നാമം അങ്ങു സ്വീകരിച്ചു. അങ്ങയുടെ നാമത്തിൽ ഞങ്ങൾ ഈ വർഷം ആരംഭിക്കുന്നു: ഞങ്ങളുടെ ഭൂതകാലം ക്ഷമിക്കണമേ; പുതിയ മനുഷ്യനെ ഞങ്ങളെ ധരിപ്പിക്കണമേ; ഞങ്ങളുടെ കുടുംബങ്ങളെയും അധ്വാനത്തെയും അനുഗ്രഹിക്കണമേ; ഞങ്ങളുടെ ലോകത്തിനു സമാധാനം നൽകണമേ. ആമേൻ."},
 {quick:["യേശു എന്നതിന്റെ അർഥം “കർത്താവു രക്ഷിക്കുന്നു” എന്നാണ്.","ഒരു ആശംസകൊണ്ടു മാത്രമല്ല, ഒരു നാമത്തോടെ വർഷം ആരംഭിക്കുക.","പഴയ മനുഷ്യനെ ഉപേക്ഷിച്ചു പുതിയ മനുഷ്യനെ ധരിക്കുക."],action:"ഈ വർഷം ഉപേക്ഷിക്കേണ്ട ഒരു പഴയ ശീലത്തിനും ധരിക്കേണ്ട ഒരു പുണ്യത്തിനും പേരു പറയുക.",question:"ഈ വർഷം ആരുടെ നാമത്തിലായിരിക്കും ഞാൻ ജീവിക്കുക?",
  special:"നമ്മുടെ കർത്താവിന്റെ നാമകരണവും പുതുവത്സരദിനവും. ലോകസമാധാനദിനം.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പല വീടുകളിലും പുതിയ ഒരു നോട്ടുബുക്കിലോ കണക്കുപുസ്തകത്തിലോ ആദ്യം എഴുതുന്നത് ആദ്യതാളിന്റെ മുകളിൽ ഒരു കുരിശോ “ഈശോ” എന്നോ ആണ്. വിശ്വാസത്തിന്റെ ഒരു ചെറിയ പ്രവൃത്തി: തുടർന്നുവരുന്നതെല്ലാം അവിടുത്തെ നാമത്തിനു കീഴിൽ സമർപ്പിക്കപ്പെടുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 2:21; മത്തായി 1:21.",explain:"യേശുവിന് എട്ടു ദിവസം പ്രായമായപ്പോൾ, ദൂതൻ പറഞ്ഞിരുന്ന പേരു മറിയവും ജോസഫും അവിടുത്തേക്കു നൽകി: “ദൈവം രക്ഷിക്കുന്നു” എന്നർഥമുള്ള യേശു.",intention:"ഈ പുതുവർഷം യേശുവിനു സമർപ്പിച്ച്, നമ്മുടെ കുടുംബത്തിലും ലോകത്തിലും സമാധാനത്തിനായി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ വർഷം നമ്മളോരോരുത്തരും എന്തു നല്ല കാര്യം ചെയ്യാൻ ശ്രമിക്കും?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 430–435","യേശുവിന്റെ നാമം."],["മതബോധനഗ്രന്ഥം 2666–2668","യേശുനാമത്തിലുള്ള പ്രാർഥന."]],
  kidsaint:["മഹാനായ വിശുദ്ധ ബസേലിയോസ് (ജനുവരി 2)","ദരിദ്രർക്കും രോഗികൾക്കുമായി ആശുപത്രികളും അടുക്കളകളുമുള്ള ഒരു “പുതിയ നഗരം” മുഴുവൻ പണിത കേസറിയായിലെ മെത്രാൻ. പാഠം: ആവശ്യത്തിലിരിക്കുന്ന ഒരാളെ സഹായിച്ചുകൊണ്ടു പുതുവർഷം ആരംഭിക്കുക."],
  term:["യേശുവിന്റെ തിരുനാമം","യേശു (യേശുവാ) എന്നതിന്റെ അർഥം “കർത്താവു രക്ഷിക്കുന്നു” എന്നാണ്. ക്രൈസ്തവർ ഈ നാമത്തിൽ പ്രാർഥിക്കുന്നു, ഇതിനു മുമ്പിൽ ശിരസ്സു നമിക്കുന്നു, ഇതിനു കീഴിൽ തങ്ങളുടെ ജോലി ആരംഭിക്കുന്നു. പുരാതനമായ യേശുപ്രാർഥന: “ദൈവപുത്രനായ കർത്താവായ യേശുമിശിഹായേ, പാപിയായ എന്റെമേൽ കരുണയുണ്ടാകണമേ.”"],
  termMore:["എന്തുകൊണ്ട് എട്ടു ദിവസം?","യഹൂദബാലന്മാർ എട്ടാം ദിവസം പരിച്ഛേദനം ചെയ്യപ്പെടുകയും പേരു നൽകപ്പെടുകയും ചെയ്തിരുന്നു (ലേവ്യ 12:3). യൽദോയുടെ എട്ടാംദിവസമായ ജനുവരി 1-നാണ് ഈ തിരുനാൾ; അതു സിവിൽ പുതുവർഷവുമാണ്."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, നിങ്ങൾക്കെല്ലാവർക്കും അനുഗ്രഹപൂർണമായ പുതുവത്സരം! വർഷത്തിന്റെ ഈ ആദ്യദിവസം സഭ നമ്മുടെ കർത്താവിന്റെ നാമകരണം ആഘോഷിക്കുന്നു. ജനനത്തിന് എട്ടു ദിവസത്തിനുശേഷം ശിശു പരിച്ഛേദനം ചെയ്യപ്പെടുകയും ദൂതൻ അറിയിച്ചിരുന്ന പേരു നൽകപ്പെടുകയും ചെയ്തു: യേശു.","ഹീബ്രുവിൽ യേശു എന്നതിന്റെ അർഥം “കർത്താവു രക്ഷിക്കുന്നു” എന്നാണ്. ദൂതൻ ജോസഫിനോടു പറഞ്ഞു: “നീ അവന് യേശു എന്നുപേരിടണം. എന്തെന്നാൽ, അവൻ തന്റെ ജനത്തെ അവരുടെ പാപങ്ങളിൽ നിന്നു മോചിപ്പിക്കും.” അതുകൊണ്ടു പുതുവത്സരദിനത്തിൽ സഭ നമുക്കു തീരുമാനങ്ങളുടെ ഒരു പട്ടികയല്ല, ഒരു നാമമാണു നൽകുന്നത്. വിശുദ്ധ പത്രോസ് പറയുന്നു: “ആകാശത്തിനു കീഴെ മനുഷ്യരുടെയിടയിൽ നമുക്കു രക്ഷയ്ക്കുവേണ്ടി മറ്റൊരു നാമവും നൽകപ്പെട്ടിട്ടില്ല.”","യഥാർഥമായ ഒരു പുതിയ തുടക്കം എങ്ങനെയെന്നു വിശുദ്ധ പൗലോസ് പറയുന്നു: പഴയ മനുഷ്യനെ ഉപേക്ഷിച്ച്, ദൈവത്തിന്റെ സാദൃശ്യത്തിൽ സൃഷ്ടിക്കപ്പെട്ട പുതിയ മനുഷ്യനെ ധരിക്കുവിൻ. ഒരു പുതിയ കലണ്ടർ ഒരു പുതിയ മനുഷ്യനെ സൃഷ്ടിക്കുന്നില്ല. ക്രിസ്തു മാത്രമാണു നമ്മെ പുതിയവരാക്കുന്നത്. ഈ വർഷം ഉപേക്ഷിക്കേണ്ട ഒരു പഴയ ശീലത്തിനും ധരിക്കേണ്ട ഒരു പുണ്യത്തിനും നമ്മളോരോരുത്തരും പേരു പറയാം.","ശിശുവിനെ കർത്താവിനു സമർപ്പിക്കാൻ കൊണ്ടുവന്ന മറിയത്തെയും ജോസഫിനെയുംപോലെ, ഈ വർഷം മുഴുവൻ നമുക്കു ദൈവത്തിനു സമർപ്പിക്കാം: നമ്മുടെ കുടുംബങ്ങൾ, നമ്മുടെ അധ്വാനം, നമ്മുടെ ആരോഗ്യം, നമ്മുടെ പദ്ധതികൾ. ഇന്നു ലോകസമാധാനദിനവുമാണ്. സമാധാനത്തിന്റെ രാജാവു നമ്മുടെ ഭവനങ്ങൾക്കും നമ്മുടെ ലോകത്തിനും സമാധാനം നൽകട്ടെ. യേശുവേ, അങ്ങയുടെ നാമത്തിൽ ഞങ്ങൾ ഈ വർഷം ആരംഭിക്കുന്നു. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഹാപ്പി ന്യൂ ഇയർ! കുഞ്ഞായ യേശുവിനു പേരു കിട്ടിയ ദിവസമാണ് ഇന്നു നാം ഓർക്കുന്നത്. “യേശു” എന്നതിന്റെ അർഥം അറിയാമോ? “ദൈവം രക്ഷിക്കുന്നു!”","ഒരു മാലാഖ പറഞ്ഞതുകൊണ്ടാണു മറിയവും ജോസഫും അവിടുത്തേക്ക് ആ പേരു നൽകിയത്. നമ്മെ രക്ഷിക്കാനും നല്ലവരാകാൻ സഹായിക്കാനുമാണ് യേശു വന്നത്.","ഈ വർഷം എല്ലാ ദിവസവും “യേശുവേ, ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നു!” എന്നു പറഞ്ഞു തുടങ്ങാം. ഇപ്പോൾ നമുക്ക് ഒന്നിച്ചു പറയാം: “യേശുവേ, ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നു!”"]});
})();

 alt:"Season of Yaldo–Denho. Denho, the Baptism of our Lord, is on Wednesday 6 January.",
 verse:"Here is the Lamb of God who takes away the sin of the world!",cite:"John 1:29",
 theo:["Between Yaldo and Denho the Church listens to John the Baptist. He sees Jesus coming and cries: “Here is the Lamb of God who takes away the sin of the world!” The Child of Bethlehem is the Lamb who will be offered for us. John adds: “I myself have seen and have testified that this is the Son of God.” Christmas joy is joined to the purpose of Christ's coming: to take away sin.","In the evening Gospel John is very practical. The crowds ask, “What then should we do?” He answers: “Whoever has two coats must share with anyone who has none; and whoever has food must do likewise.” Tax collectors must be honest; soldiers must not extort. Conversion is not only a feeling; it bears fruit in the way we use money, power and possessions.","The Old Testament readings show children growing before God: Joseph loved by his father and given a long robe; the boy Samuel growing “in the presence of the LORD”, his mother bringing him a little robe each year. Hebrews remembers Moses, who chose “to share ill-treatment with the people of God rather than to enjoy the fleeting pleasures of sin”.","Isaiah gives the promise for the new year: “Those who wait for the LORD shall renew their strength, they shall mount up with wings like eagles, they shall run and not be weary.” Those who follow the Lamb do not run on their own strength."],
 conn:[["The Lamb.","The Passover lamb (Exodus 12) and the servant “like a lamb that is led to the slaughter” (Isaiah 53:7) are fulfilled in Jesus, the Lamb of God (John 1:29; Revelation 5:6)."],["Robes.","Joseph's robe and Samuel's little robe are signs of a parent's love; in Baptism we are clothed with Christ (Galatians 3:27)."],["Love in deed.","“Let us love, not in word or speech, but in truth and action” (1 John 3:18) is the same lesson as John's “two coats”."],["Moses' choice.","Moses refused Pharaoh's palace for God's people; Christ left heaven's glory for us."]],
 altar:["Before Holy Communion the priest raises the holy Mysteries; in many liturgies we hear John's words: “Behold the Lamb of God.” The One John pointed to by the Jordan is the One we receive at the altar."],
 outline:[["Opening","Ask: what did we receive at Christmas? What did we give?"],["Point 1 · The Lamb of God","The Child of Yaldo is the Lamb who takes away sin."],["Point 2 · “What then should we do?”","Two coats, honest work, no extortion: conversion in practice."],["Point 3 · Growing before God","Joseph, Samuel, Moses: let children grow in God's presence."],["Point 4 · Wings like eagles","New strength for the new year for those who wait on the Lord."],["Take-home line","“Behold the Lamb; and share your second coat.”"]],
 live:[["Share your second coat (Luke 3:11)","Give away one good item of clothing or food this week to someone who needs it."],["Honest in work (Luke 3:13)","Check one area of your work or business for honesty and fairness."],["Prepare for Denho","Come to the Denho Qurbono on Wednesday and renew your baptismal promises."]],
 fathers:[["St Cyril of Alexandria","One Lamb died for all, to gather the whole flock of humanity to God the Father; one for all, that all might be subject to God (Commentary on John, Book 2)."],["St Ambrose of Milan","On “whoever has two coats”: mercy is the fullness of the virtues; it is required of all, rich and poor, according to what each has (Exposition of the Gospel of Luke 2)."]],
 magis:[["Catechism 608","John the Baptist pointed to Jesus as the Lamb of God who takes away the sin of the world: the Suffering Servant and the Paschal Lamb."],["Catechism 1434–1435","Interior conversion is expressed in fasting, prayer and almsgiving, reconciliation, and care for the poor."],["Catechism 2443–2447","Love for the poor; giving to the needy is a work of justice."]],
 saints:[["This week (fixed dates)","3 Jan: St Kuriakose Elias Chavara. 6 Jan (Wednesday): Denho, the Baptism of our Lord; Holy Qurbono for the people. 7 Jan: Exaltation of St John the Baptist. 8 Jan: St Stephen, the first martyr (as in the 2025–26 lectionary)."]],
 prayer:"Lord Jesus, Lamb of God who takes away the sin of the world, have mercy on us. Make our conversion bear fruit in sharing, honesty and love, and renew our strength in this new year, that we may run and not be weary. Amen."},
 {quick:["The Child of Bethlehem is the Lamb of God.","Conversion bears fruit: share your second coat.","Those who wait for the Lord renew their strength."],action:"Give away one good item of clothing or food this week.",question:"What is my “second coat” that someone else needs?",
  special:"Second Sunday after Yaldo. Announce Denho on Wednesday 6 January, a day of obligation.",
  illus:["An illustration","After Christmas many Kerala homes have cupboards full of new clothes. One parish asks families to bring one good garment to church on the Sunday after Christmas for the poor. The pile at the door is John the Baptist's sermon in action."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 3:10–11 and John 1:29.",explain:"John the Baptist said: if you have two shirts, give one away. And he pointed to Jesus and said: “Look, the Lamb of God!”",intention:"We pray for people who are cold or hungry this January.",ask:"Ask: “What can our family share this week?”"},
  catechism:[["CCC 608","Jesus, the Lamb of God."],["CCC 2443–2447","Love for the poor."]],
  kidsaint:["St Kuriakose Elias Chavara (3 Jan)","A priest from Kainakary in Kerala who started schools beside churches so that every child could learn, founded religious congregations and printed books. Lesson: learning is a gift from God; use it to help others."],
  term:["Lamb of God","John the Baptist's name for Jesus (John 1:29). It recalls the Passover lamb and the Suffering Servant of Isaiah: Jesus gives his life to take away the sin of the world."],
  termMore:["Between Yaldo and Denho","The days from Christmas to the Baptism of the Lord unfold one mystery: God revealed in Christ, to the shepherds, to the Magi, and at the Jordan."]},
 {homily:["Dear brothers and sisters, we are still in the light of Christmas, and today John the Baptist points to the Child of Bethlehem and says: “Here is the Lamb of God who takes away the sin of the world!” The baby in the manger came for a purpose: to give his life for us, as the Passover lamb was given for Israel.","In the evening Gospel the crowds ask John: “What then should we do?” His answer is very simple. “Whoever has two coats must share with anyone who has none; whoever has food must do likewise.” To tax collectors: be honest. To soldiers: do not extort. Conversion is not a beautiful feeling; it is a changed way of using what we have.","After Christmas many of us have more than enough: new clothes, sweets, gifts. John asks: where is your second coat? Who needs it? Our readings also show children growing up close to God: Samuel growing in the presence of the Lord, his mother bringing him a little robe each year. Let us help our children grow like that.","And as the new year begins, Isaiah promises: “Those who wait for the Lord shall renew their strength, they shall mount up with wings like eagles.” On Wednesday we celebrate Denho, the Baptism of the Lord. Come, renew your own baptism, and follow the Lamb. Amen."],
  kids:["Children, John the Baptist was Jesus' cousin. When he saw Jesus coming, he said: “Look! The Lamb of God!” He meant that Jesus came to take away all our sins.","People asked John: “What should we do?” He said: “If you have two shirts, give one to someone who has none.”","Do you have a toy or a shirt you could share? Let's say: “Like John, I will share!”"]});

put("2027-01-03","ml",{title:"യൽദോയ്ക്കുശേഷമുള്ള രണ്ടാം ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 3:7–14","മാനസാന്തരത്തിനു യോജിച്ച ഫലങ്ങൾ"],[ML.ot,"ഉൽപത്തി 37:1–4","ജോസഫിന്റെ കുപ്പായം"],[ML.ot,"1 സാമുവൽ 2:18–21","ബാലനായ സാമുവൽ കർത്താവിന്റെ സന്നിധിയിൽ വളരുന്നു"],[ML.ot,"സങ്കീർത്തനം 45:1–17","രാജാവിനുള്ള ഗീതം"],[ML.ot,"ഏശയ്യാ 40:25–31","കഴുകന്മാരെപ്പോലെ ചിറകടിച്ചുയരും"],[ML.ce,"1 യോഹന്നാൻ 3:19–24","പ്രവൃത്തിയിലും സത്യത്തിലും സ്നേഹം"],[ML.pa,"ഹെബ്രായർ 11:23–31","വിശ്വാസത്താൽ മോശ"],[ML.go,"യോഹന്നാൻ 1:29–34","ഇതാ ദൈവത്തിന്റെ കുഞ്ഞാട്"]],
 alt:"യൽദോ–ദനഹാക്കാലം. നമ്മുടെ കർത്താവിന്റെ മാമ്മോദീസയായ ദനഹാ ജനുവരി 6 ബുധനാഴ്ച.",
 verse:"ഇതാ, ലോകത്തിന്റെ പാപം നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാട്.",cite:"യോഹന്നാൻ 1:29",
 theo:["യൽദോയ്ക്കും ദനഹായ്ക്കുമിടയിൽ സഭ സ്നാപകയോഹന്നാനെ ശ്രവിക്കുന്നു. യേശു വരുന്നതു കണ്ട് അവൻ പറയുന്നു: “ഇതാ, ലോകത്തിന്റെ പാപം നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാട്.” ബേത്‌ലെഹെമിലെ ശിശു നമുക്കുവേണ്ടി അർപ്പിക്കപ്പെടാനിരിക്കുന്ന കുഞ്ഞാടാണ്. യോഹന്നാൻ കൂട്ടിച്ചേർക്കുന്നു: “ഞാൻ അതു കാണുകയും ഇവൻ ദൈവപുത്രനാണ് എന്നു സാക്ഷ്യപ്പെടുത്തുകയും ചെയ്തിരിക്കുന്നു.” ക്രിസ്മസിന്റെ സന്തോഷം ക്രിസ്തുവിന്റെ വരവിന്റെ ലക്ഷ്യത്തോടു ചേർക്കപ്പെടുന്നു: പാപം നീക്കുക.","സന്ധ്യാസുവിശേഷത്തിൽ യോഹന്നാൻ തികച്ചും പ്രായോഗികനാണ്. ജനക്കൂട്ടം ചോദിക്കുന്നു: “ഞങ്ങൾ എന്താണു ചെയ്യേണ്ടത്?” അവൻ പറയുന്നു: “രണ്ടുടുപ്പുള്ളവൻ ഒന്ന് ഇല്ലാത്തവനു കൊടുക്കട്ടെ. ഭക്ഷണം ഉള്ളവനും അങ്ങനെ ചെയ്യട്ടെ.” ചുങ്കക്കാർ സത്യസന്ധരായിരിക്കണം; പടയാളികൾ കൊള്ളയടിക്കരുത്. മാനസാന്തരം ഒരു വികാരം മാത്രമല്ല; പണവും അധികാരവും വസ്തുവകകളും നാം ഉപയോഗിക്കുന്ന രീതിയിൽ അതു ഫലം പുറപ്പെടുവിക്കുന്നു: “മാനസാന്തരത്തിനു യോജിച്ച ഫലങ്ങൾ പുറപ്പെടുവിക്കുവിൻ.”","ദൈവസന്നിധിയിൽ വളരുന്ന കുഞ്ഞുങ്ങളെ പഴയനിയമവായനകൾ കാണിക്കുന്നു: പിതാവു സ്നേഹിക്കുകയും നീണ്ട കുപ്പായം നൽകുകയും ചെയ്ത ജോസഫ്; “കർത്താവിന്റെ സന്നിധിയിൽ വളർന്നുവന്ന” ബാലനായ സാമുവൽ, വർഷംതോറും അമ്മ ഉണ്ടാക്കിക്കൊടുത്ത ചെറിയ ഉടുപ്പ്. “പാപത്തിന്റെ നൈമിഷികസുഖങ്ങൾ ആസ്വദിക്കുന്നതിനെക്കാൾ ദൈവജനത്തിന്റെ കഷ്ടപ്പാടുകളിൽ പങ്കുചേരുന്നതിന്” ഇഷ്ടപ്പെട്ട മോശയെ ഹെബ്രായലേഖനം അനുസ്മരിക്കുന്നു (ഹെബ്രാ 11:25).","പുതുവർഷത്തിനുള്ള വാഗ്ദാനം ഏശയ്യാ നൽകുന്നു: “ദൈവത്തിൽ ആശ്രയിക്കുന്നവർ വീണ്ടും ശക്തി പ്രാപിക്കും; അവർ കഴുകന്മാരെപ്പോലെ ചിറകടിച്ചുയരും. അവർ ഓടിയാലും ക്ഷീണിക്കുകയില്ല; നടന്നാൽ തളരുകയുമില്ല.” കുഞ്ഞാടിനെ അനുഗമിക്കുന്നവർ സ്വന്തം ശക്തികൊണ്ടല്ല ഓടുന്നത്."],
 conn:[["കുഞ്ഞാട്.","പെസഹാക്കുഞ്ഞാടും (പുറ 12) “കൊല്ലാൻ കൊണ്ടുപോകുന്ന കുഞ്ഞാടിനെപ്പോലെ”യുള്ള ദാസനും (ഏശ 53:7) ദൈവത്തിന്റെ കുഞ്ഞാടായ യേശുവിൽ നിറവേറുന്നു (യോഹ 1:29; വെളി 5:6)."],["ഉടുപ്പുകൾ.","ജോസഫിന്റെ കുപ്പായവും സാമുവലിന്റെ ചെറിയ ഉടുപ്പും മാതാപിതാക്കളുടെ സ്നേഹത്തിന്റെ അടയാളങ്ങളാണ്; മാമ്മോദീസയിൽ നാം ക്രിസ്തുവിനെ ധരിക്കുന്നു (ഗലാ 3:27)."],["പ്രവൃത്തിയിലുള്ള സ്നേഹം.","വാക്കിലും സംസാരത്തിലുമല്ല, പ്രവൃത്തിയിലും സത്യത്തിലും സ്നേഹിക്കുക (1 യോഹ 3:18) എന്നതു യോഹന്നാന്റെ “രണ്ടുടുപ്പിന്റെ” അതേ പാഠമാണ്."],["മോശയുടെ തിരഞ്ഞെടുപ്പ്.","ദൈവജനത്തിനുവേണ്ടി മോശ ഫറവോയുടെ കൊട്ടാരം ഉപേക്ഷിച്ചു; നമുക്കുവേണ്ടി ക്രിസ്തു സ്വർഗമഹത്വം വിട്ടുവന്നു."]],
 altar:["വിശുദ്ധ കുർബാനസ്വീകരണത്തിനു മുമ്പു വൈദികൻ വിശുദ്ധ രഹസ്യങ്ങൾ ഉയർത്തുന്നു; ജോർദാൻതീരത്തു യോഹന്നാൻ ചൂണ്ടിക്കാണിച്ചവനെയാണു നാം ബലിപീഠത്തിൽനിന്നു സ്വീകരിക്കുന്നത്: ലോകത്തിന്റെ പാപം നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാട്."],
 outline:[["ആരംഭം","ചോദിക്കുക: ക്രിസ്മസിനു നമുക്ക് എന്തു ലഭിച്ചു? നാം എന്തു കൊടുത്തു?"],["ഒന്നാം ആശയം · ദൈവത്തിന്റെ കുഞ്ഞാട്","യൽദോയിലെ ശിശു പാപം നീക്കുന്ന കുഞ്ഞാടാണ്."],["രണ്ടാം ആശയം · “ഞങ്ങൾ എന്താണു ചെയ്യേണ്ടത്?”","രണ്ടുടുപ്പ്, സത്യസന്ധമായ ജോലി, കൊള്ളയില്ലായ്മ: പ്രായോഗികമായ മാനസാന്തരം."],["മൂന്നാം ആശയം · ദൈവസന്നിധിയിൽ വളരുക","ജോസഫ്, സാമുവൽ, മോശ: കുഞ്ഞുങ്ങൾ ദൈവസാന്നിധ്യത്തിൽ വളരട്ടെ."],["നാലാം ആശയം · കഴുകന്റെ ചിറകുകൾ","കർത്താവിൽ ആശ്രയിക്കുന്നവർക്കു പുതുവർഷത്തിൽ പുതിയ ശക്തി."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഇതാ കുഞ്ഞാട്; നിന്റെ രണ്ടാമത്തെ ഉടുപ്പു പങ്കുവയ്ക്കുക.”"]],
 live:[["രണ്ടാമത്തെ ഉടുപ്പു പങ്കുവയ്ക്കുക (ലൂക്കാ 3:11)","ഈ ആഴ്ച ആവശ്യമുള്ള ഒരാൾക്കു നല്ല ഒരു വസ്ത്രമോ ഭക്ഷണമോ നൽകുക."],["ജോലിയിൽ സത്യസന്ധത (ലൂക്കാ 3:13)","നിന്റെ ജോലിയിലോ കച്ചവടത്തിലോ ഒരു മേഖല സത്യസന്ധതയ്ക്കും നീതിക്കുമായി പരിശോധിക്കുക."],["ദനഹായ്ക്ക് ഒരുങ്ങുക","ബുധനാഴ്ചത്തെ ദനഹാ കുർബാനയിൽ പങ്കെടുത്ത് മാമ്മോദീസാവാഗ്ദാനങ്ങൾ നവീകരിക്കുക."]],
 fathers:[["അലക്സാണ്ട്രിയായിലെ വിശുദ്ധ സിറിൽ","മനുഷ്യവംശമാകുന്ന ആട്ടിൻകൂട്ടം മുഴുവനെയും പിതാവായ ദൈവത്തിലേക്കു ചേർക്കാൻ ഒരു കുഞ്ഞാട് എല്ലാവർക്കുംവേണ്ടി മരിച്ചു (യോഹന്നാൻ സുവിശേഷവ്യാഖ്യാനം, രണ്ടാം പുസ്തകം)."],["മിലാനിലെ വിശുദ്ധ അംബ്രോസ്","“രണ്ടുടുപ്പുള്ളവൻ” എന്നതിനെപ്പറ്റി: കരുണയാണു പുണ്യങ്ങളുടെ പൂർണത; ധനികരിൽനിന്നും ദരിദ്രരിൽനിന്നും, ഓരോരുത്തർക്കുമുള്ളതനുസരിച്ച്, അത് ആവശ്യപ്പെടുന്നു (ലൂക്കാസുവിശേഷവ്യാഖ്യാനം 2)."]],
 magis:[["മതബോധനഗ്രന്ഥം 608","ലോകത്തിന്റെ പാപം നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാടായി സ്നാപകയോഹന്നാൻ യേശുവിനെ ചൂണ്ടിക്കാണിച്ചു: സഹിക്കുന്ന ദാസനും പെസഹാക്കുഞ്ഞാടും."],["മതബോധനഗ്രന്ഥം 1434–1435","ആന്തരികമാനസാന്തരം ഉപവാസത്തിലും പ്രാർഥനയിലും ദാനധർമത്തിലും അനുരഞ്ജനത്തിലും ദരിദ്രരോടുള്ള കരുതലിലും പ്രകടമാകുന്നു."],["മതബോധനഗ്രന്ഥം 2443–2447","ദരിദ്രരോടുള്ള സ്നേഹം; ആവശ്യക്കാർക്കു നൽകുന്നതു നീതിയുടെ ഒരു പ്രവൃത്തിയാണ്."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ജനുവരി 3: വിശുദ്ധ ചാവറ കുര്യാക്കോസ് ഏലിയാസ്. ജനുവരി 6 (ബുധൻ): ദനഹാ, നമ്മുടെ കർത്താവിന്റെ മാമ്മോദീസ; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. ജനുവരി 7: സ്നാപകയോഹന്നാന്റെ പുകഴ്ച. ജനുവരി 8: പ്രഥമരക്തസാക്ഷിയായ വിശുദ്ധ സ്തേഫാനോസ് (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ)."]],
 prayer:"ലോകത്തിന്റെ പാപം നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാടായ കർത്താവായ യേശുവേ, ഞങ്ങളുടെമേൽ കരുണയുണ്ടാകണമേ. ഞങ്ങളുടെ മാനസാന്തരം പങ്കുവയ്ക്കലിലും സത്യസന്ധതയിലും സ്നേഹത്തിലും ഫലം പുറപ്പെടുവിക്കട്ടെ; ഓടിയാലും ക്ഷീണിക്കാതിരിക്കാൻ ഈ പുതുവർഷത്തിൽ ഞങ്ങളുടെ ശക്തി നവീകരിക്കണമേ. ആമേൻ."},
 {quick:["ബേത്‌ലെഹെമിലെ ശിശു ദൈവത്തിന്റെ കുഞ്ഞാടാണ്.","മാനസാന്തരം ഫലം പുറപ്പെടുവിക്കുന്നു: രണ്ടാമത്തെ ഉടുപ്പു പങ്കുവയ്ക്കുക.","കർത്താവിൽ ആശ്രയിക്കുന്നവർ വീണ്ടും ശക്തി പ്രാപിക്കുന്നു."],action:"ഈ ആഴ്ച നല്ല ഒരു വസ്ത്രമോ ഭക്ഷണമോ ആവശ്യമുള്ളവർക്കു നൽകുക.",question:"മറ്റൊരാൾക്ക് ആവശ്യമുള്ള എന്റെ “രണ്ടാമത്തെ ഉടുപ്പ്” ഏതാണ്?",
  special:"യൽദോയ്ക്കുശേഷമുള്ള രണ്ടാം ഞായർ. കടമുള്ള ദിവസമായ ജനുവരി 6 ബുധനാഴ്ചത്തെ ദനഹാ അറിയിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","ക്രിസ്മസിനുശേഷം പല കേരളഭവനങ്ങളിലെയും അലമാരകൾ പുതിയ വസ്ത്രങ്ങൾകൊണ്ടു നിറഞ്ഞിരിക്കും. ഒരു ഇടവക ക്രിസ്മസിനുശേഷമുള്ള ഞായറാഴ്ച ദരിദ്രർക്കായി നല്ല ഒരു വസ്ത്രം പള്ളിയിൽ കൊണ്ടുവരാൻ കുടുംബങ്ങളോട് ആവശ്യപ്പെടുന്നു. വാതിൽക്കലെ ആ കൂമ്പാരം പ്രവൃത്തിയിലായ സ്നാപകയോഹന്നാന്റെ പ്രസംഗമാണ്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 3:10–11; യോഹന്നാൻ 1:29.",explain:"രണ്ടുടുപ്പുണ്ടെങ്കിൽ ഒന്നു കൊടുക്കണമെന്നു സ്നാപകയോഹന്നാൻ പറഞ്ഞു. യേശുവിനെ ചൂണ്ടിക്കാണിച്ച് അവൻ പറഞ്ഞു: “ഇതാ, ദൈവത്തിന്റെ കുഞ്ഞാട്!”",intention:"ഈ ജനുവരിയിൽ തണുപ്പും വിശപ്പും അനുഭവിക്കുന്നവർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമ്മുടെ കുടുംബത്തിന് എന്തു പങ്കുവയ്ക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 608","ദൈവത്തിന്റെ കുഞ്ഞാടായ യേശു."],["മതബോധനഗ്രന്ഥം 2443–2447","ദരിദ്രരോടുള്ള സ്നേഹം."]],
  kidsaint:["വിശുദ്ധ ചാവറ കുര്യാക്കോസ് ഏലിയാസ് (ജനുവരി 3)","എല്ലാ കുട്ടികൾക്കും പഠിക്കാൻ പള്ളികളോടു ചേർന്നു സ്കൂളുകൾ ആരംഭിക്കുകയും സന്യാസസമൂഹങ്ങൾ സ്ഥാപിക്കുകയും പുസ്തകങ്ങൾ അച്ചടിക്കുകയും ചെയ്ത കൈനകരിക്കാരനായ വൈദികൻ. പാഠം: അറിവു ദൈവത്തിന്റെ ദാനമാണ്; മറ്റുള്ളവരെ സഹായിക്കാൻ അത് ഉപയോഗിക്കുക."],
  term:["ദൈവത്തിന്റെ കുഞ്ഞാട്","സ്നാപകയോഹന്നാൻ യേശുവിനെ വിളിച്ച പേര് (യോഹ 1:29). പെസഹാക്കുഞ്ഞാടിനെയും ഏശയ്യായുടെ സഹിക്കുന്ന ദാസനെയും അത് അനുസ്മരിപ്പിക്കുന്നു: ലോകത്തിന്റെ പാപം നീക്കാൻ യേശു തന്റെ ജീവൻ നൽകുന്നു."],
  termMore:["യൽദോയ്ക്കും ദനഹായ്ക്കുമിടയിൽ","ക്രിസ്മസ്മുതൽ കർത്താവിന്റെ മാമ്മോദീസവരെയുള്ള ദിവസങ്ങൾ ഒരേ രഹസ്യം വിടർത്തുന്നു: ആട്ടിടയന്മാർക്കും ജ്ഞാനികൾക്കും ജോർദാനിലും ക്രിസ്തുവിൽ വെളിപ്പെട്ട ദൈവം."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, നാം ഇപ്പോഴും ക്രിസ്മസിന്റെ പ്രകാശത്തിലാണ്; ഇന്നു സ്നാപകയോഹന്നാൻ ബേത്‌ലെഹെമിലെ ശിശുവിനെ ചൂണ്ടിക്കാണിച്ചു പറയുന്നു: “ഇതാ, ലോകത്തിന്റെ പാപം നീക്കുന്ന ദൈവത്തിന്റെ കുഞ്ഞാട്.” പുൽത്തൊട്ടിയിലെ ശിശു ഒരു ലക്ഷ്യത്തോടെയാണു വന്നത്: ഇസ്രായേലിനുവേണ്ടി പെസഹാക്കുഞ്ഞാട് അർപ്പിക്കപ്പെട്ടതുപോലെ നമുക്കുവേണ്ടി തന്റെ ജീവൻ നൽകാൻ.","സന്ധ്യാസുവിശേഷത്തിൽ ജനക്കൂട്ടം യോഹന്നാനോടു ചോദിക്കുന്നു: “ഞങ്ങൾ എന്താണു ചെയ്യേണ്ടത്?” അവന്റെ ഉത്തരം വളരെ ലളിതമാണ്: “രണ്ടുടുപ്പുള്ളവൻ ഒന്ന് ഇല്ലാത്തവനു കൊടുക്കട്ടെ. ഭക്ഷണം ഉള്ളവനും അങ്ങനെ ചെയ്യട്ടെ.” ചുങ്കക്കാരോട്: സത്യസന്ധരായിരിക്കുക. പടയാളികളോട്: കൊള്ളയടിക്കരുത്. മാനസാന്തരം മനോഹരമായ ഒരു വികാരമല്ല; നമുക്കുള്ളവ ഉപയോഗിക്കുന്നതിലെ മാറിയ ഒരു രീതിയാണ്.","ക്രിസ്മസിനുശേഷം നമ്മിൽ പലർക്കും ആവശ്യത്തിലധികമുണ്ട്: പുതിയ വസ്ത്രങ്ങൾ, മധുരപലഹാരങ്ങൾ, സമ്മാനങ്ങൾ. യോഹന്നാൻ ചോദിക്കുന്നു: നിന്റെ രണ്ടാമത്തെ ഉടുപ്പ് എവിടെ? ആർക്കാണ് അത് ആവശ്യം? ദൈവത്തോടു ചേർന്നു വളരുന്ന കുഞ്ഞുങ്ങളെയും നമ്മുടെ വായനകൾ കാണിക്കുന്നു: കർത്താവിന്റെ സന്നിധിയിൽ വളർന്നുവന്ന സാമുവൽ; വർഷംതോറും അവന്റെ അമ്മ കൊണ്ടുവന്ന ചെറിയ ഉടുപ്പ്. നമ്മുടെ കുഞ്ഞുങ്ങളെയും അങ്ങനെ വളരാൻ നമുക്കു സഹായിക്കാം.","പുതുവർഷം ആരംഭിക്കുമ്പോൾ ഏശയ്യാ വാഗ്ദാനം ചെയ്യുന്നു: “ദൈവത്തിൽ ആശ്രയിക്കുന്നവർ വീണ്ടും ശക്തി പ്രാപിക്കും; അവർ കഴുകന്മാരെപ്പോലെ ചിറകടിച്ചുയരും.” ബുധനാഴ്ച നാം കർത്താവിന്റെ മാമ്മോദീസയായ ദനഹാ ആഘോഷിക്കുന്നു. വരുക, നിന്റെ മാമ്മോദീസ നവീകരിക്കുക, കുഞ്ഞാടിനെ അനുഗമിക്കുക. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, സ്നാപകയോഹന്നാൻ യേശുവിന്റെ ബന്ധുവായിരുന്നു. യേശു വരുന്നതു കണ്ടപ്പോൾ അവൻ പറഞ്ഞു: “നോക്കൂ! ദൈവത്തിന്റെ കുഞ്ഞാട്!” നമ്മുടെ എല്ലാ പാപങ്ങളും നീക്കാനാണ് യേശു വന്നതെന്നാണ് അവൻ ഉദ്ദേശിച്ചത്.","ആളുകൾ യോഹന്നാനോടു ചോദിച്ചു: “ഞങ്ങൾ എന്തു ചെയ്യണം?” അവൻ പറഞ്ഞു: “നിനക്കു രണ്ടുടുപ്പുണ്ടെങ്കിൽ ഇല്ലാത്തവന് ഒന്നു കൊടുക്കുക.”","പങ്കുവയ്ക്കാൻ പറ്റുന്ന ഒരു കളിപ്പാട്ടമോ ഉടുപ്പോ നിങ്ങൾക്കുണ്ടോ? നമുക്കു പറയാം: “യോഹന്നാനെപ്പോലെ ഞാൻ പങ്കുവയ്ക്കും!”"]});

/* ================= DENHO · 6 January 2027 ================= */
put("2027-01-06","en",{title:"Denho · The Baptism of our Lord",readTitle:EN.rt,
 readings:[[EN.eg,"Mark 1:1–11","You are my Son, the Beloved"],[EN.ot,"Genesis 24:10–20","Rebekah gives water at the well"],[EN.ot,"2 Kings 3:21–27","Water fills the valley"],[EN.ot,"Ezekiel 47:1–12","The river flowing from the Temple"],[EN.ot,"Isaiah 12:1–6","Draw water from the wells of salvation"],[EN.ac,"Acts 19:1–7","Baptised in the name of the Lord Jesus"],[EN.pa,"Titus 2:11–3:9","The water of rebirth and renewal"],[EN.go,"Matthew 3:13–17","The Baptism of Jesus in the Jordan"]],
 alt:"Denho, the Baptism of our Lord: a day of obligation; Holy Qurbono for the people. In many parishes the waters are solemnly blessed.",
 verse:"This is my Son, the Beloved, with whom I am well pleased.",cite:"Matthew 3:17",
 theo:["Denho means “rising” or “manifestation”. At the Jordan the hidden Child of Bethlehem is revealed to the world. When Jesus comes up from the water, “the heavens were opened to him and he saw the Spirit of God descending like a dove and alighting on him. And a voice from heaven said, ‘This is my Son, the Beloved, with whom I am well pleased.’” For the first time the whole Holy Trinity is manifested: the Father speaks, the Son stands in the water, the Spirit descends.","John protests: “I need to be baptized by you.” Jesus answers: “Let it be so now; for it is proper for us in this way to fulfill all righteousness.” The sinless One goes down into the waters of repentance with sinners. He does not need to be cleansed; he cleanses the waters. The Fathers say that by his Baptism Christ sanctified the waters for our Baptism.","The Old Testament readings are full of water: Rebekah drawing water for a stranger and his camels; water filling the dry valley; Ezekiel's river flowing from the Temple, where “everything will live where the river goes”; Isaiah's promise: “With joy you will draw water from the wells of salvation.” All these streams flow into the Jordan, and from the Jordan into our baptismal font.","St Paul tells Titus: “the grace of God has appeared, bringing salvation to all”, and God saved us “through the water of rebirth and renewal by the Holy Spirit”. Denho is our feast too. In Baptism the Father said to each of us, “You are my beloved child”, and the Spirit came to dwell in us. Today we renew that grace."],
 conn:[["The Trinity revealed.","Father, Son and Holy Spirit appear together at the Jordan, as the Son later sends the apostles to baptise “in the name of the Father and of the Son and of the Holy Spirit” (Matthew 28:19)."],["The dove.","The dove over the waters recalls the Spirit hovering over the waters at creation (Genesis 1:2) and the dove of the flood (Genesis 8:11): a new creation begins."],["The river of life.","Ezekiel's river (47:1–12) flows again in Revelation 22:1, “the river of the water of life… flowing from the throne of God and of the Lamb”."],["Baptism in the name of Jesus.","In Acts 19 Paul baptises disciples who knew only John's baptism, and the Holy Spirit comes upon them: Christian Baptism gives the Spirit."]],
 altar:["The Spirit who descended on Jesus at the Jordan descends on the bread and wine at every Holy Qurbono. The water mixed with the wine in the chalice recalls our Baptism and our union with Christ."],
 outline:[["Opening","Recall our own baptism day: who brought us, who were our godparents?"],["Point 1 · Denho: God revealed","The Trinity at the Jordan: the Father's voice, the Son, the Spirit."],["Point 2 · Christ sanctifies the waters","The sinless One goes down among sinners; he cleanses the waters for us."],["Point 3 · Wells of salvation","Rebekah, Ezekiel, Isaiah: water as God's gift of life."],["Point 4 · “You are my beloved”","Baptism makes us children of God. Renew the baptismal promises."],["Take-home line","“In Christ, I too am the Father's beloved child.”"]],
 live:[["Know your baptism day","Find out the date of your Baptism and keep it each year with a prayer of thanks."],["Use holy water","Take home the blessed water of Denho; bless yourself and your children every night."],["Renew the promises","Pray the Creed slowly today as the renewal of your baptismal faith."]],
 fathers:[["St Gregory of Nazianzus","“Christ is baptised: let us go down with him, that we may also rise with him.” He comes to sanctify the Jordan for our sake (Oration 39, On the Holy Lights)."],["St Ephrem the Syrian","“Come down, my brothers, put on from the waters the Holy Spirit.” In his Hymns on the Epiphany he sings of the Lord who went down into the river and made the waters a womb of new birth."]],
 magis:[["Catechism 535–537","The baptism of Jesus is his acceptance of his mission as the Suffering Servant; the Spirit and the Father's voice reveal him. Through Baptism the Christian is sacramentally assimilated to Jesus."],["Catechism 1223–1225","The Lord's baptism and his Passover are the sources of Christian Baptism."],["Catechism 1213","Baptism is the gateway to life in the Spirit; by it we are freed from sin and reborn as children of God."]],
 saints:[["Around Denho (fixed dates)","7 Jan: Exaltation of St John the Baptist. 8 Jan: St Stephen, the first martyr. Confirm in the 2026–27 lectionary."]],
 prayer:"Eternal Father, at the Jordan you revealed your beloved Son and sent your Holy Spirit upon him. Renew in us the grace of our Baptism, make us live as your beloved children, and let the river of your life flow through our homes and our Church. Amen."},
 {quick:["Denho: at the Jordan the Holy Trinity is revealed.","Christ, who has no sin, sanctifies the waters for our Baptism.","In Baptism the Father calls each of us “my beloved child”."],action:"Find out the date of your Baptism and thank God for it today.",question:"Do I live as the Father's beloved child?",
  special:"Denho, the Baptism of our Lord: day of obligation; Holy Qurbono for the people.",
  illus:["An illustration","In old Kerala Christian homes the date of Baptism was written inside the family Bible, beside the date of birth. Many grandparents knew it better than their birthday. Denho reminds us that the second birth matters even more than the first."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 3:13–17.",explain:"Jesus was baptised by John in the river Jordan. Heaven opened, the Holy Spirit came down like a dove, and the Father said: “This is my beloved Son.” At our Baptism God said the same about us!",intention:"We thank God for our Baptism and pray for our godparents.",ask:"Ask: “Do we know the day each of us was baptised, and who our godparents are?”"},
  catechism:[["CCC 535–537","The baptism of Jesus."],["CCC 1262–1270","The effects of Baptism."]],
  kidsaint:["St John the Baptist","He lived in the desert, called people to change their hearts, and had the joy of baptising Jesus. He said: “He must increase, but I must decrease.” Lesson: point others to Jesus, not to yourself."],
  term:["Denho (ദനഹാ)","Syriac for “rising” or “dawn”: the manifestation of Christ at his Baptism in the Jordan, 6 January. In the Malankara tradition the waters are solemnly blessed on this feast, and the faithful take the blessed water home."],
  termMore:["Why 6 January?","From the early centuries the Eastern Churches celebrated on 6 January the manifestation of Christ, above all his Baptism. The season of Denho continues until the Great Fast."]},
 {homily:["Dear brothers and sisters, today is Denho, the feast of the manifestation of the Lord. The Child of Bethlehem, hidden for thirty years in Nazareth, comes to the Jordan and is revealed to the world. When he comes up out of the water, the heavens open, the Spirit descends like a dove, and the Father's voice says: “This is my Son, the Beloved, with whom I am well pleased.”","John did not want to baptise him: “I need to be baptised by you!” But Jesus went down into the water with sinners. Why? He had no sin to wash away. The Fathers answer: he went down to make the waters holy for us. The Jordan became the source of every baptismal font in the world.","Our Old Testament readings are full of water: Rebekah at the well, a river flowing from the Temple bringing life wherever it goes, Isaiah's joyful promise: “With joy you will draw water from the wells of salvation.” In our Baptism we drank from those wells. And the same voice spoke over each of us: “You are my beloved child.”","Today, as the waters are blessed, let us renew our baptismal promises with faith. Take the blessed water home; bless your children with it each night. Find out the date of your Baptism and thank God for it every year. Live as beloved children of the Father, filled with the Holy Spirit. Amen."],
  kids:["Children, today we remember the day Jesus was baptised in the river Jordan. When he came out of the water, heaven opened!","The Holy Spirit came down like a white dove, and God the Father said: “This is my beloved Son!” Father, Son and Holy Spirit, all together.","When you were baptised, God said: “You are my beloved child!” Do you know your baptism day? Ask your parents tonight! Let's say: “I am God's beloved child!”"]});

put("2027-01-06","ml",{title:"ദനഹാ · നമ്മുടെ കർത്താവിന്റെ മാമ്മോദീസ",readTitle:ML.rt,
 readings:[[ML.eg,"മർക്കോസ് 1:1–11","നീ എന്റെ പ്രിയപുത്രൻ"],[ML.ot,"ഉൽപത്തി 24:10–20","കിണറ്റിൻകരയിൽ റബേക്കാ വെള്ളം നൽകുന്നു"],[ML.ot,"2 രാജാക്കന്മാർ 3:21–27","താഴ്‌വര വെള്ളംകൊണ്ടു നിറയുന്നു"],[ML.ot,"എസെക്കിയേൽ 47:1–12","ദേവാലയത്തിൽനിന്ന് ഒഴുകുന്ന നദി"],[ML.ot,"ഏശയ്യാ 12:1–6","രക്ഷയുടെ കിണറ്റിൽനിന്നു ജലം കോരുക"],[ML.ac,"അപ്പ. പ്രവ. 19:1–7","കർത്താവായ യേശുവിന്റെ നാമത്തിൽ മാമ്മോദീസ"],[ML.pa,"തീത്തോസ് 2:11–3:9","പുനർജനനത്തിന്റെയും നവീകരണത്തിന്റെയും ജലം"],[ML.go,"മത്തായി 3:13–17","ജോർദാനിൽ യേശുവിന്റെ മാമ്മോദീസ"]],
 alt:"ദനഹാ, നമ്മുടെ കർത്താവിന്റെ മാമ്മോദീസ: കടമുള്ള ദിവസം; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. പല ഇടവകകളിലും ജലം ആഘോഷമായി വാഴ്ത്തുന്നു.",
 verse:"ഇവൻ എന്റെ പ്രിയപുത്രൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു.",cite:"മത്തായി 3:17",
 theo:["ദനഹാ എന്നതിന്റെ അർഥം “ഉദയം” അഥവാ “വെളിപ്പെടുത്തൽ” എന്നാണ്. ജോർദാനിൽ ബേത്‌ലെഹെമിലെ മറഞ്ഞിരുന്ന ശിശു ലോകത്തിനു വെളിപ്പെടുത്തപ്പെടുന്നു. “സ്നാനം കഴിഞ്ഞയുടൻ യേശു വെള്ളത്തിൽ നിന്നു കയറി. അപ്പോൾ സ്വർഗം തുറക്കപ്പെട്ടു. ദൈവാത്മാവ് പ്രാവിന്റെ രൂപത്തിൽ തന്റെ മേൽ ഇറങ്ങിവരുന്നത് അവൻ കണ്ടു. ഇവൻ എന്റെ പ്രിയപുത്രൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു എന്ന് ഒരു സ്വരം സ്വർഗത്തിൽനിന്നു കേട്ടു.” പരിശുദ്ധ ത്രിത്വം മുഴുവനും ആദ്യമായി വെളിപ്പെടുന്നു: പിതാവു സംസാരിക്കുന്നു, പുത്രൻ ജലത്തിൽ നിൽക്കുന്നു, ആത്മാവ് ഇറങ്ങിവരുന്നു.","യോഹന്നാൻ തടയുന്നു: “ഞാൻ നിന്നിൽനിന്ന് സ്നാനം സ്വീകരിക്കേണ്ടിയിരിക്കെ, നീ എന്റെ അടുത്തേക്കുവരുന്നുവോ?” യേശു ഉത്തരം നൽകുന്നു: “ഇപ്പോൾ ഇതു സമ്മതിക്കുക; അങ്ങനെ സർവനീതിയും പൂർത്തിയാക്കുക നമുക്ക് ഉചിതമാണ്.” പാപമില്ലാത്തവൻ പാപികളോടൊപ്പം അനുതാപത്തിന്റെ ജലത്തിലേക്ക് ഇറങ്ങുന്നു. അവിടുത്തേക്കു ശുദ്ധീകരണം ആവശ്യമില്ല; അവിടുന്നു ജലത്തെ ശുദ്ധീകരിക്കുന്നു. തന്റെ മാമ്മോദീസയാൽ ക്രിസ്തു നമ്മുടെ മാമ്മോദീസയ്ക്കായി ജലത്തെ വിശുദ്ധീകരിച്ചുവെന്നു പിതാക്കന്മാർ പറയുന്നു.","പഴയനിയമവായനകൾ ജലംകൊണ്ടു നിറഞ്ഞതാണ്: ഒരു അപരിചിതനും അവന്റെ ഒട്ടകങ്ങൾക്കുംവേണ്ടി വെള്ളം കോരുന്ന റബേക്കാ; വരണ്ട താഴ്‌വര നിറയുന്ന വെള്ളം; “നദി ഒഴുകുന്നിടത്തെല്ലാം ജീവൻ നിറഞ്ഞുനിൽക്കും” എന്നു പറയുന്ന, ദേവാലയത്തിൽനിന്ന് ഒഴുകുന്ന എസെക്കിയേലിന്റെ നദി; ഏശയ്യായുടെ വാഗ്ദാനം: “രക്ഷയുടെ കിണറ്റിൽനിന്ന് നീ സന്തോഷത്തോടെ ജലം കോരിയെടുക്കും.” ഈ അരുവികളെല്ലാം ജോർദാനിലേക്കും ജോർദാനിൽനിന്നു നമ്മുടെ മാമ്മോദീസാത്തൊട്ടിയിലേക്കും ഒഴുകുന്നു.","എല്ലാവർക്കും രക്ഷ നൽകുന്ന ദൈവകൃപ പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നുവെന്നും, പുനർജനനത്തിന്റെയും പരിശുദ്ധാത്മാവിനാലുള്ള നവീകരണത്തിന്റെയും ജലത്തിലൂടെ ദൈവം നമ്മെ രക്ഷിച്ചുവെന്നും വിശുദ്ധ പൗലോസ് തീത്തോസിനോടു പറയുന്നു (തീത്തോ 2:11; 3:5). ദനഹാ നമ്മുടെയും തിരുനാളാണ്. മാമ്മോദീസയിൽ പിതാവു നമ്മളോരോരുത്തരോടും “നീ എന്റെ പ്രിയപ്പെട്ട മകൻ, മകൾ” എന്നു പറഞ്ഞു; ആത്മാവു നമ്മിൽ വസിക്കാൻ വന്നു. ഇന്നു നാം ആ കൃപ നവീകരിക്കുന്നു."],
 conn:[["ത്രിത്വം വെളിപ്പെടുന്നു.","പിതാവും പുത്രനും പരിശുദ്ധാത്മാവും ജോർദാനിൽ ഒന്നിച്ചു പ്രത്യക്ഷപ്പെടുന്നു; പിന്നീടു പുത്രൻ “പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തിൽ” മാമ്മോദീസ നൽകാൻ ശ്ലീഹന്മാരെ അയയ്ക്കുന്നു (മത്താ 28:19)."],["പ്രാവ്.","ജലത്തിനു മീതേയുള്ള പ്രാവു സൃഷ്ടിയിൽ ജലത്തിനു മീതേ ചലിച്ച ആത്മാവിനെയും (ഉൽപ 1:2) ജലപ്രളയത്തിലെ പ്രാവിനെയും (ഉൽപ 8:11) അനുസ്മരിപ്പിക്കുന്നു: ഒരു പുതിയ സൃഷ്ടി ആരംഭിക്കുന്നു."],["ജീവന്റെ നദി.","എസെക്കിയേലിന്റെ നദി (47:1–12) വെളിപാട് 22:1-ൽ വീണ്ടും ഒഴുകുന്നു: ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനത്തിൽനിന്ന് ഒഴുകുന്ന ജീവജലത്തിന്റെ നദി."],["യേശുവിന്റെ നാമത്തിൽ മാമ്മോദീസ.","യോഹന്നാന്റെ മാമ്മോദീസ മാത്രം അറിഞ്ഞിരുന്ന ശിഷ്യന്മാർക്ക് അപ്പസ്തോലപ്രവർത്തനങ്ങൾ 19-ൽ പൗലോസ് മാമ്മോദീസ നൽകുന്നു; പരിശുദ്ധാത്മാവ് അവരുടെമേൽ വരുന്നു: ക്രൈസ്തവമാമ്മോദീസ ആത്മാവിനെ നൽകുന്നു."]],
 altar:["ജോർദാനിൽ യേശുവിന്റെമേൽ ഇറങ്ങിവന്ന ആത്മാവ് ഓരോ വിശുദ്ധ കുർബാനയിലും അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയുംമേൽ ഇറങ്ങിവരുന്നു. കാസയിൽ വീഞ്ഞിനോടു ചേർക്കുന്ന ജലം നമ്മുടെ മാമ്മോദീസയെയും ക്രിസ്തുവുമായുള്ള നമ്മുടെ ഐക്യത്തെയും അനുസ്മരിപ്പിക്കുന്നു."],
 outline:[["ആരംഭം","നമ്മുടെ മാമ്മോദീസാദിവസം ഓർക്കുക: ആരാണു നമ്മെ കൊണ്ടുവന്നത്? നമ്മുടെ തലതൊട്ടപ്പന്മാർ ആരായിരുന്നു?"],["ഒന്നാം ആശയം · ദനഹാ: ദൈവം വെളിപ്പെടുന്നു","ജോർദാനിലെ ത്രിത്വം: പിതാവിന്റെ സ്വരം, പുത്രൻ, ആത്മാവ്."],["രണ്ടാം ആശയം · ക്രിസ്തു ജലത്തെ വിശുദ്ധീകരിക്കുന്നു","പാപമില്ലാത്തവൻ പാപികളുടെ ഇടയിലേക്ക് ഇറങ്ങുന്നു; നമുക്കായി ജലത്തെ ശുദ്ധീകരിക്കുന്നു."],["മൂന്നാം ആശയം · രക്ഷയുടെ കിണറുകൾ","റബേക്കാ, എസെക്കിയേൽ, ഏശയ്യാ: ദൈവത്തിന്റെ ജീവദാനമായ ജലം."],["നാലാം ആശയം · “നീ എന്റെ പ്രിയപ്പെട്ടവൻ”","മാമ്മോദീസ നമ്മെ ദൈവമക്കളാക്കുന്നു. മാമ്മോദീസാവാഗ്ദാനങ്ങൾ നവീകരിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ക്രിസ്തുവിൽ ഞാനും പിതാവിന്റെ പ്രിയപ്പെട്ട കുഞ്ഞാണ്.”"]],
 live:[["നിന്റെ മാമ്മോദീസാദിനം അറിയുക","നിന്റെ മാമ്മോദീസയുടെ തീയതി കണ്ടെത്തി എല്ലാ വർഷവും നന്ദിയുടെ ഒരു പ്രാർഥനയോടെ ആചരിക്കുക."],["വിശുദ്ധജലം ഉപയോഗിക്കുക","ദനഹായിൽ വാഴ്ത്തിയ ജലം വീട്ടിലേക്കു കൊണ്ടുപോകുക; എല്ലാ രാത്രിയും നിന്നെയും മക്കളെയും അതുകൊണ്ട് ആശീർവദിക്കുക."],["വാഗ്ദാനങ്ങൾ നവീകരിക്കുക","മാമ്മോദീസാവിശ്വാസത്തിന്റെ നവീകരണമായി ഇന്നു വിശ്വാസപ്രമാണം സാവധാനം ചൊല്ലുക."]],
 fathers:[["നസിയാൻസിലെ വിശുദ്ധ ഗ്രിഗറി","ക്രിസ്തു മാമ്മോദീസ സ്വീകരിക്കുന്നു: അവിടുത്തോടൊപ്പം ഉയരാൻവേണ്ടി നമുക്ക് അവിടുത്തോടൊപ്പം ഇറങ്ങാം. നമുക്കുവേണ്ടി ജോർദാനെ വിശുദ്ധീകരിക്കാനാണ് അവിടുന്നു വരുന്നത് (പ്രസംഗം 39, വിശുദ്ധ ദീപങ്ങളെപ്പറ്റി)."],["മാർ അപ്രേം","സഹോദരന്മാരേ, ഇറങ്ങിവരുവിൻ; ജലത്തിൽനിന്നു പരിശുദ്ധാത്മാവിനെ ധരിക്കുവിൻ. നദിയിലേക്ക് ഇറങ്ങി ജലത്തെ പുതുജനനത്തിന്റെ ഉദരമാക്കിയ കർത്താവിനെപ്പറ്റി അദ്ദേഹം ദനഹാഗീതങ്ങളിൽ പാടുന്നു."]],
 magis:[["മതബോധനഗ്രന്ഥം 535–537","സഹിക്കുന്ന ദാസനെന്ന ദൗത്യം യേശു സ്വീകരിക്കുന്നതാണ് അവിടുത്തെ മാമ്മോദീസ; ആത്മാവും പിതാവിന്റെ സ്വരവും അവിടുത്തെ വെളിപ്പെടുത്തുന്നു. മാമ്മോദീസയിലൂടെ ക്രൈസ്തവൻ കൗദാശികമായി യേശുവിനോട് അനുരൂപനാകുന്നു."],["മതബോധനഗ്രന്ഥം 1223–1225","കർത്താവിന്റെ മാമ്മോദീസയും പെസഹായുമാണു ക്രൈസ്തവമാമ്മോദീസയുടെ ഉറവിടങ്ങൾ."],["മതബോധനഗ്രന്ഥം 1213","ആത്മാവിലുള്ള ജീവിതത്തിലേക്കുള്ള വാതിലാണു മാമ്മോദീസ; അതിലൂടെ നാം പാപത്തിൽനിന്നു മോചിതരായി ദൈവമക്കളായി പുനർജനിക്കുന്നു."]],
 saints:[["ദനഹായോടനുബന്ധിച്ച് (സ്ഥിരം തീയതികൾ)","ജനുവരി 7: സ്നാപകയോഹന്നാന്റെ പുകഴ്ച. ജനുവരി 8: പ്രഥമരക്തസാക്ഷിയായ വിശുദ്ധ സ്തേഫാനോസ്. 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"നിത്യപിതാവേ, ജോർദാനിൽ അങ്ങയുടെ പ്രിയപുത്രനെ അങ്ങു വെളിപ്പെടുത്തുകയും അവിടുത്തെമേൽ പരിശുദ്ധാത്മാവിനെ അയയ്ക്കുകയും ചെയ്തു. ഞങ്ങളുടെ മാമ്മോദീസയുടെ കൃപ ഞങ്ങളിൽ നവീകരിക്കണമേ; അങ്ങയുടെ പ്രിയമക്കളായി ജീവിക്കാൻ ഞങ്ങളെ സഹായിക്കണമേ; അങ്ങയുടെ ജീവന്റെ നദി ഞങ്ങളുടെ ഭവനങ്ങളിലൂടെയും സഭയിലൂടെയും ഒഴുകട്ടെ. ആമേൻ."},
 {quick:["ദനഹാ: ജോർദാനിൽ പരിശുദ്ധ ത്രിത്വം വെളിപ്പെടുന്നു.","പാപമില്ലാത്ത ക്രിസ്തു നമ്മുടെ മാമ്മോദീസയ്ക്കായി ജലത്തെ വിശുദ്ധീകരിക്കുന്നു.","മാമ്മോദീസയിൽ പിതാവു നമ്മളോരോരുത്തരെയും “എന്റെ പ്രിയപ്പെട്ട കുഞ്ഞ്” എന്നു വിളിക്കുന്നു."],action:"നിന്റെ മാമ്മോദീസയുടെ തീയതി കണ്ടെത്തി ഇന്ന് അതിനായി ദൈവത്തിനു നന്ദി പറയുക.",question:"പിതാവിന്റെ പ്രിയപ്പെട്ട കുഞ്ഞായി ഞാൻ ജീവിക്കുന്നുണ്ടോ?",
  special:"ദനഹാ, നമ്മുടെ കർത്താവിന്റെ മാമ്മോദീസ: കടമുള്ള ദിവസം; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന.",
  illus:["ഒരു ഉദാഹരണം","പഴയ കേരളക്രൈസ്തവഭവനങ്ങളിൽ, ജനനത്തീയതിക്കരികെ മാമ്മോദീസയുടെ തീയതിയും കുടുംബബൈബിളിനുള്ളിൽ എഴുതിവച്ചിരുന്നു. പല വല്യപ്പച്ചന്മാർക്കും ജന്മദിനത്തെക്കാൾ നന്നായി അത് അറിയാമായിരുന്നു. ഒന്നാം ജനനത്തെക്കാൾ രണ്ടാം ജനനമാണു പ്രധാനമെന്നു ദനഹാ ഓർമിപ്പിക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 3:13–17.",explain:"ജോർദാൻ നദിയിൽ യോഹന്നാൻ യേശുവിനു മാമ്മോദീസ നൽകി. സ്വർഗം തുറന്നു; പരിശുദ്ധാത്മാവ് ഒരു പ്രാവിനെപ്പോലെ ഇറങ്ങിവന്നു; പിതാവു പറഞ്ഞു: “ഇവൻ എന്റെ പ്രിയപുത്രൻ.” നമ്മുടെ മാമ്മോദീസയിൽ ദൈവം നമ്മെപ്പറ്റിയും അതുതന്നെ പറഞ്ഞു!",intention:"നമ്മുടെ മാമ്മോദീസയ്ക്കായി ദൈവത്തിനു നന്ദി പറഞ്ഞ്, നമ്മുടെ തലതൊട്ടപ്പന്മാർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മളോരോരുത്തരും മാമ്മോദീസ സ്വീകരിച്ച ദിവസവും നമ്മുടെ തലതൊട്ടപ്പന്മാർ ആരെന്നും നമുക്കറിയാമോ?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 535–537","യേശുവിന്റെ മാമ്മോദീസ."],["മതബോധനഗ്രന്ഥം 1262–1270","മാമ്മോദീസയുടെ ഫലങ്ങൾ."]],
  kidsaint:["സ്നാപകയോഹന്നാൻ","മരുഭൂമിയിൽ ജീവിച്ച്, ഹൃദയം മാറ്റാൻ ആളുകളെ വിളിക്കുകയും യേശുവിനു മാമ്മോദീസ നൽകാനുള്ള ഭാഗ്യം ലഭിക്കുകയും ചെയ്തവൻ. “അവൻ വളരുകയും ഞാൻ കുറയുകയും വേണം” എന്ന് അവൻ പറഞ്ഞു. പാഠം: മറ്റുള്ളവരെ നിന്നിലേക്കല്ല, യേശുവിലേക്കു ചൂണ്ടിക്കാണിക്കുക."],
  term:["ദനഹാ","“ഉദയം” അഥവാ “പ്രഭാതം” എന്നതിന്റെ സുറിയാനിപദം: ജനുവരി 6-നു ജോർദാനിലെ മാമ്മോദീസയിൽ ക്രിസ്തുവിന്റെ വെളിപ്പെടുത്തൽ. മലങ്കര പാരമ്പര്യത്തിൽ ഈ തിരുനാളിൽ ജലം ആഘോഷമായി വാഴ്ത്തുന്നു; വിശ്വാസികൾ വാഴ്ത്തിയ ജലം വീട്ടിലേക്കു കൊണ്ടുപോകുന്നു."],
  termMore:["എന്തുകൊണ്ടു ജനുവരി 6?","ആദിമനൂറ്റാണ്ടുകൾമുതൽ പൗരസ്ത്യസഭകൾ ജനുവരി 6-ന് ക്രിസ്തുവിന്റെ വെളിപ്പെടുത്തൽ, പ്രത്യേകിച്ച് അവിടുത്തെ മാമ്മോദീസ, ആഘോഷിച്ചിരുന്നു. ദനഹാക്കാലം വലിയ നോമ്പുവരെ തുടരുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു കർത്താവിന്റെ വെളിപ്പെടുത്തലിന്റെ തിരുനാളായ ദനഹായാണ്. മുപ്പതു വർഷം നസറത്തിൽ മറഞ്ഞിരുന്ന ബേത്‌ലെഹെമിലെ ശിശു ജോർദാനിലേക്കു വരുകയും ലോകത്തിനു വെളിപ്പെടുത്തപ്പെടുകയും ചെയ്യുന്നു. അവിടുന്നു വെള്ളത്തിൽനിന്നു കയറിയപ്പോൾ സ്വർഗം തുറന്നു; ആത്മാവു പ്രാവിനെപ്പോലെ ഇറങ്ങിവന്നു; പിതാവിന്റെ സ്വരം പറഞ്ഞു: “ഇവൻ എന്റെ പ്രിയപുത്രൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു.”","അവിടുത്തേക്കു മാമ്മോദീസ നൽകാൻ യോഹന്നാൻ ആഗ്രഹിച്ചില്ല: “ഞാൻ നിന്നിൽനിന്ന് സ്നാനം സ്വീകരിക്കേണ്ടിയിരിക്കെ, നീ എന്റെ അടുത്തേക്കുവരുന്നുവോ?” എങ്കിലും യേശു പാപികളോടൊപ്പം ജലത്തിലേക്ക് ഇറങ്ങി. എന്തിന്? കഴുകിക്കളയാൻ അവിടുത്തേക്കു പാപമില്ലായിരുന്നു. പിതാക്കന്മാർ ഉത്തരം നൽകുന്നു: നമുക്കുവേണ്ടി ജലത്തെ വിശുദ്ധമാക്കാനാണ് അവിടുന്ന് ഇറങ്ങിയത്. ലോകത്തിലെ ഓരോ മാമ്മോദീസാത്തൊട്ടിയുടെയും ഉറവിടമായി ജോർദാൻ മാറി.","നമ്മുടെ പഴയനിയമവായനകൾ ജലംകൊണ്ടു നിറഞ്ഞതാണ്: കിണറ്റിൻകരയിലെ റബേക്കാ; ഒഴുകുന്നിടത്തെല്ലാം ജീവൻ നൽകുന്ന, ദേവാലയത്തിൽനിന്നുള്ള നദി; ഏശയ്യായുടെ സന്തോഷപൂർണമായ വാഗ്ദാനം: “രക്ഷയുടെ കിണറ്റിൽനിന്ന് നീ സന്തോഷത്തോടെ ജലം കോരിയെടുക്കും.” നമ്മുടെ മാമ്മോദീസയിൽ നാം ആ കിണറുകളിൽനിന്നു കുടിച്ചു. അതേ സ്വരം നമ്മളോരോരുത്തരുടെയുംമേൽ സംസാരിച്ചു: “നീ എന്റെ പ്രിയപ്പെട്ട കുഞ്ഞാണ്.”","ഇന്നു ജലം വാഴ്ത്തപ്പെടുമ്പോൾ വിശ്വാസത്തോടെ നമ്മുടെ മാമ്മോദീസാവാഗ്ദാനങ്ങൾ നവീകരിക്കാം. വാഴ്ത്തിയ ജലം വീട്ടിലേക്കു കൊണ്ടുപോകുക; എല്ലാ രാത്രിയും മക്കളെ അതുകൊണ്ട് ആശീർവദിക്കുക. നിന്റെ മാമ്മോദീസയുടെ തീയതി കണ്ടെത്തി എല്ലാ വർഷവും അതിനായി ദൈവത്തിനു നന്ദി പറയുക. പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ്, പിതാവിന്റെ പ്രിയമക്കളായി ജീവിക്കുക. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ജോർദാൻ നദിയിൽ യേശു മാമ്മോദീസ സ്വീകരിച്ച ദിവസമാണ് ഇന്നു നാം ഓർക്കുന്നത്. അവിടുന്നു വെള്ളത്തിൽനിന്നു കയറിയപ്പോൾ സ്വർഗം തുറന്നു!","പരിശുദ്ധാത്മാവ് ഒരു വെള്ളപ്രാവിനെപ്പോലെ ഇറങ്ങിവന്നു; പിതാവായ ദൈവം പറഞ്ഞു: “ഇവൻ എന്റെ പ്രിയപുത്രൻ!” പിതാവും പുത്രനും പരിശുദ്ധാത്മാവും, എല്ലാവരും ഒന്നിച്ച്.","നിങ്ങൾ മാമ്മോദീസ സ്വീകരിച്ചപ്പോൾ ദൈവം പറഞ്ഞു: “നീ എന്റെ പ്രിയപ്പെട്ട കുഞ്ഞാണ്!” നിങ്ങളുടെ മാമ്മോദീസാദിവസം അറിയാമോ? ഇന്നു രാത്രി അപ്പനോടും അമ്മയോടും ചോദിക്കുക! നമുക്കു പറയാം: “ഞാൻ ദൈവത്തിന്റെ പ്രിയപ്പെട്ട കുഞ്ഞാണ്!”"]});
