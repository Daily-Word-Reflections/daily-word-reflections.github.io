  ml:{homily:[
   "പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു സഭ മുഴുവൻ മിഷൻ ഞായർ ആചരിക്കുന്നു; ദൈവം നമുക്കു നൽകുന്ന വായനകളെല്ലാം അയയ്ക്കപ്പെടുന്നതിനെപ്പറ്റിയാണ്. ഒരു ചോദ്യത്തോടെ ഞാൻ തുടങ്ങട്ടെ: ദൈവം അവസാനമായി നിങ്ങളുടെ സാധാരണ ദിവസത്തിൽ ഇടപെട്ടത് എപ്പോഴാണ്?",
   "ദൈവം വിളിച്ചപ്പോൾ മോശ പ്രാർഥിക്കുകയായിരുന്നില്ല. മരുഭൂമിയിൽ ഭാര്യാപിതാവിന്റെ ആടുകളെ മേയ്ക്കുന്ന ജോലിയിലായിരുന്നു. അവന് എൺപതു വയസ്സായിരുന്നു. വളരെ മുമ്പ് അവൻ ഒരാളെ കൊന്ന് ഓടിപ്പോയവനാണ്. മനുഷ്യരുടെ കണക്കിൽ അവൻ ഒരു പരാജയമായിരുന്നു. ആ സാധാരണ സ്ഥലത്ത് ഒരു മുൾപ്പടർപ്പ് എരിയാൻ തുടങ്ങി; അത് എരിഞ്ഞുതീർന്നില്ല.",
   "ദൈവം ആദ്യം പറയുന്നതു ശ്രദ്ധിക്കുക: “നീ നിൽക്കുന്ന സ്ഥലം പരിശുദ്ധമാകയാൽ ചെരുപ്പ് അഴിച്ചുമാറ്റുക.” മോശയ്ക്ക് ഒരു ജോലി നൽകുന്നതിനു മുമ്പു ദൈവം ഭക്ത്യാദരം ആവശ്യപ്പെടുന്നു. അയയ്ക്കുന്നതിനു മുമ്പു തന്റെ നാമം വെളിപ്പെടുത്തുന്നു: “ഞാൻ ആകുന്നവൻ ഞാൻ ആകുന്നു.” ദൗത്യം ആരംഭിക്കുന്നത് ആസൂത്രണത്തിലല്ല, ആരാധനയിലാണ്. ഈ പള്ളിയുടെ വാതിൽക്കൽ ചെരുപ്പ് ഊരിവയ്ക്കുമ്പോഴെല്ലാം നാം മോശയുടെ ആംഗ്യം ആവർത്തിക്കുന്നു. ഈ മദ്ബഹാ നമ്മുടെ ഹോറെബാണ്. പരിശുദ്ധാത്മാവിന്റെ അഗ്നി ഈ ബലിപീഠത്തിൽ ഇറങ്ങുന്നു; മുൾപ്പടർപ്പുപോലെ അപ്പം എരിഞ്ഞുതീരുന്നില്ല, ക്രിസ്തുവിന്റെ ശരീരമായി രൂപാന്തരപ്പെടുന്നു.",
   "ഏശയ്യാ പ്രവാചകൻ പറയുന്നു: “ദൈവമായ കർത്താവിന്റെ ആത്മാവ് എന്റെമേൽ ഉണ്ട്. പീഡിതരെ സദ്വാർത്ത അറിയിക്കുന്നതിന് അവിടുന്ന് എന്നെ അഭിഷേകം ചെയ്തിരിക്കുന്നു.” നസ്രത്തിലെ സിനഗോഗിൽ ഈശോ വായിച്ചത് ഈ വാക്കുകളാണ്. പ്രതികാരദിനത്തെപ്പറ്റിയുള്ള വാക്കുകൾക്കു മുമ്പ് അവിടുന്നു വായന നിർത്തി. നമ്മുടെ ദൗത്യം കുറ്റം വിധിക്കലല്ല; കർത്താവിന്റെ കൃപയുടെ വത്സരം പ്രഖ്യാപിക്കലാണ്.",
   "സുവിശേഷത്തിൽ ഈശോ പന്ത്രണ്ടുപേരെ ഒന്നുമില്ലാതെ അയയ്ക്കുന്നു: സ്വർണമില്ല, സഞ്ചിയില്ല, രണ്ടാമതൊരു കുപ്പായമില്ല. ഒരു നിയമം മാത്രം അവിടുന്നു നൽകുന്നു: “ദാനമായി നിങ്ങൾക്കു കിട്ടി; ദാനമായിത്തന്നെ കൊടുക്കുവിൻ.” പൗലോസ് അതു ജീവിച്ചു; സുവിശേഷം അവൻ സൗജന്യമായി പ്രസംഗിച്ചു. ആദ്യത്തെ പന്ത്രണ്ടുപേരുടെ പേരുകളുടെ കൂട്ടത്തിൽ നമ്മുടെ വിശ്വാസപിതാവായ തോമായുമുണ്ട്; പിന്നീടു വചനമല്ലാതെ മറ്റൊന്നുമില്ലാതെ അദ്ദേഹം നമ്മുടെ നാടുവരെ നടന്നുവന്നു.",
   "അപ്പോൾ മിഷൻ ഞായർ നമ്മോട് എന്താണ് ആവശ്യപ്പെടുന്നത്? എല്ലാവരും ആഫ്രിക്കയിലേക്കോ വടക്കുകിഴക്കൻ സംസ്ഥാനങ്ങളിലേക്കോ പോകണമെന്നല്ല; നിങ്ങളിൽ ചിലർ അതിനു വിളിക്കപ്പെട്ടേക്കാം. ദിവസവും ദൈവസന്നിധിയിൽ ചെരുപ്പ് അഴിക്കാനും, നമ്മുടെ അടുത്തുള്ള ഹൃദയം തകർന്നവരെ തിരയാനും, ദാനമായി ലഭിച്ചതു ദാനമായി കൊടുക്കാനുമാണ്. ഓരോ കുർബാനയും ഒരു അയയ്ക്കലോടെയാണ് അവസാനിക്കുന്നത്. “വരൂ, ഞാൻ നിന്നെ അയയ്ക്കാം” എന്നു മോശയോടു പറഞ്ഞ ദൈവം ഇന്ന് ഈ ഇടവകയോട് അതു പറയുന്നു. മാർ തോമായെപ്പോലെ നമുക്ക് ഉത്തരം നൽകാം: “നമുക്കും പോകാം.” ആമേൻ."],
  kids:[
   "കുഞ്ഞുങ്ങളേ, ആരെങ്കിലും തീ കണ്ടിട്ടുണ്ടോ? കടലാസ് കത്തുമ്പോൾ എന്തു സംഭവിക്കും? ചാരമാകും! പക്ഷേ മോശ ഒരു മുൾച്ചെടി കണ്ടു; അതു കത്തിക്കൊണ്ടേയിരുന്നു, ചാരമായില്ല. എന്തുകൊണ്ട്? ദൈവം അതിലുണ്ടായിരുന്നു.",
   "ദൈവം മോശയോടു പറഞ്ഞു: “ചെരുപ്പ് ഊരൂ, ഈ സ്ഥലം വിശുദ്ധമാണ്.” പള്ളിയിൽ വരുമ്പോൾ നാം എന്താണു ചെയ്യുന്നത്? ചെരുപ്പ് ഊരിവയ്ക്കുന്നു! അപ്പോൾ ഓരോ തവണ പള്ളിവാതിൽക്കൽ ചെരുപ്പ് ഊരുമ്പോഴും നിങ്ങൾ മോശ ചെയ്തതുതന്നെ ചെയ്യുന്നു. നിങ്ങൾ പറയുന്നു: “ഈശോയേ, അങ്ങ് ഇവിടെയുണ്ട്.”",
   "പിന്നെ ദൈവം മോശയോടു പറഞ്ഞു: “പോകൂ! ഞാൻ നിന്നെ അയയ്ക്കുന്നു.” ഈശോയും തന്റെ കൂട്ടുകാരോട് അതുതന്നെ പറഞ്ഞു: “പോയി, ദൈവം എല്ലാവരെയും സ്നേഹിക്കുന്നു എന്നു പറയൂ.” അവിടുന്നു പറഞ്ഞു: “ദൈവസ്നേഹം നിങ്ങൾക്കു വെറുതെ കിട്ടി; അതുകൊണ്ട് വെറുതെ കൊടുക്കൂ.”",
   "അതുകൊണ്ട് ഈ ആഴ്ച നിങ്ങളുടെ ദൗത്യം ഇതാണ്: ഒന്നും തിരിച്ചു ചോദിക്കാതെ ഒരാൾക്ക് ഒരു നല്ല കാര്യം ചെയ്യുക. ടിഫിൻ പങ്കുവയ്ക്കാം, കൂട്ടുകാരനെ ഹോംവർക്കിൽ സഹായിക്കാം, വീട്ടിൽ അമ്മയെ സഹായിക്കാം. ഒരു കുഞ്ഞുമിഷനറി അങ്ങനെയാണു പ്രവർത്തിക്കുന്നത്. നിങ്ങൾക്കു കഴിയുമോ? നമുക്ക് ഒന്നിച്ചു പറയാം: “ഈശോയേ, എന്നെ അയയ്ക്കണമേ!”"],
  base:null},
  ta:{homily:[
   "அன்புள்ள சகோதர சகோதரிகளே, இன்று திருச்சபை முழுவதும் மறைபரப்பு ஞாயிறைக் கொண்டாடுகிறது. கடவுள் இன்று நமக்குத் தரும் வாசகங்கள் அனைத்தும் அனுப்பப்படுவதைப் பற்றியே பேசுகின்றன. ஒரு கேள்வியுடன் தொடங்குகிறேன்: கடவுள் கடைசியாக உங்கள் சாதாரண நாளில் எப்போது குறுக்கிட்டார்?",
   "கடவுள் அழைத்தபோது மோசே செபித்துக்கொண்டிருக்கவில்லை. பாலைநிலத்தில் தன் மாமனாரின் ஆடுகளை மேய்த்துக்கொண்டிருந்தார். அவருக்கு எண்பது வயது. பல ஆண்டுகளுக்கு முன் ஒருவனைக் கொன்றுவிட்டு ஓடிப்போனவர். மனிதக் கணக்கில் அவர் ஒரு தோல்வியாளர். அந்தச் சாதாரண இடத்தில் ஒரு முட்புதர் எரியத் தொடங்கியது; ஆனால் அது எரிந்து சாம்பலாகவில்லை.",
   "கடவுள் முதலில் சொல்வதைக் கவனியுங்கள்: “உன் காலணிகளைக் கழற்று; நீ நிற்கும் இடம் புனிதமானது.” பணியைக் கொடுக்கும் முன் கடவுள் பயபக்தியைக் கேட்கிறார். அனுப்பும் முன் தன் பெயரை வெளிப்படுத்துகிறார்: “இருக்கின்றவர் நானே.” மறைப்பணி திட்டமிடுதலில் அல்ல, ஆராதனையில் தொடங்குகிறது. ஆலய வாசலில் நாம் காலணிகளைக் கழற்றும் ஒவ்வொரு முறையும் மோசேயின் செயலையே செய்கிறோம். இந்தப் பீடம் நமது ஓரேபு மலை. தூய ஆவியின் நெருப்பு இந்தப் பலிபீடத்தின் மேல் இறங்குகிறது; முட்புதரைப் போல அப்பம் எரிந்து அழிவதில்லை, கிறிஸ்துவின் திருவுடலாக மாறுகிறது.",
   "இறைவாக்கினர் எசாயா கூறுகிறார்: “ஆண்டவரின் ஆவி என் மேல் உள்ளது; ஏழைகளுக்கு நற்செய்தி அறிவிக்க அவர் என்னை அருள்பொழிவு செய்துள்ளார்.” நாசரேத்து தொழுகைக்கூடத்தில் இயேசு வாசித்தது இதே வார்த்தைகளைத்தான். பழிவாங்கும் நாளைப் பற்றிய வார்த்தைகளுக்கு முன்பே அவர் வாசிப்பை நிறுத்தினார். நம் பணி தீர்ப்பிடுவது அல்ல; ஆண்டவரின் அருள்தரும் ஆண்டை அறிவிப்பதே.",
   "நற்செய்தியில் இயேசு பன்னிருவரையும் ஒன்றுமில்லாமல் அனுப்புகிறார்: பொன் இல்லை, பை இல்லை, இரண்டாம் அங்கி இல்லை. ஒரே ஒரு விதியைத் தருகிறார்: “கொடையாகப் பெற்றீர்கள், கொடையாகவே வழங்குங்கள்.” பவுல் அதை வாழ்ந்தார்; நற்செய்தியை இலவசமாக அறிவித்தார். அந்த முதல் பன்னிருவரின் பெயர்களில் நம் விசுவாசத் தந்தை தோமாவும் இருக்கிறார்; பின்னர் இறைவார்த்தையைத் தவிர வேறொன்றுமின்றி அவர் நம் நாடு வரை நடந்து வந்தார்.",
   "அப்படியானால் மறைபரப்பு ஞாயிறு நம்மிடம் என்ன கேட்கிறது? எல்லோரும் தொலைதூர நாடுகளுக்குப் போக வேண்டும் என்பதல்ல; உங்களில் சிலர் அதற்கு அழைக்கப்படலாம். ஒவ்வொரு நாளும் கடவுள் முன் காலணிகளைக் கழற்றவும், நம் அருகிலுள்ள உடைந்த உள்ளங்களைத் தேடவும், கொடையாகப் பெற்றதைக் கொடையாகவே வழங்கவும் அது கேட்கிறது. ஒவ்வொரு திருப்பலியும் ஓர் அனுப்புதலுடன் முடிகிறது. மோசேயிடம் “வா, நான் உன்னை அனுப்புகிறேன்” என்று சொன்ன கடவுள் இன்று இந்தப் பங்கிடம் அதையே சொல்கிறார். தோமாவைப் போல நாமும் பதில் சொல்வோம்: “நாமும் போவோம்.” ஆமென்."],
  kids:[
   "குழந்தைகளே, யாராவது நெருப்பைப் பார்த்திருக்கிறீர்களா? காகிதம் எரிந்தால் என்ன ஆகும்? சாம்பலாகிவிடும்! ஆனால் மோசே ஒரு முட்செடியைப் பார்த்தார்; அது எரிந்துகொண்டே இருந்தது, சாம்பலாகவில்லை. ஏன்? கடவுள் அதில் இருந்தார்.",
   "கடவுள் மோசேயிடம் சொன்னார்: “உன் செருப்பைக் கழற்று, இது புனிதமான இடம்.” நாம் கோவிலுக்கு வரும்போது என்ன செய்கிறோம்? செருப்பைக் கழற்றுகிறோம்! அப்படியென்றால் ஒவ்வொரு முறையும் நீங்கள் மோசே செய்ததையே செய்கிறீர்கள்: “இயேசுவே, நீர் இங்கே இருக்கிறீர்” என்று சொல்கிறீர்கள்.",
   "பிறகு கடவுள் சொன்னார்: “போ! நான் உன்னை அனுப்புகிறேன்.” இயேசுவும் தம் நண்பர்களிடம் அதையே சொன்னார்: “போய், கடவுள் எல்லோரையும் அன்பு செய்கிறார் என்று சொல்லுங்கள். இலவசமாகப் பெற்றீர்கள், இலவசமாகவே கொடுங்கள்.”",
   "இந்த வாரம் உங்கள் பணி இதுதான்: எதையும் திரும்பக் கேட்காமல் ஒருவருக்கு ஒரு நல்ல காரியம் செய்யுங்கள். உங்கள் உணவைப் பகிருங்கள், நண்பருக்குப் பாடத்தில் உதவுங்கள், வீட்டில் அம்மாவுக்கு உதவுங்கள். ஒன்றாகச் சொல்வோம்: “இயேசுவே, என்னை அனுப்பும்!”"],
  base:{title:"மறைபரப்பு ஞாயிறு",readTitle:"மறைபரப்பு ஞாயிறு வாசகங்கள்",
   readings:[["முதல் வாசகம்","விடுதலைப் பயணம் 3:1–14","கடவுள் மோசேயை அனுப்புகிறார்"],["இரண்டாம் வாசகம்","எசாயா 61:1–6, 10–11","நற்செய்தி அறிவிக்க ஆண்டவர் என்னை அனுப்பியுள்ளார்"],["திருமுகம்","1 கொரிந்தியர் 9:13–18","நற்செய்தியை அறிவிக்காவிட்டால் எனக்கு ஐயோ கேடு"],["நற்செய்தி","மத்தேயு 10:1–15","இயேசு பன்னிரு திருத்தூதர்களை அனுப்புகிறார்"]],
   verse:"கொடையாகப் பெற்றீர்கள், கொடையாகவே வழங்குங்கள்.",cite:"மத்தேயு 10:8",
   prayer:"வெறுங்கையோடும் நிறைந்த உள்ளத்தோடும் திருத்தூதர்களை அனுப்பிய இயேசுவே, நான் வாழும், உழைக்கும் இடத்திற்கு இன்று என்னையும் அனுப்பும்; கொடையாகப் பெற்றதைக் கொடையாகவே வழங்க எனக்கு உதவும். ஆமென்."}},
  hi:{homily:[
   "प्रिय भाइयो और बहनो, आज पूरी कलीसिया मिशन रविवार मना रही है, और ईश्वर आज हमें जो पाठ देता है, वे सब भेजे जाने के बारे में हैं। मैं एक प्रश्न से शुरू करता हूँ: ईश्वर ने आख़िरी बार आपके साधारण दिन में कब दख़ल दिया?",
   "जब ईश्वर ने मूसा को बुलाया, तब वे प्रार्थना नहीं कर रहे थे। वे मरुभूमि में अपने ससुर की भेड़ें चरा रहे थे। उनकी उम्र अस्सी वर्ष थी। बहुत पहले उन्होंने एक आदमी को मार डाला था और भाग गए थे। मनुष्य की नज़र में वे एक असफल व्यक्ति थे। उसी साधारण जगह पर एक झाड़ी जलने लगी, पर वह भस्म नहीं हुई।",
   "देखिए, ईश्वर पहले क्या कहता है: “अपने जूते उतार दो, क्योंकि जिस जगह तुम खड़े हो, वह पवित्र भूमि है।” काम देने से पहले ईश्वर श्रद्धा माँगता है। भेजने से पहले वह अपना नाम प्रकट करता है: “मैं वही हूँ जो हूँ।” मिशन योजना से नहीं, आराधना से शुरू होता है। जब भी हम गिरजाघर के द्वार पर जूते उतारते हैं, हम मूसा का वही कार्य दोहराते हैं। यह वेदी हमारा होरेब पर्वत है। पवित्र आत्मा की आग इस वेदी पर उतरती है, और झाड़ी की तरह रोटी भस्म नहीं होती, बल्कि ख्रीस्त के शरीर में बदल जाती है।",
   "नबी इसायाह कहते हैं: “प्रभु का आत्मा मुझ पर है, क्योंकि उसने दरिद्रों को शुभ समाचार सुनाने के लिए मेरा अभिषेक किया है।” नाज़रेत के सभागृह में येसु ने यही शब्द पढ़े थे। और प्रतिशोध के दिन वाले शब्दों से पहले ही उन्होंने पढ़ना रोक दिया। हमारा मिशन दोषी ठहराना नहीं, बल्कि प्रभु के अनुग्रह के वर्ष की घोषणा करना है।",
   "सुसमाचार में येसु बारहों को बिना कुछ दिए भेजते हैं: न सोना, न झोली, न दूसरा कुरता। वे एक ही नियम देते हैं: “तुमने मुफ़्त में पाया है, मुफ़्त में दो।” संत पौलुस ने इसे जिया; उन्होंने सुसमाचार मुफ़्त में सुनाया। उन पहले बारह के नामों में हमारे विश्वास के पिता संत थोमस भी हैं, जो बाद में केवल ईश-वचन लेकर भारत तक पैदल आए।",
   "तो मिशन रविवार हमसे क्या माँगता है? यह नहीं कि सब दूर देशों में जाएँ, हालाँकि आपमें से कुछ लोग इसके लिए बुलाए जा सकते हैं। यह माँगता है कि हम हर दिन ईश्वर के सामने अपने जूते उतारें, अपने पास के टूटे दिलों को खोजें, और जो मुफ़्त में पाया है उसे मुफ़्त में दें। हर पवित्र कुर्बाना एक भेजे जाने के साथ समाप्त होती है। जिस ईश्वर ने मूसा से कहा था, “आओ, मैं तुम्हें भेजता हूँ,” वही आज इस पल्ली से यही कहता है। आइए, संत थोमस की तरह उत्तर दें: “हम भी चलें।” आमेन।"],
  kids:[
   "बच्चो, किसने आग देखी है? जब काग़ज़ जलता है तो क्या होता है? राख बन जाता है! लेकिन मूसा ने एक झाड़ी देखी जो जलती रही, जलती रही, पर राख नहीं बनी। क्यों? क्योंकि ईश्वर उसमें था।",
   "ईश्वर ने मूसा से कहा: “अपनी चप्पल उतारो, यह जगह पवित्र है।” हम गिरजाघर आते समय क्या करते हैं? चप्पल उतारते हैं! तो हर बार जब आप चप्पल उतारते हो, आप वही करते हो जो मूसा ने किया था। आप कहते हो: “येसु, आप यहाँ हैं।”",
   "फिर ईश्वर ने कहा: “जाओ! मैं तुम्हें भेजता हूँ।” येसु ने भी अपने मित्रों से यही कहा: “जाओ, सबको बताओ कि ईश्वर उनसे प्यार करता है। तुमने मुफ़्त में पाया है, मुफ़्त में दो।”",
   "इस हफ़्ते आपका मिशन यह है: बिना कुछ वापस माँगे किसी के लिए एक अच्छा काम करो। अपना टिफ़िन बाँटो, दोस्त की पढ़ाई में मदद करो, घर पर माँ की मदद करो। चलो, मिलकर कहें: “येसु, मुझे भेजिए!”"],
  base:{title:"मिशन रविवार",readTitle:"मिशन रविवार के पाठ",
   readings:[["पहला पाठ","निर्गमन 3:1–14","ईश्वर मूसा को भेजता है"],["दूसरा पाठ","इसायाह 61:1–6, 10–11","प्रभु ने मुझे शुभ समाचार सुनाने भेजा है"],["पत्र","1 कुरिन्थियों 9:13–18","धिक्कार है मुझे, यदि मैं सुसमाचार न सुनाऊँ"],["सुसमाचार","मत्ती 10:1–15","येसु बारह प्रेरितों को भेजते हैं"]],
   verse:"तुमने मुफ़्त में पाया है, मुफ़्त में दो।",cite:"मत्ती 10:8",
   prayer:"हे प्रभु येसु, आपने अपने प्रेरितों को ख़ाली हाथ और भरे हृदय के साथ भेजा। आज मुझे भी उस जगह भेजिए जहाँ मैं रहता और काम करता हूँ, ताकि जो मैंने मुफ़्त में पाया है, उसे मुफ़्त में दे सकूँ। आमेन।"}}
 },
 lat:{
  en:{homily:[
   "Dear brothers and sisters, I would like to begin by holding up a coin. Whose face is on it? On our coins and notes we see the image of our nation. In Jesus' time the silver coin carried the face of the emperor Tiberius and the words “Son of the divine Augustus”. The coin itself claimed that Caesar was a god.",
   "That is the trap the Pharisees and the Herodians set for Jesus. If he says, “Pay the tax,” he betrays his people. If he says, “Do not pay,” he is a rebel against Rome. Jesus asks for the coin, and then asks a simple question: “Whose head is this, and whose title?” And he answers: “Give therefore to the emperor the things that are the emperor's, and to God the things that are God's.”",
   "The coin belongs to Caesar because it bears his image. But what bears God's image? We do. Genesis tells us that God created man in his own image. So the deepest meaning of Jesus' answer is this: give Caesar his money, but give God yourself. Your life, your time, your heart belong to the One whose image you carry.",
   "The first reading reminds us that God is the Lord of history. He calls a Persian king, Cyrus, “his anointed”, and uses him to free his people, even though Cyrus did not know him. Governments are real, and we must be good citizens, but no ruler is God. History is in God's hands.",
   "Today is World Mission Sunday. Mission begins exactly here. Every person we meet, rich or poor, believer or not, carries the image of God. Some have forgotten it; sin has covered it with dust. The mission of the Church is to help every person discover whose image they carry and to return to their Owner. St Paul praises the Thessalonians for their faith that works, love that labours and hope that endures. That is a missionary parish.",
   "In a few moments we will bring bread and wine to the altar, the fruit of the earth and work of human hands. That is our way of rendering to God what is God's. And he will give back to us not a coin but himself. Let us leave this Mass carrying his image more clearly, and let us show it to the world. Amen."],
  kids:[
   "Children, I have a coin here. Whose picture is on it? Yes! Now look at the friend sitting next to you. Whose picture is in your friend? You can't see it, but it is there: God's picture! The Bible says God made every person in his image.",
   "Some people wanted to trick Jesus with a coin. Jesus said: the coin has the king's picture, so give it to the king. But you have God's picture, so give yourself to God.",
   "How do we give ourselves to God? By praying in the morning, by being kind, by telling the truth, and by sharing with people who have less. Because everyone has God's picture, we must never bully or hurt anyone.",
   "Today is Mission Sunday. Missionaries go everywhere to tell people: “You have God's picture in you; God loves you!” You can be a little missionary at school this week. Let's say together: “I belong to God!”"],
  base:null},
  ml:{homily:[
   "പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഒരു നാണയം ഉയർത്തിക്കാണിച്ചുകൊണ്ടു ഞാൻ തുടങ്ങട്ടെ. ഇതിൽ ആരുടെ മുഖമാണ്? നമ്മുടെ നാണയങ്ങളിലും നോട്ടുകളിലും നമ്മുടെ രാജ്യത്തിന്റെ മുദ്ര കാണുന്നു. ഈശോയുടെ കാലത്ത് വെള്ളിനാണയത്തിൽ തിബേരിയൂസ് ചക്രവർത്തിയുടെ മുഖവും “ദിവ്യനായ അഗസ്റ്റസിന്റെ പുത്രൻ” എന്ന വാക്കുകളുമുണ്ടായിരുന്നു. സീസർ ഒരു ദൈവമാണെന്നു നാണയംതന്നെ അവകാശപ്പെട്ടു.",
   "ഫരിസേയരും ഹേറോദേസ് പക്ഷക്കാരും ഈശോയ്ക്കുവേണ്ടി ഒരുക്കിയ കെണി അതായിരുന്നു. “നികുതി കൊടുക്കുക” എന്ന് അവിടുന്നു പറഞ്ഞാൽ സ്വന്തം ജനത്തെ ഒറ്റിക്കൊടുക്കുന്നവനാകും. “കൊടുക്കരുത്” എന്നു പറഞ്ഞാൽ റോമിനെതിരേയുള്ള വിപ്ലവകാരിയാകും. ഈശോ നാണയം ചോദിക്കുന്നു; ലളിതമായ ഒരു ചോദ്യം ചോദിക്കുന്നു: “ഈ രൂപവും ലിഖിതവും ആരുടേതാണ്?” അവിടുന്ന് ഉത്തരം നൽകുന്നു: “സീസറിനുള്ളതു സീസറിനും ദൈവത്തിനുള്ളതു ദൈവത്തിനും കൊടുക്കുക.”",
   "നാണയം സീസറിന്റേതാണ്, കാരണം അതിൽ അവന്റെ ഛായയുണ്ട്. എന്നാൽ ദൈവത്തിന്റെ ഛായ വഹിക്കുന്നത് എന്താണ്? നാം. ദൈവം മനുഷ്യനെ തന്റെ ഛായയിൽ സൃഷ്ടിച്ചുവെന്ന് ഉൽപത്തി പറയുന്നു. അപ്പോൾ ഈശോയുടെ ഉത്തരത്തിന്റെ ആഴമേറിയ അർഥം ഇതാണ്: സീസറിന് അവന്റെ പണം കൊടുക്കുക; ദൈവത്തിനു നിന്നെത്തന്നെ കൊടുക്കുക. നിന്റെ ജീവിതവും സമയവും ഹൃദയവും, നീ ആരുടെ ഛായ വഹിക്കുന്നുവോ അവിടുത്തേതാണ്.",
   "ദൈവമാണു ചരിത്രത്തിന്റെ കർത്താവെന്ന് ഒന്നാം വായന ഓർമിപ്പിക്കുന്നു. പേർഷ്യൻ രാജാവായ സൈറസിനെ അവിടുന്നു “തന്റെ അഭിഷിക്തൻ” എന്നു വിളിക്കുന്നു; അവൻ ദൈവത്തെ അറിഞ്ഞില്ലെങ്കിലും തന്റെ ജനത്തെ മോചിപ്പിക്കാൻ അവനെ ഉപയോഗിക്കുന്നു. ഭരണകൂടങ്ങൾ യാഥാർഥ്യമാണ്; നാം നല്ല പൗരന്മാരായിരിക്കണം; പക്ഷേ ഒരു ഭരണാധികാരിയും ദൈവമല്ല. ചരിത്രം ദൈവത്തിന്റെ കരങ്ങളിലാണ്.",
   "ഇന്നു ലോക മിഷൻ ഞായറാണ്. ദൗത്യം ആരംഭിക്കുന്നത് ഇവിടെത്തന്നെയാണ്. നാം കണ്ടുമുട്ടുന്ന ഓരോ വ്യക്തിയും, ധനികനോ ദരിദ്രനോ, വിശ്വാസിയോ അല്ലാത്തവനോ, ദൈവത്തിന്റെ ഛായ വഹിക്കുന്നു. ചിലർ അതു മറന്നുപോയിരിക്കുന്നു; പാപം അതിനെ പൊടികൊണ്ടു മൂടിയിരിക്കുന്നു. താൻ ആരുടെ ഛായയാണു വഹിക്കുന്നതെന്നു കണ്ടെത്താനും ഉടമസ്ഥന്റെ അടുത്തേക്കു മടങ്ങാനും ഓരോ വ്യക്തിയെയും സഹായിക്കുകയാണു സഭയുടെ ദൗത്യം. പ്രവർത്തിക്കുന്ന വിശ്വാസത്തിനും അധ്വാനിക്കുന്ന സ്നേഹത്തിനും സഹിച്ചുനിൽക്കുന്ന പ്രത്യാശയ്ക്കും പൗലോസ് തെസലോനിക്കാക്കാരെ പ്രശംസിക്കുന്നു. അതാണ് ഒരു പ്രേഷിത ഇടവക.",
   "അൽപസമയത്തിനകം നാം അപ്പവും വീഞ്ഞും, ഭൂമിയുടെ ഫലവും മനുഷ്യാധ്വാനത്തിന്റെ ഫലവും, ബലിപീഠത്തിലേക്കു കൊണ്ടുവരും. ദൈവത്തിനുള്ളതു ദൈവത്തിനു കൊടുക്കുന്ന നമ്മുടെ രീതിയാണത്. അവിടുന്നു നമുക്കു തിരികെ നൽകുന്നത് ഒരു നാണയമല്ല, തന്നെത്തന്നെയാണ്. അവിടുത്തെ ഛായ കൂടുതൽ തെളിമയോടെ വഹിച്ചുകൊണ്ട് ഈ കുർബാന കഴിഞ്ഞു നമുക്കു പുറത്തിറങ്ങാം; ലോകത്തിന് അതു കാണിച്ചുകൊടുക്കാം. ആമേൻ."],
  kids:[
   "കുഞ്ഞുങ്ങളേ, എന്റെ കൈയിൽ ഒരു നാണയമുണ്ട്. ഇതിൽ ആരുടെ ചിത്രമാണ്? ശരി! ഇനി നിങ്ങളുടെ അടുത്തിരിക്കുന്ന കൂട്ടുകാരനെ നോക്കൂ. അവനിൽ ആരുടെ ചിത്രമാണ്? കാണാൻ പറ്റില്ല, പക്ഷേ അതുണ്ട്: ദൈവത്തിന്റെ ചിത്രം! ദൈവം ഓരോരുത്തരെയും തന്റെ ഛായയിൽ സൃഷ്ടിച്ചുവെന്നു ബൈബിൾ പറയുന്നു.",
   "ചിലർ ഒരു നാണയംകൊണ്ട് ഈശോയെ കുടുക്കാൻ നോക്കി. ഈശോ പറഞ്ഞു: നാണയത്തിൽ രാജാവിന്റെ ചിത്രമാണ്; അതു രാജാവിനു കൊടുക്കുക. പക്ഷേ നിങ്ങളിൽ ദൈവത്തിന്റെ ചിത്രമാണ്; അതുകൊണ്ടു നിങ്ങളെത്തന്നെ ദൈവത്തിനു കൊടുക്കുക.",
   "നമ്മെത്തന്നെ ദൈവത്തിന് എങ്ങനെ കൊടുക്കും? രാവിലെ പ്രാർഥിച്ച്, ദയയോടെ പെരുമാറി, സത്യം പറഞ്ഞ്, കുറവുള്ളവരുമായി പങ്കുവച്ച്. എല്ലാവരിലും ദൈവത്തിന്റെ ചിത്രമുള്ളതുകൊണ്ട് നാം ഒരിക്കലും ആരെയും കളിയാക്കുകയോ വേദനിപ്പിക്കുകയോ ചെയ്യരുത്.",
   "ഇന്നു മിഷൻ ഞായറാണ്. “നിന്നിൽ ദൈവത്തിന്റെ ചിത്രമുണ്ട്; ദൈവം നിന്നെ സ്നേഹിക്കുന്നു!” എന്ന് ആളുകളോടു പറയാൻ മിഷനറിമാർ എല്ലായിടത്തും പോകുന്നു. ഈ ആഴ്ച സ്കൂളിൽ നിങ്ങൾക്ക് ഒരു കുഞ്ഞുമിഷനറിയാകാം. നമുക്ക് ഒന്നിച്ചു പറയാം: “ഞാൻ ദൈവത്തിന്റേതാണ്!”"],
  base:null},
  de:{homily:[
   "Liebe Schwestern und Brüder, ich möchte mit einer Münze beginnen. Wessen Bild ist darauf zu sehen? Zur Zeit Jesu trug die Silbermünze das Bild des Kaisers Tiberius und die Aufschrift „Sohn des göttlichen Augustus“. Die Münze selbst behauptete, der Kaiser sei ein Gott.",
   "Das ist die Falle, die Pharisäer und Herodianer Jesus stellen. Sagt er „Zahlt die Steuer“, verrät er sein Volk. Sagt er „Zahlt sie nicht“, ist er ein Aufrührer gegen Rom. Jesus lässt sich die Münze zeigen und stellt eine einfache Frage: „Wessen Bild ist das?“ Und er antwortet: „So gebt dem Kaiser, was des Kaisers ist, und Gott, was Gottes ist!“",
   "Die Münze gehört dem Kaiser, weil sie sein Bild trägt. Doch wer trägt das Bild Gottes? Wir. Das Buch Genesis sagt, dass Gott den Menschen als sein Abbild erschaffen hat. Der tiefste Sinn der Antwort Jesu lautet also: Gebt dem Kaiser sein Geld, aber gebt Gott euch selbst. Euer Leben, eure Zeit, euer Herz gehören dem, dessen Bild ihr tragt.",
   "Die erste Lesung erinnert uns daran, dass Gott der Herr der Geschichte ist. Er nennt den Perserkönig Kyrus „seinen Gesalbten“ und gebraucht ihn, um sein Volk zu befreien, obwohl Kyrus ihn nicht kennt. Staaten sind wirklich, und wir sollen gute Bürger sein; aber kein Herrscher ist Gott. Die Geschichte liegt in Gottes Hand.",
   "Heute ist der Sonntag der Weltmission. Genau hier beginnt Mission. Jeder Mensch, dem wir begegnen, ob reich oder arm, gläubig oder nicht, trägt das Bild Gottes. Manche haben es vergessen; die Sünde hat es mit Staub bedeckt. Die Sendung der Kirche ist es, jedem Menschen zu helfen zu entdecken, wessen Bild er trägt, und zu seinem Eigentümer zurückzukehren. Paulus lobt die Thessalonicher für das Werk des Glaubens, die Mühe der Liebe und die Standhaftigkeit der Hoffnung. Das ist eine missionarische Gemeinde.",
   "Gleich bringen wir Brot und Wein zum Altar, die Frucht der Erde und der menschlichen Arbeit. So geben wir Gott, was Gottes ist. Und er gibt uns nicht eine Münze zurück, sondern sich selbst. Lasst uns diese Messe verlassen und sein Bild deutlicher in uns tragen, damit die Welt es sieht. Amen."],
  kids:[
   "Liebe Kinder, ich habe hier eine Münze. Wessen Bild ist darauf? Genau! Und jetzt schaut euren Nachbarn an. Wessen Bild ist in ihm? Man sieht es nicht, aber es ist da: Gottes Bild! Die Bibel sagt: Gott hat jeden Menschen nach seinem Bild gemacht.",
   "Einige Leute wollten Jesus mit einer Münze hereinlegen. Jesus sagte: Auf der Münze ist das Bild des Kaisers, also gebt sie dem Kaiser. Aber ihr tragt Gottes Bild, also schenkt euch Gott.",
   "Wie schenken wir uns Gott? Indem wir morgens beten, freundlich sind, die Wahrheit sagen und mit anderen teilen. Weil jeder Gottes Bild trägt, dürfen wir niemanden auslachen oder verletzen.",
   "Heute ist Weltmissionssonntag. Missionare gehen überall hin und sagen: „In dir ist Gottes Bild, Gott liebt dich!“ Ihr könnt diese Woche in der Schule kleine Missionare sein. Sagen wir zusammen: „Ich gehöre zu Gott!“"],
  base:{title:"29. Sonntag im Jahreskreis · Sonntag der Weltmission",readTitle:"Lesungen des Tages",
   readings:[["Erste Lesung","Jesaja 45,1.4–6","Ich habe dich beim Namen gerufen, obwohl du mich nicht kanntest"],["Antwortpsalm","Psalm 96","Bringt dar dem Herrn Ehre und Macht"],["Zweite Lesung","1 Thessalonicher 1,1–5b","Glaube, Liebe und Hoffnung; das Evangelium in Kraft und im Heiligen Geist"],["Evangelium","Matthäus 22,15–21","Gebt dem Kaiser, was des Kaisers ist, und Gott, was Gottes ist"]],
   verse:"So gebt dem Kaiser, was des Kaisers ist, und Gott, was Gottes ist!",cite:"Matthäus 22,21",
   prayer:"Vater, du hast meinem Leben dein Bild eingeprägt. Lass mich dir zurückgeben, was dein ist, damit deine Herrlichkeit unter den Völkern sichtbar wird. Durch Christus, unseren Herrn. Amen."}},
  it:{homily:[
   "Cari fratelli e sorelle, vorrei cominciare mostrando una moneta. Di chi è il volto che vi è impresso? Ai tempi di Gesù la moneta d'argento portava il volto dell'imperatore Tiberio e la scritta «Figlio del divino Augusto». La moneta stessa proclamava che Cesare era un dio.",
   "È questa la trappola che farisei ed erodiani tendono a Gesù. Se dice «Pagate il tributo», tradisce il suo popolo. Se dice «Non pagatelo», è un ribelle contro Roma. Gesù si fa mostrare la moneta e pone una domanda semplice: «Di chi è questa immagine?». E risponde: «Rendete dunque a Cesare quello che è di Cesare e a Dio quello che è di Dio».",
   "La moneta appartiene a Cesare perché porta la sua immagine. Ma che cosa porta l'immagine di Dio? Noi. La Genesi ci dice che Dio creò l'uomo a sua immagine. Il senso più profondo della risposta di Gesù è dunque questo: date a Cesare il suo denaro, ma date a Dio voi stessi. La vostra vita, il vostro tempo, il vostro cuore appartengono a Colui di cui portate l'immagine.",
   "La prima lettura ci ricorda che Dio è il Signore della storia. Chiama il re persiano Ciro «suo consacrato» e se ne serve per liberare il suo popolo, benché Ciro non lo conosca. Gli Stati sono reali e dobbiamo essere buoni cittadini, ma nessun sovrano è Dio. La storia è nelle mani di Dio.",
   "Oggi è la Giornata Missionaria Mondiale. La missione comincia proprio qui. Ogni persona che incontriamo, ricca o povera, credente o no, porta l'immagine di Dio. Alcuni l'hanno dimenticato; il peccato l'ha coperta di polvere. La missione della Chiesa è aiutare ogni persona a scoprire di chi porta l'immagine e a tornare al suo Proprietario. Paolo loda i Tessalonicesi per l'operosità della fede, la fatica della carità e la fermezza della speranza. Ecco una parrocchia missionaria.",
   "Fra poco porteremo all'altare il pane e il vino, frutto della terra e del lavoro dell'uomo. È il nostro modo di rendere a Dio quello che è di Dio. Ed egli ci restituirà non una moneta, ma se stesso. Usciamo da questa Messa portando più chiaramente la sua immagine, e mostriamola al mondo. Amen."],
  kids:[
   "Cari bambini, ho qui una moneta. Di chi è l'immagine che c'è sopra? Bravi! Adesso guardate il vostro vicino. Di chi è l'immagine che c'è in lui? Non si vede, ma c'è: l'immagine di Dio! La Bibbia dice che Dio ha fatto ogni persona a sua immagine.",
   "Alcune persone volevano ingannare Gesù con una moneta. Gesù disse: sulla moneta c'è l'immagine del re, quindi datela al re. Ma voi portate l'immagine di Dio, quindi donate voi stessi a Dio.",
   "Come ci doniamo a Dio? Pregando al mattino, essendo gentili, dicendo la verità e condividendo con chi ha meno. Siccome ognuno porta l'immagine di Dio, non dobbiamo mai prendere in giro o ferire nessuno.",
   "Oggi è la Giornata Missionaria. I missionari vanno dappertutto a dire: «In te c'è l'immagine di Dio, Dio ti ama!». Questa settimana a scuola potete essere piccoli missionari. Diciamo insieme: «Io appartengo a Dio!»"],
  base:{title:"XXIX Domenica del Tempo Ordinario · Giornata Missionaria Mondiale",readTitle:"Letture del giorno",
   readings:[["Prima lettura","Isaia 45,1.4–6","Ti ho chiamato per nome, benché tu non mi conosca"],["Salmo responsoriale","Salmo 96","Grande è il Signore e degno di ogni lode"],["Seconda lettura","1 Tessalonicesi 1,1–5b","Fede, carità e speranza; il Vangelo con potenza e Spirito Santo"],["Vangelo","Matteo 22,15–21","Rendete a Cesare quello che è di Cesare e a Dio quello che è di Dio"]],
   verse:"Rendete dunque a Cesare quello che è di Cesare e a Dio quello che è di Dio.",cite:"Matteo 22,21",
   prayer:"Padre, tu hai impresso la tua immagine nella mia vita. Fa' che ti restituisca ciò che è tuo, perché la tua gloria sia vista fra le genti. Per Cristo nostro Signore. Amen."}}
 }

put("2026-10-19","smc","en",{title:"Second Monday of Moses",readTitle:"Readings of the day",
 readings:[["Epistle","Philippians 4:1–9","The Lord is near"],["Gospel","Luke 21:29–36","The Kingdom of God is approaching"]],alt:"",
 verse:"Be alert at all times, praying that you may have the strength to escape all these things that will take place, and to stand before the Son of Man.",cite:"Luke 21:36",
 theo:["The season of Moses turns our eyes toward the Lord's coming. Two readings seem to pull in opposite directions: Paul says, “Rejoice in the Lord always… the Lord is near”, while Jesus speaks of a day that will come “like a trap”. In fact they say the same thing. The nearness of the Lord is the reason both for joy and for watchfulness.","Christian vigilance is not anxiety. Paul's remedy for worry is prayer with thanksgiving, and the promise that follows is not that every problem will vanish, but that “the peace of God, which surpasses all understanding, will guard your hearts” (Philippians 4:7). The fig tree in the Gospel does not tremble at summer; it puts out leaves. A Christian who knows the Lord is near does the same: he grows, he bears fruit, he prays."],
 conn:[["The fig tree.","In Scripture the fig tree is an image of Israel and of the time of fulfilment (Micah 4:4; Hosea 9:10). Jesus uses it to say: learn to read the signs of God's nearness in ordinary life."],["“My words will not pass away.”","Luke 21:33 echoes Isaiah 40:8: “The word of our God will stand for ever.” Everything we build passes; the Word we hear at the Qurbana does not."]],
 altar:["At every Qurbana we proclaim the Lord's death and resurrection “until he comes”. The altar is the place where the coming Lord is already near: we watch for him, and he comes to us in the Mysteries."],
 outline:[["Opening","Ask: does the thought of the end of the world make you afraid or glad?"],["Point 1 · The Lord is near: rejoice","Paul writes from prison and still says “Rejoice”. Christian joy is not mood but faith in the nearness of the Lord."],["Point 2 · The Lord is near: watch and pray","Jesus' remedy for a heart “weighed down” is constant prayer. Name the things that weigh hearts down today: worry, drink, endless screens."],["Take-home line","“The Lord is near: I will pray before I worry.”"]],
 live:[["Pray before you worry (Philippians 4:6)","Each time anxiety rises today, turn it into one sentence of prayer with thanksgiving."],["Fill your mind (Philippians 4:8)","Choose one true, honourable, lovely thing to think on instead of gossip or bad news this evening."]],
 fathers:[["St Cyprian","He wrote that a Christian should long for the Lord's coming as for the coming of one who loves him, not fear it as the coming of a stranger (On Mortality)."]],
 magis:[["Catechism 1817–1821","Hope is the virtue by which we desire the Kingdom of heaven and eternal life, trusting in Christ's promises and the help of the Holy Spirit."]],
 saints:[["In the Universal Church · 19 October","Sts John de Brébeuf, Isaac Jogues and companions, martyrs, and St Paul of the Cross are remembered in the Roman calendar today."]],
 prayer:"Lord Jesus, you are near. Guard my heart with your peace, keep me watchful in prayer, and let me stand before you with joy when you come. Amen."},
 {quick:["The Lord is near: that is a reason for joy, not fear.","Prayer with thanksgiving is the Christian cure for worry.","Watch like the fig tree: by bearing fruit."],action:"Turn every worry today into one short prayer of thanks.",question:"What is weighing down my heart today?",
  illus:["An illustration","A mother waiting at the airport for her son from the Gulf does not sit in fear; she keeps looking at the arrivals board and smiling. That is Christian vigilance: watching for someone we love."],kids:"",diaspora:"",
  family:{read:"Read together: Philippians 4:4–7.",explain:"St Paul tells us: be happy in Jesus, don't worry, tell God everything in prayer, and say thank you.",intention:"We pray for everyone in our family who is worried or afraid.",ask:"Ask: “What is one thing we can thank God for today?”"},
  catechism:[["CCC 2633–2638","Prayer of petition and thanksgiving."]],kidsaint:["Saint Isaac Jogues","A brave missionary to North America. Even after he was hurt, he went back to tell people about Jesus. Lesson: be brave for Jesus."],
  term:["Qurbana (ഖുർബാന)","A Syriac word meaning offering or sacrifice. We call the Eucharist the Holy Qurbana because in it Christ's one sacrifice is made present, and we offer ourselves with him."],termMore:["Why does the year end with the Lord's coming?","The last seasons of the Syro-Malabar year (Elijah–Cross–Moses and the Dedication of the Church) look toward the end of history, so that the year closes, as history will, with Christ."]},
 {homily:["Dear friends, Paul writes from a prison cell, and the word he repeats is “Rejoice”. How can a prisoner rejoice? Because, he says, “the Lord is near.”","In the Gospel Jesus also says the Lord is near, but he warns us not to let our hearts be “weighed down”. Both are true. Because he is near, we rejoice; because he is near, we watch and pray. The fig tree does not panic when summer comes; it puts out leaves.","Today, let us take Paul's advice literally: “Do not worry about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God.” Then the peace of God will guard our hearts. Amen."],
  kids:["Children, when someone you love is coming home, are you scared or happy? Happy! Jesus is coming close to us every day, especially in Holy Qurbana. So we can be happy.","When you feel worried today, say: “Jesus, I give this to you. Thank you for loving me.”"]});

put("2026-10-19","smc","ml",{title:"മൂശെക്കാലം രണ്ടാം തിങ്കൾ",readTitle:"ഇന്നത്തെ വായനകൾ",
 readings:[["ലേഖനം","ഫിലിപ്പി 4:1–9","കർത്താവ് അടുത്തെത്തിയിരിക്കുന്നു"],["സുവിശേഷം","ലൂക്കാ 21:29–36","ദൈവരാജ്യം സമീപിച്ചിരിക്കുന്നു"]],alt:"",
 verse:"സംഭവിക്കാനിരിക്കുന്ന ഇവയിൽ നിന്നെല്ലാം രക്ഷപെട്ട് മനുഷ്യപുത്രന്റെ മുമ്പിൽ പ്രത്യക്ഷപ്പെടാൻ വേണ്ട കരുത്തു ലഭിക്കാൻ സദാ പ്രാർഥിച്ചുകൊണ്ടു ജാഗരൂകരായിരിക്കുവിൻ.",cite:"ലൂക്കാ 21:36",
 theo:["മൂശെക്കാലം നമ്മുടെ കണ്ണുകളെ കർത്താവിന്റെ വരവിലേക്കു തിരിക്കുന്നു. രണ്ടു വായനകളും എതിർദിശകളിലേക്കു വലിക്കുന്നതായി തോന്നാം: “കർത്താവിൽ എപ്പോഴും സന്തോഷിക്കുവിൻ… കർത്താവ് അടുത്തെത്തിയിരിക്കുന്നു” എന്നു പൗലോസ് പറയുന്നു; ഒരു “കെണിപോലെ” വരുന്ന ദിവസത്തെപ്പറ്റി ഈശോ സംസാരിക്കുന്നു. യഥാർഥത്തിൽ രണ്ടും ഒന്നുതന്നെയാണു പറയുന്നത്. കർത്താവിന്റെ സാമീപ്യമാണു സന്തോഷത്തിനും ജാഗ്രതയ്ക്കും ഒരുപോലെ കാരണം.","ക്രൈസ്തവജാഗ്രത ഉത്കണ്ഠയല്ല. ആകുലതയ്ക്കു പൗലോസ് നൽകുന്ന മരുന്നു കൃതജ്ഞതയോടെയുള്ള പ്രാർഥനയാണ്; എല്ലാ പ്രശ്നങ്ങളും മാഞ്ഞുപോകുമെന്നല്ല വാഗ്ദാനം, “എല്ലാ ധാരണകളെയും അതിശയിക്കുന്ന ദൈവത്തിന്റെ സമാധാനം നിങ്ങളുടെ ഹൃദയങ്ങളെ കാത്തുകൊള്ളും” എന്നാണ് (ഫിലി 4:7). സുവിശേഷത്തിലെ അത്തിമരം വേനൽ വരുമ്പോൾ വിറയ്ക്കുന്നില്ല; തളിർക്കുന്നു. കർത്താവ് അടുത്താണെന്ന് അറിയുന്ന ക്രൈസ്തവനും അങ്ങനെതന്നെ: അവൻ വളരുന്നു, ഫലം നൽകുന്നു, പ്രാർഥിക്കുന്നു."],
 conn:[["അത്തിമരം.","തിരുലിഖിതത്തിൽ അത്തിമരം ഇസ്രായേലിന്റെയും നിറവേറലിന്റെ കാലത്തിന്റെയും പ്രതീകമാണ് (മിക്കാ 4:4; ഹോസി 9:10). സാധാരണ ജീവിതത്തിൽ ദൈവസാമീപ്യത്തിന്റെ അടയാളങ്ങൾ വായിക്കാൻ പഠിക്കുക എന്നാണ് ഈശോ അതിലൂടെ പറയുന്നത്."],["“എന്റെ വാക്കുകൾ കടന്നുപോവുകയില്ല.”","ലൂക്കാ 21:33 ഏശയ്യാ 40:8-നെ പ്രതിധ്വനിക്കുന്നു: “നമ്മുടെ ദൈവത്തിന്റെ വചനം എന്നേക്കും നിലനിൽക്കും.” നാം പണിയുന്നതെല്ലാം കടന്നുപോകുന്നു; കുർബാനയിൽ നാം കേൾക്കുന്ന വചനം കടന്നുപോകുന്നില്ല."]],
 altar:["ഓരോ കുർബാനയിലും, കർത്താവു വരുവോളം അവിടുത്തെ മരണവും ഉത്ഥാനവും നാം പ്രഘോഷിക്കുന്നു. വരാനിരിക്കുന്ന കർത്താവ് ഇപ്പോൾത്തന്നെ അടുത്തുള്ള ഇടമാണു ബലിപീഠം: നാം അവിടുത്തേക്കായി ഉണർന്നിരിക്കുന്നു; അവിടുന്നു രഹസ്യങ്ങളിൽ നമ്മുടെ അടുക്കൽ വരുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: ലോകാവസാനത്തെപ്പറ്റിയുള്ള ചിന്ത നിങ്ങളെ ഭയപ്പെടുത്തുന്നുണ്ടോ, സന്തോഷിപ്പിക്കുന്നുണ്ടോ?"],["ഒന്നാം ആശയം · കർത്താവ് അടുത്താണ്: സന്തോഷിക്കുവിൻ","കാരാഗൃഹത്തിൽനിന്ന് എഴുതുമ്പോഴും പൗലോസ് “സന്തോഷിക്കുവിൻ” എന്നു പറയുന്നു. ക്രൈസ്തവസന്തോഷം ഒരു മാനസികാവസ്ഥയല്ല; കർത്താവിന്റെ സാമീപ്യത്തിലുള്ള വിശ്വാസമാണ്."],["രണ്ടാം ആശയം · കർത്താവ് അടുത്താണ്: ഉണർന്നിരുന്നു പ്രാർഥിക്കുവിൻ","“ഭാരപ്പെട്ട” ഹൃദയത്തിന് ഈശോ നൽകുന്ന മരുന്നു നിരന്തരമായ പ്രാർഥനയാണ്. ഇന്നു ഹൃദയങ്ങളെ ഭാരപ്പെടുത്തുന്നവയ്ക്കു പേരു പറയുക: ആകുലത, മദ്യം, അവസാനിക്കാത്ത സ്ക്രീനുകൾ."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവ് അടുത്താണ്: ആകുലപ്പെടുംമുമ്പു ഞാൻ പ്രാർഥിക്കും.”"]],
 live:[["ആകുലപ്പെടുംമുമ്പു പ്രാർഥിക്കുക (ഫിലിപ്പി 4:6)","ഇന്ന് ആകുലത ഉയരുമ്പോഴെല്ലാം അതിനെ കൃതജ്ഞതയോടെയുള്ള ഒരു വാക്യപ്രാർഥനയാക്കുക."],["മനസ്സു നിറയ്ക്കുക (ഫിലിപ്പി 4:8)","ഇന്നു വൈകുന്നേരം പരദൂഷണത്തിനോ മോശം വാർത്തകൾക്കോ പകരം സത്യവും ശ്രേഷ്ഠവും മനോഹരവുമായ ഒരു കാര്യം ധ്യാനിക്കുക."]],
 fathers:[["വിശുദ്ധ സിപ്രിയൻ","കർത്താവിന്റെ വരവിനെ ഒരു അപരിചിതന്റെ വരവായി ഭയപ്പെടാതെ, തന്നെ സ്നേഹിക്കുന്നവന്റെ വരവായി ക്രൈസ്തവൻ ആഗ്രഹിക്കണമെന്ന് അദ്ദേഹം എഴുതി (മരണത്തെപ്പറ്റി)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1817–1821","ക്രിസ്തുവിന്റെ വാഗ്ദാനങ്ങളിലും പരിശുദ്ധാത്മാവിന്റെ സഹായത്തിലും ആശ്രയിച്ചു സ്വർഗരാജ്യവും നിത്യജീവനും നാം ആഗ്രഹിക്കുന്ന പുണ്യമാണു പ്രത്യാശ."]],
 saints:[["സാർവത്രികസഭയിൽ · ഒക്ടോബർ 19","വിശുദ്ധ ജോൺ ദ് ബ്രെബ്യൂഫും ഐസക് ജോഗ്സും സഹചാരികളായ രക്തസാക്ഷികളും, കുരിശിന്റെ വിശുദ്ധ പൗലോസും ഇന്നു റോമൻ കലണ്ടറിൽ അനുസ്മരിക്കപ്പെടുന്നു."]],
 prayer:"ഈശോയേ, അങ്ങ് അടുത്തുണ്ട്. അങ്ങയുടെ സമാധാനംകൊണ്ട് എന്റെ ഹൃദയം കാക്കണമേ; പ്രാർഥനയിൽ എന്നെ ഉണർവുള്ളവനാക്കണമേ; അങ്ങു വരുമ്പോൾ സന്തോഷത്തോടെ അങ്ങയുടെ മുമ്പിൽ നിൽക്കാൻ എനിക്ക് ഇടയാക്കണമേ. ആമേൻ."},
 {quick:["കർത്താവ് അടുത്താണ്: അതു ഭയത്തിനല്ല, സന്തോഷത്തിനുള്ള കാരണമാണ്.","കൃതജ്ഞതയോടെയുള്ള പ്രാർഥനയാണ് ആകുലതയ്ക്കുള്ള ക്രൈസ്തവമരുന്ന്.","അത്തിമരംപോലെ ഉണർന്നിരിക്കുക: ഫലം നൽകിക്കൊണ്ട്."],action:"ഇന്നത്തെ ഓരോ ആകുലതയെയും ഒരു ചെറിയ നന്ദിപ്രാർഥനയാക്കുക.",question:"ഇന്ന് എന്റെ ഹൃദയത്തെ ഭാരപ്പെടുത്തുന്നത് എന്താണ്?",
  illus:["ഒരു ഉദാഹരണം","ഗൾഫിൽനിന്നു വരുന്ന മകനെ കാത്തു വിമാനത്താവളത്തിൽ നിൽക്കുന്ന അമ്മ ഭയത്തോടെയല്ല ഇരിക്കുന്നത്; പുഞ്ചിരിച്ചുകൊണ്ട് അറൈവൽ ബോർഡിലേക്കു നോക്കിക്കൊണ്ടേയിരിക്കുന്നു. അതാണു ക്രൈസ്തവജാഗ്രത: നാം സ്നേഹിക്കുന്ന ഒരാൾക്കായുള്ള കാത്തിരിപ്പ്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ഫിലിപ്പി 4:4–7.",explain:"വിശുദ്ധ പൗലോസ് പറയുന്നു: ഈശോയിൽ സന്തോഷിക്കുക; ആകുലപ്പെടേണ്ടാ; എല്ലാം പ്രാർഥനയിൽ ദൈവത്തോടു പറയുക; നന്ദി പറയുക.",intention:"നമ്മുടെ കുടുംബത്തിൽ ആകുലതയോ ഭയമോ ഉള്ള എല്ലാവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഇന്നു ദൈവത്തിനു നന്ദി പറയാൻ ഒരു കാര്യം എന്താണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 2633–2638","യാചനയുടെയും കൃതജ്ഞതയുടെയും പ്രാർഥന."]],kidsaint:["വിശുദ്ധ ഐസക് ജോഗ്സ്","വടക്കേ അമേരിക്കയിലെ ധീരനായ ഒരു മിഷനറി. മുറിവേറ്റിട്ടും ഈശോയെപ്പറ്റി ആളുകളോടു പറയാൻ അദ്ദേഹം തിരിച്ചുപോയി. പാഠം: ഈശോയ്ക്കുവേണ്ടി ധൈര്യമുള്ളവരായിരിക്കുക."],
  term:["ഖുർബാന","കാഴ്ച, ബലി എന്നർഥമുള്ള സുറിയാനി വാക്ക്. ക്രിസ്തുവിന്റെ ഏകബലി സന്നിഹിതമാകുകയും നാം അവിടുത്തോടൊപ്പം നമ്മെത്തന്നെ സമർപ്പിക്കുകയും ചെയ്യുന്നതുകൊണ്ടാണു ദിവ്യകാരുണ്യത്തെ നാം വിശുദ്ധ കുർബാന എന്നു വിളിക്കുന്നത്."],termMore:["വർഷം കർത്താവിന്റെ വരവോടെ അവസാനിക്കുന്നത് എന്തുകൊണ്ട്?","സീറോ മലബാർ വർഷത്തിലെ അവസാനകാലങ്ങൾ (ഏലിയാ–സ്ലീവാ–മൂശെക്കാലവും പള്ളിക്കൂദാശക്കാലവും) ചരിത്രത്തിന്റെ അന്ത്യത്തിലേക്കു നോക്കുന്നു; ചരിത്രം എന്നപോലെ വർഷവും ക്രിസ്തുവിൽ അവസാനിക്കാൻ."]},
 {homily:["പ്രിയപ്പെട്ടവരേ, കാരാഗൃഹത്തിൽനിന്നാണു പൗലോസ് എഴുതുന്നത്; അവൻ ആവർത്തിക്കുന്ന വാക്ക് “സന്തോഷിക്കുവിൻ” എന്നാണ്. ഒരു തടവുകാരന് എങ്ങനെ സന്തോഷിക്കാൻ കഴിയും? അവൻ പറയുന്നു: “കർത്താവ് അടുത്തെത്തിയിരിക്കുന്നു.”","സുവിശേഷത്തിലും കർത്താവ് അടുത്താണെന്ന് ഈശോ പറയുന്നു; പക്ഷേ നമ്മുടെ ഹൃദയങ്ങൾ “ഭാരപ്പെടാതിരിക്കാൻ” അവിടുന്നു മുന്നറിയിപ്പു നൽകുന്നു. രണ്ടും സത്യമാണ്. അവിടുന്ന് അടുത്തായതുകൊണ്ടു നാം സന്തോഷിക്കുന്നു; അവിടുന്ന് അടുത്തായതുകൊണ്ടു നാം ഉണർന്നിരുന്നു പ്രാർഥിക്കുന്നു. വേനൽ വരുമ്പോൾ അത്തിമരം പരിഭ്രമിക്കുന്നില്ല; തളിർക്കുന്നു.","ഇന്നു പൗലോസിന്റെ ഉപദേശം അക്ഷരാർഥത്തിൽ സ്വീകരിക്കാം: ഒന്നിനെക്കുറിച്ചും ആകുലരാകാതെ, എല്ലാക്കാര്യങ്ങളിലും പ്രാർഥനയിലൂടെയും യാചനയിലൂടെയും കൃതജ്ഞതയോടെ നമ്മുടെ ആവശ്യങ്ങൾ ദൈവത്തെ അറിയിക്കാം. അപ്പോൾ ദൈവത്തിന്റെ സമാധാനം നമ്മുടെ ഹൃദയങ്ങളെ കാക്കും. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങൾ സ്നേഹിക്കുന്ന ഒരാൾ വീട്ടിലേക്കു വരുമ്പോൾ നിങ്ങൾക്കു പേടിയാണോ സന്തോഷമാണോ? സന്തോഷം! ഈശോ എല്ലാ ദിവസവും, പ്രത്യേകിച്ചു വിശുദ്ധ കുർബാനയിൽ, നമ്മുടെ അടുത്തേക്കു വരുന്നു. അതുകൊണ്ടു നമുക്കു സന്തോഷിക്കാം.","ഇന്നു പേടി തോന്നുമ്പോൾ പറയുക: “ഈശോയേ, ഇതു ഞാൻ അങ്ങേക്കു തരുന്നു. എന്നെ സ്നേഹിക്കുന്നതിനു നന്ദി.”"]});

put("2026-10-20","smc","en",{title:"Second Tuesday of Moses",readTitle:"Readings of the day",
 readings:[["Epistle","Revelation 14:6–13","God's judgement is declared"],["Gospel","Matthew 3:1–12","Every tree that does not bear good fruit is cut down"]],alt:"",
 verse:"Bear fruit worthy of repentance.",cite:"Matthew 3:8",
 theo:["Both readings speak of judgement, and both begin with good news. In Revelation an angel flies through heaven “with an eternal gospel to proclaim to every nation and tribe and language and people”. John the Baptist announces judgement because the Kingdom of heaven is at hand. God judges because he is near, and he warns because he wants no one to be lost.","John refuses the comfort of religious belonging: “Do not presume to say to yourselves, ‘We have Abraham as our ancestor.’” Being born in a Christian family, or being baptised, is a gift and a responsibility, not a guarantee. The axe is at the root, but the tree is not yet cut: there is still time to bear fruit. Judgement in the Bible is the last word of mercy before it is too late."],
 conn:[["The eternal gospel to every nation.","Revelation 14:6 continues the theme of Mission Sunday: before the end, the Gospel must reach every language and people (Matthew 24:14)."],["Fire and the Spirit.","John promises one who will baptise “with the Holy Spirit and fire” (Matthew 3:11), fulfilled at Pentecost when tongues of fire rested on the disciples (Acts 2:3)."]],
 altar:["Before Holy Communion the Church prays for the forgiveness of sins. Repentance is not only a feeling but fruit: the Qurbana we receive is meant to bear fruit in charity."],
 outline:[["Opening","Show a tree with leaves but no fruit, or describe one in a compound. Ask: what is a fruit tree for?"],["Point 1 · No one is safe by name alone","“We have Abraham as our father” could be “We are old Christians from the time of St Thomas.” A great heritage asks for great fruit."],["Point 2 · The axe is at the root, but the tree still stands","God's warning is mercy. Today is still the time of repentance; invite people to Confession this week."],["Take-home line","“Lord, let my faith bear fruit today.”"]],
 live:[["One fruit today (Matthew 3:8)","Name one concrete fruit of repentance: an apology, restitution, a visit you have avoided."],["Prepare for Confession (Revelation 14:13)","“Blessed are the dead who die in the Lord.” Make a simple examination of conscience tonight."]],
 fathers:[["St Jerome","Commenting on Matthew 3:10, he notes that the axe is laid at the root, not yet swung: there is still time for repentance before it strikes (Commentary on Matthew)."]],
 magis:[["Catechism 1431","Interior repentance is a radical reorientation of our whole life, a return to God with all our heart."]],
 saints:[["In the Syro-Malabar calendar","No saint's memory is assigned today. Remember the departed of your family in prayer: the Moses season looks to the resurrection."]],
 prayer:"Lord, you call us to repentance not to frighten us but to save us. Make my life bear fruit worthy of repentance, through the Holy Spirit and the fire of your love. Amen."},
 {quick:["God warns because he does not want anyone to be lost.","Being a Christian by birth is a gift, not a guarantee.","The axe is at the root, but there is still time: bear fruit today."],action:"Do one concrete act of repentance today: apologise, repair, or reconcile.",question:"What fruit is God looking for in my life this week?",
  illus:["An illustration","A coconut farmer does not cut down a palm in its first bad year; he digs around it, adds manure and waits. But he does check it. God is that kind of farmer."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 3:8–10.",explain:"John the Baptist said: a good tree gives good fruit. We are God's trees; our good fruits are kindness, honesty and helping others.",intention:"We pray for anyone in our family who needs to say sorry or forgive.",ask:"Ask: “What good fruit did each of us give today?”"},
  catechism:[["CCC 1430–1433","Interior penance and conversion."]],kidsaint:["Saint John the Baptist","He lived in the desert and told everyone to get ready for Jesus. He was brave enough to tell even the king the truth. Lesson: tell the truth, even when it is hard."],
  term:["Karozutha (കാറോസൂസ)","The litany sung by the deacon or priest, with the people answering. From a Syriac word meaning proclamation. In it the Church prays for all the needs of the world."],termMore:["Why do we pray for the whole world at Qurbana?","Because the Gospel is for every nation (Revelation 14:6). The Karozutha makes our Qurbana a prayer for all people, not only for ourselves."]},
 {homily:["Dear friends, today's readings speak about judgement, but notice how they begin: with good news. An angel carries an eternal gospel to every nation; John announces that the Kingdom of heaven is near.","John says something hard: “Do not presume to say, ‘We have Abraham as our ancestor.’” We might say, “We are old Christians, from the time of St Thomas.” That is a great gift. But a great heritage asks for great fruit. The axe is at the root, yet the tree still stands; there is still time.","So let us ask today: what fruit is God looking for in me? An apology, a forgiveness, a return to Confession, a gift to the poor. “Bear fruit worthy of repentance.” Amen."],
  kids:["Children, what is a mango tree for? For mangoes! If it gives no mangoes, the farmer is sad. We are God's trees. Our fruits are kindness, telling the truth and helping others.","Today, give one good fruit: say sorry to someone, or help someone without being asked."]});

put("2026-10-20","smc","ml",{title:"മൂശെക്കാലം രണ്ടാം ചൊവ്വ",readTitle:"ഇന്നത്തെ വായനകൾ",
 readings:[["ലേഖനം","വെളിപാട് 14:6–13","ദൈവത്തിന്റെ വിധി പ്രഖ്യാപിക്കപ്പെടുന്നു"],["സുവിശേഷം","മത്തായി 3:1–12","നല്ല ഫലം നൽകാത്ത വൃക്ഷം വെട്ടപ്പെടുന്നു"]],alt:"",
 verse:"മാനസാന്തരത്തിനു യോജിച്ച ഫലം പുറപ്പെടുവിക്കുവിൻ.",cite:"മത്തായി 3:8",
 theo:["രണ്ടു വായനകളും വിധിയെപ്പറ്റി സംസാരിക്കുന്നു; രണ്ടും സദ്വാർത്തയോടെയാണ് ആരംഭിക്കുന്നത്. വെളിപാടിൽ ഒരു ദൂതൻ “എല്ലാ ജനതകളോടും ഗോത്രങ്ങളോടും ഭാഷകളോടും ജനങ്ങളോടും പ്രഘോഷിക്കാൻ നിത്യമായ ഒരു സുവിശേഷവുമായി” ആകാശമധ്യേ പറക്കുന്നു. സ്വർഗരാജ്യം സമീപിച്ചിരിക്കുന്നതുകൊണ്ടാണു സ്നാപകയോഹന്നാൻ വിധി പ്രഖ്യാപിക്കുന്നത്. ദൈവം അടുത്തായതുകൊണ്ട് അവിടുന്നു വിധിക്കുന്നു; ആരും നഷ്ടപ്പെടരുതെന്ന് ആഗ്രഹിക്കുന്നതുകൊണ്ട് അവിടുന്നു മുന്നറിയിപ്പു നൽകുന്നു.","മതപരമായ അംഗത്വത്തിന്റെ ആശ്വാസം യോഹന്നാൻ നിരസിക്കുന്നു: “അബ്രാഹം ഞങ്ങളുടെ പിതാവാണ് എന്നു നിങ്ങൾ ഉള്ളിൽ പറയാൻ തുനിയേണ്ടാ.” ക്രൈസ്തവകുടുംബത്തിൽ ജനിക്കുന്നതും മാമ്മോദീസ സ്വീകരിക്കുന്നതും ദാനവും ഉത്തരവാദിത്വവുമാണ്; ഉറപ്പല്ല. കോടാലി വേരിൽ വച്ചുകഴിഞ്ഞു; പക്ഷേ മരം ഇതുവരെ വെട്ടപ്പെട്ടിട്ടില്ല: ഫലം നൽകാൻ ഇനിയും സമയമുണ്ട്. ബൈബിളിലെ വിധി, വൈകുന്നതിനു മുമ്പുള്ള കരുണയുടെ അവസാന വാക്കാണ്."],
 conn:[["എല്ലാ ജനതകൾക്കുമുള്ള നിത്യസുവിശേഷം.","വെളിപാട് 14:6 മിഷൻ ഞായറിന്റെ വിഷയം തുടരുന്നു: അന്ത്യത്തിനു മുമ്പു സുവിശേഷം എല്ലാ ഭാഷകളിലും ജനങ്ങളിലും എത്തണം (മത്താ 24:14)."],["അഗ്നിയും ആത്മാവും.","“പരിശുദ്ധാത്മാവിനാലും അഗ്നിയാലും” സ്നാനം നൽകുന്നവനെ യോഹന്നാൻ വാഗ്ദാനം ചെയ്യുന്നു (മത്താ 3:11); ശിഷ്യരുടെമേൽ അഗ്നിനാവുകൾ ഇറങ്ങിയ പന്തക്കുസ്തായിൽ അതു നിറവേറി (അപ്പ 2:3)."]],
 altar:["ദിവ്യകാരുണ്യസ്വീകരണത്തിനു മുമ്പു പാപമോചനത്തിനായി സഭ പ്രാർഥിക്കുന്നു. അനുതാപം ഒരു വികാരം മാത്രമല്ല, ഫലമാണ്: നാം സ്വീകരിക്കുന്ന കുർബാന സ്നേഹത്തിൽ ഫലം പുറപ്പെടുവിക്കാനുള്ളതാണ്."],
 outline:[["ആരംഭം","ഇലയുണ്ടായിട്ടും കായില്ലാത്ത ഒരു മരം കാണിക്കുകയോ വിവരിക്കുകയോ ചെയ്യുക. ചോദിക്കുക: ഫലവൃക്ഷം എന്തിനുള്ളതാണ്?"],["ഒന്നാം ആശയം · പേരുകൊണ്ടു മാത്രം ആരും സുരക്ഷിതരല്ല","“അബ്രാഹം ഞങ്ങളുടെ പിതാവാണ്” എന്നതു “ഞങ്ങൾ മാർ തോമായുടെ കാലംമുതലുള്ള പഴയ ക്രിസ്ത്യാനികളാണ്” എന്നാകാം. വലിയ പൈതൃകം വലിയ ഫലം ആവശ്യപ്പെടുന്നു."],["രണ്ടാം ആശയം · കോടാലി വേരിലുണ്ട്; പക്ഷേ മരം ഇപ്പോഴും നിൽക്കുന്നു","ദൈവത്തിന്റെ മുന്നറിയിപ്പു കരുണയാണ്. ഇന്നും അനുതാപത്തിന്റെ സമയമാണ്; ഈ ആഴ്ച കുമ്പസാരത്തിലേക്കു ക്ഷണിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, എന്റെ വിശ്വാസം ഇന്നു ഫലം പുറപ്പെടുവിക്കട്ടെ.”"]],
 live:[["ഇന്ന് ഒരു ഫലം (മത്തായി 3:8)","അനുതാപത്തിന്റെ വ്യക്തമായ ഒരു ഫലം തീരുമാനിക്കുക: ഒരു ക്ഷമാപണം, ഒരു പരിഹാരം, ഒഴിവാക്കിവന്ന ഒരു സന്ദർശനം."],["കുമ്പസാരത്തിന് ഒരുങ്ങുക (വെളിപാട് 14:13)","“കർത്താവിൽ മരിക്കുന്നവർ ഭാഗ്യവാന്മാർ.” ഇന്നു രാത്രി ലളിതമായ ഒരു മനഃസാക്ഷിപരിശോധന നടത്തുക."]],
 fathers:[["വിശുദ്ധ ജറോം","മത്തായി 3:10 വ്യാഖ്യാനിച്ച് അദ്ദേഹം ശ്രദ്ധിക്കുന്നു: കോടാലി വേരിൽ വച്ചിരിക്കുന്നതേയുള്ളൂ, ഇതുവരെ വീശിയിട്ടില്ല; അതു പതിക്കുംമുമ്പ് അനുതാപത്തിന് ഇനിയും സമയമുണ്ട് (മത്തായിയുടെ സുവിശേഷവ്യാഖ്യാനം)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1431","ആന്തരികാനുതാപം നമ്മുടെ ജീവിതം മുഴുവന്റെയും സമൂലമായ പുനഃക്രമീകരണമാണ്; പൂർണഹൃദയത്തോടെ ദൈവത്തിലേക്കുള്ള മടക്കമാണ്."]],
 saints:[["സീറോ മലബാർ കലണ്ടറിൽ","ഇന്ന് ഒരു വിശുദ്ധന്റെയും ഓർമ നിശ്ചയിച്ചിട്ടില്ല. കുടുംബത്തിലെ മരിച്ചവരെ പ്രാർഥനയിൽ ഓർക്കുക: മൂശെക്കാലം ഉയിർപ്പിലേക്കു നോക്കുന്നു."]],
 prayer:"കർത്താവേ, ഞങ്ങളെ ഭയപ്പെടുത്താനല്ല, രക്ഷിക്കാനാണ് അങ്ങു ഞങ്ങളെ അനുതാപത്തിലേക്കു വിളിക്കുന്നത്. പരിശുദ്ധാത്മാവിനാലും അങ്ങയുടെ സ്നേഹാഗ്നിയാലും എന്റെ ജീവിതം മാനസാന്തരത്തിനു യോജിച്ച ഫലം പുറപ്പെടുവിക്കാൻ ഇടയാക്കണമേ. ആമേൻ."},
 {quick:["ആരും നഷ്ടപ്പെടരുതെന്ന് ആഗ്രഹിക്കുന്നതുകൊണ്ടാണു ദൈവം മുന്നറിയിപ്പു നൽകുന്നത്.","ജനനംകൊണ്ടുള്ള ക്രൈസ്തവത്വം ദാനമാണ്; ഉറപ്പല്ല.","കോടാലി വേരിലുണ്ട്; പക്ഷേ ഇനിയും സമയമുണ്ട്: ഇന്നു ഫലം നൽകുക."],action:"അനുതാപത്തിന്റെ വ്യക്തമായ ഒരു പ്രവൃത്തി ഇന്നു ചെയ്യുക: ക്ഷമ ചോദിക്കുക, പരിഹരിക്കുക, അല്ലെങ്കിൽ രമ്യപ്പെടുക.",question:"ഈ ആഴ്ച എന്റെ ജീവിതത്തിൽ ദൈവം തിരയുന്ന ഫലം ഏതാണ്?",
  illus:["ഒരു ഉദാഹരണം","ആദ്യത്തെ മോശം വർഷത്തിൽ ഒരു കർഷകൻ തെങ്ങു വെട്ടിക്കളയുന്നില്ല; ചുവടു കിളച്ചു വളമിട്ടു കാത്തിരിക്കുന്നു. പക്ഷേ അയാൾ അതു പരിശോധിക്കുന്നുണ്ട്. ദൈവം അങ്ങനെയുള്ള ഒരു കർഷകനാണ്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 3:8–10.",explain:"സ്നാപകയോഹന്നാൻ പറഞ്ഞു: നല്ല മരം നല്ല ഫലം തരുന്നു. നാം ദൈവത്തിന്റെ മരങ്ങളാണ്; ദയ, സത്യസന്ധത, മറ്റുള്ളവരെ സഹായിക്കൽ എന്നിവയാണു നമ്മുടെ നല്ല ഫലങ്ങൾ.",intention:"ക്ഷമ ചോദിക്കാനോ ക്ഷമിക്കാനോ ഉള്ള നമ്മുടെ കുടുംബാംഗങ്ങൾക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഇന്നു നമ്മളോരോരുത്തരും നൽകിയ നല്ല ഫലം ഏതാണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1430–1433","ആന്തരികാനുതാപവും മാനസാന്തരവും."]],kidsaint:["സ്നാപകയോഹന്നാൻ","അവൻ മരുഭൂമിയിൽ ജീവിച്ചു; ഈശോയ്ക്കായി ഒരുങ്ങാൻ എല്ലാവരോടും പറഞ്ഞു. രാജാവിനോടുപോലും സത്യം പറയാൻ അവനു ധൈര്യമുണ്ടായിരുന്നു. പാഠം: ബുദ്ധിമുട്ടുള്ളപ്പോഴും സത്യം പറയുക."],
  term:["കാറോസൂസ","ഡീക്കനോ വൈദികനോ ചൊല്ലുകയും ജനം പ്രത്യുത്തരം നൽകുകയും ചെയ്യുന്ന ലുത്തിനിയ. പ്രഘോഷണം എന്നർഥമുള്ള സുറിയാനി വാക്കിൽനിന്ന്. അതിൽ ലോകത്തിന്റെ എല്ലാ ആവശ്യങ്ങൾക്കുംവേണ്ടി സഭ പ്രാർഥിക്കുന്നു."],termMore:["കുർബാനയിൽ ലോകം മുഴുവനുംവേണ്ടി പ്രാർഥിക്കുന്നത് എന്തുകൊണ്ട്?","സുവിശേഷം എല്ലാ ജനതകൾക്കുമുള്ളതായതുകൊണ്ട് (വെളി 14:6). നമ്മുടെ കുർബാനയെ നമുക്കുവേണ്ടി മാത്രമല്ലാതെ എല്ലാ മനുഷ്യർക്കുംവേണ്ടിയുള്ള പ്രാർഥനയാക്കുന്നതു കാറോസൂസയാണ്."]},
 {homily:["പ്രിയപ്പെട്ടവരേ, ഇന്നത്തെ വായനകൾ വിധിയെപ്പറ്റി സംസാരിക്കുന്നു; പക്ഷേ അവ എങ്ങനെ ആരംഭിക്കുന്നുവെന്നു ശ്രദ്ധിക്കുക: സദ്വാർത്തയോടെ. ഒരു ദൂതൻ എല്ലാ ജനതകൾക്കുമായി നിത്യസുവിശേഷം വഹിക്കുന്നു; സ്വർഗരാജ്യം സമീപിച്ചിരിക്കുന്നുവെന്നു യോഹന്നാൻ പ്രഖ്യാപിക്കുന്നു.","യോഹന്നാൻ കഠിനമായ ഒരു കാര്യം പറയുന്നു: “അബ്രാഹം ഞങ്ങളുടെ പിതാവാണ് എന്നു പറയാൻ തുനിയേണ്ടാ.” “ഞങ്ങൾ മാർ തോമായുടെ കാലംമുതലുള്ള പഴയ ക്രിസ്ത്യാനികളാണ്” എന്നു നാം പറഞ്ഞേക്കാം. അതു വലിയ ദാനമാണ്. പക്ഷേ വലിയ പൈതൃകം വലിയ ഫലം ആവശ്യപ്പെടുന്നു. കോടാലി വേരിലുണ്ട്; എങ്കിലും മരം ഇപ്പോഴും നിൽക്കുന്നു; ഇനിയും സമയമുണ്ട്.","അതുകൊണ്ട് ഇന്നു ചോദിക്കാം: ദൈവം എന്നിൽ തിരയുന്ന ഫലം ഏതാണ്? ഒരു ക്ഷമാപണം, ഒരു ക്ഷമ, കുമ്പസാരത്തിലേക്കുള്ള മടക്കം, ദരിദ്രർക്ക് ഒരു ദാനം. “മാനസാന്തരത്തിനു യോജിച്ച ഫലം പുറപ്പെടുവിക്കുവിൻ.” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, മാവ് എന്തിനുള്ളതാണ്? മാങ്ങയ്ക്ക്! മാങ്ങ ഉണ്ടാകുന്നില്ലെങ്കിൽ കർഷകനു സങ്കടമാണ്. നാം ദൈവത്തിന്റെ മരങ്ങളാണ്. ദയ, സത്യം പറയൽ, മറ്റുള്ളവരെ സഹായിക്കൽ എന്നിവയാണു നമ്മുടെ ഫലങ്ങൾ.","ഇന്ന് ഒരു നല്ല ഫലം നൽകുക: ആരോടെങ്കിലും സോറി പറയുക, അല്ലെങ്കിൽ ആരും പറയാതെ ഒരാളെ സഹായിക്കുക."]});

put("2026-10-21","smc","en",{title:"Second Wednesday of Moses",readTitle:"Readings of the day",
 readings:[["Epistle","James 1:12–18","Do not be misled"],["Gospel","Luke 15:1–10","The lost sheep and the lost coin"]],alt:"",
 verse:"Rejoice with me, for I have found my sheep that was lost.",cite:"Luke 15:6",
 theo:["St James insists that temptation does not come from God: “God cannot be tempted by evil and he himself tempts no one.” Evil grows from our own desire, step by step, to sin and death. But from God comes only good: “Every generous act of giving, with every perfect gift, is from above, coming down from the Father of lights.”","The Gospel shows what this generous Father does when we fall. He does not wait for the lost sheep to find its way home; he goes after it. He does not scold the coin for rolling into a dark corner; he lights a lamp and sweeps the house. And when he finds it, he throws a party. Heaven rejoices more over one sinner who repents than over ninety-nine who think they need no repentance."],
 conn:[["The Shepherd of Ezekiel 34.","“I myself will search for my sheep… I will seek the lost” (Ezekiel 34:11, 16). Jesus' parable claims this divine work as his own."],["The lamp and the house.","The woman lights a lamp and sweeps; the Fathers saw in her the Church, and in the lamp the Word of God searching every corner for the lost."]],
 altar:["The Qurbana is the feast of the found. We come as sheep that were carried home, and the Shepherd himself feeds us."],
 outline:[["Opening","Ask: have you ever lost something valuable, a phone, a gold chain? How did you search?"],["Point 1 · Evil does not come from God","James clears God's name: temptation grows from our own desires. God gives only good gifts."],["Point 2 · God searches and rejoices","The shepherd goes out; the woman sweeps. God's joy is greater than our shame. Invite to Confession: heaven is waiting to celebrate."],["Take-home line","“I am the one he went out to find.”"]],
 live:[["Search for someone (Luke 15:4)","Contact one person who has drifted from the Church or from your family, simply to show you care."],["Name the gift (James 1:17)","Write down three good gifts you received this week and thank the Father of lights."]],
 fathers:[["St Gregory the Great","He wrote that the shepherd places the sheep on his shoulders because Christ took our human nature upon himself and carried our sins (Homilies on the Gospels 34)."]],
 magis:[["Catechism 1443, 1468","Reconciliation restores us to the Father's house; the joy of the feast is the joy of the Father who welcomes the sinner home."]],
 saints:[["In the Syro-Malabar calendar","No memorial assigned today. Pray for those who have left the Church, that they may be found by the Shepherd."]],
 prayer:"Good Shepherd, you go out to look for me when I am lost. Bring home all who have wandered, and let me share your joy over every sinner who returns. Amen."},
 {quick:["Temptation never comes from God; every good gift does.","God searches for the lost before they search for him.","Heaven throws a party for one sinner who repents."],action:"Reach out today to one person who has drifted away.",question:"Whom is God asking me to go and look for?",
  illus:["An illustration","When a child is missing from a village, every house opens its doors and people search with torches all night. No one asks whether the child deserved to be lost. That is how God searches for us."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 15:4–7.",explain:"Jesus is like a shepherd who loses one sheep and looks everywhere until he finds it. When we do wrong, Jesus comes to find us and is happy when we come back.",intention:"We pray for people we know who are far from God.",ask:"Ask: “Who in our family or class needs a friend right now?”"},
  catechism:[["CCC 1439","The parable of the prodigal son and the Father's mercy."]],kidsaint:["Saint Peter","Peter said three times that he did not know Jesus. But Jesus looked at him with love, and Peter cried and came back. Later Jesus asked him three times, “Do you love me?” and made him the leader of the apostles. Lesson: Jesus always gives us another chance."],
  term:["Confession (കുമ്പസാരം)","The Sacrament of Reconciliation, in which Christ forgives our sins through the priest and brings us back into the joy of the Church. In our tradition it is also a sign of returning to the Father's house."],termMore:["Why does heaven rejoice?","Because every sinner who returns is a lost child found. The Church calls Confession a sacrament of joy, not only of sorrow."]},
 {homily:["Dear friends, St James says something we often forget: evil does not come from God. Temptation grows from our own desires. From God comes only good, every perfect gift, from the Father of lights.","And what does this good Father do when we fall? Jesus tells us: he goes out after the lost sheep, he lights a lamp and sweeps the house for the lost coin. He does not wait for us to be worthy. And when he finds us, he throws a party.","If you have been away from Confession, today is the day to let yourself be found. Heaven is waiting to rejoice over you. Amen."],
  kids:["Children, have you ever lost your favourite toy? You looked everywhere! Jesus is like that. When someone is lost, he searches until he finds them.","When we do something wrong, Jesus does not stop loving us. He comes to find us, and he is so happy when we say sorry."]});

put("2026-10-21","smc","ml",{title:"മൂശെക്കാലം രണ്ടാം ബുധൻ",readTitle:"ഇന്നത്തെ വായനകൾ",
 readings:[["ലേഖനം","യാക്കോബ് 1:12–18","വഞ്ചിക്കപ്പെടരുത്"],["സുവിശേഷം","ലൂക്കാ 15:1–10","നഷ്ടപ്പെട്ട ആടും നാണയവും"]],alt:"",
 verse:"നിങ്ങൾ എന്നോടുകൂടെ സന്തോഷിക്കുവിൻ. എന്റെ നഷ്ടപ്പെട്ട ആടിനെ കണ്ടുകിട്ടിയിരിക്കുന്നു.",cite:"ലൂക്കാ 15:6",
 theo:["പ്രലോഭനം ദൈവത്തിൽനിന്നു വരുന്നില്ലെന്നു വിശുദ്ധ യാക്കോബ് ഉറപ്പിച്ചുപറയുന്നു: ദൈവത്തെ തിന്മകൊണ്ടു പ്രലോഭിപ്പിക്കാനാവില്ല; അവിടുന്ന് ആരെയും പ്രലോഭിപ്പിക്കുന്നുമില്ല. തിന്മ നമ്മുടെ സ്വന്തം ആഗ്രഹത്തിൽനിന്നു പടിപടിയായി പാപത്തിലേക്കും മരണത്തിലേക്കും വളരുന്നു. എന്നാൽ ദൈവത്തിൽനിന്നു നന്മ മാത്രം വരുന്നു: എല്ലാ നല്ല ദാനങ്ങളും പൂർണമായ എല്ലാ വരങ്ങളും ഉയരത്തിൽനിന്ന്, പ്രകാശങ്ങളുടെ പിതാവിൽനിന്ന്, ഇറങ്ങിവരുന്നു.","നാം വീഴുമ്പോൾ ഈ ഉദാരനായ പിതാവ് എന്തു ചെയ്യുന്നുവെന്നു സുവിശേഷം കാണിക്കുന്നു. നഷ്ടപ്പെട്ട ആടു സ്വയം വഴി കണ്ടെത്തി വീട്ടിലെത്താൻ അവിടുന്നു കാത്തിരിക്കുന്നില്ല; അതിന്റെ പിന്നാലെ പോകുന്നു. ഇരുണ്ട മൂലയിലേക്ക് ഉരുണ്ടുപോയ നാണയത്തെ അവിടുന്നു ശകാരിക്കുന്നില്ല; വിളക്കു കൊളുത്തി വീട് അടിച്ചുവാരുന്നു. കണ്ടെത്തുമ്പോൾ ഒരു വിരുന്നൊരുക്കുന്നു. അനുതാപം ആവശ്യമില്ലെന്നു കരുതുന്ന തൊണ്ണൂറ്റൊമ്പതുപേരെക്കാൾ, അനുതപിക്കുന്ന ഒരു പാപിയെക്കുറിച്ചു സ്വർഗം കൂടുതൽ സന്തോഷിക്കുന്നു."],
 conn:[["എസെക്കിയേൽ 34-ലെ ഇടയൻ.","“ഞാൻതന്നെ എന്റെ ആടുകളെ അന്വേഷിക്കും… നഷ്ടപ്പെട്ടതിനെ ഞാൻ തേടും” (എസെ 34:11, 16). ഈ ദൈവികപ്രവൃത്തി തന്റേതാണെന്ന് ഈശോയുടെ ഉപമ അവകാശപ്പെടുന്നു."],["വിളക്കും വീടും.","സ്ത്രീ വിളക്കു കൊളുത്തി അടിച്ചുവാരുന്നു; പിതാക്കന്മാർ അവളിൽ സഭയെയും, വിളക്കിൽ നഷ്ടപ്പെട്ടവരെ ഓരോ മൂലയിലും തിരയുന്ന ദൈവവചനത്തെയും കണ്ടു."]],
 altar:["കണ്ടെത്തപ്പെട്ടവരുടെ വിരുന്നാണു കുർബാന. ചുമലിലേറ്റി വീട്ടിലെത്തിക്കപ്പെട്ട ആടുകളായി നാം വരുന്നു; ഇടയൻതന്നെ നമ്മെ പോറ്റുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: വിലപിടിപ്പുള്ള എന്തെങ്കിലും, ഒരു ഫോൺ, ഒരു സ്വർണമാല, നിങ്ങൾക്കു നഷ്ടപ്പെട്ടിട്ടുണ്ടോ? എങ്ങനെയാണു തിരഞ്ഞത്?"],["ഒന്നാം ആശയം · തിന്മ ദൈവത്തിൽനിന്നല്ല","യാക്കോബ് ദൈവത്തിന്റെ പേരു ശുദ്ധമാക്കുന്നു: പ്രലോഭനം നമ്മുടെ സ്വന്തം ആഗ്രഹങ്ങളിൽനിന്നു വളരുന്നു. ദൈവം നല്ല ദാനങ്ങൾ മാത്രം നൽകുന്നു."],["രണ്ടാം ആശയം · ദൈവം തിരയുന്നു, സന്തോഷിക്കുന്നു","ഇടയൻ പുറപ്പെടുന്നു; സ്ത്രീ അടിച്ചുവാരുന്നു. നമ്മുടെ ലജ്ജയെക്കാൾ വലുതാണു ദൈവത്തിന്റെ സന്തോഷം. കുമ്പസാരത്തിലേക്കു ക്ഷണിക്കുക: ആഘോഷിക്കാൻ സ്വർഗം കാത്തിരിക്കുന്നു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“അവിടുന്നു തേടിയിറങ്ങിയത് എന്നെയാണ്.”"]],
 live:[["ഒരാളെ തേടുക (ലൂക്കാ 15:4)","സഭയിൽനിന്നോ കുടുംബത്തിൽനിന്നോ അകന്നുപോയ ഒരാളെ, കരുതൽ കാണിക്കാൻ മാത്രമായി, ബന്ധപ്പെടുക."],["ദാനത്തിനു പേരു നൽകുക (യാക്കോബ് 1:17)","ഈ ആഴ്ച ലഭിച്ച മൂന്നു നല്ല ദാനങ്ങൾ എഴുതിവച്ച് പ്രകാശങ്ങളുടെ പിതാവിനു നന്ദി പറയുക."]],
 fathers:[["മഹാനായ വിശുദ്ധ ഗ്രിഗറി","ക്രിസ്തു നമ്മുടെ മനുഷ്യസ്വഭാവം ഏറ്റെടുത്തു നമ്മുടെ പാപങ്ങൾ വഹിച്ചതുകൊണ്ടാണ് ഇടയൻ ആടിനെ ചുമലിൽ വയ്ക്കുന്നതെന്ന് അദ്ദേഹം എഴുതി (സുവിശേഷപ്രസംഗങ്ങൾ 34)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1443, 1468","അനുരഞ്ജനം നമ്മെ പിതാവിന്റെ ഭവനത്തിലേക്കു പുനഃസ്ഥാപിക്കുന്നു; പാപിയെ വീട്ടിലേക്കു സ്വാഗതം ചെയ്യുന്ന പിതാവിന്റെ സന്തോഷമാണു വിരുന്നിന്റെ സന്തോഷം."]],
 saints:[["സീറോ മലബാർ കലണ്ടറിൽ","ഇന്ന് ഓർമയൊന്നും നിശ്ചയിച്ചിട്ടില്ല. സഭ വിട്ടുപോയവർ ഇടയനാൽ കണ്ടെത്തപ്പെടാൻ അവർക്കുവേണ്ടി പ്രാർഥിക്കുക."]],
 prayer:"നല്ല ഇടയനേ, ഞാൻ നഷ്ടപ്പെടുമ്പോൾ അങ്ങ് എന്നെ തേടിയിറങ്ങുന്നു. വഴിതെറ്റിയ എല്ലാവരെയും വീട്ടിലേക്കു കൊണ്ടുവരണമേ; മടങ്ങിവരുന്ന ഓരോ പാപിയെയുംപ്രതിയുള്ള അങ്ങയുടെ സന്തോഷത്തിൽ പങ്കുചേരാൻ എനിക്ക് ഇടയാക്കണമേ. ആമേൻ."},
 {quick:["പ്രലോഭനം ഒരിക്കലും ദൈവത്തിൽനിന്നല്ല; എല്ലാ നല്ല ദാനങ്ങളും ദൈവത്തിൽനിന്നാണ്.","നഷ്ടപ്പെട്ടവർ ദൈവത്തെ തിരയുംമുമ്പേ ദൈവം അവരെ തിരയുന്നു.","അനുതപിക്കുന്ന ഒരു പാപിക്കുവേണ്ടി സ്വർഗം വിരുന്നൊരുക്കുന്നു."],action:"അകന്നുപോയ ഒരാളെ ഇന്നു ബന്ധപ്പെടുക.",question:"ആരെ തേടിപ്പോകാനാണു ദൈവം എന്നോട് ആവശ്യപ്പെടുന്നത്?",
  illus:["ഒരു ഉദാഹരണം","ഒരു ഗ്രാമത്തിൽ ഒരു കുട്ടിയെ കാണാതാകുമ്പോൾ എല്ലാ വീടുകളും വാതിൽ തുറക്കുന്നു; ആളുകൾ രാത്രി മുഴുവൻ ടോർച്ചുമായി തിരയുന്നു. നഷ്ടപ്പെടാൻ ആ കുട്ടി അർഹനായിരുന്നോ എന്ന് ആരും ചോദിക്കുന്നില്ല. ദൈവം നമ്മെ തിരയുന്നത് അങ്ങനെയാണ്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 15:4–7.",explain:"ഒരു ആടിനെ നഷ്ടപ്പെട്ടിട്ട് അതിനെ കണ്ടെത്തുംവരെ എല്ലായിടത്തും തിരയുന്ന ഇടയനെപ്പോലെയാണ് ഈശോ. നാം തെറ്റു ചെയ്യുമ്പോൾ ഈശോ നമ്മെ തേടിവരുന്നു; നാം മടങ്ങിവരുമ്പോൾ സന്തോഷിക്കുന്നു.",intention:"ദൈവത്തിൽനിന്ന് അകന്നിരിക്കുന്ന, നമുക്കറിയാവുന്നവർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മുടെ കുടുംബത്തിലോ ക്ലാസിലോ ഇപ്പോൾ ഒരു കൂട്ടുകാരനെ ആവശ്യമുള്ളത് ആർക്കാണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1439","ധൂർത്തപുത്രന്റെ ഉപമയും പിതാവിന്റെ കരുണയും."]],kidsaint:["വിശുദ്ധ പത്രോസ്","ഈശോയെ അറിയില്ലെന്നു പത്രോസ് മൂന്നു തവണ പറഞ്ഞു. പക്ഷേ ഈശോ സ്നേഹത്തോടെ അവനെ നോക്കി; പത്രോസ് കരഞ്ഞു, തിരിച്ചുവന്നു. പിന്നീട് “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” എന്ന് ഈശോ മൂന്നു തവണ ചോദിച്ച് അവനെ ശ്ലീഹന്മാരുടെ തലവനാക്കി. പാഠം: ഈശോ എപ്പോഴും നമുക്കു വീണ്ടും ഒരു അവസരം തരുന്നു."],
  term:["കുമ്പസാരം","അനുരഞ്ജനകൂദാശ. അതിൽ ക്രിസ്തു വൈദികനിലൂടെ നമ്മുടെ പാപങ്ങൾ ക്ഷമിക്കുകയും നമ്മെ സഭയുടെ സന്തോഷത്തിലേക്കു തിരികെ കൊണ്ടുവരുകയും ചെയ്യുന്നു. പിതാവിന്റെ ഭവനത്തിലേക്കുള്ള മടക്കത്തിന്റെ അടയാളവുമാണത്."],termMore:["സ്വർഗം സന്തോഷിക്കുന്നത് എന്തുകൊണ്ട്?","മടങ്ങിവരുന്ന ഓരോ പാപിയും കണ്ടെത്തപ്പെട്ട, നഷ്ടപ്പെട്ട ഒരു കുഞ്ഞാണ്. സഭ കുമ്പസാരത്തെ ദുഃഖത്തിന്റേതു മാത്രമല്ല, സന്തോഷത്തിന്റെയും കൂദാശയായി കാണുന്നു."]},
 {homily:["പ്രിയപ്പെട്ടവരേ, നാം പലപ്പോഴും മറക്കുന്ന ഒരു കാര്യം വിശുദ്ധ യാക്കോബ് പറയുന്നു: തിന്മ ദൈവത്തിൽനിന്നു വരുന്നില്ല. പ്രലോഭനം നമ്മുടെ സ്വന്തം ആഗ്രഹങ്ങളിൽനിന്നു വളരുന്നു. ദൈവത്തിൽനിന്നു നന്മ മാത്രം, പൂർണമായ എല്ലാ ദാനങ്ങളും, പ്രകാശങ്ങളുടെ പിതാവിൽനിന്നു വരുന്നു.","നാം വീഴുമ്പോൾ ഈ നല്ല പിതാവ് എന്തു ചെയ്യുന്നു? ഈശോ പറയുന്നു: നഷ്ടപ്പെട്ട ആടിന്റെ പിന്നാലെ അവിടുന്നു പോകുന്നു; നഷ്ടപ്പെട്ട നാണയത്തിനായി വിളക്കു കൊളുത്തി വീട് അടിച്ചുവാരുന്നു. നാം യോഗ്യരാകാൻ അവിടുന്നു കാത്തിരിക്കുന്നില്ല. കണ്ടെത്തുമ്പോൾ ഒരു വിരുന്നൊരുക്കുന്നു.","കുമ്പസാരത്തിൽനിന്നു നിങ്ങൾ അകന്നിരിക്കുകയാണെങ്കിൽ, കണ്ടെത്തപ്പെടാൻ നിങ്ങളെത്തന്നെ അനുവദിക്കേണ്ട ദിവസം ഇന്നാണ്. നിങ്ങളെപ്രതി സന്തോഷിക്കാൻ സ്വർഗം കാത്തിരിക്കുന്നു. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങളുടെ ഇഷ്ടപ്പെട്ട കളിപ്പാട്ടം എപ്പോഴെങ്കിലും നഷ്ടപ്പെട്ടിട്ടുണ്ടോ? എല്ലായിടത്തും തിരഞ്ഞില്ലേ! ഈശോയും അങ്ങനെയാണ്. ഒരാൾ നഷ്ടപ്പെടുമ്പോൾ കണ്ടെത്തുംവരെ അവിടുന്നു തിരയുന്നു.","നാം തെറ്റു ചെയ്യുമ്പോൾ ഈശോ നമ്മെ സ്നേഹിക്കുന്നതു നിർത്തുന്നില്ല. നമ്മെ തേടിവരുന്നു; നാം സോറി പറയുമ്പോൾ അവിടുന്ന് ഏറെ സന്തോഷിക്കുന്നു."]});
