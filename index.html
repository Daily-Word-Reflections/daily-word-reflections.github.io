put("2027-02-02","en",{title:"Mayaltho · The Entrance of our Lord into the Temple",readTitle:EN.rt,
 readings:[[EN.eg,"Luke 2:22–35","Simeon receives the Child"],[EN.ot,"Leviticus 12:1–8","The offering after childbirth"],[EN.ot,"Leviticus 22:17–25","Offerings without blemish"],[EN.ot,"2 Samuel 5:1–5","David anointed king"],[EN.ot,"Isaiah 11:1–9","The Spirit rests on the shoot of Jesse"],[EN.ac,"Acts 24:14–21","Paul's hope in the resurrection"],[EN.pa,"Hebrews 9:11–14","Christ entered the Holy Place with his own blood"],[EN.go,"Luke 2:22–24","Jesus presented to the Lord"]],
 alt:"Mayaltho, the Entrance of our Lord into the Temple (2 February), forty days after Yaldo.",
 verse:"Master, now you are dismissing your servant in peace, according to your word; for my eyes have seen your salvation.",cite:"Luke 2:29–30",
 theo:["Forty days after his birth, Mary and Joseph bring the Child to the Temple “to present him to the Lord”, as the Law required for every firstborn son, and they offer the sacrifice of the poor: “a pair of turtledoves or two young pigeons” (Leviticus 12:8). The Lord of the Temple enters his own house, carried in his mother's arms. Malachi had promised: “the Lord whom you seek will suddenly come to his temple” (Malachi 3:1).","There an old man, Simeon, “righteous and devout, looking forward to the consolation of Israel”, takes the Child in his arms and praises God: “Master, now you are dismissing your servant in peace, according to your word; for my eyes have seen your salvation, which you have prepared in the presence of all peoples, a light for revelation to the Gentiles and for glory to your people Israel.” A whole life of waiting is fulfilled in one embrace.","Then Simeon says to Mary: “This child is destined for the falling and the rising of many in Israel, and to be a sign that will be opposed… and a sword will pierce your own soul too.” Joy and sorrow meet at the Temple door. The Child presented today will offer himself on the Cross. Hebrews says: Christ “entered once for all into the Holy Place, not with the blood of goats and calves, but with his own blood, thus obtaining eternal redemption.”","Mayaltho comes just before the Great Fast. It teaches us to present our lives to God, as Mary and Joseph presented Jesus; to wait faithfully like Simeon and Anna; and to welcome Christ, the light of the nations, into our arms and our hearts."],
 conn:[["The Lord comes to his Temple.","Malachi 3:1 is fulfilled: the Lord enters his Temple, not in power but as a child."],["The offering of the poor.","Leviticus 12:8: the Holy Family offered two birds, the gift of those who could not afford a lamb. The true Lamb was in Mary's arms."],["Without blemish.","Leviticus 22:17–25 requires offerings without blemish; Christ is the spotless offering (1 Peter 1:19; Hebrews 9:14)."],["Light to the nations.","Simeon's song echoes Isaiah 42:6 and 49:6: the Servant is “a light to the nations”."]],
 altar:["Simeon held the Lord in his arms; in Holy Communion we receive him into our hearts. Simeon's song is a fitting prayer after Communion: “Now, Lord, let your servant go in peace; my eyes have seen your salvation.”"],
 outline:[["Opening","Forty days after Yaldo the Child comes to the Temple."],["Point 1 · Presented to God","Mary and Joseph give their Son to God. Do we offer our children and our lives?"],["Point 2 · Simeon and Anna","Faithful waiting in old age; the elderly as witnesses of hope."],["Point 3 · The sword","Joy and sorrow together: the Child is the sign that will be opposed."],["Point 4 · Ready for the Fast","Present yourself to God as Lent begins."],["Take-home line","“My eyes have seen your salvation.”"]],
 live:[["Offer your day","Begin each morning this week by presenting your day to God."],["Honour the elderly","Visit an elderly person and listen to their memories of faith, as Simeon and Anna would have shared theirs."],["Pray Simeon's song","Pray Luke 2:29–32 each night before sleep."]],
 fathers:[["St Sophronius of Jerusalem","“Let us all hasten to meet him… let us all carry lights… Simeon took him in his arms; let us too embrace him” (Sermon on the Hypapante)."],["St Ephrem the Syrian","He marvels that the Lord of the Temple was carried into the Temple, and that the old man held the Ancient of Days, who released him in peace (Hymns on the Nativity)."]],
 magis:[["Catechism 529","The presentation of Jesus in the Temple shows him to be the firstborn Son who belongs to the Lord; Simeon and Anna recognise in him the long-expected Messiah."],["Catechism 583","Jesus showed deep respect for the Temple, where he was presented forty days after his birth."],["Vita Consecrata (on 2 Feb)","The feast of the Presentation is kept in the universal Church as the World Day for Consecrated Life."]],
 saints:[["Around this day","3 Feb: Mar Simon and Morth Hanna (Simeon and Anna). 4 Feb: St John de Britto. 7 Feb: Kothine Sunday; the Great Fast begins."]],
 prayer:"Lord God, your Son was presented in the Temple and received by Simeon and Anna. Accept the offering of our lives; let us wait for you with their faith and welcome you with their joy, and let your Christ be the light of our homes and of all nations. Amen."},
 {quick:["The Lord enters his Temple in Mary's arms.","Simeon: “My eyes have seen your salvation.”","Joy and the sword: the Child will give himself for us."],action:"Present your day to God each morning this week.",question:"Have I presented my life, my family and my work to God?",
  special:"Mayaltho, the Entrance of our Lord into the Temple. World Day for Consecrated Life in the universal Church.",
  illus:["An illustration","Old Kerala grandmothers often say: “I only want to see my grandchildren baptised and receive Holy Communion, then the Lord can take me.” That is Simeon's prayer, prayed in every generation."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 2:25–32.",explain:"When Jesus was a baby, Mary and Joseph took him to the Temple. An old man called Simeon held him and was so happy, because he had waited all his life to see the Saviour.",intention:"We pray for our grandparents and all elderly people, and for sisters, brothers and priests who have given their lives to God.",ask:"Ask: “How can we offer our family to God this week?”"},
  catechism:[["CCC 529","The presentation in the Temple."],["CCC 2215–2220","Honour for elders."]],
  kidsaint:["Simeon and Anna","Two very old people who prayed in the Temple every day, waiting for the Saviour. God let them see baby Jesus before they died. Lesson: keep praying and waiting for God; he keeps his promises."],
  term:["Mayaltho (മായൽത്തോ)","Syriac for “entrance”: the feast of the Entrance of our Lord into the Temple, 2 February, forty days after Yaldo. In the West it is called the Presentation of the Lord."],
  termMore:["The Song of Simeon","Luke 2:29–32, “Now, Lord, let your servant go in peace”, is prayed in many Christian traditions at night prayer, at the end of the day."]},
 {homily:["Dear brothers and sisters, forty days after Yaldo, Mary and Joseph carry the Child to the Temple in Jerusalem. They come to present him to the Lord, as the Law of Moses required, and they offer two young pigeons, the offering of poor families. The Lord of the Temple enters his own house, carried in his mother's arms.","An old man is waiting there: Simeon, righteous and devout, who had been promised that he would not die before seeing the Messiah. He takes the Child in his arms and sings: “Now, Lord, you are letting your servant go in peace, for my eyes have seen your salvation.” A whole lifetime of prayer is rewarded in one moment. And the old prophetess Anna gives thanks and speaks of the Child to everyone.","But Simeon also says to Mary: “A sword will pierce your own soul too.” The Child presented today will one day offer himself on the Cross. Hebrews tells us that Christ entered the true Holy Place with his own blood, obtaining eternal redemption. The joy of Christmas already carries the shadow of the Cross.","On Sunday the Great Fast begins. Let us do what Mary and Joseph did: present ourselves to God, our families, our work, our whole life. Let us learn from Simeon and Anna to wait for the Lord faithfully. And every time we receive Holy Communion, let us say with Simeon: “My eyes have seen your salvation.” Amen."],
  kids:["Children, when Jesus was a tiny baby, Mary and Joseph took him to the big Temple to give him to God.","An old man called Simeon was there. He had waited all his life to see the Saviour. He held baby Jesus in his arms and said: “Now I am happy; I have seen God's salvation!”","When you receive Jesus or pray to him, you can be happy like Simeon. Let's say: “Jesus, you are my light!”"]});

put("2027-02-02","ml",{title:"മായൽത്തോ · നമ്മുടെ കർത്താവിന്റെ ദേവാലയപ്രവേശം",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 2:22–35","ശിമയോൻ ശിശുവിനെ സ്വീകരിക്കുന്നു"],[ML.ot,"ലേവ്യർ 12:1–8","പ്രസവാനന്തരമുള്ള കാഴ്ച"],[ML.ot,"ലേവ്യർ 22:17–25","ഊനമില്ലാത്ത കാഴ്ചകൾ"],[ML.ot,"2 സാമുവൽ 5:1–5","ദാവീദ് രാജാവായി അഭിഷേകം ചെയ്യപ്പെടുന്നു"],[ML.ot,"ഏശയ്യാ 11:1–9","ജസ്സെയുടെ മുളയുടെമേൽ ആത്മാവ്"],[ML.ac,"അപ്പ. പ്രവ. 24:14–21","ഉയിർപ്പിലുള്ള പൗലോസിന്റെ പ്രത്യാശ"],[ML.pa,"ഹെബ്രായർ 9:11–14","സ്വന്തം രക്തത്താൽ ക്രിസ്തു വിശുദ്ധസ്ഥലത്തു പ്രവേശിച്ചു"],[ML.go,"ലൂക്കാ 2:22–24","യേശു കർത്താവിനു സമർപ്പിക്കപ്പെടുന്നു"]],
 alt:"മായൽത്തോ, നമ്മുടെ കർത്താവിന്റെ ദേവാലയപ്രവേശം (ഫെബ്രുവരി 2), യൽദോയ്ക്കു നാൽപതു ദിവസത്തിനുശേഷം.",
 verse:"കർത്താവേ, അവിടുത്തെ വാഗ്ദാനമനുസരിച്ച് ഇപ്പോൾ ഈ ദാസനെ സമാധാനത്തിൽ വിട്ടയയ്ക്കണമേ! എന്തെന്നാൽ, സകല ജനതകൾക്കുംവേണ്ടി അങ്ങ് ഒരുക്കിയിരിക്കുന്ന രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു.",cite:"ലൂക്കാ 2:29–31",
 theo:["ജനനത്തിനു നാൽപതു ദിവസത്തിനുശേഷം, ഓരോ കടിഞ്ഞൂൽപുത്രനെയുംപറ്റി നിയമം ആവശ്യപ്പെട്ടിരുന്നതുപോലെ, “അവനെ കർത്താവിനു സമർപ്പിക്കാൻ” മറിയവും ജോസഫും ശിശുവിനെ ദേവാലയത്തിലേക്കു കൊണ്ടുവരുന്നു; ദരിദ്രരുടെ കാഴ്ചയായ “രണ്ടു ചെങ്ങാലികളെയോ, രണ്ടു പ്രാവിൻ കുഞ്ഞുങ്ങളെയോ” അർപ്പിക്കുന്നു (ലേവ്യ 12:8). ദേവാലയത്തിന്റെ കർത്താവ് അമ്മയുടെ കൈകളിൽ വഹിക്കപ്പെട്ട് തന്റെ സ്വന്തം ഭവനത്തിൽ പ്രവേശിക്കുന്നു. നിങ്ങൾ അന്വേഷിക്കുന്ന കർത്താവു പെട്ടെന്നു തന്റെ ആലയത്തിലേക്കു വരുമെന്നു മലാക്കി വാഗ്ദാനം ചെയ്തിരുന്നു (മലാ 3:1).","അവിടെ “നീതിമാനും ദൈവഭക്തനും ഇസ്രായേലിന്റെ ആശ്വാസം പ്രതീക്ഷിച്ചിരുന്നവനുമായ” ശിമയോൻ എന്ന വൃദ്ധൻ ശിശുവിനെ കൈയിലെടുത്ത് ദൈവത്തെ സ്തുതിക്കുന്നു: “കർത്താവേ, അവിടുത്തെ വാഗ്ദാനമനുസരിച്ച് ഇപ്പോൾ ഈ ദാസനെ സമാധാനത്തിൽ വിട്ടയയ്ക്കണമേ! എന്തെന്നാൽ, സകല ജനതകൾക്കുംവേണ്ടി അങ്ങ് ഒരുക്കിയിരിക്കുന്ന രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു. അത് വിജാതീയർക്കു വെളിപാടിന്റെ പ്രകാശവും അവിടുത്തെ ജനമായ ഇസ്രായേലിന്റെ മഹിമയും ആണ്.” ജീവിതകാലം മുഴുവനുമുള്ള കാത്തിരിപ്പ് ഒരു ആലിംഗനത്തിൽ നിറവേറുന്നു.","പിന്നെ ശിമയോൻ മറിയത്തോടു പറയുന്നു: “ഇവൻ ഇസ്രായേലിൽ പലരുടെയും വീഴ്ചയ്ക്കും ഉയർച്ചയ്ക്കും കാരണമാകും. ഇവൻ വിവാദവിഷയമായ അടയാളവുമായിരിക്കും… നിന്റെ ഹൃദയത്തിലൂടെ ഒരു വാൾ തുളച്ചുകയറുകയും ചെയ്യും.” ദേവാലയവാതിൽക്കൽ സന്തോഷവും ദുഃഖവും കണ്ടുമുട്ടുന്നു. ഇന്നു സമർപ്പിക്കപ്പെടുന്ന ശിശു കുരിശിൽ തന്നെത്തന്നെ അർപ്പിക്കും. ഹെബ്രായലേഖനം പറയുന്നു: ആടുകളുടെയും കാളക്കുട്ടികളുടെയും രക്തത്തോടെയല്ല, സ്വന്തം രക്തത്തോടെ ക്രിസ്തു ഒരിക്കലായി വിശുദ്ധസ്ഥലത്തു പ്രവേശിച്ച് നിത്യരക്ഷ നേടി (ഹെബ്രാ 9:12).","വലിയ നോമ്പിനു തൊട്ടുമുമ്പാണു മായൽത്തോ. യേശുവിനെ മറിയവും ജോസഫും സമർപ്പിച്ചതുപോലെ നമ്മുടെ ജീവിതം ദൈവത്തിനു സമർപ്പിക്കാനും, ശിമയോനെയും ഹന്നായെയുംപോലെ വിശ്വസ്തതയോടെ കാത്തിരിക്കാനും, ജനതകളുടെ പ്രകാശമായ ക്രിസ്തുവിനെ നമ്മുടെ കരങ്ങളിലേക്കും ഹൃദയങ്ങളിലേക്കും സ്വീകരിക്കാനും അതു നമ്മെ പഠിപ്പിക്കുന്നു."],
 conn:[["കർത്താവു തന്റെ ആലയത്തിലേക്കു വരുന്നു.","മലാക്കി 3:1 നിറവേറുന്നു: കർത്താവു തന്റെ ആലയത്തിൽ പ്രവേശിക്കുന്നു; ശക്തിയിലല്ല, ഒരു ശിശുവായി."],["ദരിദ്രരുടെ കാഴ്ച.","ലേവ്യർ 12:8: ഒരു ആട്ടിൻകുട്ടിയെ അർപ്പിക്കാൻ കഴിവില്ലാത്തവരുടെ കാഴ്ചയായ രണ്ടു പക്ഷികളെ തിരുക്കുടുംബം അർപ്പിച്ചു. യഥാർഥ കുഞ്ഞാടു മറിയത്തിന്റെ കൈകളിലായിരുന്നു."],["ഊനമില്ലാത്തത്.","ലേവ്യർ 22:17–25 ഊനമില്ലാത്ത കാഴ്ചകൾ ആവശ്യപ്പെടുന്നു; കളങ്കമറ്റ കാഴ്ചയാണു ക്രിസ്തു (1 പത്രോ 1:19; ഹെബ്രാ 9:14)."],["ജനതകൾക്കു പ്രകാശം.","ശിമയോന്റെ ഗീതം ഏശയ്യാ 42:6-ഉം 49:6-ഉം പ്രതിധ്വനിപ്പിക്കുന്നു: ദാസൻ “ജനതകൾക്കു പ്രകാശം” ആണ്."]],
 altar:["ശിമയോൻ കർത്താവിനെ കൈകളിൽ വഹിച്ചു; വിശുദ്ധ കുർബാനയിൽ നാം അവിടുത്തെ ഹൃദയങ്ങളിലേക്കു സ്വീകരിക്കുന്നു. കുർബാനസ്വീകരണത്തിനുശേഷമുള്ള ഉചിതമായ പ്രാർഥനയാണു ശിമയോന്റെ ഗീതം: “കർത്താവേ, ഈ ദാസനെ സമാധാനത്തിൽ വിട്ടയയ്ക്കണമേ; അങ്ങയുടെ രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു.”"],
 outline:[["ആരംഭം","യൽദോയ്ക്കു നാൽപതു ദിവസത്തിനുശേഷം ശിശു ദേവാലയത്തിലേക്കു വരുന്നു."],["ഒന്നാം ആശയം · ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ടു","മറിയവും ജോസഫും തങ്ങളുടെ പുത്രനെ ദൈവത്തിനു നൽകുന്നു. നമ്മുടെ മക്കളെയും ജീവിതങ്ങളെയും നാം സമർപ്പിക്കുന്നുണ്ടോ?"],["രണ്ടാം ആശയം · ശിമയോനും ഹന്നായും","വാർധക്യത്തിലെ വിശ്വസ്തമായ കാത്തിരിപ്പ്; പ്രത്യാശയുടെ സാക്ഷികളായ വൃദ്ധർ."],["മൂന്നാം ആശയം · വാൾ","സന്തോഷവും ദുഃഖവും ഒന്നിച്ച്: വിവാദവിഷയമായ അടയാളമാണു ശിശു."],["നാലാം ആശയം · നോമ്പിനായി ഒരുങ്ങി","നോമ്പ് ആരംഭിക്കുമ്പോൾ നിന്നെത്തന്നെ ദൈവത്തിനു സമർപ്പിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“അങ്ങയുടെ രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു.”"]],
 live:[["നിന്റെ ദിവസം സമർപ്പിക്കുക","ഈ ആഴ്ച ഓരോ പ്രഭാതവും നിന്റെ ദിവസം ദൈവത്തിനു സമർപ്പിച്ചുകൊണ്ട് ആരംഭിക്കുക."],["വൃദ്ധരെ ആദരിക്കുക","പ്രായമായ ഒരാളെ സന്ദർശിച്ച്, ശിമയോനും ഹന്നായും പങ്കുവച്ചിരിക്കാവുന്നതുപോലെ, അവരുടെ വിശ്വാസസ്മരണകൾ കേൾക്കുക."],["ശിമയോന്റെ ഗീതം പ്രാർഥിക്കുക","എല്ലാ രാത്രിയും ഉറങ്ങുംമുമ്പു ലൂക്കാ 2:29–32 പ്രാർഥിക്കുക."]],
 fathers:[["ജറുസലെമിലെ വിശുദ്ധ സോഫ്രോണിയൂസ്","അവിടുത്തെ എതിരേൽക്കാൻ നമുക്കെല്ലാവർക്കും തിടുക്കപ്പെടാം… നമുക്കെല്ലാവർക്കും ദീപങ്ങൾ വഹിക്കാം… ശിമയോൻ അവിടുത്തെ കൈകളിലെടുത്തു; നമുക്കും അവിടുത്തെ ആലിംഗനം ചെയ്യാം (കർത്താവിന്റെ എതിരേൽപിനെപ്പറ്റിയുള്ള പ്രസംഗം)."],["മാർ അപ്രേം","ദേവാലയത്തിന്റെ കർത്താവു ദേവാലയത്തിലേക്കു വഹിക്കപ്പെട്ടതിലും, പുരാതനനായവനെ വൃദ്ധൻ കൈകളിൽ വഹിച്ചതിലും, അവിടുന്ന് അവനെ സമാധാനത്തിൽ വിട്ടയച്ചതിലും അദ്ദേഹം വിസ്മയിക്കുന്നു (തിരുപ്പിറവിഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 529","ദേവാലയത്തിലെ സമർപ്പണം കർത്താവിനുള്ളവനായ കടിഞ്ഞൂൽപുത്രനായി യേശുവിനെ കാണിക്കുന്നു; ദീർഘകാലമായി പ്രതീക്ഷിച്ചിരുന്ന മിശിഹായെ ശിമയോനും ഹന്നായും അവിടുന്നിൽ തിരിച്ചറിയുന്നു."],["മതബോധനഗ്രന്ഥം 583","ജനനത്തിനു നാൽപതു ദിവസത്തിനുശേഷം താൻ സമർപ്പിക്കപ്പെട്ട ദേവാലയത്തോട് യേശു ആഴമായ ആദരവു കാണിച്ചു."],["സമർപ്പിതജീവിതദിനം","സാർവത്രികസഭയിൽ ഫെബ്രുവരി 2 സമർപ്പിതജീവിതത്തിനായുള്ള ലോകദിനമായി ആചരിക്കുന്നു."]],
 saints:[["ഈ ദിവസങ്ങളിൽ","ഫെബ്രുവരി 3: മാർ ശിമയോനും മോർത്ത് ഹന്നായും. ഫെബ്രുവരി 4: വിശുദ്ധ ജോൺ ഡി ബ്രിട്ടോ. ഫെബ്രുവരി 7: കോത്തിനേ ഞായർ; വലിയ നോമ്പ് ആരംഭിക്കുന്നു."]],
 prayer:"കർത്താവായ ദൈവമേ, അങ്ങയുടെ പുത്രൻ ദേവാലയത്തിൽ സമർപ്പിക്കപ്പെടുകയും ശിമയോനും ഹന്നായും അവിടുത്തെ സ്വീകരിക്കുകയും ചെയ്തു. ഞങ്ങളുടെ ജീവിതങ്ങളുടെ സമർപ്പണം സ്വീകരിക്കണമേ; അവരുടെ വിശ്വാസത്തോടെ അങ്ങേക്കായി കാത്തിരിക്കാനും അവരുടെ സന്തോഷത്തോടെ അങ്ങയെ സ്വീകരിക്കാനും ഞങ്ങൾക്ക് ഇടയാക്കണമേ; അങ്ങയുടെ മിശിഹാ ഞങ്ങളുടെ ഭവനങ്ങളുടെയും എല്ലാ ജനതകളുടെയും പ്രകാശമായിരിക്കട്ടെ. ആമേൻ."},
 {quick:["മറിയത്തിന്റെ കൈകളിൽ കർത്താവു തന്റെ ആലയത്തിൽ പ്രവേശിക്കുന്നു.","ശിമയോൻ: “അങ്ങയുടെ രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു.”","സന്തോഷവും വാളും: ശിശു നമുക്കുവേണ്ടി തന്നെത്തന്നെ നൽകും."],action:"ഈ ആഴ്ച ഓരോ പ്രഭാതത്തിലും നിന്റെ ദിവസം ദൈവത്തിനു സമർപ്പിക്കുക.",question:"എന്റെ ജീവിതവും കുടുംബവും അധ്വാനവും ഞാൻ ദൈവത്തിനു സമർപ്പിച്ചിട്ടുണ്ടോ?",
  special:"മായൽത്തോ, നമ്മുടെ കർത്താവിന്റെ ദേവാലയപ്രവേശം. സാർവത്രികസഭയിൽ സമർപ്പിതജീവിതദിനം.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പഴയ വല്യമ്മച്ചിമാർ പലപ്പോഴും പറയും: “കൊച്ചുമക്കളുടെ മാമ്മോദീസയും ആദ്യകുർബാനയും കണ്ടാൽ മതി; പിന്നെ കർത്താവ് എന്നെ വിളിച്ചോട്ടെ.” ഓരോ തലമുറയിലും പ്രാർഥിക്കപ്പെടുന്ന ശിമയോന്റെ പ്രാർഥനയാണത്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 2:25–32.",explain:"യേശു കുഞ്ഞായിരുന്നപ്പോൾ മറിയവും ജോസഫും അവിടുത്തെ ദേവാലയത്തിലേക്കു കൊണ്ടുപോയി. ശിമയോൻ എന്ന ഒരു വൃദ്ധൻ അവിടുത്തെ കൈയിലെടുത്ത് ഒത്തിരി സന്തോഷിച്ചു; കാരണം രക്ഷകനെ കാണാൻ ജീവിതകാലം മുഴുവൻ അവൻ കാത്തിരിക്കുകയായിരുന്നു.",intention:"നമ്മുടെ വല്യപ്പച്ചന്മാർക്കും വല്യമ്മച്ചിമാർക്കും എല്ലാ വൃദ്ധർക്കും, ജീവിതം ദൈവത്തിനു സമർപ്പിച്ച സിസ്റ്റർമാർക്കും ബ്രദേഴ്സിനും വൈദികർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമ്മുടെ കുടുംബത്തെ ദൈവത്തിന് എങ്ങനെ സമർപ്പിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 529","ദേവാലയത്തിലെ സമർപ്പണം."],["മതബോധനഗ്രന്ഥം 2215–2220","മുതിർന്നവരോടുള്ള ആദരവ്."]],
  kidsaint:["ശിമയോനും ഹന്നായും","രക്ഷകനായി കാത്തിരുന്ന് എല്ലാ ദിവസവും ദേവാലയത്തിൽ പ്രാർഥിച്ചിരുന്ന വളരെ പ്രായമായ രണ്ടുപേർ. മരിക്കുംമുമ്പു കുഞ്ഞായ യേശുവിനെ കാണാൻ ദൈവം അവരെ അനുവദിച്ചു. പാഠം: ദൈവത്തിനായി പ്രാർഥിച്ചു കാത്തിരിക്കുക; അവിടുന്നു വാഗ്ദാനങ്ങൾ പാലിക്കുന്നു."],
  term:["മായൽത്തോ","“പ്രവേശം” എന്നതിന്റെ സുറിയാനിപദം: യൽദോയ്ക്കു നാൽപതു ദിവസത്തിനുശേഷം, ഫെബ്രുവരി 2-നുള്ള നമ്മുടെ കർത്താവിന്റെ ദേവാലയപ്രവേശത്തിരുനാൾ. പാശ്ചാത്യസഭയിൽ ഇതു കർത്താവിന്റെ സമർപ്പണം എന്നറിയപ്പെടുന്നു."],
  termMore:["ശിമയോന്റെ ഗീതം","“കർത്താവേ, ഈ ദാസനെ സമാധാനത്തിൽ വിട്ടയയ്ക്കണമേ” (ലൂക്കാ 2:29–32) എന്ന ഗീതം പല ക്രൈസ്തവപാരമ്പര്യങ്ങളിലും ദിവസാവസാനത്തിലെ രാത്രിപ്രാർഥനയിൽ ചൊല്ലുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, യൽദോയ്ക്കു നാൽപതു ദിവസത്തിനുശേഷം മറിയവും ജോസഫും ശിശുവിനെ ജറുസലെം ദേവാലയത്തിലേക്കു വഹിച്ചുകൊണ്ടുപോകുന്നു. മോശയുടെ നിയമം ആവശ്യപ്പെട്ടിരുന്നതുപോലെ അവിടുത്തെ കർത്താവിനു സമർപ്പിക്കാനാണ് അവർ വരുന്നത്; ദരിദ്രകുടുംബങ്ങളുടെ കാഴ്ചയായ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെ അവർ അർപ്പിക്കുന്നു. ദേവാലയത്തിന്റെ കർത്താവ് അമ്മയുടെ കൈകളിൽ വഹിക്കപ്പെട്ടു തന്റെ സ്വന്തം ഭവനത്തിൽ പ്രവേശിക്കുന്നു.","ഒരു വൃദ്ധൻ അവിടെ കാത്തിരിക്കുന്നുണ്ട്: മിശിഹായെ കാണുംമുമ്പു മരിക്കുകയില്ലെന്നു വാഗ്ദാനം ലഭിച്ചിരുന്ന, നീതിമാനും ദൈവഭക്തനുമായ ശിമയോൻ. അവൻ ശിശുവിനെ കൈയിലെടുത്തു പാടുന്നു: “കർത്താവേ, അവിടുത്തെ വാഗ്ദാനമനുസരിച്ച് ഇപ്പോൾ ഈ ദാസനെ സമാധാനത്തിൽ വിട്ടയയ്ക്കണമേ! എന്തെന്നാൽ, അങ്ങ് ഒരുക്കിയിരിക്കുന്ന രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു.” ജീവിതകാലം മുഴുവനുമുള്ള പ്രാർഥനയ്ക്ക് ഒരു നിമിഷത്തിൽ പ്രതിഫലം ലഭിക്കുന്നു. വൃദ്ധയായ ഹന്നാ പ്രവാചികയും ദൈവത്തിനു നന്ദി പറഞ്ഞ് എല്ലാവരോടും ശിശുവിനെപ്പറ്റി സംസാരിക്കുന്നു.","പക്ഷേ ശിമയോൻ മറിയത്തോടും പറയുന്നു: “നിന്റെ ഹൃദയത്തിലൂടെ ഒരു വാൾ തുളച്ചുകയറുകയും ചെയ്യും.” ഇന്നു സമർപ്പിക്കപ്പെടുന്ന ശിശു ഒരുനാൾ കുരിശിൽ തന്നെത്തന്നെ അർപ്പിക്കും. സ്വന്തം രക്തത്തോടെ ക്രിസ്തു യഥാർഥ വിശുദ്ധസ്ഥലത്തു പ്രവേശിച്ചു നിത്യരക്ഷ നേടിയെന്നു ഹെബ്രായലേഖനം പറയുന്നു. ക്രിസ്മസിന്റെ സന്തോഷം ഇപ്പോൾത്തന്നെ കുരിശിന്റെ നിഴൽ വഹിക്കുന്നു.","ഞായറാഴ്ച വലിയ നോമ്പ് ആരംഭിക്കുന്നു. മറിയവും ജോസഫും ചെയ്തതു നമുക്കും ചെയ്യാം: നമ്മെത്തന്നെ, നമ്മുടെ കുടുംബങ്ങളെ, അധ്വാനത്തെ, ജീവിതം മുഴുവനെയും ദൈവത്തിനു സമർപ്പിക്കാം. വിശ്വസ്തതയോടെ കർത്താവിനായി കാത്തിരിക്കാൻ ശിമയോനിൽനിന്നും ഹന്നായിൽനിന്നും പഠിക്കാം. വിശുദ്ധ കുർബാന സ്വീകരിക്കുമ്പോഴെല്ലാം ശിമയോനോടൊപ്പം നമുക്കു പറയാം: “അങ്ങയുടെ രക്ഷ എന്റെ കണ്ണുകൾ കണ്ടുകഴിഞ്ഞു.” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശു ഒരു കൊച്ചുകുഞ്ഞായിരുന്നപ്പോൾ മറിയവും ജോസഫും അവിടുത്തെ ദൈവത്തിനു നൽകാൻ വലിയ ദേവാലയത്തിലേക്കു കൊണ്ടുപോയി.","ശിമയോൻ എന്ന ഒരു വൃദ്ധൻ അവിടെയുണ്ടായിരുന്നു. രക്ഷകനെ കാണാൻ ജീവിതകാലം മുഴുവൻ അവൻ കാത്തിരിക്കുകയായിരുന്നു. കുഞ്ഞായ യേശുവിനെ കൈയിലെടുത്ത് അവൻ പറഞ്ഞു: “ഇപ്പോൾ എനിക്കു സന്തോഷമായി; ദൈവത്തിന്റെ രക്ഷ ഞാൻ കണ്ടു!”","യേശുവിനെ സ്വീകരിക്കുമ്പോഴോ അവിടുത്തോടു പ്രാർഥിക്കുമ്പോഴോ നിനക്കും ശിമയോനെപ്പോലെ സന്തോഷിക്കാം. നമുക്കു പറയാം: “യേശുവേ, അങ്ങാണ് എന്റെ പ്രകാശം!”"]});

put("2027-02-07","en",{title:"Kothine Sunday · First Sunday of the Great Fast",readTitle:EN.rt,
 readings:[[EN.eg,"John 10:22–30","My sheep hear my voice"],[EN.ot,"Genesis 9:12–17","The rainbow of the covenant"],[EN.ot,"Exodus 20:7–22","The commandments at Sinai"],[EN.ot,"Joel 2:12–20","Return to me with all your heart"],[EN.ot,"Isaiah 58:6–14","Is not this the fast that I choose?"],[EN.ac,"Acts 11:19–26","In Antioch they were first called Christians"],[EN.pa,"Colossians 3:5–17","Put on love"],[EN.go,"John 2:1–11","The wedding at Cana"]],
 alt:"Kothine Sunday, the miracle at Cana: first Sunday of the Great Fast. The special prayers of the Fast begin this evening; Shubkono, the service of reconciliation, is on Monday 8 February.",
 verse:"Jesus did this, the first of his signs, in Cana of Galilee, and revealed his glory; and his disciples believed in him.",cite:"John 2:11",
 theo:["The Malankara Church begins the Great Fast with a wedding. On Kothine Sunday we read the miracle at Cana, where Jesus changed water into wine. It may seem strange to start a season of fasting at a feast, but it is deeply wise. The Fast is not about sadness; it is about transformation. The water of our ordinary, tasteless lives can become the wine of God's joy, if we do what Mary says: “Do whatever he tells you.”","The prophets tell us what kind of fast God wants. Joel: “Return to me with all your heart, with fasting, with weeping, and with mourning; rend your hearts and not your clothing.” Isaiah: “Is not this the fast that I choose: to loose the bonds of injustice… to share your bread with the hungry, and bring the homeless poor into your house?” Fasting from food is meant to open our hearts to God and our hands to the poor.","St Paul shows the inner work of Lent: “Put to death whatever in you is earthly… clothe yourselves with compassion, kindness, humility, meekness, and patience… Above all, clothe yourselves with love.” The Fast is a change of clothes: putting off the old self and putting on Christ. Acts reminds us that it was in Antioch, the mother Church of our Syriac tradition, that the disciples were first called Christians.","The jars at Cana were filled “up to the brim” with water at Jesus' word. In these fifty days, let us fill our jars: with prayer, fasting, almsgiving and the Word of God. At the end of the Fast, at Qyomtho, Christ will give us the best wine, kept until now: the joy of his Resurrection."],
 conn:[["Water into wine.","At Cana water for purification becomes the wine of the wedding feast; the old covenant is fulfilled in the new (John 2:6–10)."],["The rainbow.","Genesis 9:13: God's covenant after the flood. Lent is a time to return to the covenant God never breaks."],["The commandments.","Exodus 20: Lent is a time to examine our lives by the commandments and make a good Confession."],["The true fast.","Isaiah 58:6–7 and Joel 2:12–13: fasting with the heart and with the hands."]],
 altar:["At Cana Jesus changed water into wine; at the altar he changes wine into his own Blood. Every Holy Qurbono of the Fast is a small Cana, preparing us for the great feast of the Resurrection."],
 outline:[["Opening","Why does our Lent begin at a wedding?"],["Point 1 · Transformation, not sadness","Water into wine: God changes ordinary lives."],["Point 2 · “Do whatever he tells you”","Mary's advice for the whole Fast."],["Point 3 · The fast God chooses","Joel 2 and Isaiah 58: return with the heart, share with the poor."],["Point 4 · Fill the jars","Prayer, fasting, almsgiving, Scripture; Shubkono and Confession."],["Take-home line","“Do whatever he tells you.”"]],
 live:[["Make a Lenten plan","Decide as a family: one food to fast from, one daily prayer, one work of charity."],["Come to Shubkono","Take part in the service of reconciliation on Monday and ask forgiveness of those you have hurt."],["Share your bread (Isaiah 58:7)","Put aside the money saved by fasting for the poor."]],
 fathers:[["St Ephrem the Syrian","He sings of the Lord who at Cana changed water into wine, and asks him to change our hearts in the same way during the Fast (Hymns on the Fast and on Virginity)."],["St John Chrysostom","“Do you fast? Give me proof of it by your works… If you see a poor man, take pity on him; if you see an enemy, be reconciled with him” (Homilies on the Statues 3)."]],
 magis:[["Catechism 1434–1439","Interior penance is expressed in fasting, prayer and almsgiving; Lent is a privileged time for it."],["Catechism 2043","The precept of fasting and abstinence prepares us for the liturgical feasts."],["Catechism 1613","Jesus' presence at Cana confirms the goodness of marriage; the Church sees in it the sign of the new covenant."]],
 saints:[["This week (fixed dates)","8 Feb (Monday): Shubkono; the Great Fast begins. 10 Feb: anniversary of the establishment of the Syro-Malankara Major Archiepiscopate (2005). 11 Feb: Our Lady of Lourdes, World Day of the Sick."]],
 prayer:"Lord Jesus, at Cana you changed water into wine and revealed your glory. As we begin the Great Fast, change our hearts: teach us to do whatever you tell us, to fast with love, to share with the poor, and to reach with joy the feast of your Resurrection. Amen."},
 {quick:["Our Lent begins at a wedding: the Fast is transformation, not sadness.","Mary's advice for Lent: “Do whatever he tells you.”","The fast God chooses: return with the heart, share with the poor."],action:"Make a family Lenten plan: one fast, one prayer, one work of charity.",question:"What water in my life do I want Jesus to change into wine this Lent?",
  special:"Kothine Sunday, first Sunday of the Great Fast. The special prayers of Lent begin this evening; remind the faithful about fasting and abstinence and about Shubkono on Monday.",
  illus:["An illustration","In many Malankara homes the meat pots are scrubbed clean on the evening before the Fast, and the family begins fifty days of simpler food. The clean pots are like the jars at Cana: emptied and ready to be filled with something better."],kids:"",diaspora:"",
  family:{read:"Read together: John 2:1–11.",explain:"At a wedding in Cana the wine ran out. Mary told the servants: “Do whatever Jesus tells you.” Jesus changed water into the best wine! In Lent Jesus wants to change our hearts too.",intention:"We pray for a holy Lent for our family, and for people who have no food.",ask:"Ask: “What will each of us give up this Lent, and what good thing will we do?”"},
  catechism:[["CCC 1434–1439","Penance in the Christian life."],["CCC 2043","Fasting and abstinence."]],
  kidsaint:["St Barnabas","His name means “son of encouragement”. In Antioch he encouraged the new Christians, and brought Paul to teach with him; there the disciples were first called Christians. Lesson: encourage others to be good this Lent."],
  term:["Kothine Sunday","Kothine refers to the wedding at Cana (John 2:1–11). The Malankara Church begins the Great Fast with this Gospel: the Fast is a time of transformation, from water to wine."],
  termMore:["Shubkono","The service of forgiveness (reconciliation) on the first Monday of the Fast. Priest and people ask forgiveness of one another and of God before beginning the fifty days."]},
 {homily:["Dear brothers and sisters, today our Church begins the Great Fast, and it begins it at a wedding. On Kothine Sunday we read how Jesus, at Cana, changed water into wine. Why begin fifty days of fasting with a wedding feast? Because the Fast is not a season of gloom. It is a season of transformation.","At Cana the wine ran out. Mary noticed and said to the servants: “Do whatever he tells you.” That is the best advice for Lent. The servants did a simple thing: they filled the jars with water, up to the brim. And Jesus changed that water into the best wine. In this Fast, let us fill our jars: with prayer, with fasting, with the Word of God, with works of mercy. And let Jesus change the water of our lives into wine.","The prophets tell us what true fasting is. Joel says: “Return to me with all your heart; rend your hearts and not your clothing.” Isaiah says: “Is not this the fast that I choose: to share your bread with the hungry, and bring the homeless poor into your house?” Fasting from food is not a diet; it makes room in our hearts for God and in our hands for the poor.","Tonight the special prayers of the Fast begin, and tomorrow we celebrate Shubkono, when we ask forgiveness of one another. Let each family make a simple plan: one fast, one prayer, one act of charity. And at the end of these fifty days, at Qyomtho, Jesus will give us the best wine, kept until now: the joy of his Resurrection. Amen."],
  kids:["Children, today Lent begins! And our Gospel is about a wedding party. At the party the wine ran out. Mary said: “Do whatever Jesus tells you.”","The servants filled six big jars with water, and Jesus changed it into wonderful wine! In Lent Jesus wants to change us too: to make us kinder, more patient, more prayerful.","What can you give up this Lent? Sweets? Television? And what good thing can you do? Let's say: “Jesus, change my heart!”"]});

put("2027-02-07","ml",{title:"കോത്തിനേ ഞായർ · വലിയ നോമ്പിലെ ഒന്നാം ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"യോഹന്നാൻ 10:22–30","എന്റെ ആടുകൾ എന്റെ സ്വരം ശ്രവിക്കുന്നു"],[ML.ot,"ഉൽപത്തി 9:12–17","ഉടമ്പടിയുടെ മഴവില്ല്"],[ML.ot,"പുറപ്പാട് 20:7–22","സീനായിലെ കല്പനകൾ"],[ML.ot,"ജോയേൽ 2:12–20","പൂർണഹൃദയത്തോടെ എന്റെ അടുക്കലേക്കു തിരിച്ചുവരുവിൻ"],[ML.ot,"ഏശയ്യാ 58:6–14","ഞാൻ ആഗ്രഹിക്കുന്ന ഉപവാസം"],[ML.ac,"അപ്പ. പ്രവ. 11:19–26","അന്ത്യോക്യായിൽ ശിഷ്യന്മാർ ആദ്യമായി ക്രിസ്ത്യാനികൾ എന്നു വിളിക്കപ്പെട്ടു"],[ML.pa,"കൊളോസോസ് 3:5–17","സ്നേഹം ധരിക്കുവിൻ"],[ML.go,"യോഹന്നാൻ 2:1–11","കാനായിലെ വിവാഹവിരുന്ന്"]],
 alt:"കോത്തിനേ ഞായർ, കാനായിലെ അദ്ഭുതം: വലിയ നോമ്പിലെ ഒന്നാം ഞായർ. നോമ്പിന്റെ പ്രത്യേക പ്രാർഥനകൾ ഇന്നു സന്ധ്യയ്ക്ക് ആരംഭിക്കുന്നു; അനുരഞ്ജനശുശ്രൂഷയായ ശുബ്‌ക്കോനോ ഫെബ്രുവരി 8 തിങ്കളാഴ്ച.",
 verse:"യേശു തന്റെ മഹത്വം വെളിപ്പെടുത്തുന്നതിനു പ്രവർത്തിച്ച അടയാളങ്ങളുടെ ആരംഭമാണ്, ഗലീലിയിലെ കാനായിൽ ചെയ്ത ഈ അദ്ഭുതം. അവന്റെ ശിഷ്യന്മാർ അവനിൽ വിശ്വസിച്ചു.",cite:"യോഹന്നാൻ 2:11",
 theo:["മലങ്കരസഭ വലിയ നോമ്പ് ആരംഭിക്കുന്നത് ഒരു വിവാഹത്തോടെയാണ്. കോത്തിനേ ഞായറാഴ്ച, യേശു വെള്ളം വീഞ്ഞാക്കിയ കാനായിലെ അദ്ഭുതം നാം വായിക്കുന്നു. ഉപവാസത്തിന്റെ ഒരു കാലം ഒരു വിരുന്നോടെ ആരംഭിക്കുന്നതു വിചിത്രമായി തോന്നാം; പക്ഷേ അത് ആഴമേറിയ ജ്ഞാനമാണ്. നോമ്പു ദുഃഖത്തെപ്പറ്റിയല്ല, രൂപാന്തരത്തെപ്പറ്റിയാണ്. മറിയം പറയുന്നതു നാം ചെയ്താൽ, നമ്മുടെ സാധാരണവും രുചിയില്ലാത്തതുമായ ജീവിതങ്ങളുടെ വെള്ളം ദൈവികസന്തോഷത്തിന്റെ വീഞ്ഞാകാം: “അവൻ നിങ്ങളോടു പറയുന്നതു ചെയ്യുവിൻ.”","ദൈവം ആഗ്രഹിക്കുന്ന ഉപവാസം ഏതെന്നു പ്രവാചകന്മാർ പറയുന്നു. ജോയേൽ: “ഇപ്പോഴെങ്കിലും ഉപവാസത്തോടും വിലാപത്തോടും നെടുവീർപ്പോടുംകൂടെ നിങ്ങൾ പൂർണഹൃദയത്തോടെ എന്റെ അടുക്കലേക്കു തിരിച്ചുവരുവിൻ. നിങ്ങളുടെ ഹൃദയമാണ് വസ്ത്രമല്ല കീറേണ്ടത്.” ഏശയ്യാ: “ദുഷ്ടതയുടെ കെട്ടുകൾ പൊട്ടിക്കുകയും… വിശക്കുന്നവനുമായി ആഹാരം പങ്കുവയ്ക്കുകയും ഭവനരഹിതനെ വീട്ടിൽ സ്വീകരിക്കുകയും… ചെയ്യുന്നതല്ലേ ഞാൻ ആഗ്രഹിക്കുന്ന ഉപവാസം?” ഭക്ഷണത്തിൽനിന്നുള്ള ഉപവാസം നമ്മുടെ ഹൃദയങ്ങളെ ദൈവത്തിനും കരങ്ങളെ ദരിദ്രർക്കുമായി തുറക്കാനുള്ളതാണ്.","നോമ്പിന്റെ ആന്തരികപ്രവൃത്തി വിശുദ്ധ പൗലോസ് കാണിക്കുന്നു: നിങ്ങളിലുള്ള ഭൗമികമായവയെ നശിപ്പിക്കുവിൻ… കരുണ, ദയ, വിനയം, സൗമ്യത, ക്ഷമ എന്നിവ ധരിക്കുവിൻ… എല്ലാറ്റിനുമുപരി സ്നേഹം ധരിക്കുവിൻ (കൊളോ 3:5, 12, 14). നോമ്പ് ഒരു വസ്ത്രംമാറലാണ്: പഴയ മനുഷ്യനെ ഉപേക്ഷിച്ചു ക്രിസ്തുവിനെ ധരിക്കൽ. നമ്മുടെ സുറിയാനി പാരമ്പര്യത്തിന്റെ മാതൃസഭയായ അന്ത്യോക്യായിൽവച്ചാണ് “ശിഷ്യന്മാർ ആദ്യമായി ക്രിസ്ത്യാനികൾ എന്ന് വിളിക്കപ്പെട്ടത്” എന്ന് അപ്പസ്തോലപ്രവർത്തനങ്ങൾ ഓർമിപ്പിക്കുന്നു.","യേശുവിന്റെ വാക്കനുസരിച്ചു കാനായിലെ ഭരണികൾ വക്കോളം വെള്ളം നിറച്ചു. ഈ അമ്പതു ദിവസങ്ങളിൽ നമുക്കും നമ്മുടെ ഭരണികൾ നിറയ്ക്കാം: പ്രാർഥനയാലും ഉപവാസത്താലും ദാനധർമത്താലും ദൈവവചനത്താലും. നോമ്പിന്റെ അവസാനം, ക്യംതോയിൽ, ഇതുവരെ സൂക്ഷിച്ചുവച്ച ഏറ്റവും നല്ല വീഞ്ഞ് ക്രിസ്തു നമുക്കു നൽകും: അവിടുത്തെ ഉയിർപ്പിന്റെ സന്തോഷം."],
 conn:[["വെള്ളം വീഞ്ഞാകുന്നു.","കാനായിൽ ശുദ്ധീകരണത്തിനുള്ള വെള്ളം വിവാഹവിരുന്നിന്റെ വീഞ്ഞാകുന്നു; പഴയ ഉടമ്പടി പുതിയതിൽ നിറവേറുന്നു (യോഹ 2:6–10)."],["മഴവില്ല്.","“ഭൂമിയുമായുള്ള ഉടമ്പടിയുടെ അടയാളമായി മേഘങ്ങളിൽ എന്റെ വില്ലു ഞാൻ സ്ഥാപിക്കുന്നു” (ഉൽപ 9:13). ദൈവം ഒരിക്കലും ലംഘിക്കാത്ത ഉടമ്പടിയിലേക്കു മടങ്ങാനുള്ള സമയമാണു നോമ്പ്."],["കല്പനകൾ.","പുറപ്പാട് 20: കല്പനകളുടെ വെളിച്ചത്തിൽ ജീവിതം പരിശോധിച്ചു നല്ല ഒരു കുമ്പസാരം നടത്താനുള്ള സമയമാണു നോമ്പ്."],["യഥാർഥ ഉപവാസം.","ഏശയ്യാ 58:6–7-ഉം ജോയേൽ 2:12–13-ഉം: ഹൃദയംകൊണ്ടും കരങ്ങൾകൊണ്ടുമുള്ള ഉപവാസം."]],
 altar:["കാനായിൽ യേശു വെള്ളം വീഞ്ഞാക്കി; ബലിപീഠത്തിൽ അവിടുന്നു വീഞ്ഞിനെ തന്റെ സ്വന്തം രക്തമാക്കുന്നു. നോമ്പിലെ ഓരോ വിശുദ്ധ കുർബാനയും ഉയിർപ്പിന്റെ മഹാവിരുന്നിനായി നമ്മെ ഒരുക്കുന്ന ഒരു ചെറിയ കാനായാണ്."],
 outline:[["ആരംഭം","നമ്മുടെ നോമ്പ് ഒരു വിവാഹത്തിൽ ആരംഭിക്കുന്നത് എന്തുകൊണ്ട്?"],["ഒന്നാം ആശയം · ദുഃഖമല്ല, രൂപാന്തരം","വെള്ളം വീഞ്ഞാകുന്നു: ദൈവം സാധാരണ ജീവിതങ്ങളെ മാറ്റുന്നു."],["രണ്ടാം ആശയം · “അവൻ നിങ്ങളോടു പറയുന്നതു ചെയ്യുവിൻ”","നോമ്പു മുഴുവനുമുള്ള മറിയത്തിന്റെ ഉപദേശം."],["മൂന്നാം ആശയം · ദൈവം ആഗ്രഹിക്കുന്ന ഉപവാസം","ജോയേൽ 2-ഉം ഏശയ്യാ 58-ഉം: ഹൃദയത്തോടെ മടങ്ങുക, ദരിദ്രരുമായി പങ്കുവയ്ക്കുക."],["നാലാം ആശയം · ഭരണികൾ നിറയ്ക്കുക","പ്രാർഥന, ഉപവാസം, ദാനധർമം, വചനം; ശുബ്‌ക്കോനോയും കുമ്പസാരവും."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“അവൻ നിങ്ങളോടു പറയുന്നതു ചെയ്യുവിൻ.”"]],
 live:[["ഒരു നോമ്പുപദ്ധതി തയ്യാറാക്കുക","കുടുംബമൊന്നിച്ചു തീരുമാനിക്കുക: ഉപേക്ഷിക്കാൻ ഒരു ഭക്ഷണം, ഒരു അനുദിനപ്രാർഥന, ഒരു ഉപവിപ്രവൃത്തി."],["ശുബ്‌ക്കോനോയിൽ പങ്കെടുക്കുക","തിങ്കളാഴ്ചത്തെ അനുരഞ്ജനശുശ്രൂഷയിൽ പങ്കെടുത്ത്, നീ മുറിവേൽപിച്ചവരോടു ക്ഷമ ചോദിക്കുക."],["നിന്റെ അപ്പം പങ്കുവയ്ക്കുക (ഏശ 58:7)","ഉപവാസത്തിലൂടെ മിച്ചംവരുന്ന പണം ദരിദ്രർക്കായി മാറ്റിവയ്ക്കുക."]],
 fathers:[["മാർ അപ്രേം","കാനായിൽ വെള്ളം വീഞ്ഞാക്കിയ കർത്താവിനെപ്പറ്റി അദ്ദേഹം പാടുന്നു; നോമ്പിൽ അതുപോലെ നമ്മുടെ ഹൃദയങ്ങളെ മാറ്റാൻ അവിടുത്തോട് അപേക്ഷിക്കുന്നു (ഉപവാസഗീതങ്ങളും കന്യാത്വഗീതങ്ങളും)."],["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","നീ ഉപവസിക്കുന്നുവോ? നിന്റെ പ്രവൃത്തികളാൽ അതിനു തെളിവു തരുക… ഒരു ദരിദ്രനെ കണ്ടാൽ അവനോടു കരുണ കാണിക്കുക; ഒരു ശത്രുവിനെ കണ്ടാൽ അവനുമായി രമ്യതപ്പെടുക (പ്രതിമകളെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 3)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1434–1439","ആന്തരികപ്രായശ്ചിത്തം ഉപവാസത്തിലും പ്രാർഥനയിലും ദാനധർമത്തിലും പ്രകടമാകുന്നു; അതിനുള്ള സവിശേഷകാലമാണു നോമ്പ്."],["മതബോധനഗ്രന്ഥം 2043","ഉപവാസത്തിന്റെയും വർജനത്തിന്റെയും കല്പന ആരാധനക്രമത്തിരുനാളുകൾക്കായി നമ്മെ ഒരുക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1613","കാനായിലെ യേശുവിന്റെ സാന്നിധ്യം വിവാഹത്തിന്റെ നന്മ ഉറപ്പിക്കുന്നു; പുതിയ ഉടമ്പടിയുടെ അടയാളം സഭ അതിൽ കാണുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഫെബ്രുവരി 8 (തിങ്കൾ): ശുബ്‌ക്കോനോ; വലിയ നോമ്പ് ആരംഭം. ഫെബ്രുവരി 10: സീറോ മലങ്കര മേജർ ആർക്കിഎപ്പിസ്കോപ്പേറ്റ് സ്ഥാപനവാർഷികം (2005). ഫെബ്രുവരി 11: ലൂർദ്ദുമാതാവ്, ലോകരോഗീദിനം."]],
 prayer:"കർത്താവായ യേശുവേ, കാനായിൽ അങ്ങു വെള്ളം വീഞ്ഞാക്കി അങ്ങയുടെ മഹത്വം വെളിപ്പെടുത്തി. വലിയ നോമ്പ് ആരംഭിക്കുമ്പോൾ ഞങ്ങളുടെ ഹൃദയങ്ങളെ മാറ്റണമേ: അങ്ങു പറയുന്നതു ചെയ്യാനും സ്നേഹത്തോടെ ഉപവസിക്കാനും ദരിദ്രരുമായി പങ്കുവയ്ക്കാനും, സന്തോഷത്തോടെ അങ്ങയുടെ ഉയിർപ്പിന്റെ വിരുന്നിൽ എത്തിച്ചേരാനും ഞങ്ങളെ പഠിപ്പിക്കണമേ. ആമേൻ."},
 {quick:["നമ്മുടെ നോമ്പ് ഒരു വിവാഹത്തിൽ ആരംഭിക്കുന്നു: നോമ്പു ദുഃഖമല്ല, രൂപാന്തരമാണ്.","നോമ്പിനായുള്ള മറിയത്തിന്റെ ഉപദേശം: “അവൻ നിങ്ങളോടു പറയുന്നതു ചെയ്യുവിൻ.”","ദൈവം ആഗ്രഹിക്കുന്ന ഉപവാസം: ഹൃദയത്തോടെ മടങ്ങുക, ദരിദ്രരുമായി പങ്കുവയ്ക്കുക."],action:"കുടുംബത്തിനായി ഒരു നോമ്പുപദ്ധതി തയ്യാറാക്കുക: ഒരു ഉപവാസം, ഒരു പ്രാർഥന, ഒരു ഉപവിപ്രവൃത്തി.",question:"ഈ നോമ്പിൽ എന്റെ ജീവിതത്തിലെ ഏതു വെള്ളമാണ് യേശു വീഞ്ഞാക്കാൻ ഞാൻ ആഗ്രഹിക്കുന്നത്?",
  special:"കോത്തിനേ ഞായർ, വലിയ നോമ്പിലെ ഒന്നാം ഞായർ. നോമ്പിന്റെ പ്രത്യേക പ്രാർഥനകൾ ഇന്നു സന്ധ്യയ്ക്ക് ആരംഭിക്കുന്നു; ഉപവാസത്തെയും വർജനത്തെയും തിങ്കളാഴ്ചത്തെ ശുബ്‌ക്കോനോയെയുംപറ്റി വിശ്വാസികളെ ഓർമിപ്പിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","പല മലങ്കരഭവനങ്ങളിലും നോമ്പിനു തലേന്നു സന്ധ്യയ്ക്ക് ഇറച്ചിപ്പാത്രങ്ങൾ കഴുകി വൃത്തിയാക്കുന്നു; കുടുംബം ലളിതഭക്ഷണത്തിന്റെ അമ്പതു ദിവസങ്ങൾ ആരംഭിക്കുന്നു. വൃത്തിയാക്കിയ പാത്രങ്ങൾ കാനായിലെ ഭരണികൾപോലെയാണ്: ഒഴിഞ്ഞ്, മെച്ചപ്പെട്ട ഒന്നുകൊണ്ടു നിറയാൻ ഒരുങ്ങി."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: യോഹന്നാൻ 2:1–11.",explain:"കാനായിലെ ഒരു കല്യാണത്തിനു വീഞ്ഞു തീർന്നുപോയി. മറിയം പരിചാരകരോടു പറഞ്ഞു: “യേശു പറയുന്നതു ചെയ്യുവിൻ.” യേശു വെള്ളം ഏറ്റവും നല്ല വീഞ്ഞാക്കി! നോമ്പുകാലത്തു നമ്മുടെ ഹൃദയങ്ങളെയും മാറ്റാൻ യേശു ആഗ്രഹിക്കുന്നു.",intention:"നമ്മുടെ കുടുംബത്തിനു വിശുദ്ധമായ ഒരു നോമ്പിനും ഭക്ഷണമില്ലാത്തവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ നോമ്പിൽ നമ്മളോരോരുത്തരും എന്ത് ഉപേക്ഷിക്കും? എന്തു നല്ല കാര്യം ചെയ്യും?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1434–1439","ക്രൈസ്തവജീവിതത്തിലെ പ്രായശ്ചിത്തം."],["മതബോധനഗ്രന്ഥം 2043","ഉപവാസവും വർജനവും."]],
  kidsaint:["വിശുദ്ധ ബർണബാസ്","“ആശ്വാസപുത്രൻ” എന്നാണ് ആ പേരിന്റെ അർഥം. അന്ത്യോക്യായിൽ പുതിയ ക്രൈസ്തവരെ അദ്ദേഹം പ്രോത്സാഹിപ്പിച്ചു; തന്നോടൊപ്പം പഠിപ്പിക്കാൻ പൗലോസിനെ കൊണ്ടുവന്നു; അവിടെവച്ചാണു ശിഷ്യന്മാർ ആദ്യമായി ക്രിസ്ത്യാനികൾ എന്നു വിളിക്കപ്പെട്ടത്. പാഠം: ഈ നോമ്പിൽ നല്ലവരാകാൻ മറ്റുള്ളവരെ പ്രോത്സാഹിപ്പിക്കുക."],
  term:["കോത്തിനേ ഞായർ","“കോത്തിനേ” കാനായിലെ വിവാഹത്തെ (യോഹ 2:1–11) സൂചിപ്പിക്കുന്നു. ഈ സുവിശേഷത്തോടെയാണു മലങ്കരസഭ വലിയ നോമ്പ് ആരംഭിക്കുന്നത്: വെള്ളത്തിൽനിന്നു വീഞ്ഞിലേക്കുള്ള രൂപാന്തരത്തിന്റെ കാലമാണു നോമ്പ്."],
  termMore:["ശുബ്‌ക്കോനോ","നോമ്പിലെ ആദ്യതിങ്കളാഴ്ചത്തെ പാപമോചന (അനുരഞ്ജന) ശുശ്രൂഷ. അമ്പതു ദിവസങ്ങൾ ആരംഭിക്കുംമുമ്പു വൈദികനും ജനങ്ങളും പരസ്പരവും ദൈവത്തോടും ക്ഷമ ചോദിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു നമ്മുടെ സഭ വലിയ നോമ്പ് ആരംഭിക്കുന്നു; അത് ആരംഭിക്കുന്നത് ഒരു വിവാഹത്തിലാണ്. കോത്തിനേ ഞായറാഴ്ച, കാനായിൽ യേശു വെള്ളം വീഞ്ഞാക്കിയതെങ്ങനെയെന്നു നാം വായിക്കുന്നു. അമ്പതു ദിവസത്തെ ഉപവാസം ഒരു വിവാഹവിരുന്നോടെ ആരംഭിക്കുന്നത് എന്തിന്? കാരണം നോമ്പ് ഇരുളിന്റെ കാലമല്ല; രൂപാന്തരത്തിന്റെ കാലമാണ്.","കാനായിൽ വീഞ്ഞു തീർന്നുപോയി. മറിയം അതു ശ്രദ്ധിച്ചു പരിചാരകരോടു പറഞ്ഞു: “അവൻ നിങ്ങളോടു പറയുന്നതു ചെയ്യുവിൻ.” നോമ്പിനുള്ള ഏറ്റവും നല്ല ഉപദേശം അതാണ്. പരിചാരകർ ലളിതമായ ഒരു കാര്യം ചെയ്തു: ഭരണികൾ വക്കോളം വെള്ളം നിറച്ചു. യേശു ആ വെള്ളം ഏറ്റവും നല്ല വീഞ്ഞാക്കി. ഈ നോമ്പിൽ നമുക്കും നമ്മുടെ ഭരണികൾ നിറയ്ക്കാം: പ്രാർഥനയാൽ, ഉപവാസത്താൽ, ദൈവവചനത്താൽ, കാരുണ്യപ്രവൃത്തികളാൽ. നമ്മുടെ ജീവിതങ്ങളുടെ വെള്ളം വീഞ്ഞാക്കാൻ യേശുവിനെ അനുവദിക്കാം.","യഥാർഥ ഉപവാസം എന്തെന്നു പ്രവാചകന്മാർ പറയുന്നു. ജോയേൽ: “പൂർണഹൃദയത്തോടെ എന്റെ അടുക്കലേക്കു തിരിച്ചുവരുവിൻ. നിങ്ങളുടെ ഹൃദയമാണ് വസ്ത്രമല്ല കീറേണ്ടത്.” ഏശയ്യാ: “വിശക്കുന്നവനുമായി ആഹാരം പങ്കുവയ്ക്കുകയും ഭവനരഹിതനെ വീട്ടിൽ സ്വീകരിക്കുകയും ചെയ്യുന്നതല്ലേ ഞാൻ ആഗ്രഹിക്കുന്ന ഉപവാസം?” ഭക്ഷണത്തിൽനിന്നുള്ള ഉപവാസം ഒരു ഡയറ്റല്ല; നമ്മുടെ ഹൃദയങ്ങളിൽ ദൈവത്തിനും കരങ്ങളിൽ ദരിദ്രർക്കും അത് ഇടമൊരുക്കുന്നു.","ഇന്നു സന്ധ്യയ്ക്കു നോമ്പിന്റെ പ്രത്യേക പ്രാർഥനകൾ ആരംഭിക്കുന്നു; നാളെ പരസ്പരം ക്ഷമ ചോദിക്കുന്ന ശുബ്‌ക്കോനോ നാം ആഘോഷിക്കുന്നു. ഓരോ കുടുംബവും ലളിതമായ ഒരു പദ്ധതി തയ്യാറാക്കട്ടെ: ഒരു ഉപവാസം, ഒരു പ്രാർഥന, ഒരു ഉപവിപ്രവൃത്തി. ഈ അമ്പതു ദിവസങ്ങളുടെ അവസാനം, ക്യംതോയിൽ, ഇതുവരെ സൂക്ഷിച്ചുവച്ച ഏറ്റവും നല്ല വീഞ്ഞ് യേശു നമുക്കു നൽകും: അവിടുത്തെ ഉയിർപ്പിന്റെ സന്തോഷം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഇന്നു നോമ്പ് ആരംഭിക്കുന്നു! നമ്മുടെ സുവിശേഷം ഒരു കല്യാണവിരുന്നിനെപ്പറ്റിയാണ്. വിരുന്നിനിടെ വീഞ്ഞു തീർന്നുപോയി. മറിയം പറഞ്ഞു: “യേശു പറയുന്നതു ചെയ്യുവിൻ.”","പരിചാരകർ ആറു വലിയ ഭരണികളിൽ വെള്ളം നിറച്ചു; യേശു അതു മനോഹരമായ വീഞ്ഞാക്കി! നോമ്പുകാലത്തു നമ്മെയും മാറ്റാൻ യേശു ആഗ്രഹിക്കുന്നു: കൂടുതൽ ദയയുള്ളവരും ക്ഷമയുള്ളവരും പ്രാർഥിക്കുന്നവരുമാക്കാൻ.","ഈ നോമ്പിൽ നിനക്ക് എന്ത് ഉപേക്ഷിക്കാം? മിഠായി? ടെലിവിഷൻ? എന്തു നല്ല കാര്യം ചെയ്യാം? നമുക്കു പറയാം: “യേശുവേ, എന്റെ ഹൃദയം മാറ്റണമേ!”"]});

put("2027-02-14","en",{title:"Garbo Sunday · The Healing of the Leper",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 8:1–4","Lord, if you choose"],[EN.ot,"Genesis 7:6–16","Noah enters the ark"],[EN.ot,"2 Kings 5:1–14","Naaman is cleansed in the Jordan"],[EN.ot,"Jeremiah 50:4–7","They shall seek the Lord their God"],[EN.ot,"Isaiah 33:2–9","Be our arm every morning"],[EN.ac,"Acts 9:20–25","Saul proclaims Jesus"],[EN.pa,"Romans 3:27–4:3","Justified by faith"],[EN.go,"Luke 5:12–16","Jesus touches and cleanses a leper"]],
 alt:"Second Sunday of the Great Fast.",
 verse:"Lord, if you choose, you can make me clean.",cite:"Luke 5:12",
 theo:["The Sundays of the Great Fast in our tradition follow Christ the physician: the leper, the paralytic, the Canaanite woman's daughter, the bent woman, the man born blind. Lent is a season of healing. Today a man “covered with leprosy” falls on his face before Jesus and says: “Lord, if you choose, you can make me clean.” Jesus “stretched out his hand, touched him, and said, ‘I do choose. Be made clean.’ Immediately the leprosy left him.”","Leprosy in the Bible was more than a disease. The leper had to live outside the camp, cry “Unclean!”, and could touch no one. Jesus does what no one would do: he touches him. The Law said that touching a leper made you unclean; with Jesus, the opposite happens: his touch makes the leper clean. This is what Lent offers us: the touch of Christ on the parts of our life we hide from others.","Naaman, the proud Syrian general, was told by Elisha to wash seven times in the Jordan. At first he was angry: was this not too simple? But when he obeyed, “his flesh was restored like the flesh of a young boy, and he was clean.” Healing requires humility. The leper in the Gospel knelt; Naaman went down into the river. In Lent we kneel in confession and go down into the waters of repentance.","Isaiah prays: “O LORD, be gracious to us; we wait for you. Be our arm every morning, our salvation in the time of trouble.” Jesus himself, after healing the leper, “would withdraw to deserted places and pray.” Healing and prayer go together. Let us bring to Christ in this Fast whatever in us is unclean, and hear him say: “I do choose. Be made clean.”"],
 conn:[["Naaman and the leper.","Elisha healed a foreigner through the waters of the Jordan; Jesus heals with a touch and a word. Jesus himself recalls Naaman (Luke 4:27)."],["The ark.","Noah entering the ark (Genesis 7) is an image of salvation through the Church and Baptism (1 Peter 3:20–21)."],["Outside the camp.","Leviticus 13:45–46 excluded lepers; Christ “suffered outside the city gate” (Hebrews 13:12) to bring the excluded in."],["Sin as leprosy.","The Fathers saw leprosy as an image of sin: it spreads, isolates and disfigures; only Christ cleanses."]],
 altar:["The leper asked to be touched; in Holy Communion Christ does more than touch us: he enters us. Before Communion we say with the centurion and the leper: Lord, I am not worthy, but only say the word."],
 outline:[["Opening","The Sundays of Lent: Christ the physician."],["Point 1 · “If you choose”","Humble, trusting prayer. Jesus always chooses to heal what we bring him."],["Point 2 · The touch","Jesus touches the untouchable. Who are the “lepers” of our society?"],["Point 3 · Naaman's humility","Healing through simple obedience: Confession, prayer, fasting."],["Point 4 · Prayer in the desert","Jesus withdrew to pray; make space for prayer in Lent."],["Take-home line","“I do choose. Be made clean.”"]],
 live:[["Make a good Confession","Bring Christ what you hide most; hear the words of absolution as his touch."],["Touch the untouchable","Visit or help someone avoided by others: a patient, a migrant worker, a prisoner's family."],["Morning prayer (Isaiah 33:2)","Begin each day of the Fast with “O Lord, be our arm every morning.”"]],
 fathers:[["St John Chrysostom","Christ touched the leper to show that he was not under the law but above it, and that to the pure nothing is impure: his hand did not become unclean, but the leprous body became clean (Homilies on Matthew 25)."],["St Ephrem the Syrian","He calls Christ the Physician who came down to the sick, and asks that the medicine of his mercy heal the hidden sores of the soul (Hymns on the Fast)."]],
 magis:[["Catechism 1503–1505","Christ the physician: his compassion for the sick and his healings are signs that God has visited his people; he takes up our infirmities."],["Catechism 1421","The Lord Jesus, physician of our souls and bodies, willed that his Church continue his work of healing in the sacraments of Penance and Anointing."],["Message for the World Day of the Sick","The Church cares for the sick as Christ did; read the Pope's annual message (11 February) on vatican.va."]],
 saints:[["This week","The weekdays of the Great Fast. 22 Feb (next Monday): the Throne of St Peter at Antioch."]],
 prayer:"Lord Jesus, physician of souls and bodies, you touched the leper and made him clean. Stretch out your hand over us in this Fast: cleanse what is hidden, heal what is wounded, and give us the humility of Naaman and the faith of the leper. Amen."},
 {quick:["Lent is a season of healing: Christ the physician.","Jesus touches the untouchable and makes him clean.","Healing needs humility: kneel like the leper, wash like Naaman."],action:"Make a good Confession during this week of the Fast.",question:"What “leprosy” in my life am I hiding from Jesus?",
  special:"Garbo Sunday, second Sunday of the Great Fast.",
  illus:["An illustration","Kerala once had leprosy hospitals run by religious sisters, who washed and bandaged patients whom even their families had abandoned. Visitors were amazed that the sisters touched them with bare hands. They had learnt it from Jesus."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 5:12–13.",explain:"A man with a skin disease called leprosy was alone; nobody would touch him. He asked Jesus for help, and Jesus touched him and healed him.",intention:"We pray for the sick, and for people who are left alone or rejected.",ask:"Ask: “Who is lonely at school or at work, and how can we be kind to them?”"},
  catechism:[["CCC 1503–1505","Christ the physician."],["CCC 1422–1424","The sacrament of Penance."]],
  kidsaint:["St Damien of Molokai","A Belgian priest who went to live with people suffering from leprosy on the island of Molokai, cared for them, built homes and a church, and finally caught the disease himself. Lesson: love the people others avoid."],
  term:["Garbo Sunday","Garbo is Syriac for “leper”. The second Sunday of the Great Fast, when the Church reads the healing of the leper. The Sundays of the Fast are named after Christ's healings."],
  termMore:["Why healings in Lent?","The Malankara Great Fast follows Christ the physician from Sunday to Sunday: the leper, the paralytic, the Canaanite woman's daughter, the bent woman and the man born blind. Lent is our journey of healing towards Easter."]},
 {homily:["Dear brothers and sisters, in our tradition every Sunday of the Great Fast shows us Christ the physician. Today a leper comes to him. In those days a leper lived outside the village, had to cry “Unclean!” when anyone came near, and could touch no one. This man kneels and says: “Lord, if you choose, you can make me clean.”","Then Jesus does something no one else would do. He stretches out his hand and touches him. “I do choose. Be made clean.” By the Law, touching a leper made a person unclean. But with Jesus the opposite happens: his touch makes the leper clean. That is what Lent offers each of us: the touch of Christ on the part of our life we hide from everyone.","Our first reading tells of Naaman, a proud Syrian general with leprosy. The prophet told him simply to wash seven times in the Jordan. He was offended: is that all? But when he humbled himself and obeyed, his flesh became like a child's. Healing needs humility. For us, the Jordan is the sacrament of Confession. It seems too simple. But it heals.","After healing the leper, Jesus withdrew to deserted places to pray. Let us make room for prayer in this Fast, make a good Confession, and reach out to the “lepers” of our time: the sick, the lonely, those everyone avoids. And let us hear Jesus say to us: “I do choose. Be made clean.” Amen."],
  kids:["Children, long ago people with a skin disease called leprosy had to live alone. Nobody would touch them or play with them.","One day a man with leprosy came to Jesus and said: “If you want, you can heal me.” Jesus touched him and said: “I want to. Be healed!” And he was healed!","Is there someone at school whom nobody plays with? Be kind to them, like Jesus. Let's say: “Jesus, make me kind!”"]});

put("2027-02-14","ml",{title:"ഗർബോ ഞായർ · കുഷ്ഠരോഗിയുടെ സൗഖ്യം",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 8:1–4","കർത്താവേ, അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ"],[ML.ot,"ഉൽപത്തി 7:6–16","നോഹ പെട്ടകത്തിൽ പ്രവേശിക്കുന്നു"],[ML.ot,"2 രാജാക്കന്മാർ 5:1–14","നാമാൻ ജോർദാനിൽ ശുദ്ധനാകുന്നു"],[ML.ot,"ജറെമിയാ 50:4–7","അവർ തങ്ങളുടെ ദൈവമായ കർത്താവിനെ അന്വേഷിക്കും"],[ML.ot,"ഏശയ്യാ 33:2–9","ഓരോ പ്രഭാതത്തിലും ഞങ്ങളുടെ കരമായിരിക്കണമേ"],[ML.ac,"അപ്പ. പ്രവ. 9:20–25","സാവൂൾ യേശുവിനെ പ്രഘോഷിക്കുന്നു"],[ML.pa,"റോമാ 3:27–4:3","വിശ്വാസത്താലുള്ള നീതീകരണം"],[ML.go,"ലൂക്കാ 5:12–16","യേശു ഒരു കുഷ്ഠരോഗിയെ തൊട്ടു ശുദ്ധനാക്കുന്നു"]],
 alt:"വലിയ നോമ്പിലെ രണ്ടാം ഞായർ.",
 verse:"കർത്താവേ, അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധനാക്കാൻ കഴിയും.",cite:"ലൂക്കാ 5:12",
 theo:["നമ്മുടെ പാരമ്പര്യത്തിൽ വലിയ നോമ്പിലെ ഞായറാഴ്ചകൾ വൈദ്യനായ ക്രിസ്തുവിനെ പിന്തുടരുന്നു: കുഷ്ഠരോഗി, തളർവാതരോഗി, കാനാൻകാരിയുടെ മകൾ, കൂനുള്ള സ്ത്രീ, അന്ധനായി ജനിച്ചവൻ. നോമ്പു സൗഖ്യത്തിന്റെ കാലമാണ്. ഇന്ന് ഒരു കുഷ്ഠരോഗി യേശുവിനെക്കണ്ട് സാഷ്ടാംഗം വീണു പ്രാർഥിക്കുന്നു: “കർത്താവേ, അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധനാക്കാൻ കഴിയും.” “യേശു കൈ നീട്ടി അവനെ തൊട്ടുകൊണ്ടു പറഞ്ഞു: എനിക്കു മനസ്സുണ്ട്; നിനക്കു ശുദ്ധിയുണ്ടാകട്ടെ! തത്ക്ഷണം കുഷ്ഠം അവനെ വിട്ടുമാറി.”","ബൈബിളിൽ കുഷ്ഠം ഒരു രോഗം മാത്രമായിരുന്നില്ല. കുഷ്ഠരോഗി പാളയത്തിനു പുറത്തു ജീവിക്കണമായിരുന്നു; “അശുദ്ധൻ!” എന്നു വിളിച്ചുപറയണമായിരുന്നു; ആരെയും തൊടാനാവില്ലായിരുന്നു. ആരും ചെയ്യാത്തത് യേശു ചെയ്യുന്നു: അവിടുന്ന് അവനെ തൊടുന്നു. കുഷ്ഠരോഗിയെ തൊട്ടാൽ ആൾ അശുദ്ധനാകുമെന്നു നിയമം പറഞ്ഞു; യേശുവിൽ നേരേ മറിച്ചു സംഭവിക്കുന്നു: അവിടുത്തെ സ്പർശം കുഷ്ഠരോഗിയെ ശുദ്ധനാക്കുന്നു. നോമ്പു നമുക്കു നൽകുന്നത് ഇതാണ്: മറ്റുള്ളവരിൽനിന്നു നാം മറയ്ക്കുന്ന ജീവിതഭാഗങ്ങളിൽ ക്രിസ്തുവിന്റെ സ്പർശം.","അഹങ്കാരിയായ സിറിയൻ സേനാപതി നാമാനോട് ജോർദാനിൽ ഏഴു പ്രാവശ്യം കുളിക്കാൻ എലീഷാ പറഞ്ഞു. ആദ്യം അവൻ കോപിച്ചു: ഇതു വളരെ ലളിതമല്ലേ? പക്ഷേ അനുസരിച്ചപ്പോൾ, “അവൻ ജോർദാനിലിറങ്ങി ഏഴുപ്രാവശ്യം മുങ്ങി. അവൻ സുഖം പ്രാപിച്ചു; ശരീരം ശിശുവിന്റേതുപോലെയായി.” സൗഖ്യത്തിന് എളിമ ആവശ്യമാണ്. സുവിശേഷത്തിലെ കുഷ്ഠരോഗി സാഷ്ടാംഗം വീണു; നാമാൻ നദിയിലേക്ക് ഇറങ്ങി. നോമ്പിൽ നാം കുമ്പസാരത്തിൽ മുട്ടുകുത്തുന്നു; അനുതാപത്തിന്റെ ജലത്തിലേക്ക് ഇറങ്ങുന്നു.","ഏശയ്യാ പ്രാർഥിക്കുന്നു: “കർത്താവേ, ഞങ്ങളോടു കരുണയുണ്ടാകണമേ! ഞങ്ങൾ അങ്ങേക്കുവേണ്ടി കാത്തിരിക്കുന്നു. ഓരോ പ്രഭാതത്തിലും ഞങ്ങളുടെ കരവും കഷ്ടതയുടെ കാലത്തു ഞങ്ങളുടെ രക്ഷയും ആയിരിക്കണമേ!” കുഷ്ഠരോഗിയെ സുഖപ്പെടുത്തിയശേഷം യേശുതന്നെ “വിജനപ്രദേശങ്ങളിലേക്കു പിൻവാങ്ങി അവിടെ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.” സൗഖ്യവും പ്രാർഥനയും ഒന്നിച്ചുപോകുന്നു. ഈ നോമ്പിൽ നമ്മിൽ അശുദ്ധമായതെന്തും ക്രിസ്തുവിന്റെ അടുത്തേക്കു കൊണ്ടുവരാം; “എനിക്കു മനസ്സുണ്ട്; നിനക്കു ശുദ്ധിയുണ്ടാകട്ടെ!” എന്ന് അവിടുന്നു പറയുന്നതു കേൾക്കാം."],
 conn:[["നാമാനും കുഷ്ഠരോഗിയും.","ജോർദാനിലെ ജലത്തിലൂടെ എലീഷാ ഒരു വിജാതീയനെ സുഖപ്പെടുത്തി; യേശു ഒരു സ്പർശത്താലും ഒരു വാക്കിനാലും സുഖപ്പെടുത്തുന്നു. യേശുതന്നെ നാമാനെ അനുസ്മരിക്കുന്നു (ലൂക്കാ 4:27)."],["പെട്ടകം.","പെട്ടകത്തിൽ പ്രവേശിക്കുന്ന നോഹ (ഉൽപ 7) സഭയിലൂടെയും മാമ്മോദീസയിലൂടെയുമുള്ള രക്ഷയുടെ പ്രതീകമാണ് (1 പത്രോ 3:20–21)."],["പാളയത്തിനു പുറത്ത്.","ലേവ്യർ 13:45–46 കുഷ്ഠരോഗികളെ പുറന്തള്ളി; പുറന്തള്ളപ്പെട്ടവരെ അകത്തേക്കു കൊണ്ടുവരാൻ ക്രിസ്തു “നഗരകവാടത്തിനു പുറത്തുവച്ചു” പീഡ സഹിച്ചു (ഹെബ്രാ 13:12)."],["കുഷ്ഠമായ പാപം.","പിതാക്കന്മാർ കുഷ്ഠത്തെ പാപത്തിന്റെ പ്രതീകമായി കണ്ടു: അതു പടരുന്നു, ഒറ്റപ്പെടുത്തുന്നു, വികൃതമാക്കുന്നു; ക്രിസ്തു മാത്രം ശുദ്ധീകരിക്കുന്നു."]],
 altar:["തന്നെ തൊടാനാണു കുഷ്ഠരോഗി അപേക്ഷിച്ചത്; വിശുദ്ധ കുർബാനയിൽ ക്രിസ്തു നമ്മെ തൊടുന്നതിലുമധികം ചെയ്യുന്നു: അവിടുന്നു നമ്മിൽ പ്രവേശിക്കുന്നു. കുർബാനസ്വീകരണത്തിനു മുമ്പു ശതാധിപനോടും കുഷ്ഠരോഗിയോടുമൊപ്പം നാം പറയുന്നു: കർത്താവേ, ഞാൻ യോഗ്യനല്ല; ഒരു വാക്ക് അരുളിച്ചെയ്താൽ മതി."],
 outline:[["ആരംഭം","നോമ്പിലെ ഞായറാഴ്ചകൾ: വൈദ്യനായ ക്രിസ്തു."],["ഒന്നാം ആശയം · “അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ”","എളിമയും ആശ്രയവുമുള്ള പ്രാർഥന. നാം കൊണ്ടുവരുന്നതു സുഖപ്പെടുത്താൻ യേശുവിന് എപ്പോഴും മനസ്സുണ്ട്."],["രണ്ടാം ആശയം · സ്പർശം","തൊടാൻ പാടില്ലാത്തവനെ യേശു തൊടുന്നു. നമ്മുടെ സമൂഹത്തിലെ “കുഷ്ഠരോഗികൾ” ആരാണ്?"],["മൂന്നാം ആശയം · നാമാന്റെ എളിമ","ലളിതമായ അനുസരണത്തിലൂടെ സൗഖ്യം: കുമ്പസാരം, പ്രാർഥന, ഉപവാസം."],["നാലാം ആശയം · വിജനസ്ഥലത്തെ പ്രാർഥന","യേശു പ്രാർഥിക്കാൻ പിൻവാങ്ങി; നോമ്പിൽ പ്രാർഥനയ്ക്ക് ഇടമൊരുക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“എനിക്കു മനസ്സുണ്ട്; നിനക്കു ശുദ്ധിയുണ്ടാകട്ടെ!”"]],
 live:[["നല്ല ഒരു കുമ്പസാരം നടത്തുക","നീ ഏറ്റവും മറച്ചുവയ്ക്കുന്നതു ക്രിസ്തുവിന്റെ അടുത്തേക്കു കൊണ്ടുവരുക; പാപമോചനവാക്കുകൾ അവിടുത്തെ സ്പർശമായി കേൾക്കുക."],["തൊടാൻ മടിക്കുന്നവരെ തൊടുക","മറ്റുള്ളവർ ഒഴിവാക്കുന്ന ഒരാളെ സന്ദർശിക്കുകയോ സഹായിക്കുകയോ ചെയ്യുക: ഒരു രോഗി, ഒരു കുടിയേറ്റത്തൊഴിലാളി, ഒരു തടവുകാരന്റെ കുടുംബം."],["പ്രഭാതപ്രാർഥന (ഏശ 33:2)","“കർത്താവേ, ഓരോ പ്രഭാതത്തിലും ഞങ്ങളുടെ കരമായിരിക്കണമേ” എന്നു പ്രാർഥിച്ചുകൊണ്ടു നോമ്പിലെ ഓരോ ദിവസവും ആരംഭിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","താൻ നിയമത്തിന് അധീനനല്ല, അതിനു മീതേയാണെന്നും, നിർമലർക്ക് ഒന്നും അശുദ്ധമല്ലെന്നും കാണിക്കാനാണു ക്രിസ്തു കുഷ്ഠരോഗിയെ തൊട്ടത്: അവിടുത്തെ കരം അശുദ്ധമായില്ല; കുഷ്ഠം ബാധിച്ച ശരീരം ശുദ്ധമായി (മത്തായിയെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 25)."],["മാർ അപ്രേം","രോഗികളുടെ അടുത്തേക്ക് ഇറങ്ങിവന്ന വൈദ്യനെന്നു ക്രിസ്തുവിനെ അദ്ദേഹം വിളിക്കുന്നു; അവിടുത്തെ കരുണയുടെ ഔഷധം ആത്മാവിന്റെ മറഞ്ഞ മുറിവുകൾ സുഖപ്പെടുത്താൻ അപേക്ഷിക്കുന്നു (ഉപവാസഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1503–1505","വൈദ്യനായ ക്രിസ്തു: രോഗികളോടുള്ള അവിടുത്തെ അനുകമ്പയും സൗഖ്യങ്ങളും ദൈവം തന്റെ ജനത്തെ സന്ദർശിച്ചതിന്റെ അടയാളങ്ങളാണ്; അവിടുന്നു നമ്മുടെ ബലഹീനതകൾ ഏറ്റെടുക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1421","നമ്മുടെ ആത്മാക്കളുടെയും ശരീരങ്ങളുടെയും വൈദ്യനായ കർത്താവായ യേശു, അനുരഞ്ജനത്തിന്റെയും രോഗീലേപനത്തിന്റെയും കൂദാശകളിലൂടെ തന്റെ സൗഖ്യപ്രവൃത്തി സഭ തുടരണമെന്ന് ആഗ്രഹിച്ചു."],["ലോകരോഗീദിനസന്ദേശം","ക്രിസ്തുവിനെപ്പോലെ സഭ രോഗികളെ പരിപാലിക്കുന്നു; മാർപാപ്പയുടെ വാർഷികസന്ദേശം (ഫെബ്രുവരി 11) vatican.va-യിൽ വായിക്കുക."]],
 saints:[["ഈ ആഴ്ച","വലിയ നോമ്പിലെ വാരദിവസങ്ങൾ. ഫെബ്രുവരി 22 (അടുത്ത തിങ്കൾ): അന്ത്യോക്യായിലെ വിശുദ്ധ പത്രോസിന്റെ സിംഹാസനം."]],
 prayer:"ആത്മാക്കളുടെയും ശരീരങ്ങളുടെയും വൈദ്യനായ കർത്താവായ യേശുവേ, അങ്ങു കുഷ്ഠരോഗിയെ തൊട്ടു ശുദ്ധനാക്കി. ഈ നോമ്പിൽ ഞങ്ങളുടെമേൽ അങ്ങയുടെ കരം നീട്ടണമേ: മറഞ്ഞിരിക്കുന്നതു ശുദ്ധീകരിക്കണമേ; മുറിവേറ്റതു സുഖപ്പെടുത്തണമേ; നാമാന്റെ എളിമയും കുഷ്ഠരോഗിയുടെ വിശ്വാസവും ഞങ്ങൾക്കു നൽകണമേ. ആമേൻ."},
 {quick:["നോമ്പു സൗഖ്യത്തിന്റെ കാലമാണ്: വൈദ്യനായ ക്രിസ്തു.","തൊടാൻ പാടില്ലാത്തവനെ യേശു തൊട്ടു ശുദ്ധനാക്കുന്നു.","സൗഖ്യത്തിന് എളിമ വേണം: കുഷ്ഠരോഗിയെപ്പോലെ മുട്ടുകുത്തുക, നാമാനെപ്പോലെ കുളിക്കുക."],action:"നോമ്പിലെ ഈ ആഴ്ച നല്ല ഒരു കുമ്പസാരം നടത്തുക.",question:"എന്റെ ജീവിതത്തിലെ ഏതു “കുഷ്ഠമാണ്” ഞാൻ യേശുവിൽനിന്നു മറച്ചുവയ്ക്കുന്നത്?",
  special:"ഗർബോ ഞായർ, വലിയ നോമ്പിലെ രണ്ടാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിൽ ഒരുകാലത്ത് സന്യാസിനികൾ നടത്തിയിരുന്ന കുഷ്ഠരോഗാശുപത്രികളുണ്ടായിരുന്നു; സ്വന്തം കുടുംബങ്ങൾപോലും ഉപേക്ഷിച്ച രോഗികളെ അവർ കുളിപ്പിക്കുകയും മുറിവുകൾ വച്ചുകെട്ടുകയും ചെയ്തു. സിസ്റ്റർമാർ നഗ്നമായ കൈകൾകൊണ്ട് അവരെ തൊടുന്നതുകണ്ടു സന്ദർശകർ അദ്ഭുതപ്പെട്ടു. അവർ അതു യേശുവിൽനിന്നാണു പഠിച്ചത്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 5:12–13.",explain:"കുഷ്ഠം എന്ന ത്വക്‌രോഗമുള്ള ഒരാൾ ഒറ്റയ്ക്കായിരുന്നു; ആരും അവനെ തൊടുമായിരുന്നില്ല. അവൻ യേശുവിനോടു സഹായം ചോദിച്ചു; യേശു അവനെ തൊട്ടു സുഖപ്പെടുത്തി.",intention:"രോഗികൾക്കും ഒറ്റപ്പെട്ടവർക്കും തിരസ്കരിക്കപ്പെട്ടവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “സ്കൂളിലോ ജോലിസ്ഥലത്തോ ആരാണ് ഒറ്റയ്ക്കായിരിക്കുന്നത്? അവരോടു നമുക്ക് എങ്ങനെ ദയ കാണിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1503–1505","വൈദ്യനായ ക്രിസ്തു."],["മതബോധനഗ്രന്ഥം 1422–1424","അനുരഞ്ജനകൂദാശ."]],
  kidsaint:["മൊളോക്കായിലെ വിശുദ്ധ ഡാമിയൻ","മൊളോക്കാ ദ്വീപിൽ കുഷ്ഠരോഗികളോടൊപ്പം ജീവിക്കാൻ പോയി, അവരെ പരിപാലിച്ച്, വീടുകളും ഒരു പള്ളിയും പണിത്, ഒടുവിൽ സ്വയം രോഗബാധിതനായ ബെൽജിയംകാരനായ ഒരു വൈദികൻ. പാഠം: മറ്റുള്ളവർ ഒഴിവാക്കുന്നവരെ സ്നേഹിക്കുക."],
  term:["ഗർബോ ഞായർ","“ഗർബോ” എന്നതിന്റെ സുറിയാനിയിലെ അർഥം “കുഷ്ഠരോഗി” എന്നാണ്. കുഷ്ഠരോഗിയുടെ സൗഖ്യം സഭ വായിക്കുന്ന, വലിയ നോമ്പിലെ രണ്ടാം ഞായർ. നോമ്പിലെ ഞായറാഴ്ചകൾ ക്രിസ്തുവിന്റെ സൗഖ്യങ്ങളുടെ പേരിലാണ് അറിയപ്പെടുന്നത്."],
  termMore:["നോമ്പിൽ എന്തുകൊണ്ടു സൗഖ്യങ്ങൾ?","മലങ്കരയിലെ വലിയ നോമ്പ് ഞായറിൽനിന്നു ഞായറിലേക്കു വൈദ്യനായ ക്രിസ്തുവിനെ പിന്തുടരുന്നു: കുഷ്ഠരോഗി, തളർവാതരോഗി, കാനാൻകാരിയുടെ മകൾ, കൂനുള്ള സ്ത്രീ, അന്ധനായി ജനിച്ചവൻ. ഉയിർപ്പിലേക്കുള്ള നമ്മുടെ സൗഖ്യയാത്രയാണു നോമ്പ്."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, നമ്മുടെ പാരമ്പര്യത്തിൽ വലിയ നോമ്പിലെ ഓരോ ഞായറാഴ്ചയും വൈദ്യനായ ക്രിസ്തുവിനെ നമുക്കു കാണിച്ചുതരുന്നു. ഇന്ന് ഒരു കുഷ്ഠരോഗി അവിടുത്തെ അടുത്തു വരുന്നു. അക്കാലത്തു കുഷ്ഠരോഗി ഗ്രാമത്തിനു പുറത്തു ജീവിക്കണമായിരുന്നു; ആരെങ്കിലും അടുത്തുവന്നാൽ “അശുദ്ധൻ!” എന്നു വിളിച്ചുപറയണമായിരുന്നു; ആരെയും തൊടാനാവില്ലായിരുന്നു. ഈ മനുഷ്യൻ സാഷ്ടാംഗം വീണു പറയുന്നു: “കർത്താവേ, അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധനാക്കാൻ കഴിയും.”","അപ്പോൾ മറ്റാരും ചെയ്യാത്തത് യേശു ചെയ്യുന്നു. അവിടുന്നു കൈനീട്ടി അവനെ തൊടുന്നു: “എനിക്കു മനസ്സുണ്ട്; നിനക്കു ശുദ്ധിയുണ്ടാകട്ടെ!” നിയമപ്രകാരം കുഷ്ഠരോഗിയെ തൊടുന്നയാൾ അശുദ്ധനാകുമായിരുന്നു. പക്ഷേ യേശുവിൽ നേരേ മറിച്ചു സംഭവിക്കുന്നു: അവിടുത്തെ സ്പർശം കുഷ്ഠരോഗിയെ ശുദ്ധനാക്കുന്നു. നോമ്പു നമ്മളോരോരുത്തർക്കും നൽകുന്നത് അതാണ്: എല്ലാവരിൽനിന്നും നാം മറയ്ക്കുന്ന ജീവിതഭാഗത്തു ക്രിസ്തുവിന്റെ സ്പർശം.","കുഷ്ഠരോഗിയായ, അഹങ്കാരിയായ സിറിയൻ സേനാപതി നാമാനെപ്പറ്റി ആദ്യവായന പറയുന്നു. ജോർദാനിൽ ഏഴു പ്രാവശ്യം കുളിക്കാൻ മാത്രമാണു പ്രവാചകൻ അവനോടു പറഞ്ഞത്. അവനു നീരസം തോന്നി: ഇത്രമാത്രമോ? പക്ഷേ എളിമപ്പെട്ട് അനുസരിച്ചപ്പോൾ അവന്റെ ശരീരം ഒരു ശിശുവിന്റേതുപോലെയായി. സൗഖ്യത്തിന് എളിമ വേണം. നമുക്കു ജോർദാൻ കുമ്പസാരമെന്ന കൂദാശയാണ്. അതു വളരെ ലളിതമായി തോന്നും. പക്ഷേ അതു സുഖപ്പെടുത്തുന്നു.","കുഷ്ഠരോഗിയെ സുഖപ്പെടുത്തിയശേഷം യേശു പ്രാർഥിക്കാൻ വിജനസ്ഥലങ്ങളിലേക്കു പിൻവാങ്ങി. ഈ നോമ്പിൽ നമുക്കു പ്രാർഥനയ്ക്ക് ഇടമൊരുക്കാം; നല്ല ഒരു കുമ്പസാരം നടത്താം; നമ്മുടെ കാലത്തെ “കുഷ്ഠരോഗികളിലേക്ക്” കൈനീട്ടാം: രോഗികൾ, ഏകാകികൾ, എല്ലാവരും ഒഴിവാക്കുന്നവർ. “എനിക്കു മനസ്സുണ്ട്; നിനക്കു ശുദ്ധിയുണ്ടാകട്ടെ!” എന്ന് യേശു നമ്മോടു പറയുന്നതു നമുക്കു കേൾക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, പണ്ടുകാലത്തു കുഷ്ഠം എന്ന ത്വക്‌രോഗമുള്ളവർക്ക് ഒറ്റയ്ക്കു ജീവിക്കേണ്ടിവന്നിരുന്നു. ആരും അവരെ തൊടുകയോ അവരോടൊപ്പം കളിക്കുകയോ ചെയ്തിരുന്നില്ല.","ഒരുദിവസം കുഷ്ഠമുള്ള ഒരാൾ യേശുവിന്റെ അടുത്തുവന്നു പറഞ്ഞു: “അങ്ങ് ആഗ്രഹിക്കുന്നെങ്കിൽ എന്നെ സുഖപ്പെടുത്താം.” യേശു അവനെ തൊട്ടു പറഞ്ഞു: “ഞാൻ ആഗ്രഹിക്കുന്നു. സുഖമാകുക!” അവൻ സുഖപ്പെട്ടു!","സ്കൂളിൽ ആരും കൂടെ കളിക്കാത്ത ഒരാളുണ്ടോ? യേശുവിനെപ്പോലെ അവരോടു ദയ കാണിക്കുക. നമുക്കു പറയാം: “യേശുവേ, എന്നെ ദയയുള്ളവനാക്കണമേ!”"]});
