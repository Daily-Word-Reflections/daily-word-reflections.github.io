put("2026-10-22","smc","en",{title:"Second Thursday of Moses · Saint John Paul II",readTitle:"Readings of the day",
 readings:[["Epistle","Philippians 2:12–18","Do good deeds for salvation"],["Gospel","Luke 13:22–30","Those who are saved"]],
 alt:"For the memory of St John Paul II: Revelation 21:1–8 (God dwells among the people); John 21:4–14 (Cast the net to the right side of the boat).",
 verse:"Strive to enter through the narrow door; for many, I tell you, will try to enter and will not be able.",cite:"Luke 13:24",
 theo:["Someone asks Jesus, “Lord, will only a few be saved?” Jesus does not satisfy curiosity with a number; he turns the question into a call: “Strive to enter through the narrow door.” Salvation is God's free gift, yet it is not received passively. Paul holds the two together perfectly: “Work out your own salvation with fear and trembling; for it is God who is at work in you, enabling you both to will and to work for his good pleasure.”","Catholic faith refuses two errors here. One says, “I am saved, so nothing I do matters.” The other says, “I must earn heaven by my own strength.” The truth is that grace comes first, always, and grace makes us able to respond, freely and really. The narrow door is not a door God keeps half-closed; it is Christ himself (John 10:9), and we enter it by humility. That is why the last will be first, and why people will come from east and west, north and south, to sit at table in the Kingdom."],
 conn:[["People from east and west.","Luke 13:29 echoes Isaiah 49:12 and Psalm 107:3: God gathers his people from every direction. This promise reached India when St Thomas brought the Gospel to our land."],["Shining like stars.","Philippians 2:15 recalls Daniel 12:3: “Those who lead many to righteousness shall shine like the stars for ever and ever.”"]],
 altar:["At the Qurbana we already sit at the table of the Kingdom with people from east and west. Communion is a foretaste of the banquet Jesus promises."],
 outline:[["Opening","Ask: if you could ask Jesus one question about heaven, what would it be? Someone asked him exactly that."],["Point 1 · Grace first, then effort","God works in you to will and to work (Philippians 2:13). Our striving is a response to grace, never a substitute for it."],["Point 2 · The narrow door is Christ","Humility is the way in. The proud do not fit; the little ones do."],["Point 3 · St John Paul II","He told the world, “Do not be afraid! Open wide the doors for Christ.” Open the narrow door, and you will find it opens onto a wide feast."],["Take-home line","“Grace goes before me; I will walk through the door today.”"]],
 live:[["One act of effort (Philippians 2:12)","Choose one good deed today that costs you something, and offer it as a response to grace."],["Shine without grumbling (Philippians 2:14)","Spend this day without complaining, as a small way of shining like a star."]],
 fathers:[["St Augustine","“God who created you without you will not save you without you” (Sermon 169). Grace does everything, and it does it in and with our free will."]],
 magis:[["Catechism 1996–2005","Grace is the free and undeserved help God gives us to respond to his call; it precedes, prepares and elicits our free response."]],
 saints:[["22 October · Saint John Paul II","Pope from 1978 to 2005, who visited Kerala in 1986 and beatified St Alphonsa and St Kuriakose Elias Chavara there. His memorial falls on the anniversary of the inauguration of his pontificate."]],
 prayer:"Lord Jesus, you are the narrow door. Give me the humility to enter, and the courage of St John Paul II to open wide the doors of my life to you. Amen."},
 {quick:["Grace always comes first; our effort is our answer.","The narrow door is Christ, and humility is the way in.","“Do not be afraid! Open wide the doors for Christ.”"],action:"Do one good deed today that costs you something.",question:"Which door in my life have I kept closed to Christ?",
  illus:["An illustration","In February 1986 St John Paul II came to Kottayam and Kochi and beatified Sr Alphonsa and Fr Chavara. Many Keralites still remember the crowds. A Pope who opened the doors to Christ came to our doors."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 13:24, 29.",explain:"Jesus says the way to heaven is like a small door. We go through it by being humble and loving, not by showing off.",intention:"We pray for the Holy Father and for all young people, as St John Paul II loved them.",ask:"Ask: “What is one humble thing we can do tomorrow?”"},
  catechism:[["CCC 1996–2001","Grace and our free response."]],kidsaint:["Saint John Paul II","As a boy in Poland, Karol loved football and theatre. He became a priest, a bishop and then Pope, and travelled the world, even to Kerala, to tell young people that Jesus loves them. Lesson: do not be afraid to belong to Jesus."],
  term:["Raza (റാസ)","The solemn form of the Syro-Malabar Qurbana. The Syriac word raza means mystery. The Raza is celebrated with greater solemnity, chant and ceremony on great feasts."],termMore:["What does “mystery” mean in the liturgy?","In our Eastern tradition the sacraments are called mysteries (raze), because in them God's hidden saving work is made present to us."]},
 {homily:["Dear friends, someone asked Jesus, “Lord, will only a few be saved?” Jesus did not give a number. He said: “Strive to enter through the narrow door.” Paul explains how: work out your salvation, because it is God who works in you. Grace comes first, always; our effort is our answer.","The narrow door is Christ himself, and we enter it with humility. That is why the last will be first, and why people will come from east and west to the table of the Kingdom. The Gospel came from the east to our own land through St Thomas.","Today we remember St John Paul II, who came to Kerala in 1986. His first words as Pope were: “Do not be afraid! Open wide the doors for Christ!” Let us open the doors of our hearts today. Amen."],
  kids:["Children, have you seen a very small door, like the door of a tiny room? You have to bend down to go in. Jesus says the way to heaven is like that: we go in by being humble, not by pushing and showing off.","Today we remember Pope John Paul II. He said: “Do not be afraid!” Be brave and kind for Jesus today."]});

put("2026-10-22","smc","ml",{title:"മൂശെക്കാലം രണ്ടാം വ്യാഴം · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ",readTitle:"ഇന്നത്തെ വായനകൾ",
 readings:[["ലേഖനം","ഫിലിപ്പി 2:12–18","രക്ഷയ്ക്കായി സത്പ്രവൃത്തികൾ ചെയ്യുക"],["സുവിശേഷം","ലൂക്കാ 13:22–30","രക്ഷിക്കപ്പെടുന്നവർ"]],
 alt:"വിശുദ്ധ ജോൺ പോൾ രണ്ടാമന്റെ ഓർമയ്ക്ക്: വെളിപാട് 21:1–8 (ദൈവം ജനങ്ങളുടെ ഇടയിൽ വസിക്കുന്നു); യോഹന്നാൻ 21:4–14 (വള്ളത്തിന്റെ വലത്തുവശത്തു വലയിടുക).",
 verse:"ഇടുങ്ങിയ വാതിലിലൂടെ പ്രവേശിക്കുവാൻ പരിശ്രമിക്കുവിൻ. ഞാൻ നിങ്ങളോടു പറയുന്നു, അനേകംപേർ പ്രവേശിക്കാൻ ശ്രമിക്കും. എന്നാൽ അവർക്കു സാധിക്കുകയില്ല.",cite:"ലൂക്കാ 13:24",
 theo:["“കർത്താവേ, രക്ഷപ്രാപിക്കുന്നവർ ചുരുക്കമാണോ?” എന്ന് ഒരാൾ ഈശോയോടു ചോദിക്കുന്നു. ഒരു സംഖ്യ പറഞ്ഞു ജിജ്ഞാസ തൃപ്തിപ്പെടുത്താതെ ഈശോ ആ ചോദ്യത്തെ ഒരു വിളിയാക്കുന്നു: “ഇടുങ്ങിയ വാതിലിലൂടെ പ്രവേശിക്കുവാൻ പരിശ്രമിക്കുവിൻ.” രക്ഷ ദൈവത്തിന്റെ സൗജന്യദാനമാണ്; എങ്കിലും അതു നിഷ്ക്രിയമായി സ്വീകരിക്കപ്പെടുന്നില്ല. പൗലോസ് രണ്ടും പൂർണമായി ചേർത്തുപിടിക്കുന്നു: ഭയത്തോടും വിറയലോടുംകൂടെ നിങ്ങളുടെ രക്ഷയ്ക്കായി പ്രവർത്തിക്കുവിൻ; കാരണം, ഇച്ഛിക്കാനും പ്രവർത്തിക്കാനും നിങ്ങളിൽ പ്രവർത്തിക്കുന്നതു ദൈവമാണ്.","കത്തോലിക്കാവിശ്വാസം ഇവിടെ രണ്ടു തെറ്റുകൾ നിരസിക്കുന്നു. “ഞാൻ രക്ഷിക്കപ്പെട്ടവനാണ്; ഞാൻ എന്തു ചെയ്താലും കാര്യമില്ല” എന്ന് ഒന്നു പറയുന്നു. “സ്വന്തം ശക്തികൊണ്ടു ഞാൻ സ്വർഗം നേടണം” എന്നു മറ്റേതു പറയുന്നു. സത്യം ഇതാണ്: കൃപ എപ്പോഴും ആദ്യം വരുന്നു; സ്വതന്ത്രമായും യഥാർഥമായും പ്രതികരിക്കാൻ കൃപ നമ്മെ പ്രാപ്തരാക്കുന്നു. ഇടുങ്ങിയ വാതിൽ ദൈവം പാതി അടച്ചുവയ്ക്കുന്ന ഒരു വാതിലല്ല; അതു ക്രിസ്തുതന്നെയാണ് (യോഹ 10:9); വിനയത്തിലൂടെ നാം അതിൽ പ്രവേശിക്കുന്നു. അതുകൊണ്ടാണു പിൻപന്മാർ മുൻപന്മാരാകുന്നതും കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും വടക്കുനിന്നും തെക്കുനിന്നും ജനങ്ങൾ ദൈവരാജ്യത്തിൽ വിരുന്നിനിരിക്കുന്നതും."],
 conn:[["കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും ജനങ്ങൾ.","ലൂക്കാ 13:29 ഏശയ്യാ 49:12-നെയും സങ്കീർത്തനം 107:3-നെയും പ്രതിധ്വനിക്കുന്നു: എല്ലാ ദിക്കുകളിൽനിന്നും ദൈവം തന്റെ ജനത്തെ ഒരുമിച്ചുകൂട്ടുന്നു. മാർ തോമാ സുവിശേഷം നമ്മുടെ നാട്ടിലെത്തിച്ചപ്പോൾ ഈ വാഗ്ദാനം ഇന്ത്യയിലെത്തി."],["നക്ഷത്രങ്ങളെപ്പോലെ പ്രകാശിക്കുക.","ഫിലിപ്പി 2:15 ദാനിയേൽ 12:3-നെ ഓർമിപ്പിക്കുന്നു: അനേകരെ നീതിയിലേക്കു നയിക്കുന്നവർ നക്ഷത്രങ്ങളെപ്പോലെ എന്നേക്കും പ്രകാശിക്കും."]],
 altar:["കുർബാനയിൽ കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നുമുള്ള ജനങ്ങളോടൊപ്പം നാം ഇപ്പോൾത്തന്നെ ദൈവരാജ്യത്തിന്റെ മേശയിലിരിക്കുന്നു. ഈശോ വാഗ്ദാനം ചെയ്യുന്ന വിരുന്നിന്റെ മുന്നാസ്വാദനമാണു ദിവ്യകാരുണ്യസ്വീകരണം."],
 outline:[["ആരംഭം","ചോദിക്കുക: സ്വർഗത്തെപ്പറ്റി ഈശോയോട് ഒരു ചോദ്യം ചോദിക്കാമെങ്കിൽ നിങ്ങൾ എന്തു ചോദിക്കും? ഒരാൾ അവിടുത്തോടു കൃത്യമായും അതു ചോദിച്ചു."],["ഒന്നാം ആശയം · ആദ്യം കൃപ, പിന്നെ പരിശ്രമം","ഇച്ഛിക്കാനും പ്രവർത്തിക്കാനും നിന്നിൽ പ്രവർത്തിക്കുന്നതു ദൈവമാണ് (ഫിലി 2:13). നമ്മുടെ പരിശ്രമം കൃപയ്ക്കുള്ള ഉത്തരമാണ്; ഒരിക്കലും അതിനു പകരമല്ല."],["രണ്ടാം ആശയം · ഇടുങ്ങിയ വാതിൽ ക്രിസ്തുവാണ്","വിനയമാണ് അകത്തേക്കുള്ള വഴി. അഹങ്കാരികൾ അതിൽ കൊള്ളുന്നില്ല; എളിയവർ കൊള്ളുന്നു."],["മൂന്നാം ആശയം · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","“ഭയപ്പെടേണ്ടാ! ക്രിസ്തുവിനായി വാതിലുകൾ മലർക്കെ തുറക്കുവിൻ” എന്ന് അദ്ദേഹം ലോകത്തോടു പറഞ്ഞു. ഇടുങ്ങിയ വാതിൽ തുറക്കുക; അതു വിശാലമായ ഒരു വിരുന്നിലേക്കാണു തുറക്കുന്നതെന്നു നീ കാണും."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കൃപ എന്റെ മുമ്പേ പോകുന്നു; ഇന്നു ഞാൻ ആ വാതിലിലൂടെ നടക്കും.”"]],
 live:[["പരിശ്രമത്തിന്റെ ഒരു പ്രവൃത്തി (ഫിലിപ്പി 2:12)","നിനക്കു വില കൊടുക്കേണ്ടിവരുന്ന ഒരു സത്പ്രവൃത്തി ഇന്നു തിരഞ്ഞെടുത്ത്, കൃപയ്ക്കുള്ള ഉത്തരമായി അതു സമർപ്പിക്കുക."],["പിറുപിറുക്കാതെ പ്രകാശിക്കുക (ഫിലിപ്പി 2:14)","നക്ഷത്രംപോലെ പ്രകാശിക്കാനുള്ള ചെറിയ ഒരു വഴിയായി ഇന്നത്തെ ദിവസം പരാതിപറയാതെ ചെലവഴിക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","“നിന്നെക്കൂടാതെ നിന്നെ സൃഷ്ടിച്ച ദൈവം നിന്നെക്കൂടാതെ നിന്നെ രക്ഷിക്കുകയില്ല” (പ്രസംഗം 169). കൃപ എല്ലാം ചെയ്യുന്നു; നമ്മുടെ സ്വതന്ത്രമനസ്സിലൂടെയും അതിനോടൊപ്പവുമാണ് അതു ചെയ്യുന്നത്."]],
 magis:[["മതബോധനഗ്രന്ഥം 1996–2005","ദൈവവിളിക്ക് ഉത്തരം നൽകാൻ ദൈവം നൽകുന്ന സൗജന്യവും അനർഹവുമായ സഹായമാണു കൃപ; അതു നമ്മുടെ സ്വതന്ത്രപ്രതികരണത്തിനു മുമ്പേ പോകുന്നു, അതിനെ ഒരുക്കുന്നു, ഉണർത്തുന്നു."]],
 saints:[["ഒക്ടോബർ 22 · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","1978 മുതൽ 2005 വരെ മാർപാപ്പ; 1986-ൽ കേരളം സന്ദർശിച്ച് വിശുദ്ധ അൽഫോൻസാമ്മയെയും വിശുദ്ധ കുര്യാക്കോസ് ഏലിയാസ് ചാവറയച്ചനെയും വാഴ്ത്തപ്പെട്ടവരായി പ്രഖ്യാപിച്ചു. അദ്ദേഹത്തിന്റെ മാർപാപ്പാശുശ്രൂഷയുടെ ഉദ്ഘാടനവാർഷികമാണ് ഓർമദിനം."]],
 prayer:"ഈശോയേ, അങ്ങാണ് ഇടുങ്ങിയ വാതിൽ. അതിലൂടെ പ്രവേശിക്കാനുള്ള വിനയവും, എന്റെ ജീവിതത്തിന്റെ വാതിലുകൾ അങ്ങേക്കായി മലർക്കെ തുറക്കാനുള്ള വിശുദ്ധ ജോൺ പോൾ രണ്ടാമന്റെ ധൈര്യവും എനിക്കു നൽകണമേ. ആമേൻ."},
 {quick:["കൃപ എപ്പോഴും ആദ്യം വരുന്നു; നമ്മുടെ പരിശ്രമം നമ്മുടെ ഉത്തരമാണ്.","ഇടുങ്ങിയ വാതിൽ ക്രിസ്തുവാണ്; വിനയമാണ് അകത്തേക്കുള്ള വഴി.","“ഭയപ്പെടേണ്ടാ! ക്രിസ്തുവിനായി വാതിലുകൾ മലർക്കെ തുറക്കുവിൻ.”"],action:"നിനക്കു വില കൊടുക്കേണ്ടിവരുന്ന ഒരു സത്പ്രവൃത്തി ഇന്നു ചെയ്യുക.",question:"എന്റെ ജീവിതത്തിലെ ഏതു വാതിലാണു ഞാൻ ക്രിസ്തുവിനായി അടച്ചുവച്ചിരിക്കുന്നത്?",
  illus:["ഒരു ഉദാഹരണം","1986 ഫെബ്രുവരിയിൽ വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ കോട്ടയത്തും കൊച്ചിയിലും വന്ന്, സിസ്റ്റർ അൽഫോൻസായെയും ചാവറയച്ചനെയും വാഴ്ത്തപ്പെട്ടവരായി പ്രഖ്യാപിച്ചു. ആ ജനക്കൂട്ടത്തെ ഇന്നും പല മലയാളികളും ഓർക്കുന്നു. ക്രിസ്തുവിനായി വാതിലുകൾ തുറന്ന ഒരു മാർപാപ്പ നമ്മുടെ വാതിൽക്കൽ വന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 13:24, 29.",explain:"സ്വർഗത്തിലേക്കുള്ള വഴി ഒരു ചെറിയ വാതിൽപോലെയാണെന്ന് ഈശോ പറയുന്നു. ആളാകാൻ നോക്കാതെ, വിനയത്തോടും സ്നേഹത്തോടുംകൂടെയാണു നാം അതിലൂടെ കടക്കുന്നത്.",intention:"മാർപാപ്പയ്ക്കുവേണ്ടിയും, വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ സ്നേഹിച്ചതുപോലെ എല്ലാ യുവജനങ്ങൾക്കുംവേണ്ടിയും നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നാളെ നമുക്കു ചെയ്യാവുന്ന വിനയത്തിന്റെ ഒരു കാര്യം എന്താണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1996–2001","കൃപയും നമ്മുടെ സ്വതന്ത്രപ്രതികരണവും."]],kidsaint:["വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","പോളണ്ടിലെ ബാലനായിരുന്നപ്പോൾ കരോളിനു ഫുട്ബോളും നാടകവും ഇഷ്ടമായിരുന്നു. അവൻ വൈദികനും മെത്രാനും പിന്നെ മാർപാപ്പയുമായി; ഈശോ അവരെ സ്നേഹിക്കുന്നുവെന്നു യുവജനങ്ങളോടു പറയാൻ ലോകമെങ്ങും, കേരളത്തിൽപോലും, യാത്രചെയ്തു. പാഠം: ഈശോയുടേതായിരിക്കാൻ ഭയപ്പെടേണ്ടാ."],
  term:["റാസ","സീറോ മലബാർ കുർബാനയുടെ ആഘോഷപൂർവകമായ രൂപം. റാസ എന്ന സുറിയാനി വാക്കിനു രഹസ്യം എന്നാണ് അർഥം. വലിയ തിരുനാളുകളിൽ കൂടുതൽ ആഘോഷത്തോടും ഗീതങ്ങളോടും കർമങ്ങളോടുംകൂടെ റാസ അർപ്പിക്കുന്നു."],termMore:["ആരാധനക്രമത്തിൽ “രഹസ്യം” എന്നതിന്റെ അർഥമെന്ത്?","നമ്മുടെ പൗരസ്ത്യപാരമ്പര്യത്തിൽ കൂദാശകളെ രഹസ്യങ്ങൾ (റാസേ) എന്നു വിളിക്കുന്നു; കാരണം, ദൈവത്തിന്റെ മറഞ്ഞിരിക്കുന്ന രക്ഷാകരപ്രവൃത്തി അവയിൽ നമുക്കായി സന്നിഹിതമാകുന്നു."]},
 {homily:["പ്രിയപ്പെട്ടവരേ, “കർത്താവേ, രക്ഷപ്രാപിക്കുന്നവർ ചുരുക്കമാണോ?” എന്ന് ഒരാൾ ഈശോയോടു ചോദിച്ചു. ഈശോ ഒരു സംഖ്യ പറഞ്ഞില്ല. അവിടുന്നു പറഞ്ഞു: “ഇടുങ്ങിയ വാതിലിലൂടെ പ്രവേശിക്കുവാൻ പരിശ്രമിക്കുവിൻ.” എങ്ങനെയെന്നു പൗലോസ് വിശദീകരിക്കുന്നു: നിങ്ങളുടെ രക്ഷയ്ക്കായി പ്രവർത്തിക്കുവിൻ; കാരണം, നിങ്ങളിൽ പ്രവർത്തിക്കുന്നതു ദൈവമാണ്. കൃപ എപ്പോഴും ആദ്യം വരുന്നു; നമ്മുടെ പരിശ്രമം നമ്മുടെ ഉത്തരമാണ്.","ഇടുങ്ങിയ വാതിൽ ക്രിസ്തുതന്നെയാണ്; വിനയത്തോടെ നാം അതിൽ പ്രവേശിക്കുന്നു. അതുകൊണ്ടാണു പിൻപന്മാർ മുൻപന്മാരാകുന്നതും, കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും ജനങ്ങൾ ദൈവരാജ്യത്തിന്റെ മേശയിലേക്കു വരുന്നതും. കിഴക്കുനിന്നു മാർ തോമായിലൂടെ സുവിശേഷം നമ്മുടെ സ്വന്തം നാട്ടിലെത്തി.","1986-ൽ കേരളത്തിൽ വന്ന വിശുദ്ധ ജോൺ പോൾ രണ്ടാമനെ ഇന്നു നാം ഓർക്കുന്നു. മാർപാപ്പയെന്ന നിലയിൽ അദ്ദേഹത്തിന്റെ ആദ്യവാക്കുകൾ ഇതായിരുന്നു: “ഭയപ്പെടേണ്ടാ! ക്രിസ്തുവിനായി വാതിലുകൾ മലർക്കെ തുറക്കുവിൻ!” ഇന്നു നമ്മുടെ ഹൃദയവാതിലുകൾ തുറക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, വളരെ ചെറിയ ഒരു വാതിൽ കണ്ടിട്ടുണ്ടോ? അകത്തു കയറാൻ കുനിയണം. സ്വർഗത്തിലേക്കുള്ള വഴി അങ്ങനെയാണെന്ന് ഈശോ പറയുന്നു: തള്ളിക്കയറിയും ആളാകാൻ നോക്കിയുമല്ല, വിനയത്തോടെയാണു നാം അകത്തു കയറുന്നത്.","ഇന്നു ജോൺ പോൾ രണ്ടാമൻ മാർപാപ്പയെ നാം ഓർക്കുന്നു. അദ്ദേഹം പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ!” ഇന്ന് ഈശോയ്ക്കുവേണ്ടി ധൈര്യവും ദയയുമുള്ളവരായിരിക്കുക."]});

put("2026-10-23","smc","en",{title:"Second Friday of Moses",readTitle:"Readings of the day",
 readings:[["Epistle","Ephesians 2:1–10","You are saved by his grace"],["Gospel","John 12:44–50","Jesus came to save the world"]],alt:"",
 verse:"…for I came not to judge the world, but to save the world.",cite:"John 12:47",
 theo:["Paul draws a before-and-after picture of every Christian life. Before: “dead through trespasses”. After: “made alive together with Christ… raised up with him and seated with him in the heavenly places”. What made the difference? “By grace you have been saved through faith, and this is not your own doing; it is the gift of God.” And immediately he adds that we are “created in Christ Jesus for good works”. Grace does not make works unnecessary; it makes them possible.","In the Gospel Jesus says the same from his side: “I have come as light into the world, so that everyone who believes in me should not remain in the darkness… I came not to judge the world, but to save the world.” On this Friday, the day of the Cross, we remember the price of that saving love. The Cross is not God's condemnation of the world; it is his rescue of it."],
 conn:[["Light into the world.","John 12:46 fulfils Isaiah 9:2: “The people who walked in darkness have seen a great light.”"],["God's workmanship.","“We are what he has made” (Ephesians 2:10); the Greek poiēma, a work of art. We are God's poem, written for good works."]],
 altar:["On Fridays our tradition keeps the memory of the Cross. Every Qurbana makes present the one sacrifice of the Cross, not to condemn us, but to give us life."],
 outline:[["Opening","Ask: if someone painted a portrait of you as God sees you, what would it show?"],["Point 1 · Dead, then alive","Paul's before-and-after. Name what deadness looks like today: hopelessness, addiction, coldness to God."],["Point 2 · By grace, for good works","We are God's work of art (Ephesians 2:10). Grace gives us life so that we can live it in love."],["Take-home line","“I am God's work of art, made for good works.”"]],
 live:[["Friday at the Cross (John 12:47)","Spend five minutes before a crucifix today, thanking Christ for saving rather than condemning."],["One good work prepared for you (Ephesians 2:10)","Ask in the morning: “Lord, what good work have you prepared for me today?” and look for it."]],
 fathers:[["St John Chrysostom","Commenting on Ephesians 2, he says that even faith itself is God's gift, so that no one may boast; yet God does not save the unwilling (Homilies on Ephesians 4)."]],
 magis:[["Council of Trent, Decree on Justification 8; Catechism 1987–1995","We are justified freely by grace; nothing that precedes justification, neither faith nor works, merits the grace itself."]],
 saints:[["In the Syro-Malabar calendar","No memorial assigned today. Fridays recall the Passion; many families keep a simple fast or abstinence."]],
 prayer:"Lord Jesus, you came not to condemn but to save. Thank you for raising me from death by your grace. Let me walk today in the good works you have prepared for me. Amen."},
 {quick:["We were dead in sin; by grace we are alive in Christ.","Grace does not cancel good works; it makes them possible.","Jesus came not to judge the world but to save it."],action:"Spend five minutes before a crucifix today, giving thanks.",question:"What good work has God prepared for me today?",
  illus:["An illustration","A potter in Kerala's clay villages takes a lump of wet clay that is useless on its own and shapes it into a lamp. Paul says we are God's handiwork: shaped by him, to give light."],kids:"",diaspora:"",
  family:{read:"Read together: Ephesians 2:8–10.",explain:"God saves us because he loves us, not because we are perfect. And he made each of us like a beautiful work of art, to do good things.",intention:"We pray for people who feel worthless, that they may know they are God's work of art.",ask:"Ask: “What good thing did God help you do today?”"},
  catechism:[["CCC 1987–1995","Justification by grace."]],kidsaint:["Saint Alphonsa","Our own saint from Bharananganam suffered much pain, but she offered it with Jesus on the cross and was always gentle. Lesson: Jesus can turn our pain into love."],
  term:["Sleeva (സ്ലീവാ)","The Syriac word for the Cross. Our Mar Thoma Sleeva has no corpus: it is the Cross of the risen Christ, blossoming with life and crowned by the dove of the Holy Spirit."],termMore:["Why Fridays?","From the earliest centuries Christians have kept Friday as the day of the Lord's Passion, with prayer and a small sacrifice."]},
 {homily:["Dear friends, Paul paints a before-and-after picture: once we were dead in our sins; now we are alive with Christ. What made the difference? “By grace you have been saved through faith… it is the gift of God.” And then he adds: we are God's work of art, created for good works.","In the Gospel Jesus says, “I came not to judge the world, but to save the world.” On this Friday we look at the Cross. It is not God's condemnation of the world; it is his rescue.","So today, let us thank him, and let us ask: “Lord, what good work have you prepared for me today?” He has one ready. Amen."],
  kids:["Children, who has made something with clay? A lump of clay becomes a cup or a lamp. God made each of you like a beautiful work of art!","And Jesus did not come to scold the world but to save it. Today, say thank you to Jesus on the cross, and do one good work he has prepared for you."]});

put("2026-10-23","smc","ml",{title:"മൂശെക്കാലം രണ്ടാം വെള്ളി",readTitle:"ഇന്നത്തെ വായനകൾ",
 readings:[["ലേഖനം","എഫേസോസ് 2:1–10","കൃപയാൽ നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു"],["സുവിശേഷം","യോഹന്നാൻ 12:44–50","ലോകത്തെ രക്ഷിക്കാൻ ഈശോ വന്നു"]],alt:"",
 verse:"ഞാൻ വന്നിരിക്കുന്നത് ലോകത്തെ വിധിക്കാനല്ല, രക്ഷിക്കാനാണ്.",cite:"യോഹന്നാൻ 12:47",
 theo:["ഓരോ ക്രൈസ്തവജീവിതത്തിന്റെയും മുമ്പും പിമ്പുമുള്ള ഒരു ചിത്രം പൗലോസ് വരയ്ക്കുന്നു. മുമ്പ്: “അപരാധങ്ങളാൽ മരിച്ചവർ”. പിമ്പ്: “ക്രിസ്തുവിനോടുകൂടെ ജീവിപ്പിക്കപ്പെട്ടവർ… അവിടുത്തോടൊപ്പം ഉയിർപ്പിക്കപ്പെട്ട് സ്വർഗീയസ്ഥലങ്ങളിൽ ഇരുത്തപ്പെട്ടവർ”. എന്താണു മാറ്റം വരുത്തിയത്? “കൃപയാൽ വിശ്വാസംവഴി നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു; ഇതു നിങ്ങളുടെ പ്രവൃത്തിയല്ല, ദൈവത്തിന്റെ ദാനമാണ്.” ഉടനെ അവൻ കൂട്ടിച്ചേർക്കുന്നു: നാം “സത്പ്രവൃത്തികൾക്കായി ക്രിസ്തുയേശുവിൽ സൃഷ്ടിക്കപ്പെട്ടവരാണ്”. കൃപ പ്രവൃത്തികളെ അനാവശ്യമാക്കുന്നില്ല; അവയെ സാധ്യമാക്കുന്നു.","സുവിശേഷത്തിൽ ഈശോ തന്റെ ഭാഗത്തുനിന്ന് അതുതന്നെ പറയുന്നു: “എന്നിൽ വിശ്വസിക്കുന്നവരാരും അന്ധകാരത്തിൽ വസിക്കാതിരിക്കേണ്ടതിന് ഞാൻ വെളിച്ചമായി ലോകത്തിലേക്കു വന്നിരിക്കുന്നു… ഞാൻ വന്നിരിക്കുന്നത് ലോകത്തെ വിധിക്കാനല്ല, രക്ഷിക്കാനാണ്.” കുരിശിന്റെ ദിവസമായ ഈ വെള്ളിയാഴ്ച, ആ രക്ഷാകരസ്നേഹത്തിന്റെ വില നാം ഓർക്കുന്നു. കുരിശ് ലോകത്തിന്മേലുള്ള ദൈവത്തിന്റെ ശിക്ഷാവിധിയല്ല; ലോകത്തെ അവിടുന്നു രക്ഷിക്കുന്നതാണ്."],
 conn:[["ലോകത്തിലേക്കു വന്ന വെളിച്ചം.","യോഹന്നാൻ 12:46 ഏശയ്യാ 9:2 നിറവേറ്റുന്നു: “അന്ധകാരത്തിൽ നടന്ന ജനം വലിയ ഒരു പ്രകാശം കണ്ടു.”"],["ദൈവത്തിന്റെ കരവേല.","“നാം അവിടുത്തെ കരവേലയാണ്” (എഫേ 2:10); ഗ്രീക്കിൽ പൊയേമ, ഒരു കലാസൃഷ്ടി. സത്പ്രവൃത്തികൾക്കായി എഴുതപ്പെട്ട ദൈവത്തിന്റെ കവിതയാണു നാം."]],
 altar:["വെള്ളിയാഴ്ചകളിൽ നമ്മുടെ പാരമ്പര്യം കുരിശിന്റെ ഓർമ സൂക്ഷിക്കുന്നു. ഓരോ കുർബാനയും കുരിശിലെ ഏകബലിയെ സന്നിഹിതമാക്കുന്നു; നമ്മെ ശിക്ഷിക്കാനല്ല, ജീവൻ നൽകാൻ."],
 outline:[["ആരംഭം","ചോദിക്കുക: ദൈവം നിങ്ങളെ കാണുന്നതുപോലെ ഒരാൾ നിങ്ങളുടെ ഛായാചിത്രം വരച്ചാൽ അതിൽ എന്തായിരിക്കും?"],["ഒന്നാം ആശയം · മരിച്ചവർ, പിന്നെ ജീവിക്കുന്നവർ","പൗലോസിന്റെ മുമ്പും പിമ്പും. ഇന്നത്തെ മരണാവസ്ഥകൾക്കു പേരു പറയുക: പ്രത്യാശയില്ലായ്മ, ആസക്തി, ദൈവത്തോടുള്ള തണുപ്പ്."],["രണ്ടാം ആശയം · കൃപയാൽ, സത്പ്രവൃത്തികൾക്കായി","നാം ദൈവത്തിന്റെ കലാസൃഷ്ടിയാണ് (എഫേ 2:10). സ്നേഹത്തിൽ ജീവിക്കാൻവേണ്ടിയാണു കൃപ നമുക്കു ജീവൻ നൽകുന്നത്."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“സത്പ്രവൃത്തികൾക്കായി സൃഷ്ടിക്കപ്പെട്ട ദൈവത്തിന്റെ കലാസൃഷ്ടിയാണു ഞാൻ.”"]],
 live:[["കുരിശിനരികിൽ വെള്ളിയാഴ്ച (യോഹന്നാൻ 12:47)","ശിക്ഷിക്കാതെ രക്ഷിച്ചതിനു ക്രിസ്തുവിനു നന്ദി പറഞ്ഞുകൊണ്ട് ഇന്ന് അഞ്ചു മിനിറ്റ് ഒരു ക്രൂശിതരൂപത്തിനു മുമ്പിൽ ചെലവഴിക്കുക."],["നിനക്കായി ഒരുക്കിയ ഒരു സത്പ്രവൃത്തി (എഫേസോസ് 2:10)","രാവിലെ ചോദിക്കുക: “കർത്താവേ, ഇന്ന് എനിക്കായി അങ്ങ് ഒരുക്കിയിരിക്കുന്ന സത്പ്രവൃത്തി ഏതാണ്?” അതിനായി ശ്രദ്ധിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","എഫേസോസ് 2 വ്യാഖ്യാനിച്ച് അദ്ദേഹം പറയുന്നു: ആരും പ്രശംസിക്കാതിരിക്കാൻ വിശ്വാസംപോലും ദൈവദാനമാണ്; എങ്കിലും ഇഷ്ടമില്ലാത്തവരെ ദൈവം രക്ഷിക്കുന്നില്ല (എഫേസോസിനെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 4)."]],
 magis:[["ത്രെന്തോസ് കൗൺസിൽ, നീതീകരണത്തെപ്പറ്റിയുള്ള ഡിക്രി 8; മതബോധനഗ്രന്ഥം 1987–1995","കൃപയാൽ സൗജന്യമായാണു നാം നീതീകരിക്കപ്പെടുന്നത്; നീതീകരണത്തിനു മുമ്പുള്ള ഒന്നും, വിശ്വാസമോ പ്രവൃത്തികളോ, ആ കൃപ അർഹിക്കുന്നില്ല."]],
 saints:[["സീറോ മലബാർ കലണ്ടറിൽ","ഇന്ന് ഓർമയൊന്നും നിശ്ചയിച്ചിട്ടില്ല. വെള്ളിയാഴ്ചകൾ പീഡാസഹനം ഓർമിപ്പിക്കുന്നു; പല കുടുംബങ്ങളും ലഘുവായ ഉപവാസമോ മാംസവർജനമോ പാലിക്കുന്നു."]],
 prayer:"ഈശോയേ, ശിക്ഷിക്കാനല്ല, രക്ഷിക്കാനാണ് അങ്ങു വന്നത്. അങ്ങയുടെ കൃപയാൽ എന്നെ മരണത്തിൽനിന്ന് ഉയിർപ്പിച്ചതിനു നന്ദി. എനിക്കായി അങ്ങ് ഒരുക്കിയിരിക്കുന്ന സത്പ്രവൃത്തികളിൽ ഇന്നു നടക്കാൻ എന്നെ സഹായിക്കണമേ. ആമേൻ."},
 {quick:["പാപത്തിൽ നാം മരിച്ചവരായിരുന്നു; കൃപയാൽ ക്രിസ്തുവിൽ നാം ജീവിക്കുന്നു.","കൃപ സത്പ്രവൃത്തികളെ റദ്ദാക്കുന്നില്ല; അവയെ സാധ്യമാക്കുന്നു.","ഈശോ വന്നതു ലോകത്തെ വിധിക്കാനല്ല, രക്ഷിക്കാനാണ്."],action:"ഇന്ന് അഞ്ചു മിനിറ്റ് ഒരു ക്രൂശിതരൂപത്തിനു മുമ്പിൽ നന്ദിയോടെ ചെലവഴിക്കുക.",question:"ഇന്ന് എനിക്കായി ദൈവം ഒരുക്കിയിരിക്കുന്ന സത്പ്രവൃത്തി ഏതാണ്?",
  illus:["ഒരു ഉദാഹരണം","തനിയെ ഒന്നിനും കൊള്ളാത്ത നനഞ്ഞ ഒരു പിടി കളിമണ്ണ് എടുത്ത് ഒരു കുശവൻ അതിനെ ഒരു വിളക്കാക്കി രൂപപ്പെടുത്തുന്നു. നാം ദൈവത്തിന്റെ കരവേലയാണെന്നു പൗലോസ് പറയുന്നു: വെളിച്ചം നൽകാൻ അവിടുന്നു രൂപപ്പെടുത്തിയവർ."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: എഫേസോസ് 2:8–10.",explain:"നാം പൂർണരായതുകൊണ്ടല്ല, ദൈവം നമ്മെ സ്നേഹിക്കുന്നതുകൊണ്ടാണ് അവിടുന്നു നമ്മെ രക്ഷിക്കുന്നത്. നല്ല കാര്യങ്ങൾ ചെയ്യാൻ അവിടുന്നു നമ്മെ ഓരോരുത്തരെയും മനോഹരമായ ഒരു കലാസൃഷ്ടിയായി ഉണ്ടാക്കി.",intention:"തങ്ങൾ വിലയില്ലാത്തവരാണെന്നു തോന്നുന്നവർ, തങ്ങൾ ദൈവത്തിന്റെ കലാസൃഷ്ടിയാണെന്ന് അറിയാൻ അവർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഇന്നു ദൈവം നിന്നെ സഹായിച്ചു ചെയ്യിച്ച നല്ല കാര്യം എന്താണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1987–1995","കൃപയാലുള്ള നീതീകരണം."]],kidsaint:["വിശുദ്ധ അൽഫോൻസാമ്മ","ഭരണങ്ങാനത്തുനിന്നുള്ള നമ്മുടെ സ്വന്തം വിശുദ്ധ വളരെയധികം വേദന സഹിച്ചു; പക്ഷേ കുരിശിലെ ഈശോയോടൊപ്പം അവൾ അതു സമർപ്പിച്ചു; എപ്പോഴും സൗമ്യയായിരുന്നു. പാഠം: നമ്മുടെ വേദനയെ ഈശോയ്ക്കു സ്നേഹമാക്കി മാറ്റാൻ കഴിയും."],
  term:["സ്ലീവാ","കുരിശ് എന്നതിന്റെ സുറിയാനി വാക്ക്. നമ്മുടെ മാർ തോമാ സ്ലീവായിൽ ക്രൂശിതരൂപമില്ല: ജീവനാൽ പൂവിടുന്ന, പരിശുദ്ധാത്മാവിന്റെ പ്രാവിനാൽ കിരീടമണിഞ്ഞ, ഉത്ഥിതനായ ക്രിസ്തുവിന്റെ കുരിശാണത്."],termMore:["എന്തുകൊണ്ടു വെള്ളിയാഴ്ചകൾ?","ആദ്യനൂറ്റാണ്ടുകൾമുതൽ ക്രൈസ്തവർ വെള്ളിയാഴ്ചയെ കർത്താവിന്റെ പീഡാസഹനത്തിന്റെ ദിവസമായി, പ്രാർഥനയോടും ചെറിയ ത്യാഗത്തോടുംകൂടെ, ആചരിച്ചുപോരുന്നു."]},
 {homily:["പ്രിയപ്പെട്ടവരേ, മുമ്പും പിമ്പുമുള്ള ഒരു ചിത്രം പൗലോസ് വരയ്ക്കുന്നു: ഒരിക്കൽ നാം പാപങ്ങളിൽ മരിച്ചവരായിരുന്നു; ഇപ്പോൾ ക്രിസ്തുവിനോടുകൂടെ ജീവിക്കുന്നവരാണ്. എന്താണു മാറ്റം വരുത്തിയത്? “കൃപയാൽ വിശ്വാസംവഴി നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു… അതു ദൈവത്തിന്റെ ദാനമാണ്.” പിന്നെ അവൻ കൂട്ടിച്ചേർക്കുന്നു: സത്പ്രവൃത്തികൾക്കായി സൃഷ്ടിക്കപ്പെട്ട ദൈവത്തിന്റെ കലാസൃഷ്ടിയാണു നാം.","സുവിശേഷത്തിൽ ഈശോ പറയുന്നു: “ഞാൻ വന്നിരിക്കുന്നത് ലോകത്തെ വിധിക്കാനല്ല, രക്ഷിക്കാനാണ്.” ഈ വെള്ളിയാഴ്ച നാം കുരിശിലേക്കു നോക്കുന്നു. അതു ലോകത്തിന്മേലുള്ള ദൈവത്തിന്റെ ശിക്ഷാവിധിയല്ല; ലോകത്തെ അവിടുന്നു രക്ഷിക്കുന്നതാണ്.","അതുകൊണ്ട് ഇന്ന് അവിടുത്തേക്കു നന്ദി പറയാം; ചോദിക്കാം: “കർത്താവേ, ഇന്ന് എനിക്കായി അങ്ങ് ഒരുക്കിയിരിക്കുന്ന സത്പ്രവൃത്തി ഏതാണ്?” അവിടുന്ന് ഒന്ന് ഒരുക്കിവച്ചിട്ടുണ്ട്. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ആരാണു കളിമണ്ണുകൊണ്ട് എന്തെങ്കിലും ഉണ്ടാക്കിയിട്ടുള്ളത്? ഒരു പിടി കളിമണ്ണ് ഒരു കപ്പോ വിളക്കോ ആകുന്നു. ദൈവം നിങ്ങളെ ഓരോരുത്തരെയും മനോഹരമായ ഒരു കലാസൃഷ്ടിപോലെ ഉണ്ടാക്കി!","ഈശോ വന്നതു ലോകത്തെ ശകാരിക്കാനല്ല, രക്ഷിക്കാനാണ്. ഇന്നു കുരിശിലെ ഈശോയ്ക്കു നന്ദി പറയുക; അവിടുന്നു നിങ്ങൾക്കായി ഒരുക്കിയ ഒരു നല്ല കാര്യം ചെയ്യുക."]});

put("2026-10-24","smc","en",{title:"Second Saturday of Moses",readTitle:"Readings of the day",
 readings:[["Epistle","Philippians 1:27–2:4","A sign of salvation from God"],["Gospel","Luke 9:49–56","Whoever is not against you is for you"]],alt:"",
 verse:"Do not stop him; for whoever is not against you is for you.",cite:"Luke 9:50",
 theo:["Two temptations of zealous disciples appear in today's Gospel. John wants to stop a man casting out demons in Jesus' name “because he does not follow with us”. Then James and John want to call down fire on a Samaritan village that would not welcome Jesus. Jesus refuses both: he rebukes them, and they simply go on to another village.","Paul shows the opposite spirit: “Do nothing from selfish ambition or conceit, but in humility regard others as better than yourselves.” Catholic faith is not tribal. We hold the fullness of the truth with gratitude, yet we rejoice wherever the name of Jesus brings healing, and we answer rejection not with fire but with patience. Unity among Christians is a sign of salvation to the world (Philippians 1:28; John 17:21)."],
 conn:[["Elijah's fire.","James and John recall Elijah calling down fire on the king's soldiers (2 Kings 1:10). Jesus, who is greater than Elijah, shows a different power: mercy."],["One mind.","“Be of the same mind, having the same love” (Philippians 2:2) prepares the hymn of Christ's self-emptying (Philippians 2:5–11)."]],
 altar:["The Qurbana is the sacrament of unity. We cannot receive the one Body and keep our divisions; the altar sends us to make peace."],
 outline:[["Opening","Ask: when did you last feel “Those people are not with us”?"],["Point 1 · Rejoice in good done in Jesus' name","Jesus widens the disciples' hearts. Ecumenism begins with gratitude for every good done in his name."],["Point 2 · No fire from heaven","Jesus rebukes the desire for revenge. Christians answer rejection with patience."],["Take-home line","“Lord, give me a wide heart and a gentle tongue.”"]],
 live:[["Regard others as better (Philippians 2:3)","In one conversation today, let the other person's opinion matter more than yours."],["Pray for Christian unity (Luke 9:50)","Pray today for one Christian community different from your own."]],
 fathers:[["St Ambrose","Commenting on Luke 9:55, he notes that the Lord did not punish the Samaritans; the patience of Christ is the true strength of his disciples (Exposition of Luke 7)."]],
 magis:[["Unitatis Redintegratio 3–4; Catechism 819–822","Elements of sanctification and truth exist outside the visible structure of the Catholic Church; the desire for unity is a gift of Christ and a call of the Holy Spirit."]],
 saints:[["Saturday","Saturdays are traditionally dedicated to the Blessed Virgin Mary, Mother of the Church and of unity."]],
 prayer:"Lord Jesus, widen my heart to rejoice in every good done in your name, and keep me from the fire of anger. Make us one, as you and the Father are one. Amen."},
 {quick:["Rejoice wherever good is done in Jesus' name.","Jesus rebukes the desire for revenge.","Humility makes unity possible."],action:"In one conversation today, let the other person's view matter more than yours.",question:"Whom have I excluded because “they are not with us”?",
  illus:["An illustration","In many Kerala towns, Catholic, Orthodox, Jacobite and Marthoma Christians all trace their faith to St Thomas. Where they pray and serve together after floods or tragedies, people see Christ more clearly."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 9:49–50.",explain:"Jesus' friends were angry that someone else was doing good in Jesus' name. Jesus said: be happy when anyone does good in my name.",intention:"We pray for all Christians to be united.",ask:"Ask: “Did someone different from us do something good this week?”"},
  catechism:[["CCC 820–822","The gift and task of Christian unity."]],kidsaint:["The Blessed Virgin Mary","Mary was with all the apostles in the upper room, praying together (Acts 1:14). She always brings people together around Jesus. Lesson: be a peacemaker in your class."],
  term:["Ramsha (റംശാ)","The evening prayer of the East Syriac tradition, the Church's prayer at sunset. Many Syro-Malabar parishes and religious houses pray Ramsha daily."],termMore:["Why pray in the evening?","The psalm says: “Let my prayer be counted as incense before you, and the lifting up of my hands as an evening sacrifice” (Psalm 141:2). The day is offered back to God."]},
 {homily:["Dear friends, the disciples in today's Gospel are zealous, but their zeal goes wrong twice. First, they want to stop a man who is doing good in Jesus' name, “because he does not follow with us.” Then they want fire from heaven on a village that rejected Jesus. Twice Jesus says no.","Paul tells us the spirit Jesus wants: “Do nothing from selfish ambition or conceit, but in humility regard others as better than yourselves.” We hold the faith of the Church with joy, yet we rejoice wherever Christ's name brings healing, and we answer rejection with patience.","Let us pray today for Christian unity, and ask Mary, who prayed with all the apostles, to make us peacemakers. Amen."],
  kids:["Children, sometimes we say, “That team is not our team!” Jesus' friends said that about someone who was doing good. Jesus said: be happy when anyone does good in my name.","Jesus never wants us to take revenge. If someone is unkind to you today, be patient and kind back."]});

put("2026-10-24","smc","ml",{title:"മൂശെക്കാലം രണ്ടാം ശനി",readTitle:"ഇന്നത്തെ വായനകൾ",
 readings:[["ലേഖനം","ഫിലിപ്പി 1:27–2:4","ദൈവത്തിൽനിന്നുള്ള രക്ഷയുടെ അടയാളം"],["സുവിശേഷം","ലൂക്കാ 9:49–56","നിങ്ങൾക്ക് എതിരല്ലാത്തവൻ നിങ്ങളുടെ ഭാഗത്താണ്"]],alt:"",
 verse:"അവനെ തടയേണ്ടാ, എന്തെന്നാൽ, നിങ്ങൾക്ക് എതിരല്ലാത്തവൻ നിങ്ങളുടെ ഭാഗത്താണ്.",cite:"ലൂക്കാ 9:50",
 theo:["തീക്ഷ്ണതയുള്ള ശിഷ്യരുടെ രണ്ടു പ്രലോഭനങ്ങൾ ഇന്നത്തെ സുവിശേഷത്തിൽ കാണാം. ഈശോയുടെ നാമത്തിൽ പിശാചുക്കളെ പുറത്താക്കുന്ന ഒരുവനെ, “അവൻ ഞങ്ങളോടൊപ്പം അനുഗമിക്കാത്തതിനാൽ” തടയാൻ യോഹന്നാൻ ആഗ്രഹിക്കുന്നു. പിന്നെ, ഈശോയെ സ്വീകരിക്കാത്ത ഒരു സമരിയാക്കാരുടെ ഗ്രാമത്തിന്മേൽ അഗ്നി ഇറക്കാൻ യാക്കോബും യോഹന്നാനും ആഗ്രഹിക്കുന്നു. ഈശോ രണ്ടും നിരസിക്കുന്നു: അവിടുന്ന് അവരെ ശാസിക്കുന്നു; അവർ വെറുതെ മറ്റൊരു ഗ്രാമത്തിലേക്കു പോകുന്നു.","വിപരീതമായ മനോഭാവം പൗലോസ് കാണിക്കുന്നു: സ്വാർഥതയോ ദുരഭിമാനമോ നിമിത്തം ഒന്നും ചെയ്യാതെ, വിനയപൂർവം മറ്റുള്ളവരെ നിങ്ങളെക്കാൾ ശ്രേഷ്ഠരായി കരുതുവിൻ. കത്തോലിക്കാവിശ്വാസം ഗോത്രീയമല്ല. സത്യത്തിന്റെ പൂർണത നാം കൃതജ്ഞതയോടെ സൂക്ഷിക്കുന്നു; എങ്കിലും ഈശോയുടെ നാമം സൗഖ്യം നൽകുന്നിടത്തെല്ലാം നാം സന്തോഷിക്കുന്നു; തിരസ്കരണത്തിന് അഗ്നികൊണ്ടല്ല, ക്ഷമകൊണ്ടു നാം ഉത്തരം നൽകുന്നു. ക്രൈസ്തവരുടെ ഐക്യം ലോകത്തിനു രക്ഷയുടെ അടയാളമാണ് (ഫിലി 1:28; യോഹ 17:21)."],
 conn:[["ഏലിയായുടെ അഗ്നി.","രാജാവിന്റെ പടയാളികളുടെമേൽ അഗ്നി ഇറക്കിയ ഏലിയായെ യാക്കോബും യോഹന്നാനും ഓർമിപ്പിക്കുന്നു (2 രാജാ 1:10). ഏലിയായെക്കാൾ വലിയവനായ ഈശോ മറ്റൊരു ശക്തി കാണിക്കുന്നു: കരുണ."],["ഒരേ മനസ്സ്.","“ഒരേ മനസ്സും ഒരേ സ്നേഹവും” (ഫിലി 2:2) ക്രിസ്തുവിന്റെ സ്വയംശൂന്യവത്കരണത്തിന്റെ ഗീതത്തിന് (ഫിലി 2:5–11) ഒരുക്കുന്നു."]],
 altar:["ഐക്യത്തിന്റെ കൂദാശയാണു കുർബാന. ഏകശരീരം സ്വീകരിച്ചിട്ടു നമ്മുടെ ഭിന്നതകൾ സൂക്ഷിക്കാനാവില്ല; സമാധാനം സ്ഥാപിക്കാൻ ബലിപീഠം നമ്മെ അയയ്ക്കുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: “ആ ആളുകൾ നമ്മുടെ കൂട്ടത്തിലുള്ളവരല്ല” എന്ന് അവസാനമായി നിങ്ങൾക്കു തോന്നിയത് എപ്പോഴാണ്?"],["ഒന്നാം ആശയം · ഈശോയുടെ നാമത്തിൽ ചെയ്യുന്ന നന്മയിൽ സന്തോഷിക്കുക","ഈശോ ശിഷ്യരുടെ ഹൃദയങ്ങളെ വിശാലമാക്കുന്നു. അവിടുത്തെ നാമത്തിൽ ചെയ്യുന്ന ഓരോ നന്മയ്ക്കുമുള്ള കൃതജ്ഞതയിൽനിന്നാണ് എക്യുമെനിസം ആരംഭിക്കുന്നത്."],["രണ്ടാം ആശയം · സ്വർഗത്തിൽനിന്ന് അഗ്നി വേണ്ടാ","പ്രതികാരത്തിനുള്ള ആഗ്രഹത്തെ ഈശോ ശാസിക്കുന്നു. തിരസ്കരണത്തിനു ക്രൈസ്തവർ ക്ഷമകൊണ്ട് ഉത്തരം നൽകുന്നു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, എനിക്കു വിശാലമായ ഹൃദയവും സൗമ്യമായ നാവും നൽകണമേ.”"]],
 live:[["മറ്റുള്ളവരെ ശ്രേഷ്ഠരായി കരുതുക (ഫിലിപ്പി 2:3)","ഇന്ന് ഒരു സംഭാഷണത്തിലെങ്കിലും, നിന്റെ അഭിപ്രായത്തെക്കാൾ മറ്റേയാളുടെ അഭിപ്രായത്തിനു വില കൊടുക്കുക."],["ക്രൈസ്തവൈക്യത്തിനായി പ്രാർഥിക്കുക (ലൂക്കാ 9:50)","നിന്റേതിൽനിന്നു വ്യത്യസ്തമായ ഒരു ക്രൈസ്തവസമൂഹത്തിനുവേണ്ടി ഇന്നു പ്രാർഥിക്കുക."]],
 fathers:[["വിശുദ്ധ അംബ്രോസ്","ലൂക്കാ 9:55 വ്യാഖ്യാനിച്ച് അദ്ദേഹം ശ്രദ്ധിക്കുന്നു: കർത്താവു സമരിയാക്കാരെ ശിക്ഷിച്ചില്ല; ക്രിസ്തുവിന്റെ ക്ഷമയാണ് അവിടുത്തെ ശിഷ്യരുടെ യഥാർഥ ശക്തി (ലൂക്കായുടെ വ്യാഖ്യാനം 7)."]],
 magis:[["ഊണിത്താത്തിസ് റെദിന്തെഗ്രാസിയോ 3–4; മതബോധനഗ്രന്ഥം 819–822","വിശുദ്ധീകരണത്തിന്റെയും സത്യത്തിന്റെയും ഘടകങ്ങൾ കത്തോലിക്കാസഭയുടെ ദൃശ്യഘടനയ്ക്കു പുറത്തുമുണ്ട്; ഐക്യത്തിനുള്ള ആഗ്രഹം ക്രിസ്തുവിന്റെ ദാനവും പരിശുദ്ധാത്മാവിന്റെ വിളിയുമാണ്."]],
 saints:[["ശനിയാഴ്ച","ശനിയാഴ്ചകൾ പരമ്പരാഗതമായി സഭയുടെയും ഐക്യത്തിന്റെയും അമ്മയായ പരിശുദ്ധ കന്യകാമറിയത്തിനു സമർപ്പിക്കപ്പെട്ടിരിക്കുന്നു."]],
 prayer:"ഈശോയേ, അങ്ങയുടെ നാമത്തിൽ ചെയ്യപ്പെടുന്ന എല്ലാ നന്മയിലും സന്തോഷിക്കാൻ എന്റെ ഹൃദയം വിശാലമാക്കണമേ; കോപാഗ്നിയിൽനിന്ന് എന്നെ കാക്കണമേ. അങ്ങും പിതാവും ഒന്നായിരിക്കുന്നതുപോലെ ഞങ്ങളെ ഒന്നാക്കണമേ. ആമേൻ."},
 {quick:["ഈശോയുടെ നാമത്തിൽ നന്മ ചെയ്യപ്പെടുന്നിടത്തെല്ലാം സന്തോഷിക്കുക.","പ്രതികാരത്തിനുള്ള ആഗ്രഹത്തെ ഈശോ ശാസിക്കുന്നു.","വിനയമാണ് ഐക്യത്തെ സാധ്യമാക്കുന്നത്."],action:"ഇന്ന് ഒരു സംഭാഷണത്തിലെങ്കിലും നിന്റെ അഭിപ്രായത്തെക്കാൾ മറ്റേയാളുടേതിനു വില കൊടുക്കുക.",question:"“അവർ നമ്മുടെ കൂട്ടത്തിലുള്ളവരല്ല” എന്നു പറഞ്ഞു ഞാൻ ആരെയാണ് ഒഴിവാക്കിയിരിക്കുന്നത്?",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പല പട്ടണങ്ങളിലും കത്തോലിക്കരും ഓർത്തഡോക്സുകാരും യാക്കോബായക്കാരും മാർത്തോമ്മാക്കാരും തങ്ങളുടെ വിശ്വാസം മാർ തോമായിൽനിന്നാണെന്നു പറയുന്നു. വെള്ളപ്പൊക്കത്തിലോ ദുരന്തങ്ങളിലോ അവർ ഒന്നിച്ചു പ്രാർഥിക്കുകയും ശുശ്രൂഷിക്കുകയും ചെയ്യുമ്പോൾ ആളുകൾ ക്രിസ്തുവിനെ കൂടുതൽ തെളിമയോടെ കാണുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 9:49–50.",explain:"ഈശോയുടെ നാമത്തിൽ മറ്റൊരാൾ നന്മ ചെയ്യുന്നതിൽ ഈശോയുടെ കൂട്ടുകാർക്കു ദേഷ്യം വന്നു. ഈശോ പറഞ്ഞു: എന്റെ നാമത്തിൽ ആരു നന്മ ചെയ്താലും സന്തോഷിക്കുക.",intention:"എല്ലാ ക്രൈസ്തവരും ഒന്നാകാൻവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മിൽനിന്നു വ്യത്യസ്തനായ ആരെങ്കിലും ഈ ആഴ്ച ഒരു നല്ല കാര്യം ചെയ്തോ?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 820–822","ക്രൈസ്തവൈക്യം: ദാനവും കടമയും."]],kidsaint:["പരിശുദ്ധ കന്യകാമറിയം","മാളികമുറിയിൽ എല്ലാ ശ്ലീഹന്മാരോടുമൊപ്പം മറിയം ഒന്നിച്ചു പ്രാർഥിച്ചു (അപ്പ 1:14). അവൾ എപ്പോഴും ആളുകളെ ഈശോയുടെ ചുറ്റും ഒന്നിച്ചുകൂട്ടുന്നു. പാഠം: നിന്റെ ക്ലാസിൽ സമാധാനം ഉണ്ടാക്കുന്നവനാകുക."],
  term:["റംശാ","പൗരസ്ത്യ സുറിയാനി പാരമ്പര്യത്തിലെ സന്ധ്യാപ്രാർഥന; സൂര്യാസ്തമയത്തിലെ സഭയുടെ പ്രാർഥന. പല സീറോ മലബാർ ഇടവകകളിലും സന്യാസഭവനങ്ങളിലും ദിവസവും റംശാ ചൊല്ലുന്നു."],termMore:["വൈകുന്നേരം പ്രാർഥിക്കുന്നത് എന്തുകൊണ്ട്?","“എന്റെ പ്രാർഥന അങ്ങയുടെ സന്നിധിയിലെ ധൂപാർച്ചനയായും ഞാൻ കൈകൾ ഉയർത്തുന്നതു സായാഹ്നബലിയായും സ്വീകരിക്കണമേ!” (സങ്കീ 141:2) എന്നു സങ്കീർത്തനം പറയുന്നു. ദിവസം ദൈവത്തിനു തിരികെ സമർപ്പിക്കപ്പെടുന്നു."]},
 {homily:["പ്രിയപ്പെട്ടവരേ, ഇന്നത്തെ സുവിശേഷത്തിലെ ശിഷ്യർ തീക്ഷ്ണതയുള്ളവരാണ്; പക്ഷേ അവരുടെ തീക്ഷ്ണത രണ്ടു തവണ വഴിതെറ്റുന്നു. ആദ്യം, ഈശോയുടെ നാമത്തിൽ നന്മ ചെയ്യുന്ന ഒരുവനെ “അവൻ ഞങ്ങളോടൊപ്പം അനുഗമിക്കാത്തതിനാൽ” തടയാൻ അവർ ആഗ്രഹിക്കുന്നു. പിന്നെ ഈശോയെ തിരസ്കരിച്ച ഒരു ഗ്രാമത്തിന്മേൽ സ്വർഗത്തിൽനിന്ന് അഗ്നി ഇറക്കാൻ അവർ ആഗ്രഹിക്കുന്നു. രണ്ടു തവണയും ഈശോ വേണ്ടാ എന്നു പറയുന്നു.","ഈശോ ആഗ്രഹിക്കുന്ന മനോഭാവം പൗലോസ് പറയുന്നു: സ്വാർഥതയോ ദുരഭിമാനമോ നിമിത്തം ഒന്നും ചെയ്യാതെ, വിനയപൂർവം മറ്റുള്ളവരെ നിങ്ങളെക്കാൾ ശ്രേഷ്ഠരായി കരുതുവിൻ. സഭയുടെ വിശ്വാസം നാം സന്തോഷത്തോടെ സൂക്ഷിക്കുന്നു; എങ്കിലും ക്രിസ്തുവിന്റെ നാമം സൗഖ്യം നൽകുന്നിടത്തെല്ലാം നാം സന്തോഷിക്കുന്നു; തിരസ്കരണത്തിനു ക്ഷമകൊണ്ട് ഉത്തരം നൽകുന്നു.","ഇന്നു ക്രൈസ്തവൈക്യത്തിനായി പ്രാർഥിക്കാം; എല്ലാ ശ്ലീഹന്മാരോടുമൊപ്പം പ്രാർഥിച്ച മറിയത്തോടു നമ്മെ സമാധാനസ്ഥാപകരാക്കാൻ അപേക്ഷിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ചിലപ്പോൾ നാം പറയും: “അതു നമ്മുടെ ടീമല്ല!” നന്മ ചെയ്തുകൊണ്ടിരുന്ന ഒരാളെപ്പറ്റി ഈശോയുടെ കൂട്ടുകാർ അങ്ങനെ പറഞ്ഞു. ഈശോ പറഞ്ഞു: എന്റെ നാമത്തിൽ ആരു നന്മ ചെയ്താലും സന്തോഷിക്കുക.","നാം പ്രതികാരം ചെയ്യാൻ ഈശോ ഒരിക്കലും ആഗ്രഹിക്കുന്നില്ല. ഇന്ന് ആരെങ്കിലും നിന്നോടു ദയയില്ലാതെ പെരുമാറിയാൽ ക്ഷമയോടെയും ദയയോടെയും തിരിച്ചു പെരുമാറുക."]});

put("2026-10-21","en",E({t:"Wednesday of the Twenty-ninth Week in Ordinary Time",
 r:[["First Reading","Ephesians 3:2–12","The Gentiles are fellow heirs"],["Responsorial Canticle","Isaiah 12:2–6","You will draw water joyfully from the springs of salvation"],["Gospel","Luke 12:39–48","To whom much is given, much will be required"]],
 v:"From everyone to whom much has been given, much will be required; and from the one to whom much has been entrusted, even more will be demanded.",c:"Luke 12:48",
 theo:["Paul calls himself “the very least of all the saints” and yet the steward of a great mystery: that the Gentiles are “fellow heirs, members of the same body, and sharers in the promise in Christ Jesus”. He did not earn this; it was “given” to him. That is the key to today's Gospel. Jesus speaks of a steward set over a household to give everyone “their allowance of food at the proper time”. Whatever we have received, faith, education, health, money, a position in the Church, is entrusted to us for others.","“From everyone to whom much has been given, much will be required.” This is not a threat to the gifted but a dignity. God trusts us with his household. The unfaithful steward's sin is to treat the house as his own, beating the servants and getting drunk. The faithful steward simply does what he was given to do, and is found doing it when the master comes."],
 conn:[["Water from the springs.","The canticle (Isaiah 12:3) was sung at the Feast of Tabernacles, when water was poured at the Temple; Jesus later stood up at that feast and cried, “Let anyone who is thirsty come to me” (John 7:37)."],["The faithful steward.","Joseph in Egypt was the model of a steward over a master's house (Genesis 39:4–6). The liturgy applies Luke 12:42 to St Joseph."]],
 altar:"The priest at the altar is a steward of the mysteries of God (1 Corinthians 4:1). Every Christian, receiving the Eucharist, becomes a steward of love for others.",
 out:[["Opening","Ask: what have you been given that most people in the world do not have?"],["Point 1 · Everything is entrusted","Paul: grace was given to me for you. Gifts are for the household."],["Point 2 · Faithful when no one is watching","The good steward is found doing his ordinary duty."],["Take-home line","“Lord, make me faithful in what you have entrusted to me.”"]],
 live:[["Count your gifts (Luke 12:48)","List five things you have been given. Choose one to use for someone else this week."],["Faithful in little things","Do one ordinary duty today perfectly, as for the Lord."]],
 fa:["St John Chrysostom","He says that the rich are stewards, not owners, of their wealth, and that not to share it with the poor is to steal from them (On Lazarus, Homily 2)."],
 ma:["Catechism 2404","The owner of goods is a steward of Providence, and should use them for the benefit of others, first of all his family."],
 sa:[["Today","No memorial in the Roman calendar."]],
 p:"Lord, you have entrusted me with so much. Make me a faithful and wise steward, found ready when you come. Amen."}),
 X({q:["Everything I have is entrusted, not owned.","To whom much is given, much is required.","The faithful steward is found doing his ordinary duty."],a:"Use one of your gifts today for someone who has less.",qu:"What has God entrusted to me that I have been treating as my own?",
  il:["An illustration","A school headmistress in a village who stays after hours to teach the weakest children is a faithful steward. She will never be famous, but the Master will find her at work."],
  fam:{read:"Read together: Luke 12:42–43.",explain:"God has given us many gifts. He wants us to take care of them and share them, like a good manager of a house.",intention:"We pray for teachers, doctors and all who serve others with their gifts.",ask:"Ask: “What gift has God given you, and how can you use it to help?”"},
  cat:[["CCC 2404–2405","Stewardship of goods."]],ks:["Saint Teresa of Calcutta","She said she was “a little pencil in God's hand”. She used everything she had to serve the poorest. Lesson: God can do great things with small gifts."],
  term:["Canticle","A biblical song outside the Book of Psalms, such as Isaiah 12 or Mary's Magnificat. On some days a canticle is sung in place of the responsorial psalm."],tm:["Why sing Isaiah 12?","It is a song of joy for salvation, and it fits a Gospel about God's generous trust."]}),
 {homily:["Dear friends, Paul calls himself the least of all the saints, yet he has been entrusted with a great mystery: that all peoples are fellow heirs in Christ. He did not earn it; it was given to him for others.","Jesus speaks of a steward set over a household. Everything we have, faith, education, health, money, is entrusted to us for others. “From everyone to whom much has been given, much will be required.” That is not a threat; it is a sign of God's trust.","So today let us ask: what has God entrusted to me, and am I using it for his household? Amen."],
  kids:["Children, when your teacher gives you the class keys or the duster to look after, you feel proud and careful. God gives us gifts to look after too: our talents, our time, our things.","Use one of your gifts today to help someone: teach a friend, share a pencil, help at home."]});

put("2026-10-21","ml",E({t:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ആഴ്ച · ബുധൻ",
 r:[["ഒന്നാം വായന","എഫേസോസ് 3:2–12","വിജാതീയർ സഹാവകാശികൾ"],["പ്രതിവചനഗീതം","ഏശയ്യാ 12:2–6","രക്ഷയുടെ കിണറ്റിൽനിന്നു സന്തോഷത്തോടെ ജലം കോരിയെടുക്കും"],["സുവിശേഷം","ലൂക്കാ 12:39–48","അധികം ലഭിച്ചവനിൽനിന്ന് അധികം ആവശ്യപ്പെടും"]],
 v:"അധികം ലഭിച്ചവനിൽനിന്ന് അധികം ആവശ്യപ്പെടും; അധികം ഏൽപിക്കപ്പെട്ടവനോട് അധികം ചോദിക്കും.",c:"ലൂക്കാ 12:48",
 theo:["പൗലോസ് തന്നെത്തന്നെ “എല്ലാ വിശുദ്ധരിലും ഏറ്റവും ചെറിയവൻ” എന്നു വിളിക്കുന്നു; എങ്കിലും ഒരു വലിയ രഹസ്യത്തിന്റെ കാര്യസ്ഥനാണ് അവൻ: വിജാതീയർ ക്രിസ്തുയേശുവിൽ “സഹാവകാശികളും ഒരേ ശരീരത്തിലെ അംഗങ്ങളും വാഗ്ദാനത്തിൽ പങ്കുകാരുമാണ്”. അവൻ അതു നേടിയെടുത്തതല്ല; അത് അവനു “നൽകപ്പെട്ടതാണ്”. ഇന്നത്തെ സുവിശേഷത്തിന്റെ താക്കോൽ അതാണ്. എല്ലാവർക്കും “യഥാസമയം ഭക്ഷണം കൊടുക്കാൻ” ഒരു ഭവനത്തിനു മേൽ നിയമിക്കപ്പെട്ട കാര്യസ്ഥനെപ്പറ്റി ഈശോ സംസാരിക്കുന്നു. നമുക്കു ലഭിച്ചതെന്തും, വിശ്വാസം, വിദ്യാഭ്യാസം, ആരോഗ്യം, പണം, സഭയിലെ ഒരു സ്ഥാനം, മറ്റുള്ളവർക്കുവേണ്ടി നമ്മെ ഏൽപിച്ചതാണ്.","“അധികം ലഭിച്ചവനിൽനിന്ന് അധികം ആവശ്യപ്പെടും.” ഇതു കഴിവുള്ളവർക്കുള്ള ഭീഷണിയല്ല, ഒരു മഹത്വമാണ്. ദൈവം തന്റെ ഭവനം നമ്മെ വിശ്വസിച്ചേൽപിക്കുന്നു. അവിശ്വസ്തനായ കാര്യസ്ഥന്റെ പാപം, ഭവനം തന്റേതെന്നപോലെ കരുതി ഭൃത്യരെ അടിക്കുകയും മദ്യപിക്കുകയും ചെയ്യുന്നതാണ്. വിശ്വസ്തനായ കാര്യസ്ഥൻ തന്നെ ഏൽപിച്ചതു ചെയ്യുന്നു; യജമാനൻ വരുമ്പോൾ അതു ചെയ്തുകൊണ്ടിരിക്കുന്നവനായി കാണപ്പെടുന്നു."],
 conn:[["രക്ഷയുടെ കിണർ.","കൂടാരത്തിരുനാളിൽ ദേവാലയത്തിൽ ജലം ഒഴിക്കുമ്പോൾ ഈ ഗീതം (ഏശ 12:3) പാടിയിരുന്നു; ആ തിരുനാളിൽ ഈശോ എഴുന്നേറ്റുനിന്ന്, “ദാഹിക്കുന്നവൻ എന്റെ അടുത്തു വരട്ടെ” എന്നു വിളിച്ചുപറഞ്ഞു (യോഹ 7:37)."],["വിശ്വസ്തനായ കാര്യസ്ഥൻ.","യജമാനന്റെ ഭവനത്തിന്മേലുള്ള കാര്യസ്ഥന്റെ മാതൃകയായിരുന്നു ഈജിപ്തിലെ ജോസഫ് (ഉൽപ 39:4–6). ആരാധനക്രമം ലൂക്കാ 12:42 വിശുദ്ധ യൗസേപ്പിതാവിനെപ്പറ്റി ഉപയോഗിക്കുന്നു."]],
 altar:"ബലിപീഠത്തിലെ വൈദികൻ ദൈവരഹസ്യങ്ങളുടെ കാര്യസ്ഥനാണ് (1 കോറി 4:1). ദിവ്യകാരുണ്യം സ്വീകരിക്കുന്ന ഓരോ ക്രൈസ്തവനും മറ്റുള്ളവർക്കായുള്ള സ്നേഹത്തിന്റെ കാര്യസ്ഥനാകുന്നു.",
 out:[["ആരംഭം","ചോദിക്കുക: ലോകത്തിലെ മിക്കവർക്കും ഇല്ലാത്ത എന്താണു നിങ്ങൾക്കു ലഭിച്ചിട്ടുള്ളത്?"],["ഒന്നാം ആശയം · എല്ലാം ഏൽപിക്കപ്പെട്ടതാണ്","പൗലോസ്: നിങ്ങൾക്കുവേണ്ടി എനിക്കു കൃപ നൽകപ്പെട്ടു. ദാനങ്ങൾ ഭവനത്തിനുവേണ്ടിയുള്ളതാണ്."],["രണ്ടാം ആശയം · ആരും കാണാത്തപ്പോഴും വിശ്വസ്തൻ","നല്ല കാര്യസ്ഥൻ തന്റെ സാധാരണ കടമ ചെയ്തുകൊണ്ടിരിക്കുന്നവനായി കാണപ്പെടുന്നു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, അങ്ങ് എന്നെ ഏൽപിച്ചതിൽ എന്നെ വിശ്വസ്തനാക്കണമേ.”"]],
 live:[["നിന്റെ ദാനങ്ങൾ എണ്ണുക (ലൂക്കാ 12:48)","നിനക്കു ലഭിച്ച അഞ്ചു കാര്യങ്ങൾ എഴുതുക. ഈ ആഴ്ച മറ്റൊരാൾക്കുവേണ്ടി ഉപയോഗിക്കാൻ അതിൽ ഒന്നു തിരഞ്ഞെടുക്കുക."],["ചെറിയ കാര്യങ്ങളിൽ വിശ്വസ്തൻ","കർത്താവിനുവേണ്ടിയെന്നപോലെ ഒരു സാധാരണ കടമ ഇന്നു പൂർണമായി ചെയ്യുക."]],
 fa:["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","ധനികർ തങ്ങളുടെ സമ്പത്തിന്റെ ഉടമസ്ഥരല്ല, കാര്യസ്ഥരാണെന്നും, അതു ദരിദ്രരുമായി പങ്കുവയ്ക്കാതിരിക്കുന്നത് അവരിൽനിന്നു മോഷ്ടിക്കലാണെന്നും അദ്ദേഹം പറയുന്നു (ലാസറിനെപ്പറ്റിയുള്ള പ്രസംഗം 2)."],
 ma:["മതബോധനഗ്രന്ഥം 2404","വസ്തുക്കളുടെ ഉടമ ദൈവപരിപാലനയുടെ കാര്യസ്ഥനാണ്; അവ മറ്റുള്ളവരുടെ, ആദ്യം സ്വന്തം കുടുംബത്തിന്റെ, നന്മയ്ക്കായി ഉപയോഗിക്കണം."],
 sa:[["ഇന്ന്","റോമൻ കലണ്ടറിൽ ഓർമയൊന്നുമില്ല."]],
 p:"കർത്താവേ, എത്രയധികമാണ് അങ്ങ് എന്നെ ഏൽപിച്ചിരിക്കുന്നത്. അങ്ങു വരുമ്പോൾ ഒരുങ്ങിയിരിക്കുന്നവനായി കാണപ്പെടുന്ന, വിശ്വസ്തനും വിവേകിയുമായ കാര്യസ്ഥനാക്കി എന്നെ മാറ്റണമേ. ആമേൻ."},true),
 X({q:["എനിക്കുള്ളതെല്ലാം ഏൽപിക്കപ്പെട്ടതാണ്; സ്വന്തമല്ല.","അധികം ലഭിച്ചവനിൽനിന്ന് അധികം ആവശ്യപ്പെടും.","വിശ്വസ്തനായ കാര്യസ്ഥൻ തന്റെ സാധാരണ കടമ ചെയ്തുകൊണ്ടിരിക്കുന്നവനായി കാണപ്പെടുന്നു."],a:"നിന്റെ ദാനങ്ങളിൽ ഒന്ന്, കുറവുള്ള ഒരാൾക്കുവേണ്ടി ഇന്ന് ഉപയോഗിക്കുക.",qu:"ദൈവം എന്നെ ഏൽപിച്ചതിൽ ഏതാണു ഞാൻ എന്റെ സ്വന്തമെന്നപോലെ കരുതിപ്പോരുന്നത്?",
  il:["ഒരു ഉദാഹരണം","ഏറ്റവും പിന്നിലുള്ള കുട്ടികളെ പഠിപ്പിക്കാൻ സമയം കഴിഞ്ഞും സ്കൂളിൽ തങ്ങുന്ന ഒരു ഗ്രാമത്തിലെ ഹെഡ്മിസ്ട്രസ് വിശ്വസ്തയായ ഒരു കാര്യസ്ഥയാണ്. അവൾ ഒരിക്കലും പ്രശസ്തയാകില്ല; പക്ഷേ യജമാനൻ അവളെ ജോലിയിൽ കണ്ടെത്തും."],
  fam:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 12:42–43.",explain:"ദൈവം നമുക്കു പല ദാനങ്ങളും നൽകിയിട്ടുണ്ട്. ഒരു വീടിന്റെ നല്ല നടത്തിപ്പുകാരനെപ്പോലെ അവ നോക്കിനടത്താനും പങ്കുവയ്ക്കാനും അവിടുന്ന് ആഗ്രഹിക്കുന്നു.",intention:"അധ്യാപകർ, ഡോക്ടർമാർ, തങ്ങളുടെ കഴിവുകൾകൊണ്ടു മറ്റുള്ളവരെ ശുശ്രൂഷിക്കുന്ന എല്ലാവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ദൈവം നിനക്കു നൽകിയ കഴിവ് ഏതാണ്? സഹായിക്കാൻ അത് എങ്ങനെ ഉപയോഗിക്കാം?”"},
  cat:[["മതബോധനഗ്രന്ഥം 2404–2405","വസ്തുക്കളുടെ കാര്യസ്ഥത."]],ks:["കൊൽക്കത്തയിലെ വിശുദ്ധ മദർ തെരേസ","താൻ “ദൈവത്തിന്റെ കൈയിലെ ഒരു ചെറിയ പെൻസിൽ” ആണെന്ന് അവൾ പറഞ്ഞു. ഏറ്റവും ദരിദ്രരെ ശുശ്രൂഷിക്കാൻ തനിക്കുള്ളതെല്ലാം അവൾ ഉപയോഗിച്ചു. പാഠം: ചെറിയ ദാനങ്ങൾകൊണ്ടു ദൈവത്തിനു വലിയ കാര്യങ്ങൾ ചെയ്യാനാകും."],
  term:["പ്രതിവചനഗീതം","ഏശയ്യാ 12, മറിയത്തിന്റെ സ്തോത്രഗീതം എന്നിങ്ങനെ സങ്കീർത്തനഗ്രന്ഥത്തിനു പുറത്തുള്ള ബൈബിൾഗീതം. ചില ദിവസങ്ങളിൽ പ്രതിവചനസങ്കീർത്തനത്തിനു പകരം ഒരു ഗീതം പാടുന്നു."],tm:["ഏശയ്യാ 12 പാടുന്നത് എന്തുകൊണ്ട്?","രക്ഷയെപ്രതിയുള്ള സന്തോഷത്തിന്റെ ഗീതമാണത്; ദൈവത്തിന്റെ ഉദാരമായ വിശ്വാസത്തെപ്പറ്റിയുള്ള സുവിശേഷത്തിന് അതു ചേരുന്നു."]}),
 {homily:["പ്രിയപ്പെട്ടവരേ, പൗലോസ് തന്നെത്തന്നെ എല്ലാ വിശുദ്ധരിലും ഏറ്റവും ചെറിയവൻ എന്നു വിളിക്കുന്നു; എങ്കിലും ഒരു വലിയ രഹസ്യം അവനെ ഏൽപിച്ചിരിക്കുന്നു: എല്ലാ ജനതകളും ക്രിസ്തുവിൽ സഹാവകാശികളാണ്. അവൻ അതു നേടിയതല്ല; മറ്റുള്ളവർക്കുവേണ്ടി അത് അവനു നൽകപ്പെട്ടതാണ്.","ഒരു ഭവനത്തിനു മേൽ നിയമിക്കപ്പെട്ട കാര്യസ്ഥനെപ്പറ്റി ഈശോ പറയുന്നു. നമുക്കുള്ളതെല്ലാം, വിശ്വാസം, വിദ്യാഭ്യാസം, ആരോഗ്യം, പണം, മറ്റുള്ളവർക്കുവേണ്ടി നമ്മെ ഏൽപിച്ചതാണ്. “അധികം ലഭിച്ചവനിൽനിന്ന് അധികം ആവശ്യപ്പെടും.” അതു ഭീഷണിയല്ല; ദൈവത്തിന്റെ വിശ്വാസത്തിന്റെ അടയാളമാണ്.","അതുകൊണ്ട് ഇന്നു ചോദിക്കാം: ദൈവം എന്നെ എന്താണ് ഏൽപിച്ചിരിക്കുന്നത്? അവിടുത്തെ ഭവനത്തിനുവേണ്ടി ഞാൻ അത് ഉപയോഗിക്കുന്നുണ്ടോ? ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ക്ലാസിന്റെ താക്കോലോ ഡസ്റ്ററോ നോക്കാൻ ടീച്ചർ നിങ്ങളെ ഏൽപിക്കുമ്പോൾ നിങ്ങൾക്ക് അഭിമാനവും ശ്രദ്ധയും തോന്നും. ദൈവവും നോക്കിനടത്താൻ നമുക്കു ദാനങ്ങൾ തരുന്നു: നമ്മുടെ കഴിവുകൾ, സമയം, സാധനങ്ങൾ.","ഇന്നു നിന്റെ ഒരു ദാനം ഒരാളെ സഹായിക്കാൻ ഉപയോഗിക്കുക: ഒരു കൂട്ടുകാരനെ പഠിപ്പിക്കുക, ഒരു പെൻസിൽ പങ്കുവയ്ക്കുക, വീട്ടിൽ സഹായിക്കുക."]});

/* ---------- Thursday 22 ---------- */
put("2026-10-22","en",E({t:"Thursday of the Twenty-ninth Week in Ordinary Time · St John Paul II",
 r:[["First Reading","Ephesians 3:14–21","To know the love of Christ that surpasses knowledge"],["Responsorial Psalm","Psalm 33","The earth is full of the steadfast love of the Lord"],["Gospel","Luke 12:49–53","I came to bring fire to the earth"]],
 alt:"Optional memorial of St John Paul II, Pope.",
 v:"I came to bring fire to the earth, and how I wish it were already kindled!",cite:"Luke 12:49",
 theo:["Paul kneels before the Father and prays that we may “comprehend, with all the saints, what is the breadth and length and height and depth, and to know the love of Christ that surpasses knowledge”. The four dimensions recall the Cross, stretched out to embrace the whole world. Jesus speaks of the same love as fire: the fire of the Holy Spirit he longs to kindle, and the “baptism” of his Passion that must come first.","The division Jesus speaks of is not his goal but the consequence of his coming: when the fire of the Gospel enters a family, not everyone welcomes it at once. Christians are not called to cause division, but to remain faithful, with love, even when faith is not shared. Many converts, and many believers in mixed families, know this Gospel from experience."],
 conn:[["Fire.","John the Baptist promised baptism “with the Holy Spirit and fire” (Luke 3:16), fulfilled at Pentecost (Acts 2:3)."],["Micah's prophecy.","Luke 12:53 quotes Micah 7:6, a prophecy of a divided household before God's salvation."]],
 altar:"The fire Jesus longs to kindle comes to us in the Eucharist, which the Eastern Fathers called “fire” and “live coal”.",
 out:[["Opening","Ask: when has your faith cost you something in your family or workplace?"],["Point 1 · Love beyond measure","Paul's four dimensions: the love of the Cross embraces all."],["Point 2 · Fire, not violence","The Gospel brings fire; Christians answer division with faithfulness and love, never with hatred."],["Point 3 · St John Paul II","A man on fire with the love of Christ: “Do not be afraid!”"],["Take-home line","“Lord, kindle in me the fire of your love.”"]],
 live:[["Pray for a divided family (Luke 12:53)","Pray by name for a family you know that is divided over faith."],["Kneel before the Father (Ephesians 3:14)","Kneel for a few minutes today and pray Paul's prayer for someone you love."]],
 fa:["St Ambrose","Commenting on Luke 12:49, he says the fire Christ brings is the fire of the Spirit that burns away sin and warms hearts with love (Exposition of Luke 7)."],
 ma:["St John Paul II, Redemptor Hominis 10","Man cannot live without love; his life is senseless if love is not revealed to him, if he does not encounter it and make it his own."],
 sa:[["22 October · St John Paul II","Pope from 1978 to 2005. He visited India in 1986 and 1999, and in Kerala beatified Sister Alphonsa and Fr Kuriakose Elias Chavara."]],
 p:"Father, root us in love, that with all the saints we may know the love of Christ that surpasses knowledge. Kindle in us the fire of your Spirit. Amen."}),
 X({q:["The love of Christ has breadth, length, height and depth: the shape of the Cross.","Jesus longs to kindle the fire of the Spirit in us.","Faithfulness may cost us, but it must never make us hateful."],a:"Kneel for a few minutes today and pray for someone you love.",qu:"Where is Christ's fire meeting resistance in my life?",
  il:["An illustration","A young man in Kerala who decides to give up his share of a disputed property for the sake of family peace may face anger at first. But his quiet fire of love often ends the quarrel years later."],
  fam:{read:"Read together: Ephesians 3:17–19.",explain:"St Paul prays that we may know how big Jesus' love is: as wide, long, high and deep as the cross.",intention:"We pray for families who argue about faith or property.",ask:"Ask: “How can we show love to someone who disagrees with us?”"},
  cat:[["CCC 2658","The love of God poured into our hearts by the Holy Spirit."]],ks:["Saint John Paul II","As a boy he lost his mother and brother, and later his father. He became a priest, a bishop and Pope, and travelled the world telling young people: “Do not be afraid!” Lesson: Jesus makes us brave."],
  term:["Optional memorial","A saint's day that the priest may celebrate on a weekday. St John Paul II's memorial falls on the anniversary of the inauguration of his pontificate (22 October 1978)."],tm:["Why 22 October and not the day of his death?","Saints are usually remembered on the day of their death, but his falls in Easter time (2 April), so the Church chose the day his pontificate began."]}),
 {homily:["Dear friends, St Paul kneels and prays that we may know the breadth and length and height and depth of the love of Christ. Those four directions are the shape of the Cross, stretched out to embrace the whole world.","Jesus says, “I came to bring fire to the earth.” It is the fire of the Holy Spirit. Sometimes that fire divides families, because not everyone welcomes it at once. Our answer is never hatred, but faithful love.","Today we remember St John Paul II, a man on fire with Christ's love, who told us: “Do not be afraid!” Let us ask Jesus to kindle that fire in us. Amen."],
  kids:["Children, stretch your arms out wide, like a cross. That is how big Jesus' love is: as wide as the world!","Jesus wants to light a fire of love in our hearts. Today, let your love shine like a little fire: be kind to someone who is not kind to you."]});

put("2026-10-22","ml",E({t:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ആഴ്ച · വ്യാഴം · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ",
 r:[["ഒന്നാം വായന","എഫേസോസ് 3:14–21","അറിവിനെ അതിശയിക്കുന്ന ക്രിസ്തുവിന്റെ സ്നേഹം അറിയാൻ"],["പ്രതിവചനസങ്കീർത്തനം","സങ്കീർത്തനം 33","ഭൂമി കർത്താവിന്റെ കാരുണ്യത്താൽ നിറഞ്ഞിരിക്കുന്നു"],["സുവിശേഷം","ലൂക്കാ 12:49–53","ഭൂമിയിൽ തീയിടാനാണു ഞാൻ വന്നത്"]],
 alt:"മാർപാപ്പയായ വിശുദ്ധ ജോൺ പോൾ രണ്ടാമന്റെ ഐച്ഛിക ഓർമ.",
 v:"ഭൂമിയിൽ തീയിടാനാണ് ഞാൻ വന്നത്. അത് ഇതിനകം കത്തിജ്ജ്വലിച്ചിരുന്നെങ്കിൽ!",c:"ലൂക്കാ 12:49",
 theo:["പൗലോസ് പിതാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തി പ്രാർഥിക്കുന്നു: എല്ലാ വിശുദ്ധരോടുമൊപ്പം വീതിയും നീളവും ഉയരവും ആഴവും എന്തെന്നു ഗ്രഹിക്കാനും, അറിവിനെ അതിശയിക്കുന്ന ക്രിസ്തുവിന്റെ സ്നേഹം അറിയാനും നമുക്കു കഴിയട്ടെ. ഈ നാലു മാനങ്ങൾ, ലോകം മുഴുവനെയും ആശ്ലേഷിക്കാൻ നീട്ടപ്പെട്ട കുരിശിനെ ഓർമിപ്പിക്കുന്നു. ഇതേ സ്നേഹത്തെപ്പറ്റി ഈശോ അഗ്നിയായി സംസാരിക്കുന്നു: കത്തിക്കാൻ അവിടുന്ന് ആഗ്രഹിക്കുന്ന പരിശുദ്ധാത്മാവിന്റെ അഗ്നി; അതിനു മുമ്പു വരേണ്ട, തന്റെ പീഡാസഹനത്തിന്റെ “സ്നാനം”.","ഈശോ പറയുന്ന ഭിന്നത അവിടുത്തെ ലക്ഷ്യമല്ല; അവിടുത്തെ വരവിന്റെ അനന്തരഫലമാണ്: സുവിശേഷത്തിന്റെ അഗ്നി ഒരു കുടുംബത്തിൽ പ്രവേശിക്കുമ്പോൾ എല്ലാവരും അത് ഉടനെ സ്വാഗതം ചെയ്യുന്നില്ല. ഭിന്നത ഉണ്ടാക്കാനല്ല, വിശ്വാസം പങ്കുവയ്ക്കപ്പെടാത്തപ്പോഴും സ്നേഹത്തോടെ വിശ്വസ്തരായിരിക്കാനാണു ക്രൈസ്തവർ വിളിക്കപ്പെട്ടിരിക്കുന്നത്. പല മാനസാന്തരപ്പെട്ടവർക്കും മിശ്രകുടുംബങ്ങളിലെ പല വിശ്വാസികൾക്കും ഈ സുവിശേഷം അനുഭവത്തിൽനിന്ന് അറിയാം."],
 conn:[["അഗ്നി.","“പരിശുദ്ധാത്മാവിനാലും അഗ്നിയാലുമുള്ള” സ്നാനം സ്നാപകയോഹന്നാൻ വാഗ്ദാനം ചെയ്തു (ലൂക്കാ 3:16); പന്തക്കുസ്തായിൽ അതു നിറവേറി (അപ്പ 2:3)."],["മിക്കായുടെ പ്രവചനം.","ദൈവത്തിന്റെ രക്ഷയ്ക്കു മുമ്പു ഭിന്നിച്ച ഭവനത്തെപ്പറ്റിയുള്ള മിക്കാ 7:6-ലെ പ്രവചനമാണു ലൂക്കാ 12:53 ഉദ്ധരിക്കുന്നത്."]],
 altar:"കത്തിക്കാൻ ഈശോ ആഗ്രഹിക്കുന്ന അഗ്നി ദിവ്യകാരുണ്യത്തിലൂടെ നമ്മിലേക്കു വരുന്നു; പൗരസ്ത്യപിതാക്കന്മാർ അതിനെ “അഗ്നി” എന്നും “ജ്വലിക്കുന്ന കനൽ” എന്നും വിളിച്ചു.",
 out:[["ആരംഭം","ചോദിക്കുക: നിങ്ങളുടെ കുടുംബത്തിലോ ജോലിസ്ഥലത്തോ നിങ്ങളുടെ വിശ്വാസത്തിനു വില കൊടുക്കേണ്ടിവന്നത് എപ്പോഴാണ്?"],["ഒന്നാം ആശയം · അളവില്ലാത്ത സ്നേഹം","പൗലോസിന്റെ നാലു മാനങ്ങൾ: കുരിശിന്റെ സ്നേഹം എല്ലാവരെയും ആശ്ലേഷിക്കുന്നു."],["രണ്ടാം ആശയം · അഗ്നി, അക്രമമല്ല","സുവിശേഷം അഗ്നി കൊണ്ടുവരുന്നു; ഭിന്നതയ്ക്കു ക്രൈസ്തവർ വിശ്വസ്തതയോടും സ്നേഹത്തോടുംകൂടെ ഉത്തരം നൽകുന്നു; ഒരിക്കലും വെറുപ്പോടെയല്ല."],["മൂന്നാം ആശയം · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","ക്രിസ്തുസ്നേഹത്താൽ ജ്വലിച്ച ഒരു മനുഷ്യൻ: “ഭയപ്പെടേണ്ടാ!”"],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, അങ്ങയുടെ സ്നേഹാഗ്നി എന്നിൽ ജ്വലിപ്പിക്കണമേ.”"]],
 live:[["ഭിന്നിച്ച ഒരു കുടുംബത്തിനായി പ്രാർഥിക്കുക (ലൂക്കാ 12:53)","വിശ്വാസത്തിന്റെ പേരിൽ ഭിന്നിച്ചിരിക്കുന്ന, നിനക്കറിയാവുന്ന ഒരു കുടുംബത്തിനുവേണ്ടി പേരെടുത്തു പ്രാർഥിക്കുക."],["പിതാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തുക (എഫേസോസ് 3:14)","ഇന്ന് ഏതാനും മിനിറ്റ് മുട്ടുകുത്തി, നീ സ്നേഹിക്കുന്ന ഒരാൾക്കുവേണ്ടി പൗലോസിന്റെ പ്രാർഥന ചൊല്ലുക."]],
 fa:["വിശുദ്ധ അംബ്രോസ്","ലൂക്കാ 12:49 വ്യാഖ്യാനിച്ച് അദ്ദേഹം പറയുന്നു: ക്രിസ്തു കൊണ്ടുവരുന്ന അഗ്നി, പാപത്തെ ദഹിപ്പിക്കുകയും ഹൃദയങ്ങളെ സ്നേഹത്താൽ ചൂടുപിടിപ്പിക്കുകയും ചെയ്യുന്ന ആത്മാവിന്റെ അഗ്നിയാണ് (ലൂക്കായുടെ വ്യാഖ്യാനം 7)."],
 ma:["വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ, റെദെംപ്തോർ ഹോമിനിസ് 10","സ്നേഹമില്ലാതെ മനുഷ്യനു ജീവിക്കാനാവില്ല; സ്നേഹം അവനു വെളിപ്പെടുത്തപ്പെടുകയും അവൻ അതു കണ്ടുമുട്ടി സ്വന്തമാക്കുകയും ചെയ്യുന്നില്ലെങ്കിൽ അവന്റെ ജീവിതം അർഥശൂന്യമാണ്."],
 sa:[["ഒക്ടോബർ 22 · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","1978 മുതൽ 2005 വരെ മാർപാപ്പ. 1986-ലും 1999-ലും അദ്ദേഹം ഇന്ത്യ സന്ദർശിച്ചു; കേരളത്തിൽവച്ചു സിസ്റ്റർ അൽഫോൻസായെയും ഫാദർ കുര്യാക്കോസ് ഏലിയാസ് ചാവറയെയും വാഴ്ത്തപ്പെട്ടവരായി പ്രഖ്യാപിച്ചു."]],
 p:"പിതാവേ, ഞങ്ങളെ സ്നേഹത്തിൽ വേരൂന്നിയവരാക്കണമേ; എല്ലാ വിശുദ്ധരോടുമൊപ്പം അറിവിനെ അതിശയിക്കുന്ന ക്രിസ്തുവിന്റെ സ്നേഹം അറിയാൻ ഞങ്ങൾക്ക് ഇടയാക്കണമേ. അങ്ങയുടെ ആത്മാവിന്റെ അഗ്നി ഞങ്ങളിൽ ജ്വലിപ്പിക്കണമേ. ആമേൻ."},true),
 X({q:["ക്രിസ്തുസ്നേഹത്തിനു വീതിയും നീളവും ഉയരവും ആഴവുമുണ്ട്: കുരിശിന്റെ ആകൃതി.","ആത്മാവിന്റെ അഗ്നി നമ്മിൽ ജ്വലിപ്പിക്കാൻ ഈശോ ആഗ്രഹിക്കുന്നു.","വിശ്വസ്തതയ്ക്കു വില കൊടുക്കേണ്ടിവന്നേക്കാം; പക്ഷേ അതു നമ്മെ ഒരിക്കലും വെറുപ്പുള്ളവരാക്കരുത്."],a:"ഇന്ന് ഏതാനും മിനിറ്റ് മുട്ടുകുത്തി നീ സ്നേഹിക്കുന്ന ഒരാൾക്കുവേണ്ടി പ്രാർഥിക്കുക.",qu:"എന്റെ ജീവിതത്തിൽ ക്രിസ്തുവിന്റെ അഗ്നി എവിടെയാണു പ്രതിരോധം നേരിടുന്നത്?",
  il:["ഒരു ഉദാഹരണം","കുടുംബസമാധാനത്തിനുവേണ്ടി തർക്കത്തിലുള്ള സ്വത്തിലെ തന്റെ പങ്കു വേണ്ടെന്നുവയ്ക്കാൻ തീരുമാനിക്കുന്ന കേരളത്തിലെ ഒരു യുവാവ് ആദ്യം ദേഷ്യം നേരിട്ടേക്കാം. പക്ഷേ അവന്റെ നിശ്ശബ്ദമായ സ്നേഹാഗ്നി പലപ്പോഴും വർഷങ്ങൾക്കുശേഷം ആ കലഹം അവസാനിപ്പിക്കുന്നു."],
  fam:{read:"ഒന്നിച്ചു വായിക്കുക: എഫേസോസ് 3:17–19.",explain:"ഈശോയുടെ സ്നേഹം എത്ര വലുതാണെന്നു നാം അറിയാൻ വിശുദ്ധ പൗലോസ് പ്രാർഥിക്കുന്നു: കുരിശുപോലെ വീതിയും നീളവും ഉയരവും ആഴവുമുള്ളത്.",intention:"വിശ്വാസത്തെയോ സ്വത്തിനെയോ ചൊല്ലി കലഹിക്കുന്ന കുടുംബങ്ങൾക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മോടു വിയോജിക്കുന്ന ഒരാളോടു നമുക്ക് എങ്ങനെ സ്നേഹം കാണിക്കാം?”"},
  cat:[["മതബോധനഗ്രന്ഥം 2658","പരിശുദ്ധാത്മാവിനാൽ നമ്മുടെ ഹൃദയങ്ങളിൽ ചൊരിയപ്പെട്ട ദൈവസ്നേഹം."]],ks:["വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","ബാലനായിരിക്കെ അദ്ദേഹത്തിന് അമ്മയെയും സഹോദരനെയും, പിന്നീടു പിതാവിനെയും നഷ്ടപ്പെട്ടു. അദ്ദേഹം വൈദികനും മെത്രാനും മാർപാപ്പയുമായി; “ഭയപ്പെടേണ്ടാ!” എന്നു യുവജനങ്ങളോടു പറഞ്ഞുകൊണ്ടു ലോകമെങ്ങും യാത്രചെയ്തു. പാഠം: ഈശോ നമ്മെ ധൈര്യമുള്ളവരാക്കുന്നു."],
  term:["ഐച്ഛിക ഓർമ","വാരദിനത്തിൽ വൈദികന് ആഘോഷിക്കാവുന്ന ഒരു വിശുദ്ധന്റെ ദിനം. വിശുദ്ധ ജോൺ പോൾ രണ്ടാമന്റെ ഓർമ അദ്ദേഹത്തിന്റെ മാർപാപ്പാശുശ്രൂഷയുടെ ഉദ്ഘാടനവാർഷികത്തിലാണ് (1978 ഒക്ടോബർ 22)."],tm:["മരണദിവസത്തിനു പകരം ഒക്ടോബർ 22 എന്തുകൊണ്ട്?","വിശുദ്ധരെ സാധാരണ അവരുടെ മരണദിവസമാണ് ഓർക്കുന്നത്; പക്ഷേ അദ്ദേഹത്തിന്റേത് ഈസ്റ്റർകാലത്തു വരുന്നതുകൊണ്ട് (ഏപ്രിൽ 2), അദ്ദേഹത്തിന്റെ മാർപാപ്പാശുശ്രൂഷ ആരംഭിച്ച ദിവസം സഭ തിരഞ്ഞെടുത്തു."]}),
 {homily:["പ്രിയപ്പെട്ടവരേ, ക്രിസ്തുസ്നേഹത്തിന്റെ വീതിയും നീളവും ഉയരവും ആഴവും നാം അറിയാൻ വിശുദ്ധ പൗലോസ് മുട്ടുകുത്തി പ്രാർഥിക്കുന്നു. ലോകം മുഴുവനെയും ആശ്ലേഷിക്കാൻ നീട്ടപ്പെട്ട കുരിശിന്റെ ആകൃതിയാണ് ആ നാലു ദിശകൾ.","ഈശോ പറയുന്നു: “ഭൂമിയിൽ തീയിടാനാണ് ഞാൻ വന്നത്.” പരിശുദ്ധാത്മാവിന്റെ അഗ്നിയാണത്. എല്ലാവരും അത് ഉടനെ സ്വാഗതം ചെയ്യാത്തതുകൊണ്ടു ചിലപ്പോൾ ആ അഗ്നി കുടുംബങ്ങളെ ഭിന്നിപ്പിക്കുന്നു. നമ്മുടെ ഉത്തരം ഒരിക്കലും വെറുപ്പല്ല; വിശ്വസ്തമായ സ്നേഹമാണ്.","ക്രിസ്തുസ്നേഹത്താൽ ജ്വലിച്ച, “ഭയപ്പെടേണ്ടാ!” എന്നു നമ്മോടു പറഞ്ഞ വിശുദ്ധ ജോൺ പോൾ രണ്ടാമനെ ഇന്നു നാം ഓർക്കുന്നു. ആ അഗ്നി നമ്മിൽ ജ്വലിപ്പിക്കാൻ ഈശോയോട് അപേക്ഷിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഒരു കുരിശുപോലെ കൈകൾ വിരിച്ചുപിടിക്കുക. ഈശോയുടെ സ്നേഹം അത്ര വലുതാണ്: ലോകത്തോളം വീതിയുള്ളത്!","നമ്മുടെ ഹൃദയങ്ങളിൽ സ്നേഹത്തിന്റെ ഒരു തീ കത്തിക്കാൻ ഈശോ ആഗ്രഹിക്കുന്നു. ഇന്നു നിന്റെ സ്നേഹം ഒരു കൊച്ചുതീപോലെ പ്രകാശിക്കട്ടെ: നിന്നോടു ദയ കാണിക്കാത്ത ഒരാളോടു ദയ കാണിക്കുക."]});
