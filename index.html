 readings:[[ML.eg,"യോഹന്നാൻ 20:19–23","നിങ്ങൾക്കു സമാധാനം; പരിശുദ്ധാത്മാവിനെ സ്വീകരിക്കുവിൻ"],[ML.ot,"ഉൽപത്തി 41:37–45","ജോസഫ് ഈജിപ്തിന്റെ അധിപനാകുന്നു"],[ML.ot,"2 രാജാക്കന്മാർ 2:1–12","ഏലിയാ എടുക്കപ്പെടുന്നു; എലീഷായ്ക്ക് അവന്റെ ആത്മാവ്"],[ML.ot,"ജ്ഞാനം 3:1–9","നീതിമാന്മാരുടെ ആത്മാവ് ദൈവകരങ്ങളിൽ"],[ML.ot,"ഏശയ്യാ 40:9–15","ഇതാ നിങ്ങളുടെ ദൈവം; അവിടുന്നു തന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിക്കുന്നു"],[ML.ce,"1 പത്രോസ് 1:3–12","ഉയിർപ്പിലൂടെ ജീവനുള്ള പ്രത്യാശ"],[ML.pa,"2 തിമോത്തേയോസ് 2:1–13","മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ട യേശുക്രിസ്തുവിനെ ഓർക്കുക"],[ML.go,"യോഹന്നാൻ 20:19–29","എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!"]],
 alt:"പുതുഞായർ, ക്യംതോയ്ക്കുശേഷമുള്ള ഒന്നാം ഞായർ.",
 verse:"തോമസ് പറഞ്ഞു: എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!",cite:"യോഹന്നാൻ 20:28",
 theo:["ഉയിർപ്പുദിവസം വൈകിട്ടു ശിഷ്യന്മാർ ഭയന്നു കതകടച്ചിരിക്കുന്നു. യേശു വന്ന് അവരുടെ മധ്യേ നിന്ന് അവരോടു പറയുന്നു: “നിങ്ങൾക്കു സമാധാനം!” അവിടുന്നു കൈകളും പാർശ്വവും കാണിക്കുന്നു; അവർ സന്തോഷിക്കുന്നു. പിന്നെ അവരെ അയയ്ക്കുന്നു: “പിതാവ് എന്നെ അയച്ചതുപോലെ ഞാനും നിങ്ങളെ അയയ്ക്കുന്നു.” “അവരുടെമേൽ നിശ്വസിച്ചുകൊണ്ട് അവരോട് അരുളിച്ചെയ്തു: നിങ്ങൾ പരിശുദ്ധാത്മാവിനെ സ്വീകരിക്കുവിൻ. നിങ്ങൾ ആരുടെ പാപങ്ങൾ ക്ഷമിക്കുന്നുവോ അവ അവരോടു ക്ഷമിക്കപ്പെട്ടിരിക്കും.” ആദ്യ ഉയിർപ്പുസന്ധ്യമുതൽ ഉത്ഥിതനായ കർത്താവു തന്റെ സഭയ്ക്കു സമാധാനവും ദൗത്യവും ആത്മാവും പാപമോചനാധികാരവും നൽകുന്നു.","തോമസ് അവിടെ ഉണ്ടായിരുന്നില്ല. “ഞങ്ങൾ കർത്താവിനെ കണ്ടു” എന്നു മറ്റുള്ളവർ പറയുമ്പോൾ അവൻ മറുപടി പറയുന്നു: അവന്റെ കൈകളിൽ ആണികളുടെ പഴുതുകൾ കാണുകയും ആണികളുടെ പഴുതുകളിൽ എന്റെ വിരലും പാർശ്വത്തിൽ എന്റെ കൈയും ഇടുകയും ചെയ്യാതെ ഞാൻ വിശ്വസിക്കുകയില്ല. ഒരാഴ്ചയ്ക്കുശേഷം യേശു വീണ്ടും വന്നു പറയുന്നു: “നിന്റെ വിരൽ ഇവിടെ കൊണ്ടുവരുക; എന്റെ കൈകൾ കാണുക; നിന്റെ കൈ നീട്ടി എന്റെ പാർശ്വത്തിൽ വയ്ക്കുക. അവിശ്വാസിയാകാതെ വിശ്വാസിയായിരിക്കുക.” സുവിശേഷങ്ങളിലെ ഏറ്റവും മഹത്തായ വിശ്വാസപ്രഖ്യാപനം തോമസ് നടത്തുന്നു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”","ഭാരതത്തിലെ നമുക്ക് ഈ സുവിശേഷം നമ്മുടെ സ്വന്തം കഥയാണ്. സംശയിക്കുകയും പിന്നെ വിശ്വസിക്കുകയും ചെയ്ത തോമസ് ആ വിശ്വാസം നമ്മുടെ നാട്ടിലേക്കു കൊണ്ടുവന്നു. എല്ലാ മാർ തോമാ ക്രിസ്ത്യാനികളെയുംപോലെ മലങ്കരസഭയും “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ” എന്ന ഏറ്റുപറച്ചിൽ അദ്ദേഹത്തിൽനിന്നു സ്വീകരിച്ചു. അദ്ദേഹത്തിന്റെ സംശയം നമ്മുടെ ഉറപ്പായി; മുറിവുകളെ സ്പർശിച്ച അദ്ദേഹത്തിന്റെ കരം നമ്മുടെ വിശ്വാസമായി.","പിൽക്കാല തലമുറകൾക്കെല്ലാം വേണ്ടി യേശു ഒരു വാക്കു കൂട്ടിച്ചേർക്കുന്നു: “കാണാതെതന്നെ വിശ്വസിക്കുന്നവർ ഭാഗ്യവാന്മാർ.” അതു നാമാണ്. വിശുദ്ധ പത്രോസ് പറയുന്നു: നിങ്ങൾ അവിടുത്തെ കണ്ടിട്ടില്ലെങ്കിലും അവിടുത്തെ സ്നേഹിക്കുന്നു… വർണനാതീതവും മഹത്വപൂർണവുമായ സന്തോഷത്താൽ ആനന്ദിക്കുന്നു (1 പത്രോ 1:8). പുതുഞായർ ചോദിക്കുന്നു: വിശ്വാസികളുടെ സന്തോഷത്തോടെയാണോ, അടച്ച വാതിലുകളുടെ ഭയത്തോടെയാണോ നാം ജീവിക്കുന്നത്?"],
 conn:[["ജീവശ്വാസം.","ദൈവം ആദാമിലേക്കു നിശ്വസിച്ചതുപോലെ (ഉൽപ 2:7), ഉത്ഥിതനായ ക്രിസ്തു തന്റെ ശിഷ്യന്മാരിലേക്ക് ആത്മാവിനെ നിശ്വസിക്കുന്നു: ഒരു പുതിയ സൃഷ്ടി."],["ഏലിയായും എലീഷായും.","“അങ്ങയുടെ ആത്മാവിന്റെ ഇരട്ടിപങ്ക് എനിക്കു ലഭിക്കട്ടെ” (2 രാജാ 2:9) എന്ന് എലീഷാ ചോദിക്കുന്നു; ഉത്ഥിതനായ കർത്താവിന്റെ ആത്മാവിനെ ശ്ലീഹന്മാർ സ്വീകരിക്കുന്നു."],["ഉയർത്തപ്പെട്ട ജോസഫ്.","സഹോദരന്മാർ തിരസ്കരിച്ച ജോസഫ് അവരെ രക്ഷിക്കാൻ ഈജിപ്തിന്റെ അധിപനായി ഉയർത്തപ്പെടുന്നു (ഉൽപ 41): ഉത്ഥിതനായ ക്രിസ്തുവിന്റെ പ്രതീകം."],["മുറിവുകൾ നിലനിൽക്കുന്നു.","ഉത്ഥിതശരീരം അതിന്റെ മുറിവുകൾ സൂക്ഷിക്കുന്നു: എന്നേക്കും നിലനിൽക്കുന്ന സ്നേഹത്തിന്റെ അടയാളങ്ങൾ (വെളി 5:6)."]],
 altar:["തോമസ് മുറിവുകളെ സ്പർശിച്ചു; വിശുദ്ധ കുർബാനയിൽ മുറിവേറ്റതും ഉത്ഥിതവുമായ ശരീരം നാം സ്വീകരിക്കുന്നു. നമ്മുടെ പാരമ്പര്യത്തിൽ പലരും ഉയർത്തലിന്റെ സമയത്തു തോമായുടെ വാക്കുകൾ മന്ത്രിക്കുന്നു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ.”"],
 outline:[["ആരംഭം","അടച്ച വാതിലുകളും ഭയന്ന ഹൃദയങ്ങളും."],["ഒന്നാം ആശയം · സമാധാനം, ദൗത്യം, ആത്മാവ്, പാപമോചനം","ഉത്ഥിതനായ കർത്താവു തന്റെ സഭയ്ക്കു നൽകുന്ന ആദ്യദാനങ്ങൾ."],["രണ്ടാം ആശയം · തോമായുടെ സംശയം","യേശുവിന്റെ അടുത്തു കൊണ്ടുവരുന്ന സത്യസന്ധമായ ചോദ്യങ്ങൾ വിശ്വാസമാകുന്നു."],["മൂന്നാം ആശയം · നമ്മുടെ ശ്ലീഹാ","മാർ തോമാശ്ലീഹായും ഭാരതത്തിന്റെ വിശ്വാസവും: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ.”"],["നാലാം ആശയം · കാണാതെ വിശ്വസിക്കുന്നവർ ഭാഗ്യവാന്മാർ","ഇന്നു ജീവിക്കുന്ന വിശ്വാസവും സന്തോഷവും."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”"]],
 live:[["തോമായുടെ പ്രാർഥന ചൊല്ലുക","വിശുദ്ധ കുർബാനയിലെ ഉയർത്തലിലും എല്ലാ പ്രഭാതത്തിലും പറയുക: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ.”"],["അവിടുത്തെ സമാധാനം സ്വീകരിക്കുക (യോഹ 20:19)","നിന്റെ ഹൃദയത്തിലെ ഒരു ഭയമോ അടച്ച വാതിലോ കുമ്പസാരത്തിൽ യേശുവിന്റെ അടുത്തു കൊണ്ടുവരുക."],["നിന്റെ വിശ്വാസം പങ്കുവയ്ക്കുക","നീ എങ്ങനെ വിശ്വസിക്കാൻ ഇടയായെന്ന് ഒരാളോടു പറയുക."]],
 fathers:[["മഹാനായ വിശുദ്ധ ഗ്രിഗറി","വിശ്വസിച്ച ശിഷ്യന്മാരുടെ വിശ്വാസത്തെക്കാൾ തോമായുടെ അവിശ്വാസം നമ്മുടെ വിശ്വാസത്തിനു പ്രയോജനപ്പെട്ടു; അവൻ സ്പർശിച്ചു വിശ്വസിച്ചപ്പോൾ നമ്മുടെ മനസ്സുകളിൽനിന്ന് എല്ലാ സംശയവും നീങ്ങി (സുവിശേഷപ്രസംഗങ്ങൾ 26)."],["വിശുദ്ധ അഗസ്റ്റിൻ","അവൻ മനുഷ്യനെ കണ്ടു സ്പർശിച്ചു; കാണാനും സ്പർശിക്കാനും കഴിയാത്ത ദൈവത്തെ ഏറ്റുപറഞ്ഞു (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രബന്ധങ്ങൾ 121)."]],
 magis:[["മതബോധനഗ്രന്ഥം 644–645","ഉത്ഥിതനായ കർത്താവുമായുള്ള കണ്ടുമുട്ടലിൽനിന്നാണു ശ്ലീഹന്മാരുടെ വിശ്വാസം ജനിച്ചത്; പീഡാനുഭവത്തിന്റെ അടയാളങ്ങൾ സൂക്ഷിച്ച തന്റെ ശരീരം സ്പർശിക്കാൻ യേശു അവരെ ക്ഷണിച്ചു."],["മതബോധനഗ്രന്ഥം 1441–1442","തന്റെ നാമത്തിൽ പാപങ്ങൾ ക്ഷമിക്കാനുള്ള അധികാരം ഉത്ഥിതനായ ക്രിസ്തു ശ്ലീഹന്മാർക്കു നൽകി."],["മതബോധനഗ്രന്ഥം 448","“കർത്താവ്” എന്ന സ്ഥാനപ്പേര് യേശുവിന്റെ ദൈവത്വം ഏറ്റുപറയുന്നു; തോമായുടെ ഏറ്റുപറച്ചിലാണ് അതിന്റെ ശിഖരം."]],
 saints:[["ഈ ആഴ്ച","ഹേവോറോ ആഴ്ച അവസാനിക്കുന്നു. ഏപ്രിൽ 11: ക്യംതോയ്ക്കുശേഷമുള്ള രണ്ടാം ഞായർ."]],
 prayer:"മുറിവേറ്റവനും ഉത്ഥിതനുമായ കർത്താവായ യേശുവേ, അടച്ച വാതിലുകളിലൂടെ അങ്ങു വന്നു ശിഷ്യന്മാർക്കു സമാധാനം നൽകി. അങ്ങയുടെ ആത്മാവിനെ ഞങ്ങളിൽ നിശ്വസിക്കണമേ; ഞങ്ങളുടെ സംശയങ്ങൾ സുഖപ്പെടുത്തണമേ; വിശ്വാസത്തിൽ ഞങ്ങളുടെ പിതാവായ മാർ തോമാശ്ലീഹായോടൊപ്പം ഏറ്റുപറയാൻ ഞങ്ങളെ സഹായിക്കണമേ: എന്റെ കർത്താവേ, എന്റെ ദൈവമേ! ആമേൻ."},
 {quick:["ഉത്ഥിതനായ കർത്താവു സമാധാനവും ദൗത്യവും ആത്മാവും പാപമോചനവും നൽകുന്നു.","തോമായുടെ സംശയം മഹത്തായ ഏറ്റുപറച്ചിലാകുന്നു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”","കാണാതെ വിശ്വസിക്കുന്നവർ ഭാഗ്യവാന്മാർ: അതു നാമാണ്."],action:"ഓരോ കുർബാനയിലും ഉയർത്തലിന്റെ സമയത്ത് “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ” എന്നു പറയുക.",question:"യേശു പ്രവേശിക്കാൻ ആഗ്രഹിക്കുന്ന, എന്റെ ജീവിതത്തിലെ അടച്ച വാതിലുകൾ ഏവ?",
  special:"പുതുഞായർ: ഉത്ഥിതനായ കർത്താവു ശ്ലീഹന്മാർക്കും തോമായ്ക്കും പ്രത്യക്ഷപ്പെടുന്നു.",
  illus:["ഒരു ഉദാഹരണം","മൈലാപ്പൂരിലെ മാർ തോമാശ്ലീഹായുടെ കബറിടത്തിലെത്തുന്ന തീർഥാടകർ മുട്ടുകുത്തി “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ” എന്നു മന്ത്രിക്കുന്നു. സംശയിച്ച ഒരു ശ്ലീഹായുടെ സ്പർശത്തിൽനിന്നു കടലുകൾ കടന്നെത്തിയ ഒരു വിശ്വാസം നമ്മുടെ നാട്ടിൽ ഏകദേശം രണ്ടായിരം വർഷമായി നിലനിൽക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: യോഹന്നാൻ 20:24–29.",explain:"യേശുവിനെ കാണുന്നതുവരെ അവിടുന്ന് ഉയിർത്തുവെന്നു തോമസ് വിശ്വസിച്ചില്ല. യേശു തന്റെ കൈകളും പാർശ്വവും കാണിച്ചപ്പോൾ തോമസ് പറഞ്ഞു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!” പിന്നീടു തോമസ് യേശുവിനെപ്പറ്റി ആളുകളോടു പറയാൻ ഭാരതത്തിലേക്കു വന്നു.",intention:"ഭാരതത്തിലേക്കു വിശ്വാസം കൊണ്ടുവന്ന മാർ തോമാശ്ലീഹായ്ക്കായി നാം ദൈവത്തിനു നന്ദി പറയുന്നു.",ask:"ചോദിക്കുക: “നാം എന്തുകൊണ്ടാണു മാർ തോമാ ക്രിസ്ത്യാനികൾ എന്നു വിളിക്കപ്പെടുന്നത്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 644–645","ശ്ലീഹന്മാർ ഉത്ഥിതനായ കർത്താവിനെ കണ്ടുമുട്ടുന്നു."],["മതബോധനഗ്രന്ഥം 448","യേശു കർത്താവാണ്."]],
  kidsaint:["മാർ തോമാശ്ലീഹാ","വിശ്വസിക്കുംമുമ്പു കാണാൻ അവൻ ആഗ്രഹിച്ചു; പക്ഷേ ഉത്ഥിതനായ യേശുവിനെ കണ്ടപ്പോൾ പറഞ്ഞു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!” അദ്ദേഹം ഭാരതത്തിലേക്കു സുവിശേഷം കൊണ്ടുവന്നുവെന്നു പാരമ്പര്യം പറയുന്നു. പാഠം: നിന്റെ ചോദ്യങ്ങൾ യേശുവിന്റെ അടുത്തു കൊണ്ടുവരുക; വിശ്വസിക്കാൻ അവിടുന്നു നിന്നെ സഹായിക്കും."],
  term:["പുതുഞായർ","ക്യംതോയ്ക്കുശേഷമുള്ള ഞായർ; ഉത്ഥിതനായ കർത്താവു ശ്ലീഹന്മാർക്കും തോമായ്ക്കും പ്രത്യക്ഷപ്പെട്ടതു സഭ വായിക്കുന്നതിനാൽ (യോഹ 20:19–29) തോമാഞായർ എന്നും വിളിക്കപ്പെടുന്നു."],
  termMore:["മാർ തോമാ ക്രിസ്ത്യാനികൾ","കേരളത്തിലെ പുരാതന ക്രൈസ്തവർ തങ്ങളുടെ വിശ്വാസം മാർ തോമാശ്ലീഹായുടെ പ്രസംഗത്തിൽനിന്നാണെന്നു കരുതുന്നു. സീറോ മലങ്കര, സീറോ മലബാർ സഭകൾ ഇരുവരും ഈ പൈതൃകത്തിൽപ്പെടുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഉയിർപ്പുദിവസം വൈകിട്ടു ശിഷ്യന്മാർ ഭയത്താൽ നിറഞ്ഞ് അടച്ച വാതിലുകൾക്കുള്ളിലായിരുന്നു. യേശു വന്ന് അവരുടെ മധ്യേ നിന്നു: “നിങ്ങൾക്കു സമാധാനം!” അവിടുന്നു തന്റെ മുറിവുകൾ കാണിച്ചു. പിന്നെ അവരെ അയച്ചു: “പിതാവ് എന്നെ അയച്ചതുപോലെ ഞാനും നിങ്ങളെ അയയ്ക്കുന്നു.” അവരുടെമേൽ നിശ്വസിച്ചു: “നിങ്ങൾ പരിശുദ്ധാത്മാവിനെ സ്വീകരിക്കുവിൻ. നിങ്ങൾ ആരുടെ പാപങ്ങൾ ക്ഷമിക്കുന്നുവോ അവ ക്ഷമിക്കപ്പെട്ടിരിക്കും.”","തോമസ് അവിടെ ഉണ്ടായിരുന്നില്ല; അവൻ വിശ്വസിക്കാൻ തയ്യാറായില്ല: ആണിപ്പഴുതുകൾ കാണുകയും അവിടുത്തെ പാർശ്വത്തിൽ കൈയിടുകയും ചെയ്യാതെ ഞാൻ വിശ്വസിക്കുകയില്ല. ഒരാഴ്ചയ്ക്കുശേഷം യേശു വീണ്ടും വന്ന് അവനെ ക്ഷണിച്ചു: “നിന്റെ വിരൽ ഇവിടെ കൊണ്ടുവരുക… അവിശ്വാസിയാകാതെ വിശ്വാസിയായിരിക്കുക.” തോമസ് ഉദ്ഘോഷിച്ചു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”","പ്രിയ സുഹൃത്തുക്കളേ, ഇതു നമ്മുടെ സ്വന്തം കുടുംബകഥയാണ്. സംശയിക്കുകയും പിന്നെ വിശ്വസിക്കുകയും ചെയ്ത തോമസ് ഈ വിശ്വാസം ഭാരതത്തിലേക്കു കൊണ്ടുവന്നു. നാം മാർ തോമാ ക്രിസ്ത്യാനികൾ എന്നു വിളിക്കപ്പെടുന്നു. ക്രിസ്തുവിന്റെ മുറിവുകളാൽ സുഖപ്പെട്ട അദ്ദേഹത്തിന്റെ സംശയം നമ്മുടെ വിശ്വാസമായി. വൈദികൻ വിശുദ്ധ രഹസ്യങ്ങൾ ഉയർത്തുമ്പോൾ നമ്മുടെ പല പള്ളികളിലും ആളുകൾ അദ്ദേഹത്തിന്റെ വാക്കുകൾ മന്ത്രിക്കുന്നു: എന്റെ കർത്താവേ, എന്റെ ദൈവമേ.","യേശു പിന്നെ പറഞ്ഞു: “കാണാതെതന്നെ വിശ്വസിക്കുന്നവർ ഭാഗ്യവാന്മാർ.” അതു നീയും ഞാനുമാണ്. നാം അവിടുത്തെ കണ്ടിട്ടില്ല; പക്ഷേ നാം അവിടുത്തെ സ്നേഹിക്കുന്നു. ഭയത്തിന്റെ അടച്ച വാതിലുകൾക്കു പിന്നിൽ നമുക്കു ജീവിക്കാതിരിക്കാം. നമ്മുടെ സംശയങ്ങൾ അവിടുത്തെ മുറിവുകളിലേക്കു കൊണ്ടുവരാം; അവിടുത്തെ സമാധാനം സ്വീകരിക്കാം; സാക്ഷികളായി പുറപ്പെടാം. എന്റെ കർത്താവേ, എന്റെ ദൈവമേ! ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശു ഉയിർത്തശേഷം തോമസ് പറഞ്ഞു: “ഞാൻ തന്നെ കാണാതെ വിശ്വസിക്കില്ല!”","ഒരാഴ്ചയ്ക്കുശേഷം യേശു വന്നു പറഞ്ഞു: “തോമസേ, എന്റെ കൈകൾ നോക്കൂ.” തോമസ് മുട്ടുകുത്തി പറഞ്ഞു: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”","പിന്നീടു തോമസ് യേശുവിനെപ്പറ്റി ആളുകളോടു പറയാൻ ഭാരതത്തിലേക്കു വന്നു. അതുകൊണ്ടാണു നാം മാർ തോമാ ക്രിസ്ത്യാനികളായത്! നമുക്ക് ഒന്നിച്ചു പറയാം: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”"]});

/* ================= II SUNDAY AFTER QYOMTHO · 11 April 2027 ================= */
put("2027-04-11","en",{title:"Second Sunday after Qyomtho",readTitle:EN.rt,
 readings:[[EN.eg,"John 21:15–19","Do you love me? Feed my sheep"],[EN.ot,"Exodus 15:1–8","The song of Moses at the sea"],[EN.ot,"Wisdom 1:12–16","God did not make death"],[EN.ot,"Joshua 6:8–14","Around the walls of Jericho"],[EN.ot,"Isaiah 63:1–6","Mighty to save"],[EN.ac,"Acts 13:26–41","God raised him from the dead"],[EN.pa,"Ephesians 6:18–24","Pray in the Spirit at all times"],[EN.go,"John 21:1–14","The risen Lord by the Sea of Tiberias"]],
 alt:"Season of Qyomtho.",
 verse:"Jesus said to them, “Come and have breakfast.”",cite:"John 21:12",
 theo:["After the Resurrection Peter says, “I am going fishing,” and the others go with him. They fish all night and catch nothing. At dawn a stranger on the shore says: “Cast the net to the right side of the boat, and you will find some.” The net fills so full they cannot haul it in. The beloved disciple says: “It is the Lord!” Peter jumps into the sea to reach him.","On the shore Jesus has already made a charcoal fire, with fish and bread. “Come and have breakfast.” The risen Lord of glory cooks for his tired friends. He meets them in their ordinary work, in their failure, and feeds them. Every Holy Qurbono is this breakfast on the shore: the risen Lord takes bread and gives it to us.","Then, beside another charcoal fire, Jesus heals Peter's wound. Three times Peter had denied him by a fire in the high priest's courtyard; three times Jesus asks: “Simon son of John, do you love me?” Three times Peter answers: “Lord, you know that I love you.” And three times Jesus entrusts him: “Feed my lambs… tend my sheep… feed my sheep.” Failure is not the end; love restores and sends.","Moses sang at the sea: “The LORD is my strength and my might, and he has become my salvation.” Wisdom says: “God did not make death.” Paul preaches in Antioch: “God raised him from the dead.” The risen Christ turns empty nights into full nets, and denials into love."],
 conn:[["The full net.","153 large fish (John 21:11): the Fathers saw in the unbroken net the Church gathering all nations without being torn."],["Two charcoal fires.","Peter denied Jesus by a charcoal fire (John 18:18) and is restored by another (John 21:9)."],["The song of the sea.","Exodus 15: the first Easter song, sung after passing through the waters, as we pass through Baptism."],["God did not make death.","Wisdom 1:13; God created for life, and in Christ restores it."]],
 altar:["“Come and have breakfast.” Jesus “took the bread and gave it to them” (John 21:13): the same gestures as at the Last Supper and Emmaus. At every Qurbono the risen Lord invites us to his table on the shore."],
 outline:[["Opening","Empty nets: nights of failure."],["Point 1 · “It is the Lord!”","Recognising Jesus in ordinary life."],["Point 2 · Breakfast on the shore","The risen Lord serves and feeds: the Eucharist."],["Point 3 · “Do you love me?”","Peter restored; our failures healed by love."],["Point 4 · Feed my sheep","Love becomes service: pray for our pastors."],["Take-home line","“Lord, you know that I love you.”"]],
 live:[["Answer the question","Each night this week answer Jesus: “Lord, you know that I love you.”"],["Begin again","Return to a good practice you abandoned after a failure."],["Pray for the Pope and bishops","Pray for Peter's successor and our Catholicos, shepherds of the flock."]],
 fathers:[["St Augustine","The threefold confession of love answers the threefold denial, so that his tongue might serve love no less than fear (Tractates on John 123)."],["St Gregory the Great","The disciples returned to fishing, which was not sin; but the Lord met them at their work, to show that he calls us in the midst of our daily labour (Homilies on the Gospels 24)."]],
 magis:[["Catechism 553, 881","Jesus entrusted to Peter a specific authority: to feed his sheep; the Pope is Peter's successor."],["Catechism 1429","Peter's conversion after his triple denial bears witness to Jesus' infinite mercy."],["Catechism 1347","The Eucharistic meals with the risen Lord (Emmaus, the shore) are signs of his presence."]],
 saints:[["This week","Weekdays of the season of Qyomtho. 18 April: III Sunday after Qyomtho."]],
 prayer:"Risen Lord, you met your disciples after a night of failure, filled their nets and fed them on the shore. Feed us at your table, heal our denials with your love, and send us to care for your flock. Lord, you know that we love you. Amen."},
 {quick:["The risen Lord meets us in our empty nights.","“Come and have breakfast”: he feeds us at his table.","“Do you love me?”: love restores us after failure."],action:"Each night this week, tell Jesus: “Lord, you know that I love you.”",question:"Have I let a failure stop me from following Jesus?",
  special:"Second Sunday after Qyomtho.",
  illus:["An illustration","Fishermen on Kerala's coast know nights when the boats come back empty. Then a call comes: “Fish to the north!” and the nets come back full. The disciples knew that morning; the risen Lord still turns our empty nights into full nets."],kids:"",diaspora:"",
  family:{read:"Read together: John 21:4–12.",explain:"The disciples caught nothing all night. Jesus told them where to throw the net, and it became full of fish! Then Jesus made them breakfast on the beach.",intention:"We pray for fishermen and for all who work hard and feel they have failed.",ask:"Ask: “When have we felt that we failed, and how did God help us?”"},
  catechism:[["CCC 553, 881","Peter, shepherd of the flock."],["CCC 1429","Peter's conversion."]],
  kidsaint:["St Peter","He denied Jesus three times, but Jesus forgave him and asked three times: “Do you love me?” Peter became the leader of the Church. Lesson: when you fail, come back to Jesus and say “I love you.”"],
  term:["The season of Qyomtho","The fifty days from Easter to Pentecost, kept as one great feast of the Resurrection. Its Sundays read the appearances of the risen Lord."],
  termMore:["Why fishing?","Many of the apostles were fishermen. After the Resurrection Jesus meets them at their work and makes them “fishers of people” for good."]},
 {homily:["Dear brothers and sisters, after Easter Peter says, “I am going fishing,” and six others go with him. They work all night and catch nothing. Many of us know such nights: hard work with nothing to show for it, prayers that seem unanswered, plans that fail.","At dawn a stranger calls from the shore: “Cast the net to the right side.” They do, and the net is full. John cries, “It is the Lord!” and Peter jumps into the water. On the beach Jesus has a fire going, with fish and bread. “Come and have breakfast.” The risen Lord cooks for his tired friends. That is our God: he meets us in our failures and feeds us.","After breakfast, beside the fire, Jesus asks Peter three times: “Do you love me?” Three times, because three times Peter had denied him by another fire. Jesus does not scold him; he lets love heal the wound. “Lord, you know that I love you.” “Feed my sheep.” Peter, forgiven, is made the shepherd of the Church.","Whatever your failures, Jesus asks you the same question today: “Do you love me?” Answer him honestly. And let your love become service: feed his lambs, in your family, your parish, your work. Every Holy Qurbono he says again: “Come and have breakfast.” Amen."],
  kids:["Children, the disciples went fishing all night and caught nothing. In the morning a man on the beach said: “Throw your net on the right side!” And the net was full of fish!","It was Jesus! He had made breakfast for them on the beach. Then he asked Peter: “Do you love me?” Peter said: “Yes, Lord, you know I love you!”","Jesus asks you too: “Do you love me?” What will you say? Let's say: “Jesus, I love you!”"]});

 readings:[[ML.eg,"യോഹന്നാൻ 21:15–19","നീ എന്നെ സ്നേഹിക്കുന്നുവോ? എന്റെ ആടുകളെ മേയിക്കുക"],[ML.ot,"പുറപ്പാട് 15:1–8","കടൽത്തീരത്തെ മോശയുടെ ഗീതം"],[ML.ot,"ജ്ഞാനം 1:12–16","ദൈവം മരണം സൃഷ്ടിച്ചില്ല"],[ML.ot,"ജോഷ്വ 6:8–14","ജറീക്കോയുടെ മതിലുകൾക്കു ചുറ്റും"],[ML.ot,"ഏശയ്യാ 63:1–6","രക്ഷിക്കാൻ ശക്തിയുള്ളവൻ"],[ML.ac,"അപ്പ. പ്രവ. 13:26–41","ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു"],[ML.pa,"എഫേസോസ് 6:18–24","എല്ലാ സമയത്തും ആത്മാവിൽ പ്രാർഥിക്കുവിൻ"],[ML.go,"യോഹന്നാൻ 21:1–14","തിബേരിയാസ് കടൽത്തീരത്ത് ഉത്ഥിതനായ കർത്താവ്"]],

 verse:"യേശു പറഞ്ഞു: വന്നു പ്രാതൽ കഴിക്കുവിൻ.",cite:"യോഹന്നാൻ 21:12",
 theo:["ഉയിർപ്പിനുശേഷം പത്രോസ് പറയുന്നു: “ഞാൻ മീൻപിടിക്കാൻ പോകുന്നു”; മറ്റുള്ളവരും അവനോടൊപ്പം പോകുന്നു. രാത്രി മുഴുവൻ അധ്വാനിച്ചിട്ടും ഒന്നും കിട്ടുന്നില്ല. പ്രഭാതത്തിൽ തീരത്തുനിന്ന് ഒരു അപരിചിതൻ പറയുന്നു: “വള്ളത്തിന്റെ വലത്തു വശത്തു വലയിടുക. അപ്പോൾ നിങ്ങൾക്കു കിട്ടും.” വലിച്ചുകയറ്റാൻ കഴിയാത്തവിധം വല നിറയുന്നു. പ്രിയശിഷ്യൻ പറയുന്നു: “അതു കർത്താവാണ്.” അവിടുത്തെ അടുത്തെത്താൻ പത്രോസ് കടലിലേക്കു ചാടുന്നു.","തീരത്തു യേശു തീ കൂട്ടി മീനും അപ്പവും ഒരുക്കിയിരിക്കുന്നു. “വന്നു പ്രാതൽ കഴിക്കുവിൻ.” മഹത്വമുള്ള ഉത്ഥിതനായ കർത്താവു തന്റെ ക്ഷീണിതരായ സുഹൃത്തുക്കൾക്കുവേണ്ടി പാചകം ചെയ്യുന്നു. അവരുടെ സാധാരണ ജോലിക്കിടയിൽ, അവരുടെ പരാജയത്തിൽ, അവിടുന്ന് അവരെ കണ്ടുമുട്ടി ഭക്ഷണം നൽകുന്നു. ഓരോ വിശുദ്ധ കുർബാനയും തീരത്തെ ഈ പ്രാതലാണ്: ഉത്ഥിതനായ കർത്താവ് അപ്പമെടുത്തു നമുക്കു നൽകുന്നു.","പിന്നെ, മറ്റൊരു കനലിനരികെ, യേശു പത്രോസിന്റെ മുറിവു സുഖപ്പെടുത്തുന്നു. പ്രധാനപുരോഹിതന്റെ മുറ്റത്തു തീയ്ക്കരികെവച്ച് മൂന്നു പ്രാവശ്യം പത്രോസ് അവിടുത്തെ തള്ളിപ്പറഞ്ഞിരുന്നു; മൂന്നു പ്രാവശ്യം യേശു ചോദിക്കുന്നു: “യോഹന്നാന്റെ പുത്രനായ ശിമയോനെ, നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” മൂന്നു പ്രാവശ്യം പത്രോസ് ഉത്തരം നൽകുന്നു: “കർത്താവേ, ഞാൻ നിന്നെ സ്നേഹിക്കുന്നുവെന്നു നീ അറിയുന്നുവല്ലോ.” മൂന്നു പ്രാവശ്യം യേശു അവനെ ഭരമേൽപിക്കുന്നു: “എന്റെ കുഞ്ഞാടുകളെ മേയിക്കുക… എന്റെ ആടുകളെ മേയിക്കുക.” പരാജയം അവസാനമല്ല; സ്നേഹം വീണ്ടെടുക്കുകയും അയയ്ക്കുകയും ചെയ്യുന്നു.","കടൽത്തീരത്തു മോശ പാടി: “കർത്താവ് എന്റെ ശക്തിയും സംരക്ഷകനുമാകുന്നു; അവിടുന്ന് എനിക്കു രക്ഷയായി ഭവിച്ചിരിക്കുന്നു.” ദൈവം മരണം സൃഷ്ടിച്ചില്ലെന്നു ജ്ഞാനം പറയുന്നു (ജ്ഞാനം 1:13). അന്ത്യോക്യായിൽ പൗലോസ് പ്രസംഗിക്കുന്നു: ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു. ഉത്ഥിതനായ ക്രിസ്തു ശൂന്യമായ രാത്രികളെ നിറഞ്ഞ വലകളാക്കുന്നു; തള്ളിപ്പറയലുകളെ സ്നേഹമാക്കുന്നു."],
 conn:[["നിറഞ്ഞ വല.","153 വലിയ മത്സ്യങ്ങൾ (യോഹ 21:11): കീറാത്ത വലയിൽ, കീറിപ്പോകാതെ എല്ലാ ജനതകളെയും ഒരുമിച്ചുകൂട്ടുന്ന സഭയെ പിതാക്കന്മാർ കണ്ടു."],["രണ്ടു കനലുകൾ.","ഒരു കനലിനരികെ പത്രോസ് യേശുവിനെ തള്ളിപ്പറഞ്ഞു (യോഹ 18:18); മറ്റൊന്നിനരികെ അവൻ വീണ്ടെടുക്കപ്പെടുന്നു (യോഹ 21:9)."],["കടലിന്റെ ഗീതം.","പുറപ്പാട് 15: ജലത്തിലൂടെ കടന്നശേഷം പാടിയ ആദ്യത്തെ ഉയിർപ്പുഗീതം; മാമ്മോദീസയിലൂടെ നാം കടന്നുപോകുന്നതുപോലെ."],["ദൈവം മരണം സൃഷ്ടിച്ചില്ല.","ജ്ഞാനം 1:13; ജീവനുവേണ്ടിയാണു ദൈവം സൃഷ്ടിച്ചത്; ക്രിസ്തുവിൽ അതു വീണ്ടെടുക്കുന്നു."]],
 altar:["“വന്നു പ്രാതൽ കഴിക്കുവിൻ.” യേശു “അപ്പമെടുത്ത് അവർക്കു കൊടുത്തു” (യോഹ 21:13): അന്ത്യത്താഴത്തിലും എമ്മാവൂസിലുമുള്ള അതേ ചേഷ്ടകൾ. ഓരോ കുർബാനയിലും തീരത്തെ തന്റെ മേശയിലേക്ക് ഉത്ഥിതനായ കർത്താവു നമ്മെ ക്ഷണിക്കുന്നു."],
 outline:[["ആരംഭം","ശൂന്യമായ വലകൾ: പരാജയത്തിന്റെ രാത്രികൾ."],["ഒന്നാം ആശയം · “അതു കർത്താവാണ്!”","സാധാരണജീവിതത്തിൽ യേശുവിനെ തിരിച്ചറിയുക."],["രണ്ടാം ആശയം · തീരത്തെ പ്രാതൽ","ഉത്ഥിതനായ കർത്താവു ശുശ്രൂഷിക്കുകയും പോഷിപ്പിക്കുകയും ചെയ്യുന്നു: ദിവ്യകാരുണ്യം."],["മൂന്നാം ആശയം · “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?”","പത്രോസ് വീണ്ടെടുക്കപ്പെടുന്നു; നമ്മുടെ പരാജയങ്ങൾ സ്നേഹത്താൽ സുഖപ്പെടുന്നു."],["നാലാം ആശയം · എന്റെ ആടുകളെ മേയിക്കുക","സ്നേഹം ശുശ്രൂഷയാകുന്നു: നമ്മുടെ ഇടയന്മാർക്കുവേണ്ടി പ്രാർഥിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, ഞാൻ നിന്നെ സ്നേഹിക്കുന്നുവെന്നു നീ അറിയുന്നുവല്ലോ.”"]],
 live:[["ചോദ്യത്തിന് ഉത്തരം നൽകുക","ഈ ആഴ്ച എല്ലാ രാത്രിയും യേശുവിനോട് ഉത്തരം പറയുക: “കർത്താവേ, ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങ് അറിയുന്നുവല്ലോ.”"],["വീണ്ടും ആരംഭിക്കുക","ഒരു പരാജയത്തിനുശേഷം ഉപേക്ഷിച്ച ഒരു നല്ല ശീലത്തിലേക്കു മടങ്ങുക."],["മാർപാപ്പയ്ക്കും മെത്രാന്മാർക്കുംവേണ്ടി പ്രാർഥിക്കുക","ആട്ടിൻകൂട്ടത്തിന്റെ ഇടയന്മാരായ പത്രോസിന്റെ പിൻഗാമിക്കും നമ്മുടെ കാതോലിക്കോസിനുംവേണ്ടി പ്രാർഥിക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","മൂന്നു പ്രാവശ്യത്തെ തള്ളിപ്പറയലിനു മൂന്നു പ്രാവശ്യത്തെ സ്നേഹപ്രഖ്യാപനം ഉത്തരം നൽകുന്നു; അവന്റെ നാവു ഭയത്തെക്കാൾ കുറയാതെ സ്നേഹത്തെ ശുശ്രൂഷിക്കാൻ (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രബന്ധങ്ങൾ 123)."],["മഹാനായ വിശുദ്ധ ഗ്രിഗറി","ശിഷ്യന്മാർ മീൻപിടിത്തത്തിലേക്കു മടങ്ങി; അതു പാപമായിരുന്നില്ല; പക്ഷേ അനുദിനാധ്വാനത്തിനിടയിൽ അവിടുന്നു നമ്മെ വിളിക്കുന്നുവെന്നു കാണിക്കാൻ കർത്താവ് അവരുടെ ജോലിക്കിടയിൽ അവരെ കണ്ടുമുട്ടി (സുവിശേഷപ്രസംഗങ്ങൾ 24)."]],
 magis:[["മതബോധനഗ്രന്ഥം 553, 881","യേശു പത്രോസിനു സവിശേഷമായ ഒരു അധികാരം ഏൽപിച്ചു: തന്റെ ആടുകളെ മേയിക്കുക; മാർപാപ്പ പത്രോസിന്റെ പിൻഗാമിയാണ്."],["മതബോധനഗ്രന്ഥം 1429","മൂന്നു പ്രാവശ്യത്തെ തള്ളിപ്പറയലിനുശേഷമുള്ള പത്രോസിന്റെ മാനസാന്തരം യേശുവിന്റെ അനന്തമായ കരുണയ്ക്കു സാക്ഷ്യം വഹിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1347","ഉത്ഥിതനായ കർത്താവുമൊത്തുള്ള ദിവ്യകാരുണ്യഭോജനങ്ങൾ (എമ്മാവൂസ്, കടൽത്തീരം) അവിടുത്തെ സാന്നിധ്യത്തിന്റെ അടയാളങ്ങളാണ്."]],
 saints:[["ഈ ആഴ്ച","ക്യംതോക്കാലത്തിലെ വാരദിവസങ്ങൾ. ഏപ്രിൽ 18: ക്യംതോയ്ക്കുശേഷമുള്ള മൂന്നാം ഞായർ."]],
 prayer:"ഉത്ഥിതനായ കർത്താവേ, പരാജയത്തിന്റെ ഒരു രാത്രിക്കുശേഷം അങ്ങു ശിഷ്യന്മാരെ കണ്ടുമുട്ടി, അവരുടെ വലകൾ നിറച്ച്, തീരത്ത് അവർക്കു ഭക്ഷണം നൽകി. അങ്ങയുടെ മേശയിൽ ഞങ്ങളെ പോഷിപ്പിക്കണമേ; ഞങ്ങളുടെ തള്ളിപ്പറയലുകൾ അങ്ങയുടെ സ്നേഹത്താൽ സുഖപ്പെടുത്തണമേ; അങ്ങയുടെ ആട്ടിൻകൂട്ടത്തെ പരിപാലിക്കാൻ ഞങ്ങളെ അയയ്ക്കണമേ. കർത്താവേ, ഞങ്ങൾ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങ് അറിയുന്നുവല്ലോ. ആമേൻ."},
 {quick:["നമ്മുടെ ശൂന്യമായ രാത്രികളിൽ ഉത്ഥിതനായ കർത്താവു നമ്മെ കണ്ടുമുട്ടുന്നു.","“വന്നു പ്രാതൽ കഴിക്കുവിൻ”: അവിടുത്തെ മേശയിൽ അവിടുന്നു നമ്മെ പോഷിപ്പിക്കുന്നു.","“നീ എന്നെ സ്നേഹിക്കുന്നുവോ?”: പരാജയത്തിനുശേഷം സ്നേഹം നമ്മെ വീണ്ടെടുക്കുന്നു."],action:"ഈ ആഴ്ച എല്ലാ രാത്രിയും യേശുവിനോടു പറയുക: “കർത്താവേ, ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങ് അറിയുന്നുവല്ലോ.”",question:"ഒരു പരാജയം യേശുവിനെ അനുഗമിക്കുന്നതിൽനിന്ന് എന്നെ തടയാൻ ഞാൻ അനുവദിച്ചിട്ടുണ്ടോ?",
  special:"ക്യംതോയ്ക്കുശേഷമുള്ള രണ്ടാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","വള്ളങ്ങൾ വെറുംകൈയോടെ മടങ്ങുന്ന രാത്രികൾ കേരളതീരത്തെ മീൻപിടിത്തക്കാർക്കറിയാം. അപ്പോൾ ഒരു വിളി വരുന്നു: “വടക്കോട്ടു മീനുണ്ട്!”; വലകൾ നിറഞ്ഞു മടങ്ങുന്നു. ആ പ്രഭാതം ശിഷ്യന്മാർക്കറിയാമായിരുന്നു; ഉത്ഥിതനായ കർത്താവ് ഇന്നും നമ്മുടെ ശൂന്യമായ രാത്രികളെ നിറഞ്ഞ വലകളാക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: യോഹന്നാൻ 21:4–12.",explain:"രാത്രി മുഴുവൻ ശിഷ്യന്മാർക്ക് ഒന്നും കിട്ടിയില്ല. എവിടെ വലയിടണമെന്ന് യേശു പറഞ്ഞു; വല നിറയെ മീൻ! പിന്നെ യേശു കടപ്പുറത്ത് അവർക്കു പ്രാതൽ ഒരുക്കി.",intention:"മീൻപിടിത്തക്കാർക്കും കഠിനാധ്വാനം ചെയ്തിട്ടും പരാജയപ്പെട്ടുവെന്നു തോന്നുന്ന എല്ലാവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “എപ്പോഴാണു നമുക്കു പരാജയം തോന്നിയത്? ദൈവം നമ്മെ എങ്ങനെ സഹായിച്ചു?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 553, 881","ആട്ടിൻകൂട്ടത്തിന്റെ ഇടയനായ പത്രോസ്."],["മതബോധനഗ്രന്ഥം 1429","പത്രോസിന്റെ മാനസാന്തരം."]],
  kidsaint:["വിശുദ്ധ പത്രോസ്","അവൻ മൂന്നു പ്രാവശ്യം യേശുവിനെ തള്ളിപ്പറഞ്ഞു; പക്ഷേ യേശു അവനോടു ക്ഷമിച്ചു മൂന്നു പ്രാവശ്യം ചോദിച്ചു: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” പത്രോസ് സഭയുടെ തലവനായി. പാഠം: പരാജയപ്പെടുമ്പോൾ യേശുവിലേക്കു മടങ്ങി “ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നു” എന്നു പറയുക."],
  term:["ക്യംതോക്കാലം","ഉയിർപ്പിന്റെ ഒരു മഹാതിരുനാളായി ആചരിക്കുന്ന, ഉയിർപ്പുമുതൽ പന്തക്കുസ്താവരെയുള്ള അമ്പതു ദിവസങ്ങൾ. അതിന്റെ ഞായറാഴ്ചകൾ ഉത്ഥിതനായ കർത്താവിന്റെ പ്രത്യക്ഷപ്പെടലുകൾ വായിക്കുന്നു."],
  termMore:["എന്തുകൊണ്ടു മീൻപിടിത്തം?","ശ്ലീഹന്മാരിൽ പലരും മീൻപിടിത്തക്കാരായിരുന്നു. ഉയിർപ്പിനുശേഷം യേശു അവരുടെ ജോലിക്കിടയിൽ അവരെ കണ്ടുമുട്ടി എന്നേക്കുമായി “മനുഷ്യരെ പിടിക്കുന്നവരാക്കുന്നു.”"]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഉയിർപ്പിനുശേഷം പത്രോസ് പറയുന്നു: “ഞാൻ മീൻപിടിക്കാൻ പോകുന്നു”; മറ്റ് ആറുപേരും അവനോടൊപ്പം പോകുന്നു. രാത്രി മുഴുവൻ അധ്വാനിക്കുന്നു; ഒന്നും കിട്ടുന്നില്ല. നമ്മിൽ പലർക്കും അത്തരം രാത്രികൾ അറിയാം: കാണിക്കാൻ ഒന്നുമില്ലാത്ത കഠിനാധ്വാനം, ഉത്തരം കിട്ടാത്തതുപോലെ തോന്നുന്ന പ്രാർഥനകൾ, പരാജയപ്പെടുന്ന പദ്ധതികൾ.","പ്രഭാതത്തിൽ തീരത്തുനിന്ന് ഒരു അപരിചിതൻ വിളിച്ചുപറയുന്നു: “വള്ളത്തിന്റെ വലത്തു വശത്തു വലയിടുക.” അവർ ഇടുന്നു; വല നിറയുന്നു. യോഹന്നാൻ ഉദ്ഘോഷിക്കുന്നു: “അതു കർത്താവാണ്!”; പത്രോസ് വെള്ളത്തിലേക്കു ചാടുന്നു. കടപ്പുറത്ത് യേശു തീ കൂട്ടി മീനും അപ്പവും ഒരുക്കിയിരിക്കുന്നു. “വന്നു പ്രാതൽ കഴിക്കുവിൻ.” ഉത്ഥിതനായ കർത്താവു തന്റെ ക്ഷീണിതരായ സുഹൃത്തുക്കൾക്കുവേണ്ടി പാചകം ചെയ്യുന്നു. അതാണു നമ്മുടെ ദൈവം: നമ്മുടെ പരാജയങ്ങളിൽ അവിടുന്നു നമ്മെ കണ്ടുമുട്ടി പോഷിപ്പിക്കുന്നു.","പ്രാതലിനുശേഷം, തീയ്ക്കരികെ, യേശു പത്രോസിനോടു മൂന്നു പ്രാവശ്യം ചോദിക്കുന്നു: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” മൂന്നു പ്രാവശ്യം; കാരണം മറ്റൊരു തീയ്ക്കരികെ പത്രോസ് മൂന്നു പ്രാവശ്യം അവിടുത്തെ തള്ളിപ്പറഞ്ഞിരുന്നു. യേശു അവനെ ശകാരിക്കുന്നില്ല; സ്നേഹം മുറിവുണക്കാൻ അനുവദിക്കുന്നു. “കർത്താവേ, ഞാൻ നിന്നെ സ്നേഹിക്കുന്നുവെന്നു നീ അറിയുന്നുവല്ലോ.” “എന്റെ ആടുകളെ മേയിക്കുക.” ക്ഷമിക്കപ്പെട്ട പത്രോസ് സഭയുടെ ഇടയനാക്കപ്പെടുന്നു.","നിന്റെ പരാജയങ്ങൾ എന്തായാലും ഇന്നു യേശു നിന്നോടും അതേ ചോദ്യം ചോദിക്കുന്നു: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” സത്യസന്ധമായി അവിടുത്തോട് ഉത്തരം പറയുക. നിന്റെ സ്നേഹം ശുശ്രൂഷയാകട്ടെ: നിന്റെ കുടുംബത്തിലും ഇടവകയിലും ജോലിസ്ഥലത്തും അവിടുത്തെ കുഞ്ഞാടുകളെ മേയിക്കുക. ഓരോ വിശുദ്ധ കുർബാനയിലും അവിടുന്നു വീണ്ടും പറയുന്നു: “വന്നു പ്രാതൽ കഴിക്കുവിൻ.” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ശിഷ്യന്മാർ രാത്രി മുഴുവൻ മീൻപിടിക്കാൻ പോയി; ഒന്നും കിട്ടിയില്ല. രാവിലെ കടപ്പുറത്തുനിന്ന് ഒരാൾ പറഞ്ഞു: “വലതുവശത്തു വലയിടൂ!” വല നിറയെ മീൻ!","അതു യേശുവായിരുന്നു! അവിടുന്നു കടപ്പുറത്ത് അവർക്കു പ്രാതൽ ഒരുക്കിയിരുന്നു. പിന്നെ പത്രോസിനോടു ചോദിച്ചു: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” പത്രോസ് പറഞ്ഞു: “ഉവ്വ് കർത്താവേ, ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങേക്കറിയാമല്ലോ!”","യേശു നിന്നോടും ചോദിക്കുന്നു: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” നീ എന്തു പറയും? നമുക്കു പറയാം: “യേശുവേ, ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നു!”"]});

put("2027-04-18","en",{title:"Third Sunday after Qyomtho · The Road to Emmaus",readTitle:EN.rt,
 readings:[[EN.eg,"Mark 16:9–13","He appeared in another form to two of them"],[EN.ot,"Exodus 40:1–15","The tabernacle and the priesthood"],[EN.ot,"Joshua 2:1–14","Rahab shelters the spies"],[EN.ot,"Amos 4:6–13","Yet you did not return to me"],[EN.ot,"Isaiah 65:1–7","I was ready to be found"],[EN.ac,"Acts 4:5–22","We cannot keep from speaking"],[EN.pa,"Ephesians 2:1–10","By grace you have been saved"],[EN.go,"Luke 24:13–35","The disciples of Emmaus"]],
 alt:"Season of Qyomtho.",
 verse:"Were not our hearts burning within us while he was talking to us on the road, while he was opening the scriptures to us?",cite:"Luke 24:32",
 theo:["On Easter afternoon two disciples walk away from Jerusalem towards Emmaus, sad and confused. “We had hoped that he was the one to redeem Israel.” Jesus himself comes near and walks with them, but their eyes are kept from recognising him. He listens to their sorrow, then opens the Scriptures: “beginning with Moses and all the prophets, he interpreted to them the things about himself in all the scriptures.”","As evening falls they beg him: “Stay with us, because it is almost evening.” At table “he took bread, blessed and broke it, and gave it to them. Then their eyes were opened, and they recognized him.” They had heard him in the Word; they recognise him in the breaking of the bread. Emmaus is the shape of every Holy Qurbono: first the Word that sets hearts burning, then the Bread in which we know him.","The two disciples do not wait until morning. That same hour they return to Jerusalem to tell the others: “The Lord has risen indeed.” A heart that has met the risen Lord cannot stay silent. Peter and John say the same before the council in Acts: “we cannot keep from speaking about what we have seen and heard.”","St Paul reminds us that this is all grace: “by grace you have been saved through faith, and this is not your own doing; it is the gift of God.” Jesus walks with us on our roads of disappointment, even when we do not recognise him. He waits to be invited: “Stay with us.”"],
 conn:[["Moses and the prophets.","Jesus reads the whole Old Testament as pointing to him (Luke 24:27): the reason our lectionary reads Law and Prophets every Sunday."],["The breaking of the bread.","Took, blessed, broke, gave: the words of the Last Supper (Luke 22:19) and of every Qurbono."],["Another form.","Mark 16:12: the risen Lord appears “in another form”; we must learn to recognise him."],["I was ready to be found.","Isaiah 65:1: God seeks those who were not seeking him."]],
 altar:["The Liturgy of the Word and the Holy Qurbono are Emmaus repeated every Sunday: our hearts burn as the Scriptures are opened, and our eyes are opened at the breaking of the bread."],
 outline:[["Opening","Walking away from Jerusalem: our disappointments."],["Point 1 · He walks with us","Even unrecognised, the Lord is near."],["Point 2 · Hearts burning","The Word opened: read Scripture with Christ as its key."],["Point 3 · Known in the breaking of the bread","The Qurbono: Word and Bread."],["Point 4 · Return and tell","“We cannot keep from speaking.”"],["Take-home line","“Stay with us, Lord.”"]],
 live:[["Read the Gospel daily","Read the Sunday Gospel each day this week and ask Jesus to open it to you."],["Invite him","Pray each evening: “Stay with us, Lord, for it is evening.”"],["Tell someone","Share with one person a time when you felt the Lord walking with you."]],
 fathers:[["St Augustine","They did not recognise him while he explained the Scriptures; they recognised him in the breaking of the bread. So we too, who do not see him in the flesh, recognise him in the breaking of the bread (Sermon 235)."],["St Gregory the Great","They invited the stranger to share their home, and found God; by hospitality they came to know the One they had not known in the explanation of the Scriptures (Homilies on the Gospels 23)."]],
 magis:[["Catechism 1346–1347","The Eucharistic liturgy unfolds like the Emmaus meal: the Word, then the breaking of bread."],["Dei Verbum 21","The Church has always venerated the Scriptures as she venerates the Body of the Lord, offering the bread of life from the table of the Word and of the Body."],["Verbum Domini 54","The Emmaus story shows the unity of Word and Eucharist."]],
 saints:[["This week (fixed dates)","23 Apr: St George, Martyr. 25 Apr: St Mark, Evangelist (falls on Sunday in 2027)."]],
 prayer:"Lord Jesus, you walked with the disciples of Emmaus and made their hearts burn as you opened the Scriptures. Walk with us on our roads, open the Word to us, make yourself known in the breaking of the bread, and stay with us, for it is evening. Amen."},
 {quick:["Jesus walks with us even when we do not recognise him.","Our hearts burn in the Word; our eyes open in the breaking of the bread.","Meeting the risen Lord, we cannot keep silent."],action:"Read the Sunday Gospel every day this week.",question:"On which road of disappointment do I need to recognise Jesus walking beside me?",
  special:"Third Sunday after Qyomtho: the disciples of Emmaus.",
  illus:["An illustration","A Kerala nurse working abroad felt lost and stopped going to church. One evening a stranger from her parish town invited her to an Indian Qurbono nearby. When the priest broke the bread, she wept: “I felt I was home.” Emmaus happens still."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 24:28–35.",explain:"Two sad friends walked with a stranger who explained the Bible to them. When he broke bread at supper, they saw it was Jesus! They ran back to tell everyone.",intention:"We pray for people who feel sad or lost, that they may meet Jesus.",ask:"Ask: “Where did we feel Jesus close to us this week?”"},
  catechism:[["CCC 1346–1347","Word and Eucharist."],["CCC 131–133","Scripture in the life of the Church."]],
  kidsaint:["St Mark the Evangelist (25 Apr)","He wrote the shortest Gospel, full of action, so that people everywhere could know Jesus. His Gospel tells how the risen Jesus appeared to two disciples on the road. Lesson: read a little of the Gospel every day."],
  term:["Emmaus","A village about eleven kilometres from Jerusalem, where two disciples recognised the risen Lord in the breaking of the bread (Luke 24:13–35). The story is a picture of every Holy Qurbono."],
  termMore:["The two tables","The Fathers spoke of two tables in the liturgy: the table of the Word and the table of the Body of Christ. Both nourish us."]},
 {homily:["Dear brothers and sisters, on Easter afternoon two disciples are walking away from Jerusalem, sad and disappointed. “We had hoped that he was the one,” they say. Many of us walk such roads: disappointed with life, with the Church, with God. And then a stranger joins them.","It is Jesus, but they do not recognise him. He lets them pour out their sorrow. Then he opens the Scriptures, from Moses and all the prophets, and shows them that the Messiah had to suffer and enter his glory. Later they will say: “Were not our hearts burning within us while he was opening the scriptures?”","As evening falls they invite him in: “Stay with us.” At table he takes bread, blesses it, breaks it and gives it to them, and their eyes are opened. This is exactly what happens at every Holy Qurbono: the Word sets our hearts on fire; the breaking of the bread opens our eyes. Emmaus is not just a story; it is our Sunday.","And they could not keep it to themselves. In the dark they ran back seven miles to Jerusalem to tell the others: “The Lord is risen!” Let us read the Gospel each day this week, invite Jesus into our homes, and tell someone what he has done for us. Stay with us, Lord. Amen."],
  kids:["Children, two friends of Jesus were walking home, very sad. A stranger walked with them and explained the Bible. Their hearts felt warm!","At supper the stranger broke the bread, and suddenly they saw: it was Jesus! Then he disappeared.","They ran all the way back to tell their friends! When the priest breaks the bread at Qurbana, Jesus is there too. Let's say: “Jesus, stay with us!”"]});

put("2027-04-18","ml",{title:"ക്യംതോയ്ക്കുശേഷമുള്ള മൂന്നാം ഞായർ · എമ്മാവൂസിലേക്കുള്ള വഴി",readTitle:ML.rt,
 readings:[[ML.eg,"മർക്കോസ് 16:9–13","വേറൊരു രൂപത്തിൽ അവരിൽ രണ്ടുപേർക്കു പ്രത്യക്ഷപ്പെട്ടു"],[ML.ot,"പുറപ്പാട് 40:1–15","സമാഗമകൂടാരവും പൗരോഹിത്യവും"],[ML.ot,"ജോഷ്വ 2:1–14","റാഹാബ് ചാരന്മാരെ ഒളിപ്പിക്കുന്നു"],[ML.ot,"ആമോസ് 4:6–13","എന്നിട്ടും നിങ്ങൾ എന്നിലേക്കു തിരിച്ചുവന്നില്ല"],[ML.ot,"ഏശയ്യാ 65:1–7","കണ്ടെത്തപ്പെടാൻ ഞാൻ തയ്യാറായിരുന്നു"],[ML.ac,"അപ്പ. പ്രവ. 4:5–22","സംസാരിക്കാതിരിക്കാൻ ഞങ്ങൾക്കു സാധ്യമല്ല"],[ML.pa,"എഫേസോസ് 2:1–10","കൃപയാലാണു നിങ്ങൾ രക്ഷിക്കപ്പെട്ടത്"],[ML.go,"ലൂക്കാ 24:13–35","എമ്മാവൂസിലെ ശിഷ്യന്മാർ"]],
 alt:"ക്യംതോക്കാലം.",
 verse:"വഴിയിൽവച്ച് അവൻ വിശുദ്ധലിഖിതം വിശദീകരിച്ചുകൊണ്ട് നമ്മോടു സംസാരിച്ചപ്പോൾ നമ്മുടെ ഹൃദയം ജ്വലിച്ചിരുന്നില്ലേ?",cite:"ലൂക്കാ 24:32",
 theo:["ഉയിർപ്പുദിവസം ഉച്ചകഴിഞ്ഞ് രണ്ടു ശിഷ്യന്മാർ ദുഃഖിതരും ആശയക്കുഴപ്പത്തിലുമായി ജറുസലെമിൽനിന്ന് എമ്മാവൂസിലേക്കു നടക്കുന്നു. “ഇസ്രായേലിനെ മോചിപ്പിക്കാനുള്ളവൻ അവനാണെന്നു ഞങ്ങൾ പ്രത്യാശിച്ചിരുന്നു.” “യേശുവും അടുത്തെത്തി അവരോടൊപ്പം യാത്ര ചെയ്തു”; പക്ഷേ അവിടുത്തെ തിരിച്ചറിയാൻ അവർക്കു കഴിഞ്ഞില്ല. അവിടുന്ന് അവരുടെ ദുഃഖം കേൾക്കുന്നു; പിന്നെ വിശുദ്ധലിഖിതം തുറക്കുന്നു: മോശമുതൽ എല്ലാ പ്രവാചകന്മാരിൽനിന്നും ആരംഭിച്ച് എല്ലാ ലിഖിതങ്ങളിലും തന്നെപ്പറ്റിയുള്ളവ അവർക്കു വ്യാഖ്യാനിച്ചുകൊടുത്തു.","സന്ധ്യയാകുമ്പോൾ അവർ അവിടുത്തെ നിർബന്ധിക്കുന്നു: “ഞങ്ങളോടുകൂടെ താമസിക്കുക. നേരം വൈകുന്നു; പകൽ അസ്തമിക്കാറായി.” ഭക്ഷണമേശയിൽ “അവൻ അപ്പം എടുത്ത് ആശീർവദിച്ച് മുറിച്ച് അവർക്കുകൊടുത്തു. അപ്പോൾ അവരുടെ കണ്ണു തുറക്കപ്പെട്ടു. അവർ അവനെ തിരിച്ചറിഞ്ഞു.” വചനത്തിൽ അവർ അവിടുത്തെ കേട്ടു; അപ്പം മുറിക്കലിൽ അവർ അവിടുത്തെ തിരിച്ചറിയുന്നു. ഓരോ വിശുദ്ധ കുർബാനയുടെയും രൂപമാണ് എമ്മാവൂസ്: ആദ്യം ഹൃദയങ്ങളെ ജ്വലിപ്പിക്കുന്ന വചനം, പിന്നെ അവിടുത്തെ തിരിച്ചറിയുന്ന അപ്പം.","രണ്ടു ശിഷ്യന്മാരും പ്രഭാതംവരെ കാത്തിരിക്കുന്നില്ല. ആ മണിക്കൂറിൽത്തന്നെ മറ്റുള്ളവരോടു പറയാൻ അവർ ജറുസലെമിലേക്കു മടങ്ങുന്നു: “കർത്താവു സത്യമായും ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.” ഉത്ഥിതനായ കർത്താവിനെ കണ്ടുമുട്ടിയ ഹൃദയത്തിനു നിശ്ശബ്ദമായിരിക്കാനാവില്ല. അപ്പസ്തോലപ്രവർത്തനങ്ങളിൽ ന്യായാധിപസംഘത്തിനു മുമ്പിൽ പത്രോസും യോഹന്നാനും അതുതന്നെ പറയുന്നു: “ഞങ്ങൾ കാണുകയും കേൾക്കുകയും ചെയ്ത കാര്യങ്ങളെക്കുറിച്ച് സംസാരിക്കാതിരിക്കാൻ ഞങ്ങൾക്കു സാധ്യമല്ല.”","ഇതെല്ലാം കൃപയാണെന്നു വിശുദ്ധ പൗലോസ് ഓർമിപ്പിക്കുന്നു: കൃപയാൽ വിശ്വാസംവഴിയാണു നിങ്ങൾ രക്ഷിക്കപ്പെട്ടത്; അതു നിങ്ങളിൽനിന്നുള്ളതല്ല, ദൈവത്തിന്റെ ദാനമാണ് (എഫേ 2:8). നാം തിരിച്ചറിയാത്തപ്പോഴും നിരാശയുടെ നമ്മുടെ വഴികളിൽ യേശു നമ്മോടൊപ്പം നടക്കുന്നു. ക്ഷണിക്കപ്പെടാൻ അവിടുന്നു കാത്തിരിക്കുന്നു: “ഞങ്ങളോടുകൂടെ താമസിക്കുക.”"],
 conn:[["മോശയും പ്രവാചകന്മാരും.","പഴയനിയമം മുഴുവൻ തന്നിലേക്കു ചൂണ്ടിക്കാണിക്കുന്നതായി യേശു വായിക്കുന്നു (ലൂക്കാ 24:27): നമ്മുടെ വായനാപുസ്തകം ഓരോ ഞായറാഴ്ചയും നിയമവും പ്രവാചകന്മാരും വായിക്കുന്നതിന്റെ കാരണം."],["അപ്പം മുറിക്കൽ.","എടുത്തു, ആശീർവദിച്ചു, മുറിച്ചു, കൊടുത്തു: അന്ത്യത്താഴത്തിന്റെയും (ലൂക്കാ 22:19) ഓരോ കുർബാനയുടെയും വാക്കുകൾ."],["വേറൊരു രൂപത്തിൽ.","മർക്കോ 16:12: ഉത്ഥിതനായ കർത്താവ് “വേറൊരു രൂപത്തിൽ” പ്രത്യക്ഷപ്പെടുന്നു; അവിടുത്തെ തിരിച്ചറിയാൻ നാം പഠിക്കണം."],["കണ്ടെത്തപ്പെടാൻ ഞാൻ തയ്യാറായിരുന്നു.","ഏശയ്യാ 65:1: തന്നെ അന്വേഷിക്കാതിരുന്നവരെ ദൈവം അന്വേഷിക്കുന്നു."]],
 altar:["വചനശുശ്രൂഷയും വിശുദ്ധ കുർബാനയും ഓരോ ഞായറാഴ്ചയും ആവർത്തിക്കപ്പെടുന്ന എമ്മാവൂസാണ്: വിശുദ്ധലിഖിതം തുറക്കപ്പെടുമ്പോൾ നമ്മുടെ ഹൃദയങ്ങൾ ജ്വലിക്കുന്നു; അപ്പം മുറിക്കുമ്പോൾ നമ്മുടെ കണ്ണുകൾ തുറക്കപ്പെടുന്നു."],
 outline:[["ആരംഭം","ജറുസലെമിൽനിന്ന് അകന്നുപോകുന്നു: നമ്മുടെ നിരാശകൾ."],["ഒന്നാം ആശയം · അവിടുന്നു നമ്മോടൊപ്പം നടക്കുന്നു","തിരിച്ചറിയപ്പെടാത്തപ്പോഴും കർത്താവ് അടുത്തുണ്ട്."],["രണ്ടാം ആശയം · ജ്വലിക്കുന്ന ഹൃദയങ്ങൾ","തുറക്കപ്പെട്ട വചനം: ക്രിസ്തുവിനെ താക്കോലാക്കി വിശുദ്ധഗ്രന്ഥം വായിക്കുക."],["മൂന്നാം ആശയം · അപ്പം മുറിക്കലിൽ തിരിച്ചറിയപ്പെടുന്നു","കുർബാന: വചനവും അപ്പവും."],["നാലാം ആശയം · മടങ്ങിച്ചെന്നു പറയുക","“സംസാരിക്കാതിരിക്കാൻ ഞങ്ങൾക്കു സാധ്യമല്ല.”"],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, ഞങ്ങളോടുകൂടെ താമസിക്കണമേ.”"]],
 live:[["എല്ലാ ദിവസവും സുവിശേഷം വായിക്കുക","ഈ ആഴ്ച ദിവസവും ഞായറാഴ്ചത്തെ സുവിശേഷം വായിച്ച്, അതു നിനക്കു തുറന്നുതരാൻ യേശുവിനോടു ചോദിക്കുക."],["അവിടുത്തെ ക്ഷണിക്കുക","എല്ലാ സന്ധ്യയിലും പ്രാർഥിക്കുക: “കർത്താവേ, ഞങ്ങളോടുകൂടെ താമസിക്കണമേ; നേരം സന്ധ്യയായി.”"],["ഒരാളോടു പറയുക","കർത്താവു നിന്നോടൊപ്പം നടക്കുന്നതായി നിനക്ക് അനുഭവപ്പെട്ട ഒരു സമയം ഒരാളുമായി പങ്കുവയ്ക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","വിശുദ്ധലിഖിതം വിശദീകരിച്ചപ്പോൾ അവർ അവിടുത്തെ തിരിച്ചറിഞ്ഞില്ല; അപ്പം മുറിക്കലിൽ അവർ അവിടുത്തെ തിരിച്ചറിഞ്ഞു. അതുപോലെ, ശരീരത്തിൽ അവിടുത്തെ കാണാത്ത നാമും അപ്പം മുറിക്കലിൽ അവിടുത്തെ തിരിച്ചറിയുന്നു (പ്രസംഗം 235)."],["മഹാനായ വിശുദ്ധ ഗ്രിഗറി","അപരിചിതനെ തങ്ങളുടെ ഭവനത്തിലേക്ക് അവർ ക്ഷണിച്ചു; ദൈവത്തെ കണ്ടെത്തി; വിശുദ്ധലിഖിതവ്യാഖ്യാനത്തിൽ അറിയാതിരുന്നവനെ ആതിഥ്യത്താൽ അവർ അറിഞ്ഞു (സുവിശേഷപ്രസംഗങ്ങൾ 23)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1346–1347","ദിവ്യകാരുണ്യ ആരാധനക്രമം എമ്മാവൂസിലെ ഭക്ഷണംപോലെ വിടരുന്നു: ആദ്യം വചനം, പിന്നെ അപ്പം മുറിക്കൽ."],["ദൈവാവിഷ്കരണം (ദേയി വെർബും) 21","കർത്താവിന്റെ ശരീരത്തെ എന്നപോലെ സഭ എന്നും വിശുദ്ധഗ്രന്ഥത്തെ വണങ്ങിയിട്ടുണ്ട്; വചനത്തിന്റെയും ശരീരത്തിന്റെയും മേശയിൽനിന്ന് അവൾ ജീവന്റെ അപ്പം നൽകുന്നു."],["കർത്താവിന്റെ വചനം (വെർബും ദോമിനി) 54","വചനത്തിന്റെയും ദിവ്യകാരുണ്യത്തിന്റെയും ഐക്യം എമ്മാവൂസ് സംഭവം കാണിക്കുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഏപ്രിൽ 23: രക്തസാക്ഷിയായ വിശുദ്ധ ഗീവർഗീസ്. ഏപ്രിൽ 25: സുവിശേഷകനായ വിശുദ്ധ മർക്കോസ് (2027-ൽ ഞായർ)."]],
 prayer:"കർത്താവായ യേശുവേ, എമ്മാവൂസിലെ ശിഷ്യന്മാരോടൊപ്പം അങ്ങു നടന്നു; വിശുദ്ധലിഖിതം തുറന്നപ്പോൾ അവരുടെ ഹൃദയങ്ങൾ ജ്വലിപ്പിച്ചു. ഞങ്ങളുടെ വഴികളിൽ ഞങ്ങളോടൊപ്പം നടക്കണമേ; വചനം ഞങ്ങൾക്കു തുറന്നുതരണമേ; അപ്പം മുറിക്കലിൽ അങ്ങയെത്തന്നെ വെളിപ്പെടുത്തണമേ; ഞങ്ങളോടുകൂടെ താമസിക്കണമേ; നേരം സന്ധ്യയായി. ആമേൻ."},
 {quick:["നാം തിരിച്ചറിയാത്തപ്പോഴും യേശു നമ്മോടൊപ്പം നടക്കുന്നു.","വചനത്തിൽ നമ്മുടെ ഹൃദയങ്ങൾ ജ്വലിക്കുന്നു; അപ്പം മുറിക്കലിൽ കണ്ണുകൾ തുറക്കുന്നു.","ഉത്ഥിതനായ കർത്താവിനെ കണ്ടുമുട്ടിയാൽ നിശ്ശബ്ദരായിരിക്കാനാവില്ല."],action:"ഈ ആഴ്ച എല്ലാ ദിവസവും ഞായറാഴ്ചത്തെ സുവിശേഷം വായിക്കുക.",question:"നിരാശയുടെ ഏതു വഴിയിലാണ് എന്റെ അരികിൽ നടക്കുന്ന യേശുവിനെ ഞാൻ തിരിച്ചറിയേണ്ടത്?",
  special:"ക്യംതോയ്ക്കുശേഷമുള്ള മൂന്നാം ഞായർ: എമ്മാവൂസിലെ ശിഷ്യന്മാർ.",
  illus:["ഒരു ഉദാഹരണം","വിദേശത്തു ജോലി ചെയ്യുന്ന ഒരു മലയാളി നഴ്സിന് ഒറ്റപ്പെടൽ തോന്നി; അവൾ പള്ളിയിൽ പോകാതായി. ഒരു സന്ധ്യയ്ക്കു സ്വന്തം നാട്ടുകാരിയായ ഒരപരിചിത അടുത്തുള്ള ഒരു ഇന്ത്യൻ കുർബാനയ്ക്ക് അവളെ ക്ഷണിച്ചു. വൈദികൻ അപ്പം മുറിച്ചപ്പോൾ അവൾ കരഞ്ഞു: “ഞാൻ വീട്ടിലെത്തിയതുപോലെ തോന്നി.” എമ്മാവൂസ് ഇന്നും സംഭവിക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 24:28–35.",explain:"ദുഃഖിതരായ രണ്ടു കൂട്ടുകാർ, ബൈബിൾ വിശദീകരിച്ചുകൊടുത്ത ഒരു അപരിചിതനോടൊപ്പം നടന്നു. അത്താഴസമയത്ത് അവിടുന്ന് അപ്പം മുറിച്ചപ്പോൾ അത് യേശുവാണെന്ന് അവർ കണ്ടു! എല്ലാവരോടും പറയാൻ അവർ തിരിച്ചോടി.",intention:"ദുഃഖിതരോ ഒറ്റപ്പെട്ടവരോ ആയവർ യേശുവിനെ കണ്ടുമുട്ടാൻ നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച യേശു നമ്മോട് അടുത്തുള്ളതായി എവിടെയാണു നമുക്കു തോന്നിയത്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1346–1347","വചനവും ദിവ്യകാരുണ്യവും."],["മതബോധനഗ്രന്ഥം 131–133","സഭയുടെ ജീവിതത്തിൽ വിശുദ്ധഗ്രന്ഥം."]],
  kidsaint:["സുവിശേഷകനായ വിശുദ്ധ മർക്കോസ് (ഏപ്രിൽ 25)","എല്ലായിടത്തുമുള്ള ആളുകൾ യേശുവിനെ അറിയാൻ, പ്രവർത്തനങ്ങൾ നിറഞ്ഞ ഏറ്റവും ചെറിയ സുവിശേഷം എഴുതിയവൻ. ഉത്ഥിതനായ യേശു വഴിയിൽവച്ചു രണ്ടു ശിഷ്യന്മാർക്കു പ്രത്യക്ഷപ്പെട്ടതും അദ്ദേഹത്തിന്റെ സുവിശേഷം പറയുന്നു. പാഠം: എല്ലാ ദിവസവും സുവിശേഷം അൽപം വായിക്കുക."],
  term:["എമ്മാവൂസ്","ജറുസലെമിൽനിന്ന് ഏകദേശം പതിനൊന്നു കിലോമീറ്റർ അകലെയുള്ള ഗ്രാമം; അവിടെ രണ്ടു ശിഷ്യന്മാർ അപ്പം മുറിക്കലിൽ ഉത്ഥിതനായ കർത്താവിനെ തിരിച്ചറിഞ്ഞു (ലൂക്കാ 24:13–35). ഓരോ വിശുദ്ധ കുർബാനയുടെയും ചിത്രമാണ് ഈ സംഭവം."],
  termMore:["രണ്ടു മേശകൾ","ആരാധനക്രമത്തിലെ രണ്ടു മേശകളെപ്പറ്റി പിതാക്കന്മാർ പറഞ്ഞു: വചനത്തിന്റെ മേശയും ക്രിസ്തുവിന്റെ ശരീരത്തിന്റെ മേശയും. ഇരുവരും നമ്മെ പോഷിപ്പിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഉയിർപ്പുദിവസം ഉച്ചകഴിഞ്ഞു രണ്ടു ശിഷ്യന്മാർ ദുഃഖിതരും നിരാശരുമായി ജറുസലെമിൽനിന്ന് അകന്നു നടക്കുന്നു. “അവനാണെന്നു ഞങ്ങൾ പ്രത്യാശിച്ചിരുന്നു” എന്ന് അവർ പറയുന്നു. നമ്മിൽ പലരും അത്തരം വഴികളിലൂടെ നടക്കുന്നു: ജീവിതത്തോടും സഭയോടും ദൈവത്തോടും നിരാശരായി. അപ്പോൾ ഒരു അപരിചിതൻ അവരോടൊപ്പം ചേരുന്നു.","അതു യേശുവാണ്; പക്ഷേ അവർ അവിടുത്തെ തിരിച്ചറിയുന്നില്ല. അവരുടെ ദുഃഖം പകരാൻ അവിടുന്ന് അവരെ അനുവദിക്കുന്നു. പിന്നെ മോശമുതൽ എല്ലാ പ്രവാചകന്മാരിൽനിന്നും വിശുദ്ധലിഖിതം തുറന്ന്, മിശിഹാ പീഡ സഹിച്ചു തന്റെ മഹത്വത്തിൽ പ്രവേശിക്കേണ്ടിയിരുന്നുവെന്ന് അവരെ കാണിക്കുന്നു. പിന്നീട് അവർ പറയും: “വഴിയിൽവച്ച് അവൻ വിശുദ്ധലിഖിതം വിശദീകരിച്ചുകൊണ്ട് നമ്മോടു സംസാരിച്ചപ്പോൾ നമ്മുടെ ഹൃദയം ജ്വലിച്ചിരുന്നില്ലേ?”","സന്ധ്യയാകുമ്പോൾ അവർ അവിടുത്തെ അകത്തേക്കു ക്ഷണിക്കുന്നു: “ഞങ്ങളോടുകൂടെ താമസിക്കുക.” ഭക്ഷണമേശയിൽ അവിടുന്ന് അപ്പമെടുത്ത്, ആശീർവദിച്ച്, മുറിച്ച്, അവർക്കു കൊടുക്കുന്നു; അവരുടെ കണ്ണുകൾ തുറക്കപ്പെടുന്നു. ഓരോ വിശുദ്ധ കുർബാനയിലും കൃത്യമായി സംഭവിക്കുന്നത് ഇതാണ്: വചനം നമ്മുടെ ഹൃദയങ്ങളെ ജ്വലിപ്പിക്കുന്നു; അപ്പം മുറിക്കൽ നമ്മുടെ കണ്ണുകൾ തുറക്കുന്നു. എമ്മാവൂസ് ഒരു കഥ മാത്രമല്ല; അതു നമ്മുടെ ഞായറാഴ്ചയാണ്.","അത് ഉള്ളിൽ സൂക്ഷിക്കാൻ അവർക്കായില്ല. ഇരുട്ടിൽ അവർ മറ്റുള്ളവരോടു പറയാൻ ജറുസലെമിലേക്കു തിരിച്ചോടി: “കർത്താവ് ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു!” ഈ ആഴ്ച എല്ലാ ദിവസവും നമുക്കു സുവിശേഷം വായിക്കാം; യേശുവിനെ നമ്മുടെ ഭവനങ്ങളിലേക്കു ക്ഷണിക്കാം; അവിടുന്നു നമുക്കുവേണ്ടി ചെയ്തത് ഒരാളോടു പറയാം. കർത്താവേ, ഞങ്ങളോടുകൂടെ താമസിക്കണമേ. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശുവിന്റെ രണ്ടു കൂട്ടുകാർ വളരെ സങ്കടത്തോടെ വീട്ടിലേക്കു നടക്കുകയായിരുന്നു. ഒരു അപരിചിതൻ അവരോടൊപ്പം നടന്ന് ബൈബിൾ വിശദീകരിച്ചുകൊടുത്തു. അവരുടെ ഹൃദയത്തിൽ ചൂടു തോന്നി!","അത്താഴസമയത്ത് ആ അപരിചിതൻ അപ്പം മുറിച്ചു; പെട്ടെന്ന് അവർ കണ്ടു: അതു യേശുവാണ്! പിന്നെ അവിടുന്ന് അപ്രത്യക്ഷനായി.","കൂട്ടുകാരോടു പറയാൻ അവർ ഓടി തിരിച്ചുപോയി! കുർബാനയിൽ വൈദികൻ അപ്പം മുറിക്കുമ്പോൾ യേശു അവിടെയുമുണ്ട്. നമുക്കു പറയാം: “യേശുവേ, ഞങ്ങളോടുകൂടെ താമസിക്കണമേ!”"]});
})();

put("2027-04-25","en",{title:"Fourth Sunday after Qyomtho",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 28:16–20","Go and make disciples of all nations"],[EN.ot,"Exodus 34:10–17","God renews the covenant"],[EN.ot,"Job 42:7–17","The Lord restores Job"],[EN.ot,"1 Kings 3:4–15","Solomon asks for wisdom"],[EN.ot,"Isaiah 49:8–13","In a time of favour I have answered you"],[EN.ac,"Acts 10:34–43","God shows no partiality"],[EN.pa,"2 Corinthians 5:17–21","A new creation; ambassadors for Christ"],[EN.go,"Luke 24:36–49","You are witnesses of these things"]],
 alt:"Season of Qyomtho. In the 2025–26 lectionary this Sunday was Syro-Malankara Catholic Laity Day. Today is also the feast of St Mark the Evangelist.",
 verse:"And remember, I am with you always, to the end of the age.",cite:"Matthew 28:20",
 theo:["The risen Lord stands among his frightened disciples: “Peace be with you… Why are you frightened, and why do doubts arise in your hearts? Look at my hands and my feet; see that it is I myself.” He eats before them. Then “he opened their minds to understand the scriptures”: the Messiah had to suffer and rise, and “repentance and forgiveness of sins is to be proclaimed in his name to all nations… You are witnesses of these things.”","In the evening Gospel the risen Christ gives the great commission on a mountain in Galilee: “All authority in heaven and on earth has been given to me. Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, and teaching them to obey everything that I have commanded you. And remember, I am with you always, to the end of the age.” The Church exists to evangelise.","Peter discovers in the house of Cornelius that “God shows no partiality”: the Gospel is for every nation. St Paul calls every Christian an ambassador: “if anyone is in Christ, there is a new creation… So we are ambassadors for Christ, since God is making his appeal through us.” This is why the Church honours the laity today: the mission is not only for priests and religious, but for every baptised person in family, work and society.","Job's fortunes were restored when he prayed for his friends; Solomon received wisdom when he asked for it. Let us ask the risen Lord for the wisdom and courage to be his witnesses, knowing that he is with us always."],
 conn:[["To all nations.","Isaiah 49:6, “a light to the nations”, is fulfilled when the risen Christ sends his disciples to all peoples (Luke 24:47; Matthew 28:19)."],["Touch and see.","The risen body is real: hands, feet, eating fish (Luke 24:39–43). The Resurrection is not a vision."],["A new creation.","2 Corinthians 5:17: in Christ the new creation begun on Easter morning reaches every believer."],["Prayer for friends.","Job 42:10: Job is restored when he prays for the friends who had wronged him."]],
 altar:["At the end of every Holy Qurbono the priest blesses and sends us out. That dismissal is the great commission: we leave the altar as witnesses, with the promise “I am with you always.”"],
 outline:[["Opening","Peace to frightened hearts."],["Point 1 · Real resurrection","Touch and see; he eats with them."],["Point 2 · Minds opened","Christ is the key to the Scriptures."],["Point 3 · Go, make disciples","The great commission belongs to all the baptised: Laity Day."],["Point 4 · I am with you always","Courage for witness."],["Take-home line","“You are witnesses of these things.”"]],
 live:[["Be an ambassador (2 Corinthians 5:20)","Speak one word of faith or hope to a colleague or neighbour this week."],["Serve in the parish","Offer your time to one parish ministry or lay association."],["Pray for missionaries","Pray for priests, sisters and lay missionaries from Kerala working in North India and abroad."]],
 fathers:[["St Leo the Great","Christ showed them his wounds so that the marks of the nails and the spear might heal the wounds of unbelieving hearts (Sermon 73 on the Ascension, 2)."],["St John Chrysostom","He did not say “I will be with you only”, but “with all who believe after you”; he spoke to all the faithful as to one body (Homilies on Matthew 90)."]],
 magis:[["Apostolicam Actuositatem 2–3","The Christian vocation is by its nature a vocation to the apostolate; the laity share in the priestly, prophetic and kingly office of Christ."],["Christifideles Laici 15","The lay faithful are called to sanctify the world from within, in family, work and society."],["Catechism 849–856","The missionary mandate: the Church is sent to all nations."]],
 saints:[["This week (fixed dates)","25 Apr: St Mark the Evangelist. 29 Apr: St Catherine of Siena. 1 May: St Joseph the Worker. 2 May: St Athanasius of Alexandria."]],
 prayer:"Risen Lord Jesus, you opened the minds of your disciples and sent them to all nations. Open our minds to the Scriptures, make us your ambassadors in our families and work, and keep us faithful to your promise: I am with you always. Amen."},
 {quick:["The risen Lord is real: “Touch me and see.”","“Go and make disciples of all nations”: every baptised person is sent.","“I am with you always, to the end of the age.”"],action:"Speak one word of faith or hope to a colleague or neighbour this week.",question:"Where is the Lord sending me as his witness this week?",
