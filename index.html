put("2027-03-25","en",{title:"Pesaha · The Lord's Supper",readTitle:EN.rt,
 readings:[[EN.eg,"John 7:37–53","Let anyone who is thirsty come to me"],[EN.ot,"Exodus 12:1–11","The Passover lamb"],[EN.ot,"Leviticus 16:3–10","The Day of Atonement"],[EN.ot,"Proverbs 1:10–19","Do not walk with those who lie in wait for blood"],[EN.ot,"Isaiah 24:16–23","The Lord will reign on Mount Zion"],[EN.rv,"Revelation 19:5–16","The marriage supper of the Lamb"],[EN.pa,"1 Corinthians 11:23–34","Do this in remembrance of me"],[EN.go,"Luke 22:14–30","The Last Supper"]],
 alt:"Pesaha (Maundy Thursday). In 2027 the date of the Annunciation (25 March) falls on this day; follow the direction of your eparchy on how the Annunciation is kept.",
 verse:"Then he took a loaf of bread, and when he had given thanks, he broke it and gave it to them, saying, “This is my body, which is given for you. Do this in remembrance of me.”",cite:"Luke 22:19",
 theo:["On the night before he suffered, Jesus gathered his apostles in the upper room. “I have eagerly desired to eat this Passover with you before I suffer.” At that table he took bread, gave thanks, broke it and said: “This is my body, which is given for you. Do this in remembrance of me.” And after supper he took the cup: “This cup that is poured out for you is the new covenant in my blood.” On this night the Holy Qurbono was born.","Exodus tells of the first Passover: a lamb without blemish, its blood on the doorposts, eaten in haste by a people ready to leave slavery. “When I see the blood, I will pass over you.” Jesus is the true Passover Lamb. His blood marks us, his Body feeds us for the journey from slavery to freedom, from death to life.","At the same table Jesus gave his apostles a lesson in greatness: “Who is greater, the one who is at the table or the one who serves? Is it not the one at the table? But I am among you as one who serves.” In our tradition the washing of feet makes this visible. The Eucharist and service cannot be separated: the One who gives his Body washes our feet.","St Paul hands on what he received: “For as often as you eat this bread and drink the cup, you proclaim the Lord's death until he comes.” He also warns against receiving unworthily. Pesaha is the night to thank God for the Holy Qurbono and the priesthood, to examine our hearts, and to stay awake with Jesus as he goes out to Gethsemane."],
 conn:[["The Passover lamb.","Exodus 12: the unblemished lamb whose blood saves; John 1:29 and 1 Corinthians 5:7: “Christ, our paschal lamb, has been sacrificed.”"],["The Day of Atonement.","Leviticus 16: the high priest enters the Holy of Holies with blood; Christ is priest and victim (Hebrews 9:11–14)."],["Rivers of living water.","John 7:37–38: from the heart of Christ flow streams of living water, fulfilled when his side is pierced (John 19:34)."],["The wedding supper of the Lamb.","Revelation 19:9: “Blessed are those who are invited to the marriage supper of the Lamb”: every Qurbono is a foretaste."]],
 altar:["Tonight we celebrate the Holy Qurbono at the very hour of its institution. The words the priest says over the bread and wine are the words of the upper room. Thank God tonight for every Qurbono you have received, and for the priests who celebrate it."],
 outline:[["Opening","The upper room: “I have eagerly desired to eat this Passover with you.”"],["Point 1 · The true Passover","From the lamb of Egypt to the Lamb of God."],["Point 2 · “This is my body”","The real presence: Christ gives himself."],["Point 3 · The one who serves","The washing of feet: Eucharist and service."],["Point 4 · Stay with him","Gethsemane: watch and pray with Jesus tonight."],["Take-home line","“Do this in remembrance of me.”"]],
 live:[["Pesaha at home","Share the Pesaha appam and paal as a family, praying for unity and remembering the Last Supper."],["Watch one hour","Spend time in adoration tonight, keeping Jesus company."],["Serve someone","Do one humble service for a family member this week, as Jesus washed feet."]],
 fathers:[["St Cyril of Jerusalem","“Since he himself has declared and said of the bread, This is my Body, who shall dare to doubt any longer? … Do not regard the bread and wine as simple elements, for they are, according to the Lord’s declaration, the Body and Blood of Christ” (Mystagogical Catecheses 4, 1 and 6)."],["St John Chrysostom","“It is not man who makes the gifts become the Body and Blood of Christ, but Christ himself, who was crucified for us. The priest stands there carrying out the action, but the power and grace are of God” (Homily on the Betrayal of Judas 1, 6)."]],
 magis:[["Catechism 1337–1340","The Lord instituted the Eucharist at the Last Supper as the memorial of his death and Resurrection, the new Passover."],["Ecclesia de Eucharistia 3–5","The Church draws her life from the Eucharist; it was born in the upper room."],["Catechism 1366–1367","The Eucharist is a sacrifice because it re-presents the sacrifice of the Cross."]],
 saints:[["Holy Week","Friday 26 March: Good Friday (the collection is for the Holy Land). Saturday 27 March: Holy Saturday. Sunday 28 March: Qyomtho, the Resurrection."]],
 prayer:"Lord Jesus, on the night you were betrayed you gave us your Body and Blood and washed your disciples' feet. Thank you for the Holy Qurbono and for the priesthood. Make us worthy to receive you, humble to serve one another, and faithful to stay with you in your agony. Amen."},
 {quick:["On this night Jesus gave us the Holy Qurbono.","He is the true Passover Lamb who saves us.","The One who gives his Body washes our feet: Eucharist and service."],action:"Spend time in adoration tonight, keeping Jesus company.",question:"How do I prepare to receive the Lord's Body and Blood?",
  special:"Pesaha (Maundy Thursday): Holy Qurbono of the Lord's Supper and the washing of the feet. In 2027 also the date of the Annunciation; follow the eparchy's direction.",
  illus:["An illustration","On Pesaha night St Thomas Christian families gather around the table, and the eldest breaks the Pesaha appam marked with a cross and shares it with everyone, even those away abroad who are remembered by name. The whole family becomes an upper room."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 22:14–20.",explain:"On the night before he died, Jesus had a special meal with his friends. He took bread and said, “This is my body,” and the cup, “This is my blood.” That is how he gave us Holy Qurbana.",intention:"We thank God for the Holy Qurbono and pray for our priests.",ask:"Ask: “What can each of us do to serve someone in our family this week?”"},
  catechism:[["CCC 1337–1340","The institution of the Eucharist."],["CCC 1366–1367","The Eucharistic sacrifice."]],
  kidsaint:["St John the Apostle","The youngest apostle, who rested his head on Jesus' chest at the Last Supper and later stood at the foot of the Cross with Mary. Lesson: stay close to Jesus, especially when it is hard."],
  term:["Pesaha (പെസഹാ)","From the Hebrew for “Passover”. Maundy Thursday, when the Lord instituted the Holy Qurbono and washed the disciples' feet. Kerala Christian families break the Pesaha appam at home in the evening."],
  termMore:["The washing of the feet","At the Pesaha service the bishop or priest washes the feet of twelve persons, as Jesus did (John 13:1–15), showing that the Eucharist leads to humble service."]},
 {homily:["Dear brothers and sisters, tonight we enter the upper room. Jesus says: “I have eagerly desired to eat this Passover with you before I suffer.” He knew what was coming: betrayal, arrest, the Cross. And on that night he gave us his greatest gift.","“He took bread, gave thanks, broke it and gave it to them, saying: This is my body, which is given for you. Do this in remembrance of me.” And the cup: “This cup is the new covenant in my blood.” The lamb of the first Passover saved Israel from death; Jesus, the true Lamb, gives himself to save the whole world. Every Holy Qurbono since that night is this same gift.","And at the same table Jesus taught them how to be great: “I am among you as one who serves.” He knelt and washed their feet. We cannot receive the Body of Christ and refuse to serve the body of Christ in our brothers and sisters. The altar and the towel belong together.","Tonight, at home, families will break the Pesaha appam. Let it be a real family communion: forgive one another, remember those far away, thank God for the Qurbono and for our priests. And after supper, do not leave Jesus alone. Stay with him, as he goes out to pray in Gethsemane. Amen."],
  kids:["Children, tonight is Pesaha. The night before Jesus died, he had a special supper with his friends. He took bread and said: “This is my body.” He took the cup and said: “This is my blood.” That was the first Holy Qurbana!","Then Jesus knelt down and washed his friends' feet, like a servant. He wanted to teach them to love and help one another.","Tonight at home, help someone without being asked. Let's say: “Thank you, Jesus, for giving us yourself!”"]});

put("2027-03-25","ml",{title:"പെസഹാ · കർത്താവിന്റെ അത്താഴം",readTitle:ML.rt,
 readings:[[ML.eg,"യോഹന്നാൻ 7:37–53","ആർക്കെങ്കിലും ദാഹിക്കുന്നെങ്കിൽ എന്റെ അടുക്കൽ വരട്ടെ"],[ML.ot,"പുറപ്പാട് 12:1–11","പെസഹാക്കുഞ്ഞാട്"],[ML.ot,"ലേവ്യർ 16:3–10","പാപപരിഹാരദിനം"],[ML.ot,"സുഭാഷിതങ്ങൾ 1:10–19","രക്തത്തിനായി പതിയിരിക്കുന്നവരോടൊപ്പം നടക്കരുത്"],[ML.ot,"ഏശയ്യാ 24:16–23","കർത്താവു സീയോൻമലയിൽ ഭരിക്കും"],[ML.rv,"വെളിപാട് 19:5–16","കുഞ്ഞാടിന്റെ വിവാഹവിരുന്ന്"],[ML.pa,"1 കോറിന്തോസ് 11:23–34","എന്റെ ഓർമയ്ക്കായി ഇതു ചെയ്യുവിൻ"],[ML.go,"ലൂക്കാ 22:14–30","അന്ത്യത്താഴം"]],
 alt:"പെസഹാവ്യാഴം. 2027-ൽ മംഗളവാർത്തയുടെ തീയതി (മാർച്ച് 25) ഈ ദിവസമാണ്; മംഗളവാർത്ത എങ്ങനെ ആചരിക്കണമെന്നതിൽ നിങ്ങളുടെ രൂപതയുടെ നിർദേശം പിന്തുടരുക.",
 verse:"പിന്നെ അവൻ അപ്പമെടുത്ത്, കൃതജ്ഞതാസ്തോത്രം ചെയ്ത്, മുറിച്ച്, അവർക്കു കൊടുത്തുകൊണ്ട് അരുളിച്ചെയ്തു: ഇതു നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്. എന്റെ ഓർമയ്ക്കായി ഇതു ചെയ്യുവിൻ.",cite:"ലൂക്കാ 22:19",
 theo:["പീഡ സഹിക്കുന്നതിന്റെ തലേരാത്രി യേശു തന്റെ ശ്ലീഹന്മാരെ മാളികമുറിയിൽ ഒരുമിച്ചുകൂട്ടി. “പീഡയനുഭവിക്കുന്നതിനുമുമ്പ് നിങ്ങളോടു കൂടെ ഈ പെസഹാ ഭക്ഷിക്കുന്നതിന് ഞാൻ അത്യധികം ആഗ്രഹിച്ചു.” ആ മേശയിൽ അവിടുന്ന് അപ്പമെടുത്ത്, കൃതജ്ഞതാസ്തോത്രം ചെയ്ത്, മുറിച്ച്, പറഞ്ഞു: “ഇതു നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്. എന്റെ ഓർമയ്ക്കായി ഇതു ചെയ്യുവിൻ.” അത്താഴത്തിനുശേഷം പാനപാത്രമെടുത്ത്: “ഈ പാനപാത്രം നിങ്ങൾക്കുവേണ്ടി ചിന്തപ്പെടുന്ന എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്.” ഈ രാത്രിയിലാണു വിശുദ്ധ കുർബാന ജനിച്ചത്.","ആദ്യത്തെ പെസഹായെപ്പറ്റി പുറപ്പാടു പറയുന്നു: ഊനമില്ലാത്ത ഒരു കുഞ്ഞാട്; കട്ടിളക്കാലുകളിൽ അതിന്റെ രക്തം; അടിമത്തം വിട്ടുപോകാൻ ഒരുങ്ങിയ ജനം തിടുക്കത്തിൽ ഭക്ഷിക്കുന്നു. “കട്ടിളയിലുള്ള രക്തം… അതു കാണുമ്പോൾ ഞാൻ നിങ്ങളെ കടന്നുപോകും.” യേശുവാണ് യഥാർഥ പെസഹാക്കുഞ്ഞാട്. അവിടുത്തെ രക്തം നമ്മെ അടയാളപ്പെടുത്തുന്നു; അടിമത്തത്തിൽനിന്നു സ്വാതന്ത്ര്യത്തിലേക്കും മരണത്തിൽനിന്നു ജീവനിലേക്കുമുള്ള യാത്രയ്ക്കായി അവിടുത്തെ ശരീരം നമ്മെ പോഷിപ്പിക്കുന്നു.","അതേ മേശയിൽ യേശു തന്റെ ശ്ലീഹന്മാർക്കു മഹത്വത്തെപ്പറ്റി ഒരു പാഠം നൽകി: “ആരാണു വലിയവൻ, ഭക്ഷണത്തിനിരിക്കുന്നവനോ പരിചരിക്കുന്നവനോ? ഭക്ഷണത്തിനിരിക്കുന്നവനല്ലേ? ഞാനാകട്ടെ നിങ്ങളുടെയിടയിൽ പരിചരിക്കുന്നവനെപ്പോലെയാണ്.” നമ്മുടെ പാരമ്പര്യത്തിൽ കാൽകഴുകൽ ശുശ്രൂഷ ഇതു ദൃശ്യമാക്കുന്നു. ദിവ്യകാരുണ്യവും ശുശ്രൂഷയും വേർപിരിക്കാനാവില്ല: തന്റെ ശരീരം നൽകുന്നവൻ നമ്മുടെ പാദങ്ങൾ കഴുകുന്നു.","തനിക്കു ലഭിച്ചതു വിശുദ്ധ പൗലോസ് കൈമാറുന്നു: നിങ്ങൾ ഈ അപ്പം ഭക്ഷിക്കുകയും ഈ പാനപാത്രത്തിൽനിന്നു പാനം ചെയ്യുകയും ചെയ്യുമ്പോഴെല്ലാം കർത്താവിന്റെ മരണം, അവിടുന്നു വരുവോളം, പ്രഖ്യാപിക്കുന്നു (1 കോറി 11:26). അയോഗ്യതയോടെ സ്വീകരിക്കുന്നതിനെതിരേ അദ്ദേഹം മുന്നറിയിപ്പും നൽകുന്നു. വിശുദ്ധ കുർബാനയ്ക്കും പൗരോഹിത്യത്തിനുംവേണ്ടി ദൈവത്തിനു നന്ദി പറയാനും ഹൃദയങ്ങൾ പരിശോധിക്കാനും ഗത്സെമനിയിലേക്കു പോകുന്ന യേശുവിനോടൊപ്പം ഉണർന്നിരിക്കാനുമുള്ള രാത്രിയാണു പെസഹാ."],
 conn:[["പെസഹാക്കുഞ്ഞാട്.","പുറപ്പാട് 12: രക്ഷിക്കുന്ന രക്തമുള്ള ഊനമില്ലാത്ത കുഞ്ഞാട്; യോഹ 1:29-ഉം 1 കോറി 5:7-ഉം: “നമ്മുടെ പെസഹാക്കുഞ്ഞാടായ ക്രിസ്തു ബലിയർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.”"],["പാപപരിഹാരദിനം.","ലേവ്യർ 16: പ്രധാനപുരോഹിതൻ രക്തവുമായി അതിവിശുദ്ധസ്ഥലത്തു പ്രവേശിക്കുന്നു; ക്രിസ്തു പുരോഹിതനും ബലിവസ്തുവുമാണ് (ഹെബ്രാ 9:11–14)."],["ജീവജലത്തിന്റെ അരുവികൾ.","“എന്നിൽ വിശ്വസിക്കുന്നവന്റെ ഹൃദയത്തിൽനിന്ന്… ജീവജലത്തിന്റെ അരുവികൾ ഒഴുകും” (യോഹ 7:38); അവിടുത്തെ പാർശ്വം കുത്തിത്തുറക്കപ്പെടുമ്പോൾ ഇതു നിറവേറുന്നു (യോഹ 19:34)."],["കുഞ്ഞാടിന്റെ വിവാഹവിരുന്ന്.","“കുഞ്ഞാടിന്റെ വിവാഹവിരുന്നിനു വിളിക്കപ്പെട്ടവർ ഭാഗ്യവാന്മാർ!” (വെളി 19:9): ഓരോ കുർബാനയും അതിന്റെ മുന്നാസ്വാദനമാണ്."]],
 altar:["അതു സ്ഥാപിക്കപ്പെട്ട അതേ മണിക്കൂറിൽ ഇന്നു രാത്രി നാം വിശുദ്ധ കുർബാന അർപ്പിക്കുന്നു. അപ്പത്തിന്മേലും വീഞ്ഞിന്മേലും വൈദികൻ ഉച്ചരിക്കുന്ന വാക്കുകൾ മാളികമുറിയിലെ വാക്കുകളാണ്. നീ സ്വീകരിച്ച ഓരോ കുർബാനയ്ക്കും അത് അർപ്പിക്കുന്ന വൈദികർക്കുംവേണ്ടി ഇന്നു രാത്രി ദൈവത്തിനു നന്ദി പറയുക."],
 outline:[["ആരംഭം","മാളികമുറി: “നിങ്ങളോടു കൂടെ ഈ പെസഹാ ഭക്ഷിക്കുന്നതിന് ഞാൻ അത്യധികം ആഗ്രഹിച്ചു.”"],["ഒന്നാം ആശയം · യഥാർഥ പെസഹാ","ഈജിപ്തിലെ കുഞ്ഞാടിൽനിന്നു ദൈവത്തിന്റെ കുഞ്ഞാടിലേക്ക്."],["രണ്ടാം ആശയം · “ഇത് എന്റെ ശരീരമാണ്”","യഥാർഥസാന്നിധ്യം: ക്രിസ്തു തന്നെത്തന്നെ നൽകുന്നു."],["മൂന്നാം ആശയം · പരിചരിക്കുന്നവൻ","കാൽകഴുകൽ: ദിവ്യകാരുണ്യവും ശുശ്രൂഷയും."],["നാലാം ആശയം · അവിടുത്തോടൊപ്പം ആയിരിക്കുക","ഗത്സെമനി: ഇന്നു രാത്രി യേശുവിനോടൊപ്പം ഉണർന്നിരുന്നു പ്രാർഥിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“എന്റെ ഓർമയ്ക്കായി ഇതു ചെയ്യുവിൻ.”"]],
 live:[["വീട്ടിലെ പെസഹാ","ഐക്യത്തിനായി പ്രാർഥിച്ച്, അന്ത്യത്താഴം ഓർത്തുകൊണ്ട്, കുടുംബമൊന്നിച്ചു പെസഹാ അപ്പവും പാലും പങ്കുവയ്ക്കുക."],["ഒരു മണിക്കൂർ ഉണർന്നിരിക്കുക","ഇന്നു രാത്രി ആരാധനയിൽ യേശുവിനു കൂട്ടിരിക്കുക."],["ഒരാളെ ശുശ്രൂഷിക്കുക","യേശു പാദങ്ങൾ കഴുകിയതുപോലെ, ഈ ആഴ്ച ഒരു കുടുംബാംഗത്തിന് എളിയ ഒരു ശുശ്രൂഷ ചെയ്യുക."]],
 fathers:[["ജറുസലെമിലെ വിശുദ്ധ സിറിൽ","“ഇത് എന്റെ ശരീരം” എന്ന് അപ്പത്തെക്കുറിച്ച് അവിടുന്നുതന്നെ പ്രഖ്യാപിച്ചിരിക്കെ ഇനി ആർ സംശയിക്കാൻ ധൈര്യപ്പെടും? … അപ്പത്തെയും വീഞ്ഞിനെയും വെറും വസ്തുക്കളായി കാണരുത്; കർത്താവിന്റെ പ്രഖ്യാപനമനുസരിച്ച് അവ ക്രിസ്തുവിന്റെ ശരീരവും രക്തവുമാണ് (മിസ്റ്റഗോജിക്കൽ മതബോധനങ്ങൾ 4, 1, 6)."],["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","കാഴ്ചവസ്തുക്കളെ ക്രിസ്തുവിന്റെ ശരീരവും രക്തവുമാക്കുന്നതു മനുഷ്യനല്ല, നമുക്കുവേണ്ടി ക്രൂശിക്കപ്പെട്ട ക്രിസ്തുതന്നെയാണ്. വൈദികൻ പ്രവൃത്തി നിർവഹിച്ചുകൊണ്ടു നിൽക്കുന്നു; ശക്തിയും കൃപയും ദൈവത്തിന്റേതാണ് (യൂദാസിന്റെ ഒറ്റിനെപ്പറ്റിയുള്ള പ്രസംഗം 1, 6)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1337–1340","തന്റെ മരണത്തിന്റെയും ഉയിർപ്പിന്റെയും സ്മാരകമായി, പുതിയ പെസഹായായി, അന്ത്യത്താഴവേളയിൽ കർത്താവു ദിവ്യകാരുണ്യം സ്ഥാപിച്ചു."],["സഭ ദിവ്യകാരുണ്യത്തിൽനിന്ന് (എക്ലേസിയ ദെ എവുക്കരിസ്തിയ) 3–5","സഭ തന്റെ ജീവൻ ദിവ്യകാരുണ്യത്തിൽനിന്നു സ്വീകരിക്കുന്നു; മാളികമുറിയിലാണ് അതു ജനിച്ചത്."],["മതബോധനഗ്രന്ഥം 1366–1367","കുരിശിലെ ബലി പുനരവതരിപ്പിക്കുന്നതിനാൽ ദിവ്യകാരുണ്യം ഒരു ബലിയാണ്."]],
 saints:[["ഹാശാആഴ്ച","മാർച്ച് 26 വെള്ളി: ദുഃഖവെള്ളി (സ്തോത്രക്കാഴ്ച വിശുദ്ധനാടിനുവേണ്ടി). മാർച്ച് 27 ശനി: ദുഃഖശനി. മാർച്ച് 28 ഞായർ: ക്യംതോ, ഉയിർപ്പ്."]],
 prayer:"കർത്താവായ യേശുവേ, ഒറ്റിക്കൊടുക്കപ്പെട്ട രാത്രിയിൽ അങ്ങയുടെ ശരീരവും രക്തവും ഞങ്ങൾക്കു നൽകുകയും ശിഷ്യന്മാരുടെ പാദങ്ങൾ കഴുകുകയും ചെയ്തു. വിശുദ്ധ കുർബാനയ്ക്കും പൗരോഹിത്യത്തിനും നന്ദി. അങ്ങയെ സ്വീകരിക്കാൻ ഞങ്ങളെ യോഗ്യരാക്കണമേ; പരസ്പരം ശുശ്രൂഷിക്കാൻ വിനീതരാക്കണമേ; അങ്ങയുടെ വേദനയിൽ അങ്ങയോടൊപ്പം ആയിരിക്കാൻ വിശ്വസ്തരാക്കണമേ. ആമേൻ."},
 {quick:["ഈ രാത്രിയിൽ യേശു നമുക്കു വിശുദ്ധ കുർബാന നൽകി.","നമ്മെ രക്ഷിക്കുന്ന യഥാർഥ പെസഹാക്കുഞ്ഞാടാണ് അവിടുന്ന്.","തന്റെ ശരീരം നൽകുന്നവൻ നമ്മുടെ പാദങ്ങൾ കഴുകുന്നു: ദിവ്യകാരുണ്യവും ശുശ്രൂഷയും."],action:"ഇന്നു രാത്രി ആരാധനയിൽ യേശുവിനു കൂട്ടിരിക്കുക.",question:"കർത്താവിന്റെ ശരീരരക്തങ്ങൾ സ്വീകരിക്കാൻ ഞാൻ എങ്ങനെ ഒരുങ്ങുന്നു?",
  special:"പെസഹാവ്യാഴം: കർത്താവിന്റെ അത്താഴത്തിന്റെ വിശുദ്ധ കുർബാനയും കാൽകഴുകൽ ശുശ്രൂഷയും. 2027-ൽ മംഗളവാർത്തയുടെ തീയതിയുമാണ്; രൂപതയുടെ നിർദേശം പിന്തുടരുക.",
  illus:["ഒരു ഉദാഹരണം","പെസഹാരാത്രിയിൽ മാർ തോമാ ക്രിസ്ത്യാനികളുടെ കുടുംബങ്ങൾ മേശയ്ക്കുചുറ്റും ഒരുമിച്ചുകൂടുന്നു; കുരിശടയാളമിട്ട പെസഹാ അപ്പം ഏറ്റവും മുതിർന്നയാൾ മുറിച്ച് എല്ലാവർക്കും പങ്കുവയ്ക്കുന്നു; വിദേശത്തുള്ളവരെപ്പോലും പേരെടുത്ത് ഓർക്കുന്നു. കുടുംബം മുഴുവൻ ഒരു മാളികമുറിയാകുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 22:14–20.",explain:"മരിക്കുന്നതിന്റെ തലേരാത്രി യേശു തന്റെ കൂട്ടുകാരോടൊപ്പം ഒരു പ്രത്യേക അത്താഴം കഴിച്ചു. അപ്പമെടുത്ത് “ഇത് എന്റെ ശരീരമാണ്” എന്നും പാനപാത്രമെടുത്ത് “ഇത് എന്റെ രക്തമാണ്” എന്നും പറഞ്ഞു. അങ്ങനെയാണ് അവിടുന്നു നമുക്കു വിശുദ്ധ കുർബാന നൽകിയത്.",intention:"വിശുദ്ധ കുർബാനയ്ക്കായി ദൈവത്തിനു നന്ദി പറഞ്ഞ്, നമ്മുടെ വൈദികർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമ്മുടെ കുടുംബത്തിലെ ഒരാളെ ശുശ്രൂഷിക്കാൻ നമ്മളോരോരുത്തർക്കും എന്തു ചെയ്യാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1337–1340","ദിവ്യകാരുണ്യസ്ഥാപനം."],["മതബോധനഗ്രന്ഥം 1366–1367","ദിവ്യകാരുണ്യബലി."]],
  kidsaint:["വിശുദ്ധ യോഹന്നാൻ ശ്ലീഹാ","അന്ത്യത്താഴത്തിൽ യേശുവിന്റെ മാറിൽ തല ചായ്ച്ച, പിന്നീടു മറിയത്തോടൊപ്പം കുരിശിന്റെ ചുവട്ടിൽ നിന്ന, ഏറ്റവും ഇളയ ശ്ലീഹാ. പാഠം: പ്രയാസമുള്ളപ്പോൾ പ്രത്യേകിച്ചും യേശുവിനോടു ചേർന്നു നിൽക്കുക."],
  term:["പെസഹാ","“കടന്നുപോകൽ” എന്നർഥമുള്ള ഹീബ്രുപദത്തിൽനിന്ന്. കർത്താവു വിശുദ്ധ കുർബാന സ്ഥാപിക്കുകയും ശിഷ്യന്മാരുടെ പാദങ്ങൾ കഴുകുകയും ചെയ്ത പെസഹാവ്യാഴം. കേരളത്തിലെ ക്രൈസ്തവകുടുംബങ്ങൾ സന്ധ്യയ്ക്കു വീട്ടിൽ പെസഹാ അപ്പം മുറിക്കുന്നു."],
  termMore:["കാൽകഴുകൽ ശുശ്രൂഷ","യേശു ചെയ്തതുപോലെ (യോഹ 13:1–15) പെസഹാശുശ്രൂഷയിൽ മെത്രാനോ വൈദികനോ പന്ത്രണ്ടുപേരുടെ പാദങ്ങൾ കഴുകുന്നു; ദിവ്യകാരുണ്യം എളിയ ശുശ്രൂഷയിലേക്കു നയിക്കുന്നുവെന്ന് അതു കാണിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു രാത്രി നാം മാളികമുറിയിൽ പ്രവേശിക്കുന്നു. യേശു പറയുന്നു: “പീഡയനുഭവിക്കുന്നതിനുമുമ്പ് നിങ്ങളോടു കൂടെ ഈ പെസഹാ ഭക്ഷിക്കുന്നതിന് ഞാൻ അത്യധികം ആഗ്രഹിച്ചു.” വരാനിരിക്കുന്നത് അവിടുത്തേക്ക് അറിയാമായിരുന്നു: ഒറ്റിക്കൊടുക്കൽ, ബന്ധനം, കുരിശ്. ആ രാത്രിയിൽ അവിടുന്നു തന്റെ ഏറ്റവും വലിയ ദാനം നമുക്കു നൽകി.","“അവൻ അപ്പമെടുത്ത്, കൃതജ്ഞതാസ്തോത്രം ചെയ്ത്, മുറിച്ച്, അവർക്കു കൊടുത്തുകൊണ്ട് അരുളിച്ചെയ്തു: ഇതു നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്. എന്റെ ഓർമയ്ക്കായി ഇതു ചെയ്യുവിൻ.” പിന്നെ പാനപാത്രം: “ഈ പാനപാത്രം നിങ്ങൾക്കുവേണ്ടി ചിന്തപ്പെടുന്ന എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്.” ആദ്യപെസഹായിലെ കുഞ്ഞാട് ഇസ്രായേലിനെ മരണത്തിൽനിന്നു രക്ഷിച്ചു; യഥാർഥ കുഞ്ഞാടായ യേശു ലോകം മുഴുവനെയും രക്ഷിക്കാൻ തന്നെത്തന്നെ നൽകുന്നു. ആ രാത്രിമുതലുള്ള ഓരോ വിശുദ്ധ കുർബാനയും ഇതേ ദാനമാണ്.","അതേ മേശയിൽ എങ്ങനെ വലിയവരാകാമെന്ന് യേശു അവരെ പഠിപ്പിച്ചു: “ഞാനാകട്ടെ നിങ്ങളുടെയിടയിൽ പരിചരിക്കുന്നവനെപ്പോലെയാണ്.” അവിടുന്നു മുട്ടുകുത്തി അവരുടെ പാദങ്ങൾ കഴുകി. ക്രിസ്തുവിന്റെ ശരീരം സ്വീകരിച്ചിട്ടു നമ്മുടെ സഹോദരീസഹോദരന്മാരിലുള്ള ക്രിസ്തുവിന്റെ ശരീരത്തെ ശുശ്രൂഷിക്കാൻ വിസമ്മതിക്കാനാവില്ല. ബലിപീഠവും തോർത്തും ഒന്നിച്ചുപോകുന്നു.","ഇന്നു രാത്രി വീടുകളിൽ കുടുംബങ്ങൾ പെസഹാ അപ്പം മുറിക്കും. അതു യഥാർഥമായ ഒരു കുടുംബക്കൂട്ടായ്മയാകട്ടെ: പരസ്പരം ക്ഷമിക്കുക, ദൂരെയുള്ളവരെ ഓർക്കുക, കുർബാനയ്ക്കും നമ്മുടെ വൈദികർക്കുംവേണ്ടി ദൈവത്തിനു നന്ദി പറയുക. അത്താഴത്തിനുശേഷം യേശുവിനെ ഒറ്റയ്ക്കാക്കരുത്. ഗത്സെമനിയിൽ പ്രാർഥിക്കാൻ പോകുന്ന അവിടുത്തോടൊപ്പം ആയിരിക്കുക. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഇന്നു പെസഹാ രാത്രിയാണ്. മരിക്കുന്നതിന്റെ തലേരാത്രി യേശു തന്റെ കൂട്ടുകാരോടൊപ്പം ഒരു പ്രത്യേക അത്താഴം കഴിച്ചു. അപ്പമെടുത്ത് അവിടുന്നു പറഞ്ഞു: “ഇത് എന്റെ ശരീരമാണ്.” പാനപാത്രമെടുത്തു പറഞ്ഞു: “ഇത് എന്റെ രക്തമാണ്.” അതായിരുന്നു ആദ്യത്തെ വിശുദ്ധ കുർബാന!","പിന്നെ യേശു ഒരു വേലക്കാരനെപ്പോലെ മുട്ടുകുത്തി കൂട്ടുകാരുടെ പാദങ്ങൾ കഴുകി. പരസ്പരം സ്നേഹിക്കാനും സഹായിക്കാനും അവരെ പഠിപ്പിക്കാൻ അവിടുന്ന് ആഗ്രഹിച്ചു.","ഇന്നു രാത്രി വീട്ടിൽ, ആരും പറയാതെതന്നെ ഒരാളെ സഹായിക്കുക. നമുക്കു പറയാം: “യേശുവേ, അങ്ങയെത്തന്നെ ഞങ്ങൾക്കു തന്നതിനു നന്ദി!”"]});

/* ================= GOOD FRIDAY · 26 March 2027 ================= */
put("2027-03-26","en",{title:"Good Friday · The Passion and Death of our Lord",readTitle:"Readings",
 readings:[["Holy Week service book","Readings of the Hours of Good Friday","Not listed in the Sacred Lectionary; follow the Hasho (Holy Week) book"],["The Passion","Matthew 26–27; Mark 14–15; Luke 22–23; John 18–19","The Gospels of the Passion read through the day"]],
 alt:"Good Friday. A day of fasting. The collection of the day is for the Holy Land, as directed by the Holy Father.",
 verse:"When Jesus had received the wine, he said, “It is finished.” Then he bowed his head and gave up his spirit.",cite:"John 19:30",
 theo:["On Good Friday the Church stands at the foot of the Cross. The One who entered Jerusalem to the cry of Hosanna is condemned, mocked, scourged, crowned with thorns, and crucified outside the city between two criminals. The Holy One is counted among the wicked. The prophet had seen it long before: “He was wounded for our transgressions, crushed for our iniquities… and by his bruises we are healed” (Isaiah 53:5).","From the Cross Jesus speaks words that the Church treasures. “Father, forgive them; for they do not know what they are doing.” To the repentant thief: “Truly I tell you, today you will be with me in Paradise.” To his Mother and the beloved disciple: “Woman, here is your son… Here is your mother.” Then the cry of the abandoned: “My God, my God, why have you forsaken me?” And at the end: “It is finished”, and “Father, into your hands I commend my spirit.”","“It is finished” is not a cry of defeat but of completion. The work the Father gave him is accomplished: the true Lamb has been sacrificed, the new covenant sealed in his blood. A soldier pierces his side, “and at once blood and water came out” (John 19:34). The Fathers saw in that blood and water the Eucharist and Baptism, the Church born from the side of Christ as Eve from the side of Adam.","On this day there is no Holy Qurbono in our tradition; the altar is bare because the Lamb himself is offered on the Cross. We venerate the Cross, we keep fast and silence, and we stand with Mary, who did not run away. The wood of shame has become the tree of life. “We adore you, O Christ, and we bless you, because by your holy Cross you have redeemed the world.”"],
 conn:[["The Suffering Servant.","Isaiah 52:13–53:12 describes the Passion centuries before it happened."],["The tree of life.","The tree in Eden brought death; the tree of the Cross brings life (Genesis 2:9; Revelation 22:2)."],["The bronze serpent.","“As Moses lifted up the serpent in the wilderness, so must the Son of Man be lifted up” (John 3:14; Numbers 21:9)."],["The new Adam's side.","As Eve was formed from Adam's side, the Church is born from the pierced side of Christ (John 19:34)."]],
 altar:["Today the altar stands bare and there is no Holy Qurbono, for the one Sacrifice is contemplated on the Cross. Every Qurbono we celebrate makes present this same sacrifice of Calvary; today we simply kneel before it."],
 outline:[["Opening","Silence before the Cross."],["Point 1 · Wounded for us","Isaiah 53: by his bruises we are healed."],["Point 2 · The words from the Cross","Forgiveness, Paradise, Mary, abandonment, completion, surrender."],["Point 3 · Blood and water","The Church and the sacraments born from his side."],["Point 4 · Stand with Mary","Do not run away; venerate the Cross."],["Take-home line","“By your holy Cross you have redeemed the world.”"]],
 live:[["Keep the fast","Fast today with love, offering it for those who suffer."],["Forgive (Luke 23:34)","Forgive one person today, as Jesus forgave from the Cross."],["Venerate the Cross","Take part in the Good Friday service and kiss the Cross with gratitude."]],
 fathers:[["St John Chrysostom","“There flowed from his side water and blood… the symbols of Baptism and the Mysteries. From these two the Church is born… as Eve was formed from the side of Adam” (Catechesis 3, 13–19)."],["St Cyril of Jerusalem","“He stretched out his hands on the Cross, that he might embrace the ends of the world; for Golgotha is the centre of the earth” (Catechetical Lectures 13, 28)."]],
 magis:[["Catechism 613–618","Christ's death is the Paschal sacrifice that accomplishes the definitive redemption of humanity; he offered himself freely."],["Catechism 964","Mary's union with her Son in the work of salvation is shown at the foot of the Cross."],["Catechism 766","The Church is born primarily of Christ's total self-giving: from the side of Christ asleep on the Cross."]],
 saints:[["Holy Week","Saturday 27 March: Holy Saturday. Sunday 28 March: Qyomtho, the Resurrection."]],
 prayer:"Lord Jesus Christ, crucified for us, we adore you and we bless you, because by your holy Cross you have redeemed the world. Forgive us, remember us in your kingdom, give us your Mother as our mother, and let us die with you to sin, that we may rise with you to life. Amen."},
 {quick:["“He was wounded for our transgressions.”","From the Cross: forgiveness, Paradise, and Mary given to us.","“It is finished”: the work of salvation is complete."],action:"Forgive one person today, as Jesus forgave from the Cross.",question:"What does the Cross ask of me today?",
  special:"Good Friday: day of fasting; no Holy Qurbono; veneration of the Cross. Collection for the Holy Land.",
  illus:["An illustration","In many Kerala homes on Good Friday the television is switched off, the family eats only kanji, and an old crucifix is placed on the table. The children ask why. A grandmother answers: “Because today Jesus died for you.”"],kids:"",diaspora:"",
  family:{read:"Read together: Luke 23:33–34, 39–46.",explain:"Jesus died on the cross because he loves us. Even on the cross he forgave the people who hurt him, and he promised heaven to the thief who asked for mercy.",intention:"We pray for all who are suffering, and we thank Jesus for his love.",ask:"Ask: “Is there someone I need to forgive today?”"},
  catechism:[["CCC 613–618","The sacrifice of Christ."],["CCC 964","Mary at the foot of the Cross."]],
  kidsaint:["The Good Thief","One of the men crucified beside Jesus said: “Jesus, remember me when you come into your kingdom.” Jesus promised: “Today you will be with me in Paradise.” (Later tradition calls him Dismas.) Lesson: it is never too late to turn to Jesus."],
  term:["Good Friday (ദുഃഖവെള്ളി)","The day of the Lord's Passion and death. In the Malankara tradition the long service of the Hours is prayed, the Cross is venerated and then laid to rest, recalling the burial of the Lord, and the faithful keep fast."],
  termMore:["Why “Good” Friday?","Because on this day, through the suffering of Christ, the greatest good was done: the redemption of the world. In Malayalam it is called the Friday of sorrow; both names are true."]},
 {homily:["Dear brothers and sisters, today we stand at the foot of the Cross. The One who was welcomed with Hosanna on Sunday is today mocked, scourged, crowned with thorns and nailed to a cross between two criminals. Isaiah had seen it: “He was wounded for our transgressions, crushed for our iniquities; by his bruises we are healed.”","Listen to his words from the Cross. “Father, forgive them; for they do not know what they are doing.” He forgives those who are killing him. To the thief who asks to be remembered, he promises: “Today you will be with me in Paradise.” To his Mother and the beloved disciple he says: “Here is your son; here is your mother.” He gives us his own Mother.","And then: “It is finished.” Not “I am finished”, but “It is accomplished.” The work of salvation is complete. The soldier's spear opens his side, and blood and water flow: the Fathers saw there the Eucharist and Baptism, the Church born from the heart of Christ.","Today there is no Qurbono; the altar is bare. We kneel before the Cross, we fast, we keep silence, and we stand with Mary who did not run away. Let each of us forgive someone today, as he forgave. We adore you, O Christ, and we bless you, because by your holy Cross you have redeemed the world. Amen."],
  kids:["Children, today is Good Friday. Jesus died on the cross. He let it happen because he loves us so much and wanted to take away our sins.","On the cross Jesus forgave the people who hurt him. He told a thief who was sorry: “Today you will be with me in heaven.”","Today let's be quiet, pray, and say sorry to anyone we have hurt. Let's say: “Thank you, Jesus, for loving me so much!”"]});

put("2027-03-26","ml",{title:"ദുഃഖവെള്ളി · നമ്മുടെ കർത്താവിന്റെ പീഡാസഹനവും മരണവും",readTitle:"വായനകൾ",
 readings:[["ഹാശാആഴ്ചയിലെ ശുശ്രൂഷാപുസ്തകം","ദുഃഖവെള്ളിയിലെ യാമങ്ങളിലെ വായനകൾ","വിശുദ്ധ വായനാപുസ്തകത്തിൽ കൊടുത്തിട്ടില്ല; ഹാശാആഴ്ചയിലെ പുസ്തകം പിന്തുടരുക"],["പീഡാനുഭവം","മത്തായി 26–27; മർക്കോസ് 14–15; ലൂക്കാ 22–23; യോഹന്നാൻ 18–19","ദിവസം മുഴുവൻ വായിക്കുന്ന പീഡാനുഭവസുവിശേഷങ്ങൾ"]],
 alt:"ദുഃഖവെള്ളി. ഉപവാസദിനം. മാർപാപ്പയുടെ നിർദേശപ്രകാരം ഇന്നത്തെ സ്തോത്രക്കാഴ്ച വിശുദ്ധനാടിനുവേണ്ടിയാണ്.",
 verse:"യേശു വിനാഗിരി സ്വീകരിച്ചിട്ടു പറഞ്ഞു: എല്ലാം പൂർത്തിയായിരിക്കുന്നു. അവൻ തല ചായ്ച്ച് ആത്മാവിനെ സമർപ്പിച്ചു.",cite:"യോഹന്നാൻ 19:30",
 theo:["ദുഃഖവെള്ളിയാഴ്ച സഭ കുരിശിന്റെ ചുവട്ടിൽ നിൽക്കുന്നു. ഹോസാന വിളിയോടെ ജറുസലെമിൽ പ്രവേശിച്ചവൻ വിധിക്കപ്പെടുന്നു, പരിഹസിക്കപ്പെടുന്നു, ചമ്മട്ടികൊണ്ട് അടിക്കപ്പെടുന്നു, മുൾമുടി ധരിപ്പിക്കപ്പെടുന്നു, നഗരത്തിനു പുറത്തു രണ്ടു കുറ്റവാളികളുടെ നടുവിൽ ക്രൂശിക്കപ്പെടുന്നു. പരിശുദ്ധൻ ദുഷ്ടന്മാരുടെ ഗണത്തിൽ എണ്ണപ്പെടുന്നു. പ്രവാചകൻ വളരെ മുമ്പേ അതു കണ്ടിരുന്നു: “നമ്മുടെ അതിക്രമങ്ങൾക്കുവേണ്ടി അവൻ മുറിവേൽപ്പിക്കപ്പെട്ടു. നമ്മുടെ അകൃത്യങ്ങൾക്കുവേണ്ടി ക്ഷതമേൽപ്പിക്കപ്പെട്ടു… അവന്റെ ക്ഷതങ്ങളാൽ നാം സൗഖ്യം പ്രാപിച്ചു” (ഏശ 53:5).","സഭ നിധിപോലെ സൂക്ഷിക്കുന്ന വാക്കുകൾ കുരിശിൽനിന്ന് യേശു പറയുന്നു. “പിതാവേ, അവരോടു ക്ഷമിക്കണമേ; അവർ ചെയ്യുന്നതെന്തെന്ന് അവർ അറിയുന്നില്ല.” അനുതപിച്ച കള്ളനോട്: “സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു, നീ ഇന്ന് എന്നോടുകൂടെ പറുദീസായിൽ ആയിരിക്കും.” തന്റെ അമ്മയോടും പ്രിയശിഷ്യനോടും: “സ്ത്രീയേ, ഇതാ, നിന്റെ മകൻ… ഇതാ, നിന്റെ അമ്മ.” പിന്നെ ഉപേക്ഷിക്കപ്പെട്ടവന്റെ നിലവിളി: “എന്റെ ദൈവമേ, എന്റെ ദൈവമേ, എന്തുകൊണ്ടു നീ എന്നെ ഉപേക്ഷിച്ചു?” ഒടുവിൽ: “എല്ലാം പൂർത്തിയായിരിക്കുന്നു”; “പിതാവേ, അങ്ങയുടെ കരങ്ങളിൽ എന്റെ ആത്മാവിനെ ഞാൻ സമർപ്പിക്കുന്നു.”","“എല്ലാം പൂർത്തിയായിരിക്കുന്നു” എന്നതു പരാജയത്തിന്റെ നിലവിളിയല്ല, പൂർത്തീകരണത്തിന്റേതാണ്. പിതാവ് അവിടുത്തെ ഏൽപിച്ച പ്രവൃത്തി നിറവേറി: യഥാർഥ കുഞ്ഞാടു ബലിയർപ്പിക്കപ്പെട്ടു; അവിടുത്തെ രക്തത്തിൽ പുതിയ ഉടമ്പടി മുദ്രവയ്ക്കപ്പെട്ടു. “പടയാളികളിലൊരുവൻ അവന്റെ പാർശ്വത്തിൽ കുന്തംകൊണ്ടു കുത്തി. ഉടനെ അതിൽനിന്നു രക്തവും വെള്ളവും പുറപ്പെട്ടു” (യോഹ 19:34). ആ രക്തത്തിലും വെള്ളത്തിലും പിതാക്കന്മാർ ദിവ്യകാരുണ്യവും മാമ്മോദീസയും കണ്ടു; ആദാമിന്റെ പാർശ്വത്തിൽനിന്നു ഹവ്വാ എന്നപോലെ ക്രിസ്തുവിന്റെ പാർശ്വത്തിൽനിന്നു ജനിച്ച സഭ.","നമ്മുടെ പാരമ്പര്യത്തിൽ ഈ ദിവസം വിശുദ്ധ കുർബാനയില്ല; കുഞ്ഞാടുതന്നെ കുരിശിൽ അർപ്പിക്കപ്പെടുന്നതുകൊണ്ടു ബലിപീഠം ശൂന്യമാണ്. നാം കുരിശിനെ വണങ്ങുന്നു; ഉപവാസവും മൗനവും പാലിക്കുന്നു; ഓടിപ്പോകാതിരുന്ന മറിയത്തോടൊപ്പം നിൽക്കുന്നു. അപമാനത്തിന്റെ മരം ജീവന്റെ വൃക്ഷമായി മാറിയിരിക്കുന്നു. “മിശിഹായേ, ഞങ്ങൾ അങ്ങയെ ആരാധിക്കുന്നു, അങ്ങയെ വാഴ്ത്തുന്നു; എന്തെന്നാൽ അങ്ങയുടെ വിശുദ്ധ കുരിശിനാൽ അങ്ങു ലോകത്തെ രക്ഷിച്ചു.”"],
 conn:[["സഹിക്കുന്ന ദാസൻ.","നൂറ്റാണ്ടുകൾക്കുമുമ്പേ ഏശയ്യാ 52:13–53:12 പീഡാനുഭവം വിവരിക്കുന്നു."],["ജീവന്റെ വൃക്ഷം.","ഏദനിലെ വൃക്ഷം മരണം കൊണ്ടുവന്നു; കുരിശാകുന്ന വൃക്ഷം ജീവൻ കൊണ്ടുവരുന്നു (ഉൽപ 2:9; വെളി 22:2)."],["പിച്ചളസർപ്പം.","“മോശ മരുഭൂമിയിൽ സർപ്പത്തെ ഉയർത്തിയതുപോലെ മനുഷ്യപുത്രനും ഉയർത്തപ്പെടേണ്ടിയിരിക്കുന്നു” (യോഹ 3:14; സംഖ്യ 21:9)."],["പുതിയ ആദാമിന്റെ പാർശ്വം.","ആദാമിന്റെ പാർശ്വത്തിൽനിന്നു ഹവ്വാ രൂപപ്പെട്ടതുപോലെ, ക്രിസ്തുവിന്റെ കുത്തിത്തുറക്കപ്പെട്ട പാർശ്വത്തിൽനിന്നു സഭ ജനിക്കുന്നു (യോഹ 19:34)."]],
 altar:["ഇന്നു ബലിപീഠം ശൂന്യമാണ്; വിശുദ്ധ കുർബാനയില്ല; കാരണം ഏകബലി കുരിശിൽ ധ്യാനിക്കപ്പെടുന്നു. നാം അർപ്പിക്കുന്ന ഓരോ കുർബാനയും കാൽവരിയിലെ ഇതേ ബലി സന്നിഹിതമാക്കുന്നു; ഇന്നു നാം അതിനു മുമ്പിൽ മുട്ടുകുത്തുക മാത്രം ചെയ്യുന്നു."],
 outline:[["ആരംഭം","കുരിശിനു മുമ്പിൽ മൗനം."],["ഒന്നാം ആശയം · നമുക്കുവേണ്ടി മുറിവേറ്റവൻ","ഏശയ്യാ 53: അവന്റെ ക്ഷതങ്ങളാൽ നാം സൗഖ്യം പ്രാപിച്ചു."],["രണ്ടാം ആശയം · കുരിശിൽനിന്നുള്ള വാക്കുകൾ","ക്ഷമ, പറുദീസ, മറിയം, ഉപേക്ഷിക്കപ്പെടൽ, പൂർത്തീകരണം, സമർപ്പണം."],["മൂന്നാം ആശയം · രക്തവും വെള്ളവും","അവിടുത്തെ പാർശ്വത്തിൽനിന്നു ജനിച്ച സഭയും കൂദാശകളും."],["നാലാം ആശയം · മറിയത്തോടൊപ്പം നിൽക്കുക","ഓടിപ്പോകരുത്; കുരിശിനെ വണങ്ങുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“അങ്ങയുടെ വിശുദ്ധ കുരിശിനാൽ അങ്ങു ലോകത്തെ രക്ഷിച്ചു.”"]],
 live:[["ഉപവാസം ആചരിക്കുക","കഷ്ടപ്പെടുന്നവർക്കുവേണ്ടി സമർപ്പിച്ചുകൊണ്ട് ഇന്നു സ്നേഹത്തോടെ ഉപവസിക്കുക."],["ക്ഷമിക്കുക (ലൂക്കാ 23:34)","കുരിശിൽനിന്ന് യേശു ക്ഷമിച്ചതുപോലെ ഇന്ന് ഒരാളോടു ക്ഷമിക്കുക."],["കുരിശിനെ വണങ്ങുക","ദുഃഖവെള്ളിയിലെ ശുശ്രൂഷയിൽ പങ്കെടുത്തു നന്ദിയോടെ കുരിശു ചുംബിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","അവിടുത്തെ പാർശ്വത്തിൽനിന്നു വെള്ളവും രക്തവും ഒഴുകി… മാമ്മോദീസയുടെയും രഹസ്യങ്ങളുടെയും പ്രതീകങ്ങൾ. ആദാമിന്റെ പാർശ്വത്തിൽനിന്നു ഹവ്വാ രൂപപ്പെട്ടതുപോലെ ഇവ രണ്ടിൽനിന്നുമാണു സഭ ജനിക്കുന്നത് (മതബോധനപ്രസംഗം 3, 13–19)."],["ജറുസലെമിലെ വിശുദ്ധ സിറിൽ","ഭൂമിയുടെ അതിർത്തികളെ ആശ്ലേഷിക്കാൻ അവിടുന്നു കുരിശിൽ കരങ്ങൾ വിരിച്ചു; കാരണം ഗോൽഗോഥാ ഭൂമിയുടെ കേന്ദ്രമാണ് (മതബോധനപ്രഭാഷണങ്ങൾ 13, 28)."]],
 magis:[["മതബോധനഗ്രന്ഥം 613–618","മനുഷ്യവംശത്തിന്റെ അന്തിമരക്ഷ നിറവേറ്റുന്ന പെസഹാബലിയാണു ക്രിസ്തുവിന്റെ മരണം; അവിടുന്നു സ്വതന്ത്രമായി തന്നെത്തന്നെ അർപ്പിച്ചു."],["മതബോധനഗ്രന്ഥം 964","രക്ഷാകർമത്തിൽ തന്റെ പുത്രനോടുള്ള മറിയത്തിന്റെ ഐക്യം കുരിശിന്റെ ചുവട്ടിൽ വെളിപ്പെടുന്നു."],["മതബോധനഗ്രന്ഥം 766","ക്രിസ്തുവിന്റെ സമ്പൂർണമായ ആത്മദാനത്തിൽനിന്നാണു സഭ പ്രധാനമായും ജനിക്കുന്നത്: കുരിശിൽ നിദ്രപ്രാപിച്ച ക്രിസ്തുവിന്റെ പാർശ്വത്തിൽനിന്ന്."]],
 saints:[["ഹാശാആഴ്ച","മാർച്ച് 27 ശനി: ദുഃഖശനി. മാർച്ച് 28 ഞായർ: ക്യംതോ, ഉയിർപ്പ്."]],
 prayer:"ഞങ്ങൾക്കുവേണ്ടി ക്രൂശിക്കപ്പെട്ട കർത്താവായ യേശുമിശിഹായേ, ഞങ്ങൾ അങ്ങയെ ആരാധിക്കുന്നു, അങ്ങയെ വാഴ്ത്തുന്നു; എന്തെന്നാൽ അങ്ങയുടെ വിശുദ്ധ കുരിശിനാൽ അങ്ങു ലോകത്തെ രക്ഷിച്ചു. ഞങ്ങളോടു ക്ഷമിക്കണമേ; അങ്ങയുടെ രാജ്യത്തിൽ ഞങ്ങളെ ഓർക്കണമേ; അങ്ങയുടെ അമ്മയെ ഞങ്ങളുടെ അമ്മയായി നൽകണമേ; അങ്ങയോടൊപ്പം ജീവനിലേക്ക് ഉയിർക്കാൻ പാപത്തിന് അങ്ങയോടൊപ്പം മരിക്കാൻ ഞങ്ങളെ സഹായിക്കണമേ. ആമേൻ."},
 {quick:["“നമ്മുടെ അതിക്രമങ്ങൾക്കുവേണ്ടി അവൻ മുറിവേൽപ്പിക്കപ്പെട്ടു.”","കുരിശിൽനിന്ന്: ക്ഷമ, പറുദീസ, നമുക്കു നൽകപ്പെട്ട മറിയം.","“എല്ലാം പൂർത്തിയായിരിക്കുന്നു”: രക്ഷാകർമം പൂർണമായി."],action:"കുരിശിൽനിന്ന് യേശു ക്ഷമിച്ചതുപോലെ ഇന്ന് ഒരാളോടു ക്ഷമിക്കുക.",question:"ഇന്നു കുരിശ് എന്നോട് എന്താണ് ആവശ്യപ്പെടുന്നത്?",
  special:"ദുഃഖവെള്ളി: ഉപവാസദിനം; വിശുദ്ധ കുർബാനയില്ല; കുരിശുവണക്കം. സ്തോത്രക്കാഴ്ച വിശുദ്ധനാടിനുവേണ്ടി.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പല വീടുകളിലും ദുഃഖവെള്ളിയാഴ്ച ടെലിവിഷൻ ഓഫാക്കുന്നു; കുടുംബം കഞ്ഞി മാത്രം കഴിക്കുന്നു; പഴയ ഒരു ക്രൂശിതരൂപം മേശപ്പുറത്തു വയ്ക്കുന്നു. കുട്ടികൾ എന്തുകൊണ്ടെന്നു ചോദിക്കുന്നു. ഒരു വല്യമ്മച്ചി മറുപടി പറയുന്നു: “ഇന്ന് ഈശോ നിനക്കുവേണ്ടി മരിച്ചതുകൊണ്ട്.”"],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 23:33–34, 39–46.",explain:"നമ്മെ സ്നേഹിക്കുന്നതുകൊണ്ടാണ് യേശു കുരിശിൽ മരിച്ചത്. കുരിശിൽപ്പോലും തന്നെ ഉപദ്രവിച്ചവരോട് അവിടുന്നു ക്ഷമിച്ചു; കരുണ ചോദിച്ച കള്ളനു സ്വർഗം വാഗ്ദാനം ചെയ്തു.",intention:"കഷ്ടപ്പെടുന്ന എല്ലാവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു; യേശുവിന്റെ സ്നേഹത്തിന് അവിടുത്തേക്കു നന്ദി പറയുന്നു.",ask:"ചോദിക്കുക: “ഇന്നു ഞാൻ ക്ഷമിക്കേണ്ട ആരെങ്കിലുമുണ്ടോ?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 613–618","ക്രിസ്തുവിന്റെ ബലി."],["മതബോധനഗ്രന്ഥം 964","കുരിശിന്റെ ചുവട്ടിൽ മറിയം."]],
  kidsaint:["നല്ല കള്ളൻ","യേശുവിന്റെ അരികിൽ ക്രൂശിക്കപ്പെട്ടവരിൽ ഒരാൾ പറഞ്ഞു: “യേശുവേ, നീ നിന്റെ രാജ്യത്തു പ്രവേശിക്കുമ്പോൾ എന്നെയും ഓർക്കണമേ!” യേശു വാഗ്ദാനം ചെയ്തു: “നീ ഇന്ന് എന്നോടുകൂടെ പറുദീസായിൽ ആയിരിക്കും.” (പിൽക്കാലപാരമ്പര്യം അവനെ ദിസ്മാസ് എന്നു വിളിക്കുന്നു.) പാഠം: യേശുവിലേക്കു തിരിയാൻ ഒരിക്കലും വൈകിയിട്ടില്ല."],
  term:["ദുഃഖവെള്ളി","കർത്താവിന്റെ പീഡാസഹനത്തിന്റെയും മരണത്തിന്റെയും ദിവസം. മലങ്കര പാരമ്പര്യത്തിൽ യാമങ്ങളുടെ ദീർഘമായ ശുശ്രൂഷ പ്രാർഥിക്കുന്നു; കുരിശിനെ വണങ്ങുന്നു; പിന്നെ കർത്താവിന്റെ കബറടക്കം അനുസ്മരിച്ചുകൊണ്ടു കുരിശിനെ വിശ്രമിപ്പിക്കുന്നു; വിശ്വാസികൾ ഉപവസിക്കുന്നു."],
  termMore:["എന്തുകൊണ്ട് “നല്ല” വെള്ളി?","ഇംഗ്ലീഷിൽ “ഗുഡ് ഫ്രൈഡേ” എന്നു വിളിക്കുന്നു; കാരണം ഈ ദിവസം ക്രിസ്തുവിന്റെ സഹനത്തിലൂടെ ഏറ്റവും വലിയ നന്മ, ലോകത്തിന്റെ രക്ഷ, സംഭവിച്ചു. മലയാളത്തിൽ ദുഃഖവെള്ളി എന്നു വിളിക്കുന്നു; രണ്ടു പേരുകളും സത്യമാണ്."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു നാം കുരിശിന്റെ ചുവട്ടിൽ നിൽക്കുന്നു. ഞായറാഴ്ച ഹോസാനയോടെ സ്വാഗതം ചെയ്യപ്പെട്ടവൻ ഇന്നു പരിഹസിക്കപ്പെടുന്നു, ചമ്മട്ടികൊണ്ട് അടിക്കപ്പെടുന്നു, മുൾമുടി ധരിപ്പിക്കപ്പെടുന്നു, രണ്ടു കുറ്റവാളികളുടെ നടുവിൽ കുരിശിൽ തറയ്ക്കപ്പെടുന്നു. ഏശയ്യാ അതു കണ്ടിരുന്നു: “നമ്മുടെ അതിക്രമങ്ങൾക്കുവേണ്ടി അവൻ മുറിവേൽപ്പിക്കപ്പെട്ടു… അവന്റെ ക്ഷതങ്ങളാൽ നാം സൗഖ്യം പ്രാപിച്ചു.”","കുരിശിൽനിന്നുള്ള അവിടുത്തെ വാക്കുകൾ കേൾക്കൂ. “പിതാവേ, അവരോടു ക്ഷമിക്കണമേ; അവർ ചെയ്യുന്നതെന്തെന്ന് അവർ അറിയുന്നില്ല.” തന്നെ കൊല്ലുന്നവരോട് അവിടുന്നു ക്ഷമിക്കുന്നു. തന്നെ ഓർക്കാൻ അപേക്ഷിച്ച കള്ളനോട് അവിടുന്നു വാഗ്ദാനം ചെയ്യുന്നു: “നീ ഇന്ന് എന്നോടുകൂടെ പറുദീസായിൽ ആയിരിക്കും.” അമ്മയോടും പ്രിയശിഷ്യനോടും അവിടുന്നു പറയുന്നു: “ഇതാ, നിന്റെ മകൻ… ഇതാ, നിന്റെ അമ്മ.” തന്റെ സ്വന്തം അമ്മയെ അവിടുന്നു നമുക്കു നൽകുന്നു.","പിന്നെ: “എല്ലാം പൂർത്തിയായിരിക്കുന്നു.” “ഞാൻ തീർന്നു” എന്നല്ല, “എല്ലാം നിറവേറി” എന്ന്. രക്ഷാകർമം പൂർണമായി. പടയാളിയുടെ കുന്തം അവിടുത്തെ പാർശ്വം തുറക്കുന്നു; രക്തവും വെള്ളവും ഒഴുകുന്നു: പിതാക്കന്മാർ അവിടെ ദിവ്യകാരുണ്യവും മാമ്മോദീസയും കണ്ടു; ക്രിസ്തുവിന്റെ ഹൃദയത്തിൽനിന്നു ജനിച്ച സഭ.","ഇന്നു കുർബാനയില്ല; ബലിപീഠം ശൂന്യമാണ്. കുരിശിനു മുമ്പിൽ നാം മുട്ടുകുത്തുന്നു; ഉപവസിക്കുന്നു; മൗനം പാലിക്കുന്നു; ഓടിപ്പോകാതിരുന്ന മറിയത്തോടൊപ്പം നിൽക്കുന്നു. അവിടുന്നു ക്ഷമിച്ചതുപോലെ നമ്മളോരോരുത്തരും ഇന്ന് ഒരാളോടു ക്ഷമിക്കാം. മിശിഹായേ, ഞങ്ങൾ അങ്ങയെ ആരാധിക്കുന്നു, അങ്ങയെ വാഴ്ത്തുന്നു; എന്തെന്നാൽ അങ്ങയുടെ വിശുദ്ധ കുരിശിനാൽ അങ്ങു ലോകത്തെ രക്ഷിച്ചു. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഇന്നു ദുഃഖവെള്ളിയാണ്. യേശു കുരിശിൽ മരിച്ചു. നമ്മെ അത്രയധികം സ്നേഹിക്കുന്നതുകൊണ്ടും നമ്മുടെ പാപങ്ങൾ നീക്കാൻ ആഗ്രഹിച്ചതുകൊണ്ടുമാണ് അവിടുന്ന് അതിന് അനുവദിച്ചത്.","കുരിശിൽ യേശു തന്നെ ഉപദ്രവിച്ചവരോടു ക്ഷമിച്ചു. സങ്കടപ്പെട്ട ഒരു കള്ളനോട് അവിടുന്നു പറഞ്ഞു: “ഇന്നു നീ എന്നോടൊപ്പം സ്വർഗത്തിലായിരിക്കും.”","ഇന്നു നമുക്കു നിശ്ശബ്ദരായിരുന്നു പ്രാർഥിക്കാം; നാം വേദനിപ്പിച്ചവരോടു സോറി പറയാം. നമുക്കു പറയാം: “യേശുവേ, എന്നെ ഇത്രയധികം സ്നേഹിച്ചതിനു നന്ദി!”"]});

/* ================= HOLY SATURDAY · 27 March 2027 ================= */
put("2027-03-27","en",{title:"Holy Saturday · The Lord Rests in the Tomb",readTitle:EN.rt,
 readings:[[EN.ot,"Amos 6:10–14 (as printed)","Hush! We must not mention the name of the Lord"],[EN.pa,"Romans 6:1–11","Buried with him by baptism into death"],[EN.go,"Matthew 27:62–66","The tomb is sealed and guarded"]],
 alt:"Holy Saturday. The Church waits at the tomb. In the night the celebration of the Resurrection begins.",
 verse:"So they went with the guard and made the tomb secure by sealing the stone.",cite:"Matthew 27:66",
 theo:["Holy Saturday is the day of great silence. The body of the Lord lies in the tomb of Joseph of Arimathea. The disciples are hidden in fear; the women wait for the sabbath to pass. His enemies, remembering his words about rising on the third day, ask Pilate for a guard; “so they went with the guard and made the tomb secure by sealing the stone.” They seal the tomb, not knowing that they are preparing witnesses to the Resurrection.","The Creed says: “he descended to the dead.” While his body rested in the tomb, Christ went down to the realm of the dead to bring the good news to the just who had waited for him, from Adam onwards. The Eastern Churches love the image of Christ breaking the gates of Sheol and taking Adam and Eve by the hand. Holy Saturday is not empty: it is the hidden victory.","St Paul explains what this means for us: “we have been buried with him by baptism into death, so that, just as Christ was raised from the dead by the glory of the Father, so we too might walk in newness of life.” Our Baptism was a burial and a resurrection. Today we let die in us whatever must die, so that tonight we may rise with him.","Mary, his Mother, kept faith on this day when everyone else despaired. Let us keep this day in quiet prayer, with her, waiting in hope for the light of Qyomtho."],
 conn:[["The sign of Jonah.","“As Jonah was three days and three nights in the belly of the sea monster, so for three days and three nights the Son of Man will be in the heart of the earth” (Matthew 12:40)."],["The sabbath rest.","God rested on the seventh day after creation (Genesis 2:2); Christ rests in the tomb on the sabbath after the work of the new creation."],["Buried with him.","Romans 6:4: Baptism is our burial and resurrection with Christ."],["The sealed stone.","The guards and the seal, meant to prevent a resurrection, become witnesses of it (Matthew 28:4, 11)."]],
 altar:["The altar waits in silence; tonight it will be the place of the risen Lord. Like Mary, we keep watch, so that when the Qurbono of the Resurrection is celebrated our hearts are ready."],
 outline:[["Opening","The silence of Holy Saturday."],["Point 1 · The sealed tomb","Human power tries to keep God in the grave."],["Point 2 · He descended to the dead","Christ brings light to Adam and the just of old."],["Point 3 · Buried with him","Baptism: let the old self die."],["Point 4 · Waiting with Mary","Hope when all seems lost."],["Take-home line","“If we have died with him, we shall live with him.”"]],
 live:[["Keep silence","Spend part of today in quiet prayer, without television or phone."],["Prepare for the night","Make your Easter Confession if you have not yet; prepare your home for the feast."],["Pray with Mary","Pray the Sorrowful Mysteries or the Stabat Mater with her."]],
 fathers:[["An ancient homily for Holy Saturday","“Something strange is happening: there is a great silence on earth… because the King is asleep. God has died in the flesh and has gone to rouse those who have slept ever since the world began… He took Adam by the hand: Awake, O sleeper” (ancient homily, read in the Liturgy of the Hours)."],["St Ephrem the Syrian","Death received him and was itself undone; Sheol could not hold him, and the dead heard his voice (Nisibene Hymns)."]],
 magis:[["Catechism 631–635","Jesus descended into the realm of the dead as Saviour, proclaiming the Good News to the spirits imprisoned there; this is the last phase of his messianic mission."],["Catechism 624–630","Christ's burial: the mystery of Holy Saturday, when Christ lying in the tomb reveals God's great sabbath rest."],["Catechism 1214–1215","Baptism signifies and actually brings about death to sin and entry into the life of the Trinity."]],
 saints:[["Tomorrow","Sunday 28 March: Qyomtho, the Resurrection of our Lord; Holy Qurbono for the people."]],
 prayer:"Lord Jesus, you rested in the tomb and went down to those who sat in darkness. Bury with you all that is dead in us, keep us in hope with your Mother, and raise us with you to newness of life. Amen."},
 {quick:["Holy Saturday: the great silence; the Lord rests in the tomb.","He descended to the dead to free Adam and the just of old.","Buried with him in Baptism, we wait to rise with him."],action:"Spend part of today in silent prayer.",question:"What in me must be buried, so that I can rise with Christ?",
  special:"Holy Saturday: the Church waits at the tomb; preparation for the night of the Resurrection.",
  illus:["An illustration","On Holy Saturday Kerala homes are quiet: the kitchen prepares the Easter meal, but no one plays loud music. Children are told: “Jesus is in the tomb; tonight he will rise.” The whole house waits."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 27:57–66.",explain:"After Jesus died, his friends laid him in a tomb and rolled a big stone in front. His enemies sealed it and put guards there. But they could not stop what God was going to do!",intention:"We pray for people who are sad and have lost hope.",ask:"Ask: “How can we get ready for Easter together?”"},
  catechism:[["CCC 631–635","Christ descended to the dead."],["CCC 624–630","The burial of Christ."]],
  kidsaint:["Joseph of Arimathea","A rich and respected man who was a secret disciple of Jesus. After Jesus died, he bravely asked Pilate for his body and laid him in his own new tomb. Lesson: be brave to show your love for Jesus."],
  term:["Holy Saturday","The day between the Cross and the Resurrection, when Christ rests in the tomb and descends to the dead. It is kept in silence and prayer; the celebration of Qyomtho begins in the night."],
  termMore:["“He descended to the dead”","An article of the Creed: after his death Christ went to the realm of the dead (Sheol) not to suffer but to free the righteous who had gone before him (1 Peter 3:18–19; 4:6)."]},
 {homily:["Dear brothers and sisters, today is the day of the great silence. The Lord's body lies in the tomb. The disciples hide in fear. The stone is sealed and soldiers stand guard. It seems that death has won.","But the ancient Church sang a different song. While his body rested, Christ descended to the dead, to Adam and Eve, to Abraham and the prophets, to all who had waited for him. An old homily imagines him taking Adam by the hand: “Awake, O sleeper, and arise from the dead.” Holy Saturday is not empty; it is the hidden victory.","St Paul tells us that in Baptism we were buried with Christ, so that we might rise with him. Today is a good day to bury with him whatever is dead in us: a sin we keep returning to, a grudge, a fear. Bring it to the tomb, and leave it there.","And let us stay with Mary. On this day, when everyone else despaired, she kept faith. Let us keep silence, prepare our hearts and our homes, and wait for the night when the stone will be rolled away. Amen."],
  kids:["Children, today Jesus' body is resting in the tomb. A big stone is in front, and soldiers are guarding it. Everyone is quiet and sad.","But Mary, Jesus' mother, kept trusting God. And tonight something wonderful will happen!","Today let's be quiet and get ready for Easter. Let's say: “Jesus, I'm waiting for you!”"]});

put("2027-03-27","ml",{title:"ദുഃഖശനി · കർത്താവു കല്ലറയിൽ വിശ്രമിക്കുന്നു",readTitle:ML.rt,
 readings:[[ML.ot,"ആമോസ് 6:10–14 (അച്ചടിച്ചിരിക്കുന്നതുപോലെ)","മിണ്ടരുത്! കർത്താവിന്റെ നാമം ഉച്ചരിക്കരുത്"],[ML.pa,"റോമാ 6:1–11","മാമ്മോദീസയാൽ മരണത്തിലേക്ക് അവിടുത്തോടൊപ്പം സംസ്കരിക്കപ്പെട്ടു"],[ML.go,"മത്തായി 27:62–66","കല്ലറ മുദ്രവച്ചു കാവലേർപ്പെടുത്തുന്നു"]],
 alt:"ദുഃഖശനി. സഭ കല്ലറയ്ക്കരികെ കാത്തിരിക്കുന്നു. രാത്രിയിൽ ഉയിർപ്പിന്റെ ആഘോഷം ആരംഭിക്കുന്നു.",
 verse:"അവർപോയി കല്ലിനു മുദ്രവച്ച്, കാവൽക്കാരെ നിർത്തി കല്ലറ ഭദ്രമാക്കി.",cite:"മത്തായി 27:66",
 theo:["മഹാമൗനത്തിന്റെ ദിവസമാണു ദുഃഖശനി. കർത്താവിന്റെ ശരീരം അരിമത്തെയാക്കാരൻ ജോസഫിന്റെ കല്ലറയിൽ കിടക്കുന്നു. ശിഷ്യന്മാർ ഭയന്ന് ഒളിച്ചിരിക്കുന്നു; സാബത്തു കഴിയാൻ സ്ത്രീകൾ കാത്തിരിക്കുന്നു. മൂന്നാംദിവസം ഉയിർക്കുമെന്ന അവിടുത്തെ വാക്കുകൾ ഓർത്ത് ശത്രുക്കൾ പീലാത്തോസിനോടു കാവൽ ചോദിക്കുന്നു; “അവർപോയി കല്ലിനു മുദ്രവച്ച്, കാവൽക്കാരെ നിർത്തി കല്ലറ ഭദ്രമാക്കി.” ഉയിർപ്പിന്റെ സാക്ഷികളെയാണു തങ്ങൾ ഒരുക്കുന്നതെന്നറിയാതെ അവർ കല്ലറ മുദ്രവയ്ക്കുന്നു.","വിശ്വാസപ്രമാണം പറയുന്നു: “പാതാളത്തിൽ ഇറങ്ങി.” അവിടുത്തെ ശരീരം കല്ലറയിൽ വിശ്രമിച്ചപ്പോൾ, ആദംമുതൽ തന്നെ കാത്തിരുന്ന നീതിമാന്മാരെ സദ്വാർത്ത അറിയിക്കാൻ ക്രിസ്തു മരിച്ചവരുടെ ലോകത്തിലേക്ക് ഇറങ്ങി. പാതാളകവാടങ്ങൾ തകർത്ത് ആദത്തെയും ഹവ്വായെയും കൈപിടിച്ച് ഉയർത്തുന്ന ക്രിസ്തുവിന്റെ ചിത്രം പൗരസ്ത്യസഭകൾക്ക് ഏറെ പ്രിയപ്പെട്ടതാണ്. ദുഃഖശനി ശൂന്യമല്ല; മറഞ്ഞിരിക്കുന്ന വിജയമാണ്.","ഇതു നമുക്ക് എന്തർഥമാക്കുന്നുവെന്നു വിശുദ്ധ പൗലോസ് വിശദീകരിക്കുന്നു: പിതാവിന്റെ മഹത്വത്താൽ ക്രിസ്തു മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടതുപോലെ നാമും പുതിയ ജീവിതത്തിൽ ചരിക്കേണ്ടതിനു മാമ്മോദീസയാൽ മരണത്തിലേക്ക് അവിടുത്തോടൊപ്പം നാം സംസ്കരിക്കപ്പെട്ടു (റോമാ 6:4). നമ്മുടെ മാമ്മോദീസ ഒരു സംസ്കാരവും ഉയിർപ്പുമായിരുന്നു. ഇന്നു രാത്രി അവിടുത്തോടൊപ്പം ഉയിർക്കാൻ, നമ്മിൽ മരിക്കേണ്ടതെല്ലാം ഇന്നു മരിക്കാൻ അനുവദിക്കാം.","മറ്റെല്ലാവരും നിരാശരായ ഈ ദിവസം അവിടുത്തെ അമ്മ മറിയം വിശ്വാസം കാത്തു. അവളോടൊപ്പം നിശ്ശബ്ദപ്രാർഥനയിൽ ഈ ദിവസം ആചരിച്ച്, ക്യംതോയുടെ പ്രകാശത്തിനായി പ്രത്യാശയോടെ നമുക്കു കാത്തിരിക്കാം."],
 conn:[["യോനായുടെ അടയാളം.","യോനാ മൂന്നു രാവും മൂന്നു പകലും കടൽമത്സ്യത്തിന്റെ ഉദരത്തിലായിരുന്നതുപോലെ മനുഷ്യപുത്രൻ മൂന്നു രാവും മൂന്നു പകലും ഭൂമിയുടെ ഹൃദയത്തിലായിരിക്കും (മത്താ 12:40)."],["സാബത്തുവിശ്രമം.","സൃഷ്ടിക്കുശേഷം ഏഴാം ദിവസം ദൈവം വിശ്രമിച്ചു (ഉൽപ 2:2); പുതിയ സൃഷ്ടിയുടെ പ്രവൃത്തിക്കുശേഷം സാബത്തിൽ ക്രിസ്തു കല്ലറയിൽ വിശ്രമിക്കുന്നു."],["അവിടുത്തോടൊപ്പം സംസ്കരിക്കപ്പെട്ടു.","റോമാ 6:4: ക്രിസ്തുവിനോടൊപ്പമുള്ള നമ്മുടെ സംസ്കാരവും ഉയിർപ്പുമാണു മാമ്മോദീസ."],["മുദ്രവച്ച കല്ല്.","ഉയിർപ്പു തടയാനുദ്ദേശിച്ച കാവൽക്കാരും മുദ്രയും അതിന്റെ സാക്ഷികളാകുന്നു (മത്താ 28:4, 11)."]],
 altar:["ബലിപീഠം മൗനമായി കാത്തിരിക്കുന്നു; ഇന്നു രാത്രി അത് ഉത്ഥിതനായ കർത്താവിന്റെ ഇടമാകും. മറിയത്തെപ്പോലെ നാം ഉണർന്നിരിക്കുന്നു; ഉയിർപ്പിന്റെ കുർബാന അർപ്പിക്കപ്പെടുമ്പോൾ നമ്മുടെ ഹൃദയങ്ങൾ ഒരുങ്ങിയിരിക്കട്ടെ."],
 outline:[["ആരംഭം","ദുഃഖശനിയുടെ മൗനം."],["ഒന്നാം ആശയം · മുദ്രവച്ച കല്ലറ","ദൈവത്തെ കല്ലറയിൽ സൂക്ഷിക്കാൻ മാനുഷികശക്തി ശ്രമിക്കുന്നു."],["രണ്ടാം ആശയം · പാതാളത്തിൽ ഇറങ്ങി","ആദത്തിനും പഴയ നീതിമാന്മാർക്കും ക്രിസ്തു വെളിച്ചം കൊണ്ടുവരുന്നു."],["മൂന്നാം ആശയം · അവിടുത്തോടൊപ്പം സംസ്കരിക്കപ്പെട്ടു","മാമ്മോദീസ: പഴയ മനുഷ്യൻ മരിക്കട്ടെ."],["നാലാം ആശയം · മറിയത്തോടൊപ്പം കാത്തിരിക്കുക","എല്ലാം നഷ്ടപ്പെട്ടുവെന്നു തോന്നുമ്പോഴും പ്രത്യാശ."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“നാം അവിടുത്തോടൊപ്പം മരിച്ചെങ്കിൽ അവിടുത്തോടൊപ്പം ജീവിക്കും.”"]],
 live:[["മൗനം പാലിക്കുക","ടെലിവിഷനോ ഫോണോ ഇല്ലാതെ ഇന്നത്തെ ഒരു ഭാഗം നിശ്ശബ്ദപ്രാർഥനയിൽ ചെലവഴിക്കുക."],["രാത്രിക്ക് ഒരുങ്ങുക","ഇതുവരെ ചെയ്തിട്ടില്ലെങ്കിൽ ഈസ്റ്റർ കുമ്പസാരം നടത്തുക; തിരുനാളിനായി വീട് ഒരുക്കുക."],["മറിയത്തോടൊപ്പം പ്രാർഥിക്കുക","അവളോടൊപ്പം ദുഃഖകരമായ രഹസ്യങ്ങൾ ധ്യാനിച്ചു ജപമാല ചൊല്ലുക."]],
 fathers:[["ദുഃഖശനിക്കുള്ള ഒരു പുരാതന പ്രസംഗം","വിചിത്രമായ എന്തോ സംഭവിക്കുന്നു: ഭൂമിയിൽ വലിയ ഒരു മൗനം… കാരണം രാജാവ് ഉറങ്ങുന്നു. ദൈവം ശരീരത്തിൽ മരിച്ചു; ലോകാരംഭംമുതൽ ഉറങ്ങിയവരെ ഉണർത്താൻ പോയിരിക്കുന്നു… അവിടുന്ന് ആദത്തിന്റെ കൈപിടിച്ചു: ഉറങ്ങുന്നവനേ, ഉണരുക (യാമപ്രാർഥനയിൽ വായിക്കുന്ന പുരാതന പ്രസംഗം)."],["മാർ അപ്രേം","മരണം അവിടുത്തെ സ്വീകരിച്ചു; അതുതന്നെ തകർന്നു; പാതാളത്തിന് അവിടുത്തെ പിടിച്ചുനിർത്താനായില്ല; മരിച്ചവർ അവിടുത്തെ സ്വരം കേട്ടു (നിസിബിസ് ഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 631–635","രക്ഷകനായി യേശു മരിച്ചവരുടെ ലോകത്തിലേക്ക് ഇറങ്ങി, അവിടെ തടവിലായിരുന്ന ആത്മാക്കളോടു സദ്വാർത്ത പ്രഘോഷിച്ചു; ഇത് അവിടുത്തെ മിശിഹാദൗത്യത്തിന്റെ അവസാനഘട്ടമാണ്."],["മതബോധനഗ്രന്ഥം 624–630","ക്രിസ്തുവിന്റെ സംസ്കാരം: കല്ലറയിൽ കിടക്കുന്ന ക്രിസ്തു ദൈവത്തിന്റെ മഹാസാബത്തുവിശ്രമം വെളിപ്പെടുത്തുന്ന ദുഃഖശനിയുടെ രഹസ്യം."],["മതബോധനഗ്രന്ഥം 1214–1215","പാപത്തിനു മരിക്കുന്നതും ത്രിത്വത്തിന്റെ ജീവനിലേക്കു പ്രവേശിക്കുന്നതും മാമ്മോദീസ സൂചിപ്പിക്കുകയും യഥാർഥത്തിൽ സാധിക്കുകയും ചെയ്യുന്നു."]],
 saints:[["നാളെ","മാർച്ച് 28 ഞായർ: ക്യംതോ, നമ്മുടെ കർത്താവിന്റെ ഉയിർപ്പ്; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന."]],
 prayer:"കർത്താവായ യേശുവേ, അങ്ങു കല്ലറയിൽ വിശ്രമിക്കുകയും അന്ധകാരത്തിൽ ഇരുന്നവരുടെ അടുത്തേക്ക് ഇറങ്ങുകയും ചെയ്തു. ഞങ്ങളിൽ മരിച്ചതെല്ലാം അങ്ങയോടൊപ്പം സംസ്കരിക്കണമേ; അങ്ങയുടെ അമ്മയോടൊപ്പം ഞങ്ങളെ പ്രത്യാശയിൽ കാക്കണമേ; പുതിയ ജീവിതത്തിലേക്ക് അങ്ങയോടൊപ്പം ഞങ്ങളെ ഉയിർപ്പിക്കണമേ. ആമേൻ."},
 {quick:["ദുഃഖശനി: മഹാമൗനം; കർത്താവു കല്ലറയിൽ വിശ്രമിക്കുന്നു.","ആദത്തെയും പഴയ നീതിമാന്മാരെയും മോചിപ്പിക്കാൻ അവിടുന്നു പാതാളത്തിൽ ഇറങ്ങി.","മാമ്മോദീസയിൽ അവിടുത്തോടൊപ്പം സംസ്കരിക്കപ്പെട്ട നാം അവിടുത്തോടൊപ്പം ഉയിർക്കാൻ കാത്തിരിക്കുന്നു."],action:"ഇന്നത്തെ ഒരു ഭാഗം നിശ്ശബ്ദപ്രാർഥനയിൽ ചെലവഴിക്കുക.",question:"ക്രിസ്തുവിനോടൊപ്പം ഉയിർക്കാൻ എന്നിൽ എന്താണു സംസ്കരിക്കപ്പെടേണ്ടത്?",
  special:"ദുഃഖശനി: സഭ കല്ലറയ്ക്കരികെ കാത്തിരിക്കുന്നു; ഉയിർപ്പിന്റെ രാത്രിക്കുള്ള ഒരുക്കം.",
  illus:["ഒരു ഉദാഹരണം","ദുഃഖശനിയാഴ്ച കേരളത്തിലെ വീടുകൾ നിശ്ശബ്ദമാണ്: അടുക്കളയിൽ ഈസ്റ്റർ ഭക്ഷണം ഒരുങ്ങുന്നു; പക്ഷേ ആരും ഉച്ചത്തിൽ പാട്ടുവയ്ക്കുന്നില്ല. കുട്ടികളോടു പറയുന്നു: “ഈശോ കല്ലറയിലാണ്; ഇന്നു രാത്രി ഉയിർക്കും.” വീടു മുഴുവൻ കാത്തിരിക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 27:57–66.",explain:"യേശു മരിച്ചശേഷം കൂട്ടുകാർ അവിടുത്തെ ഒരു കല്ലറയിൽ വച്ച് മുമ്പിൽ ഒരു വലിയ കല്ല് ഉരുട്ടിവച്ചു. ശത്രുക്കൾ അതിനു മുദ്രവച്ചു കാവൽക്കാരെ നിർത്തി. പക്ഷേ ദൈവം ചെയ്യാൻ പോകുന്നതു തടയാൻ അവർക്കായില്ല!",intention:"ദുഃഖിതർക്കും പ്രത്യാശ നഷ്ടപ്പെട്ടവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈസ്റ്ററിനായി നമുക്ക് എങ്ങനെ ഒന്നിച്ച് ഒരുങ്ങാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 631–635","ക്രിസ്തു പാതാളത്തിൽ ഇറങ്ങി."],["മതബോധനഗ്രന്ഥം 624–630","ക്രിസ്തുവിന്റെ സംസ്കാരം."]],
  kidsaint:["അരിമത്തെയാക്കാരൻ ജോസഫ്","യേശുവിന്റെ രഹസ്യശിഷ്യനായിരുന്ന ധനികനും ബഹുമാന്യനുമായ ഒരാൾ. യേശു മരിച്ചശേഷം അവിടുത്തെ ശരീരം ധൈര്യപൂർവം പീലാത്തോസിനോടു ചോദിച്ച് തന്റെ സ്വന്തം പുതിയ കല്ലറയിൽ സംസ്കരിച്ചു. പാഠം: യേശുവിനോടുള്ള സ്നേഹം കാണിക്കാൻ ധൈര്യമുള്ളവനാകുക."],
  term:["ദുഃഖശനി","കുരിശിനും ഉയിർപ്പിനും ഇടയിലുള്ള ദിവസം; ക്രിസ്തു കല്ലറയിൽ വിശ്രമിക്കുകയും പാതാളത്തിൽ ഇറങ്ങുകയും ചെയ്യുന്നു. മൗനത്തിലും പ്രാർഥനയിലും ആചരിക്കുന്നു; ക്യംതോയുടെ ആഘോഷം രാത്രിയിൽ ആരംഭിക്കുന്നു."],
  termMore:["“പാതാളത്തിൽ ഇറങ്ങി”","വിശ്വാസപ്രമാണത്തിലെ ഒരു വാക്യം: മരണശേഷം ക്രിസ്തു മരിച്ചവരുടെ ലോകത്തിലേക്കു (ഷീയോൾ) പോയതു സഹിക്കാനല്ല, തനിക്കു മുമ്പേ പോയ നീതിമാന്മാരെ മോചിപ്പിക്കാനാണ് (1 പത്രോ 3:18–19; 4:6)."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു മഹാമൗനത്തിന്റെ ദിവസമാണ്. കർത്താവിന്റെ ശരീരം കല്ലറയിൽ കിടക്കുന്നു. ശിഷ്യന്മാർ ഭയന്ന് ഒളിച്ചിരിക്കുന്നു. കല്ലിനു മുദ്രവച്ചിരിക്കുന്നു; പടയാളികൾ കാവൽ നിൽക്കുന്നു. മരണം ജയിച്ചുവെന്നു തോന്നുന്നു.","പക്ഷേ പുരാതനസഭ മറ്റൊരു ഗീതം പാടി. അവിടുത്തെ ശരീരം വിശ്രമിച്ചപ്പോൾ ക്രിസ്തു മരിച്ചവരുടെ അടുത്തേക്ക് ഇറങ്ങി: ആദത്തിന്റെയും ഹവ്വായുടെയും, അബ്രാഹത്തിന്റെയും പ്രവാചകന്മാരുടെയും, തന്നെ കാത്തിരുന്ന എല്ലാവരുടെയും അടുത്തേക്ക്. ആദത്തിന്റെ കൈപിടിച്ച് അവിടുന്നു പറയുന്നതായി ഒരു പഴയ പ്രസംഗം സങ്കൽപിക്കുന്നു: “ഉറങ്ങുന്നവനേ, ഉണരുക; മരിച്ചവരിൽനിന്ന് എഴുന്നേൽക്കുക.” ദുഃഖശനി ശൂന്യമല്ല; മറഞ്ഞിരിക്കുന്ന വിജയമാണ്.","മാമ്മോദീസയിൽ ക്രിസ്തുവിനോടൊപ്പം ഉയിർക്കാൻ അവിടുത്തോടൊപ്പം നാം സംസ്കരിക്കപ്പെട്ടുവെന്നു വിശുദ്ധ പൗലോസ് പറയുന്നു. നമ്മിൽ മരിച്ചതെല്ലാം അവിടുത്തോടൊപ്പം സംസ്കരിക്കാൻ ഇന്നു നല്ല ദിവസമാണ്: നാം വീണ്ടും വീണ്ടും മടങ്ങിപ്പോകുന്ന ഒരു പാപം, ഒരു പക, ഒരു ഭയം. അതു കല്ലറയിലേക്കു കൊണ്ടുവന്ന് അവിടെ ഉപേക്ഷിക്കുക.","നമുക്കു മറിയത്തോടൊപ്പം ആയിരിക്കാം. മറ്റെല്ലാവരും നിരാശരായ ഈ ദിവസം അവൾ വിശ്വാസം കാത്തു. നമുക്കു മൗനം പാലിക്കാം; നമ്മുടെ ഹൃദയങ്ങളും ഭവനങ്ങളും ഒരുക്കാം; കല്ല് ഉരുട്ടിമാറ്റപ്പെടുന്ന രാത്രിക്കായി കാത്തിരിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഇന്ന് യേശുവിന്റെ ശരീരം കല്ലറയിൽ വിശ്രമിക്കുന്നു. മുമ്പിൽ ഒരു വലിയ കല്ലുണ്ട്; പടയാളികൾ കാവൽ നിൽക്കുന്നു. എല്ലാവരും നിശ്ശബ്ദരും ദുഃഖിതരുമാണ്.","പക്ഷേ യേശുവിന്റെ അമ്മ മറിയം ദൈവത്തിൽ ആശ്രയിച്ചുകൊണ്ടിരുന്നു. ഇന്നു രാത്രി അദ്ഭുതകരമായ ഒന്നു സംഭവിക്കും!","ഇന്നു നമുക്കു നിശ്ശബ്ദരായിരുന്ന് ഈസ്റ്ററിനായി ഒരുങ്ങാം. നമുക്കു പറയാം: “യേശുവേ, ഞാൻ അങ്ങേക്കായി കാത്തിരിക്കുന്നു!”"]});

/* ================= QYOMTHO · 28 March 2027 ================= */
put("2027-03-28","en",{title:"Qyomtho · The Resurrection of our Lord",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 28:1–10","He is not here; he has been raised"],[EN.ot,"Exodus 40:17–23","The tabernacle is set up"],[EN.ot,"Sirach 30:21–25","A joyful heart is life"],[EN.ot,"Daniel 6:18–24","Daniel brought up from the lions' den"],[EN.ot,"Isaiah 57:14–21","Peace, peace, to the far and the near"],[EN.ac,"Acts 2:29–36","God raised this Jesus; we are witnesses"],[EN.pa,"1 Corinthians 15:1–11","Christ died, was buried, and was raised"],[EN.go,"John 20:1–10","The empty tomb"]],
 alt:"Qyomtho, Easter. Holy Qurbono for the people. The season of Qyomtho begins; this week is Hevoro (white) week.",
 verse:"He is not here; for he has been raised, as he said.",cite:"Matthew 28:6",
 theo:["Christ is risen! Very early on the first day of the week, the women go to the tomb, and an angel says: “Do not be afraid; I know that you are looking for Jesus who was crucified. He is not here; for he has been raised, as he said.” Then Jesus himself meets them: “Greetings!” They take hold of his feet and worship him. The One who was dead is alive for ever.","In John's Gospel Mary Magdalene runs to Peter and the beloved disciple; they run to the tomb and find the linen cloths lying there. The other disciple “saw and believed”. The empty tomb is not proof by itself, but it is the first sign; faith is born when we see with the heart that God has kept his word.","The Old Testament readings have prepared us. Daniel is brought up alive from the lions' den, because God shut the lions' mouths (Daniel 6:22). Moses sets up the tabernacle, and God's glory fills it. Isaiah announces: “Peace, peace, to the far and the near.” In the risen Christ the glory of God dwells among us for ever, and his first word to the disciples will be: “Peace be with you.”","St Peter preaches on the day of Pentecost: “This Jesus God raised up, and of that all of us are witnesses.” St Paul hands on the heart of the Gospel: “Christ died for our sins in accordance with the scriptures… he was buried… he was raised on the third day.” Easter is not a beautiful story; it is the event on which everything stands. Because Christ is risen, sin is forgiven, death is defeated, and our own bodies will rise. Let us live as Easter people."],
 conn:[["Daniel and the lions.","Daniel, sealed in the den with a stone (Daniel 6:17), comes out alive at dawn: a figure of the sealed tomb and the risen Lord."],["The tabernacle.","Exodus 40: God's dwelling is set up on the first day of the first month; the risen body of Christ is the true temple (John 2:19–21)."],["Peace to the far and the near.","Isaiah 57:19 and Ephesians 2:17: the risen Christ preaches peace to all."],["The third day.","Hosea 6:2 and Jonah 1:17: the third day of God's saving action."]],
 altar:["Every Sunday is a little Easter, and every Holy Qurbono is the meeting with the risen Lord. As the women held his feet, we receive his risen Body. Today let us receive him with Easter joy."],
 outline:[["Opening","Christ is risen! He is risen indeed!"],["Point 1 · The empty tomb","“He is not here; he has been raised, as he said.” God keeps his word."],["Point 2 · Meeting the risen Lord","The women, Mary Magdalene, Peter and John: faith is born."],["Point 3 · Witnesses","Peter: “we are witnesses”; we too are sent."],["Point 4 · Easter people","Sin forgiven, death defeated, hope for the body; live it this week."],["Take-home line","“He is not here; he is risen!”"]],
 live:[["Greet with Easter joy","Greet family and friends with “Christ is risen!” throughout Easter week."],["Visit someone sad","Bring Easter joy to a sick, elderly or grieving person."],["Keep the Sundays","Resolve to keep every Sunday as a little Easter: Qurbono, rest, family."]],
 fathers:[["St John Chrysostom","“Let no one fear death, for the Saviour's death has set us free… Christ is risen, and the demons are fallen; Christ is risen, and the angels rejoice; Christ is risen, and life reigns” (Paschal Homily)."],["St Ephrem the Syrian","“Glory to you, who put on our body and went down to Sheol, and rose and raised us with you” (Nisibene Hymns)."]],
 magis:[["Catechism 638–658","The Resurrection of Christ is the crowning truth of our faith; it is a real, historical event with a transcendent character, confirming all that Christ taught."],["Catechism 1169","Easter is the “feast of feasts”, the “solemnity of solemnities”."],["Catechism 989–990","We firmly believe that, as Christ is truly risen, the righteous will live for ever with him and he will raise them up on the last day."]],
 saints:[["Hevoro week","The week after Qyomtho is kept with joy. Next Sunday: New Sunday (the appearance to Thomas)."]],
 prayer:"Lord Jesus Christ, risen from the dead, you have trampled down death by death and given life to those in the tombs. Fill us with Easter joy and peace, make us witnesses of your Resurrection, and raise us with you on the last day. Christ is risen! He is truly risen! Amen."},
 {quick:["Christ is risen: “He is not here; he has been raised.”","The empty tomb and the meeting with the risen Lord give birth to faith.","Because Christ is risen, death is defeated: live as Easter people."],action:"Greet everyone with “Christ is risen!” throughout this week.",question:"What difference does the Resurrection make to my life this week?",
  special:"Qyomtho, the Resurrection of our Lord: day of obligation; Holy Qurbono for the people. Hevoro week follows.",
  illus:["An illustration","On Easter night in Kerala the church bells ring after weeks of silence, the people light candles from the paschal flame, and the dark church fills with light. A child once asked: “Did Jesus switch on the lights?” In a way, yes: he lit up the world."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 28:1–10.",explain:"On Easter morning the women went to Jesus' tomb, but it was empty! An angel said: “He is risen!” Then Jesus himself met them. Jesus is alive for ever!",intention:"We thank God for Easter joy and pray for all who are sad or sick.",ask:"Ask: “How can we share Easter joy with someone this week?”"},
  catechism:[["CCC 638–658","The Resurrection of Christ."],["CCC 1166–1169","Sunday and Easter."]],
  kidsaint:["St Mary Magdalene","She stayed at the Cross and came first to the tomb on Easter morning. The risen Jesus called her by name and sent her to tell the apostles. Lesson: tell others that Jesus is alive!"],
  term:["Qyomtho (ക്യംതോ)","Syriac for “resurrection”. The feast of feasts, the Resurrection of our Lord, and the season of fifty days that follows until Pentecost."],
  termMore:["Hevoro week","The week after Easter, called Hevoro (white) week, recalling the white garments of the newly baptised and the joy of the Resurrection."]},
 {homily:["Christ is risen! He is risen indeed! Dear brothers and sisters, very early this morning the women went to the tomb with spices, expecting to anoint a dead body. Instead they found an angel who said: “Do not be afraid. He is not here; for he has been raised, as he said.”","As he said. On the road to Jerusalem Jesus had told his disciples three times that he would suffer, die and rise on the third day. They did not understand. Today God has kept his word. And Jesus himself meets the women: “Greetings!” They hold his feet and worship him. Peter and John run to the tomb; the beloved disciple “saw and believed”.","St Paul gives us the heart of the Gospel: “Christ died for our sins, he was buried, and he was raised on the third day.” Because Christ is risen, our sins can be forgiven; because Christ is risen, death is not the end; because Christ is risen, the graves of our loved ones are not the last word. Daniel came out of the lions' den at dawn; Christ came out of the tomb, and he will bring us out too.","St Peter said: “God raised this Jesus, and we are all witnesses.” Now we are the witnesses. Let us live as Easter people: joyful, forgiving, hopeful. Bring this joy to someone who is sad this week. Christ is risen! He is truly risen! Amen."],
  kids:["Children, Christ is risen! Say it with me: He is risen indeed!","On Sunday morning the women went to Jesus' tomb and found it empty. An angel said: “He is not here, he is risen!” Then Jesus himself came to meet them. They were so happy!","Jesus is alive for ever, and he is with us. Today tell everyone at home: “Jesus is alive!” Let's shout: “Alleluia!”"]});

put("2027-03-28","ml",{title:"ക്യംതോ · നമ്മുടെ കർത്താവിന്റെ ഉയിർപ്പ്",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 28:1–10","അവൻ ഇവിടെയില്ല; അവൻ ഉയിർപ്പിക്കപ്പെട്ടു"],[ML.ot,"പുറപ്പാട് 40:17–23","സമാഗമകൂടാരം സ്ഥാപിക്കുന്നു"],[ML.ot,"പ്രഭാഷകൻ 30:21–25","സന്തോഷമുള്ള ഹൃദയം ജീവനാണ്"],[ML.ot,"ദാനിയേൽ 6:18–24","സിംഹക്കുഴിയിൽനിന്നു ദാനിയേൽ കയറ്റപ്പെടുന്നു"],[ML.ot,"ഏശയ്യാ 57:14–21","ദൂരെയുള്ളവർക്കും അടുത്തുള്ളവർക്കും സമാധാനം"],[ML.ac,"അപ്പ. പ്രവ. 2:29–36","ദൈവം ഈ യേശുവിനെ ഉയിർപ്പിച്ചു; ഞങ്ങൾ സാക്ഷികൾ"],[ML.pa,"1 കോറിന്തോസ് 15:1–11","ക്രിസ്തു മരിച്ചു, സംസ്കരിക്കപ്പെട്ടു, ഉയിർപ്പിക്കപ്പെട്ടു"],[ML.go,"യോഹന്നാൻ 20:1–10","ശൂന്യമായ കല്ലറ"]],
 alt:"ക്യംതോ, ഉയിർപ്പുതിരുനാൾ. ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. ക്യംതോക്കാലം ആരംഭിക്കുന്നു; ഈ ആഴ്ച ഹേവോറോ (വെള്ള) ആഴ്ച.",
 verse:"അവൻ ഇവിടെയില്ല; താൻ അരുളിച്ചെയ്തതുപോലെ അവൻ ഉയിർപ്പിക്കപ്പെട്ടു.",cite:"മത്തായി 28:6",
 theo:["മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു! ആഴ്ചയുടെ ആദ്യദിവസം അതിരാവിലെ സ്ത്രീകൾ കല്ലറയിലേക്കു പോകുന്നു; ഒരു ദൂതൻ പറയുന്നു: “ഭയപ്പെടേണ്ടാ; ക്രൂശിക്കപ്പെട്ട യേശുവിനെയാണു നിങ്ങൾ അന്വേഷിക്കുന്നതെന്ന് എനിക്കറിയാം. അവൻ ഇവിടെയില്ല; താൻ അരുളിച്ചെയ്തതുപോലെ അവൻ ഉയിർപ്പിക്കപ്പെട്ടു.” പിന്നെ യേശുതന്നെ അവരെ എതിരേൽക്കുന്നു; “അവർ അവനെ സമീപിച്ച് പാദങ്ങളിൽ കെട്ടിപ്പിടിച്ച് ആരാധിച്ചു.” മരിച്ചവൻ എന്നേക്കും ജീവിക്കുന്നു.","യോഹന്നാന്റെ സുവിശേഷത്തിൽ മഗ്ദലേനമറിയം പത്രോസിന്റെയും പ്രിയശിഷ്യന്റെയും അടുത്തേക്ക് ഓടുന്നു; അവർ കല്ലറയിലേക്ക് ഓടി, അവിടെ കിടക്കുന്ന ചണത്തുണികൾ കാണുന്നു. മറ്റേ ശിഷ്യൻ “അകത്തു പ്രവേശിച്ച് കണ്ടു വിശ്വസിച്ചു.” ശൂന്യമായ കല്ലറ തനിയേ ഒരു തെളിവല്ല; പക്ഷേ അത് ആദ്യത്തെ അടയാളമാണ്; ദൈവം തന്റെ വാക്കു പാലിച്ചുവെന്നു ഹൃദയംകൊണ്ടു കാണുമ്പോഴാണു വിശ്വാസം ജനിക്കുന്നത്.","പഴയനിയമവായനകൾ നമ്മെ ഒരുക്കിയിരുന്നു. “എന്റെ ദൈവം ദൂതനെ അയച്ച് സിംഹങ്ങളുടെ വായ് അടച്ചു” (ദാനി 6:22): ദാനിയേൽ സിംഹക്കുഴിയിൽനിന്നു ജീവനോടെ കയറ്റപ്പെടുന്നു. മോശ സമാഗമകൂടാരം സ്ഥാപിക്കുന്നു; ദൈവമഹത്വം അതിൽ നിറയുന്നു. ഏശയ്യാ പ്രഘോഷിക്കുന്നു: ദൂരെയുള്ളവർക്കും അടുത്തുള്ളവർക്കും സമാധാനം, സമാധാനം. ഉത്ഥിതനായ ക്രിസ്തുവിൽ ദൈവമഹത്വം എന്നേക്കും നമ്മുടെ ഇടയിൽ വസിക്കുന്നു; ശിഷ്യന്മാരോടുള്ള അവിടുത്തെ ആദ്യവാക്ക് ഇതായിരിക്കും: “നിങ്ങൾക്കു സമാധാനം.”","പന്തക്കുസ്താദിവസം വിശുദ്ധ പത്രോസ് പ്രസംഗിക്കുന്നു: “ആ യേശുവിനെ ദൈവം ഉയിർപ്പിച്ചു. ഞങ്ങളെല്ലാവരും അതിനു സാക്ഷികളാണ്.” സുവിശേഷത്തിന്റെ ഹൃദയം വിശുദ്ധ പൗലോസ് കൈമാറുന്നു: തിരുവെഴുത്തുകളനുസരിച്ചു ക്രിസ്തു നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി മരിച്ചു; സംസ്കരിക്കപ്പെട്ടു; മൂന്നാംദിവസം ഉയിർപ്പിക്കപ്പെട്ടു (1 കോറി 15:3–4). ഉയിർപ്പ് ഒരു മനോഹരകഥയല്ല; എല്ലാം നിലനിൽക്കുന്ന സംഭവമാണ്. ക്രിസ്തു ഉയിർത്തതുകൊണ്ടു പാപം ക്ഷമിക്കപ്പെടുന്നു; മരണം പരാജയപ്പെടുന്നു; നമ്മുടെ ശരീരങ്ങളും ഉയിർക്കും. ഉയിർപ്പിന്റെ ജനമായി നമുക്കു ജീവിക്കാം."],
 conn:[["ദാനിയേലും സിംഹങ്ങളും.","കല്ലുകൊണ്ടു മുദ്രവച്ച കുഴിയിൽനിന്ന് (ദാനി 6:17) പ്രഭാതത്തിൽ ജീവനോടെ പുറത്തുവരുന്ന ദാനിയേൽ: മുദ്രവച്ച കല്ലറയുടെയും ഉത്ഥിതനായ കർത്താവിന്റെയും പ്രതീകം."],["സമാഗമകൂടാരം.","പുറപ്പാട് 40: ഒന്നാം മാസത്തിന്റെ ഒന്നാം ദിവസം ദൈവത്തിന്റെ വാസസ്ഥലം സ്ഥാപിക്കപ്പെടുന്നു; ക്രിസ്തുവിന്റെ ഉത്ഥിതശരീരമാണ് യഥാർഥ ആലയം (യോഹ 2:19–21)."],["ദൂരെയുള്ളവർക്കും അടുത്തുള്ളവർക്കും സമാധാനം.","ഏശയ്യാ 57:19-ഉം എഫേസോസ് 2:17-ഉം: ഉത്ഥിതനായ ക്രിസ്തു എല്ലാവരോടും സമാധാനം പ്രഘോഷിക്കുന്നു."],["മൂന്നാം ദിവസം.","ഹോസിയാ 6:2-ഉം യോനാ 1:17-ഉം: ദൈവത്തിന്റെ രക്ഷാകരപ്രവൃത്തിയുടെ മൂന്നാം ദിവസം."]],
 altar:["ഓരോ ഞായറാഴ്ചയും ഒരു ചെറിയ ഉയിർപ്പാണ്; ഓരോ വിശുദ്ധ കുർബാനയും ഉത്ഥിതനായ കർത്താവുമായുള്ള കണ്ടുമുട്ടലാണ്. സ്ത്രീകൾ അവിടുത്തെ പാദങ്ങൾ കെട്ടിപ്പിടിച്ചതുപോലെ നാം അവിടുത്തെ ഉത്ഥിതശരീരം സ്വീകരിക്കുന്നു. ഇന്ന് ഉയിർപ്പിന്റെ സന്തോഷത്തോടെ അവിടുത്തെ സ്വീകരിക്കാം."],
 outline:[["ആരംഭം","മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു! സത്യമായും ഉയിർത്തെഴുന്നേറ്റു!"],["ഒന്നാം ആശയം · ശൂന്യമായ കല്ലറ","“അവൻ ഇവിടെയില്ല; താൻ അരുളിച്ചെയ്തതുപോലെ അവൻ ഉയിർപ്പിക്കപ്പെട്ടു.” ദൈവം വാക്കു പാലിക്കുന്നു."],["രണ്ടാം ആശയം · ഉത്ഥിതനെ കണ്ടുമുട്ടൽ","സ്ത്രീകൾ, മഗ്ദലേനമറിയം, പത്രോസും യോഹന്നാനും: വിശ്വാസം ജനിക്കുന്നു."],["മൂന്നാം ആശയം · സാക്ഷികൾ","പത്രോസ്: “ഞങ്ങൾ സാക്ഷികളാണ്”; നാമും അയയ്ക്കപ്പെടുന്നു."],["നാലാം ആശയം · ഉയിർപ്പിന്റെ ജനം","ക്ഷമിക്കപ്പെട്ട പാപം, പരാജയപ്പെട്ട മരണം, ശരീരത്തിനുള്ള പ്രത്യാശ; ഈ ആഴ്ച അതു ജീവിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“അവൻ ഇവിടെയില്ല; അവൻ ഉയിർത്തെഴുന്നേറ്റു!”"]],
 live:[["ഉയിർപ്പിന്റെ സന്തോഷത്തോടെ അഭിവാദനം ചെയ്യുക","ഈസ്റ്റർ ആഴ്ച മുഴുവൻ കുടുംബാംഗങ്ങളെയും സുഹൃത്തുക്കളെയും “മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു!” എന്ന് അഭിവാദനം ചെയ്യുക."],["ദുഃഖിതനായ ഒരാളെ സന്ദർശിക്കുക","രോഗിയോ വൃദ്ധനോ വിലപിക്കുന്നവനോ ആയ ഒരാൾക്ക് ഉയിർപ്പിന്റെ സന്തോഷം എത്തിക്കുക."],["ഞായറാഴ്ചകൾ കാക്കുക","ഓരോ ഞായറാഴ്ചയും ഒരു ചെറിയ ഉയിർപ്പായി ആചരിക്കാൻ തീരുമാനിക്കുക: കുർബാന, വിശ്രമം, കുടുംബം."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","ആരും മരണത്തെ ഭയപ്പെടേണ്ടാ; രക്ഷകന്റെ മരണം നമ്മെ സ്വതന്ത്രരാക്കിയിരിക്കുന്നു… ക്രിസ്തു ഉയിർത്തു, പിശാചുക്കൾ വീണു; ക്രിസ്തു ഉയിർത്തു, മാലാഖമാർ ആനന്ദിക്കുന്നു; ക്രിസ്തു ഉയിർത്തു, ജീവൻ വാഴുന്നു (പെസഹാപ്രസംഗം)."],["മാർ അപ്രേം","ഞങ്ങളുടെ ശരീരം ധരിച്ചു പാതാളത്തിലേക്ക് ഇറങ്ങി, ഉയിർത്ത്, ഞങ്ങളെയും അങ്ങയോടൊപ്പം ഉയിർപ്പിച്ച അങ്ങേക്കു മഹത്വം (നിസിബിസ് ഗീതങ്ങൾ)."]],
 magis:[["മതബോധനഗ്രന്ഥം 638–658","ക്രിസ്തുവിന്റെ ഉയിർപ്പാണു നമ്മുടെ വിശ്വാസത്തിന്റെ ശിഖരമായ സത്യം; അതീന്ദ്രിയസ്വഭാവമുള്ള യഥാർഥവും ചരിത്രപരവുമായ ഒരു സംഭവം; ക്രിസ്തു പഠിപ്പിച്ചതെല്ലാം അത് ഉറപ്പിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1169","ഉയിർപ്പ് “തിരുനാളുകളുടെ തിരുനാൾ”, “മഹോത്സവങ്ങളുടെ മഹോത്സവം” ആണ്."],["മതബോധനഗ്രന്ഥം 989–990","ക്രിസ്തു യഥാർഥത്തിൽ ഉയിർത്തതുപോലെ നീതിമാന്മാർ എന്നേക്കും അവിടുത്തോടൊപ്പം ജീവിക്കുമെന്നും അവസാനദിവസം അവിടുന്ന് അവരെ ഉയിർപ്പിക്കുമെന്നും നാം ദൃഢമായി വിശ്വസിക്കുന്നു."]],
 saints:[["ഹേവോറോ ആഴ്ച","ക്യംതോയ്ക്കുശേഷമുള്ള ആഴ്ച സന്തോഷത്തോടെ ആചരിക്കുന്നു. അടുത്ത ഞായർ: പുതുഞായർ (തോമായ്ക്കുള്ള പ്രത്യക്ഷപ്പെടൽ)."]],
 prayer:"മരിച്ചവരിൽനിന്ന് ഉയിർത്ത കർത്താവായ യേശുമിശിഹായേ, മരണത്താൽ അങ്ങു മരണത്തെ ചവിട്ടിമെതിച്ചു; കല്ലറകളിലുള്ളവർക്കു ജീവൻ നൽകി. ഉയിർപ്പിന്റെ സന്തോഷവും സമാധാനവുംകൊണ്ടു ഞങ്ങളെ നിറയ്ക്കണമേ; അങ്ങയുടെ ഉയിർപ്പിന്റെ സാക്ഷികളാക്കണമേ; അവസാനദിവസം അങ്ങയോടൊപ്പം ഞങ്ങളെ ഉയിർപ്പിക്കണമേ. മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു! സത്യമായും ഉയിർത്തെഴുന്നേറ്റു! ആമേൻ."},
 {quick:["മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു: “അവൻ ഇവിടെയില്ല; അവൻ ഉയിർപ്പിക്കപ്പെട്ടു.”","ശൂന്യമായ കല്ലറയും ഉത്ഥിതനുമായുള്ള കണ്ടുമുട്ടലും വിശ്വാസത്തിനു ജന്മം നൽകുന്നു.","ക്രിസ്തു ഉയിർത്തതുകൊണ്ടു മരണം പരാജയപ്പെട്ടു: ഉയിർപ്പിന്റെ ജനമായി ജീവിക്കുക."],action:"ഈ ആഴ്ച മുഴുവൻ എല്ലാവരെയും “മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു!” എന്ന് അഭിവാദനം ചെയ്യുക.",question:"ഉയിർപ്പ് ഈ ആഴ്ച എന്റെ ജീവിതത്തിൽ എന്തു വ്യത്യാസമുണ്ടാക്കുന്നു?",
  special:"ക്യംതോ, നമ്മുടെ കർത്താവിന്റെ ഉയിർപ്പ്: കടമുള്ള ദിവസം; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. തുടർന്നു ഹേവോറോ ആഴ്ച.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിൽ ഈസ്റ്റർ രാത്രിയിൽ ആഴ്ചകളുടെ മൗനത്തിനുശേഷം പള്ളിമണികൾ മുഴങ്ങുന്നു; പെസഹാദീപത്തിൽനിന്നു ജനം മെഴുകുതിരികൾ കത്തിക്കുന്നു; ഇരുണ്ട പള്ളി പ്രകാശംകൊണ്ടു നിറയുന്നു. ഒരിക്കൽ ഒരു കുട്ടി ചോദിച്ചു: “ഈശോയാണോ ലൈറ്റിട്ടത്?” ഒരർഥത്തിൽ, അതെ: അവിടുന്നു ലോകത്തെ പ്രകാശിപ്പിച്ചു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 28:1–10.",explain:"ഈസ്റ്റർ പ്രഭാതത്തിൽ സ്ത്രീകൾ യേശുവിന്റെ കല്ലറയിലേക്കു പോയി; പക്ഷേ അതു ശൂന്യമായിരുന്നു! ഒരു ദൂതൻ പറഞ്ഞു: “അവിടുന്ന് ഉയിർത്തെഴുന്നേറ്റു!” പിന്നെ യേശുതന്നെ അവരെ എതിരേറ്റു. യേശു എന്നേക്കും ജീവിക്കുന്നു!",intention:"ഉയിർപ്പിന്റെ സന്തോഷത്തിനായി ദൈവത്തിനു നന്ദി പറഞ്ഞ്, ദുഃഖിതർക്കും രോഗികൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച ഉയിർപ്പിന്റെ സന്തോഷം നമുക്ക് ആരുമായി പങ്കുവയ്ക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 638–658","ക്രിസ്തുവിന്റെ ഉയിർപ്പ്."],["മതബോധനഗ്രന്ഥം 1166–1169","ഞായറും ഉയിർപ്പും."]],
  kidsaint:["വിശുദ്ധ മഗ്ദലേനമറിയം","അവൾ കുരിശിനരികെ നിന്നു; ഈസ്റ്റർ പ്രഭാതത്തിൽ ആദ്യം കല്ലറയിലെത്തി. ഉത്ഥിതനായ യേശു അവളെ പേരുചൊല്ലി വിളിച്ച്, ശ്ലീഹന്മാരോടു പറയാൻ അയച്ചു. പാഠം: യേശു ജീവിക്കുന്നുവെന്നു മറ്റുള്ളവരോടു പറയുക!"],
  term:["ക്യംതോ","“ഉയിർപ്പ്” എന്നതിന്റെ സുറിയാനിപദം. തിരുനാളുകളുടെ തിരുനാളായ നമ്മുടെ കർത്താവിന്റെ ഉയിർപ്പും, തുടർന്നു പന്തക്കുസ്താവരെയുള്ള അമ്പതു ദിവസത്തെ കാലവും."],
  termMore:["ഹേവോറോ ആഴ്ച","പുതുതായി മാമ്മോദീസ സ്വീകരിച്ചവരുടെ വെള്ളവസ്ത്രങ്ങളെയും ഉയിർപ്പിന്റെ സന്തോഷത്തെയും അനുസ്മരിപ്പിക്കുന്ന, ഉയിർപ്പിനുശേഷമുള്ള ഹേവോറോ (വെള്ള) ആഴ്ച."]},
 {homily:["മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു! സത്യമായും ഉയിർത്തെഴുന്നേറ്റു! പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്ന് അതിരാവിലെ മരിച്ച ഒരു ശരീരം പൂശാൻ പ്രതീക്ഷിച്ചു സുഗന്ധദ്രവ്യങ്ങളുമായി സ്ത്രീകൾ കല്ലറയിലേക്കു പോയി. പകരം ഒരു ദൂതനെ അവർ കണ്ടു; ദൂതൻ പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ. അവൻ ഇവിടെയില്ല; താൻ അരുളിച്ചെയ്തതുപോലെ അവൻ ഉയിർപ്പിക്കപ്പെട്ടു.”","താൻ അരുളിച്ചെയ്തതുപോലെ. ജറുസലെമിലേക്കുള്ള വഴിയിൽ, താൻ പീഡ സഹിച്ചു മരിച്ചു മൂന്നാംദിവസം ഉയിർക്കുമെന്ന് യേശു മൂന്നു പ്രാവശ്യം ശിഷ്യന്മാരോടു പറഞ്ഞിരുന്നു. അവർക്കു മനസ്സിലായില്ല. ഇന്നു ദൈവം തന്റെ വാക്കു പാലിച്ചിരിക്കുന്നു. യേശുതന്നെ സ്ത്രീകളെ എതിരേൽക്കുന്നു; അവർ അവിടുത്തെ പാദങ്ങൾ കെട്ടിപ്പിടിച്ച് ആരാധിക്കുന്നു. പത്രോസും യോഹന്നാനും കല്ലറയിലേക്ക് ഓടുന്നു; പ്രിയശിഷ്യൻ “കണ്ടു വിശ്വസിച്ചു.”","സുവിശേഷത്തിന്റെ ഹൃദയം വിശുദ്ധ പൗലോസ് നമുക്കു നൽകുന്നു: ക്രിസ്തു നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി മരിച്ചു; സംസ്കരിക്കപ്പെട്ടു; മൂന്നാംദിവസം ഉയിർപ്പിക്കപ്പെട്ടു. ക്രിസ്തു ഉയിർത്തതുകൊണ്ടു നമ്മുടെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടാം; ക്രിസ്തു ഉയിർത്തതുകൊണ്ടു മരണം അവസാനമല്ല; ക്രിസ്തു ഉയിർത്തതുകൊണ്ടു നമ്മുടെ പ്രിയപ്പെട്ടവരുടെ കല്ലറകൾ അവസാനവാക്കല്ല. പ്രഭാതത്തിൽ ദാനിയേൽ സിംഹക്കുഴിയിൽനിന്നു പുറത്തുവന്നു; ക്രിസ്തു കല്ലറയിൽനിന്നു പുറത്തുവന്നു; അവിടുന്നു നമ്മെയും പുറത്തുകൊണ്ടുവരും.","വിശുദ്ധ പത്രോസ് പറഞ്ഞു: “ആ യേശുവിനെ ദൈവം ഉയിർപ്പിച്ചു. ഞങ്ങളെല്ലാവരും അതിനു സാക്ഷികളാണ്.” ഇപ്പോൾ നാമാണു സാക്ഷികൾ. ഉയിർപ്പിന്റെ ജനമായി നമുക്കു ജീവിക്കാം: സന്തോഷമുള്ളവരായി, ക്ഷമിക്കുന്നവരായി, പ്രത്യാശയുള്ളവരായി. ഈ ആഴ്ച ദുഃഖിതനായ ഒരാളിലേക്ക് ഈ സന്തോഷം കൊണ്ടുചെല്ലുക. മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു! സത്യമായും ഉയിർത്തെഴുന്നേറ്റു! ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, മിശിഹാ ഉയിർത്തെഴുന്നേറ്റു! എന്നോടൊപ്പം പറയൂ: സത്യമായും ഉയിർത്തെഴുന്നേറ്റു!","ഞായറാഴ്ച രാവിലെ സ്ത്രീകൾ യേശുവിന്റെ കല്ലറയിലേക്കു പോയി; അതു ശൂന്യമായിരുന്നു. ഒരു ദൂതൻ പറഞ്ഞു: “അവിടുന്ന് ഇവിടെയില്ല, ഉയിർത്തെഴുന്നേറ്റു!” പിന്നെ യേശുതന്നെ അവരെ കാണാൻ വന്നു. അവർക്ക് എത്ര സന്തോഷമായി!","യേശു എന്നേക്കും ജീവിക്കുന്നു; അവിടുന്നു നമ്മോടൊപ്പമുണ്ട്. ഇന്നു വീട്ടിൽ എല്ലാവരോടും പറയൂ: “യേശു ജീവിക്കുന്നു!” നമുക്ക് ആർത്തുവിളിക്കാം: “ഹല്ലേലൂയാ!”"]});
})();

put("2027-04-04","en",{title:"New Sunday · The Lord Appears to Thomas",readTitle:EN.rt,
 readings:[[EN.eg,"John 20:19–23","Peace be with you; receive the Holy Spirit"],[EN.ot,"Genesis 41:37–45","Joseph raised over Egypt"],[EN.ot,"2 Kings 2:1–12","Elijah taken up; Elisha receives his spirit"],[EN.ot,"Wisdom 3:1–9","The souls of the righteous are in the hand of God"],[EN.ot,"Isaiah 40:9–15","Here is your God; he will feed his flock"],[EN.ce,"1 Peter 1:3–12","A living hope through the resurrection"],[EN.pa,"2 Timothy 2:1–13","Remember Jesus Christ, raised from the dead"],[EN.go,"John 20:19–29","My Lord and my God!"]],
 alt:"New Sunday, the first Sunday after Qyomtho.",
 verse:"Thomas answered him, “My Lord and my God!”",cite:"John 20:28",
 theo:["On the evening of Easter the disciples are behind locked doors, afraid. Jesus comes and stands among them: “Peace be with you.” He shows them his hands and side, and they rejoice. Then he sends them: “As the Father has sent me, so I send you,” breathes on them and says, “Receive the Holy Spirit. If you forgive the sins of any, they are forgiven them.” From the first Easter evening the risen Lord gives his Church peace, mission, the Spirit and the power to forgive sins.","Thomas was not there. When the others say, “We have seen the Lord,” he answers: “Unless I see the mark of the nails in his hands, and put my finger in the mark of the nails and my hand in his side, I will not believe.” A week later Jesus comes again and says: “Put your finger here and see my hands. Reach out your hand and put it in my side. Do not doubt but believe.” And Thomas makes the greatest confession of faith in the Gospels: “My Lord and my God!”","For us in India this Gospel is our own story. Thomas, who doubted and then believed, brought that faith to our land. The Church of Malankara, like all the St Thomas Christians, received from him the confession “My Lord and my God.” His doubt became our certainty; his wounded hand-touch became our faith.","Jesus adds a word for all later generations: “Blessed are those who have not seen and yet have come to believe.” That is us. St Peter says: “Although you have not seen him, you love him… and rejoice with an indescribable and glorious joy.” New Sunday asks: do we live with the joy of believers, or with the fear of locked doors?"],
 conn:[["The breath of life.","As God breathed into Adam (Genesis 2:7), the risen Christ breathes the Spirit into his disciples: a new creation."],["Elijah and Elisha.","Elisha asks for a double share of Elijah's spirit (2 Kings 2:9); the apostles receive the Spirit of the risen Lord."],["Joseph raised up.","Joseph, rejected by his brothers, is raised over Egypt to save them (Genesis 41): a figure of the risen Christ."],["The wounds remain.","The risen body keeps its wounds: signs of love that last for ever (Revelation 5:6)."]],
 altar:["Thomas touched the wounds; we receive the wounded and risen Body at the Holy Qurbono. Many in our tradition whisper Thomas' words at the elevation: “My Lord and my God.”"],
 outline:[["Opening","Locked doors and fearful hearts."],["Point 1 · Peace, mission, Spirit, forgiveness","The risen Lord's first gifts to his Church."],["Point 2 · Thomas' doubt","Honest questions brought to Jesus become faith."],["Point 3 · Our Apostle","St Thomas and the faith of India: “My Lord and my God.”"],["Point 4 · Blessed are those who have not seen","Living faith and joy today."],["Take-home line","“My Lord and my God!”"]],
 live:[["Pray Thomas' prayer","At the elevation in Holy Qurbono, and each morning, say: “My Lord and my God.”"],["Receive his peace (John 20:19)","Bring a fear or a locked door of your heart to Jesus in Confession."],["Share your faith","Tell one person how you came to believe."]],
 fathers:[["St Gregory the Great","The disbelief of Thomas was of more benefit to our faith than the faith of the believing disciples; when he touched and believed, every doubt was removed from our minds (Homilies on the Gospels 26)."],["St Augustine","He saw and touched the man, and confessed the God whom he did not see and touch (Tractates on John 121)."]],
 magis:[["Catechism 644–645","The apostles' faith was born of the encounter with the risen Lord; Jesus invited them to touch his body, which kept the marks of the Passion."],["Catechism 1441–1442","The risen Christ gave the apostles the power to forgive sins in his name."],["Catechism 448","The title “Lord” confesses the divinity of Jesus; Thomas' confession is its high point."]],
 saints:[["This week","Hevoro week ends. 11 April: the Second Sunday after Qyomtho."]],
 prayer:"Lord Jesus, risen and wounded, you came through locked doors and gave your disciples peace. Breathe your Spirit on us, heal our doubts, and make us confess with St Thomas, our father in faith: My Lord and my God! Amen."},
 {quick:["The risen Lord gives peace, mission, the Spirit and forgiveness.","Thomas' doubt becomes the great confession: “My Lord and my God!”","Blessed are those who have not seen and yet believe: that is us."],action:"Say “My Lord and my God” at the elevation in every Qurbono.",question:"Where are the locked doors in my life that Jesus wants to enter?",
  special:"New Sunday: the appearance of the risen Lord to the apostles and to Thomas.",
  illus:["An illustration","Pilgrims at the shrine of St Thomas in Mylapore kneel and whisper “My Lord and my God.” A faith that crossed seas from a doubting apostle's touch has lasted nearly two thousand years in our land."],kids:"",diaspora:"",
  family:{read:"Read together: John 20:24–29.",explain:"Thomas did not believe Jesus had risen until he saw him. When Jesus showed him his hands and side, Thomas said: “My Lord and my God!” Thomas later came to India to tell people about Jesus.",intention:"We thank God for St Thomas who brought the faith to India.",ask:"Ask: “Why do we call ourselves St Thomas Christians?”"},
  catechism:[["CCC 644–645","The apostles meet the risen Lord."],["CCC 448","Jesus is Lord."]],
  kidsaint:["St Thomas the Apostle","He wanted to see before believing, but when he met the risen Jesus he said: “My Lord and my God!” Tradition says he brought the Gospel to India. Lesson: bring your questions to Jesus; he helps you believe."],
  term:["New Sunday","The Sunday after Qyomtho, also called Thomas Sunday, when the Church reads the appearances of the risen Lord to the apostles and to Thomas (John 20:19–29)."],
  termMore:["The St Thomas Christians","The ancient Christians of Kerala trace their faith to the preaching of St Thomas. The Syro-Malankara and Syro-Malabar Churches both belong to this heritage."]},
 {homily:["Dear brothers and sisters, on the evening of Easter the disciples were behind locked doors, full of fear. Jesus came and stood among them: “Peace be with you.” He showed them his wounds. Then he sent them: “As the Father has sent me, so I send you.” He breathed on them: “Receive the Holy Spirit. If you forgive the sins of any, they are forgiven.”","Thomas was not there, and he would not believe: “Unless I see the marks of the nails and put my hand in his side, I will not believe.” A week later Jesus came again and invited him: “Put your finger here; reach out your hand. Do not doubt, but believe.” And Thomas cried out: “My Lord and my God!”","Dear friends, this is our own family story. Thomas, who doubted and then believed, brought this faith to India. We are called St Thomas Christians. His doubt, healed by the wounds of Christ, became our faith. In many of our churches people whisper his words when the priest lifts up the holy Mysteries: My Lord and my God.","Jesus then said: “Blessed are those who have not seen and yet have come to believe.” That is you and me. We have not seen him, but we love him. Let us not live behind locked doors of fear. Let us bring our doubts to his wounds, receive his peace, and go out as witnesses. My Lord and my God! Amen."],
  kids:["Children, after Jesus rose, Thomas said: “I won't believe unless I see him myself!”","A week later Jesus came and said: “Thomas, look at my hands.” Thomas fell down and said: “My Lord and my God!”","Thomas later came to India to tell people about Jesus. That's why we are St Thomas Christians! Let's say together: “My Lord and my God!”"]});
