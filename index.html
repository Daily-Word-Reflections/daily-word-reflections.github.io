GLOSS.smc.ta=[["தூய குர்பானா","காணிக்கை எனப் பொருள்படும் சிரியச் சொல். கிழக்குத் திருஅவையிடமிருந்து பெற்ற கிழக்குச் சிரிய மரபைச் சேர்ந்த சீரோ-மலபார் திருஅவையின் நற்கருணை வழிபாடு."],["ராசா","மறைபொருள். பெரிய திருநாள்களில் கொண்டாடப்படும் தூய குர்பானாவின் மிகச் சிறப்பான வடிவம்."],["தக்சா","ஒழுங்கு. தூய குர்பானாவின் பாடம் அடங்கிய வழிபாட்டு நூல்."],["மத்பஹா","பீடம் இருக்கும் திருத்தூயகம். உயர்த்தப்பட்டுத் தனியாக அமைக்கப்பட்டது; விண்ணகத்தின் அடையாளம்."],["கெஸ்த்ரோமா","திருத்தூயகத்துக்கும் ஆலய மையப் பகுதிக்கும் இடைப்பட்ட இடம்; விண்ணுக்கும் மண்ணுக்கும் இடையிலான பேரின்ப வீட்டின் அடையாளம்."],["ஹைக்கலா","விசுவாசிகள் நிற்கும் ஆலய மையப் பகுதி; மண்ணின் அடையாளம், திருப்பயணம் செல்லும் இறைமக்களின் அடையாளம்."],["பேமா","பழைய கிழக்குச் சிரிய ஆலயத்தில் மையப் பகுதியின் நடுவில், இறைவார்த்தை அறிவிக்கப்பட்ட உயர்ந்த மேடை."],["மார் தோமா சிலுவை","கிறிஸ்துவின் உடல் இல்லாத, மேலே புறாவுடன், பெரும்பாலும் தாமரை மேல் நிற்கும் சிலுவை. உயிர்த்த கிறிஸ்துவையும் தூய ஆவியின் கொடையையும் அறிவிக்கிறது."],["மார் அத்தாய் மார் மாரியின் அனஃபோரா","எதேசாவின் திருத்தூதர்களுக்கு உரியதாகக் கருதப்படும், திருஅவையின் மிகப் பழமையான நற்கருணை மன்றாட்டுகளுள் ஒன்று; சீரோ-மலபார் குர்பானாவின் முதன்மை அனஃபோரா."],["லாகு மாரா","ஆண்டவரே, உமக்கு. தூய குர்பானாவின் தொடக்கத்தில் பாடப்படும் கிறிஸ்துவின் புகழ்ப்பாடல்."],["கரோசூத்தா","திருத்தொண்டர் அல்லது பணியாளர் அறிவிக்கும் மன்றாட்டு வரிசை; மக்கள் சிறு பதிலுரையால் பதில் தருகின்றனர்."],["ஓனீத்தா","வழிபாட்டுப் பாடல் அல்லது பல்லவி. காணிக்கைப் பவனியின்போது ஓனீத்தா த்ராசே பாடப்படுகிறது."],["துக்ரானா","நினைவு. ஒரு புனிதரின் திருநாள், பொதுவாக அவர் இறந்த நாள். புனித தோமாவின் துக்ரானா ஜூலை 3."],["ரம்சா, லெல்யா, சப்ரா","கிழக்குச் சிரிய மரபில் திருப்புகழ்மாலையின் மாலை, இரவு, காலைச் செபங்கள்."],["மூன்னு நோம்பு","பெரிய நோன்புக்கு முந்தைய மூன்றாம் வாரத்தின் திங்கள் முதல் புதன் வரை கடைப்பிடிக்கப்படும் நினிவே மக்களின் மூன்று நாள் நோன்பு (யோனா 3)."],["பெசஹா","பாஸ்கா. ஆண்டவர் தூய குர்பானாவை ஏற்படுத்திய பெரிய வியாழன். கேரள இல்லங்களில் பெசஹா அப்பமும் பாலும் ஆசீர்வதிக்கப்பட்டுப் பகிரப்படுகின்றன."]];
GLOSS.smc.hi=[["पवित्र कुर्बाना","भेंट अर्थवाला सीरियाई शब्द। पूर्व की कलीसिया से प्राप्त पूर्वी सीरियाई परंपरा की सीरो-मलबार कलीसिया की यूखरिस्तीय धर्मविधि।"],["राज़ा","रहस्य। पवित्र कुर्बाना का सबसे समारोही रूप, जो महान पर्वों पर मनाया जाता है।"],["तक्सा","क्रम। पवित्र कुर्बाना का पाठ रखनेवाली धर्मविधिक पुस्तक।"],["मद्बहा","पवित्र-स्थान, जहाँ वेदी है। यह ऊँचा और अलग रखा जाता है, स्वर्ग का चिह्न।"],["केस्त्रोमा","पवित्र-स्थान और मध्य-भाग के बीच का स्थान, स्वर्ग और पृथ्वी के बीच परादीस का चिह्न।"],["हैकला","मध्य-भाग, जहाँ विश्वासी खड़े होते हैं; पृथ्वी और तीर्थयात्री ईश-प्रजा का चिह्न।"],["बेमा","प्राचीन पूर्वी सीरियाई गिरजाघर में मध्य-भाग के बीच ऊँचा मंच, जहाँ से ईश-वचन घोषित होता था।"],["मार थोमा क्रूस","मसीह के शरीर के बिना क्रूस, ऊपर कपोत सहित, प्रायः कमल पर। यह पुनर्जीवित मसीह और पवित्र आत्मा के वरदान की घोषणा करता है।"],["मार अद्दाई और मार मारी का अनाफ़ोरा","कलीसिया की सबसे प्राचीन यूखरिस्तीय प्रार्थनाओं में से एक, एदेस्सा के प्रेरितों से जुड़ी; सीरो-मलबार कुर्बाना का मुख्य अनाफ़ोरा।"],["लाखु मारा","हे प्रभु, तुझको। पवित्र कुर्बाना के आरंभ में गाया जानेवाला मसीह का स्तुति-गीत।"],["करोज़ूथा","उपयाजक या सेवक द्वारा घोषित लिटनी, जिसका लोग छोटे उत्तर से जवाब देते हैं।"],["ओनीथा","धर्मविधि का गीत या अंतरा। भेंट-जुलूस के समय ओनीथा द्राज़े गाया जाता है।"],["दुक्राना","स्मरण। किसी संत का पर्व, प्रायः उनकी मृत्यु का दिन। संत थोमस का दुक्राना 3 जुलाई को है।"],["रम्शा, लेल्या, सप्रा","पूर्वी सीरियाई परंपरा में घंटों की प्रार्थना की संध्या, रात्रि और प्रातः प्रार्थनाएँ।"],["मून्नु नोम्बु","नीनवे के लोगों का तीन दिन का उपवास, महान उपवास से पहले तीसरे सप्ताह के सोमवार से बुधवार तक (योना 3)।"],["पेसहा","पास्का। पुण्य गुरुवार, जब प्रभु ने पवित्र कुर्बाना स्थापित की। केरल के घरों में पेसहा अप्पम और दूध आशीर्वादित कर बाँटे जाते हैं।"]];
GLOSS.smk.ta=[["தூய குர்பானா (குர்போனோ)","மேற்குச் சிரிய (அந்தியோக்கிய) மரபில் சீரோ-மலங்கரக் கத்தோலிக்கத் திருஅவையின் நற்கருணை வழிபாடு."],["புனித யாக்கோபின் அனஃபோரா","ஆண்டவரின் சகோதரரும் எருசலேமின் முதல் ஆயருமான புனித யாக்கோபுக்கு உரிய நற்கருணை மன்றாட்டு; மேற்குச் சிரிய அனஃபோராக்களின் தாய். மலங்கர வழிபாட்டுக்கு வேறு பல அனஃபோராக்களும் உண்டு."],["த்ரோனோஸ்","அரியணை. தூய மறைபொருள்கள் ஒப்புக்கொடுக்கப்படும் பீடம், கடவுளின் அரியணை."],["மத்பஹோ","வழிபாட்டின் முக்கியத் தருணங்களில் மூடித் திறக்கப்படும் திரையால் மையப் பகுதியிலிருந்து பிரிக்கப்பட்ட திருத்தூயகம்."],["ப்ரோமியோனும் செத்ரோவும்","குர்பானாவிலும் புகழ்மாலையிலும் தூபத்தோடு சொல்லப்படும் தொடக்கச் செபமும் (ப்ரோமியோன்) நீண்ட விளக்கச் செபமும் (செத்ரோ)."],["ஹூசோயோ","தம் மக்களின் செபங்களை ஏற்குமாறு கடவுளை வேண்டும், தூபத்தோடு கூடிய மன்னிப்பு, ஒப்புரவு வழிபாடு."],["கௌமா","தூயவராம் கடவுளே என்ற மூவுலகத் தூயர் புகழோடு தொடங்கி, கூரியலேசோனும் ஆண்டவர் கற்பித்த செபமும் தொடரும் செப அலகு."],["ஷெஹிமோ","சாதாரண வார நாள்களுக்கான அன்றாடச் செப நூல். ஞாயிறுகள், திருநாள்கள், காலங்களுக்கான நூல் பெங்கீத்தோ."],["கோலோ","குறிப்பிட்ட மெட்டில் பாடப்படும் பாடல். ஷெஹிமோ ஆண்டு முழுவதும் மாறும் கோலோக்களாக அமைந்துள்ளது."],["போவூத்தோ","புனித எஃப்ரேம், செரூகின் புனித யாக்கோபு, புனித பாலாய் ஆகியோருக்கு உரிய வேண்டுதல் பாடல்கள்; புகழ்மாலையில் பாடப்படுகின்றன."],["துப்தேன்","அனஃபோராவில் வாழ்வோர், புனிதர்கள், இறந்த விசுவாசிகள் ஆகியோரின் ஆடம்பர நினைவுகள்."],["கூதோஷ் ஈத்தோவும் ஹூதோஷ் ஈத்தோவும்","திருஅவையின் புனிதப்படுத்தலும் புதுப்பித்தலும்: திருவழிபாட்டு ஆண்டைத் தொடங்கும் இரு ஞாயிறுகள்."],["ஹாஷோ","பாடுகள். ஹாஷோ வாரம் என்பது ஓசன்னா ஞாயிறு முதல் உயிர்ப்பு வரையிலான புனித வாரம்."],["கியோம்த்தோ","ஆண்டவரின் உயிர்ப்பும், அதைத் தொடரும் ஐம்பது நாள் காலமும்."],["ஸ்லீபோ","சிலுவை. திருச்சிலுவைக் காலம் திருவழிபாட்டு ஆண்டை நிறைவுசெய்கிறது."],["1930 மறு ஒன்றிப்பு","1930 செப்டம்பர் 20 அன்று பேராயர் மார் இவானியோஸும் தோழர்களும் தங்கள் மேற்குச் சிரிய வழிபாட்டைக் காத்துக்கொண்டு கத்தோலிக்கத் திருஅவையோடு முழு ஒன்றிப்புக்குள் நுழைந்தனர். 2005 முதல் இத்திருஅவை மேஜர் பேராயர்-கத்தோலிக்கோஸ் தலைமையிலான மேஜர் பேராயர் திருஅவை."]];
GLOSS.smk.hi=[["पवित्र कुर्बाना (कुर्बोनो)","पश्चिमी सीरियाई (अंताकियाई) परंपरा में सीरो-मलंकरा काथलिक कलीसिया की यूखरिस्तीय धर्मविधि।"],["संत याकूब का अनाफ़ोरा","प्रभु के भाई और येरूसालेम के पहले धर्माध्यक्ष संत याकूब से जुड़ी यूखरिस्तीय प्रार्थना; पश्चिमी सीरियाई अनाफ़ोराओं की जननी। मलंकरा धर्मविधि में अन्य कई अनाफ़ोरा भी हैं।"],["थ्रोनोस","सिंहासन। वेदी, ईश्वर का सिंहासन, जिस पर पवित्र रहस्य अर्पित होते हैं।"],["मद्बहो","पवित्र-स्थान, जो एक पर्दे से मध्य-भाग से अलग है; धर्मविधि के महान क्षणों में पर्दा खोला-बंद किया जाता है।"],["प्रोमियोन और सेद्रो","कुर्बाना और घंटों की प्रार्थना में धूप के साथ बोली जानेवाली आरंभिक प्रार्थना (प्रोमियोन) और लंबी व्याख्यात्मक प्रार्थना (सेद्रो)।"],["हूसोयो","धूप के साथ क्षमा और मेल-मिलाप की उपासना, जिसमें ईश्वर से अपनी प्रजा की प्रार्थनाएँ स्वीकार करने की विनती होती है।"],["कौमा","प्रार्थना की एक इकाई, जो पवित्र है तू, हे ईश्वर, इस त्रिसंध्य स्तुति से आरंभ होकर कुरियेलायसोन और प्रभु की प्रार्थना तक जाती है।"],["शेहिमो","साधारण सप्ताह-दिनों की दैनिक प्रार्थना-पुस्तक। रविवारों, पर्वों और कालों की पुस्तक पेंकीथो है।"],["कोलो","निश्चित धुन पर गाया जानेवाला गीत। शेहिमो पूरे वर्ष बदलते कोलो में व्यवस्थित है।"],["बोवूथो","संत एफ़्रेम, सरूग के संत याकूब और संत बलाई से जुड़े निवेदन-गीत, जो घंटों की प्रार्थना में गाए जाते हैं।"],["थुब्देन","अनाफ़ोरा में जीवितों, संतों और दिवंगत विश्वासियों के समारोही स्मरण।"],["कूदोश ईत्तो और हूदोश ईत्तो","कलीसिया का पवित्रीकरण और नवीकरण: धर्मविधिक वर्ष आरंभ करनेवाले दो रविवार।"],["हाशो","दुखभोग। हाशो सप्ताह होसन्ना रविवार से पुनरुत्थान तक का पवित्र सप्ताह है।"],["क्यौम्थो","प्रभु का पुनरुत्थान, और उसके बाद का पचास दिनों का काल।"],["स्लीबो","क्रूस। पवित्र क्रूस का काल धर्मविधिक वर्ष को समाप्त करता है।"],["1930 का पुनर्मिलन","20 सितंबर 1930 को महाधर्माध्यक्ष मार इवानियोस और उनके साथी अपनी पश्चिमी सीरियाई धर्मविधि रखते हुए काथलिक कलीसिया के साथ पूर्ण सहभागिता में आए। 2005 से यह कलीसिया मेजर आर्चबिशप-काथोलिकोस के नेतृत्व में मेजर आर्चएपिस्कोपल कलीसिया है।"]];
GLOSS.lat.de=[["Heilige Messe","Die Feier der Eucharistie im Römischen Ritus, in zwei Hauptteilen: Wortgottesdienst und Eucharistiefeier."],["Lektionar und Lesejahre","Die Sonntagslesungen folgen einem Dreijahreszyklus (Lesejahre A, B und C, mit Matthäus, Markus und Lukas); die ersten Lesungen an Werktagen einem Zweijahreszyklus (I und II)."],["Antwortpsalm","Der nach der ersten Lesung gesungene oder gesprochene Psalm mit einem Kehrvers des Volkes. Er gehört zum Wort Gottes und ist kein zusätzliches Lied."],["Ruf vor dem Evangelium","Das Halleluja mit Vers, das das Evangelium begrüßt. In der Fastenzeit ersetzt ein anderer Ruf das Halleluja."],["Homilie","Die Auslegung der Lesungen und der Liturgie durch Bischof, Priester oder Diakon, die Gottes Wort auf das Leben anwendet."],["Fürbitten","Das Allgemeine Gebet der Gläubigen, in dem das Volk sein Taufpriestertum ausübt und für Kirche, Welt, Notleidende und die Gemeinde betet."],["Eucharistisches Hochgebet","Die Mitte der Messe: Präfation, Sanctus, Anrufung des Heiligen Geistes (Epiklese), Einsetzungsbericht und Wandlung, Gedächtnis, Interzessionen und Schlussdoxologie, beantwortet mit dem großen Amen."],["Liturgische Farben","Grün im Jahreskreis; Violett im Advent und in der Fastenzeit; Weiß (oder Gold) an Weihnachten, Ostern und an Festen des Herrn, Marias und der Heiligen, die nicht Märtyrer waren; Rot am Palmsonntag, Karfreitag, Pfingsten und an Festen der Apostel und Märtyrer; Rosa am Dritten Adventssonntag und am Vierten Fastensonntag."],["Hochfest, Fest, Gedenktag","Die drei Rangstufen der Feiern. Das Hochfest ist die höchste; ein Gedenktag kann geboten oder nicht geboten sein."],["Zeit im Jahreskreis","Die gezählten Wochen außerhalb der geprägten Zeiten, in denen die Kirche dem öffentlichen Leben und der Lehre Christi folgt."],["Österliches Triduum","Die drei heiligen Tage von der Abendmahlsmesse am Gründonnerstag bis zum Abend des Ostersonntags: der Höhepunkt des Kirchenjahres."],["Stundengebet","Das tägliche Gebet der Kirche, das die Stunden des Tages heiligt; Laudes (Morgenlob) und Vesper (Abendlob) sind seine beiden Angelpunkte."],["Ambo, Altar, Tabernakel","Der Ambo ist der Ort des Wortes; der Altar der Ort des Opfers und der Tisch des Herrn; der Tabernakel bewahrt das Allerheiligste für die Kranken und zur Anbetung."],["Adventskranz","Ein Kranz aus immergrünen Zweigen mit vier Kerzen, die an den Adventssonntagen nacheinander entzündet werden: das wachsende Licht vor Weihnachten."]];
GLOSS.lat.it=[["Santa Messa","La celebrazione dell'Eucaristia nel Rito Romano, in due parti principali: la Liturgia della Parola e la Liturgia eucaristica."],["Lezionario e cicli","Le letture domenicali seguono un ciclo triennale (Anni A, B e C, con Matteo, Marco e Luca); le prime letture feriali un ciclo biennale (I e II)."],["Salmo responsoriale","Il salmo cantato o recitato dopo la prima lettura, con un ritornello ripetuto dal popolo. Fa parte della Parola di Dio, non è un canto aggiunto."],["Acclamazione al Vangelo","L'Alleluia con il versetto che accoglie il Vangelo. In Quaresima un'altra acclamazione sostituisce l'Alleluia."],["Omelia","La spiegazione delle letture e della liturgia, tenuta da un vescovo, un sacerdote o un diacono, che applica la Parola di Dio alla vita."],["Preghiera universale","La preghiera dei fedeli, in cui il popolo esercita il sacerdozio battesimale pregando per la Chiesa, il mondo, chi è nel bisogno e la comunità locale."],["Preghiera eucaristica","Il centro della Messa: prefazio, Santo, invocazione dello Spirito Santo (epiclesi), racconto dell'istituzione e consacrazione, memoriale, intercessioni e dossologia finale, a cui risponde il grande Amen."],["Colori liturgici","Verde nel Tempo Ordinario; viola in Avvento e Quaresima; bianco (o oro) a Natale, a Pasqua e nelle feste del Signore, di Maria e dei santi non martiri; rosso la Domenica delle Palme, il Venerdì Santo, a Pentecoste e nelle feste degli apostoli e dei martiri; rosaceo nella III domenica di Avvento e nella IV di Quaresima."],["Solennità, festa, memoria","I tre gradi delle celebrazioni. La solennità è il più alto; la memoria può essere obbligatoria o facoltativa."],["Tempo Ordinario","Le settimane numerate al di fuori dei tempi forti, in cui la Chiesa segue la vita pubblica e l'insegnamento di Cristo."],["Triduo pasquale","I tre giorni santi dalla Messa vespertina nella Cena del Signore del Giovedì Santo alla sera della domenica di Pasqua: il culmine dell'anno liturgico."],["Liturgia delle Ore","La preghiera quotidiana della Chiesa che santifica le ore del giorno; le Lodi e i Vespri ne sono i due cardini."],["Ambone, altare, tabernacolo","L'ambone è il luogo della Parola; l'altare è il luogo del sacrificio e la mensa del Signore; il tabernacolo custodisce il Santissimo per i malati e per l'adorazione."],["Corona d'Avvento","Una corona di rami sempreverdi con quattro candele, accese una alla volta nelle domeniche di Avvento: la luce che cresce mentre si avvicina il Natale."]];
