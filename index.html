 verse:"Son, your sins are forgiven.",cite:"Mark 2:5",
 theo:["Jesus is teaching in a crowded house in Capernaum. Four men bring a paralysed friend on a mat, but they cannot get near. So they climb onto the roof, dig through it, and lower him down in front of Jesus. Mark says: “When Jesus saw their faith, he said to the paralytic, ‘Son, your sins are forgiven.’” The faith of the friends opens the way for the sick man.","Everyone expected a healing of the legs. Jesus begins with the heart. The deepest paralysis is sin: it keeps us from walking towards God and towards others. The scribes object: “Who can forgive sins but God alone?” They are right; and that is exactly the point. Jesus then says: “So that you may know that the Son of Man has authority on earth to forgive sins… stand up, take your mat and go to your home.” The visible healing proves the invisible one.","Ezekiel warns of people who listen to the prophet's words like a lovely song and do nothing: “they hear what you say, but they will not do it.” Isaiah cries: “Ah, you who call evil good and good evil.” The paralysis of the soul often begins there: hearing without doing, calling sin by softer names. Lent is the time to stand up and walk.","St Paul gives the reason for our hope: “God proves his love for us in that while we still were sinners Christ died for us.” We do not have to cure ourselves first. Like the paralytic, we only need to be brought to Jesus, and to let others carry us when we cannot walk."],
 conn:[["Carried by faith.","The four friends are an image of the Church: we carry one another to Christ by prayer, intercession and example."],["Authority to forgive.","Christ gave this authority to the apostles (John 20:22–23); it continues in the sacrament of Penance."],["Hearing and doing.","Ezekiel 33:32 and James 1:22: be doers of the word, not hearers only."],["Peter's shadow.","Acts 5:15: the sick are laid on mats in the street so Peter's shadow may fall on them; Christ's healing continues through the Church."]],
 altar:["At every Holy Qurbono we are like the paralytic, lowered before the Lord by the prayer of the whole Church. Before Communion the priest prays for the forgiveness of our sins; then the Lord says to us, “Stand up and walk.”"],
 outline:[["Opening","The roof broken open: what would we do to bring a friend to Jesus?"],["Point 1 · Faith of friends","Intercession: we carry each other."],["Point 2 · Sin is the deepest paralysis","Jesus heals the heart first."],["Point 3 · Hearing without doing","Ezekiel and Isaiah: honesty about sin."],["Point 4 · Stand up and walk","Confession and a new start; God loved us while we were sinners."],["Take-home line","“Son, your sins are forgiven.”"]],
 live:[["Carry a friend","Pray every day this week for one person who cannot or will not come to God."],["Do what you hear (Ezekiel 33:32)","Choose one teaching from today's Gospel and act on it this week."],["Confession","If you have not yet confessed this Lent, do it this week."]],
 fathers:[["St Ambrose of Milan","How great is the Lord, who for the merit of some pardons others… If you doubt your own merit, seek the prayers of others; the Church will pray for you (Exposition of the Gospel of Luke 5, 11)."],["St Ephrem the Syrian","He sees in the paralytic the human race, made helpless by sin, which the Physician raised by a word, showing that he who forgives is God (Commentary on the Diatessaron)."]],
 magis:[["Catechism 1441–1442","Only God forgives sins; Jesus, the Son of God, exercises this divine power and gives it to his apostles for the Church."],["Catechism 1421","Christ, physician of souls and bodies, healed the paralytic and forgave his sins; the Church continues this in Penance."],["Catechism 2634–2636","Intercessory prayer: asking on behalf of another, as the four friends did."]],
 saints:[["This week (fixed dates)","22 Feb: the Throne of St Peter at Antioch. 23 Feb: St Polycarp of Smyrna. 24 Feb: the Finding of the Head of St John the Baptist. 25 Feb: Blessed Rani Maria (as in the 2025–26 lectionary)."]],
 prayer:"Lord Jesus, you saw the faith of four friends and forgave the sins of the paralytic. Forgive our sins, heal the paralysis of our hearts, and make us friends who carry others to you. Raise us up, that we may walk in your ways. Amen."},
 {quick:["Four friends carry the paralytic to Jesus: we carry each other by faith.","Jesus heals the deepest paralysis first: sin.","Don't only hear the Word; do it."],action:"Pray daily this week for one person who is far from God.",question:"Whom am I carrying to Jesus, and who is carrying me?",
  special:"M'shario Sunday, third Sunday of the Great Fast.",
  illus:["An illustration","When a young man in a Kerala parish was bedridden after an accident, his prayer group came every Friday evening, carried him to the car and took him to the adoration chapel. He says their faith kept his alive. They were the four friends of Capernaum."],kids:"",diaspora:"",
  family:{read:"Read together: Mark 2:1–12.",explain:"Four friends carried a man who could not walk to Jesus. The house was full, so they made a hole in the roof! Jesus forgave his sins and healed him.",intention:"We pray for people who cannot walk or are sick in bed, and for friends who are far from God.",ask:"Ask: “How can we help a friend to come closer to Jesus?”"},
  catechism:[["CCC 1441–1442","Only God forgives sins."],["CCC 2634–2636","Prayer of intercession."]],
  kidsaint:["Blessed Rani Maria (25 Feb)","A Franciscan Clarist sister from Pulluvazhy in Kerala who worked for poor village families in Madhya Pradesh and was killed in 1995. Her killer later repented, and her family forgave him. Lesson: love and forgiveness can heal hearts."],
  term:["M'shario Sunday","M'shario refers to the paralytic, the man who was “loosed” and raised up. The third Sunday of the Great Fast reads his healing (Mark 2:1–12)."],
  termMore:["Prostrations during the Fast","On the weekdays of the Great Fast the Malankara tradition prays with prostrations (kneeling and bowing to the ground), a bodily sign of repentance. They are not made on the Fortieth Friday and on feast days, as the lectionary notes."]},
 {homily:["Dear brothers and sisters, imagine the scene in Capernaum. Jesus is teaching in a house so crowded that no one can get to the door. Four men arrive carrying a friend who cannot walk. What do they do? They climb onto the roof, dig a hole, and lower their friend down right in front of Jesus. They would not give up.","St Mark says: “When Jesus saw their faith, he said to the paralytic, ‘Son, your sins are forgiven.’” Their faith. Sometimes we cannot bring ourselves to God; others must carry us. And sometimes we are called to carry others: a son who has left the Church, a friend in addiction, a neighbour in despair. Our prayer can open the roof.","Everyone expected Jesus to heal the man's legs. He began with his sins. The deepest paralysis is not in our legs but in our hearts: sin keeps us from walking towards God and others. Only God can forgive sins, said the scribes. Exactly. And to show that he has that authority, Jesus told the man: “Stand up, take your mat and go home.”","Ezekiel warns of people who hear God's word like a beautiful song and then do nothing. Let us not be like that this Lent. Let us make a good Confession, so that we hear Jesus say: “Your sins are forgiven.” And let us become the four friends who carry others to him. Amen."],
  kids:["Children, four friends wanted to bring their friend who could not walk to Jesus. But the house was full of people!","So they climbed onto the roof, made a hole, and lowered their friend down on a mat right in front of Jesus! Jesus forgave his sins and said: “Stand up and walk!” And he walked!","Good friends help each other come to Jesus. Let's say: “Jesus, help me to be a good friend!”"]});

put("2027-02-21","ml",{title:"മ്ശർയോ ഞായർ · തളർവാതരോഗിയുടെ സൗഖ്യം",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 5:17–26","നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു"],[ML.ot,"നിയമാവർത്തനം 31:19–30","സാക്ഷ്യമായി മോശയുടെ ഗീതം"],[ML.ot,"പ്രഭാഷകൻ 9:10–18","സുഹൃത്തുക്കളെ വിവേകത്തോടെ തിരഞ്ഞെടുക്കുക"],[ML.ot,"എസെക്കിയേൽ 33:23–33","അവർ നിന്റെ വാക്കുകൾ കേൾക്കുന്നു, പക്ഷേ അനുവർത്തിക്കുന്നില്ല"],[ML.ot,"ഏശയ്യാ 5:18–25","തിന്മയെ നന്മയെന്നു വിളിക്കുന്നവനു ദുരിതം"],[ML.ac,"അപ്പ. പ്രവ. 5:12–16","ശ്ലീഹന്മാരിലൂടെ അടയാളങ്ങളും അദ്ഭുതങ്ങളും"],[ML.pa,"റോമാ 5:1–11","നാം പാപികളായിരിക്കുമ്പോൾത്തന്നെ ക്രിസ്തു നമുക്കുവേണ്ടി മരിച്ചു"],[ML.go,"മർക്കോസ് 2:1–12","നാലു സുഹൃത്തുക്കൾ തളർവാതരോഗിയെ മേൽക്കൂരയിലൂടെ ഇറക്കുന്നു"]],
 alt:"വലിയ നോമ്പിലെ മൂന്നാം ഞായർ.",
 verse:"മകനേ, നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു.",cite:"മർക്കോസ് 2:5",
 theo:["കഫർണാമിലെ ജനനിബിഡമായ ഒരു വീട്ടിൽ യേശു പഠിപ്പിക്കുകയാണ്. തളർവാതം പിടിപെട്ട ഒരു സുഹൃത്തിനെ നാലുപേർ കിടക്കയിൽ ചുമന്നുകൊണ്ടുവരുന്നു; പക്ഷേ അടുത്തെത്താനാവുന്നില്ല. അതുകൊണ്ട് അവർ മേൽക്കൂരയിൽ കയറി, അതു പൊളിച്ച്, അവനെ യേശുവിന്റെ മുമ്പിലേക്ക് ഇറക്കുന്നു. മർക്കോസ് പറയുന്നു: “അവരുടെ വിശ്വാസം കണ്ട് യേശു തളർവാതരോഗിയോടു പറഞ്ഞു: മകനേ, നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു.” സുഹൃത്തുക്കളുടെ വിശ്വാസം രോഗിക്കു വഴി തുറക്കുന്നു.","കാലുകളുടെ സൗഖ്യമാണ് എല്ലാവരും പ്രതീക്ഷിച്ചത്. യേശു ആരംഭിക്കുന്നതു ഹൃദയത്തിൽനിന്നാണ്. ഏറ്റവും ആഴമുള്ള തളർവാതം പാപമാണ്: ദൈവത്തിലേക്കും മറ്റുള്ളവരിലേക്കും നടക്കുന്നതിൽനിന്ന് അതു നമ്മെ തടയുന്നു. നിയമജ്ഞർ എതിർക്കുന്നു: ദൈവം ഒരുവനല്ലാതെ ആർക്കു പാപങ്ങൾ ക്ഷമിക്കാൻ കഴിയും? അവർ പറഞ്ഞതു ശരിയാണ്; അതുതന്നെയാണു കാര്യം. അപ്പോൾ യേശു പറയുന്നു: “ഭൂമിയിൽ പാപങ്ങൾ ക്ഷമിക്കാൻ മനുഷ്യപുത്രന് അധികാരമുണ്ട് എന്നു നിങ്ങൾ അറിയേണ്ടതിന്… ഞാൻ നിന്നോടു പറയുന്നു, എഴുന്നേറ്റ് നിന്റെ കിടക്കയുമെടുത്ത്, വീട്ടിലേക്കു പോവുക.” ദൃശ്യമായ സൗഖ്യം അദൃശ്യമായതിനു തെളിവാകുന്നു.","പ്രവാചകന്റെ വാക്കുകൾ ഇമ്പമുള്ള ഒരു പാട്ടുപോലെ കേട്ട് ഒന്നും ചെയ്യാത്തവരെപ്പറ്റി എസെക്കിയേൽ മുന്നറിയിപ്പു നൽകുന്നു: “നിന്റെ വാക്കുകൾ അവർ കേൾക്കുന്നു. എന്നാൽ, അവർ അത് അനുവർത്തിക്കുകയില്ല.” ഏശയ്യാ വിലപിക്കുന്നു: “തിന്മയെ നന്മയെന്നും നന്മയെ തിന്മയെന്നും വിളിക്കുന്നവനു ദുരിതം!” ആത്മാവിന്റെ തളർവാതം പലപ്പോഴും അവിടെയാണ് ആരംഭിക്കുന്നത്: കേൾക്കുന്നു, ചെയ്യുന്നില്ല; പാപത്തെ മൃദുവായ പേരുകൾ വിളിക്കുന്നു. എഴുന്നേറ്റു നടക്കാനുള്ള സമയമാണു നോമ്പ്.","നമ്മുടെ പ്രത്യാശയുടെ കാരണം വിശുദ്ധ പൗലോസ് നൽകുന്നു: നാം പാപികളായിരിക്കുമ്പോൾത്തന്നെ ക്രിസ്തു നമുക്കുവേണ്ടി മരിച്ചു; അതുവഴി ദൈവം നമ്മോടുള്ള തന്റെ സ്നേഹം തെളിയിച്ചു (റോമാ 5:8). ആദ്യം നമ്മെത്തന്നെ സുഖപ്പെടുത്തേണ്ടതില്ല. തളർവാതരോഗിയെപ്പോലെ യേശുവിന്റെ അടുത്തേക്കു കൊണ്ടുവരപ്പെട്ടാൽ മതി; നടക്കാൻ കഴിയാത്തപ്പോൾ മറ്റുള്ളവർ നമ്മെ ചുമക്കാൻ അനുവദിച്ചാൽ മതി."],
 conn:[["വിശ്വാസത്താൽ ചുമക്കപ്പെടുന്നു.","നാലു സുഹൃത്തുക്കൾ സഭയുടെ പ്രതീകമാണ്: പ്രാർഥനയാലും മാധ്യസ്ഥ്യത്താലും മാതൃകയാലും നാം പരസ്പരം ക്രിസ്തുവിലേക്കു ചുമക്കുന്നു."],["പാപം ക്ഷമിക്കാനുള്ള അധികാരം.","ക്രിസ്തു ഈ അധികാരം ശ്ലീഹന്മാർക്കു നൽകി (യോഹ 20:22–23); അനുരഞ്ജനകൂദാശയിൽ അതു തുടരുന്നു."],["കേൾക്കലും ചെയ്യലും.","എസെക്കിയേൽ 33:32-ഉം യാക്കോബ് 1:22-ഉം: വചനം കേൾക്കുന്നവർ മാത്രമല്ല, അതു പ്രവർത്തിക്കുന്നവരുമാകുവിൻ."],["പത്രോസിന്റെ നിഴൽ.","അപ്പ 5:15: “പത്രോസ് കടന്നുപോകുമ്പോൾ അവന്റെ നിഴലെങ്കിലും” വീഴാൻ രോഗികളെ തെരുവിൽ കിടത്തുന്നു; ക്രിസ്തുവിന്റെ സൗഖ്യം സഭയിലൂടെ തുടരുന്നു."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയിലും നാം തളർവാതരോഗിയെപ്പോലെയാണ്: സഭ മുഴുവന്റെയും പ്രാർഥനയാൽ കർത്താവിന്റെ മുമ്പിലേക്ക് ഇറക്കപ്പെടുന്നു. കുർബാനസ്വീകരണത്തിനു മുമ്പു നമ്മുടെ പാപമോചനത്തിനായി വൈദികൻ പ്രാർഥിക്കുന്നു; പിന്നെ കർത്താവു നമ്മോടു പറയുന്നു: “എഴുന്നേറ്റു നടക്കുക.”"],
 outline:[["ആരംഭം","പൊളിക്കപ്പെട്ട മേൽക്കൂര: ഒരു സുഹൃത്തിനെ യേശുവിന്റെ അടുത്തെത്തിക്കാൻ നാം എന്തു ചെയ്യും?"],["ഒന്നാം ആശയം · സുഹൃത്തുക്കളുടെ വിശ്വാസം","മാധ്യസ്ഥ്യം: നാം പരസ്പരം ചുമക്കുന്നു."],["രണ്ടാം ആശയം · പാപമാണ് ഏറ്റവും ആഴമുള്ള തളർവാതം","യേശു ആദ്യം ഹൃദയം സുഖപ്പെടുത്തുന്നു."],["മൂന്നാം ആശയം · ചെയ്യാതെയുള്ള കേൾക്കൽ","എസെക്കിയേലും ഏശയ്യായും: പാപത്തെപ്പറ്റിയുള്ള സത്യസന്ധത."],["നാലാം ആശയം · എഴുന്നേറ്റു നടക്കുക","കുമ്പസാരവും പുതിയ തുടക്കവും; നാം പാപികളായിരിക്കുമ്പോൾ ദൈവം നമ്മെ സ്നേഹിച്ചു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“മകനേ, നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു.”"]],
 live:[["ഒരു സുഹൃത്തിനെ ചുമക്കുക","ദൈവത്തിലേക്കു വരാൻ കഴിയാത്ത, അല്ലെങ്കിൽ മനസ്സില്ലാത്ത ഒരാൾക്കുവേണ്ടി ഈ ആഴ്ച എല്ലാ ദിവസവും പ്രാർഥിക്കുക."],["കേൾക്കുന്നതു ചെയ്യുക (എസെ 33:32)","ഇന്നത്തെ സുവിശേഷത്തിൽനിന്ന് ഒരു പ്രബോധനം തിരഞ്ഞെടുത്ത് ഈ ആഴ്ച അതനുസരിച്ചു പ്രവർത്തിക്കുക."],["കുമ്പസാരം","ഈ നോമ്പിൽ ഇതുവരെ കുമ്പസാരിച്ചിട്ടില്ലെങ്കിൽ ഈ ആഴ്ച കുമ്പസാരിക്കുക."]],
 fathers:[["മിലാനിലെ വിശുദ്ധ അംബ്രോസ്","ചിലരുടെ യോഗ്യതയാൽ മറ്റുള്ളവർക്കു മാപ്പു നൽകുന്ന കർത്താവ് എത്ര മഹാനാണ്… നിന്റെ സ്വന്തം യോഗ്യതയെപ്പറ്റി നിനക്കു സംശയമുണ്ടെങ്കിൽ മറ്റുള്ളവരുടെ പ്രാർഥന തേടുക; സഭ നിനക്കുവേണ്ടി പ്രാർഥിക്കും (ലൂക്കാസുവിശേഷവ്യാഖ്യാനം 5, 11)."],["മാർ അപ്രേം","പാപത്താൽ നിസ്സഹായമായ മനുഷ്യവംശത്തെ അദ്ദേഹം തളർവാതരോഗിയിൽ കാണുന്നു; ഒരു വാക്കിനാൽ വൈദ്യൻ അതിനെ ഉയർത്തി, ക്ഷമിക്കുന്നവൻ ദൈവമാണെന്നു കാണിച്ചു (ദിയാതെസ്സറോൻ വ്യാഖ്യാനം)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1441–1442","ദൈവം മാത്രമാണു പാപങ്ങൾ ക്ഷമിക്കുന്നത്; ദൈവപുത്രനായ യേശു ഈ ദൈവികാധികാരം പ്രയോഗിക്കുകയും സഭയ്ക്കുവേണ്ടി അതു തന്റെ ശ്ലീഹന്മാർക്കു നൽകുകയും ചെയ്യുന്നു."],["മതബോധനഗ്രന്ഥം 1421","ആത്മാക്കളുടെയും ശരീരങ്ങളുടെയും വൈദ്യനായ ക്രിസ്തു തളർവാതരോഗിയെ സുഖപ്പെടുത്തുകയും അവന്റെ പാപങ്ങൾ ക്ഷമിക്കുകയും ചെയ്തു; അനുരഞ്ജനകൂദാശയിൽ സഭ അതു തുടരുന്നു."],["മതബോധനഗ്രന്ഥം 2634–2636","മാധ്യസ്ഥ്യപ്രാർഥന: നാലു സുഹൃത്തുക്കൾ ചെയ്തതുപോലെ മറ്റൊരാൾക്കുവേണ്ടി യാചിക്കൽ."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഫെബ്രുവരി 22: അന്ത്യോക്യായിലെ വിശുദ്ധ പത്രോസിന്റെ സിംഹാസനം. ഫെബ്രുവരി 23: സ്മിർണായിലെ വിശുദ്ധ പോളിക്കാർപ്പ്. ഫെബ്രുവരി 24: സ്നാപകയോഹന്നാന്റെ ശിരസ്സു കണ്ടെത്തിയതിന്റെ ഓർമ. ഫെബ്രുവരി 25: വാഴ്ത്തപ്പെട്ട റാണി മരിയ (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ)."]],
 prayer:"കർത്താവായ യേശുവേ, നാലു സുഹൃത്തുക്കളുടെ വിശ്വാസം കണ്ട് അങ്ങു തളർവാതരോഗിയുടെ പാപങ്ങൾ ക്ഷമിച്ചു. ഞങ്ങളുടെ പാപങ്ങൾ ക്ഷമിക്കണമേ; ഞങ്ങളുടെ ഹൃദയങ്ങളുടെ തളർവാതം സുഖപ്പെടുത്തണമേ; മറ്റുള്ളവരെ അങ്ങയിലേക്കു ചുമക്കുന്ന സുഹൃത്തുക്കളാക്കണമേ. അങ്ങയുടെ വഴികളിൽ നടക്കാൻ ഞങ്ങളെ എഴുന്നേൽപിക്കണമേ. ആമേൻ."},
 {quick:["നാലു സുഹൃത്തുക്കൾ തളർവാതരോഗിയെ യേശുവിന്റെ അടുത്തേക്കു ചുമക്കുന്നു: വിശ്വാസത്താൽ നാം പരസ്പരം ചുമക്കുന്നു.","യേശു ആദ്യം ഏറ്റവും ആഴമുള്ള തളർവാതം സുഖപ്പെടുത്തുന്നു: പാപം.","വചനം കേട്ടാൽ മാത്രം പോരാ; അതു ചെയ്യുക."],action:"ദൈവത്തിൽനിന്ന് അകലെയായിരിക്കുന്ന ഒരാൾക്കുവേണ്ടി ഈ ആഴ്ച എല്ലാ ദിവസവും പ്രാർഥിക്കുക.",question:"ഞാൻ ആരെയാണ് യേശുവിലേക്കു ചുമക്കുന്നത്? എന്നെ ആരാണു ചുമക്കുന്നത്?",
  special:"മ്ശർയോ ഞായർ, വലിയ നോമ്പിലെ മൂന്നാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഒരു ഇടവകയിലെ ഒരു യുവാവ് അപകടത്തിനുശേഷം കിടപ്പിലായപ്പോൾ, അവന്റെ പ്രാർഥനാഗ്രൂപ്പ് എല്ലാ വെള്ളിയാഴ്ചയും സന്ധ്യയ്ക്കു വന്ന് അവനെ കാറിലേക്കു ചുമന്ന് ആരാധനാചാപ്പലിലേക്കു കൊണ്ടുപോയി. അവരുടെ വിശ്വാസമാണു തന്റെ വിശ്വാസം ജീവനോടെ നിലനിർത്തിയതെന്ന് അവൻ പറയുന്നു. അവരായിരുന്നു കഫർണാമിലെ നാലു സുഹൃത്തുക്കൾ."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മർക്കോസ് 2:1–12.",explain:"നടക്കാൻ കഴിയാത്ത ഒരാളെ നാലു സുഹൃത്തുക്കൾ യേശുവിന്റെ അടുത്തേക്കു ചുമന്നുകൊണ്ടുവന്നു. വീടു നിറയെ ആളുകളായിരുന്നതുകൊണ്ട് അവർ മേൽക്കൂരയിൽ ഒരു ദ്വാരമുണ്ടാക്കി! യേശു അവന്റെ പാപങ്ങൾ ക്ഷമിച്ച് അവനെ സുഖപ്പെടുത്തി.",intention:"നടക്കാൻ കഴിയാത്തവർക്കും കിടപ്പിലായ രോഗികൾക്കും ദൈവത്തിൽനിന്ന് അകലെയായിരിക്കുന്ന സുഹൃത്തുക്കൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “യേശുവിനോടു കൂടുതൽ അടുക്കാൻ ഒരു സുഹൃത്തിനെ നമുക്ക് എങ്ങനെ സഹായിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1441–1442","ദൈവം മാത്രം പാപങ്ങൾ ക്ഷമിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 2634–2636","മാധ്യസ്ഥ്യപ്രാർഥന."]],
  kidsaint:["വാഴ്ത്തപ്പെട്ട റാണി മരിയ (ഫെബ്രുവരി 25)","മധ്യപ്രദേശിലെ ദരിദ്രഗ്രാമീണകുടുംബങ്ങൾക്കുവേണ്ടി പ്രവർത്തിക്കുകയും 1995-ൽ കൊല്ലപ്പെടുകയും ചെയ്ത, കേരളത്തിലെ പുല്ലുവഴിയിൽനിന്നുള്ള ഒരു ഫ്രാൻസിസ്കൻ ക്ലാരിസ്റ്റ് സന്യാസിനി. അവളുടെ ഘാതകൻ പിന്നീട് അനുതപിച്ചു; അവളുടെ കുടുംബം അവനോടു ക്ഷമിച്ചു. പാഠം: സ്നേഹത്തിനും ക്ഷമയ്ക്കും ഹൃദയങ്ങളെ സുഖപ്പെടുത്താനാകും."],
  term:["മ്ശർയോ ഞായർ","“മ്ശർയോ” തളർവാതരോഗിയെ, “അഴിച്ചുവിടപ്പെട്ട്” എഴുന്നേൽപിക്കപ്പെട്ടവനെ, സൂചിപ്പിക്കുന്നു. വലിയ നോമ്പിലെ മൂന്നാം ഞായറാഴ്ച അവന്റെ സൗഖ്യം വായിക്കുന്നു (മർക്കോ 2:1–12)."],
  termMore:["നോമ്പിലെ കുമ്പിടീലുകൾ","വലിയ നോമ്പിലെ വാരദിവസങ്ങളിൽ മലങ്കര പാരമ്പര്യം കുമ്പിടീലുകളോടെ (മുട്ടുകുത്തി നിലംവരെ കുമ്പിടൽ) പ്രാർഥിക്കുന്നു; അനുതാപത്തിന്റെ ശാരീരികമായ ഒരു അടയാളം. വായനാപുസ്തകം സൂചിപ്പിക്കുന്നതുപോലെ നാൽപതാം വെള്ളിയാഴ്ചയിലും തിരുനാളുകളിലും അവ ചെയ്യാറില്ല."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, കഫർണാമിലെ ആ രംഗം സങ്കൽപിക്കുക. ആർക്കും വാതിൽക്കലെത്താനാകാത്തവിധം ആളുകൾ നിറഞ്ഞ ഒരു വീട്ടിൽ യേശു പഠിപ്പിക്കുകയാണ്. നടക്കാൻ കഴിയാത്ത ഒരു സുഹൃത്തിനെ ചുമന്നുകൊണ്ടു നാലുപേർ എത്തുന്നു. അവർ എന്തു ചെയ്യുന്നു? മേൽക്കൂരയിൽ കയറി, ഒരു ദ്വാരമുണ്ടാക്കി, സുഹൃത്തിനെ യേശുവിന്റെ തൊട്ടുമുമ്പിലേക്ക് ഇറക്കുന്നു. അവർ പിന്മാറിയില്ല.","വിശുദ്ധ മർക്കോസ് പറയുന്നു: “അവരുടെ വിശ്വാസം കണ്ട് യേശു തളർവാതരോഗിയോടു പറഞ്ഞു: മകനേ, നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു.” അവരുടെ വിശ്വാസം. ചിലപ്പോൾ നമുക്കു സ്വയം ദൈവത്തിലേക്കു വരാനാകില്ല; മറ്റുള്ളവർ നമ്മെ ചുമക്കണം. ചിലപ്പോൾ മറ്റുള്ളവരെ ചുമക്കാൻ നാം വിളിക്കപ്പെടുന്നു: സഭ വിട്ടുപോയ ഒരു മകൻ, ആസക്തിയിലായ ഒരു സുഹൃത്ത്, നിരാശയിലായ ഒരു അയൽക്കാരൻ. നമ്മുടെ പ്രാർഥനയ്ക്കു മേൽക്കൂര തുറക്കാനാകും.","യേശു അവന്റെ കാലുകൾ സുഖപ്പെടുത്തുമെന്നാണ് എല്ലാവരും പ്രതീക്ഷിച്ചത്. അവിടുന്ന് ആരംഭിച്ചത് അവന്റെ പാപങ്ങളിൽനിന്നാണ്. ഏറ്റവും ആഴമുള്ള തളർവാതം കാലുകളിലല്ല, ഹൃദയങ്ങളിലാണ്: ദൈവത്തിലേക്കും മറ്റുള്ളവരിലേക്കും നടക്കുന്നതിൽനിന്നു പാപം നമ്മെ തടയുന്നു. ദൈവത്തിനു മാത്രമേ പാപങ്ങൾ ക്ഷമിക്കാനാകൂ എന്നു നിയമജ്ഞർ പറഞ്ഞു. അതുതന്നെ. തനിക്ക് ആ അധികാരമുണ്ടെന്നു കാണിക്കാൻ യേശു അവനോടു പറഞ്ഞു: “എഴുന്നേറ്റ് നിന്റെ കിടക്കയുമെടുത്ത്, വീട്ടിലേക്കു പോവുക.”","ദൈവവചനം ഒരു മനോഹരഗാനംപോലെ കേട്ടിട്ട് ഒന്നും ചെയ്യാത്തവരെപ്പറ്റി എസെക്കിയേൽ മുന്നറിയിപ്പു നൽകുന്നു. ഈ നോമ്പിൽ നമുക്ക് അങ്ങനെയാകാതിരിക്കാം. “നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു” എന്ന് യേശു പറയുന്നതു കേൾക്കാൻ നല്ല ഒരു കുമ്പസാരം നടത്താം. മറ്റുള്ളവരെ അവിടുത്തെ അടുത്തേക്കു ചുമക്കുന്ന നാലു സുഹൃത്തുക്കളാകാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നടക്കാൻ കഴിയാത്ത തങ്ങളുടെ സുഹൃത്തിനെ യേശുവിന്റെ അടുത്തെത്തിക്കാൻ നാലു കൂട്ടുകാർ ആഗ്രഹിച്ചു. പക്ഷേ വീടു നിറയെ ആളുകളായിരുന്നു!","അതുകൊണ്ട് അവർ മേൽക്കൂരയിൽ കയറി, ഒരു ദ്വാരമുണ്ടാക്കി, കൂട്ടുകാരനെ ഒരു പായയിൽ യേശുവിന്റെ തൊട്ടുമുമ്പിലേക്ക് ഇറക്കി! യേശു അവന്റെ പാപങ്ങൾ ക്ഷമിച്ചു പറഞ്ഞു: “എഴുന്നേറ്റു നടക്കുക!” അവൻ നടന്നു!","നല്ല കൂട്ടുകാർ യേശുവിന്റെ അടുത്തുവരാൻ പരസ്പരം സഹായിക്കും. നമുക്കു പറയാം: “യേശുവേ, നല്ല ഒരു കൂട്ടുകാരനാകാൻ എന്നെ സഹായിക്കണമേ!”"]});

/* ================= KNANOITHO SUNDAY · 28 February 2027 ================= */
put("2027-02-28","en",{title:"Knanoitho Sunday · The Canaanite Woman",readTitle:EN.rt,
 readings:[[EN.eg,"Mark 7:24–30","The Syrophoenician woman"],[EN.ot,"Exodus 16:1–12","Bread from heaven"],[EN.ot,"1 Samuel 7:10–17","Thus far the Lord has helped us"],[EN.ot,"Sirach 10:6–18","The beginning of pride"],[EN.ot,"Isaiah 56:1–7","A house of prayer for all peoples"],[EN.ac,"Acts 20:22–32","I commend you to God"],[EN.pa,"Romans 7:13–25","Who will rescue me?"],[EN.go,"Matthew 15:21–28","Woman, great is your faith"]],
 alt:"Fourth Sunday of the Great Fast. The middle day of the Fast falls on Wednesday 3 March, when the Cross is erected in the church.",
 verse:"Woman, great is your faith! Let it be done for you as you wish.",cite:"Matthew 15:28",
 theo:["A Canaanite woman, a foreigner and a pagan, comes shouting after Jesus: “Have mercy on me, Lord, Son of David; my daughter is tormented by a demon.” At first Jesus does not answer her. The disciples want her sent away. Jesus says he was sent to the lost sheep of Israel. But she kneels and says: “Lord, help me.” And when Jesus speaks of the children's bread, she replies: “Yes, Lord, yet even the dogs eat the crumbs that fall from their masters' table.”","This is one of the most moving prayers in the Gospel. She does not argue about her rights; she does not give up; she accepts being called small, and still trusts. Jesus is amazed: “Woman, great is your faith! Let it be done for you as you wish.” Her daughter is healed from that hour. Jesus' silence was not a refusal; it was a school of persevering faith.","Isaiah had prophesied that foreigners who hold fast to the covenant would be brought to God's holy mountain, “for my house shall be called a house of prayer for all peoples.” The Canaanite mother is the first fruit of that promise. The bread meant for the children is enough for all; in the desert God “rained bread from heaven” for the whole people (Exodus 16:4).","St Paul cries out in Romans: “Wretched man that I am! Who will rescue me from this body of death? Thanks be to God through Jesus Christ our Lord!” The mother's cry and Paul's cry are the same: we cannot save ourselves, but Christ can. Halfway through the Fast, the Church sets up the Cross in the middle of the church: the answer to every cry for help."],
 conn:[["A house of prayer for all peoples.","Isaiah 56:7, quoted by Jesus when cleansing the Temple, is fulfilled when a Canaanite woman finds mercy."],["Crumbs and the bread from heaven.","The manna (Exodus 16) and the multiplication of loaves just before and after this Gospel (Matthew 14–15) point to the Eucharist, offered to all nations."],["Ebenezer.","Samuel's stone “Thus far the LORD has helped us” (1 Samuel 7:12) is the grateful memory of persevering faith."],["Pride and humility.","Sirach 10:12–13: pride begins when we forsake the Lord; the woman's humility opens heaven."]],
 altar:["The woman asked only for crumbs from the table. At the Holy Qurbono we receive not crumbs but the whole Bread of Life. Let us come with her humility: “Lord, I am not worthy.”"],
 outline:[["Opening","When God seems silent: do we give up?"],["Point 1 · Persevering prayer","Silence, refusal, and still she kneels: “Lord, help me.”"],["Point 2 · Humble faith","She accepts being small and trusts anyway."],["Point 3 · For all nations","Isaiah 56: God's house is for everyone; welcome the stranger."],["Point 4 · Halfway: the Cross","Mid-Lent: the Cross set up in our church; renew your Lenten resolutions."],["Take-home line","“Lord, help me.”"]],
 live:[["Don't stop praying","Take up again a prayer you abandoned because God seemed silent."],["Pray for your children","Mothers and fathers: bring each child's needs to Jesus by name, like the Canaanite mother."],["Welcome a stranger","Show kindness to someone of another background, language or faith this week."]],
 fathers:[["St John Chrysostom","Christ delayed the gift not to drive her away but to reveal her faith; her persistence made her an example to all the ages (Homilies on Matthew 52)."],["St Ephrem the Syrian","He praises the mother whose love for her daughter made her bold, and whose humility drew mercy from the Lord of the table (Commentary on the Diatessaron)."]],
 magis:[["Catechism 2610","Jesus teaches filial boldness in prayer: “Whatever you ask in prayer, believe that you receive it.” He is amazed at the faith of the Canaanite woman."],["Catechism 2742–2745","Persevering prayer; praying without ceasing."],["Catechism 543","Everyone is called to enter the Kingdom; announced first to Israel, it is meant for all nations."]],
 saints:[["This week","3 Mar (Wednesday): the middle day of the Great Fast; erection of the Cross (Gogultho). 7 Mar: K'piphtho Sunday. 9 Mar: the Forty Martyrs of Sebaste."]],
 prayer:"Lord Jesus, Son of David, have mercy on us. Give us the humble, persevering faith of the Canaanite mother; hear our prayers for our children and families; and make your Church a house of prayer for all peoples. Amen."},
 {quick:["Persevering prayer: when God seems silent, keep asking.","Humble faith wins mercy: “even the dogs eat the crumbs.”","God's house is a house of prayer for all peoples."],action:"Take up again a prayer you stopped because God seemed silent.",question:"Have I given up asking God for something important?",
  special:"Knanoitho Sunday, fourth Sunday of the Great Fast. Announce the middle day of the Fast (Wednesday 3 March) and the erection of the Cross.",
  illus:["An illustration","A Kerala mother prayed for twenty years for her son who had left home and faith. Every Sunday she lit a candle before Mary. When he came back one Easter, he said: “I knew someone was praying.” The Canaanite woman still lives in our parishes."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 15:21–28.",explain:"A mother whose daughter was very sick kept asking Jesus for help, even when he did not answer at first. Because she kept trusting, Jesus healed her daughter.",intention:"We pray for all mothers and fathers who are worried about their children.",ask:"Ask: “What do we need to keep asking Jesus for as a family?”"},
  catechism:[["CCC 2610","Boldness in prayer."],["CCC 2742–2745","Persevering prayer."]],
  kidsaint:["St Josephine Bakhita","Kidnapped as a child in Sudan and sold as a slave, she later came to know Jesus in Italy, became a sister, and forgave those who had hurt her. Lesson: God's love is for everyone, from every nation."],
  term:["Knanoitho Sunday","Knanoitho means “the Canaanite woman”. The fourth Sunday of the Great Fast reads the healing of her daughter (Matthew 15:21–28; Mark 7:24–30)."],
  termMore:["The middle of the Fast","On the Wednesday after this Sunday, the twenty-fifth day of the Fast, the Malankara Church marks the middle of the Great Fast; the Cross (Gogultho) is solemnly set up in the church, recalling the bronze serpent lifted up in the desert (Numbers 21:9; John 3:14)."]},
 {homily:["Dear brothers and sisters, today a mother comes to Jesus. She is not one of his people; she is a Canaanite, a foreigner. Her daughter is suffering terribly. She cries out: “Have mercy on me, Lord, Son of David!” And Jesus does not answer her a word.","Have you ever felt that? You pray and pray, and heaven seems silent. The disciples even want her sent away. Jesus says he was sent first to Israel. But she does not give up. She kneels and says three simple words: “Lord, help me.” And when Jesus speaks of the children's bread, she answers with amazing humility: “Yes, Lord, yet even the dogs eat the crumbs that fall from their masters' table.”","Jesus is amazed: “Woman, great is your faith! Let it be done for you as you wish.” His silence was not a refusal. It was a school of faith, and she passed with honours. Isaiah had said that God's house would be a house of prayer for all peoples. This foreign mother shows us that no one is outside God's mercy.","This Wednesday we reach the middle of the Fast, and the Cross is set up in our church. Look at it when you feel God is silent. St Paul cries: “Who will rescue me? Thanks be to God through Jesus Christ our Lord!” Mothers and fathers, keep praying for your children. Don't give up. Say with her: “Lord, help me.” Amen."],
  kids:["Children, a mother came to Jesus because her daughter was very sick. She asked and asked: “Jesus, please help!” At first Jesus did not answer.","But she kept trusting and asking. Jesus said: “Your faith is great!” And her daughter was healed.","When you pray and nothing seems to happen, don't stop! Jesus is listening. Let's say: “Jesus, help me!”"]});

put("2027-02-28","ml",{title:"കനാനായിത്തോ ഞായർ · കാനാൻകാരിയുടെ വിശ്വാസം",readTitle:ML.rt,
 readings:[[ML.eg,"മർക്കോസ് 7:24–30","സീറോ-ഫിനീഷ്യൻ സ്ത്രീ"],[ML.ot,"പുറപ്പാട് 16:1–12","ആകാശത്തിൽനിന്ന് അപ്പം"],[ML.ot,"1 സാമുവൽ 7:10–17","ഇതുവരെ കർത്താവു നമ്മെ സഹായിച്ചു"],[ML.ot,"പ്രഭാഷകൻ 10:6–18","അഹങ്കാരത്തിന്റെ ആരംഭം"],[ML.ot,"ഏശയ്യാ 56:1–7","എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയം"],[ML.ac,"അപ്പ. പ്രവ. 20:22–32","ഞാൻ നിങ്ങളെ ദൈവത്തിനു ഭരമേൽപിക്കുന്നു"],[ML.pa,"റോമാ 7:13–25","ആര് എന്നെ മോചിപ്പിക്കും?"],[ML.go,"മത്തായി 15:21–28","സ്ത്രീയേ, നിന്റെ വിശ്വാസം വലുതാണ്"]],
 alt:"വലിയ നോമ്പിലെ നാലാം ഞായർ. നോമ്പിന്റെ മധ്യദിനം മാർച്ച് 3 ബുധനാഴ്ച; അന്നു പള്ളിയിൽ സ്ലീബാ ഉയർത്തുന്നു.",
 verse:"സ്ത്രീയേ, നിന്റെ വിശ്വാസം വലുതാണ്. നീ ആഗ്രഹിക്കുന്നതുപോലെ നിനക്കു ഭവിക്കട്ടെ.",cite:"മത്തായി 15:28",
 theo:["വിജാതീയയും പരദേശിയുമായ ഒരു കാനാൻകാരി യേശുവിന്റെ പിന്നാലെ വന്നു കരഞ്ഞപേക്ഷിക്കുന്നു: “കർത്താവേ, ദാവീദിന്റെ പുത്രാ, എന്നിൽ കനിയണമേ! എന്റെ മകളെ പിശാച് ക്രൂരമായി ബാധിച്ചിരിക്കുന്നു.” ആദ്യം യേശു അവൾക്ക് ഉത്തരം നൽകുന്നില്ല. ശിഷ്യന്മാർ അവളെ പറഞ്ഞയയ്ക്കാൻ ആഗ്രഹിക്കുന്നു. ഇസ്രായേലിന്റെ നഷ്ടപ്പെട്ട ആടുകളുടെ അടുത്തേക്കാണു താൻ അയയ്ക്കപ്പെട്ടതെന്ന് യേശു പറയുന്നു. പക്ഷേ അവൾ താണുവണങ്ങി പറയുന്നു: “കർത്താവേ, എന്നെ സഹായിക്കണമേ.” മക്കളുടെ അപ്പത്തെപ്പറ്റി യേശു പറയുമ്പോൾ അവൾ മറുപടി പറയുന്നു: “അതേ, കർത്താവേ, നായ്ക്കളും യജമാനന്മാരുടെ മേശയിൽ നിന്നു വീഴുന്ന അപ്പക്കഷണങ്ങൾ തിന്നുന്നുണ്ടല്ലോ.”","സുവിശേഷത്തിലെ ഏറ്റവും ഹൃദയസ്പർശിയായ പ്രാർഥനകളിലൊന്നാണിത്. അവൾ തന്റെ അവകാശങ്ങളെപ്പറ്റി വാദിക്കുന്നില്ല; പിന്മാറുന്നില്ല; ചെറുതായി വിളിക്കപ്പെടുന്നതു സ്വീകരിക്കുന്നു; എന്നിട്ടും ആശ്രയിക്കുന്നു. യേശു വിസ്മയിക്കുന്നു: “സ്ത്രീയേ, നിന്റെ വിശ്വാസം വലുതാണ്. നീ ആഗ്രഹിക്കുന്നതുപോലെ നിനക്കു ഭവിക്കട്ടെ.” “ആ സമയംമുതൽ അവളുടെ പുത്രി സൗഖ്യമുള്ളവളായി.” യേശുവിന്റെ മൗനം ഒരു നിരസനമായിരുന്നില്ല; നിരന്തരമായ വിശ്വാസത്തിന്റെ ഒരു വിദ്യാലയമായിരുന്നു.","ഉടമ്പടിയിൽ മുറുകെപ്പിടിക്കുന്ന പരദേശികൾ ദൈവത്തിന്റെ വിശുദ്ധഗിരിയിലേക്കു കൊണ്ടുവരപ്പെടുമെന്ന് ഏശയ്യാ പ്രവചിച്ചിരുന്നു: “എന്റെ ആലയം എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയമെന്ന് അറിയപ്പെടും.” കാനാൻകാരിയായ അമ്മ ആ വാഗ്ദാനത്തിന്റെ ആദ്യഫലമാണ്. മക്കൾക്കുള്ള അപ്പം എല്ലാവർക്കും മതിയാകും; മരുഭൂമിയിൽ ജനം മുഴുവനുംവേണ്ടി ദൈവം “ആകാശത്തിൽ നിന്ന് അപ്പം വർഷിച്ചു” (പുറ 16:4).","റോമാലേഖനത്തിൽ വിശുദ്ധ പൗലോസ് നിലവിളിക്കുന്നു: ഞാൻ എത്ര ദുർഭഗനായ മനുഷ്യൻ! മരണത്തിന്റെ ഈ ശരീരത്തിൽനിന്ന് ആര് എന്നെ മോചിപ്പിക്കും? നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിലൂടെ ദൈവത്തിനു സ്തോത്രം! (റോമാ 7:24–25). അമ്മയുടെ നിലവിളിയും പൗലോസിന്റെ നിലവിളിയും ഒന്നുതന്നെ: നമുക്കു നമ്മെത്തന്നെ രക്ഷിക്കാനാവില്ല; ക്രിസ്തുവിനാകും. നോമ്പിന്റെ പകുതിയിൽ സഭ പള്ളിയുടെ മധ്യത്തിൽ കുരിശു സ്ഥാപിക്കുന്നു: സഹായത്തിനായുള്ള ഓരോ നിലവിളിക്കുമുള്ള ഉത്തരം."],
 conn:[["എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയം.","ദേവാലയം ശുദ്ധീകരിക്കുമ്പോൾ യേശു ഉദ്ധരിച്ച ഏശയ്യാ 56:7, ഒരു കാനാൻകാരിക്കു കരുണ ലഭിക്കുമ്പോൾ നിറവേറുന്നു."],["അപ്പക്കഷണങ്ങളും സ്വർഗീയ അപ്പവും.","മന്നായും (പുറ 16) ഈ സുവിശേഷത്തിനു തൊട്ടുമുമ്പും പിമ്പുമുള്ള അപ്പം വർധിപ്പിക്കലും (മത്താ 14–15) എല്ലാ ജനതകൾക്കും നൽകപ്പെടുന്ന ദിവ്യകാരുണ്യത്തിലേക്കു ചൂണ്ടിക്കാണിക്കുന്നു."],["എബനേസർ.","“ഇതുവരെ കർത്താവു നമ്മെ സഹായിച്ചു” എന്ന സാമുവലിന്റെ കല്ല് (1 സാമു 7:12) നിരന്തരവിശ്വാസത്തിന്റെ നന്ദിനിറഞ്ഞ ഓർമയാണ്."],["അഹങ്കാരവും എളിമയും.","“അഹങ്കാരം തുടങ്ങുമ്പോൾ കർത്താവിൽനിന്ന് അകലുന്നു” (പ്രഭാ 10:12); സ്ത്രീയുടെ എളിമ സ്വർഗം തുറക്കുന്നു."]],
 altar:["മേശയിൽനിന്നുള്ള അപ്പക്കഷണങ്ങൾ മാത്രമാണ് ആ സ്ത്രീ ചോദിച്ചത്. വിശുദ്ധ കുർബാനയിൽ നമുക്കു ലഭിക്കുന്നത് അപ്പക്കഷണങ്ങളല്ല, ജീവന്റെ അപ്പം മുഴുവനുമാണ്. അവളുടെ എളിമയോടെ നമുക്കു വരാം: “കർത്താവേ, ഞാൻ യോഗ്യനല്ല.”"],
 outline:[["ആരംഭം","ദൈവം മൗനമായിരിക്കുന്നുവെന്നു തോന്നുമ്പോൾ നാം പിന്മാറുന്നുണ്ടോ?"],["ഒന്നാം ആശയം · നിരന്തരമായ പ്രാർഥന","മൗനം, നിരസനം; എന്നിട്ടും അവൾ മുട്ടുകുത്തുന്നു: “കർത്താവേ, എന്നെ സഹായിക്കണമേ.”"],["രണ്ടാം ആശയം · എളിമയുള്ള വിശ്വാസം","ചെറുതാകുന്നതു സ്വീകരിച്ച് എന്നിട്ടും അവൾ ആശ്രയിക്കുന്നു."],["മൂന്നാം ആശയം · എല്ലാ ജനതകൾക്കുംവേണ്ടി","ഏശയ്യാ 56: ദൈവഭവനം എല്ലാവർക്കുമുള്ളതാണ്; അപരിചിതനെ സ്വാഗതം ചെയ്യുക."],["നാലാം ആശയം · പകുതിയിൽ: കുരിശ്","നോമ്പിന്റെ മധ്യം: നമ്മുടെ പള്ളിയിൽ ഉയർത്തുന്ന കുരിശ്; നോമ്പുതീരുമാനങ്ങൾ നവീകരിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, എന്നെ സഹായിക്കണമേ.”"]],
 live:[["പ്രാർഥന നിർത്താതിരിക്കുക","ദൈവം മൗനമായിരുന്നുവെന്നു തോന്നിയതുകൊണ്ടു നീ ഉപേക്ഷിച്ച ഒരു പ്രാർഥന വീണ്ടും ആരംഭിക്കുക."],["മക്കൾക്കുവേണ്ടി പ്രാർഥിക്കുക","അമ്മമാരേ, അപ്പന്മാരേ: കാനാൻകാരിയായ അമ്മയെപ്പോലെ ഓരോ കുഞ്ഞിന്റെയും ആവശ്യങ്ങൾ പേരുചൊല്ലി യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരുക."],["ഒരു അപരിചിതനെ സ്വാഗതം ചെയ്യുക","മറ്റൊരു പശ്ചാത്തലത്തിൽനിന്നോ ഭാഷയിൽനിന്നോ വിശ്വാസത്തിൽനിന്നോ ഉള്ള ഒരാളോട് ഈ ആഴ്ച ദയ കാണിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","അവളെ ഓടിക്കാനല്ല, അവളുടെ വിശ്വാസം വെളിപ്പെടുത്താനാണു ക്രിസ്തു ദാനം വൈകിച്ചത്; അവളുടെ നിരന്തരത അവളെ എല്ലാ കാലങ്ങൾക്കും ഒരു മാതൃകയാക്കി (മത്തായിയെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 52)."],["മാർ അപ്രേം","മകളോടുള്ള സ്നേഹം ധൈര്യമുള്ളവളാക്കിയ, എളിമയാൽ മേശയുടെ കർത്താവിൽനിന്നു കരുണ നേടിയ അമ്മയെ അദ്ദേഹം പ്രകീർത്തിക്കുന്നു (ദിയാതെസ്സറോൻ വ്യാഖ്യാനം)."]],
 magis:[["മതബോധനഗ്രന്ഥം 2610","പ്രാർഥനയിലെ പുത്രോചിതമായ ധൈര്യം യേശു പഠിപ്പിക്കുന്നു; കാനാൻകാരിയുടെ വിശ്വാസത്തിൽ അവിടുന്നു വിസ്മയിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 2742–2745","നിരന്തരമായ പ്രാർഥന; ഇടവിടാതെ പ്രാർഥിക്കൽ."],["മതബോധനഗ്രന്ഥം 543","എല്ലാവരും രാജ്യത്തിൽ പ്രവേശിക്കാൻ വിളിക്കപ്പെട്ടിരിക്കുന്നു; ആദ്യം ഇസ്രായേലിനോട് അറിയിക്കപ്പെട്ട രാജ്യം എല്ലാ ജനതകൾക്കുംവേണ്ടിയുള്ളതാണ്."]],
 saints:[["ഈ ആഴ്ച","മാർച്ച് 3 (ബുധൻ): വലിയ നോമ്പിന്റെ മധ്യദിനം; സ്ലീബാ ഉയർത്തൽ (ഗോഗുൽത്തോ). മാർച്ച് 7: ക്ഫീഫ്തോ ഞായർ. മാർച്ച് 9: സെബാസ്തെയിലെ നാൽപതു രക്തസാക്ഷികൾ."]],
 prayer:"ദാവീദിന്റെ പുത്രനായ കർത്താവായ യേശുവേ, ഞങ്ങളിൽ കനിയണമേ. കാനാൻകാരിയായ അമ്മയുടെ എളിമയുള്ളതും നിരന്തരവുമായ വിശ്വാസം ഞങ്ങൾക്കു നൽകണമേ; ഞങ്ങളുടെ മക്കൾക്കും കുടുംബങ്ങൾക്കുംവേണ്ടിയുള്ള പ്രാർഥനകൾ കേൾക്കണമേ; അങ്ങയുടെ സഭയെ എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയമാക്കണമേ. ആമേൻ."},
 {quick:["നിരന്തരമായ പ്രാർഥന: ദൈവം മൗനമെന്നു തോന്നുമ്പോഴും ചോദിച്ചുകൊണ്ടിരിക്കുക.","എളിമയുള്ള വിശ്വാസം കരുണ നേടുന്നു: “നായ്ക്കളും അപ്പക്കഷണങ്ങൾ തിന്നുന്നുണ്ടല്ലോ.”","ദൈവഭവനം എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയമാണ്."],action:"ദൈവം മൗനമായിരുന്നുവെന്നു തോന്നിയതുകൊണ്ടു നിർത്തിയ ഒരു പ്രാർഥന വീണ്ടും ആരംഭിക്കുക.",question:"പ്രധാനപ്പെട്ട എന്തെങ്കിലും ദൈവത്തോടു ചോദിക്കുന്നതു ഞാൻ നിർത്തിക്കളഞ്ഞിട്ടുണ്ടോ?",
  special:"കനാനായിത്തോ ഞായർ, വലിയ നോമ്പിലെ നാലാം ഞായർ. നോമ്പിന്റെ മധ്യദിനവും (മാർച്ച് 3 ബുധൻ) സ്ലീബാ ഉയർത്തലും അറിയിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","വീടും വിശ്വാസവും ഉപേക്ഷിച്ചുപോയ മകനുവേണ്ടി കേരളത്തിലെ ഒരു അമ്മ ഇരുപതു വർഷം പ്രാർഥിച്ചു. എല്ലാ ഞായറാഴ്ചയും അവൾ മാതാവിന്റെ മുമ്പിൽ ഒരു മെഴുകുതിരി കത്തിച്ചു. ഒരു ഈസ്റ്ററിന് അവൻ തിരിച്ചുവന്നപ്പോൾ പറഞ്ഞു: “ആരോ പ്രാർഥിക്കുന്നുണ്ടെന്ന് എനിക്കറിയാമായിരുന്നു.” കാനാൻകാരി ഇന്നും നമ്മുടെ ഇടവകകളിൽ ജീവിക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 15:21–28.",explain:"മകൾക്കു കഠിനമായ രോഗമുണ്ടായിരുന്ന ഒരു അമ്മ, ആദ്യം യേശു ഉത്തരം നൽകാതിരുന്നിട്ടും, സഹായത്തിനായി ചോദിച്ചുകൊണ്ടിരുന്നു. അവൾ ആശ്രയിച്ചുകൊണ്ടിരുന്നതിനാൽ യേശു അവളുടെ മകളെ സുഖപ്പെടുത്തി.",intention:"മക്കളെക്കുറിച്ച് ഉത്കണ്ഠയുള്ള എല്ലാ അമ്മമാർക്കും അപ്പന്മാർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഒരു കുടുംബമായി നാം യേശുവിനോടു ചോദിച്ചുകൊണ്ടിരിക്കേണ്ടത് എന്താണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 2610","പ്രാർഥനയിലെ ധൈര്യം."],["മതബോധനഗ്രന്ഥം 2742–2745","നിരന്തരമായ പ്രാർഥന."]],
  kidsaint:["വിശുദ്ധ ജോസഫൈൻ ബക്കീത്ത","കുഞ്ഞായിരിക്കുമ്പോൾ സുഡാനിൽനിന്നു തട്ടിക്കൊണ്ടുപോയി അടിമയായി വിൽക്കപ്പെട്ട അവൾ പിന്നീട് ഇറ്റലിയിൽവച്ച് യേശുവിനെ അറിഞ്ഞു; സന്യാസിനിയായി; തന്നെ ഉപദ്രവിച്ചവരോടു ക്ഷമിച്ചു. പാഠം: എല്ലാ ജനതകളിൽനിന്നുമുള്ള എല്ലാവർക്കുംവേണ്ടിയാണു ദൈവസ്നേഹം."],
  term:["കനാനായിത്തോ ഞായർ","“കനാനായിത്തോ” എന്നതിന്റെ അർഥം “കാനാൻകാരി” എന്നാണ്. വലിയ നോമ്പിലെ നാലാം ഞായറാഴ്ച അവളുടെ മകളുടെ സൗഖ്യം വായിക്കുന്നു (മത്താ 15:21–28; മർക്കോ 7:24–30)."],
  termMore:["നോമ്പിന്റെ മധ്യം","ഈ ഞായറിനുശേഷമുള്ള ബുധനാഴ്ച, നോമ്പിന്റെ ഇരുപത്തഞ്ചാം ദിവസം, മലങ്കരസഭ വലിയ നോമ്പിന്റെ മധ്യം ആചരിക്കുന്നു; മരുഭൂമിയിൽ ഉയർത്തപ്പെട്ട പിച്ചളസർപ്പത്തെ (സംഖ്യ 21:9; യോഹ 3:14) അനുസ്മരിപ്പിച്ചുകൊണ്ട് സ്ലീബാ (ഗോഗുൽത്തോ) പള്ളിയിൽ ആഘോഷമായി ഉയർത്തുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്ന് ഒരു അമ്മ യേശുവിന്റെ അടുത്തേക്കു വരുന്നു. അവൾ അവിടുത്തെ ജനത്തിൽപ്പെട്ടവളല്ല; ഒരു കാനാൻകാരി, പരദേശി. അവളുടെ മകൾ കഠിനമായി കഷ്ടപ്പെടുന്നു. അവൾ നിലവിളിക്കുന്നു: “കർത്താവേ, ദാവീദിന്റെ പുത്രാ, എന്നിൽ കനിയണമേ!” യേശു അവളോട് ഒരു വാക്കുപോലും ഉത്തരം പറയുന്നില്ല.","നിങ്ങൾക്ക് എപ്പോഴെങ്കിലും അങ്ങനെ തോന്നിയിട്ടുണ്ടോ? നിങ്ങൾ പ്രാർഥിച്ചുകൊണ്ടേയിരിക്കുന്നു; സ്വർഗം മൗനമാണെന്നു തോന്നുന്നു. ശിഷ്യന്മാർപോലും അവളെ പറഞ്ഞയയ്ക്കാൻ ആഗ്രഹിക്കുന്നു. താൻ ആദ്യം ഇസ്രായേലിലേക്കാണ് അയയ്ക്കപ്പെട്ടതെന്ന് യേശു പറയുന്നു. പക്ഷേ അവൾ പിന്മാറുന്നില്ല. മുട്ടുകുത്തി മൂന്നു ലളിതമായ വാക്കുകൾ പറയുന്നു: “കർത്താവേ, എന്നെ സഹായിക്കണമേ.” മക്കളുടെ അപ്പത്തെപ്പറ്റി യേശു പറയുമ്പോൾ അദ്ഭുതകരമായ എളിമയോടെ അവൾ ഉത്തരം നൽകുന്നു: “അതേ, കർത്താവേ, നായ്ക്കളും യജമാനന്മാരുടെ മേശയിൽ നിന്നു വീഴുന്ന അപ്പക്കഷണങ്ങൾ തിന്നുന്നുണ്ടല്ലോ.”","യേശു വിസ്മയിക്കുന്നു: “സ്ത്രീയേ, നിന്റെ വിശ്വാസം വലുതാണ്. നീ ആഗ്രഹിക്കുന്നതുപോലെ നിനക്കു ഭവിക്കട്ടെ.” അവിടുത്തെ മൗനം ഒരു നിരസനമായിരുന്നില്ല. വിശ്വാസത്തിന്റെ ഒരു വിദ്യാലയമായിരുന്നു; അവൾ ഉന്നതവിജയം നേടി. ദൈവഭവനം എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയമായിരിക്കുമെന്ന് ഏശയ്യാ പറഞ്ഞിരുന്നു. ആരും ദൈവകരുണയ്ക്കു പുറത്തല്ലെന്ന് ഈ പരദേശിയായ അമ്മ നമുക്കു കാണിച്ചുതരുന്നു.","ഈ ബുധനാഴ്ച നാം നോമ്പിന്റെ മധ്യത്തിലെത്തുന്നു; നമ്മുടെ പള്ളിയിൽ സ്ലീബാ ഉയർത്തപ്പെടുന്നു. ദൈവം മൗനമാണെന്നു തോന്നുമ്പോൾ അതിലേക്കു നോക്കുക. വിശുദ്ധ പൗലോസ് നിലവിളിക്കുന്നു: ആര് എന്നെ മോചിപ്പിക്കും? നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിലൂടെ ദൈവത്തിനു സ്തോത്രം! അമ്മമാരേ, അപ്പന്മാരേ, നിങ്ങളുടെ മക്കൾക്കുവേണ്ടി പ്രാർഥിച്ചുകൊണ്ടിരിക്കുക. പിന്മാറരുത്. അവളോടൊപ്പം പറയുക: “കർത്താവേ, എന്നെ സഹായിക്കണമേ.” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, മകൾക്കു വലിയ രോഗമുണ്ടായിരുന്നതുകൊണ്ട് ഒരു അമ്മ യേശുവിന്റെ അടുത്തുവന്നു. അവൾ വീണ്ടും വീണ്ടും ചോദിച്ചു: “യേശുവേ, ദയവായി സഹായിക്കണമേ!” ആദ്യം യേശു ഉത്തരം നൽകിയില്ല.","പക്ഷേ അവൾ ആശ്രയിച്ചുകൊണ്ടും ചോദിച്ചുകൊണ്ടുമിരുന്നു. യേശു പറഞ്ഞു: “നിന്റെ വിശ്വാസം വലുതാണ്!” അവളുടെ മകൾ സുഖപ്പെട്ടു.","പ്രാർഥിച്ചിട്ടും ഒന്നും സംഭവിക്കുന്നില്ലെന്നു തോന്നുമ്പോൾ നിർത്തരുത്! യേശു കേൾക്കുന്നുണ്ട്. നമുക്കു പറയാം: “യേശുവേ, എന്നെ സഹായിക്കണമേ!”"]});

 verse:"Woman, you are set free from your ailment.",cite:"Luke 13:12",
 theo:["In a synagogue on the sabbath there is a woman who “had a spirit that had crippled her for eighteen years. She was bent over and was quite unable to stand up straight.” For eighteen years she has looked only at the ground. Jesus sees her, calls her, and says: “Woman, you are set free from your ailment.” He lays his hands on her, “and immediately she stood up straight and began praising God.”","The leader of the synagogue is indignant: healing is work, and work is forbidden on the sabbath. Jesus answers: you untie your ox and donkey on the sabbath to give them water; “ought not this woman, a daughter of Abraham whom Satan bound for eighteen long years, be set free from this bondage on the sabbath day?” The sabbath is the day of God's rest, and God's rest is our freedom.","Many of us are bent: by guilt, by worry, by addiction, by years of carrying burdens alone, by sins we have stopped noticing. We get used to looking at the ground. The Fast is the time when Jesus calls us, lays his hands on us, and lets us stand straight again and look up to God.","The evening Gospel, the Good Samaritan, shows us how to be Christ's hands for others: “moved with pity”, he bound up the wounded man's wounds. St Paul says: “present your bodies as a living sacrifice… Do not be conformed to this world, but be transformed by the renewing of your minds… Rejoice with those who rejoice, weep with those who weep.” Healed ourselves, we become healers: “Go and do likewise.”"],
 conn:[["A daughter of Abraham.","Jesus restores her dignity: not just a patient, but a daughter of the covenant, like Zacchaeus, “a son of Abraham” (Luke 19:9)."],["The Good Samaritan.","The Fathers saw Christ himself in the Samaritan: he came down to wounded humanity, poured oil and wine, and brought us to the inn of the Church."],["The opened ear.","Isaiah 50:4–5: “Morning by morning he wakens my ear”; the servant of the Lord listens and does not turn back."],["Blessing for evil.","1 Peter 3:9: “Do not repay evil for evil… but, on the contrary, repay with a blessing.”"]],
 altar:["At every Holy Qurbono the Good Samaritan pours the oil and wine of his grace into our wounds. We leave the altar standing straighter, called to bend down to the wounded on our road."],
 outline:[["Opening","Eighteen years looking at the ground: what bends us?"],["Point 1 · Jesus sees and calls","He notices the one no one notices."],["Point 2 · Set free on the sabbath","God's rest is our freedom; Sunday as a day of healing."],["Point 3 · Stand up and praise","Healing leads to worship."],["Point 4 · Go and do likewise","The Good Samaritan: be Christ's hands for the wounded."],["Take-home line","“You are set free.”"]],
 live:[["Name what bends you","Bring one burden or habit to Jesus in Confession or prayer this week."],["Be a Samaritan (Luke 10:37)","Stop for one person in need you would usually pass by."],["Make Sunday a day of rest and healing","Keep Sunday for God, family and works of mercy."]],
 fathers:[["St Augustine","The Samaritan is our Lord, who became our neighbour; he bound our wounds, set us on his own beast, and brought us to the inn, the Church, until he returns (Sermon 171; On Christian Doctrine I)."],["St Ambrose of Milan","The bent woman is an image of the soul bowed down to earthly things; Christ's hand raises it to look to heaven (Exposition of the Gospel of Luke 7)."]],
 magis:[["Catechism 2172–2173","The sabbath is a day of freedom from work and for the works of mercy; Jesus healed on the sabbath to show this."],["Catechism 1825, 2447","Love of neighbour and the works of mercy, spiritual and corporal."],["Fratelli Tutti 56–86","Pope Francis on the Good Samaritan: we are all called to stop and bend down to the wounded."]],
 saints:[["This week (fixed dates)","9 Mar: the Forty Martyrs of Sebaste. 14 Mar: Samio Sunday."]],
 prayer:"Lord Jesus, you saw the bent woman, called her, and set her free. Lay your hands on us in this Fast: lift what bends us down, let us stand straight and praise you, and make us Good Samaritans for the wounded on our road. Amen."},
 {quick:["Jesus sees the bent woman and sets her free.","God's sabbath rest is our freedom and healing.","Healed ourselves, we become Good Samaritans."],action:"Stop for one person in need you would usually pass by.",question:"What has bent me down, and do I let Jesus lift me up?",
  special:"K'piphtho Sunday, fifth Sunday of the Great Fast.",
  illus:["An illustration","An old woman in a Kerala village had walked bent for years with a back problem. After an operation she stood straight and said with tears: “I can see the sky again.” Sin and sorrow can bend the soul in the same way."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 13:10–13.",explain:"A woman could not stand up straight for eighteen years. Jesus touched her, and she stood up straight and praised God!",intention:"We pray for people who carry heavy burdens and for all who are sick.",ask:"Ask: “Whom can we help this week, like the Good Samaritan?”"},
  catechism:[["CCC 2172–2173","The sabbath and works of mercy."],["CCC 2447","Works of mercy."]],
  kidsaint:["The Forty Martyrs of Sebaste (9 Mar)","Forty Christian soldiers in Armenia who were made to stand on a frozen lake because they would not give up Jesus. They encouraged one another and stayed faithful together. Lesson: help your friends stay faithful."],
  term:["K'piphtho Sunday","K'piphtho means “the bent (crippled) woman”. The fifth Sunday of the Great Fast reads her healing (Luke 13:10–17)."],
  termMore:["The Good Samaritan","The Syriac and Greek Fathers read the parable as the story of salvation: humanity wounded on the road, Christ the Samaritan, the oil and wine of the sacraments, the inn of the Church."]},
 {homily:["Dear brothers and sisters, today Jesus sees a woman in the synagogue who has been bent over for eighteen years. For eighteen years she has looked only at the ground. Jesus calls her and says: “Woman, you are set free from your ailment.” He lays his hands on her, and immediately she stands up straight and praises God.","The leader of the synagogue is angry: healing is work, and the sabbath is for rest. Jesus replies: you untie your ox and your donkey on the sabbath to lead them to water. Should not this daughter of Abraham, bound for eighteen years, be set free on the sabbath? God's day is the day of freedom.","Many of us are bent in some way: by guilt, by worry, by an addiction, by grief, by carrying everything alone. We get used to looking at the ground. In this Fast Jesus calls us by name, lays his hands on us in Confession and in the Holy Qurbono, and says: stand up, look up, you are free.","And the evening Gospel tells us what to do once we are healed. The Good Samaritan saw a wounded man, was moved with pity, and bound up his wounds. Jesus says: “Go and do likewise.” This week, stop for someone you would usually pass by. Let us be healed, and become healers. Amen."],
  kids:["Children, try bending over and looking only at the floor. Not nice, is it? A woman in the Bible had to walk like that for eighteen years!","Jesus saw her, called her, and touched her. And she stood up straight and praised God!","Jesus also told a story about a man who stopped to help someone hurt on the road. Let's help others too. Let's say: “Jesus, help me to help others!”"]});

put("2027-03-07","ml",{title:"ക്ഫീഫ്തോ ഞായർ · കൂനുള്ള സ്ത്രീയുടെ സൗഖ്യം",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 10:25–37","നല്ല സമരിയാക്കാരൻ"],[ML.ot,"ഉൽപത്തി 9:1–7","നോഹയ്ക്കുള്ള ദൈവാനുഗ്രഹം"],[ML.ot,"പ്രഭാഷകൻ 51:1–10","കർത്താവും രാജാവുമായവനേ, അങ്ങേക്കു ഞാൻ നന്ദി പറയുന്നു"],[ML.ot,"ജറെമിയാ 51:1–9","ബാബിലോണിന്റെ പതനം"],[ML.ot,"ഏശയ്യാ 50:1–5","കർത്താവ് എന്റെ കാതുകൾ തുറന്നു"],[ML.ce,"1 പത്രോസ് 3:8–17","തിന്മയ്ക്ക് അനുഗ്രഹംകൊണ്ടു പകരം നൽകുക"],[ML.pa,"റോമാ 12:1–15","ജീവനുള്ള ബലി"],[ML.go,"ലൂക്കാ 13:10–17","സ്ത്രീയേ, നീ മോചിക്കപ്പെട്ടിരിക്കുന്നു"]],
 alt:"വലിയ നോമ്പിലെ അഞ്ചാം ഞായർ.",
 verse:"സ്ത്രീയേ, നിന്റെ രോഗത്തിൽനിന്നു നീ മോചിക്കപ്പെട്ടിരിക്കുന്നു.",cite:"ലൂക്കാ 13:12",
 theo:["ഒരു സാബത്തുദിവസം സിനഗോഗിൽ “പതിനെട്ടു വർഷമായി ഒരു ആത്മാവു ബാധിച്ച് രോഗിണിയായി നിവർന്നു നിൽക്കാൻ സാധിക്കാത്തവിധം കൂനിപ്പോയ ഒരുവൾ” ഉണ്ടായിരുന്നു. പതിനെട്ടു വർഷം അവൾ നിലത്തേക്കു മാത്രമാണു നോക്കിയത്. യേശു അവളെ കണ്ട്, അടുത്തുവിളിച്ച്, പറയുന്നു: “സ്ത്രീയേ, നിന്റെ രോഗത്തിൽനിന്നു നീ മോചിക്കപ്പെട്ടിരിക്കുന്നു.” “അവൻ അവളുടെമേൽ കൈകൾവച്ചു. തത്ക്ഷണം അവൾ നിവർന്നുനിൽക്കുകയും ദൈവത്തെ സ്തുതിക്കുകയും ചെയ്തു.”","സിനഗോഗധികാരി കോപിക്കുന്നു: സുഖപ്പെടുത്തൽ ജോലിയാണ്; സാബത്തിൽ ജോലി നിരോധിക്കപ്പെട്ടിരിക്കുന്നു. യേശു ഉത്തരം നൽകുന്നു: സാബത്തിൽ നിങ്ങൾ കാളയെയും കഴുതയെയും അഴിച്ചു വെള്ളം കുടിപ്പിക്കുന്നില്ലേ? “പതിനെട്ടുവർഷം സാത്താൻ ബന്ധിച്ചിട്ടിരുന്നവളായ അബ്രാഹത്തിന്റെ ഈ മകളെ സാബത്തു ദിവസം അഴിച്ചുവിടേണ്ടതില്ലെന്നോ?” സാബത്തു ദൈവത്തിന്റെ വിശ്രമദിനമാണ്; ദൈവത്തിന്റെ വിശ്രമം നമ്മുടെ സ്വാതന്ത്ര്യമാണ്.","നമ്മിൽ പലരും കൂനിപ്പോയവരാണ്: കുറ്റബോധത്താൽ, ഉത്കണ്ഠയാൽ, ആസക്തിയാൽ, വർഷങ്ങളോളം ഭാരങ്ങൾ ഒറ്റയ്ക്കു വഹിച്ചതിനാൽ, ശ്രദ്ധിക്കാതായ പാപങ്ങളാൽ. നിലത്തേക്കു മാത്രം നോക്കാൻ നാം ശീലിച്ചുപോകുന്നു. യേശു നമ്മെ വിളിച്ച്, നമ്മുടെമേൽ കൈകൾവച്ച്, വീണ്ടും നിവർന്നുനിന്നു ദൈവത്തിലേക്കു നോക്കാൻ നമ്മെ അനുവദിക്കുന്ന കാലമാണു നോമ്പ്.","മറ്റുള്ളവർക്കായി ക്രിസ്തുവിന്റെ കരങ്ങളാകുന്നതെങ്ങനെയെന്നു സന്ധ്യാസുവിശേഷമായ നല്ല സമരിയാക്കാരന്റെ ഉപമ കാണിക്കുന്നു: “അവനെക്കണ്ട് മനസ്സലിഞ്ഞ്” അവൻ മുറിവേറ്റവന്റെ മുറിവുകൾ വച്ചുകെട്ടി. വിശുദ്ധ പൗലോസ് പറയുന്നു: നിങ്ങളുടെ ശരീരങ്ങളെ വിശുദ്ധവും ദൈവത്തിനു സ്വീകാര്യവുമായ ജീവനുള്ള ബലിയായി സമർപ്പിക്കുവിൻ… ഈ ലോകത്തിന് അനുരൂപരാകാതെ മനസ്സിന്റെ നവീകരണത്താൽ രൂപാന്തരപ്പെടുവിൻ… സന്തോഷിക്കുന്നവരോടുകൂടെ സന്തോഷിക്കുവിൻ; കരയുന്നവരോടുകൂടെ കരയുവിൻ (റോമാ 12:1–2, 15). സുഖപ്പെട്ട നാം സുഖപ്പെടുത്തുന്നവരാകുന്നു: “നീയും പോയി അതുപോലെ ചെയ്യുക.”"],
 conn:[["അബ്രാഹത്തിന്റെ മകൾ.","യേശു അവളുടെ അന്തസ്സു വീണ്ടെടുക്കുന്നു: ഒരു രോഗിണി മാത്രമല്ല, “അബ്രാഹത്തിന്റെ പുത്രനായ” സക്കേവൂസിനെപ്പോലെ (ലൂക്കാ 19:9) ഉടമ്പടിയുടെ ഒരു മകൾ."],["നല്ല സമരിയാക്കാരൻ.","സമരിയാക്കാരനിൽ പിതാക്കന്മാർ ക്രിസ്തുവിനെത്തന്നെ കണ്ടു: മുറിവേറ്റ മനുഷ്യവംശത്തിലേക്ക് അവിടുന്ന് ഇറങ്ങിവന്നു, എണ്ണയും വീഞ്ഞും ഒഴിച്ചു, നമ്മെ സഭയാകുന്ന സത്രത്തിലേക്കു കൊണ്ടുവന്നു."],["തുറക്കപ്പെട്ട കാത്.","ഏശയ്യാ 50:4–5: “പ്രഭാതം തോറും അവിടുന്ന് എന്റെ കാതുകളെ ശിഷ്യനെയെന്നപോലെ ഉണർത്തുന്നു”; കർത്താവിന്റെ ദാസൻ ശ്രവിക്കുന്നു, പിന്മാറുന്നില്ല."],["തിന്മയ്ക്ക് അനുഗ്രഹം.","1 പത്രോസ് 3:9: തിന്മയ്ക്കു തിന്മ പകരം നൽകാതെ, അനുഗ്രഹംകൊണ്ടു പകരം നൽകുവിൻ."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയിലും നല്ല സമരിയാക്കാരൻ തന്റെ കൃപയുടെ എണ്ണയും വീഞ്ഞും നമ്മുടെ മുറിവുകളിൽ ഒഴിക്കുന്നു. കൂടുതൽ നിവർന്നു നാം ബലിപീഠം വിടുന്നു; നമ്മുടെ വഴിയിലെ മുറിവേറ്റവരിലേക്കു കുനിയാൻ വിളിക്കപ്പെട്ട്."],
 outline:[["ആരംഭം","പതിനെട്ടു വർഷം നിലത്തേക്കു നോക്കി: എന്താണു നമ്മെ കൂനിക്കുന്നത്?"],["ഒന്നാം ആശയം · യേശു കാണുന്നു, വിളിക്കുന്നു","ആരും ശ്രദ്ധിക്കാത്തവളെ അവിടുന്നു ശ്രദ്ധിക്കുന്നു."],["രണ്ടാം ആശയം · സാബത്തിൽ മോചനം","ദൈവത്തിന്റെ വിശ്രമം നമ്മുടെ സ്വാതന്ത്ര്യമാണ്; സൗഖ്യത്തിന്റെ ദിനമായ ഞായർ."],["മൂന്നാം ആശയം · നിവർന്നുനിന്നു സ്തുതിക്കുക","സൗഖ്യം ആരാധനയിലേക്കു നയിക്കുന്നു."],["നാലാം ആശയം · പോയി അതുപോലെ ചെയ്യുക","നല്ല സമരിയാക്കാരൻ: മുറിവേറ്റവർക്കു ക്രിസ്തുവിന്റെ കരങ്ങളാകുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“നീ മോചിക്കപ്പെട്ടിരിക്കുന്നു.”"]],
 live:[["നിന്നെ കൂനിക്കുന്നതിനു പേരു പറയുക","ഈ ആഴ്ച ഒരു ഭാരമോ ശീലമോ കുമ്പസാരത്തിലോ പ്രാർഥനയിലോ യേശുവിന്റെ അടുത്തു കൊണ്ടുവരുക."],["ഒരു സമരിയാക്കാരനാകുക (ലൂക്കാ 10:37)","സാധാരണ കടന്നുപോകുന്ന, ആവശ്യത്തിലിരിക്കുന്ന ഒരാൾക്കുവേണ്ടി നിൽക്കുക."],["ഞായറിനെ വിശ്രമത്തിന്റെയും സൗഖ്യത്തിന്റെയും ദിനമാക്കുക","ഞായറാഴ്ച ദൈവത്തിനും കുടുംബത്തിനും കാരുണ്യപ്രവൃത്തികൾക്കുമായി മാറ്റിവയ്ക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","നമ്മുടെ അയൽക്കാരനായിത്തീർന്ന നമ്മുടെ കർത്താവാണു സമരിയാക്കാരൻ; അവിടുന്നു നമ്മുടെ മുറിവുകൾ വച്ചുകെട്ടി, തന്റെ സ്വന്തം മൃഗത്തിന്മേൽ കയറ്റി, അവിടുന്നു മടങ്ങിവരുന്നതുവരെ സഭയാകുന്ന സത്രത്തിലേക്കു കൊണ്ടുവന്നു (പ്രസംഗം 171; ക്രൈസ്തവപ്രബോധനം I)."],["മിലാനിലെ വിശുദ്ധ അംബ്രോസ്","ഭൗമികകാര്യങ്ങളിലേക്കു കുനിഞ്ഞുപോയ ആത്മാവിന്റെ പ്രതീകമാണു കൂനുള്ള സ്ത്രീ; ക്രിസ്തുവിന്റെ കരം സ്വർഗത്തിലേക്കു നോക്കാൻ അതിനെ ഉയർത്തുന്നു (ലൂക്കാസുവിശേഷവ്യാഖ്യാനം 7)."]],
 magis:[["മതബോധനഗ്രന്ഥം 2172–2173","ജോലിയിൽനിന്നുള്ള സ്വാതന്ത്ര്യത്തിനും കാരുണ്യപ്രവൃത്തികൾക്കുമുള്ള ദിനമാണു സാബത്ത്; അതു കാണിക്കാനാണ് യേശു സാബത്തിൽ സുഖപ്പെടുത്തിയത്."],["മതബോധനഗ്രന്ഥം 1825, 2447","അയൽക്കാരനോടുള്ള സ്നേഹവും ആത്മീയവും ശാരീരികവുമായ കാരുണ്യപ്രവൃത്തികളും."],["എല്ലാവരും സഹോദരർ (ഫ്രത്തേല്ലി തൂത്തി) 56–86","നല്ല സമരിയാക്കാരനെപ്പറ്റി ഫ്രാൻസിസ് മാർപാപ്പ: മുറിവേറ്റവരുടെ അടുത്തു നിൽക്കാനും കുനിയാനും നാമെല്ലാവരും വിളിക്കപ്പെട്ടിരിക്കുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","മാർച്ച് 9: സെബാസ്തെയിലെ നാൽപതു രക്തസാക്ഷികൾ. മാർച്ച് 14: സമിയോ ഞായർ."]],
 prayer:"കർത്താവായ യേശുവേ, കൂനുള്ള സ്ത്രീയെ അങ്ങു കണ്ടു, വിളിച്ചു, മോചിപ്പിച്ചു. ഈ നോമ്പിൽ ഞങ്ങളുടെമേൽ അങ്ങയുടെ കൈകൾ വയ്ക്കണമേ: ഞങ്ങളെ കൂനിക്കുന്നവയിൽനിന്നു ഞങ്ങളെ ഉയർത്തണമേ; നിവർന്നുനിന്ന് അങ്ങയെ സ്തുതിക്കാൻ ഇടയാക്കണമേ; ഞങ്ങളുടെ വഴിയിലെ മുറിവേറ്റവർക്കു നല്ല സമരിയാക്കാരാക്കണമേ. ആമേൻ."},
 {quick:["യേശു കൂനുള്ള സ്ത്രീയെ കണ്ട് അവളെ മോചിപ്പിക്കുന്നു.","ദൈവത്തിന്റെ സാബത്തുവിശ്രമം നമ്മുടെ സ്വാതന്ത്ര്യവും സൗഖ്യവുമാണ്.","സുഖപ്പെട്ട നാം നല്ല സമരിയാക്കാരാകുന്നു."],action:"സാധാരണ കടന്നുപോകുന്ന, ആവശ്യത്തിലിരിക്കുന്ന ഒരാൾക്കുവേണ്ടി നിൽക്കുക.",question:"എന്താണ് എന്നെ കൂനിച്ചിരിക്കുന്നത്? എന്നെ ഉയർത്താൻ ഞാൻ യേശുവിനെ അനുവദിക്കുന്നുണ്ടോ?",
  special:"ക്ഫീഫ്തോ ഞായർ, വലിയ നോമ്പിലെ അഞ്ചാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഒരു ഗ്രാമത്തിലെ ഒരു വൃദ്ധ നടുവിന്റെ പ്രശ്നം കാരണം വർഷങ്ങളോളം കൂനിയാണു നടന്നത്. ഒരു ശസ്ത്രക്രിയയ്ക്കുശേഷം നിവർന്നുനിന്ന് അവൾ കണ്ണീരോടെ പറഞ്ഞു: “എനിക്കു വീണ്ടും ആകാശം കാണാം.” പാപവും ദുഃഖവും ആത്മാവിനെ അതുപോലെ കൂനിക്കും."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 13:10–13.",explain:"പതിനെട്ടു വർഷം ഒരു സ്ത്രീക്കു നിവർന്നുനിൽക്കാനായില്ല. യേശു അവളെ തൊട്ടു; അവൾ നിവർന്നുനിന്നു ദൈവത്തെ സ്തുതിച്ചു!",intention:"കനത്ത ഭാരങ്ങൾ വഹിക്കുന്നവർക്കും എല്ലാ രോഗികൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നല്ല സമരിയാക്കാരനെപ്പോലെ ഈ ആഴ്ച നമുക്ക് ആരെ സഹായിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 2172–2173","സാബത്തും കാരുണ്യപ്രവൃത്തികളും."],["മതബോധനഗ്രന്ഥം 2447","കാരുണ്യപ്രവൃത്തികൾ."]],
  kidsaint:["സെബാസ്തെയിലെ നാൽപതു രക്തസാക്ഷികൾ (മാർച്ച് 9)","യേശുവിനെ ഉപേക്ഷിക്കാത്തതുകൊണ്ട് തണുത്തുറഞ്ഞ ഒരു തടാകത്തിൽ നിർത്തപ്പെട്ട അർമേനിയയിലെ നാൽപതു ക്രൈസ്തവപടയാളികൾ. അവർ പരസ്പരം ധൈര്യപ്പെടുത്തി ഒന്നിച്ചു വിശ്വസ്തരായി നിന്നു. പാഠം: വിശ്വസ്തരായിരിക്കാൻ നിന്റെ കൂട്ടുകാരെ സഹായിക്കുക."],
  term:["ക്ഫീഫ്തോ ഞായർ","“ക്ഫീഫ്തോ” എന്നതിന്റെ അർഥം “കൂനുള്ള സ്ത്രീ” എന്നാണ്. വലിയ നോമ്പിലെ അഞ്ചാം ഞായറാഴ്ച അവളുടെ സൗഖ്യം വായിക്കുന്നു (ലൂക്കാ 13:10–17)."],
  termMore:["നല്ല സമരിയാക്കാരൻ","സുറിയാനി, ഗ്രീക്ക് പിതാക്കന്മാർ ഈ ഉപമയെ രക്ഷയുടെ കഥയായി വായിച്ചു: വഴിയിൽ മുറിവേറ്റ മനുഷ്യവംശം, സമരിയാക്കാരനായ ക്രിസ്തു, കൂദാശകളുടെ എണ്ണയും വീഞ്ഞും, സഭയാകുന്ന സത്രം."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, പതിനെട്ടു വർഷമായി കൂനിപ്പോയ ഒരു സ്ത്രീയെ ഇന്നു യേശു സിനഗോഗിൽ കാണുന്നു. പതിനെട്ടു വർഷം അവൾ നിലത്തേക്കു മാത്രം നോക്കി. യേശു അവളെ വിളിച്ചു പറയുന്നു: “സ്ത്രീയേ, നിന്റെ രോഗത്തിൽനിന്നു നീ മോചിക്കപ്പെട്ടിരിക്കുന്നു.” അവിടുന്ന് അവളുടെമേൽ കൈകൾ വയ്ക്കുന്നു; തത്ക്ഷണം അവൾ നിവർന്നുനിന്നു ദൈവത്തെ സ്തുതിക്കുന്നു.","സിനഗോഗധികാരി കോപിക്കുന്നു: സുഖപ്പെടുത്തൽ ജോലിയാണ്; സാബത്തു വിശ്രമത്തിനുള്ളതാണ്. യേശു മറുപടി പറയുന്നു: സാബത്തിൽ നിങ്ങൾ കാളയെയും കഴുതയെയും അഴിച്ചു വെള്ളം കുടിക്കാൻ കൊണ്ടുപോകുന്നു. പതിനെട്ടു വർഷം ബന്ധിക്കപ്പെട്ടിരുന്ന അബ്രാഹത്തിന്റെ ഈ മകളെ സാബത്തിൽ മോചിപ്പിക്കേണ്ടതല്ലേ? ദൈവത്തിന്റെ ദിവസം സ്വാതന്ത്ര്യത്തിന്റെ ദിവസമാണ്.","നമ്മിൽ പലരും ഏതെങ്കിലും വിധത്തിൽ കൂനിപ്പോയവരാണ്: കുറ്റബോധത്താൽ, ഉത്കണ്ഠയാൽ, ഒരു ആസക്തിയാൽ, ദുഃഖത്താൽ, എല്ലാം ഒറ്റയ്ക്കു വഹിക്കുന്നതിനാൽ. നിലത്തേക്കു നോക്കാൻ നാം ശീലിച്ചുപോകുന്നു. ഈ നോമ്പിൽ യേശു നമ്മെ പേരുചൊല്ലി വിളിക്കുന്നു; കുമ്പസാരത്തിലും വിശുദ്ധ കുർബാനയിലും നമ്മുടെമേൽ കൈകൾ വയ്ക്കുന്നു; പറയുന്നു: എഴുന്നേൽക്കുക, മുകളിലേക്കു നോക്കുക, നീ സ്വതന്ത്രനാണ്.","സുഖപ്പെട്ടശേഷം എന്തു ചെയ്യണമെന്നു സന്ധ്യാസുവിശേഷം പറയുന്നു. നല്ല സമരിയാക്കാരൻ മുറിവേറ്റ ഒരാളെ കണ്ടു, മനസ്സലിഞ്ഞു, അവന്റെ മുറിവുകൾ വച്ചുകെട്ടി. യേശു പറയുന്നു: “നീയും പോയി അതുപോലെ ചെയ്യുക.” ഈ ആഴ്ച നീ സാധാരണ കടന്നുപോകുന്ന ഒരാൾക്കുവേണ്ടി നിൽക്കുക. നമുക്കു സുഖപ്പെടാം; സുഖപ്പെടുത്തുന്നവരാകാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, കുനിഞ്ഞുനിന്നു നിലത്തേക്കു മാത്രം നോക്കി നോക്കൂ. അതു നല്ലതല്ല, അല്ലേ? ബൈബിളിലെ ഒരു സ്ത്രീക്കു പതിനെട്ടു വർഷം അങ്ങനെ നടക്കേണ്ടിവന്നു!","യേശു അവളെ കണ്ടു, വിളിച്ചു, തൊട്ടു. അവൾ നിവർന്നുനിന്നു ദൈവത്തെ സ്തുതിച്ചു!","വഴിയിൽ മുറിവേറ്റുകിടന്ന ഒരാളെ സഹായിക്കാൻ നിന്ന ഒരു മനുഷ്യന്റെ കഥയും യേശു പറഞ്ഞു. നമുക്കും മറ്റുള്ളവരെ സഹായിക്കാം. നമുക്കു പറയാം: “യേശുവേ, മറ്റുള്ളവരെ സഹായിക്കാൻ എന്നെ സഹായിക്കണമേ!”"]});

/* ================= SAMIO SUNDAY · 14 March 2027 ================= */
put("2027-03-14","en",{title:"Samio Sunday · The Healing of the Blind",readTitle:EN.rt,
 readings:[[EN.eg,"John 9:1–41","The man born blind"],[EN.ot,"Deuteronomy 25:13–19","Honest weights and measures"],[EN.ot,"Job 42:1–9","Now my eye sees you"],[EN.ot,"1 Kings 3:4–15","Solomon asks for an understanding mind"],[EN.ot,"Jeremiah 51:10–19","The Lord made the earth by his power"],[EN.ce,"1 Peter 4:12–19","Sharing Christ's sufferings"],[EN.pa,"Romans 14:10–23","Do not judge your brother"],[EN.go,"Mark 10:46–52 (printed as Mk 9:46–52)","Blind Bartimaeus"]],
 alt:"Sixth Sunday of the Great Fast. The lectionary prints the Gospel as “Mk 9:46–52”; the healing of the blind man at Jericho is Mark 10:46–52. The Fortieth Day of the Fast is Friday 19 March; Lazarus Saturday is 20 March; Hosanna Sunday is 21 March: remind the faithful to bring palm leaves and flowers.",
 verse:"One thing I do know, that though I was blind, now I see.",cite:"John 9:25",
 theo:["On the last Sunday before Holy Week the Church reads two healings of the blind. In John, Jesus meets a man blind from birth. The disciples ask whose sin caused it. Jesus answers: “Neither this man nor his parents sinned; he was born blind so that God's works might be revealed in him… As long as I am in the world, I am the light of the world.” He makes mud, anoints the man's eyes, and sends him: “Go, wash in the pool of Siloam (which means Sent).”","The healed man is questioned again and again by the Pharisees. He does not know all the theology, but he knows one thing: “Though I was blind, now I see.” Step by step his sight grows: first “the man called Jesus”, then “a prophet”, then, kneeling before him, “Lord, I believe.” Meanwhile those who claim to see become blind. Jesus says: “I came into this world for judgment so that those who do not see may see, and those who do see may become blind.”","In Mark, blind Bartimaeus sits by the road at Jericho and cries out: “Jesus, Son of David, have mercy on me!” People tell him to be quiet; he cries out louder. Jesus asks: “What do you want me to do for you?” “My teacher, let me see again.” “Go; your faith has made you well.” And Bartimaeus “followed him on the way”, the way to Jerusalem and the Cross.","Job, after all his suffering, says: “I had heard of you by the hearing of the ear, but now my eye sees you.” This is the goal of the Fast: not only to hear about God, but to see him with the eyes of faith. In Baptism, called “enlightenment” by the Fathers, we were washed and given sight. As Holy Week begins, let us ask with Bartimaeus: “Lord, let me see,” and then follow Jesus on the way."],
 conn:[["Siloam, “Sent”.","The man washes in the pool called Sent, and Jesus is the One sent by the Father: the Fathers saw here an image of Baptism, the washing that gives sight."],["Clay and anointing.","Jesus makes clay as God formed Adam from the earth (Genesis 2:7): a new creation."],["Solomon's prayer.","Solomon asked for an understanding mind (1 Kings 3:9); true sight is wisdom from God."],["Following on the way.","Bartimaeus follows Jesus “on the way” to Jerusalem (Mark 10:52): healed disciples walk with him to the Cross."]],
 altar:["The Fathers called Baptism “illumination” and the Eucharist the food of those who see. At the Holy Qurbono we pray with Bartimaeus: “Have mercy on us”, and we receive the Light of the world."],
 outline:[["Opening","What is the worst kind of blindness?"],["Point 1 · Light of the world","Jesus opens eyes: new creation, Siloam, Baptism."],["Point 2 · Growing sight","From “a man called Jesus” to “Lord, I believe”."],["Point 3 · Those who think they see","Pride blinds: the Pharisees."],["Point 4 · Follow on the way","Bartimaeus: cry out, receive sight, follow to Jerusalem."],["Take-home line","“Lord, let me see.”"]],
 live:[["Pray Bartimaeus' prayer","Repeat during the day: “Jesus, Son of David, have mercy on me.”"],["Prepare for Holy Week","Bring palm leaves and flowers on Sunday; plan to attend the services of Holy Week."],["Honest measures (Deuteronomy 25:13)","Examine honesty in business, weights, wages and taxes."]],
 fathers:[["St Augustine","The man born blind is the human race; the clay is the Word made flesh; the washing in Siloam is Baptism, by which we are enlightened (Tractates on John 44)."],["St Ephrem the Syrian","With the clay he formed eyes as he had formed Adam from the dust; the Creator showed himself in the creating hand (Commentary on the Diatessaron)."]],
 magis:[["Catechism 1216","Baptism is called “enlightenment”, because those who receive it are enlightened in their understanding."],["Catechism 2616","Jesus hears the prayer of faith: “Son of David, have mercy on me”; the Jesus Prayer comes from such cries."],["Lumen Fidei 1–4","Faith is a light that illumines every aspect of human existence."]],
 saints:[["This week (fixed dates)","17 Mar: St Patrick. 18 Mar: St Cyril of Jerusalem. 19 Mar: St Joseph, and in 2027 also the Fortieth Day of the Great Fast. 20 Mar: Lazarus Saturday."]],
 prayer:"Lord Jesus, light of the world, you opened the eyes of the man born blind and of Bartimaeus. Have mercy on us: heal our blindness, let us see you with the eyes of faith, and give us grace to follow you on the way to Jerusalem, to your Cross and your Resurrection. Amen."},
 {quick:["Jesus is the light of the world: he opens blind eyes.","Faith grows step by step: “Lord, I believe.”","Bartimaeus receives sight and follows Jesus on the way."],action:"Pray often this week: “Jesus, Son of David, have mercy on me.”",question:"Where am I still blind, and do I want to see?",
  special:"Samio Sunday, sixth Sunday of the Great Fast. Announce the Fortieth Friday (19 Mar), Lazarus Saturday (20 Mar) and Hosanna Sunday (21 Mar); remind the faithful to bring palm leaves and flowers.",
  illus:["An illustration","Free eye camps in Kerala villages give sight to hundreds every year. One old man, after his cataract operation, said: “Now I can see my grandchildren's faces.” Jesus came to give us a sight even greater: to see God's face in Christ."],kids:"",diaspora:"",
  family:{read:"Read together: Mark 10:46–52.",explain:"A blind man called Bartimaeus shouted to Jesus for help. Jesus asked what he wanted, and he said: “I want to see!” Jesus healed him, and he followed Jesus.",intention:"We pray for the blind and for those who have lost faith.",ask:"Ask: “How will our family keep Holy Week this year?”"},
  catechism:[["CCC 1216","Baptism as enlightenment."],["CCC 2616","Prayer of faith."]],
  kidsaint:["St Joseph (19 Mar)","The husband of Mary and the foster father of Jesus, a carpenter who worked hard, protected his family and obeyed God at once. Lesson: work well and take care of your family."],
  term:["Samio Sunday","Samio is Syriac for “the blind man”. The sixth Sunday of the Great Fast, the last before Hosanna Sunday, reads the healing of the blind."],
  termMore:["The Fortieth Friday and Lazarus Saturday","On the Friday before Hosanna Sunday the forty days of the Fast are completed (the lectionary notes no fasting or prostrations that day). The next day remembers the raising of Lazarus, and Holy Week follows."]},
 {homily:["Dear brothers and sisters, on the last Sunday before Holy Week we hear of two blind men who receive their sight. In John's Gospel a man blind from birth; in Mark's, Bartimaeus, a beggar sitting by the road at Jericho.","Jesus makes clay, anoints the blind man's eyes and sends him to wash in the pool of Siloam, which means “Sent”. He comes back seeing. Then come the questions, the arguments, the threats. He does not know how to answer the scholars, but he knows one thing: “I was blind; now I see.” And his faith grows until he kneels and says: “Lord, I believe.” Meanwhile those who are sure they see refuse the light.","Bartimaeus cannot see, but he can shout. “Jesus, Son of David, have mercy on me!” People tell him to be quiet. He shouts louder. Jesus stops and asks: “What do you want me to do for you?” “Teacher, let me see again.” He receives his sight and follows Jesus on the road, the road to Jerusalem.","Next Sunday is Hosanna. Holy Week begins. Let us ask Jesus to heal our blindness: to the poor beside us, to our own sins, to God's love. Let us pray Bartimaeus' prayer all through this week. And having received our sight, let us follow Jesus on the way, to his Cross and his Resurrection. Amen."],
  kids:["Children, close your eyes for a moment. Now open them! It's wonderful to see, isn't it? Bartimaeus was blind. He heard Jesus was passing and shouted: “Jesus, help me!”","People said, “Be quiet!” But he shouted even louder. Jesus asked: “What do you want?” “I want to see!” And Jesus gave him his sight!","Next week we will wave palms for Jesus. Let's say: “Jesus, open my eyes to see you!”"]});

put("2027-03-14","ml",{title:"സമിയോ ഞായർ · അന്ധന്റെ സൗഖ്യം",readTitle:ML.rt,
 readings:[[ML.eg,"യോഹന്നാൻ 9:1–41","അന്ധനായി ജനിച്ചവൻ"],[ML.ot,"നിയമാവർത്തനം 25:13–19","സത്യസന്ധമായ തൂക്കവും അളവും"],[ML.ot,"ജോബ് 42:1–9","ഇപ്പോൾ എന്റെ കണ്ണുകൾ അങ്ങയെ കാണുന്നു"],[ML.ot,"1 രാജാക്കന്മാർ 3:4–15","സോളമൻ വിവേകം ചോദിക്കുന്നു"],[ML.ot,"ജറെമിയാ 51:10–19","കർത്താവു തന്റെ ശക്തിയാൽ ഭൂമിയെ സൃഷ്ടിച്ചു"],[ML.ce,"1 പത്രോസ് 4:12–19","ക്രിസ്തുവിന്റെ പീഡകളിൽ പങ്കുചേരൽ"],[ML.pa,"റോമാ 14:10–23","സഹോദരനെ വിധിക്കരുത്"],[ML.go,"മർക്കോസ് 10:46–52 (മർക്കോ 9:46–52 എന്ന് അച്ചടിച്ചിരിക്കുന്നു)","അന്ധനായ ബർത്തിമേയൂസ്"]],
 alt:"വലിയ നോമ്പിലെ ആറാം ഞായർ. വായനാപുസ്തകത്തിൽ സുവിശേഷം “മർക്കോ 9:46–52” എന്ന് അച്ചടിച്ചിരിക്കുന്നു; ജറീക്കോയിലെ അന്ധന്റെ സൗഖ്യം മർക്കോസ് 10:46–52 ആണ്. നോമ്പിന്റെ നാൽപതാം ദിവസം മാർച്ച് 19 വെള്ളി; ലാസറിന്റെ ശനി മാർച്ച് 20; ഓശാന ഞായർ മാർച്ച് 21: കുരുത്തോലയും പൂക്കളും കൊണ്ടുവരാൻ വിശ്വാസികളെ ഓർമിപ്പിക്കുക.",
 verse:"ഒരു കാര്യം എനിക്കറിയാം. ഞാൻ അന്ധനായിരുന്നു; ഇപ്പോൾ ഞാൻ കാണുന്നു.",cite:"യോഹന്നാൻ 9:25",
 theo:["ഹാശാആഴ്ചയ്ക്കു മുമ്പുള്ള അവസാന ഞായറാഴ്ച സഭ അന്ധരുടെ രണ്ടു സൗഖ്യങ്ങൾ വായിക്കുന്നു. യോഹന്നാനിൽ, ജന്മനാ അന്ധനായ ഒരാളെ യേശു കണ്ടുമുട്ടുന്നു. ആരുടെ പാപമാണ് അതിനു കാരണമെന്നു ശിഷ്യന്മാർ ചോദിക്കുന്നു. യേശു മറുപടി പറയുന്നു: “ഇവന്റെയോ ഇവന്റെ മാതാപിതാക്കന്മാരുടെയോ പാപം നിമിത്തമല്ല, പ്രത്യുത, ദൈവത്തിന്റെ പ്രവൃത്തികൾ ഇവനിൽ പ്രകടമാകേണ്ടതിനാണ്… ലോകത്തിലായിരിക്കുമ്പോൾ ഞാൻ ലോകത്തിന്റെ പ്രകാശമാണ്.” അവിടുന്നു ചെളിയുണ്ടാക്കി അവന്റെ കണ്ണുകളിൽ പുരട്ടി അവനെ അയയ്ക്കുന്നു: “നീ പോയി സീലോഹാ - അയയ്ക്കപ്പെട്ടവൻ എന്നർഥം - കുളത്തിൽ കഴുകുക.”","സുഖപ്പെട്ടവനെ ഫരിസേയർ വീണ്ടും വീണ്ടും ചോദ്യം ചെയ്യുന്നു. ദൈവശാസ്ത്രം മുഴുവൻ അവനറിയില്ല; പക്ഷേ ഒരു കാര്യം അവനറിയാം: “ഞാൻ അന്ധനായിരുന്നു; ഇപ്പോൾ ഞാൻ കാണുന്നു.” പടിപടിയായി അവന്റെ കാഴ്ച വളരുന്നു: ആദ്യം “യേശു എന്ന മനുഷ്യൻ”, പിന്നെ “ഒരു പ്രവാചകൻ”, ഒടുവിൽ, “കർത്താവേ, ഞാൻ വിശ്വസിക്കുന്നു എന്നു പറഞ്ഞുകൊണ്ട് അവൻ യേശുവിനെ പ്രണമിച്ചു.” അതിനിടെ, കാണുന്നുവെന്ന് അവകാശപ്പെടുന്നവർ അന്ധരാകുന്നു. യേശു പറയുന്നു: “കാഴ്ചയില്ലാത്തവർ കാണുകയും കാഴ്ചയുള്ളവർ അന്ധരായിത്തീരുകയും ചെയ്യേണ്ടതിന് ന്യായവിധിക്കായിട്ടാണു ഞാൻ ഈ ലോകത്തിലേക്കു വന്നത്.”","മർക്കോസിൽ, അന്ധനായ ബർത്തിമേയൂസ് ജറീക്കോയിലെ വഴിയരികിലിരുന്നു വിളിച്ചുപറയുന്നു: “ദാവീദിന്റെ പുത്രനായ യേശുവേ, എന്നിൽ കനിയണമേ!” മിണ്ടാതിരിക്കാൻ ആളുകൾ പറയുന്നു; അവൻ കൂടുതൽ ഉച്ചത്തിൽ വിളിക്കുന്നു. യേശു ചോദിക്കുന്നു: “ഞാൻ നിനക്കുവേണ്ടി എന്തുചെയ്യണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?” “ഗുരോ, എനിക്കു കാഴ്ച വീണ്ടുകിട്ടണം.” “നീ പൊയ്ക്കൊള്ളുക, നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു. തത്ക്ഷണം അവനു കാഴ്ച ലഭിച്ചു. അവൻ യേശുവിനെ അനുഗമിച്ചു” - ജറുസലെമിലേക്കും കുരിശിലേക്കുമുള്ള വഴിയിൽ.","എല്ലാ കഷ്ടപ്പാടുകൾക്കുംശേഷം ജോബ് പറയുന്നു: “അങ്ങയെക്കുറിച്ച് ഞാൻ കേട്ടിട്ടേ ഉണ്ടായിരുന്നുള്ളു. എന്നാൽ, ഇപ്പോൾ എന്റെ കണ്ണുകൾ അങ്ങയെ കാണുന്നു.” നോമ്പിന്റെ ലക്ഷ്യം ഇതാണ്: ദൈവത്തെപ്പറ്റി കേൾക്കുക മാത്രമല്ല, വിശ്വാസത്തിന്റെ കണ്ണുകളാൽ അവിടുത്തെ കാണുക. പിതാക്കന്മാർ “പ്രകാശനം” എന്നു വിളിച്ച മാമ്മോദീസയിൽ നാം കഴുകപ്പെടുകയും കാഴ്ച നൽകപ്പെടുകയും ചെയ്തു. ഹാശാആഴ്ച ആരംഭിക്കുമ്പോൾ ബർത്തിമേയൂസിനോടൊപ്പം നമുക്കു ചോദിക്കാം: “കർത്താവേ, എനിക്കു കാഴ്ച തരണമേ”; പിന്നെ വഴിയിൽ യേശുവിനെ അനുഗമിക്കാം."],
 conn:[["സീലോഹാ, “അയയ്ക്കപ്പെട്ടവൻ”.","“അയയ്ക്കപ്പെട്ടവൻ” എന്ന കുളത്തിൽ അവൻ കഴുകുന്നു; പിതാവ് അയച്ചവനാണ് യേശു: കാഴ്ച നൽകുന്ന കഴുകലായ മാമ്മോദീസയുടെ പ്രതീകം പിതാക്കന്മാർ ഇവിടെ കണ്ടു."],["ചെളിയും അഭിഷേകവും.","ദൈവം ആദാമിനെ മണ്ണിൽനിന്നു രൂപപ്പെടുത്തിയതുപോലെ (ഉൽപ 2:7) യേശു ചെളിയുണ്ടാക്കുന്നു: ഒരു പുതിയ സൃഷ്ടി."],["സോളമന്റെ പ്രാർഥന.","സോളമൻ വിവേകം ചോദിച്ചു (1 രാജാ 3:9); ദൈവത്തിൽനിന്നുള്ള ജ്ഞാനമാണ് യഥാർഥ കാഴ്ച."],["വഴിയിൽ അനുഗമിക്കൽ.","ബർത്തിമേയൂസ് ജറുസലെമിലേക്കുള്ള “വഴിയിൽ” യേശുവിനെ അനുഗമിക്കുന്നു (മർക്കോ 10:52): സുഖപ്പെട്ട ശിഷ്യർ അവിടുത്തോടൊപ്പം കുരിശിലേക്കു നടക്കുന്നു."]],
 altar:["പിതാക്കന്മാർ മാമ്മോദീസയെ “പ്രകാശനം” എന്നും ദിവ്യകാരുണ്യത്തെ കാഴ്ചയുള്ളവരുടെ ഭക്ഷണമെന്നും വിളിച്ചു. വിശുദ്ധ കുർബാനയിൽ ബർത്തിമേയൂസിനോടൊപ്പം നാം പ്രാർഥിക്കുന്നു: “ഞങ്ങളിൽ കനിയണമേ”; ലോകത്തിന്റെ പ്രകാശത്തെ നാം സ്വീകരിക്കുന്നു."],
 outline:[["ആരംഭം","ഏറ്റവും മോശമായ അന്ധത ഏതാണ്?"],["ഒന്നാം ആശയം · ലോകത്തിന്റെ പ്രകാശം","യേശു കണ്ണുകൾ തുറക്കുന്നു: പുതിയ സൃഷ്ടി, സീലോഹാ, മാമ്മോദീസ."],["രണ്ടാം ആശയം · വളരുന്ന കാഴ്ച","“യേശു എന്ന മനുഷ്യനിൽ”നിന്ന് “കർത്താവേ, ഞാൻ വിശ്വസിക്കുന്നു” എന്നതിലേക്ക്."],["മൂന്നാം ആശയം · കാണുന്നുവെന്നു കരുതുന്നവർ","അഹങ്കാരം അന്ധരാക്കുന്നു: ഫരിസേയർ."],["നാലാം ആശയം · വഴിയിൽ അനുഗമിക്കുക","ബർത്തിമേയൂസ്: നിലവിളിക്കുക, കാഴ്ച സ്വീകരിക്കുക, ജറുസലെമിലേക്ക് അനുഗമിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, എനിക്കു കാഴ്ച തരണമേ.”"]],
 live:[["ബർത്തിമേയൂസിന്റെ പ്രാർഥന ചൊല്ലുക","ദിവസം മുഴുവൻ ആവർത്തിക്കുക: “ദാവീദിന്റെ പുത്രനായ യേശുവേ, എന്നിൽ കനിയണമേ!”"],["ഹാശാആഴ്ചയ്ക്ക് ഒരുങ്ങുക","ഞായറാഴ്ച കുരുത്തോലയും പൂക്കളും കൊണ്ടുവരുക; ഹാശാആഴ്ചയിലെ ശുശ്രൂഷകളിൽ പങ്കെടുക്കാൻ പദ്ധതിയിടുക."],["സത്യസന്ധമായ അളവുകൾ (നിയ 25:13)","കച്ചവടത്തിലും തൂക്കത്തിലും കൂലിയിലും നികുതിയിലുമുള്ള സത്യസന്ധത പരിശോധിക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","ജന്മനാ അന്ധനായവൻ മനുഷ്യവംശമാണ്; ചെളി മാംസമായ വചനമാണ്; സീലോഹായിലെ കഴുകൽ നമ്മെ പ്രകാശിപ്പിക്കുന്ന മാമ്മോദീസയാണ് (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രബന്ധങ്ങൾ 44)."],["മാർ അപ്രേം","ആദാമിനെ പൊടിയിൽനിന്നു രൂപപ്പെടുത്തിയതുപോലെ ചെളികൊണ്ട് അവിടുന്നു കണ്ണുകൾ രൂപപ്പെടുത്തി; സൃഷ്ടിക്കുന്ന കരത്തിൽ സ്രഷ്ടാവു തന്നെത്തന്നെ വെളിപ്പെടുത്തി (ദിയാതെസ്സറോൻ വ്യാഖ്യാനം)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1216","മാമ്മോദീസ സ്വീകരിക്കുന്നവർ ബുദ്ധിയിൽ പ്രകാശിതരാകുന്നതിനാൽ അതു “പ്രകാശനം” എന്നു വിളിക്കപ്പെടുന്നു."],["മതബോധനഗ്രന്ഥം 2616","“ദാവീദിന്റെ പുത്രാ, എന്നിൽ കനിയണമേ” എന്ന വിശ്വാസപ്രാർഥന യേശു കേൾക്കുന്നു; യേശുപ്രാർഥന ഇത്തരം നിലവിളികളിൽനിന്നാണ് ഉണ്ടായത്."],["വിശ്വാസത്തിന്റെ പ്രകാശം (ലുമെൻ ഫീദേയി) 1–4","മനുഷ്യജീവിതത്തിന്റെ എല്ലാ മേഖലകളെയും പ്രകാശിപ്പിക്കുന്ന ഒരു വെളിച്ചമാണു വിശ്വാസം."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","മാർച്ച് 17: വിശുദ്ധ പാട്രിക്. മാർച്ച് 18: ജറുസലെമിലെ വിശുദ്ധ സിറിൽ. മാർച്ച് 19: വിശുദ്ധ യൗസേപ്പ്; 2027-ൽ നോമ്പിന്റെ നാൽപതാം ദിവസവും. മാർച്ച് 20: ലാസറിന്റെ ശനി."]],
 prayer:"ലോകത്തിന്റെ പ്രകാശമായ കർത്താവായ യേശുവേ, ജന്മനാ അന്ധനായവന്റെയും ബർത്തിമേയൂസിന്റെയും കണ്ണുകൾ അങ്ങു തുറന്നു. ഞങ്ങളിൽ കനിയണമേ: ഞങ്ങളുടെ അന്ധത സുഖപ്പെടുത്തണമേ; വിശ്വാസത്തിന്റെ കണ്ണുകളാൽ അങ്ങയെ കാണാൻ ഞങ്ങളെ അനുവദിക്കണമേ; ജറുസലെമിലേക്കും അങ്ങയുടെ കുരിശിലേക്കും ഉയിർപ്പിലേക്കുമുള്ള വഴിയിൽ അങ്ങയെ അനുഗമിക്കാൻ കൃപ നൽകണമേ. ആമേൻ."},
 {quick:["യേശു ലോകത്തിന്റെ പ്രകാശമാണ്: അവിടുന്ന് അന്ധരുടെ കണ്ണുകൾ തുറക്കുന്നു.","വിശ്വാസം പടിപടിയായി വളരുന്നു: “കർത്താവേ, ഞാൻ വിശ്വസിക്കുന്നു.”","ബർത്തിമേയൂസ് കാഴ്ച സ്വീകരിച്ച് വഴിയിൽ യേശുവിനെ അനുഗമിക്കുന്നു."],action:"ഈ ആഴ്ച കൂടെക്കൂടെ പ്രാർഥിക്കുക: “ദാവീദിന്റെ പുത്രനായ യേശുവേ, എന്നിൽ കനിയണമേ!”",question:"ഞാൻ ഇപ്പോഴും എവിടെയാണ് അന്ധനായിരിക്കുന്നത്? കാണാൻ ഞാൻ ആഗ്രഹിക്കുന്നുണ്ടോ?",
  special:"സമിയോ ഞായർ, വലിയ നോമ്പിലെ ആറാം ഞായർ. നാൽപതാം വെള്ളി (മാർച്ച് 19), ലാസറിന്റെ ശനി (മാർച്ച് 20), ഓശാന ഞായർ (മാർച്ച് 21) എന്നിവ അറിയിക്കുക; കുരുത്തോലയും പൂക്കളും കൊണ്ടുവരാൻ ഓർമിപ്പിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഗ്രാമങ്ങളിലെ സൗജന്യ നേത്രചികിത്സാക്യാമ്പുകൾ എല്ലാ വർഷവും നൂറുകണക്കിനു പേർക്കു കാഴ്ച നൽകുന്നു. തിമിരശസ്ത്രക്രിയയ്ക്കുശേഷം ഒരു വൃദ്ധൻ പറഞ്ഞു: “ഇപ്പോൾ എനിക്ക് എന്റെ കൊച്ചുമക്കളുടെ മുഖം കാണാം.” അതിലും വലിയ കാഴ്ച നൽകാനാണ് യേശു വന്നത്: ക്രിസ്തുവിൽ ദൈവത്തിന്റെ മുഖം കാണാൻ."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മർക്കോസ് 10:46–52.",explain:"ബർത്തിമേയൂസ് എന്ന അന്ധൻ സഹായത്തിനായി യേശുവിനെ ഉച്ചത്തിൽ വിളിച്ചു. അവന് എന്തു വേണമെന്ന് യേശു ചോദിച്ചു; “എനിക്കു കാണണം!” എന്ന് അവൻ പറഞ്ഞു. യേശു അവനെ സുഖപ്പെടുത്തി; അവൻ യേശുവിനെ അനുഗമിച്ചു.",intention:"അന്ധർക്കും വിശ്വാസം നഷ്ടപ്പെട്ടവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ വർഷം നമ്മുടെ കുടുംബം ഹാശാആഴ്ച എങ്ങനെ ആചരിക്കും?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1216","പ്രകാശനമായ മാമ്മോദീസ."],["മതബോധനഗ്രന്ഥം 2616","വിശ്വാസത്തിന്റെ പ്രാർഥന."]],
  kidsaint:["വിശുദ്ധ യൗസേപ്പ് (മാർച്ച് 19)","മറിയത്തിന്റെ ഭർത്താവും യേശുവിന്റെ വളർത്തുപിതാവും; കഠിനാധ്വാനം ചെയ്ത, കുടുംബത്തെ സംരക്ഷിച്ച, ദൈവത്തെ ഉടനെ അനുസരിച്ച ഒരു ആശാരി. പാഠം: നന്നായി ജോലി ചെയ്യുക; നിന്റെ കുടുംബത്തെ പരിപാലിക്കുക."],
  term:["സമിയോ ഞായർ","“സമിയോ” എന്നതിന്റെ സുറിയാനിയിലെ അർഥം “അന്ധൻ” എന്നാണ്. ഓശാന ഞായറിനു മുമ്പുള്ള അവസാനത്തേതായ, വലിയ നോമ്പിലെ ആറാം ഞായർ അന്ധരുടെ സൗഖ്യം വായിക്കുന്നു."],
  termMore:["നാൽപതാം വെള്ളിയും ലാസറിന്റെ ശനിയും","ഓശാന ഞായറിനു മുമ്പുള്ള വെള്ളിയാഴ്ച നോമ്പിന്റെ നാൽപതു ദിവസങ്ങൾ പൂർത്തിയാകുന്നു (അന്ന് ഉപവാസമോ കുമ്പിടീലോ ഇല്ലെന്നു വായനാപുസ്തകം സൂചിപ്പിക്കുന്നു). പിറ്റേന്നു ലാസറിനെ ഉയിർപ്പിച്ചതിന്റെ ഓർമ; തുടർന്നു ഹാശാആഴ്ച."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഹാശാആഴ്ചയ്ക്കു മുമ്പുള്ള അവസാന ഞായറാഴ്ച കാഴ്ച ലഭിക്കുന്ന രണ്ട് അന്ധരെപ്പറ്റി നാം കേൾക്കുന്നു. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ജന്മനാ അന്ധനായ ഒരാൾ; മർക്കോസിൽ ജറീക്കോയിലെ വഴിയരികിലിരിക്കുന്ന ബർത്തിമേയൂസ് എന്ന ഭിക്ഷക്കാരൻ.","യേശു ചെളിയുണ്ടാക്കി, അന്ധന്റെ കണ്ണുകളിൽ പുരട്ടി, “അയയ്ക്കപ്പെട്ടവൻ” എന്നർഥമുള്ള സീലോഹാ കുളത്തിൽ കഴുകാൻ അവനെ അയയ്ക്കുന്നു. കാഴ്ചയുള്ളവനായി അവൻ തിരിച്ചുവരുന്നു. പിന്നെ ചോദ്യങ്ങളും തർക്കങ്ങളും ഭീഷണികളും. പണ്ഡിതന്മാർക്ക് ഉത്തരം നൽകാൻ അവനറിയില്ല; പക്ഷേ ഒരു കാര്യം അവനറിയാം: “ഞാൻ അന്ധനായിരുന്നു; ഇപ്പോൾ ഞാൻ കാണുന്നു.” മുട്ടുകുത്തി “കർത്താവേ, ഞാൻ വിശ്വസിക്കുന്നു” എന്നു പറയുന്നതുവരെ അവന്റെ വിശ്വാസം വളരുന്നു. അതിനിടെ, തങ്ങൾ കാണുന്നുവെന്ന് ഉറപ്പുള്ളവർ വെളിച്ചം നിരസിക്കുന്നു.","ബർത്തിമേയൂസിനു കാണാനാകില്ല; പക്ഷേ വിളിച്ചുപറയാനാകും. “ദാവീദിന്റെ പുത്രനായ യേശുവേ, എന്നിൽ കനിയണമേ!” മിണ്ടാതിരിക്കാൻ ആളുകൾ പറയുന്നു. അവൻ കൂടുതൽ ഉച്ചത്തിൽ വിളിക്കുന്നു. യേശു നിന്നു ചോദിക്കുന്നു: “ഞാൻ നിനക്കുവേണ്ടി എന്തുചെയ്യണം?” “ഗുരോ, എനിക്കു കാഴ്ച വീണ്ടുകിട്ടണം.” അവനു കാഴ്ച ലഭിക്കുന്നു; അവൻ വഴിയിൽ, ജറുസലെമിലേക്കുള്ള വഴിയിൽ, യേശുവിനെ അനുഗമിക്കുന്നു.","അടുത്ത ഞായറാഴ്ച ഓശാനയാണ്. ഹാശാആഴ്ച ആരംഭിക്കുന്നു. നമ്മുടെ അന്ധത സുഖപ്പെടുത്താൻ യേശുവിനോടു ചോദിക്കാം: നമ്മുടെ അരികിലുള്ള ദരിദ്രരെ കാണാത്ത, സ്വന്തം പാപങ്ങൾ കാണാത്ത, ദൈവസ്നേഹം കാണാത്ത അന്ധത. ഈ ആഴ്ച മുഴുവൻ ബർത്തിമേയൂസിന്റെ പ്രാർഥന ചൊല്ലാം. കാഴ്ച ലഭിച്ചശേഷം, അവിടുത്തെ കുരിശിലേക്കും ഉയിർപ്പിലേക്കുമുള്ള വഴിയിൽ യേശുവിനെ അനുഗമിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഒരു നിമിഷം കണ്ണടയ്ക്കൂ. ഇനി തുറക്കൂ! കാണാൻ കഴിയുന്നത് എത്ര അദ്ഭുതകരം, അല്ലേ? ബർത്തിമേയൂസ് അന്ധനായിരുന്നു. യേശു കടന്നുപോകുന്നുവെന്നു കേട്ടപ്പോൾ അവൻ വിളിച്ചുപറഞ്ഞു: “യേശുവേ, എന്നെ സഹായിക്കണമേ!”","ആളുകൾ പറഞ്ഞു: “മിണ്ടാതിരിക്ക്!” പക്ഷേ അവൻ കൂടുതൽ ഉച്ചത്തിൽ വിളിച്ചു. യേശു ചോദിച്ചു: “നിനക്ക് എന്തു വേണം?” “എനിക്കു കാണണം!” യേശു അവനു കാഴ്ച കൊടുത്തു!","അടുത്ത ആഴ്ച നാം യേശുവിനുവേണ്ടി കുരുത്തോല വീശും. നമുക്കു പറയാം: “യേശുവേ, അങ്ങയെ കാണാൻ എന്റെ കണ്ണുകൾ തുറക്കണമേ!”"]});
