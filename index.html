put("2026-10-23","en",E({t:"Friday of the Twenty-ninth Week in Ordinary Time",
 r:[["First Reading","Ephesians 4:1–6","One Lord, one faith, one baptism"],["Responsorial Psalm","Psalm 24","Such is the company of those who seek his face"],["Gospel","Luke 12:54–59","Interpret the present time"]],
 alt:"Optional memorial of St John of Capistrano, Priest.",
 v:"You hypocrites! You know how to interpret the appearance of earth and sky, but why do you not know how to interpret the present time?",c:"Luke 12:56",
 theo:["Paul's great confession of unity is almost a creed: “one body and one Spirit… one Lord, one faith, one baptism, one God and Father of all, who is above all and through all and in all.” The Church's unity is not an arrangement we make; it is a gift flowing from the unity of the Trinity. Our part is to “maintain” it, with humility, gentleness and patience, “bearing with one another in love”.","Jesus rebukes people who can read the weather but not the time of God's visitation. The Second Vatican Council took up this phrase and spoke of “reading the signs of the times in the light of the Gospel” (Gaudium et Spes 4). Today's Gospel ends with practical wisdom: settle with your opponent on the way. Reconciliation should not wait for the court, or for death."],
 conn:[["One God.","Ephesians 4:6 echoes the Shema: “Hear, O Israel: The Lord is our God, the Lord alone” (Deuteronomy 6:4), now opened to reveal Father, Son and Spirit."],["The Creed.","The words “one baptism” passed into the Nicene Creed: “I confess one baptism for the forgiveness of sins.”"]],
 altar:"In the Creed at Sunday Mass we profess the “one faith” Paul writes of. The Eucharist is the sacrament of the “one body”.",
 out:[["Opening","Ask: how many of you checked the weather today? How many checked your soul?"],["Point 1 · Unity is a gift to keep","One Lord, one faith, one baptism: unity flows from the Trinity. Keep it with humility and patience."],["Point 2 · Read the present time","See God's call in today's events, in light of the Gospel."],["Point 3 · Settle on the way","Do not postpone reconciliation."],["Take-home line","“Today is the time to make peace.”"]],
 live:[["Bear with one another (Ephesians 4:2)","Choose one person whose habits annoy you and practise patience with them today."],["Settle on the way (Luke 12:58)","Take one concrete step to resolve a dispute before it grows."]],
 fa:["St Cyprian","“There is one God, and one Christ, and one Church, and one faith, and one people joined together by the bond of concord” (On the Unity of the Catholic Church 23)."],
 ma:["Gaudium et Spes 4","The Church has the duty of scrutinising the signs of the times and interpreting them in the light of the Gospel."],
 sa:[["23 October · St John of Capistrano","Franciscan priest and preacher who travelled across Europe, calling people to conversion and peace."]],
 p:"Lord, you are one God, Father of all. Keep us in the unity of the Spirit, give us eyes to read the present time, and hearts quick to make peace. Amen."}),
 X({q:["One Lord, one faith, one baptism: unity is a gift from the Trinity.","Read the present time in the light of the Gospel.","Make peace on the way; do not wait."],a:"Take one step today to settle a quarrel.",qu:"What is God saying to me through the events of this week?",
  il:["An illustration","Kerala fishermen read the sky and sea every morning before setting out. Jesus asks us to read our lives with the same care, to see where God is calling."],
  fam:{read:"Read together: Ephesians 4:2–3.",explain:"St Paul says: be humble, gentle and patient with one another, and keep the peace in the family.",intention:"We pray for peace in families where there are quarrels.",ask:"Ask: “Is there anyone we need to make peace with?”"},
  cat:[["CCC 813–816","The unity of the Church."]],ks:["Saint John of Capistrano","A lawyer and governor who became a Franciscan priest and walked across Europe preaching. Lesson: it is never too late to give your life to Jesus."],
  term:["Creed","The summary of our faith said on Sundays and solemnities. The Nicene Creed was first formulated at the Council of Nicaea in 325, whose 1700th anniversary was celebrated in 2025."],tm:["Why stand for the Creed?","We stand because the Creed is our answer to the Word, and standing is the posture of people who are risen with Christ."]}),
 {homily:["Dear friends, St Paul writes almost a creed: one body, one Spirit, one Lord, one faith, one baptism, one God and Father of all. The unity of the Church is not something we invent; it flows from God himself. Our task is to keep it, with humility, gentleness and patience.","Jesus says: you can read the weather, but you cannot read the present time. The Church asks us to read the signs of the times in the light of the Gospel. And Jesus adds: settle with your opponent on the way. Do not wait.","So today, let us keep the unity of the Spirit, and let us make peace with someone before the day ends. Amen."],
  kids:["Children, how do you know it will rain? Dark clouds! Jesus says: learn to see what God is doing too.","St Paul says: be gentle and patient with each other. If you quarrelled with someone today, make peace before bedtime."]});

put("2026-10-23","ml",E({t:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ആഴ്ച · വെള്ളി",
 r:[["ഒന്നാം വായന","എഫേസോസ് 4:1–6","ഒരു കർത്താവ്, ഒരു വിശ്വാസം, ഒരു മാമ്മോദീസ"],["പ്രതിവചനസങ്കീർത്തനം","സങ്കീർത്തനം 24","അവിടുത്തെ മുഖം തേടുന്നവരുടെ തലമുറ ഇതാണ്"],["സുവിശേഷം","ലൂക്കാ 12:54–59","ഈ കാലത്തെ വ്യാഖ്യാനിക്കുവിൻ"]],
 alt:"വൈദികനായ കപ്പിസ്ത്രാനോയിലെ വിശുദ്ധ ജോണിന്റെ ഐച്ഛിക ഓർമ.",
 v:"കപടനാട്യക്കാരേ, ഭൂമിയുടെയും ആകാശത്തിന്റെയും ഭാവഭേദം വ്യാഖ്യാനിക്കാൻ നിങ്ങൾക്കറിയാം. എന്നാൽ, ഈ കാലത്തെ വ്യാഖ്യാനിക്കാൻ നിങ്ങൾക്ക് അറിയാത്തത് എന്തുകൊണ്ട്?",c:"ലൂക്കാ 12:56",
 theo:["ഐക്യത്തെപ്പറ്റിയുള്ള പൗലോസിന്റെ മഹത്തായ ഏറ്റുപറച്ചിൽ ഏതാണ്ട് ഒരു വിശ്വാസപ്രമാണമാണ്: ഒരു ശരീരവും ഒരു ആത്മാവും… ഒരു കർത്താവ്, ഒരു വിശ്വാസം, ഒരു മാമ്മോദീസ; എല്ലാവരുടെയും പിതാവും എല്ലാവർക്കും മീതെയും എല്ലാവരിലൂടെയും എല്ലാവരിലും ഉള്ളവനുമായ ഒരു ദൈവം. സഭയുടെ ഐക്യം നാം ഉണ്ടാക്കുന്ന ഒരു ക്രമീകരണമല്ല; പരിശുദ്ധ ത്രിത്വത്തിന്റെ ഐക്യത്തിൽനിന്ന് ഒഴുകുന്ന ദാനമാണ്. വിനയത്തോടും സൗമ്യതയോടും ക്ഷമയോടുംകൂടെ, “സ്നേഹത്തിൽ പരസ്പരം സഹിച്ചുകൊണ്ട്” അതു “കാത്തുസൂക്ഷിക്കുക” എന്നതാണു നമ്മുടെ പങ്ക്.","കാലാവസ്ഥ വായിക്കാൻ അറിയുന്നവരും എന്നാൽ ദൈവസന്ദർശനത്തിന്റെ കാലം വായിക്കാൻ അറിയാത്തവരുമായ ആളുകളെ ഈശോ ശാസിക്കുന്നു. രണ്ടാം വത്തിക്കാൻ കൗൺസിൽ ഈ വാക്കുകൾ ഏറ്റെടുത്ത്, “സുവിശേഷത്തിന്റെ വെളിച്ചത്തിൽ കാലത്തിന്റെ അടയാളങ്ങൾ വായിക്കുന്നതിനെ”പ്പറ്റി സംസാരിച്ചു (ഗൗദിയും എത് സ്പെസ് 4). പ്രായോഗികമായ ഒരു ജ്ഞാനത്തോടെ ഇന്നത്തെ സുവിശേഷം അവസാനിക്കുന്നു: വഴിയിൽവച്ചുതന്നെ എതിരാളിയുമായി രമ്യപ്പെടുക. അനുരഞ്ജനം കോടതിവരെയോ മരണംവരെയോ കാത്തിരിക്കരുത്."],
 conn:[["ഒരു ദൈവം.","എഫേസോസ് 4:6 ഷേമായെ പ്രതിധ്വനിക്കുന്നു: “ഇസ്രായേലേ, കേൾക്കുക: നമ്മുടെ ദൈവമായ കർത്താവ് ഒരേ ഒരു കർത്താവാണ്” (നിയ 6:4); ഇപ്പോൾ അതു പിതാവും പുത്രനും ആത്മാവുമായി തുറക്കപ്പെടുന്നു."],["വിശ്വാസപ്രമാണം.","“ഒരു മാമ്മോദീസ” എന്ന വാക്കുകൾ നിഖ്യാ വിശ്വാസപ്രമാണത്തിലേക്കു കടന്നു: “പാപമോചനത്തിനായുള്ള ഏക മാമ്മോദീസ ഞാൻ ഏറ്റുപറയുന്നു.”"]],
 altar:"ഞായറാഴ്ച കുർബാനയിലെ വിശ്വാസപ്രമാണത്തിൽ പൗലോസ് എഴുതുന്ന “ഒരു വിശ്വാസം” നാം ഏറ്റുപറയുന്നു. “ഒരു ശരീരത്തിന്റെ” കൂദാശയാണു ദിവ്യകാരുണ്യം.",
 out:[["ആരംഭം","ചോദിക്കുക: ഇന്ന് എത്രപേർ കാലാവസ്ഥ നോക്കി? എത്രപേർ സ്വന്തം ആത്മാവിനെ നോക്കി?"],["ഒന്നാം ആശയം · ഐക്യം കാത്തുസൂക്ഷിക്കേണ്ട ദാനമാണ്","ഒരു കർത്താവ്, ഒരു വിശ്വാസം, ഒരു മാമ്മോദീസ: ഐക്യം ത്രിത്വത്തിൽനിന്ന് ഒഴുകുന്നു. വിനയത്തോടും ക്ഷമയോടുംകൂടെ അതു കാക്കുക."],["രണ്ടാം ആശയം · ഈ കാലത്തെ വായിക്കുക","സുവിശേഷത്തിന്റെ വെളിച്ചത്തിൽ ഇന്നത്തെ സംഭവങ്ങളിലെ ദൈവവിളി കാണുക."],["മൂന്നാം ആശയം · വഴിയിൽവച്ചുതന്നെ രമ്യപ്പെടുക","അനുരഞ്ജനം നീട്ടിവയ്ക്കരുത്."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“സമാധാനം സ്ഥാപിക്കാനുള്ള സമയം ഇന്നാണ്.”"]],
 live:[["പരസ്പരം സഹിക്കുക (എഫേസോസ് 4:2)","ശീലങ്ങൾ നിന്നെ അലോസരപ്പെടുത്തുന്ന ഒരാളെ തിരഞ്ഞെടുത്ത് ഇന്ന് അയാളോടു ക്ഷമ അഭ്യസിക്കുക."],["വഴിയിൽവച്ചുതന്നെ രമ്യപ്പെടുക (ലൂക്കാ 12:58)","ഒരു തർക്കം വലുതാകുംമുമ്പ് അതു പരിഹരിക്കാൻ വ്യക്തമായ ഒരു ചുവടു വയ്ക്കുക."]],
 fa:["വിശുദ്ധ സിപ്രിയൻ","“ഒരു ദൈവവും ഒരു ക്രിസ്തുവും ഒരു സഭയും ഒരു വിശ്വാസവും, ഐക്യത്തിന്റെ ബന്ധത്താൽ ചേർക്കപ്പെട്ട ഒരു ജനവുമാണുള്ളത്” (കത്തോലിക്കാസഭയുടെ ഐക്യത്തെപ്പറ്റി 23)."],
 ma:["ഗൗദിയും എത് സ്പെസ് 4","കാലത്തിന്റെ അടയാളങ്ങൾ പരിശോധിച്ച് സുവിശേഷത്തിന്റെ വെളിച്ചത്തിൽ അവ വ്യാഖ്യാനിക്കാൻ സഭയ്ക്കു കടമയുണ്ട്."],
 sa:[["ഒക്ടോബർ 23 · കപ്പിസ്ത്രാനോയിലെ വിശുദ്ധ ജോൺ","മാനസാന്തരത്തിലേക്കും സമാധാനത്തിലേക്കും ആളുകളെ വിളിച്ചുകൊണ്ടു യൂറോപ്പിലുടനീളം സഞ്ചരിച്ച ഫ്രാൻസിസ്കൻ വൈദികനും പ്രഭാഷകനും."]],
 p:"കർത്താവേ, അങ്ങ് എല്ലാവരുടെയും പിതാവായ ഏകദൈവമാണ്. ആത്മാവിന്റെ ഐക്യത്തിൽ ഞങ്ങളെ കാക്കണമേ; ഈ കാലത്തെ വായിക്കാനുള്ള കണ്ണുകളും സമാധാനം സ്ഥാപിക്കാൻ വേഗമുള്ള ഹൃദയങ്ങളും ഞങ്ങൾക്കു നൽകണമേ. ആമേൻ."},true),
 X({q:["ഒരു കർത്താവ്, ഒരു വിശ്വാസം, ഒരു മാമ്മോദീസ: ഐക്യം ത്രിത്വത്തിൽനിന്നുള്ള ദാനമാണ്.","സുവിശേഷത്തിന്റെ വെളിച്ചത്തിൽ ഈ കാലത്തെ വായിക്കുക.","വഴിയിൽവച്ചുതന്നെ സമാധാനം സ്ഥാപിക്കുക; കാത്തിരിക്കരുത്."],a:"ഒരു കലഹം പരിഹരിക്കാൻ ഇന്ന് ഒരു ചുവടു വയ്ക്കുക.",qu:"ഈ ആഴ്ചയിലെ സംഭവങ്ങളിലൂടെ ദൈവം എന്നോട് എന്താണു പറയുന്നത്?",
  il:["ഒരു ഉദാഹരണം","കടലിൽ പോകുംമുമ്പ് എല്ലാ ദിവസവും രാവിലെ കേരളത്തിലെ മത്സ്യത്തൊഴിലാളികൾ ആകാശവും കടലും വായിക്കുന്നു. ദൈവം എവിടെ വിളിക്കുന്നുവെന്നു കാണാൻ അതേ ശ്രദ്ധയോടെ നമ്മുടെ ജീവിതം വായിക്കാൻ ഈശോ ആവശ്യപ്പെടുന്നു."],
  fam:{read:"ഒന്നിച്ചു വായിക്കുക: എഫേസോസ് 4:2–3.",explain:"വിശുദ്ധ പൗലോസ് പറയുന്നു: പരസ്പരം വിനയവും സൗമ്യതയും ക്ഷമയും ഉള്ളവരായിരിക്കുക; കുടുംബത്തിൽ സമാധാനം കാക്കുക.",intention:"കലഹങ്ങളുള്ള കുടുംബങ്ങളിൽ സമാധാനത്തിനായി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നാം ആരുമായെങ്കിലും രമ്യപ്പെടേണ്ടതുണ്ടോ?”"},
  cat:[["മതബോധനഗ്രന്ഥം 813–816","സഭയുടെ ഐക്യം."]],ks:["കപ്പിസ്ത്രാനോയിലെ വിശുദ്ധ ജോൺ","അഭിഭാഷകനും ഗവർണറുമായിരുന്ന അദ്ദേഹം ഫ്രാൻസിസ്കൻ വൈദികനായി, യൂറോപ്പിലുടനീളം നടന്നു പ്രസംഗിച്ചു. പാഠം: ഈശോയ്ക്കു ജീവിതം നൽകാൻ ഒരിക്കലും വൈകിയിട്ടില്ല."],
  term:["വിശ്വാസപ്രമാണം","ഞായറാഴ്ചകളിലും മഹോത്സവങ്ങളിലും ചൊല്ലുന്ന നമ്മുടെ വിശ്വാസത്തിന്റെ സംഗ്രഹം. 325-ലെ നിഖ്യാ കൗൺസിലിലാണു നിഖ്യാ വിശ്വാസപ്രമാണം ആദ്യം രൂപപ്പെടുത്തിയത്; അതിന്റെ 1700-ാം വാർഷികം 2025-ൽ ആഘോഷിച്ചു."],tm:["വിശ്വാസപ്രമാണത്തിനു നിൽക്കുന്നത് എന്തുകൊണ്ട്?","വചനത്തിനുള്ള നമ്മുടെ ഉത്തരമാണു വിശ്വാസപ്രമാണം; ക്രിസ്തുവിനോടൊപ്പം ഉയിർപ്പിക്കപ്പെട്ടവരുടെ ശരീരഭാവമാണു നിൽപ്പ്."]}),
 {homily:["പ്രിയപ്പെട്ടവരേ, വിശുദ്ധ പൗലോസ് ഏതാണ്ട് ഒരു വിശ്വാസപ്രമാണം എഴുതുന്നു: ഒരു ശരീരം, ഒരു ആത്മാവ്, ഒരു കർത്താവ്, ഒരു വിശ്വാസം, ഒരു മാമ്മോദീസ, എല്ലാവരുടെയും പിതാവായ ഒരു ദൈവം. സഭയുടെ ഐക്യം നാം കണ്ടുപിടിക്കുന്ന ഒന്നല്ല; ദൈവത്തിൽനിന്നുതന്നെ ഒഴുകുന്നതാണ്. വിനയത്തോടും സൗമ്യതയോടും ക്ഷമയോടുംകൂടെ അതു കാക്കുകയാണു നമ്മുടെ കടമ.","ഈശോ പറയുന്നു: കാലാവസ്ഥ വായിക്കാൻ നിങ്ങൾക്കറിയാം; ഈ കാലത്തെ വായിക്കാൻ അറിയില്ല. സുവിശേഷത്തിന്റെ വെളിച്ചത്തിൽ കാലത്തിന്റെ അടയാളങ്ങൾ വായിക്കാൻ സഭ നമ്മോട് ആവശ്യപ്പെടുന്നു. ഈശോ കൂട്ടിച്ചേർക്കുന്നു: വഴിയിൽവച്ചുതന്നെ എതിരാളിയുമായി രമ്യപ്പെടുക. കാത്തിരിക്കരുത്.","അതുകൊണ്ട് ഇന്ന് ആത്മാവിന്റെ ഐക്യം കാക്കാം; ദിവസം അവസാനിക്കുംമുമ്പ് ഒരാളുമായി സമാധാനം സ്ഥാപിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, മഴ പെയ്യുമെന്നു നിങ്ങൾ എങ്ങനെ അറിയും? കറുത്ത മേഘങ്ങൾ! ദൈവം എന്തു ചെയ്യുന്നുവെന്നു കാണാനും പഠിക്കണമെന്ന് ഈശോ പറയുന്നു.","വിശുദ്ധ പൗലോസ് പറയുന്നു: പരസ്പരം സൗമ്യതയും ക്ഷമയും ഉള്ളവരായിരിക്കുക. ഇന്ന് ആരോടെങ്കിലും വഴക്കിട്ടെങ്കിൽ ഉറങ്ങുംമുമ്പു രമ്യപ്പെടുക."]});

/* ---------- Saturday 24 ---------- */
put("2026-10-24","en",E({t:"Saturday of the Twenty-ninth Week in Ordinary Time",
 r:[["First Reading","Ephesians 4:7–16","Building up the body of Christ"],["Responsorial Psalm","Psalm 122","Let us go rejoicing to the house of the Lord"],["Gospel","Luke 13:1–9","Unless you repent… The barren fig tree"]],
 alt:"Optional memorials: St Anthony Mary Claret, Bishop; Saturday memorial of the Blessed Virgin Mary.",
 v:"Sir, let it alone for one more year, until I dig around it and put manure on it.",c:"Luke 13:8",
 theo:["People bring Jesus news of a tragedy and want an explanation: were the victims worse sinners? Jesus refuses to read disasters as punishments, but he turns the question back: “Unless you repent, you will all perish as they did.” Every tragedy is a call to examine our own lives, not to judge others.","Then comes the parable of the fig tree that has borne no fruit for three years. The owner wants it cut down; the gardener pleads, “Let it alone for one more year.” This is the patience of Christ, who intercedes for us and digs around our roots with grace. Paul shows what that fruit looks like in the Church: each member using the gift given “according to the measure of Christ's gift”, “speaking the truth in love”, so that the whole body grows up into Christ, the head."],
 conn:[["The vineyard of Isaiah.","The fig tree planted in a vineyard recalls Isaiah 5:1–7, where God looks for fruit in Israel, his vineyard."],["Gifts from the ascended Christ.","Ephesians 4:8 quotes Psalm 68:18: “When he ascended on high… he gave gifts to his people.”"]],
 altar:"Every Mass is the gardener's “one more year”: Christ pleads for us before the Father and nourishes our roots with his Body and Blood.",
 out:[["Opening","Mention a recent disaster in the news. Ask: why do such things happen?"],["Point 1 · Not punishment, but a call","Jesus refuses to blame victims. Tragedy calls us to conversion, not judgement."],["Point 2 · The gardener's patience","Christ pleads, “one more year”. God's patience is time given for repentance (2 Peter 3:9)."],["Point 3 · Bear fruit in the body","Speak the truth in love; use your gift to build up the Church."],["Take-home line","“This year is God's gift; I will bear fruit.”"]],
 live:[["Speak the truth in love (Ephesians 4:15)","Say one honest thing today, gently and with love."],["Dig around the roots (Luke 13:8)","Choose one way to nourish your faith this week: Confession, Scripture, or adoration."]],
 fa:["St Augustine","He says the gardener digging around the tree is the humility of repentance, and the manure is the sorrow for sin that makes the soul fruitful (Sermon 110)."],
 ma:["Catechism 309–314","God permits evil but draws good from it; his providence and patience leave time for conversion. Suffering is not a sign that a person is a greater sinner."],
 sa:[["24 October · St Anthony Mary Claret","Spanish missionary, Archbishop of Santiago de Cuba, and founder of the Claretians."],["Saturday","Memorial of the Blessed Virgin Mary."]],
 p:"Lord Jesus, patient gardener, thank you for giving me one more year. Nourish my roots with your grace and let my life bear fruit for your Church. Amen."}),
 X({q:["Tragedies are not punishments; they are calls to conversion.","Christ pleads for us: “one more year.”","Speak the truth in love and use your gift to build up the Church."],a:"Do one thing this week to nourish your faith: Confession, Scripture or adoration.",qu:"What fruit has God been waiting for in my life?",
  il:["An illustration","After the 2018 floods in Kerala, many people asked, “Why did God allow this?” Jesus' answer is not to blame the victims, but to ask each of us: what will you change now?"],
  fam:{read:"Read together: Luke 13:6–9.",explain:"A tree gave no fruit, but the gardener asked for one more year to care for it. Jesus is patient with us and helps us grow.",intention:"We pray for people affected by disasters.",ask:"Ask: “What good fruit will our family try to give this year?”"},
  cat:[["CCC 309–314","Providence and the scandal of evil."]],ks:["Saint Anthony Mary Claret","He was a weaver in Spain, then a priest who preached everywhere, and later an archbishop in Cuba. Lesson: God can use any work to prepare us for his mission."],
  term:["Saturday memorial of Mary","On Saturdays in Ordinary Time without an obligatory memorial, the Church may celebrate a Mass of the Blessed Virgin Mary, a custom that honours Mary's faith on Holy Saturday."],tm:["Why Saturday?","Tradition says that on Holy Saturday, when the disciples were scattered, Mary alone kept faith while waiting for the Resurrection."]}),
 {homily:["Dear friends, people came to Jesus with news of a tragedy and asked: were those victims worse sinners? Jesus said no. Disasters are not God's punishments. But he said: unless you repent, you too will perish. Every tragedy is a call to look at our own lives.","Then Jesus told of a fig tree with no fruit. The owner wanted it cut down. The gardener said, “Let it alone for one more year.” That gardener is Christ, pleading for us and digging around our roots with grace.","This year is God's gift. Let us bear fruit: speak the truth in love, and use our gifts to build up his body, the Church. Amen."],
  kids:["Children, imagine a plant in your garden that never flowers. Would you throw it away at once? A good gardener gives it water and manure and waits.","Jesus is that patient gardener. He helps us grow. Let's grow good fruit today: obey, share and be kind."]});

put("2026-10-24","ml",E({t:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ആഴ്ച · ശനി",
 r:[["ഒന്നാം വായന","എഫേസോസ് 4:7–16","ക്രിസ്തുവിന്റെ ശരീരം പടുത്തുയർത്തുക"],["പ്രതിവചനസങ്കീർത്തനം","സങ്കീർത്തനം 122","സന്തോഷത്തോടെ നമുക്കു കർത്താവിന്റെ ആലയത്തിലേക്കു പോകാം"],["സുവിശേഷം","ലൂക്കാ 13:1–9","അനുതപിക്കുന്നില്ലെങ്കിൽ… ഫലം നൽകാത്ത അത്തിമരം"]],
 alt:"ഐച്ഛിക ഓർമകൾ: മെത്രാനായ വിശുദ്ധ ആന്റണി മേരി ക്ലാരറ്റ്; പരിശുദ്ധ കന്യകാമറിയത്തിന്റെ ശനിയാഴ്ചയോർമ.",
 v:"യജമാനനേ, ഈ വർഷം കൂടെ അതു നിൽക്കട്ടെ. ഞാൻ അതിന്റെ ചുവടുകിളച്ചു വളമിടാം.",c:"ലൂക്കാ 13:8",
 theo:["ഒരു ദുരന്തത്തിന്റെ വാർത്തയുമായി ആളുകൾ ഈശോയുടെ അടുക്കൽ വന്ന് ഒരു വിശദീകരണം ആവശ്യപ്പെടുന്നു: ഇരകൾ കൂടുതൽ വലിയ പാപികളായിരുന്നോ? ദുരന്തങ്ങളെ ശിക്ഷകളായി വായിക്കാൻ ഈശോ വിസമ്മതിക്കുന്നു; പക്ഷേ ചോദ്യം അവരിലേക്കുതന്നെ തിരിച്ചുവിടുന്നു: “അനുതപിക്കുന്നില്ലെങ്കിൽ നിങ്ങളെല്ലാവരും അതുപോലെ നശിക്കും.” ഓരോ ദുരന്തവും മറ്റുള്ളവരെ വിധിക്കാനല്ല, നമ്മുടെ സ്വന്തം ജീവിതം പരിശോധിക്കാനുള്ള വിളിയാണ്.","പിന്നെ മൂന്നു വർഷമായി ഫലം നൽകാത്ത അത്തിമരത്തിന്റെ ഉപമ വരുന്നു. ഉടമസ്ഥൻ അതു വെട്ടിക്കളയാൻ ആഗ്രഹിക്കുന്നു; തോട്ടക്കാരൻ അപേക്ഷിക്കുന്നു: “ഈ വർഷം കൂടെ അതു നിൽക്കട്ടെ.” നമുക്കുവേണ്ടി മാധ്യസ്ഥ്യം വഹിക്കുകയും കൃപകൊണ്ടു നമ്മുടെ വേരുകൾക്കു ചുറ്റും കിളയ്ക്കുകയും ചെയ്യുന്ന ക്രിസ്തുവിന്റെ ക്ഷമയാണിത്. സഭയിൽ ആ ഫലം എങ്ങനെയിരിക്കുമെന്നു പൗലോസ് കാണിക്കുന്നു: ഓരോ അംഗവും “ക്രിസ്തുവിന്റെ ദാനത്തിന്റെ അളവനുസരിച്ച്” നൽകപ്പെട്ട ദാനം ഉപയോഗിക്കുന്നു; “സ്നേഹത്തിൽ സത്യം പറയുന്നു”; അങ്ങനെ ശരീരം മുഴുവൻ ശിരസ്സായ ക്രിസ്തുവിലേക്കു വളരുന്നു."],
 conn:[["ഏശയ്യായുടെ മുന്തിരിത്തോട്ടം.","മുന്തിരിത്തോട്ടത്തിൽ നട്ട അത്തിമരം, തന്റെ മുന്തിരിത്തോട്ടമായ ഇസ്രായേലിൽ ദൈവം ഫലം തേടുന്ന ഏശയ്യാ 5:1–7-നെ ഓർമിപ്പിക്കുന്നു."],["സ്വർഗാരോഹണം ചെയ്ത ക്രിസ്തുവിന്റെ ദാനങ്ങൾ.","എഫേസോസ് 4:8 സങ്കീർത്തനം 68:18 ഉദ്ധരിക്കുന്നു: ഉന്നതത്തിലേക്ക് ആരോഹണം ചെയ്തപ്പോൾ അവിടുന്നു തന്റെ ജനത്തിനു ദാനങ്ങൾ നൽകി."]],
 altar:"ഓരോ കുർബാനയും തോട്ടക്കാരന്റെ “ഈ വർഷം കൂടെ” ആണ്: പിതാവിന്റെ മുമ്പിൽ ക്രിസ്തു നമുക്കുവേണ്ടി അപേക്ഷിക്കുന്നു; തന്റെ ശരീരരക്തങ്ങൾകൊണ്ടു നമ്മുടെ വേരുകളെ പോഷിപ്പിക്കുന്നു.",
 out:[["ആരംഭം","വാർത്തയിൽ അടുത്തകാലത്തുണ്ടായ ഒരു ദുരന്തം പരാമർശിക്കുക. ചോദിക്കുക: എന്തുകൊണ്ടാണ് ഇത്തരം കാര്യങ്ങൾ സംഭവിക്കുന്നത്?"],["ഒന്നാം ആശയം · ശിക്ഷയല്ല, വിളിയാണ്","ഇരകളെ കുറ്റപ്പെടുത്താൻ ഈശോ വിസമ്മതിക്കുന്നു. ദുരന്തം നമ്മെ വിധിയിലേക്കല്ല, മാനസാന്തരത്തിലേക്കു വിളിക്കുന്നു."],["രണ്ടാം ആശയം · തോട്ടക്കാരന്റെ ക്ഷമ","“ഈ വർഷം കൂടെ” എന്നു ക്രിസ്തു അപേക്ഷിക്കുന്നു. ദൈവത്തിന്റെ ക്ഷമ അനുതാപത്തിനു നൽകപ്പെട്ട സമയമാണ് (2 പത്രോ 3:9)."],["മൂന്നാം ആശയം · ശരീരത്തിൽ ഫലം നൽകുക","സ്നേഹത്തിൽ സത്യം പറയുക; സഭയെ പടുത്തുയർത്താൻ നിന്റെ ദാനം ഉപയോഗിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഈ വർഷം ദൈവത്തിന്റെ ദാനമാണ്; ഞാൻ ഫലം നൽകും.”"]],
 live:[["സ്നേഹത്തിൽ സത്യം പറയുക (എഫേസോസ് 4:15)","സത്യസന്ധമായ ഒരു കാര്യം ഇന്നു സൗമ്യമായും സ്നേഹത്തോടെയും പറയുക."],["വേരുകൾക്കു ചുറ്റും കിളയ്ക്കുക (ലൂക്കാ 13:8)","ഈ ആഴ്ച നിന്റെ വിശ്വാസത്തെ പോഷിപ്പിക്കാൻ ഒരു വഴി തിരഞ്ഞെടുക്കുക: കുമ്പസാരം, തിരുവചനവായന, അല്ലെങ്കിൽ ആരാധന."]],
 fa:["വിശുദ്ധ അഗസ്റ്റിൻ","മരത്തിനു ചുറ്റും കിളയ്ക്കുന്ന തോട്ടക്കാരൻ അനുതാപത്തിന്റെ വിനയമാണെന്നും, വളം ആത്മാവിനെ ഫലപുഷ്ടിയുള്ളതാക്കുന്ന പാപത്തെപ്രതിയുള്ള ദുഃഖമാണെന്നും അദ്ദേഹം പറയുന്നു (പ്രസംഗം 110)."],
 ma:["മതബോധനഗ്രന്ഥം 309–314","ദൈവം തിന്മ അനുവദിക്കുന്നു; അതിൽനിന്നു നന്മ പുറപ്പെടുവിക്കുന്നു; അവിടുത്തെ പരിപാലനയും ക്ഷമയും മാനസാന്തരത്തിനു സമയം നൽകുന്നു. സഹനം ഒരാൾ കൂടുതൽ വലിയ പാപിയാണെന്നതിന്റെ അടയാളമല്ല."],
 sa:[["ഒക്ടോബർ 24 · വിശുദ്ധ ആന്റണി മേരി ക്ലാരറ്റ്","സ്പാനിഷ് മിഷനറിയും സാന്തിയാഗോ ദ് ക്യൂബയുടെ ആർച്ച്ബിഷപ്പും ക്ലരീഷ്യൻ സഭയുടെ സ്ഥാപകനും."],["ശനിയാഴ്ച","പരിശുദ്ധ കന്യകാമറിയത്തിന്റെ ഓർമ."]],
 p:"ക്ഷമയുള്ള തോട്ടക്കാരനായ ഈശോയേ, എനിക്ക് ഒരു വർഷംകൂടി നൽകിയതിനു നന്ദി. അങ്ങയുടെ കൃപയാൽ എന്റെ വേരുകളെ പോഷിപ്പിക്കണമേ; അങ്ങയുടെ സഭയ്ക്കായി എന്റെ ജീവിതം ഫലം നൽകട്ടെ. ആമേൻ."},true),
 X({q:["ദുരന്തങ്ങൾ ശിക്ഷകളല്ല; മാനസാന്തരത്തിലേക്കുള്ള വിളികളാണ്.","ക്രിസ്തു നമുക്കുവേണ്ടി അപേക്ഷിക്കുന്നു: “ഈ വർഷം കൂടെ.”","സ്നേഹത്തിൽ സത്യം പറയുക; സഭയെ പടുത്തുയർത്താൻ നിന്റെ ദാനം ഉപയോഗിക്കുക."],a:"നിന്റെ വിശ്വാസത്തെ പോഷിപ്പിക്കാൻ ഈ ആഴ്ച ഒന്നു ചെയ്യുക: കുമ്പസാരം, തിരുവചനം, അല്ലെങ്കിൽ ആരാധന.",qu:"എന്റെ ജീവിതത്തിൽ ദൈവം കാത്തിരിക്കുന്ന ഫലം ഏതാണ്?",
  il:["ഒരു ഉദാഹരണം","2018-ലെ കേരള വെള്ളപ്പൊക്കത്തിനുശേഷം “ദൈവം എന്തുകൊണ്ട് ഇത് അനുവദിച്ചു?” എന്നു പലരും ചോദിച്ചു. ഈശോയുടെ ഉത്തരം ഇരകളെ കുറ്റപ്പെടുത്തലല്ല; നമ്മളോരോരുത്തരോടുമുള്ള ചോദ്യമാണ്: ഇനി നീ എന്താണു മാറ്റാൻ പോകുന്നത്?"],
  fam:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 13:6–9.",explain:"ഒരു മരം ഫലം നൽകിയില്ല; പക്ഷേ അതിനെ പരിപാലിക്കാൻ തോട്ടക്കാരൻ ഒരു വർഷംകൂടി ചോദിച്ചു. ഈശോ നമ്മോടു ക്ഷമയുള്ളവനാണ്; വളരാൻ നമ്മെ സഹായിക്കുന്നു.",intention:"ദുരന്തങ്ങളാൽ ബാധിക്കപ്പെട്ടവർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ വർഷം നമ്മുടെ കുടുംബം നൽകാൻ ശ്രമിക്കുന്ന നല്ല ഫലം ഏതാണ്?”"},
  cat:[["മതബോധനഗ്രന്ഥം 309–314","ദൈവപരിപാലനയും തിന്മയുടെ ഇടർച്ചയും."]],ks:["വിശുദ്ധ ആന്റണി മേരി ക്ലാരറ്റ്","സ്പെയിനിൽ നെയ്ത്തുകാരനായിരുന്നു; പിന്നെ എല്ലായിടത്തും പ്രസംഗിച്ച വൈദികനായി; പിന്നീടു ക്യൂബയിൽ ആർച്ച്ബിഷപ്പായി. പാഠം: തന്റെ ദൗത്യത്തിനായി നമ്മെ ഒരുക്കാൻ ഏതു ജോലിയും ദൈവത്തിന് ഉപയോഗിക്കാൻ കഴിയും."],
  term:["മറിയത്തിന്റെ ശനിയാഴ്ചയോർമ","നിർബന്ധിത ഓർമയില്ലാത്ത ആണ്ടുവട്ടത്തിലെ ശനിയാഴ്ചകളിൽ പരിശുദ്ധ കന്യകാമറിയത്തിന്റെ കുർബാന സഭയ്ക്കു ചൊല്ലാം; വലിയ ശനിയാഴ്ചയിലെ മറിയത്തിന്റെ വിശ്വാസത്തെ ബഹുമാനിക്കുന്ന ഒരു ആചാരമാണിത്."],tm:["എന്തുകൊണ്ടു ശനിയാഴ്ച?","വലിയ ശനിയാഴ്ച ശിഷ്യന്മാർ ചിതറിപ്പോയപ്പോൾ ഉയിർപ്പിനായി കാത്തിരുന്നുകൊണ്ടു മറിയം മാത്രം വിശ്വാസം കാത്തുവെന്നു പാരമ്പര്യം പറയുന്നു."]}),
 {homily:["പ്രിയപ്പെട്ടവരേ, ഒരു ദുരന്തത്തിന്റെ വാർത്തയുമായി ആളുകൾ ഈശോയുടെ അടുക്കൽ വന്നു ചോദിച്ചു: ആ ഇരകൾ കൂടുതൽ വലിയ പാപികളായിരുന്നോ? അല്ല എന്ന് ഈശോ പറഞ്ഞു. ദുരന്തങ്ങൾ ദൈവത്തിന്റെ ശിക്ഷകളല്ല. പക്ഷേ അവിടുന്നു പറഞ്ഞു: അനുതപിക്കുന്നില്ലെങ്കിൽ നിങ്ങളും നശിക്കും. ഓരോ ദുരന്തവും നമ്മുടെ സ്വന്തം ജീവിതത്തിലേക്കു നോക്കാനുള്ള വിളിയാണ്.","പിന്നെ ഫലം നൽകാത്ത ഒരു അത്തിമരത്തെപ്പറ്റി ഈശോ പറഞ്ഞു. ഉടമസ്ഥൻ അതു വെട്ടിക്കളയാൻ ആഗ്രഹിച്ചു. തോട്ടക്കാരൻ പറഞ്ഞു: “ഈ വർഷം കൂടെ അതു നിൽക്കട്ടെ.” ആ തോട്ടക്കാരൻ ക്രിസ്തുവാണ്: നമുക്കുവേണ്ടി അപേക്ഷിക്കുകയും കൃപകൊണ്ടു നമ്മുടെ വേരുകൾക്കു ചുറ്റും കിളയ്ക്കുകയും ചെയ്യുന്നവൻ.","ഈ വർഷം ദൈവത്തിന്റെ ദാനമാണ്. നമുക്കു ഫലം നൽകാം: സ്നേഹത്തിൽ സത്യം പറയാം; അവിടുത്തെ ശരീരമായ സഭയെ പടുത്തുയർത്താൻ നമ്മുടെ ദാനങ്ങൾ ഉപയോഗിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങളുടെ തോട്ടത്തിൽ ഒരിക്കലും പൂക്കാത്ത ഒരു ചെടിയുണ്ടെന്നു വിചാരിക്കുക. ഉടനെ അതു വലിച്ചെറിയുമോ? ഒരു നല്ല തോട്ടക്കാരൻ അതിനു വെള്ളവും വളവും നൽകി കാത്തിരിക്കും.","ഈശോ ആ ക്ഷമയുള്ള തോട്ടക്കാരനാണ്. വളരാൻ അവിടുന്നു നമ്മെ സഹായിക്കുന്നു. ഇന്നു നമുക്കു നല്ല ഫലം നൽകാം: അനുസരിക്കുക, പങ്കുവയ്ക്കുക, ദയ കാണിക്കുക."]});

 v:"Take care! Be on your guard against all kinds of greed; for one's life does not consist in the abundance of possessions.",c:"Luke 12:15",
 theo:["The rich man in the parable is not a criminal. He works hard, plans carefully and builds bigger barns. His mistake is quieter: he talks only to himself (“I will say to my soul…”), and he forgets that his life is not his own. That very night his life is “demanded” of him. He has been rich in things and poor toward God.","Paul gives the true account of what we have: “By grace you have been saved through faith, and this is not your own doing; it is the gift of God.” The psalm says the same: “It is he that made us, and we are his.” If everything is gift, then wealth is not a barn to fill but a stewardship to share. The Church teaches the universal destination of goods: what we own is meant to serve the common good (Catechism 2402–2405)."],
 conn:[["“You fool.”","The word recalls Psalm 14:1: “Fools say in their hearts, ‘There is no God.’” The rich man is a practical atheist: he believes in God but plans as though God were not there."],["Bigger barns and Joseph's barns.","Joseph in Egypt also built storehouses, but to feed others in the famine (Genesis 41:56). The difference is not the barn but the purpose."]],
 altar:"At Mass we bring bread and wine and our offering. Nothing we hold is truly ours until we have learned to offer it.",
 out:[["Opening","Ask: what did the rich man do wrong? Let people notice he committed no crime."],["Point 1 · He talked only to himself","Count the “I” and “my” in his speech. Prayer begins when we stop talking only to ourselves."],["Point 2 · Rich toward God","Everything is gift (Ephesians 2:8). Wealth becomes holy when it is shared."],["Take-home line","“My life belongs to God; my goods are for sharing.”"]],
 live:[["Share from the barn (Luke 12:21)","Give something away this week that you have been keeping “just in case”."],["Thank the Giver (Psalm 100)","Before each meal today, pause and thank God by name."]],
 fa:["St Basil the Great","“The bread you hold back belongs to the hungry; the coat in your wardrobe belongs to the naked” (Homily on “I will pull down my barns”)."],
 ma:["Catechism 2402–2406","The goods of creation are destined for the whole human race; ownership is a stewardship to be used for the good of others."],
 sa:[["19 October · Sts John de Brébeuf, Isaac Jogues and companions","Jesuit martyrs in North America, who gave up everything to bring Christ to people who did not yet know him."],["19 October · St Paul of the Cross","Founder of the Passionists, who preached the love of Christ crucified."]],
 p:"Lord, everything I have is your gift. Free me from greed, make me rich toward you, and teach me to share as freely as you give. Amen."}),
 X({q:["The rich fool committed no crime; he simply forgot God.","Everything we have is grace, so everything is for sharing.","Be rich toward God, not only in things."],a:"Give away one thing today that you have been keeping only for yourself.",qu:"What am I storing up that God is asking me to share?",
  il:["An illustration","A man in a Gulf labour camp sends almost his entire salary home and keeps little for himself. Many Kerala families stand on such quiet generosity. That is the opposite of the rich fool."],
  fam:{read:"Read together: Luke 12:16–21.",explain:"A rich man kept everything for himself and forgot God. Jesus says: be rich toward God by sharing.",intention:"We pray for families who do not have enough today.",ask:"Ask: “What can we share with someone this week?”"},
  cat:[["CCC 2402–2406","The universal destination of goods."]],ks:["Saint Isaac Jogues","He left a comfortable life in France to tell people in North America about Jesus. Lesson: Jesus is worth more than anything we own."],
  term:["Optional memorial","A saint's day that may be celebrated or not at a weekday Mass. When it is not chosen, the Mass of the weekday is said."],tm:["Why are there so many saints?","The calendar is crowded because holiness is real. Every day the Church shows us someone who lived the Gospel."]}),
 {homily:["Dear friends, the rich man in today's parable did nothing illegal. He worked, he planned, he built bigger barns. But listen to him: “I will say to my soul…” He talks only to himself. He has forgotten that his life is a gift.","St Paul reminds us: “By grace you have been saved… it is the gift of God.” And the psalm sings: “It is he that made us, and we are his.” If everything is gift, our goods are not barns to fill but blessings to share.","This week, let us be rich toward God: share something we have been keeping, and thank him for every good thing. Amen."],
  kids:["Children, imagine you have a big box of chocolates and you keep them all for yourself. Is that fun? Jesus told a story about a man who kept everything and forgot God.","Being “rich toward God” means sharing. Share something with a friend today and say thank you to God."]});

put("2026-10-19","ml",M({t:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ആഴ്ച · തിങ്കൾ",
 r:[["ഒന്നാം വായന","എഫേസോസ് 2:1–10","കൃപയാൽ നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു"],["പ്രതിവചനസങ്കീർത്തനം","സങ്കീർത്തനം 100","കർത്താവു നമ്മെ സൃഷ്ടിച്ചു; നാം അവിടുത്തേതാണ്"],["സുവിശേഷം","ലൂക്കാ 12:13–21","ഭോഷനായ ധനികൻ"]],
 alt:"ഐച്ഛിക ഓർമകൾ: വിശുദ്ധ ജോൺ ദ് ബ്രെബ്യൂഫ്, ഐസക് ജോഗ്സ്, സഹചാരികൾ; കുരിശിന്റെ വിശുദ്ധ പൗലോസ്.",
 v:"ജാഗരൂകരായിരിക്കുവിൻ. എല്ലാ അത്യാഗ്രഹങ്ങളിലുംനിന്ന് അകന്നിരിക്കുകയും ചെയ്യുവിൻ. മനുഷ്യജീവിതം സമ്പത്തുകൊണ്ടല്ല ധന്യമാകുന്നത്.",c:"ലൂക്കാ 12:15",
 theo:["ഉപമയിലെ ധനികൻ ഒരു കുറ്റവാളിയല്ല. അവൻ കഠിനാധ്വാനം ചെയ്യുന്നു, ശ്രദ്ധയോടെ ആസൂത്രണം ചെയ്യുന്നു, വലിയ അറപ്പുരകൾ പണിയുന്നു. അവന്റെ തെറ്റ് അതിലും നിശ്ശബ്ദമാണ്: അവൻ തന്നോടുതന്നെ മാത്രം സംസാരിക്കുന്നു (“ഞാൻ എന്റെ ആത്മാവിനോടു പറയും…”); തന്റെ ജീവൻ തന്റേതല്ലെന്ന് അവൻ മറക്കുന്നു. ആ രാത്രിതന്നെ അവന്റെ ആത്മാവ് അവനിൽനിന്ന് ആവശ്യപ്പെടപ്പെടുന്നു. വസ്തുക്കളിൽ അവൻ സമ്പന്നനായിരുന്നു; ദൈവസന്നിധിയിൽ ദരിദ്രനും.","നമുക്കുള്ളതിന്റെ യഥാർഥ കണക്കു പൗലോസ് നൽകുന്നു: കൃപയാൽ വിശ്വാസംവഴി നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു; ഇതു നിങ്ങളുടെ പ്രവൃത്തിയല്ല, ദൈവത്തിന്റെ ദാനമാണ്. സങ്കീർത്തനവും അതുതന്നെ പറയുന്നു: “അവിടുന്നാണു നമ്മെ സൃഷ്ടിച്ചത്; നമ്മൾ അവിടുത്തേതാണ്.” എല്ലാം ദാനമാണെങ്കിൽ, സമ്പത്തു നിറയ്ക്കാനുള്ള അറപ്പുരയല്ല, പങ്കുവയ്ക്കാനുള്ള കാര്യസ്ഥതയാണ്. വസ്തുക്കളുടെ സാർവത്രികലക്ഷ്യം സഭ പഠിപ്പിക്കുന്നു: നമുക്കു സ്വന്തമായുള്ളതു പൊതുനന്മയ്ക്കു ശുശ്രൂഷ ചെയ്യാനുള്ളതാണ് (മതബോധനഗ്രന്ഥം 2402–2405)."],
 conn:[["“ഭോഷാ.”","ഈ വാക്കു സങ്കീർത്തനം 14:1-നെ ഓർമിപ്പിക്കുന്നു: ദൈവമില്ലെന്നു മൂഢൻ ഹൃദയത്തിൽ പറയുന്നു. ധനികൻ ഒരു പ്രായോഗികനിരീശ്വരനാണ്: അവൻ ദൈവത്തിൽ വിശ്വസിക്കുന്നു; പക്ഷേ ദൈവമില്ലാത്തതുപോലെ പദ്ധതിയിടുന്നു."],["വലിയ അറപ്പുരകളും ജോസഫിന്റെ കലവറകളും.","ഈജിപ്തിലെ ജോസഫും കലവറകൾ പണിതു; പക്ഷേ ക്ഷാമത്തിൽ മറ്റുള്ളവരെ പോറ്റാൻ (ഉൽപ 41:56). വ്യത്യാസം അറപ്പുരയിലല്ല, ലക്ഷ്യത്തിലാണ്."]],
 altar:"കുർബാനയിൽ നാം അപ്പവും വീഞ്ഞും നമ്മുടെ കാഴ്ചയും കൊണ്ടുവരുന്നു. സമർപ്പിക്കാൻ പഠിക്കുംവരെ നമ്മുടെ കൈവശമുള്ള ഒന്നും യഥാർഥത്തിൽ നമ്മുടേതല്ല.",
 out:[["ആരംഭം","ചോദിക്കുക: ധനികൻ ചെയ്ത തെറ്റ് എന്ത്? അവൻ ഒരു കുറ്റകൃത്യവും ചെയ്തില്ലെന്ന് ആളുകൾ ശ്രദ്ധിക്കട്ടെ."],["ഒന്നാം ആശയം · അവൻ തന്നോടുതന്നെ മാത്രം സംസാരിച്ചു","അവന്റെ വാക്കുകളിലെ “ഞാൻ”, “എന്റെ” എന്നിവ എണ്ണുക. നമ്മോടുതന്നെ മാത്രം സംസാരിക്കുന്നതു നിർത്തുമ്പോഴാണു പ്രാർഥന ആരംഭിക്കുന്നത്."],["രണ്ടാം ആശയം · ദൈവസന്നിധിയിൽ സമ്പന്നൻ","എല്ലാം ദാനമാണ് (എഫേ 2:8). പങ്കുവയ്ക്കുമ്പോൾ സമ്പത്തു വിശുദ്ധമാകുന്നു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“എന്റെ ജീവിതം ദൈവത്തിന്റേതാണ്; എന്റെ സമ്പത്തു പങ്കുവയ്ക്കാനുള്ളതാണ്.”"]],
 live:[["അറപ്പുരയിൽനിന്നു പങ്കുവയ്ക്കുക (ലൂക്കാ 12:21)","“ഒരുപക്ഷേ ആവശ്യം വന്നാലോ” എന്നു കരുതി സൂക്ഷിച്ചുവച്ചിരിക്കുന്ന ഒന്ന് ഈ ആഴ്ച കൊടുക്കുക."],["ദാതാവിനു നന്ദി പറയുക (സങ്കീർത്തനം 100)","ഇന്ന് ഓരോ ഭക്ഷണത്തിനു മുമ്പും ഒരു നിമിഷം നിന്നു ദൈവത്തിനു നന്ദി പറയുക."]],
 fa:["മഹാനായ വിശുദ്ധ ബേസിൽ","“നീ പിടിച്ചുവയ്ക്കുന്ന അപ്പം വിശക്കുന്നവന്റേതാണ്; നിന്റെ അലമാരയിലെ മേലങ്കി നഗ്നന്റേതാണ്” (“ഞാൻ എന്റെ അറപ്പുരകൾ പൊളിക്കും” എന്നതിനെപ്പറ്റിയുള്ള പ്രസംഗം)."],
 ma:["മതബോധനഗ്രന്ഥം 2402–2406","സൃഷ്ടിയിലെ വസ്തുക്കൾ മനുഷ്യവംശം മുഴുവനുംവേണ്ടിയുള്ളതാണ്; ഉടമസ്ഥത മറ്റുള്ളവരുടെ നന്മയ്ക്കായി ഉപയോഗിക്കേണ്ട കാര്യസ്ഥതയാണ്."],
 sa:[["ഒക്ടോബർ 19 · വിശുദ്ധ ജോൺ ദ് ബ്രെബ്യൂഫും ഐസക് ജോഗ്സും സഹചാരികളും","ക്രിസ്തുവിനെ ഇനിയും അറിയാത്ത ജനങ്ങളിലേക്ക് അവിടുത്തെ എത്തിക്കാൻ എല്ലാം ഉപേക്ഷിച്ച, വടക്കേ അമേരിക്കയിലെ ഈശോസഭാ രക്തസാക്ഷികൾ."],["ഒക്ടോബർ 19 · കുരിശിന്റെ വിശുദ്ധ പൗലോസ്","ക്രൂശിതനായ ക്രിസ്തുവിന്റെ സ്നേഹം പ്രസംഗിച്ച പാഷനിസ്റ്റ് സഭയുടെ സ്ഥാപകൻ."]],
 p:"കർത്താവേ, എനിക്കുള്ളതെല്ലാം അങ്ങയുടെ ദാനമാണ്. അത്യാഗ്രഹത്തിൽനിന്ന് എന്നെ സ്വതന്ത്രനാക്കണമേ; അങ്ങയുടെ സന്നിധിയിൽ എന്നെ സമ്പന്നനാക്കണമേ; അങ്ങു നൽകുന്നതുപോലെ ഉദാരമായി പങ്കുവയ്ക്കാൻ എന്നെ പഠിപ്പിക്കണമേ. ആമേൻ."}),
 X({q:["ഭോഷനായ ധനികൻ ഒരു കുറ്റവും ചെയ്തില്ല; അവൻ ദൈവത്തെ മറന്നു എന്നു മാത്രം.","നമുക്കുള്ളതെല്ലാം കൃപയാണ്; അതുകൊണ്ട് എല്ലാം പങ്കുവയ്ക്കാനുള്ളതാണ്.","വസ്തുക്കളിൽ മാത്രമല്ല, ദൈവസന്നിധിയിൽ സമ്പന്നനാകുക."],a:"നിനക്കുവേണ്ടി മാത്രം സൂക്ഷിച്ചുവച്ചിരിക്കുന്ന ഒന്ന് ഇന്നു കൊടുക്കുക.",qu:"പങ്കുവയ്ക്കാൻ ദൈവം ആവശ്യപ്പെടുന്ന എന്താണു ഞാൻ സംഭരിച്ചുവയ്ക്കുന്നത്?",
  il:["ഒരു ഉദാഹരണം","ഗൾഫിലെ ഒരു ലേബർ ക്യാമ്പിലുള്ള ഒരാൾ തന്റെ ശമ്പളത്തിന്റെ ഏതാണ്ടു മുഴുവനും വീട്ടിലേക്ക് അയയ്ക്കുന്നു; തനിക്കായി കുറച്ചേ വയ്ക്കുന്നുള്ളൂ. അത്തരം നിശ്ശബ്ദമായ ഉദാരതയിലാണു പല കേരളകുടുംബങ്ങളും നിലനിൽക്കുന്നത്. ഭോഷനായ ധനികന്റെ വിപരീതമാണത്."],
  fam:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 12:16–21.",explain:"ഒരു ധനികൻ എല്ലാം തനിക്കുവേണ്ടി സൂക്ഷിച്ചുവച്ചു; ദൈവത്തെ മറന്നു. ഈശോ പറയുന്നു: പങ്കുവച്ചുകൊണ്ടു ദൈവസന്നിധിയിൽ സമ്പന്നരാകുക.",intention:"ഇന്ന് ആവശ്യത്തിനില്ലാത്ത കുടുംബങ്ങൾക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമുക്ക് ആരുമായി എന്തു പങ്കുവയ്ക്കാം?”"},
  cat:[["മതബോധനഗ്രന്ഥം 2402–2406","വസ്തുക്കളുടെ സാർവത്രികലക്ഷ്യം."]],ks:["വിശുദ്ധ ഐസക് ജോഗ്സ്","വടക്കേ അമേരിക്കയിലെ ആളുകളോട് ഈശോയെപ്പറ്റി പറയാൻ അദ്ദേഹം ഫ്രാൻസിലെ സുഖജീവിതം ഉപേക്ഷിച്ചു. പാഠം: നമുക്കുള്ള എന്തിനെക്കാളും വിലയുള്ളവനാണ് ഈശോ."],
  term:["ഐച്ഛിക ഓർമ","വാരദിനകുർബാനയിൽ ആഘോഷിക്കുകയോ ആഘോഷിക്കാതിരിക്കുകയോ ചെയ്യാവുന്ന ഒരു വിശുദ്ധന്റെ ദിനം. അതു തിരഞ്ഞെടുക്കാത്തപ്പോൾ വാരദിനത്തിന്റെ കുർബാന അർപ്പിക്കുന്നു."],tm:["എന്തുകൊണ്ട് ഇത്രയധികം വിശുദ്ധർ?","വിശുദ്ധി യാഥാർഥ്യമായതുകൊണ്ടാണു കലണ്ടർ നിറഞ്ഞിരിക്കുന്നത്. സുവിശേഷം ജീവിച്ച ഒരാളെ ഓരോ ദിവസവും സഭ നമുക്കു കാണിച്ചുതരുന്നു."]}),
 {homily:["പ്രിയപ്പെട്ടവരേ, ഇന്നത്തെ ഉപമയിലെ ധനികൻ നിയമവിരുദ്ധമായി ഒന്നും ചെയ്തില്ല. അവൻ അധ്വാനിച്ചു, ആസൂത്രണം ചെയ്തു, വലിയ അറപ്പുരകൾ പണിതു. പക്ഷേ അവനെ കേൾക്കൂ: “ഞാൻ എന്റെ ആത്മാവിനോടു പറയും…” അവൻ തന്നോടുതന്നെ മാത്രം സംസാരിക്കുന്നു. തന്റെ ജീവിതം ഒരു ദാനമാണെന്ന് അവൻ മറന്നുപോയി.","വിശുദ്ധ പൗലോസ് നമ്മെ ഓർമിപ്പിക്കുന്നു: കൃപയാൽ നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു; അതു ദൈവത്തിന്റെ ദാനമാണ്. സങ്കീർത്തനം പാടുന്നു: “അവിടുന്നാണു നമ്മെ സൃഷ്ടിച്ചത്; നമ്മൾ അവിടുത്തേതാണ്.” എല്ലാം ദാനമാണെങ്കിൽ നമ്മുടെ സമ്പത്തു നിറയ്ക്കാനുള്ള അറപ്പുരകളല്ല, പങ്കുവയ്ക്കാനുള്ള അനുഗ്രഹങ്ങളാണ്.","ഈ ആഴ്ച ദൈവസന്നിധിയിൽ സമ്പന്നരാകാം: സൂക്ഷിച്ചുവച്ചിരിക്കുന്ന എന്തെങ്കിലും പങ്കുവയ്ക്കാം; എല്ലാ നന്മകൾക്കും അവിടുത്തേക്കു നന്ദി പറയാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങൾക്ക് ഒരു വലിയ പെട്ടി ചോക്ലേറ്റ് കിട്ടിയെന്നു വിചാരിക്കുക; എല്ലാം നിങ്ങൾ തനിയെ തിന്നുന്നു. അതു രസമാണോ? എല്ലാം തനിക്കായി സൂക്ഷിച്ച് ദൈവത്തെ മറന്ന ഒരാളെപ്പറ്റി ഈശോ ഒരു കഥ പറഞ്ഞു.","“ദൈവസന്നിധിയിൽ സമ്പന്നനാകുക” എന്നാൽ പങ്കുവയ്ക്കുക എന്നാണ്. ഇന്ന് ഒരു കൂട്ടുകാരനുമായി എന്തെങ്കിലും പങ്കുവയ്ക്കുക; ദൈവത്തിനു നന്ദി പറയുക."]});

put("2026-10-20","en",E({t:"Tuesday of the Twenty-ninth Week in Ordinary Time",
 r:[["First Reading","Ephesians 2:12–22","He is our peace"],["Responsorial Psalm","Psalm 85","The Lord speaks peace to his people"],["Gospel","Luke 12:35–38","Blessed are the servants the master finds awake"]],
 v:"Blessed are those slaves whom the master finds alert when he comes; truly I tell you, he will fasten his belt and have them sit down to eat, and he will come and serve them.",c:"Luke 12:37",
 theo:["Today's Gospel contains one of the most astonishing sentences in Scripture. The master returns, finds his servants awake, and then he puts on an apron, seats them at table and serves them himself. In the ancient world no master did this. Jesus did, at the Last Supper, when he washed the disciples' feet (John 13:4–5). The God we wait for is a God who serves.","Paul shows what this serving Lord has done: he has broken down “the dividing wall of hostility” between Jew and Gentile, making “one new humanity” and building us into “a dwelling place for God”. Waiting for the Lord is not idle. It means keeping our lamps lit and building peace in the household of God, where no one is a stranger."],
 conn:[["Belts and lamps.","“Be dressed for action and have your lamps lit” recalls the first Passover night, eaten “with your loins girded” (Exodus 12:11). The Christian life is a Passover vigil."],["The cornerstone.","Ephesians 2:20 takes up Psalm 118:22 and Isaiah 28:16: the rejected stone has become the cornerstone."]],
 altar:"At every Mass the Lord does what he promised in today's Gospel: he seats us at his table and serves us himself.",
 out:[["Opening","Ask: who serves whom at your family's table?"],["Point 1 · The master who serves","Unpack Luke 12:37 and link it to the washing of the feet."],["Point 2 · No more strangers","Christ is our peace; the Church is a household where walls come down."],["Take-home line","“Lord, keep my lamp lit and my hands ready to serve.”"]],
 live:[["Serve at table (Luke 12:37)","Serve someone at a meal today, especially someone who usually serves you."],["Break one wall (Ephesians 2:14)","Make the first move toward someone you have been avoiding."]],
 fa:["St Augustine","Commenting on the servant parables, he says that the Lord's coming is hidden so that every day may be lived as if it were the last (Sermon 39)."],
 ma:["Catechism 1337–1340","At the Last Supper Christ gave himself as food and, washing the disciples' feet, showed that the Eucharist is the sacrament of love and service."],
 sa:[["Today","No memorial is assigned in the Roman calendar."]],
 p:"Lord Jesus, you come to serve us at your table. Keep me awake and ready, and make me a builder of peace in your household. Amen."}),
 X({q:["The Lord we wait for comes to serve us.","Christ is our peace: walls of hostility come down in him.","Keep the lamp lit: the Christian life is a vigil."],a:"Serve someone at a meal today.",qu:"Which wall in my life is Christ asking me to break down?",
  il:["An illustration","At a wedding in Kerala, sometimes the bridegroom's father serves the guests himself. People never forget it. Jesus promises to do that for us."],
  fam:{read:"Read together: Luke 12:35–37.",explain:"Jesus says: be ready for me like servants waiting with lamps. And when he comes, he will serve us!",intention:"We pray for peace in our family and our neighbourhood.",ask:"Ask: “How can each of us serve someone at home tomorrow?”"},
  cat:[["CCC 1337","The Eucharist and the washing of the feet."]],ks:["Saint Martin de Porres","A humble Dominican brother in Peru who loved to serve the sick and the poor, and even animals. Lesson: serving others is serving Jesus."],
  term:["Responsorial Psalm","The psalm sung after the first reading, with the people repeating a response. It is God's word answering God's word, and it helps us pray what we have heard."],tm:["Why sing the psalm?","The psalms are the prayer book Jesus himself used. Singing them unites us with his prayer."]}),
 {homily:["Dear friends, today's Gospel has a surprise. The master comes home, finds his servants awake, and then he puts on an apron, seats them at the table and serves them himself. Which master does that? Only Jesus, who washed his disciples' feet.","St Paul says this same Jesus is our peace: he has broken down the walls between peoples and made us one household of God.","So let us keep our lamps lit, and let us serve one another as he serves us. At this altar he is about to serve us again. Amen."],
  kids:["Children, who serves food at home? Amma or Appa. Can you imagine a king serving food to his servants? Jesus says he will do that for us!","Today, be like Jesus: serve someone at home. Bring a glass of water, set the table, help clear up."]});

put("2026-10-20","ml",M({t:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ആഴ്ച · ചൊവ്വ",
 r:[["ഒന്നാം വായന","എഫേസോസ് 2:12–22","അവിടുന്നാണു നമ്മുടെ സമാധാനം"],["പ്രതിവചനസങ്കീർത്തനം","സങ്കീർത്തനം 85","കർത്താവു തന്റെ ജനത്തോടു സമാധാനം അരുളുന്നു"],["സുവിശേഷം","ലൂക്കാ 12:35–38","ഉണർന്നിരിക്കുന്ന ഭൃത്യന്മാർ ഭാഗ്യവാന്മാർ"]],
 v:"യജമാനൻ വരുമ്പോൾ ഉണർന്നിരിക്കുന്നവരായി കാണുന്ന ഭൃത്യൻമാർ ഭാഗ്യവാൻമാർ. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവൻ അരമുറുക്കി അവരെ ഭക്ഷണത്തിനിരുത്തുകയും അടുത്തുചെന്ന് അവരെ പരിചരിക്കുകയും ചെയ്യും.",c:"ലൂക്കാ 12:37",
 theo:["തിരുലിഖിതത്തിലെ ഏറ്റവും അദ്ഭുതകരമായ വാക്യങ്ങളിലൊന്ന് ഇന്നത്തെ സുവിശേഷത്തിലുണ്ട്. യജമാനൻ മടങ്ങിവരുന്നു; ഭൃത്യന്മാരെ ഉണർന്നിരിക്കുന്നവരായി കാണുന്നു; പിന്നെ അവൻ അരമുറുക്കി അവരെ ഭക്ഷണത്തിനിരുത്തി സ്വയം പരിചരിക്കുന്നു. പുരാതനലോകത്തിൽ ഒരു യജമാനനും ഇങ്ങനെ ചെയ്തിരുന്നില്ല. അന്ത്യത്താഴത്തിൽ ശിഷ്യരുടെ കാലുകൾ കഴുകിയപ്പോൾ ഈശോ അതു ചെയ്തു (യോഹ 13:4–5). നാം കാത്തിരിക്കുന്ന ദൈവം ശുശ്രൂഷിക്കുന്ന ദൈവമാണ്.","ശുശ്രൂഷിക്കുന്ന ഈ കർത്താവ് ചെയ്തിരിക്കുന്നതു പൗലോസ് കാണിക്കുന്നു: യഹൂദർക്കും വിജാതീയർക്കും ഇടയിലെ “ശത്രുതയുടെ മധ്യഭിത്തി” അവിടുന്നു തകർത്തു; “ഒരു പുതിയ മനുഷ്യനെ” സൃഷ്ടിച്ചു; നമ്മെ “ദൈവത്തിന്റെ വാസസ്ഥലമായി” പണിതുയർത്തുന്നു. കർത്താവിനെ കാത്തിരിക്കുന്നത് അലസമായിട്ടല്ല. വിളക്കുകൾ കത്തിച്ചുവയ്ക്കുകയും, ആരും അന്യരല്ലാത്ത ദൈവഭവനത്തിൽ സമാധാനം പണിയുകയുമാണ് അതിന്റെ അർഥം."],
 conn:[["അരപ്പട്ടയും വിളക്കും.","“അരമുറുക്കിയും വിളക്കു കത്തിച്ചും ഇരിക്കുവിൻ” എന്നത്, “അരമുറുക്കി” ഭക്ഷിച്ച ആദ്യത്തെ പെസഹാരാത്രിയെ ഓർമിപ്പിക്കുന്നു (പുറ 12:11). ക്രൈസ്തവജീവിതം ഒരു പെസഹാജാഗരണമാണ്."],["മൂലക്കല്ല്.","എഫേസോസ് 2:20 സങ്കീർത്തനം 118:22-ഉം ഏശയ്യാ 28:16-ഉം ഏറ്റെടുക്കുന്നു: തിരസ്കരിക്കപ്പെട്ട കല്ലു മൂലക്കല്ലായിത്തീർന്നു."]],
 altar:"ഇന്നത്തെ സുവിശേഷത്തിൽ വാഗ്ദാനം ചെയ്തതുതന്നെ ഓരോ കുർബാനയിലും കർത്താവു ചെയ്യുന്നു: അവിടുന്നു നമ്മെ തന്റെ മേശയിലിരുത്തി സ്വയം നമ്മെ ശുശ്രൂഷിക്കുന്നു.",
 out:[["ആരംഭം","ചോദിക്കുക: നിങ്ങളുടെ കുടുംബമേശയിൽ ആര് ആരെയാണു ശുശ്രൂഷിക്കുന്നത്?"],["ഒന്നാം ആശയം · ശുശ്രൂഷിക്കുന്ന യജമാനൻ","ലൂക്കാ 12:37 വിശദീകരിച്ച് കാലുകഴുകലുമായി ബന്ധിപ്പിക്കുക."],["രണ്ടാം ആശയം · ഇനി അന്യരില്ല","ക്രിസ്തുവാണു നമ്മുടെ സമാധാനം; മതിലുകൾ തകരുന്ന ഭവനമാണു സഭ."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, എന്റെ വിളക്കു കത്തിച്ചും എന്റെ കൈകൾ ശുശ്രൂഷയ്ക്ക് ഒരുക്കിയും നിർത്തണമേ.”"]],
 live:[["മേശയിൽ ശുശ്രൂഷിക്കുക (ലൂക്കാ 12:37)","ഇന്ന് ഒരു ഭക്ഷണസമയത്ത് ഒരാളെ, പ്രത്യേകിച്ചു സാധാരണ നിന്നെ ശുശ്രൂഷിക്കുന്നവനെ, ശുശ്രൂഷിക്കുക."],["ഒരു മതിൽ തകർക്കുക (എഫേസോസ് 2:14)","ഒഴിവാക്കിവന്ന ഒരാളിലേക്ക് ആദ്യചുവടു വയ്ക്കുക."]],
 fa:["വിശുദ്ധ അഗസ്റ്റിൻ","ഭൃത്യന്മാരുടെ ഉപമകൾ വ്യാഖ്യാനിച്ച് അദ്ദേഹം പറയുന്നു: ഓരോ ദിവസവും അവസാനത്തേതെന്നപോലെ ജീവിക്കാനാണു കർത്താവിന്റെ വരവു മറഞ്ഞിരിക്കുന്നത് (പ്രസംഗം 39)."],
 ma:["മതബോധനഗ്രന്ഥം 1337–1340","അന്ത്യത്താഴത്തിൽ ക്രിസ്തു തന്നെത്തന്നെ ഭക്ഷണമായി നൽകി; ശിഷ്യരുടെ കാലുകൾ കഴുകി, ദിവ്യകാരുണ്യം സ്നേഹത്തിന്റെയും ശുശ്രൂഷയുടെയും കൂദാശയാണെന്നു കാണിച്ചു."],
 sa:[["ഇന്ന്","റോമൻ കലണ്ടറിൽ ഇന്ന് ഓർമയൊന്നും നിശ്ചയിച്ചിട്ടില്ല."]],
 p:"ഈശോയേ, അങ്ങയുടെ മേശയിൽ ഞങ്ങളെ ശുശ്രൂഷിക്കാൻ അങ്ങു വരുന്നു. എന്നെ ഉണർന്നിരിക്കുന്നവനും ഒരുങ്ങിയിരിക്കുന്നവനുമാക്കണമേ; അങ്ങയുടെ ഭവനത്തിൽ സമാധാനം പണിയുന്നവനാക്കണമേ. ആമേൻ."}),
 X({q:["നാം കാത്തിരിക്കുന്ന കർത്താവു നമ്മെ ശുശ്രൂഷിക്കാനാണു വരുന്നത്.","ക്രിസ്തുവാണു നമ്മുടെ സമാധാനം: അവിടുന്നിൽ ശത്രുതയുടെ മതിലുകൾ തകരുന്നു.","വിളക്കു കത്തിച്ചുവയ്ക്കുക: ക്രൈസ്തവജീവിതം ഒരു ജാഗരണമാണ്."],a:"ഇന്ന് ഒരു ഭക്ഷണസമയത്ത് ഒരാളെ ശുശ്രൂഷിക്കുക.",qu:"എന്റെ ജീവിതത്തിലെ ഏതു മതിൽ തകർക്കാനാണു ക്രിസ്തു എന്നോട് ആവശ്യപ്പെടുന്നത്?",
  il:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഒരു വിവാഹത്തിൽ ചിലപ്പോൾ വരന്റെ പിതാവുതന്നെ അതിഥികൾക്കു വിളമ്പുന്നു. ആളുകൾ അത് ഒരിക്കലും മറക്കുന്നില്ല. ഈശോ നമുക്കുവേണ്ടി അതു ചെയ്യുമെന്നു വാഗ്ദാനം ചെയ്യുന്നു."],
  fam:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 12:35–37.",explain:"വിളക്കുമായി കാത്തിരിക്കുന്ന ഭൃത്യന്മാരെപ്പോലെ തനിക്കായി ഒരുങ്ങിയിരിക്കാൻ ഈശോ പറയുന്നു. അവിടുന്നു വരുമ്പോൾ നമ്മെ ശുശ്രൂഷിക്കും!",intention:"നമ്മുടെ കുടുംബത്തിലും അയൽപക്കത്തിലും സമാധാനത്തിനായി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നാളെ വീട്ടിൽ നമ്മളോരോരുത്തരും ആരെ എങ്ങനെ ശുശ്രൂഷിക്കും?”"},
  cat:[["മതബോധനഗ്രന്ഥം 1337","ദിവ്യകാരുണ്യവും കാലുകഴുകലും."]],ks:["വിശുദ്ധ മാർട്ടിൻ ദ് പോറസ്","പെറുവിലെ വിനീതനായ ഒരു ഡൊമിനിക്കൻ സന്യാസസഹോദരൻ; രോഗികളെയും ദരിദ്രരെയും, മൃഗങ്ങളെപ്പോലും, ശുശ്രൂഷിക്കാൻ അദ്ദേഹം ഇഷ്ടപ്പെട്ടു. പാഠം: മറ്റുള്ളവരെ ശുശ്രൂഷിക്കുന്നത് ഈശോയെ ശുശ്രൂഷിക്കലാണ്."],
  term:["പ്രതിവചനസങ്കീർത്തനം","ഒന്നാം വായനയ്ക്കുശേഷം, ജനം ഒരു പ്രത്യുത്തരം ആവർത്തിച്ചുകൊണ്ടു പാടുന്ന സങ്കീർത്തനം. ദൈവവചനത്തിനുള്ള ദൈവവചനത്തിന്റെ ഉത്തരമാണത്; കേട്ടതു പ്രാർഥിക്കാൻ അതു നമ്മെ സഹായിക്കുന്നു."],tm:["സങ്കീർത്തനം പാടുന്നത് എന്തുകൊണ്ട്?","ഈശോതന്നെ ഉപയോഗിച്ച പ്രാർഥനാപുസ്തകമാണു സങ്കീർത്തനങ്ങൾ. അവ പാടുന്നത് അവിടുത്തെ പ്രാർഥനയോടു നമ്മെ ഒന്നിപ്പിക്കുന്നു."]}),
 {homily:["പ്രിയപ്പെട്ടവരേ, ഇന്നത്തെ സുവിശേഷത്തിൽ ഒരു അദ്ഭുതമുണ്ട്. യജമാനൻ വീട്ടിൽ വരുന്നു; ഭൃത്യന്മാരെ ഉണർന്നിരിക്കുന്നവരായി കാണുന്നു; പിന്നെ അരമുറുക്കി അവരെ മേശയിലിരുത്തി സ്വയം പരിചരിക്കുന്നു. ഏതു യജമാനനാണ് അങ്ങനെ ചെയ്യുന്നത്? ശിഷ്യരുടെ കാലുകൾ കഴുകിയ ഈശോ മാത്രം.","ഇതേ ഈശോയാണു നമ്മുടെ സമാധാനമെന്നു വിശുദ്ധ പൗലോസ് പറയുന്നു: ജനങ്ങൾക്കിടയിലെ മതിലുകൾ അവിടുന്നു തകർത്തു; നമ്മെ ദൈവത്തിന്റെ ഒരു ഭവനമാക്കി.","അതുകൊണ്ടു നമ്മുടെ വിളക്കുകൾ കത്തിച്ചുവയ്ക്കാം; അവിടുന്നു നമ്മെ ശുശ്രൂഷിക്കുന്നതുപോലെ നമുക്കു പരസ്പരം ശുശ്രൂഷിക്കാം. ഈ ബലിപീഠത്തിൽ അവിടുന്നു വീണ്ടും നമ്മെ ശുശ്രൂഷിക്കാൻ പോകുന്നു. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, വീട്ടിൽ ആരാണു ഭക്ഷണം വിളമ്പുന്നത്? അമ്മയോ അപ്പയോ. ഒരു രാജാവു തന്റെ ഭൃത്യന്മാർക്കു ഭക്ഷണം വിളമ്പുന്നതു സങ്കൽപിക്കാമോ? നമുക്കുവേണ്ടി താൻ അതു ചെയ്യുമെന്ന് ഈശോ പറയുന്നു!","ഇന്ന് ഈശോയെപ്പോലെയാകുക: വീട്ടിൽ ഒരാളെ ശുശ്രൂഷിക്കുക. ഒരു ഗ്ലാസ് വെള്ളം കൊണ്ടുവരുക, മേശ ഒരുക്കുക, വൃത്തിയാക്കാൻ സഹായിക്കുക."]});
})();

"2026-01-05":{"t":["Second Monday of Nativity"],"g":[{"h":"","r":[["1 Jn 5:1-5","Those who believe in Jesus are sons of God"],["Jn 5:19-23","The Son who does the works of the Father SEASON OF EPIPHANY (DENHA) The Syriac word Denaha has several meanings like dawn, manifestation, epiphany and revelation. In the season of epiphany we commemorate, the manifestation that began during the Baptism of Jesus at river Jordan. Jesus reveals Himself to the world, and the Father and the Holy Spirit give witness to it. “This is my beloved Son, with whom I am well pleased” (Mt. 3:17). The Mystery of Holy Trinity is revealed at the baptism of Jesus Christ. The Lord's Epiphany that is celebrated on 6th January, is called “feast of pindikuthi” in the northern region of Kerala and “feast of rakkuli” in the southern region. The expression, “the feast of pindikuthi” is derived from the practice of lighting wicks around the stem of plantain tree, by making procession around it shouting el payya (God is Light), to honour and praise Christ who is ‘the Light of the world'. The other name, ‘rakkuli' is derived from the practice of taking bath (ritual bath) in the nearby river or pond, on the eve of this feast, by our ancestors as reminder of the Baptism of Jesus Christ at river Jordan. It was completely a religious rite."]]},{"h":"All the readings of this season of Epiphany that commemorate the","r":[]},{"h":"public life of Christ, lead us to the personality of Christ. The election","r":[]},{"h":"of the apostles, as an important event of the public life, is also a","r":[]},{"h":"subject matter of meditation of the season of Epiphany. During this","r":[]},{"h":"season the Church teaches us that Christ, the Lamb of God who takes","r":[]},{"h":"away the sin, has come to find the sinners and, the salvation and the","r":[]},{"h":"forgiveness of sin are through Christ, the Son of God. Through the","r":[]},{"h":"readings of this season, we receive the knowledge and experience that","r":[]},{"h":"Jesus is the Fulfilment of the law, the Bread of life and the Merciful","r":[]},{"h":"and Good shepherd who send the apostles to the sheep who have no","r":[]},{"h":"shepherds.","r":[]},{"h":"On the Fridays of this season, the Church commemorates the","r":[]},{"h":"saints who have witnessed Jesus Christ and His redemptive Mysteries","r":[]},{"h":"through their lives. On the first Friday of this season, the Church","r":[]},{"h":"commemorates St. John the Baptist, who experienced the glory of","r":[]},{"h":"Jesus, even when he was in the maternal womb and who received the","r":[]},{"h":"testimony of the glory of revelation from heaven at the Baptism of","r":[]},{"h":"Jesus. On the following Fridays, the Church remembers the saints who","r":[]},{"h":"bore great witness to the life of Jesus Christ: Saint Peter and Saint","r":[]},{"h":"Paul, the Evangelists, Saint Stephan, the Greek and the Syriac Fathers","r":[]},{"h":"of the Church, the Patron saint of the parish. The last Friday of the","r":[]},{"h":"season of Epiphany is the Day of remembrance of All the Departed","r":[]},{"h":"Souls who are in the hope of Resurrection.","r":[]},{"h":"Since there should be seven weeks for the season of Great Fast","r":[]},{"h":"before the Feast of Easter, the number of the weeks in the season","r":[]},{"h":"of Epiphany may be differed. Another particularity of this season is","r":[]},{"h":"the observance of the Three Days Fast, the Rogation of Ninivites; the","r":[]},{"h":"Three Days Fast start eighteen days before the beginning of Great Fast","r":[]},{"h":"which is filled with the grace of repentance.","r":[]},{"h":"Together with the commemoration of Baptism of Jesus, this season","r":[]},{"h":"reminds each Christian to think deeply about his or her reception","r":[]},{"h":"of Baptism that made him/her the ‘son/daughter of God' and the","r":[]},{"h":"responsibilities taken up through it. Thus, the season of Epiphany is","r":[]},{"h":"the time to make attempt to love Jesus passionately by knowing Him,","r":[]},{"h":"by living in Him and by bearing witness to Him.","r":[]}]},

ho throw","r":[]},{"h":"away the dirty mantle of sin can follow Christ. The Church teaches","r":[]},{"h":"that our sanctification is God's will and our sanctification is possible","r":[]},{"h":"only through Jesus Christ who offered His life – the Body and Blood –","r":[]},{"h":"for us to the Father.","r":[]},{"h":"Our body tempts us to do the undesired evil, but to live without","r":[]},{"h":"sinning is a great suffering. The season of Great Fast demands us to","r":[]},{"h":"suffer for the sanctification of our whole life. The sufferings that we","r":[]},{"h":"face and the sacrifices we do help us to grow in faith and to get united","r":[]},{"h":"with Christ. The Church teaches us that only when we stay together","r":[]},{"h":"faithfully to the sufferings of Christ, we can enter into the joy and","r":[]},{"h":"peace of the Resurrection of Christ.","r":[]}]},

"2026-05-23":{"t":["Seventh Saturday of Resurrection"],"g":[{"h":"","r":[["2 Cor 1: 17-22","Jesus Christ has given us His Spirit"],["Lk 11:5-13","The Holy Spirit will be given to those who ask SEASON OF THE APOSTLES (ŠLEEHE) The seven weeks from the feast of Pentecost are known as the season of the Apostles. During this season, Church invites our attention to the gift of Holy Spirit, the gifts and fruits of the Holy Spirit. The feast of Pentecost has an inevitable relation with the salvation history. In the Old Testament we read that the Israelites had celebrated the feast of Pentecost in connection with harvesting season. The term pentecost means fifty – feast on the fiftieth day. It was also the feast of offering of first fruits in connection with harvesting. But later on, this feast turned out to be the commemoration of Israelites becoming God's people by His covenant. In the New Testament, a ‘new' meaning was given to this feast. It is on the fiftieth day after the Resurrection, the Holy Spirit descended on the Apostles. It was on that day the ‘Church – Ecclesia' was officially inaugurated. It is after the Pentecost that the apostles who were filled with the Holy Spirit, went to the extremities of the world with the message of the New Covenant and laid foundations to different church communities. The Syriac term sleeha means ‘one who is sent'. This liturgical season reminds us the fact that all those who have received"]]},{"h":"Baptism and Anointing are ‘apostles', ‘who are sent'.","r":[]},{"h":"The first Friday of this season is called ‘Golden Friday'. The cure","r":[]},{"h":"that the paralytic received in the Name Jesus, is a guarantee that","r":[]},{"h":"whatever we ask in the Name of Jesus, will be granted.","r":[]},{"h":"It is the responsibility of God's people to proclaim the message of","r":[]},{"h":"salvation to the entire world by being filled with the Holy Spirit. This","r":[]},{"h":"season inspires us to be missionaries like the apostles. The declaration","r":[]},{"h":"of St. Thomas, the Apostle, who is sent by Christ, ‘Let us go and die","r":[]},{"h":"with Him' is an invitation to all of us who are believers. This season","r":[]},{"h":"reveals the God who protects those who are sent.","r":[]},{"h":"It reminds the responsibility to live a life, centred on Word of God,","r":[]},{"h":"by those who are sent to proclaim the Good News. It also emphasises","r":[]},{"h":"the necessity to bear witness fearlessly to God who is the Word. It is","r":[]},{"h":"when a grain of wheat falls to the ground and dies, it will produce","r":[]},{"h":"fruit. Therefore, Jesus reminds us to do the mission courageously and","r":[]},{"h":"that we gain eternal life through the suffering. The primary mission","r":[]},{"h":"of all the Christians is to give witness to Christ in any situations.","r":[]},{"h":"The Holy Spirit, the Helper sent by the Father, lives in all the","r":[]},{"h":"baptised individuals and showers His graces and fruits. The assistance","r":[]},{"h":"of the Holy Spirit is essential to remember all that is taught by Christ","r":[]},{"h":"and to obey His commandments in every moment of life. This season","r":[]},{"h":"reminds also that if we lose God's Spirit by sinning, the consequence","r":[]},{"h":"will be utter destruction.","r":[]},{"h":"We shall partake in the communion and unity of the apostles who","r":[]},{"h":"established new ecclesial communities with the message of the Master","r":[]},{"h":"by travelling all over the world. Holding fast the truth that we are the","r":[]},{"h":"temple of the Holy Spirit and with His continuous assistance, let us","r":[]},{"h":"proclaim Christ as the Apostles did.","r":[]}]},

"2026-08-29":{"t":["The Seventh Saturday of Kaitha"],"g":[{"h":"","r":[["Philem 1:8-20","Accept him as I am"],["Mt 10:5-15","Reward in the kingdom of heaven for those who receive the disciples"]]},{"h":"Saint Euphrasia","r":[["Gen 12:1-4","God calls Abraham"],["Sir 2:1-6","Trust in the Lord"],["1 Thess 4:1-8","Life pleasing to God"],["Mk 10:35-45","The first among you must be the servant of all SEASONS OF ELIJAH-CROSS-MOSES (Ēliya-Sleeva-Mušae) The season of Elijah-Cross-Moses indicates the victory of the Cross and the second coming of the Lord. The feast of the Exaltation of the Holy Cross celebrated on the 14th of September is the focal point of this season. The first ecclesial community believed that before the second coming of Christ, Elijah would come (Mal 4:5) and will argue with the son of destruction and convince the world about his fault. This belief was grown because of the reality that Elijah was present with the Lord at the time of transfiguration. The Lord's transfiguration is the symbol of Lord's second coming. At the time of transfiguration, Moses also was with the Lord; that might be the reason that this liturgical season developed centring around the Cross. The Sunday after 14th September is considered as first Sunday of Sleeva. Till then the readings of the season of Elijah is continued. When the feast of the Exaltation of the Holy Cross falls on a Sunday, that will be the first Sunday of Sleeva. There was the belief in the first ecclesial community, what Jesus told about the sign that would appear in the sky before the second coming of Christ (Mt. 24:30), is the Cross. Therefore, the strength and the victory of the Cross are commemorated in this season. The prayers and hymns of this season include the apparition of Cross to the emperor Constantine, consequent victory and the finding of the Cross by the queen Helena, the mother of Constantine. Like Moses who showed the way to the Israelites, extending his staff on the Red sea, Christ saved the humanity by showing the way to the paradise through the Cross. During this season the Church invites us to prepare for the second coming of the Lord by assimilating the prophets of the true God and the commands and messages given through them by God, and by producing the fruits of repentance and conversion. The mother Church gives us the warning that you will perish unless you walk in the way of repentance abstaining from all evils, in the conviction that the desires of body are against the spirit. Since the day of the Lord is imminent, the Church invites us to attain the eternal life like the prudent virgins, ministering him vigilantly, and through attentiveness, faithfulness, prudence, equanimity, diligent service and continuous prayer. The bronze serpent that was raised by Moses in the Old Testament, is symbol of Jesus who was raise on the Cross to share the salvation. One who takes pride in the Name of the Lord, takes pride in the Cross, the sign of salvation, and in the sufferings. This season reminds us that all those who follow Him, who has died on the Cross and ascended into the glory of resurrection, have to bear the Cross. The readings of this season give us the conviction that it is inevitable to go through the suffering and death in order to enter into the glory. The manifestation of the glory of Christ, who has fulfilled God's will by accepting suffering and death, happened on the Cross. The Lord who will appear as the Judge at the end of the world, is the one who has seated at the right side of the Glory through His Death, Resurrection and Ascension. This season inspires the faithful to suffer with Christ who was raised by God, because He emptied himself even unto death on the Cross, in humility, to enter into glory. Death and final judgments are the themes of this Season of Moses. Jesus gives the consolation words that ‘the one who endures to the end, will be saved'. The Church teaches: bear fruits, enduring faith is fruitful, confront sufferings with faith to receive consolation and joy."]]}]},

function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return Date.UTC(y,mo-1,da)}
function adv1(y){var x=Date.UTC(y,11,25),w=new Date(x).getUTCDay();return x-(w===0?28:w+21)*DAY}
function bapt(y){var j=Date.UTC(y,0,6),w=new Date(j).getUTCDay();return j+(w===0?7:7-w)*DAY}

function latin(t){
 var d=new Date(t),y=d.getUTCFullYear(),w=d.getUTCDay(),A=adv1(y),E=easter(y),ash=E-46*DAY,pent=E+49*DAY,B=bapt(y);
 var ly=t>=A?y+1:y,cyc=["C","A","B"][ly%3],wk=ly%2?"I":"II",s,n=0,special="";
 if(t>=A&&t<Date.UTC(y,11,25)){s="adv";n=Math.floor((t-A)/(7*DAY))+1}
 else if(t>=Date.UTC(y,11,25)||t<=B){s="chr";if(d.getUTCMonth()===11&&d.getUTCDate()===25)special="xmas";if(t===B)special="bapt"}
 else if(t<ash){s="ot";n=Math.floor((t-B)/(7*DAY))+1}
 else if(t<E-7*DAY){s="lent";if(t===ash)special="ash";n=t<ash+4*DAY?0:Math.floor((t-(ash+4*DAY))/(7*DAY))+1}
 else if(t<E){s="holy";if(t===E-7*DAY)special="palm"}
 else if(t<=pent){s="east";n=Math.floor((t-E)/(7*DAY))+1;if(t===pent)special="pent"}
 else {s="ot";var ws=t-w*DAY;n=34-Math.round((A-ws)/(7*DAY))+1;if(n===34&&w===0)special="king"}
 return {s:s,n:n,w:w,cyc:cyc,wk:wk,special:special};
}
function latinLabel(L,lang){if(DI[lang])return latinLabelDI(L,lang);
 var en=lang==="en",u=UI[lang],sn=SEAS[L.s][en?0:1];
 if(L.special==="palm")return en?"Palm Sunday of the Passion of the Lord":"ഓശാന ഞായർ";
 if(L.special==="pent")return en?"Pentecost Sunday":"പന്തക്കുസ്താ ഞായർ";
 if(L.special==="bapt")return en?"The Baptism of the Lord":"കർത്താവിന്റെ മാമ്മോദീസ";
 if(L.special==="ash")return en?"Ash Wednesday":"വിഭൂതി ബുധൻ";
 if(L.special==="king")return en?"Our Lord Jesus Christ, King of the Universe":"ക്രിസ്തുരാജന്റെ തിരുനാൾ";
 if(L.special==="xmas")return en?"The Nativity of the Lord (Christmas)":"ക്രിസ്മസ് · കർത്താവിന്റെ തിരുപ്പിറവി";
 if(L.s==="chr")return sn+" · "+u.days[L.w];
 if(L.s==="holy")return sn+" · "+u.days[L.w];
 if(L.s==="lent"&&L.n===0)return en?u.days[L.w]+" after Ash Wednesday":"വിഭൂതിക്കുശേഷമുള്ള "+u.days[L.w];
 if(L.w===0)return en?(ORD_EN[L.n]+" Sunday "+(L.s==="ot"?"in Ordinary Time":"of "+sn)):(sn+" "+ORD_ML[L.n]+" ഞായർ");
 return en?(u.days[L.w]+" of the "+ORD_EN[L.n]+" Week "+(L.s==="ot"?"in Ordinary Time":"of "+sn)):(sn+" "+ORD_ML[L.n]+" ആഴ്ച · "+u.days[L.w]);
}

  about:"അനുദിന വചനത്തെപ്പറ്റി",about1:"വചനം മാത്രം കാണപ്പെടാൻവേണ്ടി പേരു വെളിപ്പെടുത്താൻ ആഗ്രഹിക്കാത്ത കേരളത്തിലെ ഒരു കത്തോലിക്കാ വൈദികനാണ് അനുദിന വചനം പ്രാർഥനാപൂർവം തയ്യാറാക്കുന്നത്. സീറോ മലബാർ, സീറോ മലങ്കര, ലത്തീൻ സഭകളുടെ ഔദ്യോഗിക ആരാധനക്രമ കലണ്ടറുകളും പി.ഒ.സി. ബൈബിളും ഇതു പിന്തുടരുന്നു.",about2:"വായനകൾ സൂചനകളായി മാത്രം നൽകുന്നു. വിചിന്തനങ്ങളും പ്രസംഗക്കുറിപ്പുകളും മൗലികമാണ്. ഞങ്ങൾക്ക് എഴുതാനോ പ്രാർഥനാനിയോഗം അയയ്ക്കാനോ ഇവിടെ ചേർക്കുന്ന ഫോം ഉപയോഗിക്കുക."}

var SX={
 sub:[["Season of Annunciation–Nativity (Subara–Yalda)","The liturgical year begins with the announcements of salvation: to Zechariah, to Mary, to Joseph. For about four weeks the Church meditates on God's promises fulfilled in the Incarnation, and then celebrates the birth of the Lord. A 25-day fast prepares for Christmas."],["മംഗളവാർത്ത–പിറവിക്കാലം (സൂബാറ–യൽദാ)","രക്ഷയുടെ മംഗളവാർത്തകളോടെ ആരാധനാവത്സരം ആരംഭിക്കുന്നു: സഖറിയായ്ക്കും മറിയത്തിനും ജോസഫിനും. ഏകദേശം നാലാഴ്ച, മനുഷ്യാവതാരത്തിൽ നിറവേറിയ ദൈവവാഗ്ദാനങ്ങളെപ്പറ്റി സഭ ധ്യാനിക്കുന്നു; പിന്നെ കർത്താവിന്റെ ജനനം ആഘോഷിക്കുന്നു. ഇരുപത്തഞ്ചു നോമ്പ് ക്രിസ്മസിന് ഒരുക്കുന്നു."]],
 den:[["Season of Epiphany (Denha)","Denha means the rising, or manifestation. Beginning with the Baptism of the Lord in the Jordan, where the Trinity is revealed, the Church contemplates Christ made known to the world. Its Fridays commemorate saints and the departed, the witnesses through whom Christ continues to be manifested."],["ദനഹാക്കാലം","ദനഹാ എന്നാൽ ഉദയം, പ്രത്യക്ഷീകരണം. പരിശുദ്ധ ത്രിത്വം വെളിപ്പെട്ട ജോർദാനിലെ മാമ്മോദീസയോടെ ആരംഭിച്ച്, ലോകത്തിനു വെളിപ്പെടുത്തപ്പെട്ട ക്രിസ്തുവിനെ സഭ ധ്യാനിക്കുന്നു. ഈ കാലത്തെ വെള്ളിയാഴ്ചകളിൽ, ക്രിസ്തു തുടർന്നും വെളിപ്പെടുന്ന സാക്ഷികളായ വിശുദ്ധരെയും മരിച്ചവരെയും ഓർക്കുന്നു."]],
 fast:[["Season of the Great Fast (Sauma Ramba)","Fifty days of prayer, fasting and almsgiving, beginning on the Monday of Ash Monday (Vibhoodi), following Christ through his fast in the desert to his Passion, death and burial. It ends with Holy Week: Hosanna Sunday, Pesaha, Good Friday and the Great Saturday."],["വലിയ നോമ്പുകാലം (സൗമാ റമ്പാ)","വിഭൂതിത്തിങ്കളാഴ്ച ആരംഭിക്കുന്ന പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും അമ്പതു ദിവസങ്ങൾ; മരുഭൂമിയിലെ ഉപവാസംമുതൽ പീഡാസഹനവും മരണവും സംസ്കാരവുംവരെ ക്രിസ്തുവിനെ പിന്തുടരുന്നു. ഓശാന ഞായർ, പെസഹാ, ദുഃഖവെള്ളി, വലിയ ശനി എന്നിവയുള്ള വിശുദ്ധവാരത്തോടെ അത് അവസാനിക്കുന്നു."]],
 qyam:[["Season of the Resurrection (Qyamtha)","Seven weeks of Easter joy. The Church celebrates the risen Lord, his appearances to the disciples, and the new life of Baptism, until the feast of Pentecost."],["ഉയിർപ്പുകാലം (ക്യംതാ)","ഈസ്റ്റർ സന്തോഷത്തിന്റെ ഏഴ് ആഴ്ചകൾ. ഉത്ഥിതനായ കർത്താവിനെയും ശിഷ്യർക്കുള്ള അവിടുത്തെ പ്രത്യക്ഷീകരണങ്ങളെയും മാമ്മോദീസയിലെ പുതുജീവനെയും പന്തക്കുസ്താവരെ സഭ ആഘോഷിക്കുന്നു."]],
 sliha:[["Season of the Apostles (Sliha)","From Pentecost, the Church remembers the coming of the Holy Spirit and the preaching of the apostles. It is the season of the Church's birth and mission, and our own apostle Thomas is honoured within it (Dukhrana, 3 July)."],["ശ്ലീഹാക്കാലം","പന്തക്കുസ്താമുതൽ, പരിശുദ്ധാത്മാവിന്റെ ആഗമനവും ശ്ലീഹന്മാരുടെ പ്രസംഗവും സഭ ഓർക്കുന്നു. സഭയുടെ ജനനത്തിന്റെയും ദൗത്യത്തിന്റെയും കാലം; നമ്മുടെ ശ്ലീഹായായ മാർ തോമായുടെ ദുക്റാനയും (ജൂലൈ 3) ഇതിനോടു ചേർന്നു വരുന്നു."]],
 qaita:[["Season of Summer (Kaitha)","Kaitha means summer, the season of fruit. The Church meditates on her growth and fruitfulness through the witness of the apostles, martyrs and saints."],["കൈത്താക്കാലം","കൈത്താ എന്നാൽ വേനൽ, ഫലങ്ങളുടെ കാലം. ശ്ലീഹന്മാരുടെയും രക്തസാക്ഷികളുടെയും വിശുദ്ധരുടെയും സാക്ഷ്യത്തിലൂടെയുള്ള സഭയുടെ വളർച്ചയെയും ഫലപുഷ്ടിയെയുംപറ്റി സഭ ധ്യാനിക്കുന്നു."]],
 esm:[["Season of Elijah–Cross–Moses","Three themes in one season. Elijah, taken up into heaven, recalls the Transfiguration and the forerunner of the Lord's coming; the Exaltation of the Cross (14 September) shows the sign of the Son of Man; and the weeks of Moses look toward the Lord's second coming and the judgement. It is the season of the Church watching for the end of history."],["ഏലിയാ–സ്ലീവാ–മൂശെക്കാലം","ഒരു കാലത്തിൽ മൂന്നു വിഷയങ്ങൾ. സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ട ഏലിയാ രൂപാന്തരീകരണത്തെയും കർത്താവിന്റെ വരവിന്റെ മുന്നോടിയെയും ഓർമിപ്പിക്കുന്നു; സ്ലീവാപ്പെരുന്നാൾ (സെപ്റ്റംബർ 14) മനുഷ്യപുത്രന്റെ അടയാളം കാണിക്കുന്നു; മൂശെയുടെ ആഴ്ചകൾ കർത്താവിന്റെ രണ്ടാം വരവിലേക്കും വിധിയിലേക്കും നോക്കുന്നു. ചരിത്രത്തിന്റെ അന്ത്യത്തിനായി ഉണർന്നിരിക്കുന്ന സഭയുടെ കാലം."]],
 qud:[["Season of the Dedication of the Church (Qudash Edtha)","The last four weeks of the year. The Church contemplates herself as the Bride presented to Christ and as the dwelling of God, and looks to her completion in the heavenly Jerusalem."],["പള്ളിക്കൂദാശക്കാലം (ഖുദാശ് ഏദ്താ)","വർഷത്തിന്റെ അവസാനത്തെ നാലാഴ്ച. ക്രിസ്തുവിനു സമർപ്പിക്കപ്പെട്ട മണവാട്ടിയായും ദൈവത്തിന്റെ വാസസ്ഥലമായും സഭ തന്നെത്തന്നെ ധ്യാനിക്കുന്നു; സ്വർഗീയ ജറുസലേമിലെ തന്റെ പൂർത്തീകരണത്തിലേക്കു നോക്കുന്നു."]],
 adv:[["Advent","Four weeks of joyful waiting for the Lord: for his coming at the end of time, and for the celebration of his birth at Christmas. Colour: violet."],["ആഗമനകാലം","കർത്താവിനായുള്ള സന്തോഷകരമായ കാത്തിരിപ്പിന്റെ നാലാഴ്ച: കാലത്തിന്റെ അന്ത്യത്തിലെ അവിടുത്തെ വരവിനായും ക്രിസ്മസിലെ അവിടുത്തെ ജനനത്തിന്റെ ആഘോഷത്തിനായും. നിറം: വയലറ്റ്."]],
 chr:[["Christmas Season","From the Nativity of the Lord to the Baptism of the Lord: the Word made flesh, the Holy Family, Mary Mother of God, and the Epiphany. Colour: white."],["ക്രിസ്മസ്കാലം","കർത്താവിന്റെ തിരുപ്പിറവിമുതൽ കർത്താവിന്റെ മാമ്മോദീസവരെ: മാംസമായ വചനം, തിരുക്കുടുംബം, ദൈവമാതാവായ മറിയം, ദനഹാ. നിറം: വെള്ള."]],
 ot:[["Ordinary Time","The numbered weeks in which the Church follows Christ's public life and teaching, Sunday by Sunday. Colour: green, the colour of growth."],["ആണ്ടുവട്ടം","ക്രിസ്തുവിന്റെ പരസ്യജീവിതവും പ്രബോധനവും ഞായറാഴ്ചതോറും സഭ പിന്തുടരുന്ന, എണ്ണമിട്ട ആഴ്ചകൾ. നിറം: വളർച്ചയുടെ നിറമായ പച്ച."]],
 lent:[["Lent","Forty days of prayer, fasting and almsgiving, from Ash Wednesday, preparing the catechumens for Baptism and all the faithful for Easter. Colour: violet."],["നോമ്പുകാലം","വിഭൂതി ബുധൻമുതൽ പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും നാൽപതു ദിവസങ്ങൾ; ജ്ഞാനസ്നാനാർഥികളെ മാമ്മോദീസയ്ക്കും എല്ലാ വിശ്വാസികളെയും ഈസ്റ്ററിനും ഒരുക്കുന്നു. നിറം: വയലറ്റ്."]],
 holy:[["Holy Week","From Palm Sunday to the Easter Triduum: the Lord's entry into Jerusalem, the Last Supper, his Passion and death, and the vigil of the Resurrection."],["വിശുദ്ധവാരം","ഓശാന ഞായർമുതൽ ഈസ്റ്റർ ത്രിദിനംവരെ: കർത്താവിന്റെ ജറുസലേം പ്രവേശനം, അന്ത്യത്താഴം, പീഡാസഹനവും മരണവും, ഉയിർപ്പിന്റെ ജാഗരണം."]],
 east:[["Easter Season","Fifty days of Easter joy, from the Resurrection to Pentecost, celebrated as one great Sunday. Colour: white."],["ഈസ്റ്റർകാലം","ഉയിർപ്പുമുതൽ പന്തക്കുസ്താവരെ, ഒരൊറ്റ മഹാ ഞായറായി ആഘോഷിക്കുന്ന ഈസ്റ്റർ സന്തോഷത്തിന്റെ അമ്പതു ദിവസങ്ങൾ. നിറം: വെള്ള."]]

var HOW={
 en:["How to use","Choose your rite and language at the top. Use ‹ › or the date box to move to any day; the page opens on today's date. The five tabs give: Lectern (readings and reflection), Homily notes (homily for Mass, children's Mass, outline), Calendar page (the week, Fathers, Church documents, saints), Family, and Know your liturgy. Tap the season name for an explanation. Search finds any date, feast, saint, Bible book or word. A− and A+ change the text size.","Bible quotations: POC Bible (Malayalam), NRSV (English), Einheitsübersetzung (German), CEI 2008 (Italian), Tiruviviliam CLT (Tamil), Hindi Catholic Bible (Hindi)."],
 ml:["ഉപയോഗിക്കേണ്ട വിധം","മുകളിൽ നിങ്ങളുടെ റീത്തും ഭാഷയും തിരഞ്ഞെടുക്കുക. ‹ › ഉപയോഗിച്ചോ തീയതിക്കള്ളി ഉപയോഗിച്ചോ ഏതു ദിവസത്തിലേക്കും പോകാം; പേജ് ഇന്നത്തെ തീയതിയിലാണു തുറക്കുന്നത്. അഞ്ചു വിഭാഗങ്ങൾ: വായനാപീഠം (വായനകളും വിചിന്തനവും), പ്രസംഗക്കുറിപ്പുകൾ (കുർബാനയ്ക്കുള്ള പ്രസംഗം, കുട്ടികളുടെ കുർബാന, രൂപരേഖ), കലണ്ടർ താൾ (ആഴ്ച, പിതാക്കന്മാർ, സഭാരേഖകൾ, വിശുദ്ധർ), കുടുംബം, ആരാധനക്രമം അറിയാൻ. വിശദീകരണത്തിനു കാലത്തിന്റെ പേരിൽ തൊടുക. ഏതു തീയതിയും തിരുനാളും വിശുദ്ധനും ബൈബിൾ പുസ്തകവും വാക്കും തിരയൽ കണ്ടെത്തും. A−, A+ അക്ഷരവലുപ്പം മാറ്റുന്നു.","ബൈബിൾ ഉദ്ധരണികൾ: പി.ഒ.സി. ബൈബിൾ (മലയാളം), NRSV (ഇംഗ്ലീഷ്), ഐൻഹൈറ്റ്സ്യൂബർസെറ്റ്സുങ് (ജർമൻ), CEI 2008 (ഇറ്റാലിയൻ), തിരുവിവിലിയം CLT (തമിഴ്), ഹിന്ദി കത്തോലിക്കാ ബൈബിൾ (ഹിന്ദി)."],
 de:["Hinweise zur Nutzung","Wählen Sie oben Ritus und Sprache. Mit ‹ › oder dem Datumsfeld gelangen Sie zu jedem Tag; die Seite öffnet sich mit dem heutigen Datum. Die fünf Bereiche: Ambo (Lesungen und Betrachtung), Predigt (Predigt für die Messe, Kinder- und Schulgottesdienst, Gliederung), Kalenderblatt (Woche, Kirchenväter, kirchliche Dokumente, Heilige), Familie und Liturgie verstehen. Tippen Sie auf den Namen der Zeit für eine Erklärung. Die Suche findet Datum, Fest, Heilige, biblisches Buch oder Stichwort. A− und A+ ändern die Schriftgröße.","Bibelzitate: Einheitsübersetzung (Deutsch); Quellen der übrigen Sprachen siehe englische Fassung."],
 it:["Come usare","Scegliete in alto il rito e la lingua. Con ‹ › o la casella della data potete andare a qualsiasi giorno; la pagina si apre sulla data di oggi. Le cinque sezioni: Ambone (letture e riflessione), Omelia (omelia per la Messa, Messa dei bambini, schema), Pagina del calendario (settimana, Padri, documenti della Chiesa, santi), Famiglia e Conoscere la liturgia. Toccate il nome del tempo liturgico per una spiegazione. La ricerca trova data, festa, santo, libro biblico o parola. A− e A+ cambiano la dimensione del testo.","Citazioni bibliche: Bibbia CEI 2008 (italiano)."],
 ta:["பயன்படுத்தும் முறை","மேலே உங்கள் வழிபாட்டு முறையையும் மொழியையும் தேர்ந்தெடுங்கள். ‹ › அல்லது தேதிப் பெட்டியைப் பயன்படுத்தி எந்த நாளுக்கும் செல்லலாம்; பக்கம் இன்றைய தேதியில் திறக்கும். ஐந்து பகுதிகள்: வாசக மேடை (வாசகங்கள், சிந்தனை), மறையுரை (திருப்பலி மறையுரை, குழந்தைகள் திருப்பலி, திட்டம்), நாள்காட்டி (வாரம், திருச்சபைத் தந்தையர், திருச்சபை ஆவணங்கள், புனிதர்கள்), குடும்பம், வழிபாட்டை அறிவோம். விளக்கத்திற்குக் காலத்தின் பெயரைத் தொடுங்கள். தேடல் எந்தத் தேதி, திருநாள், புனிதர், விவிலிய நூல் அல்லது சொல்லையும் கண்டுபிடிக்கும். A−, A+ எழுத்தின் அளவை மாற்றும்.","விவிலிய மேற்கோள்கள்: திருவிவிலியம் (பொது மொழிபெயர்ப்பு, CLT)."],
 hi:["उपयोग कैसे करें","ऊपर अपनी रीति और भाषा चुनें। ‹ › या तारीख़ के बॉक्स से किसी भी दिन पर जा सकते हैं; पृष्ठ आज की तारीख़ पर खुलता है। पाँच भाग हैं: पाठ-मंच (पाठ और मनन), प्रवचन (मिस्सा का प्रवचन, बच्चों की मिस्सा, रूपरेखा), कैलेंडर पृष्ठ (सप्ताह, कलीसिया के आचार्य, कलीसियाई दस्तावेज़, संत), परिवार, और धर्मविधि को जानें। व्याख्या के लिए ऋतु के नाम को छुएँ। खोज किसी भी तारीख़, पर्व, संत, बाइबिल ग्रंथ या शब्द को ढूँढ़ती है। A− और A+ अक्षरों का आकार बदलते हैं।","बाइबिल उद्धरण: हिन्दी काथलिक बाइबिल।"]
