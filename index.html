put("2026-11-15","en",{title:"Sunday of the Message to Zechariah",readTitle:EN.rt,
 readings:[[EN.eg,"Luke 1:1–17","The angel promises John"],[EN.ot,"Genesis 17:15–22","A son for Abraham and Sarah"],[EN.ot,"Ruth 1:11–18","Ruth's faithfulness"],[EN.ot,"1 Samuel 1:9–17","Hannah pours out her soul"],[EN.ot,"Isaiah 41:8–17","Do not fear, I am with you"],[EN.ce,"2 Peter 1:3–11","Sharers in the divine nature"],[EN.pa,"Romans 4:13–25","Abraham hoped against hope"],[EN.go,"Luke 1:5–25","The message to Zechariah in the Temple"]],
 alt:"First Sunday of the season of Annunciation (Suboro).",
 verse:"Do not be afraid, Zechariah, for your prayer has been heard. Your wife Elizabeth will bear you a son, and you will name him John.",cite:"Luke 1:13",
 theo:["The season of Suboro, the “good news”, opens not in Nazareth but in the Temple of Jerusalem, with an old priest burning incense. Zechariah and Elizabeth were “righteous before God”, yet they had no child, and they had grown old. God's first announcement in the New Testament is given to people who had prayed for years and seemed to have received no answer.","The Old Testament readings prepare us. Abraham and Sarah were given a son when it was humanly impossible; Abraham even laughed (Genesis 17:17). Hannah, barren and mocked, poured out her soul before the Lord in the sanctuary (1 Samuel 1:15) and became the mother of Samuel. Isaiah hears God say: “Do not fear, for I am with you.” The God of Israel brings life out of barrenness.","Zechariah's question is very human: “How will I know that this is so? For I am an old man.” He asks for a sign, and he receives one: silence until the promise is fulfilled. St Paul shows the opposite attitude in Abraham, who “hoping against hope… believed” and “grew strong in his faith as he gave glory to God” (Romans 4:18, 20). Faith is not certainty that we can see; it is trust that God can do what he has promised.","John's mission is to go before the Lord “with the spirit and power of Elijah… to make ready a people prepared for the Lord” (Luke 1:17). Suboro is that preparation for us: a season in which the Church, like Zechariah in the Holy Place, waits, prays and lets God speak."],
 conn:[["Barren mothers, great sons.","Sarah (Isaac), Hannah (Samuel), the wife of Manoah (Samson) and Elizabeth (John): each birth shows that the future of God's people is God's gift, not human achievement."],["The hour of incense.","Zechariah receives the message while the people pray outside at the hour of incense. In our Qurbono the incense rises with the prayers of the Church (Psalm 141:2; Revelation 8:3–4)."],["Elijah returns.","Malachi had promised that Elijah would come “to turn the hearts of parents to their children” (Malachi 4:5–6). The angel applies these words to John (Luke 1:17)."],["Ruth's “Where you go, I will go”.","Ruth's loyalty, a foreigner who becomes an ancestor of David and of Christ (Matthew 1:5), shows the faithful love that prepares the way of the Lord."]],
 altar:["Zechariah entered the sanctuary to offer incense; in every Holy Qurbono the priest does the same, and the people pray outside the veil as they did in the Temple. But we have more than Zechariah: the One whose coming he was promised now comes to the altar in his Body and Blood."],
 outline:[["Opening","Ask: have you ever prayed for something for years and thought God was not listening?"],["Point 1 · God hears late prayers","“Your prayer has been heard.” God's timing is not ours. Abraham, Hannah, Elizabeth."],["Point 2 · Zechariah's silence","His doubt is answered with silence, which becomes a school of faith. At the end his tongue is freed to praise (Luke 1:64)."],["Point 3 · Hoping against hope","Abraham's faith in Romans 4: trusting God when the facts say no."],["Point 4 · Preparing a people","John prepares hearts; Suboro prepares ours. Practical: reconciliation in families (“the hearts of parents to their children”)."],["Take-home line","“God has heard my prayer, even when I cannot see the answer.”"]],
 live:[["Keep praying (Luke 1:13)","Write down one intention you have prayed for a long time, and offer it again at this Sunday's Qurbono."],["A week of holy silence (Luke 1:20)","Choose ten minutes of silence each day this week: no phone, no television, only God."],["Turn hearts (Luke 1:17)","Take one step of reconciliation between parents and children in your family."]],
 fathers:[["St Ambrose of Milan","Commenting on Luke, he praises Zechariah and Elizabeth as righteous in both the priestly and the married life, and sees in John's birth a sign that God's grace surpasses nature (Exposition of the Gospel of Luke, Book 1)."],["St Ephrem the Syrian","He contrasts the priest who doubted with the Virgin who believed: the one who questioned was silenced, while she who believed conceived the Word (Commentary on the Diatessaron)."]],
 magis:[["Catechism 523","St John the Baptist is the Lord's immediate precursor, sent to prepare his way; “prophet of the Most High”, he surpasses all the prophets."],["Catechism 145–146","Abraham is the model of the obedience of faith; “hoping against hope”, he believed, and so became the father of all who believe."],["Lumen Fidei 8–11","Abraham's faith is trust in a God who calls and promises, and who keeps his word even when it seems impossible."]],
 saints:[["This week (fixed dates)","16 Nov: St Matthew, Apostle (Malankara commemoration). 21 Nov: the Entrance of Mary, Mother of God, into the Temple. Confirm other commemorations in the 2026–27 lectionary."]],
 prayer:"Lord God, you heard the prayer of Zechariah and Elizabeth and gave them a son to prepare the way of your Christ. Hear the prayers we have carried for so long, strengthen our faith when we cannot see, and make us a people prepared for the Lord. Amen."},
 {quick:["Suboro begins: the season of the good news.","God heard Zechariah's prayer late, but not too late.","Faith means trusting God's promise when we cannot yet see it."],action:"Offer again one long-standing intention at this Sunday's Qurbono.",question:"What prayer have I stopped praying because I thought God was not listening?",
  special:"First Sunday of Suboro, the season of Annunciation, in the Syro-Malankara liturgical year.",
  illus:["An illustration","A Kerala couple waited twelve years for a child, praying at every pilgrimage and novena. When a daughter was finally born, they named her Krupa, “grace”. Zechariah's story is told for every family that waits."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 1:11–13.",explain:"Zechariah and Elizabeth prayed for a baby for many years. God heard them and gave them John. God hears our prayers too, even when we must wait.",intention:"We pray for couples who are waiting for a child, and for all who are tired of waiting.",ask:"Ask: “What are we waiting for God to do for our family?”"},
  catechism:[["CCC 523","John the Baptist, the precursor."],["CCC 2570–2573","The prayer of Abraham: faith and waiting."]],
  kidsaint:["Saints Zechariah and Elizabeth","An old priest and his wife who loved God and kept his commandments. God gave them a son, John the Baptist, who prepared the way for Jesus. Lesson: never stop praying."],
  term:["Suboro (സൂബോറോ)","Syriac for “good news” or “annunciation”. The first season of the Syro-Malankara year, in which the Church meditates on the announcements of the coming of Christ, leading to Yaldo, the Nativity."],
  termMore:["Why the Temple?","The season begins in the Temple, at the hour of incense. The New Testament opens where the Old Testament worship was offered, and moves towards the true Temple, Christ himself."]},
 {homily:["Dear brothers and sisters, today the season of Suboro begins, the season of good news. And where does the good news begin? In the Temple, with an old priest named Zechariah, burning incense while the people pray outside.","Zechariah and Elizabeth were good people. St Luke says they were “righteous before God”. And yet they had no child, and now they were old. How many years they must have prayed! And perhaps they had stopped asking. Then the angel says: “Do not be afraid, Zechariah, for your prayer has been heard.” God had not forgotten. God's answer came late, but not too late.","Zechariah could not believe it at once. “How will I know this? I am an old man.” And God gave him a strange sign: silence. For nine months he could not speak. That silence was a school. When John was born, the first thing Zechariah did with his freed tongue was to praise God.","Perhaps some of us here carry a prayer that God seems not to have answered: for a child, for a job, for a son who has gone away from the Church, for healing. Do not stop. Like Abraham, who “hoped against hope”, keep trusting. And use this season to prepare your heart, as John prepared a people for the Lord. Amen."],
  kids:["Children, do you like waiting? No! Waiting is hard. Zechariah and Elizabeth waited many, many years for a baby.","Then an angel came and said: “God has heard your prayer!” And God gave them a baby called John. John grew up to tell everyone: “Jesus is coming!”","When you pray, God always listens. Sometimes we must wait. Let's say together: “God hears my prayer!”"]});

put("2026-11-15","ml",{title:"സഖറിയായ്ക്കുള്ള മംഗളവാർത്തയുടെ ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 1:1–17","ദൂതൻ യോഹന്നാനെ വാഗ്ദാനം ചെയ്യുന്നു"],[ML.ot,"ഉൽപത്തി 17:15–22","അബ്രാഹത്തിനും സാറായ്ക്കും ഒരു പുത്രൻ"],[ML.ot,"റൂത്ത് 1:11–18","റൂത്തിന്റെ വിശ്വസ്തത"],[ML.ot,"1 സാമുവൽ 1:9–17","ഹന്നാ ഹൃദയം പകരുന്നു"],[ML.ot,"ഏശയ്യാ 41:8–17","ഭയപ്പെടേണ്ടാ, ഞാൻ നിന്നോടുകൂടെയുണ്ട്"],[ML.ce,"2 പത്രോസ് 1:3–11","ദൈവികസ്വഭാവത്തിൽ പങ്കുകാർ"],[ML.pa,"റോമാ 4:13–25","പ്രത്യാശയ്ക്കു വകയില്ലാതിരുന്നിട്ടും അബ്രാഹം പ്രത്യാശിച്ചു"],[ML.go,"ലൂക്കാ 1:5–25","ദേവാലയത്തിൽ സഖറിയായ്ക്കുള്ള സന്ദേശം"]],
 alt:"മംഗളവാർത്താക്കാലത്തിലെ (സൂബോറോ) ഒന്നാം ഞായർ.",
 verse:"സഖറിയാ ഭയപ്പെടേണ്ടാ. നിന്റെ പ്രാർഥന കേട്ടിരിക്കുന്നു. നിന്റെ ഭാര്യ എലിസബത്തിൽ നിനക്ക് ഒരു പുത്രൻ ജനിക്കും. നീ അവന് യോഹന്നാൻ എന്നു പേരിടണം.",cite:"ലൂക്കാ 1:13",
 theo:["“സദ്വാർത്ത” എന്നർഥമുള്ള സൂബോറോക്കാലം ആരംഭിക്കുന്നതു നസറത്തിലല്ല, ജറുസലെം ദേവാലയത്തിൽ, ധൂപമർപ്പിക്കുന്ന ഒരു വൃദ്ധപുരോഹിതനോടൊപ്പമാണ്. സഖറിയായും എലിസബത്തും “ദൈവസന്നിധിയിൽ നീതിനിഷ്ഠരായിരുന്നു”; എങ്കിലും അവർക്കു മക്കളുണ്ടായിരുന്നില്ല; അവർ വൃദ്ധരുമായി. പുതിയനിയമത്തിലെ ദൈവത്തിന്റെ ആദ്യത്തെ മംഗളവാർത്ത, വർഷങ്ങളോളം പ്രാർഥിച്ചിട്ടും ഉത്തരം കിട്ടിയില്ലെന്നു തോന്നിയവർക്കാണു നൽകപ്പെടുന്നത്.","പഴയനിയമവായനകൾ നമ്മെ ഒരുക്കുന്നു. മാനുഷികമായി അസാധ്യമായിരുന്നപ്പോൾ അബ്രാഹത്തിനും സാറായ്ക്കും ഒരു പുത്രൻ നൽകപ്പെട്ടു; അബ്രാഹം ചിരിച്ചുപോലും (ഉൽപ 17:17). വന്ധ്യയും പരിഹസിക്കപ്പെട്ടവളുമായ ഹന്നാ ശ്രീകോവിലിൽ കർത്താവിന്റെ മുമ്പിൽ ഹൃദയവികാരങ്ങൾ പകർന്നു (1 സാമു 1:15); സാമുവലിന്റെ അമ്മയായി. ഏശയ്യാ ദൈവസ്വരം കേൾക്കുന്നു: “ഭയപ്പെടേണ്ടാ, ഞാൻ നിന്നോടുകൂടെയുണ്ട്.” ഇസ്രായേലിന്റെ ദൈവം വന്ധ്യതയിൽനിന്നു ജീവൻ പുറപ്പെടുവിക്കുന്നു.","സഖറിയായുടെ ചോദ്യം തികച്ചും മാനുഷികമാണ്: “ഞാൻ ഇത് എങ്ങനെ അറിയും? ഞാൻ വൃദ്ധനാണ്.” അവൻ ഒരു അടയാളം ചോദിക്കുന്നു; അവന് ഒരു അടയാളം ലഭിക്കുന്നു: വാഗ്ദാനം നിറവേറുന്നതുവരെ മൗനം. നേരേ മറിച്ചുള്ള മനോഭാവം വിശുദ്ധ പൗലോസ് അബ്രാഹത്തിൽ കാണിക്കുന്നു: പ്രത്യാശയ്ക്കു വകയില്ലാതിരുന്നിട്ടും പ്രത്യാശയോടെ അവൻ വിശ്വസിച്ചു; ദൈവത്തെ മഹത്വപ്പെടുത്തി വിശ്വാസത്തിൽ ശക്തിപ്രാപിച്ചു (റോമാ 4:18, 20). കാണാൻ കഴിയുന്ന ഉറപ്പല്ല വിശ്വാസം; വാഗ്ദാനം ചെയ്തതു ചെയ്യാൻ ദൈവത്തിനു കഴിയുമെന്ന ആശ്രയമാണ്.","“സജ്ജീകൃതമായ ഒരു ജനത്തെ കർത്താവിനുവേണ്ടി ഒരുക്കാൻ ഏലിയായുടെ ചൈതന്യത്തോടും ശക്തിയോടും കൂടെ” കർത്താവിന്റെ മുമ്പേ പോകുക എന്നതാണു യോഹന്നാന്റെ ദൗത്യം (ലൂക്കാ 1:17). സൂബോറോ നമുക്കുള്ള ആ ഒരുക്കമാണ്: വിശുദ്ധസ്ഥലത്തെ സഖറിയായെപ്പോലെ സഭ കാത്തിരിക്കുകയും പ്രാർഥിക്കുകയും ദൈവത്തെ സംസാരിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്ന കാലം."],
 conn:[["വന്ധ്യരായ അമ്മമാർ, മഹാന്മാരായ പുത്രന്മാർ.","സാറാ (ഇസഹാക്ക്), ഹന്നാ (സാമുവൽ), മനോവയുടെ ഭാര്യ (സാംസൺ), എലിസബത്ത് (യോഹന്നാൻ): ദൈവജനത്തിന്റെ ഭാവി മാനുഷികനേട്ടമല്ല, ദൈവത്തിന്റെ ദാനമാണെന്ന് ഓരോ ജനനവും കാണിക്കുന്നു."],["ധൂപത്തിന്റെ സമയം.","ജനം പുറത്തു പ്രാർഥിക്കുമ്പോൾ ധൂപാർപ്പണസമയത്താണു സഖറിയായ്ക്കു സന്ദേശം ലഭിക്കുന്നത്. നമ്മുടെ കുർബാനയിൽ സഭയുടെ പ്രാർഥനകളോടൊപ്പം ധൂപം ഉയരുന്നു (സങ്കീ 141:2; വെളി 8:3–4)."],["ഏലിയാ തിരിച്ചുവരുന്നു.","“പിതാക്കന്മാരുടെ ഹൃദയങ്ങളെ മക്കളിലേക്കു തിരിക്കാൻ” ഏലിയാ വരുമെന്നു മലാക്കി വാഗ്ദാനം ചെയ്തിരുന്നു (മലാ 4:5–6). ദൂതൻ ഈ വാക്കുകൾ യോഹന്നാനു ബാധകമാക്കുന്നു (ലൂക്കാ 1:17)."],["റൂത്തിന്റെ “അമ്മ പോകുന്നിടത്തു ഞാനും വരും”.","ദാവീദിന്റെയും ക്രിസ്തുവിന്റെയും പൂർവികയായിത്തീർന്ന ഒരു വിജാതീയസ്ത്രീയുടെ (മത്താ 1:5) വിശ്വസ്തത, കർത്താവിനു വഴിയൊരുക്കുന്ന വിശ്വസ്തസ്നേഹത്തെ കാണിക്കുന്നു."]],
 altar:["ധൂപമർപ്പിക്കാൻ സഖറിയാ ശ്രീകോവിലിൽ പ്രവേശിച്ചു; ഓരോ വിശുദ്ധ കുർബാനയിലും വൈദികൻ അതുതന്നെ ചെയ്യുന്നു; ദേവാലയത്തിലെപ്പോലെ ജനം തിരശ്ശീലയ്ക്കു പുറത്തു പ്രാർഥിക്കുന്നു. പക്ഷേ നമുക്കു സഖറിയായ്ക്കുള്ളതിനെക്കാൾ കൂടുതലുണ്ട്: ആരുടെ വരവാണോ അവനു വാഗ്ദാനം ചെയ്യപ്പെട്ടത്, അവിടുന്ന് ഇപ്പോൾ തന്റെ ശരീരരക്തങ്ങളിൽ ബലിപീഠത്തിലേക്കു വരുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: വർഷങ്ങളോളം ഒരു കാര്യത്തിനായി പ്രാർഥിച്ചിട്ടു ദൈവം കേൾക്കുന്നില്ലെന്നു നിങ്ങൾക്കു തോന്നിയിട്ടുണ്ടോ?"],["ഒന്നാം ആശയം · വൈകിയ പ്രാർഥനകളും ദൈവം കേൾക്കുന്നു","“നിന്റെ പ്രാർഥന കേട്ടിരിക്കുന്നു.” ദൈവത്തിന്റെ സമയം നമ്മുടേതല്ല. അബ്രാഹം, ഹന്നാ, എലിസബത്ത്."],["രണ്ടാം ആശയം · സഖറിയായുടെ മൗനം","അവന്റെ സംശയത്തിനു മറുപടി മൗനമാണ്; അതു വിശ്വാസത്തിന്റെ വിദ്യാലയമാകുന്നു. ഒടുവിൽ സ്തുതിക്കാനായി അവന്റെ നാവു സ്വതന്ത്രമാകുന്നു (ലൂക്കാ 1:64)."],["മൂന്നാം ആശയം · പ്രത്യാശയ്ക്കെതിരേ പ്രത്യാശിക്കുക","റോമാ 4-ലെ അബ്രാഹത്തിന്റെ വിശ്വാസം: വസ്തുതകൾ ഇല്ല എന്നു പറയുമ്പോഴും ദൈവത്തിൽ ആശ്രയിക്കുക."],["നാലാം ആശയം · ഒരു ജനത്തെ ഒരുക്കുക","യോഹന്നാൻ ഹൃദയങ്ങളെ ഒരുക്കുന്നു; സൂബോറോ നമ്മുടേതും. പ്രായോഗികമായി: കുടുംബങ്ങളിലെ അനുരഞ്ജനം (“പിതാക്കന്മാരുടെ ഹൃദയങ്ങളെ മക്കളിലേക്ക്”)."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഉത്തരം കാണാൻ കഴിയാത്തപ്പോഴും ദൈവം എന്റെ പ്രാർഥന കേട്ടിരിക്കുന്നു.”"]],
 live:[["പ്രാർഥന തുടരുക (ലൂക്കാ 1:13)","ദീർഘകാലമായി പ്രാർഥിക്കുന്ന ഒരു നിയോഗം എഴുതിവച്ച് ഈ ഞായറാഴ്ചത്തെ കുർബാനയിൽ അതു വീണ്ടും സമർപ്പിക്കുക."],["വിശുദ്ധമൗനത്തിന്റെ ഒരാഴ്ച (ലൂക്കാ 1:20)","ഈ ആഴ്ച ഓരോ ദിവസവും പത്തു മിനിറ്റ് മൗനം തിരഞ്ഞെടുക്കുക: ഫോണില്ല, ടെലിവിഷനില്ല, ദൈവം മാത്രം."],["ഹൃദയങ്ങളെ തിരിക്കുക (ലൂക്കാ 1:17)","നിന്റെ കുടുംബത്തിൽ മാതാപിതാക്കളും മക്കളും തമ്മിലുള്ള അനുരഞ്ജനത്തിന്റെ ഒരു ചുവടു വയ്ക്കുക."]],
 fathers:[["മിലാനിലെ വിശുദ്ധ അംബ്രോസ്","ലൂക്കായുടെ സുവിശേഷം വ്യാഖ്യാനിച്ച്, പൗരോഹിത്യജീവിതത്തിലും ദാമ്പത്യജീവിതത്തിലും നീതിനിഷ്ഠരായിരുന്ന സഖറിയായെയും എലിസബത്തിനെയും അദ്ദേഹം പ്രശംസിക്കുന്നു; ദൈവകൃപ പ്രകൃതിയെ അതിശയിക്കുന്നുവെന്നതിന്റെ അടയാളമായി യോഹന്നാന്റെ ജനനത്തെ കാണുന്നു (ലൂക്കാസുവിശേഷവ്യാഖ്യാനം, ഒന്നാം പുസ്തകം)."],["മാർ അപ്രേം","സംശയിച്ച പുരോഹിതനെയും വിശ്വസിച്ച കന്യകയെയും അദ്ദേഹം താരതമ്യം ചെയ്യുന്നു: ചോദ്യം ചെയ്തവൻ മൂകനാക്കപ്പെട്ടു; വിശ്വസിച്ചവൾ വചനത്തെ ഗർഭംധരിച്ചു (ദിയാതെസ്സറോൻ വ്യാഖ്യാനം)."]],
 magis:[["മതബോധനഗ്രന്ഥം 523","വിശുദ്ധ സ്നാപകയോഹന്നാൻ കർത്താവിന്റെ തൊട്ടുമുമ്പുള്ള മുന്നോടിയാണ്; അവിടുത്തെ വഴിയൊരുക്കാൻ അയയ്ക്കപ്പെട്ടവൻ; “അത്യുന്നതന്റെ പ്രവാചകൻ”; എല്ലാ പ്രവാചകരെയുംകാൾ ശ്രേഷ്ഠൻ."],["മതബോധനഗ്രന്ഥം 145–146","വിശ്വാസത്തിന്റെ അനുസരണത്തിനു മാതൃകയാണ് അബ്രാഹം; പ്രത്യാശയ്ക്കെതിരേ പ്രത്യാശിച്ചു വിശ്വസിച്ചതിനാൽ എല്ലാ വിശ്വാസികളുടെയും പിതാവായി."],["ലുമെൻ ഫീദേയി 8–11","വിളിക്കുകയും വാഗ്ദാനം ചെയ്യുകയും, അസാധ്യമെന്നു തോന്നുമ്പോഴും വാക്കു പാലിക്കുകയും ചെയ്യുന്ന ദൈവത്തിലുള്ള ആശ്രയമാണ് അബ്രാഹത്തിന്റെ വിശ്വാസം."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","നവംബർ 16: വിശുദ്ധ മത്തായി ശ്ലീഹാ (മലങ്കര ഓർമ). നവംബർ 21: ദൈവമാതാവായ മറിയത്തിന്റെ ദേവാലയസമർപ്പണം. മറ്റ് ഓർമകൾ 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ ദൈവമേ, സഖറിയായുടെയും എലിസബത്തിന്റെയും പ്രാർഥന കേട്ട്, അങ്ങയുടെ മിശിഹായ്ക്കു വഴിയൊരുക്കാൻ അങ്ങ് അവർക്ക് ഒരു പുത്രനെ നൽകി. ഇത്രനാൾ ഞങ്ങൾ വഹിച്ച പ്രാർഥനകൾ കേൾക്കണമേ; കാണാൻ കഴിയാത്തപ്പോൾ ഞങ്ങളുടെ വിശ്വാസം ബലപ്പെടുത്തണമേ; കർത്താവിനായി ഒരുക്കപ്പെട്ട ഒരു ജനമായി ഞങ്ങളെ മാറ്റണമേ. ആമേൻ."},
 {quick:["സൂബോറോ ആരംഭിക്കുന്നു: സദ്വാർത്തയുടെ കാലം.","ദൈവം സഖറിയായുടെ പ്രാർഥന വൈകി കേട്ടു; പക്ഷേ ഏറെ വൈകിയില്ല.","ഇനിയും കാണാൻ കഴിയാത്തപ്പോഴും ദൈവത്തിന്റെ വാഗ്ദാനത്തിൽ ആശ്രയിക്കുന്നതാണു വിശ്വാസം."],action:"ദീർഘകാലമായുള്ള ഒരു നിയോഗം ഈ ഞായറാഴ്ചത്തെ കുർബാനയിൽ വീണ്ടും സമർപ്പിക്കുക.",question:"ദൈവം കേൾക്കുന്നില്ലെന്നു കരുതി ഞാൻ നിർത്തിക്കളഞ്ഞ പ്രാർഥന ഏതാണ്?",
  special:"സീറോ മലങ്കര ആരാധനാവത്സരത്തിൽ മംഗളവാർത്താക്കാലമായ സൂബോറോയിലെ ഒന്നാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഒരു ദമ്പതികൾ ഒരു കുഞ്ഞിനായി പന്ത്രണ്ടു വർഷം കാത്തിരുന്നു; എല്ലാ തീർഥാടനത്തിലും നൊവേനയിലും പ്രാർഥിച്ചു. ഒടുവിൽ ഒരു മകൾ ജനിച്ചപ്പോൾ അവർ അവൾക്കു “കൃപ” എന്നു പേരിട്ടു. കാത്തിരിക്കുന്ന ഓരോ കുടുംബത്തിനുംവേണ്ടിയാണു സഖറിയായുടെ കഥ പറയപ്പെടുന്നത്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 1:11–13.",explain:"സഖറിയായും എലിസബത്തും വർഷങ്ങളോളം ഒരു കുഞ്ഞിനായി പ്രാർഥിച്ചു. ദൈവം അവരെ കേട്ട് അവർക്കു യോഹന്നാനെ നൽകി. കാത്തിരിക്കേണ്ടിവരുമ്പോഴും ദൈവം നമ്മുടെ പ്രാർഥനകളും കേൾക്കുന്നു.",intention:"ഒരു കുഞ്ഞിനായി കാത്തിരിക്കുന്ന ദമ്പതികൾക്കും കാത്തിരുന്നു തളർന്ന എല്ലാവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മുടെ കുടുംബത്തിനുവേണ്ടി ദൈവം ചെയ്യാൻ നാം എന്താണു കാത്തിരിക്കുന്നത്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 523","മുന്നോടിയായ സ്നാപകയോഹന്നാൻ."],["മതബോധനഗ്രന്ഥം 2570–2573","അബ്രാഹത്തിന്റെ പ്രാർഥന: വിശ്വാസവും കാത്തിരിപ്പും."]],
  kidsaint:["വിശുദ്ധ സഖറിയായും എലിസബത്തും","ദൈവത്തെ സ്നേഹിക്കുകയും അവിടുത്തെ കല്പനകൾ പാലിക്കുകയും ചെയ്ത ഒരു വൃദ്ധപുരോഹിതനും ഭാര്യയും. യേശുവിനു വഴിയൊരുക്കിയ സ്നാപകയോഹന്നാനെ ദൈവം അവർക്കു മകനായി നൽകി. പാഠം: ഒരിക്കലും പ്രാർഥന നിർത്തരുത്."],
  term:["സൂബോറോ","“സദ്വാർത്ത” അഥവാ “മംഗളവാർത്ത” എന്നതിന്റെ സുറിയാനിപദം. ക്രിസ്തുവിന്റെ വരവിനെക്കുറിച്ചുള്ള മംഗളവാർത്തകൾ സഭ ധ്യാനിക്കുന്ന, യൽദോ (തിരുപ്പിറവി) വരെ നീളുന്ന, സീറോ മലങ്കര വർഷത്തിലെ ആദ്യകാലം."],
  termMore:["എന്തുകൊണ്ടു ദേവാലയം?","ധൂപാർപ്പണസമയത്തു ദേവാലയത്തിലാണ് ഈ കാലം ആരംഭിക്കുന്നത്. പഴയനിയമ ആരാധന അർപ്പിക്കപ്പെട്ടിരുന്നിടത്തു പുതിയനിയമം തുറക്കുന്നു; യഥാർഥ ആലയമായ ക്രിസ്തുവിലേക്കു നീങ്ങുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്നു സദ്വാർത്തയുടെ കാലമായ സൂബോറോ ആരംഭിക്കുന്നു. സദ്വാർത്ത എവിടെ ആരംഭിക്കുന്നു? ദേവാലയത്തിൽ, ജനം പുറത്തു പ്രാർഥിക്കുമ്പോൾ ധൂപമർപ്പിക്കുന്ന സഖറിയാ എന്ന വൃദ്ധപുരോഹിതനോടൊപ്പം.","സഖറിയായും എലിസബത്തും നല്ല മനുഷ്യരായിരുന്നു. അവർ ദൈവസന്നിധിയിൽ നീതിനിഷ്ഠരായിരുന്നുവെന്നു വിശുദ്ധ ലൂക്കാ പറയുന്നു. എങ്കിലും അവർക്കു മക്കളുണ്ടായിരുന്നില്ല; ഇപ്പോൾ അവർ വൃദ്ധരായി. എത്ര വർഷം അവർ പ്രാർഥിച്ചിട്ടുണ്ടാകും! ഒരുപക്ഷേ ചോദിക്കുന്നതുതന്നെ അവർ നിർത്തിയിരിക്കാം. അപ്പോൾ ദൂതൻ പറയുന്നു: “സഖറിയാ ഭയപ്പെടേണ്ടാ. നിന്റെ പ്രാർഥന കേട്ടിരിക്കുന്നു.” ദൈവം മറന്നിരുന്നില്ല. ദൈവത്തിന്റെ ഉത്തരം വൈകിയാണു വന്നത്; പക്ഷേ ഏറെ വൈകിയില്ല.","സഖറിയായ്ക്ക് ഉടനെ വിശ്വസിക്കാനായില്ല: “ഞാൻ ഇത് എങ്ങനെ അറിയും? ഞാൻ വൃദ്ധനാണ്.” ദൈവം അവന് ഒരു വിചിത്രമായ അടയാളം നൽകി: മൗനം. ഒമ്പതു മാസം അവനു സംസാരിക്കാനായില്ല. ആ മൗനം ഒരു വിദ്യാലയമായിരുന്നു. യോഹന്നാൻ ജനിച്ചപ്പോൾ, സ്വതന്ത്രമായ നാവുകൊണ്ടു സഖറിയാ ആദ്യം ചെയ്തതു ദൈവത്തെ സ്തുതിക്കുകയാണ്.","നമ്മിൽ ചിലർ ദൈവം ഉത്തരം നൽകിയിട്ടില്ലെന്നു തോന്നുന്ന ഒരു പ്രാർഥന വഹിക്കുന്നുണ്ടാകാം: ഒരു കുഞ്ഞിനായി, ഒരു ജോലിക്കായി, സഭയിൽനിന്ന് അകന്നുപോയ ഒരു മകനായി, സൗഖ്യത്തിനായി. നിർത്തരുത്. പ്രത്യാശയ്ക്കു വകയില്ലാതിരുന്നിട്ടും പ്രത്യാശിച്ച അബ്രാഹത്തെപ്പോലെ ആശ്രയിച്ചുകൊണ്ടിരിക്കുക. കർത്താവിനായി യോഹന്നാൻ ഒരു ജനത്തെ ഒരുക്കിയതുപോലെ, നിന്റെ ഹൃദയം ഒരുക്കാൻ ഈ കാലം ഉപയോഗിക്കുക. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, കാത്തിരിക്കാൻ നിങ്ങൾക്ക് ഇഷ്ടമാണോ? ഇല്ല! കാത്തിരിപ്പു വിഷമമാണ്. സഖറിയായും എലിസബത്തും ഒരു കുഞ്ഞിനായി ഒരുപാടു വർഷം കാത്തിരുന്നു.","അപ്പോൾ ഒരു മാലാഖ വന്നു പറഞ്ഞു: “ദൈവം നിങ്ങളുടെ പ്രാർഥന കേട്ടിരിക്കുന്നു!” ദൈവം അവർക്കു യോഹന്നാൻ എന്ന ഒരു കുഞ്ഞിനെ നൽകി. വലുതായപ്പോൾ യോഹന്നാൻ എല്ലാവരോടും പറഞ്ഞു: “യേശു വരുന്നു!”","നിങ്ങൾ പ്രാർഥിക്കുമ്പോൾ ദൈവം എപ്പോഴും കേൾക്കുന്നു. ചിലപ്പോൾ നാം കാത്തിരിക്കണം. നമുക്ക് ഒന്നിച്ചു പറയാം: “ദൈവം എന്റെ പ്രാർഥന കേൾക്കുന്നു!”"]});

/* ================= ANNUNCIATION TO MARY · 22 November 2026 ================= */
put("2026-11-22","en",{title:"Sunday of the Annunciation to Mary, Mother of God",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 1:1–17","The genealogy of Jesus Christ"],[EN.ot,"Genesis 3:8–15","The first promise: the woman and her offspring"],[EN.ot,"Judges 13:2–14","The birth of Samson announced"],[EN.ot,"Zechariah 4:1–7","Not by might, but by my Spirit"],[EN.ot,"Isaiah 63:15–64:5","O that you would tear open the heavens and come down"],[EN.ce,"1 John 3:1–10","We are called children of God"],[EN.pa,"Galatians 4:1–7","God sent his Son, born of a woman"],[EN.go,"Luke 1:26–38","The angel Gabriel is sent to Mary"]],
 alt:"Second Sunday of Suboro.",
 verse:"Here am I, the servant of the Lord; let it be with me according to your word.",cite:"Luke 1:38",
 theo:["Last Sunday the angel came to an old priest in the Temple. Today the same angel, Gabriel, comes to a young virgin in Nazareth, a village never mentioned in the Old Testament. God's greatest work begins in a hidden house, in the heart of a woman who listens.","The readings stretch from the first pages of the Bible to its fulfilment. In the garden, after the first sin, God promises that the offspring of the woman will strike the serpent's head (Genesis 3:15). Isaiah cries: “O that you would tear open the heavens and come down” (Isaiah 64:1). St Paul answers: “When the fullness of time had come, God sent his Son, born of a woman” (Galatians 4:4). The Annunciation is the moment when heaven opens and God comes down.","“The Holy Spirit will come upon you, and the power of the Most High will overshadow you; therefore the child to be born will be holy; he will be called Son of God.” Mary conceives not by human power but by the Spirit, as Zechariah's vision promised: “Not by might, nor by power, but by my spirit” (Zechariah 4:6). Her child is truly God and truly man; that is why the Church calls her Theotokos, Mother of God.","Zechariah asked, “How will I know?” and was silenced. Mary asks, “How can this be?” and then gives her free consent: “Here am I, the servant of the Lord; let it be with me according to your word.” The Fathers saw in her obedience the reversal of Eve's disobedience. Through her “yes”, the Son of God becomes our brother, and we become “children of God; and that is what we are” (1 John 3:1)."],
 conn:[["Eve and Mary.","In Genesis 3 a woman listens to the serpent and humanity falls; in Luke 1 a woman listens to the angel and salvation enters the world. Genesis 3:15 is called the “first Gospel”."],["The genealogy.","The evening Gospel (Matthew 1:1–17) lists sinners and saints, foreigners and kings. God's promise travels through a real, untidy family history to Mary, “of whom Jesus was born”."],["The overshadowing.","The word Luke uses recalls the cloud that covered the Tabernacle (Exodus 40:35). Mary becomes the dwelling place of God."],["Nothing is impossible.","“Nothing will be impossible with God” (Luke 1:37) echoes the Lord's words to Abraham about Sarah: “Is anything too wonderful for the LORD?” (Genesis 18:14)."]],
 altar:["At the epiclesis of the Holy Qurbono the priest calls the Holy Spirit upon the bread and wine, as the Spirit came upon Mary. The same Lord who took flesh in her womb becomes present on the altar. Mary's “let it be with me” is the best preparation for Holy Communion."],
 outline:[["Opening","Contrast: an angel in the Temple to a priest (last week); an angel in a village house to a girl (today)."],["Point 1 · The promise kept","Genesis 3:15 to Galatians 4:4: God never forgot his first promise."],["Point 2 · By the Spirit","“Not by might, nor by power.” Christ comes by the Spirit's power, not by human means. Mary is truly Mother of God."],["Point 3 · Mary's question and Mary's yes","Faith may ask questions; it ends in surrender. Compare Zechariah."],["Point 4 · Our “let it be”","Where is God asking for my yes this week: a vocation, a forgiveness, a hidden duty?"],["Take-home line","“Here am I, Lord; let it be with me according to your word.”"]],
 live:[["Pray the Angelus (Luke 1:38)","Pray the Angelus at noon every day this week; in the family, at least once together."],["Say yes to one hidden duty","Do one task you have been avoiding at home or at work, quietly, as your “let it be”."],["Honour the Mother of God","Pray one decade of the Rosary each evening, meditating on the Annunciation."]],
 fathers:[["St Irenaeus of Lyons","“The knot of Eve's disobedience was loosed by the obedience of Mary; what the virgin Eve bound through unbelief, the Virgin Mary set free through faith” (Against Heresies III, 22, 4)."],["St Bernard of Clairvaux","He imagines the whole world waiting for Mary's reply: Adam, Abraham, David and all the fathers beg her to answer the angel quickly and give her consent (Homilies in Praise of the Virgin Mother 4, 8)."]],
 magis:[["Lumen Gentium 56","Mary was not a merely passive instrument but cooperated in human salvation by free faith and obedience; the Fathers compare her with Eve: “death through Eve, life through Mary”."],["Catechism 490–495","Mary, “full of grace”, was prepared by God; she is truly Mother of God (Theotokos) because she is the mother of the eternal Son made man."],["Redemptoris Mater 13","At the Annunciation Mary entrusted herself to God completely, with the “obedience of faith”, responding with all her human and feminine “I”."]],
 saints:[["This week (fixed dates)","23 Nov: St Clement of Rome, Pope and Martyr. 25 Nov: St Catherine of Alexandria. 29 Nov: St Jacob of Serugh (Mar Jacob of Sarug), great Syriac poet (falls on Sunday in 2026). Confirm in the 2026–27 lectionary."]],
 prayer:"Lord God, you sent your angel to the Virgin Mary, and by the power of the Holy Spirit your Son took flesh in her womb. Give us her listening heart and her generous “yes”, that Christ may be formed in us. Through her prayers, Mother of God, keep us faithful. Amen."},
 {quick:["God keeps the first promise made in Eden.","By the Holy Spirit the Son of God becomes man in Mary, Mother of God.","Mary's “let it be” undoes Eve's “no”, and invites ours."],action:"Pray the Angelus at noon every day this week.",question:"Where is God asking for my “yes” this week?",
  special:"Second Sunday of Suboro: the Annunciation to the Blessed Virgin Mary.",
  illus:["An illustration","When a bride and groom say “I do” at the altar, two short words change two whole lives. Mary's “let it be” was even shorter, and it changed the history of the world."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 1:30–31, 38.",explain:"God sent the angel Gabriel to Mary. She said yes to God, and Jesus, God's Son, became a little baby in her womb.",intention:"We pray that each of us may say yes to God like Mary.",ask:"Ask: “What is one thing God wants me to say yes to this week?”"},
  catechism:[["CCC 484–486","The Annunciation: “the fullness of time”."],["CCC 494","Mary's “Fiat” and the obedience of faith."]],
  kidsaint:["St Gabriel the Archangel","His name means “God is my strength”. He brought God's messages to Daniel, to Zechariah and to Mary. Lesson: listen carefully when God speaks to you in prayer and through your parents and teachers."],
  term:["Theotokos · Mother of God","Greek for “God-bearer”. The Council of Ephesus (431) taught that Mary is truly Mother of God, because the child she bore is the eternal Son of God made man. In the Syriac tradition she is called Yoldath Aloho."],
  termMore:["The Angelus","A prayer recalling the Annunciation, traditionally said at morning, noon and evening when the church bell rings: “The angel of the Lord declared unto Mary…”"]},
 {homily:["Dear brothers and sisters, last Sunday an angel came to an old priest in the great Temple of Jerusalem. Today the same angel goes to a little village called Nazareth, to a young girl named Mary. God's greatest work begins in a small house, in a heart that listens.","Our readings remind us that God had promised this from the very beginning. When Adam and Eve sinned, God said that the offspring of the woman would crush the serpent's head. For centuries the prophets cried, “O that you would tear open the heavens and come down!” And St Paul says, “When the fullness of time had come, God sent his Son, born of a woman.” Today that fullness arrives.","Mary asks a question: “How can this be?” Faith may ask questions. But then she says the words that changed the world: “Here am I, the servant of the Lord; let it be with me according to your word.” The Fathers said: Eve's disobedience tied a knot; Mary's obedience untied it. Through her, the Son of God became man; that is why we call her Mother of God.","God is still looking for hearts that say yes. Perhaps he asks you to forgive someone, to accept an illness, to give time to prayer, or to answer a call to the priesthood or religious life. In a few moments the Holy Spirit will come down upon this altar as he came upon Mary. Let us say with her: “Let it be with me according to your word.” Amen."],
  kids:["Children, who visited Mary in her little house? The angel Gabriel! He said: “Mary, God is with you. You will have a baby, and you will call him Jesus.”","Mary said: “Yes, I will do what God wants.” And Jesus, God's own Son, became a tiny baby inside her.","Every day God asks us small things: to obey, to share, to pray. Let's say like Mary: “Yes, God!”"]});

put("2026-11-22","ml",{title:"ദൈവമാതാവായ മറിയത്തിനുള്ള മംഗളവാർത്തയുടെ ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 1:1–17","യേശുക്രിസ്തുവിന്റെ വംശാവലി"],[ML.ot,"ഉൽപത്തി 3:8–15","ആദ്യവാഗ്ദാനം: സ്ത്രീയും അവളുടെ സന്തതിയും"],[ML.ot,"ന്യായാധിപന്മാർ 13:2–14","സാംസന്റെ ജനനം അറിയിക്കപ്പെടുന്നു"],[ML.ot,"സഖറിയാ 4:1–7","സൈന്യബലത്താലല്ല, എന്റെ ആത്മാവിനാൽ"],[ML.ot,"ഏശയ്യാ 63:15–64:5","കർത്താവേ, ആകാശം പിളർന്ന് ഇറങ്ങി വരണമേ"],[ML.ce,"1 യോഹന്നാൻ 3:1–10","നാം ദൈവമക്കൾ എന്നു വിളിക്കപ്പെടുന്നു"],[ML.pa,"ഗലാത്തിയാ 4:1–7","ദൈവം തന്റെ പുത്രനെ അയച്ചു, സ്ത്രീയിൽനിന്നു ജാതനായി"],[ML.go,"ലൂക്കാ 1:26–38","ഗബ്രിയേൽ ദൂതൻ മറിയത്തിന്റെ അടുത്തേക്ക് അയയ്ക്കപ്പെടുന്നു"]],
 alt:"സൂബോറോയിലെ രണ്ടാം ഞായർ.",
 verse:"ഇതാ, കർത്താവിന്റെ ദാസി! നിന്റെ വാക്ക് എന്നിൽ നിറവേറട്ടെ!",cite:"ലൂക്കാ 1:38",
 theo:["കഴിഞ്ഞ ഞായറാഴ്ച ദേവാലയത്തിൽ ഒരു വൃദ്ധപുരോഹിതന്റെ അടുത്തേക്കാണു ദൂതൻ വന്നത്. ഇന്ന് അതേ ദൂതൻ, ഗബ്രിയേൽ, പഴയനിയമത്തിൽ ഒരിക്കലും പരാമർശിക്കപ്പെടാത്ത നസറത്ത് എന്ന ഗ്രാമത്തിലെ ഒരു കന്യകയുടെ അടുത്തേക്കു വരുന്നു. ദൈവത്തിന്റെ ഏറ്റവും വലിയ പ്രവൃത്തി ആരംഭിക്കുന്നത് ഒരു മറഞ്ഞ ഭവനത്തിൽ, ശ്രവിക്കുന്ന ഒരു സ്ത്രീയുടെ ഹൃദയത്തിലാണ്.","ബൈബിളിന്റെ ആദ്യതാളുകൾമുതൽ അതിന്റെ പൂർത്തീകരണംവരെ വായനകൾ നീളുന്നു. ആദ്യപാപത്തിനുശേഷം തോട്ടത്തിൽവച്ചു ദൈവം വാഗ്ദാനം ചെയ്യുന്നു: “നീയും സ്ത്രീയും തമ്മിലും നിന്റെ സന്തതിയും അവളുടെ സന്തതിയും തമ്മിലും ഞാൻ ശത്രുത ഉളവാക്കും. അവൻ നിന്റെ തല തകർക്കും” (ഉൽപ 3:15). ഏശയ്യാ നിലവിളിക്കുന്നു: “കർത്താവേ, ആകാശം പിളർന്ന് ഇറങ്ങി വരണമേ!” (ഏശ 64:1). വിശുദ്ധ പൗലോസ് ഉത്തരം നൽകുന്നു: “കാലസമ്പൂർണത വന്നപ്പോൾ ദൈവം തന്റെ പുത്രനെ അയച്ചു. അവൻ സ്ത്രീയിൽനിന്നു ജാതനായി” (ഗലാ 4:4). ആകാശം തുറക്കുകയും ദൈവം ഇറങ്ങിവരികയും ചെയ്യുന്ന നിമിഷമാണു മംഗളവാർത്ത.","“പരിശുദ്ധാത്മാവ് നിന്റെ മേൽ വരും; അത്യുന്നതന്റെ ശക്തി നിന്റെ മേൽ ആവസിക്കും. ആകയാൽ, ജനിക്കാൻ പോകുന്ന ശിശു പരിശുദ്ധൻ, ദൈവപുത്രൻ എന്നു വിളിക്കപ്പെടും.” സഖറിയായുടെ ദർശനം വാഗ്ദാനം ചെയ്തതുപോലെ മറിയം ഗർഭംധരിക്കുന്നതു മാനുഷികശക്തിയാലല്ല, ആത്മാവിനാലാണ്: “സൈന്യബലത്താലല്ല, കരബലത്താലുമല്ല, എന്റെ ആത്മാവിനാലാണ്” (സഖ 4:6). അവളുടെ ശിശു യഥാർഥ ദൈവവും യഥാർഥ മനുഷ്യനുമാണ്; അതുകൊണ്ടാണു സഭ അവളെ ദൈവമാതാവ് എന്നു വിളിക്കുന്നത്.","“ഞാൻ ഇത് എങ്ങനെ അറിയും?” എന്നു ചോദിച്ച സഖറിയാ മൂകനാക്കപ്പെട്ടു. “ഇത് എങ്ങനെ സംഭവിക്കും?” എന്നു മറിയം ചോദിക്കുന്നു; പിന്നെ സ്വതന്ത്രമായി സമ്മതം നൽകുന്നു: “ഇതാ, കർത്താവിന്റെ ദാസി! നിന്റെ വാക്ക് എന്നിൽ നിറവേറട്ടെ!” ഹവ്വായുടെ അനുസരണക്കേടിന്റെ തിരുത്തലായി അവളുടെ അനുസരണത്തെ സഭാപിതാക്കന്മാർ കണ്ടു. അവളുടെ “അതെ”യിലൂടെ ദൈവപുത്രൻ നമ്മുടെ സഹോദരനാകുന്നു; നാം ദൈവമക്കൾ എന്നു വിളിക്കപ്പെടുന്നു; നാം അങ്ങനെതന്നെയാണ് (1 യോഹ 3:1)."],
 conn:[["ഹവ്വായും മറിയവും.","ഉൽപത്തി 3-ൽ ഒരു സ്ത്രീ സർപ്പത്തെ ശ്രവിക്കുന്നു; മനുഷ്യവംശം വീഴുന്നു. ലൂക്കാ 1-ൽ ഒരു സ്ത്രീ ദൂതനെ ശ്രവിക്കുന്നു; രക്ഷ ലോകത്തിലേക്കു പ്രവേശിക്കുന്നു. ഉൽപത്തി 3:15 “ആദിസുവിശേഷം” എന്നു വിളിക്കപ്പെടുന്നു."],["വംശാവലി.","സന്ധ്യാസുവിശേഷം (മത്താ 1:1–17) പാപികളെയും വിശുദ്ധരെയും വിജാതീയരെയും രാജാക്കന്മാരെയും എണ്ണുന്നു. യഥാർഥവും ക്രമരഹിതവുമായ ഒരു കുടുംബചരിത്രത്തിലൂടെ ദൈവവാഗ്ദാനം, “യേശു ജനിച്ച” മറിയത്തിലേക്ക് എത്തുന്നു."],["ആവസിക്കൽ.","ലൂക്കാ ഉപയോഗിക്കുന്ന വാക്ക് സമാഗമകൂടാരത്തെ ആവരണം ചെയ്ത മേഘത്തെ ഓർമിപ്പിക്കുന്നു (പുറ 40:35). മറിയം ദൈവത്തിന്റെ വാസസ്ഥലമാകുന്നു."],["ഒന്നും അസാധ്യമല്ല.","“ദൈവത്തിന് ഒന്നും അസാധ്യമല്ല” (ലൂക്കാ 1:37) എന്നതു സാറായെപ്പറ്റി അബ്രാഹത്തോടു കർത്താവു പറഞ്ഞ വാക്കുകളുടെ പ്രതിധ്വനിയാണ് (ഉൽപ 18:14)."]],
 altar:["വിശുദ്ധ കുർബാനയിലെ റൂഹാക്ഷണപ്രാർഥനയിൽ, ആത്മാവു മറിയത്തിന്റെമേൽ വന്നതുപോലെ, അപ്പത്തിന്റെയും വീഞ്ഞിന്റെയും മേൽ വൈദികൻ പരിശുദ്ധാത്മാവിനെ വിളിക്കുന്നു. അവളുടെ ഉദരത്തിൽ മാംസം ധരിച്ച അതേ കർത്താവു ബലിപീഠത്തിൽ സന്നിഹിതനാകുന്നു. വിശുദ്ധ കുർബാനസ്വീകരണത്തിനുള്ള ഏറ്റവും നല്ല ഒരുക്കമാണു മറിയത്തിന്റെ “എന്നിൽ നിറവേറട്ടെ”."],
 outline:[["ആരംഭം","താരതമ്യം: ദേവാലയത്തിൽ ഒരു പുരോഹിതന്റെ അടുത്തേക്ക് ഒരു ദൂതൻ (കഴിഞ്ഞ ആഴ്ച); ഒരു ഗ്രാമഭവനത്തിൽ ഒരു പെൺകുട്ടിയുടെ അടുത്തേക്ക് ഒരു ദൂതൻ (ഇന്ന്)."],["ഒന്നാം ആശയം · പാലിക്കപ്പെട്ട വാഗ്ദാനം","ഉൽപത്തി 3:15 മുതൽ ഗലാത്തിയാ 4:4 വരെ: തന്റെ ആദ്യവാഗ്ദാനം ദൈവം ഒരിക്കലും മറന്നില്ല."],["രണ്ടാം ആശയം · ആത്മാവിനാൽ","“സൈന്യബലത്താലല്ല, കരബലത്താലുമല്ല.” മാനുഷികമാർഗങ്ങളാലല്ല, ആത്മാവിന്റെ ശക്തിയാലാണു ക്രിസ്തു വരുന്നത്. മറിയം യഥാർഥത്തിൽ ദൈവമാതാവാണ്."],["മൂന്നാം ആശയം · മറിയത്തിന്റെ ചോദ്യവും സമ്മതവും","വിശ്വാസത്തിനു ചോദ്യങ്ങൾ ചോദിക്കാം; അത് ആത്മസമർപ്പണത്തിൽ അവസാനിക്കുന്നു. സഖറിയായുമായി താരതമ്യം ചെയ്യുക."],["നാലാം ആശയം · നമ്മുടെ “നിറവേറട്ടെ”","ഈ ആഴ്ച ദൈവം എന്നോട് “അതെ” ചോദിക്കുന്നത് എവിടെയാണ്: ഒരു ദൈവവിളി, ഒരു ക്ഷമ, മറഞ്ഞ ഒരു കടമ?"],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഇതാ, കർത്താവിന്റെ ദാസി! നിന്റെ വാക്ക് എന്നിൽ നിറവേറട്ടെ!”"]],
 live:[["ത്രികാലജപം ചൊല്ലുക (ലൂക്കാ 1:38)","ഈ ആഴ്ച എല്ലാ ദിവസവും ഉച്ചയ്ക്കു ത്രികാലജപം ചൊല്ലുക; കുടുംബത്തിൽ ഒരിക്കലെങ്കിലും ഒന്നിച്ച്."],["മറഞ്ഞ ഒരു കടമയ്ക്ക് “അതെ” പറയുക","വീട്ടിലോ ജോലിസ്ഥലത്തോ ഒഴിവാക്കിക്കൊണ്ടിരുന്ന ഒരു ജോലി, നിന്റെ “നിറവേറട്ടെ” ആയി, നിശ്ശബ്ദമായി ചെയ്യുക."],["ദൈവമാതാവിനെ ബഹുമാനിക്കുക","മംഗളവാർത്ത ധ്യാനിച്ചുകൊണ്ട് എല്ലാ സന്ധ്യയിലും ജപമാലയുടെ ഒരു ദശകം ചൊല്ലുക."]],
 fathers:[["ലിയോൺസിലെ വിശുദ്ധ ഇരണേവൂസ്","ഹവ്വായുടെ അനുസരണക്കേടിന്റെ കെട്ട് മറിയത്തിന്റെ അനുസരണത്താൽ അഴിക്കപ്പെട്ടു; കന്യകയായ ഹവ്വാ അവിശ്വാസത്താൽ ബന്ധിച്ചതിനെ കന്യകയായ മറിയം വിശ്വാസത്താൽ സ്വതന്ത്രമാക്കി (പാഷണ്ഡതകൾക്കെതിരേ III, 22, 4)."],["ക്ലെയർവോയിലെ വിശുദ്ധ ബെർണാർഡ്","ലോകം മുഴുവൻ മറിയത്തിന്റെ മറുപടിക്കായി കാത്തിരിക്കുന്നതായി അദ്ദേഹം സങ്കൽപിക്കുന്നു: ദൂതനു വേഗം ഉത്തരം നൽകി സമ്മതം നൽകാൻ ആദവും അബ്രാഹവും ദാവീദും എല്ലാ പിതാക്കന്മാരും അവളോടു യാചിക്കുന്നു (കന്യകാമാതാവിന്റെ സ്തുതിക്കുള്ള പ്രസംഗങ്ങൾ 4, 8)."]],
 magis:[["ലുമെൻ ജെൻസിയും 56","മറിയം വെറുമൊരു നിഷ്ക്രിയോപകരണമായിരുന്നില്ല; സ്വതന്ത്രമായ വിശ്വാസത്താലും അനുസരണത്താലും മനുഷ്യരക്ഷയിൽ സഹകരിച്ചു. പിതാക്കന്മാർ അവളെ ഹവ്വായുമായി താരതമ്യം ചെയ്യുന്നു: “ഹവ്വായിലൂടെ മരണം, മറിയത്തിലൂടെ ജീവൻ.”"],["മതബോധനഗ്രന്ഥം 490–495","“കൃപനിറഞ്ഞ” മറിയം ദൈവത്താൽ ഒരുക്കപ്പെട്ടു; മനുഷ്യനായിത്തീർന്ന നിത്യപുത്രന്റെ അമ്മയായതിനാൽ അവൾ യഥാർഥത്തിൽ ദൈവമാതാവാണ്."],["രക്ഷകന്റെ അമ്മ (റിഡംപ്തോറിസ് മാത്തെർ) 13","മംഗളവാർത്തയിൽ മറിയം “വിശ്വാസത്തിന്റെ അനുസരണ”ത്തോടെ തന്നെത്തന്നെ പൂർണമായി ദൈവത്തിനു ഭരമേൽപിച്ചു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","നവംബർ 23: റോമായിലെ വിശുദ്ധ ക്ലെമന്റ്, മാർപാപ്പയും രക്തസാക്ഷിയും. നവംബർ 25: അലക്സാണ്ട്രിയായിലെ വിശുദ്ധ കത്രീന. നവംബർ 29: മഹാനായ സുറിയാനി കവി സെരൂഗിലെ മാർ യാക്കോബ് (2026-ൽ ഞായറാഴ്ച). 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ ദൈവമേ, കന്യകാമറിയത്തിന്റെ അടുത്തേക്ക് അങ്ങു ദൂതനെ അയച്ചു; പരിശുദ്ധാത്മാവിന്റെ ശക്തിയാൽ അങ്ങയുടെ പുത്രൻ അവളുടെ ഉദരത്തിൽ മാംസം ധരിച്ചു. ക്രിസ്തു ഞങ്ങളിൽ രൂപപ്പെടാൻ, അവളുടെ ശ്രവിക്കുന്ന ഹൃദയവും ഉദാരമായ “അതെ”യും ഞങ്ങൾക്കു നൽകണമേ. ദൈവമാതാവേ, നിന്റെ പ്രാർഥനകളാൽ ഞങ്ങളെ വിശ്വസ്തരായി കാക്കണമേ. ആമേൻ."},
 {quick:["ഏദനിൽ നൽകിയ ആദ്യവാഗ്ദാനം ദൈവം പാലിക്കുന്നു.","പരിശുദ്ധാത്മാവിനാൽ ദൈവപുത്രൻ ദൈവമാതാവായ മറിയത്തിൽ മനുഷ്യനാകുന്നു.","മറിയത്തിന്റെ “നിറവേറട്ടെ” ഹവ്വായുടെ “ഇല്ല”യെ തിരുത്തുന്നു; നമ്മുടേതിനെ ക്ഷണിക്കുന്നു."],action:"ഈ ആഴ്ച എല്ലാ ദിവസവും ഉച്ചയ്ക്കു ത്രികാലജപം ചൊല്ലുക.",question:"ഈ ആഴ്ച ദൈവം എന്നോട് “അതെ” ചോദിക്കുന്നത് എവിടെയാണ്?",
  special:"സൂബോറോയിലെ രണ്ടാം ഞായർ: വാഴ്ത്തപ്പെട്ട കന്യകാമറിയത്തിനുള്ള മംഗളവാർത്ത.",
  illus:["ഒരു ഉദാഹരണം","ബലിപീഠത്തിനു മുമ്പിൽ വധൂവരന്മാർ “സമ്മതം” പറയുമ്പോൾ ഒരു ചെറിയ വാക്ക് രണ്ടു ജീവിതങ്ങളെ മുഴുവൻ മാറ്റുന്നു. മറിയത്തിന്റെ “നിറവേറട്ടെ” അതിലും ചെറുതായിരുന്നു; അതു ലോകചരിത്രം മാറ്റി."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 1:30–31, 38.",explain:"ദൈവം ഗബ്രിയേൽ ദൂതനെ മറിയത്തിന്റെ അടുത്തേക്ക് അയച്ചു. അവൾ ദൈവത്തോട് “അതെ” പറഞ്ഞു; ദൈവപുത്രനായ യേശു അവളുടെ ഉദരത്തിൽ ഒരു കുഞ്ഞായി.",intention:"മറിയത്തെപ്പോലെ നമ്മളോരോരുത്തരും ദൈവത്തോട് “അതെ” പറയാൻ നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച ഞാൻ “അതെ” പറയാൻ ദൈവം ആഗ്രഹിക്കുന്ന ഒരു കാര്യം എന്താണ്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 484–486","മംഗളവാർത്ത: “കാലസമ്പൂർണത”."],["മതബോധനഗ്രന്ഥം 494","മറിയത്തിന്റെ സമ്മതവും വിശ്വാസത്തിന്റെ അനുസരണവും."]],
  kidsaint:["വിശുദ്ധ ഗബ്രിയേൽ മാലാഖ","“ദൈവം എന്റെ ശക്തി” എന്നാണ് ആ പേരിന്റെ അർഥം. ദാനിയേലിനും സഖറിയായ്ക്കും മറിയത്തിനും അദ്ദേഹം ദൈവസന്ദേശങ്ങൾ എത്തിച്ചു. പാഠം: പ്രാർഥനയിലും മാതാപിതാക്കളിലൂടെയും അധ്യാപകരിലൂടെയും ദൈവം സംസാരിക്കുമ്പോൾ ശ്രദ്ധയോടെ കേൾക്കുക."],
  term:["ദൈവമാതാവ് (തെയോതോക്കോസ്)","“ദൈവത്തെ പ്രസവിച്ചവൾ” എന്നർഥമുള്ള ഗ്രീക്കുപദം. അവൾ പ്രസവിച്ച ശിശു മനുഷ്യനായിത്തീർന്ന നിത്യദൈവപുത്രനാകയാൽ മറിയം യഥാർഥത്തിൽ ദൈവമാതാവാണെന്ന് എഫേസോസ് സൂനഹദോസ് (431) പഠിപ്പിച്ചു. സുറിയാനി പാരമ്പര്യത്തിൽ അവൾ “യൽദത്ത് ആലോഹോ” എന്നു വിളിക്കപ്പെടുന്നു."],
  termMore:["ത്രികാലജപം","മംഗളവാർത്തയെ അനുസ്മരിക്കുന്ന പ്രാർഥന; പരമ്പരാഗതമായി പള്ളിമണി മുഴങ്ങുമ്പോൾ രാവിലെയും ഉച്ചയ്ക്കും സന്ധ്യയ്ക്കും ചൊല്ലുന്നു: “കർത്താവിന്റെ മാലാഖ മറിയത്തോടു വചിച്ചു…”"]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, കഴിഞ്ഞ ഞായറാഴ്ച ജറുസലെമിലെ മഹാദേവാലയത്തിൽ ഒരു വൃദ്ധപുരോഹിതന്റെ അടുത്തേക്ക് ഒരു ദൂതൻ വന്നു. ഇന്ന് അതേ ദൂതൻ നസറത്ത് എന്ന ചെറിയ ഗ്രാമത്തിൽ മറിയം എന്ന യുവതിയുടെ അടുത്തേക്കു പോകുന്നു. ദൈവത്തിന്റെ ഏറ്റവും വലിയ പ്രവൃത്തി ആരംഭിക്കുന്നത് ഒരു ചെറിയ വീട്ടിൽ, ശ്രവിക്കുന്ന ഒരു ഹൃദയത്തിലാണ്.","ആദിമുതലേ ദൈവം ഇതു വാഗ്ദാനം ചെയ്തിരുന്നുവെന്നു നമ്മുടെ വായനകൾ ഓർമിപ്പിക്കുന്നു. ആദവും ഹവ്വായും പാപം ചെയ്തപ്പോൾ, സ്ത്രീയുടെ സന്തതി സർപ്പത്തിന്റെ തല തകർക്കുമെന്നു ദൈവം പറഞ്ഞു. നൂറ്റാണ്ടുകളോളം പ്രവാചകന്മാർ നിലവിളിച്ചു: “കർത്താവേ, ആകാശം പിളർന്ന് ഇറങ്ങി വരണമേ!” വിശുദ്ധ പൗലോസ് പറയുന്നു: “കാലസമ്പൂർണത വന്നപ്പോൾ ദൈവം തന്റെ പുത്രനെ അയച്ചു. അവൻ സ്ത്രീയിൽനിന്നു ജാതനായി.” ഇന്ന് ആ സമ്പൂർണത വന്നെത്തുന്നു.","മറിയം ഒരു ചോദ്യം ചോദിക്കുന്നു: “ഇത് എങ്ങനെ സംഭവിക്കും?” വിശ്വാസത്തിനു ചോദ്യങ്ങൾ ചോദിക്കാം. പിന്നെ ലോകത്തെ മാറ്റിയ വാക്കുകൾ അവൾ പറയുന്നു: “ഇതാ, കർത്താവിന്റെ ദാസി! നിന്റെ വാക്ക് എന്നിൽ നിറവേറട്ടെ!” പിതാക്കന്മാർ പറഞ്ഞു: ഹവ്വായുടെ അനുസരണക്കേട് ഒരു കെട്ടു മുറുക്കി; മറിയത്തിന്റെ അനുസരണം അത് അഴിച്ചു. അവളിലൂടെ ദൈവപുത്രൻ മനുഷ്യനായി; അതുകൊണ്ടാണു നാം അവളെ ദൈവമാതാവ് എന്നു വിളിക്കുന്നത്.","“അതെ” പറയുന്ന ഹൃദയങ്ങളെ ദൈവം ഇന്നും അന്വേഷിക്കുന്നു. ഒരുപക്ഷേ ആരോടെങ്കിലും ക്ഷമിക്കാനോ, ഒരു രോഗം സ്വീകരിക്കാനോ, പ്രാർഥനയ്ക്കു സമയം നൽകാനോ, പൗരോഹിത്യത്തിലേക്കോ സന്യാസത്തിലേക്കോ ഉള്ള വിളിക്ക് ഉത്തരം നൽകാനോ അവിടുന്നു നിന്നോടു ചോദിക്കുന്നുണ്ടാകാം. അൽപസമയത്തിനകം, മറിയത്തിന്റെമേൽ വന്നതുപോലെ പരിശുദ്ധാത്മാവ് ഈ ബലിപീഠത്തിൽ ഇറങ്ങിവരും. അവളോടൊപ്പം നമുക്കു പറയാം: “നിന്റെ വാക്ക് എന്നിൽ നിറവേറട്ടെ!” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, മറിയത്തിന്റെ ചെറിയ വീട്ടിൽ ആരാണു വന്നത്? ഗബ്രിയേൽ മാലാഖ! മാലാഖ പറഞ്ഞു: “മറിയമേ, ദൈവം നിന്നോടുകൂടെ. നിനക്ക് ഒരു കുഞ്ഞു ജനിക്കും; നീ അവന് യേശു എന്നു പേരിടണം.”","മറിയം പറഞ്ഞു: “അതെ, ദൈവം ആഗ്രഹിക്കുന്നതു ഞാൻ ചെയ്യാം.” ദൈവത്തിന്റെ സ്വന്തം പുത്രനായ യേശു അവളുടെ ഉള്ളിൽ ഒരു കുഞ്ഞുവാവയായി.","ഓരോ ദിവസവും ദൈവം നമ്മോടു ചെറിയ കാര്യങ്ങൾ ചോദിക്കുന്നു: അനുസരിക്കാൻ, പങ്കുവയ്ക്കാൻ, പ്രാർഥിക്കാൻ. മറിയത്തെപ്പോലെ നമുക്കു പറയാം: “അതെ, ദൈവമേ!”"]});

/* ================= VISITATION · 29 November 2026 ================= */
put("2026-11-29","en",{title:"Sunday of the Visitation of Mary, Mother of God, to Elizabeth",readTitle:EN.rt,
 readings:[[EN.eg,"Luke 1:39–45","Mary greets Elizabeth"],[EN.ot,"Genesis 24:15–27","Rebekah at the well"],[EN.ot,"1 Samuel 2:1–11","Hannah's song"],[EN.ot,"Proverbs 31:10–26","The capable woman"],[EN.ot,"Isaiah 29:17–24","The deaf shall hear, the blind shall see"],[EN.ce,"1 Peter 2:6–10","Chosen and precious"],[EN.pa,"1 Timothy 2:4–10","God desires everyone to be saved"],[EN.go,"Luke 1:39–56","The Visitation and the Magnificat"]],
 alt:"Third Sunday of Suboro. The Twenty-Five Days Nombu (fast before Yaldo) begins on Tuesday 1 December.",
 verse:"And blessed is she who believed that there would be a fulfillment of what was spoken to her by the Lord.",cite:"Luke 1:45",
 theo:["After the angel leaves, Mary does not stay at home to enjoy her secret. St Luke says she “set out and went with haste” to the hill country to visit Elizabeth. The first thing the Mother of God does, with the Son of God in her womb, is to serve. Faith that has received Christ goes out.","When Mary greets Elizabeth, the child John leaps in his mother's womb and Elizabeth is filled with the Holy Spirit. John, who will later point to the Lamb of God, recognises him already before birth. Elizabeth cries out: “Blessed are you among women, and blessed is the fruit of your womb… why has this happened to me, that the mother of my Lord comes to me?” With these words the Church has greeted Mary ever since.","Mary answers with the Magnificat: “My soul magnifies the Lord, and my spirit rejoices in God my Savior.” Her song is full of the Old Testament, especially Hannah's song: “My heart exults in the LORD… He raises up the poor from the dust” (1 Samuel 2:1, 8). God looks on the lowly, scatters the proud, fills the hungry, and remembers his mercy to Abraham. Mary sings not about herself but about God.","The readings also praise faithful women: Rebekah's kindness at the well (Genesis 24), the capable wife of Proverbs 31, whose strength is the fear of the Lord. Mary is blessed above all because she believed. And St Paul reminds us that God “desires everyone to be saved” (1 Timothy 2:4). The Visitation is the first Christian mission: Christ carried to a home, and a home filled with joy."],
 conn:[["The Ark comes to the hill country.","David asked, “How can the ark of the LORD come into my care?” and the ark stayed three months in the house of Obed-edom (2 Samuel 6:9–11). Elizabeth asks, “Why has this happened to me, that the mother of my Lord comes to me?” and Mary stays about three months (Luke 1:56). Mary is the new Ark."],["Hannah and Mary.","Both sing after God has worked a wonder in a woman's womb; both praise the God who lifts up the lowly."],["Rebekah at the well.","Rebekah's prompt, generous service to a stranger (Genesis 24:18–20) foreshadows Mary hurrying to serve Elizabeth."],["The deaf hear, the blind see.","Isaiah 29:18 is fulfilled when the unborn John “hears” Mary's greeting and leaps for joy."]],
 altar:["Mary carried Christ hidden within her into Elizabeth's house. After every Holy Qurbono we too go home carrying Christ within us. The Visitation teaches us what to do after Communion: go in haste to serve, and bring joy."],
 outline:[["Opening","Ask: what is the first thing you do after receiving good news?"],["Point 1 · Faith that goes out","Mary “went with haste” to serve. Receiving Christ leads to mission."],["Point 2 · The leap of joy","John recognises Christ before birth: a word on the dignity of the unborn."],["Point 3 · The Magnificat","God lifts the lowly and fills the hungry. Mary's song is a programme of Christian life."],["Point 4 · Preparing for Yaldo","The 25-day Nombu begins: prayer, fasting and visiting someone who needs us."],["Take-home line","“Blessed is she who believed.” Blessed are we when we believe."]],
 live:[["Visit someone (Luke 1:39)","During the Nombu, visit an elderly, sick or lonely person in your family or parish."],["Pray the Magnificat (Luke 1:46–55)","Pray Mary's song each evening this week, slowly, thanking God for one gift of the day."],["Keep the 25-day Nombu","Decide now how your family will keep the fast from 1 December: food, screens, and charity."]],
 fathers:[["St Ambrose of Milan","“Let the soul of Mary be in each one of you to magnify the Lord; let the spirit of Mary be in each one to rejoice in God” (Exposition of the Gospel of Luke 2, 26)."],["St Bede the Venerable","He calls the Magnificat a song to be sung daily by the Church, because it teaches us to give glory to God for the gift of the Incarnation (Homilies on the Gospels I, 4)."]],
 magis:[["Redemptoris Mater 12","In the Visitation Mary is blessed for her faith; Elizabeth's words reveal the “obedience of faith” by which Mary welcomed the Word."],["Evangelii Gaudium 288","Mary is the woman who “sets out in haste”; there is a Marian “style” in the Church's evangelising work: tenderness, humility and service."],["Catechism 2676","The words of Elizabeth, together with the angel's greeting, form the first part of the Hail Mary."]],
 saints:[["This week (fixed dates)","30 Nov: St Andrew, Apostle. 1 Dec: beginning of the Twenty-Five Days Nombu. 3 Dec: St Francis Xavier. 4 Dec: St John Damascene. Confirm in the 2026–27 lectionary."]],
 prayer:"Lord God, Mary carried your Son in haste to Elizabeth and filled her house with joy. As we begin the fast before Yaldo, make us carry Christ to those who need him, and let our souls, with hers, magnify your name. Amen."},
 {quick:["Mary, carrying Christ, goes in haste to serve.","John leaps for joy: Christ is recognised even before birth.","The Magnificat: God lifts the lowly and fills the hungry."],action:"During the Nombu, visit someone who is lonely or sick.",question:"Whom is God asking me to visit this Nombu?",
  special:"Third Sunday of Suboro. Remind the faithful that the Twenty-Five Days Nombu begins on 1 December.",
  illus:["An illustration","In many Kerala parishes the family units visit the homes of the sick before Christmas with a carol and a small gift. The visit costs little, but people remember it for years. That is the Visitation in our own day."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 1:39–45.",explain:"When Mary heard that her cousin Elizabeth was expecting a baby, she hurried to help her. Baby John jumped for joy because Jesus had come close!",intention:"We pray for mothers who are expecting a baby, and for all the unborn children.",ask:"Ask: “Whom can our family visit or help before Christmas?”"},
  catechism:[["CCC 717","John the Baptist, filled with the Holy Spirit from his mother's womb."],["CCC 2619","The Magnificat, the song of the Mother of God and of the Church."]],
  kidsaint:["St Andrew the Apostle (30 Nov)","A fisherman who met Jesus and ran to tell his brother Simon: “We have found the Messiah!” He brought Peter to Jesus. Lesson: when you find something good, share it, especially Jesus."],
  term:["Twenty-Five Days Nombu (ഇരുപത്തഞ്ചു നോമ്പ്)","The fast before Yaldo (Christmas), kept from 1 to 25 December. It is a time of prayer, abstinence and charity, preparing to welcome Christ."],
  termMore:["The Magnificat","Mary's song (Luke 1:46–55), named after its first word in Latin. It is sung daily in the evening prayer of the Church in many traditions."]},
 {homily:["Dear brothers and sisters, what do we do when we receive great news? We pick up the phone and tell someone. When Mary received the greatest news in history, she did something more: she set out and went with haste to the hill country, to help her elderly cousin Elizabeth.","Imagine the scene. Mary greets Elizabeth, and the baby in Elizabeth's womb leaps for joy. John recognises Jesus before either of them is born. Elizabeth, filled with the Holy Spirit, says: “Blessed are you among women, and blessed is the fruit of your womb.” Every time we pray the Hail Mary, we repeat her words.","Then Mary sings: “My soul magnifies the Lord, and my spirit rejoices in God my Savior.” She does not sing about herself. She sings about a God who looks on the lowly, lifts up the poor, fills the hungry with good things, and sends the proud away empty. Like Hannah before her, she knows that God works through the small and the humble.","On Tuesday the Twenty-Five Days Nombu begins. Let us keep it like Mary: not only by giving up food, but by going out. Visit someone who is old, sick or lonely. Carry Christ to them, as Mary did. And after every Holy Qurbono, remember: you leave this church as Mary left Nazareth, carrying the Lord within you. Amen."],
  kids:["Children, Mary had a cousin called Elizabeth who was going to have a baby. Mary walked a long way over the hills to help her.","When Mary said hello, baby John jumped inside Elizabeth's tummy, because Jesus was there inside Mary! John was so happy.","Before Christmas, let's be like Mary: help someone at home, visit Grandma or Grandpa, and bring Jesus' joy. Let's say: “I will bring Jesus to others!”"]});

put("2026-11-29","ml",{title:"ദൈവമാതാവായ മറിയം എലിസബത്തിനെ സന്ദർശിച്ചതിന്റെ ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 1:39–45","മറിയം എലിസബത്തിനെ അഭിവാദനം ചെയ്യുന്നു"],[ML.ot,"ഉൽപത്തി 24:15–27","കിണറ്റിൻകരയിലെ റബേക്കാ"],[ML.ot,"1 സാമുവൽ 2:1–11","ഹന്നായുടെ കീർത്തനം"],[ML.ot,"സുഭാഷിതങ്ങൾ 31:10–26","ഉത്തമയായ സ്ത്രീ"],[ML.ot,"ഏശയ്യാ 29:17–24","ചെകിടർ കേൾക്കും, അന്ധർ കാണും"],[ML.ce,"1 പത്രോസ് 2:6–10","തിരഞ്ഞെടുക്കപ്പെട്ടവരും വിലപ്പെട്ടവരും"],[ML.pa,"1 തിമോത്തേയോസ് 2:4–10","എല്ലാവരും രക്ഷ പ്രാപിക്കണമെന്നു ദൈവം ആഗ്രഹിക്കുന്നു"],[ML.go,"ലൂക്കാ 1:39–56","സന്ദർശനവും മറിയത്തിന്റെ സ്തോത്രഗീതവും"]],
 alt:"സൂബോറോയിലെ മൂന്നാം ഞായർ. യൽദോയ്ക്കു മുമ്പുള്ള ഇരുപത്തഞ്ചു നോമ്പ് ഡിസംബർ 1 ചൊവ്വാഴ്ച ആരംഭിക്കുന്നു.",
 verse:"കർത്താവ് അരുളിച്ചെയ്ത കാര്യങ്ങൾ നിറവേറുമെന്ന് വിശ്വസിച്ചവൾ ഭാഗ്യവതി.",cite:"ലൂക്കാ 1:45",
 theo:["ദൂതൻ പോയശേഷം തന്റെ രഹസ്യം ആസ്വദിച്ചു മറിയം വീട്ടിലിരിക്കുന്നില്ല. എലിസബത്തിനെ സന്ദർശിക്കാൻ അവൾ മലമ്പ്രദേശത്തേക്കു തിടുക്കത്തിൽ യാത്രയായെന്നു വിശുദ്ധ ലൂക്കാ പറയുന്നു. ഉദരത്തിൽ ദൈവപുത്രനെ വഹിക്കുന്ന ദൈവമാതാവ് ആദ്യം ചെയ്യുന്നതു ശുശ്രൂഷയാണ്. ക്രിസ്തുവിനെ സ്വീകരിച്ച വിശ്വാസം പുറത്തേക്കു പോകുന്നു.","മറിയം എലിസബത്തിനെ അഭിവാദനം ചെയ്യുമ്പോൾ “എലിസബത്തിന്റെ ഉദരത്തിൽ ശിശു കുതിച്ചു ചാടി. എലിസബത്ത് പരിശുദ്ധാത്മാവു നിറഞ്ഞവളായി.” പിന്നീടു ദൈവത്തിന്റെ കുഞ്ഞാടിനെ ചൂണ്ടിക്കാണിക്കാനിരിക്കുന്ന യോഹന്നാൻ ജനനത്തിനു മുമ്പുതന്നെ അവിടുത്തെ തിരിച്ചറിയുന്നു. എലിസബത്ത് ഉദ്ഘോഷിക്കുന്നു: “നീ സ്ത്രീകളിൽ അനുഗൃഹീതയാണ്. നിന്റെ ഉദരഫലവും അനുഗൃഹീതം. എന്റെ കർത്താവിന്റെ അമ്മ എന്റെ അടുത്തു വരാനുള്ള ഈ ഭാഗ്യം എനിക്ക് എവിടെ നിന്ന്?” അന്നുമുതൽ സഭ ഈ വാക്കുകളോടെ മറിയത്തെ അഭിവാദനം ചെയ്യുന്നു.","സ്തോത്രഗീതംകൊണ്ടു മറിയം മറുപടി പറയുന്നു: “എന്റെ ചിത്തം എന്റെ രക്ഷകനായ ദൈവത്തിൽ ആനന്ദിക്കുന്നു. അവിടുന്ന് തന്റെ ദാസിയുടെ താഴ്മയെ കടാക്ഷിച്ചു.” അവളുടെ ഗീതം പഴയനിയമംകൊണ്ടു നിറഞ്ഞതാണ്, പ്രത്യേകിച്ചു ഹന്നായുടെ കീർത്തനംകൊണ്ട്: “എന്റെ ഹൃദയം കർത്താവിൽ ആനന്ദിക്കുന്നു… ദരിദ്രനെ അവിടുന്നു ധൂളിയിൽനിന്ന് ഉയർത്തുന്നു” (1 സാമു 2:1, 8). ദൈവം എളിയവരെ കടാക്ഷിക്കുന്നു, അഹങ്കാരികളെ ചിതറിക്കുന്നു, വിശക്കുന്നവരെ തൃപ്തരാക്കുന്നു, അബ്രാഹത്തോടുള്ള കരുണ ഓർക്കുന്നു. മറിയം തന്നെപ്പറ്റിയല്ല, ദൈവത്തെപ്പറ്റിയാണു പാടുന്നത്.","വിശ്വസ്തരായ സ്ത്രീകളെയും വായനകൾ പ്രകീർത്തിക്കുന്നു: കിണറ്റിൻകരയിലെ റബേക്കായുടെ ദയ (ഉൽപ 24), ദൈവഭക്തിയിൽ ശക്തിയുള്ള സുഭാഷിതങ്ങൾ 31-ലെ ഉത്തമയായ ഭാര്യ: “ദൈവഭക്തിയുള്ള സ്ത്രീ പ്രശംസ അർഹിക്കുന്നു” (സുഭാ 31:30). എല്ലാറ്റിലുമുപരി മറിയം ഭാഗ്യവതിയാകുന്നത് അവൾ വിശ്വസിച്ചതുകൊണ്ടാണ്. എല്ലാവരും രക്ഷ പ്രാപിക്കണമെന്നു ദൈവം ആഗ്രഹിക്കുന്നുവെന്നു വിശുദ്ധ പൗലോസ് ഓർമിപ്പിക്കുന്നു (1 തിമോ 2:4). ആദ്യത്തെ ക്രൈസ്തവദൗത്യമാണു സന്ദർശനം: ഒരു ഭവനത്തിലേക്കു ക്രിസ്തു വഹിക്കപ്പെടുന്നു; ആ ഭവനം സന്തോഷംകൊണ്ടു നിറയുന്നു."],
 conn:[["പേടകം മലമ്പ്രദേശത്തേക്കു വരുന്നു.","“കർത്താവിന്റെ പേടകം എന്റെ അടുക്കൽ എങ്ങനെ വരും?” എന്നു ദാവീദ് ചോദിച്ചു; പേടകം മൂന്നു മാസം ഓബദ്-ഏദോമിന്റെ ഭവനത്തിൽ താമസിച്ചു (2 സാമു 6:9–11). “എന്റെ കർത്താവിന്റെ അമ്മ എന്റെ അടുത്തു വരാനുള്ള ഈ ഭാഗ്യം എനിക്ക് എവിടെ നിന്ന്?” എന്ന് എലിസബത്ത് ചോദിക്കുന്നു; “മറിയം അവളുടെകൂടെ മൂന്നു മാസത്തോളം താമസിച്ചു” (ലൂക്കാ 1:56). മറിയം പുതിയ പേടകമാണ്."],["ഹന്നായും മറിയവും.","ഒരു സ്ത്രീയുടെ ഉദരത്തിൽ ദൈവം ഒരു അദ്ഭുതം പ്രവർത്തിച്ചശേഷം ഇരുവരും പാടുന്നു; എളിയവരെ ഉയർത്തുന്ന ദൈവത്തെ ഇരുവരും സ്തുതിക്കുന്നു."],["കിണറ്റിൻകരയിലെ റബേക്കാ.","ഒരു അപരിചിതനു റബേക്കാ നൽകിയ തിടുക്കമുള്ള, ഉദാരമായ ശുശ്രൂഷ (ഉൽപ 24:18–20) എലിസബത്തിനെ ശുശ്രൂഷിക്കാൻ തിടുക്കപ്പെട്ടുപോകുന്ന മറിയത്തിന്റെ മുന്നോടിയാണ്."],["ചെകിടർ കേൾക്കുന്നു, അന്ധർ കാണുന്നു.","“അന്നു ചെകിടർ ഗ്രന്ഥത്തിലെ വാക്കുകൾ വായിച്ചുകേൾക്കും” (ഏശ 29:18): ജനിക്കാത്ത യോഹന്നാൻ മറിയത്തിന്റെ അഭിവാദനം “കേട്ടു” സന്തോഷത്താൽ കുതിച്ചുചാടുമ്പോൾ ഇതു നിറവേറുന്നു."]],
 altar:["തന്റെ ഉള്ളിൽ മറഞ്ഞിരുന്ന ക്രിസ്തുവിനെ മറിയം എലിസബത്തിന്റെ ഭവനത്തിലേക്കു വഹിച്ചു. ഓരോ വിശുദ്ധ കുർബാനയ്ക്കുശേഷവും നാമും ക്രിസ്തുവിനെ ഉള്ളിൽ വഹിച്ചുകൊണ്ടു വീട്ടിലേക്കു പോകുന്നു. കുർബാനസ്വീകരണത്തിനുശേഷം എന്തു ചെയ്യണമെന്നു സന്ദർശനം പഠിപ്പിക്കുന്നു: ശുശ്രൂഷിക്കാൻ തിടുക്കത്തിൽ പോകുക, സന്തോഷം കൊണ്ടുചെല്ലുക."],
 outline:[["ആരംഭം","ചോദിക്കുക: ഒരു നല്ല വാർത്ത കിട്ടിയാൽ നിങ്ങൾ ആദ്യം എന്താണു ചെയ്യുന്നത്?"],["ഒന്നാം ആശയം · പുറത്തേക്കു പോകുന്ന വിശ്വാസം","ശുശ്രൂഷിക്കാൻ മറിയം തിടുക്കത്തിൽ യാത്രയായി. ക്രിസ്തുവിനെ സ്വീകരിക്കുന്നതു ദൗത്യത്തിലേക്കു നയിക്കുന്നു."],["രണ്ടാം ആശയം · സന്തോഷത്തിന്റെ കുതിപ്പ്","ജനനത്തിനു മുമ്പേ യോഹന്നാൻ ക്രിസ്തുവിനെ തിരിച്ചറിയുന്നു: ജനിക്കാത്ത ശിശുക്കളുടെ മഹത്വത്തെപ്പറ്റി ഒരു വാക്ക്."],["മൂന്നാം ആശയം · സ്തോത്രഗീതം","ദൈവം എളിയവരെ ഉയർത്തുന്നു, വിശക്കുന്നവരെ തൃപ്തരാക്കുന്നു. മറിയത്തിന്റെ ഗീതം ക്രൈസ്തവജീവിതത്തിന്റെ ഒരു കർമപദ്ധതിയാണ്."],["നാലാം ആശയം · യൽദോയ്ക്ക് ഒരുങ്ങാൻ","ഇരുപത്തഞ്ചു നോമ്പ് ആരംഭിക്കുന്നു: പ്രാർഥന, ഉപവാസം, നമ്മെ ആവശ്യമുള്ള ഒരാളെ സന്ദർശിക്കൽ."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“വിശ്വസിച്ചവൾ ഭാഗ്യവതി.” നാം വിശ്വസിക്കുമ്പോൾ നാമും ഭാഗ്യവാന്മാർ."]],
 live:[["ഒരാളെ സന്ദർശിക്കുക (ലൂക്കാ 1:39)","നോമ്പുകാലത്തു നിന്റെ കുടുംബത്തിലോ ഇടവകയിലോ ഉള്ള ഒരു വൃദ്ധനെയോ രോഗിയെയോ ഏകാകിയെയോ സന്ദർശിക്കുക."],["സ്തോത്രഗീതം പ്രാർഥിക്കുക (ലൂക്കാ 1:46–55)","ഈ ആഴ്ച എല്ലാ സന്ധ്യയിലും, ആ ദിവസത്തെ ഒരു ദാനത്തിനു ദൈവത്തിനു നന്ദി പറഞ്ഞുകൊണ്ട്, മറിയത്തിന്റെ ഗീതം സാവധാനം പ്രാർഥിക്കുക."],["ഇരുപത്തഞ്ചു നോമ്പ് ആചരിക്കുക","ഡിസംബർ 1 മുതൽ കുടുംബം നോമ്പ് എങ്ങനെ ആചരിക്കുമെന്ന് ഇപ്പോൾത്തന്നെ തീരുമാനിക്കുക: ഭക്ഷണം, സ്ക്രീനുകൾ, ഉപവി."]],
 fathers:[["മിലാനിലെ വിശുദ്ധ അംബ്രോസ്","കർത്താവിനെ മഹത്വപ്പെടുത്താൻ മറിയത്തിന്റെ ആത്മാവ് നിങ്ങളോരോരുത്തരിലും ഉണ്ടായിരിക്കട്ടെ; ദൈവത്തിൽ ആനന്ദിക്കാൻ മറിയത്തിന്റെ ചൈതന്യം ഓരോരുത്തരിലും ഉണ്ടായിരിക്കട്ടെ (ലൂക്കാസുവിശേഷവ്യാഖ്യാനം 2, 26)."],["വന്ദ്യനായ വിശുദ്ധ ബീഡ്","മനുഷ്യാവതാരമെന്ന ദാനത്തിനു ദൈവത്തെ മഹത്വപ്പെടുത്താൻ പഠിപ്പിക്കുന്നതുകൊണ്ട് സഭ അനുദിനം പാടേണ്ട ഗീതമാണു സ്തോത്രഗീതമെന്ന് അദ്ദേഹം പറയുന്നു (സുവിശേഷപ്രസംഗങ്ങൾ I, 4)."]],
 magis:[["രക്ഷകന്റെ അമ്മ (റിഡംപ്തോറിസ് മാത്തെർ) 12","സന്ദർശനത്തിൽ മറിയം അവളുടെ വിശ്വാസത്തെപ്രതി ഭാഗ്യവതി എന്നു വിളിക്കപ്പെടുന്നു; വചനത്തെ സ്വീകരിച്ച “വിശ്വാസത്തിന്റെ അനുസരണം” എലിസബത്തിന്റെ വാക്കുകൾ വെളിപ്പെടുത്തുന്നു."],["സുവിശേഷത്തിന്റെ ആനന്ദം (എവാഞ്ചേലി ഗൗദിയും) 288","“തിടുക്കത്തിൽ പുറപ്പെടുന്ന” സ്ത്രീയാണു മറിയം; സഭയുടെ സുവിശേഷവത്കരണത്തിന് ഒരു മരിയൻ “ശൈലി”യുണ്ട്: ആർദ്രത, വിനയം, ശുശ്രൂഷ."],["മതബോധനഗ്രന്ഥം 2676","ദൂതന്റെ അഭിവാദനവും എലിസബത്തിന്റെ വാക്കുകളും ചേർന്നാണു “നന്മ നിറഞ്ഞ മറിയമേ” എന്ന പ്രാർഥനയുടെ ആദ്യഭാഗം രൂപപ്പെടുന്നത്."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","നവംബർ 30: വിശുദ്ധ അന്ത്രയോസ് ശ്ലീഹാ. ഡിസംബർ 1: ഇരുപത്തഞ്ചു നോമ്പ് ആരംഭം. ഡിസംബർ 3: വിശുദ്ധ ഫ്രാൻസിസ് സേവ്യർ. ഡിസംബർ 4: ദമാസ്കസിലെ വിശുദ്ധ യോഹന്നാൻ. 2026–27-ലെ വായനാപുസ്തകത്തിൽ ഉറപ്പുവരുത്തുക."]],
 prayer:"കർത്താവായ ദൈവമേ, മറിയം അങ്ങയുടെ പുത്രനെ തിടുക്കത്തിൽ എലിസബത്തിന്റെ അടുത്തേക്കു വഹിച്ചു; അവളുടെ ഭവനം സന്തോഷംകൊണ്ടു നിറച്ചു. യൽദോയ്ക്കു മുമ്പുള്ള നോമ്പ് ആരംഭിക്കുമ്പോൾ, ക്രിസ്തുവിനെ ആവശ്യമുള്ളവരിലേക്ക് അവിടുത്തെ വഹിക്കാൻ ഞങ്ങളെ സഹായിക്കണമേ; അവളോടൊപ്പം ഞങ്ങളുടെ ആത്മാക്കളും അങ്ങയുടെ നാമത്തെ മഹത്വപ്പെടുത്തട്ടെ. ആമേൻ."},
 {quick:["ക്രിസ്തുവിനെ വഹിക്കുന്ന മറിയം ശുശ്രൂഷിക്കാൻ തിടുക്കത്തിൽ പോകുന്നു.","യോഹന്നാൻ സന്തോഷത്താൽ കുതിക്കുന്നു: ജനനത്തിനു മുമ്പേ ക്രിസ്തു തിരിച്ചറിയപ്പെടുന്നു.","സ്തോത്രഗീതം: ദൈവം എളിയവരെ ഉയർത്തുന്നു, വിശക്കുന്നവരെ തൃപ്തരാക്കുന്നു."],action:"നോമ്പുകാലത്ത് ഏകാകിയോ രോഗിയോ ആയ ഒരാളെ സന്ദർശിക്കുക.",question:"ഈ നോമ്പിൽ ആരെ സന്ദർശിക്കാനാണു ദൈവം എന്നോട് ആവശ്യപ്പെടുന്നത്?",
  special:"സൂബോറോയിലെ മൂന്നാം ഞായർ. ഇരുപത്തഞ്ചു നോമ്പ് ഡിസംബർ 1-ന് ആരംഭിക്കുന്നുവെന്നു വിശ്വാസികളെ ഓർമിപ്പിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പല ഇടവകകളിലും ക്രിസ്മസിനു മുമ്പു കുടുംബയൂണിറ്റുകൾ ഒരു കരോൾഗാനവും ചെറിയ സമ്മാനവുമായി രോഗികളുടെ ഭവനങ്ങൾ സന്ദർശിക്കുന്നു. ആ സന്ദർശനത്തിനു ചെലവു കുറവാണ്; പക്ഷേ ആളുകൾ വർഷങ്ങളോളം അത് ഓർക്കുന്നു. ഇതാണു നമ്മുടെ കാലത്തെ സന്ദർശനം."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 1:39–45.",explain:"തന്റെ ബന്ധുവായ എലിസബത്ത് ഒരു കുഞ്ഞിനെ പ്രതീക്ഷിക്കുന്നുവെന്നു കേട്ടപ്പോൾ മറിയം അവളെ സഹായിക്കാൻ തിടുക്കത്തിൽ പോയി. യേശു അടുത്തുവന്നതുകൊണ്ടു കുഞ്ഞായ യോഹന്നാൻ സന്തോഷത്താൽ കുതിച്ചുചാടി!",intention:"ഒരു കുഞ്ഞിനെ പ്രതീക്ഷിക്കുന്ന അമ്മമാർക്കും ജനിക്കാനിരിക്കുന്ന എല്ലാ ശിശുക്കൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ക്രിസ്മസിനു മുമ്പു നമ്മുടെ കുടുംബത്തിന് ആരെ സന്ദർശിക്കാം, സഹായിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 717","അമ്മയുടെ ഉദരത്തിൽവച്ചുതന്നെ പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ സ്നാപകയോഹന്നാൻ."],["മതബോധനഗ്രന്ഥം 2619","ദൈവമാതാവിന്റെയും സഭയുടെയും ഗീതമായ സ്തോത്രഗീതം."]],
  kidsaint:["വിശുദ്ധ അന്ത്രയോസ് ശ്ലീഹാ (നവംബർ 30)","യേശുവിനെ കണ്ടുമുട്ടിയപ്പോൾ “ഞങ്ങൾ മിശിഹായെ കണ്ടെത്തി!” എന്നു പറയാൻ തന്റെ സഹോദരൻ ശിമയോന്റെ അടുത്തേക്ക് ഓടിയ ഒരു മീൻപിടിത്തക്കാരൻ. അദ്ദേഹം പത്രോസിനെ യേശുവിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു. പാഠം: നല്ല ഒന്നു കണ്ടെത്തുമ്പോൾ, പ്രത്യേകിച്ചു യേശുവിനെ, മറ്റുള്ളവരുമായി പങ്കുവയ്ക്കുക."],
  term:["ഇരുപത്തഞ്ചു നോമ്പ്","ഡിസംബർ 1 മുതൽ 25 വരെ ആചരിക്കുന്ന, യൽദോയ്ക്കു (ക്രിസ്മസ്) മുമ്പുള്ള നോമ്പ്. ക്രിസ്തുവിനെ സ്വീകരിക്കാൻ ഒരുങ്ങുന്ന പ്രാർഥനയുടെയും വർജനത്തിന്റെയും ഉപവിയുടെയും കാലം."],
  termMore:["സ്തോത്രഗീതം (മാഗ്നിഫിക്കാത്ത്)","മറിയത്തിന്റെ ഗീതം (ലൂക്കാ 1:46–55); ലത്തീനിലെ ആദ്യവാക്കിൽനിന്നാണ് ഈ പേര്. പല പാരമ്പര്യങ്ങളിലും സഭയുടെ സന്ധ്യാപ്രാർഥനയിൽ ഇത് അനുദിനം ആലപിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, വലിയ ഒരു വാർത്ത കിട്ടുമ്പോൾ നാം എന്തു ചെയ്യും? ഫോണെടുത്ത് ആരോടെങ്കിലും പറയും. ചരിത്രത്തിലെ ഏറ്റവും വലിയ വാർത്ത ലഭിച്ചപ്പോൾ മറിയം അതിലേറെ ചെയ്തു: പ്രായമായ തന്റെ ബന്ധു എലിസബത്തിനെ സഹായിക്കാൻ അവൾ മലമ്പ്രദേശത്തേക്കു തിടുക്കത്തിൽ യാത്രയായി.","ആ രംഗം സങ്കൽപിക്കുക. മറിയം എലിസബത്തിനെ അഭിവാദനം ചെയ്യുന്നു; എലിസബത്തിന്റെ ഉദരത്തിൽ ശിശു സന്തോഷത്താൽ കുതിച്ചുചാടുന്നു. ഇരുവരും ജനിക്കുന്നതിനു മുമ്പേ യോഹന്നാൻ യേശുവിനെ തിരിച്ചറിയുന്നു. പരിശുദ്ധാത്മാവു നിറഞ്ഞ എലിസബത്ത് പറയുന്നു: “നീ സ്ത്രീകളിൽ അനുഗൃഹീതയാണ്. നിന്റെ ഉദരഫലവും അനുഗൃഹീതം.” “നന്മ നിറഞ്ഞ മറിയമേ” ചൊല്ലുമ്പോഴെല്ലാം നാം അവളുടെ വാക്കുകൾ ആവർത്തിക്കുന്നു.","പിന്നെ മറിയം പാടുന്നു: “എന്റെ ചിത്തം എന്റെ രക്ഷകനായ ദൈവത്തിൽ ആനന്ദിക്കുന്നു. അവിടുന്ന് തന്റെ ദാസിയുടെ താഴ്മയെ കടാക്ഷിച്ചു.” അവൾ തന്നെപ്പറ്റിയല്ല പാടുന്നത്. എളിയവരെ കടാക്ഷിക്കുകയും ദരിദ്രരെ ഉയർത്തുകയും വിശക്കുന്നവരെ നന്മകൾകൊണ്ടു നിറയ്ക്കുകയും അഹങ്കാരികളെ വെറുംകൈയോടെ അയയ്ക്കുകയും ചെയ്യുന്ന ഒരു ദൈവത്തെപ്പറ്റിയാണ്. തനിക്കു മുമ്പുള്ള ഹന്നായെപ്പോലെ, ചെറിയവരിലൂടെയും എളിയവരിലൂടെയുമാണു ദൈവം പ്രവർത്തിക്കുന്നതെന്ന് അവൾക്കറിയാം.","ചൊവ്വാഴ്ച ഇരുപത്തഞ്ചു നോമ്പ് ആരംഭിക്കുന്നു. മറിയത്തെപ്പോലെ നമുക്ക് അത് ആചരിക്കാം: ഭക്ഷണം ഉപേക്ഷിച്ചുകൊണ്ടു മാത്രമല്ല, പുറത്തേക്കു പോയിക്കൊണ്ട്. പ്രായമായ, രോഗിയായ, ഏകാകിയായ ഒരാളെ സന്ദർശിക്കുക. മറിയം ചെയ്തതുപോലെ അവരിലേക്കു ക്രിസ്തുവിനെ വഹിക്കുക. ഓരോ വിശുദ്ധ കുർബാനയ്ക്കുശേഷവും ഓർക്കുക: മറിയം നസറത്ത് വിട്ടതുപോലെ, കർത്താവിനെ ഉള്ളിൽ വഹിച്ചുകൊണ്ടാണു നീ ഈ ദേവാലയം വിടുന്നത്. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഒരു കുഞ്ഞുവാവയെ പ്രതീക്ഷിച്ചിരുന്ന എലിസബത്ത് എന്ന ഒരു ബന്ധു മറിയത്തിനുണ്ടായിരുന്നു. അവളെ സഹായിക്കാൻ മറിയം മലകൾ കടന്ന് ഒരുപാടു ദൂരം നടന്നു.","മറിയം “ഹലോ” പറഞ്ഞപ്പോൾ എലിസബത്തിന്റെ വയറ്റിൽ കുഞ്ഞായ യോഹന്നാൻ തുള്ളിച്ചാടി; കാരണം മറിയത്തിന്റെ ഉള്ളിൽ യേശു ഉണ്ടായിരുന്നു! യോഹന്നാന് അത്ര സന്തോഷമായി.","ക്രിസ്മസിനു മുമ്പു നമുക്കു മറിയത്തെപ്പോലെയാകാം: വീട്ടിൽ ഒരാളെ സഹായിക്കുക, അപ്പച്ചനെയോ അമ്മച്ചിയെയോ സന്ദർശിക്കുക, യേശുവിന്റെ സന്തോഷം കൊണ്ടുചെല്ലുക. നമുക്കു പറയാം: “ഞാൻ മറ്റുള്ളവരിലേക്കു യേശുവിനെ കൊണ്ടുചെല്ലും!”"]});

"2026-01-05":{"t":["Second Monday of Nativity"],"g":[{"h":"","r":[["1 Jn 5:1-5","Those who believe in Jesus are sons of God"],["Jn 5:19-23","The Son who does the works of the Father SEASON OF EPIPHANY (DENHA) The Syriac word Denaha has several meanings like dawn, manifestation, epiphany and revelation. In the season of epiphany we commemorate, the manifestation that began during the Baptism of Jesus at river Jordan. Jesus reveals Himself to the world, and the Father and the Holy Spirit give witness to it. “This is my beloved Son, with whom I am well pleased” (Mt. 3:17). The Mystery of Holy Trinity is revealed at the baptism of Jesus Christ. The Lord's Epiphany that is celebrated on 6th January, is called “feast of pindikuthi” in the northern region of Kerala and “feast of rakkuli” in the southern region. The expression, “the feast of pindikuthi” is derived from the practice of lighting wicks around the stem of plantain tree, by making procession around it shouting el payya (God is Light), to honour and praise Christ who is ‘the Light of the world'. The other name, ‘rakkuli' is derived from the practice of taking bath (ritual bath) in the nearby river or pond, on the eve of this feast, by our ancestors as reminder of the Baptism of Jesus Christ at river Jordan. It was completely a religious rite."]]},{"h":"All the readings of this season of Epiphany that commemorate the","r":[]},{"h":"public life of Christ, lead us to the personality of Christ. The election","r":[]},{"h":"of the apostles, as an important event of the public life, is also a","r":[]},{"h":"subject matter of meditation of the season of Epiphany. During this","r":[]},{"h":"season the Church teaches us that Christ, the Lamb of God who takes","r":[]},{"h":"away the sin, has come to find the sinners and, the salvation and the","r":[]},{"h":"forgiveness of sin are through Christ, the Son of God. Through the","r":[]},{"h":"readings of this season, we receive the knowledge and experience that","r":[]},{"h":"Jesus is the Fulfilment of the law, the Bread of life and the Merciful","r":[]},{"h":"and Good shepherd who send the apostles to the sheep who have no","r":[]},{"h":"shepherds.","r":[]},{"h":"On the Fridays of this season, the Church commemorates the","r":[]},{"h":"saints who have witnessed Jesus Christ and His redemptive Mysteries","r":[]},{"h":"through their lives. On the first Friday of this season, the Church","r":[]},{"h":"commemorates St. John the Baptist, who experienced the glory of","r":[]},{"h":"Jesus, even when he was in the maternal womb and who received the","r":[]},{"h":"testimony of the glory of revelation from heaven at the Baptism of","r":[]},{"h":"Jesus. On the following Fridays, the Church remembers the saints who","r":[]},{"h":"bore great witness to the life of Jesus Christ: Saint Peter and Saint","r":[]},{"h":"Paul, the Evangelists, Saint Stephan, the Greek and the Syriac Fathers","r":[]},{"h":"of the Church, the Patron saint of the parish. The last Friday of the","r":[]},{"h":"season of Epiphany is the Day of remembrance of All the Departed","r":[]},{"h":"Souls who are in the hope of Resurrection.","r":[]},{"h":"Since there should be seven weeks for the season of Great Fast","r":[]},{"h":"before the Feast of Easter, the number of the weeks in the season","r":[]},{"h":"of Epiphany may be differed. Another particularity of this season is","r":[]},{"h":"the observance of the Three Days Fast, the Rogation of Ninivites; the","r":[]},{"h":"Three Days Fast start eighteen days before the beginning of Great Fast","r":[]},{"h":"which is filled with the grace of repentance.","r":[]},{"h":"Together with the commemoration of Baptism of Jesus, this season","r":[]},{"h":"reminds each Christian to think deeply about his or her reception","r":[]},{"h":"of Baptism that made him/her the ‘son/daughter of God' and the","r":[]},{"h":"responsibilities taken up through it. Thus, the season of Epiphany is","r":[]},{"h":"the time to make attempt to love Jesus passionately by knowing Him,","r":[]},{"h":"by living in Him and by bearing witness to Him.","r":[]}]},

"2026-02-14":{"t":["Sixth Saturday of Denha"],"g":[{"h":"","r":[["Rev 7:11-17","He will guide them to springs of the water of life"],["Jn 7:32-39","Jesus the rivers of living water SEASON OF THE GREAT FAST (SAUMA RAMBA) The Passion, Death and Resurrection (The Paschal Mystery) that culminates the salvation event, take place at the end of Jesus' public life. The seven weeks between the Season of Epiphany and the Feast of"]]},{"h":"Easter are set aside for prayer, penance and fasting.","r":[]},{"h":"The base for the season known as the Great Fast, is the ‘forty days","r":[]},{"h":"fast' of Jesus. We normally call this season as ‘fifty days fast'. It is","r":[]},{"h":"known as ‘fifty days fast' may be from the practice of the observance","r":[]},{"h":"of this fast from the Pethurtha Sunday to the Easter Sunday by the St.","r":[]},{"h":"Thomas Christians. The Syriac term pethurtha signifies ‘to put an end'","r":[]},{"h":"and ‘turning back'. What is meant by this term is to indicate that the","r":[]},{"h":"days of sumptuous food and celebrations are over.","r":[]},{"h":"It is on the Wednesday of fourth week that we commemorate the","r":[]},{"h":"half of the Great Fast. This Wednesday particularly reminds us to","r":[]},{"h":"find solutions for the drawbacks of our life, to get identified with the","r":[]},{"h":"Paschal Mystery of Jesus and to live more faithfully in the grace of","r":[]},{"h":"fasting.","r":[]},{"h":"This season teaches us that the craze for material wealth causes sin.","r":[]},{"h":"The wealth which is God's gift is to be properly used and to be shared","r":[]},{"h":"with others. The salvation experience is received through repentance,","r":[]},{"h":"prayer, fasting and acts of charity. This season also gives us the inner","r":[]},{"h":"vision that we become the true disciples when we accept God as the","r":[]},{"h":"wealth, like the apostles who followed Jesus renouncing everything.","r":[]},{"h":"Salvation is received only when we confess sin. Those who throw","r":[]},{"h":"away the dirty mantle of sin can follow Christ. The Church teaches","r":[]},{"h":"that our sanctification is God's will and our sanctification is possible","r":[]},{"h":"only through Jesus Christ who offered His life – the Body and Blood –","r":[]},{"h":"for us to the Father.","r":[]},{"h":"Our body tempts us to do the undesired evil, but to live without","r":[]},{"h":"sinning is a great suffering. The season of Great Fast demands us to","r":[]},{"h":"suffer for the sanctification of our whole life. The sufferings that we","r":[]},{"h":"face and the sacrifices we do help us to grow in faith and to get united","r":[]},{"h":"with Christ. The Church teaches us that only when we stay together","r":[]},{"h":"faithfully to the sufferings of Christ, we can enter into the joy and","r":[]},{"h":"peace of the Resurrection of Christ.","r":[]}]},

"2026-05-23":{"t":["Seventh Saturday of Resurrection"],"g":[{"h":"","r":[["2 Cor 1: 17-22","Jesus Christ has given us His Spirit"],["Lk 11:5-13","The Holy Spirit will be given to those who ask SEASON OF THE APOSTLES (ŠLEEHE) The seven weeks from the feast of Pentecost are known as the season of the Apostles. During this season, Church invites our attention to the gift of Holy Spirit, the gifts and fruits of the Holy Spirit. The feast of Pentecost has an inevitable relation with the salvation history. In the Old Testament we read that the Israelites had celebrated the feast of Pentecost in connection with harvesting season. The term pentecost means fifty – feast on the fiftieth day. It was also the feast of offering of first fruits in connection with harvesting. But later on, this feast turned out to be the commemoration of Israelites becoming God's people by His covenant. In the New Testament, a ‘new' meaning was given to this feast. It is on the fiftieth day after the Resurrection, the Holy Spirit descended on the Apostles. It was on that day the ‘Church – Ecclesia' was officially inaugurated. It is after the Pentecost that the apostles who were filled with the Holy Spirit, went to the extremities of the world with the message of the New Covenant and laid foundations to different church communities. The Syriac term sleeha means ‘one who is sent'. This liturgical season reminds us the fact that all those who have received"]]},{"h":"Baptism and Anointing are ‘apostles', ‘who are sent'.","r":[]},{"h":"The first Friday of this season is called ‘Golden Friday'. The cure","r":[]},{"h":"that the paralytic received in the Name Jesus, is a guarantee that","r":[]},{"h":"whatever we ask in the Name of Jesus, will be granted.","r":[]},{"h":"It is the responsibility of God's people to proclaim the message of","r":[]},{"h":"salvation to the entire world by being filled with the Holy Spirit. This","r":[]},{"h":"season inspires us to be missionaries like the apostles. The declaration","r":[]},{"h":"of St. Thomas, the Apostle, who is sent by Christ, ‘Let us go and die","r":[]},{"h":"with Him' is an invitation to all of us who are believers. This season","r":[]},{"h":"reveals the God who protects those who are sent.","r":[]},{"h":"It reminds the responsibility to live a life, centred on Word of God,","r":[]},{"h":"by those who are sent to proclaim the Good News. It also emphasises","r":[]},{"h":"the necessity to bear witness fearlessly to God who is the Word. It is","r":[]},{"h":"when a grain of wheat falls to the ground and dies, it will produce","r":[]},{"h":"fruit. Therefore, Jesus reminds us to do the mission courageously and","r":[]},{"h":"that we gain eternal life through the suffering. The primary mission","r":[]},{"h":"of all the Christians is to give witness to Christ in any situations.","r":[]},{"h":"The Holy Spirit, the Helper sent by the Father, lives in all the","r":[]},{"h":"baptised individuals and showers His graces and fruits. The assistance","r":[]},{"h":"of the Holy Spirit is essential to remember all that is taught by Christ","r":[]},{"h":"and to obey His commandments in every moment of life. This season","r":[]},{"h":"reminds also that if we lose God's Spirit by sinning, the consequence","r":[]},{"h":"will be utter destruction.","r":[]},{"h":"We shall partake in the communion and unity of the apostles who","r":[]},{"h":"established new ecclesial communities with the message of the Master","r":[]},{"h":"by travelling all over the world. Holding fast the truth that we are the","r":[]},{"h":"temple of the Holy Spirit and with His continuous assistance, let us","r":[]},{"h":"proclaim Christ as the Apostles did.","r":[]}]},

"2026-07-11":{"t":["Seventh Saturday of the Apostles"],"g":[{"h":"","r":[["Rom 14:13-19","The Kingdom of God is the joy in the"]]},{"h":"Holy Spirit","r":[["Jn 16:16-24","Happiness that cannot be taken away"]]},{"h":"Saint Benedict of Nursia","r":[["Gen 17:1-8","Covenant with Abraham"],["Wis 9:1-12","Pray for wisdom"],["Rom 8:12-17","You will die if you live according to the flesh"],["Mt 5:1-12","Beatitudes SEASON OF SUMMER (KAITHA) The liturgical Season of Summer starts by commemorating the Twelve Apostles of our Lord. This season that lasts ordinarily for seven weeks is called the Season of Summer (season of harvesting, fruits, etc.) The term khaitha' means ‘summer'. Harvesting and the storing of the fruits are normally done in the season of summer. The liturgical season of Khaitha is a time that commemorates and celebrates the growth of the Church as well as the harvesting of spiritual fruits. Ordinarily, it has seven weeks. This season reminds us that the Church, that is rooted and extended to the far corners of the world by the missionary activities of the apostles and martyrs, started harvesting the fruits of sanctity and martyrdom. This season that connects the Seasons of Apostles and Elia-Sleeva Moses reminds us the activities of the Church and the necessity of being prepared to the second coming of the Saviour. The first Sunday of this season is the Feast of Twelve Apostles. This feast is also called Noosardel or ‘Feast of God'. On the Fridays of this season, the saints and martyrs who have made to grow the Church, watering with their own blood and witnessed Christ courageously, are remembered. Thus, the Church remembers: on the first Friday,"]]},{"h":"St. Jacob of Nisibis who sacrificed his life for the Lord Christ; on the","r":[]},{"h":"second Friday Mar Mari who was the disciple of Mar Addai and the","r":[]},{"h":"founder of Persian Church; on the fifth Friday St. Shmoni and her","r":[]},{"h":"seven Sons (2 Mac 7); and on the sixth Sunday Patriarch St. Simon","r":[]},{"h":"Barsabe (AD 323-341) who is reported to be the author of Lakumara","r":[]},{"h":"(the Hymn ‘Lord of all') and his fellow martyrs. The Church invites the","r":[]},{"h":"faithful to imitate their exemplary life.","r":[]},{"h":"It is when we stay united to the Christ that the Church can grow","r":[]},{"h":"and yield fruits. The Lord patiently awaits for the fruits of goodness","r":[]},{"h":"from the children of the Church. The readings of this season give","r":[]},{"h":"warning about the tragedies if we do not produce good fruits. Even","r":[]},{"h":"when the forces of darkness attack the Church – the arc of salvation,","r":[]},{"h":"Christ, the bridegroom of the Church, will lead her to the heavenly","r":[]},{"h":"Jerusalem. Therefore, this season gives us the hope that those who","r":[]},{"h":"take refuge in the Church need not be fearful. The world and all in it","r":[]},{"h":"will be destroyed; but the real treasure that is the faith in the Lord,","r":[]},{"h":"will last forever. Therefore, the season of Khaitha teaches to store","r":[]},{"h":"treasures in heaven without being trapped in the worldliness.","r":[]}]},

"2026-08-29":{"t":["The Seventh Saturday of Kaitha"],"g":[{"h":"","r":[["Philem 1:8-20","Accept him as I am"],["Mt 10:5-15","Reward in the kingdom of heaven for those who receive the disciples"]]},{"h":"Saint Euphrasia","r":[["Gen 12:1-4","God calls Abraham"],["Sir 2:1-6","Trust in the Lord"],["1 Thess 4:1-8","Life pleasing to God"],["Mk 10:35-45","The first among you must be the servant of all SEASONS OF ELIJAH-CROSS-MOSES (Ēliya-Sleeva-Mušae) The season of Elijah-Cross-Moses indicates the victory of the Cross and the second coming of the Lord. The feast of the Exaltation of the Holy Cross celebrated on the 14th of September is the focal point of this season. The first ecclesial community believed that before the second coming of Christ, Elijah would come (Mal 4:5) and will argue with the son of destruction and convince the world about his fault. This belief was grown because of the reality that Elijah was present with the Lord at the time of transfiguration. The Lord's transfiguration is the symbol of Lord's second coming. At the time of transfiguration, Moses also was with the Lord; that might be the reason that this liturgical season developed centring around the Cross. The Sunday after 14th September is considered as first Sunday of Sleeva. Till then the readings of the season of Elijah is continued. When the feast of the Exaltation of the Holy Cross falls on a Sunday, that will be the first Sunday of Sleeva. There was the belief in the first ecclesial community, what Jesus told about the sign that would appear in the sky before the second coming of Christ (Mt. 24:30), is the Cross. Therefore, the strength and the victory of the Cross are commemorated in this season. The prayers and hymns of this season include the apparition of Cross to the emperor Constantine, consequent victory and the finding of the Cross by the queen Helena, the mother of Constantine. Like Moses who showed the way to the Israelites, extending his staff on the Red sea, Christ saved the humanity by showing the way to the paradise through the Cross. During this season the Church invites us to prepare for the second coming of the Lord by assimilating the prophets of the true God and the commands and messages given through them by God, and by producing the fruits of repentance and conversion. The mother Church gives us the warning that you will perish unless you walk in the way of repentance abstaining from all evils, in the conviction that the desires of body are against the spirit. Since the day of the Lord is imminent, the Church invites us to attain the eternal life like the prudent virgins, ministering him vigilantly, and through attentiveness, faithfulness, prudence, equanimity, diligent service and continuous prayer. The bronze serpent that was raised by Moses in the Old Testament, is symbol of Jesus who was raise on the Cross to share the salvation. One who takes pride in the Name of the Lord, takes pride in the Cross, the sign of salvation, and in the sufferings. This season reminds us that all those who follow Him, who has died on the Cross and ascended into the glory of resurrection, have to bear the Cross. The readings of this season give us the conviction that it is inevitable to go through the suffering and death in order to enter into the glory. The manifestation of the glory of Christ, who has fulfilled God's will by accepting suffering and death, happened on the Cross. The Lord who will appear as the Judge at the end of the world, is the one who has seated at the right side of the Glory through His Death, Resurrection and Ascension. This season inspires the faithful to suffer with Christ who was raised by God, because He emptied himself even unto death on the Cross, in humility, to enter into glory. Death and final judgments are the themes of this Season of Moses. Jesus gives the consolation words that ‘the one who endures to the end, will be saved'. The Church teaches: bear fruits, enduring faith is fruitful, confront sufferings with faith to receive consolation and joy."]]}]},
