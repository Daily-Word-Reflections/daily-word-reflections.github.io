 ml:{t:"ഈ പേജ് ഉപയോഗിക്കേണ്ട വിധം",intro:"എല്ലാം ഒരു പേജിലാണ്. വഴി കണ്ടെത്താൻ ഇതാ:",
  steps:[["റീത്തും ഭാഷയും തിരഞ്ഞെടുക്കുക","മുകളിൽ സീറോ മലബാർ, സീറോ മലങ്കര, ലത്തീൻ ഇവയിലൊന്നിൽ തൊടുക; പിന്നെ ഭാഷ. അടുത്ത തവണയ്ക്കായി പേജ് നിങ്ങളുടെ തിരഞ്ഞെടുപ്പ് ഓർത്തുവയ്ക്കും."],
   ["ഏതു ദിവസത്തിലേക്കും പോകുക","പേജ് ഇന്നത്തെ ദിവസത്തിലാണു തുറക്കുന്നത്. തലേദിവസത്തിനും പിറ്റേദിവസത്തിനും ‹ › ഉപയോഗിക്കുക; ഏതു തീയതിയും തിരഞ്ഞെടുക്കാൻ തീയതിക്കള്ളിയിൽ തൊടുക; തിരികെ വരാൻ “ഇന്ന്” അമർത്തുക."],
   ["വിഭാഗങ്ങൾ തുറക്കുക","വായനാപീഠം: വായനകളും വിചിന്തനവും. പ്രസംഗക്കുറിപ്പുകൾ: കുർബാനയ്ക്കുള്ള പ്രസംഗം, കുട്ടികൾക്കുള്ള പ്രസംഗം, രൂപരേഖ, പങ്കുവയ്ക്കാനുള്ള പോസ്റ്റ്. കലണ്ടർ താൾ: ആഴ്ച, സഭാപിതാക്കന്മാർ, സഭാരേഖകൾ, വിശുദ്ധർ. പ്രാർഥനാകൂട്ടായ്മ: കുടുംബപ്രാർഥനയ്ക്കും പ്രാർഥനാഗ്രൂപ്പുകൾക്കും. ആരാധനക്രമം അറിയാൻ: ആരാധനയിലെ വാക്കുകളും അടയാളങ്ങളും."],
   ["കൂടുതൽ അറിയാൻ തൊടുക","വിശദീകരണത്തിനു കാലത്തിന്റെ പേരിൽ (ദിവസത്തിന്റെ തലക്കെട്ടിനു തൊട്ടുമുകളിൽ) തൊടുക. “ആരാധനക്രമം അറിയാൻ” എന്ന വിഭാഗത്തിൽ എല്ലാ വാക്കുകളിലൂടെയും നീങ്ങാൻ ‹ › അല്ലെങ്കിൽ പട്ടിക ഉപയോഗിക്കുക."],
   ["തിരയുക","തിരയൽക്കള്ളിയിൽ ഒരു തീയതി, തിരുനാൾ, വിശുദ്ധൻ, ബൈബിൾ പുസ്തകം, അല്ലെങ്കിൽ ഏതെങ്കിലും വാക്ക് ടൈപ്പ് ചെയ്യുക. ആ ദിവസം തുറക്കാൻ ഫലത്തിൽ തൊടുക."],
   ["സുഖമായി വായിക്കുക, പങ്കുവയ്ക്കുക","A−, A+ അക്ഷരവലുപ്പം മാറ്റുന്നു. പ്രസംഗക്കുറിപ്പുകളിലെ “പോസ്റ്റ് പകർത്തുക” വാട്സാപ്പിലോ ടെലിഗ്രാമിലോ അയയ്ക്കാൻ തയ്യാറായ ഒരു ചെറിയ സന്ദേശം പകർത്തുന്നു."],
   ["മാർപാപ്പമാരുടെ രേഖകളും വിശേഷാവസരങ്ങളും","റീത്തുകളുടെ പേരുകൾക്കുശേഷമുള്ള ബട്ടണുകൾ മാർപാപ്പമാരുടെ രേഖകളും (വത്തിക്കാനിൽനിന്നുള്ള പുതിയ വാർത്തകളിലേക്കും പ്രഭാഷണങ്ങളിലേക്കും സന്ദേശങ്ങളിലേക്കുമുള്ള ലിങ്കുകളോടൊപ്പം), കൂദാശകൾ, മൃതസംസ്കാരം, ജൂബിലി തുടങ്ങിയ വിശേഷാവസരങ്ങൾക്കുള്ള പ്രസംഗങ്ങളും തുറക്കുന്നു."],
   ["ഞങ്ങൾക്ക് എഴുതുക","പേജിന്റെ ഏറ്റവും താഴെ പ്രാർഥനാനിയോഗമോ നിർദേശമോ അഭിപ്രായമോ അയയ്ക്കാം."]],
  bible:"ബൈബിൾ ഉദ്ധരണികൾ: പി.ഒ.സി. ബൈബിൾ (മലയാളം), NRSV (ഇംഗ്ലീഷ്), ഐൻഹൈറ്റ്സ്യൂബർസെറ്റ്സുങ് (ജർമൻ), CEI 2008 (ഇറ്റാലിയൻ), തിരുവിവിലിയം CLT (തമിഴ്), ഹിന്ദി കത്തോലിക്കാ ബൈബിൾ (ഹിന്ദി)."},
 de:{t:"So benutzen Sie diese Seite",intro:"Alles befindet sich auf einer Seite. So finden Sie sich zurecht.",
  steps:[["Ritus und Sprache wählen","Tippen Sie oben auf Syro-Malabarisch, Syro-Malankarisch oder Lateinisch und dann auf Ihre Sprache. Die Seite merkt sich Ihre Wahl."],
   ["Zu jedem Tag gehen","Die Seite öffnet sich mit dem heutigen Tag. Mit ‹ und › gehen Sie einen Tag zurück oder vor; im Datumsfeld wählen Sie jedes Datum; „Heute“ bringt Sie zurück."],
   ["Die Bereiche öffnen","Ambo: Lesungen und Betrachtung. Predigt: Predigt für die Messe, Kinderpredigt, Gliederung und ein Text zum Teilen. Kalenderblatt: die Woche, Kirchenväter, kirchliche Dokumente und Heilige. Gebetskreis: für das Gebet in Familie und Gruppe. Liturgie verstehen: Worte und Zeichen der Liturgie."],
   ["Mehr erfahren","Tippen Sie auf den Namen der liturgischen Zeit für eine kurze Erklärung. In „Liturgie verstehen“ blättern Sie mit ‹ › oder über die Liste durch alle Begriffe."],
   ["Suchen","Geben Sie ein Datum, ein Fest, einen Heiligen, ein biblisches Buch oder ein Wort ein und tippen Sie auf ein Ergebnis."],
   ["Bequem lesen und teilen","A− und A+ ändern die Schriftgröße. Unter „Predigt“ kopiert „Text kopieren“ eine kurze Nachricht für WhatsApp oder Telegram."],
   ["Päpstliche Dokumente und besondere Anlässe","Die Schaltflächen nach den Riten öffnen Predigten für besondere Anlässe sowie Enzykliken und andere Dokumente der Päpste sowie Links zu aktuellen Nachrichten, Audienzen und Botschaften aus dem Vatikan."],
   ["Schreiben Sie uns","Ganz unten auf der Seite können Sie ein Gebetsanliegen, einen Vorschlag oder einen Kommentar senden."]],
  bible:"Bibelzitate: Einheitsübersetzung (Deutsch)."},
 it:{t:"Come usare questa pagina",intro:"Tutto si trova in una sola pagina. Ecco come orientarsi.",
  steps:[["Scegliete rito e lingua","Toccate in alto Siro-malabarese, Siro-malankarese o Latino, poi la vostra lingua. La pagina ricorda la vostra scelta."],
   ["Andate a qualsiasi giorno","La pagina si apre sul giorno di oggi. Con ‹ e › andate al giorno precedente o successivo; nella casella della data scegliete qualsiasi data; “Oggi” vi riporta indietro."],
   ["Aprite le sezioni","Ambone: letture e riflessione. Omelia: omelia per la Messa, omelia per i bambini, schema e un testo da condividere. Pagina del calendario: la settimana, i Padri, i documenti della Chiesa e i santi. Gruppo di preghiera: per la preghiera in famiglia e nei gruppi. Conoscere la liturgia: parole e segni della liturgia."],
   ["Toccate per saperne di più","Toccate il nome del tempo liturgico per una breve spiegazione. In “Conoscere la liturgia” scorrete tutti i termini con ‹ › o dall'elenco."],
   ["Cercate","Scrivete una data, una festa, un santo, un libro biblico o una parola, e toccate un risultato."],
   ["Leggete con comodo e condividete","A− e A+ cambiano la dimensione del testo. In “Omelia”, “Copia il testo” copia un breve messaggio per WhatsApp o Telegram."],
   ["Documenti pontifici e occasioni speciali","I pulsanti dopo i riti aprono omelie per occasioni speciali ed encicliche e altri documenti dei Papi, con collegamenti alle ultime notizie, udienze e messaggi dal Vaticano."],
   ["Scriveteci","In fondo alla pagina potete inviare un'intenzione di preghiera, un suggerimento o un commento."]],
  bible:"Citazioni bibliche: Bibbia CEI 2008 (italiano)."},
 ta:{t:"இந்தப் பக்கத்தைப் பயன்படுத்தும் முறை",intro:"எல்லாமே ஒரே பக்கத்தில் உள்ளன. வழியைக் கண்டுபிடிக்க இதோ:",
  steps:[["வழிபாட்டு முறையையும் மொழியையும் தேர்ந்தெடுங்கள்","மேலே சீரோ-மலபார், சீரோ-மலங்கரா அல்லது இலத்தீன் என்பதைத் தொட்டு, பின்னர் உங்கள் மொழியைத் தேர்ந்தெடுங்கள். அடுத்த முறைக்காகப் பக்கம் உங்கள் தேர்வை நினைவில் வைத்துக்கொள்ளும்."],
   ["எந்த நாளுக்கும் செல்லுங்கள்","பக்கம் இன்றைய நாளில் திறக்கும். முந்தைய அல்லது அடுத்த நாளுக்கு ‹ › பயன்படுத்துங்கள்; எந்தத் தேதியையும் தேர்ந்தெடுக்கத் தேதிப் பெட்டியைத் தொடுங்கள்; திரும்ப வர “இன்று” என்பதைத் தொடுங்கள்."],
   ["பகுதிகளைத் திறவுங்கள்","வாசக மேடை: வாசகங்களும் சிந்தனையும். மறையுரை: திருப்பலி மறையுரை, குழந்தைகள் மறையுரை, திட்டம், பகிர்வதற்கான செய்தி. நாள்காட்டி: வாரம், திருச்சபைத் தந்தையர், திருச்சபை ஆவணங்கள், புனிதர்கள். செபக் கூட்டம்: குடும்பச் செபத்திற்கும் செபக் குழுக்களுக்கும். வழிபாட்டை அறிவோம்: வழிபாட்டின் சொற்களும் அடையாளங்களும்."],
   ["மேலும் அறியத் தொடுங்கள்","சுருக்கமான விளக்கத்திற்குக் காலத்தின் பெயரைத் தொடுங்கள். “வழிபாட்டை அறிவோம்” பகுதியில் ‹ › அல்லது பட்டியல் மூலம் எல்லாச் சொற்களையும் பார்க்கலாம்."],
   ["தேடுங்கள்","தேதி, திருநாள், புனிதர், விவிலிய நூல் அல்லது ஏதாவது ஒரு சொல்லைத் தட்டச்சு செய்து, ஒரு முடிவைத் தொடுங்கள்."],
   ["வசதியாக வாசித்துப் பகிருங்கள்","A−, A+ எழுத்தின் அளவை மாற்றும். மறையுரைப் பகுதியில் “நகலெடு” வாட்ஸ்அப் அல்லது டெலிகிராமுக்கான சிறு செய்தியை நகலெடுக்கும்."],
   ["திருத்தந்தையரின் ஆவணங்களும் சிறப்பு நிகழ்வுகளும்","வழிபாட்டு முறைகளின் பெயர்களுக்குப் பின் உள்ள பொத்தான்கள் சிறப்பு நிகழ்வுகளுக்கான மறையுரைகளையும் திருத்தந்தையரின் சுற்றுமடல்களையும் பிற ஆவணங்களையும், வத்திக்கானின் புதிய செய்திகள், உரைகள், செய்திகளுக்கான இணைப்புகளுடன் திறக்கும்."],
   ["எங்களுக்கு எழுதுங்கள்","பக்கத்தின் அடியில் செபக் கருத்து, ஆலோசனை அல்லது கருத்தை அனுப்பலாம்."]],
  bible:"விவிலிய மேற்கோள்கள்: திருவிவிலியம் (பொது மொழிபெயர்ப்பு, CLT)."},
 hi:{t:"इस पृष्ठ का उपयोग कैसे करें",intro:"सब कुछ एक ही पृष्ठ पर है। रास्ता ऐसे खोजें:",
  steps:[["अपनी रीति और भाषा चुनें","ऊपर सीरो-मलबार, सीरो-मलंकरा या लैटिन को छुएँ, फिर अपनी भाषा चुनें। अगली बार के लिए पृष्ठ आपकी पसंद याद रखेगा।"],
   ["किसी भी दिन पर जाएँ","पृष्ठ आज के दिन पर खुलता है। पिछले या अगले दिन के लिए ‹ › का उपयोग करें; कोई भी तारीख़ चुनने के लिए तारीख़ के बॉक्स को छुएँ; वापस आने के लिए “आज” छुएँ।"],
   ["भाग खोलें","पाठ-मंच: पाठ और मनन। प्रवचन: मिस्सा का प्रवचन, बच्चों का प्रवचन, रूपरेखा और साझा करने के लिए संदेश। कैलेंडर पृष्ठ: सप्ताह, कलीसिया के आचार्य, कलीसियाई दस्तावेज़ और संत। प्रार्थना सभा: परिवार की प्रार्थना और प्रार्थना-समूहों के लिए। धर्मविधि को जानें: धर्मविधि के शब्द और चिह्न।"],
   ["और जानने के लिए छुएँ","छोटी व्याख्या के लिए ऋतु के नाम को छुएँ। “धर्मविधि को जानें” में ‹ › या सूची से सभी शब्द देखें।"],
   ["खोजें","कोई तारीख़, पर्व, संत, बाइबिल ग्रंथ या कोई भी शब्द लिखें और परिणाम को छुएँ।"],
   ["आराम से पढ़ें और साझा करें","A− और A+ अक्षरों का आकार बदलते हैं। प्रवचन भाग में “कॉपी करें” व्हाट्सऐप या टेलीग्राम के लिए एक छोटा संदेश कॉपी करता है।"],
   ["संत पापाओं के दस्तावेज़ और विशेष अवसर","रीतियों के नामों के बाद के बटन विशेष अवसरों के प्रवचन और संत पापाओं के विश्वपत्र और अन्य दस्तावेज़, वाटिकन के ताज़ा समाचारों, प्रवचनों और संदेशों की कड़ियों के साथ खोलते हैं।"],
   ["हमें लिखें","पृष्ठ के सबसे नीचे आप प्रार्थना-निवेदन, सुझाव या टिप्पणी भेज सकते हैं।"]],
  bible:"बाइबिल उद्धरण: हिन्दी काथलिक बाइबिल।"}
};

var GLOSS={
smc:{
 en:[["Holy Qurbana","Syriac for “offering”. The Eucharistic liturgy of the Syro-Malabar Church, which belongs to the East Syriac tradition received from the Church of the East."],
  ["Raza","“Mystery”. The most solemn form of the Holy Qurbana, celebrated on great feasts."],
  ["Thaksa","“Order”. The liturgical book containing the text of the Holy Qurbana."],
  ["Madbaha","The sanctuary, where the altar stands. It is raised and set apart, a sign of heaven."],
  ["Qestroma","The space between the sanctuary and the nave, a sign of paradise between heaven and earth."],
  ["Hykala","The nave, where the faithful stand. It is a sign of the earth, and of the people of God on pilgrimage."],
  ["Bema","In the ancient East Syriac church, a raised platform in the middle of the nave from which the Word of God was proclaimed."],
  ["Mar Thoma Sleeva","The St Thomas Cross: a cross without the body of Christ, with a dove above it, often standing on a lotus. It proclaims the risen Christ and the gift of the Holy Spirit."],
  ["Anaphora of Mar Addai and Mar Mari","One of the most ancient Eucharistic prayers of the Church, attributed to the apostles of Edessa; the principal anaphora of the Syro-Malabar Qurbana."],
  ["Lakhu Mara","“To you, O Lord”. A hymn of praise to Christ sung near the beginning of the Holy Qurbana."],
  ["Karozutha","A litany proclaimed by the deacon or server, to which the people answer with a short response."],
  ["Onitha","A hymn or antiphon of the liturgy. The “Onitha d'Raze” is sung during the procession with the gifts."],
  ["Dukrana","“Commemoration”. The feast of a saint, usually the day of his or her death. The Dukrana of St Thomas is kept on 3 July."],
  ["Ramsa, Lelya, Sapra","The evening, night and morning prayers of the Liturgy of the Hours in the East Syriac tradition."],
  ["Moonnu Nombu","The three-day fast of the Ninevites, kept from Monday to Wednesday of the third week before the Great Fast (Jonah 3)."],
  ["Pesaha","“Passover”. Maundy Thursday, when the Lord instituted the Holy Qurbana. In Kerala homes the Pesaha appam and paal are blessed and shared."]],
 ml:[["വിശുദ്ധ കുർബാന","“കാഴ്ചവയ്പ്” എന്നർഥമുള്ള സുറിയാനിപദം. പൗരസ്ത്യസുറിയാനി പാരമ്പര്യത്തിൽപ്പെട്ട സീറോ മലബാർ സഭയുടെ ദിവ്യകാരുണ്യ ആരാധനക്രമം."],
  ["റാസ","“രഹസ്യം”. വലിയ തിരുനാളുകളിൽ അർപ്പിക്കുന്ന വിശുദ്ധ കുർബാനയുടെ ഏറ്റവും ആഘോഷമായ രൂപം."],
  ["തക്സ","“ക്രമം”. വിശുദ്ധ കുർബാനയുടെ പാഠമടങ്ങിയ ആരാധനക്രമഗ്രന്ഥം."],
  ["മദ്ബഹാ","ബലിപീഠം സ്ഥിതിചെയ്യുന്ന ശ്രീകോവിൽ. ഉയർത്തി വേർതിരിച്ചിരിക്കുന്ന ഇതു സ്വർഗത്തിന്റെ പ്രതീകമാണ്."],
  ["ഖസ്രോമ","ശ്രീകോവിലിനും ദേവാലയാങ്കണത്തിനും ഇടയിലുള്ള ഭാഗം; സ്വർഗത്തിനും ഭൂമിക്കും ഇടയിലുള്ള പറുദീസായുടെ പ്രതീകം."],
  ["ഹൈക്കല","വിശ്വാസികൾ നിൽക്കുന്ന ദേവാലയാങ്കണം. ഭൂമിയുടെയും തീർഥാടകരായ ദൈവജനത്തിന്റെയും പ്രതീകം."],
  ["ബേമ്മ","പുരാതന പൗരസ്ത്യസുറിയാനി ദേവാലയങ്ങളിൽ ദേവാലയാങ്കണത്തിന്റെ മധ്യത്തിലുണ്ടായിരുന്ന ഉയർന്ന വേദി; അവിടെനിന്നാണു ദൈവവചനം പ്രഘോഷിച്ചിരുന്നത്."],
  ["മാർ തോമാ സ്ലീവാ","ക്രിസ്തുവിന്റെ ശരീരമില്ലാത്ത, മുകളിൽ പ്രാവും പലപ്പോഴും താമരയിൽ നിൽക്കുന്നതുമായ കുരിശ്. ഉത്ഥിതനായ ക്രിസ്തുവിനെയും പരിശുദ്ധാത്മാവിന്റെ ദാനത്തെയും അതു പ്രഘോഷിക്കുന്നു."],
  ["മാർ അദ്ദായിയുടെയും മാർ മാറിയുടെയും അനാഫൊറ","എദേസ്സായിലെ ശ്ലീഹന്മാരുടെ പേരിലുള്ള, സഭയിലെ ഏറ്റവും പുരാതനമായ ദിവ്യകാരുണ്യപ്രാർഥനകളിലൊന്ന്; സീറോ മലബാർ കുർബാനയുടെ പ്രധാന അനാഫൊറ."],
  ["ലാക്കുമാറാ","“കർത്താവേ, അങ്ങേക്ക്”. വിശുദ്ധ കുർബാനയുടെ ആരംഭത്തിൽ ആലപിക്കുന്ന ക്രിസ്തുസ്തുതിഗീതം."],
  ["കാറോസൂസ","ശുശ്രൂഷി പ്രഘോഷിക്കുകയും ജനം ചെറിയ പ്രത്യുത്തരം നൽകുകയും ചെയ്യുന്ന പ്രാർഥനാമാലിക."],
  ["ഓനീസ","ആരാധനക്രമത്തിലെ ഗീതം. കാഴ്ചവസ്തുക്കളുടെ പ്രദക്ഷിണസമയത്ത് “ഓനീസ ദ്റാസേ” (രഹസ്യങ്ങളുടെ ഗീതം) ആലപിക്കുന്നു."],
  ["ദുക്റാന","“ഓർമ”. ഒരു വിശുദ്ധന്റെ തിരുനാൾ, സാധാരണയായി മരണദിവസം. മാർ തോമാശ്ലീഹായുടെ ദുക്റാന ജൂലൈ 3-ന്."],
  ["റംശ, ലെലിയ, സപ്ര","പൗരസ്ത്യസുറിയാനി യാമപ്രാർഥനകളിലെ സന്ധ്യാ, രാത്രി, പ്രഭാത പ്രാർഥനകൾ."],
  ["മൂന്നുനോമ്പ്","നിനിവേക്കാരുടെ മൂന്നു ദിവസത്തെ ഉപവാസം; വലിയ നോമ്പിനു മുമ്പുള്ള മൂന്നാം ആഴ്ചയിലെ തിങ്കൾമുതൽ ബുധൻവരെ (യോനാ 3)."],
  ["പെസഹാ","“കടന്നുപോകൽ”. കർത്താവു വിശുദ്ധ കുർബാന സ്ഥാപിച്ച പെസഹാവ്യാഴം. കേരളത്തിലെ ഭവനങ്ങളിൽ പെസഹാ അപ്പവും പാലും ആശീർവദിച്ചു പങ്കുവയ്ക്കുന്നു."]]},
smk:{
 en:[["Holy Qurbono","The Eucharistic liturgy of the Syro-Malankara Catholic Church, in the West Syriac (Antiochene) tradition."],
  ["Anaphora of St James","The Eucharistic prayer attributed to St James, brother of the Lord and first bishop of Jerusalem; the mother of the West Syriac anaphoras. The Malankara liturgy also has a number of other anaphoras."],
  ["Thronos","“Throne”. The altar, the throne of God, on which the holy Mysteries are offered."],
  ["Madbaho","The sanctuary, separated from the nave by a curtain that is drawn and opened at the great moments of the liturgy."],
  ["Promiun and Sedro","The opening prayer (Promiun) and the long expository prayer (Sedro), said with incense, in the Qurbono and in the Hours."],
  ["Hoosoyo","The service of forgiveness and reconciliation with incense, asking God to accept the prayers of his people."],
  ["Qauma","A unit of prayer beginning with the Trisagion, “Holy are you, O God”, followed by “Kurielaison” and the Lord's Prayer."],
  ["Shehimo","The book of daily prayer for ordinary weekdays. The book for Sundays, feasts and seasons is the Penkitho."],
  ["Qolo","A hymn sung to a set melody. The Shehimo is arranged in Qolos that change through the year."],
  ["Bovutho","Petitionary hymns attributed to St Ephrem, St Jacob of Serugh and St Balai, sung in the Hours."],
  ["Thubden","The diptychs: the solemn commemorations in the anaphora of the living, the saints and the faithful departed."],
  ["Qudos Eetho and Hudos Eetho","The Sanctification and the Renewal of the Church: the two Sundays that open the liturgical year."],
  ["Hasho","The Passion. Hasho Week is Holy Week, from Hosanna Sunday to the Resurrection."],
  ["Qyomtho","The Resurrection of the Lord, and the season of fifty days that follows it."],
  ["Sleebo","The Cross. The season of the Holy Cross closes the liturgical year."],
  ["Reunion of 1930","On 20 September 1930 Archbishop Mar Ivanios and his companions entered full communion with the Catholic Church, keeping their West Syriac liturgy. Since 2005 the Church is a Major Archiepiscopal Church, headed by the Major Archbishop-Catholicos."]],
 ml:[["വിശുദ്ധ കുർബാന (ഖുർബോനോ)","പാശ്ചാത്യസുറിയാനി (അന്ത്യോക്യൻ) പാരമ്പര്യത്തിലുള്ള സീറോ മലങ്കര കത്തോലിക്കാസഭയുടെ ദിവ്യകാരുണ്യ ആരാധനക്രമം."],
  ["മാർ യാക്കോബിന്റെ അനാഫൊറ","കർത്താവിന്റെ സഹോദരനും ജറുസലെമിലെ പ്രഥമ മെത്രാനുമായ വിശുദ്ധ യാക്കോബിന്റെ പേരിലുള്ള ദിവ്യകാരുണ്യപ്രാർഥന; പാശ്ചാത്യസുറിയാനി അനാഫൊറകളുടെ മാതാവ്. മലങ്കര ആരാധനക്രമത്തിൽ മറ്റു പല അനാഫൊറകളുമുണ്ട്."],
  ["ത്രോണോസ്","“സിംഹാസനം”. വിശുദ്ധ രഹസ്യങ്ങൾ അർപ്പിക്കപ്പെടുന്ന ബലിപീഠം; ദൈവത്തിന്റെ സിംഹാസനം."],
  ["മദ്ബഹ","ആരാധനയുടെ പ്രധാന നിമിഷങ്ങളിൽ തുറക്കുകയും അടയ്ക്കുകയും ചെയ്യുന്ന തിരശ്ശീലയാൽ ദേവാലയാങ്കണത്തിൽനിന്നു വേർതിരിക്കപ്പെട്ട ശ്രീകോവിൽ."],
  ["പ്രുമിയോനും സെദറായും","ധൂപത്തോടെ ചൊല്ലുന്ന ആമുഖപ്രാർഥനയും (പ്രുമിയോൻ) വിശദമായ പ്രാർഥനയും (സെദറാ); കുർബാനയിലും യാമപ്രാർഥനകളിലും."],
  ["ഹൂസോയോ","തന്റെ ജനത്തിന്റെ പ്രാർഥനകൾ സ്വീകരിക്കാൻ ദൈവത്തോടപേക്ഷിക്കുന്ന, ധൂപത്തോടെയുള്ള പാപമോചന-അനുരഞ്ജന ശുശ്രൂഷ."],
  ["കൗമ","“ദൈവമേ, നീ പരിശുദ്ധനാകുന്നു” എന്ന ത്രിശുദ്ധകീർത്തനത്തോടെ ആരംഭിച്ച്, “കുറിയേലായിസോൻ”, കർതൃപ്രാർഥന എന്നിവയോടെ തുടരുന്ന പ്രാർഥനാഘടകം."],
  ["ശ്ഹീമോ","സാധാരണ ദിവസങ്ങളിലെ യാമപ്രാർഥനാപുസ്തകം. ഞായറാഴ്ചകൾക്കും തിരുനാളുകൾക്കും കാലങ്ങൾക്കുമുള്ളതു പെങ്കീസാ."],
  ["ഖോലോ","നിശ്ചിത ഈണത്തിൽ ആലപിക്കുന്ന ഗീതം. വർഷത്തിലുടനീളം മാറിവരുന്ന ഖോലോകളായി ശ്ഹീമോ ക്രമീകരിച്ചിരിക്കുന്നു."],
  ["ബോവൂസോ","മാർ അപ്രേം, മാർ യാക്കോബ്, മാർ ബാലായി എന്നിവരുടെ പേരിലുള്ള, യാമപ്രാർഥനകളിൽ ആലപിക്കുന്ന യാചനാഗീതങ്ങൾ."],
  ["തുബ്ദേൻ","അനാഫൊറയിൽ ജീവിച്ചിരിക്കുന്നവരെയും വിശുദ്ധരെയും മരിച്ച വിശ്വാസികളെയും ഓർക്കുന്ന ആഘോഷമായ സ്മരണകൾ."],
  ["കൂദോശ് ഈത്തോയും ഹൂദോശ് ഈത്തോയും","സഭയുടെ വിശുദ്ധീകരണവും നവീകരണവും: ആരാധനാവത്സരം തുറക്കുന്ന രണ്ടു ഞായറാഴ്ചകൾ."],
  ["ഹാശാ","“പീഡാനുഭവം”. ഓശാന ഞായർമുതൽ ഉയിർപ്പുവരെയുള്ള ഹാശാആഴ്ച."],
  ["ക്യംതോ","കർത്താവിന്റെ ഉയിർപ്പും അതിനെത്തുടർന്നുള്ള അമ്പതു ദിവസത്തെ കാലവും."],
  ["സ്ലീബാ","“കുരിശ്”. വിശുദ്ധ കുരിശിന്റെ കാലം ആരാധനാവത്സരം അവസാനിപ്പിക്കുന്നു."],
  ["1930-ലെ പുനരൈക്യം","1930 സെപ്റ്റംബർ 20-ന് മാർ ഈവാനിയോസ് മെത്രാപ്പോലീത്തായും സഹചാരികളും തങ്ങളുടെ പാശ്ചാത്യസുറിയാനി ആരാധനക്രമം കാത്തുകൊണ്ടു കത്തോലിക്കാസഭയുമായി പൂർണ കൂട്ടായ്മയിൽ പ്രവേശിച്ചു. 2005 മുതൽ മേജർ ആർച്ച്ബിഷപ്-കാതോലിക്കോസിന്റെ നേതൃത്വത്തിലുള്ള മേജർ ആർക്കിഎപ്പിസ്കോപ്പൽ സഭയാണിത്."]]},
lat:{
 en:[["Holy Mass","The celebration of the Eucharist in the Roman Rite, in two main parts: the Liturgy of the Word and the Liturgy of the Eucharist."],
  ["Lectionary and cycles","Sunday readings follow a three-year cycle (Years A, B and C, with Matthew, Mark and Luke); weekday first readings follow a two-year cycle (I and II)."],
  ["Responsorial Psalm","The psalm sung or said after the first reading, with a refrain repeated by the people. It is part of the Word of God, not an extra song."],
  ["Gospel Acclamation","The “Alleluia” and verse that welcome the Gospel. In Lent another acclamation replaces the Alleluia."],
  ["Homily","The explanation of the readings and the liturgy, given by a bishop, priest or deacon, applying God's Word to life."],
  ["Universal Prayer","The Prayer of the Faithful, in which the people exercise their baptismal priesthood by praying for the Church, the world, those in need and the local community."],
  ["Eucharistic Prayer","The centre of the Mass: the Preface, the Sanctus, the invocation of the Holy Spirit (epiclesis), the institution narrative and consecration, the memorial, the intercessions and the final doxology answered by the great Amen."],
  ["Liturgical colours","Green for Ordinary Time; violet for Advent and Lent; white (or gold) for Christmas, Easter and feasts of the Lord, Mary and non-martyr saints; red for Palm Sunday, Good Friday, Pentecost, the apostles and martyrs."],
  ["Solemnity, Feast, Memorial","The three ranks of celebration. A solemnity is the highest; a memorial may be obligatory or optional."],
  ["Ordinary Time","The numbered weeks of the year outside the great seasons, when the Church follows the public life and teaching of Christ."],
  ["Easter Triduum","The three holy days from the evening Mass of the Lord's Supper on Holy Thursday to Easter Sunday evening: the summit of the liturgical year."],
  ["Liturgy of the Hours","The Church's daily prayer that sanctifies the hours of the day; Morning Prayer (Lauds) and Evening Prayer (Vespers) are its two hinges."],
  ["Ambo, altar, tabernacle","The ambo is the place of the Word; the altar is the place of the sacrifice and the Lord's table; the tabernacle keeps the Blessed Sacrament for the sick and for adoration."],
  ["Advent wreath","A wreath of evergreen with four candles, lit one by one on the Sundays of Advent, marking the growing light as Christmas approaches."]],
 ml:[["ദിവ്യബലി","റോമൻ റീത്തിലെ ദിവ്യകാരുണ്യ ആഘോഷം; വചനശുശ്രൂഷ, ദിവ്യകാരുണ്യശുശ്രൂഷ എന്നീ രണ്ടു പ്രധാന ഭാഗങ്ങൾ."],
  ["വായനാപുസ്തകവും ചക്രങ്ങളും","ഞായറാഴ്ചകളിലെ വായനകൾ മൂന്നു വർഷത്തെ ചക്രം പിന്തുടരുന്നു (A, B, C വർഷങ്ങൾ: മത്തായി, മർക്കോസ്, ലൂക്കാ); വാരദിവസങ്ങളിലെ ഒന്നാം വായന രണ്ടു വർഷത്തെ ചക്രവും (I, II)."],
  ["പ്രതിവചനസങ്കീർത്തനം","ഒന്നാം വായനയ്ക്കുശേഷം ജനം ആവർത്തിക്കുന്ന പല്ലവിയോടെ ആലപിക്കുന്നതോ ചൊല്ലുന്നതോ ആയ സങ്കീർത്തനം. ഇതു ദൈവവചനത്തിന്റെ ഭാഗമാണ്, ഒരു അധികഗാനമല്ല."],
  ["സുവിശേഷപ്രഘോഷണഗീതം","സുവിശേഷത്തെ സ്വാഗതം ചെയ്യുന്ന “അല്ലേലൂയാ”യും വാക്യവും. നോമ്പുകാലത്ത് അല്ലേലൂയായ്ക്കു പകരം മറ്റൊരു പ്രഘോഷണം."],
  ["വചനസന്ദേശം","മെത്രാനോ വൈദികനോ ഡീക്കനോ നൽകുന്ന, വായനകളെയും ആരാധനക്രമത്തെയും വിശദീകരിച്ചു ദൈവവചനം ജീവിതത്തോടു ബന്ധിപ്പിക്കുന്ന പ്രസംഗം."],
  ["വിശ്വാസികളുടെ പ്രാർഥന","സഭയ്ക്കും ലോകത്തിനും ആവശ്യക്കാർക്കും പ്രാദേശികസമൂഹത്തിനുംവേണ്ടി പ്രാർഥിച്ചുകൊണ്ട് ജനം തങ്ങളുടെ മാമ്മോദീസാപൗരോഹിത്യം നിർവഹിക്കുന്ന സാർവത്രികപ്രാർഥന."],
  ["ദിവ്യകാരുണ്യപ്രാർഥന","ദിവ്യബലിയുടെ കേന്ദ്രം: ആമുഖഗീതം, പരിശുദ്ധൻ, പരിശുദ്ധാത്മാവിനെ വിളിച്ചപേക്ഷിക്കൽ, സ്ഥാപനവിവരണവും കൂദാശയും, സ്മരണ, മധ്യസ്ഥപ്രാർഥനകൾ, മഹത്തായ ആമേനോടെ അവസാനിക്കുന്ന സ്തുതി."],
  ["ആരാധനക്രമനിറങ്ങൾ","സാധാരണകാലത്തിനു പച്ച; ആഗമനകാലത്തിനും നോമ്പുകാലത്തിനും വയലറ്റ്; ക്രിസ്മസ്, ഉയിർപ്പുകാലം, കർത്താവിന്റെയും മറിയത്തിന്റെയും രക്തസാക്ഷികളല്ലാത്ത വിശുദ്ധരുടെയും തിരുനാളുകൾക്കു വെള്ള (അല്ലെങ്കിൽ സ്വർണനിറം); ഓശാന ഞായർ, ദുഃഖവെള്ളി, പന്തക്കുസ്താ, ശ്ലീഹന്മാർ, രക്തസാക്ഷികൾ എന്നിവർക്കു ചുവപ്പ്."],
  ["മഹോത്സവം, തിരുനാൾ, ഓർമ","ആഘോഷങ്ങളുടെ മൂന്നു പദവികൾ. മഹോത്സവമാണ് ഏറ്റവും ഉയർന്നത്; ഓർമ നിർബന്ധിതമോ ഐച്ഛികമോ ആകാം."],
  ["സാധാരണകാലം","പ്രധാന കാലങ്ങൾക്കു പുറത്തുള്ള, എണ്ണമിട്ട ആഴ്ചകൾ; ക്രിസ്തുവിന്റെ പരസ്യജീവിതവും പ്രബോധനവും സഭ പിന്തുടരുന്ന കാലം."],
  ["ഉയിർപ്പിന്റെ ത്രിദിനം","പെസഹാവ്യാഴത്തിലെ കർത്താവിന്റെ അത്താഴത്തിന്റെ സന്ധ്യാബലിമുതൽ ഉയിർപ്പുഞായർ സന്ധ്യവരെയുള്ള മൂന്നു വിശുദ്ധ ദിനങ്ങൾ: ആരാധനാവത്സരത്തിന്റെ ഉച്ചസ്ഥാനം."],
  ["യാമപ്രാർഥനകൾ","ദിവസത്തിലെ യാമങ്ങളെ വിശുദ്ധീകരിക്കുന്ന സഭയുടെ അനുദിനപ്രാർഥന; പ്രഭാതപ്രാർഥനയും സന്ധ്യാപ്രാർഥനയുമാണ് അതിന്റെ രണ്ടു തൂണുകൾ."],
  ["വചനവേദി, ബലിപീഠം, സക്രാരി","വചനവേദി ദൈവവചനത്തിന്റെ ഇടം; ബലിപീഠം ബലിയുടെയും കർത്താവിന്റെ മേശയുടെയും ഇടം; രോഗികൾക്കും ആരാധനയ്ക്കുമായി വിശുദ്ധ കുർബാന സൂക്ഷിക്കുന്നതു സക്രാരിയിൽ."],
  ["ആഗമനകാലറീത്ത്","ആഗമനകാലത്തിലെ ഞായറാഴ്ചകളിൽ ഓരോന്നായി കത്തിക്കുന്ന നാലു തിരികളുള്ള നിത്യഹരിതറീത്ത്; ക്രിസ്മസ് അടുക്കുമ്പോൾ വളരുന്ന വെളിച്ചത്തിന്റെ അടയാളം."]]}
