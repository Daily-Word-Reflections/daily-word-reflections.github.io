GLOSS.lat.kn=[["ಪವಿತ್ರ ದಿವ್ಯಬಲಿಪೂಜೆ","ರೋಮನ್ ವಿಧಿಯಲ್ಲಿ ಪರಮಪ್ರಸಾದದ ಆಚರಣೆ; ಎರಡು ಮುಖ್ಯ ಭಾಗಗಳು: ವಾಕ್ಯದ ಆರಾಧನೆ ಮತ್ತು ಪರಮಪ್ರಸಾದದ ಆರಾಧನೆ."],["ವಾಚನ ಗ್ರಂಥ ಮತ್ತು ಚಕ್ರಗಳು","ಭಾನುವಾರದ ವಾಚನಗಳು ಮೂರು ವರ್ಷಗಳ ಚಕ್ರವನ್ನು (A, B, C ವರ್ಷಗಳು; ಮತ್ತಾಯ, ಮಾರ್ಕ, ಲೂಕ) ಅನುಸರಿಸುತ್ತವೆ; ವಾರದ ದಿನಗಳ ಮೊದಲನೆಯ ವಾಚನ ಎರಡು ವರ್ಷಗಳ ಚಕ್ರವನ್ನು (I ಮತ್ತು II) ಅನುಸರಿಸುತ್ತದೆ."],["ಪ್ರತಿಸ್ಪಂದನ ಕೀರ್ತನೆ","ಮೊದಲನೆಯ ವಾಚನದ ನಂತರ ಹಾಡುವ ಅಥವಾ ಹೇಳುವ ಕೀರ್ತನೆ; ಜನರು ಪಲ್ಲವಿಯನ್ನು ಪುನರುಚ್ಚರಿಸುತ್ತಾರೆ. ಅದು ದೇವರ ವಾಕ್ಯದ ಭಾಗ, ಹೆಚ್ಚುವರಿ ಹಾಡಲ್ಲ."],["ಶುಭಸಂದೇಶಕ್ಕೆ ಮುಂಚಿನ ಘೋಷಣೆ","ಶುಭಸಂದೇಶವನ್ನು ಸ್ವಾಗತಿಸುವ ಅಲ್ಲೆಲೂಯ ಮತ್ತು ವಚನ. ತಪಸ್ಸುಕಾಲದಲ್ಲಿ ಅಲ್ಲೆಲೂಯದ ಬದಲು ಬೇರೊಂದು ಘೋಷಣೆ ಇರುತ್ತದೆ."],["ಪ್ರಸಂಗ","ಧರ್ಮಾಧ್ಯಕ್ಷರು, ಯಾಜಕರು ಅಥವಾ ಧರ್ಮಸೇವಕರು ವಾಚನಗಳನ್ನೂ ಆರಾಧನೆಯನ್ನೂ ವಿವರಿಸಿ ದೇವರ ವಾಕ್ಯವನ್ನು ಜೀವನಕ್ಕೆ ಅನ್ವಯಿಸುವುದು."],["ವಿಶ್ವಾಸಿಗಳ ಪ್ರಾರ್ಥನೆ","ಜನರು ತಮ್ಮ ದೀಕ್ಷಾಸ್ನಾನದ ಯಾಜಕತ್ವವನ್ನು ಚಲಾಯಿಸಿ ಧರ್ಮಸಭೆ, ಲೋಕ, ಅಗತ್ಯದಲ್ಲಿರುವವರು ಮತ್ತು ಸ್ಥಳೀಯ ಸಮುದಾಯಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುವ ಸಾರ್ವತ್ರಿಕ ಪ್ರಾರ್ಥನೆ."],["ಪರಮಪ್ರಸಾದ ಪ್ರಾರ್ಥನೆ","ದಿವ್ಯಬಲಿಪೂಜೆಯ ಕೇಂದ್ರ: ಮುನ್ನುಡಿ, ಪರಿಶುದ್ಧ ಗೀತೆ, ಪವಿತ್ರಾತ್ಮರ ಆಹ್ವಾನ, ಸ್ಥಾಪನಾ ವೃತ್ತಾಂತ ಮತ್ತು ಪ್ರತಿಷ್ಠಾಪನೆ, ಸ್ಮರಣೆ, ಮಧ್ಯಸ್ಥಿಕೆಗಳು ಮತ್ತು ಮಹಾ ಆಮೆನ್‌ನೊಂದಿಗೆ ಉತ್ತರಿಸಲ್ಪಡುವ ಸಮಾಪ್ತಿ ಸ್ತುತಿ."],["ಆರಾಧನಾ ಬಣ್ಣಗಳು","ಸಾಮಾನ್ಯ ಕಾಲದಲ್ಲಿ ಹಸಿರು; ಆಗಮನಕಾಲ ಮತ್ತು ತಪಸ್ಸುಕಾಲದಲ್ಲಿ ನೇರಳೆ; ಕ್ರಿಸ್ತಜಯಂತಿ, ಪಾಸ್ಕ ಮತ್ತು ಪ್ರಭುವಿನ, ಮರಿಯಮಾತೆಯ ಹಾಗೂ ಹುತಾತ್ಮರಲ್ಲದ ಸಂತರ ಹಬ್ಬಗಳಲ್ಲಿ ಬಿಳಿ (ಅಥವಾ ಚಿನ್ನ); ಗರಿಗಳ ಭಾನುವಾರ, ಶುಭ ಶುಕ್ರವಾರ, ಪಂಚಾಶತ್ತಮ ಮತ್ತು ಪ್ರೇಷಿತರ ಹಾಗೂ ಹುತಾತ್ಮರ ಹಬ್ಬಗಳಲ್ಲಿ ಕೆಂಪು; ಆಗಮನಕಾಲದ ಮೂರನೇ ಮತ್ತು ತಪಸ್ಸುಕಾಲದ ನಾಲ್ಕನೇ ಭಾನುವಾರ ಗುಲಾಬಿ."],["ಮಹೋತ್ಸವ, ಹಬ್ಬ, ಸ್ಮರಣೆ","ಆಚರಣೆಗಳ ಮೂರು ಶ್ರೇಣಿಗಳು. ಮಹೋತ್ಸವ ಅತ್ಯುನ್ನತ; ಸ್ಮರಣೆ ಕಡ್ಡಾಯ ಅಥವಾ ಐಚ್ಛಿಕವಾಗಿರಬಹುದು."],["ಸಾಮಾನ್ಯ ಕಾಲ","ವಿಶೇಷ ಕಾಲಗಳ ಹೊರಗಿನ ಸಂಖ್ಯೆಯುಳ್ಳ ವಾರಗಳು; ಆಗ ಧರ್ಮಸಭೆ ಕ್ರಿಸ್ತರ ಸಾರ್ವಜನಿಕ ಜೀವನ ಮತ್ತು ಬೋಧನೆಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ."],["ಪಾಸ್ಕ ತ್ರಿದಿನ","ಪವಿತ್ರ ಗುರುವಾರದ ಪ್ರಭುವಿನ ಭೋಜನದ ಸಂಜೆಯ ಬಲಿಪೂಜೆಯಿಂದ ಪಾಸ್ಕ ಭಾನುವಾರದ ಸಂಜೆಯವರೆಗಿನ ಮೂರು ಪವಿತ್ರ ದಿನಗಳು: ಆರಾಧನಾ ವರ್ಷದ ಶಿಖರ."],["ಕಾಲಪ್ರಾರ್ಥನೆ","ದಿನದ ಗಂಟೆಗಳನ್ನು ಪವಿತ್ರಗೊಳಿಸುವ ಧರ್ಮಸಭೆಯ ಅನುದಿನದ ಪ್ರಾರ್ಥನೆ; ಬೆಳಗಿನ ಸ್ತುತಿ ಮತ್ತು ಸಂಜೆಯ ಪ್ರಾರ್ಥನೆ ಅದರ ಎರಡು ಆಧಾರಸ್ತಂಭಗಳು."],["ವಾಚನಪೀಠ, ಬಲಿಪೀಠ, ಪೂಜಾಪೆಟ್ಟಿಗೆ","ವಾಚನಪೀಠ ವಾಕ್ಯದ ಸ್ಥಳ; ಬಲಿಪೀಠ ಬಲಿಯ ಸ್ಥಳವೂ ಪ್ರಭುವಿನ ಮೇಜೂ; ಪೂಜಾಪೆಟ್ಟಿಗೆ ರೋಗಿಗಳಿಗಾಗಿಯೂ ಆರಾಧನೆಗಾಗಿಯೂ ಪರಮಪವಿತ್ರ ಸಂಸ್ಕಾರವನ್ನು ಕಾಪಾಡುತ್ತದೆ."],["ಆಗಮನಕಾಲದ ಮಾಲೆ","ನಾಲ್ಕು ಮೇಣದಬತ್ತಿಗಳುಳ್ಳ ಸದಾಹಸಿರು ಎಲೆಗಳ ಮಾಲೆ; ಆಗಮನಕಾಲದ ಭಾನುವಾರಗಳಲ್ಲಿ ಒಂದೊಂದಾಗಿ ಬೆಳಗಿಸಲಾಗುತ್ತದೆ: ಕ್ರಿಸ್ತಜಯಂತಿ ಸಮೀಪಿಸಿದಂತೆ ಬೆಳೆಯುವ ಬೆಳಕು."]];
GLOSS.lat.ta=[["திருப்பலி","உரோமை வழிபாட்டு முறையில் நற்கருணைக் கொண்டாட்டம்; இரண்டு முக்கியப் பகுதிகள்: இறைவார்த்தை வழிபாடு, நற்கருணை வழிபாடு."],["வாசக நூலும் சுழற்சிகளும்","ஞாயிறு வாசகங்கள் மூன்றாண்டுச் சுழற்சியைப் (அ, ஆ, இ ஆண்டுகள்; மத்தேயு, மாற்கு, லூக்கா) பின்பற்றுகின்றன; வார நாள்களின் முதல் வாசகம் இரண்டாண்டுச் சுழற்சியைப் (I, II) பின்பற்றுகிறது."],["பதிலுரைப் பாடல்","முதல் வாசகத்துக்குப் பின் பாடப்படும் அல்லது சொல்லப்படும் திருப்பாடல்; மக்கள் பல்லவியைத் திரும்பச் சொல்கிறார்கள். அது இறைவார்த்தையின் பகுதி, கூடுதல் பாடல் அல்ல."],["நற்செய்திக்கு முன் வாழ்த்தொலி","நற்செய்தியை வரவேற்கும் அல்லேலூயாவும் வசனமும். தவக்காலத்தில் அல்லேலூயாவுக்குப் பதில் வேறொரு வாழ்த்தொலி."],["மறையுரை","ஆயரோ அருள்பணியாளரோ திருத்தொண்டரோ வாசகங்களையும் வழிபாட்டையும் விளக்கி இறைவார்த்தையை வாழ்வுக்குப் பொருத்துதல்."],["விசுவாசிகளின் மன்றாட்டு","மக்கள் தங்கள் திருமுழுக்குக் குருத்துவத்தைச் செயல்படுத்தித் திருஅவை, உலகம், தேவையில் இருப்போர், தலத் திருச்சபை ஆகியவற்றுக்காக மன்றாடும் பொது மன்றாட்டு."],["நற்கருணை மன்றாட்டு","திருப்பலியின் மையம்: தொடக்கவுரை, தூயவர் பாடல், தூய ஆவியை இறைஞ்சுதல், ஏற்படுத்துதல் வரலாறும் அர்ச்சிப்பும், நினைவுகூர்தல், பரிந்துரைகள், பெரும் ஆமெனால் பதிலளிக்கப்படும் நிறைவுப் புகழ்."],["திருவழிபாட்டு நிறங்கள்","பொதுக்காலத்தில் பச்சை; திருவருகைக் காலத்திலும் தவக்காலத்திலும் ஊதா; கிறிஸ்து பிறப்பு, பாஸ்கா, ஆண்டவர், அன்னை மரியா, மறைசாட்சியர் அல்லாத புனிதர்களின் திருநாள்களில் வெண்மை (அல்லது பொன்); குருத்து ஞாயிறு, புனித வெள்ளி, தூய ஆவி பெருவிழா, திருத்தூதர், மறைசாட்சியர் திருநாள்களில் சிவப்பு; திருவருகைக் காலம் மூன்றாம் ஞாயிறிலும் தவக்காலம் நான்காம் ஞாயிறிலும் இளஞ்சிவப்பு."],["பெருவிழா, விழா, நினைவு","கொண்டாட்டங்களின் மூன்று படிநிலைகள். பெருவிழா மிக உயர்ந்தது; நினைவு கட்டாயமாகவோ விருப்பமாகவோ இருக்கலாம்."],["பொதுக்காலம்","சிறப்புக் காலங்களுக்கு வெளியே உள்ள எண்ணிடப்பட்ட வாரங்கள்; அப்போது திருஅவை கிறிஸ்துவின் பொதுவாழ்வையும் போதனையையும் பின்பற்றுகிறது."],["பாஸ்கா முந்நாள்","பெரிய வியாழன் ஆண்டவரின் இரவுணவுத் திருப்பலி முதல் பாஸ்கா ஞாயிறு மாலை வரையிலான மூன்று தூய நாள்கள்: திருவழிபாட்டு ஆண்டின் உச்சம்."],["திருப்புகழ்மாலை","நாளின் நேரங்களைப் புனிதப்படுத்தும் திருஅவையின் அன்றாட இறைவேண்டல்; காலைப் புகழும் மாலைப் புகழும் அதன் இரு அச்சாணிகள்."],["வாசகமேடை, பீடம், நற்கருணைப் பேழை","வாசகமேடை இறைவார்த்தையின் இடம்; பீடம் பலியின் இடமும் ஆண்டவரின் பந்தியும்; நற்கருணைப் பேழை நோயாளிகளுக்காகவும் ஆராதனைக்காகவும் மிகத் தூய அருளடையாளத்தைக் காக்கிறது."],["திருவருகை மலர்வளையம்","நான்கு மெழுகுதிரிகளோடு கூடிய என்றும் பசுமையான கிளைகளின் வளையம்; திருவருகைக் கால ஞாயிறுகளில் ஒன்றன்பின் ஒன்றாக ஏற்றப்படுகின்றன: கிறிஸ்து பிறப்பு நெருங்க நெருங்க வளரும் ஒளி."]];

GLOSS.lat.hi=[["पवित्र मिस्सा","रोमी रीति में यूखरिस्त का समारोह; दो मुख्य भाग: वचन की धर्मविधि और यूखरिस्तीय धर्मविधि।"],["पाठ-ग्रंथ और चक्र","रविवार के पाठ तीन-वर्षीय चक्र (वर्ष क, ख, ग; मत्ती, मारकुस, लूकस) का अनुसरण करते हैं; साप्ताहिक दिनों का पहला पाठ दो-वर्षीय चक्र (I और II) का।"],["अनुवाक्य स्तोत्र","पहले पाठ के बाद गाया या बोला जानेवाला स्तोत्र, जिसका अनुवाक्य लोग दोहराते हैं। यह ईश्वर के वचन का भाग है, कोई अतिरिक्त गीत नहीं।"],["सुसमाचार से पहले जयघोष","सुसमाचार का स्वागत करनेवाला अल्लेलूया और पद। चालीसा काल में अल्लेलूया के स्थान पर दूसरा जयघोष होता है।"],["प्रवचन","धर्माध्यक्ष, पुरोहित या उपयाजक द्वारा पाठों और धर्मविधि की व्याख्या, जो ईश्वर के वचन को जीवन पर लागू करती है।"],["विश्वासियों की प्रार्थना","सार्वभौमिक प्रार्थना, जिसमें लोग अपने बपतिस्मा के याजकत्व का प्रयोग करते हुए कलीसिया, संसार, ज़रूरतमंदों और स्थानीय समुदाय के लिए प्रार्थना करते हैं।"],["यूखरिस्तीय प्रार्थना","मिस्सा का केंद्र: प्रस्तावना, पवित्र-गीत, पवित्र आत्मा का आह्वान, स्थापना-वृत्तांत और प्रतिष्ठापन, स्मरण, मध्यस्थ प्रार्थनाएँ, और महान आमेन से उत्तर दी जानेवाली समापन-स्तुति।"],["धर्मविधिक रंग","सामान्य काल में हरा; आगमन और चालीसा काल में बैंगनी; ख्रीस्त जयंती, पास्का और प्रभु, माता मरियम तथा शहीद न हुए संतों के पर्वों पर सफ़ेद (या सुनहरा); खजूर रविवार, पुण्य शुक्रवार, पेन्तेकोस्त और प्रेरितों तथा शहीदों के पर्वों पर लाल; आगमन के तीसरे और चालीसा के चौथे रविवार को गुलाबी।"],["महापर्व, पर्व, स्मृति","समारोहों की तीन श्रेणियाँ। महापर्व सर्वोच्च है; स्मृति अनिवार्य या ऐच्छिक हो सकती है।"],["सामान्य काल","विशेष कालों के बाहर के गिने हुए सप्ताह, जिनमें कलीसिया ख्रीस्त के सार्वजनिक जीवन और शिक्षा का अनुसरण करती है।"],["पास्का त्रिदिवस","पुण्य गुरुवार की प्रभु-भोज की संध्या-मिस्सा से पास्का रविवार की संध्या तक के तीन पवित्र दिन: धर्मविधिक वर्ष का शिखर।"],["घंटों की प्रार्थना","दिन के घंटों को पवित्र करनेवाली कलीसिया की दैनिक प्रार्थना; प्रातः-स्तुति और संध्या-प्रार्थना इसके दो मुख्य आधार हैं।"],["पाठ-मंच, वेदी, परमप्रसाद-मंजूषा","पाठ-मंच वचन का स्थान है; वेदी बलिदान का स्थान और प्रभु की मेज़ है; परमप्रसाद-मंजूषा बीमारों और आराधना के लिए परम पवित्र संस्कार को सुरक्षित रखती है।"],["आगमन-माला","चार मोमबत्तियोंवाली सदाबहार डालियों की माला, जिनकी मोमबत्तियाँ आगमन के रविवारों को एक-एक करके जलाई जाती हैं: ख्रीस्त जयंती के निकट आते बढ़ता प्रकाश।"]];
GLOSS.lat.es=[["Santa Misa","La celebración de la Eucaristía en el rito romano; tiene dos partes principales: la liturgia de la Palabra y la liturgia eucarística."],["Leccionario y ciclos","Las lecturas dominicales siguen un ciclo de tres años (ciclos A, B y C; Mateo, Marcos y Lucas); la primera lectura de las ferias sigue un ciclo de dos años (I y II)."],["Salmo responsorial","El salmo que se canta o se recita después de la primera lectura; el pueblo repite la respuesta. Forma parte de la palabra de Dios, no es un canto añadido."],["Aclamación antes del Evangelio","El aleluya con su versículo, que saluda al Evangelio. En Cuaresma el aleluya se sustituye por otra aclamación."],["Homilía","La predicación del obispo, el presbítero o el diácono que explica las lecturas y la liturgia y aplica la palabra de Dios a la vida."],["Oración universal","La oración de los fieles, en la que el pueblo ejerce su sacerdocio bautismal rezando por la Iglesia, el mundo, los necesitados y la comunidad local."],["Plegaria eucarística","El centro de la Misa: prefacio, Santo, epíclesis, relato de la institución y consagración, anámnesis, intercesiones y doxología final, a la que se responde con el gran Amén."],["Colores litúrgicos","Verde en el Tiempo Ordinario; morado en Adviento y Cuaresma; blanco (o dorado) en Navidad, Pascua y las fiestas del Señor, de la Virgen María y de los santos no mártires; rojo el Domingo de Ramos, el Viernes Santo, Pentecostés y las fiestas de apóstoles y mártires; rosa el III Domingo de Adviento y el IV de Cuaresma."],["Solemnidad, fiesta, memoria","Los tres grados de las celebraciones. La solemnidad es el más alto; la memoria puede ser obligatoria o libre."],["Tiempo Ordinario","Las semanas numeradas fuera de los tiempos fuertes, en las que la Iglesia sigue la vida pública y la enseñanza de Cristo."],["Triduo pascual","Los tres días santos, desde la Misa vespertina de la Cena del Señor el Jueves Santo hasta las Vísperas del Domingo de Pascua: la cumbre del año litúrgico."],["Liturgia de las Horas","La oración diaria de la Iglesia que santifica las horas del día; Laudes y Vísperas son sus dos ejes."],["Ambón, altar, sagrario","El ambón es el lugar de la Palabra; el altar, el lugar del sacrificio y la mesa del Señor; el sagrario guarda el Santísimo Sacramento para los enfermos y para la adoración."],["Corona de Adviento","Una corona de ramas siempre verdes con cuatro velas que se encienden una a una en los domingos de Adviento: una luz que crece a medida que se acerca la Navidad."]];
GLOSS.lat.pt=[["Santa Missa","A celebração da Eucaristia no rito romano; tem duas partes principais: a liturgia da Palavra e a liturgia eucarística."],["Lecionário e ciclos","As leituras dominicais seguem um ciclo de três anos (anos A, B e C; Mateus, Marcos e Lucas); a primeira leitura dos dias feriais segue um ciclo de dois anos (I e II)."],["Salmo responsorial","O salmo cantado ou recitado depois da primeira leitura; o povo repete o refrão. Faz parte da palavra de Deus, não é um cântico acrescentado."],["Aclamação antes do Evangelho","O aleluia com o seu versículo, que saúda o Evangelho. Na Quaresma o aleluia é substituído por outra aclamação."],["Homilia","A pregação do bispo, do presbítero ou do diácono que explica as leituras e a liturgia e aplica a palavra de Deus à vida."],["Oração universal","A oração dos fiéis, em que o povo exerce o seu sacerdócio batismal rezando pela Igreja, pelo mundo, pelos necessitados e pela comunidade local."],["Oração eucarística","O centro da Missa: prefácio, Santo, epiclese, narração da instituição e consagração, anamnese, intercessões e doxologia final, a que se responde com o grande Ámen."],["Cores litúrgicas","Verde no Tempo Comum; roxo no Advento e na Quaresma; branco (ou dourado) no Natal, na Páscoa e nas festas do Senhor, da Virgem Maria e dos santos não mártires; vermelho no Domingo de Ramos, na Sexta-feira Santa, no Pentecostes e nas festas dos apóstolos e mártires; rosa no III Domingo do Advento e no IV da Quaresma."],["Solenidade, festa, memória","Os três graus das celebrações. A solenidade é o mais alto; a memória pode ser obrigatória ou facultativa."],["Tempo Comum","As semanas numeradas fora dos tempos fortes, em que a Igreja acompanha a vida pública e o ensino de Cristo."],["Tríduo pascal","Os três dias santos, desde a Missa vespertina da Ceia do Senhor na Quinta-feira Santa até às Vésperas do Domingo de Páscoa: o cume do ano litúrgico."],["Liturgia das Horas","A oração diária da Igreja que santifica as horas do dia; Laudes e Vésperas são os seus dois eixos."],["Ambão, altar, sacrário","O ambão é o lugar da Palavra; o altar, o lugar do sacrifício e a mesa do Senhor; o sacrário guarda o Santíssimo Sacramento para os doentes e para a adoração."],["Coroa do Advento","Uma coroa de ramos sempre verdes com quatro velas que se acendem uma a uma nos domingos do Advento: uma luz que cresce à medida que se aproxima o Natal."]];
GLOSS.lat.fr=[["Sainte Messe","La célébration de l'Eucharistie dans le rite romain ; elle a deux parties principales : la liturgie de la Parole et la liturgie eucharistique."],["Lectionnaire et cycles","Les lectures du dimanche suivent un cycle de trois ans (années A, B et C ; Matthieu, Marc et Luc) ; la première lecture de semaine suit un cycle de deux ans (I et II)."],["Psaume","Le psaume chanté ou dit après la première lecture ; le peuple reprend le refrain. Il fait partie de la parole de Dieu, ce n'est pas un chant ajouté."],["Acclamation de l'Évangile","L'alléluia avec son verset, qui salue l'Évangile. Pendant le Carême, l'alléluia est remplacé par une autre acclamation."],["Homélie","La prédication de l'évêque, du prêtre ou du diacre qui explique les lectures et la liturgie et applique la parole de Dieu à la vie."],["Prière universelle","La prière des fidèles, où le peuple exerce son sacerdoce baptismal en priant pour l'Église, le monde, ceux qui sont dans le besoin et la communauté locale."],["Prière eucharistique","Le cœur de la Messe : préface, Saint, épiclèse, récit de l'institution et consécration, anamnèse, intercessions et doxologie finale, à laquelle répond le grand Amen."],["Couleurs liturgiques","Vert au Temps ordinaire ; violet pendant l'Avent et le Carême ; blanc (ou doré) à Noël, à Pâques et aux fêtes du Seigneur, de la Vierge Marie et des saints non martyrs ; rouge le dimanche des Rameaux, le Vendredi saint, à la Pentecôte et aux fêtes des apôtres et des martyrs ; rose le troisième dimanche de l'Avent et le quatrième dimanche de Carême."],["Solennité, fête, mémoire","Les trois degrés des célébrations. La solennité est le plus haut ; la mémoire peut être obligatoire ou facultative."],["Temps ordinaire","Les semaines numérotées en dehors des temps forts, où l'Église suit la vie publique et l'enseignement du Christ."],["Triduum pascal","Les trois jours saints, de la Messe du soir de la Cène du Seigneur le Jeudi saint jusqu'aux vêpres du dimanche de Pâques : le sommet de l'année liturgique."],["Liturgie des Heures","La prière quotidienne de l'Église qui sanctifie les heures du jour ; les laudes et les vêpres en sont les deux pivots."],["Ambon, autel, tabernacle","L'ambon est le lieu de la Parole ; l'autel, le lieu du sacrifice et la table du Seigneur ; le tabernacle garde le Saint-Sacrement pour les malades et pour l'adoration."],["Couronne de l'Avent","Une couronne de branches toujours vertes avec quatre bougies allumées une à une les dimanches de l'Avent : une lumière qui grandit à mesure que Noël approche."]];
GLOSS.lat.tl=[["Banal na Misa","Ang pagdiriwang ng Eukaristiya sa ritong Romano; may dalawa itong pangunahing bahagi: ang Liturhiya ng Salita at ang Liturhiya ng Eukaristiya."],["Leksiyonaryo at mga siklo","Sumusunod ang mga pagbasa tuwing Linggo sa tatlong-taong siklo (Taon A, B at C; Mateo, Marcos at Lucas); sumusunod ang unang pagbasa sa karaniwang araw sa dalawang-taong siklo (I at II)."],["Salmong Tugunan","Ang salmong inaawit o binibigkas pagkatapos ng unang pagbasa; inuulit ng bayan ang tugon. Bahagi ito ng salita ng Diyos, hindi awit na idinagdag lamang."],["Aleluya","Ang aleluya at ang talata nito, na sumasalubong sa Ebanghelyo. Sa Kuwaresma, pinapalitan ang aleluya ng ibang pagbubunyi."],["Homiliya","Ang pangangaral ng obispo, pari o diyakono na nagpapaliwanag ng mga pagbasa at ng liturhiya at nag-uugnay ng salita ng Diyos sa buhay."],["Panalangin ng Bayan","Ang panalangin ng mga mananampalataya, kung saan ginagampanan ng bayan ang kanilang pagkapari mula sa binyag sa pananalangin para sa Simbahan, sa mundo, sa mga nangangailangan at sa lokal na pamayanan."],["Panalanging Eukaristiko","Ang puso ng Misa: prepasyo, Santo, epiklesis, salaysay ng pagtatatag at konsagrasyon, anamnesis, mga pamamagitan at pangwakas na doksolohiya, na sinasagot ng dakilang Amen."],["Mga kulay ng liturhiya","Berde sa Karaniwang Panahon; lila sa Adbiyento at Kuwaresma; puti (o ginto) sa Pasko, Pasko ng Pagkabuhay at mga kapistahan ng Panginoon, ng Birheng Maria at ng mga santong hindi martir; pula sa Linggo ng Palaspas, Biyernes Santo, Pentekostes at mga kapistahan ng mga apostol at martir; rosas sa Ikatlong Linggo ng Adbiyento at Ikaapat na Linggo ng Kuwaresma."],["Dakilang kapistahan, kapistahan, paggunita","Ang tatlong antas ng mga pagdiriwang. Ang dakilang kapistahan ang pinakamataas; ang paggunita ay maaaring obligado o malaya."],["Karaniwang Panahon","Ang mga linggong may bilang sa labas ng mga natatanging panahon, kung saan sinusundan ng Simbahan ang pampublikong buhay at turo ni Kristo."],["Tatlong Araw ng Pasko","Ang tatlong banal na araw, mula sa Misa ng Hapunan ng Panginoon sa gabi ng Huwebes Santo hanggang sa Panalangin sa Gabi ng Linggo ng Pagkabuhay: ang rurok ng taon ng liturhiya."],["Liturhiya ng mga Oras","Ang araw-araw na panalangin ng Simbahan na nagpapabanal sa mga oras ng araw; ang Panalangin sa Umaga at Panalangin sa Gabi ang dalawang haligi nito."],["Ambo, altar, tabernakulo","Ang ambo ang lugar ng Salita; ang altar, ang lugar ng sakripisyo at hapag ng Panginoon; iniingatan ng tabernakulo ang Santisimo Sakramento para sa mga maysakit at para sa pagsamba."],["Korona ng Adbiyento","Isang korona ng laging-berdeng sanga na may apat na kandilang isa-isang sinisindihan tuwing Linggo ng Adbiyento: isang liwanag na lumalaki habang papalapit ang Pasko."],["Simbang Gabi","Ang siyam na Misa sa madaling-araw o gabi mula Disyembre 16 hanggang 24 sa Pilipinas, isang nobena ng paghahanda sa Pasko kasama ang Mahal na Birheng Maria."]];
GLOSS.lat.te=[["పవిత్ర దివ్యబలిపూజ","రోమను రీతిలో దివ్యసత్ప్రసాద వేడుక; దానికి రెండు ప్రధాన భాగాలు: వాక్య ఆరాధన, దివ్యసత్ప్రసాద ఆరాధన."],["పఠన గ్రంథం, చక్రాలు","ఆదివారపు పఠనాలు మూడు సంవత్సరాల చక్రాన్ని (సంవత్సరం A, B, C; మత్తయి, మార్కు, లూకా) అనుసరిస్తాయి; వారపు రోజుల మొదటి పఠనం రెండు సంవత్సరాల చక్రాన్ని (I, II) అనుసరిస్తుంది."],["భజన కీర్తన","మొదటి పఠనం తర్వాత పాడే లేదా చెప్పే కీర్తన; ప్రజలు పల్లవిని పునరావృతం చేస్తారు. ఇది దేవుని వాక్యంలో భాగం, అదనంగా చేర్చిన పాట కాదు."],["సువార్త ముందు ఆలెలూయా","సువార్తను స్వాగతించే ఆలెలూయా, దాని వచనం. తపస్సు కాలంలో ఆలెలూయాకు బదులు మరో స్తుతి వాక్యం వాడతారు."],["ప్రసంగం","పఠనాలను, ఆరాధనను వివరించి దేవుని వాక్యాన్ని జీవితానికి వర్తింపజేసే పీఠాధిపతి, గురువు లేదా పరిచారకుని బోధ."],["విశ్వాసుల ప్రార్థన","శ్రీసభ కొరకు, లోకం కొరకు, అవసరంలో ఉన్నవారి కొరకు, స్థానిక సమాజం కొరకు ప్రార్థిస్తూ ప్రజలు తమ జ్ఞానస్నాన యాజకత్వాన్ని నెరవేర్చే ప్రార్థన."],["దివ్యబలి ప్రార్థన","దివ్యబలిపూజ హృదయం: పీఠిక, పవిత్రుడు గీతం, ఆత్మ ఆవాహనం, స్థాపన వృత్తాంతం, ప్రతిష్ఠాపన, స్మరణ, మధ్యస్థ ప్రార్థనలు, చివరి స్తుతిగీతం; దానికి గొప్ప ఆమెన్ జవాబు."],["ఆరాధనా రంగులు","సాధారణ కాలంలో ఆకుపచ్చ; ఆగమన, తపస్సు కాలాల్లో ఊదా; క్రిస్మస్, పాస్కా, ప్రభువు, మరియమాత, వేదసాక్షులు కాని పునీతుల పండుగల్లో తెలుపు (లేదా బంగారు); మట్టల ఆదివారం, శుభ శుక్రవారం, పెంతెకొస్తు, అపొస్తలుల, వేదసాక్షుల పండుగల్లో ఎరుపు; ఆగమన కాలపు మూడవ ఆదివారం, తపస్సు కాలపు నాల్గవ ఆదివారం గులాబీ."],["మహోత్సవం, పండుగ, స్మరణ","వేడుకల మూడు స్థాయిలు. మహోత్సవం అత్యున్నతమైనది; స్మరణ తప్పనిసరి లేదా ఐచ్ఛికం కావచ్చు."],["సాధారణ కాలం","ప్రత్యేక కాలాల బయట ఉన్న సంఖ్యల వారాలు; శ్రీసభ క్రీస్తు బహిరంగ జీవితాన్ని, బోధను అనుసరిస్తుంది."],["పాస్కా త్రిదినాలు","పవిత్ర గురువారపు ప్రభువు రాత్రి భోజన దివ్యబలిపూజ నుండి పాస్కా ఆదివారపు సంధ్యా ప్రార్థన వరకు మూడు పవిత్ర దినాలు: ఆరాధనా సంవత్సరపు శిఖరం."],["గడియల ప్రార్థన","రోజులోని గడియలను పవిత్రం చేసే శ్రీసభ రోజువారీ ప్రార్థన; ఉదయ ప్రార్థన, సంధ్యా ప్రార్థన దాని రెండు స్తంభాలు."],["వాక్య పీఠం, బలిపీఠం, దివ్యసత్ప్రసాద పేటిక","వాక్య పీఠం వాక్య స్థలం; బలిపీఠం బలి స్థలం, ప్రభువు బల్ల; దివ్యసత్ప్రసాద పేటిక రోగుల కొరకు, ఆరాధన కొరకు దివ్యసత్ప్రసాదాన్ని భద్రపరుస్తుంది."],["ఆగమన కిరీటం","ఆగమన కాలపు ఆదివారాల్లో ఒక్కొక్కటిగా వెలిగించే నాలుగు కొవ్వొత్తులు గల పచ్చని కొమ్మల వలయం: క్రిస్మస్ సమీపించే కొద్దీ పెరిగే వెలుగు."]];
GLOSS.smc.te=[["పవిత్ర కుర్బానా","అర్పణ అని అర్థమిచ్చే సిరియా పదం. తూర్పు శ్రీసభ నుండి పొందిన తూర్పు సిరియా సంప్రదాయానికి చెందిన సీరో-మలబారు శ్రీసభ దివ్యసత్ప్రసాద ఆరాధన."],["రాజా","రహస్యం. గొప్ప పండుగలలో జరుపబడే పవిత్ర కుర్బానా యొక్క అత్యంత ఘనమైన రూపం."],["తక్సా","క్రమం. పవిత్ర కుర్బానా పాఠం ఉన్న ఆరాధనా గ్రంథం."],["మద్బహా","బలిపీఠం ఉన్న పవిత్ర స్థలం. ఎత్తుగా, వేరుగా ఉంచబడుతుంది; పరలోకానికి గుర్తు."],["కెస్త్రోమా","పవిత్ర స్థలానికీ దేవాలయ మధ్య భాగానికీ మధ్య ఉన్న స్థలం; పరలోకానికీ భూలోకానికీ మధ్య ఉన్న పరదైసుకు గుర్తు."],["హైకలా","విశ్వాసులు నిలబడే దేవాలయ మధ్య భాగం; భూలోకానికీ, యాత్ర చేసే దేవుని ప్రజలకూ గుర్తు."],["బేమా","ప్రాచీన తూర్పు సిరియా దేవాలయంలో మధ్య భాగం నడుమ ఎత్తైన వేదిక; అక్కడ నుండి దేవుని వాక్యం ప్రకటించబడేది."],["మార్ తోమా సిలువ","క్రీస్తు దేహం లేని, పైన పావురంతో, తరచుగా కమలంపై నిలిచే సిలువ. పునరుత్థాన క్రీస్తునూ, పవిత్రాత్మ వరాన్నీ ప్రకటిస్తుంది."],["మార్ అద్దాయి, మార్ మారి అనఫోరా","ఎదెస్సా అపోస్తలులకు ఆపాదించబడిన, శ్రీసభలోనే అత్యంత ప్రాచీన దివ్యసత్ప్రసాద ప్రార్థనలలో ఒకటి; సీరో-మలబారు కుర్బానా ప్రధాన అనఫోరా."],["లాఖు మారా","ప్రభువా, నీకే. పవిత్ర కుర్బానా ఆరంభంలో పాడే క్రీస్తు స్తుతి గీతం."],["కరోజూత","పరిచారకుడు లేదా సేవకుడు ప్రకటించే మనవిల వరుస; ప్రజలు చిన్న ప్రత్యుత్తరంతో జవాబిస్తారు."],["ఓనీత","ఆరాధనా గీతం లేదా పల్లవి. కానుకల ఊరేగింపు సమయంలో ఓనీత ద్రాజే పాడబడుతుంది."],["దుక్రానా","స్మరణ. ఒక పునీతుని పండుగ, సాధారణంగా ఆయన మరణించిన రోజు. పునీత తోమాసు దుక్రానా జూలై 3."],["రంశా, లెల్యా, సప్రా","తూర్పు సిరియా సంప్రదాయంలో యామ ప్రార్థనల సాయంకాల, రాత్రి, ఉదయ ప్రార్థనలు."],["మూన్ను నోంబు","మహా ఉపవాసానికి ముందు మూడవ వారం సోమవారం నుండి బుధవారం వరకు పాటించే నీనెవె ప్రజల మూడు రోజుల ఉపవాసం (యోనా 3)."],["పెసహా","పాస్కా. ప్రభువు పవిత్ర కుర్బానాను స్థాపించిన పవిత్ర గురువారం. కేరళ గృహాలలో పెసహా అప్పం, పాలు దీవించి పంచుకుంటారు."],["ఖూదాశ్ ఏద్తా","శ్రీసభ ప్రతిష్ఠ కాలం. ఆరాధనా సంవత్సరపు చివరి నాలుగు ఆదివారాలు; క్రీస్తు వధువుగా, దేవుని నివాసంగా శ్రీసభను ధ్యానిస్తాయి."],["సుబారా","మంగళవార్త కాలం. ప్రభువు జననానికి ముందు నాలుగు ఆదివారాలు; ఆరాధనా సంవత్సరం ఇక్కడ మొదలవుతుంది."]];
GLOSS.lat.sw=[["Misa Takatifu","Adhimisho la Ekaristi katika Ibada ya Kiroma, lenye sehemu kuu mbili: Liturujia ya Neno na Liturujia ya Ekaristi."],["Kitabu cha Masomo na mizunguko","Masomo ya Dominika yanafuata mzunguko wa miaka mitatu (Miaka A, B na C, pamoja na Mathayo, Marko na Luka); masomo ya kwanza ya siku za kawaida yanafuata mzunguko wa miaka miwili (I na II)."],["Zaburi ya Kuitikizana","Zaburi inayoimbwa au kusomwa baada ya somo la kwanza, ikiwa na kiitikio kinachorudiwa na watu. Ni sehemu ya Neno la Mungu, si wimbo wa ziada."],["Shangilio la Injili","Aleluya na mstari unaoikaribisha Injili. Wakati wa Kwaresima shangilio jingine linachukua nafasi ya Aleluya."],["Mahubiri","Maelezo ya masomo na ya liturujia, yanayotolewa na askofu, padre au shemasi, yakilitumia Neno la Mungu katika maisha."],["Maombi ya Waamini","Sala ambamo watu wanatumia ukuhani wao wa ubatizo kwa kuliombea Kanisa, ulimwengu, wenye shida na jumuiya ya mahali."],["Sala ya Ekaristi","Kiini cha Misa: Utangulizi, Mtakatifu, kumwomba Roho Mtakatifu (epiklesis), simulizi la kuwekwa kwa Ekaristi na Mageuzo, ukumbusho, maombezi na utukuzo wa mwisho unaojibiwa kwa Amina kuu."],["Rangi za liturujia","Kijani kwa Kipindi cha Kawaida; zambarau kwa Majilio na Kwaresima; nyeupe (au dhahabu) kwa Noeli, Pasaka na sikukuu za Bwana, za Maria na za watakatifu wasio wafiadini; nyekundu kwa Dominika ya Matawi, Ijumaa Kuu, Pentekoste, mitume na wafiadini."],["Sherehe, Sikukuu, Kumbukumbu","Daraja tatu za adhimisho. Sherehe ndiyo ya juu kabisa; kumbukumbu inaweza kuwa ya lazima au ya hiari."],["Kipindi cha Kawaida","Wiki zenye namba za mwaka nje ya vipindi vikuu, ambamo Kanisa linafuata maisha ya hadhara na mafundisho ya Kristo."],["Siku Tatu Kuu za Pasaka","Siku tatu takatifu kuanzia Misa ya jioni ya Karamu ya Bwana Alhamisi Kuu hadi jioni ya Dominika ya Pasaka: kilele cha mwaka wa liturujia."],["Sala ya Kanisa","Sala ya kila siku ya Kanisa inayotakatifuza saa za siku; Masifu ya Asubuhi na Masifu ya Jioni ndizo nguzo zake mbili."],["Mimbari, altare, tabernakulo","Mimbari ni mahali pa Neno; altare ni mahali pa sadaka na meza ya Bwana; tabernakulo inahifadhi Sakramenti Kuu kwa ajili ya wagonjwa na kwa kuabudu."],["Shada la Majilio","Shada la majani ya kijani kibichi lenye mishumaa minne, inayowashwa mmoja baada ya mwingine Dominika za Majilio, ikionyesha mwanga unaoongezeka Noeli inapokaribia."]];
var SERMON={};
/* Season introductions: a narration and teaching shown at the start of each liturgical season (open on the first day,
   folded on the following days). SEASON[rite][startDate] = {end, <lang>:{t, p:[narration], k:[[heading,text]]}}.
   Scripture paraphrased with references; no quotation marks. Translations are added by season_i18n.js. */
window.SEASON={
smc:{
 "2026-11-01":{end:"2026-11-28",
  en:{t:"The Season of the Dedication of the Church (Qudash Edtha)",
   p:["Today the Syro-Malabar Church enters the last season of her liturgical year: Qudash Edtha, the Dedication or Sanctification of the Church. For four weeks our liturgy looks at the Church herself: who she is, why Christ founded her, and where she is going.",
    "The East Syriac tradition, which our fathers received from the Church of the East, sees the liturgical year as the whole story of salvation. It begins with the Annunciation and the birth of Christ, passes through his Epiphany, his fasting, his Passion and Resurrection, the mission of the apostles and the growth of the Church, and ends here: with the Church presented to Christ as his bride, holy and without blemish (Ephesians 5:25–27).",
    "So Qudash Edtha is a season of the end. It speaks of the fulfilment of all things, the heavenly Jerusalem, the wedding feast of the Lamb (Revelation 21:2). It reminds us that the Church on earth, with all her weakness and sins, is on a journey towards that glory. The last Sunday of the season celebrates Christ the King, to whom all things will be subjected.",
    "This season asks each of us: do I love the Church as Christ loves her? Do I see my parish, my diocese and my Church sui iuris not as an institution I use, but as the Body of Christ to which I belong, and the bride he is purifying?"],
   k:[["What the season celebrates","The Church as the Temple of God, the Body of Christ and the Bride of the Lamb; her dedication to God and her final glory."],
    ["Scripture to read","Ephesians 5:25–32 (Christ loves the Church as his bride); 1 Peter 2:4–10 (living stones); Hebrews 9 (the true sanctuary); Revelation 21 (the new Jerusalem)."],
    ["In the liturgy","Hymns of the season speak of the Church as the bridal chamber and the holy dwelling of God. The year closes with the feast of Christ the King on the fourth Sunday."],
    ["How to live it","Pray for the Church, the Holy Father, our Major Archbishop and bishops. Take part in a parish activity. Thank God for the faith of the St Thomas Christians and pray for the unity of the Church."],
    ["At home","Bless the home with holy water and pray together for the parish. Talk with children about the church where they were baptised and why we call it the house of God."]]},
  ml:{t:"പള്ളിക്കൂദാശക്കാലം (ഖുദാശ് ഏത്താ)",
   p:["ഇന്ന് സീറോ മലബാർ സഭ ആരാധനക്രമവത്സരത്തിലെ അവസാനകാലത്തിലേക്കു പ്രവേശിക്കുന്നു: ഖുദാശ് ഏത്താ, പള്ളിക്കൂദാശക്കാലം. നാല് ആഴ്ചകളിൽ നമ്മുടെ ആരാധനക്രമം സഭയെത്തന്നെ ധ്യാനിക്കുന്നു: അവൾ ആരാണ്, മിശിഹാ അവളെ സ്ഥാപിച്ചത് എന്തിന്, അവൾ എങ്ങോട്ടാണു യാത്ര ചെയ്യുന്നത്.",
    "നമ്മുടെ പിതാക്കന്മാർ പൗരസ്ത്യസഭയിൽനിന്നു സ്വീകരിച്ച പൗരസ്ത്യ സുറിയാനി പാരമ്പര്യം ആരാധനക്രമവത്സരത്തെ രക്ഷാചരിത്രം മുഴുവനായി കാണുന്നു. മംഗളവാർത്തയിലും മിശിഹായുടെ ജനനത്തിലും ആരംഭിച്ച്, ദനഹാ, നോമ്പ്, പീഡാനുഭവം, ഉയിർപ്പ്, ശ്ലീഹന്മാരുടെ ദൗത്യം, സഭയുടെ വളർച്ച എന്നിവയിലൂടെ കടന്ന് അത് ഇവിടെ അവസാനിക്കുന്നു: പരിശുദ്ധയും കളങ്കമറ്റവളുമായ മണവാട്ടിയായി സഭ മിശിഹായ്ക്കു സമർപ്പിക്കപ്പെടുന്നതിൽ (എഫേ 5:25–27).",
    "അതിനാൽ ഖുദാശ് ഏത്താ അന്ത്യത്തിന്റെ കാലമാണ്. എല്ലാറ്റിന്റെയും പൂർത്തീകരണം, സ്വർഗീയ ജറുസലേം, കുഞ്ഞാടിന്റെ വിവാഹവിരുന്ന് എന്നിവയെക്കുറിച്ച് അതു സംസാരിക്കുന്നു (വെളി 21:2). ബലഹീനതകളും പാപങ്ങളുമുള്ള ഭൂമിയിലെ സഭ ആ മഹത്ത്വത്തിലേക്കുള്ള യാത്രയിലാണെന്ന് അത് ഓർമിപ്പിക്കുന്നു. എല്ലാം കീഴ്പ്പെടുത്തപ്പെടുന്ന മിശിഹാരാജന്റെ തിരുനാളോടെയാണ് ഈ കാലം സമാപിക്കുന്നത്.",
    "ഈ കാലം നമ്മോട് ഓരോരുത്തരോടും ചോദിക്കുന്നു: മിശിഹാ സഭയെ സ്നേഹിക്കുന്നതുപോലെ ഞാൻ സഭയെ സ്നേഹിക്കുന്നുണ്ടോ? എന്റെ ഇടവകയെയും രൂപതയെയും സ്വയാധികാരസഭയെയും ഞാൻ ഉപയോഗിക്കുന്ന ഒരു സ്ഥാപനമായിട്ടല്ല, ഞാൻ അംഗമായ മിശിഹായുടെ ശരീരമായും അവിടന്നു ശുദ്ധീകരിക്കുന്ന മണവാട്ടിയായും കാണുന്നുണ്ടോ?"],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","ദൈവത്തിന്റെ ആലയവും മിശിഹായുടെ ശരീരവും കുഞ്ഞാടിന്റെ മണവാട്ടിയുമായ സഭ; ദൈവത്തിനുള്ള അവളുടെ സമർപ്പണവും അന്തിമമഹത്ത്വവും."],
    ["വായിക്കേണ്ട വചനഭാഗങ്ങൾ","എഫേ 5:25–32 (മിശിഹാ സഭയെ മണവാട്ടിയായി സ്നേഹിക്കുന്നു); 1 പത്രോ 2:4–10 (ജീവനുള്ള കല്ലുകൾ); ഹെബ്രാ 9 (യഥാർഥ വിശുദ്ധസ്ഥലം); വെളി 21 (പുതിയ ജറുസലേം)."],
    ["ആരാധനക്രമത്തിൽ","ഈ കാലത്തെ ഗീതങ്ങൾ സഭയെ മണവറയായും ദൈവത്തിന്റെ വിശുദ്ധവാസസ്ഥലമായും പാടുന്നു. നാലാം ഞായറാഴ്ച മിശിഹാരാജന്റെ തിരുനാളോടെ വർഷം സമാപിക്കുന്നു."],
    ["എങ്ങനെ ജീവിക്കാം","സഭയ്ക്കും മാർപാപ്പയ്ക്കും നമ്മുടെ മേജർ ആർച്ച്ബിഷപ്പിനും മെത്രാന്മാർക്കുംവേണ്ടി പ്രാർഥിക്കുക. ഒരു ഇടവകപ്രവർത്തനത്തിൽ പങ്കെടുക്കുക. മാർ തോമാ നസ്രാണികളുടെ വിശ്വാസത്തിനു നന്ദി പറയുകയും സഭൈക്യത്തിനായി പ്രാർഥിക്കുകയും ചെയ്യുക."],
    ["ഭവനത്തിൽ","വെഞ്ചരിച്ച വെള്ളംകൊണ്ടു ഭവനം ആശീർവദിച്ച് ഇടവകയ്ക്കുവേണ്ടി ഒരുമിച്ചു പ്രാർഥിക്കുക. മാമ്മോദീസാ സ്വീകരിച്ച ദേവാലയത്തെക്കുറിച്ചും അതിനെ ദൈവഭവനം എന്നു വിളിക്കുന്നത് എന്തുകൊണ്ടെന്നും കുട്ടികളോടു സംസാരിക്കുക."]]}},
 "2026-11-29":{end:"2026-12-24",
  en:{t:"The Season of Annunciation (Suvara): a new liturgical year",
   p:["Today the Syro-Malabar Church begins a new liturgical year with the Season of Annunciation, Suvara, which means good news. For four Sundays and weeks we hear how God announced the coming of his Son: to Zechariah in the Temple, to Mary in Nazareth, to Joseph in a dream, and to the whole people through the birth of John the Baptist.",
    "Why begin the year with announcements? Because salvation begins with God's word. Before anything is done, God speaks; and the saints of this season, Zechariah, Elizabeth, Mary and Joseph, show the different ways a human heart can answer: with doubt that becomes silence and then praise, with humble faith, with obedient courage.",
    "The Old Testament readings of the season tell of births that God gave beyond all hope: Isaac to Abraham and Sarah, Samson to the wife of Manoah, Samuel to Hannah. They prepare us for the greatest birth of all, the One whom no human promise could produce: the Son of God born of the Virgin Mary.",
    "From 1 December our Church keeps the Twenty-Five Days' Fast, the Nombu before the Nativity. Fasting, prayer, confession and almsgiving prepare a dwelling for the Lord. This is a season of listening, waiting and preparing, so that on the night of the Nativity we can say with Mary: let it be with me according to your word (Luke 1:38)."],
   k:[["What the season celebrates","God's announcements of salvation and the human answer of faith: the promise to Zechariah, the Annunciation to Mary, the Visitation, the birth of John, the revelation to Joseph."],
    ["The Sundays","First: the message to Zechariah (Luke 1:5–25). Second: the Annunciation to Mary (Luke 1:26–38). Third: the birth of John the Baptist (Luke 1:57–66). Fourth: the revelation to Joseph (Matthew 1:18–24)."],
    ["The Twenty-Five Days' Fast","From 1 to 24 December: simpler food, abstinence according to custom and ability, more prayer, a good confession and generosity to the poor. The fast is a preparation, not a price for grace."],
    ["Mary in this season","The season is deeply Marian. Mary listens, believes, serves Elizabeth and treasures God's word. Praying the Angelus and the Rosary fits the spirit of these weeks."],
    ["At home","Prepare the crib step by step, adding a figure each Sunday. Read the Gospel of the Sunday together. Keep a box for the money saved by fasting and give it to the poor before the Nativity."]]},
  ml:{t:"മംഗളവാർത്താക്കാലം (സൂവാറ): പുതിയ ആരാധനക്രമവത്സരം",
   p:["സദ്വാർത്ത എന്നർഥമുള്ള സൂവാറ, മംഗളവാർത്താക്കാലത്തോടെ സീറോ മലബാർ സഭ ഇന്നു പുതിയ ആരാധനക്രമവത്സരം ആരംഭിക്കുന്നു. നാലു ഞായറാഴ്ചകളിലും ആഴ്ചകളിലും ദൈവം തന്റെ പുത്രന്റെ ആഗമനം എങ്ങനെ അറിയിച്ചുവെന്നു നാം കേൾക്കുന്നു: ദേവാലയത്തിൽ സഖറിയായോട്, നസ്രത്തിൽ മറിയത്തോട്, സ്വപ്നത്തിൽ യൗസേപ്പിനോട്, സ്നാപകയോഹന്നാന്റെ ജനനത്തിലൂടെ ജനം മുഴുവനോടും.",
    "അറിയിപ്പുകളോടെ വർഷം ആരംഭിക്കുന്നത് എന്തുകൊണ്ട്? രക്ഷ ആരംഭിക്കുന്നതു ദൈവവചനത്തോടെയാണ്. എന്തെങ്കിലും ചെയ്യപ്പെടുംമുമ്പ് ദൈവം സംസാരിക്കുന്നു. ഈ കാലത്തെ വിശുദ്ധർ, സഖറിയായും എലിസബത്തും മറിയവും യൗസേപ്പും, മനുഷ്യഹൃദയത്തിനു പ്രത്യുത്തരിക്കാവുന്ന വിവിധ വഴികൾ കാണിക്കുന്നു: മൗനമായും പിന്നെ സ്തുതിയായും മാറുന്ന സംശയം, വിനീതവിശ്വാസം, അനുസരണമുള്ള ധൈര്യം.",
    "ഈ കാലത്തെ പഴയനിയമവായനകൾ, എല്ലാ പ്രത്യാശയ്ക്കും അതീതമായി ദൈവം നൽകിയ ജനനങ്ങളെക്കുറിച്ചു പറയുന്നു: അബ്രാഹത്തിനും സാറായ്ക്കും ഇസഹാക്ക്, മനോവായുടെ ഭാര്യയ്ക്കു സാംസൺ, ഹന്നായ്ക്കു സാമുവൽ. ഏറ്റവും വലിയ ജനനത്തിനായി അവ നമ്മെ ഒരുക്കുന്നു: ഒരു മാനുഷികവാഗ്ദാനത്തിനും ഉളവാക്കാനാവാത്തവൻ, കന്യകാമറിയത്തിൽനിന്നു ജനിക്കുന്ന ദൈവപുത്രൻ.",
    "ഡിസംബർ 1 മുതൽ നമ്മുടെ സഭ പിറവിത്തിരുനാളിനു മുമ്പുള്ള ഇരുപത്തഞ്ചു നോമ്പ് ആചരിക്കുന്നു. ഉപവാസവും പ്രാർഥനയും കുമ്പസാരവും ദാനധർമവും കർത്താവിന് ഒരു വാസസ്ഥലം ഒരുക്കുന്നു. ശ്രവണത്തിന്റെയും കാത്തിരിപ്പിന്റെയും ഒരുക്കത്തിന്റെയും കാലമാണിത്; പിറവിരാത്രിയിൽ മറിയത്തോടൊത്തു പറയാൻ: നിന്റെ വാക്കുപോലെ എന്നിൽ സംഭവിക്കട്ടെ (ലൂക്കാ 1:38)."],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","ദൈവത്തിന്റെ രക്ഷാവാഗ്ദാനങ്ങളും വിശ്വാസത്തിന്റെ മാനുഷികപ്രത്യുത്തരവും: സഖറിയായോടുള്ള വാഗ്ദാനം, മറിയത്തോടുള്ള മംഗളവാർത്ത, എലിസബത്തിനെ സന്ദർശിക്കുന്നത്, യോഹന്നാന്റെ ജനനം, യൗസേപ്പിനുള്ള വെളിപാട്."],
    ["ഞായറാഴ്ചകൾ","ഒന്നാം ഞായർ: സഖറിയായ്ക്കുള്ള സന്ദേശം (ലൂക്കാ 1:5–25). രണ്ടാം ഞായർ: മറിയത്തോടുള്ള മംഗളവാർത്ത (ലൂക്കാ 1:26–38). മൂന്നാം ഞായർ: സ്നാപകയോഹന്നാന്റെ ജനനം (ലൂക്കാ 1:57–66). നാലാം ഞായർ: യൗസേപ്പിനുള്ള വെളിപാട് (മത്താ 1:18–24)."],
    ["ഇരുപത്തഞ്ചു നോമ്പ്","ഡിസംബർ 1 മുതൽ 24 വരെ: ലളിതഭക്ഷണം, പതിവും കഴിവുമനുസരിച്ചുള്ള വർജനം, കൂടുതൽ പ്രാർഥന, നല്ല കുമ്പസാരം, ദരിദ്രരോടുള്ള ഉദാരത. നോമ്പ് ഒരുക്കമാണ്; കൃപയുടെ വിലയല്ല."],
    ["ഈ കാലത്തെ മറിയം","ഈ കാലം ആഴമായി മരിയൻ ആണ്. മറിയം ശ്രവിക്കുന്നു, വിശ്വസിക്കുന്നു, എലിസബത്തിനെ ശുശ്രൂഷിക്കുന്നു, ദൈവവചനം ഹൃദയത്തിൽ സംഗ്രഹിക്കുന്നു. ത്രികാലജപവും ജപമാലയും ഈ ആഴ്ചകളുടെ ചൈതന്യത്തിനു യോജിച്ചതാണ്."],
    ["ഭവനത്തിൽ","പുൽക്കൂട് ഘട്ടംഘട്ടമായി ഒരുക്കുക; ഓരോ ഞായറാഴ്ചയും ഒരു രൂപം ചേർക്കുക. ഞായറാഴ്ചയിലെ സുവിശേഷം ഒരുമിച്ചു വായിക്കുക. നോമ്പിലൂടെ മിച്ചംവരുന്ന പണം ഒരു പെട്ടിയിൽ സൂക്ഷിച്ച് പിറവിത്തിരുനാളിനുമുമ്പ് ദരിദ്രർക്കു നൽകുക."]]}},
 "2026-12-25":{end:"2027-01-05",
  en:{t:"The Season of the Nativity (Yalda)",
   p:["With the Holy Qurbana of the Nativity, the Syro-Malabar Church passes from the announcements to their fulfilment. The Word has become flesh and lived among us (John 1:14). The short season of the Nativity, Yalda in Syriac, lasts until the feast of the Epiphany, Denha, on 6 January.",
    "Our tradition does not look at Christmas only as the birth of a sweet child. It contemplates the mystery of the Incarnation: the eternal Son, true God, becomes true man without ceasing to be God, born of the Virgin Mary. The Church of the East defended this faith in hymns and in the Holy Qurbana, where we confess Christ as one Lord, perfect God and perfect man.",
    "The night of the Nativity is a night of light. Many of our parishes keep the ancient custom of the Thee Uzhalichil, the fire ceremony, in which a bonfire is lit before the church and the faithful walk around it, recalling the shepherds keeping watch in the fields and the light that came into the world. The star and the lamp in our homes say the same thing: Christ, the light, has come.",
    "The days after the Nativity bring both joy and sorrow: St Stephen, the Holy Family, the Holy Innocents, the end of the civil year. The Child of Bethlehem is the Lord of history. He comes to share our poverty, our exile and even our death, so that we may share his life."],
   k:[["What the season celebrates","The birth of the Son of God from the Virgin Mary in Bethlehem, the mystery of the Incarnation, and the first manifestations of Christ."],
    ["Scripture to read","Luke 2:1–20 (the birth and the shepherds); John 1:1–18 (the Word made flesh); Galatians 4:4–7 (born of a woman, that we may be children); Isaiah 9:2–7 (a child is born for us)."],
    ["In the liturgy","The night Qurbana of the Nativity, the fire ceremony in many parishes, and the feasts that follow: St Stephen, the Holy Family, the Holy Innocents. The season leads to Denha on 6 January."],
    ["How to live it","Visit the crib in silence. Go to the Holy Qurbana on the days after the feast. Share Christmas food with the poor, the sick and migrant workers. Make peace with anyone you are estranged from."],
    ["At home","Light the star and keep the crib until Denha. Pray a short prayer before the crib each evening. Bless the children and thank God for the gift of the family."]]},
  ml:{t:"പിറവിക്കാലം (യൽദാ)",
   p:["പിറവിത്തിരുനാളിലെ വിശുദ്ധ കുർബാനയോടെ സീറോ മലബാർ സഭ അറിയിപ്പുകളിൽനിന്ന് അവയുടെ പൂർത്തീകരണത്തിലേക്കു കടക്കുന്നു. വചനം മാംസമായി നമ്മുടെ ഇടയിൽ വസിച്ചു (യോഹ 1:14). സുറിയാനിയിൽ യൽദാ എന്നു വിളിക്കുന്ന ഹ്രസ്വമായ പിറവിക്കാലം ജനുവരി 6-ലെ ദനഹാത്തിരുനാൾ വരെ നീളുന്നു.",
    "പിറവിത്തിരുനാളിനെ ഒരു ഓമനക്കുഞ്ഞിന്റെ ജനനമായി മാത്രമല്ല നമ്മുടെ പാരമ്പര്യം കാണുന്നത്. മനുഷ്യാവതാരരഹസ്യമാണ് അതു ധ്യാനിക്കുന്നത്: യഥാർഥ ദൈവമായ നിത്യപുത്രൻ, ദൈവമല്ലാതാകാതെ, കന്യകാമറിയത്തിൽനിന്നു ജനിച്ച് യഥാർഥ മനുഷ്യനാകുന്നു. പൗരസ്ത്യസഭ ഈ വിശ്വാസം ഗീതങ്ങളിലും വിശുദ്ധ കുർബാനയിലും സംരക്ഷിച്ചു; അവിടെ പൂർണദൈവവും പൂർണമനുഷ്യനുമായ ഏകകർത്താവായി മിശിഹായെ നാം ഏറ്റുപറയുന്നു.",
    "പിറവിരാത്രി പ്രകാശത്തിന്റെ രാത്രിയാണ്. നമ്മുടെ പല ഇടവകകളും തീയുഴലിച്ചിൽ എന്ന പുരാതനപതിവു പാലിക്കുന്നു: ദേവാലയത്തിനു മുമ്പിൽ തീ കത്തിച്ച് വിശ്വാസികൾ അതിനു ചുറ്റും നടക്കുന്നു; വയലിൽ കാവലിരുന്ന ഇടയന്മാരെയും ലോകത്തിലേക്കു വന്ന പ്രകാശത്തെയും അനുസ്മരിച്ചുകൊണ്ട്. നമ്മുടെ ഭവനങ്ങളിലെ നക്ഷത്രവും വിളക്കും അതുതന്നെ പറയുന്നു: പ്രകാശമായ മിശിഹാ വന്നിരിക്കുന്നു.",
    "പിറവിത്തിരുനാളിനു ശേഷമുള്ള ദിവസങ്ങൾ സന്തോഷവും ദുഃഖവും കൊണ്ടുവരുന്നു: വിശുദ്ധ സ്തേഫാനോസ്, തിരുക്കുടുംബം, പൈതങ്ങളായ വിശുദ്ധർ, സിവിൽവർഷത്തിന്റെ അവസാനം. ബേത്‌ലെഹെമിലെ ശിശു ചരിത്രത്തിന്റെ നാഥനാണ്. നാം അവന്റെ ജീവനിൽ പങ്കുചേരാൻ, നമ്മുടെ ദാരിദ്ര്യവും പ്രവാസവും മരണംപോലും പങ്കിടാൻ അവൻ വരുന്നു."],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","ബേത്‌ലെഹെമിൽ കന്യകാമറിയത്തിൽനിന്നുള്ള ദൈവപുത്രന്റെ ജനനം, മനുഷ്യാവതാരരഹസ്യം, മിശിഹായുടെ ആദ്യവെളിപ്പെടുത്തലുകൾ."],
    ["വായിക്കേണ്ട വചനഭാഗങ്ങൾ","ലൂക്കാ 2:1–20 (ജനനവും ഇടയന്മാരും); യോഹ 1:1–18 (വചനം മാംസമായി); ഗലാ 4:4–7 (നാം മക്കളാകേണ്ടതിന് സ്ത്രീയിൽനിന്നു ജനിച്ചു); ഏശ 9:2–7 (നമുക്കായി ഒരു ശിശു ജനിച്ചിരിക്കുന്നു)."],
    ["ആരാധനക്രമത്തിൽ","പിറവിരാത്രിയിലെ വിശുദ്ധ കുർബാന, പല ഇടവകകളിലും തീയുഴലിച്ചിൽ, തുടർന്നുള്ള തിരുനാളുകൾ: വിശുദ്ധ സ്തേഫാനോസ്, തിരുക്കുടുംബം, പൈതങ്ങളായ വിശുദ്ധർ. ഈ കാലം ജനുവരി 6-ലെ ദനഹായിലേക്കു നയിക്കുന്നു."],
    ["എങ്ങനെ ജീവിക്കാം","നിശ്ശബ്ദമായി പുൽക്കൂട് സന്ദർശിക്കുക. തിരുനാളിനു ശേഷമുള്ള ദിവസങ്ങളിലും വിശുദ്ധ കുർബാനയിൽ പങ്കെടുക്കുക. പിറവിത്തിരുനാൾ ഭക്ഷണം ദരിദ്രരോടും രോഗികളോടും അതിഥിത്തൊഴിലാളികളോടും പങ്കുവയ്ക്കുക. അകന്നുനിൽക്കുന്നവരോടു സമാധാനപ്പെടുക."],
    ["ഭവനത്തിൽ","ദനഹാ വരെ നക്ഷത്രം തെളിക്കുകയും പുൽക്കൂട് സൂക്ഷിക്കുകയും ചെയ്യുക. എല്ലാ സന്ധ്യയും പുൽക്കൂടിനു മുമ്പിൽ ഒരു ചെറിയ പ്രാർഥന ചൊല്ലുക. മക്കളെ ആശീർവദിച്ച് കുടുംബമെന്ന ദാനത്തിനു ദൈവത്തിനു നന്ദി പറയുക."]]}}
},
lat:{
 "2026-11-29":{end:"2026-12-24",
  en:{t:"The Season of Advent: a new liturgical year",
   p:["Today the Latin Church begins a new liturgical year with the First Sunday of Advent. The word Advent comes from the Latin adventus, coming. For about four weeks the Church prepares to celebrate the coming of Christ: his first coming in humility at Bethlehem, his coming to us now in word and sacrament, and his final coming in glory at the end of time.",
    "Advent has two parts. From the First Sunday until 16 December, the readings look mainly towards the second coming: stay awake, be ready, for you do not know the day (Matthew 24:42). From 17 to 24 December, the Church turns directly to the preparation for Christmas, with the Gospels of the infancy and the great O Antiphons that call on Christ as Wisdom, Lord, Root of Jesse, Key of David, Dayspring, King of the nations and Emmanuel.",
    "The great figures of Advent are the prophet Isaiah, who announced the Messiah; John the Baptist, who prepared his way; and the Virgin Mary, who welcomed him in faith. The Church celebrates the Immaculate Conception on 8 December within Advent, because Mary was prepared by God to be the pure dwelling of his Son.",
    "Advent is not a little Lent, but it is a season of joyful and serious preparation. The priest wears violet, and rose on the Third Sunday, Gaudete, when the Church rejoices because the Lord is near (Philippians 4:4–5). The Gloria is omitted on Sundays so that it may sound again with the angels at Christmas."],
   k:[["What the season celebrates","The threefold coming of Christ: at Bethlehem in history, in grace today, and in glory at the end of time."],
    ["The Sundays (Year B)","First: keep awake, for you do not know when the master will come (Mark 13:33–37). Second: John the Baptist prepares the way (Mark 1:1–8). Third, Gaudete: John testifies to the light (John 1:6–8, 19–28). Fourth: the Annunciation to Mary (Luke 1:26–38)."],
    ["Signs and customs","Violet vestments, rose on Gaudete Sunday; the Advent wreath with four candles; the Jesse tree; the O Antiphons from 17 December; simplicity in decoration until Christmas."],
    ["How to live it","Make a good confession before Christmas. Read Isaiah during the weeks of Advent. Pray the Angelus. Give time and money to the poor. Go to weekday Mass when possible."],
    ["At home","Light the Advent wreath at the evening meal and add one candle each Sunday. Build the crib gradually, placing the Child only on Christmas night. Let children write a note of what they will give to Jesus."]]},
  ml:{t:"ആഗമനകാലം: പുതിയ ആരാധനക്രമവത്സരം",
   p:["ആഗമനകാലത്തിലെ ഒന്നാം ഞായറാഴ്ചയോടെ ലത്തീൻ സഭ ഇന്നു പുതിയ ആരാധനക്രമവത്സരം ആരംഭിക്കുന്നു. ആഗമനം എന്നതിന്റെ ലത്തീൻ പദമായ അദ്വെന്തൂസ് എന്നതിന് വരവ് എന്നാണർഥം. ഏകദേശം നാല് ആഴ്ചകൾ ക്രിസ്തുവിന്റെ ആഗമനം ആഘോഷിക്കാൻ സഭ ഒരുങ്ങുന്നു: ബേത്‌ലെഹെമിൽ വിനയത്തിലുള്ള ആദ്യവരവ്, വചനത്തിലും കൂദാശകളിലും ഇന്നു നമ്മിലേക്കുള്ള വരവ്, കാലാന്തത്തിൽ മഹത്ത്വത്തിലുള്ള അന്തിമവരവ്.",
    "ആഗമനകാലത്തിനു രണ്ടു ഭാഗങ്ങളുണ്ട്. ഒന്നാം ഞായർ മുതൽ ഡിസംബർ 16 വരെ വായനകൾ പ്രധാനമായും രണ്ടാംവരവിലേക്കു നോക്കുന്നു: ഉണർന്നിരിക്കുവിൻ, ഒരുങ്ങിയിരിക്കുവിൻ, ദിവസം നിങ്ങൾ അറിയുന്നില്ല (മത്താ 24:42). ഡിസംബർ 17 മുതൽ 24 വരെ സഭ നേരിട്ട് തിരുപ്പിറവിയുടെ ഒരുക്കത്തിലേക്കു തിരിയുന്നു: ബാല്യകാലസുവിശേഷങ്ങളും, ക്രിസ്തുവിനെ ജ്ഞാനമേ, കർത്താവേ, ജെസ്സെയുടെ വേരേ, ദാവീദിന്റെ താക്കോലേ, ഉദയസൂര്യനേ, ജനതകളുടെ രാജാവേ, ഇമ്മാനുവേലേ എന്നു വിളിക്കുന്ന മഹത്തായ ഓ പ്രതിവാക്യങ്ങളും.",
    "ആഗമനകാലത്തിലെ മഹാവ്യക്തികൾ മിശിഹായെ മുന്നറിയിച്ച ഏശയ്യാ പ്രവാചകനും, അവന്റെ വഴിയൊരുക്കിയ സ്നാപകയോഹന്നാനും, വിശ്വാസത്തോടെ അവനെ സ്വീകരിച്ച കന്യകാമറിയവുമാണ്. ദൈവപുത്രന്റെ നിർമലവാസസ്ഥലമാകാൻ ദൈവം മറിയത്തെ ഒരുക്കിയതിനാൽ ആഗമനകാലത്തിനുള്ളിൽ ഡിസംബർ 8-ന് സഭ അമലോദ്ഭവത്തിരുനാൾ ആഘോഷിക്കുന്നു.",
    "ആഗമനകാലം ഒരു ചെറിയ നോമ്പുകാലമല്ല; എങ്കിലും സന്തോഷകരവും ഗൗരവമുള്ളതുമായ ഒരുക്കത്തിന്റെ കാലമാണ്. വൈദികൻ ഊതവർണവും, കർത്താവ് അടുത്തിരിക്കുന്നതിനാൽ സഭ സന്തോഷിക്കുന്ന മൂന്നാം ഞായറാഴ്ചയായ ഗൗദേത്തേയിൽ റോസ്‌വർണവും ധരിക്കുന്നു (ഫിലി 4:4–5). തിരുപ്പിറവിയിൽ മാലാഖമാരോടൊത്ത് വീണ്ടും മുഴങ്ങാനായി ഞായറാഴ്ചകളിൽ അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്ത്വം എന്ന ഗീതം ഒഴിവാക്കുന്നു."],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","ക്രിസ്തുവിന്റെ മൂന്നുവിധ വരവ്: ചരിത്രത്തിൽ ബേത്‌ലെഹെമിൽ, ഇന്നു കൃപയിൽ, കാലാന്തത്തിൽ മഹത്ത്വത്തിൽ."],
    ["ഞായറാഴ്ചകൾ (ബി വർഷം)","ഒന്നാം ഞായർ: യജമാനൻ എപ്പോൾ വരുമെന്ന് അറിയാത്തതിനാൽ ഉണർന്നിരിക്കുവിൻ (മർക്കോ 13:33–37). രണ്ടാം ഞായർ: സ്നാപകയോഹന്നാൻ വഴിയൊരുക്കുന്നു (മർക്കോ 1:1–8). മൂന്നാം ഞായർ, ഗൗദേത്തേ: യോഹന്നാൻ പ്രകാശത്തിനു സാക്ഷ്യം നൽകുന്നു (യോഹ 1:6–8, 19–28). നാലാം ഞായർ: മറിയത്തോടുള്ള മംഗളവാർത്ത (ലൂക്കാ 1:26–38)."],
    ["അടയാളങ്ങളും പതിവുകളും","ഊതവർണ തിരുവസ്ത്രങ്ങൾ, ഗൗദേത്തേ ഞായറാഴ്ച റോസ്‌വർണം; നാലു മെഴുകുതിരികളുള്ള ആഗമനകാല റീത്ത്; ജെസ്സെ വൃക്ഷം; ഡിസംബർ 17 മുതൽ ഓ പ്രതിവാക്യങ്ങൾ; തിരുപ്പിറവി വരെ അലങ്കാരങ്ങളിൽ ലാളിത്യം."],
    ["എങ്ങനെ ജീവിക്കാം","തിരുപ്പിറവിക്കുമുമ്പ് നല്ല കുമ്പസാരം നടത്തുക. ആഗമനകാല ആഴ്ചകളിൽ ഏശയ്യാ വായിക്കുക. ത്രികാലജപം ചൊല്ലുക. ദരിദ്രർക്കു സമയവും പണവും നൽകുക. സാധിക്കുമ്പോൾ പ്രവൃത്തിദിവസങ്ങളിലും ദിവ്യബലിയിൽ പങ്കെടുക്കുക."],
    ["ഭവനത്തിൽ","സന്ധ്യാഭക്ഷണസമയത്ത് ആഗമനകാല റീത്ത് കത്തിക്കുക; ഓരോ ഞായറാഴ്ചയും ഒരു മെഴുകുതിരി കൂടി. പുൽക്കൂട് ക്രമേണ ഒരുക്കുക; ഉണ്ണിയേശുവിനെ തിരുപ്പിറവിരാത്രിയിൽ മാത്രം വയ്ക്കുക. യേശുവിനു തങ്ങൾ എന്തു നൽകുമെന്ന് കുട്ടികൾ ഒരു കുറിപ്പ് എഴുതട്ടെ."]]}},
 "2026-12-25":{end:"2027-01-10",
  en:{t:"The Season of Christmas",
   p:["With the Mass of the Nativity the Latin Church enters the Christmas season. It is not a single day but a season of joy that lasts until the feast of the Baptism of the Lord, on 10 January 2027. The first eight days form the Octave of Christmas, celebrated as one great feast and ending on 1 January with the Solemnity of Mary, the Holy Mother of God.",
    "The heart of the season is the mystery of the Incarnation. The Word became flesh and lived among us, and we have seen his glory (John 1:14). God did not save us from a distance; he became one of us, a child born of the Virgin Mary, laid in a manger. Pope St Leo the Great told his people: Christian, recognise your dignity, for you share in the divine nature (p).",
    "The Church celebrates Christmas with three Masses, at night, at dawn and during the day, each with its own readings: the angels and the shepherds; the visit of the shepherds; and the prologue of John on the eternal Word. The Gloria returns, and the priest wears white or gold.",
    "The season unfolds the manifestation of Christ: to the shepherds at Bethlehem, to the nations in the Magi at the Epiphany (kept in India on Sunday 3 January 2027), and to Israel at his Baptism in the Jordan. Along the way the Church remembers St Stephen, St John the Apostle, the Holy Innocents and the Holy Family."],
   k:[["What the season celebrates","The birth of the Son of God, true God and true man, and his manifestation to the shepherds, to the Magi and at the Jordan."],
    ["Key days","25 December: the Nativity. 27 December: the Holy Family (this year on Sunday, Luke 2:22–40). 1 January: Mary, Mother of God, and the World Day of Peace. 3 January 2027: the Epiphany in India. 10 January 2027: the Baptism of the Lord, which ends the season."],
    ["Scripture to read","Isaiah 9:2–7; Luke 2:1–20; John 1:1–18; Titus 2:11–14 (the grace of God has appeared); Matthew 2:1–12 (the Magi)."],
    ["How to live it","Keep the joy of Christmas for the whole season, not one day. Go to Mass on the feasts of the Octave. Visit someone sick or alone. Begin the new year with confession and Holy Communion."],
    ["At home","Keep the crib and the star until the Baptism of the Lord. Bless the house at the Epiphany. Pray together before the crib, and let each child place a small gift for the poor beside it."]]},
  ml:{t:"തിരുപ്പിറവിക്കാലം",
   p:["തിരുപ്പിറവിയുടെ ദിവ്യബലിയോടെ ലത്തീൻ സഭ തിരുപ്പിറവിക്കാലത്തിലേക്കു പ്രവേശിക്കുന്നു. ഇത് ഒരു ദിവസം മാത്രമല്ല; 2027 ജനുവരി 10-ലെ കർത്താവിന്റെ ജ്ഞാനസ്നാനത്തിരുനാൾ വരെ നീളുന്ന സന്തോഷത്തിന്റെ കാലമാണ്. ആദ്യത്തെ എട്ടു ദിവസങ്ങൾ ഒരു മഹാതിരുനാളായി ആഘോഷിക്കുന്ന തിരുപ്പിറവിയുടെ അഷ്ടദിനമാണ്; ജനുവരി 1-ന് പരിശുദ്ധ ദൈവമാതാവായ മറിയത്തിന്റെ മഹോത്സവത്തോടെ അത് അവസാനിക്കുന്നു.",
    "ഈ കാലത്തിന്റെ ഹൃദയം മനുഷ്യാവതാരരഹസ്യമാണ്. വചനം മാംസമായി നമ്മുടെ ഇടയിൽ വസിച്ചു; നാം അവന്റെ മഹത്ത്വം ദർശിച്ചു (യോഹ 1:14). ദൈവം ദൂരെനിന്നല്ല നമ്മെ രക്ഷിച്ചത്; കന്യകാമറിയത്തിൽനിന്നു ജനിച്ച് പുൽത്തൊട്ടിയിൽ കിടത്തപ്പെട്ട ശിശുവായി അവൻ നമ്മിൽ ഒരുവനായി. മഹാനായ വിശുദ്ധ ലെയോ മാർപാപ്പ തന്റെ ജനത്തോടു പറഞ്ഞു: ക്രിസ്ത്യാനീ, നിന്റെ മഹത്ത്വം തിരിച്ചറിയുക; നീ ദൈവികസ്വഭാവത്തിൽ പങ്കുകാരനാണ് (p).",
    "രാത്രിയിലും പ്രഭാതത്തിലും പകലിലുമായി മൂന്നു ദിവ്യബലികളോടെ സഭ തിരുപ്പിറവി ആഘോഷിക്കുന്നു; ഓരോന്നിനും സ്വന്തം വായനകൾ: മാലാഖമാരും ഇടയന്മാരും; ഇടയന്മാരുടെ സന്ദർശനം; നിത്യവചനത്തെക്കുറിച്ചുള്ള യോഹന്നാന്റെ ആമുഖം. അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്ത്വം എന്ന ഗീതം മടങ്ങിവരുന്നു; വൈദികൻ വെള്ളയോ സ്വർണവർണമോ ധരിക്കുന്നു.",
    "ക്രിസ്തുവിന്റെ വെളിപ്പെടുത്തൽ ഈ കാലം അനാവരണം ചെയ്യുന്നു: ബേത്‌ലെഹെമിൽ ഇടയന്മാർക്ക്, ദനഹാത്തിരുനാളിൽ ജ്ഞാനികളിലൂടെ ജനതകൾക്ക് (ഇന്ത്യയിൽ 2027 ജനുവരി 3 ഞായറാഴ്ച), ജോർദാനിലെ ജ്ഞാനസ്നാനത്തിൽ ഇസ്രായേലിന്. ഈ വഴിയിൽ സഭ വിശുദ്ധ സ്തേഫാനോസിനെയും വിശുദ്ധ യോഹന്നാൻ ശ്ലീഹായെയും കുഞ്ഞിപ്പൈതങ്ങളെയും തിരുക്കുടുംബത്തെയും അനുസ്മരിക്കുന്നു."],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","യഥാർഥ ദൈവവും യഥാർഥ മനുഷ്യനുമായ ദൈവപുത്രന്റെ ജനനം; ഇടയന്മാർക്കും ജ്ഞാനികൾക്കും ജോർദാനിലുമുള്ള അവന്റെ വെളിപ്പെടുത്തൽ."],
    ["പ്രധാന ദിവസങ്ങൾ","ഡിസംബർ 25: തിരുപ്പിറവി. ഡിസംബർ 27: തിരുക്കുടുംബം (ഈ വർഷം ഞായറാഴ്ച). ജനുവരി 1: ദൈവമാതാവായ മറിയം, ലോകസമാധാനദിനം. 2027 ജനുവരി 3: ഇന്ത്യയിൽ ദനഹാ. 2027 ജനുവരി 10: കാലം സമാപിക്കുന്ന കർത്താവിന്റെ ജ്ഞാനസ്നാനം."],
    ["വായിക്കേണ്ട വചനഭാഗങ്ങൾ","ഏശ 9:2–7; ലൂക്കാ 2:1–20; യോഹ 1:1–18; തീത്തോ 2:11–14 (ദൈവകൃപ പ്രത്യക്ഷമായി); മത്താ 2:1–12 (ജ്ഞാനികൾ)."],
    ["എങ്ങനെ ജീവിക്കാം","തിരുപ്പിറവിയുടെ സന്തോഷം ഒരു ദിവസം മാത്രമല്ല, കാലം മുഴുവൻ സൂക്ഷിക്കുക. അഷ്ടദിനത്തിലെ തിരുനാളുകളിൽ ദിവ്യബലിയിൽ പങ്കെടുക്കുക. രോഗിയെയോ ഏകാന്തനെയോ സന്ദർശിക്കുക. കുമ്പസാരത്തോടും ദിവ്യകാരുണ്യസ്വീകരണത്തോടുംകൂടെ പുതുവർഷം ആരംഭിക്കുക."],
    ["ഭവനത്തിൽ","കർത്താവിന്റെ ജ്ഞാനസ്നാനം വരെ പുൽക്കൂടും നക്ഷത്രവും സൂക്ഷിക്കുക. ദനഹായിൽ ഭവനം ആശീർവദിക്കുക. പുൽക്കൂടിനു മുമ്പിൽ ഒരുമിച്ചു പ്രാർഥിക്കുക; ഓരോ കുട്ടിയും ദരിദ്രർക്കായി ഒരു ചെറിയ സമ്മാനം അതിനരികെ വയ്ക്കട്ടെ."]]}}
},
smk:{
 "2026-11-01":{end:"2026-11-14",
  en:{t:"Koodosh Eetho and Hoodosh Eetho: the beginning of the liturgical year",
   p:["Today the Syro-Malankara Catholic Church begins her liturgical year with Koodosh Eetho Sunday, the Sanctification of the Church, followed next Sunday by Hoodosh Eetho, the Renewal or Dedication of the Church. In the West Syriac tradition the year opens not with Christ's birth but with the Church: the people God has gathered and made holy.",
    "Why begin with the Church? Because it is in and through the Church that we receive the whole mystery of Christ that the coming year will unfold. Before we hear again the announcements, the birth, the Passion and the Resurrection, we remember that God has made us his holy people, a royal priesthood, his own possession (1 Peter 2:9).",
    "Koodosh Eetho recalls that the Church is sanctified by Christ, who loved her and gave himself up for her (Ephesians 5:25–26). Hoodosh Eetho recalls the dedication of the house of God and the renewal of the covenant: the Church is ever renewed by the Holy Spirit, and each of us is renewed in the grace of baptism.",
    "These two Sundays invite us to begin the year with gratitude for the Church, with prayer for her renewal, and with a fresh commitment to our parish and to the unity for which the Servant of God Mar Ivanios worked, when in 1930 he brought the Malankara Catholic communion into full unity with the Bishop of Rome (H)."],
   k:[["What these Sundays celebrate","The Church sanctified by Christ (Koodosh Eetho) and the Church renewed and dedicated as the house of God (Hoodosh Eetho)."],
    ["Scripture to read","Ephesians 5:25–32; 1 Peter 2:4–10; Hebrews 9:1–14; Matthew 16:13–20 (on this rock I will build my Church); John 10:22–30 (the feast of the Dedication)."],
    ["In the liturgy","The hymns of the Holy Qurbana and the hours speak of the Church as the bride and the sanctuary of God. The year then moves to the Sundays of the Announcements, leading to Yaldo."],
    ["How to live it","Thank God for your baptism and your parish. Pray for the Holy Father, our Major Archbishop-Catholicos and bishops. Pray for Christian unity, in the spirit of Mar Ivanios."],
    ["At home","Read Matthew 16:13–20 together. Show the children the photograph or certificate of their baptism. Pray for the parish priest and the parish family."]]},
  ml:{t:"കൂദോശ് ഈത്തോയും ഹൂദോശ് ഈത്തോയും: ആരാധനക്രമവത്സരത്തിന്റെ ആരംഭം",
   p:["സഭയുടെ ശുദ്ധീകരണമായ കൂദോശ് ഈത്തോ ഞായറാഴ്ചയോടെ സീറോ മലങ്കര കത്തോലിക്കാസഭ ഇന്ന് ആരാധനക്രമവത്സരം ആരംഭിക്കുന്നു; അടുത്ത ഞായറാഴ്ച സഭയുടെ നവീകരണം അഥവാ പ്രതിഷ്ഠയായ ഹൂദോശ് ഈത്തോ. പാശ്ചാത്യ സുറിയാനി പാരമ്പര്യത്തിൽ വർഷം ആരംഭിക്കുന്നത് ക്രിസ്തുവിന്റെ ജനനത്തോടെയല്ല, സഭയോടെയാണ്: ദൈവം ഒരുമിച്ചുകൂട്ടി പരിശുദ്ധമാക്കിയ ജനം.",
    "സഭയോടെ ആരംഭിക്കുന്നത് എന്തുകൊണ്ട്? വരുന്ന വർഷം അനാവരണം ചെയ്യുന്ന ക്രിസ്തുരഹസ്യം മുഴുവൻ നാം സ്വീകരിക്കുന്നതു സഭയിലും സഭയിലൂടെയുമാണ്. മംഗളവാർത്തകളും ജനനവും പീഡാനുഭവവും ഉയിർപ്പും വീണ്ടും കേൾക്കുംമുമ്പ്, ദൈവം നമ്മെ തന്റെ വിശുദ്ധജനവും രാജകീയപുരോഹിതഗണവും സ്വന്തം ജനവുമാക്കിയെന്നു നാം ഓർക്കുന്നു (1 പത്രോ 2:9).",
    "സഭയെ സ്നേഹിച്ച് അവൾക്കുവേണ്ടി തന്നെത്തന്നെ ഏല്പിച്ചുകൊടുത്ത ക്രിസ്തുവാൽ സഭ വിശുദ്ധീകരിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന് കൂദോശ് ഈത്തോ അനുസ്മരിക്കുന്നു (എഫേ 5:25–26). ദൈവഭവനത്തിന്റെ പ്രതിഷ്ഠയും ഉടമ്പടിയുടെ നവീകരണവും ഹൂദോശ് ഈത്തോ അനുസ്മരിക്കുന്നു: പരിശുദ്ധാത്മാവിനാൽ സഭ എപ്പോഴും നവീകരിക്കപ്പെടുന്നു; നാം ഓരോരുത്തരും മാമ്മോദീസായുടെ കൃപയിൽ നവീകരിക്കപ്പെടുന്നു.",
    "സഭയോടുള്ള നന്ദിയോടും അവളുടെ നവീകരണത്തിനായുള്ള പ്രാർഥനയോടും ഇടവകയോടുള്ള പുതിയ പ്രതിബദ്ധതയോടുംകൂടെ വർഷം ആരംഭിക്കാൻ ഈ രണ്ടു ഞായറാഴ്ചകൾ ക്ഷണിക്കുന്നു; 1930-ൽ മലങ്കര കത്തോലിക്കാ കൂട്ടായ്മയെ റോമാ മെത്രാനുമായി പൂർണ ഐക്യത്തിലേക്കു നയിച്ച ദൈവദാസൻ മാർ ഈവാനിയോസ് പ്രവർത്തിച്ച ഐക്യത്തിന്റെ ചൈതന്യത്തിൽ (H)."],
   k:[["ഈ ഞായറാഴ്ചകൾ ആഘോഷിക്കുന്നത്","ക്രിസ്തുവിനാൽ വിശുദ്ധീകരിക്കപ്പെട്ട സഭ (കൂദോശ് ഈത്തോ); ദൈവഭവനമായി നവീകരിക്കപ്പെടുകയും പ്രതിഷ്ഠിക്കപ്പെടുകയും ചെയ്ത സഭ (ഹൂദോശ് ഈത്തോ)."],
    ["വായിക്കേണ്ട വചനഭാഗങ്ങൾ","എഫേ 5:25–32; 1 പത്രോ 2:4–10; ഹെബ്രാ 9:1–14; മത്താ 16:13–20 (ഈ പാറമേൽ ഞാൻ എന്റെ സഭ പണിയും); യോഹ 10:22–30 (പ്രതിഷ്ഠാത്തിരുനാൾ)."],
    ["ആരാധനക്രമത്തിൽ","വിശുദ്ധ കുർബാനയിലെയും യാമപ്രാർഥനകളിലെയും ഗീതങ്ങൾ സഭയെ ദൈവത്തിന്റെ മണവാട്ടിയും വിശുദ്ധസ്ഥലവുമായി പാടുന്നു. തുടർന്ന് വർഷം മംഗളവാർത്താ ഞായറാഴ്ചകളിലേക്കും യൽദോയിലേക്കും നീങ്ങുന്നു."],
    ["എങ്ങനെ ജീവിക്കാം","മാമ്മോദീസായ്ക്കും ഇടവകയ്ക്കുംവേണ്ടി ദൈവത്തിനു നന്ദി പറയുക. മാർപാപ്പയ്ക്കും നമ്മുടെ മേജർ ആർച്ച്ബിഷപ്പ്-കാതോലിക്കോസിനും മെത്രാന്മാർക്കുംവേണ്ടി പ്രാർഥിക്കുക. മാർ ഈവാനിയോസിന്റെ ചൈതന്യത്തിൽ ക്രൈസ്തവൈക്യത്തിനായി പ്രാർഥിക്കുക."],
    ["ഭവനത്തിൽ","മത്താ 16:13–20 ഒരുമിച്ചു വായിക്കുക. കുട്ടികളുടെ മാമ്മോദീസായുടെ ചിത്രമോ സർട്ടിഫിക്കറ്റോ അവരെ കാണിക്കുക. ഇടവകവികാരിക്കും ഇടവകകുടുംബത്തിനുംവേണ്ടി പ്രാർഥിക്കുക."]]}},

  en:{t:"The Sundays of the Announcements (Suboro): preparing for Yaldo",
   p:["From today the Syro-Malankara Church enters the Sundays of the Announcements, the season of Suboro, which prepares for Yaldo, the Nativity of our Lord. Each Sunday the Church meditates on one step of God's plan as the Gospels tell it: the message to Zechariah, the Annunciation to Mary, the Visitation of Mary to Elizabeth, the birth of John the Baptist, the revelation to Joseph, and, on the Sunday before Yaldo, the journey of Joseph and Mary to Bethlehem.",
    "The West Syriac tradition loves to contemplate how God prepares his coming with patience and tenderness. He speaks to an old priest in the Temple, to a young virgin in a small town, to a carpenter in a dream. He uses even the decree of an emperor to bring Joseph and Mary to Bethlehem, the city of David. Nothing is wasted in God's plan.",
    "At the centre stands the Mother of God. The Church greets her with Gabriel and Elizabeth and honours her faith: blessed is she who believed (Luke 1:45). With Mary, we learn to listen, to believe and to carry Christ to others.",
    "From 1 December the faithful keep the Twenty-Five Days' Fast before Yaldo, the Yaldo Nombu, with prayer, abstinence, confession and charity. The season teaches us to wait for the Lord as the prophets waited: with longing, with faith and with a heart made ready."],
   k:[["What the season celebrates","The announcements of the coming of Christ and the faith of those who received them: Zechariah and Elizabeth, Mary, Joseph and John the Baptist."],
    ["The Sundays","Message to Zechariah (Luke 1:5–25); Annunciation to Mary (Luke 1:26–38); Visitation (Luke 1:39–56); Birth of John the Baptist (Luke 1:57–66); Revelation to Joseph (Matthew 1:18–25); Sunday before Yaldo: the journey to Bethlehem (Luke 2:1–5)."],
    ["The Yaldo fast","From 1 to 24 December, according to custom: simpler food, abstinence, more prayer, the sacrament of confession, and gifts to the poor."],
    ["How to live it","Pray the Magnificat each day. Read the first chapter of Luke slowly over the weeks. Make a visit of charity, as Mary visited Elizabeth."],
    ["At home","Prepare the crib together. Talk about the family's own story and give thanks for those who handed on the faith. Pray for expectant mothers and for families waiting for a child."]]},
  ml:{t:"മംഗളവാർത്താ ഞായറാഴ്ചകൾ (സൂബോറോ): യൽദോയ്ക്കുള്ള ഒരുക്കം",
   p:["ഇന്നു മുതൽ സീറോ മലങ്കര സഭ മംഗളവാർത്താ ഞായറാഴ്ചകളിലേക്ക്, നമ്മുടെ കർത്താവിന്റെ ജനനമായ യൽദോയ്ക്ക് ഒരുക്കുന്ന സൂബോറോ കാലത്തിലേക്കു പ്രവേശിക്കുന്നു. സുവിശേഷങ്ങൾ പറയുന്നതുപോലെ ദൈവപദ്ധതിയുടെ ഓരോ ചുവടും ഓരോ ഞായറാഴ്ചയും സഭ ധ്യാനിക്കുന്നു: സഖറിയായ്ക്കുള്ള സന്ദേശം, മറിയത്തോടുള്ള മംഗളവാർത്ത, മറിയം എലിസബത്തിനെ സന്ദർശിക്കുന്നത്, സ്നാപകയോഹന്നാന്റെ ജനനം, യൗസേപ്പിനുള്ള വെളിപാട്, യൽദോയ്ക്കു മുമ്പുള്ള ഞായറാഴ്ച യൗസേപ്പും മറിയവും ബേത്‌ലെഹെമിലേക്കു നടത്തുന്ന യാത്ര.",
    "ദൈവം ക്ഷമയോടും ആർദ്രതയോടും തന്റെ വരവ് എങ്ങനെ ഒരുക്കുന്നുവെന്നു ധ്യാനിക്കാൻ പാശ്ചാത്യ സുറിയാനി പാരമ്പര്യം ഇഷ്ടപ്പെടുന്നു. ദേവാലയത്തിൽ ഒരു വൃദ്ധപുരോഹിതനോട്, ഒരു ചെറിയ പട്ടണത്തിൽ ഒരു യുവകന്യകയോട്, സ്വപ്നത്തിൽ ഒരു തച്ചനോട് അവൻ സംസാരിക്കുന്നു. യൗസേപ്പിനെയും മറിയത്തെയും ദാവീദിന്റെ പട്ടണമായ ബേത്‌ലെഹെമിലെത്തിക്കാൻ ഒരു ചക്രവർത്തിയുടെ കല്പനപോലും അവൻ ഉപയോഗിക്കുന്നു. ദൈവപദ്ധതിയിൽ ഒന്നും പാഴാകുന്നില്ല.",
    "കേന്ദ്രത്തിൽ ദൈവമാതാവു നിൽക്കുന്നു. ഗബ്രിയേലിനോടും എലിസബത്തിനോടുംകൂടെ സഭ അവളെ അഭിവാദനം ചെയ്യുകയും അവളുടെ വിശ്വാസത്തെ ബഹുമാനിക്കുകയും ചെയ്യുന്നു: വിശ്വസിച്ചവൾ ഭാഗ്യവതി (ലൂക്കാ 1:45). മറിയത്തോടൊത്ത് ശ്രവിക്കാനും വിശ്വസിക്കാനും ക്രിസ്തുവിനെ മറ്റുള്ളവരിലേക്കു വഹിക്കാനും നാം പഠിക്കുന്നു.",
    "ഡിസംബർ 1 മുതൽ വിശ്വാസികൾ യൽദോയ്ക്കു മുമ്പുള്ള ഇരുപത്തഞ്ചു നോമ്പ്, യൽദോ നോമ്പ്, പ്രാർഥനയോടും വർജനത്തോടും കുമ്പസാരത്തോടും ഉപവിയോടുംകൂടെ ആചരിക്കുന്നു. പ്രവാചകന്മാർ കാത്തിരുന്നതുപോലെ കർത്താവിനായി കാത്തിരിക്കാൻ ഈ കാലം നമ്മെ പഠിപ്പിക്കുന്നു: ആഗ്രഹത്തോടെ, വിശ്വാസത്തോടെ, ഒരുക്കിയ ഹൃദയത്തോടെ."],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","ക്രിസ്തുവിന്റെ ആഗമനത്തെക്കുറിച്ചുള്ള അറിയിപ്പുകളും അവ സ്വീകരിച്ചവരുടെ വിശ്വാസവും: സഖറിയായും എലിസബത്തും, മറിയം, യൗസേപ്പ്, സ്നാപകയോഹന്നാൻ."],
    ["ഞായറാഴ്ചകൾ","സഖറിയായ്ക്കുള്ള സന്ദേശം (ലൂക്കാ 1:5–25); മറിയത്തോടുള്ള മംഗളവാർത്ത (ലൂക്കാ 1:26–38); സന്ദർശനം (ലൂക്കാ 1:39–56); സ്നാപകയോഹന്നാന്റെ ജനനം (ലൂക്കാ 1:57–66); യൗസേപ്പിനുള്ള വെളിപാട് (മത്താ 1:18–25); യൽദോയ്ക്കു മുമ്പുള്ള ഞായർ: ബേത്‌ലെഹെമിലേക്കുള്ള യാത്ര (ലൂക്കാ 2:1–5)."],
    ["യൽദോ നോമ്പ്","ഡിസംബർ 1 മുതൽ 24 വരെ, പതിവനുസരിച്ച്: ലളിതഭക്ഷണം, വർജനം, കൂടുതൽ പ്രാർഥന, കുമ്പസാരം, ദരിദ്രർക്കു ദാനം."],
    ["എങ്ങനെ ജീവിക്കാം","ദിവസവും മറിയത്തിന്റെ സ്തോത്രഗീതം പ്രാർഥിക്കുക. ഈ ആഴ്ചകളിൽ ലൂക്കായുടെ ഒന്നാം അധ്യായം സാവധാനം വായിക്കുക. മറിയം എലിസബത്തിനെ സന്ദർശിച്ചതുപോലെ ഒരു ഉപവിസന്ദർശനം നടത്തുക."],
    ["ഭവനത്തിൽ","പുൽക്കൂട് ഒരുമിച്ച് ഒരുക്കുക. കുടുംബത്തിന്റെ സ്വന്തം കഥയെക്കുറിച്ചു സംസാരിച്ച് വിശ്വാസം കൈമാറിയവർക്കായി നന്ദി പറയുക. ഗർഭിണികളായ അമ്മമാർക്കും കുഞ്ഞിനായി കാത്തിരിക്കുന്ന കുടുംബങ്ങൾക്കുംവേണ്ടി പ്രാർഥിക്കുക."]]}},
 "2026-12-25":{end:"2027-01-05",
  en:{t:"Yaldo: the Nativity of our Lord",
   p:["Today the Syro-Malankara Church celebrates Yaldo, the Nativity of our Lord Jesus Christ in the flesh. The long Sundays of the Announcements are fulfilled: the Word of God, begotten of the Father before all ages, is born of the holy Virgin Mary, the Mother of God, in Bethlehem.",
    "The West Syriac fathers, especially St Ephrem, sang of this mystery with wonder: the One who holds the universe is held in his mother's arms; the One who feeds all creation is nursed at her breast (p). The Nativity is the beginning of our salvation, for God has united our nature to himself.",
    "Many parishes keep the ancient service of the Nativity with the procession and the blessing of fire, recalling the shepherds and the light that shone in the darkness. Holy Qurbana is celebrated with great joy, and the Yaldo fast is ended.",
    "The days that follow lead to Denho, the Epiphany, on 6 January, when the Church celebrates the Baptism of the Lord in the Jordan and the revelation of the Holy Trinity. Between these feasts the Church honours the Mother of God, St Stephen and the Holy Innocents, and gives thanks at the turn of the year."],
   k:[["What the season celebrates","The birth in the flesh of the eternal Son of God from the Virgin Mary, Mother of God, for our salvation."],
    ["Scripture to read","Luke 2:1–20; Matthew 2:1–12; John 1:1–14; Galatians 4:4–7; Micah 5:2–4."],
    ["In the liturgy","The service of the Nativity, the procession and the blessing of fire in many parishes, the joyful Holy Qurbana, and the feasts that follow, leading to Denho on 6 January."],
    ["How to live it","Keep the joy of Yaldo through the days that follow. Visit the sick and the lonely. Share food with the poor. Thank God at the end of the year and begin the new year with prayer."],
    ["At home","Keep the crib until Denho. Read St Luke's account of the Nativity together. Bless the children and pray for families separated at this time."]]},
  ml:{t:"യൽദോ: നമ്മുടെ കർത്താവിന്റെ ജനനം",
   p:["നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ ശരീരപ്രകാരമുള്ള ജനനമായ യൽദോ സീറോ മലങ്കര സഭ ഇന്ന് ആഘോഷിക്കുന്നു. മംഗളവാർത്താ ഞായറാഴ്ചകൾ പൂർത്തിയാകുന്നു: എല്ലാ യുഗങ്ങൾക്കും മുമ്പേ പിതാവിൽനിന്നു ജനിച്ച ദൈവവചനം ബേത്‌ലെഹെമിൽ ദൈവമാതാവായ വിശുദ്ധ കന്യകാമറിയത്തിൽനിന്നു ജനിക്കുന്നു.",
    "പാശ്ചാത്യ സുറിയാനി പിതാക്കന്മാർ, പ്രത്യേകിച്ച് വിശുദ്ധ അപ്രേം, വിസ്മയത്തോടെ ഈ രഹസ്യം പാടി: പ്രപഞ്ചത്തെ താങ്ങുന്നവൻ അമ്മയുടെ കരങ്ങളിൽ താങ്ങപ്പെടുന്നു; സകല സൃഷ്ടിയെയും പോഷിപ്പിക്കുന്നവൻ അമ്മയുടെ മുലപ്പാൽ കുടിക്കുന്നു (p). ദൈവം നമ്മുടെ പ്രകൃതിയെ തന്നോട് ഒന്നിപ്പിച്ചതിനാൽ തിരുജനനം നമ്മുടെ രക്ഷയുടെ ആരംഭമാണ്.",
    "ഇടയന്മാരെയും ഇരുട്ടിൽ പ്രകാശിച്ച വെളിച്ചത്തെയും അനുസ്മരിച്ച്, പ്രദക്ഷിണത്തോടും തീ ആശീർവാദത്തോടുംകൂടിയ പുരാതന ജനനശുശ്രൂഷ പല ഇടവകകളും പാലിക്കുന്നു. വലിയ സന്തോഷത്തോടെ വിശുദ്ധ കുർബാന അർപ്പിക്കപ്പെടുന്നു; യൽദോ നോമ്പ് അവസാനിക്കുന്നു.",
    "തുടർന്നുള്ള ദിവസങ്ങൾ ജനുവരി 6-ലെ ദനഹായിലേക്കു നയിക്കുന്നു; അന്ന് ജോർദാനിലെ കർത്താവിന്റെ മാമ്മോദീസായും പരിശുദ്ധ ത്രിത്വത്തിന്റെ വെളിപ്പെടുത്തലും സഭ ആഘോഷിക്കുന്നു. ഈ തിരുനാളുകൾക്കിടയിൽ സഭ ദൈവമാതാവിനെയും വിശുദ്ധ സ്തേഫാനോസിനെയും കുഞ്ഞിപ്പൈതങ്ങളെയും ബഹുമാനിക്കുകയും വർഷാവസാനത്തിൽ നന്ദി പറയുകയും ചെയ്യുന്നു."],
   k:[["ഈ കാലം ആഘോഷിക്കുന്നത്","നമ്മുടെ രക്ഷയ്ക്കായി ദൈവമാതാവായ കന്യകാമറിയത്തിൽനിന്ന് ദൈവത്തിന്റെ നിത്യപുത്രന്റെ ശരീരപ്രകാരമുള്ള ജനനം."],
    ["വായിക്കേണ്ട വചനഭാഗങ്ങൾ","ലൂക്കാ 2:1–20; മത്താ 2:1–12; യോഹ 1:1–14; ഗലാ 4:4–7; മിക്കാ 5:2–4."],
    ["ആരാധനക്രമത്തിൽ","ജനനശുശ്രൂഷ, പല ഇടവകകളിലും പ്രദക്ഷിണവും തീ ആശീർവാദവും, സന്തോഷപൂർണമായ വിശുദ്ധ കുർബാന, ജനുവരി 6-ലെ ദനഹായിലേക്കു നയിക്കുന്ന തുടർന്നുള്ള തിരുനാളുകൾ."],
    ["എങ്ങനെ ജീവിക്കാം","തുടർന്നുള്ള ദിവസങ്ങളിലും യൽദോയുടെ സന്തോഷം സൂക്ഷിക്കുക. രോഗികളെയും ഏകാന്തരെയും സന്ദർശിക്കുക. ദരിദ്രരുമായി ഭക്ഷണം പങ്കുവയ്ക്കുക. വർഷാവസാനത്തിൽ ദൈവത്തിനു നന്ദി പറഞ്ഞ് പ്രാർഥനയോടെ പുതുവർഷം ആരംഭിക്കുക."],
    ["ഭവനത്തിൽ","ദനഹാ വരെ പുൽക്കൂട് സൂക്ഷിക്കുക. വിശുദ്ധ ലൂക്കാ വിവരിക്കുന്ന തിരുജനനം ഒരുമിച്ചു വായിക്കുക. മക്കളെ ആശീർവദിക്കുകയും ഈ സമയത്ത് വേർപിരിഞ്ഞിരിക്കുന്ന കുടുംബങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുകയും ചെയ്യുക."]]}}
}

A("smc","2026-11-01","ta",{t:"திருச்சபை அர்ப்பணக் காலம் (குதாஷ் எத்தா)",
 p:["இன்று சீரோ மலபார் திருச்சபை தன் திருவழிபாட்டு ஆண்டின் இறுதிக் காலமான குதாஷ் எத்தாவுக்குள், அதாவது திருச்சபையின் அர்ப்பணக் காலத்துக்குள் நுழைகிறது. நான்கு வாரங்கள் நமது திருவழிபாடு திருச்சபையையே தியானிக்கிறது: அவள் யார், கிறிஸ்து ஏன் அவளை நிறுவினார், அவள் எங்கே பயணிக்கிறாள்.","கிழக்கு சிரியப் பாரம்பரியம் திருவழிபாட்டு ஆண்டை மீட்பின் முழு வரலாறாகக் காண்கிறது: மங்கள வார்த்தையிலும் கிறிஸ்து பிறப்பிலும் தொடங்கி, திருக்காட்சி, தவம், பாடுகள், உயிர்ப்பு, திருத்தூதர்களின் பணி, திருச்சபையின் வளர்ச்சி வழியாகச் சென்று, இங்கே நிறைவடைகிறது: தூய்மையும் மாசற்றவளுமான மணமகளாகத் திருச்சபை கிறிஸ்துவுக்கு அளிக்கப்படுவதில் (எபே 5:25–27).","எனவே இது இறுதியின் காலம்: விண்ணக எருசலேம், ஆட்டுக்குட்டியின் திருமண விருந்து (திவெ 21:2). பலவீனங்களோடு இருக்கும் மண்ணகத் திருச்சபை அந்த மாட்சியை நோக்கிப் பயணிக்கிறது. கிறிஸ்து அரசர் விழாவோடு இக்காலம் நிறைவடைகிறது. கிறிஸ்து திருச்சபையை அன்பு செய்வதுபோல நானும் அவளை அன்பு செய்கிறேனா?"],
 k:[["இக்காலம் கொண்டாடுவது","கடவுளின் ஆலயமும் கிறிஸ்துவின் உடலும் ஆட்டுக்குட்டியின் மணமகளுமான திருச்சபை; அவளது அர்ப்பணமும் இறுதி மாட்சியும்."],["வாசிக்க வேண்டிய இறைவார்த்தை","எபே 5:25–32; 1 பேது 2:4–10; எபி 9; திவெ 21."],["திருவழிபாட்டில்","இக்காலப் பாடல்கள் திருச்சபையை மணவறையாகவும் கடவுளின் தூய உறைவிடமாகவும் பாடுகின்றன. நான்காம் ஞாயிறு கிறிஸ்து அரசர் விழாவோடு ஆண்டு நிறைவடைகிறது."],["எப்படி வாழலாம்","திருச்சபைக்காகவும் திருத்தந்தைக்காகவும் நமது பேராயருக்காகவும் ஆயர்களுக்காகவும் செபியுங்கள். பங்குப் பணியொன்றில் பங்கெடுங்கள். புனித தோமா கிறிஸ்தவர்களின் விசுவாசத்துக்காக நன்றி கூறுங்கள்."],["வீட்டில்","தீர்த்தத்தால் வீட்டை ஆசீர்வதித்து பங்குக்காக ஒன்றாகச் செபியுங்கள். குழந்தைகள் திருமுழுக்குப் பெற்ற ஆலயம் பற்றி அவர்களோடு பேசுங்கள்."]]});
A("smc","2026-11-01","hi",{t:"कलीसिया-प्रतिष्ठा काल (कुदाश एद्था)",
 p:["आज सीरो-मलबार कलीसिया अपने धर्मविधिक वर्ष के अंतिम काल, कुदाश एद्था, अर्थात् कलीसिया के प्रतिष्ठा-काल में प्रवेश करती है। चार सप्ताह तक हमारी धर्मविधि स्वयं कलीसिया पर ध्यान करती है: वह कौन है, ख्रीस्त ने उसे क्यों स्थापित किया, और वह कहाँ जा रही है।","पूर्वी सीरियाई परंपरा धर्मविधिक वर्ष को मुक्ति के पूरे इतिहास के रूप में देखती है: मंगल-समाचार और ख्रीस्त-जन्म से आरम्भ होकर, प्रकटीकरण, उपवास, दुखभोग, पुनरुत्थान, प्रेरितों के मिशन और कलीसिया की वृद्धि से होकर, यहाँ पूर्ण होती है: कलीसिया पवित्र और निष्कलंक दुल्हन के रूप में मसीह को समर्पित की जाती है (एफ़ेसियों 5:25–27)।","इसलिए यह अंत का काल है: स्वर्गीय येरूसालेम, मेमने का विवाह-भोज (प्रकाशना 21:2)। अपनी कमज़ोरियों के साथ पृथ्वी की कलीसिया उस महिमा की ओर यात्रा कर रही है। काल का समापन ख्रीस्त राजा के पर्व से होता है। क्या मैं कलीसिया से वैसे ही प्रेम करता हूँ जैसे मसीह करते हैं?"],
 k:[["यह काल क्या मनाता है","ईश्वर का मंदिर, मसीह का शरीर और मेमने की दुल्हन, कलीसिया; उसका समर्पण और अंतिम महिमा।"],["पढ़ने के लिए वचन","एफ़ेसियों 5:25–32; 1 पेत्रुस 2:4–10; इब्रानियों 9; प्रकाशना 21।"],["धर्मविधि में","इस काल के भजन कलीसिया को ईश्वर का पवित्र निवास गाते हैं। चौथे रविवार ख्रीस्त राजा के पर्व से वर्ष समाप्त होता है।"],["कैसे जिएँ","कलीसिया, संत पापा, हमारे मेजर आर्चबिशप और धर्माध्यक्षों के लिए प्रार्थना करें। किसी पल्ली-कार्य में भाग लें। संत थोमस ख्रीस्तीयों के विश्वास के लिए धन्यवाद दें।"],["घर में","पवित्र जल से घर को आशीष दें और पल्ली के लिए मिलकर प्रार्थना करें। बच्चों से उस गिरजाघर की बात करें जहाँ उनका बपतिस्मा हुआ।"]]});
A("smc","2026-11-01","te",{t:"సంఘ ప్రతిష్ఠా కాలం (ఖుదాష్ ఏత్తా)",
 p:["ఈ రోజు సీరో మలబార్ శ్రీసభ తన ఆరాధనా సంవత్సరంలో చివరి కాలమైన ఖుదాష్ ఏత్తా, అంటే శ్రీసభ ప్రతిష్ఠా కాలంలోకి ప్రవేశిస్తుంది. నాలుగు వారాలు మన ఆరాధన శ్రీసభనే ధ్యానిస్తుంది: ఆమె ఎవరు, క్రీస్తు ఆమెను ఎందుకు స్థాపించారు, ఆమె ఎక్కడికి పయనిస్తోంది.","తూర్పు సిరియన్ సంప్రదాయం ఆరాధనా సంవత్సరాన్ని రక్షణ చరిత్ర మొత్తంగా చూస్తుంది: శుభవార్త, క్రీస్తు జననంతో మొదలై, దనహా, ఉపవాసం, శ్రమలు, పునరుత్థానం, అపొస్తలుల పరిచర్య, శ్రీసభ ఎదుగుదల ద్వారా సాగి ఇక్కడ పూర్తవుతుంది: పవిత్రమైన, నిష్కళంకమైన వధువుగా శ్రీసభ క్రీస్తుకు సమర్పించబడడంలో (ఎఫెసీ 5:25–27).","కాబట్టి ఇది అంతిమ కాలం: పరలోక యెరూషలేము, గొర్రెపిల్ల వివాహ విందు (ప్రకటన 21:2). బలహీనతలతో ఉన్న భూలోక శ్రీసభ ఆ మహిమ వైపు ప్రయాణిస్తోంది. క్రీస్తు రాజు పండుగతో ఈ కాలం ముగుస్తుంది. క్రీస్తు శ్రీసభను ప్రేమించినట్లు నేనూ ఆమెను ప్రేమిస్తున్నానా?"],
 k:[["ఈ కాలం జరుపుకునేది","దేవుని ఆలయం, క్రీస్తు శరీరం, గొర్రెపిల్ల వధువు అయిన శ్రీసభ; ఆమె సమర్పణ, అంతిమ మహిమ."],["చదవవలసిన వాక్యం","ఎఫెసీ 5:25–32; 1 పేతురు 2:4–10; హెబ్రీ 9; ప్రకటన 21."],["ఆరాధనలో","ఈ కాలపు గీతాలు శ్రీసభను దేవుని పవిత్ర నివాసంగా పాడుతాయి. నాలుగో ఆదివారం క్రీస్తు రాజు పండుగతో సంవత్సరం ముగుస్తుంది."],["ఎలా జీవించాలి","శ్రీసభ కోసం, పోపుగారి కోసం, మన మేజర్ ఆర్చిబిషప్ మరియు పీఠాధిపతుల కోసం ప్రార్థించండి. ఒక విచారణ కార్యక్రమంలో పాల్గొనండి."],["ఇంట్లో","పవిత్ర జలంతో ఇంటిని ఆశీర్వదించి విచారణ కోసం కలిసి ప్రార్థించండి. పిల్లలతో వారు జ్ఞానస్నానం పొందిన దేవాలయం గురించి మాట్లాడండి."]]});

A("smc","2026-11-29","ta",{t:"மங்கள வார்த்தைக் காலம் (சுவாறா): புதிய திருவழிபாட்டு ஆண்டு",
 p:["நற்செய்தி என்று பொருள்படும் சுவாறா, மங்கள வார்த்தைக் காலத்தோடு சீரோ மலபார் திருச்சபை இன்று புதிய திருவழிபாட்டு ஆண்டைத் தொடங்குகிறது. நான்கு ஞாயிறுகளில் கடவுள் தம் மகனின் வருகையை எப்படி அறிவித்தார் என்று கேட்கிறோம்: ஆலயத்தில் செக்கரியாவுக்கு, நாசரேத்தில் மரியாவுக்கு, கனவில் யோசேப்புக்கு, திருமுழுக்கு யோவானின் பிறப்பின் வழியாக மக்கள் அனைவருக்கும்.","ஆண்டு ஏன் அறிவிப்புகளோடு தொடங்குகிறது? மீட்பு கடவுளின் வார்த்தையோடு தொடங்குகிறது. செக்கரியா, எலிசபெத், மரியா, யோசேப்பு மனித இதயம் பதில் சொல்லும் வழிகளைக் காட்டுகிறார்கள்: மௌனமாகி பின் புகழாக மாறும் ஐயம், தாழ்ச்சியான விசுவாசம், கீழ்ப்படியும் துணிவு.","டிசம்பர் 1 முதல் நமது திருச்சபை கிறிஸ்து பிறப்புக்கு முன்னான இருபத்தைந்து நாள் நோன்பைக் கடைப்பிடிக்கிறது. நோன்பு, செபம், ஒப்புரவு, தானம் ஆண்டவருக்கு உறைவிடம் தயாரிக்கின்றன; மரியாவோடு சேர்ந்து சொல்ல: உமது சொற்படியே எனக்கு நிகழட்டும் (லூக் 1:38)."],
 k:[["இக்காலம் கொண்டாடுவது","கடவுளின் மீட்பு அறிவிப்புகளும் விசுவாசத்தின் மனிதப் பதிலும்: செக்கரியா, மரியா, சந்திப்பு, யோவானின் பிறப்பு, யோசேப்புக்கு வெளிப்பாடு."],["ஞாயிறுகள்","முதல்: செக்கரியாவுக்குச் செய்தி (லூக் 1:5–25). இரண்டாம்: மரியாவுக்கு மங்கள வார்த்தை (லூக் 1:26–38). மூன்றாம்: திருமுழுக்கு யோவானின் பிறப்பு (லூக் 1:57–66). நான்காம்: யோசேப்புக்கு வெளிப்பாடு (மத் 1:18–24)."],["இருபத்தைந்து நாள் நோன்பு","டிசம்பர் 1–24: எளிய உணவு, வழக்கப்படி ஒறுத்தல், அதிக செபம், நல்ல ஒப்புரவு, ஏழைகளுக்குத் தாராளம். நோன்பு ஒரு தயாரிப்பு; அருளின் விலை அல்ல."],["இக்காலத்தில் மரியா","மரியா கேட்கிறார், நம்புகிறார், எலிசபெத்துக்குப் பணிவிடை செய்கிறார், இறைவார்த்தையை இதயத்தில் இருத்துகிறார். மூவேளைச் செபமும் செபமாலையும் இக்காலத்துக்கு ஏற்றவை."],["வீட்டில்","குடிலை படிப்படியாகத் தயாரியுங்கள். ஞாயிறு நற்செய்தியை ஒன்றாக வாசியுங்கள். நோன்பால் சேமிக்கும் பணத்தை ஒரு பெட்டியில் வைத்து ஏழைகளுக்குக் கொடுங்கள்."]]});
A("smc","2026-11-29","hi",{t:"मंगल-समाचार काल (सुवारा): नया धर्मविधिक वर्ष",
 p:["सुवारा, अर्थात् शुभ समाचार, मंगल-समाचार काल के साथ सीरो-मलबार कलीसिया आज नया धर्मविधिक वर्ष आरम्भ करती है। चार रविवारों में हम सुनते हैं कि ईश्वर ने अपने पुत्र के आगमन की घोषणा कैसे की: मंदिर में ज़करियस को, नाज़रेत में मरियम को, स्वप्न में यूसुफ़ को, और योहन बपतिस्ता के जन्म द्वारा पूरी प्रजा को।","वर्ष घोषणाओं से क्यों आरम्भ होता है? क्योंकि मुक्ति ईश्वर के वचन से आरम्भ होती है। ज़करियस, एलीज़बेथ, मरियम और यूसुफ़ दिखाते हैं कि मानव हृदय कैसे उत्तर दे सकता है: संदेह जो मौन और फिर स्तुति बनता है, विनम्र विश्वास, आज्ञाकारी साहस।","1 दिसंबर से हमारी कलीसिया ख्रीस्त-जन्म से पहले पच्चीस दिन का उपवास रखती है। उपवास, प्रार्थना, पापस्वीकार और दान प्रभु के लिए निवास तैयार करते हैं, ताकि हम मरियम के साथ कह सकें: तेरा वचन मुझमें पूरा हो (लूकस 1:38)।"],
 k:[["यह काल क्या मनाता है","ईश्वर की मुक्ति-घोषणाएँ और विश्वास का मानवीय उत्तर: ज़करियस, मरियम, भेंट, योहन का जन्म, यूसुफ़ को प्रकाशन।"],["रविवार","पहला: ज़करियस को संदेश (लूकस 1:5–25)। दूसरा: मरियम को मंगल-समाचार (लूकस 1:26–38)। तीसरा: योहन बपतिस्ता का जन्म (लूकस 1:57–66)। चौथा: यूसुफ़ को प्रकाशन (मत्ती 1:18–24)।"],["पच्चीस दिन का उपवास","1 से 24 दिसंबर: सादा भोजन, परंपरा के अनुसार परहेज़, अधिक प्रार्थना, अच्छा पापस्वीकार, ग़रीबों के प्रति उदारता। उपवास तैयारी है, कृपा की क़ीमत नहीं।"],["इस काल में मरियम","मरियम सुनती हैं, विश्वास करती हैं, एलीज़बेथ की सेवा करती हैं और वचन को हृदय में रखती हैं। देवदूत-प्रार्थना और रोज़री इस काल के अनुकूल हैं।"],["घर में","चरनी धीरे-धीरे तैयार करें। रविवार का सुसमाचार साथ पढ़ें। उपवास से बचा पैसा एक डिब्बे में रखें और ग़रीबों को दें।"]]});
A("smc","2026-11-29","te",{t:"శుభవార్తా కాలం (సువారా): కొత్త ఆరాధనా సంవత్సరం",
 p:["శుభవార్త అని అర్థమిచ్చే సువారా కాలంతో సీరో మలబార్ శ్రీసభ ఈ రోజు కొత్త ఆరాధనా సంవత్సరాన్ని ప్రారంభిస్తుంది. నాలుగు ఆదివారాలు దేవుడు తన కుమారుని రాకను ఎలా ప్రకటించాడో వింటాం: దేవాలయంలో జెకర్యాకు, నజరేతులో మరియమ్మకు, కలలో యోసేపుకు, బాప్తిస్మ యోహాను జననం ద్వారా ప్రజలందరికీ.","సంవత్సరం ప్రకటనలతో ఎందుకు మొదలవుతుంది? రక్షణ దేవుని వాక్యంతో మొదలవుతుంది. జెకర్యా, ఎలిశబెతు, మరియమ్మ, యోసేపు మనిషి హృదయం జవాబిచ్చే మార్గాలను చూపుతారు: మౌనంగా మారి తరువాత స్తుతిగా మారే సందేహం, వినయ విశ్వాసం, విధేయ ధైర్యం.","డిసెంబర్ 1 నుండి మన శ్రీసభ క్రీస్తు జయంతికి ముందు ఇరవై ఐదు రోజుల ఉపవాసం పాటిస్తుంది. ఉపవాసం, ప్రార్థన, పాపసంకీర్తనం, దానం ప్రభువుకు నివాసం సిద్ధం చేస్తాయి; మరియమ్మతో కలిసి చెప్పడానికి: నీ మాట చొప్పున నాకు జరుగును గాక (లూకా 1:38)."],
 k:[["ఈ కాలం జరుపుకునేది","దేవుని రక్షణ ప్రకటనలు, విశ్వాసంతో మనిషి జవాబు: జెకర్యా, మరియమ్మ, సందర్శనం, యోహాను జననం, యోసేపుకు ప్రత్యక్షత."],["ఆదివారాలు","మొదటి: జెకర్యాకు సందేశం (లూకా 1:5–25). రెండవ: మరియమ్మకు శుభవార్త (లూకా 1:26–38). మూడవ: బాప్తిస్మ యోహాను జననం (లూకా 1:57–66). నాలుగవ: యోసేపుకు ప్రత్యక్షత (మత్తయి 1:18–24)."],["ఇరవై ఐదు రోజుల ఉపవాసం","డిసెంబర్ 1–24: సాదా ఆహారం, ఆచారం ప్రకారం వర్జనం, ఎక్కువ ప్రార్థన, మంచి పాపసంకీర్తనం, పేదలకు ఉదారత."],["ఈ కాలంలో మరియమ్మ","మరియమ్మ వింటుంది, నమ్ముతుంది, ఎలిశబెతుకు సేవ చేస్తుంది, వాక్యాన్ని హృదయంలో భద్రపరుస్తుంది. త్రికాల జపం, జపమాల ఈ కాలానికి తగినవి."],["ఇంట్లో","పశువుల పాకను క్రమంగా సిద్ధం చేయండి. ఆదివారపు సువార్తను కలిసి చదవండి. ఉపవాసంతో మిగిలిన డబ్బును పేదలకు ఇవ్వండి."]]});
