put("2027-01-10","en",{title:"First Sunday after Denho",readTitle:EN.rt,
 readings:[[EN.eg,"Mark 1:14–20","Follow me"],[EN.ot,"Genesis 30:25–43","Jacob the shepherd"],[EN.ot,"Exodus 3:1–15","The burning bush: I AM WHO I AM"],[EN.ot,"Psalm 147:1–11","He heals the brokenhearted"],[EN.ot,"Isaiah 49:7–13","The Lord has comforted his people"],[EN.ac,"Acts 2:37–47","The first community"],[EN.pa,"Ephesians 1:3–14","Chosen in Christ before the foundation of the world"],[EN.go,"Matthew 4:12–22","The call of the first disciples"]],
 alt:"Season of Denho.",
 verse:"Follow me, and I will make you fish for people.",cite:"Matthew 4:19",
 theo:["After his Baptism Jesus begins his public ministry in Galilee. Matthew sees Isaiah fulfilled: “the people who sat in darkness have seen a great light.” Jesus' first preaching is short: “Repent, for the kingdom of heaven has come near.” His first action is to call people: by the Sea of Galilee he sees Simon and Andrew, James and John at work, and says, “Follow me, and I will make you fish for people.” “Immediately they left their nets and followed him.”","The Old Testament readings show God calling people in the middle of ordinary work. Moses was keeping his father-in-law's sheep when he saw the bush that burned and was not consumed, and heard: “Remove the sandals from your feet, for the place on which you are standing is holy ground.” God reveals his name, “I AM WHO I AM”, and sends Moses to free his people. Jacob too was a shepherd, and God blessed the work of his hands.","St Paul says that this call did not begin by the lake. God “chose us in Christ before the foundation of the world to be holy and blameless before him in love” (Ephesians 1:4). And Acts shows what the call produces: a community that “devoted themselves to the apostles' teaching and fellowship, to the breaking of bread and the prayers” (Acts 2:42).","Denho is the season of the manifestation of Christ. He is manifested not only at the Jordan, but every time someone leaves their nets and follows him. Each of us is called: to holiness, to a vocation, to bring others to Christ."],
 conn:[["Called at work.","Moses with the flock, David with the sheep, the apostles with their nets: God calls people in the middle of daily work."],["Light in Galilee.","Matthew 4:16 fulfils Isaiah 9:1–2, read at Yaldo: the light born in Bethlehem now shines in Galilee."],["Fishers of people.","Jeremiah 16:16 speaks of God sending “many fishermen”; Jesus turns fishermen into his messengers."],["The first parish.","Acts 2:42–47 is the model of every parish: teaching, fellowship, Eucharist, prayer, sharing."]],
 altar:["The first Christians were faithful to “the breaking of bread”. The Holy Qurbono is where the call to follow Jesus is renewed each Sunday: we leave our nets for an hour and come to the One who calls us."],
 outline:[["Opening","Ask: what are the “nets” that keep us busy?"],["Point 1 · Light in Galilee","Jesus begins where people live and work."],["Point 2 · Holy ground","Moses at the burning bush: God calls in ordinary places. Reverence before the holy."],["Point 3 · Leave the nets","Immediate response. What do I need to leave to follow him?"],["Point 4 · A community that follows","Acts 2:42: teaching, fellowship, Qurbono, prayer. Pray for vocations."],["Take-home line","“Lord, I leave my nets; I will follow you.”"]],
 live:[["Pray for vocations","Pray each day this week for priests, religious and missionaries from your parish."],["Bring one person","Invite one person to come with you to Holy Qurbono or a prayer meeting."],["Reverence in church (Exodus 3:5)","Keep silence and reverence in the church before and after Qurbono."]],
 fathers:[["St John Chrysostom","He admires the obedience of the fishermen: they did not delay or say “let us go home first”, but left everything at once, as Elisha left his oxen to follow Elijah (Homilies on Matthew 14)."],["St Gregory of Nyssa","On the burning bush: the fire that does not consume the bush foreshadows the Virgin who bore the Light without harm, and the mystery of God's presence (Life of Moses II)."]],
 magis:[["Catechism 787–789","From the beginning Jesus associated his disciples with his own life; the Church is the communion with Jesus."],["Catechism 2084–2086, 205–209","God reveals his name to Moses: “I AM”; the name expresses God's faithfulness."],["Christus Vivit 248–258","Pope Francis on vocation: every life is a call to follow Christ and to serve."]],
 saints:[["This week (fixed dates)","14 Jan: St Devasahayam, martyr of Travancore. 15 Jan: Commemoration of Mary, Mother of God, for the seeds (as in the 2025–26 lectionary). 17 Jan: St Antony of Egypt."]],
 prayer:"Lord Jesus, light of Galilee, you called fishermen to follow you and made them fishers of people. Call us again today: give us courage to leave our nets, reverence before your holiness, and joy in your Church. Raise up many vocations from our families. Amen."},
 {quick:["Jesus begins his mission by calling people.","God calls in the middle of ordinary work.","Leave the nets: following Christ needs a real decision."],action:"Invite one person to Holy Qurbono or a prayer meeting this week.",question:"What nets do I need to leave to follow Jesus more closely?",
  special:"First Sunday after Denho.",
  illus:["An illustration","Many priests and sisters from Kerala's coastal parishes grew up in fishing families. More than one says the call came while helping father mend the nets. The Gospel of the lake keeps happening in Kerala."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 4:18–22.",explain:"Jesus walked by the lake and saw fishermen. He said: “Follow me!” They left their nets at once and went with him.",intention:"We pray for vocations to the priesthood and religious life from our family and parish.",ask:"Ask: “What is Jesus asking our family to do for him?”"},
  catechism:[["CCC 787–789","Jesus calls disciples into communion with him."],["CCC 1877–1879","Every person is called to love and serve."]],
  kidsaint:["St Peter the fisherman","Simon was a fisherman on the Sea of Galilee. When Jesus called him, he left his boat and nets and followed him. Jesus made him the leader of the apostles. Lesson: say yes quickly when Jesus calls."],
  term:["The Season of Denho","The season after the Baptism of the Lord, until the Great Fast. Its Sundays show Christ revealed in his ministry: calling disciples, teaching, and showing his glory."],
  termMore:["Holy ground","At the burning bush Moses removed his sandals (Exodus 3:5). In many Eastern churches the faithful still remove their sandals before entering the sanctuary area."]},
 {homily:["Dear brothers and sisters, last Wednesday we celebrated Denho, the Baptism of the Lord. Now Jesus begins his work. He goes to Galilee, a region of ordinary working people, and begins to preach: “Repent, for the kingdom of heaven has come near.” And the first thing he does is call people.","He walks by the lake and sees fishermen at work: Simon and Andrew casting their nets, James and John mending theirs. He says: “Follow me, and I will make you fish for people.” And immediately they left their nets and followed him. No delay, no long negotiation.","God always calls people at work. Moses was looking after sheep when he saw the burning bush and heard: “Remove your sandals, for the place where you stand is holy ground.” The ordinary place of his work became holy because God was there. Your kitchen, your office, your field can become holy ground too.","What are your nets? Your phone, your worries, your ambitions, your comforts? Jesus does not always ask us to leave our jobs, but he always asks us to put him first. And some of our young people he calls to leave everything for the priesthood or religious life. Let us pray for them, and let us answer him: “Lord, I will follow you.” Amen."],
  kids:["Children, Jesus walked by a big lake and saw fishermen catching fish. He said: “Come, follow me! I will make you fishers of people!”","The fishermen left their nets straight away and went with Jesus. They became his friends, the apostles.","Jesus calls you too: to be his friend and bring others to him. Let's say: “Jesus, I will follow you!”"]});

 readings:[[ML.eg,"മർക്കോസ് 1:14–20","എന്നെ അനുഗമിക്കുവിൻ"],[ML.ot,"ഉൽപത്തി 30:25–43","ഇടയനായ യാക്കോബ്"],[ML.ot,"പുറപ്പാട് 3:1–15","കത്തുന്ന മുൾപ്പടർപ്പ്: ഞാൻ ഞാൻ തന്നെ"],[ML.ot,"സങ്കീർത്തനം 147:1–11","ഹൃദയം തകർന്നവരെ അവിടുന്നു സൗഖ്യപ്പെടുത്തുന്നു"],[ML.ot,"ഏശയ്യാ 49:7–13","കർത്താവു തന്റെ ജനത്തെ ആശ്വസിപ്പിച്ചിരിക്കുന്നു"],[ML.ac,"അപ്പ. പ്രവ. 2:37–47","ആദിമസമൂഹം"],[ML.pa,"എഫേസോസ് 1:3–14","ലോകസ്ഥാപനത്തിനു മുമ്പേ ക്രിസ്തുവിൽ തിരഞ്ഞെടുക്കപ്പെട്ടവർ"],[ML.go,"മത്തായി 4:12–22","ആദ്യശിഷ്യന്മാരുടെ വിളി"]],

 verse:"എന്നെ അനുഗമിക്കുക; ഞാൻ നിങ്ങളെ മനുഷ്യരെപ്പിടിക്കുന്നവരാക്കും.",cite:"മത്തായി 4:19",
 theo:["മാമ്മോദീസയ്ക്കുശേഷം യേശു ഗലീലിയിൽ തന്റെ പരസ്യശുശ്രൂഷ ആരംഭിക്കുന്നു. ഏശയ്യാ നിറവേറുന്നതായി മത്തായി കാണുന്നു: “അന്ധകാരത്തിൽ സ്ഥിതിചെയ്തിരുന്ന ജനങ്ങൾ വലിയ പ്രകാശം കണ്ടു.” യേശുവിന്റെ ആദ്യപ്രസംഗം ചെറുതാണ്: “മാനസാന്തരപ്പെടുവിൻ; സ്വർഗരാജ്യം സമീപിച്ചിരിക്കുന്നു.” അവിടുത്തെ ആദ്യപ്രവൃത്തി ആളുകളെ വിളിക്കുകയാണ്: ഗലീലിക്കടൽത്തീരത്തു ജോലിയിലായിരുന്ന ശിമയോനെയും അന്ത്രയോസിനെയും യാക്കോബിനെയും യോഹന്നാനെയും കണ്ട് അവിടുന്നു പറയുന്നു: “എന്നെ അനുഗമിക്കുക; ഞാൻ നിങ്ങളെ മനുഷ്യരെപ്പിടിക്കുന്നവരാക്കും.” “തത്ക്ഷണം അവർ വലകളുപേക്ഷിച്ച് അവനെ അനുഗമിച്ചു.”","സാധാരണ ജോലിക്കിടയിൽ ആളുകളെ വിളിക്കുന്ന ദൈവത്തെ പഴയനിയമവായനകൾ കാണിക്കുന്നു. അമ്മായിയപ്പന്റെ ആടുകളെ മേയ്ക്കുമ്പോഴാണു മോശ കത്തിയിട്ടും എരിഞ്ഞുതീരാത്ത മുൾപ്പടർപ്പു കണ്ടത്; അവൻ കേട്ടു: “അടുത്തു വരരുത്. നിന്റെ ചെരുപ്പ് അഴിച്ചുമാറ്റുക. എന്തുകൊണ്ടെന്നാൽ, നീ നിൽക്കുന്ന സ്ഥലം പരിശുദ്ധമാണ്.” ദൈവം തന്റെ നാമം വെളിപ്പെടുത്തുന്നു: “ഞാൻ ഞാൻ തന്നെ”; തന്റെ ജനത്തെ മോചിപ്പിക്കാൻ മോശയെ അയയ്ക്കുന്നു. യാക്കോബും ഒരു ഇടയനായിരുന്നു; അവന്റെ കൈകളുടെ അധ്വാനത്തെ ദൈവം അനുഗ്രഹിച്ചു.","ഈ വിളി തടാകതീരത്തല്ല ആരംഭിച്ചതെന്നു വിശുദ്ധ പൗലോസ് പറയുന്നു: തന്റെ മുമ്പിൽ സ്നേഹത്തിൽ പരിശുദ്ധരും നിഷ്കളങ്കരുമായിരിക്കാൻ ലോകസ്ഥാപനത്തിനു മുമ്പേ ദൈവം നമ്മെ ക്രിസ്തുവിൽ തിരഞ്ഞെടുത്തു (എഫേ 1:4). വിളി എന്തു ഫലം പുറപ്പെടുവിക്കുന്നുവെന്ന് അപ്പസ്തോലപ്രവർത്തനങ്ങൾ കാണിക്കുന്നു: “അവർ അപ്പസ്തോലന്മാരുടെ പ്രബോധനം, കൂട്ടായ്മ, അപ്പംമുറിക്കൽ, പ്രാർഥന എന്നിവയിൽ സദാ താത്പര്യപൂർവം പങ്കുചേർന്നു” (അപ്പ 2:42).","ക്രിസ്തുവിന്റെ വെളിപ്പെടുത്തലിന്റെ കാലമാണു ദനഹാ. ജോർദാനിൽ മാത്രമല്ല, ആരെങ്കിലും തങ്ങളുടെ വലകൾ ഉപേക്ഷിച്ച് അവിടുത്തെ അനുഗമിക്കുമ്പോഴെല്ലാം അവിടുന്നു വെളിപ്പെടുന്നു. നമ്മളോരോരുത്തരും വിളിക്കപ്പെട്ടിരിക്കുന്നു: വിശുദ്ധിയിലേക്ക്, ഒരു ദൈവവിളിയിലേക്ക്, മറ്റുള്ളവരെ ക്രിസ്തുവിലേക്കു കൊണ്ടുവരാൻ."],
 conn:[["ജോലിക്കിടയിലുള്ള വിളി.","ആട്ടിൻകൂട്ടത്തോടൊപ്പം മോശ, ആടുകളോടൊപ്പം ദാവീദ്, വലകളോടൊപ്പം ശ്ലീഹന്മാർ: അനുദിനജോലിക്കിടയിലാണു ദൈവം ആളുകളെ വിളിക്കുന്നത്."],["ഗലീലിയിലെ വെളിച്ചം.","യൽദോയിൽ വായിച്ച ഏശയ്യാ 9:1–2 മത്തായി 4:16 നിറവേറ്റുന്നു: ബേത്‌ലെഹെമിൽ ജനിച്ച വെളിച്ചം ഇപ്പോൾ ഗലീലിയിൽ പ്രകാശിക്കുന്നു."],["മനുഷ്യരെ പിടിക്കുന്നവർ.","ദൈവം “അനേകം മീൻപിടിത്തക്കാരെ” അയയ്ക്കുന്നതിനെപ്പറ്റി ജറെമിയാ 16:16 പറയുന്നു; യേശു മീൻപിടിത്തക്കാരെ തന്റെ സന്ദേശവാഹകരാക്കുന്നു."],["ആദ്യത്തെ ഇടവക.","അപ്പസ്തോലപ്രവർത്തനങ്ങൾ 2:42–47 ഓരോ ഇടവകയ്ക്കുമുള്ള മാതൃകയാണ്: പ്രബോധനം, കൂട്ടായ്മ, കുർബാന, പ്രാർഥന, പങ്കുവയ്ക്കൽ."]],
 altar:["ആദിമക്രൈസ്തവർ “അപ്പംമുറിക്കലിൽ” വിശ്വസ്തരായിരുന്നു. യേശുവിനെ അനുഗമിക്കാനുള്ള വിളി ഓരോ ഞായറാഴ്ചയും നവീകരിക്കപ്പെടുന്നതു വിശുദ്ധ കുർബാനയിലാണ്: ഒരു മണിക്കൂർ നാം വലകൾ ഉപേക്ഷിച്ചു നമ്മെ വിളിക്കുന്നവന്റെ അടുത്തേക്കു വരുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: നമ്മെ തിരക്കിലാക്കുന്ന “വലകൾ” ഏവ?"],["ഒന്നാം ആശയം · ഗലീലിയിലെ വെളിച്ചം","ആളുകൾ ജീവിക്കുകയും ജോലി ചെയ്യുകയും ചെയ്യുന്നിടത്താണ് യേശു ആരംഭിക്കുന്നത്."],["രണ്ടാം ആശയം · പരിശുദ്ധമായ സ്ഥലം","കത്തുന്ന മുൾപ്പടർപ്പിനരികെ മോശ: സാധാരണ ഇടങ്ങളിൽ ദൈവം വിളിക്കുന്നു. പരിശുദ്ധമായതിനോടുള്ള ഭക്ത്യാദരം."],["മൂന്നാം ആശയം · വലകൾ ഉപേക്ഷിക്കുക","ഉടനടിയുള്ള പ്രത്യുത്തരം. അവിടുത്തെ അനുഗമിക്കാൻ ഞാൻ എന്താണ് ഉപേക്ഷിക്കേണ്ടത്?"],["നാലാം ആശയം · അനുഗമിക്കുന്ന ഒരു സമൂഹം","അപ്പ 2:42: പ്രബോധനം, കൂട്ടായ്മ, കുർബാന, പ്രാർഥന. ദൈവവിളികൾക്കായി പ്രാർഥിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, ഞാൻ എന്റെ വലകൾ ഉപേക്ഷിക്കുന്നു; അങ്ങയെ അനുഗമിക്കും.”"]],
 live:[["ദൈവവിളികൾക്കായി പ്രാർഥിക്കുക","നിന്റെ ഇടവകയിൽനിന്നുള്ള വൈദികർക്കും സന്യസ്തർക്കും മിഷനറിമാർക്കുംവേണ്ടി ഈ ആഴ്ച എല്ലാ ദിവസവും പ്രാർഥിക്കുക."],["ഒരാളെ കൊണ്ടുവരുക","വിശുദ്ധ കുർബാനയ്ക്കോ പ്രാർഥനാകൂട്ടായ്മയ്ക്കോ നിന്നോടൊപ്പം വരാൻ ഒരാളെ ക്ഷണിക്കുക."],["ദേവാലയത്തിൽ ഭക്ത്യാദരം (പുറ 3:5)","കുർബാനയ്ക്കു മുമ്പും ശേഷവും പള്ളിയിൽ നിശ്ശബ്ദതയും ഭക്ത്യാദരവും പാലിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","മീൻപിടിത്തക്കാരുടെ അനുസരണത്തെ അദ്ദേഹം പ്രശംസിക്കുന്നു: അവർ താമസിക്കുകയോ “ആദ്യം വീട്ടിൽ പോകട്ടെ” എന്നു പറയുകയോ ചെയ്തില്ല; ഏലിയായെ അനുഗമിക്കാൻ എലീഷാ കാളകളെ ഉപേക്ഷിച്ചതുപോലെ ഉടനെ എല്ലാം ഉപേക്ഷിച്ചു (മത്തായിയെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 14)."],["നിസ്സായിലെ വിശുദ്ധ ഗ്രിഗറി","കത്തുന്ന മുൾപ്പടർപ്പിനെപ്പറ്റി: മുൾപ്പടർപ്പിനെ ദഹിപ്പിക്കാത്ത അഗ്നി, ഹാനി കൂടാതെ പ്രകാശത്തെ പ്രസവിച്ച കന്യകയെയും ദൈവസാന്നിധ്യത്തിന്റെ രഹസ്യത്തെയും മുൻകൂട്ടി കാണിക്കുന്നു (മോശയുടെ ജീവിതം II)."]],
 magis:[["മതബോധനഗ്രന്ഥം 787–789","ആരംഭംമുതൽ യേശു തന്റെ ശിഷ്യന്മാരെ തന്റെ ജീവിതത്തോടു ചേർത്തു; യേശുവുമായുള്ള കൂട്ടായ്മയാണു സഭ."],["മതബോധനഗ്രന്ഥം 205–209","ദൈവം മോശയ്ക്കു തന്റെ നാമം വെളിപ്പെടുത്തുന്നു: “ഞാനാകുന്നവൻ”; ആ നാമം ദൈവത്തിന്റെ വിശ്വസ്തത പ്രകടിപ്പിക്കുന്നു."],["ക്രിസ്തു ജീവിക്കുന്നു (ക്രിസ്തൂസ് വീവിത്) 248–258","ദൈവവിളിയെപ്പറ്റി ഫ്രാൻസിസ് മാർപാപ്പ: ഓരോ ജീവിതവും ക്രിസ്തുവിനെ അനുഗമിക്കാനും ശുശ്രൂഷിക്കാനുമുള്ള ഒരു വിളിയാണ്."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ജനുവരി 14: തിരുവിതാംകൂറിലെ രക്തസാക്ഷിയായ വിശുദ്ധ ദേവസഹായം. ജനുവരി 15: വിത്തുകൾക്കായുള്ള ദൈവമാതാവിന്റെ ഓർമ (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ). ജനുവരി 17: ഈജിപ്തിലെ വിശുദ്ധ അന്തോണീസ്."]],
 prayer:"ഗലീലിയുടെ വെളിച്ചമായ കർത്താവായ യേശുവേ, മീൻപിടിത്തക്കാരെ അങ്ങയെ അനുഗമിക്കാൻ വിളിച്ച് അങ്ങ് അവരെ മനുഷ്യരെ പിടിക്കുന്നവരാക്കി. ഇന്നു ഞങ്ങളെ വീണ്ടും വിളിക്കണമേ: വലകൾ ഉപേക്ഷിക്കാനുള്ള ധൈര്യവും അങ്ങയുടെ പരിശുദ്ധിയോടുള്ള ഭക്ത്യാദരവും അങ്ങയുടെ സഭയിൽ സന്തോഷവും ഞങ്ങൾക്കു നൽകണമേ. ഞങ്ങളുടെ കുടുംബങ്ങളിൽനിന്ന് അനേകം ദൈവവിളികൾ ഉയർത്തണമേ. ആമേൻ."},
 {quick:["ആളുകളെ വിളിച്ചുകൊണ്ടാണ് യേശു തന്റെ ദൗത്യം ആരംഭിക്കുന്നത്.","സാധാരണ ജോലിക്കിടയിലാണു ദൈവം വിളിക്കുന്നത്.","വലകൾ ഉപേക്ഷിക്കുക: ക്രിസ്തുവിനെ അനുഗമിക്കാൻ യഥാർഥമായ ഒരു തീരുമാനം വേണം."],action:"ഈ ആഴ്ച വിശുദ്ധ കുർബാനയ്ക്കോ പ്രാർഥനാകൂട്ടായ്മയ്ക്കോ ഒരാളെ ക്ഷണിക്കുക.",question:"യേശുവിനെ കൂടുതൽ അടുത്ത് അനുഗമിക്കാൻ ഞാൻ ഉപേക്ഷിക്കേണ്ട വലകൾ ഏവ?",
  special:"ദനഹായ്ക്കുശേഷമുള്ള ഒന്നാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ തീരദേശ ഇടവകകളിൽനിന്നുള്ള പല വൈദികരും സന്യസ്തരും മീൻപിടിത്തക്കാരുടെ കുടുംബങ്ങളിൽ വളർന്നവരാണ്. അപ്പനോടൊപ്പം വല നന്നാക്കുമ്പോഴാണു വിളി വന്നതെന്ന് ഒന്നിലധികം പേർ പറയുന്നു. തടാകതീരത്തെ സുവിശേഷം കേരളത്തിൽ ഇന്നും സംഭവിച്ചുകൊണ്ടിരിക്കുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 4:18–22.",explain:"യേശു തടാകതീരത്തുകൂടെ നടന്നപ്പോൾ മീൻപിടിത്തക്കാരെ കണ്ടു. അവിടുന്നു പറഞ്ഞു: “എന്നെ അനുഗമിക്കുക!” അവർ ഉടനെ വലകൾ ഉപേക്ഷിച്ച് അവിടുത്തോടൊപ്പം പോയി.",intention:"നമ്മുടെ കുടുംബത്തിൽനിന്നും ഇടവകയിൽനിന്നുമുള്ള പൗരോഹിത്യ-സന്യാസ ദൈവവിളികൾക്കായി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “യേശുവിനുവേണ്ടി എന്തു ചെയ്യാനാണ് അവിടുന്നു നമ്മുടെ കുടുംബത്തോട് ആവശ്യപ്പെടുന്നത്?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 787–789","തന്നോടുള്ള കൂട്ടായ്മയിലേക്ക് യേശു ശിഷ്യന്മാരെ വിളിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1877–1879","സ്നേഹിക്കാനും ശുശ്രൂഷിക്കാനും ഓരോ വ്യക്തിയും വിളിക്കപ്പെട്ടിരിക്കുന്നു."]],
  kidsaint:["മീൻപിടിത്തക്കാരനായ വിശുദ്ധ പത്രോസ്","ഗലീലിക്കടലിലെ ഒരു മീൻപിടിത്തക്കാരനായിരുന്നു ശിമയോൻ. യേശു വിളിച്ചപ്പോൾ അവൻ വള്ളവും വലകളും ഉപേക്ഷിച്ച് അവിടുത്തെ അനുഗമിച്ചു. യേശു അവനെ ശ്ലീഹന്മാരുടെ തലവനാക്കി. പാഠം: യേശു വിളിക്കുമ്പോൾ വേഗം “അതെ” പറയുക."],
  term:["ദനഹാക്കാലം","കർത്താവിന്റെ മാമ്മോദീസയ്ക്കുശേഷം വലിയ നോമ്പുവരെയുള്ള കാലം. ശിഷ്യന്മാരെ വിളിച്ചും പഠിപ്പിച്ചും തന്റെ മഹത്വം കാണിച്ചും, ശുശ്രൂഷയിൽ വെളിപ്പെടുന്ന ക്രിസ്തുവിനെ അതിന്റെ ഞായറാഴ്ചകൾ കാണിക്കുന്നു."],
  termMore:["പരിശുദ്ധമായ സ്ഥലം","കത്തുന്ന മുൾപ്പടർപ്പിനരികെ മോശ ചെരുപ്പ് അഴിച്ചുമാറ്റി (പുറ 3:5). പല പൗരസ്ത്യദേവാലയങ്ങളിലും വിശ്വാസികൾ ഇന്നും ശ്രീകോവിൽഭാഗത്തു പ്രവേശിക്കുംമുമ്പു ചെരുപ്പ് അഴിച്ചുമാറ്റുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, കഴിഞ്ഞ ബുധനാഴ്ച നാം കർത്താവിന്റെ മാമ്മോദീസയായ ദനഹാ ആഘോഷിച്ചു. ഇപ്പോൾ യേശു തന്റെ ജോലി ആരംഭിക്കുന്നു. സാധാരണ തൊഴിലാളികളുടെ പ്രദേശമായ ഗലീലിയിലേക്ക് അവിടുന്നു പോകുന്നു; പ്രസംഗിക്കാൻ തുടങ്ങുന്നു: “മാനസാന്തരപ്പെടുവിൻ; സ്വർഗരാജ്യം സമീപിച്ചിരിക്കുന്നു.” അവിടുന്ന് ആദ്യം ചെയ്യുന്നത് ആളുകളെ വിളിക്കുകയാണ്.","തടാകതീരത്തുകൂടെ നടക്കുമ്പോൾ ജോലിയിലായിരുന്ന മീൻപിടിത്തക്കാരെ അവിടുന്നു കാണുന്നു: വല വീശുന്ന ശിമയോനും അന്ത്രയോസും, വല നന്നാക്കുന്ന യാക്കോബും യോഹന്നാനും. അവിടുന്നു പറയുന്നു: “എന്നെ അനുഗമിക്കുക; ഞാൻ നിങ്ങളെ മനുഷ്യരെപ്പിടിക്കുന്നവരാക്കും.” തത്ക്ഷണം അവർ വലകളുപേക്ഷിച്ച് അവിടുത്തെ അനുഗമിച്ചു. താമസമില്ല, നീണ്ട ചർച്ചയില്ല.","ദൈവം എപ്പോഴും ജോലിക്കിടയിലാണ് ആളുകളെ വിളിക്കുന്നത്. ആടുകളെ മേയ്ക്കുമ്പോഴാണു മോശ കത്തുന്ന മുൾപ്പടർപ്പു കണ്ടതും “നിന്റെ ചെരുപ്പ് അഴിച്ചുമാറ്റുക; നീ നിൽക്കുന്ന സ്ഥലം പരിശുദ്ധമാണ്” എന്നു കേട്ടതും. ദൈവം അവിടെയുണ്ടായിരുന്നതുകൊണ്ട് അവന്റെ ജോലിയുടെ സാധാരണ ഇടം പരിശുദ്ധമായി. നിന്റെ അടുക്കളയും ഓഫീസും വയലും പരിശുദ്ധമായ സ്ഥലമാകാം.","നിന്റെ വലകൾ ഏവയാണ്? നിന്റെ ഫോൺ, ഉത്കണ്ഠകൾ, അഭിലാഷങ്ങൾ, സുഖങ്ങൾ? ജോലി ഉപേക്ഷിക്കാൻ യേശു എപ്പോഴും ആവശ്യപ്പെടുന്നില്ല; എന്നാൽ തന്നെ ഒന്നാമതു വയ്ക്കാൻ എപ്പോഴും ആവശ്യപ്പെടുന്നു. നമ്മുടെ ചില യുവജനങ്ങളെ പൗരോഹിത്യത്തിനോ സന്യാസജീവിതത്തിനോ വേണ്ടി എല്ലാം ഉപേക്ഷിക്കാൻ അവിടുന്നു വിളിക്കുന്നു. അവർക്കുവേണ്ടി നമുക്കു പ്രാർഥിക്കാം; നമുക്ക് അവിടുത്തോട് ഉത്തരം പറയാം: “കർത്താവേ, ഞാൻ അങ്ങയെ അനുഗമിക്കും.” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശു ഒരു വലിയ തടാകത്തിന്റെ കരയിലൂടെ നടന്നപ്പോൾ മീൻ പിടിക്കുന്ന മീൻപിടിത്തക്കാരെ കണ്ടു. അവിടുന്നു പറഞ്ഞു: “വരൂ, എന്നെ അനുഗമിക്കൂ! ഞാൻ നിങ്ങളെ മനുഷ്യരെ പിടിക്കുന്നവരാക്കും!”","മീൻപിടിത്തക്കാർ ഉടനെ വലകൾ ഉപേക്ഷിച്ച് യേശുവിനോടൊപ്പം പോയി. അവർ അവിടുത്തെ കൂട്ടുകാരായ ശ്ലീഹന്മാരായി.","യേശു നിന്നെയും വിളിക്കുന്നു: അവിടുത്തെ കൂട്ടുകാരനാകാനും മറ്റുള്ളവരെ അവിടുത്തെ അടുത്തേക്കു കൊണ്ടുവരാനും. നമുക്കു പറയാം: “യേശുവേ, ഞാൻ അങ്ങയെ അനുഗമിക്കും!”"]});

/* ================= II SUNDAY AFTER DENHO · 17 January 2027 ================= */
put("2027-01-17","en",{title:"Second Sunday after Denho",readTitle:EN.rt,
 readings:[[EN.eg,"Luke 4:14–15","Jesus returns to Galilee in the power of the Spirit"],[EN.ot,"Leviticus 22:26–33","I am the Lord who sanctifies you"],[EN.ot,"Proverbs 8:22–36","Wisdom at the beginning of creation"],[EN.ot,"Micah 5:1–8","He shall feed his flock in the strength of the Lord"],[EN.ot,"Isaiah 51:1–8","Look to the rock from which you were hewn"],[EN.ce,"1 Peter 1:13–25","Be holy, for I am holy"],[EN.pa,"Romans 3:1–8","The faithfulness of God"],[EN.go,"John 1:43–51","Come and see"]],
 alt:"Season of Denho. The Nineveh fast (three days) is from Monday 18 to Wednesday 20 January 2027.",
 verse:"Very truly, I tell you, you will see heaven opened and the angels of God ascending and descending upon the Son of Man.",cite:"John 1:51",
 theo:["Philip finds Nathanael and tells him: “We have found him about whom Moses in the law and also the prophets wrote, Jesus son of Joseph from Nazareth.” Nathanael is sceptical: “Can anything good come out of Nazareth?” Philip does not argue. He says: “Come and see.” That is still the best way to bring someone to Christ: not debate, but an invitation to meet him.","Jesus knows Nathanael before they meet: “I saw you under the fig tree.” Nathanael's doubt turns into faith: “Rabbi, you are the Son of God! You are the King of Israel!” And Jesus promises more: “You will see heaven opened and the angels of God ascending and descending upon the Son of Man.” Jacob dreamed of a ladder between heaven and earth (Genesis 28:12); Jesus says he himself is that ladder, the meeting place of God and humanity.","Proverbs presents Wisdom, present with God “at the beginning of his work”, delighting in creation; “whoever finds me finds life”. The Fathers saw here the eternal Son, the Wisdom of God. Micah promises the ruler from Bethlehem who “shall feed his flock in the strength of the LORD”. Peter draws the consequence: “as he who called you is holy, be holy yourselves in all your conduct.”","Tomorrow the Nineveh fast begins. Jonah preached in Nineveh and the whole city repented in sackcloth and ashes. The three days of fasting prepare us for the Great Fast. Like Nathanael, we are invited to come and see; like the Ninevites, to turn back to God with our whole heart."],
 conn:[["Jacob's ladder.","John 1:51 recalls Genesis 28:12: Christ is the true Bethel, the house of God and gate of heaven."],["Wisdom made flesh.","Proverbs 8:22–31 speaks of Wisdom present at creation; John 1:1–3 and Colossians 1:15–17 see in Christ the Word through whom all things were made."],["The rock.","“Look to the rock from which you were hewn” (Isaiah 51:1): our faith has roots in Abraham and Sarah, and in the apostles."],["Holy as God is holy.","Leviticus 22:32 (“I am the LORD; I sanctify you”) is the root of 1 Peter 1:16: “You shall be holy, for I am holy.”"]],
 altar:["“You will see heaven opened.” At every Holy Qurbono heaven opens over the altar: the angels join our worship and the Son of Man comes down to us in his Body and Blood."],
 outline:[["Opening","Ask: who first invited you to know Jesus?"],["Point 1 · “Come and see”","The way of evangelisation: invitation and encounter, not argument."],["Point 2 · Known by Christ","“I saw you under the fig tree.” God knows us before we know him."],["Point 3 · Heaven opened","Christ is Jacob's ladder; the Qurbono is heaven on earth."],["Point 4 · The Nineveh fast","Three days of fasting, prayer and repentance, as preparation for the Great Fast."],["Take-home line","“Come and see.”"]],
 live:[["Say “Come and see”","Invite one friend, colleague or relative to Qurbono, a retreat or a prayer meeting."],["Keep the Nineveh fast","Monday to Wednesday: fasting, the special prayers, and confession of sins."],["Be holy in one thing (1 Peter 1:15)","Choose one area of conduct (speech, honesty, purity) to make holy this week."]],
 fathers:[["St Augustine","Nathanael under the fig tree: Christ saw him before Philip called him, as he sees each of us under the shade of sin before grace calls us (Tractates on John 7)."],["St Athanasius of Alexandria","Proverbs 8 speaks of the Son, the Wisdom of the Father, through whom all things were made, and who became man for our sake (Against the Arians II)."]],
 magis:[["Evangelii Gaudium 127–129","Evangelisation person to person: a friendly conversation that invites the other to encounter Christ."],["Catechism 1438","Seasons of penance in the liturgical year are intense moments of the Church's penitential practice."],["Catechism 2013–2014","All the faithful are called to the fullness of Christian life and to holiness."]],
 saints:[["This week (fixed dates)","17 Jan: St Antony of Egypt. 18–20 Jan: the Nineveh fast. 18–25 Jan: the Week of Prayer for Christian Unity. 20 Jan: St Sebastian. 21 Jan: St Agnes."]],
 prayer:"Lord Jesus, you saw Nathanael under the fig tree and opened heaven before him. Help us to say “Come and see” to those who do not know you, and in these days of the Nineveh fast turn our hearts back to you, that we may be holy as you are holy. Amen."},
 {quick:["“Come and see”: the best way to bring someone to Christ.","Christ is the ladder between heaven and earth.","The Nineveh fast begins tomorrow: return to God."],action:"Invite one person to “come and see” this week.",question:"Whom can I invite to come and see Jesus?",
  special:"Second Sunday after Denho. Remind the faithful: the Nineveh fast (three days) is from Monday 18 to Wednesday 20 January, with the special prayers and abstinence.",
  illus:["An illustration","A young engineer in the Gulf stopped going to church for years. A colleague never argued with him, but every Friday said, “Come with me to Qurbono, just once.” One day he came, and he still goes. “Come and see” is still how faith spreads."],kids:"",diaspora:"",
  family:{read:"Read together: John 1:45–51.",explain:"Philip told Nathanael about Jesus. Nathanael was not sure, so Philip said: “Come and see!” When Nathanael met Jesus, he believed.",intention:"We pray for friends and relatives who have drifted away from the Church.",ask:"Ask: “How can we keep the Nineveh fast together as a family?”"},
  catechism:[["CCC 849–851","The missionary mandate."],["CCC 1434–1439","Many forms of penance; the Nineveh fast."]],
  kidsaint:["St Antony of Egypt (17 Jan)","A young man who heard the Gospel “sell what you own and give to the poor” and did it. He went to pray in the desert, and many came to learn from him. Lesson: when you hear God's Word, do it."],
  term:["The Nineveh Fast (Moonnu Nombu)","Three days of fasting before the Great Fast, recalling the repentance of Nineveh at Jonah's preaching (Jonah 3). The Malankara lectionary asks for special prayers, prostrations and abstinence in these days."],
  termMore:["Why “Come and see”?","Jesus himself said “Come and see” to his first disciples (John 1:39); Philip repeats it to Nathanael. Faith passes from friend to friend."]},
 {homily:["Dear brothers and sisters, today's Gospel tells how one friend brought another to Jesus. Philip found Nathanael and said: “We have found the one Moses and the prophets wrote about: Jesus of Nazareth.” Nathanael laughed: “Can anything good come out of Nazareth?”","Philip did not argue. He simply said: “Come and see.” That is still the best way to bring people to Christ. Not long debates, not pressure, but an invitation: come and see. Come to Qurbono with me. Come to the prayer meeting. Meet him yourself.","When Nathanael came, Jesus said: “I saw you under the fig tree.” Jesus knew him already. Nathanael's doubt melted: “Rabbi, you are the Son of God!” And Jesus promised: “You will see heaven opened, and the angels of God ascending and descending upon the Son of Man.” He is Jacob's ladder; in him heaven and earth meet. At this altar, today, heaven opens.","Tomorrow the Nineveh fast begins. When Jonah preached, the whole city turned back to God. Let us keep these three days well: fasting, the special prayers, a good Confession. And this week, let each of us say to one person: “Come and see.” Amen."],
  kids:["Children, Philip met Jesus and was so happy! He ran to his friend Nathanael and said: “Come and see Jesus!”","Nathanael came, and Jesus said: “I saw you under the fig tree.” Jesus knew him already! Nathanael believed.","Jesus knows you too, and loves you. Who can you invite to come and meet Jesus? Let's say: “Come and see!”"]});

 readings:[[ML.eg,"ലൂക്കാ 4:14–15","ആത്മാവിന്റെ ശക്തിയോടെ യേശു ഗലീലിയിലേക്ക്"],[ML.ot,"ലേവ്യർ 22:26–33","നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന കർത്താവു ഞാനാണ്"],[ML.ot,"സുഭാഷിതങ്ങൾ 8:22–36","സൃഷ്ടിയുടെ ആരംഭത്തിലെ ജ്ഞാനം"],[ML.ot,"മിക്കാ 5:1–8","കർത്താവിന്റെ ശക്തിയോടെ അവൻ തന്റെ ആടുകളെ മേയ്ക്കും"],[ML.ot,"ഏശയ്യാ 51:1–8","നിങ്ങളെ വെട്ടിയെടുത്ത പാറയിലേക്കു നോക്കുവിൻ"],[ML.ce,"1 പത്രോസ് 1:13–25","ഞാൻ പരിശുദ്ധനാകയാൽ നിങ്ങളും പരിശുദ്ധരായിരിക്കുവിൻ"],[ML.pa,"റോമാ 3:1–8","ദൈവത്തിന്റെ വിശ്വസ്തത"],[ML.go,"യോഹന്നാൻ 1:43–51","വന്നു കാണുക"]],
 alt:"ദനഹാക്കാലം. നിനിവേക്കാരുടെ മൂന്നു നോമ്പ് 2027 ജനുവരി 18 തിങ്കൾമുതൽ 20 ബുധൻവരെ.",
 verse:"സത്യം സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു, സ്വർഗം തുറക്കപ്പെടുന്നതും ദൈവദൂതന്മാർ കയറിപ്പോകുന്നതും മനുഷ്യപുത്രന്റെ മേൽ ഇറങ്ങിവരുന്നതും നിങ്ങൾ കാണും.",cite:"യോഹന്നാൻ 1:51",
 theo:["പീലിപ്പോസ് നഥാനയേലിനെ കണ്ടെത്തി പറയുന്നു: മോശയുടെ നിയമത്തിലും പ്രവാചകന്മാരും ആരെക്കുറിച്ച് എഴുതിയിരിക്കുന്നുവോ അവനെ, ജോസഫിന്റെ മകനായ നസറത്തിൽനിന്നുള്ള യേശുവിനെ, ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു. നഥാനയേൽ സംശയിക്കുന്നു: “നസ്രത്തിൽനിന്ന് എന്തെങ്കിലും നന്മ ഉണ്ടാകുമോ?” പീലിപ്പോസ് തർക്കിക്കുന്നില്ല; അവൻ പറയുന്നു: “വന്നു കാണുക!” ഒരാളെ ക്രിസ്തുവിലേക്കു കൊണ്ടുവരാനുള്ള ഏറ്റവും നല്ല വഴി ഇന്നും അതാണ്: വാദപ്രതിവാദമല്ല, അവിടുത്തെ കണ്ടുമുട്ടാനുള്ള ഒരു ക്ഷണം.","കണ്ടുമുട്ടുംമുമ്പേ യേശു നഥാനയേലിനെ അറിയുന്നു: “നീ അത്തിമരത്തിന്റെ ചുവട്ടിലായിരുന്നപ്പോൾ ഞാൻ നിന്നെ കണ്ടു.” നഥാനയേലിന്റെ സംശയം വിശ്വാസമായി മാറുന്നു: “റബ്ബീ, അങ്ങു ദൈവപുത്രനാണ്; ഇസ്രായേലിന്റെ രാജാവാണ്.” യേശു കൂടുതൽ വാഗ്ദാനം ചെയ്യുന്നു: “സ്വർഗം തുറക്കപ്പെടുന്നതും ദൈവദൂതന്മാർ കയറിപ്പോകുന്നതും മനുഷ്യപുത്രന്റെ മേൽ ഇറങ്ങിവരുന്നതും നിങ്ങൾ കാണും.” സ്വർഗത്തിനും ഭൂമിക്കുമിടയിലുള്ള ഒരു ഗോവണി യാക്കോബ് സ്വപ്നത്തിൽ കണ്ടു (ഉൽപ 28:12); താൻതന്നെയാണ് ആ ഗോവണി, ദൈവവും മനുഷ്യവംശവും കണ്ടുമുട്ടുന്ന ഇടം, എന്ന് യേശു പറയുന്നു.","“കർത്താവ് തന്റെ സൃഷ്ടികർമത്തിന്റെ ആരംഭത്തിൽ” ദൈവത്തോടൊപ്പമുണ്ടായിരുന്ന, സൃഷ്ടിയിൽ ആനന്ദിച്ച ജ്ഞാനത്തെ സുഭാഷിതങ്ങൾ അവതരിപ്പിക്കുന്നു: “എന്നെ കണ്ടെത്തുന്നവൻ ജീവൻ കണ്ടെത്തുന്നു.” ദൈവത്തിന്റെ ജ്ഞാനമായ നിത്യപുത്രനെ പിതാക്കന്മാർ ഇവിടെ കണ്ടു. “കർത്താവിന്റെ ശക്തിയോടെ… തന്റെ ആടുകളെ മേയ്ക്കുന്ന” ബേത്‌ലെഹെമിൽനിന്നുള്ള ഭരണാധികാരിയെ മിക്കാ വാഗ്ദാനം ചെയ്യുന്നു. പത്രോസ് അതിന്റെ ഫലം പറയുന്നു: നിങ്ങളെ വിളിച്ചവൻ പരിശുദ്ധനായിരിക്കുന്നതുപോലെ നിങ്ങളും എല്ലാ പെരുമാറ്റത്തിലും പരിശുദ്ധരായിരിക്കുവിൻ (1 പത്രോ 1:15).","നാളെ നിനിവേക്കാരുടെ നോമ്പ് ആരംഭിക്കുന്നു. യോനാ നിനിവേയിൽ പ്രസംഗിച്ചു; നഗരം മുഴുവൻ ചാക്കുടുത്തു ചാരം പൂശി അനുതപിച്ചു. മൂന്നു ദിവസത്തെ ഉപവാസം വലിയ നോമ്പിനായി നമ്മെ ഒരുക്കുന്നു. നഥാനയേലിനെപ്പോലെ വന്നു കാണാനും, നിനിവേക്കാരെപ്പോലെ പൂർണഹൃദയത്തോടെ ദൈവത്തിലേക്കു തിരിയാനും നാം ക്ഷണിക്കപ്പെടുന്നു."],
 conn:[["യാക്കോബിന്റെ ഗോവണി.","യോഹന്നാൻ 1:51 ഉൽപത്തി 28:12 അനുസ്മരിപ്പിക്കുന്നു: ദൈവഭവനവും സ്വർഗകവാടവുമായ യഥാർഥ ബഥേൽ ക്രിസ്തുവാണ്."],["മാംസമായ ജ്ഞാനം.","സൃഷ്ടിയിൽ സന്നിഹിതമായിരുന്ന ജ്ഞാനത്തെപ്പറ്റി സുഭാഷിതങ്ങൾ 8:22–31 പറയുന്നു; സകലവും ആരിലൂടെ സൃഷ്ടിക്കപ്പെട്ടുവോ ആ വചനമായി യോഹന്നാൻ 1:1–3-ഉം കൊളോസോസ് 1:15–17-ഉം ക്രിസ്തുവിനെ കാണുന്നു."],["പാറ.","“നിങ്ങളെ വെട്ടിയെടുത്ത പാറയിലേക്കും… നോക്കുവിൻ” (ഏശ 51:1): നമ്മുടെ വിശ്വാസത്തിന് അബ്രാഹത്തിലും സാറായിലും ശ്ലീഹന്മാരിലും വേരുകളുണ്ട്."],["ദൈവം പരിശുദ്ധനായിരിക്കുന്നതുപോലെ പരിശുദ്ധർ.","“ഞാനാണു നിങ്ങളെ വിശുദ്ധീകരിക്കുന്ന കർത്താവ്” (ലേവ്യ 22:32) എന്നതാണ് 1 പത്രോസ് 1:16-ന്റെ വേര്: “ഞാൻ പരിശുദ്ധനാകയാൽ നിങ്ങളും പരിശുദ്ധരായിരിക്കുവിൻ.”"]],
 altar:["“സ്വർഗം തുറക്കപ്പെടുന്നതു നിങ്ങൾ കാണും.” ഓരോ വിശുദ്ധ കുർബാനയിലും ബലിപീഠത്തിനു മീതേ സ്വർഗം തുറക്കുന്നു: മാലാഖമാർ നമ്മുടെ ആരാധനയിൽ ചേരുന്നു; മനുഷ്യപുത്രൻ തന്റെ ശരീരരക്തങ്ങളിൽ നമ്മിലേക്ക് ഇറങ്ങിവരുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: യേശുവിനെ അറിയാൻ നിന്നെ ആദ്യം ക്ഷണിച്ചത് ആരാണ്?"],["ഒന്നാം ആശയം · “വന്നു കാണുക”","സുവിശേഷവത്കരണത്തിന്റെ വഴി: വാദമല്ല, ക്ഷണവും കണ്ടുമുട്ടലും."],["രണ്ടാം ആശയം · ക്രിസ്തുവിനാൽ അറിയപ്പെടുന്നവർ","“അത്തിമരത്തിന്റെ ചുവട്ടിൽ… ഞാൻ നിന്നെ കണ്ടു.” നാം അറിയുംമുമ്പേ ദൈവം നമ്മെ അറിയുന്നു."],["മൂന്നാം ആശയം · തുറക്കപ്പെട്ട സ്വർഗം","ക്രിസ്തു യാക്കോബിന്റെ ഗോവണിയാണ്; കുർബാന ഭൂമിയിലെ സ്വർഗമാണ്."],["നാലാം ആശയം · നിനിവേ നോമ്പ്","ഉപവാസത്തിന്റെയും പ്രാർഥനയുടെയും അനുതാപത്തിന്റെയും മൂന്നു ദിവസങ്ങൾ: വലിയ നോമ്പിനുള്ള ഒരുക്കം."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“വന്നു കാണുക!”"]],
 live:[["“വന്നു കാണുക” എന്നു പറയുക","ഒരു സുഹൃത്തിനെയോ സഹപ്രവർത്തകനെയോ ബന്ധുവിനെയോ കുർബാനയ്ക്കോ ധ്യാനത്തിനോ പ്രാർഥനാകൂട്ടായ്മയ്ക്കോ ക്ഷണിക്കുക."],["നിനിവേ നോമ്പ് ആചരിക്കുക","തിങ്കൾമുതൽ ബുധൻവരെ: ഉപവാസം, പ്രത്യേക പ്രാർഥനകൾ, പാപങ്ങളുടെ ഏറ്റുപറച്ചിൽ."],["ഒരു കാര്യത്തിൽ പരിശുദ്ധനാകുക (1 പത്രോ 1:15)","ഈ ആഴ്ച വിശുദ്ധമാക്കാൻ പെരുമാറ്റത്തിന്റെ ഒരു മേഖല (സംസാരം, സത്യസന്ധത, നിർമലത) തിരഞ്ഞെടുക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","അത്തിമരത്തിന്റെ ചുവട്ടിലെ നഥാനയേൽ: പീലിപ്പോസ് വിളിക്കുംമുമ്പേ ക്രിസ്തു അവനെ കണ്ടു; കൃപ നമ്മെ വിളിക്കുംമുമ്പേ പാപത്തിന്റെ നിഴലിലായിരിക്കുന്ന നമ്മളോരോരുത്തരെയും അവിടുന്നു കാണുന്നതുപോലെ (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രബന്ധങ്ങൾ 7)."],["അലക്സാണ്ട്രിയായിലെ വിശുദ്ധ അത്തനാസിയൂസ്","സകലവും ആരിലൂടെ സൃഷ്ടിക്കപ്പെട്ടുവോ, നമുക്കുവേണ്ടി മനുഷ്യനായിത്തീർന്ന, പിതാവിന്റെ ജ്ഞാനമായ പുത്രനെപ്പറ്റിയാണു സുഭാഷിതങ്ങൾ 8 പറയുന്നത് (ആര്യന്മാർക്കെതിരേ II)."]],
 magis:[["സുവിശേഷത്തിന്റെ ആനന്ദം (എവാഞ്ചേലി ഗൗദിയും) 127–129","വ്യക്തിയിൽനിന്നു വ്യക്തിയിലേക്കുള്ള സുവിശേഷവത്കരണം: ക്രിസ്തുവിനെ കണ്ടുമുട്ടാൻ മറ്റേയാളെ ക്ഷണിക്കുന്ന സൗഹൃദസംഭാഷണം."],["മതബോധനഗ്രന്ഥം 1438","ആരാധനാവത്സരത്തിലെ പ്രായശ്ചിത്തകാലങ്ങൾ സഭയുടെ അനുതാപാനുഷ്ഠാനത്തിന്റെ തീവ്രനിമിഷങ്ങളാണ്."],["മതബോധനഗ്രന്ഥം 2013–2014","ക്രൈസ്തവജീവിതത്തിന്റെ പൂർണതയിലേക്കും വിശുദ്ധിയിലേക്കും എല്ലാ വിശ്വാസികളും വിളിക്കപ്പെട്ടിരിക്കുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ജനുവരി 17: ഈജിപ്തിലെ വിശുദ്ധ അന്തോണീസ്. ജനുവരി 18–20: നിനിവേ നോമ്പ്. ജനുവരി 18–25: ക്രൈസ്തവൈക്യപ്രാർഥനാവാരം. ജനുവരി 20: വിശുദ്ധ സെബസ്ത്യാനോസ്. ജനുവരി 21: വിശുദ്ധ ആഗ്നസ്."]],
 prayer:"കർത്താവായ യേശുവേ, അത്തിമരത്തിന്റെ ചുവട്ടിൽ നഥാനയേലിനെ കണ്ട് അങ്ങ് അവനു മുമ്പിൽ സ്വർഗം തുറന്നു. അങ്ങയെ അറിയാത്തവരോടു “വന്നു കാണുക” എന്നു പറയാൻ ഞങ്ങളെ സഹായിക്കണമേ; നിനിവേ നോമ്പിന്റെ ഈ ദിവസങ്ങളിൽ ഞങ്ങളുടെ ഹൃദയങ്ങളെ അങ്ങയിലേക്കു തിരിക്കണമേ; അങ്ങു പരിശുദ്ധനായിരിക്കുന്നതുപോലെ ഞങ്ങളും പരിശുദ്ധരാകട്ടെ. ആമേൻ."},
 {quick:["“വന്നു കാണുക!”: ഒരാളെ ക്രിസ്തുവിലേക്കു കൊണ്ടുവരാനുള്ള ഏറ്റവും നല്ല വഴി.","ക്രിസ്തു സ്വർഗത്തിനും ഭൂമിക്കുമിടയിലുള്ള ഗോവണിയാണ്.","നിനിവേ നോമ്പ് നാളെ ആരംഭിക്കുന്നു: ദൈവത്തിലേക്കു മടങ്ങുക."],action:"ഈ ആഴ്ച ഒരാളെ “വന്നു കാണാൻ” ക്ഷണിക്കുക.",question:"യേശുവിനെ വന്നു കാണാൻ ഞാൻ ആരെയാണു ക്ഷണിക്കുക?",
  special:"ദനഹായ്ക്കുശേഷമുള്ള രണ്ടാം ഞായർ. വിശ്വാസികളെ ഓർമിപ്പിക്കുക: നിനിവേ നോമ്പ് (മൂന്നു നോമ്പ്) ജനുവരി 18 തിങ്കൾമുതൽ 20 ബുധൻവരെ, പ്രത്യേക പ്രാർഥനകളോടും വർജനത്തോടുംകൂടെ.",
  illus:["ഒരു ഉദാഹരണം","ഗൾഫിലെ ഒരു യുവ എഞ്ചിനീയർ വർഷങ്ങളോളം പള്ളിയിൽ പോകാതിരുന്നു. ഒരു സഹപ്രവർത്തകൻ അവനോട് ഒരിക്കലും തർക്കിച്ചില്ല; എല്ലാ വെള്ളിയാഴ്ചയും പറഞ്ഞു: “എന്റെ കൂടെ ഒരിക്കൽ കുർബാനയ്ക്കു വാ.” ഒരുനാൾ അവൻ വന്നു; ഇന്നും പോകുന്നു. “വന്നു കാണുക” എന്നതാണ് ഇന്നും വിശ്വാസം പടരുന്ന വഴി."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: യോഹന്നാൻ 1:45–51.",explain:"പീലിപ്പോസ് യേശുവിനെപ്പറ്റി നഥാനയേലിനോടു പറഞ്ഞു. നഥാനയേലിന് ഉറപ്പില്ലായിരുന്നു; അതുകൊണ്ടു പീലിപ്പോസ് പറഞ്ഞു: “വന്നു കാണുക!” യേശുവിനെ കണ്ടപ്പോൾ നഥാനയേൽ വിശ്വസിച്ചു.",intention:"സഭയിൽനിന്ന് അകന്നുപോയ സുഹൃത്തുക്കൾക്കും ബന്ധുക്കൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “കുടുംബമൊന്നിച്ചു നിനിവേ നോമ്പ് എങ്ങനെ ആചരിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 849–851","പ്രേഷിതദൗത്യം."],["മതബോധനഗ്രന്ഥം 1434–1439","പ്രായശ്ചിത്തത്തിന്റെ വിവിധ രൂപങ്ങൾ."]],
  kidsaint:["ഈജിപ്തിലെ വിശുദ്ധ അന്തോണീസ് (ജനുവരി 17)","“നിനക്കുള്ളതു വിറ്റ് ദരിദ്രർക്കു കൊടുക്കുക” എന്ന സുവിശേഷം കേട്ട് അതുപോലെ ചെയ്ത ഒരു യുവാവ്. പ്രാർഥിക്കാൻ അദ്ദേഹം മരുഭൂമിയിലേക്കു പോയി; അനേകർ അദ്ദേഹത്തിൽനിന്നു പഠിക്കാൻ വന്നു. പാഠം: ദൈവവചനം കേൾക്കുമ്പോൾ അതു ചെയ്യുക."],
  term:["നിനിവേ നോമ്പ് (മൂന്നു നോമ്പ്)","യോനായുടെ പ്രസംഗം കേട്ടുള്ള നിനിവേയുടെ അനുതാപം (യോനാ 3) അനുസ്മരിക്കുന്ന, വലിയ നോമ്പിനു മുമ്പുള്ള മൂന്നു ദിവസത്തെ ഉപവാസം. ഈ ദിവസങ്ങളിൽ പ്രത്യേക പ്രാർഥനകളും കുമ്പിടീലുകളും വർജനവും മലങ്കര വായനാപുസ്തകം ആവശ്യപ്പെടുന്നു."],
  termMore:["എന്തുകൊണ്ടു “വന്നു കാണുക”?","തന്റെ ആദ്യശിഷ്യന്മാരോട് യേശുതന്നെ “വന്നു കാണുക” എന്നു പറഞ്ഞു (യോഹ 1:39); പീലിപ്പോസ് അതു നഥാനയേലിനോട് ആവർത്തിക്കുന്നു. വിശ്വാസം സുഹൃത്തിൽനിന്നു സുഹൃത്തിലേക്കു കടന്നുപോകുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഒരു സുഹൃത്ത് മറ്റൊരാളെ യേശുവിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നതെങ്ങനെയെന്ന് ഇന്നത്തെ സുവിശേഷം പറയുന്നു. പീലിപ്പോസ് നഥാനയേലിനെ കണ്ടെത്തി പറഞ്ഞു: മോശയും പ്രവാചകന്മാരും ആരെപ്പറ്റി എഴുതിയോ അവനെ, നസറത്തിൽനിന്നുള്ള യേശുവിനെ, ഞങ്ങൾ കണ്ടെത്തി. നഥാനയേൽ ചിരിച്ചു: “നസ്രത്തിൽനിന്ന് എന്തെങ്കിലും നന്മ ഉണ്ടാകുമോ?”","പീലിപ്പോസ് തർക്കിച്ചില്ല. അവൻ ലളിതമായി പറഞ്ഞു: “വന്നു കാണുക!” ആളുകളെ ക്രിസ്തുവിലേക്കു കൊണ്ടുവരാനുള്ള ഏറ്റവും നല്ല വഴി ഇന്നും അതാണ്. നീണ്ട വാദങ്ങളല്ല, നിർബന്ധമല്ല, ഒരു ക്ഷണം: വന്നു കാണുക. എന്നോടൊപ്പം കുർബാനയ്ക്കു വരുക. പ്രാർഥനാകൂട്ടായ്മയ്ക്കു വരുക. അവിടുത്തെ സ്വയം കണ്ടുമുട്ടുക.","നഥാനയേൽ വന്നപ്പോൾ യേശു പറഞ്ഞു: “നീ അത്തിമരത്തിന്റെ ചുവട്ടിലായിരുന്നപ്പോൾ ഞാൻ നിന്നെ കണ്ടു.” യേശുവിന് അവനെ നേരത്തേ അറിയാമായിരുന്നു. നഥാനയേലിന്റെ സംശയം അലിഞ്ഞുപോയി: “റബ്ബീ, അങ്ങു ദൈവപുത്രനാണ്!” യേശു വാഗ്ദാനം ചെയ്തു: സ്വർഗം തുറക്കപ്പെടുന്നതും ദൈവദൂതന്മാർ മനുഷ്യപുത്രന്റെമേൽ കയറുകയും ഇറങ്ങുകയും ചെയ്യുന്നതും നിങ്ങൾ കാണും. അവിടുന്നാണ് യാക്കോബിന്റെ ഗോവണി; അവിടുന്നിൽ സ്വർഗവും ഭൂമിയും സന്ധിക്കുന്നു. ഇന്ന് ഈ ബലിപീഠത്തിൽ സ്വർഗം തുറക്കുന്നു.","നാളെ നിനിവേ നോമ്പ് ആരംഭിക്കുന്നു. യോനാ പ്രസംഗിച്ചപ്പോൾ നഗരം മുഴുവൻ ദൈവത്തിലേക്കു തിരിഞ്ഞു. ഈ മൂന്നു ദിവസങ്ങൾ നമുക്കു നന്നായി ആചരിക്കാം: ഉപവാസം, പ്രത്യേക പ്രാർഥനകൾ, നല്ല ഒരു കുമ്പസാരം. ഈ ആഴ്ച നമ്മളോരോരുത്തരും ഒരാളോടു പറയാം: “വന്നു കാണുക!” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശുവിനെ കണ്ടുമുട്ടിയപ്പോൾ പീലിപ്പോസിന് ഒത്തിരി സന്തോഷമായി! അവൻ തന്റെ കൂട്ടുകാരൻ നഥാനയേലിന്റെ അടുത്തേക്ക് ഓടിച്ചെന്നു പറഞ്ഞു: “വന്ന് യേശുവിനെ കാണൂ!”","നഥാനയേൽ വന്നു; യേശു പറഞ്ഞു: “അത്തിമരത്തിന്റെ ചുവട്ടിൽ ഞാൻ നിന്നെ കണ്ടു.” യേശുവിന് അവനെ നേരത്തേ അറിയാമായിരുന്നു! നഥാനയേൽ വിശ്വസിച്ചു.","യേശുവിനു നിന്നെയും അറിയാം, നിന്നെ സ്നേഹിക്കുന്നു. യേശുവിനെ വന്നു കാണാൻ നിനക്ക് ആരെ ക്ഷണിക്കാം? നമുക്കു പറയാം: “വന്നു കാണുക!”"]});

/* ================= KOHNE SUNDAY · 24 January 2027 ================= */
put("2027-01-24","en",{title:"Kohne Sunday · Commemoration of the Departed Priests",readTitle:EN.rt,
 readings:[[EN.eg,"Luke 19:11–27","The parable of the pounds"],[EN.ot,"Numbers 20:22–29","The death of Aaron"],[EN.ot,"Joshua 24:29–33","The death of Joshua"],[EN.ot,"Sirach 45:15–22","Aaron anointed for an everlasting covenant"],[EN.ot,"Isaiah 65:13–16","My servants shall rejoice"],[EN.ac,"Acts 20:25–38","Paul's farewell to the elders of Ephesus"],[EN.pa,"Hebrews 13:7–16","Remember your leaders"],[EN.go,"Matthew 24:45–51","The faithful and wise servant"]],
 alt:"Kohne Sunday: the Church remembers the priests who have died. In the 2025–26 lectionary this Sunday was also Catholicos Day.",
 verse:"Remember your leaders, those who spoke the word of God to you; consider the outcome of their way of life, and imitate their faith.",cite:"Hebrews 13:7",
 theo:["Before the Great Fast the Malankara Church keeps three Sundays of remembrance. The first is Kohne Sunday, the commemoration of the departed priests (kohne in Syriac). We remember the bishops and priests who baptised us, taught us, absolved our sins, celebrated the Holy Qurbono for us, and buried our dead. Hebrews tells us: “Remember your leaders, those who spoke the word of God to you; consider the outcome of their way of life, and imitate their faith.”","The readings recall the death of Israel's great servants. Aaron, the first high priest, dies on Mount Hor, and Moses places his vestments on his son Eleazar (Numbers 20:28): the priesthood continues though the priest dies. Joshua dies after leading the people into the land. Sirach remembers Aaron anointed “for an everlasting covenant… to minister to the Lord and serve as priest and bless his people in his name” (Sirach 45:15).","In Acts Paul says farewell to the elders of Ephesus: “Keep watch over yourselves and over all the flock, of which the Holy Spirit has made you overseers, to shepherd the church of God that he obtained with the blood of his own Son.” And he reminds them of the Lord's words: “It is more blessed to give than to receive.” The Gospel asks the question every priest will be asked: “Who then is the faithful and wise servant, whom his master has put in charge of his household, to give them their food at the proper time? Blessed is that servant whom his master will find at work when he arrives.”","We pray today for the departed priests, that the Lord who called them may forgive their weaknesses and say to them: “Well done, good servant!” (Luke 19:17). And we pray for our living priests, and for new vocations. “Jesus Christ is the same yesterday and today and forever” (Hebrews 13:8): priests pass, but the one High Priest remains."],
 conn:[["Vestments passed on.","Aaron's garments placed on Eleazar (Numbers 20:28): the priesthood does not die with the priest. In the Church the one priesthood of Christ continues through every generation."],["The faithful servant.","Luke 19 and Matthew 24: priests are stewards, not owners; they will give an account."],["Paul's farewell.","Acts 20 is the model of a pastor's last words: I did not shrink from declaring the whole purpose of God; I coveted no one's silver or gold."],["One High Priest.","Hebrews 13:8–16: Christ the same yesterday, today and for ever; our sacrifice of praise continues his."]],
 altar:["Every Holy Qurbono offered today in the world is offered by hands that will one day be still. Through them the one Priest, Christ, offers his one sacrifice. Today we offer the Qurbono for the priests who once stood at this altar for us."],
 outline:[["Opening","Name the priests who baptised you, gave you First Communion, married you, buried your parents."],["Point 1 · Remember your leaders","Gratitude for the priests who served us."],["Point 2 · The priesthood continues","Aaron's vestments on Eleazar: Christ's priesthood outlives every priest."],["Point 3 · Faithful stewards","The faithful and wise servant: a word for priests and for every Christian steward."],["Point 4 · Pray for priests","For the departed, for the living, for vocations."],["Take-home line","“Remember them, and imitate their faith.”"]],
 live:[["Pray for departed priests","Pray by name for the priests who served your family, living and dead."],["Thank your parish priest","Tell your parish priest one thing you are grateful for."],["Pray for vocations","Pray daily for one young person from your parish to answer God's call."]],
 fathers:[["St John Chrysostom","On the priesthood: the priest stands at the altar as a minister of heavenly things; the dignity is great, and so is the responsibility, for he will answer for the souls entrusted to him (On the Priesthood III)."],["St Gregory the Great","The good shepherd is known by his care for the flock: he must be near to each by compassion and above all by contemplation (Pastoral Rule II)."]],
 magis:[["Presbyterorum Ordinis 2–3","Priests share in the priesthood of Christ; taken from among the people, they are set apart for the people, to offer sacrifice and forgive sins in Christ's name."],["Catechism 1547–1553","The ministerial priesthood is at the service of the common priesthood; the priest acts in the person of Christ the Head."],["Catechism 1032","The Church prays and offers the Eucharistic sacrifice for the dead."]],
 saints:[["This week (fixed dates)","25 Jan: the Conversion of St Paul; the Week of Prayer for Christian Unity ends. 26 Jan: Republic Day of India. 28 Jan: St Thomas Aquinas. 31 Jan: St John Bosco."]],
 prayer:"Lord Jesus Christ, eternal High Priest, we remember before you the bishops and priests who served your people and have gone to their rest. Forgive their weaknesses, reward their labours, and give them a place of light. Keep our living priests faithful, and raise up new labourers for your harvest. Amen."},
 {quick:["Kohne Sunday: we remember the departed priests.","The priesthood continues: Christ is the one High Priest.","“Remember your leaders and imitate their faith.”"],action:"Pray by name for the priests who served your family.",question:"Which priest helped my faith most, and how can I thank God for him?",
  special:"Kohne Sunday, commemoration of the departed priests. (In 2025–26 also Catholicos Day; check the 2026–27 lectionary for collections.)",
  illus:["An illustration","In many Kerala parishes the tombs of former vicars lie near the church door. On Kohne Sunday the people light candles there after Qurbono. Some of those priests baptised the grandparents of today's children."],kids:"",diaspora:"",
  family:{read:"Read together: Hebrews 13:7–8.",explain:"Priests bring us Jesus in the Holy Qurbono and in Confession. Today we thank God for priests who have died and pray that they are happy with Jesus.",intention:"We pray for the priests who have died, for our parish priest, and for new vocations.",ask:"Ask: “Which priest baptised each of us? Let us pray for him.”"},
  catechism:[["CCC 1547–1553","The ministerial priesthood."],["CCC 1030–1032","Purification after death and prayer for the dead."]],
  kidsaint:["St John Bosco (31 Jan)","A priest in Turin who gathered poor boys from the streets, taught them a trade, played with them and led them to Jesus. Lesson: priests are fathers who care for us; pray for them."],
  term:["Kohne Sunday","Kohne is Syriac for “priests”. The first of three Sundays of remembrance before the Great Fast: departed priests (Kohne), all the departed faithful (Aneede), then the Fast begins with Kothine (Cana) Sunday."],
  termMore:["Three Sundays of remembrance","Before entering the Great Fast, the Church remembers her dead: it is a reminder that Lent is a journey towards Easter, the victory over death."]},
 {homily:["Dear brothers and sisters, today is Kohne Sunday, when our Church remembers the priests who have died. Think for a moment of the priests in your own life: the one who baptised you, who gave you your First Holy Communion, who heard your confessions, who blessed your marriage, who buried your parents. Many of them are now with the Lord.","The letter to the Hebrews says: “Remember your leaders, those who spoke the word of God to you; consider the outcome of their way of life, and imitate their faith.” We remember them with gratitude. They were human, with weaknesses like ours, but through their hands Christ gave us his Body and Blood and his forgiveness.","Our reading from Numbers tells how Aaron, the first high priest, died, and Moses placed his vestments on his son Eleazar. The priest dies; the priesthood continues. For Christ is the one eternal High Priest, “the same yesterday and today and forever”. And the Gospel asks every priest one question: were you a faithful and wise servant, giving God's household their food at the proper time?","Today let us offer this Qurbono for our departed priests, that the Lord may say to them: “Well done, good servant.” Let us thank and support our living priests. And let us pray that from our families God may call new priests, to stand at this altar when we are gone. Amen."],
  kids:["Children, who baptised you? A priest! Who gives you Jesus in Holy Communion? A priest!","Today we remember priests who have died and gone to Jesus. We thank God for them and pray that they are happy in heaven.","Let's pray for our parish priest too. Maybe one day God will call one of you to be a priest or sister! Let's say: “Thank you, Jesus, for our priests!”"]});

put("2027-01-24","ml",{title:"കോഹ്നേ ഞായർ · മരിച്ച വൈദികരുടെ ഓർമ",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 19:11–27","നാണയങ്ങളുടെ ഉപമ"],[ML.ot,"സംഖ്യ 20:22–29","അഹറോന്റെ മരണം"],[ML.ot,"ജോഷ്വ 24:29–33","ജോഷ്വയുടെ മരണം"],[ML.ot,"പ്രഭാഷകൻ 45:15–22","നിത്യഉടമ്പടിക്കായി അഭിഷിക്തനായ അഹറോൻ"],[ML.ot,"ഏശയ്യാ 65:13–16","എന്റെ ദാസർ ആനന്ദിക്കും"],[ML.ac,"അപ്പ. പ്രവ. 20:25–38","എഫേസോസിലെ ശ്രേഷ്ഠന്മാരോടു പൗലോസിന്റെ യാത്രാമൊഴി"],[ML.pa,"ഹെബ്രായർ 13:7–16","നിങ്ങളുടെ നേതാക്കന്മാരെ ഓർക്കുവിൻ"],[ML.go,"മത്തായി 24:45–51","വിശ്വസ്തനും വിവേകിയുമായ ഭൃത്യൻ"]],
 alt:"കോഹ്നേ ഞായർ: മരിച്ച വൈദികരെ സഭ ഓർക്കുന്നു. 2025–26-ലെ വായനാപുസ്തകത്തിൽ ഈ ഞായർ കാതോലിക്കാദിനവുമായിരുന്നു.",
 verse:"നിങ്ങളോടു ദൈവവചനം പ്രസംഗിച്ച നിങ്ങളുടെ നേതാക്കന്മാരെ ഓർക്കുവിൻ. അവരുടെ ജീവിതചര്യയുടെ ഫലം കണക്കിലെടുത്ത് അവരുടെ വിശ്വാസം അനുകരിക്കുവിൻ.",cite:"ഹെബ്രായർ 13:7",
 theo:["വലിയ നോമ്പിനു മുമ്പു മലങ്കരസഭ ഓർമയുടെ മൂന്നു ഞായറാഴ്ചകൾ ആചരിക്കുന്നു. ആദ്യത്തേതു മരിച്ച വൈദികരുടെ (സുറിയാനിയിൽ “കോഹ്നേ”) ഓർമയായ കോഹ്നേ ഞായറാണ്. നമുക്കു മാമ്മോദീസ നൽകുകയും നമ്മെ പഠിപ്പിക്കുകയും നമ്മുടെ പാപങ്ങൾ മോചിക്കുകയും നമുക്കായി വിശുദ്ധ കുർബാന അർപ്പിക്കുകയും നമ്മുടെ മരിച്ചവരെ സംസ്കരിക്കുകയും ചെയ്ത മെത്രാന്മാരെയും വൈദികരെയും നാം ഓർക്കുന്നു. ഹെബ്രായലേഖനം പറയുന്നു: “നിങ്ങളോടു ദൈവവചനം പ്രസംഗിച്ച നിങ്ങളുടെ നേതാക്കന്മാരെ ഓർക്കുവിൻ. അവരുടെ ജീവിതചര്യയുടെ ഫലം കണക്കിലെടുത്ത് അവരുടെ വിശ്വാസം അനുകരിക്കുവിൻ.”","ഇസ്രായേലിന്റെ മഹാന്മാരായ ദാസരുടെ മരണം വായനകൾ അനുസ്മരിക്കുന്നു. ആദ്യപ്രധാനപുരോഹിതനായ അഹറോൻ ഹോർ മലയിൽ മരിക്കുന്നു; “മോശ അഹറോന്റെ വസ്ത്രം ഊരി അവന്റെ മകനായ എലെയാസറിനെ ധരിപ്പിച്ചു” (സംഖ്യ 20:28): പുരോഹിതൻ മരിച്ചാലും പൗരോഹിത്യം തുടരുന്നു. ജനത്തെ ദേശത്തേക്കു നയിച്ചശേഷം ജോഷ്വ മരിക്കുന്നു. “കർത്താവിനു ശുശ്രൂഷചെയ്യാനും പുരോഹിതധർമം അനുഷ്ഠിക്കാനും അവിടുത്തെ നാമത്തിൽ തന്റെ ജനത്തെ ആശീർവദിക്കാനും” നിത്യഉടമ്പടിക്കായി അഭിഷിക്തനായ അഹറോനെ പ്രഭാഷകൻ ഓർക്കുന്നു (പ്രഭാ 45:15).","അപ്പസ്തോലപ്രവർത്തനങ്ങളിൽ പൗലോസ് എഫേസോസിലെ ശ്രേഷ്ഠന്മാരോടു യാത്ര പറയുന്നു: “നിങ്ങളെയും അജഗണം മുഴുവനെയുംപറ്റി നിങ്ങൾ ജാഗരൂകരായിരിക്കുവിൻ. കർത്താവു സ്വന്തം രക്തത്താൽ നേടിയെടുത്ത ദൈവത്തിന്റെ സഭയെ പരിപാലിക്കാൻ പരിശുദ്ധാത്മാവ് നിയോഗിച്ചിരിക്കുന്ന അജപാലകരാണു നിങ്ങൾ.” “സ്വീകരിക്കുന്നതിനെക്കാൾ കൊടുക്കുന്നതാണു ശ്രേയസ്കരം” എന്ന കർത്താവിന്റെ വാക്കുകൾ അദ്ദേഹം അനുസ്മരിപ്പിക്കുന്നു. ഓരോ വൈദികനോടും ചോദിക്കപ്പെടാനിരിക്കുന്ന ചോദ്യം സുവിശേഷം ചോദിക്കുന്നു: “തന്റെ ഭവനത്തിലുള്ളവർക്ക് കൃത്യസമയത്തു ഭക്ഷണം കൊടുക്കാൻ യജമാനൻ നിയോഗിച്ച വിശ്വസ്തനും വിവേകിയുമായ ഭൃത്യൻ ആരാണ്? യജമാനൻ വരുമ്പോൾ അപ്രകാരം ചെയ്യുന്നതായി കാണപ്പെടുന്ന ഭൃത്യൻ ഭാഗ്യവാൻ.”","അവരെ വിളിച്ച കർത്താവ് അവരുടെ ബലഹീനതകൾ ക്ഷമിച്ച് “കൊള്ളാം, നല്ലവനായ ഭൃത്യാ” (ലൂക്കാ 19:17) എന്ന് അവരോടു പറയാൻ മരിച്ച വൈദികർക്കുവേണ്ടി ഇന്നു നാം പ്രാർഥിക്കുന്നു. ജീവിച്ചിരിക്കുന്ന നമ്മുടെ വൈദികർക്കും പുതിയ ദൈവവിളികൾക്കുംവേണ്ടിയും നാം പ്രാർഥിക്കുന്നു. “യേശുക്രിസ്തു ഇന്നലെയും ഇന്നും എന്നും ഒരേ ആൾതന്നെയാണ്” (ഹെബ്രാ 13:8): വൈദികർ കടന്നുപോകുന്നു; ഏക പ്രധാനപുരോഹിതൻ നിലനിൽക്കുന്നു."],
 conn:[["കൈമാറപ്പെടുന്ന തിരുവസ്ത്രങ്ങൾ.","അഹറോന്റെ വസ്ത്രങ്ങൾ എലെയാസറിനെ ധരിപ്പിക്കുന്നു (സംഖ്യ 20:28): പുരോഹിതനോടൊപ്പം പൗരോഹിത്യം മരിക്കുന്നില്ല. സഭയിൽ ക്രിസ്തുവിന്റെ ഏക പൗരോഹിത്യം ഓരോ തലമുറയിലൂടെയും തുടരുന്നു."],["വിശ്വസ്തനായ ഭൃത്യൻ.","ലൂക്കാ 19-ഉം മത്തായി 24-ഉം: വൈദികർ ഉടമകളല്ല, കാര്യസ്ഥരാണ്; അവർ കണക്കു ബോധിപ്പിക്കേണ്ടിവരും."],["പൗലോസിന്റെ യാത്രാമൊഴി.","ഒരു അജപാലകന്റെ അന്ത്യവാക്കുകളുടെ മാതൃകയാണ് അപ്പസ്തോലപ്രവർത്തനങ്ങൾ 20: ദൈവത്തിന്റെ പദ്ധതി മുഴുവനും അറിയിക്കുന്നതിൽനിന്നു ഞാൻ പിന്മാറിയില്ല; ആരുടെയും വെള്ളിയോ പൊന്നോ ഞാൻ മോഹിച്ചില്ല."],["ഏക പ്രധാനപുരോഹിതൻ.","ഹെബ്രായർ 13:8–16: ഇന്നലെയും ഇന്നും എന്നും ഒരേ ആളായ ക്രിസ്തു; നമ്മുടെ സ്തോത്രബലി അവിടുത്തേതിന്റെ തുടർച്ചയാണ്."]],
 altar:["ഇന്നു ലോകത്തിൽ അർപ്പിക്കപ്പെടുന്ന ഓരോ വിശുദ്ധ കുർബാനയും ഒരുനാൾ നിശ്ചലമാകാനിരിക്കുന്ന കരങ്ങളാലാണ് അർപ്പിക്കപ്പെടുന്നത്. അവയിലൂടെ ഏക പുരോഹിതനായ ക്രിസ്തു തന്റെ ഏകബലി അർപ്പിക്കുന്നു. ഒരിക്കൽ നമുക്കുവേണ്ടി ഈ ബലിപീഠത്തിൽ നിന്ന വൈദികർക്കുവേണ്ടി ഇന്നു നാം കുർബാന അർപ്പിക്കുന്നു."],
 outline:[["ആരംഭം","നിനക്കു മാമ്മോദീസ നൽകിയ, ആദ്യകുർബാന നൽകിയ, വിവാഹം ആശീർവദിച്ച, മാതാപിതാക്കളെ സംസ്കരിച്ച വൈദികരുടെ പേരുകൾ ഓർക്കുക."],["ഒന്നാം ആശയം · നിങ്ങളുടെ നേതാക്കന്മാരെ ഓർക്കുവിൻ","നമ്മെ ശുശ്രൂഷിച്ച വൈദികരോടുള്ള നന്ദി."],["രണ്ടാം ആശയം · പൗരോഹിത്യം തുടരുന്നു","എലെയാസറിന്മേൽ അഹറോന്റെ വസ്ത്രങ്ങൾ: ക്രിസ്തുവിന്റെ പൗരോഹിത്യം ഓരോ വൈദികനെയും അതിജീവിക്കുന്നു."],["മൂന്നാം ആശയം · വിശ്വസ്തരായ കാര്യസ്ഥർ","വിശ്വസ്തനും വിവേകിയുമായ ഭൃത്യൻ: വൈദികർക്കും ഓരോ ക്രൈസ്തവകാര്യസ്ഥനുമുള്ള ഒരു വാക്ക്."],["നാലാം ആശയം · വൈദികർക്കുവേണ്ടി പ്രാർഥിക്കുക","മരിച്ചവർക്കും ജീവിച്ചിരിക്കുന്നവർക്കും ദൈവവിളികൾക്കുംവേണ്ടി."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“അവരെ ഓർക്കുവിൻ; അവരുടെ വിശ്വാസം അനുകരിക്കുവിൻ.”"]],
 live:[["മരിച്ച വൈദികർക്കുവേണ്ടി പ്രാർഥിക്കുക","നിന്റെ കുടുംബത്തെ ശുശ്രൂഷിച്ച, ജീവിച്ചിരിക്കുന്നവരും മരിച്ചവരുമായ വൈദികർക്കുവേണ്ടി പേരെടുത്തു പ്രാർഥിക്കുക."],["ഇടവകവികാരിക്കു നന്ദി പറയുക","നിനക്കു നന്ദിയുള്ള ഒരു കാര്യം നിന്റെ ഇടവകവികാരിയോടു പറയുക."],["ദൈവവിളികൾക്കായി പ്രാർഥിക്കുക","ദൈവവിളിക്ക് ഉത്തരം നൽകാൻ നിന്റെ ഇടവകയിലെ ഒരു യുവാവിനോ യുവതിക്കോവേണ്ടി എല്ലാ ദിവസവും പ്രാർഥിക്കുക."]],
 fathers:[["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","പൗരോഹിത്യത്തെപ്പറ്റി: സ്വർഗീയകാര്യങ്ങളുടെ ശുശ്രൂഷകനായാണു വൈദികൻ ബലിപീഠത്തിൽ നിൽക്കുന്നത്; മഹത്വം വലുതാണ്, ഉത്തരവാദിത്വവും; തന്നെ ഏൽപിച്ച ആത്മാക്കൾക്കുവേണ്ടി അവൻ ഉത്തരം പറയണം (പൗരോഹിത്യത്തെപ്പറ്റി III)."],["മഹാനായ വിശുദ്ധ ഗ്രിഗറി","ആട്ടിൻകൂട്ടത്തോടുള്ള കരുതലിലാണു നല്ല ഇടയൻ അറിയപ്പെടുന്നത്: അനുകമ്പയാൽ ഓരോരുത്തരോടും അടുത്തും ധ്യാനത്താൽ എല്ലാവർക്കും മീതേയും അവൻ ആയിരിക്കണം (അജപാലനനിയമം II)."]],
 magis:[["വൈദികരുടെ ശുശ്രൂഷ (പ്രെസ്ബിതെരോരും ഓർദിനിസ്) 2–3","വൈദികർ ക്രിസ്തുവിന്റെ പൗരോഹിത്യത്തിൽ പങ്കുകാരാണ്; ജനത്തിന്റെ ഇടയിൽനിന്ന് എടുക്കപ്പെട്ട്, ബലിയർപ്പിക്കാനും ക്രിസ്തുവിന്റെ നാമത്തിൽ പാപങ്ങൾ മോചിക്കാനുമായി ജനത്തിനുവേണ്ടി വേർതിരിക്കപ്പെട്ടവർ."],["മതബോധനഗ്രന്ഥം 1547–1553","ശുശ്രൂഷാപൗരോഹിത്യം പൊതുപൗരോഹിത്യത്തിന്റെ സേവനത്തിനാണ്; ശിരസ്സായ ക്രിസ്തുവിന്റെ വ്യക്തിത്വത്തിലാണു വൈദികൻ പ്രവർത്തിക്കുന്നത്."],["മതബോധനഗ്രന്ഥം 1032","മരിച്ചവർക്കുവേണ്ടി സഭ പ്രാർഥിക്കുകയും ദിവ്യകാരുണ്യബലി അർപ്പിക്കുകയും ചെയ്യുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ജനുവരി 25: വിശുദ്ധ പൗലോസിന്റെ മാനസാന്തരം; ക്രൈസ്തവൈക്യപ്രാർഥനാവാരം അവസാനിക്കുന്നു. ജനുവരി 26: ഭാരതത്തിന്റെ റിപ്പബ്ലിക്ദിനം. ജനുവരി 28: വിശുദ്ധ തോമസ് അക്വീനാസ്. ജനുവരി 31: വിശുദ്ധ ഡോൺ ബോസ്കോ."]],
 prayer:"നിത്യപ്രധാനപുരോഹിതനായ കർത്താവായ യേശുമിശിഹായേ, അങ്ങയുടെ ജനത്തെ ശുശ്രൂഷിച്ച് വിശ്രമത്തിലേക്കു പോയ മെത്രാന്മാരെയും വൈദികരെയും ഞങ്ങൾ അങ്ങയുടെ മുമ്പിൽ ഓർക്കുന്നു. അവരുടെ ബലഹീനതകൾ ക്ഷമിക്കണമേ; അവരുടെ അധ്വാനത്തിനു പ്രതിഫലം നൽകണമേ; അവർക്കു പ്രകാശത്തിന്റെ ഒരിടം നൽകണമേ. ജീവിച്ചിരിക്കുന്ന ഞങ്ങളുടെ വൈദികരെ വിശ്വസ്തരായി കാക്കണമേ; അങ്ങയുടെ വിളവെടുപ്പിനു പുതിയ വേലക്കാരെ ഉയർത്തണമേ. ആമേൻ."},
 {quick:["കോഹ്നേ ഞായർ: മരിച്ച വൈദികരെ നാം ഓർക്കുന്നു.","പൗരോഹിത്യം തുടരുന്നു: ക്രിസ്തുവാണ് ഏക പ്രധാനപുരോഹിതൻ.","“നിങ്ങളുടെ നേതാക്കന്മാരെ ഓർക്കുവിൻ; അവരുടെ വിശ്വാസം അനുകരിക്കുവിൻ.”"],action:"നിന്റെ കുടുംബത്തെ ശുശ്രൂഷിച്ച വൈദികർക്കുവേണ്ടി പേരെടുത്തു പ്രാർഥിക്കുക.",question:"എന്റെ വിശ്വാസത്തെ ഏറ്റവും സഹായിച്ച വൈദികൻ ആരാണ്? അദ്ദേഹത്തിനായി ഞാൻ എങ്ങനെ ദൈവത്തിനു നന്ദി പറയും?",
  special:"കോഹ്നേ ഞായർ, മരിച്ച വൈദികരുടെ ഓർമ. (2025–26-ൽ കാതോലിക്കാദിനവുമായിരുന്നു; സ്തോത്രക്കാഴ്ചകൾക്കായി 2026–27-ലെ വായനാപുസ്തകം നോക്കുക.)",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ പല ഇടവകകളിലും മുൻവികാരിമാരുടെ കല്ലറകൾ പള്ളിവാതിലിനരികെയാണ്. കോഹ്നേ ഞായറാഴ്ച കുർബാനയ്ക്കുശേഷം ജനങ്ങൾ അവിടെ മെഴുകുതിരികൾ കത്തിക്കുന്നു. അവരിൽ ചിലരാണ് ഇന്നത്തെ കുഞ്ഞുങ്ങളുടെ വല്യപ്പച്ചന്മാർക്കും വല്യമ്മച്ചിമാർക്കും മാമ്മോദീസ നൽകിയത്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ഹെബ്രായർ 13:7–8.",explain:"വിശുദ്ധ കുർബാനയിലും കുമ്പസാരത്തിലും വൈദികരാണ് യേശുവിനെ നമുക്കു തരുന്നത്. മരിച്ചുപോയ വൈദികർക്കായി ഇന്നു നാം ദൈവത്തിനു നന്ദി പറയുന്നു; അവർ യേശുവിനോടൊപ്പം സന്തോഷത്തിലായിരിക്കാൻ പ്രാർഥിക്കുന്നു.",intention:"മരിച്ച വൈദികർക്കും നമ്മുടെ ഇടവകവികാരിക്കും പുതിയ ദൈവവിളികൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മളോരോരുത്തർക്കും മാമ്മോദീസ നൽകിയ വൈദികൻ ആരാണ്? അദ്ദേഹത്തിനുവേണ്ടി പ്രാർഥിക്കാം.”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1547–1553","ശുശ്രൂഷാപൗരോഹിത്യം."],["മതബോധനഗ്രന്ഥം 1030–1032","മരണാനന്തരശുദ്ധീകരണവും മരിച്ചവർക്കുവേണ്ടിയുള്ള പ്രാർഥനയും."]],
  kidsaint:["വിശുദ്ധ ഡോൺ ബോസ്കോ (ജനുവരി 31)","തെരുവിലെ ദരിദ്രബാലന്മാരെ ഒരുമിച്ചുകൂട്ടി, അവർക്കു തൊഴിൽ പഠിപ്പിച്ച്, അവരോടൊപ്പം കളിച്ച്, അവരെ യേശുവിലേക്കു നയിച്ച ടൂറിനിലെ ഒരു വൈദികൻ. പാഠം: നമ്മെ പരിപാലിക്കുന്ന പിതാക്കന്മാരാണു വൈദികർ; അവർക്കുവേണ്ടി പ്രാർഥിക്കുക."],
  term:["കോഹ്നേ ഞായർ","“കോഹ്നേ” എന്നതിന്റെ സുറിയാനിയിലെ അർഥം “പുരോഹിതന്മാർ” എന്നാണ്. വലിയ നോമ്പിനു മുമ്പുള്ള ഓർമയുടെ മൂന്നു ഞായറാഴ്ചകളിൽ ആദ്യത്തേത്: മരിച്ച വൈദികർ (കോഹ്നേ), മരിച്ച എല്ലാ വിശ്വാസികളും (അനീദേ); പിന്നെ കോത്തിനേ (കാനാ) ഞായറോടെ നോമ്പ് ആരംഭിക്കുന്നു."],
  termMore:["ഓർമയുടെ ഞായറാഴ്ചകൾ","വലിയ നോമ്പിലേക്കു പ്രവേശിക്കുംമുമ്പു സഭ തന്റെ മരിച്ചവരെ ഓർക്കുന്നു: മരണത്തിന്മേലുള്ള വിജയമായ ഉയിർപ്പിലേക്കുള്ള യാത്രയാണു നോമ്പ് എന്ന ഓർമപ്പെടുത്തൽ."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, മരിച്ച വൈദികരെ നമ്മുടെ സഭ ഓർക്കുന്ന കോഹ്നേ ഞായറാണ് ഇന്ന്. നിന്റെ സ്വന്തം ജീവിതത്തിലെ വൈദികരെ ഒരു നിമിഷം ഓർക്കുക: നിനക്കു മാമ്മോദീസ നൽകിയയാൾ, ആദ്യകുർബാന നൽകിയയാൾ, നിന്റെ കുമ്പസാരം കേട്ടയാൾ, നിന്റെ വിവാഹം ആശീർവദിച്ചയാൾ, നിന്റെ മാതാപിതാക്കളെ സംസ്കരിച്ചയാൾ. അവരിൽ പലരും ഇന്നു കർത്താവിനോടൊപ്പമാണ്.","ഹെബ്രായലേഖനം പറയുന്നു: “നിങ്ങളോടു ദൈവവചനം പ്രസംഗിച്ച നിങ്ങളുടെ നേതാക്കന്മാരെ ഓർക്കുവിൻ. അവരുടെ ജീവിതചര്യയുടെ ഫലം കണക്കിലെടുത്ത് അവരുടെ വിശ്വാസം അനുകരിക്കുവിൻ.” നന്ദിയോടെ നാം അവരെ ഓർക്കുന്നു. നമ്മെപ്പോലെ ബലഹീനതകളുള്ള മനുഷ്യരായിരുന്നു അവർ; എങ്കിലും അവരുടെ കരങ്ങളിലൂടെ ക്രിസ്തു തന്റെ ശരീരവും രക്തവും തന്റെ പാപമോചനവും നമുക്കു നൽകി.","ആദ്യപ്രധാനപുരോഹിതനായ അഹറോൻ മരിച്ചതെങ്ങനെയെന്നും മോശ അവന്റെ വസ്ത്രങ്ങൾ മകനായ എലെയാസറിനെ ധരിപ്പിച്ചതെങ്ങനെയെന്നും സംഖ്യാപുസ്തകത്തിൽനിന്നുള്ള വായന പറയുന്നു. പുരോഹിതൻ മരിക്കുന്നു; പൗരോഹിത്യം തുടരുന്നു. കാരണം “ഇന്നലെയും ഇന്നും എന്നും ഒരേ ആളായ” ക്രിസ്തുവാണ് ഏക നിത്യപ്രധാനപുരോഹിതൻ. സുവിശേഷം ഓരോ വൈദികനോടും ഒരു ചോദ്യം ചോദിക്കുന്നു: ദൈവഭവനത്തിനു കൃത്യസമയത്തു ഭക്ഷണം നൽകുന്ന വിശ്വസ്തനും വിവേകിയുമായ ഭൃത്യനായിരുന്നോ നീ?","“കൊള്ളാം, നല്ലവനായ ഭൃത്യാ” എന്നു കർത്താവ് അവരോടു പറയാൻ, മരിച്ച വൈദികർക്കുവേണ്ടി ഇന്ന് ഈ കുർബാന നമുക്ക് അർപ്പിക്കാം. ജീവിച്ചിരിക്കുന്ന നമ്മുടെ വൈദികർക്കു നന്ദി പറയുകയും അവരെ പിന്തുണയ്ക്കുകയും ചെയ്യാം. നാം പോയശേഷം ഈ ബലിപീഠത്തിൽ നിൽക്കാൻ നമ്മുടെ കുടുംബങ്ങളിൽനിന്നു പുതിയ വൈദികരെ ദൈവം വിളിക്കാൻ നമുക്കു പ്രാർഥിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, നിങ്ങൾക്കു മാമ്മോദീസ നൽകിയത് ആരാണ്? ഒരു വൈദികൻ! വിശുദ്ധ കുർബാനയിൽ യേശുവിനെ നിങ്ങൾക്കു തരുന്നത് ആരാണ്? ഒരു വൈദികൻ!","മരിച്ച് യേശുവിന്റെ അടുത്തേക്കു പോയ വൈദികരെ ഇന്നു നാം ഓർക്കുന്നു. അവർക്കായി ദൈവത്തിനു നന്ദി പറയുകയും അവർ സ്വർഗത്തിൽ സന്തോഷത്തിലായിരിക്കാൻ പ്രാർഥിക്കുകയും ചെയ്യുന്നു.","നമ്മുടെ ഇടവകവികാരിക്കുവേണ്ടിയും പ്രാർഥിക്കാം. ഒരുപക്ഷേ ഒരുനാൾ നിങ്ങളിൽ ഒരാളെ ദൈവം വൈദികനോ സിസ്റ്ററോ ആകാൻ വിളിക്കും! നമുക്കു പറയാം: “യേശുവേ, ഞങ്ങളുടെ വൈദികർക്കു നന്ദി!”"]});

put("2027-01-31","en",{title:"Aneede Sunday · Commemoration of the Departed Faithful",readTitle:EN.rt,
 readings:[[EN.eg,"Matthew 25:31–46","The judgement of the nations"],[EN.ot,"Genesis 49:29–33","Jacob is gathered to his people"],[EN.ot,"2 Maccabees 12:38–45","Prayer for the dead"],[EN.ot,"Sirach 41:1–4","Do not fear death's decree"],[EN.ot,"Isaiah 38:9–22","Hezekiah's song"],[EN.ce,"2 Peter 3:8–13","New heavens and a new earth"],[EN.pa,"1 Thessalonians 4:13–18","We will be with the Lord for ever"],[EN.go,"John 5:19–29","The dead will hear the voice of the Son of God"]],
 alt:"Aneede Sunday: the Church remembers all the faithful departed. The Great Fast begins next Sunday. (In 2025–26 this Sunday was also Malankara Catholic Children's League Day.)",
 verse:"Very truly, I tell you, anyone who hears my word and believes him who sent me has eternal life, and does not come under judgment, but has passed from death to life.",cite:"John 5:24",
 theo:["Last Sunday we remembered the departed priests; today, Aneede Sunday, we remember all the faithful departed: our parents and grandparents, brothers and sisters, children and friends. The Church does not forget them. Before we enter the Great Fast, we gather them in prayer, because Lent leads to Easter, the victory of Christ over death.","Jesus says: “The hour is coming, and is now here, when the dead will hear the voice of the Son of God, and those who hear will live… all who are in their graves will hear his voice and will come out.” St Paul writes to the Thessalonians so “that you may not grieve as others do who have no hope.” Christian grief is real, but it is grief with hope: “so we will be with the Lord forever.”","The reading from 2 Maccabees shows that God's people prayed for the dead even before Christ. Judas Maccabeus took up a collection for a sin offering for the fallen, “for if he were not expecting that those who had fallen would rise again, it would have been superfluous and foolish to pray for the dead”. From the beginning the Church has prayed for the departed and offered the Holy Qurbono for them, that they may be purified and enter the joy of God.","The evening Gospel reminds us how we will be judged: “I was hungry and you gave me food… just as you did it to one of the least of these who are members of my family, you did it to me.” The best way to honour our dead is to pray for them and to live in such a way that, when our turn comes, we too may hear: “Come, you that are blessed by my Father.”"],
 conn:[["Gathered to his people.","Jacob “breathed his last, and was gathered to his people” (Genesis 49:33): death is a gathering, not an ending."],["Prayer for the dead.","2 Maccabees 12:45 is the Old Testament root of the Church's prayer for the departed (CCC 1032)."],["Hezekiah's song.","“You have held back my life from the pit of destruction, for you have cast all my sins behind your back” (Isaiah 38:17): God's mercy reaches beyond death."],["New heavens and a new earth.","2 Peter 3:13 and Revelation 21:1: our hope is not only for souls but for a renewed creation and the resurrection of the body."]],
 altar:["In every Holy Qurbono, in the Thubden, the Church remembers the faithful departed by name. Today we offer the Qurbono for all our dead: the Body and Blood of the risen Lord are the pledge of their resurrection and ours."],
 outline:[["Opening","Invite the people to name silently those they have lost."],["Point 1 · Grief with hope","1 Thessalonians 4: not as those who have no hope."],["Point 2 · Why we pray for the dead","2 Maccabees 12; the Church's tradition; the Qurbono for the departed."],["Point 3 · Judged on love","Matthew 25: the hungry, the stranger, the sick, the prisoner."],["Point 4 · Preparing for the Fast","Lent is the journey to the Resurrection."],["Take-home line","“We will be with the Lord forever.”"]],
 live:[["Pray for your dead","Write the names of your departed family members and pray for them each day this week; offer a Qurbono for them."],["Visit the cemetery","Visit the graves of your family, clean them, and pray there."],["Do one work of mercy (Matthew 25)","Feed, visit or clothe someone this week in memory of a departed loved one."]],
 fathers:[["St Augustine","His mother Monica asked as she was dying: “Lay this body anywhere; only this I ask of you, that you remember me at the altar of the Lord, wherever you may be” (Confessions IX, 11)."],["St John Chrysostom","“Let us help and commemorate them… Why would you doubt that our offerings for the dead bring them some consolation?” (Homilies on 1 Corinthians 41)."]],
 magis:[["Catechism 1030–1032","Those who die in God's grace but still imperfectly purified undergo purification; the Church commends prayer, the Eucharistic sacrifice, almsgiving and works of penance for them."],["Catechism 1680–1690","The Christian funeral and the communion of saints with the departed."],["Lumen Gentium 49–50","The union of the pilgrim Church with those who have died in Christ is not broken, but strengthened by the sharing of spiritual goods."]],
 saints:[["This week (fixed dates)","31 Jan: St John Bosco. 2 Feb (Tuesday): Mayaltho, the Entrance of our Lord into the Temple. 3 Feb: Mar Simon and Morth Hanna (as in the 2025–26 lectionary). 4 Feb: St John de Britto."]],
 prayer:"Lord Jesus Christ, you are the resurrection and the life. Remember all our departed brothers and sisters, our parents, relatives, friends and benefactors, and those whom no one remembers. Forgive their sins, give them eternal rest, and let perpetual light shine upon them. Amen."},
 {quick:["Aneede Sunday: we remember all the faithful departed.","Christian grief has hope: we will be with the Lord for ever.","We will be judged on love: what we did for the least."],action:"Offer a Qurbono and pray daily this week for your departed family members.",question:"How am I preparing for my own meeting with the Lord?",
  special:"Aneede Sunday, commemoration of the faithful departed. Announce the beginning of the Great Fast with Kothine Sunday (7 February) and the Shubkono on Monday 8 February.",
  illus:["An illustration","In Kerala families the name of a departed parent is written in the parish register for the annual Qurbono, and the family gathers every year on that day. Love does not stop at the grave; it becomes prayer."],kids:"",diaspora:"",
  family:{read:"Read together: 1 Thessalonians 4:13–14, 17.",explain:"When people we love die, we are sad. But Jesus rose from the dead, and he will raise them too. We pray for them so that they may be happy with God.",intention:"We pray for our grandparents and all our family members who have died.",ask:"Ask: “Who in our family has gone to God? Let us tell one good memory of them.”"},
  catechism:[["CCC 1030–1032","Prayer for the dead."],["CCC 1020–1029","Heaven and eternal life."]],
  kidsaint:["St Monica","The mother of St Augustine, who prayed for her son for many years until he came back to God. Before she died she asked him only to remember her at the altar. Lesson: pray for those you love, living and dead."],
  term:["Aneede Sunday","Aneede is Syriac for “the departed”. On the Sunday before the Great Fast the Malankara Church remembers all the faithful departed, after remembering the departed priests on Kohne Sunday."],
  termMore:["Why do we pray for the dead?","Because love does not end with death, and because the dead who still need purification can be helped by the prayers and offerings of the living (2 Maccabees 12:45; CCC 1032)."]},
 {homily:["Dear brothers and sisters, last Sunday we remembered our departed priests. Today, Aneede Sunday, we remember all our faithful departed. Let us take a moment of silence and bring to mind those we have lost: a father, a mother, a husband, a wife, a child, a friend.","St Paul writes: we do not want you to grieve “as others do who have no hope”. He does not say “do not grieve”. Jesus himself wept at the tomb of his friend. But our grief has hope, because Christ is risen. Jesus says: “All who are in their graves will hear his voice and will come out.” One day our dead will hear that voice.","Why do we pray for the dead? Our reading from Maccabees says: if Judas had not believed in the resurrection, it would have been foolish to pray for the fallen. The Church has always prayed and offered the Holy Qurbono for the departed, that they may be purified and enter fully into God's joy. St Monica asked her son Augustine only one thing before she died: “Remember me at the altar of the Lord.”","And the evening Gospel reminds us how we ourselves will be judged: “I was hungry and you gave me food… as you did it to one of the least of these, you did it to me.” Next Sunday the Great Fast begins. Let us enter it remembering that life is short, that love is what remains, and that we too are walking towards the Lord. Eternal rest grant unto them, O Lord. Amen."],
  kids:["Children, do you have a grandpa or grandma who has gone to God? Today we remember all the people we love who have died.","We feel sad, but we also have hope, because Jesus rose from the dead and he will bring them to new life.","Tonight, pray for them by name. Let's say: “Jesus, keep them happy with you in heaven!”"]});

put("2027-01-31","ml",{title:"അനീദേ ഞായർ · മരിച്ച വിശ്വാസികളുടെ ഓർമ",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 25:31–46","ജനതകളുടെ വിധി"],[ML.ot,"ഉൽപത്തി 49:29–33","യാക്കോബ് തന്റെ ജനത്തോടു ചേരുന്നു"],[ML.ot,"2 മക്കബായർ 12:38–45","മരിച്ചവർക്കുവേണ്ടിയുള്ള പ്രാർഥന"],[ML.ot,"പ്രഭാഷകൻ 41:1–4","മരണവിധിയെ ഭയപ്പെടേണ്ടാ"],[ML.ot,"ഏശയ്യാ 38:9–22","ഹെസക്കിയായുടെ ഗീതം"],[ML.ce,"2 പത്രോസ് 3:8–13","പുതിയ ആകാശവും പുതിയ ഭൂമിയും"],[ML.pa,"1 തെസലോനിക്കാ 4:13–18","നാം എന്നും കർത്താവിനോടുകൂടെയായിരിക്കും"],[ML.go,"യോഹന്നാൻ 5:19–29","മരിച്ചവർ ദൈവപുത്രന്റെ സ്വരം കേൾക്കും"]],
 alt:"അനീദേ ഞായർ: മരിച്ച എല്ലാ വിശ്വാസികളെയും സഭ ഓർക്കുന്നു. അടുത്ത ഞായറാഴ്ച വലിയ നോമ്പ് ആരംഭിക്കുന്നു. (2025–26-ൽ ഈ ഞായർ മലങ്കര കാത്തലിക് ചിൽഡ്രൻസ് ലീഗ് ദിനവുമായിരുന്നു.)",
 verse:"സത്യം സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു, എന്റെ വചനം കേൾക്കുകയും എന്നെ അയച്ചവനെ വിശ്വസിക്കുകയും ചെയ്യുന്നവനു നിത്യജീവനുണ്ട്. അവനു ശിക്ഷാവിധി ഉണ്ടാകുന്നില്ല. പ്രത്യുത, അവൻ മരണത്തിൽനിന്നു ജീവനിലേക്കു കടന്നിരിക്കുന്നു.",cite:"യോഹന്നാൻ 5:24",
 theo:["കഴിഞ്ഞ ഞായറാഴ്ച നാം മരിച്ച വൈദികരെ ഓർത്തു; ഇന്ന്, അനീദേ ഞായറാഴ്ച, മരിച്ച എല്ലാ വിശ്വാസികളെയും നാം ഓർക്കുന്നു: നമ്മുടെ മാതാപിതാക്കൾ, വല്യപ്പച്ചന്മാർ, വല്യമ്മച്ചിമാർ, സഹോദരീസഹോദരന്മാർ, മക്കൾ, സുഹൃത്തുക്കൾ. സഭ അവരെ മറക്കുന്നില്ല. വലിയ നോമ്പിൽ പ്രവേശിക്കുംമുമ്പു പ്രാർഥനയിൽ നാം അവരെ ഒരുമിച്ചുകൂട്ടുന്നു; കാരണം നോമ്പു മരണത്തിന്മേലുള്ള ക്രിസ്തുവിന്റെ വിജയമായ ഉയിർപ്പിലേക്കു നയിക്കുന്നു.","യേശു പറയുന്നു: “മരിച്ചവർ ദൈവപുത്രന്റെ സ്വരം ശ്രവിക്കുന്ന സമയം വരുന്നു; അല്ല, വന്നുകഴിഞ്ഞു. ആ സ്വരം ശ്രവിക്കുന്നവർ ജീവിക്കും… കല്ലറകളിലുള്ളവരെല്ലാം അവന്റെ സ്വരം ശ്രവിക്കുന്ന സമയം വരുന്നു.” പ്രത്യാശയില്ലാത്ത മറ്റുള്ളവരെപ്പോലെ നിങ്ങൾ ദുഃഖിക്കാതിരിക്കാനാണ് (1 തെസ 4:13) വിശുദ്ധ പൗലോസ് തെസലോനിക്കാക്കാർക്ക് എഴുതുന്നത്. ക്രൈസ്തവദുഃഖം യഥാർഥമാണ്; പക്ഷേ അതു പ്രത്യാശയുള്ള ദുഃഖമാണ്: അങ്ങനെ നാം എന്നും കർത്താവിനോടുകൂടെയായിരിക്കും.","ക്രിസ്തുവിനു മുമ്പുതന്നെ ദൈവജനം മരിച്ചവർക്കുവേണ്ടി പ്രാർഥിച്ചിരുന്നുവെന്ന് 2 മക്കബായറിൽനിന്നുള്ള വായന കാണിക്കുന്നു. വീണുപോയവർക്കുവേണ്ടി പാപപരിഹാരബലിക്കായി യൂദാസ് മക്കബേയൂസ് ഒരു പിരിവെടുത്തു: “മരിച്ചവർ ഉയിർക്കുമെന്നു പ്രതീക്ഷയില്ലായിരുന്നെങ്കിൽ അവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നത് നിഷ്പ്രയോജനവും ഭോഷത്തവും ആകുമായിരുന്നു.” മരിച്ചവർ ശുദ്ധീകരിക്കപ്പെട്ട് ദൈവത്തിന്റെ സന്തോഷത്തിൽ പ്രവേശിക്കാൻ ആരംഭംമുതലേ സഭ അവർക്കുവേണ്ടി പ്രാർഥിക്കുകയും വിശുദ്ധ കുർബാന അർപ്പിക്കുകയും ചെയ്തിട്ടുണ്ട്.","നാം എങ്ങനെ വിധിക്കപ്പെടുമെന്നു സന്ധ്യാസുവിശേഷം ഓർമിപ്പിക്കുന്നു: “എനിക്കു വിശന്നു; നിങ്ങൾ ഭക്ഷിക്കാൻ തന്നു… എന്റെ ഏറ്റവും എളിയ ഈ സഹോദരന്മാരിൽ ഒരുവന് നിങ്ങൾ ഇതു ചെയ്തുകൊടുത്തപ്പോൾ എനിക്കു തന്നെയാണു ചെയ്തുതന്നത്.” നമ്മുടെ മരിച്ചവരെ ആദരിക്കാനുള്ള ഏറ്റവും നല്ല വഴി അവർക്കുവേണ്ടി പ്രാർഥിക്കുകയും, നമ്മുടെ ഊഴം വരുമ്പോൾ “എന്റെ പിതാവിനാൽ അനുഗ്രഹിക്കപ്പെട്ടവരേ, വരുവിൻ” എന്നു നാമും കേൾക്കുംവിധം ജീവിക്കുകയുമാണ്."],
 conn:[["തന്റെ ജനത്തോടു ചേർന്നു.","യാക്കോബ് “അന്ത്യശ്വാസം വലിച്ച് തന്റെ ജനത്തോടുചേർന്നു” (ഉൽപ 49:33): മരണം ഒരു ചേർക്കലാണ്, അവസാനമല്ല."],["മരിച്ചവർക്കുവേണ്ടിയുള്ള പ്രാർഥന.","മരിച്ചവർക്കുവേണ്ടിയുള്ള സഭയുടെ പ്രാർഥനയുടെ പഴയനിയമവേരാണ് 2 മക്കബായർ 12:45 (മതബോധനഗ്രന്ഥം 1032)."],["ഹെസക്കിയായുടെ ഗീതം.","“അങ്ങ് എന്റെ സകല പാപങ്ങളും അങ്ങയുടെ പിന്നിൽ എറിഞ്ഞുകളഞ്ഞതുകൊണ്ട് നാശത്തിന്റെ കുഴിയിൽ നിന്ന് എന്റെ ജീവനെ അങ്ങ് രക്ഷിച്ചു” (ഏശ 38:17): ദൈവകരുണ മരണത്തിനപ്പുറം എത്തുന്നു."],["പുതിയ ആകാശവും പുതിയ ഭൂമിയും.","2 പത്രോസ് 3:13-ഉം വെളിപാട് 21:1-ഉം: നമ്മുടെ പ്രത്യാശ ആത്മാക്കൾക്കുവേണ്ടി മാത്രമല്ല, നവീകരിക്കപ്പെട്ട സൃഷ്ടിക്കും ശരീരത്തിന്റെ ഉയിർപ്പിനുംവേണ്ടിയാണ്."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയിലും, തുബ്ദേനിൽ, മരിച്ച വിശ്വാസികളെ സഭ പേരെടുത്ത് ഓർക്കുന്നു. നമ്മുടെ എല്ലാ മരിച്ചവർക്കുംവേണ്ടി ഇന്നു നാം കുർബാന അർപ്പിക്കുന്നു: ഉത്ഥിതനായ കർത്താവിന്റെ ശരീരവും രക്തവും അവരുടെയും നമ്മുടെയും ഉയിർപ്പിന്റെ ഉറപ്പാണ്."],
 outline:[["ആരംഭം","നഷ്ടപ്പെട്ടവരെ നിശ്ശബ്ദമായി ഓർക്കാൻ ജനത്തെ ക്ഷണിക്കുക."],["ഒന്നാം ആശയം · പ്രത്യാശയുള്ള ദുഃഖം","1 തെസലോനിക്കാ 4: പ്രത്യാശയില്ലാത്തവരെപ്പോലെയല്ല."],["രണ്ടാം ആശയം · എന്തുകൊണ്ടു മരിച്ചവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നു","2 മക്കബായർ 12; സഭയുടെ പാരമ്പര്യം; മരിച്ചവർക്കുവേണ്ടിയുള്ള കുർബാന."],["മൂന്നാം ആശയം · സ്നേഹത്തെ ആധാരമാക്കി വിധി","മത്തായി 25: വിശക്കുന്നവർ, പരദേശി, രോഗി, തടവുകാരൻ."],["നാലാം ആശയം · നോമ്പിനായി ഒരുങ്ങുക","ഉയിർപ്പിലേക്കുള്ള യാത്രയാണു നോമ്പ്."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“നാം എന്നും കർത്താവിനോടുകൂടെയായിരിക്കും.”"]],
 live:[["നിന്റെ മരിച്ചവർക്കുവേണ്ടി പ്രാർഥിക്കുക","മരിച്ച കുടുംബാംഗങ്ങളുടെ പേരുകൾ എഴുതി ഈ ആഴ്ച എല്ലാ ദിവസവും അവർക്കുവേണ്ടി പ്രാർഥിക്കുക; അവർക്കുവേണ്ടി ഒരു കുർബാന അർപ്പിക്കുക."],["സിമിത്തേരി സന്ദർശിക്കുക","നിന്റെ കുടുംബാംഗങ്ങളുടെ കല്ലറകൾ സന്ദർശിച്ച്, വൃത്തിയാക്കി, അവിടെ പ്രാർഥിക്കുക."],["ഒരു കാരുണ്യപ്രവൃത്തി (മത്തായി 25)","മരിച്ച ഒരു പ്രിയപ്പെട്ടവന്റെ ഓർമയ്ക്കായി ഈ ആഴ്ച ഒരാൾക്കു ഭക്ഷണം കൊടുക്കുകയോ ഒരാളെ സന്ദർശിക്കുകയോ ഉടുപ്പിക്കുകയോ ചെയ്യുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","മരണാസന്നയായ അമ്മ മോനിക്കാ ആവശ്യപ്പെട്ടു: ഈ ശരീരം എവിടെയെങ്കിലും അടക്കുക; ഇതു മാത്രം ഞാൻ നിന്നോടു ചോദിക്കുന്നു: നീ എവിടെയായിരുന്നാലും കർത്താവിന്റെ ബലിപീഠത്തിങ്കൽ എന്നെ ഓർക്കുക (ആത്മകഥ IX, 11)."],["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","നമുക്ക് അവരെ സഹായിക്കുകയും അനുസ്മരിക്കുകയും ചെയ്യാം… മരിച്ചവർക്കുവേണ്ടിയുള്ള നമ്മുടെ കാഴ്ചകൾ അവർക്ക് ആശ്വാസം നൽകുന്നുവെന്നു നീ എന്തിനു സംശയിക്കണം? (1 കോറിന്തോസിനെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 41)."]],
 magis:[["മതബോധനഗ്രന്ഥം 1030–1032","ദൈവകൃപയിൽ മരിക്കുന്നവരെങ്കിലും പൂർണമായി ശുദ്ധീകരിക്കപ്പെടാത്തവർ ശുദ്ധീകരണത്തിനു വിധേയരാകുന്നു; അവർക്കുവേണ്ടി പ്രാർഥനയും ദിവ്യകാരുണ്യബലിയും ദാനധർമവും പ്രായശ്ചിത്തപ്രവൃത്തികളും സഭ നിർദേശിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1680–1690","ക്രൈസ്തവ മൃതസംസ്കാരവും മരിച്ചവരുമായുള്ള വിശുദ്ധരുടെ ഐക്യവും."],["ലുമെൻ ജെൻസിയും 49–50","തീർഥാടകസഭയും ക്രിസ്തുവിൽ മരിച്ചവരുമായുള്ള ഐക്യം തകർക്കപ്പെടുന്നില്ല; ആത്മീയനന്മകളുടെ പങ്കുവയ്ക്കലിലൂടെ അതു ബലപ്പെടുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ജനുവരി 31: വിശുദ്ധ ഡോൺ ബോസ്കോ. ഫെബ്രുവരി 2 (ചൊവ്വ): മായൽത്തോ, നമ്മുടെ കർത്താവിന്റെ ദേവാലയപ്രവേശം. ഫെബ്രുവരി 3: മാർ ശിമയോനും മോർത്ത് ഹന്നായും (2025–26-ലെ വായനാപുസ്തകത്തിലെപ്പോലെ). ഫെബ്രുവരി 4: വിശുദ്ധ ജോൺ ഡി ബ്രിട്ടോ."]],
 prayer:"പുനരുത്ഥാനവും ജീവനുമായ കർത്താവായ യേശുമിശിഹായേ, മരിച്ച ഞങ്ങളുടെ എല്ലാ സഹോദരീസഹോദരന്മാരെയും, ഞങ്ങളുടെ മാതാപിതാക്കളെയും ബന്ധുക്കളെയും സുഹൃത്തുക്കളെയും ഉപകാരികളെയും, ആരും ഓർക്കാത്തവരെയും ഓർക്കണമേ. അവരുടെ പാപങ്ങൾ ക്ഷമിക്കണമേ; അവർക്കു നിത്യവിശ്രമം നൽകണമേ; നിത്യപ്രകാശം അവരുടെമേൽ പ്രകാശിക്കട്ടെ. ആമേൻ."},
 {quick:["അനീദേ ഞായർ: മരിച്ച എല്ലാ വിശ്വാസികളെയും നാം ഓർക്കുന്നു.","ക്രൈസ്തവദുഃഖത്തിനു പ്രത്യാശയുണ്ട്: നാം എന്നും കർത്താവിനോടുകൂടെയായിരിക്കും.","സ്നേഹത്തെ ആധാരമാക്കിയാണു നാം വിധിക്കപ്പെടുന്നത്: ഏറ്റവും എളിയവർക്കു ചെയ്തത്."],action:"ഈ ആഴ്ച മരിച്ച കുടുംബാംഗങ്ങൾക്കുവേണ്ടി ഒരു കുർബാന അർപ്പിക്കുകയും എല്ലാ ദിവസവും പ്രാർഥിക്കുകയും ചെയ്യുക.",question:"കർത്താവുമായുള്ള എന്റെ സ്വന്തം കണ്ടുമുട്ടലിനു ഞാൻ എങ്ങനെ ഒരുങ്ങുന്നു?",
  special:"അനീദേ ഞായർ, മരിച്ച വിശ്വാസികളുടെ ഓർമ. കോത്തിനേ ഞായറോടെ (ഫെബ്രുവരി 7) വലിയ നോമ്പും ഫെബ്രുവരി 8 തിങ്കളാഴ്ച ശുബ്‌ക്കോനോയും ആരംഭിക്കുന്നുവെന്ന് അറിയിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ കുടുംബങ്ങളിൽ മരിച്ച മാതാപിതാക്കളുടെ പേര് വാർഷികക്കുർബാനയ്ക്കായി ഇടവകരജിസ്റ്ററിൽ എഴുതുന്നു; എല്ലാ വർഷവും ആ ദിവസം കുടുംബം ഒരുമിച്ചുകൂടുന്നു. സ്നേഹം കല്ലറയിൽ അവസാനിക്കുന്നില്ല; അതു പ്രാർഥനയായി മാറുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: 1 തെസലോനിക്കാ 4:13–14, 17.",explain:"നാം സ്നേഹിക്കുന്നവർ മരിക്കുമ്പോൾ നമുക്കു സങ്കടമാണ്. പക്ഷേ യേശു മരിച്ചവരിൽനിന്ന് ഉയിർത്തു; അവിടുന്ന് അവരെയും ഉയിർപ്പിക്കും. അവർ ദൈവത്തോടൊപ്പം സന്തോഷത്തിലായിരിക്കാൻ നാം അവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നു.",intention:"നമ്മുടെ വല്യപ്പച്ചന്മാർക്കും വല്യമ്മച്ചിമാർക്കും മരിച്ച എല്ലാ കുടുംബാംഗങ്ങൾക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മുടെ കുടുംബത്തിൽ ആരാണു ദൈവത്തിന്റെ അടുത്തേക്കു പോയത്? അവരെപ്പറ്റി ഒരു നല്ല ഓർമ പറയാം.”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1030–1032","മരിച്ചവർക്കുവേണ്ടിയുള്ള പ്രാർഥന."],["മതബോധനഗ്രന്ഥം 1020–1029","സ്വർഗവും നിത്യജീവനും."]],
  kidsaint:["വിശുദ്ധ മോനിക്കാ","മകൻ ദൈവത്തിലേക്കു തിരിച്ചുവരുന്നതുവരെ വർഷങ്ങളോളം അവനുവേണ്ടി പ്രാർഥിച്ച വിശുദ്ധ അഗസ്റ്റിന്റെ അമ്മ. മരിക്കുംമുമ്പു ബലിപീഠത്തിങ്കൽ തന്നെ ഓർക്കണമെന്നു മാത്രമാണ് അവൾ അവനോട് ആവശ്യപ്പെട്ടത്. പാഠം: നീ സ്നേഹിക്കുന്നവർക്കുവേണ്ടി, ജീവിച്ചിരിക്കുന്നവർക്കും മരിച്ചവർക്കുംവേണ്ടി, പ്രാർഥിക്കുക."],
  term:["അനീദേ ഞായർ","“അനീദേ” എന്നതിന്റെ സുറിയാനിയിലെ അർഥം “മരിച്ചവർ” എന്നാണ്. കോഹ്നേ ഞായറിൽ മരിച്ച വൈദികരെ ഓർത്തശേഷം, വലിയ നോമ്പിനു മുമ്പുള്ള ഞായറാഴ്ച മലങ്കരസഭ മരിച്ച എല്ലാ വിശ്വാസികളെയും ഓർക്കുന്നു."],
  termMore:["എന്തുകൊണ്ടു മരിച്ചവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നു?","സ്നേഹം മരണത്തോടെ അവസാനിക്കാത്തതുകൊണ്ടും, ഇനിയും ശുദ്ധീകരണം ആവശ്യമുള്ള മരിച്ചവരെ ജീവിച്ചിരിക്കുന്നവരുടെ പ്രാർഥനകളും കാഴ്ചകളും സഹായിക്കുന്നതുകൊണ്ടും (2 മക്ക 12:45; മതബോധനഗ്രന്ഥം 1032)."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, കഴിഞ്ഞ ഞായറാഴ്ച നാം മരിച്ച വൈദികരെ ഓർത്തു. ഇന്ന്, അനീദേ ഞായറാഴ്ച, മരിച്ച എല്ലാ വിശ്വാസികളെയും നാം ഓർക്കുന്നു. ഒരു നിമിഷം നിശ്ശബ്ദരായി, നമുക്കു നഷ്ടപ്പെട്ടവരെ മനസ്സിലേക്കു കൊണ്ടുവരാം: ഒരു അപ്പൻ, ഒരു അമ്മ, ഒരു ഭർത്താവ്, ഒരു ഭാര്യ, ഒരു കുഞ്ഞ്, ഒരു സുഹൃത്ത്.","വിശുദ്ധ പൗലോസ് എഴുതുന്നു: പ്രത്യാശയില്ലാത്ത മറ്റുള്ളവരെപ്പോലെ നിങ്ങൾ ദുഃഖിക്കാതിരിക്കാൻ. “ദുഃഖിക്കരുത്” എന്ന് അദ്ദേഹം പറയുന്നില്ല. തന്റെ സുഹൃത്തിന്റെ കല്ലറയ്ക്കൽ യേശുതന്നെ കരഞ്ഞു. പക്ഷേ ക്രിസ്തു ഉയിർത്തതുകൊണ്ടു നമ്മുടെ ദുഃഖത്തിനു പ്രത്യാശയുണ്ട്. യേശു പറയുന്നു: “കല്ലറകളിലുള്ളവരെല്ലാം അവന്റെ സ്വരം ശ്രവിക്കുന്ന സമയം വരുന്നു.” ഒരുനാൾ നമ്മുടെ മരിച്ചവർ ആ സ്വരം കേൾക്കും.","എന്തുകൊണ്ടാണു നാം മരിച്ചവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നത്? മക്കബായരിൽനിന്നുള്ള വായന പറയുന്നു: മരിച്ചവർ ഉയിർക്കുമെന്നു പ്രതീക്ഷയില്ലായിരുന്നെങ്കിൽ അവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നതു ഭോഷത്തമാകുമായിരുന്നു. മരിച്ചവർ ശുദ്ധീകരിക്കപ്പെട്ടു ദൈവത്തിന്റെ സന്തോഷത്തിൽ പൂർണമായി പ്രവേശിക്കാൻ സഭ എന്നും അവർക്കുവേണ്ടി പ്രാർഥിക്കുകയും വിശുദ്ധ കുർബാന അർപ്പിക്കുകയും ചെയ്തിട്ടുണ്ട്. മരിക്കുംമുമ്പു വിശുദ്ധ മോനിക്കാ തന്റെ മകൻ അഗസ്റ്റിനോട് ഒന്നു മാത്രം ചോദിച്ചു: “കർത്താവിന്റെ ബലിപീഠത്തിങ്കൽ എന്നെ ഓർക്കുക.”","നാം എങ്ങനെ വിധിക്കപ്പെടുമെന്നു സന്ധ്യാസുവിശേഷം ഓർമിപ്പിക്കുന്നു: “എനിക്കു വിശന്നു; നിങ്ങൾ ഭക്ഷിക്കാൻ തന്നു… എന്റെ ഏറ്റവും എളിയ ഈ സഹോദരന്മാരിൽ ഒരുവന് നിങ്ങൾ ഇതു ചെയ്തുകൊടുത്തപ്പോൾ എനിക്കു തന്നെയാണു ചെയ്തുതന്നത്.” അടുത്ത ഞായറാഴ്ച വലിയ നോമ്പ് ആരംഭിക്കുന്നു. ജീവിതം ചെറുതാണെന്നും, സ്നേഹമാണു ബാക്കിയാകുന്നതെന്നും, നാമും കർത്താവിന്റെ അടുത്തേക്കാണു നടക്കുന്നതെന്നും ഓർത്തുകൊണ്ട് നമുക്ക് അതിലേക്കു പ്രവേശിക്കാം. കർത്താവേ, അവർക്കു നിത്യവിശ്രമം നൽകണമേ. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ദൈവത്തിന്റെ അടുത്തേക്കു പോയ ഒരു വല്യപ്പച്ചനോ വല്യമ്മച്ചിയോ നിങ്ങൾക്കുണ്ടോ? മരിച്ചുപോയ, നാം സ്നേഹിക്കുന്ന എല്ലാവരെയും ഇന്നു നാം ഓർക്കുന്നു.","നമുക്കു സങ്കടമുണ്ട്; പക്ഷേ പ്രത്യാശയുമുണ്ട്; കാരണം യേശു മരിച്ചവരിൽനിന്ന് ഉയിർത്തു; അവിടുന്ന് അവരെയും പുതിയ ജീവനിലേക്കു കൊണ്ടുവരും.","ഇന്നു രാത്രി അവരുടെ പേരു പറഞ്ഞു പ്രാർഥിക്കുക. നമുക്കു പറയാം: “യേശുവേ, അവരെ സ്വർഗത്തിൽ അങ്ങയോടൊപ്പം സന്തോഷത്തിൽ സൂക്ഷിക്കണമേ!”"]});
