 en:{t:"Holy Baptism",sub:"For the baptism of a child or an adult",
  read:[["Old Testament","Ezekiel 36:24–28"],["Epistle","Romans 6:3–11"],["Gospel","John 3:1–8 or Matthew 28:16–20"]],
  verse:"Very truly, I tell you, no one can enter the kingdom of God without being born of water and Spirit.",cite:"John 3:5",
  points:[["New birth","Baptism is not only a name-giving or a family custom. It is a new birth by water and the Spirit: original sin is washed away and the child becomes a child of God."],["Into the Church","The baptised person becomes a member of the Body of Christ, the Church. The whole parish receives a new member today."],["The white garment and the light","The white garment and the lighted candle are signs of a life to be kept pure and bright. In the Eastern Churches holy Myron (Chrismation) is given together with Baptism, sealing the gift of the Spirit."],["Parents and godparents","The promises made today are kept at home: morning and night prayer, the sign of the cross, Sunday {Q}."]],
  homily:["Dear parents, godparents and friends, today we bring this child to the font. Jesus said to Nicodemus, “No one can enter the kingdom of God without being born of water and Spirit.” What happens here is a birth: the child was born once to you; today the child is born to God.","In Baptism original sin is washed away, and this little one becomes a child of the Father, a brother or sister of Christ, and a temple of the Holy Spirit. The child also becomes a member of the Church. That is why we celebrate it in the church and not only at home: the whole parish receives a new member.","The white garment says: keep this life pure. The burning candle says: keep this light alive. But a candle cannot guard itself. Dear parents and godparents, the promises you make today must be kept in your home: in the first prayers you teach, in the sign of the cross you trace on this forehead, in the Sunday {Q} you never miss.","Let us thank God for this child, and let us all renew our own Baptism today. Each of us was once carried to the font like this. May we live as children of God. Amen."],
  prayer:"Heavenly Father, you have given this child a new birth by water and the Spirit. Keep the white garment unstained and the light of faith burning, and bless the parents and godparents who will lead this child to you. Amen."},
 ml:{t:"വിശുദ്ധ മാമ്മോദീസ",sub:"ഒരു കുഞ്ഞിന്റെയോ മുതിർന്നയാളിന്റെയോ മാമ്മോദീസയ്ക്ക്",
  read:[["പഴയനിയമം","എസെക്കിയേൽ 36:24–28"],["ലേഖനം","റോമാ 6:3–11"],["സുവിശേഷം","യോഹന്നാൻ 3:1–8 അല്ലെങ്കിൽ മത്തായി 28:16–20"]],
  verse:"സത്യം സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു, ജലത്താലും ആത്മാവിനാലും ജനിക്കുന്നില്ലെങ്കിൽ ഒരുവനും ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക സാധ്യമല്ല.",cite:"യോഹന്നാൻ 3:5",
  points:[["പുതിയ ജനനം","മാമ്മോദീസ ഒരു പേരിടൽ ചടങ്ങോ കുടുംബാചാരമോ മാത്രമല്ല. ജലത്താലും ആത്മാവിനാലുമുള്ള പുതിയ ജനനമാണ്: ഉത്ഭവപാപം കഴുകിക്കളയപ്പെടുന്നു; കുഞ്ഞ് ദൈവത്തിന്റെ മകനോ മകളോ ആകുന്നു."],["സഭയിലേക്ക്","മാമ്മോദീസ സ്വീകരിക്കുന്നയാൾ ക്രിസ്തുവിന്റെ ശരീരമായ സഭയിലെ അംഗമാകുന്നു. ഇന്ന് ഇടവക മുഴുവൻ ഒരു പുതിയ അംഗത്തെ സ്വീകരിക്കുന്നു."],["വെള്ളവസ്ത്രവും ദീപവും","വെള്ളവസ്ത്രവും കത്തിച്ച തിരിയും നിർമലവും ശോഭയുള്ളതുമായി കാക്കേണ്ട ഒരു ജീവിതത്തിന്റെ അടയാളങ്ങളാണ്. പൗരസ്ത്യസഭകളിൽ മാമ്മോദീസയോടൊപ്പംതന്നെ വിശുദ്ധ മൂറോൻ അഭിഷേകം (സ്ഥൈര്യലേപനം) നൽകി ആത്മാവിന്റെ ദാനം മുദ്രവയ്ക്കുന്നു."],["മാതാപിതാക്കളും തലതൊട്ടപ്പന്മാരും","ഇന്നു നൽകുന്ന വാഗ്ദാനങ്ങൾ വീട്ടിലാണു പാലിക്കപ്പെടുന്നത്: രാവിലെയും രാത്രിയുമുള്ള പ്രാർഥന, കുരിശുവര, ഞായറാഴ്ചത്തെ {Q}."]],
  homily:["പ്രിയ മാതാപിതാക്കളേ, തലതൊട്ടപ്പന്മാരേ, സുഹൃത്തുക്കളേ, ഇന്നു നാം ഈ കുഞ്ഞിനെ മാമ്മോദീസത്തൊട്ടിയിലേക്കു കൊണ്ടുവരുന്നു. യേശു നിക്കൊദേമോസിനോടു പറഞ്ഞു: “ജലത്താലും ആത്മാവിനാലും ജനിക്കുന്നില്ലെങ്കിൽ ഒരുവനും ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക സാധ്യമല്ല.” ഇവിടെ നടക്കുന്നത് ഒരു ജനനമാണ്: കുഞ്ഞ് ഒരിക്കൽ നിങ്ങൾക്കു ജനിച്ചു; ഇന്നു ദൈവത്തിനു ജനിക്കുന്നു.","മാമ്മോദീസയിൽ ഉത്ഭവപാപം കഴുകിക്കളയപ്പെടുന്നു; ഈ കുഞ്ഞ് പിതാവിന്റെ മകനും ക്രിസ്തുവിന്റെ സഹോദരനും പരിശുദ്ധാത്മാവിന്റെ ആലയവുമാകുന്നു. കുഞ്ഞ് സഭയിലെ അംഗവുമാകുന്നു. അതുകൊണ്ടാണ് ഇതു വീട്ടിൽ മാത്രമല്ല, പള്ളിയിൽ ആഘോഷിക്കുന്നത്: ഇടവക മുഴുവൻ ഒരു പുതിയ അംഗത്തെ സ്വീകരിക്കുന്നു.","വെള്ളവസ്ത്രം പറയുന്നു: ഈ ജീവിതം നിർമലമായി കാക്കുക. കത്തുന്ന തിരി പറയുന്നു: ഈ വെളിച്ചം അണയാതെ സൂക്ഷിക്കുക. പക്ഷേ ഒരു തിരിക്കു തന്നെത്താൻ കാക്കാനാവില്ല. പ്രിയ മാതാപിതാക്കളേ, തലതൊട്ടപ്പന്മാരേ, ഇന്നു നിങ്ങൾ നൽകുന്ന വാഗ്ദാനങ്ങൾ നിങ്ങളുടെ വീട്ടിലാണു പാലിക്കപ്പെടേണ്ടത്: നിങ്ങൾ പഠിപ്പിക്കുന്ന ആദ്യപ്രാർഥനകളിൽ, ഈ നെറ്റിയിൽ നിങ്ങൾ വരയ്ക്കുന്ന കുരിശടയാളത്തിൽ, ഒരിക്കലും മുടക്കാത്ത ഞായറാഴ്ചത്തെ {Q}യിൽ.","ഈ കുഞ്ഞിനുവേണ്ടി നമുക്കു ദൈവത്തിനു നന്ദി പറയാം; നമ്മുടെ സ്വന്തം മാമ്മോദീസ ഇന്നു നമുക്കു നവീകരിക്കാം. നാമോരോരുത്തരും ഒരിക്കൽ ഇതുപോലെ മാമ്മോദീസത്തൊട്ടിയിലേക്കു കൊണ്ടുവരപ്പെട്ടവരാണ്. ദൈവമക്കളായി നമുക്കു ജീവിക്കാം. ആമേൻ."],
  prayer:"സ്വർഗസ്ഥനായ പിതാവേ, ജലത്താലും ആത്മാവിനാലും ഈ കുഞ്ഞിന് അങ്ങു പുതിയ ജനനം നൽകി. വെള്ളവസ്ത്രം കളങ്കമില്ലാതെയും വിശ്വാസദീപം അണയാതെയും കാക്കണമേ; ഈ കുഞ്ഞിനെ അങ്ങയിലേക്കു നയിക്കുന്ന മാതാപിതാക്കളെയും തലതൊട്ടപ്പന്മാരെയും അനുഗ്രഹിക്കണമേ. ആമേൻ."}},

{id:"communion",
 en:{t:"First Holy Communion",sub:"For the day children receive the Body and Blood of the Lord for the first time",
  read:[["Old Testament","Exodus 16:2–4, 12–15"],["Epistle","1 Corinthians 11:23–26"],["Gospel","John 6:30–40 or Luke 22:14–20"]],
  verse:"I am the bread of life. Whoever comes to me will never be hungry, and whoever believes in me will never be thirsty.",cite:"John 6:35",
  points:[["Not a sign only","What the children receive today looks like bread, but it is truly the Body and Blood of Jesus, given for them."],["The manna and the true bread","God fed Israel in the desert with manna; Jesus gives himself as the bread that gives eternal life."],["A first, not a last","The danger is that First Communion becomes the last. Ask parents to bring the children every Sunday."],["Prepared hearts","Confession, the fast before Communion, reverence and thanksgiving afterwards."]],
  homily:["Dear children, today is one of the most beautiful days of your life. For many weeks you have prepared, learnt your prayers and made your first Confession. Today Jesus himself comes to live in your heart.","When the priest gives you the Holy Communion, it will look like bread. But Jesus said, “I am the bread of life.” It is really Jesus: his Body and Blood, his whole self, with all his love. In the desert God gave the people manna; today he gives you his own Son.","When you receive Jesus, close your eyes and speak to him. Thank him. Tell him about your family, your friends, your fears. He is listening. And remember: this is your first Holy Communion, not your last! Jesus wants to meet you every Sunday.","Dear parents, the beautiful clothes and photographs will soon be put away. Please do not put away the {Q}. Bring your children every Sunday, and receive with them. Amen."],
  prayer:"Lord Jesus, bread of life, today these children receive you for the first time. Stay in their hearts, make them hungry for you every Sunday, and keep them always close to you. Amen."},
 ml:{t:"ആദ്യകുർബാനസ്വീകരണം",sub:"കുഞ്ഞുങ്ങൾ ആദ്യമായി കർത്താവിന്റെ ശരീരരക്തങ്ങൾ സ്വീകരിക്കുന്ന ദിവസത്തിന്",
  read:[["പഴയനിയമം","പുറപ്പാട് 16:2–4, 12–15"],["ലേഖനം","1 കോറിന്തോസ് 11:23–26"],["സുവിശേഷം","യോഹന്നാൻ 6:30–40 അല്ലെങ്കിൽ ലൂക്കാ 22:14–20"]],
  verse:"ഞാനാണ് ജീവന്റെ അപ്പം. എന്റെ അടുത്തു വരുന്നവന് ഒരിക്കലും വിശക്കുകയില്ല. എന്നിൽ വിശ്വസിക്കുന്നവന് ദാഹിക്കുകയുമില്ല.",cite:"യോഹന്നാൻ 6:35",
  points:[["ഒരു അടയാളം മാത്രമല്ല","കുഞ്ഞുങ്ങൾ ഇന്നു സ്വീകരിക്കുന്നത് അപ്പംപോലെ കാണപ്പെടുന്നു; എന്നാൽ അതു യഥാർഥത്തിൽ അവർക്കായി നൽകപ്പെട്ട യേശുവിന്റെ ശരീരവും രക്തവുമാണ്."],["മന്നായും യഥാർഥ അപ്പവും","മരുഭൂമിയിൽ ദൈവം ഇസ്രായേലിനെ മന്നാകൊണ്ടു പോഷിപ്പിച്ചു; നിത്യജീവൻ നൽകുന്ന അപ്പമായി യേശു തന്നെത്തന്നെ നൽകുന്നു."],["ആദ്യത്തേത്, അവസാനത്തേതല്ല","ആദ്യകുർബാന അവസാനകുർബാനയാകുന്നതാണ് അപകടം. എല്ലാ ഞായറാഴ്ചയും കുഞ്ഞുങ്ങളെ കൊണ്ടുവരാൻ മാതാപിതാക്കളോട് ആവശ്യപ്പെടുക."],["ഒരുങ്ങിയ ഹൃദയങ്ങൾ","കുമ്പസാരം, കുർബാനസ്വീകരണത്തിനു മുമ്പുള്ള ഉപവാസം, ഭക്ത്യാദരം, സ്വീകരണശേഷമുള്ള നന്ദിപ്രകാശനം."]],
  homily:["പ്രിയ കുഞ്ഞുങ്ങളേ, ഇന്നു നിങ്ങളുടെ ജീവിതത്തിലെ ഏറ്റവും മനോഹരമായ ദിവസങ്ങളിലൊന്നാണ്. ആഴ്ചകളോളം നിങ്ങൾ ഒരുങ്ങി, പ്രാർഥനകൾ പഠിച്ചു, ആദ്യത്തെ കുമ്പസാരം നടത്തി. ഇന്നു യേശുതന്നെ നിങ്ങളുടെ ഹൃദയത്തിൽ വസിക്കാൻ വരുന്നു.","വൈദികൻ നിങ്ങൾക്കു വിശുദ്ധ കുർബാന നൽകുമ്പോൾ അത് അപ്പംപോലെ കാണപ്പെടും. പക്ഷേ യേശു പറഞ്ഞു: “ഞാനാണ് ജീവന്റെ അപ്പം.” അതു യഥാർഥത്തിൽ യേശുവാണ്: അവിടുത്തെ ശരീരവും രക്തവും, അവിടുത്തെ സ്നേഹം മുഴുവനോടുംകൂടെ. മരുഭൂമിയിൽ ദൈവം ജനത്തിനു മന്നാ നൽകി; ഇന്ന് അവിടുന്നു തന്റെ സ്വന്തം പുത്രനെ നിങ്ങൾക്കു നൽകുന്നു.","യേശുവിനെ സ്വീകരിക്കുമ്പോൾ കണ്ണുകളടച്ച് അവിടുത്തോടു സംസാരിക്കുക. നന്ദി പറയുക. നിങ്ങളുടെ കുടുംബത്തെയും കൂട്ടുകാരെയും പേടികളെയുംപറ്റി പറയുക. അവിടുന്നു കേൾക്കുന്നുണ്ട്. ഓർക്കുക: ഇതു നിങ്ങളുടെ ആദ്യകുർബാനയാണ്, അവസാനത്തേതല്ല! എല്ലാ ഞായറാഴ്ചയും നിങ്ങളെ കാണാൻ യേശു ആഗ്രഹിക്കുന്നു.","പ്രിയ മാതാപിതാക്കളേ, മനോഹരമായ വസ്ത്രങ്ങളും ഫോട്ടോകളും താമസിയാതെ മാറ്റിവയ്ക്കപ്പെടും. {Q}യെ ദയവായി മാറ്റിവയ്ക്കരുത്. എല്ലാ ഞായറാഴ്ചയും കുഞ്ഞുങ്ങളെ കൊണ്ടുവരുക; അവരോടൊപ്പം നിങ്ങളും സ്വീകരിക്കുക. ആമേൻ."],
  prayer:"ജീവന്റെ അപ്പമായ കർത്താവായ യേശുവേ, ഇന്ന് ഈ കുഞ്ഞുങ്ങൾ ആദ്യമായി അങ്ങയെ സ്വീകരിക്കുന്നു. അവരുടെ ഹൃദയങ്ങളിൽ വസിക്കണമേ; എല്ലാ ഞായറാഴ്ചയും അങ്ങേക്കായി അവരിൽ വിശപ്പുണർത്തണമേ; അവരെ എപ്പോഴും അങ്ങയോടു ചേർത്തു കാക്കണമേ. ആമേൻ."}},

{id:"confirmation",rites:["lat"],
 en:{t:"Confirmation",sub:"For the celebration of the sacrament of Confirmation",
  read:[["Old Testament","Isaiah 11:1–4"],["Acts","Acts 2:1–6, 14, 22–24"],["Gospel","John 14:15–17 or Luke 4:16–21"]],
  verse:"But you will receive power when the Holy Spirit has come upon you; and you will be my witnesses in Jerusalem, in all Judea and Samaria, and to the ends of the earth.",cite:"Acts 1:8",
  points:[["The seal of the Spirit","Confirmation completes the grace of Baptism. The bishop anoints with chrism: “Be sealed with the Gift of the Holy Spirit.”"],["The seven gifts","Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord (Isaiah 11:2)."],["Witnesses","Not a graduation from the Church, but a sending into the world as witnesses."],["A practical gift","Name one place where each young person will need courage this year: school, friends, social media."]],
  homily:["Dear young people, today the Holy Spirit comes upon you in a new way. You were baptised as infants; others spoke for you. Today you say your own “yes”, and the Church seals you with the Gift of the Holy Spirit.","At Pentecost the frightened apostles became bold witnesses. The same Spirit gives you his seven gifts: wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. These are not ornaments; they are tools for life.","Confirmation is sometimes treated as the end of catechism, the day after which we need not come to church. It is exactly the opposite. Jesus says, “You will be my witnesses.” You are being sent: to your school, your friends, your phone, your future work.","Ask the Holy Spirit today for one gift you need most. And come back next Sunday to the {Q}, where the Spirit keeps strengthening you. Amen."],
  prayer:"Come, Holy Spirit, fill the hearts of these young people. Seal them with your gifts, make them brave witnesses of Christ, and keep them faithful all their lives. Amen."},
 ml:{t:"സ്ഥൈര്യലേപനം",sub:"സ്ഥൈര്യലേപനകൂദാശയുടെ ആഘോഷത്തിന്",
  read:[["പഴയനിയമം","ഏശയ്യാ 11:1–4"],["അപ്പസ്തോലപ്രവർത്തനങ്ങൾ","അപ്പ. പ്രവ. 2:1–6, 14, 22–24"],["സുവിശേഷം","യോഹന്നാൻ 14:15–17 അല്ലെങ്കിൽ ലൂക്കാ 4:16–21"]],
  verse:"എന്നാൽ, പരിശുദ്ധാത്മാവു നിങ്ങളുടെമേൽ വന്നുകഴിയുമ്പോൾ നിങ്ങൾ ശക്തിപ്രാപിക്കും. ജറുസലെമിലും യൂദയാ മുഴുവനിലും സമരിയായിലും ഭൂമിയുടെ അതിർത്തികൾ വരെയും നിങ്ങൾ എനിക്കു സാക്ഷികളായിരിക്കുകയും ചെയ്യും.",cite:"അപ്പ. പ്രവ. 1:8",
  points:[["ആത്മാവിന്റെ മുദ്ര","സ്ഥൈര്യലേപനം മാമ്മോദീസയുടെ കൃപ പൂർത്തിയാക്കുന്നു. മെത്രാൻ വിശുദ്ധ തൈലംകൊണ്ട് അഭിഷേകം ചെയ്യുന്നു: പരിശുദ്ധാത്മാവിന്റെ ദാനത്താൽ മുദ്രിതനാകുക."],["ഏഴു ദാനങ്ങൾ","ജ്ഞാനം, ബുദ്ധി, ആലോചന, ആത്മശക്തി, അറിവ്, ഭക്തി, ദൈവഭയം (ഏശയ്യാ 11:2)."],["സാക്ഷികൾ","സഭയിൽനിന്നുള്ള ഒരു ബിരുദദാനമല്ല; സാക്ഷികളായി ലോകത്തിലേക്കുള്ള ഒരു അയയ്ക്കലാണ്."],["പ്രായോഗികമായ ഒരു ദാനം","ഈ വർഷം ഓരോ യുവാവിനും ധൈര്യം ആവശ്യമായിവരുന്ന ഒരിടം പറയുക: സ്കൂൾ, കൂട്ടുകാർ, സാമൂഹികമാധ്യമങ്ങൾ."]],
  homily:["പ്രിയ യുവജനങ്ങളേ, ഇന്നു പരിശുദ്ധാത്മാവ് ഒരു പുതിയ വിധത്തിൽ നിങ്ങളുടെമേൽ വരുന്നു. ശിശുക്കളായിരിക്കുമ്പോൾ നിങ്ങൾ മാമ്മോദീസ സ്വീകരിച്ചു; അന്നു മറ്റുള്ളവർ നിങ്ങൾക്കുവേണ്ടി സംസാരിച്ചു. ഇന്നു നിങ്ങൾ സ്വന്തമായി “അതെ” എന്നു പറയുന്നു; പരിശുദ്ധാത്മാവിന്റെ ദാനത്താൽ സഭ നിങ്ങളെ മുദ്രിതരാക്കുന്നു.","പന്തക്കുസ്തായിൽ ഭയന്നിരുന്ന ശ്ലീഹന്മാർ ധീരരായ സാക്ഷികളായി. അതേ ആത്മാവ് തന്റെ ഏഴു ദാനങ്ങൾ നിങ്ങൾക്കു നൽകുന്നു: ജ്ഞാനം, ബുദ്ധി, ആലോചന, ആത്മശക്തി, അറിവ്, ഭക്തി, ദൈവഭയം. ഇവ ആഭരണങ്ങളല്ല; ജീവിതത്തിനുള്ള ഉപകരണങ്ങളാണ്.","ചിലപ്പോൾ സ്ഥൈര്യലേപനം മതബോധനത്തിന്റെ അവസാനമായി, അതിനുശേഷം പള്ളിയിൽ വരേണ്ടതില്ലാത്ത ദിവസമായി, കാണപ്പെടുന്നു. സത്യം നേരേ മറിച്ചാണ്. യേശു പറയുന്നു: “നിങ്ങൾ എനിക്കു സാക്ഷികളായിരിക്കും.” നിങ്ങൾ അയയ്ക്കപ്പെടുകയാണ്: നിങ്ങളുടെ സ്കൂളിലേക്ക്, കൂട്ടുകാരിലേക്ക്, നിങ്ങളുടെ ഫോണിലേക്ക്, നിങ്ങളുടെ ഭാവി ജോലിയിലേക്ക്.","നിങ്ങൾക്ക് ഏറ്റവും ആവശ്യമുള്ള ഒരു ദാനം ഇന്നു പരിശുദ്ധാത്മാവിനോടു ചോദിക്കുക. അടുത്ത ഞായറാഴ്ച {Q}യിലേക്കു തിരിച്ചുവരുക; അവിടെ ആത്മാവു നിങ്ങളെ നിരന്തരം ശക്തിപ്പെടുത്തുന്നു. ആമേൻ."],
  prayer:"പരിശുദ്ധാത്മാവേ, എഴുന്നള്ളിവരണമേ; ഈ യുവജനങ്ങളുടെ ഹൃദയങ്ങളെ നിറയ്ക്കണമേ. അങ്ങയുടെ ദാനങ്ങളാൽ അവരെ മുദ്രിതരാക്കണമേ; ക്രിസ്തുവിന്റെ ധീരസാക്ഷികളാക്കണമേ; ജീവിതകാലം മുഴുവൻ വിശ്വസ്തരായി കാക്കണമേ. ആമേൻ."}},

{id:"betrothal",
 en:{t:"Betrothal (Manasammatham)",sub:"For the betrothal or engagement in church before marriage",
  read:[["Old Testament","Genesis 2:18–24"],["Epistle","1 Corinthians 13:1–8"],["Gospel","John 15:9–12"]],
  verse:"It is not good that the man should be alone; I will make him a helper as his partner.",cite:"Genesis 2:18",
  points:[["A free consent","The heart of the betrothal is a free promise. No one may be forced; the Church asks, and each answers freely."],["God's plan from the beginning","“It is not good that the man should be alone.” Marriage is God's idea before it is ours."],["Love that is patient","1 Corinthians 13 describes love as a decision, not only a feeling."],["The time of preparation","Prayer together, the marriage preparation course, a good Confession, honesty about finances and families, and chastity."]],
  homily:["Dear brother and sister, today you stand before God and his Church and declare your intention to marry. This is not yet the wedding, but it is a holy beginning. The Church asks you whether you come freely, and you answer for yourselves.","In the very first pages of the Bible God says: “It is not good that the man should be alone; I will make him a helper as his partner.” Your love is not an accident. It belongs to God's plan from the beginning.","The weeks before a wedding are often filled with halls, dresses, food and invitations. Do not let them steal the real preparation. Pray together. Take the marriage preparation course seriously. Speak honestly about your families, your money and your hopes. Make a good Confession before the wedding.","St Paul tells us that love is patient and kind, that it bears all things and hopes all things. Ask God for that love now, and you will carry it into your marriage. Amen."],
  prayer:"Lord God, you created man and woman for each other. Bless these two who have promised to marry; prepare their hearts by your grace, and lead them in purity and joy to the day of their wedding. Amen."},
 ml:{t:"മനസ്സമ്മതം",sub:"വിവാഹത്തിനു മുമ്പു പള്ളിയിൽ നടക്കുന്ന മനസ്സമ്മതത്തിന്",
  read:[["പഴയനിയമം","ഉൽപത്തി 2:18–24"],["ലേഖനം","1 കോറിന്തോസ് 13:1–8"],["സുവിശേഷം","യോഹന്നാൻ 15:9–12"]],
  verse:"മനുഷ്യൻ ഏകനായിരിക്കുന്നതു നന്നല്ല; അവനു ചേർന്ന ഇണയെ ഞാൻ നൽകും.",cite:"ഉൽപത്തി 2:18",
  points:[["സ്വതന്ത്രമായ സമ്മതം","മനസ്സമ്മതത്തിന്റെ ഹൃദയം സ്വതന്ത്രമായ ഒരു വാഗ്ദാനമാണ്. ആരെയും നിർബന്ധിക്കാനാവില്ല; സഭ ചോദിക്കുന്നു, ഓരോരുത്തരും സ്വതന്ത്രമായി ഉത്തരം നൽകുന്നു."],["ആദിമുതലുള്ള ദൈവികപദ്ധതി","“മനുഷ്യൻ ഏകനായിരിക്കുന്നതു നന്നല്ല.” വിവാഹം നമ്മുടേതാകുംമുമ്പേ ദൈവത്തിന്റെ ആശയമാണ്."],["ക്ഷമയുള്ള സ്നേഹം","1 കോറിന്തോസ് 13 സ്നേഹത്തെ ഒരു വികാരം മാത്രമായല്ല, ഒരു തീരുമാനമായി വിവരിക്കുന്നു."],["ഒരുക്കത്തിന്റെ കാലം","ഒന്നിച്ചുള്ള പ്രാർഥന, വിവാഹ ഒരുക്ക കോഴ്സ്, നല്ല ഒരു കുമ്പസാരം, കുടുംബങ്ങളെയും സാമ്പത്തികകാര്യങ്ങളെയുംപറ്റിയുള്ള തുറന്ന സംസാരം, നിർമലത."]],
  homily:["പ്രിയ സഹോദരാ, സഹോദരീ, ഇന്നു നിങ്ങൾ ദൈവത്തിന്റെയും അവിടുത്തെ സഭയുടെയും മുമ്പിൽനിന്നു വിവാഹം കഴിക്കാനുള്ള നിങ്ങളുടെ ഉദ്ദേശ്യം പ്രഖ്യാപിക്കുന്നു. ഇതു വിവാഹമല്ല; എങ്കിലും ഒരു വിശുദ്ധമായ ആരംഭമാണ്. നിങ്ങൾ സ്വതന്ത്രമായാണോ വരുന്നതെന്നു സഭ ചോദിക്കുന്നു; നിങ്ങൾ സ്വന്തമായി ഉത്തരം നൽകുന്നു.","ബൈബിളിന്റെ ആദ്യതാളുകളിൽത്തന്നെ ദൈവം പറയുന്നു: “മനുഷ്യൻ ഏകനായിരിക്കുന്നതു നന്നല്ല; അവനു ചേർന്ന ഇണയെ ഞാൻ നൽകും.” നിങ്ങളുടെ സ്നേഹം ഒരു യാദൃച്ഛികസംഭവമല്ല. ആദിമുതലുള്ള ദൈവികപദ്ധതിയുടെ ഭാഗമാണ്.","വിവാഹത്തിനു മുമ്പുള്ള ആഴ്ചകൾ പലപ്പോഴും ഹാളുകളും വസ്ത്രങ്ങളും ഭക്ഷണവും ക്ഷണക്കത്തുകളുംകൊണ്ടു നിറഞ്ഞിരിക്കും. യഥാർഥ ഒരുക്കം അവ കവർന്നെടുക്കാൻ അനുവദിക്കരുത്. ഒന്നിച്ചു പ്രാർഥിക്കുക. വിവാഹ ഒരുക്ക കോഴ്സ് ഗൗരവമായെടുക്കുക. നിങ്ങളുടെ കുടുംബങ്ങളെയും പണത്തെയും പ്രതീക്ഷകളെയുംപറ്റി തുറന്നു സംസാരിക്കുക. വിവാഹത്തിനു മുമ്പു നല്ല ഒരു കുമ്പസാരം നടത്തുക.","സ്നേഹം ക്ഷമയും ദയയുമുള്ളതാണെന്നും, എല്ലാം സഹിക്കുന്നതും എല്ലാം പ്രത്യാശിക്കുന്നതുമാണെന്നും വിശുദ്ധ പൗലോസ് നമ്മോടു പറയുന്നു. ആ സ്നേഹം ഇപ്പോൾത്തന്നെ ദൈവത്തോടു ചോദിക്കുക; നിങ്ങളുടെ വിവാഹജീവിതത്തിലേക്കു നിങ്ങൾ അതു കൊണ്ടുപോകും. ആമേൻ."],
  prayer:"കർത്താവായ ദൈവമേ, പുരുഷനെയും സ്ത്രീയെയും പരസ്പരം അങ്ങു സൃഷ്ടിച്ചു. വിവാഹം കഴിക്കാമെന്നു വാഗ്ദാനം ചെയ്ത ഇവരെ അനുഗ്രഹിക്കണമേ; അങ്ങയുടെ കൃപയാൽ അവരുടെ ഹൃദയങ്ങളെ ഒരുക്കണമേ; നിർമലതയിലും സന്തോഷത്തിലും അവരുടെ വിവാഹദിനത്തിലേക്ക് അവരെ നയിക്കണമേ. ആമേൻ."}},

{id:"marriage",
 en:{t:"Holy Matrimony",sub:"For the celebration of marriage",
  read:[["Old Testament","Genesis 1:26–28, 31 or Tobit 8:4–8"],["Epistle","Ephesians 5:21–33"],["Gospel","Matthew 19:3–6 or John 2:1–11"]],
  verse:"So they are no longer two, but one flesh. Therefore what God has joined together, let no one separate.",cite:"Matthew 19:6",
  points:[["A covenant, not a contract","Marriage is a covenant of the whole life, sealed before God; for the baptised it is a sacrament."],["Christ and the Church","St Paul compares the love of husband and wife to the love of Christ for his Church: faithful, self-giving, to the cross."],["One, faithful, for ever","“What God has joined together, let no one separate.” Unity, fidelity, openness to life."],["Invite Jesus","At Cana the wine ran out. In every marriage it sometimes does. Keep Jesus and Mary at the table."]],
  homily:["Dear bride and bridegroom, dear families, today two lives become one. Jesus said: “They are no longer two, but one flesh. Therefore what God has joined together, let no one separate.” What happens at this altar is not only a promise between you; it is God himself joining you.","Marriage is a covenant, not a contract. A contract says, “I will give as long as you give.” A covenant says, “I give myself, whatever comes.” St Paul tells husbands and wives to love as Christ loved the Church. And how did Christ love? To the cross.","At Cana the wine ran out in the middle of the wedding. In every marriage, at some time, the wine runs out: patience, money, health, feelings. Do what Mary said: “Do whatever he tells you.” Keep Jesus in your home. Pray together every day. Forgive before you sleep. Come together to the {Q}.","Dear families, support this new home with your prayers and your respect, not with interference. And may God, who began this good work in you today, bring it to completion. Amen."],
  prayer:"Lord God, you have joined these two in holy marriage. Make their love faithful and fruitful, keep Jesus and Mary in their home, and when the wine runs short, fill their jars again. Amen."},
 ml:{t:"വിവാഹം",sub:"വിവാഹകൂദാശയുടെ ആഘോഷത്തിന്",
  read:[["പഴയനിയമം","ഉൽപത്തി 1:26–28, 31 അല്ലെങ്കിൽ തോബിത് 8:4–8"],["ലേഖനം","എഫേസോസ് 5:21–33"],["സുവിശേഷം","മത്തായി 19:3–6 അല്ലെങ്കിൽ യോഹന്നാൻ 2:1–11"]],
  verse:"പിന്നീടൊരിക്കലും അവർ രണ്ടല്ല, ഒറ്റ ശരീരമായിരിക്കും. ആകയാൽ, ദൈവം യോജിപ്പിച്ചതു മനുഷ്യൻ വേർപെടുത്താതിരിക്കട്ടെ.",cite:"മത്തായി 19:6",
  points:[["ഉടമ്പടി, കരാറല്ല","ദൈവസന്നിധിയിൽ മുദ്രവയ്ക്കപ്പെടുന്ന, ജീവിതം മുഴുവനുമുള്ള ഒരു ഉടമ്പടിയാണു വിവാഹം; മാമ്മോദീസ സ്വീകരിച്ചവർക്ക് അതൊരു കൂദാശയാണ്."],["ക്രിസ്തുവും സഭയും","ഭാര്യാഭർത്താക്കന്മാരുടെ സ്നേഹത്തെ ക്രിസ്തുവിനു സഭയോടുള്ള സ്നേഹത്തോടു വിശുദ്ധ പൗലോസ് ഉപമിക്കുന്നു: വിശ്വസ്തം, ആത്മദാനപരം, കുരിശോളം."],["ഏകം, വിശ്വസ്തം, എന്നേക്കും","“ദൈവം യോജിപ്പിച്ചതു മനുഷ്യൻ വേർപെടുത്താതിരിക്കട്ടെ.” ഐക്യം, വിശ്വസ്തത, ജീവനോടുള്ള തുറവി."],["യേശുവിനെ ക്ഷണിക്കുക","കാനായിൽ വീഞ്ഞു തീർന്നുപോയി. ഓരോ കുടുംബത്തിലും ചിലപ്പോൾ അതു സംഭവിക്കുന്നു. യേശുവിനെയും മറിയത്തെയും മേശയിൽ കൂടെ നിർത്തുക."]],
  homily:["പ്രിയ വധൂവരന്മാരേ, പ്രിയ കുടുംബാംഗങ്ങളേ, ഇന്നു രണ്ടു ജീവിതങ്ങൾ ഒന്നാകുന്നു. യേശു പറഞ്ഞു: “പിന്നീടൊരിക്കലും അവർ രണ്ടല്ല, ഒറ്റ ശരീരമായിരിക്കും. ആകയാൽ, ദൈവം യോജിപ്പിച്ചതു മനുഷ്യൻ വേർപെടുത്താതിരിക്കട്ടെ.” ഈ ബലിപീഠത്തിനു മുമ്പിൽ നടക്കുന്നതു നിങ്ങൾ തമ്മിലുള്ള ഒരു വാഗ്ദാനം മാത്രമല്ല; ദൈവംതന്നെ നിങ്ങളെ യോജിപ്പിക്കുകയാണ്.","വിവാഹം ഒരു ഉടമ്പടിയാണ്, കരാറല്ല. കരാർ പറയുന്നു: “നീ തരുന്നിടത്തോളം ഞാൻ തരും.” ഉടമ്പടി പറയുന്നു: “എന്തു വന്നാലും ഞാൻ എന്നെത്തന്നെ നൽകുന്നു.” ക്രിസ്തു സഭയെ സ്നേഹിച്ചതുപോലെ സ്നേഹിക്കാൻ വിശുദ്ധ പൗലോസ് ഭാര്യാഭർത്താക്കന്മാരോടു പറയുന്നു. ക്രിസ്തു എങ്ങനെയാണു സ്നേഹിച്ചത്? കുരിശോളം.","കാനായിൽ വിവാഹത്തിനിടയിൽ വീഞ്ഞു തീർന്നുപോയി. ഓരോ കുടുംബജീവിതത്തിലും, ഏതെങ്കിലും ഒരു സമയത്ത്, വീഞ്ഞു തീരുന്നു: ക്ഷമ, പണം, ആരോഗ്യം, വികാരങ്ങൾ. മറിയം പറഞ്ഞതു ചെയ്യുക: “അവൻ നിങ്ങളോടു പറയുന്നതു ചെയ്യുവിൻ.” യേശുവിനെ നിങ്ങളുടെ വീട്ടിൽ നിർത്തുക. എല്ലാ ദിവസവും ഒന്നിച്ചു പ്രാർഥിക്കുക. ഉറങ്ങുംമുമ്പു ക്ഷമിക്കുക. ഒന്നിച്ചു {Q}യിൽ പങ്കെടുക്കുക.","പ്രിയ കുടുംബാംഗങ്ങളേ, ഇടപെടലുകൾകൊണ്ടല്ല, നിങ്ങളുടെ പ്രാർഥനകൾകൊണ്ടും ആദരവുകൊണ്ടും ഈ പുതിയ ഭവനത്തെ താങ്ങുക. ഇന്നു നിങ്ങളിൽ ഈ നല്ല പ്രവൃത്തി ആരംഭിച്ച ദൈവം അതു പൂർത്തിയാക്കട്ടെ. ആമേൻ."],
  prayer:"കർത്താവായ ദൈവമേ, വിശുദ്ധ വിവാഹത്തിൽ ഇവരെ അങ്ങു യോജിപ്പിച്ചു. അവരുടെ സ്നേഹം വിശ്വസ്തവും ഫലദായകവുമാക്കണമേ; യേശുവിനെയും മറിയത്തെയും അവരുടെ ഭവനത്തിൽ വസിപ്പിക്കണമേ; വീഞ്ഞു കുറയുമ്പോൾ അവരുടെ ഭരണികൾ വീണ്ടും നിറയ്ക്കണമേ. ആമേൻ."}},

{id:"ordination",
 en:{t:"Priestly Ordination and First {Q}",sub:"For an ordination or a new priest's first celebration",
  read:[["Old Testament","Isaiah 61:1–3 or Jeremiah 1:4–9"],["Epistle","Hebrews 5:1–10"],["Gospel","John 15:9–17"]],
  verse:"You did not choose me but I chose you. And I appointed you to go and bear fruit, fruit that will last.",cite:"John 15:16",
  points:[["Chosen, not self-made","A priest does not choose himself; Christ chooses and the Church calls through the bishop."],["Taken from among the people","“Every high priest chosen from among mortals is put in charge of things pertaining to God on their behalf” (Hebrews 5:1). He remains one of us and is given for us."],["In the person of Christ","At the altar and in the confessional, the priest acts in the person of Christ the Head. The gift is greater than the man."],["The family and the parish","Thank the parents who gave a son; pray for vocations from this parish."]],
  homily:["Dear brothers and sisters, today is a day of great joy for this parish and this family. One of our own stands at the altar as a priest of Jesus Christ. Jesus says to him: “You did not choose me but I chose you.”","A priest is taken from among the people and given back to the people. He is not an angel; he is a son of this soil, with his own weaknesses. That is exactly why God's choice is so moving. Through his hands bread and wine will become the Body and Blood of Christ; through his words sins will be forgiven. The gift is far greater than the man.","Dear new priest, Jesus appointed you “to go and bear fruit, fruit that will last.” The fruit that lasts is not buildings or popularity; it is souls brought to God. Stay close to the Lord in prayer, love the poor, and never be ashamed to ask for forgiveness.","Dear parents, thank you for giving your son to God. Dear parish, pray for him every day, and pray that more of your sons and daughters will hear the call. Amen."],
  prayer:"Lord Jesus, eternal High Priest, you have chosen this servant for your altar. Keep him holy, humble and joyful; make his priesthood bear fruit that will last, and raise up many more labourers for your harvest. Amen."},
 ml:{t:"പൗരോഹിത്യാഭിഷേകവും പ്രഥമ {Q}യും",sub:"ഒരു പൗരോഹിത്യാഭിഷേകത്തിനോ നവവൈദികന്റെ പ്രഥമബലിക്കോ",
  read:[["പഴയനിയമം","ഏശയ്യാ 61:1–3 അല്ലെങ്കിൽ ജറെമിയാ 1:4–9"],["ലേഖനം","ഹെബ്രായർ 5:1–10"],["സുവിശേഷം","യോഹന്നാൻ 15:9–17"]],
  verse:"നിങ്ങൾ എന്നെ തെരഞ്ഞെടുക്കുകയല്ല, ഞാൻ നിങ്ങളെ തെരഞ്ഞെടുക്കുകയാണു ചെയ്തത്. നിങ്ങൾ പോയി ഫലം പുറപ്പെടുവിക്കുന്നതിനും നിങ്ങളുടെ ഫലം നിലനിൽക്കുന്നതിനും വേണ്ടി ഞാൻ നിങ്ങളെ നിയോഗിച്ചിരിക്കുന്നു.",cite:"യോഹന്നാൻ 15:16",
  points:[["തിരഞ്ഞെടുക്കപ്പെട്ടവൻ, സ്വയം നിർമിതനല്ല","ഒരു വൈദികൻ തന്നെത്തന്നെ തിരഞ്ഞെടുക്കുന്നില്ല; ക്രിസ്തു തിരഞ്ഞെടുക്കുന്നു; മെത്രാനിലൂടെ സഭ വിളിക്കുന്നു."],["ജനങ്ങളുടെ ഇടയിൽനിന്ന്","ജനങ്ങളുടെ ഇടയിൽനിന്ന് എടുക്കപ്പെടുന്ന ഓരോ പ്രധാനപുരോഹിതനും ദൈവികകാര്യങ്ങളിൽ ജനങ്ങൾക്കുവേണ്ടി നിയമിക്കപ്പെടുന്നു (ഹെബ്രാ 5:1). അദ്ദേഹം നമ്മിലൊരാളായി തുടരുന്നു; നമുക്കായി നൽകപ്പെടുന്നു."],["ക്രിസ്തുവിന്റെ വ്യക്തിത്വത്തിൽ","ബലിപീഠത്തിലും കുമ്പസാരക്കൂട്ടിലും ശിരസ്സായ ക്രിസ്തുവിന്റെ വ്യക്തിത്വത്തിലാണു വൈദികൻ പ്രവർത്തിക്കുന്നത്. ദാനം മനുഷ്യനെക്കാൾ വലുതാണ്."],["കുടുംബവും ഇടവകയും","ഒരു മകനെ നൽകിയ മാതാപിതാക്കൾക്കു നന്ദി പറയുക; ഈ ഇടവകയിൽനിന്നുള്ള ദൈവവിളികൾക്കായി പ്രാർഥിക്കുക."]],
  homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്ന് ഈ ഇടവകയ്ക്കും ഈ കുടുംബത്തിനും വലിയ സന്തോഷത്തിന്റെ ദിവസമാണ്. നമ്മിലൊരാൾ യേശുക്രിസ്തുവിന്റെ പുരോഹിതനായി ബലിപീഠത്തിൽ നിൽക്കുന്നു. യേശു അദ്ദേഹത്തോടു പറയുന്നു: “നിങ്ങൾ എന്നെ തെരഞ്ഞെടുക്കുകയല്ല, ഞാൻ നിങ്ങളെ തെരഞ്ഞെടുക്കുകയാണു ചെയ്തത്.”","വൈദികൻ ജനങ്ങളുടെ ഇടയിൽനിന്ന് എടുക്കപ്പെട്ടു ജനങ്ങൾക്കുതന്നെ തിരികെ നൽകപ്പെടുന്നു. അദ്ദേഹം ഒരു മാലാഖയല്ല; സ്വന്തം ബലഹീനതകളുള്ള ഈ മണ്ണിന്റെ മകനാണ്. അതുകൊണ്ടുതന്നെയാണു ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പ് ഇത്ര ഹൃദയസ്പർശിയാകുന്നത്. അദ്ദേഹത്തിന്റെ കരങ്ങളിലൂടെ അപ്പവും വീഞ്ഞും ക്രിസ്തുവിന്റെ ശരീരവും രക്തവുമാകും; അദ്ദേഹത്തിന്റെ വാക്കുകളിലൂടെ പാപങ്ങൾ മോചിക്കപ്പെടും. ദാനം മനുഷ്യനെക്കാൾ എത്രയോ വലുതാണ്.","പ്രിയ നവവൈദികാ, “പോയി ഫലം പുറപ്പെടുവിക്കുന്നതിനും നിങ്ങളുടെ ഫലം നിലനിൽക്കുന്നതിനും വേണ്ടി” യേശു അങ്ങയെ നിയോഗിച്ചിരിക്കുന്നു. നിലനിൽക്കുന്ന ഫലം കെട്ടിടങ്ങളോ ജനപ്രീതിയോ അല്ല; ദൈവത്തിലേക്കു കൊണ്ടുവരപ്പെടുന്ന ആത്മാക്കളാണ്. പ്രാർഥനയിൽ കർത്താവിനോടു ചേർന്നുനിൽക്കുക, ദരിദ്രരെ സ്നേഹിക്കുക, ക്ഷമ ചോദിക്കാൻ ഒരിക്കലും ലജ്ജിക്കാതിരിക്കുക.","പ്രിയ മാതാപിതാക്കളേ, നിങ്ങളുടെ മകനെ ദൈവത്തിനു നൽകിയതിനു നന്ദി. പ്രിയ ഇടവകാംഗങ്ങളേ, എല്ലാ ദിവസവും അദ്ദേഹത്തിനുവേണ്ടി പ്രാർഥിക്കുക; നിങ്ങളുടെ കൂടുതൽ മക്കൾ ആ വിളി കേൾക്കാനും പ്രാർഥിക്കുക. ആമേൻ."],
  prayer:"നിത്യപുരോഹിതനായ കർത്താവായ യേശുവേ, അങ്ങയുടെ ബലിപീഠത്തിനായി ഈ ദാസനെ അങ്ങു തിരഞ്ഞെടുത്തു. അദ്ദേഹത്തെ വിശുദ്ധനും വിനീതനും സന്തോഷവാനുമായി കാക്കണമേ; അദ്ദേഹത്തിന്റെ പൗരോഹിത്യം നിലനിൽക്കുന്ന ഫലം പുറപ്പെടുവിക്കട്ടെ; അങ്ങയുടെ വിളവെടുപ്പിനു കൂടുതൽ വേലക്കാരെ ഉയർത്തണമേ. ആമേൻ."}},

{id:"profession",
 en:{t:"Religious Profession",sub:"For first or final vows of a religious brother or sister",
  read:[["Old Testament","1 Samuel 3:1–10 or Hosea 2:16, 19–20"],["Epistle","Philippians 3:7–14"],["Gospel","Mark 10:17–30"]],
  verse:"The LORD is my chosen portion and my cup; you hold my lot.",cite:"Psalm 16:5",
  points:[["Everything for Christ","“Whatever gains I had, these I have come to regard as loss because of Christ” (Philippians 3:7)."],["Three vows","Poverty, chastity and obedience: not a loss of life, but a life given wholly to God."],["A sign for all","Religious life reminds every Christian that God alone is enough and that heaven is our home."],["Gratitude","Thank the family and the community; pray for perseverance."]],
  homily:["Dear sister (brother), today you give your whole life to God by the vows of poverty, chastity and obedience. With the psalmist you say: “The Lord is my chosen portion and my cup.”","In the Gospel a rich young man came to Jesus and went away sad, because he could not let go. Today we see the opposite: someone who has heard “Come, follow me” and says yes. St Paul says, “I regard everything as loss because of the surpassing value of knowing Christ Jesus my Lord.”","The vows are not chains. Poverty sets you free from possessions; chastity sets your heart free to love everyone; obedience sets you free from yourself. And your life becomes a sign for all of us that God alone is enough.","Dear family, you are not losing a daughter (son); you are giving her (him) to God, and God is never outdone in generosity. Let us pray that she (he) may be faithful to the end. Amen."],
  prayer:"Lord, you are the portion and the cup of your servant. Accept the offering of this life, keep her (him) faithful to the vows professed today, and make her (his) joy a witness to your love. Amen."},
 ml:{t:"സന്യാസവ്രതവാഗ്ദാനം",sub:"ഒരു സന്യാസിനിയുടെയോ സന്യാസിയുടെയോ പ്രഥമ/നിത്യവ്രതവാഗ്ദാനത്തിന്",
  read:[["പഴയനിയമം","1 സാമുവൽ 3:1–10 അല്ലെങ്കിൽ ഹോസിയാ 2:16, 19–20"],["ലേഖനം","ഫിലിപ്പി 3:7–14"],["സുവിശേഷം","മർക്കോസ് 10:17–30"]],
  verse:"കർത്താവാണ് എന്റെ ഓഹരിയും പാനപാത്രവും; എന്റെ ഭാഗധേയം അവിടുത്തെ കരങ്ങളിലാണ്.",cite:"സങ്കീർത്തനം 16:5",
  points:[["എല്ലാം ക്രിസ്തുവിനുവേണ്ടി","എനിക്കു നേട്ടമായിരുന്നവയെല്ലാം ക്രിസ്തുവിനെപ്രതി ഞാൻ നഷ്ടമായി കരുതുന്നു (ഫിലി 3:7)."],["മൂന്നു വ്രതങ്ങൾ","ദാരിദ്ര്യം, ബ്രഹ്മചര്യം, അനുസരണം: ജീവിതത്തിന്റെ നഷ്ടമല്ല, പൂർണമായി ദൈവത്തിനു നൽകപ്പെട്ട ജീവിതമാണ്."],["എല്ലാവർക്കുമുള്ള അടയാളം","ദൈവം മാത്രം മതിയെന്നും സ്വർഗമാണു നമ്മുടെ ഭവനമെന്നും സന്യാസജീവിതം ഓരോ ക്രൈസ്തവനെയും ഓർമിപ്പിക്കുന്നു."],["നന്ദി","കുടുംബത്തിനും സമൂഹത്തിനും നന്ദി പറയുക; സ്ഥിരതയ്ക്കായി പ്രാർഥിക്കുക."]],
  homily:["പ്രിയ സഹോദരീ (സഹോദരാ), ദാരിദ്ര്യം, ബ്രഹ്മചര്യം, അനുസരണം എന്നീ വ്രതങ്ങളിലൂടെ ഇന്നു നീ നിന്റെ ജീവിതം മുഴുവൻ ദൈവത്തിനു നൽകുന്നു. സങ്കീർത്തകനോടൊപ്പം നീ പറയുന്നു: “കർത്താവാണ് എന്റെ ഓഹരിയും പാനപാത്രവും.”","സുവിശേഷത്തിൽ ധനികനായ ഒരു യുവാവ് യേശുവിന്റെ അടുത്തു വന്നു; ഒന്നും വിട്ടുകൊടുക്കാൻ കഴിയാത്തതുകൊണ്ടു ദുഃഖിതനായി തിരിച്ചുപോയി. ഇന്നു നാം അതിന്റെ മറുവശം കാണുന്നു: “വന്ന് എന്നെ അനുഗമിക്കുക” എന്നു കേട്ട് അതെ എന്നു പറയുന്ന ഒരാൾ. വിശുദ്ധ പൗലോസ് പറയുന്നു: എന്റെ കർത്താവായ യേശുക്രിസ്തുവിനെ അറിയുന്നതിന്റെ ശ്രേഷ്ഠത നിമിത്തം സകലതും ഞാൻ നഷ്ടമായി കരുതുന്നു.","വ്രതങ്ങൾ ചങ്ങലകളല്ല. ദാരിദ്ര്യം വസ്തുവകകളിൽനിന്നു നിന്നെ സ്വതന്ത്രയാക്കുന്നു; ബ്രഹ്മചര്യം എല്ലാവരെയും സ്നേഹിക്കാൻ നിന്റെ ഹൃദയത്തെ സ്വതന്ത്രമാക്കുന്നു; അനുസരണം നിന്നിൽനിന്നുതന്നെ നിന്നെ സ്വതന്ത്രയാക്കുന്നു. നിന്റെ ജീവിതം ദൈവം മാത്രം മതിയെന്നു ഞങ്ങൾക്കെല്ലാവർക്കുമുള്ള ഒരു അടയാളമാകുന്നു.","പ്രിയ കുടുംബാംഗങ്ങളേ, നിങ്ങൾക്ക് ഒരു മകളെ (മകനെ) നഷ്ടപ്പെടുകയല്ല; നിങ്ങൾ അവളെ (അവനെ) ദൈവത്തിനു നൽകുകയാണ്; ഔദാര്യത്തിൽ ദൈവത്തെ ആർക്കും തോൽപിക്കാനാവില്ല. അവൾ (അവൻ) അവസാനംവരെ വിശ്വസ്തയായിരിക്കാൻ നമുക്കു പ്രാർഥിക്കാം. ആമേൻ."],
  prayer:"കർത്താവേ, അങ്ങാണ് അങ്ങയുടെ ദാസിയുടെ (ദാസന്റെ) ഓഹരിയും പാനപാത്രവും. ഈ ജീവിതത്തിന്റെ സമർപ്പണം സ്വീകരിക്കണമേ; ഇന്ന് ഏറ്റുപറഞ്ഞ വ്രതങ്ങളിൽ അവളെ (അവനെ) വിശ്വസ്തയായി കാക്കണമേ; അവളുടെ (അവന്റെ) സന്തോഷം അങ്ങയുടെ സ്നേഹത്തിനു സാക്ഷ്യമാകട്ടെ. ആമേൻ."}},

{id:"sick",
 en:{t:"Anointing and Prayer for the Sick",sub:"For the anointing of the sick, or a Mass or prayer service for the sick",
  read:[["Old Testament","Isaiah 53:3–5"],["Epistle","James 5:13–16"],["Gospel","Matthew 11:25–30 or Mark 2:1–12"]],
  verse:"Come to me, all you that are weary and are carrying heavy burdens, and I will give you rest.",cite:"Matthew 11:28",
  points:[["Not only for the dying","The anointing of the sick is for anyone seriously ill, before surgery, or weakened by old age (CCC 1514)."],["The Lord's own sacrament","“Are any among you sick? They should call for the elders of the church and have them pray over them, anointing them with oil in the name of the Lord” (James 5:14)."],["Grace in suffering","Strength, peace and courage; forgiveness of sins; union with the Passion of Christ; healing of body if it is God's will."],["The community cares","Visiting, bringing Communion, helping the family."]],
  homily:["Dear brothers and sisters, especially you who are sick, Jesus says to you today: “Come to me, all you that are weary and are carrying heavy burdens, and I will give you rest.” You are not forgotten. You are at the centre of the Church's prayer.","Many people think the anointing of the sick is only for the dying, and so they call the priest too late. It is not so. St James says: “Are any among you sick? They should call for the elders of the church.” This sacrament is for anyone seriously ill, before an operation, or weakened by age.","What does the sacrament give? Peace and courage; the forgiveness of sins; the grace to unite your suffering with the suffering of Christ; and, if it is God's will, healing of the body. Isaiah says of Jesus: “By his bruises we are healed.” Your pain, joined to his, is never wasted.","And to the families and the parish: the sick need our presence. Visit them, sit with them, bring them Holy Communion, help those who care for them. That too is the Church at prayer. Amen."],
  prayer:"Lord Jesus, you took our infirmities and bore our diseases. Look on your servants who are sick: give them strength and peace, forgive their sins, unite their suffering with your Passion, and, if it is your will, restore them to health. Amen."},
 ml:{t:"രോഗീലേപനവും രോഗികൾക്കുവേണ്ടിയുള്ള പ്രാർഥനയും",sub:"രോഗീലേപനത്തിന്, അല്ലെങ്കിൽ രോഗികൾക്കായുള്ള കുർബാനയ്ക്കോ പ്രാർഥനാശുശ്രൂഷയ്ക്കോ",
  read:[["പഴയനിയമം","ഏശയ്യാ 53:3–5"],["ലേഖനം","യാക്കോബ് 5:13–16"],["സുവിശേഷം","മത്തായി 11:25–30 അല്ലെങ്കിൽ മർക്കോസ് 2:1–12"]],
  verse:"അധ്വാനിക്കുന്നവരും ഭാരം വഹിക്കുന്നവരുമായ നിങ്ങളെല്ലാവരും എന്റെ അടുക്കൽ വരുവിൻ; ഞാൻ നിങ്ങളെ ആശ്വസിപ്പിക്കാം.",cite:"മത്തായി 11:28",
  points:[["മരണാസന്നർക്കു മാത്രമല്ല","ഗുരുതരരോഗമുള്ളവർക്കും ശസ്ത്രക്രിയയ്ക്കു മുമ്പും വാർധക്യത്താൽ ക്ഷീണിതർക്കും രോഗീലേപനം സ്വീകരിക്കാം (മതബോധനഗ്രന്ഥം 1514)."],["കർത്താവിന്റെ കൂദാശ","നിങ്ങളിൽ ആരെങ്കിലും രോഗിയാണെങ്കിൽ അവൻ സഭയിലെ ശ്രേഷ്ഠന്മാരെ വിളിക്കട്ടെ; അവർ കർത്താവിന്റെ നാമത്തിൽ അവനെ തൈലാഭിഷേകം ചെയ്യട്ടെ (യാക്കോ 5:14)."],["സഹനത്തിലെ കൃപ","ശക്തിയും സമാധാനവും ധൈര്യവും; പാപമോചനം; ക്രിസ്തുവിന്റെ പീഡാസഹനത്തോടുള്ള ഐക്യം; ദൈവഹിതമെങ്കിൽ ശാരീരികസൗഖ്യം."],["സമൂഹം കരുതുന്നു","സന്ദർശനം, വിശുദ്ധ കുർബാന കൊണ്ടുചെല്ലൽ, കുടുംബത്തെ സഹായിക്കൽ."]],
  homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, പ്രത്യേകിച്ചു രോഗികളായ നിങ്ങളേ, യേശു ഇന്നു നിങ്ങളോടു പറയുന്നു: “അധ്വാനിക്കുന്നവരും ഭാരം വഹിക്കുന്നവരുമായ നിങ്ങളെല്ലാവരും എന്റെ അടുക്കൽ വരുവിൻ; ഞാൻ നിങ്ങളെ ആശ്വസിപ്പിക്കാം.” നിങ്ങൾ മറക്കപ്പെട്ടിട്ടില്ല. സഭയുടെ പ്രാർഥനയുടെ കേന്ദ്രത്തിലാണു നിങ്ങൾ.","രോഗീലേപനം മരണാസന്നർക്കു മാത്രമാണെന്നു പലരും കരുതുന്നു; അതുകൊണ്ടു വൈദികനെ വളരെ വൈകി വിളിക്കുന്നു. അങ്ങനെയല്ല. വിശുദ്ധ യാക്കോബ് പറയുന്നു: നിങ്ങളിൽ ആരെങ്കിലും രോഗിയാണെങ്കിൽ അവൻ സഭയിലെ ശ്രേഷ്ഠന്മാരെ വിളിക്കട്ടെ. ഗുരുതരരോഗമുള്ള ആർക്കും, ശസ്ത്രക്രിയയ്ക്കു മുമ്പും, വാർധക്യത്താൽ ക്ഷീണിതർക്കും ഈ കൂദാശയുണ്ട്.","ഈ കൂദാശ എന്തു നൽകുന്നു? സമാധാനവും ധൈര്യവും; പാപമോചനം; നിങ്ങളുടെ സഹനം ക്രിസ്തുവിന്റെ സഹനത്തോടു ചേർക്കാനുള്ള കൃപ; ദൈവഹിതമെങ്കിൽ ശരീരത്തിന്റെ സൗഖ്യം. യേശുവിനെപ്പറ്റി ഏശയ്യാ പറയുന്നു: അവന്റെ ക്ഷതങ്ങളാൽ നാം സൗഖ്യം പ്രാപിച്ചു. അവിടുത്തെ സഹനത്തോടു ചേർന്ന നിങ്ങളുടെ വേദന ഒരിക്കലും പാഴാകുന്നില്ല.","കുടുംബങ്ങളോടും ഇടവകയോടും: രോഗികൾക്കു നമ്മുടെ സാന്നിധ്യം ആവശ്യമാണ്. അവരെ സന്ദർശിക്കുക, അവരോടൊപ്പം ഇരിക്കുക, അവർക്കു വിശുദ്ധ കുർബാന കൊണ്ടുചെല്ലുക, അവരെ ശുശ്രൂഷിക്കുന്നവരെ സഹായിക്കുക. അതും പ്രാർഥിക്കുന്ന സഭയാണ്. ആമേൻ."],
  prayer:"കർത്താവായ യേശുവേ, ഞങ്ങളുടെ ബലഹീനതകൾ അങ്ങ് ഏറ്റെടുക്കുകയും ഞങ്ങളുടെ രോഗങ്ങൾ വഹിക്കുകയും ചെയ്തു. രോഗികളായ അങ്ങയുടെ ദാസരെ കടാക്ഷിക്കണമേ: അവർക്കു ശക്തിയും സമാധാനവും നൽകണമേ; അവരുടെ പാപങ്ങൾ ക്ഷമിക്കണമേ; അവരുടെ സഹനം അങ്ങയുടെ പീഡാസഹനത്തോടു ചേർക്കണമേ; അങ്ങയുടെ തിരുമനസ്സെങ്കിൽ അവർക്ക് ആരോഗ്യം തിരികെ നൽകണമേ. ആമേൻ."}},

{id:"funeral",
 en:{t:"Funeral",sub:"For the funeral of a Christian",
  read:[["Old Testament","Wisdom 3:1–9 or 2 Maccabees 12:43–46"],["Epistle","1 Thessalonians 4:13–18 or Romans 6:3–9"],["Gospel","John 11:17–27 or John 14:1–6"]],
  verse:"I am the resurrection and the life. Those who believe in me, even though they die, will live.",cite:"John 11:25",
  points:[["Grief is not faithless","Jesus wept at the tomb of Lazarus. Tears are allowed; despair is not."],["Christ has conquered death","“I am the resurrection and the life.” Death is not the end but a passage."],["We pray for the dead","The Church has always prayed and offered the Eucharist for the departed, that they may be purified and enter the joy of God (CCC 1032; 2 Maccabees 12:46)."],["Speak of the person truthfully","Remember the life with gratitude, without exaggeration; the focus is Christ's mercy."]],
  homily:["Dear family and friends, we have come together with heavy hearts to say farewell to our brother (sister) N. At the tomb of his friend Lazarus, Jesus wept. So we too may weep today. Christian faith does not forbid tears; it gives them hope.","To Martha, standing in her grief, Jesus said: “I am the resurrection and the life. Those who believe in me, even though they die, will live.” These are the words we hold on to today. For the believer, death is not a wall but a door. Christ has passed through it before us and has broken its power.","We remember N. with gratitude: for his (her) love, his (her) work, his (her) faith. But we do not canonise anyone at a funeral. We entrust him (her) to the mercy of God. From the earliest times the Church has prayed and offered the Eucharist for the dead, so that they may be purified and enter fully into God's joy. That is the greatest gift we can still give: our prayer.","Dear family, you are not alone. The parish stands with you. And one day, by God's mercy, we hope to meet again where every tear will be wiped away. Eternal rest grant unto him (her), O Lord. Amen."],
  prayer:"Lord Jesus, resurrection and life, receive our brother (sister) N. into your mercy. Forgive his (her) sins, bring him (her) into the light of your face, and console all who mourn with the hope of the resurrection. Amen."},
 ml:{t:"മൃതസംസ്കാരം",sub:"ഒരു ക്രൈസ്തവന്റെ മൃതസംസ്കാരശുശ്രൂഷയ്ക്ക്",
  read:[["പഴയനിയമം","ജ്ഞാനം 3:1–9 അല്ലെങ്കിൽ 2 മക്കബായർ 12:43–46"],["ലേഖനം","1 തെസലോനിക്കാ 4:13–18 അല്ലെങ്കിൽ റോമാ 6:3–9"],["സുവിശേഷം","യോഹന്നാൻ 11:17–27 അല്ലെങ്കിൽ യോഹന്നാൻ 14:1–6"]],
  verse:"ഞാനാണ് പുനരുത്ഥാനവും ജീവനും. എന്നിൽ വിശ്വസിക്കുന്നവൻ മരിച്ചാലും ജീവിക്കും.",cite:"യോഹന്നാൻ 11:25",
  points:[["ദുഃഖം അവിശ്വാസമല്ല","ലാസറിന്റെ കല്ലറയ്ക്കൽ യേശു കണ്ണീർ പൊഴിച്ചു. കണ്ണുനീർ അനുവദനീയമാണ്; നിരാശ അല്ല."],["ക്രിസ്തു മരണത്തെ ജയിച്ചു","“ഞാനാണ് പുനരുത്ഥാനവും ജീവനും.” മരണം അവസാനമല്ല, ഒരു കടന്നുപോകലാണ്."],["മരിച്ചവർക്കുവേണ്ടി നാം പ്രാർഥിക്കുന്നു","മരിച്ചവർ ശുദ്ധീകരിക്കപ്പെട്ടു ദൈവത്തിന്റെ സന്തോഷത്തിൽ പ്രവേശിക്കാൻ സഭ എന്നും അവർക്കുവേണ്ടി പ്രാർഥിക്കുകയും കുർബാന അർപ്പിക്കുകയും ചെയ്തിട്ടുണ്ട് (മതബോധനഗ്രന്ഥം 1032; 2 മക്ക 12:46)."],["വ്യക്തിയെപ്പറ്റി സത്യസന്ധമായി പറയുക","അതിശയോക്തിയില്ലാതെ, നന്ദിയോടെ ജീവിതം ഓർക്കുക; കേന്ദ്രം ക്രിസ്തുവിന്റെ കരുണയാണ്."]],
  homily:["പ്രിയ കുടുംബാംഗങ്ങളേ, സുഹൃത്തുക്കളേ, നമ്മുടെ സഹോദരനോട് (സഹോദരിയോട്) N. യാത്ര പറയാൻ ഭാരമുള്ള ഹൃദയങ്ങളോടെ നാം ഒരുമിച്ചുകൂടിയിരിക്കുന്നു. തന്റെ സുഹൃത്തായ ലാസറിന്റെ കല്ലറയ്ക്കൽ യേശു കണ്ണീർ പൊഴിച്ചു. അതുകൊണ്ട് ഇന്നു നമുക്കും കരയാം. ക്രൈസ്തവവിശ്വാസം കണ്ണുനീർ വിലക്കുന്നില്ല; അതിനു പ്രത്യാശ നൽകുന്നു.","ദുഃഖത്തിൽ നിന്നിരുന്ന മർത്തായോടു യേശു പറഞ്ഞു: “ഞാനാണ് പുനരുത്ഥാനവും ജീവനും. എന്നിൽ വിശ്വസിക്കുന്നവൻ മരിച്ചാലും ജീവിക്കും.” ഇന്നു നാം മുറുകെപ്പിടിക്കുന്ന വാക്കുകൾ ഇവയാണ്. വിശ്വാസിക്കു മരണം ഒരു മതിലല്ല, ഒരു വാതിലാണ്. ക്രിസ്തു നമുക്കു മുമ്പേ അതിലൂടെ കടന്നുപോയി അതിന്റെ ശക്തി തകർത്തു.","N.-നെ നാം നന്ദിയോടെ ഓർക്കുന്നു: അദ്ദേഹത്തിന്റെ (അവരുടെ) സ്നേഹത്തിനും അധ്വാനത്തിനും വിശ്വാസത്തിനും. എങ്കിലും ഒരു മൃതസംസ്കാരവേളയിൽ നാം ആരെയും വിശുദ്ധരായി പ്രഖ്യാപിക്കുന്നില്ല. ദൈവത്തിന്റെ കരുണയ്ക്ക് അദ്ദേഹത്തെ (അവരെ) നാം ഭരമേൽപിക്കുന്നു. മരിച്ചവർ ശുദ്ധീകരിക്കപ്പെട്ടു ദൈവത്തിന്റെ സന്തോഷത്തിൽ പൂർണമായി പ്രവേശിക്കാൻ ആദിമകാലംമുതൽ സഭ അവർക്കുവേണ്ടി പ്രാർഥിക്കുകയും കുർബാന അർപ്പിക്കുകയും ചെയ്തിട്ടുണ്ട്. ഇനിയും നമുക്കു നൽകാവുന്ന ഏറ്റവും വലിയ ദാനം അതാണ്: നമ്മുടെ പ്രാർഥന.","പ്രിയ കുടുംബാംഗങ്ങളേ, നിങ്ങൾ ഒറ്റയ്ക്കല്ല. ഇടവക നിങ്ങളോടൊപ്പമുണ്ട്. ദൈവകരുണയാൽ, എല്ലാ കണ്ണുനീരും തുടച്ചുമാറ്റപ്പെടുന്നിടത്ത് ഒരുനാൾ വീണ്ടും കണ്ടുമുട്ടാമെന്നു നാം പ്രത്യാശിക്കുന്നു. കർത്താവേ, അദ്ദേഹത്തിന് (അവർക്ക്) നിത്യവിശ്രമം നൽകണമേ. ആമേൻ."],
  prayer:"പുനരുത്ഥാനവും ജീവനുമായ കർത്താവായ യേശുവേ, ഞങ്ങളുടെ സഹോദരനെ (സഹോദരിയെ) N. അങ്ങയുടെ കരുണയിൽ സ്വീകരിക്കണമേ. അദ്ദേഹത്തിന്റെ (അവരുടെ) പാപങ്ങൾ ക്ഷമിക്കണമേ; അങ്ങയുടെ മുഖപ്രകാശത്തിലേക്കു കൊണ്ടുവരണമേ; വിലപിക്കുന്ന എല്ലാവരെയും പുനരുത്ഥാനത്തിന്റെ പ്രത്യാശയാൽ ആശ്വസിപ്പിക്കണമേ. ആമേൻ."}},

{id:"memorial",
 en:{t:"Commemoration of the Departed (41st day, anniversary)",sub:"For the 41st-day remembrance, a death anniversary or a memorial Mass",
  read:[["Old Testament","Wisdom 3:1–9"],["Epistle","2 Corinthians 5:1, 6–10"],["Gospel","John 14:1–6 or John 6:37–40"]],
  verse:"In my Father's house there are many dwelling places. If it were not so, would I have told you that I go to prepare a place for you?",cite:"John 14:2",
  points:[["Love does not end","Death separates us for a time; it does not break the communion of saints."],["Why we offer the Eucharist","The {Q} offered for the departed is the greatest help we can give them (CCC 1032, 1371)."],["Remember to imitate","Recall one virtue of the departed and ask the family to carry it on."],["Our own preparation","Every remembrance is also a reminder: live today ready to meet the Lord."]],
  homily:["Dear family and friends, we have gathered again to remember N. The days have passed, the first tears have perhaps become quieter, but the love remains. And love, in Christ, does not end.","Jesus says: “In my Father's house there are many dwelling places.” Our dear ones have not disappeared; they have gone ahead. We believe in the communion of saints: those on earth, those being purified, and those in heaven form one family in Christ.","That is why we offer this {Q} for N. The Church teaches that the Eucharistic sacrifice is offered also for the faithful departed, that they may enter the light and peace of Christ. Our prayer is the most precious gift we can still give.","Let us also remember to imitate. Think of one good thing N. did, and continue it in your own life. And let each of us live today in such a way that we are ready to meet the Lord. Eternal rest grant unto him (her), O Lord. Amen."],
  prayer:"Lord, in your Father's house there are many dwelling places. Grant N. a place of light and peace, and keep us faithful, so that one day we may all be gathered together in your kingdom. Amen."},
 ml:{t:"ഓർമദിനം (നാൽപ്പത്തൊന്നാം ദിവസം, ചരമവാർഷികം)",sub:"നാൽപ്പത്തൊന്നാം ദിവസത്തെ ഓർമയ്ക്കോ ചരമവാർഷികത്തിനോ ഓർമക്കുർബാനയ്ക്കോ",
  read:[["പഴയനിയമം","ജ്ഞാനം 3:1–9"],["ലേഖനം","2 കോറിന്തോസ് 5:1, 6–10"],["സുവിശേഷം","യോഹന്നാൻ 14:1–6 അല്ലെങ്കിൽ യോഹന്നാൻ 6:37–40"]],
  verse:"എന്റെ പിതാവിന്റെ ഭവനത്തിൽ അനേകം വാസസ്ഥലങ്ങളുണ്ട്. ഇല്ലായിരുന്നെങ്കിൽ നിങ്ങൾക്കു സ്ഥലമൊരുക്കാൻ പോകുന്നുവെന്നു ഞാൻ നിങ്ങളോടു പറയുമായിരുന്നോ?",cite:"യോഹന്നാൻ 14:2",
  points:[["സ്നേഹം അവസാനിക്കുന്നില്ല","മരണം കുറച്ചുകാലത്തേക്കു നമ്മെ വേർപിരിക്കുന്നു; വിശുദ്ധരുടെ ഐക്യം അതു തകർക്കുന്നില്ല."],["എന്തുകൊണ്ടു കുർബാന അർപ്പിക്കുന്നു","മരിച്ചവർക്കുവേണ്ടി അർപ്പിക്കുന്ന {Q}യാണ് നമുക്ക് അവർക്കു നൽകാവുന്ന ഏറ്റവും വലിയ സഹായം (മതബോധനഗ്രന്ഥം 1032, 1371)."],["അനുകരിക്കാനായി ഓർക്കുക","മരിച്ചയാളുടെ ഒരു പുണ്യം ഓർത്ത് അതു തുടരാൻ കുടുംബത്തോട് ആവശ്യപ്പെടുക."],["നമ്മുടെ സ്വന്തം ഒരുക്കം","ഓരോ ഓർമദിനവും ഒരു ഓർമപ്പെടുത്തലുമാണ്: കർത്താവിനെ കണ്ടുമുട്ടാൻ ഒരുങ്ങി ഇന്നു ജീവിക്കുക."]],
  homily:["പ്രിയ കുടുംബാംഗങ്ങളേ, സുഹൃത്തുക്കളേ, N.-നെ ഓർക്കാൻ നാം വീണ്ടും ഒരുമിച്ചുകൂടിയിരിക്കുന്നു. ദിവസങ്ങൾ കടന്നുപോയി; ആദ്യത്തെ കണ്ണുനീർ ഒരുപക്ഷേ ശാന്തമായിട്ടുണ്ടാകാം; പക്ഷേ സ്നേഹം നിലനിൽക്കുന്നു. ക്രിസ്തുവിൽ സ്നേഹം അവസാനിക്കുന്നില്ല.","യേശു പറയുന്നു: “എന്റെ പിതാവിന്റെ ഭവനത്തിൽ അനേകം വാസസ്ഥലങ്ങളുണ്ട്.” നമ്മുടെ പ്രിയപ്പെട്ടവർ അപ്രത്യക്ഷരായിട്ടില്ല; അവർ മുമ്പേ പോയിരിക്കുന്നു. വിശുദ്ധരുടെ ഐക്യത്തിൽ നാം വിശ്വസിക്കുന്നു: ഭൂമിയിലുള്ളവരും ശുദ്ധീകരിക്കപ്പെടുന്നവരും സ്വർഗത്തിലുള്ളവരും ക്രിസ്തുവിൽ ഒരു കുടുംബമാണ്.","അതുകൊണ്ടാണ് N.-നുവേണ്ടി നാം ഈ {Q} അർപ്പിക്കുന്നത്. മരിച്ച വിശ്വാസികൾ ക്രിസ്തുവിന്റെ പ്രകാശത്തിലും സമാധാനത്തിലും പ്രവേശിക്കാൻ ദിവ്യകാരുണ്യബലി അവർക്കുവേണ്ടിയും അർപ്പിക്കപ്പെടുന്നുവെന്നു സഭ പഠിപ്പിക്കുന്നു. ഇനിയും നമുക്കു നൽകാവുന്ന ഏറ്റവും വിലപ്പെട്ട ദാനം നമ്മുടെ പ്രാർഥനയാണ്.","അനുകരിക്കാനും നമുക്ക് ഓർക്കാം. N. ചെയ്ത ഒരു നല്ല കാര്യം ഓർത്ത് അതു നിങ്ങളുടെ സ്വന്തം ജീവിതത്തിൽ തുടരുക. കർത്താവിനെ കണ്ടുമുട്ടാൻ ഒരുങ്ങിയിരിക്കുന്ന വിധത്തിൽ നമ്മളോരോരുത്തരും ഇന്നു ജീവിക്കാം. കർത്താവേ, അദ്ദേഹത്തിന് (അവർക്ക്) നിത്യവിശ്രമം നൽകണമേ. ആമേൻ."],
  prayer:"കർത്താവേ, അങ്ങയുടെ പിതാവിന്റെ ഭവനത്തിൽ അനേകം വാസസ്ഥലങ്ങളുണ്ട്. N.-ന് പ്രകാശത്തിന്റെയും സമാധാനത്തിന്റെയും ഒരിടം നൽകണമേ; ഒരുനാൾ അങ്ങയുടെ രാജ്യത്തിൽ ഞങ്ങളെല്ലാവരും ഒരുമിച്ചുകൂടാൻ ഞങ്ങളെ വിശ്വസ്തരായി കാക്കണമേ. ആമേൻ."}},

{id:"weddingjubilee",
 en:{t:"Wedding Jubilee",sub:"For the silver, golden or any anniversary of marriage",
  read:[["Old Testament","Sirach 26:1–4, 13–16 or Tobit 8:4–8"],["Epistle","Colossians 3:12–17"],["Gospel","John 2:1–11"]],
  verse:"But you have kept the good wine until now.",cite:"John 2:10",
  points:[["The good wine kept until now","At Cana the best wine came last. Years of faithful love can become better, not weaker."],["Grace, not only effort","A long marriage is a work of God's grace as much as of human effort."],["Forgiveness as daily bread","“Bear with one another and… forgive each other” (Colossians 3:13)."],["A witness to the young","In a time of broken families, faithful couples preach without words."]],
  homily:["Dear N. and N., today we thank God with you for these years of married life. At Cana the steward said: “Everyone serves the good wine first… But you have kept the good wine until now.” Your jubilee is that good wine.","When you stood at the altar years ago, you could not know everything that was coming: children, joys, illnesses, debts, misunderstandings, reconciliations. But you kept your promise. That is not only your achievement; it is God's grace working in two ordinary hearts.","St Paul describes the secret: “Bear with one another and, if anyone has a complaint against another, forgive each other; just as the Lord has forgiven you.” Forgiveness was your daily bread. Teach that to your children and grandchildren.","In a time when many marriages break, your faithfulness is a sermon without words. May the Lord who kept the best wine until now give you many more years together. Amen."],
  prayer:"Lord Jesus, guest at Cana, we thank you for the years of love you have given N. and N. Renew their love, bless their children and grandchildren, and keep the best wine for the years still to come. Amen."},
 ml:{t:"വിവാഹജൂബിലി",sub:"വിവാഹത്തിന്റെ രജത, സുവർണ ജൂബിലിക്കോ ഏതൊരു വാർഷികത്തിനോ",
  read:[["പഴയനിയമം","പ്രഭാഷകൻ 26:1–4, 13–16 അല്ലെങ്കിൽ തോബിത് 8:4–8"],["ലേഖനം","കൊളോസോസ് 3:12–17"],["സുവിശേഷം","യോഹന്നാൻ 2:1–11"]],
  verse:"എന്നാൽ, നീ നല്ല വീഞ്ഞ് ഇതുവരെയും സൂക്ഷിച്ചുവച്ചുവല്ലോ.",cite:"യോഹന്നാൻ 2:10",
  points:[["ഇതുവരെ സൂക്ഷിച്ച നല്ല വീഞ്ഞ്","കാനായിൽ മേൽത്തരം വീഞ്ഞു വന്നത് അവസാനമാണ്. വിശ്വസ്തസ്നേഹത്തിന്റെ വർഷങ്ങൾ ദുർബലമാകുകയല്ല, മെച്ചപ്പെടുകയാണു ചെയ്യുന്നത്."],["പ്രയത്നം മാത്രമല്ല, കൃപ","ദീർഘമായ ഒരു വിവാഹജീവിതം മാനുഷികപ്രയത്നംപോലെതന്നെ ദൈവകൃപയുടെയും പ്രവൃത്തിയാണ്."],["അനുദിനാപ്പമായ ക്ഷമ","പരസ്പരം സഹിക്കുകയും ക്ഷമിക്കുകയും ചെയ്യുവിൻ (കൊളോ 3:13)."],["യുവജനങ്ങൾക്ക് ഒരു സാക്ഷ്യം","കുടുംബങ്ങൾ തകരുന്ന ഒരു കാലത്ത് വിശ്വസ്തദമ്പതികൾ വാക്കുകളില്ലാതെ പ്രസംഗിക്കുന്നു."]],
  homily:["പ്രിയ N.-ഉം N.-ഉം, ഈ വിവാഹജീവിതവർഷങ്ങൾക്കായി ഇന്നു നിങ്ങളോടൊപ്പം നാം ദൈവത്തിനു നന്ദി പറയുന്നു. കാനായിൽ കലവറക്കാരൻ പറഞ്ഞു: “എല്ലാവരും മേൽത്തരം വീഞ്ഞ് ആദ്യം വിളമ്പുന്നു… എന്നാൽ, നീ നല്ല വീഞ്ഞ് ഇതുവരെയും സൂക്ഷിച്ചുവച്ചുവല്ലോ.” നിങ്ങളുടെ ജൂബിലി ആ നല്ല വീഞ്ഞാണ്.","വർഷങ്ങൾക്കു മുമ്പു നിങ്ങൾ ബലിപീഠത്തിനു മുമ്പിൽ നിന്നപ്പോൾ വരാനിരിക്കുന്നതെല്ലാം നിങ്ങൾക്ക് അറിയാമായിരുന്നില്ല: മക്കൾ, സന്തോഷങ്ങൾ, രോഗങ്ങൾ, കടങ്ങൾ, തെറ്റിദ്ധാരണകൾ, അനുരഞ്ജനങ്ങൾ. പക്ഷേ നിങ്ങൾ വാഗ്ദാനം പാലിച്ചു. അതു നിങ്ങളുടെ നേട്ടം മാത്രമല്ല; സാധാരണക്കാരായ രണ്ടു ഹൃദയങ്ങളിൽ പ്രവർത്തിക്കുന്ന ദൈവകൃപയാണ്.","വിശുദ്ധ പൗലോസ് ആ രഹസ്യം വിവരിക്കുന്നു: പരസ്പരം സഹിക്കുകയും, ഒരുവനു മറ്റൊരുവനെതിരേ പരാതിയുണ്ടെങ്കിൽ ക്ഷമിക്കുകയും ചെയ്യുവിൻ; കർത്താവു നിങ്ങളോടു ക്ഷമിച്ചതുപോലെ. ക്ഷമ നിങ്ങളുടെ അനുദിനാപ്പമായിരുന്നു. അതു നിങ്ങളുടെ മക്കളെയും കൊച്ചുമക്കളെയും പഠിപ്പിക്കുക.","അനേകം വിവാഹങ്ങൾ തകരുന്ന ഒരു കാലത്ത് നിങ്ങളുടെ വിശ്വസ്തത വാക്കുകളില്ലാത്ത ഒരു പ്രസംഗമാണ്. ഏറ്റവും നല്ല വീഞ്ഞ് ഇതുവരെ സൂക്ഷിച്ച കർത്താവ് നിങ്ങൾക്ക് ഇനിയും അനേകം വർഷങ്ങൾ ഒന്നിച്ചു നൽകട്ടെ. ആമേൻ."],
  prayer:"കാനായിലെ അതിഥിയായ കർത്താവായ യേശുവേ, N.-നും N.-നും അങ്ങു നൽകിയ സ്നേഹത്തിന്റെ വർഷങ്ങൾക്കായി ഞങ്ങൾ നന്ദി പറയുന്നു. അവരുടെ സ്നേഹം നവീകരിക്കണമേ; അവരുടെ മക്കളെയും കൊച്ചുമക്കളെയും അനുഗ്രഹിക്കണമേ; ഇനി വരാനിരിക്കുന്ന വർഷങ്ങൾക്കായി ഏറ്റവും നല്ല വീഞ്ഞു സൂക്ഷിക്കണമേ. ആമേൻ."}},

{id:"priestjubilee",
 en:{t:"Priestly or Religious Jubilee",sub:"For the jubilee of a priest or a religious",
  read:[["Old Testament","Jeremiah 1:4–9 or Isaiah 61:1–3"],["Epistle","2 Corinthians 4:1–2, 5–7"],["Gospel","John 21:15–19"]],
  verse:"What shall I return to the LORD for all his bounty to me?",cite:"Psalm 116:12",
  points:[["Gratitude first","The psalmist answers his own question: “I will lift up the cup of salvation and call on the name of the LORD” (Psalm 116:13)."],["Treasure in clay jars","“We have this treasure in clay jars, so that it may be made clear that this extraordinary power belongs to God” (2 Corinthians 4:7)."],["“Do you love me?”","Peter's threefold question is the question of every jubilee: love renewed after years of service and failure."],["Thank the people","A priest's or religious's life is woven with the people they served."]],
  homily:["Dear Father (Sister) N., dear friends, today we join the psalmist in asking: “What shall I return to the Lord for all his bounty to me?” And the psalm answers: “I will lift up the cup of salvation and call on the name of the Lord.” For a priest that is exactly what happens every day at the altar.","St Paul says: “We have this treasure in clay jars.” After many years of service, a jubilarian knows better than anyone how fragile the jar is, and how great the treasure. The fruit of these years belongs to God.","By the lake, the risen Jesus asked Peter three times, “Do you love me?” Peter had failed him, and yet Jesus entrusted his sheep to him again. Every jubilee is that question renewed: after all these years, do you love me? And the answer is: “Lord, you know everything; you know that I love you.”","Let us thank God for this life given, and let us pray that our families may give more sons and daughters to the service of the Lord. Amen."],
  prayer:"Lord, we thank you for the years of service of your servant N. Renew the grace of the first day, forgive what was lacking, and keep him (her) faithful in love until the end. Amen."},
 ml:{t:"പൗരോഹിത്യ / സന്യാസ ജൂബിലി",sub:"ഒരു വൈദികന്റെയോ സന്യസ്തന്റെയോ ജൂബിലിക്ക്",
  read:[["പഴയനിയമം","ജറെമിയാ 1:4–9 അല്ലെങ്കിൽ ഏശയ്യാ 61:1–3"],["ലേഖനം","2 കോറിന്തോസ് 4:1–2, 5–7"],["സുവിശേഷം","യോഹന്നാൻ 21:15–19"]],
  verse:"കർത്താവ് എന്റെ മേൽ ചൊരിഞ്ഞ അനുഗ്രഹങ്ങൾക്കു ഞാൻ എന്തു പകരം കൊടുക്കും?",cite:"സങ്കീർത്തനം 116:12",
  points:[["ആദ്യം നന്ദി","സങ്കീർത്തകൻ തന്നെ ഉത്തരം നൽകുന്നു: “ഞാൻ രക്ഷയുടെ പാനപാത്രമുയർത്തി കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കും” (സങ്കീ 116:13)."],["മൺപാത്രങ്ങളിലെ നിധി","ഈ അസാധാരണമായ ശക്തി ദൈവത്തിന്റേതാണെന്നു വ്യക്തമാകാൻ ഈ നിധി മൺപാത്രങ്ങളിലാണു ഞങ്ങൾ സൂക്ഷിക്കുന്നത് (2 കോറി 4:7)."],["“നീ എന്നെ സ്നേഹിക്കുന്നുവോ?”","പത്രോസിനോടുള്ള മൂന്നു പ്രാവശ്യത്തെ ചോദ്യമാണ് ഓരോ ജൂബിലിയുടെയും ചോദ്യം: വർഷങ്ങളുടെ ശുശ്രൂഷയ്ക്കും വീഴ്ചകൾക്കുംശേഷം നവീകരിക്കപ്പെടുന്ന സ്നേഹം."],["ജനങ്ങൾക്കു നന്ദി","ഒരു വൈദികന്റെയോ സന്യസ്തന്റെയോ ജീവിതം അവർ ശുശ്രൂഷിച്ച ജനങ്ങളോടു ചേർന്നു നെയ്യപ്പെട്ടതാണ്."]],
  homily:["പ്രിയ N. അച്ചാ (സിസ്റ്റർ), പ്രിയ സുഹൃത്തുക്കളേ, ഇന്നു സങ്കീർത്തകനോടു ചേർന്നു നാം ചോദിക്കുന്നു: “കർത്താവ് എന്റെ മേൽ ചൊരിഞ്ഞ അനുഗ്രഹങ്ങൾക്കു ഞാൻ എന്തു പകരം കൊടുക്കും?” സങ്കീർത്തനം ഉത്തരം നൽകുന്നു: “ഞാൻ രക്ഷയുടെ പാനപാത്രമുയർത്തി കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കും.” ഒരു വൈദികന് അതുതന്നെയാണ് എല്ലാ ദിവസവും ബലിപീഠത്തിൽ സംഭവിക്കുന്നത്.","വിശുദ്ധ പൗലോസ് പറയുന്നു: ഈ നിധി മൺപാത്രങ്ങളിലാണു ഞങ്ങൾ സൂക്ഷിക്കുന്നത്. വർഷങ്ങളുടെ ശുശ്രൂഷയ്ക്കുശേഷം, പാത്രം എത്ര ദുർബലമാണെന്നും നിധി എത്ര വലുതാണെന്നും ജൂബിലേറിയന് ആരെക്കാളും നന്നായി അറിയാം. ഈ വർഷങ്ങളുടെ ഫലം ദൈവത്തിന്റേതാണ്.","തടാകതീരത്ത് ഉത്ഥിതനായ യേശു പത്രോസിനോടു മൂന്നു പ്രാവശ്യം ചോദിച്ചു: “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” പത്രോസ് അവിടുത്തെ തള്ളിപ്പറഞ്ഞിരുന്നു; എങ്കിലും യേശു തന്റെ ആടുകളെ വീണ്ടും അവനെ ഏൽപിച്ചു. ഓരോ ജൂബിലിയും ആ ചോദ്യത്തിന്റെ നവീകരണമാണ്: ഇത്രയും വർഷങ്ങൾക്കുശേഷം നീ എന്നെ സ്നേഹിക്കുന്നുവോ? ഉത്തരം ഇതാണ്: “കർത്താവേ, നീ എല്ലാം അറിയുന്നു. ഞാൻ നിന്നെ സ്നേഹിക്കുന്നുവെന്നും നീ അറിയുന്നു.”","സമർപ്പിക്കപ്പെട്ട ഈ ജീവിതത്തിനായി നമുക്കു ദൈവത്തിനു നന്ദി പറയാം; കർത്താവിന്റെ ശുശ്രൂഷയ്ക്കായി നമ്മുടെ കുടുംബങ്ങൾ കൂടുതൽ മക്കളെ നൽകാൻ നമുക്കു പ്രാർഥിക്കാം. ആമേൻ."],
  prayer:"കർത്താവേ, അങ്ങയുടെ ദാസന്റെ (ദാസിയുടെ) N.-ന്റെ ശുശ്രൂഷാവർഷങ്ങൾക്കായി ഞങ്ങൾ നന്ദി പറയുന്നു. ആദ്യദിവസത്തെ കൃപ നവീകരിക്കണമേ; കുറവുകൾ ക്ഷമിക്കണമേ; അവസാനംവരെ സ്നേഹത്തിൽ വിശ്വസ്തനായി (വിശ്വസ്തയായി) കാക്കണമേ. ആമേൻ."}},

{id:"parishfeast",
 en:{t:"Parish Feast or Parish Jubilee",sub:"For the patronal feast (perunnal), the dedication anniversary or the jubilee of a parish or institution",
  read:[["Old Testament","1 Kings 8:22–23, 27–30"],["Epistle","Ephesians 2:19–22 or Hebrews 12:1–2"],["Gospel","Matthew 5:1–12 or the Gospel of the patron saint"]],
  verse:"I was glad when they said to me, “Let us go to the house of the LORD!”",cite:"Psalm 122:1",
  points:[["Why we celebrate a saint","The patron is a friend and intercessor who points to Christ, not a substitute for him."],["A family of faith","The parish is the family of families: “citizens with the saints and also members of the household of God” (Ephesians 2:19)."],["The real decoration","Lights, processions and fireworks pass; confession, charity and reconciliation remain. Keep a share of the feast for the poor."],["Looking forward","A jubilee looks back with thanks and forward with mission: who is missing from our parish today?"]],
  homily:["Dear brothers and sisters, the psalmist says: “I was glad when they said to me, Let us go to the house of the Lord!” Today our parish is glad. We celebrate our patron (our jubilee), and the whole family of the parish has come home.","Why do we honour a saint? Not because the saint replaces Christ, but because the saint shows us Christ. Our patron walked the road we walk and reached the goal. He (she) is our friend in heaven, praying for this parish.","Our feast has lights, processions, music and food, and that is good. But the real decoration of a feast is a cleansed heart: a good Confession, a family reconciled, a poor neighbour remembered. Let a share of this feast reach those who cannot celebrate.","And let us look forward. Who is missing from our parish today? Whom can we invite back? May our patron intercede for us, so that this parish may be a living house of God for the generations to come. Amen."],
  prayer:"Lord God, we thank you for our parish and for the faith handed down to us. Through the intercession of our patron, make us one family in Christ, generous to the poor and faithful to the end. Amen."},
 ml:{t:"ഇടവകത്തിരുനാൾ / ഇടവകജൂബിലി",sub:"ഇടവകയുടെ മധ്യസ്ഥന്റെ തിരുനാളിനോ (പെരുന്നാൾ) ദേവാലയസമർപ്പണവാർഷികത്തിനോ ഒരു ഇടവകയുടെയോ സ്ഥാപനത്തിന്റെയോ ജൂബിലിക്കോ",
  read:[["പഴയനിയമം","1 രാജാക്കന്മാർ 8:22–23, 27–30"],["ലേഖനം","എഫേസോസ് 2:19–22 അല്ലെങ്കിൽ ഹെബ്രായർ 12:1–2"],["സുവിശേഷം","മത്തായി 5:1–12 അല്ലെങ്കിൽ മധ്യസ്ഥവിശുദ്ധന്റെ സുവിശേഷം"]],
  verse:"കർത്താവിന്റെ ആലയത്തിലേക്കു നമുക്കു പോകാമെന്ന് അവർ പറഞ്ഞപ്പോൾ ഞാൻ സന്തോഷിച്ചു.",cite:"സങ്കീർത്തനം 122:1",
  points:[["എന്തുകൊണ്ട് ഒരു വിശുദ്ധനെ ആഘോഷിക്കുന്നു","മധ്യസ്ഥൻ ക്രിസ്തുവിലേക്കു ചൂണ്ടിക്കാണിക്കുന്ന സുഹൃത്തും മധ്യസ്ഥനുമാണ്, ക്രിസ്തുവിനു പകരക്കാരനല്ല."],["വിശ്വാസത്തിന്റെ ഒരു കുടുംബം","ഇടവക കുടുംബങ്ങളുടെ കുടുംബമാണ്: വിശുദ്ധരോടൊപ്പം സഹപൗരന്മാരും ദൈവഭവനത്തിലെ അംഗങ്ങളും (എഫേ 2:19)."],["യഥാർഥ അലങ്കാരം","ദീപാലങ്കാരങ്ങളും പ്രദക്ഷിണങ്ങളും വെടിക്കെട്ടും കടന്നുപോകുന്നു; കുമ്പസാരവും ഉപവിയും അനുരഞ്ജനവും നിലനിൽക്കുന്നു. തിരുനാളിന്റെ ഒരു പങ്കു ദരിദ്രർക്കായി മാറ്റിവയ്ക്കുക."],["മുന്നോട്ടു നോക്കി","ഒരു ജൂബിലി നന്ദിയോടെ പിന്നോട്ടും ദൗത്യബോധത്തോടെ മുന്നോട്ടും നോക്കുന്നു: ഇന്നു നമ്മുടെ ഇടവകയിൽ ആരാണ് ഇല്ലാത്തത്?"]],
  homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, സങ്കീർത്തകൻ പറയുന്നു: “കർത്താവിന്റെ ആലയത്തിലേക്കു നമുക്കു പോകാമെന്ന് അവർ പറഞ്ഞപ്പോൾ ഞാൻ സന്തോഷിച്ചു.” ഇന്നു നമ്മുടെ ഇടവക സന്തോഷിക്കുന്നു. നമ്മുടെ മധ്യസ്ഥന്റെ തിരുനാൾ (നമ്മുടെ ജൂബിലി) നാം ആഘോഷിക്കുന്നു; ഇടവകയുടെ കുടുംബം മുഴുവൻ സ്വന്തം വീട്ടിലേക്കു വന്നിരിക്കുന്നു.","നാം എന്തിനാണ് ഒരു വിശുദ്ധനെ ആദരിക്കുന്നത്? വിശുദ്ധൻ ക്രിസ്തുവിനു പകരമാകുന്നതുകൊണ്ടല്ല, വിശുദ്ധൻ നമുക്കു ക്രിസ്തുവിനെ കാണിച്ചുതരുന്നതുകൊണ്ടാണ്. നാം നടക്കുന്ന വഴിയിലൂടെ നമ്മുടെ മധ്യസ്ഥൻ നടന്നു; ലക്ഷ്യത്തിലെത്തി. ഈ ഇടവകയ്ക്കുവേണ്ടി പ്രാർഥിക്കുന്ന, സ്വർഗത്തിലെ നമ്മുടെ സുഹൃത്താണ് അദ്ദേഹം (അവൾ).","നമ്മുടെ തിരുനാളിനു ദീപാലങ്കാരങ്ങളും പ്രദക്ഷിണങ്ങളും സംഗീതവും ഭക്ഷണവുമുണ്ട്; അതു നല്ലതാണ്. പക്ഷേ ഒരു തിരുനാളിന്റെ യഥാർഥ അലങ്കാരം ശുദ്ധീകരിക്കപ്പെട്ട ഒരു ഹൃദയമാണ്: നല്ല ഒരു കുമ്പസാരം, അനുരഞ്ജിതമായ ഒരു കുടുംബം, ഓർക്കപ്പെടുന്ന ഒരു ദരിദ്രനായ അയൽക്കാരൻ. ആഘോഷിക്കാൻ കഴിയാത്തവരിലേക്കും ഈ തിരുനാളിന്റെ ഒരു പങ്ക് എത്തട്ടെ.","നമുക്കു മുന്നോട്ടും നോക്കാം. ഇന്നു നമ്മുടെ ഇടവകയിൽ ആരാണ് ഇല്ലാത്തത്? ആരെയാണു നമുക്കു തിരികെ ക്ഷണിക്കാനാവുക? വരുംതലമുറകൾക്കായി ഈ ഇടവക ദൈവത്തിന്റെ ജീവനുള്ള ഭവനമായിരിക്കാൻ നമ്മുടെ മധ്യസ്ഥൻ നമുക്കുവേണ്ടി മാധ്യസ്ഥ്യം വഹിക്കട്ടെ. ആമേൻ."],
  prayer:"കർത്താവായ ദൈവമേ, ഞങ്ങളുടെ ഇടവകയ്ക്കും ഞങ്ങൾക്കു കൈമാറിക്കിട്ടിയ വിശ്വാസത്തിനുമായി ഞങ്ങൾ നന്ദി പറയുന്നു. ഞങ്ങളുടെ മധ്യസ്ഥന്റെ മാധ്യസ്ഥ്യത്താൽ ഞങ്ങളെ ക്രിസ്തുവിൽ ഒരു കുടുംബമാക്കണമേ; ദരിദ്രരോട് ഉദാരരും അവസാനംവരെ വിശ്വസ്തരുമാക്കണമേ. ആമേൻ."}},

{id:"house",
 en:{t:"Blessing of a House",sub:"For the blessing of a new house (house warming)",
  read:[["Old Testament","Joshua 24:14–15 or Psalm 127:1"],["Epistle","Colossians 3:12–17"],["Gospel","Luke 19:1–10 or Luke 10:38–42"]],
  verse:"…but as for me and my household, we will serve the LORD.",cite:"Joshua 24:15",
  points:[["Unless the Lord builds the house","“Unless the LORD builds the house, those who build it labor in vain” (Psalm 127:1)."],["Salvation came to Zacchaeus' house","“Today salvation has come to this house” (Luke 19:9): Jesus enters, and the household changes."],["A domestic church","The home is where faith is first learnt: the prayer corner, the family rosary or evening prayer, the Bible on the table."],["An open door","Hospitality to the poor and to guests is a blessing on the house."]],
  homily:["Dear family, today we bless this new home. Many years of work and saving are in these walls. But the psalm reminds us: “Unless the Lord builds the house, those who build it labor in vain.” Today you invite the Lord to be the true builder.","When Jesus entered the house of Zacchaeus, he said: “Today salvation has come to this house.” A house is blessed not only by holy water but by the presence of Christ. Let him enter every room: the kitchen, the bedroom, the study, and especially the place of family prayer.","Joshua stood before the people and said: “As for me and my household, we will serve the Lord.” Make that your family motto. Keep a prayer corner, pray together every evening, keep the Bible open, and let the children see their parents kneel.","And keep your door open to guests and to the poor. A house that welcomes is a house that God fills with blessing. Peace be to this house and to all who live in it. Amen."],
  prayer:"Lord Jesus, as you entered the house of Zacchaeus, enter this home. Bless all who live here and all who visit, keep sickness, quarrels and every evil far from it, and make it a home of prayer, peace and welcome. Amen."},
 ml:{t:"ഭവനവെഞ്ചരിപ്പ്",sub:"പുതിയ ഒരു ഭവനത്തിന്റെ വെഞ്ചരിപ്പിന് (ഗൃഹപ്രവേശം)",
  read:[["പഴയനിയമം","ജോഷ്വ 24:14–15 അല്ലെങ്കിൽ സങ്കീർത്തനം 127:1"],["ലേഖനം","കൊളോസോസ് 3:12–17"],["സുവിശേഷം","ലൂക്കാ 19:1–10 അല്ലെങ്കിൽ ലൂക്കാ 10:38–42"]],
  verse:"ഞാനും എന്റെ കുടുംബവും കർത്താവിനെ സേവിക്കും.",cite:"ജോഷ്വ 24:15",
  points:[["കർത്താവു വീടു പണിയുന്നില്ലെങ്കിൽ","“കർത്താവു വീടു പണിയുന്നില്ലെങ്കിൽ പണിക്കാരുടെ അധ്വാനം വ്യർഥമാണ്” (സങ്കീ 127:1)."],["സക്കേവൂസിന്റെ ഭവനത്തിനു രക്ഷ","“ഇന്ന് ഈ ഭവനത്തിനു രക്ഷ ലഭിച്ചിരിക്കുന്നു” (ലൂക്കാ 19:9): യേശു പ്രവേശിക്കുന്നു, കുടുംബം മാറുന്നു."],["ഗാർഹികസഭ","വിശ്വാസം ആദ്യം പഠിക്കുന്നതു വീട്ടിലാണ്: പ്രാർഥനാമൂല, കുടുംബപ്രാർഥന അല്ലെങ്കിൽ ജപമാല, മേശപ്പുറത്തെ ബൈബിൾ."],["തുറന്ന ഒരു വാതിൽ","അതിഥികളോടും ദരിദ്രരോടുമുള്ള ആതിഥ്യം ഭവനത്തിന് ഒരു അനുഗ്രഹമാണ്."]],
  homily:["പ്രിയ കുടുംബമേ, ഇന്നു നാം ഈ പുതിയ ഭവനം വെഞ്ചരിക്കുന്നു. വർഷങ്ങളുടെ അധ്വാനവും സമ്പാദ്യവും ഈ ഭിത്തികളിലുണ്ട്. പക്ഷേ സങ്കീർത്തനം നമ്മെ ഓർമിപ്പിക്കുന്നു: “കർത്താവു വീടു പണിയുന്നില്ലെങ്കിൽ പണിക്കാരുടെ അധ്വാനം വ്യർഥമാണ്.” യഥാർഥ ശില്പിയായിരിക്കാൻ ഇന്നു നിങ്ങൾ കർത്താവിനെ ക്ഷണിക്കുന്നു.","സക്കേവൂസിന്റെ ഭവനത്തിൽ പ്രവേശിച്ചപ്പോൾ യേശു പറഞ്ഞു: “ഇന്ന് ഈ ഭവനത്തിനു രക്ഷ ലഭിച്ചിരിക്കുന്നു.” ഒരു ഭവനം വിശുദ്ധജലത്താൽ മാത്രമല്ല, ക്രിസ്തുവിന്റെ സാന്നിധ്യത്താലാണ് അനുഗ്രഹിക്കപ്പെടുന്നത്. ഓരോ മുറിയിലും അവിടുന്നു പ്രവേശിക്കട്ടെ: അടുക്കളയിലും കിടപ്പുമുറിയിലും പഠനമുറിയിലും, പ്രത്യേകിച്ചു കുടുംബപ്രാർഥനയുടെ ഇടത്തിലും.","ജനത്തിന്റെ മുമ്പിൽനിന്നു ജോഷ്വ പറഞ്ഞു: “ഞാനും എന്റെ കുടുംബവും കർത്താവിനെ സേവിക്കും.” അതു നിങ്ങളുടെ കുടുംബത്തിന്റെ ആപ്തവാക്യമാക്കുക. ഒരു പ്രാർഥനാമൂല സൂക്ഷിക്കുക, എല്ലാ സന്ധ്യയിലും ഒന്നിച്ചു പ്രാർഥിക്കുക, ബൈബിൾ തുറന്നുവയ്ക്കുക; മാതാപിതാക്കൾ മുട്ടുകുത്തുന്നതു മക്കൾ കാണട്ടെ.","അതിഥികൾക്കും ദരിദ്രർക്കുമായി നിങ്ങളുടെ വാതിൽ തുറന്നുവയ്ക്കുക. സ്വാഗതം ചെയ്യുന്ന ഒരു ഭവനത്തെ ദൈവം അനുഗ്രഹംകൊണ്ടു നിറയ്ക്കുന്നു. ഈ ഭവനത്തിനും ഇതിൽ വസിക്കുന്ന എല്ലാവർക്കും സമാധാനം. ആമേൻ."],
  prayer:"കർത്താവായ യേശുവേ, സക്കേവൂസിന്റെ ഭവനത്തിൽ പ്രവേശിച്ചതുപോലെ ഈ ഭവനത്തിൽ പ്രവേശിക്കണമേ. ഇവിടെ വസിക്കുന്നവരെയും സന്ദർശിക്കുന്നവരെയും അനുഗ്രഹിക്കണമേ; രോഗവും കലഹവും എല്ലാ തിന്മയും ഇതിൽനിന്ന് അകറ്റണമേ; ഇതിനെ പ്രാർഥനയുടെയും സമാധാനത്തിന്റെയും സ്വാഗതത്തിന്റെയും ഭവനമാക്കണമേ. ആമേൻ."}},

{id:"school",
 en:{t:"Beginning of the School or Academic Year",sub:"For a school Mass, the start of the academic year, or before examinations",
  read:[["Old Testament","1 Kings 3:5–12 or Proverbs 2:1–9"],["Epistle","Philippians 4:4–9"],["Gospel","Luke 2:41–52"]],
  verse:"And Jesus increased in wisdom and in years, and in divine and human favor.",cite:"Luke 2:52",
  points:[["Ask for wisdom, like Solomon","Solomon asked not for riches but for “an understanding mind” (1 Kings 3:9)."],["Jesus grew","“Jesus increased in wisdom and in years, and in divine and human favor” (Luke 2:52): grow in all three."],["Think about what is good","“Whatever is true, whatever is honorable… think about these things” (Philippians 4:8)."],["Teachers and parents","Thank teachers; parents are the first teachers."]],
  homily:["Dear children, dear teachers, a new year of learning begins. When God asked young King Solomon what he wanted, Solomon did not ask for riches or for victory over his enemies. He asked for wisdom, “an understanding mind”. God was so pleased that he gave him that and much more.","St Luke tells us that the boy Jesus “increased in wisdom and in years, and in divine and human favor.” Notice the three things: wisdom, which is learning; years, which is growing up; and favour with God and people, which is goodness. A good student grows in all three.","St Paul gives a simple rule for the mind: “Whatever is true, whatever is honorable, whatever is just, whatever is pure… think about these things.” What you watch and read and think shapes who you become.","Let us thank God for our teachers and our parents, and let us begin this year asking, like Solomon, for wisdom. Amen."],
  prayer:"Lord Jesus, you grew in wisdom and in favour with God and people. Bless our students, teachers and parents this year; give us understanding minds, honest work and kind hearts. Amen."},
 ml:{t:"അധ്യയനവർഷാരംഭം",sub:"സ്കൂൾ കുർബാനയ്ക്കോ അധ്യയനവർഷത്തിന്റെ ആരംഭത്തിനോ പരീക്ഷകൾക്കു മുമ്പോ",
  read:[["പഴയനിയമം","1 രാജാക്കന്മാർ 3:5–12 അല്ലെങ്കിൽ സുഭാഷിതങ്ങൾ 2:1–9"],["ലേഖനം","ഫിലിപ്പി 4:4–9"],["സുവിശേഷം","ലൂക്കാ 2:41–52"]],
  verse:"യേശു ജ്ഞാനത്തിലും പ്രായത്തിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതിയിലും വളർന്നുവന്നു.",cite:"ലൂക്കാ 2:52",
  points:[["സോളമനെപ്പോലെ ജ്ഞാനം ചോദിക്കുക","സോളമൻ സമ്പത്തല്ല, വിവേകമുള്ള ഒരു ഹൃദയമാണു ചോദിച്ചത് (1 രാജാ 3:9)."],["യേശു വളർന്നു","“യേശു ജ്ഞാനത്തിലും പ്രായത്തിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതിയിലും വളർന്നുവന്നു” (ലൂക്കാ 2:52): ഈ മൂന്നിലും വളരുക."],["നല്ലതിനെപ്പറ്റി ചിന്തിക്കുക","സത്യവും വന്ദ്യവും നീതിയുക്തവും നിർമലവുമായതെന്തോ… അതിനെപ്പറ്റി ചിന്തിക്കുവിൻ (ഫിലി 4:8)."],["അധ്യാപകരും മാതാപിതാക്കളും","അധ്യാപകർക്കു നന്ദി പറയുക; മാതാപിതാക്കളാണ് ആദ്യത്തെ അധ്യാപകർ."]],
  homily:["പ്രിയ കുഞ്ഞുങ്ങളേ, പ്രിയ അധ്യാപകരേ, പഠനത്തിന്റെ ഒരു പുതിയ വർഷം ആരംഭിക്കുന്നു. യുവരാജാവായ സോളമനോട് എന്തു വേണമെന്നു ദൈവം ചോദിച്ചപ്പോൾ, സമ്പത്തോ ശത്രുക്കളുടെമേൽ വിജയമോ അല്ല അവൻ ചോദിച്ചത്. ജ്ഞാനം, വിവേകമുള്ള ഒരു ഹൃദയം, അവൻ ചോദിച്ചു. ദൈവം അത്യധികം പ്രസാദിച്ച് അതും അതിലേറെയും അവനു നൽകി.","ബാലനായ യേശു ജ്ഞാനത്തിലും പ്രായത്തിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതിയിലും വളർന്നുവെന്നു വിശുദ്ധ ലൂക്കാ പറയുന്നു. മൂന്നു കാര്യങ്ങൾ ശ്രദ്ധിക്കൂ: ജ്ഞാനം, അതായതു പഠനം; പ്രായം, അതായതു വളർച്ച; ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതി, അതായതു നന്മ. നല്ല ഒരു വിദ്യാർഥി ഈ മൂന്നിലും വളരുന്നു.","മനസ്സിനായി വിശുദ്ധ പൗലോസ് ലളിതമായ ഒരു നിയമം നൽകുന്നു: സത്യവും വന്ദ്യവും നീതിയുക്തവും നിർമലവുമായതെന്തോ അതിനെപ്പറ്റി ചിന്തിക്കുവിൻ. നിങ്ങൾ കാണുന്നതും വായിക്കുന്നതും ചിന്തിക്കുന്നതുമാണു നിങ്ങളെ രൂപപ്പെടുത്തുന്നത്.","നമ്മുടെ അധ്യാപകർക്കും മാതാപിതാക്കൾക്കുമായി നമുക്കു ദൈവത്തിനു നന്ദി പറയാം; സോളമനെപ്പോലെ ജ്ഞാനം ചോദിച്ചുകൊണ്ട് ഈ വർഷം ആരംഭിക്കാം. ആമേൻ."],
  prayer:"ജ്ഞാനത്തിലും ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതിയിലും വളർന്ന കർത്താവായ യേശുവേ, ഈ വർഷം ഞങ്ങളുടെ വിദ്യാർഥികളെയും അധ്യാപകരെയും മാതാപിതാക്കളെയും അനുഗ്രഹിക്കണമേ; വിവേകമുള്ള ഹൃദയവും സത്യസന്ധമായ അധ്വാനവും ദയയുള്ള മനസ്സും ഞങ്ങൾക്കു നൽകണമേ. ആമേൻ."}}
];
