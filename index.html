if(typeof DOCT!=="undefined")DOCT.te=[
["నా దగ్గరకు రండి","యుగ మార్పు కాలంలో విశ్వాసాన్ని అందించడం గురించిన ఆలోచనలు; పోపుగారైన పద్నాలుగవ లియో ఆమోదించిన విశ్వాస సిద్ధాంత విభాగపు పత్రం."],
["మహిమాన్విత మానవత","కృత్రిమ మేధస్సు (AI) కాలంలో మానవ వ్యక్తి రక్షణ గురించి."],
["భవిష్యత్తును పుట్టించే నమ్మకత్వం","గురువుల శిక్షణ, గురువుల పరిచర్య, జీవితం గురించిన మహాసభ డిక్రీల (Optatam totius, Presbyterorum ordinis) 60వ వార్షికోత్సవం సందర్భంగా."],
["విశ్వాస ఐక్యతలో","నిసియా మహాసభ, మనం ఒప్పుకునే విశ్వాస సంగ్రహం 1700వ వార్షికోత్సవం సందర్భంగా."],
["నిరీక్షణ కొత్త పటాలు గీయడం","క్రైస్తవ విద్యపై మహాసభ ప్రకటన (Gravissimum educationis) 60వ వార్షికోత్సవం సందర్భంగా."],
["నేను నిన్ను ప్రేమించాను","పేదల పట్ల ప్రేమ గురించి."],
["ఆయన మనల్ని ప్రేమించాడు","యేసుక్రీస్తు హృదయపు మానవ, దైవ ప్రేమ గురించి."],
["అది నమ్మకమే","బాల యేసు పునీత తెరేసా 150వ జయంతి సందర్భంగా, దేవుని కనికర ప్రేమపై నమ్మకం గురించి."],
["దేవుని స్తుతించండి","Laudato si' కొనసాగింపుగా, వాతావరణ సంక్షోభం గురించి."],
["ఎంతో ఆశతో కోరుకున్నాను","దేవుని ప్రజల ఆరాధనా శిక్షణ గురించి."],
["అందరూ సహోదరులే","సహోదరత్వం, సామాజిక స్నేహం గురించి."],
["తండ్రి హృదయంతో","సార్వత్రిక శ్రీసభ పాలకునిగా ప్రకటించబడిన 150వ వార్షికోత్సవం సందర్భంగా పునీత యోసేపు గురించి."],
["ప్రియమైన అమెజాన్","అమెజాన్ ప్రాంతంపై సినడ్ తర్వాత."],
["క్రీస్తు జీవిస్తున్నాడు","యువతకు, దేవుని ప్రజలందరికీ."],
["సంతోషించండి, ఆనందించండి","నేటి లోకంలో పవిత్రతకు పిలుపు గురించి."],
["ప్రేమ ఆనందం","కుటుంబంలో ప్రేమ గురించి."],
["నీకు స్తుతి","మన ఉమ్మడి ఇంటి సంరక్షణ గురించి."],
["కనికరపు ముఖం","కనికరపు అసాధారణ జూబిలీని ప్రకటించే బుల్లా."],
["సువార్త ఆనందం","నేటి లోకంలో సువార్త ప్రకటన గురించి; మిషనరీ శ్రీసభ కార్యక్రమం."],
["విశ్వాస వెలుగు","విశ్వాసం గురించి; పదహారవ బెనెడిక్ట్ మొదలుపెట్టి ఫ్రాన్సిస్ పూర్తిచేశారు."],
["ప్రభువు వాక్యం","శ్రీసభ జీవితంలో, మిషన్‌లో దేవుని వాక్యం గురించి."],
["సత్యంలో ప్రేమ","ప్రేమలో, సత్యంలో సమగ్ర మానవాభివృద్ధి గురించి."],
["నిరీక్షణలో రక్షించబడినవారం","క్రైస్తవ నిరీక్షణ గురించి."],
["ప్రేమ దివ్యసంస్కారం","శ్రీసభ జీవితానికి, మిషన్‌కు మూలమూ శిఖరమూ అయిన దివ్యసత్ప్రసాదం గురించి."],
["దేవుడు ప్రేమయై ఉన్నాడు","క్రైస్తవ ప్రేమ గురించి."],
["శ్రీసభ దివ్యసత్ప్రసాదం నుండి జీవిస్తుంది","శ్రీసభతో దివ్యసత్ప్రసాదపు సంబంధం గురించి."],
["కన్య మరియ జపమాల","పవిత్ర జపమాల గురించి; వెలుగు రహస్యాలను పరిచయం చేస్తుంది."],
["నూతన సహస్రాబ్ది ప్రారంభంలో","2000 మహా జూబిలీ ముగింపులో: లోతుకు వెళ్లండి."],
["ఆసియాలో శ్రీసభ","ఆసియా సినడ్ తర్వాత; రక్షకుడైన యేసుక్రీస్తు గురించి, ఆసియాలో ఆయన మిషన్ గురించి. న్యూఢిల్లీలో సంతకం చేయబడింది."],
["విశ్వాసం, హేతువు","విశ్వాసం, హేతువుల మధ్య సంబంధం గురించి."],
["ప్రభువు దినం","ఆదివారాన్ని పవిత్రపరచడం గురించి."],
["తూర్పు వెలుగు","సిరియాక్ సంప్రదాయాలతో సహా తూర్పు శ్రీసభల సంపదల గురించి."],
["జీవపు సువార్త","మానవ జీవితపు విలువ, అలంఘనీయత గురించి."],
["విమోచకుని మిషన్","మిషనరీ ఆజ్ఞ శాశ్వత ప్రామాణికత గురించి."],
["విమోచకుని సంరక్షకుడు","క్రీస్తు, శ్రీసభ జీవితంలో పునీత యోసేపు వ్యక్తిత్వం, మిషన్ గురించి."],
["కుటుంబ సమాజం","నేటి లోకంలో క్రైస్తవ కుటుంబపు పాత్ర గురించి."],
["సువార్త ప్రకటన","సువార్త ప్రచారం గురించి: శ్రీసభ లోతైన గుర్తింపు."],
["మానవ జీవితం గురించి","జనన నియంత్రణ గురించి."],
["ప్రజల అభివృద్ధి","ప్రజల అభివృద్ధి గురించి."],
["జనాంగాలకు","శ్రీసభ మిషనరీ కార్యకలాపంపై డిక్రీ."],
["దేవుని వాక్యం","దైవ ప్రత్యక్షతపై సిద్ధాంత రాజ్యాంగం."],
["ఆనందం, నిరీక్షణ","నేటి లోకంలో శ్రీసభపై పాస్టోరల్ రాజ్యాంగం."],

ml:["SOS: പ്രതിസന്ധിയിലായ വൈദികർക്ക്","ബുദ്ധിമുട്ടിലൂടെയോ ഏകാന്തതയിലൂടെയോ രോഗത്തിലൂടെയോ പ്രതിസന്ധിയിലൂടെയോ കടന്നുപോകുന്ന വൈദികർക്കും, ആവശ്യത്തിലിരിക്കുന്ന ഒരു വൈദികനെ സഹായിക്കാൻ ആഗ്രഹിക്കുന്നവർക്കും. ഇമെയിലിൽ എഴുതുക: രഹസ്യമായി കേൾക്കപ്പെടും, പ്രാർഥനയോടെ കൂടെയുണ്ടാകും.","വാട്ട്സ്ആപ്പിൽ സന്ദേശം അയയ്ക്കുക","വാട്ട്സ്ആപ്പ് സംവിധാനം ഉടൻ ആരംഭിക്കും.","ഇമെയിലിൽ എഴുതുക"],
ta:["SOS: துன்பத்தில் இருக்கும் குருக்களுக்கு","சிரமம், தனிமை, நோய் அல்லது நெருக்கடியைக் கடந்து செல்லும் குருக்களுக்கும், தேவையில் இருக்கும் ஒரு குருவுக்கு உதவ விரும்புவோருக்கும். மின்னஞ்சலில் எழுதுங்கள்: இரகசியமாகச் செவிமடுக்கப்படுவீர்கள், இறைவேண்டலோடு உடனிருப்போம்.","வாட்ஸ்அப்பில் செய்தி அனுப்புங்கள்","வாட்ஸ்அப் இணைப்பு விரைவில் தொடங்கும்.","மின்னஞ்சலில் எழுதுங்கள்"],
hi:["SOS: संकट में पुरोहितों के लिए","कठिनाई, अकेलेपन, बीमारी या संकट से गुज़र रहे पुरोहितों के लिए, और उन सबके लिए जो किसी ज़रूरतमंद पुरोहित की मदद करना चाहते हैं। ईमेल पर लिखिए: आपकी बात गोपनीय रूप से सुनी जाएगी और प्रार्थना के साथ आपका साथ दिया जाएगा।","व्हाट्सऐप पर संदेश भेजें","व्हाट्सऐप सेवा जल्द शुरू होगी।","ईमेल से लिखें"],
kn:["SOS: ಸಂಕಷ್ಟದಲ್ಲಿರುವ ಯಾಜಕರಿಗಾಗಿ","ಕಷ್ಟ, ಏಕಾಂತ, ಅನಾರೋಗ್ಯ ಅಥವಾ ಬಿಕ್ಕಟ್ಟಿನ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತಿರುವ ಯಾಜಕರಿಗೂ, ಅಗತ್ಯದಲ್ಲಿರುವ ಯಾಜಕರಿಗೆ ನೆರವಾಗಲು ಬಯಸುವವರಿಗೂ. ಇಮೇಲ್ ಮೂಲಕ ಬರೆಯಿರಿ: ನಿಮ್ಮ ಮಾತನ್ನು ಗೌಪ್ಯವಾಗಿ ಕೇಳಲಾಗುವುದು, ಪ್ರಾರ್ಥನೆಯೊಂದಿಗೆ ಜೊತೆಗಿರುತ್ತೇವೆ.","ವಾಟ್ಸ್ಆ್ಯಪ್‌ನಲ್ಲಿ ಸಂದೇಶ ಕಳುಹಿಸಿ","ವಾಟ್ಸ್ಆ್ಯಪ್ ಸೇವೆ ಶೀಘ್ರದಲ್ಲೇ ಆರಂಭವಾಗುತ್ತದೆ.","ಇಮೇಲ್ ಮೂಲಕ ಬರೆಯಿರಿ"],
te:["SOS: కష్టంలో ఉన్న గురువులకు","కష్టం, ఒంటరితనం, అనారోగ్యం లేదా సంక్షోభం గుండా వెళ్తున్న గురువులకు, అవసరంలో ఉన్న ఒక గురువుకు సహాయం చేయాలనుకునే వారికి. ఈమెయిల్‌లో రాయండి: మీ మాట గోప్యంగా వినబడుతుంది, ప్రార్థనతో మీకు తోడుగా ఉంటాము.","వాట్సాప్‌లో సందేశం పంపండి","వాట్సాప్ సేవ త్వరలో ప్రారంభమవుతుంది.","ఈమెయిల్ ద్వారా రాయండి"],
de:["SOS: Priester in Not","Für Priester, die durch Schwierigkeiten, Einsamkeit, Krankheit oder eine Krise gehen, und für alle, die einem Priester in Not helfen möchten. Schreiben Sie per E-Mail: Sie werden vertraulich gehört und im Gebet begleitet.","Nachricht über WhatsApp","Die WhatsApp-Verbindung wird in Kürze freigeschaltet.","Per E-Mail schreiben"],
it:["SOS: Sacerdoti in difficoltà","Per i sacerdoti che attraversano difficoltà, solitudine, malattia o crisi, e per chi desidera aiutare un sacerdote nel bisogno. Scrivete per email: sarete ascoltati con riservatezza e accompagnati nella preghiera.","Scrivi su WhatsApp","Il contatto WhatsApp sarà attivato a breve.","Scrivi per email"],
es:["SOS: Sacerdotes en dificultad","Para los sacerdotes que atraviesan dificultades, soledad, enfermedad o crisis, y para quien desee ayudar a un sacerdote necesitado. Escriba por correo: será escuchado con discreción y acompañado en la oración.","Escribir por WhatsApp","La línea de WhatsApp se abrirá pronto.","Escribir por correo"],

fr:["SOS : Prêtres en détresse","Pour les prêtres qui traversent une difficulté, la solitude, la maladie ou une crise, et pour quiconque souhaite aider un prêtre dans le besoin. Écrivez par e-mail : vous serez écouté en toute discrétion et accompagné dans la prière.","Écrire sur WhatsApp","La ligne WhatsApp ouvrira bientôt.","Écrire par e-mail"],
tl:["SOS: Para sa mga Paring Nasa Pagsubok","Para sa mga paring dumaraan sa hirap, pag-iisa, karamdaman o krisis, at para sa sinumang nais tumulong sa isang paring nangangailangan. Sumulat sa email: pakikinggan ka nang may paglilihim at sasamahan sa panalangin.","Mag-message sa WhatsApp","Malapit nang magbukas ang linya sa WhatsApp.","Sumulat sa email"]}};

  ["⌂ Leo: rudi mwanzo","Kutoka ukurasa wowote (watakatifu, nyaraka za Papa, matukio maalum au tarehe nyingine), bonyeza \"⌂ Leo\" au kichwa cha juu ili kurudi kwenye masomo ya siku."],
  ["Nenda siku yoyote","Tumia ‹ › kwa siku iliyopita au inayofuata; bonyeza 📅 kuchagua tarehe; au bonyeza \"Leo\". Mstari wa wiki unaonyesha sikukuu ya kila siku na watakatifu wa ibada yako; bonyeza siku kuifungua. Kwa ‹ › karibu na jina la wiki unahamia wiki kwa wiki."],
  ["Fungua sehemu tatu","Neno la siku: siku kwa mtazamo mmoja, masomo, tafakari, Mababa wa Kanisa, Mamlaka Fundishi, watakatifu. Hubiri na fundisha: 1. muhtasari wa mahubiri (hoja na Maandiko), 2. mahubiri kamili pamoja na mahubiri ya watoto na ujumbe wa kushirikisha, 3. kikundi cha sala, 4. katekesi. Ifahamu liturujia: masomo na maneno ya liturujia. Viungo hivi vitatu viko pia chini ya kila ukurasa."],
  ["Bonyeza kujua zaidi","Bonyeza jina la kipindi cha liturujia (juu ya kichwa cha siku) kuona maelezo mafupi na maana ya rangi. Katika \"Kwa mtazamo mmoja\", bonyeza jina la mtakatifu kufungua ukurasa wake."],
  ["Watakatifu","Kitufe cha \"Watakatifu\" kinaonyesha watakatifu wa ibada yako. Unaweza kuchagua kutoka orodha au kuona mwezi siku kwa siku. Kila mtakatifu ana maisha, mafundisho, hadithi (zenye alama ya historia, mapokeo au hekaya), maneno ya kukumbuka, muhtasari na mahubiri, na sala. \"Siku ya sikukuu katika kalenda\" inakupeleka kwenye masomo ya siku hiyo."],
  ["Tafuta","Andika tarehe, sikukuu, mtakatifu, kitabu cha Biblia au neno lolote kwa lugha yako. Watakatifu na matukio maalum huonekana kwanza, kisha siku. Bonyeza tokeo kulifungua."],
  ["Soma kwa urahisi na shirikisha","A− na A+ hubadilisha ukubwa wa maandishi. Katika \"Hubiri na fundisha\" (2. mahubiri kamili), \"Nakili maandishi\" hunakili ujumbe mfupi kwa WhatsApp au Telegram."],
  ["Nyaraka za Papa na matukio maalum","\"Nyaraka za Papa\" zinatoa barua za kitume na nyaraka nyingine, pamoja na viungo vya habari mpya, hotuba na ujumbe kutoka Vatikano. \"Matukio maalum\" yanatoa mahubiri kwa sakramenti, mazishi, maadhimisho ya miaka na matukio mengine."],
  ["Tuandikie","Vitufe vya nia, mapendekezo na maoni chini ya ukurasa hufungua Gmail kwenye kompyuta au programu ya barua pepe kwenye simu, anwani ikiwa tayari imewekwa. Unaweza pia kunakili anwani na kuandika kutoka barua pepe yoyote."]],
