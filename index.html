A("smc","2026-12-25","ta",{t:"பிறப்புக் காலம் (யல்தா)",
 p:["கிறிஸ்து பிறப்பின் தூய குர்பானாவோடு சீரோ மலபார் திருச்சபை அறிவிப்புகளிலிருந்து அவற்றின் நிறைவுக்குக் கடந்து செல்கிறது. வாக்கு மனிதரானார், நம்மிடையே குடிகொண்டார் (யோவா 1:14). சிரிய மொழியில் யல்தா எனப்படும் இந்தக் குறுகிய காலம் ஜனவரி 6 திருக்காட்சி (தெனஹா) வரை நீள்கிறது.","நமது பாரம்பரியம் கிறிஸ்து பிறப்பை ஓர் இனிய குழந்தையின் பிறப்பாக மட்டும் காணவில்லை; மனுவுருவாதல் மறைபொருளைத் தியானிக்கிறது: உண்மைக் கடவுளான நித்திய மகன், கடவுளாக இருப்பதை நிறுத்தாமல், கன்னி மரியாவிடமிருந்து பிறந்து உண்மை மனிதரானார்.","பிறப்பு இரவு ஒளியின் இரவு. பல பங்குகளில் ஆலயத்துக்கு முன் நெருப்பு மூட்டி அதைச் சுற்றி வரும் தீயுழலிச்சில் என்ற பழைய வழக்கம் உண்டு; வயலில் காவல் காத்த இடையர்களையும் உலகுக்கு வந்த ஒளியையும் நினைவுகூர்ந்து. தொடர்ந்து வரும் நாட்கள் புனித ஸ்தேவான், திருக்குடும்பம், மாசில்லாக் குழந்தைகள் ஆகியோரை நினைவுகூர்கின்றன."],
 k:[["இக்காலம் கொண்டாடுவது","பெத்லகேமில் கன்னி மரியாவிடமிருந்து இறைமகனின் பிறப்பும் மனுவுருவாதல் மறைபொருளும்."],["வாசிக்க வேண்டிய இறைவார்த்தை","லூக் 2:1–20; யோவா 1:1–18; கலா 4:4–7; எசா 9:2–7."],["திருவழிபாட்டில்","பிறப்பு இரவுத் தூய குர்பானா, பல பங்குகளில் தீயுழலிச்சில், தொடரும் விழாக்கள்; ஜனவரி 6 தெனஹாவுக்கு இட்டுச் செல்லும் காலம்."],["எப்படி வாழலாம்","அமைதியாகக் குடிலைச் சந்தியுங்கள். விழாவுக்குப் பிந்தைய நாட்களிலும் தூய குர்பானாவில் பங்கெடுங்கள். ஏழைகள், நோயாளர், புலம்பெயர் தொழிலாளர்களோடு உணவைப் பகிருங்கள்."],["வீட்டில்","தெனஹா வரை நட்சத்திரத்தையும் குடிலையும் வைத்திருங்கள். ஒவ்வொரு மாலையும் குடிலின் முன் சிறு செபம் சொல்லுங்கள்."]]});
A("smc","2026-12-25","hi",{t:"जन्म काल (यल्दा)",
 p:["ख्रीस्त-जन्म के पवित्र कुर्बाना के साथ सीरो-मलबार कलीसिया घोषणाओं से उनकी पूर्ति की ओर बढ़ती है। शब्द ने देह धारण किया और हमारे बीच निवास किया (योहन 1:14)। सीरियाई में यल्दा कहलाने वाला यह छोटा काल 6 जनवरी के प्रकटीकरण-पर्व (दनहा) तक चलता है।","हमारी परंपरा ख्रीस्त-जन्म को केवल एक प्यारे शिशु के जन्म के रूप में नहीं देखती; वह देहधारण के रहस्य पर ध्यान करती है: सच्चे ईश्वर, अनन्त पुत्र, ईश्वर बने रहते हुए, कुँवारी मरियम से जन्म लेकर सच्चे मनुष्य बने।","जन्म की रात प्रकाश की रात है। कई पल्लियों में गिरजाघर के सामने आग जलाकर उसके चारों ओर चलने की प्राचीन प्रथा, तीयुषलिच्चिल, निभाई जाती है, खेतों में पहरा देते चरवाहों और संसार में आए प्रकाश की याद में। आगे के दिन संत स्तेफ़नुस, पवित्र परिवार और निर्दोष शिशुओं की याद करते हैं।"],
 k:[["यह काल क्या मनाता है","बेथलेहेम में कुँवारी मरियम से ईश-पुत्र का जन्म और देहधारण का रहस्य।"],["पढ़ने के लिए वचन","लूकस 2:1–20; योहन 1:1–18; गलातियों 4:4–7; इसायाह 9:1–6।"],["धर्मविधि में","जन्म-रात्रि का पवित्र कुर्बाना, कई पल्लियों में अग्नि-विधि, और आगे के पर्व; 6 जनवरी के दनहा तक।"],["कैसे जिएँ","चरनी के पास मौन में जाएँ। पर्व के बाद के दिनों में भी पवित्र कुर्बाना में भाग लें। ग़रीबों, रोगियों और प्रवासी मज़दूरों के साथ भोजन बाँटें।"],["घर में","दनहा तक तारा और चरनी रखें। हर शाम चरनी के सामने छोटी प्रार्थना करें।"]]});
A("smc","2026-12-25","te",{t:"జనన కాలం (యల్దా)",
 p:["క్రీస్తు జయంతి పవిత్ర కుర్బానాతో సీరో మలబార్ శ్రీసభ ప్రకటనల నుండి వాటి నెరవేర్పుకు చేరుతుంది. వాక్యము శరీరధారియై మన మధ్య నివసించెను (యోహాను 1:14). సిరియాక్‌లో యల్దా అనే ఈ చిన్న కాలం జనవరి 6 దనహా పండుగ వరకు సాగుతుంది.","మన సంప్రదాయం క్రీస్తు జయంతిని ఒక ముద్దు బిడ్డ జననంగా మాత్రమే చూడదు; మానవావతార రహస్యాన్ని ధ్యానిస్తుంది: నిజమైన దేవుడైన నిత్య కుమారుడు, దేవునిగా ఉండటం మానకుండానే, కన్య మరియమ్మ నుండి జన్మించి నిజమైన మానవుడయ్యాడు.","జనన రాత్రి వెలుగు రాత్రి. చాలా విచారణల్లో దేవాలయం ముందు మంట వెలిగించి దాని చుట్టూ నడిచే పాత ఆచారం ఉంది, పొలాల్లో కాపలా కాసిన గొర్రెల కాపరులను, లోకంలోకి వచ్చిన వెలుగును జ్ఞాపకం చేసుకుంటూ. తరువాతి రోజులు పరిశుద్ధ స్తెఫాను, పవిత్ర కుటుంబం, పసిబిడ్డల హతసాక్షులను జ్ఞాపకం చేస్తాయి."],
 k:[["ఈ కాలం జరుపుకునేది","బేత్లెహేములో కన్య మరియమ్మ నుండి దేవుని కుమారుని జననం, మానవావతార రహస్యం."],["చదవవలసిన వాక్యం","లూకా 2:1–20; యోహాను 1:1–18; గలతీ 4:4–7; యెషయా 9:2–7."],["ఆరాధనలో","జనన రాత్రి పవిత్ర కుర్బానా, చాలా విచారణల్లో అగ్ని ఆచారం, తరువాతి పండుగలు; జనవరి 6 దనహా వరకు."],["ఎలా జీవించాలి","మౌనంగా పశువుల పాకను దర్శించండి. పండుగ తరువాతి రోజుల్లోనూ పవిత్ర కుర్బానాలో పాల్గొనండి. పేదలు, రోగులు, వలస కార్మికులతో భోజనం పంచుకోండి."],["ఇంట్లో","దనహా వరకు నక్షత్రాన్ని, పశువుల పాకను ఉంచండి. ప్రతి సాయంత్రం పాక ముందు చిన్న ప్రార్థన చేయండి."]]});

/* ===== Syro-Malankara: Koodosh Eetho ===== */
A("smk","2026-11-01","ta",{t:"கூதோஷ் ஈத்தோ, ஹூதோஷ் ஈத்தோ: திருவழிபாட்டு ஆண்டின் தொடக்கம்",
 p:["திருச்சபையின் தூய்மையாக்கலான கூதோஷ் ஈத்தோ ஞாயிறோடு சீரோ மலங்கரா கத்தோலிக்கத் திருச்சபை இன்று தன் திருவழிபாட்டு ஆண்டைத் தொடங்குகிறது; அடுத்த ஞாயிறு திருச்சபையின் புதுப்பித்தலான ஹூதோஷ் ஈத்தோ. மேற்கு சிரியப் பாரம்பரியத்தில் ஆண்டு கிறிஸ்து பிறப்போடு அல்ல, திருச்சபையோடு தொடங்குகிறது: கடவுள் ஒன்றுகூட்டித் தூய்மையாக்கிய மக்கள்.","வரும் ஆண்டு வெளிப்படுத்தும் கிறிஸ்துவின் மறைபொருள் முழுவதையும் நாம் திருச்சபையிலும் திருச்சபை வழியாகவுமே பெறுகிறோம். கடவுள் நம்மைத் தம் தூய மக்களாகவும் அரச குருத்துவமாகவும் ஆக்கினார் (1 பேது 2:9). கிறிஸ்து திருச்சபையை அன்பு செய்து அவளுக்காகத் தம்மையே கையளித்தார் (எபே 5:25–26); தூய ஆவியார் அவளை எப்போதும் புதுப்பிக்கிறார்.","1930-ல் மலங்கரா கத்தோலிக்கக் கூட்டுறவை உரோமை ஆயரோடு முழு ஒன்றிப்புக்கு இட்டுச் சென்ற இறையடியார் மார் இவானியோஸின் ஒன்றிப்பு உணர்வில் (H), திருச்சபைக்கான நன்றியோடும் அவளது புதுப்பித்தலுக்கான செபத்தோடும் ஆண்டைத் தொடங்க இந்த இரு ஞாயிறுகள் அழைக்கின்றன."],
 k:[["இந்த ஞாயிறுகள் கொண்டாடுவது","கிறிஸ்துவால் தூய்மையாக்கப்பட்ட திருச்சபை (கூதோஷ் ஈத்தோ); கடவுளின் இல்லமாகப் புதுப்பிக்கப்பட்ட திருச்சபை (ஹூதோஷ் ஈத்தோ)."],["வாசிக்க வேண்டிய இறைவார்த்தை","எபே 5:25–32; 1 பேது 2:4–10; எபி 9:1–14; மத் 16:13–20; யோவா 10:22–30."],["திருவழிபாட்டில்","தூய குர்பானாவின் பாடல்கள் திருச்சபையை மணமகளாகவும் கடவுளின் தூயகமாகவும் பாடுகின்றன. அதன்பின் ஆண்டு அறிவிப்புகளின் ஞாயிறுகளுக்கும் யல்தோவுக்கும் செல்கிறது."],["எப்படி வாழலாம்","உங்கள் திருமுழுக்குக்காகவும் பங்குக்காகவும் நன்றி கூறுங்கள். திருத்தந்தைக்காகவும் நமது பேராயர்-கத்தோலிக்கோசுக்காகவும் ஆயர்களுக்காகவும் கிறிஸ்தவ ஒன்றிப்புக்காகவும் செபியுங்கள்."],["வீட்டில்","மத் 16:13–20 ஒன்றாக வாசியுங்கள். குழந்தைகளுக்கு அவர்களின் திருமுழுக்குப் படத்தைக் காட்டுங்கள். பங்குத்தந்தைக்காகச் செபியுங்கள்."]]});
A("smk","2026-11-01","hi",{t:"कूदोश ईत्तो और हूदोश ईत्तो: धर्मविधिक वर्ष का आरम्भ",
 p:["कलीसिया के पवित्रीकरण, कूदोश ईत्तो रविवार के साथ सीरो-मलंकरा काथलिक कलीसिया आज अपना धर्मविधिक वर्ष आरम्भ करती है; अगले रविवार कलीसिया का नवीनीकरण, हूदोश ईत्तो। पश्चिमी सीरियाई परंपरा में वर्ष ख्रीस्त-जन्म से नहीं, कलीसिया से आरम्भ होता है: वह प्रजा जिसे ईश्वर ने एकत्र करके पवित्र किया।","आने वाला वर्ष ख्रीस्त का जो पूरा रहस्य प्रकट करेगा, उसे हम कलीसिया में और कलीसिया के द्वारा ही पाते हैं। ईश्वर ने हमें अपनी पवित्र प्रजा और राजकीय याजक-वर्ग बनाया (1 पेत्रुस 2:9)। मसीह ने कलीसिया से प्रेम किया और उसके लिए अपने को अर्पित किया (एफ़ेसियों 5:25–26); पवित्र आत्मा उसे सदा नया करता है।","1930 में मलंकरा काथलिक समुदाय को रोम के धर्माध्यक्ष के साथ पूर्ण एकता में लाने वाले ईश-सेवक मार इवानियोस की एकता-भावना में (H), ये दो रविवार कलीसिया के लिए कृतज्ञता और उसके नवीनीकरण की प्रार्थना के साथ वर्ष आरम्भ करने का निमंत्रण देते हैं।"],
 k:[["ये रविवार क्या मनाते हैं","मसीह द्वारा पवित्र की गई कलीसिया (कूदोश ईत्तो); ईश्वर के घर के रूप में नवीकृत कलीसिया (हूदोश ईत्तो)।"],["पढ़ने के लिए वचन","एफ़ेसियों 5:25–32; 1 पेत्रुस 2:4–10; इब्रानियों 9:1–14; मत्ती 16:13–20; योहन 10:22–30।"],["धर्मविधि में","पवित्र कुर्बाना के भजन कलीसिया को दुल्हन और ईश्वर का पवित्र स्थान गाते हैं। फिर वर्ष घोषणाओं के रविवारों और यल्दो की ओर बढ़ता है।"],["कैसे जिएँ","अपने बपतिस्मा और पल्ली के लिए धन्यवाद दें। संत पापा, हमारे मेजर आर्चबिशप-काथोलिकोस, धर्माध्यक्षों और ख्रीस्तीय एकता के लिए प्रार्थना करें।"],["घर में","मत्ती 16:13–20 साथ पढ़ें। बच्चों को उनके बपतिस्मा का चित्र दिखाएँ। पल्ली-पुरोहित के लिए प्रार्थना करें।"]]});

/* ===== Syro-Malankara: Suboro ===== */
A("smk","2026-11-15","ta",{t:"அறிவிப்புகளின் ஞாயிறுகள் (சூபோரோ): யல்தோவுக்கான தயாரிப்பு",
 p:["இன்று முதல் சீரோ மலங்கரா திருச்சபை, நம் ஆண்டவரின் பிறப்பான யல்தோவுக்குத் தயாரிக்கும் சூபோரோ காலத்துக்குள், அறிவிப்புகளின் ஞாயிறுகளுக்குள் நுழைகிறது. ஒவ்வொரு ஞாயிறும் கடவுளின் திட்டத்தின் ஒரு படியைத் தியானிக்கிறோம்: செக்கரியாவுக்குச் செய்தி, மரியாவுக்கு மங்கள வார்த்தை, மரியா எலிசபெத்தைச் சந்தித்தல், திருமுழுக்கு யோவானின் பிறப்பு, யோசேப்புக்கு வெளிப்பாடு, யல்தோவுக்கு முந்தைய ஞாயிறு பெத்லகேமுக்கான பயணம்.","கடவுள் பொறுமையோடும் கனிவோடும் தம் வருகையைத் தயாரிக்கிறார்: ஆலயத்தில் ஒரு முதிய குருவிடம், ஒரு சிற்றூரில் ஓர் இளம் கன்னியிடம், கனவில் ஒரு தச்சரிடம் பேசுகிறார். மையத்தில் இறைவனின் தாய் நிற்கிறார்: நம்பியவர் பேறுபெற்றவர் (லூக் 1:45).","டிசம்பர் 1 முதல் விசுவாசிகள் யல்தோ நோன்பை செபம், ஒறுத்தல், ஒப்புரவு, பிறரன்போடு கடைப்பிடிக்கிறார்கள். இறைவாக்கினர் காத்திருந்தது போல ஏக்கத்தோடும் விசுவாசத்தோடும் ஆண்டவருக்காகக் காத்திருக்க இக்காலம் கற்பிக்கிறது."],
 k:[["இக்காலம் கொண்டாடுவது","கிறிஸ்துவின் வருகையின் அறிவிப்புகளும் அவற்றை ஏற்றவர்களின் விசுவாசமும்."],["ஞாயிறுகள்","செக்கரியாவுக்குச் செய்தி (லூக் 1:5–25); மங்கள வார்த்தை (லூக் 1:26–38); சந்திப்பு (லூக் 1:39–56); யோவானின் பிறப்பு (லூக் 1:57–66); யோசேப்புக்கு வெளிப்பாடு (மத் 1:18–25); யல்தோவுக்கு முந்தைய ஞாயிறு: பெத்லகேமுக்குப் பயணம் (லூக் 2:1–5)."],["யல்தோ நோன்பு","டிசம்பர் 1–24, வழக்கப்படி: எளிய உணவு, ஒறுத்தல், அதிக செபம், ஒப்புரவு, ஏழைகளுக்குத் தானம்."],["எப்படி வாழலாம்","ஒவ்வொரு நாளும் மரியாவின் புகழ்ப்பாடலைச் செபியுங்கள். லூக்கா முதல் அதிகாரத்தை மெதுவாக வாசியுங்கள். மரியா எலிசபெத்தைச் சந்தித்தது போல ஒரு பிறரன்புச் சந்திப்பு செய்யுங்கள்."],["வீட்டில்","குடிலை ஒன்றாகத் தயாரியுங்கள். கருவுற்ற தாய்மாருக்காகவும் குழந்தைக்காகக் காத்திருக்கும் குடும்பங்களுக்காகவும் செபியுங்கள்."]]});
A("smk","2026-11-15","hi",{t:"घोषणाओं के रविवार (सूबोरो): यल्दो की तैयारी",
 p:["आज से सीरो-मलंकरा कलीसिया घोषणाओं के रविवारों, सूबोरो काल में प्रवेश करती है, जो हमारे प्रभु के जन्म, यल्दो, की तैयारी है। हर रविवार हम ईश्वर की योजना के एक चरण पर ध्यान करते हैं: ज़करियस को संदेश, मरियम को मंगल-समाचार, मरियम का एलीज़बेथ से भेंट, योहन बपतिस्ता का जन्म, यूसुफ़ को प्रकाशन, और यल्दो से पहले के रविवार बेथलेहेम की यात्रा।","ईश्वर धैर्य और कोमलता से अपने आगमन की तैयारी करते हैं: मंदिर में एक वृद्ध याजक से, एक छोटे नगर में एक युवा कुँवारी से, स्वप्न में एक बढ़ई से बात करते हैं। केंद्र में ईश्वर की माता हैं: धन्य है वह जिसने विश्वास किया (लूकस 1:45)।","1 दिसंबर से विश्वासी प्रार्थना, परहेज़, पापस्वीकार और परोपकार के साथ यल्दो का उपवास रखते हैं। यह काल हमें नबियों की तरह लालसा और विश्वास से प्रभु की प्रतीक्षा करना सिखाता है।"],
 k:[["यह काल क्या मनाता है","ख्रीस्त के आगमन की घोषणाएँ और उन्हें स्वीकार करने वालों का विश्वास।"],["रविवार","ज़करियस को संदेश (लूकस 1:5–25); मंगल-समाचार (लूकस 1:26–38); भेंट (लूकस 1:39–56); योहन का जन्म (लूकस 1:57–66); यूसुफ़ को प्रकाशन (मत्ती 1:18–25); यल्दो से पहले: बेथलेहेम की यात्रा (लूकस 2:1–5)।"],["यल्दो उपवास","1 से 24 दिसंबर, परंपरा के अनुसार: सादा भोजन, परहेज़, अधिक प्रार्थना, पापस्वीकार, ग़रीबों को दान।"],["कैसे जिएँ","प्रतिदिन मरियम का स्तुति-गीत प्रार्थना करें। लूकस का पहला अध्याय धीरे-धीरे पढ़ें। मरियम की तरह किसी से प्रेम-भेंट करें।"],["घर में","चरनी साथ तैयार करें। गर्भवती माताओं और संतान की प्रतीक्षा करने वाले परिवारों के लिए प्रार्थना करें।"]]});

A("smk","2026-12-25","ta",{t:"யல்தோ: நம் ஆண்டவரின் பிறப்பு",
 p:["நம் ஆண்டவர் இயேசு கிறிஸ்துவின் உடல்வழிப் பிறப்பான யல்தோவை இன்று சீரோ மலங்கரா திருச்சபை கொண்டாடுகிறது. அறிவிப்புகளின் ஞாயிறுகள் நிறைவேறுகின்றன: காலங்களுக்கெல்லாம் முன் தந்தையிடமிருந்து பிறந்த இறைவார்த்தை, பெத்லகேமில் இறைவனின் தாயான தூய கன்னி மரியாவிடமிருந்து பிறக்கிறார்.","மேற்கு சிரியத் தந்தையர், சிறப்பாகப் புனித எப்ரேம், வியப்போடு இம்மறைபொருளைப் பாடினர்: பிரபஞ்சத்தைத் தாங்குபவர் தாயின் கரங்களில் தாங்கப்படுகிறார்; படைப்பனைத்தையும் ஊட்டுபவர் தாயிடம் பால் அருந்துகிறார் (p).","பல பங்குகள் பவனியோடும் நெருப்பு ஆசீர்வாதத்தோடும் பழைய பிறப்பு வழிபாட்டைக் கடைப்பிடிக்கின்றன. தூய குர்பானா பெருமகிழ்வோடு கொண்டாடப்படுகிறது; யல்தோ நோன்பு நிறைவடைகிறது. தொடரும் நாட்கள் ஜனவரி 6 தெனஹாவுக்கு இட்டுச் செல்கின்றன."],
 k:[["இக்காலம் கொண்டாடுவது","நம் மீட்புக்காக இறைவனின் தாயான கன்னி மரியாவிடமிருந்து இறைவனின் நித்திய மகனின் உடல்வழிப் பிறப்பு."],["வாசிக்க வேண்டிய இறைவார்த்தை","லூக் 2:1–20; மத் 2:1–12; யோவா 1:1–14; கலா 4:4–7; மீக் 5:2–4."],["திருவழிபாட்டில்","பிறப்பு வழிபாடு, பல பங்குகளில் பவனியும் நெருப்பு ஆசீர்வாதமும், மகிழ்ச்சியான தூய குர்பானா; ஜனவரி 6 தெனஹா வரை."],["எப்படி வாழலாம்","யல்தோவின் மகிழ்ச்சியைத் தொடரும் நாட்களிலும் காத்துக்கொள்ளுங்கள். நோயாளரையும் தனிமையில் இருப்பவர்களையும் சந்தியுங்கள். ஆண்டு இறுதியில் நன்றி கூறுங்கள்."],["வீட்டில்","தெனஹா வரை குடிலை வைத்திருங்கள். லூக்காவின் பிறப்பு விவரணத்தை ஒன்றாக வாசியுங்கள். பிரிந்திருக்கும் குடும்பங்களுக்காகச் செபியுங்கள்."]]});
A("smk","2026-12-25","hi",{t:"यल्दो: हमारे प्रभु का जन्म",
 p:["हमारे प्रभु येसु ख्रीस्त के देह में जन्म, यल्दो, को आज सीरो-मलंकरा कलीसिया मनाती है। घोषणाओं के रविवार पूर्ण होते हैं: सब युगों से पहले पिता से जन्मा ईश्वर का वचन बेथलेहेम में ईश्वर की माता पवित्र कुँवारी मरियम से जन्म लेता है।","पश्चिमी सीरियाई आचार्यों, विशेषकर संत एफ्रेम, ने आश्चर्य से इस रहस्य को गाया: जो ब्रह्मांड को थामे है वह माता की बाहों में थामा जाता है; जो सारी सृष्टि को भोजन देता है वह माता का दूध पीता है (p)।","कई पल्लियाँ जुलूस और अग्नि-आशीष के साथ प्राचीन जन्म-विधि निभाती हैं। पवित्र कुर्बाना बड़े आनन्द से अर्पित होता है और यल्दो उपवास समाप्त होता है। आगे के दिन 6 जनवरी के दनहा तक ले जाते हैं।"],
 k:[["यह काल क्या मनाता है","हमारी मुक्ति के लिए ईश्वर की माता कुँवारी मरियम से ईश्वर के अनन्त पुत्र का देह में जन्म।"],["पढ़ने के लिए वचन","लूकस 2:1–20; मत्ती 2:1–12; योहन 1:1–14; गलातियों 4:4–7; मीकाह 5:1–3।"],["धर्मविधि में","जन्म-विधि, कई पल्लियों में जुलूस और अग्नि-आशीष, आनन्दमय पवित्र कुर्बाना; 6 जनवरी के दनहा तक।"],["कैसे जिएँ","आगे के दिनों में भी यल्दो का आनन्द बनाए रखें। रोगियों और अकेले लोगों से मिलें। वर्ष के अंत में धन्यवाद दें।"],["घर में","दनहा तक चरनी रखें। लूकस का जन्म-वृत्तांत साथ पढ़ें। बिछड़े परिवारों के लिए प्रार्थना करें।"]]});

/* ===== Latin: Advent ===== */
A("lat","2026-11-29","ta",{t:"திருவருகைக் காலம்: புதிய திருவழிபாட்டு ஆண்டு",
 p:["திருவருகைக் காலத்தின் முதல் ஞாயிறோடு இலத்தீன் திருச்சபை இன்று புதிய திருவழிபாட்டு ஆண்டைத் தொடங்குகிறது. நான்கு வாரங்கள் கிறிஸ்துவின் வருகையைக் கொண்டாடத் திருச்சபை தயாராகிறது: பெத்லகேமில் தாழ்ச்சியில் முதல் வருகை, இறைவார்த்தையிலும் அருளடையாளங்களிலும் இன்றைய வருகை, காலத்தின் முடிவில் மாட்சியில் இறுதி வருகை.","டிசம்பர் 16 வரை வாசகங்கள் இரண்டாம் வருகையை நோக்குகின்றன: விழித்திருங்கள் (மாற் 13:33). டிசம்பர் 17 முதல் 24 வரை கிறிஸ்து பிறப்புக்கான நேரடித் தயாரிப்பு: குழந்தைப் பருவ நற்செய்திகளும் கிறிஸ்துவை ஞானமே, இம்மானுவேலே என்றழைக்கும் ஓ எதிரொலிகளும். இறைவாக்கினர் எசாயா, திருமுழுக்கு யோவான், கன்னி மரியா இக்காலத்தின் பெரிய முகங்கள்; டிசம்பர் 8 அமல உற்பவ விழா.","குரு ஊதா நிற உடையும், ஆண்டவர் அண்மையில் இருப்பதால் மகிழும் மூன்றாம் ஞாயிறு (கௌதேத்தே) ரோஜா நிற உடையும் அணிகிறார் (பிலி 4:4–5). கிறிஸ்து பிறப்பில் வானதூதரோடு மீண்டும் ஒலிக்க ஞாயிறுகளில் உன்னதங்களிலே பாடல் விடப்படுகிறது."],
 k:[["இக்காலம் கொண்டாடுவது","கிறிஸ்துவின் மூவகை வருகை: வரலாற்றில், அருளில், மாட்சியில்."],["ஞாயிறுகள் (ஆ ஆண்டு)","முதல்: விழித்திருங்கள் (மாற் 13:33–37). இரண்டாம்: யோவான் வழியை ஆயத்தம் செய்கிறார் (மாற் 1:1–8). மூன்றாம், கௌதேத்தே: யோவான் ஒளிக்குச் சான்று (யோவா 1:6–8, 19–28). நான்காம்: மங்கள வார்த்தை (லூக் 1:26–38)."],["அடையாளங்களும் வழக்கங்களும்","ஊதா உடை, கௌதேத்தேயில் ரோஜா; நான்கு மெழுகுதிரிகளுடன் திருவருகை வளையம்; டிசம்பர் 17 முதல் ஓ எதிரொலிகள்."],["எப்படி வாழலாம்","கிறிஸ்து பிறப்புக்கு முன் நல்ல ஒப்புரவு. எசாயாவை வாசியுங்கள். மூவேளைச் செபம். ஏழைகளுக்கு நேரமும் பணமும். இயன்றபோது வார நாள் திருப்பலி."],["வீட்டில்","மாலை உணவின்போது திருவருகை வளையத்தை ஏற்றுங்கள். குடிலைப் படிப்படியாக அமையுங்கள்; குழந்தை இயேசுவைக் கிறிஸ்து பிறப்பு இரவில் மட்டும் வையுங்கள்."]]});
A("lat","2026-11-29","hi",{t:"आगमन काल: नया धर्मविधिक वर्ष",
 p:["आगमन काल के पहले रविवार के साथ लातीनी कलीसिया आज नया धर्मविधिक वर्ष आरम्भ करती है। लगभग चार सप्ताह कलीसिया ख्रीस्त के आगमन को मनाने की तैयारी करती है: बेथलेहेम में दीनता में पहला आगमन, वचन और संस्कारों में आज का आगमन, और समय के अंत में महिमा में अंतिम आगमन।","16 दिसंबर तक पाठ मुख्यतः दूसरे आगमन की ओर देखते हैं: जागते रहो (मारकुस 13:33)। 17 से 24 दिसंबर तक सीधे ख्रीस्त-जयंती की तैयारी: बाल्यकाल के सुसमाचार और ख्रीस्त को प्रज्ञा, इम्मानुएल पुकारने वाले ओ-अंतिफ़ोन। नबी इसायाह, योहन बपतिस्ता और कुँवारी मरियम इस काल के बड़े चेहरे हैं; 8 दिसंबर निष्कलंक गर्भागमन का पर्व।","पुरोहित बैंगनी वस्त्र पहनते हैं, और तीसरे रविवार, गाउदेते, गुलाबी, जब कलीसिया आनन्दित होती है क्योंकि प्रभु निकट हैं (फ़िलिप्पियों 4:4–5)। ख्रीस्त-जयंती पर स्वर्गदूतों के साथ फिर गूँजने के लिए रविवारों को महिमा-गान छोड़ा जाता है।"],
 k:[["यह काल क्या मनाता है","ख्रीस्त का तिहरा आगमन: इतिहास में, कृपा में, महिमा में।"],["रविवार (वर्ष ख)","पहला: जागते रहो (मारकुस 13:33–37)। दूसरा: योहन मार्ग तैयार करते हैं (मारकुस 1:1–8)। तीसरा, गाउदेते: योहन ज्योति की गवाही (योहन 1:6–8, 19–28)। चौथा: मंगल-समाचार (लूकस 1:26–38)।"],["चिह्न और प्रथाएँ","बैंगनी वस्त्र, गाउदेते पर गुलाबी; चार मोमबत्तियों वाला आगमन-माल्य; 17 दिसंबर से ओ-अंतिफ़ोन।"],["कैसे जिएँ","ख्रीस्त-जयंती से पहले अच्छा पापस्वीकार। इसायाह पढ़ें। देवदूत-प्रार्थना करें। ग़रीबों को समय और धन दें। संभव हो तो सप्ताह के दिनों में मिस्सा।"],["घर में","शाम के भोजन पर आगमन-माल्य जलाएँ। चरनी धीरे-धीरे सजाएँ; बालक येसु को केवल ख्रीस्त-जयंती की रात रखें।"]]});
A("lat","2026-11-29","te",{t:"ఆగమన కాలం: కొత్త ఆరాధనా సంవత్సరం",
 p:["ఆగమన కాలపు మొదటి ఆదివారంతో లాటిన్ శ్రీసభ ఈ రోజు కొత్త ఆరాధనా సంవత్సరాన్ని ప్రారంభిస్తుంది. సుమారు నాలుగు వారాలు క్రీస్తు రాకను జరుపుకోవడానికి శ్రీసభ సిద్ధపడుతుంది: బేత్లెహేములో వినయంతో మొదటి రాక, వాక్యం మరియు సంస్కారాలలో నేటి రాక, కాలాంతంలో మహిమతో అంతిమ రాక.","డిసెంబర్ 16 వరకు పఠనాలు రెండవ రాక వైపు చూస్తాయి: మెలకువగా ఉండండి (మార్కు 13:33). డిసెంబర్ 17 నుండి 24 వరకు క్రీస్తు జయంతికి నేరుగా సిద్ధపాటు: బాల్య సువార్తలు, క్రీస్తును జ్ఞానమా, ఇమ్మానుయేలా అని పిలిచే ఓ ప్రతిగీతాలు. యెషయా ప్రవక్త, బాప్తిస్మ యోహాను, కన్య మరియమ్మ ఈ కాలపు ముఖ్య వ్యక్తులు; డిసెంబర్ 8 అమలోద్భవ పండుగ.","గురువు ఊదా రంగు వస్త్రాలు, మూడవ ఆదివారం గౌదేతేలో గులాబీ రంగు ధరిస్తారు, ప్రభువు సమీపంగా ఉన్నందున శ్రీసభ ఆనందిస్తుంది (ఫిలిప్పీ 4:4–5). క్రీస్తు జయంతిలో దేవదూతలతో మళ్ళీ వినిపించడానికి ఆదివారాల్లో మహిమ గీతం విడిచిపెట్టబడుతుంది."],
 k:[["ఈ కాలం జరుపుకునేది","క్రీస్తు మూడు విధాల రాక: చరిత్రలో, కృపలో, మహిమలో."],["ఆదివారాలు (B సంవత్సరం)","మొదటి: మెలకువగా ఉండండి (మార్కు 13:33–37). రెండవ: యోహాను మార్గం సిద్ధం చేస్తాడు (మార్కు 1:1–8). మూడవ, గౌదేతే: యోహాను వెలుగుకు సాక్ష్యం (యోహాను 1:6–8, 19–28). నాలుగవ: శుభవార్త (లూకా 1:26–38)."],["గుర్తులు, ఆచారాలు","ఊదా వస్త్రాలు, గౌదేతేలో గులాబీ; నాలుగు కొవ్వొత్తుల ఆగమన మాల; డిసెంబర్ 17 నుండి ఓ ప్రతిగీతాలు."],["ఎలా జీవించాలి","క్రీస్తు జయంతికి ముందు మంచి పాపసంకీర్తనం. యెషయా చదవండి. త్రికాల జపం. పేదలకు సమయం, డబ్బు ఇవ్వండి. వీలైతే వారపు దినాల దివ్యబలిపూజ."],["ఇంట్లో","సాయంత్రం భోజనం వద్ద ఆగమన మాలను వెలిగించండి. పశువుల పాకను క్రమంగా అమర్చండి; బాల యేసును క్రీస్తు జయంతి రాత్రి మాత్రమే ఉంచండి."]]});
A("lat","2026-11-29","kn",{t:"ಆಗಮನ ಕಾಲ: ಹೊಸ ಆರಾಧನಾ ವರ್ಷ",
 p:["ಆಗಮನ ಕಾಲದ ಮೊದಲ ಭಾನುವಾರದೊಂದಿಗೆ ಲ್ಯಾಟಿನ್ ಧರ್ಮಸಭೆ ಇಂದು ಹೊಸ ಆರಾಧನಾ ವರ್ಷವನ್ನು ಆರಂಭಿಸುತ್ತದೆ. ಸುಮಾರು ನಾಲ್ಕು ವಾರಗಳ ಕಾಲ ಕ್ರಿಸ್ತರ ಆಗಮನವನ್ನು ಆಚರಿಸಲು ಧರ್ಮಸಭೆ ಸಿದ್ಧವಾಗುತ್ತದೆ: ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ದೀನತೆಯಲ್ಲಿ ಮೊದಲ ಆಗಮನ, ವಾಕ್ಯ ಮತ್ತು ಸಂಸ್ಕಾರಗಳಲ್ಲಿ ಇಂದಿನ ಆಗಮನ, ಕಾಲಾಂತ್ಯದಲ್ಲಿ ಮಹಿಮೆಯಲ್ಲಿ ಅಂತಿಮ ಆಗಮನ.","ಡಿಸೆಂಬರ್ 16 ರವರೆಗೆ ವಾಚನಗಳು ಎರಡನೇ ಆಗಮನದತ್ತ ನೋಡುತ್ತವೆ: ಎಚ್ಚರವಾಗಿರಿ (ಮಾರ್ಕ 13:33). ಡಿಸೆಂಬರ್ 17 ರಿಂದ 24 ರವರೆಗೆ ಕ್ರಿಸ್ತ ಜಯಂತಿಗೆ ನೇರ ಸಿದ್ಧತೆ: ಬಾಲ್ಯದ ಶುಭಸಂದೇಶಗಳು ಮತ್ತು ಕ್ರಿಸ್ತರನ್ನು ಜ್ಞಾನವೇ, ಇಮ್ಮಾನುವೇಲನೇ ಎಂದು ಕರೆಯುವ ಓ ಪ್ರತಿಗೀತೆಗಳು. ಪ್ರವಾದಿ ಯೆಶಾಯ, ಸ್ನಾನಿಕ ಯೊವಾನ್ನ, ಕನ್ಯೆ ಮರಿಯಮ್ಮ ಈ ಕಾಲದ ಪ್ರಮುಖರು; ಡಿಸೆಂಬರ್ 8 ನಿರ್ಮಲ ಗರ್ಭಧಾರಣೆಯ ಹಬ್ಬ.","ಗುರುಗಳು ನೇರಳೆ ಬಣ್ಣದ ವಸ್ತ್ರ ಧರಿಸುತ್ತಾರೆ; ಪ್ರಭು ಸಮೀಪದಲ್ಲಿರುವುದರಿಂದ ಧರ್ಮಸಭೆ ಆನಂದಿಸುವ ಮೂರನೇ ಭಾನುವಾರ, ಗೌದೇತೆ, ಗುಲಾಬಿ ಬಣ್ಣ (ಫಿಲಿಪ್ಪಿಯರಿಗೆ 4:4–5). ಕ್ರಿಸ್ತ ಜಯಂತಿಯಲ್ಲಿ ದೇವದೂತರೊಂದಿಗೆ ಮತ್ತೆ ಮೊಳಗಲು ಭಾನುವಾರಗಳಲ್ಲಿ ಮಹಿಮಾ ಗೀತೆಯನ್ನು ಬಿಡಲಾಗುತ್ತದೆ."],
 k:[["ಈ ಕಾಲ ಆಚರಿಸುವುದು","ಕ್ರಿಸ್ತರ ಮೂರು ರೀತಿಯ ಆಗಮನ: ಚರಿತ್ರೆಯಲ್ಲಿ, ಕೃಪೆಯಲ್ಲಿ, ಮಹಿಮೆಯಲ್ಲಿ."],["ಭಾನುವಾರಗಳು (B ವರ್ಷ)","ಮೊದಲ: ಎಚ್ಚರವಾಗಿರಿ (ಮಾರ್ಕ 13:33–37). ಎರಡನೇ: ಯೊವಾನ್ನ ಮಾರ್ಗ ಸಿದ್ಧಪಡಿಸುತ್ತಾನೆ (ಮಾರ್ಕ 1:1–8). ಮೂರನೇ, ಗೌದೇತೆ: ಯೊವಾನ್ನ ಬೆಳಕಿಗೆ ಸಾಕ್ಷಿ (ಯೊವಾನ್ನ 1:6–8, 19–28). ನಾಲ್ಕನೇ: ಶುಭವಾರ್ತೆ (ಲೂಕ 1:26–38)."],["ಚಿಹ್ನೆಗಳು ಮತ್ತು ಪದ್ಧತಿಗಳು","ನೇರಳೆ ವಸ್ತ್ರ, ಗೌದೇತೆಯಲ್ಲಿ ಗುಲಾಬಿ; ನಾಲ್ಕು ಮೇಣದಬತ್ತಿಗಳ ಆಗಮನ ಹಾರ; ಡಿಸೆಂಬರ್ 17 ರಿಂದ ಓ ಪ್ರತಿಗೀತೆಗಳು."],["ಹೇಗೆ ಬದುಕಬಹುದು","ಕ್ರಿಸ್ತ ಜಯಂತಿಗೆ ಮೊದಲು ಉತ್ತಮ ಪಾಪನಿವೇದನೆ. ಯೆಶಾಯ ಓದಿರಿ. ತ್ರಿಕಾಲ ಜಪ. ಬಡವರಿಗೆ ಸಮಯ ಮತ್ತು ಹಣ. ಸಾಧ್ಯವಾದರೆ ವಾರದ ದಿನಗಳ ದಿವ್ಯಬಲಿಪೂಜೆ."],["ಮನೆಯಲ್ಲಿ","ಸಂಜೆ ಊಟದ ವೇಳೆ ಆಗಮನ ಹಾರವನ್ನು ಬೆಳಗಿಸಿರಿ. ಗೋದಲಿಯನ್ನು ಹಂತಹಂತವಾಗಿ ಸಿದ್ಧಪಡಿಸಿ; ಬಾಲ ಯೇಸುವನ್ನು ಕ್ರಿಸ್ತ ಜಯಂತಿಯ ರಾತ್ರಿ ಮಾತ್ರ ಇಡಿರಿ."]]});

A("lat","2026-12-25","ta",{t:"கிறிஸ்து பிறப்புக் காலம்",
 p:["கிறிஸ்து பிறப்புத் திருப்பலியோடு இலத்தீன் திருச்சபை கிறிஸ்து பிறப்புக் காலத்துக்குள் நுழைகிறது. இது ஒரு நாள் அல்ல; 2027 ஜனவரி 10 ஆண்டவரின் திருமுழுக்கு விழா வரை நீளும் மகிழ்ச்சியின் காலம். முதல் எட்டு நாட்கள் ஒரே பெருவிழாவாகக் கொண்டாடப்படும் எண்கிழமை; ஜனவரி 1 இறைவனின் தாய் தூய மரியாவின் பெருவிழாவோடு நிறைவடைகிறது.","இக்காலத்தின் இதயம் மனுவுருவாதல் மறைபொருள்: வாக்கு மனிதரானார், நம்மிடையே குடிகொண்டார் (யோவா 1:14). கடவுள் தொலைவிலிருந்து நம்மை மீட்கவில்லை; கன்னி மரியாவிடமிருந்து பிறந்து தீவனத் தொட்டியில் கிடத்தப்பட்ட குழந்தையாக நம்மில் ஒருவரானார். திருத்தந்தை புனித பெரிய லியோ சொன்னார்: கிறிஸ்தவனே, உன் மாண்பை அறிந்துகொள் (p).","இக்காலம் கிறிஸ்துவின் வெளிப்பாட்டை விரிக்கிறது: பெத்லகேமில் இடையர்களுக்கு, திருக்காட்சியில் ஞானிகள் வழியாக மக்களினங்களுக்கு (இந்தியாவில் 2027 ஜனவரி 3 ஞாயிறு), யோர்தானில் திருமுழுக்கில். உன்னதங்களிலே பாடல் திரும்புகிறது; குரு வெண்மை அல்லது பொன்னிற உடை அணிகிறார்."],
 k:[["இக்காலம் கொண்டாடுவது","உண்மைக் கடவுளும் உண்மை மனிதருமான இறைமகனின் பிறப்பும் அவரது வெளிப்பாடும்."],["முக்கிய நாட்கள்","டிசம்பர் 25: கிறிஸ்து பிறப்பு. டிசம்பர் 27: திருக்குடும்பம். ஜனவரி 1: இறைவனின் தாய் மரியா, உலக அமைதி நாள். 2027 ஜனவரி 3: திருக்காட்சி (இந்தியா). ஜனவரி 10: ஆண்டவரின் திருமுழுக்கு."],["வாசிக்க வேண்டிய இறைவார்த்தை","எசா 9:2–7; லூக் 2:1–20; யோவா 1:1–18; தீத் 2:11–14; மத் 2:1–12."],["எப்படி வாழலாம்","கிறிஸ்து பிறப்பின் மகிழ்ச்சியைக் காலம் முழுவதும் காத்துக்கொள்ளுங்கள். எண்கிழமை விழாக்களில் திருப்பலிக்குச் செல்லுங்கள். தனிமையில் இருப்போரைச் சந்தியுங்கள்."],["வீட்டில்","ஆண்டவரின் திருமுழுக்கு வரை குடிலையும் நட்சத்திரத்தையும் வைத்திருங்கள். திருக்காட்சியில் வீட்டை ஆசீர்வதியுங்கள். குடிலின் முன் ஒன்றாகச் செபியுங்கள்."]]});
A("lat","2026-12-25","hi",{t:"ख्रीस्त-जयंती काल",
 p:["ख्रीस्त-जयंती के मिस्सा के साथ लातीनी कलीसिया ख्रीस्त-जयंती काल में प्रवेश करती है। यह एक दिन नहीं, बल्कि 10 जनवरी 2027 के प्रभु के बपतिस्मा-पर्व तक चलने वाला आनन्द का काल है। पहले आठ दिन एक महापर्व के रूप में मनाया जाने वाला अठवारा हैं, जो 1 जनवरी को ईश्वर की पवित्र माता मरियम के महापर्व पर समाप्त होता है।","इस काल का हृदय देहधारण का रहस्य है: शब्द ने देह धारण की और हमारे बीच निवास किया (योहन 1:14)। ईश्वर ने दूर से हमारा उद्धार नहीं किया; कुँवारी मरियम से जन्म लेकर चरनी में लिटाए गए शिशु के रूप में वह हममें से एक बने। संत पापा महान लियो ने कहा: ख्रीस्तीय, अपनी गरिमा पहचानो (p)।","यह काल ख्रीस्त के प्रकटीकरण को खोलता है: बेथलेहेम में चरवाहों को, प्रकटीकरण-पर्व पर ज्योतिषियों द्वारा राष्ट्रों को (भारत में रविवार 3 जनवरी 2027), और यर्दन में बपतिस्मा पर। महिमा-गान लौटता है; पुरोहित सफ़ेद या सुनहरे वस्त्र पहनते हैं।"],
 k:[["यह काल क्या मनाता है","सच्चे ईश्वर और सच्चे मनुष्य, ईश-पुत्र का जन्म और उनका प्रकटीकरण।"],["मुख्य दिन","25 दिसंबर: ख्रीस्त-जयंती। 27 दिसंबर: पवित्र परिवार। 1 जनवरी: ईश्वर की माता मरियम, विश्व शांति दिवस। 3 जनवरी 2027: प्रकटीकरण (भारत)। 10 जनवरी: प्रभु का बपतिस्मा।"],["पढ़ने के लिए वचन","इसायाह 9:1–6; लूकस 2:1–20; योहन 1:1–18; तीतुस 2:11–14; मत्ती 2:1–12।"],["कैसे जिएँ","ख्रीस्त-जयंती का आनन्द पूरे काल में बनाए रखें। अठवारे के पर्वों पर मिस्सा में जाएँ। अकेले लोगों से मिलें।"],["घर में","प्रभु के बपतिस्मा तक चरनी और तारा रखें। प्रकटीकरण पर घर को आशीष दें। चरनी के सामने साथ प्रार्थना करें।"]]});
A("lat","2026-12-25","te",{t:"క్రీస్తు జయంతి కాలం",
 p:["క్రీస్తు జయంతి దివ్యబలిపూజతో లాటిన్ శ్రీసభ క్రీస్తు జయంతి కాలంలోకి ప్రవేశిస్తుంది. ఇది ఒక్క రోజు కాదు; 2027 జనవరి 10 ప్రభువు జ్ఞానస్నాన పండుగ వరకు సాగే ఆనంద కాలం. మొదటి ఎనిమిది రోజులు ఒకే మహా పండుగగా జరుపుకునే అష్టదినాలు; జనవరి 1 దేవుని తల్లి పరిశుద్ధ మరియమ్మ మహోత్సవంతో ముగుస్తాయి.","ఈ కాలపు హృదయం మానవావతార రహస్యం: వాక్యము శరీరధారియై మన మధ్య నివసించెను (యోహాను 1:14). దేవుడు దూరం నుండి మనలను రక్షించలేదు; కన్య మరియమ్మ నుండి జన్మించి తొట్టిలో పరుండబెట్టబడిన శిశువుగా మనలో ఒకడయ్యాడు. పోపుగారు పరిశుద్ధ మహా లియో అన్నారు: క్రైస్తవుడా, నీ గౌరవాన్ని గుర్తించు (p).","ఈ కాలం క్రీస్తు ప్రత్యక్షతను విప్పుతుంది: బేత్లెహేములో గొర్రెల కాపరులకు, దనహా పండుగలో జ్ఞానుల ద్వారా జాతులకు (భారతదేశంలో ఆదివారం 2027 జనవరి 3), యొర్దానులో జ్ఞానస్నానంలో. మహిమ గీతం తిరిగి వస్తుంది; గురువు తెలుపు లేదా బంగారు వస్త్రాలు ధరిస్తారు."],
 k:[["ఈ కాలం జరుపుకునేది","నిజమైన దేవుడు, నిజమైన మానవుడు అయిన దేవుని కుమారుని జననం, ఆయన ప్రత్యక్షత."],["ముఖ్య దినాలు","డిసెంబర్ 25: క్రీస్తు జయంతి. డిసెంబర్ 27: పవిత్ర కుటుంబం. జనవరి 1: దేవుని తల్లి మరియమ్మ, ప్రపంచ శాంతి దినం. 2027 జనవరి 3: దనహా (భారతదేశం). జనవరి 10: ప్రభువు జ్ఞానస్నానం."],["చదవవలసిన వాక్యం","యెషయా 9:2–7; లూకా 2:1–20; యోహాను 1:1–18; తీతు 2:11–14; మత్తయి 2:1–12."],["ఎలా జీవించాలి","క్రీస్తు జయంతి ఆనందాన్ని కాలమంతా కాపాడుకోండి. అష్టదినాల పండుగల్లో దివ్యబలిపూజకు వెళ్ళండి. ఒంటరిగా ఉన్నవారిని దర్శించండి."],["ఇంట్లో","ప్రభువు జ్ఞానస్నానం వరకు పాకను, నక్షత్రాన్ని ఉంచండి. దనహా రోజున ఇంటిని ఆశీర్వదించండి. పాక ముందు కలిసి ప్రార్థించండి."]]});
A("lat","2026-12-25","kn",{t:"ಕ್ರಿಸ್ತ ಜಯಂತಿ ಕಾಲ",
 p:["ಕ್ರಿಸ್ತ ಜಯಂತಿಯ ದಿವ್ಯಬಲಿಪೂಜೆಯೊಂದಿಗೆ ಲ್ಯಾಟಿನ್ ಧರ್ಮಸಭೆ ಕ್ರಿಸ್ತ ಜಯಂತಿ ಕಾಲವನ್ನು ಪ್ರವೇಶಿಸುತ್ತದೆ. ಇದು ಒಂದು ದಿನವಲ್ಲ; 2027 ಜನವರಿ 10 ಪ್ರಭುವಿನ ದೀಕ್ಷಾಸ್ನಾನದ ಹಬ್ಬದವರೆಗೆ ಸಾಗುವ ಆನಂದದ ಕಾಲ. ಮೊದಲ ಎಂಟು ದಿನಗಳು ಒಂದೇ ಮಹಾಹಬ್ಬವಾಗಿ ಆಚರಿಸುವ ಅಷ್ಟದಿನ; ಜನವರಿ 1 ದೇವರ ತಾಯಿ ಪವಿತ್ರ ಮರಿಯಮ್ಮನವರ ಮಹೋತ್ಸವದೊಂದಿಗೆ ಮುಗಿಯುತ್ತದೆ.","ಈ ಕಾಲದ ಹೃದಯ ಮನುಷ್ಯಾವತಾರದ ರಹಸ್ಯ: ವಾಕ್ಯವು ಮಾನವರಾಗಿ ನಮ್ಮ ನಡುವೆ ವಾಸಿಸಿತು (ಯೊವಾನ್ನ 1:14). ದೇವರು ದೂರದಿಂದ ನಮ್ಮನ್ನು ರಕ್ಷಿಸಲಿಲ್ಲ; ಕನ್ಯೆ ಮರಿಯಮ್ಮನಿಂದ ಜನಿಸಿ ಗೋದಲಿಯಲ್ಲಿ ಮಲಗಿಸಲಾದ ಶಿಶುವಾಗಿ ನಮ್ಮಲ್ಲಿ ಒಬ್ಬರಾದರು. ಪೋಪ್ ಸಂತ ಮಹಾ ಲಿಯೋ ಹೇಳಿದರು: ಕ್ರೈಸ್ತನೇ, ನಿನ್ನ ಘನತೆಯನ್ನು ಅರಿತುಕೋ (p).","ಈ ಕಾಲ ಕ್ರಿಸ್ತರ ಪ್ರಕಟನೆಯನ್ನು ತೆರೆಯುತ್ತದೆ: ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಕುರುಬರಿಗೆ, ದೇವದರ್ಶನದ ಹಬ್ಬದಲ್ಲಿ ಜ್ಞಾನಿಗಳ ಮೂಲಕ ಜನಾಂಗಗಳಿಗೆ (ಭಾರತದಲ್ಲಿ ಭಾನುವಾರ 2027 ಜನವರಿ 3), ಜೋರ್ಡಾನಿನಲ್ಲಿ ದೀಕ್ಷಾಸ್ನಾನದಲ್ಲಿ. ಮಹಿಮಾ ಗೀತೆ ಮರಳುತ್ತದೆ; ಗುರುಗಳು ಬಿಳಿ ಅಥವಾ ಚಿನ್ನದ ಬಣ್ಣದ ವಸ್ತ್ರ ಧರಿಸುತ್ತಾರೆ."],
 k:[["ಈ ಕಾಲ ಆಚರಿಸುವುದು","ನಿಜ ದೇವರೂ ನಿಜ ಮಾನವರೂ ಆದ ದೇವಪುತ್ರರ ಜನನ ಮತ್ತು ಅವರ ಪ್ರಕಟನೆ."],["ಮುಖ್ಯ ದಿನಗಳು","ಡಿಸೆಂಬರ್ 25: ಕ್ರಿಸ್ತ ಜಯಂತಿ. ಡಿಸೆಂಬರ್ 27: ಪವಿತ್ರ ಕುಟುಂಬ. ಜನವರಿ 1: ದೇವರ ತಾಯಿ ಮರಿಯಮ್ಮ, ವಿಶ್ವ ಶಾಂತಿ ದಿನ. 2027 ಜನವರಿ 3: ದೇವದರ್ಶನ (ಭಾರತ). ಜನವರಿ 10: ಪ್ರಭುವಿನ ದೀಕ್ಷಾಸ್ನಾನ."],["ಓದಬೇಕಾದ ವಾಕ್ಯ","ಯೆಶಾಯ 9:2–7; ಲೂಕ 2:1–20; ಯೊವಾನ್ನ 1:1–18; ತೀತನಿಗೆ 2:11–14; ಮತ್ತಾಯ 2:1–12."],["ಹೇಗೆ ಬದುಕಬಹುದು","ಕ್ರಿಸ್ತ ಜಯಂತಿಯ ಆನಂದವನ್ನು ಇಡೀ ಕಾಲ ಕಾಪಾಡಿಕೊಳ್ಳಿ. ಅಷ್ಟದಿನದ ಹಬ್ಬಗಳಲ್ಲಿ ದಿವ್ಯಬಲಿಪೂಜೆಗೆ ಹೋಗಿರಿ. ಒಂಟಿಯಾಗಿರುವವರನ್ನು ಭೇಟಿ ಮಾಡಿ."],["ಮನೆಯಲ್ಲಿ","ಪ್ರಭುವಿನ ದೀಕ್ಷಾಸ್ನಾನದವರೆಗೆ ಗೋದಲಿ ಮತ್ತು ನಕ್ಷತ್ರ ಇರಲಿ. ದೇವದರ್ಶನದಂದು ಮನೆಯನ್ನು ಆಶೀರ್ವದಿಸಿ. ಗೋದಲಿಯ ಮುಂದೆ ಒಟ್ಟಾಗಿ ಪ್ರಾರ್ಥಿಸಿರಿ."]]});

A("lat",AD,"de",{t:"Die Adventszeit: ein neues Kirchenjahr",
 p:["Mit dem Ersten Adventssonntag beginnt die lateinische Kirche heute ein neues Kirchenjahr. Advent kommt vom lateinischen adventus, Ankunft. Etwa vier Wochen lang bereitet sich die Kirche darauf vor, das Kommen Christi zu feiern: sein erstes Kommen in Niedrigkeit in Betlehem, sein Kommen zu uns heute in Wort und Sakrament und sein letztes Kommen in Herrlichkeit am Ende der Zeit.","Bis zum 16. Dezember blicken die Lesungen vor allem auf die Wiederkunft: Seid wachsam (Mk 13,33). Vom 17. bis 24. Dezember richtet sich die Kirche unmittelbar auf Weihnachten aus, mit den Evangelien der Kindheit Jesu und den großen O-Antiphonen, die Christus als Weisheit, Herr, Wurzel Jesse, Schlüssel Davids, Morgenstern, König der Völker und Immanuel anrufen. Die großen Gestalten des Advents sind der Prophet Jesaja, Johannes der Täufer und die Jungfrau Maria; am 8. Dezember feiert die Kirche Mariä Empfängnis.","Der Priester trägt Violett, am Dritten Adventssonntag, Gaudete, Rosa, weil der Herr nahe ist (Phil 4,4–5). Das Gloria entfällt an den Sonntagen, damit es an Weihnachten mit den Engeln neu erklingt."],
 k:[["Was die Zeit feiert","Das dreifache Kommen Christi: in der Geschichte, in der Gnade, in der Herrlichkeit."],["Die Sonntage (Lesejahr B)","Erster: Seid wachsam (Mk 13,33–37). Zweiter: Johannes bereitet den Weg (Mk 1,1–8). Dritter, Gaudete: Johannes bezeugt das Licht (Joh 1,6–8.19–28). Vierter: die Verkündigung an Maria (Lk 1,26–38)."],["Zeichen und Bräuche","Violette Gewänder, Rosa an Gaudete; der Adventskranz mit vier Kerzen; die O-Antiphonen ab dem 17. Dezember; Schlichtheit im Schmuck bis Weihnachten."],["Wie man sie lebt","Vor Weihnachten gut beichten. Jesaja lesen. Den Engel des Herrn beten. Zeit und Geld für die Armen geben. Wenn möglich, die Messe an Werktagen mitfeiern."],["Zu Hause","Beim Abendessen den Adventskranz anzünden. Die Krippe schrittweise aufbauen und das Kind erst in der Heiligen Nacht hineinlegen."]]});
A("lat",CH,"de",{t:"Die Weihnachtszeit",
 p:["Mit der Messe von der Geburt des Herrn tritt die lateinische Kirche in die Weihnachtszeit ein. Sie ist nicht nur ein Tag, sondern eine Zeit der Freude bis zum Fest der Taufe des Herrn am 10. Januar 2027. Die ersten acht Tage bilden die Weihnachtsoktav, die am 1. Januar mit dem Hochfest der Gottesmutter Maria endet.","Das Herz dieser Zeit ist das Geheimnis der Menschwerdung: Das Wort ist Fleisch geworden und hat unter uns gewohnt (Joh 1,14). Gott hat uns nicht aus der Ferne erlöst; er wurde einer von uns, ein Kind, geboren von der Jungfrau Maria und in eine Krippe gelegt. Papst Leo der Große sagte seiner Gemeinde: Christ, erkenne deine Würde (p).","Die Zeit entfaltet die Offenbarung Christi: den Hirten in Betlehem, den Völkern in den Sterndeutern an Erscheinung des Herrn (6. Januar; in Indien am Sonntag, 3. Januar 2027) und bei der Taufe im Jordan. Das Gloria erklingt wieder; der Priester trägt Weiß oder Gold."],
 k:[["Was die Zeit feiert","Die Geburt des Sohnes Gottes, wahrer Gott und wahrer Mensch, und seine Offenbarung."],["Wichtige Tage","25. Dezember: Geburt des Herrn. 27. Dezember: Heilige Familie. 1. Januar: Gottesmutter Maria, Weltfriedenstag. Erscheinung des Herrn. 10. Januar 2027: Taufe des Herrn."],["Zum Lesen","Jes 9,1–6; Lk 2,1–20; Joh 1,1–18; Tit 2,11–14; Mt 2,1–12."],["Wie man sie lebt","Die Weihnachtsfreude die ganze Zeit bewahren. An den Festen der Oktav die Messe mitfeiern. Einsame und Kranke besuchen."],["Zu Hause","Krippe und Stern bis zur Taufe des Herrn stehen lassen. Zu Erscheinung des Herrn das Haus segnen. Gemeinsam an der Krippe beten."]]});

A("lat",AD,"it",{t:"Il tempo di Avvento: un nuovo anno liturgico",
 p:["Con la Prima domenica di Avvento la Chiesa latina inizia oggi un nuovo anno liturgico. Avvento viene dal latino adventus, venuta. Per circa quattro settimane la Chiesa si prepara a celebrare la venuta di Cristo: la prima, nell'umiltà di Betlemme; quella di oggi, nella Parola e nei sacramenti; l'ultima, nella gloria alla fine dei tempi.","Fino al 16 dicembre le letture guardano soprattutto alla seconda venuta: vegliate (Mc 13,33). Dal 17 al 24 dicembre la Chiesa si prepara direttamente al Natale, con i Vangeli dell'infanzia e le grandi antifone O, che invocano Cristo come Sapienza, Signore, Radice di Iesse, Chiave di Davide, Astro nascente, Re delle genti ed Emmanuele. Le grandi figure dell'Avvento sono il profeta Isaia, Giovanni Battista e la Vergine Maria; l'8 dicembre la Chiesa celebra l'Immacolata Concezione.","Il sacerdote veste di viola, e di rosa nella terza domenica, Gaudete, perché il Signore è vicino (Fil 4,4–5). Il Gloria si omette la domenica, perché risuoni di nuovo con gli angeli a Natale."],
 k:[["Che cosa celebra","La triplice venuta di Cristo: nella storia, nella grazia, nella gloria."],["Le domeniche (Anno B)","Prima: vegliate (Mc 13,33–37). Seconda: Giovanni prepara la via (Mc 1,1–8). Terza, Gaudete: Giovanni testimonia la luce (Gv 1,6–8.19–28). Quarta: l'annunciazione a Maria (Lc 1,26–38)."],["Segni e usanze","Paramenti viola, rosa a Gaudete; la corona d'Avvento con quattro candele; le antifone O dal 17 dicembre; sobrietà negli addobbi fino a Natale."],["Come viverlo","Una buona confessione prima di Natale. Leggere Isaia. Pregare l'Angelus. Dare tempo e denaro ai poveri. Partecipare alla Messa feriale quando è possibile."],["In famiglia","Accendere la corona d'Avvento a cena. Preparare il presepe a poco a poco e porre il Bambino solo nella notte di Natale."]]});
A("lat",CH,"it",{t:"Il tempo di Natale",
 p:["Con la Messa della Natività la Chiesa latina entra nel tempo di Natale. Non è un solo giorno, ma un tempo di gioia che dura fino alla festa del Battesimo del Signore, il 10 gennaio 2027. I primi otto giorni formano l'Ottava di Natale, che si chiude il 1° gennaio con la solennità di Maria Santissima Madre di Dio.","Il cuore di questo tempo è il mistero dell'Incarnazione: il Verbo si fece carne e venne ad abitare in mezzo a noi (Gv 1,14). Dio non ci ha salvati da lontano; si è fatto uno di noi, un bambino nato dalla Vergine Maria e deposto in una mangiatoia. San Leone Magno diceva ai suoi fedeli: riconosci, cristiano, la tua dignità (p).","Il tempo dispiega la manifestazione di Cristo: ai pastori a Betlemme, alle genti nei Magi all'Epifania (6 gennaio; in India domenica 3 gennaio 2027), e a Israele nel Battesimo al Giordano. Ritorna il Gloria; il sacerdote veste di bianco o d'oro."],
 k:[["Che cosa celebra","La nascita del Figlio di Dio, vero Dio e vero uomo, e la sua manifestazione."],["Giorni principali","25 dicembre: Natale. 27 dicembre: Santa Famiglia. 1° gennaio: Maria Madre di Dio, Giornata mondiale della pace. Epifania. 10 gennaio 2027: Battesimo del Signore."],["Da leggere","Is 9,1–6; Lc 2,1–20; Gv 1,1–18; Tt 2,11–14; Mt 2,1–12."],["Come viverlo","Custodire la gioia del Natale per tutto il tempo. Partecipare alla Messa nelle feste dell'Ottava. Visitare chi è solo o malato."],["In famiglia","Tenere presepe e stella fino al Battesimo del Signore. Benedire la casa all'Epifania. Pregare insieme davanti al presepe."]]});

A("lat",AD,"es",{t:"El tiempo de Adviento: un nuevo año litúrgico",
 p:["Con el primer domingo de Adviento la Iglesia latina comienza hoy un nuevo año litúrgico. Adviento viene del latín adventus, venida. Durante unas cuatro semanas la Iglesia se prepara para celebrar la venida de Cristo: la primera, en la humildad de Belén; la de hoy, en la Palabra y los sacramentos; y la última, en la gloria al fin de los tiempos.","Hasta el 16 de diciembre las lecturas miran sobre todo a la segunda venida: velad (Mc 13,33). Del 17 al 24 de diciembre la Iglesia se prepara directamente para la Navidad, con los evangelios de la infancia y las grandes antífonas O, que invocan a Cristo como Sabiduría, Señor, Raíz de Jesé, Llave de David, Sol que nace, Rey de las naciones y Emmanuel. Las grandes figuras del Adviento son el profeta Isaías, Juan el Bautista y la Virgen María; el 8 de diciembre la Iglesia celebra la Inmaculada Concepción.","El sacerdote viste de morado, y de rosa el tercer domingo, Gaudete, porque el Señor está cerca (Flp 4,4–5). El Gloria se omite los domingos para que resuene de nuevo con los ángeles en Navidad."],
 k:[["Qué celebra","La triple venida de Cristo: en la historia, en la gracia y en la gloria."],["Los domingos (Ciclo B)","Primero: velad (Mc 13,33–37). Segundo: Juan prepara el camino (Mc 1,1–8). Tercero, Gaudete: Juan da testimonio de la luz (Jn 1,6–8.19–28). Cuarto: la anunciación a María (Lc 1,26–38)."],["Signos y costumbres","Ornamentos morados, rosa en Gaudete; la corona de Adviento con cuatro velas; las antífonas O desde el 17 de diciembre; sencillez en la decoración hasta Navidad."],["Cómo vivirlo","Una buena confesión antes de Navidad. Leer a Isaías. Rezar el Ángelus. Dar tiempo y dinero a los pobres. Ir a Misa entre semana cuando se pueda."],["En casa","Encender la corona de Adviento en la cena. Preparar el belén poco a poco y poner al Niño solo en la Nochebuena."]]});
A("lat",CH,"es",{t:"El tiempo de Navidad",
 p:["Con la Misa de la Natividad la Iglesia latina entra en el tiempo de Navidad. No es un solo día, sino un tiempo de alegría que dura hasta la fiesta del Bautismo del Señor, el 10 de enero de 2027. Los primeros ocho días forman la Octava de Navidad, que termina el 1 de enero con la solemnidad de Santa María, Madre de Dios.","El corazón de este tiempo es el misterio de la Encarnación: el Verbo se hizo carne y habitó entre nosotros (Jn 1,14). Dios no nos salvó desde lejos; se hizo uno de nosotros, un niño nacido de la Virgen María y acostado en un pesebre. San León Magno decía a su pueblo: reconoce, cristiano, tu dignidad (p).","Este tiempo despliega la manifestación de Cristo: a los pastores en Belén, a los pueblos en los Magos en la Epifanía (6 de enero; en la India el domingo 3 de enero de 2027) y a Israel en el Bautismo en el Jordán. Vuelve el Gloria; el sacerdote viste de blanco o dorado."],
 k:[["Qué celebra","El nacimiento del Hijo de Dios, verdadero Dios y verdadero hombre, y su manifestación."],["Días principales","25 de diciembre: Navidad. 27 de diciembre: Sagrada Familia. 1 de enero: Santa María, Madre de Dios, Jornada Mundial de la Paz. Epifanía. 10 de enero de 2027: Bautismo del Señor."],["Para leer","Is 9,1–6; Lc 2,1–20; Jn 1,1–18; Tit 2,11–14; Mt 2,1–12."],["Cómo vivirlo","Conservar la alegría de la Navidad durante todo el tiempo. Ir a Misa en las fiestas de la Octava. Visitar a quien está solo o enfermo."],["En casa","Mantener el belén y la estrella hasta el Bautismo del Señor. Bendecir la casa en la Epifanía. Rezar juntos ante el belén."]]});

A("lat",AD,"pt",{t:"O tempo do Advento: um novo ano litúrgico",
 p:["Com o primeiro domingo do Advento a Igreja latina começa hoje um novo ano litúrgico. Advento vem do latim adventus, vinda. Durante cerca de quatro semanas a Igreja prepara-se para celebrar a vinda de Cristo: a primeira, na humildade de Belém; a de hoje, na Palavra e nos sacramentos; e a última, na glória, no fim dos tempos.","Até 16 de dezembro as leituras olham sobretudo para a segunda vinda: vigiai (Mc 13,33). De 17 a 24 de dezembro a Igreja prepara-se diretamente para o Natal, com os evangelhos da infância e as grandes antífonas Ó, que invocam Cristo como Sabedoria, Senhor, Raiz de Jessé, Chave de David, Sol nascente, Rei das nações e Emanuel. As grandes figuras do Advento são o profeta Isaías, João Batista e a Virgem Maria; a 8 de dezembro a Igreja celebra a Imaculada Conceição.","O sacerdote veste roxo, e rosa no terceiro domingo, Gaudete, porque o Senhor está perto (Fl 4,4–5). O Glória omite-se aos domingos, para que ressoe de novo com os anjos no Natal."],
 k:[["O que celebra","A tríplice vinda de Cristo: na história, na graça e na glória."],["Os domingos (Ano B)","Primeiro: vigiai (Mc 13,33–37). Segundo: João prepara o caminho (Mc 1,1–8). Terceiro, Gaudete: João dá testemunho da luz (Jo 1,6–8.19–28). Quarto: a anunciação a Maria (Lc 1,26–38)."],["Sinais e costumes","Paramentos roxos, rosa em Gaudete; a coroa do Advento com quatro velas; as antífonas Ó a partir de 17 de dezembro; simplicidade na decoração até ao Natal."],["Como vivê-lo","Uma boa confissão antes do Natal. Ler Isaías. Rezar o Angelus. Dar tempo e dinheiro aos pobres. Ir à Missa durante a semana quando possível."],["Em casa","Acender a coroa do Advento ao jantar. Preparar o presépio aos poucos e colocar o Menino só na noite de Natal."]]});
A("lat",CH,"pt",{t:"O tempo do Natal",
 p:["Com a Missa da Natividade a Igreja latina entra no tempo do Natal. Não é um só dia, mas um tempo de alegria que dura até à festa do Batismo do Senhor, a 10 de janeiro de 2027. Os primeiros oito dias formam a Oitava do Natal, que termina a 1 de janeiro com a solenidade de Santa Maria, Mãe de Deus.","O coração deste tempo é o mistério da Encarnação: o Verbo fez-se carne e habitou entre nós (Jo 1,14). Deus não nos salvou de longe; fez-se um de nós, um menino nascido da Virgem Maria e deitado numa manjedoura. São Leão Magno dizia ao seu povo: reconhece, cristão, a tua dignidade (p).","Este tempo desdobra a manifestação de Cristo: aos pastores em Belém, aos povos nos Magos na Epifania (6 de janeiro; na Índia no domingo, 3 de janeiro de 2027) e a Israel no Batismo no Jordão. Volta o Glória; o sacerdote veste branco ou dourado."],
 k:[["O que celebra","O nascimento do Filho de Deus, verdadeiro Deus e verdadeiro homem, e a sua manifestação."],["Dias principais","25 de dezembro: Natal. 27 de dezembro: Sagrada Família. 1 de janeiro: Santa Maria, Mãe de Deus, Dia Mundial da Paz. Epifania. 10 de janeiro de 2027: Batismo do Senhor."],["Para ler","Is 9,1–6; Lc 2,1–20; Jo 1,1–18; Tt 2,11–14; Mt 2,1–12."],["Como vivê-lo","Guardar a alegria do Natal durante todo o tempo. Ir à Missa nas festas da Oitava. Visitar quem está só ou doente."],["Em casa","Manter o presépio e a estrela até ao Batismo do Senhor. Abençoar a casa na Epifania. Rezar juntos diante do presépio."]]});

A("lat",AD,"fr",{t:"Le temps de l'Avent : une nouvelle année liturgique",
 p:["Avec le premier dimanche de l'Avent, l'Église latine commence aujourd'hui une nouvelle année liturgique. Avent vient du latin adventus, venue. Pendant environ quatre semaines, l'Église se prépare à célébrer la venue du Christ : la première, dans l'humilité de Bethléem ; celle d'aujourd'hui, dans la Parole et les sacrements ; et la dernière, dans la gloire, à la fin des temps.","Jusqu'au 16 décembre, les lectures regardent surtout vers le retour du Seigneur : veillez (Mc 13,33). Du 17 au 24 décembre, l'Église se prépare directement à Noël, avec les évangiles de l'enfance et les grandes antiennes Ô, qui invoquent le Christ comme Sagesse, Seigneur, Rameau de Jessé, Clé de David, Astre levant, Roi des nations et Emmanuel. Les grandes figures de l'Avent sont le prophète Isaïe, Jean le Baptiste et la Vierge Marie ; le 8 décembre, l'Église célèbre l'Immaculée Conception.","Le prêtre porte le violet, et le rose au troisième dimanche, Gaudete, car le Seigneur est proche (Ph 4,4–5). Le Gloria est omis le dimanche pour retentir de nouveau avec les anges à Noël."],
 k:[["Ce que célèbre ce temps","La triple venue du Christ : dans l'histoire, dans la grâce, dans la gloire."],["Les dimanches (Année B)","Premier : veillez (Mc 13,33–37). Deuxième : Jean prépare le chemin (Mc 1,1–8). Troisième, Gaudete : Jean rend témoignage à la lumière (Jn 1,6–8.19–28). Quatrième : l'annonciation à Marie (Lc 1,26–38)."],["Signes et coutumes","Ornements violets, rose à Gaudete ; la couronne de l'Avent à quatre bougies ; les antiennes Ô à partir du 17 décembre ; sobriété des décorations jusqu'à Noël."],["Comment le vivre","Une bonne confession avant Noël. Lire Isaïe. Prier l'Angélus. Donner du temps et de l'argent aux pauvres. Aller à la messe en semaine quand c'est possible."],["À la maison","Allumer la couronne de l'Avent au dîner. Préparer la crèche peu à peu et n'y déposer l'Enfant que la nuit de Noël."]]});
A("lat",CH,"fr",{t:"Le temps de Noël",
 p:["Avec la messe de la Nativité, l'Église latine entre dans le temps de Noël. Ce n'est pas un seul jour, mais un temps de joie qui dure jusqu'à la fête du Baptême du Seigneur, le 10 janvier 2027. Les huit premiers jours forment l'Octave de Noël, qui s'achève le 1er janvier avec la solennité de Sainte Marie, Mère de Dieu.","Le cœur de ce temps est le mystère de l'Incarnation : le Verbe s'est fait chair et il a habité parmi nous (Jn 1,14). Dieu ne nous a pas sauvés de loin ; il est devenu l'un de nous, un enfant né de la Vierge Marie et couché dans une mangeoire. Saint Léon le Grand disait à son peuple : chrétien, reconnais ta dignité (p).","Ce temps déploie la manifestation du Christ : aux bergers à Bethléem, aux nations dans les Mages à l'Épiphanie (6 janvier ; en Inde le dimanche 3 janvier 2027), et à Israël au Baptême dans le Jourdain. Le Gloria revient ; le prêtre porte le blanc ou l'or."],
 k:[["Ce que célèbre ce temps","La naissance du Fils de Dieu, vrai Dieu et vrai homme, et sa manifestation."],["Jours principaux","25 décembre : Noël. 27 décembre : Sainte Famille. 1er janvier : Sainte Marie, Mère de Dieu, Journée mondiale de la paix. Épiphanie. 10 janvier 2027 : Baptême du Seigneur."],["À lire","Is 9,1–6 ; Lc 2,1–20 ; Jn 1,1–18 ; Tt 2,11–14 ; Mt 2,1–12."],["Comment le vivre","Garder la joie de Noël pendant tout le temps. Aller à la messe aux fêtes de l'Octave. Visiter les personnes seules ou malades."],["À la maison","Garder la crèche et l'étoile jusqu'au Baptême du Seigneur. Bénir la maison à l'Épiphanie. Prier ensemble devant la crèche."]]});

A("lat",AD,"tl",{t:"Ang Panahon ng Adbiyento: isang bagong taon ng liturhiya",
 p:["Sa Unang Linggo ng Adbiyento, sinisimulan ngayon ng Simbahang Latino ang isang bagong taon ng liturhiya. Ang Adbiyento ay mula sa salitang Latin na adventus, pagdating. Sa loob ng humigit-kumulang apat na linggo, naghahanda ang Simbahan upang ipagdiwang ang pagdating ni Kristo: ang una, sa kababaang-loob sa Betlehem; ang pagdating niya ngayon sa Salita at mga sakramento; at ang huli, sa kaluwalhatian sa katapusan ng panahon.","Hanggang Disyembre 16, ang mga pagbasa ay nakatuon sa ikalawang pagdating: magbantay kayo (Marcos 13:33). Mula Disyembre 17 hanggang 24, tuwirang naghahanda ang Simbahan para sa Pasko, kasama ang mga ebanghelyo ng kabataan ni Hesus at ang mga dakilang O Antipona na tumatawag kay Kristo bilang Karunungan, Panginoon, Ugat ni Jesse, Susi ni David, Bukang-liwayway, Hari ng mga bansa at Emmanuel. Sa Pilipinas, kasabay nito ang Simbang Gabi. Ang mga dakilang pigura ng Adbiyento ay si propeta Isaias, si Juan Bautista at ang Birheng Maria; sa Disyembre 8, ipinagdiriwang ang Kalinis-linisang Paglilihi.","Lila ang kasuotan ng pari, at rosas sa Ikatlong Linggo, Gaudete, sapagkat malapit na ang Panginoon (Filipos 4:4–5). Hindi inaawit ang Gloria tuwing Linggo upang muli itong umalingawngaw kasama ng mga anghel sa Pasko."],
 k:[["Ang ipinagdiriwang","Ang tatlong pagdating ni Kristo: sa kasaysayan, sa biyaya, at sa kaluwalhatian."],["Ang mga Linggo (Taon B)","Una: magbantay kayo (Marcos 13:33–37). Ikalawa: inihahanda ni Juan ang daan (Marcos 1:1–8). Ikatlo, Gaudete: nagpatotoo si Juan sa liwanag (Juan 1:6–8, 19–28). Ikaapat: ang pagbati ng anghel kay Maria (Lucas 1:26–38)."],["Mga tanda at kaugalian","Lilang kasuotan, rosas sa Gaudete; ang korona ng Adbiyento na may apat na kandila; ang O Antipona mula Disyembre 17; ang Simbang Gabi."],["Paano isabuhay","Isang mabuting kumpisal bago mag-Pasko. Basahin si Isaias. Dasalin ang Angelus. Magbigay ng oras at pera sa mahihirap. Magsimba sa karaniwang araw kung kaya."],["Sa tahanan","Sindihan ang korona ng Adbiyento sa hapunan. Ihanda ang belen nang unti-unti at ilagay ang Sanggol sa gabi lamang ng Pasko."]]});
A("lat",CH,"tl",{t:"Ang Panahon ng Pasko",
 p:["Sa Misa ng Pagsilang ng Panginoon, pumapasok ang Simbahang Latino sa Panahon ng Pasko. Hindi ito iisang araw lamang, kundi isang panahon ng kagalakan hanggang sa Kapistahan ng Pagbibinyag sa Panginoon sa Enero 10, 2027. Ang unang walong araw ay ang Oktaba ng Pasko, na nagtatapos sa Enero 1 sa Dakilang Kapistahan ni Santa Maria, Ina ng Diyos.","Ang puso ng panahong ito ay ang misteryo ng Pagkakatawang-tao: ang Salita ay nagkatawang-tao at nanirahan sa piling natin (Juan 1:14). Hindi tayo iniligtas ng Diyos mula sa malayo; naging isa siya sa atin, isang sanggol na isinilang ng Birheng Maria at inihiga sa sabsaban. Sinabi ni San Leon Magno sa kanyang bayan: Kristiyano, kilalanin mo ang iyong dangal (p).","Inilalahad ng panahong ito ang pagpapakilala kay Kristo: sa mga pastol sa Betlehem, sa mga bansa sa pamamagitan ng mga Mago sa Epipanya (Enero 3, 2027, Linggo, sa Pilipinas at India), at sa kanyang Binyag sa Jordan. Bumabalik ang Gloria; puti o ginto ang kasuotan ng pari."],
 k:[["Ang ipinagdiriwang","Ang pagsilang ng Anak ng Diyos, tunay na Diyos at tunay na tao, at ang kanyang pagpapakilala."],["Mahahalagang araw","Disyembre 25: Pasko. Disyembre 27: Banal na Mag-anak. Enero 1: Santa Maria, Ina ng Diyos, Pandaigdigang Araw ng Kapayapaan. Enero 3, 2027: Epipanya. Enero 10: Pagbibinyag sa Panginoon."],["Babasahin","Isaias 9:2–7; Lucas 2:1–20; Juan 1:1–18; Tito 2:11–14; Mateo 2:1–12."],["Paano isabuhay","Panatilihin ang kagalakan ng Pasko sa buong panahon. Magsimba sa mga kapistahan ng Oktaba. Dalawin ang nag-iisa o maysakit."],["Sa tahanan","Panatilihin ang belen at parol hanggang sa Pagbibinyag sa Panginoon. Basbasan ang bahay sa Epipanya. Magdasal nang sama-sama sa harap ng belen."]]});

A("lat",AD,"sw",{t:"Kipindi cha Majilio: mwaka mpya wa liturujia",
 p:["Kwa Dominika ya Kwanza ya Majilio, Kanisa la Kilatini linaanza leo mwaka mpya wa liturujia. Neno Majilio linatafsiri neno la Kilatini adventus, kuja. Kwa takriban wiki nne Kanisa linajiandaa kuadhimisha kuja kwa Kristo: ujio wa kwanza katika unyenyekevu wa Bethlehemu, ujio wake leo katika Neno na sakramenti, na ujio wa mwisho katika utukufu mwishoni mwa nyakati.","Hadi tarehe 16 Desemba masomo yanaelekeza hasa kwenye ujio wa pili: kesheni (Marko 13:33). Kuanzia tarehe 17 hadi 24 Desemba Kanisa linajiandaa moja kwa moja kwa Noeli, kwa Injili za utoto wa Yesu na antifona kuu za O, zinazomwita Kristo Hekima, Bwana, Shina la Yese, Ufunguo wa Daudi, Mapambazuko, Mfalme wa mataifa na Emanueli. Watu wakuu wa Majilio ni nabii Isaya, Yohane Mbatizaji na Bikira Maria; tarehe 8 Desemba Kanisa linaadhimisha Mimba Isiyo na Doa.","Padre huvaa urujuani, na waridi katika Dominika ya Tatu, Gaudete, kwa sababu Bwana yu karibu (Wafilipi 4:4–5). Utukufu hauimbwi Dominika ili uvume tena pamoja na malaika katika Noeli."],
 k:[["Kinachoadhimishwa","Ujio wa Kristo wa namna tatu: katika historia, katika neema, na katika utukufu."],["Dominika (Mwaka B)","Ya kwanza: kesheni (Marko 13:33–37). Ya pili: Yohane anaandaa njia (Marko 1:1–8). Ya tatu, Gaudete: Yohane anashuhudia nuru (Yohane 1:6–8, 19–28). Ya nne: Malaika anampasha Maria habari (Luka 1:26–38)."],["Ishara na desturi","Mavazi ya urujuani, waridi katika Gaudete; shada la Majilio lenye mishumaa minne; antifona za O kuanzia tarehe 17 Desemba; urahisi wa mapambo hadi Noeli."],["Jinsi ya kuishi","Kitubio kizuri kabla ya Noeli. Kusoma kitabu cha Isaya. Kusali Malaika wa Bwana. Kuwapa maskini muda na fedha. Kushiriki Misa siku za kazi inapowezekana."],["Nyumbani","Washeni shada la Majilio wakati wa chakula cha jioni. Andaeni pango la Noeli polepole, na mweke Mtoto usiku wa Noeli tu."]]});
A("lat",CH,"sw",{t:"Kipindi cha Noeli",
 p:["Kwa Misa ya Kuzaliwa kwa Bwana, Kanisa la Kilatini linaingia katika kipindi cha Noeli. Si siku moja tu, bali ni kipindi cha furaha kinachoendelea hadi sikukuu ya Ubatizo wa Bwana, tarehe 10 Januari 2027. Siku nane za kwanza ni Oktava ya Noeli, inayohitimishwa tarehe 1 Januari kwa sherehe ya Maria Mtakatifu, Mama wa Mungu.","Kiini cha kipindi hiki ni fumbo la Umwilisho: Neno alifanyika mwili, akakaa kwetu (Yohane 1:14). Mungu hakutuokoa kwa mbali; alikuwa mmoja wetu, mtoto aliyezaliwa na Bikira Maria na kulazwa horini. Mtakatifu Leo Mkuu aliwaambia watu wake: Mkristo, tambua hadhi yako (p).","Kipindi hiki kinafunua udhihirisho wa Kristo: kwa wachungaji huko Bethlehemu, kwa mataifa kupitia Mamajusi katika Epifania (6 Januari; India, Dominika 3 Januari 2027), na katika Ubatizo wake mtoni Yordani. Utukufu unarudi; padre huvaa nyeupe au dhahabu."],
 k:[["Kinachoadhimishwa","Kuzaliwa kwa Mwana wa Mungu, Mungu kweli na mtu kweli, na udhihirisho wake."],["Siku kuu","25 Desemba: Noeli. 27 Desemba: Familia Takatifu. 1 Januari: Maria Mama wa Mungu, Siku ya Amani Duniani. Epifania. 10 Januari 2027: Ubatizo wa Bwana."],["Ya kusoma","Isaya 9:2–7; Luka 2:1–20; Yohane 1:1–18; Tito 2:11–14; Mathayo 2:1–12."],["Jinsi ya kuishi","Dumisha furaha ya Noeli kipindi chote. Shiriki Misa katika sikukuu za Oktava. Watembelee walio wapweke au wagonjwa."],["Nyumbani","Acheni pango na nyota hadi Ubatizo wa Bwana. Bariki nyumba katika Epifania. Salini pamoja mbele ya pango."]]});
})();

var WKX={
 en:{pmH:"A short prayer from today's Word",pmP:"Full prayer-meeting notes are given on Sundays and feasts. For today, gather around this simple order drawn from the day's readings.",catH:"Catechism on Sundays and feasts",catP:"On weekdays the Church lets the day's Word speak for itself; catechism lessons are given on Sundays and feast days.",next:"Next lesson",go:"Open",pray:"Closing prayer",none:"Pray with today's Gospel, and return on Sunday for the next lesson."},

U2.kn=Object.assign({},U2.en,{quick:"ಒಂದೇ ನೋಟದಲ್ಲಿ",action:"ಇಂದು",question:"ಇಂದಿನ ಪ್ರಶ್ನೆ",special:"ಈ ಭಾನುವಾರಕ್ಕೆ ಟಿಪ್ಪಣಿ",illus:"ಉದಾಹರಣೆ",kids:"ಮುಂದಿನ ಸಾಲಿನ ಮಕ್ಕಳಿಗಾಗಿ",diaspora:"ದೂರದಲ್ಲಿರುವವರಿಗಾಗಿ",diasporaPh:"ವಿದೇಶದಲ್ಲಿರುವ ಕಥೋಲಿಕರಿಗಾಗಿ ಟಿಪ್ಪಣಿಯ ಸ್ಥಳ: ಬೇರೆ ದಿನಗಳಲ್ಲಿ ಆಚರಿಸುವ ಹಬ್ಬಗಳು, ಸ್ಥಳೀಯ ಬಲಿಪೂಜೆಯ ಸಮಯಗಳು, ವಲಸಿಗರಿಗಾಗಿ ಉದ್ದೇಶಗಳು.",famcorner:"ಕುಟುಂಬ ಪ್ರಾರ್ಥನೆಗೆ ಮತ್ತು ಪ್ರಾರ್ಥನಾ ಕೂಟಗಳಿಗೆ",read:"ಓದಿರಿ",explain:"ಸರಳ ಮಾತುಗಳಲ್ಲಿ",intention:"ಈ ರಾತ್ರಿಯ ಉದ್ದೇಶ",ask:"ಊಟದ ಮೇಜಿನ ಬಳಿ",catech:"ಸತ್ಯೋಪದೇಶ",kidsaint:"ಮಕ್ಕಳಿಗಾಗಿ ಒಬ್ಬ ಸಂತ",req:"ಪ್ರಾರ್ಥನಾ ಬಿನ್ನಹಗಳು",reqtxt:"ನಿಮ್ಮ ಉದ್ದೇಶಗಳನ್ನು ಕಳುಹಿಸಿರಿ. ಪ್ರತಿ ಶುಕ್ರವಾರ ಓದುಗರಿಗಾಗಿ ಅರ್ಪಿಸುವ ದಿವ್ಯಬಲಿಪೂಜೆಯಲ್ಲಿ ಅವುಗಳನ್ನು ಸ್ಮರಿಸಲಾಗುತ್ತದೆ.",reqbtn:"ಇಲ್ಲಿ ಒಂದು ನಮೂನೆ ಜೋಡಿಸಲಾಗುವುದು",term:"ಇಂದಿನ ಪದ",season:"ಈ ಕಾಲದ ಬಗ್ಗೆ",more:"ನಿಮಗೆ ಗೊತ್ತೇ?",search:"ದಿನಾಂಕ, ಹಬ್ಬ, ಸಂತ, ಬೈಬಲ್ ಗ್ರಂಥ ಅಥವಾ ಯಾವುದೇ ಪದದಿಂದ ಹುಡುಕಿರಿ",noresult:"ಏನೂ ಸಿಗಲಿಲ್ಲ.",about:"ಅನುದಿನ ವಾಕ್ಯದ ಬಗ್ಗೆ",about1:"ಈ ಪುಟವನ್ನು ಕೇರಳದ ಒಬ್ಬ ಕಥೋಲಿಕ ಯಾಜಕರು ಪ್ರಾರ್ಥನಾಪೂರ್ವಕವಾಗಿ ಸಿದ್ಧಪಡಿಸುತ್ತಾರೆ; ವಾಕ್ಯ ಮಾತ್ರ ಕಾಣಬೇಕೆಂದು ಅವರು ತಮ್ಮ ಹೆಸರನ್ನು ಬಹಿರಂಗಪಡಿಸುವುದಿಲ್ಲ. ಇದು ಸಿರೋ-ಮಲಬಾರ್, ಸಿರೋ-ಮಲಂಕರ ಮತ್ತು ಲತೀನ್ ಧರ್ಮಸಭೆಗಳ ಅಧಿಕೃತ ಆರಾಧನಾ ಪಂಚಾಂಗಗಳನ್ನು ಅನುಸರಿಸುತ್ತದೆ.",about2:"ಬೈಬಲ್ ವಚನಗಳನ್ನು ಉಲ್ಲೇಖಗಳಾಗಿ ಮಾತ್ರ ನೀಡಲಾಗಿದೆ. ಧ್ಯಾನಗಳು ಮತ್ತು ಪ್ರಸಂಗ ಸೂಚನೆಗಳು ಸ್ವಂತ ರಚನೆಗಳು."});

CT.kn={h:"ಪ್ರಾರ್ಥನಾ ಉದ್ದೇಶಗಳು, ಸಲಹೆಗಳು ಮತ್ತು ಅಭಿಪ್ರಾಯಗಳು",p:"ನಿಮ್ಮ ಪ್ರಾರ್ಥನಾ ಉದ್ದೇಶಗಳನ್ನು ನಮಗೆ ಕಳುಹಿಸಿರಿ: ಪ್ರತಿ ಶುಕ್ರವಾರ ಈ ಪುಟದ ಓದುಗರಿಗಾಗಿ ಅರ್ಪಿಸುವ {Q}ಯಲ್ಲಿ ಅವುಗಳನ್ನು ಸಮರ್ಪಿಸಲಾಗುತ್ತದೆ. ನಿಮ್ಮ ಸಲಹೆಗಳು ಮತ್ತು ಅಭಿಪ್ರಾಯಗಳು ಈ ಪುಟವನ್ನು ಉತ್ತಮಗೊಳಿಸಲು ನಮಗೆ ಸಹಾಯ ಮಾಡುತ್ತವೆ.",b:["ಪ್ರಾರ್ಥನಾ ಉದ್ದೇಶ ಕಳುಹಿಸಿರಿ","ಸಲಹೆ ಕಳುಹಿಸಿರಿ","ಅಭಿಪ್ರಾಯ ಕಳುಹಿಸಿರಿ"]};

WKX.te={pmH:"ఈనాటి వాక్యం నుండి ఒక చిన్న ప్రార్థన",pmP:"ప్రార్థనా సమావేశానికి పూర్తి గమనికలు ఆదివారాలు, పండుగ దినాల్లో ఇవ్వబడతాయి. ఈరోజుకు ఈనాటి పఠనాల నుండి ఈ సరళమైన క్రమం.",catH:"ఆదివారాల్లో, పండుగల్లో సత్యోపదేశం",catP:"వారదినాల్లో ఈనాటి వాక్యమే మాట్లాడుతుంది; సత్యోపదేశ పాఠాలు ఆదివారాలు, పండుగ దినాల్లో వస్తాయి.",next:"తదుపరి సత్యోపదేశం",go:"తెరవండి",pray:"ముగింపు ప్రార్థన",none:"ఈనాటి సువార్తతో ప్రార్థించండి; ఆదివారం మళ్లీ రండి."};
WKX.kn={pmH:"ಇಂದಿನ ವಾಕ್ಯದಿಂದ ಒಂದು ಚಿಕ್ಕ ಪ್ರಾರ್ಥನೆ",pmP:"ಪ್ರಾರ್ಥನಾ ಕೂಟಕ್ಕೆ ಪೂರ್ಣ ಟಿಪ್ಪಣಿಗಳನ್ನು ಭಾನುವಾರಗಳಲ್ಲಿ ಮತ್ತು ಹಬ್ಬದ ದಿನಗಳಲ್ಲಿ ನೀಡಲಾಗುತ್ತದೆ. ಇಂದಿಗೆ ಇಂದಿನ ವಾಚನಗಳಿಂದ ಈ ಸರಳ ಕ್ರಮ.",catH:"ಭಾನುವಾರಗಳಲ್ಲಿ ಮತ್ತು ಹಬ್ಬಗಳಲ್ಲಿ ಸತ್ಯೋಪದೇಶ",catP:"ವಾರದ ದಿನಗಳಲ್ಲಿ ಇಂದಿನ ವಾಕ್ಯವೇ ಮಾತನಾಡುತ್ತದೆ; ಸತ್ಯೋಪದೇಶ ಪಾಠಗಳು ಭಾನುವಾರಗಳಲ್ಲಿ ಮತ್ತು ಹಬ್ಬದ ದಿನಗಳಲ್ಲಿ ಬರುತ್ತವೆ.",next:"ಮುಂದಿನ ಸತ್ಯೋಪದೇಶ",go:"ತೆರೆಯಿರಿ",pray:"ಮುಕ್ತಾಯ ಪ್ರಾರ್ಥನೆ",none:"ಇಂದಿನ ಶುಭಸಂದೇಶದೊಂದಿಗೆ ಪ್ರಾರ್ಥಿಸಿರಿ; ಭಾನುವಾರ ಮತ್ತೆ ಬನ್ನಿ."};

DI.kn={seas:{adv:"ಆಗಮನ ಕಾಲ",chr:"ಕ್ರಿಸ್ಮಸ್ ಕಾಲ",ot:"ಸಾಮಾನ್ಯ ಕಾಲ",lent:"ತಪಸ್ಸು ಕಾಲ",holy:"ಪವಿತ್ರ ವಾರ",east:"ಪಾಸ್ಖ ಕಾಲ"},col:{green:"ಆರಾಧನಾ ಬಣ್ಣ: ಹಸಿರು",violet:"ಆರಾಧನಾ ಬಣ್ಣ: ನೇರಳೆ",red:"ಆರಾಧನಾ ಬಣ್ಣ: ಕೆಂಪು",white:"ಆರಾಧನಾ ಬಣ್ಣ: ಬಿಳಿ"}};
SXL.te=Object.assign(SXL.te||{},{adv:["ఆగమన కాలం","ప్రభువు రాక కోసం సంతోషంతో ఎదురుచూసే నాలుగు వారాలు: కాలాంతంలో ఆయన రాక కోసం, క్రిస్మస్‌లో ఆయన జననోత్సవం కోసం. రంగు: ఊదా."],chr:["క్రిస్మస్ కాలం","ప్రభువు జననం నుండి ప్రభువు జ్ఞానస్నానం వరకు: శరీరధారియైన వాక్కు, తిరుకుటుంబం, దేవుని తల్లి మరియమాత, ప్రభువు ప్రత్యక్షత. రంగు: తెలుపు."],ot:["సాధారణ కాలం","లెక్కించబడిన వారాలు; ఆదివారం తర్వాత ఆదివారం శ్రీసభ క్రీస్తు బహిరంగ జీవితాన్ని, బోధనను అనుసరిస్తుంది. రంగు: ఆకుపచ్చ, ఎదుగుదల రంగు."],lent:["తపస్సు కాలం","విభూతి బుధవారం నుండి నలభై రోజుల ప్రార్థన, ఉపవాసం, దానధర్మం; జ్ఞానస్నానార్థులను జ్ఞానస్నానానికి, విశ్వాసులందరినీ పాస్కాకు సిద్ధం చేస్తుంది. రంగు: ఊదా."],holy:["పవిత్ర వారం","మట్టల ఆదివారం నుండి పాస్కా త్రిదినాల వరకు: యెరూషలేములోకి ప్రభువు ప్రవేశం, కడరాత్రి భోజనం, ఆయన శ్రమలు, మరణం, పాస్కా జాగరణ."],east:["పాస్కా కాలం","పునరుత్థానం నుండి పెంతెకోస్తు వరకు యాభై రోజుల ఆనందం, ఒకే గొప్ప ఆదివారంలా ఆచరించబడుతుంది. రంగు: తెలుపు."]});
SXL.kn=Object.assign(SXL.kn||{},{adv:["ಆಗಮನ ಕಾಲ","ಪ್ರಭುವಿನ ಆಗಮನಕ್ಕಾಗಿ ಆನಂದದಿಂದ ಕಾಯುವ ನಾಲ್ಕು ವಾರಗಳು: ಕಾಲಾಂತ್ಯದಲ್ಲಿ ಅವರ ಬರುವಿಕೆಗಾಗಿ ಮತ್ತು ಕ್ರಿಸ್ಮಸ್‌ನಲ್ಲಿ ಅವರ ಜನನೋತ್ಸವಕ್ಕಾಗಿ. ಬಣ್ಣ: ನೇರಳೆ."],chr:["ಕ್ರಿಸ್ಮಸ್ ಕಾಲ","ಪ್ರಭುವಿನ ಜನನದಿಂದ ಪ್ರಭುವಿನ ದೀಕ್ಷಾಸ್ನಾನದವರೆಗೆ: ಮಾಂಸಧಾರಿಯಾದ ವಾಕ್ಯ, ಪವಿತ್ರ ಕುಟುಂಬ, ದೇವಮಾತೆ ಮರಿಯ, ಪ್ರಭುವಿನ ಪ್ರತ್ಯಕ್ಷತೆ. ಬಣ್ಣ: ಬಿಳಿ."],ot:["ಸಾಮಾನ್ಯ ಕಾಲ","ಎಣಿಕೆಯ ವಾರಗಳು; ಭಾನುವಾರದಿಂದ ಭಾನುವಾರಕ್ಕೆ ಧರ್ಮಸಭೆ ಕ್ರಿಸ್ತರ ಸಾರ್ವಜನಿಕ ಜೀವನ ಮತ್ತು ಬೋಧನೆಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ. ಬಣ್ಣ: ಹಸಿರು, ಬೆಳವಣಿಗೆಯ ಬಣ್ಣ."],lent:["ತಪಸ್ಸು ಕಾಲ","ಬೂದಿ ಬುಧವಾರದಿಂದ ನಲವತ್ತು ದಿನಗಳ ಪ್ರಾರ್ಥನೆ, ಉಪವಾಸ ಮತ್ತು ದಾನಧರ್ಮ; ದೀಕ್ಷಾರ್ಥಿಗಳನ್ನು ದೀಕ್ಷಾಸ್ನಾನಕ್ಕೆ, ಎಲ್ಲಾ ವಿಶ್ವಾಸಿಗಳನ್ನು ಪಾಸ್ಖಕ್ಕೆ ಸಿದ್ಧಪಡಿಸುತ್ತದೆ. ಬಣ್ಣ: ನೇರಳೆ."],holy:["ಪವಿತ್ರ ವಾರ","ಗರಿಗಳ ಭಾನುವಾರದಿಂದ ಪಾಸ್ಖ ತ್ರಿದಿನಗಳವರೆಗೆ: ಯೆರೂಸಲೇಮಿಗೆ ಪ್ರಭುವಿನ ಪ್ರವೇಶ, ಕಡೆಯ ಭೋಜನ, ಅವರ ಯಾತನೆ ಮತ್ತು ಮರಣ, ಪಾಸ್ಖ ಜಾಗರಣೆ."],east:["ಪಾಸ್ಖ ಕಾಲ","ಪುನರುತ್ಥಾನದಿಂದ ಪೆಂತೆಕೋಸ್ತದವರೆಗೆ ಐವತ್ತು ದಿನಗಳ ಆನಂದ, ಒಂದೇ ದೊಡ್ಡ ಭಾನುವಾರದಂತೆ ಆಚರಿಸಲಾಗುತ್ತದೆ. ಬಣ್ಣ: ಬಿಳಿ."]});

WT.te={h:"అనుదిన వాక్యానికి స్వాగతం",p:"మీ రీతిలో, మీ భాషలో. కింద ఎంచుకోండి; పుట పైభాగంలో ఎప్పుడైనా మార్చుకోవచ్చు.",r:"రీతి",l:"భాష",cr:"మీ రీతిని ఎంచుకోండి",cl:"మీ భాషను ఎంచుకోండి",go:"చదవడం ప్రారంభించండి",hs:"అనుదిన వాక్యాన్ని మీ హోమ్ స్క్రీన్‌పై ఉంచుకోండి",add:"హోమ్ స్క్రీన్‌కు జోడించండి",an:"ఆండ్రాయిడ్ (Chrome): ⋮ నొక్కి, “Add to Home screen” ఎంచుకోండి.",io:"ఐఫోన్ (Safari): Share నొక్కి, “Add to Home Screen” ఎంచుకోండి."};
WT.kn={h:"ಅನುದಿನ ವಾಕ್ಯಕ್ಕೆ ಸ್ವಾಗತ",p:"ನಿಮ್ಮ ವಿಧಿ ಮತ್ತು ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ. ಕೆಳಗೆ ಆಯ್ಕೆಮಾಡಿ; ಪುಟದ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಯಾವಾಗ ಬೇಕಾದರೂ ಬದಲಾಯಿಸಬಹುದು.",r:"ವಿಧಿ",l:"ಭಾಷೆ",cr:"ನಿಮ್ಮ ವಿಧಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ",cl:"ನಿಮ್ಮ ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ",go:"ಓದಲು ಪ್ರಾರಂಭಿಸಿ",hs:"ಅನುದಿನ ವಾಕ್ಯವನ್ನು ನಿಮ್ಮ ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ಇಟ್ಟುಕೊಳ್ಳಿ",add:"ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ಗೆ ಸೇರಿಸಿ",an:"ಆಂಡ್ರಾಯ್ಡ್ (Chrome): ⋮ ಒತ್ತಿ, “Add to Home screen” ಆಯ್ಕೆಮಾಡಿ.",io:"ಐಫೋನ್ (Safari): Share ಒತ್ತಿ, “Add to Home Screen” ಆಯ್ಕೆಮಾಡಿ."};
u2h.te="ఈనాటి పఠనాలకు తిరిగి వెళ్లండి";u2h.kn="ಇಂದಿನ ವಾಚನಗಳಿಗೆ ಹಿಂದಿರುಗಿ";

HOW.te={t:"ఈ పుటను ఎలా ఉపయోగించాలి",intro:"అన్నీ ఒకే పుటలో ఉన్నాయి. దారి ఇలా కనుగొనండి:",
 steps:[["మీ రీతిని, భాషను ఎంచుకోండి","పైన ఉన్న రీతి పెట్టెలో సీరో-మలబారు, సీరో-మలంకర లేదా లాటిన్ ఎంచుకుని, తర్వాత మీ భాషను నొక్కండి. తదుపరిసారి కోసం పుట మీ ఎంపికను గుర్తుంచుకుంటుంది."],
  ["⌂ ఈరోజు: తిరిగి మొదటికి","ఏ పుట నుండైనా (పునీతులు, పోపుగారి పత్రాలు, ప్రత్యేక సందర్భాలు లేదా మరో తేదీ) పైన ఉన్న “⌂ ఈరోజు” లేదా శీర్షికను నొక్కితే ఈనాటి పఠనాలకు తిరిగి వస్తారు."],
  ["ఏ రోజుకైనా వెళ్లండి","మునుపటి లేదా తదుపరి రోజుకు ‹ › ఉపయోగించండి; ఏ తేదీనైనా ఎంచుకోవడానికి 📅 నొక్కండి; లేదా “ఈరోజు” నొక్కండి. వారపు పట్టీలో ప్రతి రోజు దాని పండుగ, మీ రీతిలో స్మరించే పునీతులు కనిపిస్తారు; రోజును తెరవడానికి దానిని నొక్కండి. వారం పేరు పక్కన ఉన్న ‹ › తో వారం వారం కదలవచ్చు."],
  ["మూడు భాగాలను తెరవండి","ఈనాటి వాక్యం: ఒక్క చూపులో ఈరోజు, పఠనాలు, ధ్యానం, పితరులు, శ్రీసభ బోధన, పునీతులు. ప్రసంగం & బోధన: 1. ప్రసంగ రూపరేఖ (అంశాలు, లేఖనం), 2. పిల్లల ప్రసంగం, పంచుకునే సందేశంతో పూర్తి ప్రసంగం, 3. ప్రార్థనా సమావేశం, 4. సత్యోపదేశం. ఆరాధనను తెలుసుకోండి: ఆరాధనా పాఠాలు, పదాలు."],
  ["మరింత తెలుసుకోవడానికి నొక్కండి","కాలం పేరును (రోజు శీర్షికకు పైన) నొక్కితే చిన్న వివరణ, ఆరాధనా రంగు అర్థం కనిపిస్తాయి. “ఒక్క చూపులో” భాగంలో పునీతుని పేరు నొక్కితే ఆ పునీతుని పుట తెరుచుకుంటుంది."],
  ["పునీతులు","“పునీతులు” బటన్ మీ రీతిలోని పునీతులను చూపిస్తుంది. జాబితా నుండి ఒక పునీతుని ఎంచుకోవచ్చు లేదా నెలను రోజువారీగా చూడవచ్చు. ప్రతి పునీతునికి జీవితం, పాఠాలు, కథలు (చరిత్ర, సంప్రదాయం, ఐతిహ్యం అని గుర్తించినవి), గుర్తుంచుకోవలసిన మాటలు, ప్రసంగ రూపరేఖ, ప్రసంగం, ప్రార్థన ఉన్నాయి. “పంచాంగంలో పండుగ దినం” ఆ రోజు పఠనాలకు తీసుకువెళ్తుంది."],
  ["వెతకండి","తేదీ, పండుగ, పునీతుడు, బైబిలు గ్రంథం లేదా ఏదైనా పదాన్ని మీ భాషలో టైప్ చేయండి. మొదట పునీతులు, ప్రత్యేక సందర్భాలు, తర్వాత రోజులు కనిపిస్తాయి. తెరవడానికి ఫలితాన్ని నొక్కండి."],
  ["సౌకర్యంగా చదవండి, పంచుకోండి","A−, A+ అక్షరాల పరిమాణాన్ని మారుస్తాయి. “ప్రసంగం & బోధన” (2. పూర్తి ప్రసంగం)లో “కాపీ చేయండి” వాట్సాప్ లేదా టెలిగ్రామ్ కోసం చిన్న సందేశాన్ని కాపీ చేస్తుంది."],
  ["పోపుగారి పత్రాలు, ప్రత్యేక సందర్భాలు","“పోపుగారి పత్రాలు” విశ్వలేఖలను, ఇతర పత్రాలను వాటికన్ తాజా వార్తలు, ప్రసంగాలు, సందేశాల లింకులతో ఇస్తుంది. “ప్రత్యేక సందర్భాలు” సంస్కారాలు, అంత్యక్రియలు, జూబిలీలు మొదలైన వాటికి ప్రసంగాలను ఇస్తుంది."],
  ["మాకు వ్రాయండి","పుట చివర ఉన్న ప్రార్థనా ఉద్దేశం, సూచన, అభిప్రాయం బటన్లు కంప్యూటర్‌లో జీమెయిల్‌ను, ఫోన్‌లో ఈమెయిల్ యాప్‌ను చిరునామాతో తెరుస్తాయి. చిరునామాను కాపీ చేసి ఏ ఈమెయిల్ నుండైనా వ్రాయవచ్చు."]],
 bible:"బైబిలు వచనాలు: తెలుగు కతోలిక పవిత్ర గ్రంథం (ఉల్లేఖనలు మాత్రమే)."};
HOW.kn={t:"ಈ ಪುಟವನ್ನು ಹೇಗೆ ಬಳಸುವುದು",intro:"ಎಲ್ಲವೂ ಒಂದೇ ಪುಟದಲ್ಲಿದೆ. ದಾರಿ ಹೀಗೆ ಕಂಡುಕೊಳ್ಳಿ:",
 steps:[["ನಿಮ್ಮ ವಿಧಿ ಮತ್ತು ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ","ಮೇಲಿನ ವಿಧಿ ಪೆಟ್ಟಿಗೆಯಲ್ಲಿ ಸಿರೋ-ಮಲಬಾರ್, ಸಿರೋ-ಮಲಂಕರ ಅಥವಾ ಲತೀನ್ ಆಯ್ಕೆಮಾಡಿ, ನಂತರ ನಿಮ್ಮ ಭಾಷೆಯನ್ನು ಒತ್ತಿರಿ. ಮುಂದಿನ ಬಾರಿಗಾಗಿ ಪುಟ ನಿಮ್ಮ ಆಯ್ಕೆಯನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತದೆ."],
  ["⌂ ಇಂದು: ಮೊದಲಿಗೆ ಹಿಂದಿರುಗಲು","ಯಾವುದೇ ಪುಟದಿಂದ (ಸಂತರು, ಜಗದ್ಗುರುಗಳ ದಾಖಲೆಗಳು, ವಿಶೇಷ ಸಂದರ್ಭಗಳು ಅಥವಾ ಬೇರೆ ದಿನಾಂಕ) ಮೇಲಿನ “⌂ ಇಂದು” ಅಥವಾ ಶೀರ್ಷಿಕೆಯನ್ನು ಒತ್ತಿದರೆ ಇಂದಿನ ವಾಚನಗಳಿಗೆ ಹಿಂದಿರುಗುತ್ತೀರಿ."],
  ["ಯಾವುದೇ ದಿನಕ್ಕೆ ಹೋಗಿ","ಹಿಂದಿನ ಅಥವಾ ಮುಂದಿನ ದಿನಕ್ಕೆ ‹ › ಬಳಸಿರಿ; ಯಾವುದೇ ದಿನಾಂಕವನ್ನು ಆಯ್ಕೆಮಾಡಲು 📅 ಒತ್ತಿರಿ; ಅಥವಾ “ಇಂದು” ಒತ್ತಿರಿ. ವಾರದ ಪಟ್ಟಿಯಲ್ಲಿ ಪ್ರತಿದಿನದ ಹಬ್ಬ ಮತ್ತು ನಿಮ್ಮ ವಿಧಿಯಲ್ಲಿ ಸ್ಮರಿಸುವ ಸಂತರು ಕಾಣುತ್ತಾರೆ; ದಿನವನ್ನು ತೆರೆಯಲು ಅದನ್ನು ಒತ್ತಿರಿ. ವಾರದ ಹೆಸರಿನ ಪಕ್ಕದ ‹ › ನಿಂದ ವಾರದಿಂದ ವಾರಕ್ಕೆ ಹೋಗಬಹುದು."],
  ["ಮೂರು ಭಾಗಗಳನ್ನು ತೆರೆಯಿರಿ","ಇಂದಿನ ವಾಕ್ಯ: ಒಂದೇ ನೋಟದಲ್ಲಿ ಇಂದು, ವಾಚನಗಳು, ಧ್ಯಾನ, ಪಿತೃಗಳು, ಧರ್ಮಸಭೆಯ ಬೋಧನೆ, ಸಂತರು. ಪ್ರಸಂಗ ಮತ್ತು ಬೋಧನೆ: 1. ಪ್ರಸಂಗದ ರೂಪರೇಖೆ (ಅಂಶಗಳು ಮತ್ತು ಶಾಸ್ತ್ರ), 2. ಮಕ್ಕಳ ಪ್ರಸಂಗ ಮತ್ತು ಹಂಚಿಕೊಳ್ಳುವ ಸಂದೇಶದೊಂದಿಗೆ ಪೂರ್ಣ ಪ್ರಸಂಗ, 3. ಪ್ರಾರ್ಥನಾ ಕೂಟ, 4. ಸತ್ಯೋಪದೇಶ. ಆರಾಧನೆಯನ್ನು ಅರಿಯಿರಿ: ಆರಾಧನೆಯ ಪಾಠಗಳು ಮತ್ತು ಪದಗಳು."],
  ["ಇನ್ನಷ್ಟು ತಿಳಿಯಲು ಒತ್ತಿರಿ","ಕಾಲದ ಹೆಸರನ್ನು (ದಿನದ ಶೀರ್ಷಿಕೆಯ ಮೇಲೆ) ಒತ್ತಿದರೆ ಚಿಕ್ಕ ವಿವರಣೆ ಮತ್ತು ಆರಾಧನಾ ಬಣ್ಣದ ಅರ್ಥ ಕಾಣುತ್ತದೆ. “ಒಂದೇ ನೋಟದಲ್ಲಿ” ಭಾಗದಲ್ಲಿ ಸಂತರ ಹೆಸರನ್ನು ಒತ್ತಿದರೆ ಆ ಸಂತರ ಪುಟ ತೆರೆಯುತ್ತದೆ."],
  ["ಸಂತರು","“ಸಂತರು” ಬಟನ್ ನಿಮ್ಮ ವಿಧಿಯ ಸಂತರನ್ನು ತೋರಿಸುತ್ತದೆ. ಪಟ್ಟಿಯಿಂದ ಒಬ್ಬ ಸಂತರನ್ನು ಆಯ್ಕೆಮಾಡಬಹುದು ಅಥವಾ ತಿಂಗಳನ್ನು ದಿನದಿನವೂ ನೋಡಬಹುದು. ಪ್ರತಿ ಸಂತರಿಗೂ ಜೀವನ, ಪಾಠಗಳು, ಕಥೆಗಳು (ಇತಿಹಾಸ, ಸಂಪ್ರದಾಯ, ಐತಿಹ್ಯ ಎಂದು ಗುರುತಿಸಿದವು), ನೆನಪಿಡಬೇಕಾದ ಮಾತುಗಳು, ಪ್ರಸಂಗದ ರೂಪರೇಖೆ ಮತ್ತು ಪ್ರಸಂಗ, ಪ್ರಾರ್ಥನೆ ಇವೆ. “ಪಂಚಾಂಗದಲ್ಲಿ ಹಬ್ಬದ ದಿನ” ಆ ದಿನದ ವಾಚನಗಳಿಗೆ ಕರೆದೊಯ್ಯುತ್ತದೆ."],
  ["ಹುಡುಕಿರಿ","ದಿನಾಂಕ, ಹಬ್ಬ, ಸಂತ, ಬೈಬಲ್ ಗ್ರಂಥ ಅಥವಾ ಯಾವುದೇ ಪದವನ್ನು ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ. ಮೊದಲು ಸಂತರು ಮತ್ತು ವಿಶೇಷ ಸಂದರ್ಭಗಳು, ನಂತರ ದಿನಗಳು ಕಾಣುತ್ತವೆ. ತೆರೆಯಲು ಫಲಿತಾಂಶವನ್ನು ಒತ್ತಿರಿ."],
  ["ಆರಾಮವಾಗಿ ಓದಿ, ಹಂಚಿಕೊಳ್ಳಿ","A− ಮತ್ತು A+ ಅಕ್ಷರಗಳ ಗಾತ್ರವನ್ನು ಬದಲಾಯಿಸುತ್ತವೆ. “ಪ್ರಸಂಗ ಮತ್ತು ಬೋಧನೆ” (2. ಪೂರ್ಣ ಪ್ರಸಂಗ) ಯಲ್ಲಿ “ನಕಲಿಸಿ” ವಾಟ್ಸಾಪ್ ಅಥವಾ ಟೆಲಿಗ್ರಾಮ್‌ಗಾಗಿ ಚಿಕ್ಕ ಸಂದೇಶವನ್ನು ನಕಲಿಸುತ್ತದೆ."],
  ["ಜಗದ್ಗುರುಗಳ ದಾಖಲೆಗಳು ಮತ್ತು ವಿಶೇಷ ಸಂದರ್ಭಗಳು","“ಜಗದ್ಗುರುಗಳ ದಾಖಲೆಗಳು” ವಿಶ್ವಪತ್ರಗಳನ್ನು ಮತ್ತು ಇತರ ದಾಖಲೆಗಳನ್ನು ವ್ಯಾಟಿಕನ್‌ನ ಇತ್ತೀಚಿನ ಸುದ್ದಿ, ಭಾಷಣಗಳು ಮತ್ತು ಸಂದೇಶಗಳ ಲಿಂಕ್‌ಗಳೊಂದಿಗೆ ನೀಡುತ್ತದೆ. “ವಿಶೇಷ ಸಂದರ್ಭಗಳು” ಸಂಸ್ಕಾರಗಳು, ಶವಸಂಸ್ಕಾರ, ಜೂಬಿಲಿ ಮುಂತಾದವುಗಳಿಗೆ ಪ್ರಸಂಗಗಳನ್ನು ನೀಡುತ್ತದೆ."],
  ["ನಮಗೆ ಬರೆಯಿರಿ","ಪುಟದ ಕೊನೆಯಲ್ಲಿರುವ ಪ್ರಾರ್ಥನಾ ಉದ್ದೇಶ, ಸಲಹೆ, ಅಭಿಪ್ರಾಯ ಬಟನ್‌ಗಳು ಕಂಪ್ಯೂಟರ್‌ನಲ್ಲಿ ಜಿಮೇಲ್ ಅನ್ನು, ಫೋನ್‌ನಲ್ಲಿ ಈಮೇಲ್ ಆ್ಯಪ್ ಅನ್ನು ವಿಳಾಸದೊಂದಿಗೆ ತೆರೆಯುತ್ತವೆ. ವಿಳಾಸವನ್ನು ನಕಲಿಸಿ ಯಾವುದೇ ಈಮೇಲ್‌ನಿಂದ ಬರೆಯಬಹುದು."]],
 bible:"ಬೈಬಲ್ ವಚನಗಳು: ಕನ್ನಡ ಕಥೋಲಿಕ ಪವಿತ್ರ ಬೈಬಲ್ (ಉಲ್ಲೇಖಗಳು ಮಾತ್ರ)."};

/* Latin calendar labels */
var _lld=latinLabelDI;
latinLabelDI=function(L,lang){if(lang!=="te"&&lang!=="kn")return _lld(L,lang);
 var te=lang==="te",u=UI[lang],S2=DI[lang].seas,day=u.days[L.w];
 var sp=te?{palm:"మట్టల ఆదివారం",pent:"పెంతెకోస్తు పండుగ",bapt:"ప్రభువు జ్ఞానస్నానం",ash:"విభూతి బుధవారం",king:"విశ్వరాజు క్రీస్తు మహోత్సవం",xmas:"క్రీస్తు జయంతి మహోత్సవం"}
          :{palm:"ಗರಿಗಳ ಭಾನುವಾರ",pent:"ಪೆಂತೆಕೋಸ್ತ ಹಬ್ಬ",bapt:"ಪ್ರಭುವಿನ ದೀಕ್ಷಾಸ್ನಾನ",ash:"ಬೂದಿ ಬುಧವಾರ",king:"ವಿಶ್ವರಾಜ ಕ್ರಿಸ್ತರ ಮಹೋತ್ಸವ",xmas:"ಕ್ರಿಸ್ತಜಯಂತಿ ಮಹೋತ್ಸವ"};
 if(L.special)return sp[L.special];
 if(L.s==="chr"||L.s==="holy")return S2[L.s]+" · "+day;
 if(L.s==="lent"&&L.n===0)return te?"విభూతి బుధవారం తర్వాతి "+day:"ಬೂದಿ ಬುಧವಾರದ ನಂತರದ "+day;
 var ss=S2[L.s];
 if(te)return L.w===0?ss+"పు "+L.n+"వ ఆదివారం":ss+"పు "+L.n+"వ వారం "+day;
 return L.w===0?ss+"ದ "+L.n+"ನೇ ಭಾನುವಾರ":ss+"ದ "+L.n+"ನೇ ವಾರದ "+day};
/* "కాలం"+"పు" -> "కాలపు" */
var _lld2=latinLabelDI;latinLabelDI=function(L,lang){var s=_lld2(L,lang);return lang==="te"?s.replace(/కాలంపు /,"కాలపు ").replace(/వారంపు /,"వారపు "):s};

var _dl=dateLabel;dateLabel=function(t,lang){if(lang!=="te"&&lang!=="kn")return _dl(t,lang);var d=new Date(t),u=UI[lang];return u.days[d.getUTCDay()]+", "+d.getUTCDate()+" "+u.months[d.getUTCMonth()]+" "+d.getUTCFullYear()};
var _smd=saintMD;saintMD=function(md,lang){if(lang!=="te"&&lang!=="kn")return _smd(md,lang);var u=UI[lang],m=+md.slice(0,2)-1,d=+md.slice(3);return d+" "+u.months[m]};

DOCT.kn=[["ವಿಶ್ವಾಸದ ಐಕ್ಯದಲ್ಲಿ","ನಿಕೆಯ ಮಹಾಸಭೆಯ 1700ನೇ ವಾರ್ಷಿಕೋತ್ಸವ ಮತ್ತು ನಾವು ಘೋಷಿಸುವ ವಿಶ್ವಾಸ ಪ್ರಮಾಣದ ಕುರಿತು."],["ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸಿದೆನು","ಬಡವರ ಮೇಲಿನ ಪ್ರೀತಿಯ ಕುರಿತು."],["ಅವರು ನಮ್ಮನ್ನು ಪ್ರೀತಿಸಿದರು","ಯೇಸುಕ್ರಿಸ್ತರ ಹೃದಯದ ಮಾನವೀಯ ಮತ್ತು ದೈವಿಕ ಪ್ರೀತಿಯ ಕುರಿತು."],["ಭರವಸೆಯೇ","ದೇವರ ಕರುಣಾಮಯ ಪ್ರೀತಿಯ ಮೇಲಿನ ಭರವಸೆಯ ಕುರಿತು, ಸಂತ ತೆರೇಸಾರ ಜನನದ 150ನೇ ವರ್ಷದಲ್ಲಿ."],["ದೇವರನ್ನು ಸ್ತುತಿಸಿರಿ","ಹವಾಮಾನ ಬಿಕ್ಕಟ್ಟಿನ ಕುರಿತು, ಲಾವುದಾತೊ ಸಿ ಯ ಮುಂದುವರಿಕೆಯಾಗಿ."],["ನಾನು ಬಹಳವಾಗಿ ಬಯಸಿದೆನು","ದೇವಜನರ ಆರಾಧನಾ ರೂಪೀಕರಣದ ಕುರಿತು."],["ಎಲ್ಲರೂ ಸಹೋದರರು","ಸಹೋದರತ್ವ ಮತ್ತು ಸಾಮಾಜಿಕ ಸ್ನೇಹದ ಕುರಿತು."],["ತಂದೆಯ ಹೃದಯದಿಂದ","ಸಂತ ಯೋಸೇಫರ ಕುರಿತು, ಅವರು ಸಾರ್ವತ್ರಿಕ ಧರ್ಮಸಭೆಯ ಪಾಲಕರೆಂದು ಘೋಷಿಸಲ್ಪಟ್ಟು 150 ವರ್ಷಗಳಾದಾಗ."],["ಪ್ರಿಯ ಅಮೆಜಾನ್","ಅಮೆಜಾನ್ ಸಿನೊಡಿನ ನಂತರ."],["ಕ್ರಿಸ್ತರು ಜೀವಿಸುತ್ತಾರೆ","ಯುವಜನರಿಗೂ ಇಡೀ ದೇವಜನರಿಗೂ."],["ಸಂತೋಷಪಡಿರಿ, ಆನಂದಿಸಿರಿ","ಇಂದಿನ ಲೋಕದಲ್ಲಿ ಪಾವಿತ್ರ್ಯದ ಕರೆಯ ಕುರಿತು."],["ಪ್ರೀತಿಯ ಆನಂದ","ಕುಟುಂಬದಲ್ಲಿನ ಪ್ರೀತಿಯ ಕುರಿತು."],["ನಿಮಗೆ ಸ್ತುತಿಯಾಗಲಿ","ನಮ್ಮ ಸಾಮಾನ್ಯ ಮನೆಯ ಕಾಳಜಿಯ ಕುರಿತು."],["ಕರುಣೆಯ ಮುಖ","ಕರುಣೆಯ ಅಸಾಧಾರಣ ಜೂಬಿಲಿಯನ್ನು ಘೋಷಿಸುವ ಬುಲ್ಲಾ."],["ಶುಭಸಂದೇಶದ ಆನಂದ","ಇಂದಿನ ಲೋಕದಲ್ಲಿ ಶುಭಸಂದೇಶ ಸಾರುವಿಕೆಯ ಕುರಿತು; ಪ್ರೇಷಿತ ಧರ್ಮಸಭೆಯ ಕಾರ್ಯಕ್ರಮ."],["ವಿಶ್ವಾಸದ ಬೆಳಕು","ವಿಶ್ವಾಸದ ಕುರಿತು; ಹದಿನಾರನೇ ಬೆನೆಡಿಕ್ಟರು ಆರಂಭಿಸಿ ಫ್ರಾನ್ಸಿಸರು ಪೂರ್ಣಗೊಳಿಸಿದ್ದು."],["ಪ್ರಭುವಿನ ವಾಕ್ಯ","ಧರ್ಮಸಭೆಯ ಜೀವನ ಮತ್ತು ಪ್ರೇಷಿತಕಾರ್ಯದಲ್ಲಿ ದೇವರ ವಾಕ್ಯದ ಕುರಿತು."],["ಸತ್ಯದಲ್ಲಿ ಪ್ರೀತಿ","ಪ್ರೀತಿ ಮತ್ತು ಸತ್ಯದಲ್ಲಿ ಮಾನವನ ಸಮಗ್ರ ಅಭಿವೃದ್ಧಿಯ ಕುರಿತು."],["ನಿರೀಕ್ಷೆಯಲ್ಲಿ ರಕ್ಷಿಸಲ್ಪಟ್ಟವರು","ಕ್ರೈಸ್ತ ನಿರೀಕ್ಷೆಯ ಕುರಿತು."],["ಪ್ರೀತಿಯ ಸಂಸ್ಕಾರ","ಧರ್ಮಸಭೆಯ ಜೀವನ ಮತ್ತು ಪ್ರೇಷಿತಕಾರ್ಯದ ಮೂಲವೂ ಶಿಖರವೂ ಆದ ಪರಮಪ್ರಸಾದದ ಕುರಿತು."],["ದೇವರು ಪ್ರೀತಿಯಾಗಿದ್ದಾರೆ","ಕ್ರೈಸ್ತ ಪ್ರೀತಿಯ ಕುರಿತು."],["ಧರ್ಮಸಭೆ ಪರಮಪ್ರಸಾದದಿಂದ ಜೀವಿಸುತ್ತದೆ","ಧರ್ಮಸಭೆಯೊಂದಿಗಿನ ಸಂಬಂಧದಲ್ಲಿ ಪರಮಪ್ರಸಾದದ ಕುರಿತು."],["ಕನ್ಯಾಮರಿಯಳ ಜಪಮಾಲೆ","ಜಪಮಾಲೆಯ ಕುರಿತು; ಪ್ರಕಾಶದ ರಹಸ್ಯಗಳನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ."],["ಹೊಸ ಸಹಸ್ರಮಾನದ ಆರಂಭದಲ್ಲಿ","2000ರ ಮಹಾ ಜೂಬಿಲಿಯ ಸಮಾಪ್ತಿಯಲ್ಲಿ: ಆಳಕ್ಕೆ ಹೋಗಿರಿ ಎಂಬ ಕರೆ."],["ಏಷ್ಯಾದಲ್ಲಿ ಧರ್ಮಸಭೆ","ಏಷ್ಯಾ ಸಿನೊಡಿನ ನಂತರ; ರಕ್ಷಕರಾದ ಯೇಸುಕ್ರಿಸ್ತರು ಮತ್ತು ಏಷ್ಯಾದಲ್ಲಿ ಅವರ ಪ್ರೇಷಿತಕಾರ್ಯದ ಕುರಿತು. ನವದೆಹಲಿಯಲ್ಲಿ ಸಹಿ ಮಾಡಲ್ಪಟ್ಟಿತು."],["ವಿಶ್ವಾಸ ಮತ್ತು ವಿವೇಚನೆ","ವಿಶ್ವಾಸ ಮತ್ತು ವಿವೇಚನೆಯ ನಡುವಿನ ಸಂಬಂಧದ ಕುರಿತು."],["ಪ್ರಭುವಿನ ದಿನ","ಭಾನುವಾರವನ್ನು ಪವಿತ್ರವಾಗಿ ಆಚರಿಸುವುದರ ಕುರಿತು."],["ಪೂರ್ವದ ಬೆಳಕು","ಸಿರಿಯನ್ ಸಂಪ್ರದಾಯಗಳೂ ಸೇರಿದಂತೆ ಪೂರ್ವದ ಧರ್ಮಸಭೆಗಳ ಸಂಪತ್ತಿನ ಕುರಿತು."],["ಜೀವದ ಶುಭಸಂದೇಶ","ಮಾನವ ಜೀವನದ ಮೌಲ್ಯ ಮತ್ತು ಅಲಂಘನೀಯತೆಯ ಕುರಿತು."],["ರಕ್ಷಕರ ಪ್ರೇಷಿತಕಾರ್ಯ","ಧರ್ಮಸಭೆಯ ಪ್ರೇಷಿತ ಆಜ್ಞೆಯ ಶಾಶ್ವತ ಪ್ರಸ್ತುತತೆಯ ಕುರಿತು."],["ರಕ್ಷಕರ ಪಾಲಕರು","ಕ್ರಿಸ್ತರ ಮತ್ತು ಧರ್ಮಸಭೆಯ ಜೀವನದಲ್ಲಿ ಸಂತ ಯೋಸೇಫರ ಕುರಿತು."],["ಕ್ರೈಸ್ತ ಕುಟುಂಬ","ಇಂದಿನ ಲೋಕದಲ್ಲಿ ಕ್ರೈಸ್ತ ಕುಟುಂಬದ ಪಾತ್ರದ ಕುರಿತು."],["ಇಂದಿನ ಲೋಕದಲ್ಲಿ ಶುಭಸಂದೇಶ ಪ್ರಚಾರ","ಧರ್ಮಸಭೆಯ ಆಳವಾದ ಅಸ್ತಿತ್ವವಾದ ಶುಭಸಂದೇಶ ಪ್ರಚಾರದ ಕುರಿತು."],["ಮಾನವ ಜೀವನದ ಕುರಿತು","ಜೀವನವನ್ನು ಹಸ್ತಾಂತರಿಸುವುದರ ಕುರಿತು."],["ಜನಾಂಗಗಳ ಅಭಿವೃದ್ಧಿ","ಜನಾಂಗಗಳ ಅಭಿವೃದ್ಧಿಯ ಕುರಿತು."],["ಜನಾಂಗಗಳಿಗೆ","ಧರ್ಮಸಭೆಯ ಪ್ರೇಷಿತ ಚಟುವಟಿಕೆಯ ಕುರಿತಾದ ಆಜ್ಞಾಪತ್ರ."],["ದೇವರ ವಾಕ್ಯ","ದೈವಪ್ರಕಟನೆಯ ಕುರಿತಾದ ತತ್ವಾತ್ಮಕ ಸಂವಿಧಾನ."],["ಆನಂದ ಮತ್ತು ನಿರೀಕ್ಷೆ","ಇಂದಿನ ಲೋಕದಲ್ಲಿ ಧರ್ಮಸಭೆಯ ಕುರಿತಾದ ಪಾಲನಾತ್ಮಕ ಸಂವಿಧಾನ."],["ಪೂರ್ವದ ಧರ್ಮಸಭೆಗಳು","ಪೂರ್ವದ ಕಥೋಲಿಕ ಧರ್ಮಸಭೆಗಳ ಕುರಿತಾದ ಆಜ್ಞಾಪತ್ರ."],["ಜನಾಂಗಗಳ ಬೆಳಕು","ಧರ್ಮಸಭೆಯ ಕುರಿತಾದ ತತ್ವಾತ್ಮಕ ಸಂವಿಧಾನ."],["ಪವಿತ್ರ ಮಹಾಸಭೆ","ಪವಿತ್ರ ಆರಾಧನಾವಿಧಿಯ ಕುರಿತಾದ ಸಂವಿಧಾನ."]];

  ["⌂ Hoy: volver al inicio","Desde cualquier página (santos, documentos pontificios, ocasiones especiales u otra fecha), toque “⌂ Hoy” o el título de arriba para volver a las lecturas de hoy."],
  ["Ir a cualquier día","Use ‹ › para el día anterior o siguiente; toque 📅 para elegir una fecha; o toque “Hoy”. La franja semanal muestra la fiesta de cada día y los santos de su rito; toque un día para abrirlo. Con ‹ › junto al nombre de la semana se avanza semana a semana."],
  ["Abrir las tres secciones","Palabra del día: el día de un vistazo, lecturas, reflexión, Padres, Magisterio, santos. Predicar y enseñar: 1. esquema de la homilía (puntos y Escritura), 2. homilía completa con homilía para niños y mensaje para compartir, 3. grupo de oración, 4. catequesis. Conocer la liturgia: lecciones y términos litúrgicos. Los mismos tres enlaces aparecen también al final de cada página."],
  ["Toque para saber más","Toque el nombre del tiempo litúrgico (sobre el título del día) para ver una breve explicación y el significado del color litúrgico. En “De un vistazo”, toque el nombre de un santo para abrir su página."],
  ["Santos","El botón “Santos” muestra los santos de su rito. Puede elegir un santo de la lista o recorrer el mes día por día. Cada santo tiene vida, lecciones, relatos (marcados como historia, tradición o leyenda), palabras para recordar, esquema de homilía y homilía, y oración. “Día de la fiesta en el calendario” lleva a las lecturas de ese día."],
  ["Buscar","Escriba una fecha, una fiesta, un santo, un libro de la Biblia o cualquier palabra en su lengua. Primero aparecen los santos y las ocasiones especiales, después los días. Toque un resultado para abrirlo."],
  ["Leer con comodidad y compartir","A− y A+ cambian el tamaño de la letra. En “Predicar y enseñar” (2. homilía completa), “Copiar el texto” copia un mensaje breve para WhatsApp o Telegram."],
  ["Documentos pontificios y ocasiones especiales","“Documentos pontificios” ofrece las encíclicas y otros documentos, con enlaces a las últimas noticias, discursos y mensajes del Vaticano. “Ocasiones especiales” ofrece homilías para sacramentos, funerales, aniversarios y otras ocasiones."],
  ["Escríbanos","Los botones de intención de oración, sugerencia y comentario al final de la página abren Gmail en el ordenador o la aplicación de correo en el teléfono con la dirección ya puesta. También puede copiar la dirección y escribir desde cualquier correo."]],

HOW.pt={t:"Como usar esta página",intro:"Tudo está numa só página. Eis como encontrar o caminho:",
 steps:[["Escolha o seu rito e a sua língua","No quadro de cima escolha siro-malabar, siro-malankar ou latino, e depois toque na sua língua. A página lembra a sua escolha para a próxima vez."],
  ["⌂ Hoje: voltar ao início","De qualquer página (santos, documentos pontifícios, ocasiões especiais ou outra data), toque em “⌂ Hoje” ou no título de cima para voltar às leituras de hoje."],
  ["Ir para qualquer dia","Use ‹ › para o dia anterior ou seguinte; toque em 📅 para escolher uma data; ou toque em “Hoje”. A faixa semanal mostra a festa de cada dia e os santos do seu rito; toque num dia para o abrir. Com ‹ › junto ao nome da semana avança-se semana a semana."],
  ["Abrir as três secções","Palavra do dia: o dia num relance, leituras, reflexão, Padres, Magistério, santos. Pregar e ensinar: 1. esquema da homilia (pontos e Escritura), 2. homilia completa com homilia para crianças e mensagem para partilhar, 3. grupo de oração, 4. catequese. Conhecer a liturgia: lições e termos litúrgicos. Os mesmos três links aparecem também no fim de cada página."],
  ["Toque para saber mais","Toque no nome do tempo litúrgico (por cima do título do dia) para ver uma breve explicação e o significado da cor litúrgica. Em “Num relance”, toque no nome de um santo para abrir a sua página."],
  ["Santos","O botão “Santos” mostra os santos do seu rito. Pode escolher um santo da lista ou percorrer o mês dia a dia. Cada santo tem vida, lições, histórias (marcadas como história, tradição ou lenda), palavras para recordar, esquema de homilia e homilia, e oração. “Dia da festa no calendário” leva às leituras desse dia."],
  ["Procurar","Escreva uma data, uma festa, um santo, um livro da Bíblia ou qualquer palavra na sua língua. Primeiro aparecem os santos e as ocasiões especiais, depois os dias. Toque num resultado para o abrir."],
  ["Ler com conforto e partilhar","A− e A+ mudam o tamanho da letra. Em “Pregar e ensinar” (2. homilia completa), “Copiar o texto” copia uma mensagem breve para WhatsApp ou Telegram."],
  ["Documentos pontifícios e ocasiões especiais","“Documentos pontifícios” oferece as encíclicas e outros documentos, com ligações às últimas notícias, discursos e mensagens do Vaticano. “Ocasiões especiais” oferece homilias para sacramentos, funerais, aniversários e outras ocasiões."],
  ["Escreva-nos","Os botões de intenção de oração, sugestão e comentário no fim da página abrem o Gmail no computador ou a aplicação de correio no telemóvel com o endereço já preenchido. Também pode copiar o endereço e escrever de qualquer correio."]],

 steps:[["Choisissez votre rite et votre langue","Dans l'encadré du haut, choisissez syro-malabar, syro-malankar ou latin, puis touchez votre langue. La page retient votre choix pour la prochaine fois."],
  ["⌂ Aujourd'hui : revenir au début","Depuis n'importe quelle page (saints, documents pontificaux, occasions particulières ou une autre date), touchez « ⌂ Aujourd'hui » ou le titre en haut pour revenir aux lectures du jour."],
  ["Aller à n'importe quel jour","Utilisez ‹ › pour le jour précédent ou suivant ; touchez 📅 pour choisir une date ; ou touchez « Aujourd'hui ». La bande de la semaine montre la fête de chaque jour et les saints de votre rite ; touchez un jour pour l'ouvrir. Avec ‹ › à côté du nom de la semaine, on avance de semaine en semaine."],
  ["Ouvrir les trois sections","Parole du jour : le jour en un coup d'œil, les lectures, la méditation, les Pères, le Magistère, les saints. Prêcher et enseigner : 1. plan de l'homélie (points et Écriture), 2. homélie complète avec homélie pour les enfants et message à partager, 3. groupe de prière, 4. catéchèse. Connaître la liturgie : leçons et termes liturgiques. Les trois mêmes liens se trouvent aussi en bas de chaque page."],
  ["Touchez pour en savoir plus","Touchez le nom du temps liturgique (au-dessus du titre du jour) pour voir une courte explication et le sens de la couleur liturgique. Dans « En un coup d'œil », touchez le nom d'un saint pour ouvrir sa page."],
  ["Saints","Le bouton « Saints » montre les saints de votre rite. Vous pouvez choisir un saint dans la liste ou parcourir le mois jour après jour. Chaque saint a sa vie, des leçons, des récits (marqués histoire, tradition ou légende), des paroles à retenir, un plan d'homélie et une homélie, et une prière. « Jour de la fête dans le calendrier » mène aux lectures de ce jour."],
  ["Rechercher","Tapez une date, une fête, un saint, un livre de la Bible ou n'importe quel mot dans votre langue. Les saints et les occasions particulières apparaissent d'abord, puis les jours. Touchez un résultat pour l'ouvrir."],
  ["Lire confortablement et partager","A− et A+ changent la taille du texte. Dans « Prêcher et enseigner » (2. homélie complète), « Copier le texte » copie un court message pour WhatsApp ou Telegram."],
  ["Documents pontificaux et occasions particulières","« Documents pontificaux » donne les encycliques et autres documents, avec des liens vers les dernières nouvelles, discours et messages du Vatican. « Occasions particulières » donne des homélies pour les sacrements, les funérailles, les anniversaires et d'autres occasions."],
  ["Écrivez-nous","Les boutons d'intention de prière, de suggestion et de commentaire en bas de la page ouvrent Gmail sur ordinateur ou l'application de messagerie sur téléphone, avec l'adresse déjà remplie. Vous pouvez aussi copier l'adresse et écrire depuis n'importe quelle messagerie."]],
 bible:"Textes bibliques : Bible catholique en français (références seulement)."};

SXL.tl={adv:["Adbiyento","Apat na linggo ng masayang paghihintay sa Panginoon: sa kanyang pagdating sa wakas ng panahon at sa pagdiriwang ng kanyang pagsilang sa Pasko. Kulay: lila."],chr:["Panahon ng Pasko","Mula sa Pagsilang ng Panginoon hanggang sa Binyag ng Panginoon: ang Salitang nagkatawang-tao, ang Banal na Mag-anak, si Santa Maria Ina ng Diyos, ang Epipanya. Kulay: puti."],ot:["Karaniwang Panahon","Mga linggong may bilang kung saan, Linggo-Linggo, sinusundan ng Simbahan ang pampublikong buhay at turo ni Kristo. Kulay: berde, kulay ng paglago."],lent:["Kuwaresma","Apatnapung araw ng panalangin, pag-aayuno at paglilimos mula Miyerkules ng Abo; inihahanda nito ang mga katekumeno sa binyag at ang lahat ng mananampalataya sa Pasko ng Pagkabuhay. Kulay: lila."],holy:["Mahal na Araw","Mula Linggo ng Palaspas hanggang sa Tatlong Araw ng Pasko: ang pagpasok ng Panginoon sa Jerusalem, ang Huling Hapunan, ang kanyang Pagpapakasakit at kamatayan, ang Bihilya ng Pasko ng Pagkabuhay."],east:["Panahon ng Pagkabuhay","Limampung araw ng galak mula sa Pagkabuhay hanggang sa Pentekostes, na ipinagdiriwang na parang iisang dakilang Linggo. Kulay: puti."]};
WT.tl={h:"Maligayang pagdating sa Salita sa Araw-araw",p:"Sa iyong rito at sa iyong wika. Pumili sa ibaba; maaari kang magpalit anumang oras sa itaas ng pahina.",r:"Rito",l:"Wika",cr:"Piliin ang iyong rito",cl:"Piliin ang iyong wika",go:"Simulan ang pagbasa",hs:"Ilagay ang Salita sa Araw-araw sa iyong home screen",add:"Idagdag sa home screen",an:"Android (Chrome): pindutin ang ⋮ at piliin ang \"Add to Home screen\".",io:"iPhone (Safari): pindutin ang Share at piliin ang \"Add to Home Screen\"."};

HOW.tl={t:"Paano gamitin ang pahinang ito",intro:"Nasa iisang pahina ang lahat. Ganito ka makakapaglibot:",
 steps:[["Piliin ang iyong rito at wika","Sa kahon sa itaas, piliin ang Siro-Malabar, Siro-Malankara o Latino, saka pindutin ang iyong wika. Tatandaan ng pahina ang iyong pinili sa susunod."],
  ["⌂ Ngayon: bumalik sa simula","Mula sa anumang pahina (mga santo, dokumento ng Papa, natatanging okasyon o ibang petsa), pindutin ang \"⌂ Ngayon\" o ang pamagat sa itaas upang bumalik sa mga pagbasa ng araw."],
  ["Pumunta sa anumang araw","Gamitin ang ‹ › para sa nakaraan o susunod na araw; pindutin ang 📅 upang pumili ng petsa; o pindutin ang \"Ngayon\". Ipinapakita ng guhit ng linggo ang kapistahan ng bawat araw at ang mga santo ng iyong rito; pindutin ang isang araw upang buksan ito. Sa ‹ › katabi ng pangalan ng linggo, lilipat ka bawat linggo."],
  ["Buksan ang tatlong bahagi","Salita ng araw: ang araw sa isang sulyap, mga pagbasa, pagninilay, mga Ama ng Simbahan, Magisterio, mga santo. Mangaral at magturo: 1. balangkas ng homiliya (mga punto at Kasulatan), 2. buong homiliya kasama ang homiliya para sa mga bata at mensaheng maibabahagi, 3. grupo ng panalangin, 4. katekesis. Kilalanin ang liturhiya: mga aralin at termino ng liturhiya. Nasa ibaba rin ng bawat pahina ang tatlong link na ito."],
  ["Pindutin upang malaman pa","Pindutin ang pangalan ng panahon ng liturhiya (sa itaas ng pamagat ng araw) upang makita ang maikling paliwanag at ang kahulugan ng kulay. Sa \"Sa isang sulyap\", pindutin ang pangalan ng santo upang buksan ang kanyang pahina."],
  ["Mga santo","Ipinapakita ng buton na \"Mga santo\" ang mga santo ng iyong rito. Maaari kang pumili mula sa listahan o tingnan ang buwan araw-araw. Bawat santo ay may buhay, mga aral, mga kuwento (may markang kasaysayan, tradisyon o alamat), mga salitang dapat tandaan, balangkas at homiliya, at panalangin. Dinadala ka ng \"Araw ng kapistahan sa kalendaryo\" sa mga pagbasa ng araw na iyon."],
  ["Maghanap","I-type ang petsa, kapistahan, santo, aklat ng Bibliya o anumang salita sa iyong wika. Unang lumalabas ang mga santo at natatanging okasyon, saka ang mga araw. Pindutin ang isang resulta upang buksan ito."],
  ["Magbasa nang maginhawa at magbahagi","Binabago ng A− at A+ ang laki ng teksto. Sa \"Mangaral at magturo\" (2. buong homiliya), kinokopya ng \"Kopyahin ang teksto\" ang maikling mensahe para sa WhatsApp o Telegram."],
  ["Mga dokumento ng Papa at natatanging okasyon","Ibinibigay ng \"Mga dokumento ng Papa\" ang mga ensiklika at iba pang dokumento, kasama ang mga link sa pinakabagong balita, talumpati at mensahe mula sa Vaticano. Ibinibigay ng \"Mga natatanging okasyon\" ang mga homiliya para sa mga sakramento, libing, anibersaryo at iba pang okasyon."],
  ["Sumulat sa amin","Ang mga buton para sa intensiyon, mungkahi at puna sa ibaba ng pahina ay nagbubukas ng Gmail sa kompyuter o ng app ng email sa telepono, na nakalagay na ang address. Maaari mo ring kopyahin ang address at sumulat mula sa anumang email."]],
