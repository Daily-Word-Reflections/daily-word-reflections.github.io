 alt:"Hosanna (Palm) Sunday. Holy Week (Hasho) begins this evening: special prayers and abstinence. In the 2025–26 lectionary this Sunday was also Social Welfare Day.",
 verse:"Hosanna! Blessed is the one who comes in the name of the Lord—the King of Israel!",cite:"John 12:13",
 theo:["Today Jesus enters Jerusalem, and the crowds go out to meet him with palm branches, shouting: “Hosanna! Blessed is the one who comes in the name of the Lord—the King of Israel!” Zechariah had foretold it: “Lo, your king comes to you; triumphant and victorious is he, humble and riding on a donkey.” He comes as King, but not as the kings of this world: not on a war horse, but on a donkey, the animal of peace.","The Pharisees tell Jesus to silence his disciples. He answers: “I tell you, if these were silent, the stones would shout out.” All creation recognises its King. In our Malankara churches the palms are blessed and carried in procession, and we join the crowd of Jerusalem, and, as Revelation shows, the great multitude in heaven “robed in white, with palm branches in their hands”, crying: “Salvation belongs to our God… and to the Lamb!”","But we know where this road leads. The same city that shouts “Hosanna” will soon shout “Crucify him”. The King enters Jerusalem to be enthroned on the Cross. Genesis promised that “the scepter shall not depart from Judah”; the King from Judah reigns from the wood of the Cross. The ark of the covenant was brought into Jerusalem with joy and fear (2 Samuel 6); now the true Ark, God dwelling among us, enters the city.","Hosanna means “Save us, we pray.” It is a cry of praise and a cry for help. As Holy Week begins this evening, let us carry our palms home not as decorations but as a promise: Lord, I welcome you as my King; save me; and give me grace to follow you this week, through the Cross to the Resurrection."],
 conn:[["The humble king.","Zechariah 9:9 is fulfilled to the letter (John 12:15); his kingdom brings peace “from sea to sea” (Zechariah 9:10)."],["Palms in heaven.","Revelation 7:9: the palms of Jerusalem become the palms of the martyrs and saints before the Lamb."],["The Lion of Judah.","Genesis 49:9–10: Judah the lion's whelp; the scepter shall not depart; Revelation 5:5 names Christ “the Lion of the tribe of Judah”."],["Grafted in.","Romans 11:17: we Gentiles have been grafted into the olive tree of Israel; we too shout Hosanna to Israel's King."]],
 altar:["Every Holy Qurbono repeats the cry of Palm Sunday: “Blessed is he who comes in the name of the Lord, Hosanna in the highest.” The One who entered Jerusalem enters our altar and our hearts."],
 outline:[["Opening","The procession: why palms?"],["Point 1 · The humble King","On a donkey, not a war horse: a kingdom of peace."],["Point 2 · Stones would shout","All creation recognises Christ; our praise must not fall silent."],["Point 3 · From Hosanna to Crucify","The fickleness of the crowd, and of our hearts."],["Point 4 · Hosanna: save us","Enter Holy Week with Christ."],["Take-home line","“Hosanna! Blessed is he who comes.”"]],
 live:[["Keep Holy Week","Take part in the services of Pesaha, Good Friday, Holy Saturday and the Resurrection."],["Keep your palm","Place the blessed palm by the cross at home and pray there each evening this week."],["Make peace","Be reconciled with someone before Easter, as the King of peace enters your home."]],
 fathers:[["St Andrew of Crete","“Let us run to accompany him as he hastens towards his passion… Let us spread before his feet not garments or branches, but ourselves” (Sermon 9 on Palm Sunday)."],["St Augustine","The Lord was King of Israel not to exact tribute or command armies, but to rule souls and bring them to the kingdom of heaven; it was no gain to the King of the ages to become King of men, but a sign of his mercy (Tractates on John 51)."]],
 magis:[["Catechism 559–560","Jesus enters Jerusalem as the Messiah, the Son of David, on a donkey; the Church's liturgy opens Holy Week with this feast."],["Catechism 1352","The Sanctus with its Hosanna joins the Church's praise to the angels' song."],["Catechism 571","The Paschal mystery of Christ's Cross and Resurrection stands at the centre of the Good News."]],
 saints:[["Holy Week 2027","Monday 22 to Wednesday 24 March: days of Holy Week. Thursday 25 March: Pesaha (Maundy Thursday); in 2027 this is also the date of the Annunciation, so check how your eparchy keeps it. Friday 26 March: Good Friday. Saturday 27 March: Holy Saturday. Sunday 28 March: Qyomtho, the Resurrection."]],
 prayer:"Lord Jesus, humble King, you entered Jerusalem on a donkey to give your life for us. Hosanna: save us! As we carry our palms, give us faithful hearts that do not change from praise to rejection, and lead us through your Passion to the joy of your Resurrection. Amen."},
 {quick:["Hosanna: the humble King enters Jerusalem on a donkey.","If we are silent, the stones will shout.","Hosanna means “Save us”: enter Holy Week with Christ."],action:"Take part in every service of Holy Week this year.",question:"Will my Hosanna today still be faithful on Friday?",
  special:"Hosanna (Palm) Sunday: blessing of palms and procession. Holy Week begins this evening; remind the faithful about the special prayers and abstinence. (In 2025–26 also Social Welfare Day; check the collection.)",
  illus:["An illustration","In Kerala, children carry the blessed tender palm leaves home and their grandmothers weave them into small crosses for the door. The palm that welcomed the King becomes the sign of his Cross. That is Holy Week in one leaf."],kids:"",diaspora:"",
  family:{read:"Read together: John 12:12–15.",explain:"Jesus rode into Jerusalem on a little donkey. People waved palm branches and shouted “Hosanna!” They welcomed him as their King.",intention:"We pray that our family may keep Holy Week well and welcome Jesus as King.",ask:"Ask: “Which services of Holy Week will we attend together?”"},
  catechism:[["CCC 559–560","Jesus' messianic entry into Jerusalem."],["CCC 1168–1169","Easter, the feast of feasts."]],
  kidsaint:["The children of Jerusalem","When Jesus entered the city, children in the Temple kept shouting “Hosanna to the Son of David!” Jesus said that God had prepared praise from the mouths of children (Matthew 21:15–16). Lesson: your praise matters to Jesus."],
  term:["Hosanna Sunday (ഓശാന)","Hosanna is Hebrew for “Save us, we pray”. On the Sunday before Easter the Church blesses palms and celebrates the Lord's entry into Jerusalem; Holy Week (Hasho) begins in the evening."],
  termMore:["The blessed palms","The palms are kept at home through the year; in the Malankara tradition they may be brought back and used in the fire of the Yaldo night service, so that the same palms that welcomed the King greet his birth."]},
 {homily:["Dear brothers and sisters, today we carry palms like the crowds of Jerusalem. Jesus rides into the holy city, and the people go out to meet him shouting: “Hosanna! Blessed is the one who comes in the name of the Lord, the King of Israel!” The prophet Zechariah had said: your King comes to you, humble, riding on a donkey.","Notice how he comes. Not on a war horse, like a conqueror, but on a donkey, the animal of ordinary people and of peace. He is a King, but his throne will be a cross and his crown will be thorns. When the Pharisees want the crowd silenced, Jesus says: “If these were silent, the stones would shout out.” All creation knows its King.","But the same city that cries “Hosanna” today will cry “Crucify him” on Friday. How quickly hearts change. And our hearts too: we praise him on Sunday and forget him on Monday. Holy Week is the time to ask for faithful hearts, hearts that keep shouting Hosanna even at the foot of the Cross.","Hosanna means “Save us, we pray.” Let us take our palms home not as decorations but as a promise: Lord, you are my King; save me. Come to all the services of this Holy Week. Walk with Jesus from the upper room to Calvary, and on to the empty tomb. Hosanna in the highest! Amen."],
  kids:["Children, today we wave our palms like the children of Jerusalem! Jesus came riding on a little donkey, and everyone shouted: “Hosanna! Hosanna!”","Jesus is a King, but a gentle King of peace. This week we will remember how much he loved us: he gave his life on the cross, and then he rose again!","Take your palm home and put it near the cross. Let's shout together: “Hosanna to Jesus our King!”"]});

put("2027-03-21","ml",{title:"ഓശാന ഞായർ · കർത്താവിന്റെ ജറുസലെം പ്രവേശനം",readTitle:ML.rt,
 readings:[[ML.eg,"ലൂക്കാ 19:28–40","ഇവർ മൗനം ഭജിച്ചാൽ ഈ കല്ലുകൾ ആർത്തുവിളിക്കും"],[ML.ot,"ഉൽപത്തി 49:8–15","ചെങ്കോൽ യൂദായെ വിട്ടുപോകയില്ല"],[ML.ot,"2 സാമുവൽ 6:1–7","പേടകം ജറുസലെമിലേക്ക്"],[ML.ot,"സുഭാഷിതങ്ങൾ 16:13–25","അഹങ്കാരം നാശത്തിന്റെ മുന്നോടി"],[ML.ot,"സഖറിയാ 9:8–17","നിന്റെ രാജാവു വിനയാന്വിതനായി കഴുതപ്പുറത്തു വരുന്നു"],[ML.rv,"വെളിപാട് 7:9–12","കൈകളിൽ കുരുത്തോലയുമായി ഒരു വലിയ ജനക്കൂട്ടം"],[ML.pa,"റോമാ 11:17–24","ഒലിവുമരത്തിൽ ഒട്ടിച്ചുചേർക്കപ്പെട്ടവർ"],[ML.go,"യോഹന്നാൻ 12:12–19","ഹോസാന! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ"]],
 alt:"ഓശാന ഞായർ. ഹാശാആഴ്ച ഇന്നു സന്ധ്യയ്ക്ക് ആരംഭിക്കുന്നു: പ്രത്യേക പ്രാർഥനകളും വർജനവും. 2025–26-ലെ വായനാപുസ്തകത്തിൽ ഈ ഞായർ സാമൂഹികക്ഷേമദിനവുമായിരുന്നു.",
 verse:"ഹോസാന! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവനും ഇസ്രായേലിന്റെ രാജാവുമായവൻ വാഴ്ത്തപ്പെട്ടവൻ.",cite:"യോഹന്നാൻ 12:13",
 theo:["ഇന്ന് യേശു ജറുസലെമിൽ പ്രവേശിക്കുന്നു; ജനക്കൂട്ടം “ഈന്തപ്പനയുടെ കൈകൾ എടുത്തുകൊണ്ട്” അവിടുത്തെ എതിരേൽക്കാൻ പുറപ്പെട്ടു വിളിച്ചുപറയുന്നു: “ഹോസാന! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവനും ഇസ്രായേലിന്റെ രാജാവുമായവൻ വാഴ്ത്തപ്പെട്ടവൻ.” സഖറിയാ അതു മുൻകൂട്ടി പറഞ്ഞിരുന്നു: “ഇതാ, നിന്റെ രാജാവ് നിന്റെ അടുക്കലേക്കു വരുന്നു. അവൻ പ്രതാപവാനും ജയശാലിയുമാണ്. അവൻ വിനയാന്വിതനായി, കഴുതപ്പുറത്ത്, കഴുതക്കുട്ടിയുടെ പുറത്ത്, കയറിവരുന്നു.” അവിടുന്നു രാജാവായി വരുന്നു; പക്ഷേ ഈ ലോകത്തിലെ രാജാക്കന്മാരെപ്പോലെയല്ല: യുദ്ധക്കുതിരപ്പുറത്തല്ല, സമാധാനത്തിന്റെ മൃഗമായ കഴുതപ്പുറത്ത്.","ശിഷ്യന്മാരെ നിശ്ശബ്ദരാക്കാൻ ഫരിസേയർ യേശുവിനോടു പറയുന്നു. അവിടുന്നു മറുപടി പറയുന്നു: “ഇവർ മൗനം ഭജിച്ചാൽ ഈ കല്ലുകൾ ആർത്തുവിളിക്കുമെന്ന് ഞാൻ നിങ്ങളോടു പറയുന്നു.” സൃഷ്ടി മുഴുവൻ തന്റെ രാജാവിനെ തിരിച്ചറിയുന്നു. നമ്മുടെ മലങ്കര ദേവാലയങ്ങളിൽ കുരുത്തോല ആശീർവദിച്ചു പ്രദക്ഷിണമായി വഹിക്കുന്നു; ജറുസലെമിലെ ജനക്കൂട്ടത്തോടും, വെളിപാടു കാണിക്കുന്നതുപോലെ, “വെള്ളയങ്കിയണിഞ്ഞു കൈകളിൽ കുരുത്തോലയുമായി” സ്വർഗത്തിൽ നിൽക്കുന്ന വലിയ ജനക്കൂട്ടത്തോടും നാം ചേരുന്നു: “സിംഹാസനാരൂഢനായ നമ്മുടെ ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും പക്കലാണു രക്ഷ.”","പക്ഷേ ഈ വഴി എവിടേക്കാണു നയിക്കുന്നതെന്നു നമുക്കറിയാം. “ഹോസാന” എന്ന് ആർത്തുവിളിക്കുന്ന അതേ നഗരം താമസിയാതെ “അവനെ ക്രൂശിക്കുക” എന്ന് ആർത്തുവിളിക്കും. കുരിശിൽ സിംഹാസനസ്ഥനാകാനാണു രാജാവു ജറുസലെമിൽ പ്രവേശിക്കുന്നത്. “ചെങ്കോൽ യൂദായെ വിട്ടു പോകയില്ല” എന്ന് ഉൽപത്തി വാഗ്ദാനം ചെയ്തു; യൂദായിൽനിന്നുള്ള രാജാവു കുരിശുമരത്തിൽനിന്നു ഭരിക്കുന്നു. ഉടമ്പടിയുടെ പേടകം സന്തോഷത്തോടെയും ഭയത്തോടെയും ജറുസലെമിലേക്കു കൊണ്ടുവരപ്പെട്ടു (2 സാമു 6); ഇപ്പോൾ നമ്മുടെ ഇടയിൽ വസിക്കുന്ന ദൈവമായ യഥാർഥ പേടകം നഗരത്തിൽ പ്രവേശിക്കുന്നു.","“ഹോസാന” എന്നതിന്റെ അർഥം “ഞങ്ങളെ രക്ഷിക്കണമേ” എന്നാണ്. അതു സ്തുതിയുടെയും സഹായത്തിനായുള്ള നിലവിളിയുടെയും ശബ്ദമാണ്. ഇന്നു സന്ധ്യയ്ക്കു ഹാശാആഴ്ച ആരംഭിക്കുമ്പോൾ, അലങ്കാരമായല്ല, ഒരു വാഗ്ദാനമായി നമ്മുടെ കുരുത്തോല വീട്ടിലേക്കു കൊണ്ടുപോകാം: കർത്താവേ, എന്റെ രാജാവായി ഞാൻ അങ്ങയെ സ്വാഗതം ചെയ്യുന്നു; എന്നെ രക്ഷിക്കണമേ; കുരിശിലൂടെ ഉയിർപ്പിലേക്ക് ഈ ആഴ്ച അങ്ങയെ അനുഗമിക്കാൻ കൃപ തരണമേ."],
 conn:[["വിനീതനായ രാജാവ്.","സഖറിയാ 9:9 അക്ഷരംപ്രതി നിറവേറുന്നു (യോഹ 12:15); അവിടുത്തെ രാജ്യം “സമുദ്രംമുതൽ സമുദ്രംവരെ” സമാധാനം കൊണ്ടുവരുന്നു (സഖ 9:10)."],["സ്വർഗത്തിലെ കുരുത്തോലകൾ.","വെളിപാട് 7:9: ജറുസലെമിലെ കുരുത്തോലകൾ കുഞ്ഞാടിന്റെ മുമ്പിലുള്ള രക്തസാക്ഷികളുടെയും വിശുദ്ധരുടെയും കുരുത്തോലകളാകുന്നു."],["യൂദായുടെ സിംഹം.","ഉൽപത്തി 49:9–10: സിംഹക്കുട്ടിയായ യൂദാ; ചെങ്കോൽ വിട്ടുപോകയില്ല; വെളിപാട് 5:5 ക്രിസ്തുവിനെ “യൂദാഗോത്രത്തിന്റെ സിംഹം” എന്നു വിളിക്കുന്നു."],["ഒട്ടിച്ചുചേർക്കപ്പെട്ടവർ.","റോമാ 11:17: വിജാതീയരായ നാം ഇസ്രായേലിന്റെ ഒലിവുമരത്തിൽ ഒട്ടിച്ചുചേർക്കപ്പെട്ടിരിക്കുന്നു; ഇസ്രായേലിന്റെ രാജാവിനു നാമും ഹോസാന പാടുന്നു."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയും ഓശാന ഞായറിന്റെ ആർപ്പുവിളി ആവർത്തിക്കുന്നു: “കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ; അത്യുന്നതങ്ങളിൽ ഓശാന.” ജറുസലെമിൽ പ്രവേശിച്ചവൻ നമ്മുടെ ബലിപീഠത്തിലേക്കും ഹൃദയങ്ങളിലേക്കും പ്രവേശിക്കുന്നു."],
 outline:[["ആരംഭം","പ്രദക്ഷിണം: എന്തിനു കുരുത്തോല?"],["ഒന്നാം ആശയം · വിനീതനായ രാജാവ്","യുദ്ധക്കുതിരപ്പുറത്തല്ല, കഴുതപ്പുറത്ത്: സമാധാനത്തിന്റെ രാജ്യം."],["രണ്ടാം ആശയം · കല്ലുകൾ ആർത്തുവിളിക്കും","സൃഷ്ടി മുഴുവൻ ക്രിസ്തുവിനെ തിരിച്ചറിയുന്നു; നമ്മുടെ സ്തുതി നിലയ്ക്കരുത്."],["മൂന്നാം ആശയം · ഹോസാനയിൽനിന്ന് ക്രൂശിക്കുകയിലേക്ക്","ജനക്കൂട്ടത്തിന്റെയും നമ്മുടെ ഹൃദയങ്ങളുടെയും ചഞ്ചലത."],["നാലാം ആശയം · ഹോസാന: ഞങ്ങളെ രക്ഷിക്കണമേ","ക്രിസ്തുവിനോടൊപ്പം ഹാശാആഴ്ചയിൽ പ്രവേശിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഹോസാന! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ.”"]],
 live:[["ഹാശാആഴ്ച ആചരിക്കുക","പെസഹാ, ദുഃഖവെള്ളി, ദുഃഖശനി, ഉയിർപ്പ് എന്നീ ശുശ്രൂഷകളിൽ പങ്കെടുക്കുക."],["നിന്റെ കുരുത്തോല സൂക്ഷിക്കുക","ആശീർവദിച്ച കുരുത്തോല വീട്ടിലെ കുരിശിനരികെ വച്ച് ഈ ആഴ്ച എല്ലാ സന്ധ്യയിലും അവിടെ പ്രാർഥിക്കുക."],["സമാധാനം സ്ഥാപിക്കുക","സമാധാനത്തിന്റെ രാജാവു നിന്റെ ഭവനത്തിൽ പ്രവേശിക്കുമ്പോൾ, ഈസ്റ്ററിനു മുമ്പ് ഒരാളുമായി രമ്യതപ്പെടുക."]],
 fathers:[["ക്രീറ്റിലെ വിശുദ്ധ ആൻഡ്രൂ","തന്റെ പീഡാനുഭവത്തിലേക്കു തിടുക്കപ്പെടുന്ന അവിടുത്തെ അനുഗമിക്കാൻ നമുക്ക് ഓടാം… അവിടുത്തെ പാദങ്ങൾക്കു മുമ്പിൽ വസ്ത്രങ്ങളോ കൊമ്പുകളോ അല്ല, നമ്മെത്തന്നെ വിരിക്കാം (ഓശാന ഞായറിനെപ്പറ്റിയുള്ള പ്രസംഗം 9)."],["വിശുദ്ധ അഗസ്റ്റിൻ","കപ്പം പിരിക്കാനോ സൈന്യങ്ങളെ നയിക്കാനോ അല്ല, ആത്മാക്കളെ ഭരിച്ച് അവരെ സ്വർഗരാജ്യത്തിലേക്കു കൊണ്ടുവരാനാണു കർത്താവ് ഇസ്രായേലിന്റെ രാജാവായത്; യുഗങ്ങളുടെ രാജാവു മനുഷ്യരുടെ രാജാവായത് അവിടുത്തേക്കു നേട്ടമല്ല, അവിടുത്തെ കരുണയുടെ അടയാളമാണ് (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രബന്ധങ്ങൾ 51)."]],
 magis:[["മതബോധനഗ്രന്ഥം 559–560","ദാവീദിന്റെ പുത്രനായ മിശിഹായായി യേശു കഴുതപ്പുറത്തു ജറുസലെമിൽ പ്രവേശിക്കുന്നു; ഈ തിരുനാളോടെ സഭയുടെ ആരാധനക്രമം ഹാശാആഴ്ച തുറക്കുന്നു."],["മതബോധനഗ്രന്ഥം 1352","ഓശാനയോടുകൂടിയ “പരിശുദ്ധൻ” സഭയുടെ സ്തുതിയെ മാലാഖമാരുടെ ഗീതത്തോടു ചേർക്കുന്നു."],["മതബോധനഗ്രന്ഥം 571","ക്രിസ്തുവിന്റെ കുരിശിന്റെയും ഉയിർപ്പിന്റെയും പെസഹാരഹസ്യമാണു സദ്വാർത്തയുടെ കേന്ദ്രം."]],
 saints:[["ഹാശാആഴ്ച 2027","മാർച്ച് 22 തിങ്കൾമുതൽ 24 ബുധൻവരെ: ഹാശാആഴ്ചയിലെ ദിവസങ്ങൾ. മാർച്ച് 25 വ്യാഴം: പെസഹാ; 2027-ൽ ഇതു മംഗളവാർത്തത്തിരുനാളിന്റെ തീയതിയുമാണ്; നിങ്ങളുടെ രൂപത അത് എങ്ങനെ ആചരിക്കുന്നുവെന്നു നോക്കുക. മാർച്ച് 26: ദുഃഖവെള്ളി. മാർച്ച് 27: ദുഃഖശനി. മാർച്ച് 28: ക്യംതോ, ഉയിർപ്പ്."]],
 prayer:"വിനീതനായ രാജാവായ കർത്താവായ യേശുവേ, ഞങ്ങൾക്കുവേണ്ടി ജീവൻ നൽകാൻ അങ്ങു കഴുതപ്പുറത്തു ജറുസലെമിൽ പ്രവേശിച്ചു. ഓശാന: ഞങ്ങളെ രക്ഷിക്കണമേ! കുരുത്തോല വഹിക്കുമ്പോൾ, സ്തുതിയിൽനിന്നു തിരസ്കാരത്തിലേക്കു മാറാത്ത വിശ്വസ്തഹൃദയങ്ങൾ ഞങ്ങൾക്കു നൽകണമേ; അങ്ങയുടെ പീഡാസഹനത്തിലൂടെ അങ്ങയുടെ ഉയിർപ്പിന്റെ സന്തോഷത്തിലേക്കു ഞങ്ങളെ നയിക്കണമേ. ആമേൻ."},
 {quick:["ഹോസാന: വിനീതനായ രാജാവു കഴുതപ്പുറത്തു ജറുസലെമിൽ പ്രവേശിക്കുന്നു.","നാം മൗനം ഭജിച്ചാൽ കല്ലുകൾ ആർത്തുവിളിക്കും.","“ഹോസാന” എന്നാൽ “ഞങ്ങളെ രക്ഷിക്കണമേ”: ക്രിസ്തുവിനോടൊപ്പം ഹാശാആഴ്ചയിൽ പ്രവേശിക്കുക."],action:"ഈ വർഷം ഹാശാആഴ്ചയിലെ എല്ലാ ശുശ്രൂഷകളിലും പങ്കെടുക്കുക.",question:"ഇന്നത്തെ എന്റെ ഹോസാന വെള്ളിയാഴ്ചയും വിശ്വസ്തമായിരിക്കുമോ?",
  special:"ഓശാന ഞായർ: കുരുത്തോല ആശീർവാദവും പ്രദക്ഷിണവും. ഹാശാആഴ്ച ഇന്നു സന്ധ്യയ്ക്ക് ആരംഭിക്കുന്നു; പ്രത്യേക പ്രാർഥനകളെയും വർജനത്തെയുംപറ്റി ഓർമിപ്പിക്കുക. (2025–26-ൽ സാമൂഹികക്ഷേമദിനവുമായിരുന്നു; സ്തോത്രക്കാഴ്ച പരിശോധിക്കുക.)",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിൽ കുഞ്ഞുങ്ങൾ ആശീർവദിച്ച കുരുത്തോല വീട്ടിലേക്കു കൊണ്ടുപോകുന്നു; വല്യമ്മച്ചിമാർ അതുകൊണ്ടു വാതിലിനായി ചെറിയ കുരിശുകൾ മെടയുന്നു. രാജാവിനെ സ്വാഗതം ചെയ്ത കുരുത്തോല അവിടുത്തെ കുരിശിന്റെ അടയാളമാകുന്നു. ഒരു ഓലയിൽ ഹാശാആഴ്ച മുഴുവൻ."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: യോഹന്നാൻ 12:12–15.",explain:"യേശു ഒരു കഴുതക്കുട്ടിയുടെ പുറത്തു ജറുസലെമിലേക്കു വന്നു. ആളുകൾ കുരുത്തോല വീശി “ഓശാന!” എന്ന് ആർത്തുവിളിച്ചു. അവർ അവിടുത്തെ തങ്ങളുടെ രാജാവായി സ്വാഗതം ചെയ്തു.",intention:"നമ്മുടെ കുടുംബം ഹാശാആഴ്ച നന്നായി ആചരിക്കാനും യേശുവിനെ രാജാവായി സ്വാഗതം ചെയ്യാനും നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഹാശാആഴ്ചയിലെ ഏതെല്ലാം ശുശ്രൂഷകളിൽ നാം ഒന്നിച്ചു പങ്കെടുക്കും?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 559–560","യേശുവിന്റെ മിശിഹാസഹജമായ ജറുസലെം പ്രവേശനം."],["മതബോധനഗ്രന്ഥം 1168–1169","തിരുനാളുകളുടെ തിരുനാളായ ഉയിർപ്പ്."]],
  kidsaint:["ജറുസലെമിലെ കുഞ്ഞുങ്ങൾ","യേശു നഗരത്തിൽ പ്രവേശിച്ചപ്പോൾ ദേവാലയത്തിലെ കുഞ്ഞുങ്ങൾ “ദാവീദിന്റെ പുത്രനു ഹോസാന!” എന്ന് ആർത്തുവിളിച്ചുകൊണ്ടിരുന്നു. ശിശുക്കളുടെ അധരങ്ങളിൽനിന്നു ദൈവം സ്തുതി ഒരുക്കിയിരിക്കുന്നുവെന്ന് യേശു പറഞ്ഞു (മത്താ 21:15–16). പാഠം: നിന്റെ സ്തുതി യേശുവിനു വിലപ്പെട്ടതാണ്."],
  term:["ഓശാന ഞായർ","“ഹോസാന” എന്ന ഹീബ്രുപദത്തിന്റെ അർഥം “ഞങ്ങളെ രക്ഷിക്കണമേ” എന്നാണ്. ഉയിർപ്പിനു മുമ്പുള്ള ഞായറാഴ്ച സഭ കുരുത്തോല ആശീർവദിച്ചു കർത്താവിന്റെ ജറുസലെം പ്രവേശനം ആഘോഷിക്കുന്നു; സന്ധ്യയ്ക്കു ഹാശാആഴ്ച ആരംഭിക്കുന്നു."],
  termMore:["ആശീർവദിച്ച കുരുത്തോല","വർഷം മുഴുവൻ കുരുത്തോല വീട്ടിൽ സൂക്ഷിക്കുന്നു; മലങ്കര പാരമ്പര്യത്തിൽ അതു തിരികെ കൊണ്ടുവന്നു യൽദോ രാത്രിശുശ്രൂഷയിലെ അഗ്നിയിൽ ഉപയോഗിക്കാം; രാജാവിനെ സ്വാഗതം ചെയ്ത അതേ ഓലകൾ അവിടുത്തെ ജനനത്തെ എതിരേൽക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ജറുസലെമിലെ ജനക്കൂട്ടത്തെപ്പോലെ ഇന്നു നാം കുരുത്തോല വഹിക്കുന്നു. യേശു വിശുദ്ധനഗരത്തിലേക്കു വരുന്നു; ജനം അവിടുത്തെ എതിരേൽക്കാൻ പുറപ്പെട്ട് ആർത്തുവിളിക്കുന്നു: “ഹോസാന! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവനും ഇസ്രായേലിന്റെ രാജാവുമായവൻ വാഴ്ത്തപ്പെട്ടവൻ.” സഖറിയാ പ്രവാചകൻ പറഞ്ഞിരുന്നു: നിന്റെ രാജാവു വിനയാന്വിതനായി കഴുതപ്പുറത്തു നിന്റെ അടുക്കലേക്കു വരുന്നു.","അവിടുന്ന് എങ്ങനെ വരുന്നുവെന്നു ശ്രദ്ധിക്കുക. ഒരു ജേതാവിനെപ്പോലെ യുദ്ധക്കുതിരപ്പുറത്തല്ല; സാധാരണക്കാരുടെയും സമാധാനത്തിന്റെയും മൃഗമായ കഴുതപ്പുറത്ത്. അവിടുന്നു രാജാവാണ്; പക്ഷേ അവിടുത്തെ സിംഹാസനം കുരിശും കിരീടം മുള്ളുമായിരിക്കും. ജനക്കൂട്ടത്തെ നിശ്ശബ്ദരാക്കാൻ ഫരിസേയർ ആഗ്രഹിക്കുമ്പോൾ യേശു പറയുന്നു: “ഇവർ മൗനം ഭജിച്ചാൽ ഈ കല്ലുകൾ ആർത്തുവിളിക്കും.” സൃഷ്ടി മുഴുവൻ അതിന്റെ രാജാവിനെ അറിയുന്നു.","പക്ഷേ ഇന്ന് “ഹോസാന” എന്നു വിളിക്കുന്ന അതേ നഗരം വെള്ളിയാഴ്ച “അവനെ ക്രൂശിക്കുക” എന്നു വിളിക്കും. ഹൃദയങ്ങൾ എത്ര വേഗം മാറുന്നു! നമ്മുടെ ഹൃദയങ്ങളും: ഞായറാഴ്ച നാം അവിടുത്തെ സ്തുതിക്കുന്നു; തിങ്കളാഴ്ച മറക്കുന്നു. വിശ്വസ്തഹൃദയങ്ങൾക്കായി, കുരിശിന്റെ ചുവട്ടിലും ഹോസാന പാടുന്ന ഹൃദയങ്ങൾക്കായി, ചോദിക്കാനുള്ള സമയമാണു ഹാശാആഴ്ച.","“ഹോസാന” എന്നതിന്റെ അർഥം “ഞങ്ങളെ രക്ഷിക്കണമേ” എന്നാണ്. നമ്മുടെ കുരുത്തോല അലങ്കാരമായല്ല, ഒരു വാഗ്ദാനമായി വീട്ടിലേക്കു കൊണ്ടുപോകാം: കർത്താവേ, അങ്ങാണ് എന്റെ രാജാവ്; എന്നെ രക്ഷിക്കണമേ. ഈ ഹാശാആഴ്ചയിലെ എല്ലാ ശുശ്രൂഷകളിലും പങ്കെടുക്കുക. മാളികമുറിയിൽനിന്നു കാൽവരിയിലേക്കും ശൂന്യമായ കല്ലറയിലേക്കും യേശുവിനോടൊപ്പം നടക്കുക. അത്യുന്നതങ്ങളിൽ ഓശാന! ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ജറുസലെമിലെ കുഞ്ഞുങ്ങളെപ്പോലെ ഇന്നു നാം കുരുത്തോല വീശുന്നു! യേശു ഒരു കൊച്ചുകഴുതയുടെ പുറത്തു വന്നു; എല്ലാവരും ആർത്തുവിളിച്ചു: “ഓശാന! ഓശാന!”","യേശു ഒരു രാജാവാണ്; പക്ഷേ സമാധാനത്തിന്റെ സൗമ്യനായ രാജാവ്. അവിടുന്നു നമ്മെ എത്രമാത്രം സ്നേഹിച്ചുവെന്ന് ഈ ആഴ്ച നാം ഓർക്കും: അവിടുന്നു കുരിശിൽ ജീവൻ നൽകി; പിന്നെ ഉയിർത്തെഴുന്നേറ്റു!","നിന്റെ കുരുത്തോല വീട്ടിൽ കൊണ്ടുപോയി കുരിശിനരികെ വയ്ക്കുക. നമുക്ക് ഒന്നിച്ച് ആർത്തുവിളിക്കാം: “നമ്മുടെ രാജാവായ യേശുവിന് ഓശാന!”"]});
