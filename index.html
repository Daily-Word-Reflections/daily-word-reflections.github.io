:"Mt. Stefano, Mfiadini wa Kwanza","t":"Shemasi na mfiadini wa kwanza"},"img":{"src":"img/saints/stephenmartyr.jpg","cap":{"en":"Carlo Crivelli, St Stephen, tempera on panel, 1476, National Gallery, London. The stones of his martyrdom rest on his head and shoulder. Public domain, via Wikimedia Commons.","ml":"കാർലോ ക്രിവെല്ലി വരച്ച “വിശുദ്ധ സ്തേഫാനോസ്” (മരപ്പലകയിൽ ടെമ്പെറ, 1476). ലണ്ടനിലെ നാഷണൽ ഗാലറിയിൽ. അദ്ദേഹത്തിന്റെ രക്തസാക്ഷിത്വത്തിന്റെ കല്ലുകൾ തലയിലും തോളിലും. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"johnapostle","md":"12-27","rites":["lat","smc"],"en":{"n":"St John, Apostle and Evangelist","t":"The beloved disciple"},"ml":{"n":"ശ്ലീഹായും സുവിശേഷകനുമായ വിശുദ്ധ യോഹന്നാൻ","t":"കർത്താവു സ്നേഹിച്ച ശിഷ്യൻ"},"ta":{"n":"திருத்தூதரும் நற்செய்தியாளருமான புனித யோவான்","t":"இயேசு அன்புசெய்த சீடர்"},"hi":{"n":"प्रेरित और सुसमाचार-लेखक संत योहन","t":"प्रिय शिष्य"},"de":{"n":"Hl. Johannes, Apostel und Evangelist","t":"Der Lieblingsjünger"},"it":{"n":"San Giovanni apostolo ed evangelista","t":"Il discepolo amato"},"es":{"n":"San Juan, apóstol y evangelista","t":"El discípulo amado"},"pt":{"n":"São João, Apóstolo e Evangelista","t":"O discípulo amado"},"te":{"n":"అపొస్తలుడు, సువార్తికుడు అయిన పునీత యోహాను","t":"యేసు ప్రేమించిన శిష్యుడు"},"kn":{"n":"ಪ್ರೇಷಿತರೂ ಶುಭಸಂದೇಶಕಾರರೂ ಆದ ಸಂತ ಯೊವಾನ್ನ","t":"ಯೇಸು ಪ್ರೀತಿಸಿದ ಶಿಷ್ಯ"},"fr":{"n":"Saint Jean, apôtre et évangéliste","t":"Le disciple bien-aimé"},"tl":{"n":"San Juan, apostol at ebanghelista","t":"Ang minamahal na alagad"},"sw":{"n":"Mt. Yohane, Mtume na Mwinjili","t":"Mwanafunzi mpendwa"},"img":{"src":"img/saints/johnapostle.jpg","cap":{"en":"Domenichino, St John the Evangelist, oil on canvas, 1624–1629. The evangelist looks up in inspiration, with his eagle beside him. Public domain, via Wikimedia Commons.","ml":"ദൊമെനിക്കീനോ വരച്ച “സുവിശേഷകനായ വിശുദ്ധ യോഹന്നാൻ” (എണ്ണച്ചായാചിത്രം, 1624–1629). പ്രചോദിതനായി മുകളിലേക്കു നോക്കുന്ന സുവിശേഷകൻ; അരികിൽ അദ്ദേഹത്തിന്റെ അടയാളമായ കഴുകൻ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"holyinnocents","md":"12-28","rites":["lat","smc"],"en":{"n":"The Holy Innocents","t":"Martyrs of Bethlehem"},"ml":{"n":"വിശുദ്ധ പൈതങ്ങൾ","t":"ബേത്‌ലെഹെമിലെ രക്തസാക്ഷികൾ"},"ta":{"n":"மாசற்ற குழந்தைகள்","t":"பெத்லகேமின் மறைசாட்சிகள்"},"hi":{"n":"पवित्र निर्दोष बालक","t":"बेथलेहेम के शहीद"},"de":{"n":"Die Unschuldigen Kinder","t":"Märtyrer von Betlehem"},"it":{"n":"Santi Innocenti","t":"Martiri di Betlemme"},"es":{"n":"Los Santos Inocentes","t":"Mártires de Belén"},"pt":{"n":"Os Santos Inocentes","t":"Mártires de Belém"},"te":{"n":"పవిత్ర శిశువులు","t":"బేత్లెహేము హతసాక్షులు"},"kn":{"n":"ಪವಿತ್ರ ಶಿಶುಗಳು","t":"ಬೆತ್ಲೆಹೇಮಿನ ಹುತಾತ್ಮರು"},"fr":{"n":"Les saints Innocents","t":"Martyrs de Bethléem"},"tl":{"n":"Mga Banal na Sanggol na Walang Malay","t":"Mga martir ng Betlehem"},"sw":{"n":"Watoto Watakatifu Wasio na Hatia","t":"Wafiadini wa Bethlehemu"},"img":{"src":"img/saints/holyinnocents.jpg","cap":{"en":"William Holman Hunt, The Triumph of the Innocents, oil on canvas, 1870–1903, Harvard Art Museums (Fogg Museum), Cambridge, Massachusetts. On the flight into Egypt, the Holy Family is accompanied by the spirits of the slain children of Bethlehem. Public domain, via Wikimedia Commons.","ml":"വില്യം ഹോൾമൻ ഹണ്ട് വരച്ച “ശിശുക്കളുടെ വിജയം” (എണ്ണച്ചായാചിത്രം, 1870–1903). അമേരിക്കയിലെ ഹാർവാർഡ് ആർട്ട് മ്യൂസിയങ്ങളിൽ (ഫോഗ് മ്യൂസിയം). ഈജിപ്തിലേക്കുള്ള പലായനത്തിൽ, കൊല്ലപ്പെട്ട ബേത്‌ലെഹെമിലെ ശിശുക്കളുടെ ആത്മാക്കൾ തിരുക്കുടുംബത്തെ അനുഗമിക്കുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"sylvester","md":"12-31","rites":["lat"],"en":{"n":"St Sylvester I","t":"Pope"},"ml":{"n":"വിശുദ്ധ സിൽവെസ്റ്റർ ഒന്നാമൻ","t":"മാർപാപ്പ"},"ta":{"n":"புனித முதலாம் சில்வெஸ்டர்","t":"திருத்தந்தை"},"hi":{"n":"संत सिल्वेस्टर प्रथम","t":"पोप"},"de":{"n":"Hl. Silvester I.","t":"Papst"},"it":{"n":"San Silvestro I","t":"Papa"},"es":{"n":"San Silvestre I","t":"Papa"},"pt":{"n":"São Silvestre I","t":"Papa"},"te":{"n":"పోపుగారైన పునీత మొదటి సిల్వెస్టర్","t":"పోపుగారు"},"kn":{"n":"ಪೋಪ್ ಸಂತ ಮೊದಲನೇ ಸಿಲ್ವೆಸ್ಟರ್","t":"ಜಗದ್ಗುರು"},"fr":{"n":"Saint Sylvestre Ier","t":"Pape"},"tl":{"n":"San Silvestre I","t":"Papa"},"sw":{"n":"Mt. Silvesta I","t":"Papa"},"img":{"src":"img/saints/sylvester.jpg","cap":{"en":"Pope St Sylvester and the emperor Constantine, fresco, 1247, chapel of San Silvestro, Santi Quattro Coronati, Rome. Public domain, via Wikimedia Commons.","ml":"വിശുദ്ധ സിൽവെസ്റ്റർ മാർപാപ്പയും കോൺസ്റ്റന്റൈൻ ചക്രവർത്തിയും: റോമിലെ സാന്തി ക്വാത്രോ കൊറൊണാത്തി ദേവാലയത്തിന്റെ സാൻ സിൽവെസ്ത്രോ ചാപ്പലിലെ ചുവർചിത്രം (1247). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"johndamascene","md":"12-04","rites":["smk"],"en":{"n":"St John of Damascus","t":"Monk, theologian and hymn writer, Doctor of the Church"},"ml":{"n":"ദമാസ്കസിലെ വിശുദ്ധ യോഹന്നാൻ","t":"സന്യാസി, ദൈവശാസ്ത്രജ്ഞൻ, ഗീതരചയിതാവ്, സഭയുടെ വേദപാരംഗതൻ"},"ta":{"n":"தமஸ்குவின் புனித யோவான்","t":"துறவி, இறையியலாளர், பாடலாசிரியர், திருச்சபையின் மறைவல்லுநர்"},"hi":{"n":"दमिश्क के संत योहन","t":"मठवासी, ईशशास्त्री और भजनकार, कलीसिया के धर्माचार्य"},"img":{"src":"img/saints/johndamascene.jpg","cap":{"en":"St John of Damascus, fresco, 14th–15th century, Protaton church, Karyes, Mount Athos, Greece. Public domain, via Wikimedia Commons.","ml":"ദമാസ്കസിലെ വിശുദ്ധ യോഹന്നാൻ: ഗ്രീസിലെ അത്തോസ് മലയിൽ കരിയെസിലുള്ള പ്രൊട്ടാറ്റോൺ ദേവാലയത്തിലെ ചുവർചിത്രം (14–15 നൂറ്റാണ്ടുകൾ). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"marsaba","md":"12-05","rites":["smk"],"en":{"n":"Mar Saba (St Sabbas the Sanctified)","t":"Monk and founder of monasteries in the Judean desert"},"ml":{"n":"മാർ സാബാ (വിശുദ്ധീകരിക്കപ്പെട്ട വിശുദ്ധ സാബാസ്)","t":"യൂദയാ മരുഭൂമിയിലെ സന്യാസിയും ആശ്രമസ്ഥാപകനും"},"ta":{"n":"மார் சாபா (புனிதப்படுத்தப்பட்ட புனித சாபாஸ்)","t":"யூதேயாப் பாலைநிலத்தில் துறவு மடங்களை நிறுவிய துறவி"},"hi":{"n":"मार साबा (पवित्रीकृत संत साबास)","t":"मठवासी और यहूदिया के मरुस्थल में मठों के संस्थापक"},"img":{"src":"img/saints/marsaba.jpg","cap":{"en":"St Sabbas the Sanctified, icon with saints in the margins; old icon, possibly from the monastery of Mar Saba in the Judean desert. Public domain, via Wikimedia Commons.","ml":"വിശുദ്ധീകരിക്കപ്പെട്ട വിശുദ്ധ സാബാസ് (മാർ സാബാ): ചുറ്റും വിശുദ്ധരുടെ ചിത്രങ്ങളുള്ള പഴയ ഐക്കൺ; യൂദയാ മരുഭൂമിയിലെ മാർ സാബാ ആശ്രമത്തിൽനിന്നുള്ളതാകാം. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"behnamsarah","md":"12-10","rites":["smk"],"en":{"n":"Mar Behnam, his sister Sarah and the Forty Martyrs","t":"Martyrs honoured in the Syriac tradition"},"ml":{"n":"മാർ ബഹനാമും സഹോദരി സാറായും നാല്പതു രക്തസാക്ഷികളും","t":"സുറിയാനി പാരമ്പര്യത്തിൽ ആദരിക്കപ്പെടുന്ന രക്തസാക്ഷികൾ"},"ta":{"n":"மார் பெஹ்னாம், அவர் சகோதரி சாரா, நாற்பது மறைசாட்சிகள்","t":"சிரிய மரபில் போற்றப்படும் மறைசாட்சிகள்"},"hi":{"n":"मार बेहनाम, उनकी बहन सारा और चालीस शहीद","t":"सिरियाई परंपरा में सम्मानित शहीद"},"img":{"src":"img/saints/behnamsarah.jpg","cap":{"en":"Mar Behnam on horseback, with his sister Sarah and the forty martyrs, icon, Coptic Museum, Cairo, Egypt. Public domain, via Wikimedia Commons.","ml":"മാർ ബഹനാം കുതിരപ്പുറത്ത്, സഹോദരി സാറായും നാല്പതു രക്തസാക്ഷികളുമൊത്ത്: ഈജിപ്തിലെ കയ്റോയിലുള്ള കോപ്റ്റിക് മ്യൂസിയത്തിലെ ഐക്കൺ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"rabbula","md":"12-17","rites":["smk"],"en":{"n":"Mar Rabbula of Edessa","t":"Bishop, reformer, friend of the poor"},"ml":{"n":"എദേസ്സായിലെ മാർ റബൂല","t":"മെത്രാൻ, നവീകർത്താവ്, ദരിദ്രരുടെ സ്നേഹിതൻ"},"ta":{"n":"எதேசாவின் மார் ரப்புலா","t":"ஆயர், சீர்திருத்தவாதி, ஏழைகளின் நண்பர்"},"hi":{"n":"एदेस्सा के मार रब्बूला","t":"धर्माध्यक्ष, सुधारक, गरीबों के मित्र"}},{"id":"davidking","md":"12-28","rites":["smk"],"en":{"n":"David, King and Prophet","t":"Shepherd of Bethlehem, ancestor of the Messiah"},"ml":{"n":"ദാവീദ്, രാജാവും പ്രവാചകനും","t":"ബേത്‌ലെഹെമിലെ ഇടയൻ, മിശിഹായുടെ പൂർവികൻ"},"ta":{"n":"அரசரும் இறைவாக்கினருமான தாவீது","t":"பெத்லகேமின் மேய்ப்பர், மெசியாவின் மூதாதை"},"hi":{"n":"राजा और नबी दाऊद","t":"बेथलेहेम के चरवाहे, मसीह के पूर्वज"},"img":{"src":"img/saints/davidking.jpg","cap":{"en":"Gerard van Honthorst, King David Playing the Harp, oil on canvas, 1622, Centraal Museum, Utrecht, Netherlands. Public domain, via Wikimedia Commons.","ml":"ജെറാർഡ് വാൻ ഹോന്തോർസ്റ്റ് വരച്ച “കിന്നരം വായിക്കുന്ന ദാവീദ് രാജാവ്” (എണ്ണച്ചായാചിത്രം, 1622). നെതർലൻഡ്സിലെ ഉട്രെക്റ്റിലുള്ള സെൻട്രൽ മ്യൂസിയത്തിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"basilgregory","md":"01-02","rites":["lat","smk"],"en":{"n":"Sts Basil the Great and Gregory Nazianzen","t":"Bishops and Doctors of the Church"},"ml":{"n":"വിശുദ്ധ ബേസിലും വിശുദ്ധ ഗ്രിഗറി നസിയാൻസനും","t":"മെത്രാന്മാർ, സഭയുടെ വേദപാരംഗതർ (മാർ ബസേലിയോസ്, മാർ ഗ്രിഗോറിയോസ്)"},"ta":{"n":"புனித பெரிய பசிலியார், நசியான்சின் புனித கிரகோரியார்","t":"ஆயர்கள், திருச்சபையின் மறைவல்லுநர்கள்"},"hi":{"n":"संत बसील महान और संत ग्रेगरी नाज़ियानज़ेन","t":"धर्माध्यक्ष और कलीसिया के धर्माचार्य"},"de":{"n":"Hl. Basilius der Große und hl. Gregor von Nazianz","t":"Bischöfe und Kirchenlehrer"},"it":{"n":"Santi Basilio Magno e Gregorio Nazianzeno","t":"Vescovi e dottori della Chiesa"},"es":{"n":"Santos Basilio Magno y Gregorio Nacianceno","t":"Obispos y doctores de la Iglesia"},"pt":{"n":"São Basílio Magno e São Gregório de Nazianzo","t":"Bispos e Doutores da Igreja"},"te":{"n":"పునీత మహా బాసిలు, నాజియాంజెన్ పునీత గ్రెగొరీ","t":"పీఠాధిపతులు, శ్రీసభ వేదపారంగతులు"},"kn":{"n":"ಸಂತ ಮಹಾ ಬೆಸಿಲ್ ಮತ್ತು ನಾಜಿಯಾನ್ಸೆನ್‌ನ ಸಂತ ಗ್ರೆಗೊರಿ","t":"ಧರ್ಮಾಧ್ಯಕ್ಷರು ಮತ್ತು ಧರ್ಮಸಭೆಯ ಧರ್ಮಪಂಡಿತರು"},"fr":{"n":"Saint Basile le Grand et saint Grégoire de Nazianze","t":"Évêques et docteurs de l'Église"},"tl":{"n":"San Basilio Magno at San Gregorio Nazianzeno","t":"Mga obispo at Pantas ng Simbahan"},"sw":{"n":"Watakatifu Basili Mkuu na Gregori wa Nazianzo","t":"Maaskofu na Walimu wa Kanisa"},"img":{"src":"img/saints/basilgregory.jpg","cap":{"en":"Sts Basil the Great, John Chrysostom and Gregory the Theologian (Nazianzen), the Three Holy Hierarchs, Russian icon, tempera on wood, second quarter of the 19th century, Museum of Christian Culture, St Petersburg, Russia. Public domain, via Wikimedia Commons.","ml":"മഹാനായ വിശുദ്ധ ബേസിൽ, വിശുദ്ധ ജോൺ ക്രിസോസ്തോം, ദൈവശാസ്ത്രജ്ഞനായ വിശുദ്ധ ഗ്രിഗറി (നസിയാൻസൻ): മൂന്നു വിശുദ്ധ സഭാപിതാക്കന്മാരുടെ റഷ്യൻ ഐക്കൺ (മരപ്പലകയിൽ ടെമ്പെറ, പത്തൊമ്പതാം നൂറ്റാണ്ടിന്റെ രണ്ടാം പാദം). റഷ്യയിലെ സെന്റ് പീറ്റേഴ്സ്ബർഗിലുള്ള ക്രൈസ്തവ സംസ്കാര മ്യൂസിയത്തിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"josephvaz","md":"01-16","rites":["lat"],"en":{"n":"St Joseph Vaz","t":"Priest of Goa, Apostle of Sri Lanka"},"ml":{"n":"വിശുദ്ധ ജോസഫ് വാസ്","t":"ഗോവയിലെ വൈദികൻ, ശ്രീലങ്കയുടെ അപ്പസ്തോലൻ"},"ta":{"n":"புனித யோசேப்பு வாஸ்","t":"கோவாவின் குரு, இலங்கையின் திருத்தூதர்"},"hi":{"n":"संत योसेफ़ वाज़","t":"गोवा के पुरोहित, श्रीलंका के प्रेरित"},"de":{"n":"Hl. Joseph Vaz","t":"Priester aus Goa, Apostel Sri Lankas"},"it":{"n":"San Giuseppe Vaz","t":"Sacerdote di Goa, apostolo dello Sri Lanka"},"es":{"n":"San José Vaz","t":"Presbítero de Goa, apóstol de Sri Lanka"},"pt":{"n":"São José Vaz","t":"Presbítero de Goa, apóstolo do Sri Lanka"},"te":{"n":"పునీత జోసెఫ్ వాజ్","t":"గోవా గురువు, శ్రీలంక అపోస్తలుడు"},"kn":{"n":"ಸಂತ ಜೋಸೆಫ್ ವಾಜ್","t":"ಗೋವಾದ ಗುರು, ಶ್ರೀಲಂಕಾದ ಪ್ರೇಷಿತರು"},"fr":{"n":"Saint Joseph Vaz","t":"Prêtre de Goa, apôtre du Sri Lanka"},"tl":{"n":"San Jose Vaz","t":"Pari ng Goa, apostol ng Sri Lanka"},"sw":{"n":"Mt. Yosefu Vaz","t":"Padri wa Goa, Mtume wa Sri Lanka"},"img":{"src":"img/saints/josephvaz.jpg","cap":{"en":"St Joseph Vaz, apostle of Sri Lanka, portrait by a contemporary painter, early 18th century. Public domain, via Wikimedia Commons.","ml":"ശ്രീലങ്കയുടെ അപ്പസ്തോലനായ വിശുദ്ധ ജോസഫ് വാസ്: സമകാലികനായ ഒരു ചിത്രകാരൻ വരച്ച ഛായാചിത്രം (പതിനെട്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭം). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"antonyabbot","md":"01-17","en":{"n":"St Antony the Great","t":"Abbot, father of monks"},"ml":{"n":"മഹാനായ വിശുദ്ധ അന്തോനീസ് (മാർ അന്തോണിയോസ്)","t":"ആശ്രമാധിപൻ, സന്യാസികളുടെ പിതാവ്"},"ta":{"n":"பெரிய புனித அந்தோனியார்","t":"மடாதிபதி, துறவிகளின் தந்தை"},"hi":{"n":"संत अन्तोनी महान","t":"मठाधिपति, मठवासियों के पिता"},"de":{"n":"Hl. Antonius der Große","t":"Abt, Vater der Mönche"},"it":{"n":"Sant'Antonio Abate","t":"Abate, padre dei monaci"},"es":{"n":"San Antonio Abad","t":"Abad, padre de los monjes"},"pt":{"n":"Santo Antão, o Grande","t":"Abade, pai dos monges"},"te":{"n":"పునీత మహా అంతోని","t":"మఠాధిపతి, సన్యాసుల పిత"},"kn":{"n":"ಸಂತ ಮಹಾ ಅಂತೋನಿ","t":"ಮಠಾಧಿಪತಿ, ಸನ್ಯಾಸಿಗಳ ತಂದೆ"},"fr":{"n":"Saint Antoine le Grand","t":"Abbé, père des moines"},"tl":{"n":"San Antonio Abad","t":"Abad, ama ng mga monghe"},"sw":{"n":"Mt. Antoni Mkuu","t":"Abati, baba wa wamonaki"},"img":{"src":"img/saints/antonyabbot.jpg","cap":{"en":"Emmanuel Tzanes, St Antony the Great with scenes from his life, Cretan icon, 1645. Public domain, via Wikimedia Commons.","ml":"ഇമ്മാനുവേൽ ത്സാനെസ് എഴുതിയ “മഹാനായ വിശുദ്ധ അന്തോനീസ്, ജീവിതരംഗങ്ങളോടൊപ്പം” (ക്രീറ്റിലെ ഐക്കൺ, 1645). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"agnes","md":"01-21","rites":["lat","smk"],"en":{"n":"St Agnes","t":"Virgin and martyr of Rome"},"ml":{"n":"വിശുദ്ധ ആഗ്നസ്","t":"റോമിലെ കന്യകയും രക്തസാക്ഷിയും"},"ta":{"n":"புனித ஆக்னஸ்","t":"உரோமையின் கன்னியும் மறைசாட்சியும்"},"hi":{"n":"संत आग्नेस","t":"रोम की कुँवारी और शहीद"},"de":{"n":"Hl. Agnes","t":"Jungfrau und Märtyrin in Rom"},"it":{"n":"Sant'Agnese","t":"Vergine e martire di Roma"},"es":{"n":"Santa Inés","t":"Virgen y mártir de Roma"},"pt":{"n":"Santa Inês","t":"Virgem e mártir de Roma"},"te":{"n":"పునీత ఆగ్నెస్","t":"రోము నగర కన్య, వేదసాక్షి"},"kn":{"n":"ಸಂತ ಆಗ್ನೆಸ್","t":"ರೋಮಿನ ಕನ್ಯೆ ಮತ್ತು ಹುತಾತ್ಮೆ"},"fr":{"n":"Sainte Agnès","t":"Vierge et martyre de Rome"},"tl":{"n":"Santa Ines","t":"Birhen at martir ng Roma"},"sw":{"n":"Mt. Agnesi","t":"Bikira na mfiadini wa Roma"},"img":{"src":"img/saints/agnes.jpg","cap":{"en":"Domenichino, St Agnes, oil on canvas, c. 1620, Royal Collection, Windsor Castle, England. The lamb at her side is her emblem. Public domain, via Wikimedia Commons.","ml":"ദൊമെനിക്കീനോ വരച്ച “വിശുദ്ധ ആഗ്നസ്” (എണ്ണച്ചായാചിത്രം, ഏകദേശം 1620). ഇംഗ്ലണ്ടിലെ വിൻഡ്സർ കൊട്ടാരത്തിലെ രാജകീയ ശേഖരത്തിൽ. അരികിലുള്ള കുഞ്ഞാട് അവളുടെ അടയാളമാണ്. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"francisdesales","md":"01-24","rites":["lat"],"en":{"n":"St Francis de Sales","t":"Bishop of Geneva, Doctor of the Church"},"ml":{"n":"വിശുദ്ധ ഫ്രാൻസിസ് ഡി സാലസ്","t":"ജനീവയിലെ മെത്രാൻ, സഭയുടെ വേദപാരംഗതൻ"},"ta":{"n":"புனித பிரான்சிஸ் சலேசியார்","t":"ஜெனீவா ஆயர், திருச்சபையின் மறைவல்லுநர்"},"hi":{"n":"संत फ्रांसिस द सेल्स","t":"जिनेवा के धर्माध्यक्ष, कलीसिया के धर्माचार्य"},"de":{"n":"Hl. Franz von Sales","t":"Bischof von Genf, Kirchenlehrer"},"it":{"n":"San Francesco di Sales","t":"Vescovo di Ginevra, dottore della Chiesa"},"es":{"n":"San Francisco de Sales","t":"Obispo de Ginebra, doctor de la Iglesia"},"pt":{"n":"São Francisco de Sales","t":"Bispo de Genebra, doutor da Igreja"},"te":{"n":"పునీత ఫ్రాన్సిస్ డి సేల్స్","t":"జెనీవా పీఠాధిపతి, శ్రీసభ పండితుడు"},"kn":{"n":"ಸಂತ ಫ್ರಾನ್ಸಿಸ್ ಡಿ ಸೇಲ್ಸ್","t":"ಜಿನೀವಾದ ಧರ್ಮಾಧ್ಯಕ್ಷರು, ಧರ್ಮಸಭೆಯ ಪಂಡಿತರು"},"fr":{"n":"Saint François de Sales","t":"Évêque de Genève, docteur de l'Église"},"tl":{"n":"San Francisco de Sales","t":"Obispo ng Ginebra, Pantas ng Simbahan"},"sw":{"n":"Mt. Fransisko wa Sales","t":"Askofu wa Jeneva, Mwalimu wa Kanisa"},"img":{"src":"img/saints/francisdesales.jpg","cap":{"en":"Angels presenting a portrait of St Francis de Sales, oil painting in the chapel of St Francis de Sales, church of Saint-François-de-Sales, Lyon, France. Photo: Romainbehar, 2022, released into the public domain (CC0), via Wikimedia Commons.","ml":"വിശുദ്ധ ഫ്രാൻസിസ് ഡി സാലസിന്റെ ഛായാചിത്രം മാലാഖമാർ ഉയർത്തിക്കാട്ടുന്നു: ഫ്രാൻസിലെ ലിയോണിലുള്ള സാൻ ഫ്രാൻസ്വാ ദെ സാൽ ദേവാലയത്തിലെ ചാപ്പലിലുള്ള എണ്ണച്ചായാചിത്രം. ഫോട്ടോ: Romainbehar (2022), CC0 (പകർപ്പവകാശമുക്തം), വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"conversionpaul","md":"01-25","en":{"n":"The Conversion of St Paul","t":"Apostle to the nations"},"ml":{"n":"വിശുദ്ധ പൗലോസ് ശ്ലീഹായുടെ മാനസാന്തരം","t":"ജനതകളുടെ ശ്ലീഹാ"},"ta":{"n":"புனித பவுலின் மனமாற்றம்","t":"பிற இனத்தாரின் திருத்தூதர்"},"hi":{"n":"संत पौलुस का मन-परिवर्तन","t":"गैर-यहूदियों के प्रेरित"},"de":{"n":"Bekehrung des hl. Apostels Paulus","t":"Apostel der Völker"},"it":{"n":"Conversione di San Paolo","t":"Apostolo delle genti"},"es":{"n":"La Conversión de san Pablo","t":"Apóstol de las naciones"},"pt":{"n":"A Conversão de São Paulo","t":"Apóstolo dos gentios"},"te":{"n":"అపొస్తలుడైన పునీత పౌలు మారుమనస్సు","t":"అన్యజనుల అపోస్తలుడు"},"kn":{"n":"ಪ್ರೇಷಿತ ಸಂತ ಪೌಲರ ಮನಃಪರಿವರ್ತನೆ","t":"ಅನ್ಯಜನರ ಪ್ರೇಷಿತರು"},"fr":{"n":"Conversion de saint Paul","t":"Apôtre des nations"},"tl":{"n":"Ang Pagbabagong-loob ni San Pablo","t":"Apostol ng mga bansa"},"sw":{"n":"Kuongoka kwa Mt. Paulo","t":"Mtume wa mataifa"},"img":{"src":"img/saints/conversionpaul.jpg","cap":{"en":"Caravaggio, The Conversion of St Paul, oil on cypress panel, c. 1600–1601, Odescalchi Balbi collection, Rome. Saul lies blinded on the road to Damascus as Christ appears to him. Public domain, via Wikimedia Commons.","ml":"കാരവാജ്ജോ വരച്ച “വിശുദ്ധ പൗലോസിന്റെ മാനസാന്തരം” (സൈപ്രസ് മരപ്പലകയിൽ എണ്ണച്ചായം, ഏകദേശം 1600–1601). റോമിലെ ഒദെസ്കാൽക്കി ബാൽബി ശേഖരത്തിൽ. ദമാസ്കസിലേക്കുള്ള വഴിയിൽ ക്രിസ്തു പ്രത്യക്ഷനായപ്പോൾ കാഴ്ച നഷ്ടപ്പെട്ട് സാവൂൾ നിലത്തു വീണുകിടക്കുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"timothytitus","md":"01-26","rites":["lat"],"en":{"n":"Sts Timothy and Titus","t":"Bishops, companions of St Paul"},"ml":{"n":"വിശുദ്ധ തിമോത്തേയോസും വിശുദ്ധ തീത്തോസും","t":"മെത്രാന്മാർ, വിശുദ്ധ പൗലോസിന്റെ സഹപ്രവർത്തകർ"},"ta":{"n":"புனித திமொத்தேயு, புனித தீத்து","t":"ஆயர்கள், புனித பவுலின் உடனுழைப்பாளர்கள்"},"hi":{"n":"संत तिमथी और संत तीतुस","t":"धर्माध्यक्ष, संत पौलुस के साथी"},"de":{"n":"Hl. Timotheus und hl. Titus","t":"Bischöfe, Gefährten des hl. Paulus"},"it":{"n":"Santi Timoteo e Tito","t":"Vescovi, compagni di san Paolo"},"es":{"n":"Santos Timoteo y Tito","t":"Obispos, compañeros de san Pablo"},"pt":{"n":"São Timóteo e São Tito","t":"Bispos, companheiros de São Paulo"},"te":{"n":"పునీత తిమోతి, పునీత తీతు","t":"పీఠాధిపతులు, పునీత పౌలు సహచరులు"},"kn":{"n":"ಸಂತ ತಿಮೊಥೇಯ ಮತ್ತು ಸಂತ ತೀತ","t":"ಧರ್ಮಾಧ್ಯಕ್ಷರು, ಸಂತ ಪೌಲರ ಸಂಗಾತಿಗಳು"},"fr":{"n":"Saint Timothée et saint Tite","t":"Évêques, compagnons de saint Paul"},"tl":{"n":"San Timoteo at San Tito","t":"Mga obispo, mga kasama ni San Pablo"},"sw":{"n":"Watakatifu Timotheo na Tito","t":"Maaskofu, wenzake Mt. Paulo"},"img":{"src":"img/saints/timothytitus.jpg","cap":{"en":"St Titus, first bishop of Crete, with St Cyril of Gortyna, fresco, 13th–15th century, Crete. Public domain, via Wikimedia Commons.","ml":"ക്രീറ്റിലെ ആദ്യ മെത്രാനായ വിശുദ്ധ തീത്തോസ്, ഗോർട്ടിനായിലെ വിശുദ്ധ സിറിലിനോടൊപ്പം: ചുവർചിത്രം (പതിമൂന്നാം–പതിനഞ്ചാം നൂറ്റാണ്ട്), ക്രീറ്റ്. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"cyrilathanasius","md":"01-18","rites":["smk"],"en":{"n":"Mar Athanasius and Mar Cyril of Alexandria","t":"Patriarchs of Alexandria, defenders of the faith, Doctors of the Church"},"ml":{"n":"അലക്സാണ്ട്രിയായിലെ മാർ അത്തനാസിയോസും മാർ സിറിലും","t":"അലക്സാണ്ട്രിയായിലെ പാത്രിയർക്കീസുമാർ, വിശ്വാസസംരക്ഷകർ, സഭയുടെ വേദപാരംഗതർ"},"ta":{"n":"மார் அத்தனாசியுஸும் அலெக்சாந்திரியாவின் மார் சிரிலும்","t":"அலெக்சாந்திரியாவின் முதுபெரும் தந்தையர், நம்பிக்கையின் காவலர், திருச்சபையின் மறைவல்லுநர்கள்"},"hi":{"n":"मार अथानासियुस और सिकंदरिया के मार सिरिल","t":"सिकंदरिया के प्राधिधर्माध्यक्ष, विश्वास के रक्षक, कलीसिया के धर्माचार्य"},"img":{"src":"img/saints/cyrilathanasius.jpg","cap":{"en":"Sts Cyril and Athanasius of Alexandria, with St Leontius of Rostov, Novgorod icon, end of the 15th century, Novgorod Museum, Veliky Novgorod, Russia. Public domain, via Wikimedia Commons.","ml":"അലക്സാണ്ട്രിയായിലെ മാർ സിറിലും മാർ അത്തനാസിയോസും, റോസ്തോവിലെ വിശുദ്ധ ലെയോന്തിയോസിനോടൊപ്പം: നോവ്ഗൊറോദ് ഐക്കൺ (പതിനഞ്ചാം നൂറ്റാണ്ടിന്റെ അവസാനം). റഷ്യയിലെ വെലിക്കി നോവ്ഗൊറോദ് മ്യൂസിയത്തിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"macarios","md":"01-19","rites":["smk"],"en":{"n":"Mar Macarios (St Macarius the Great)","t":"Monk and father of the desert of Scetis, Egypt"},"ml":{"n":"മാർ മക്കാറിയോസ് (മഹാനായ വിശുദ്ധ മക്കാറിയോസ്)","t":"ഈജിപ്തിലെ സ്കേത്തിസ് മരുഭൂമിയിലെ സന്യാസിയും പിതാവും"},"ta":{"n":"மார் மக்காரியோஸ் (பெரிய தூய மக்காரியுஸ்)","t":"எகிப்தின் செகேத்தி பாலைநிலத்தின் துறவியும் தந்தையும்"},"hi":{"n":"मार मकारियोस (महान संत मकारियुस)","t":"मिस्र के स्केतिस मरुस्थल के मठवासी और पिता"},"img":{"src":"img/saints/macarios.jpg","cap":{"en":"St Macarius the Great of Egypt, old icon reproduced in a Ukrainian edition of his works. Public domain, via Wikimedia Commons.","ml":"ഈജിപ്തിലെ മഹാനായ വിശുദ്ധ മക്കാറിയോസ്: അദ്ദേഹത്തിന്റെ കൃതികളുടെ ഉക്രൈനിയൻ പതിപ്പിൽ ചേർത്തിരിക്കുന്ന പഴയ ഐക്കൺ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"angelamerici","md":"01-27","rites":["lat"],"en":{"n":"St Angela Merici","t":"Virgin, foundress of the Company of St Ursula"},"ml":{"n":"വിശുദ്ധ ആഞ്ചല മെരീച്ചി","t":"കന്യക, വിശുദ്ധ ഉർസുലയുടെ സമൂഹത്തിന്റെ സ്ഥാപക"},"ta":{"n":"புனித ஆஞ்சலா மெரிசி","t":"கன்னி, புனித உர்சுலா கூட்டமைப்பின் நிறுவுநர்"},"hi":{"n":"संत आंजेला मेरिची","t":"कुँवारी, संत उर्सुला की संगति की संस्थापिका"},"de":{"n":"Hl. Angela Merici","t":"Jungfrau, Gründerin der Gesellschaft der hl. Ursula"},"it":{"n":"Sant'Angela Merici","t":"Vergine, fondatrice della Compagnia di Sant'Orsola"},"es":{"n":"Santa Ángela de Mérici","t":"Virgen, fundadora de la Compañía de Santa Úrsula"},"pt":{"n":"Santa Ângela Merici","t":"Virgem, fundadora da Companhia de Santa Úrsula"},"te":{"n":"పునీత ఏంజెలా మెరిసి","t":"కన్య, పునీత ఉర్సులా సమాజ స్థాపకురాలు"},"kn":{"n":"ಸಂತ ಏಂಜೆಲಾ ಮೆರಿಚಿ","t":"ಕನ್ಯೆ, ಸಂತ ಉರ್ಸುಲಾ ಸಮುದಾಯದ ಸ್ಥಾಪಕಿ"},"fr":{"n":"Sainte Angèle Merici","t":"Vierge, fondatrice de la Compagnie de Sainte-Ursule"},"tl":{"n":"Santa Angela Merici","t":"Birhen, tagapagtatag ng Kompanya ni Santa Ursula"},"sw":{"n":"Mt. Angela Merici","t":"Bikira, mwanzilishi wa Shirika la Mt. Ursula"},"img":{"src":"img/saints/angelamerici.jpg","cap":{"en":"Pietro Calzavacca, St Angela Merici as a teacher, devotional picture in pastel on paper, 19th century, Merician Museum, Brescia, Italy. Public domain, via Wikimedia Commons.","ml":"പിയെത്രോ കാൽസവാക്ക വരച്ച “അദ്ധ്യാപികയായ വിശുദ്ധ ആഞ്ചല മെരീച്ചി” (കടലാസിൽ പാസ്റ്റൽ ചിത്രം, പത്തൊമ്പതാം നൂറ്റാണ്ട്). ഇറ്റലിയിലെ ബ്രേഷ്യയിലുള്ള മെരീച്ചി മ്യൂസിയത്തിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"thomasaquinas","md":"01-28","en":{"n":"St Thomas Aquinas","t":"Dominican priest, theologian, Doctor of the Church"},"ml":{"n":"വിശുദ്ധ തോമസ് അക്വീനാസ്","t":"ഡൊമിനിക്കൻ വൈദികൻ, ദൈവശാസ്ത്രജ്ഞൻ, സഭയുടെ വേദപാരംഗതൻ"},"ta":{"n":"புனித தோமா அக்குவினா","t":"தொமினிக்கன் சபைக் குரு, இறையியலாளர், திருச்சபையின் மறைவல்லுநர்"},"hi":{"n":"संत थॉमस एक्विनास","t":"दोमिनिकन पुरोहित, ईशशास्त्री, कलीसिया के धर्माचार्य"},"de":{"n":"Hl. Thomas von Aquin","t":"Dominikanerpriester, Theologe, Kirchenlehrer"},"it":{"n":"San Tommaso d'Aquino","t":"Sacerdote domenicano, teologo, dottore della Chiesa"},"es":{"n":"Santo Tomás de Aquino","t":"Presbítero dominico, teólogo, doctor de la Iglesia"},"pt":{"n":"São Tomás de Aquino","t":"Presbítero dominicano, teólogo, doutor da Igreja"},"te":{"n":"పునీత థామస్ అక్వినాస్","t":"డొమినికన్ గురువు, వేదాంతి, శ్రీసభ పండితుడు"},"kn":{"n":"ಸಂತ ಥಾಮಸ್ ಅಕ್ವಿನಾಸ್","t":"ಡೊಮಿನಿಕನ್ ಗುರು, ದೈವಶಾಸ್ತ್ರಜ್ಞ, ಧರ್ಮಸಭೆಯ ಪಂಡಿತರು"},"fr":{"n":"Saint Thomas d'Aquin","t":"Prêtre dominicain, théologien, docteur de l'Église"},"tl":{"n":"Santo Tomas de Aquino","t":"Paring Dominiko, teologo, Pantas ng Simbahan"},"sw":{"n":"Mt. Thomas wa Akwino","t":"Padri Mdominiko, mwanateolojia, Mwalimu wa Kanisa"},"img":{"src":"img/saints/thomasaquinas.jpg","cap":{"en":"Benozzo Gozzoli, The Triumph of St Thomas Aquinas, tempera on panel, 1471, Musée du Louvre, Paris. The saint sits enthroned between Aristotle and Plato, with the defeated Averroes at his feet. Public domain, via Wikimedia Commons.","ml":"ബെനോത്സോ ഗോത്സോളി വരച്ച “വിശുദ്ധ തോമസ് അക്വീനാസിന്റെ വിജയം” (മരപ്പലകയിൽ ടെമ്പെറ, 1471). പാരീസിലെ ലൂവ്ര് മ്യൂസിയത്തിൽ. അരിസ്റ്റോട്ടിലിനും arted","r":[]},{"h":"Souls who are in the hope of Resurrection.","r":[]},{"h":"Since there should be seven weeks for the season of Great Fast","r":[]},{"h":"before the Feast of Easter, the number of the weeks in the season","r":[]},{"h":"of Epiphany may be differed. Another particularity of this season is","r":[]},{"h":"the observance of the Three Days Fast, the Rogation of Ninivites; the","r":[]},{"h":"Three Days Fast start eighteen days before the beginning of Great Fast","r":[]},{"h":"which is filled with the grace of repentance.","r":[]},{"h":"Together with the commemoration of Baptism of Jesus, this season","r":[]},{"h":"reminds each Christian to think deeply about his or her reception","r":[]},{"h":"of Baptism that made him/her the ‘son/daughter of God' and the","r":[]},{"h":"responsibilities taken up through it. Thus, the season of Epiphany is","r":[]},{"h":"the time to make attempt to love Jesus passionately by knowing Him,","r":[]},{"h":"by living in Him and by bearing witness to Him.","r":[]}]},"2026-01-06":{"t":[],"g":[{"h":"The Feast of Denha","r":[]},{"h":"Important feast day and a day of obligation.","r":[]},{"h":"Today, in the Holy Qurbana, the Order of the third Qūdāšā","r":[]},{"h":"(The Qūdāšā of Mar Nestorius) is used.","r":[["Ex 19:16-25","Lord descends upon Mount Sinai"],["Joel 2:28-32","God shows wonders in the heavens and on the earth"],["2 Tim 1:6-10","Grace has been revealed."],["Mk 1:1-11","Baptism of Jesus."]]}]},"2026-01-07":{"t":["First Wednesday of Denha"],"g":[{"h":"","r":[["2 Tim 3:10-17","One who lives in Christ will be persecuted"],["Lk 4:23-30","Prophet is rejected in the homeland"]]}]},"2026-01-08":{"t":["First Thursday of Denha"],"g":[{"h":"","r":[["Phil 1:12-18","Christ is proclaimed in every way"],["Jn 3: 22-30","He must increase, but I must decrease"]]}]},"2026-01-09":{"t":["First Friday of Denha (St. John the Baptist)"],"g":[{"h":"Today, in the Holy Qurbana, the Order of the third Qūdāšā","r":[]},{"h":"(The Qūdāšā of Mar Nest nd to be shared","r":[]},{"h":"with others. The salvation experience is received through repentance,","r":[]},{"h":"prayer, fasting and acts of charity. This season also gives us the inner","r":[]},{"h":"vision that we become the true disciples when we accept God as the","r":[]},{"h":"wealth, like the apostles who followed Jesus renouncing everything.","r":[]},{"h":"Salvation is received only when we confess sin. Those who throw","r":[]},{"h":"away the dirty mantle of sin can follow Christ. The Church teaches","r":[]},{"h":"that our sanctification is God's will and our sanctification is possible","r":[]},{"h":"only through Jesus Christ who offered His life – the Body and Blood –","r":[]},{"h":"for us to the Father.","r":[]},{"h":"Our body tempts us to do the undesired evil, but to live without","r":[]},{"h":"sinning is a great suffering. The season of Great Fast demands us to","r":[]},{"h":"suffer for the sanctification of our whole life. The sufferings that we","r":[]},{"h":"face and the sacrifices we do help us to grow in faith and to get united","r":[]},{"h":"with Christ. The Church teaches us that only when we stay together","r":[]},{"h":"faithfully to the sufferings of Christ, we can enter into the joy and","r":[]},{"h":"peace of the Resurrection of Christ.","r":[]}]},"2026-02-15":{"t":["First Sunday of the Great Fast"],"g":[{"h":"Lent begins at midnight. Fasting on the first day of Lent.","r":[]},{"h":"Marriage is banned from tomorrow until Easter.","r":[["Ex 24:12-18","Moses was on Mount Sinai for forty days"],["Sir 2:1-11","Trust in the Lord and face temptations"],["Heb 2:10-18","One who is able to help those who are tempted"],["Lk 4:1-13","Jesus' forty days fast"]]}]},"2026-02-16":{"t":["First Monday of the Great Fast"],"g":[{"h":"Lent begins. Day of Fasting","r":[["Gen 3:1-13","Adam and Eve are tempted"],["Wis 12:16-20","God gives grace of repentance"],["Rom 12:1-8","Transformation through the renewal of mind"],["Mt 21:28-32","The son who repented and did re","r":[]},{"h":"that the paralytic received in the Name Jesus, is a guarantee that","r":[]},{"h":"whatever we ask in the Name of Jesus, will be granted.","r":[]},{"h":"It is the responsibility of God's people to proclaim the message of","r":[]},{"h":"salvation to the entire world by being filled with the Holy Spirit. This","r":[]},{"h":"season inspires us to be missionaries like the apostles. The declaration","r":[]},{"h":"of St. Thomas, the Apostle, who is sent by Christ, ‘Let us go and die","r":[]},{"h":"with Him' is an invitation to all of us who are believers. This season","r":[]},{"h":"reveals the God who protects those who are sent.","r":[]},{"h":"It reminds the responsibility to live a life, centred on Word of God,","r":[]},{"h":"by those who are sent to proclaim the Good News. It also emphasises","r":[]},{"h":"the necessity to bear witness fearlessly to God who is the Word. It is","r":[]},{"h":"when a grain of wheat falls to the ground and dies, it will produce","r":[]},{"h":"fruit. Therefore, Jesus reminds us to do the mission courageously and","r":[]},{"h":"that we gain eternal life through the suffering. The primary mission","r":[]},{"h":"of all the Christians is to give witness to Christ in any situations.","r":[]},{"h":"The Holy Spirit, the Helper sent by the Father, lives in all the","r":[]},{"h":"baptised individuals and showers His graces and fruits. The assistance","r":[]},{"h":"of the Holy Spirit is essential to remember all that is taught by Christ","r":[]},{"h":"and to obey His commandments in every moment of life. This season","r":[]},{"h":"reminds also that if we lose God's Spirit by sinning, the consequence","r":[]},{"h":"will be utter destruction.","r":[]},{"h":"We shall partake in the communion and unity of the apostles who","r":[]},{"h":"established new ecclesial communities with the message of the Master","r":[]},{"h":"by travelling all over the world. Holding fast the truth that we are the","r":[]},{"h":"temple of the Holy Spirit and wi ve the disciples"]]},{"h":"Saint Euphrasia","r":[["Gen 12:1-4","God calls Abraham"],["Sir 2:1-6","Trust in the Lord"],["1 Thess 4:1-8","Life pleasing to God"],["Mk 10:35-45","The first among you must be the servant of all SEASONS OF ELIJAH-CROSS-MOSES (Ēliya-Sleeva-Mušae) The season of Elijah-Cross-Moses indicates the victory of the Cross and the second coming of the Lord. The feast of the Exaltation of the Holy Cross celebrated on the 14th of September is the focal point of this season. The first ecclesial community believed that before the second coming of Christ, Elijah would come (Mal 4:5) and will argue with the son of destruction and convince the world about his fault. This belief was grown because of the reality that Elijah was present with the Lord at the time of transfiguration. The Lord's transfiguration is the symbol of Lord's second coming. At the time of transfiguration, Moses also was with the Lord; that might be the reason that this liturgical season developed centring around the Cross. The Sunday after 14th September is considered as first Sunday of Sleeva. Till then the readings of the season of Elijah is continued. When the feast of the Exaltation of the Holy Cross falls on a Sunday, that will be the first Sunday of Sleeva. There was the belief in the first ecclesial community, what Jesus told about the sign that would appear in the sky before the second coming of Christ (Mt. 24:30), is the Cross. Therefore, the strength and the victory of the Cross are commemorated in this season. The prayers and hymns of this season include the apparition of Cross to the emperor Constantine, consequent victory and the finding of the Cross by the queen Helena, the mother of Constantine. Like Moses who showed the way to the Israelites, extending his staff on the Red sea, Christ saved the humanity by showing the way to the paradise through the Cross. During this season the Church invites us to prepare for the second coming of the Lord by assimilating the prophets of the true God and the commands and messages given through them by God, and by producing the fruits of repentance and conversion. The mother Church gives us the warning that you will perish unless you walk in the way of repentance abstaining from all evils, in the conviction that the desires of body are against the spirit. Since the day of the Lord is imminent, the Church invites us to attain the eternal life like the prudent virgins, ministering him vigilantly, and through attentiveness, faithfulness, prudence, equanimity, diligent service and continuous prayer. The bronze serpent that was raised by Moses in the Old Testament, is symbol of Jesus who was raise on the Cross to share the salvation. One who takes pride in the Name of the Lord, takes pride in the Cross, the sign of salvation, and in the sufferings. This season reminds us that all those who follow Him, who has died on the Cross and ascended into the glory of resurrection, have to bear the Cross. The readings of this season give us the conviction that it is inevitable to go through the suffering and death in order to enter into the glory. The manifestation of the glory of Christ, who has fulfilled God's will by accepting suffering and death, happened on the Cross. The Lord who will appear as the Judge at the end of the world, is the one who has seated at the right side of the Glory through His Death, Resurrection and Ascension. This season inspires the faithful to suffer with Christ who was raised by God, because He emptied himself even unto death on the Cross, in humility, to enter into glory. Death and final judgments are the themes of this Season of Moses. Jesus gives the consolation words that ‘the one who endures to the end, will be saved'. The Church teaches: bear fruits, enduring faith is fruitful, confront sufferings with faith to receive consolation and joy."]]}]},"2026-08-30":{"t":["First Sunday of Elijah-Cross-Moses","First Sunday of Elijah"],"g":[{"h":"","r":[["Ex 34:28-35","Moses' face was rad var SX={
 sub:[["Season of Annunciation–Nativity (Subara–Yalda)","The liturgical year begins with the announcements of salvation: to Zechariah, to Mary, to Joseph. For about four weeks the Church meditates on God's promises fulfilled in the Incarnation, and then celebrates the birth of the Lord. A 25-day fast prepares for Christmas."],["മംഗളവാർത്ത–പിറവിക്കാലം (സൂബാറ–യൽദാ)","രക്ഷയുടെ മംഗളവാർത്തകളോടെ ആരാധനാവത്സരം ആരംഭിക്കുന്നു: സഖറിയായ്ക്കും മറിയത്തിനും ജോസഫിനും. ഏകദേശം നാലാഴ്ച, മനുഷ്യാവതാരത്തിൽ നിറവേറിയ ദൈവവാഗ്ദാനങ്ങളെപ്പറ്റി സഭ ധ്യാനിക്കുന്നു; പിന്നെ കർത്താവിന്റെ ജനനം ആഘോഷിക്കുന്നു. ഇരുപത്തഞ്ചു നോമ്പ് ക്രിസ്മസിന് ഒരുക്കുന്നു."]],
 den:[["Season of Epiphany (Denha)","Denha means the rising, or manifestation. Beginning with the Baptism of the Lord in the Jordan, where the Trinity is revealed, the Church contemplates Christ made known to the world. Its Fridays commemorate saints and the departed, the witnesses through whom Christ continues to be manifested."],["ദനഹാക്കാലം","ദനഹാ എന്നാൽ ഉദയം, പ്രത്യക്ഷീകരണം. പരിശുദ്ധ ത്രിത്വം വെളിപ്പെട്ട ജോർദാനിലെ മാമ്മോദീസയോടെ ആരംഭിച്ച്, ലോകത്തിനു വെളിപ്പെടുത്തപ്പെട്ട ക്രിസ്തുവിനെ സഭ ധ്യാനിക്കുന്നു. ഈ കാലത്തെ വെള്ളിയാഴ്ചകളിൽ, ക്രിസ്തു തുടർന്നും വെളിപ്പെടുന്ന സാക്ഷികളായ വിശുദ്ധരെയും മരിച്ചവരെയും ഓർക്കുന്നു."]],
 fast:[["Season of the Great Fast (Sauma Ramba)","Fifty days of prayer, fasting and almsgiving, beginning on the Monday of Ash Monday (Vibhoodi), following Christ through his fast in the desert to his Passion, death and burial. It ends with Holy Week: Hosanna Sunday, Pesaha, Good Friday and the Great Saturday."],["വലിയ നോമ്പുകാലം (സൗമാ റമ്പാ)","വിഭൂതിത്തിങ്കളാഴ്ച ആരംഭിക്കുന്ന പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും അമ്പതു ദിവസങ്ങൾ; മരുഭൂമിയിലെ ഉപവാസംമുതൽ പീഡാസഹനവും മരണവും സംസ്കാരവുംവരെ ക്രിസ്തുവിനെ പിന്തുടരുന്നു. ഓശാന ഞായർ, പെസഹാ, ദുഃഖവെള്ളി, വലിയ ശനി എന്നിവയുള്ള വിശുദ്ധവാരത്തോടെ അത് അവസാനിക്കുന്നു."]],
 qyam:[["Season of the Resurrection (Qyamtha)","Seven weeks of Easter joy. The Church celebrates the risen Lord, his appearances to the disciples, and the new life of Baptism, until the feast of Pentecost."],["ഉയിർപ്പുകാലം (ക്യംതാ)","ഈസ്റ്റർ സന്തോഷത്തിന്റെ ഏഴ് ആഴ്ചകൾ. ഉത്ഥിതനായ കർത്താവിനെയും ശിഷ്യർക്കുള്ള അവിടുത്തെ പ്രത്യക്ഷീകരണങ്ങളെയും മാമ്മോദീസയിലെ പുതുജീവനെയും പന്തക്കുസ്താവരെ സഭ ആഘോഷിക്കുന്നു."]],
 sliha:[["Season of the Apostles (Sliha)","From Pentecost, the Church remembers the coming of the Holy Spirit and the preaching of the apostles. It is the season of the Church's birth and mission, and our own apostle Thomas is honoured within it (Dukhrana, 3 July)."],["ശ്ലീഹാക്കാലം","പന്തക്കുസ്താമുതൽ, പരിശുദ്ധാത്മാവിന്റെ ആഗമനവും ശ്ലീഹന്മാരുടെ പ്രസംഗവും സഭ ഓർക്കുന്നു. സഭയുടെ ജനനത്തിന്റെയും ദൗത്യത്തിന്റെയും കാലം; നമ്മുടെ ശ്ലീഹായായ മാർ തോമായുടെ ദുക്റാനയും (ജൂലൈ 3) ഇതിനോടു ചേർന്നു വരുന്നു."]],
 qaita:[["Season of Summer (Kaitha)","Kaitha means summer, the season of fruit. The Church meditates on her growth and fruitfulness through the witness of the apostles, martyrs and saints."],["കൈത്താക്കാലം","കൈത്താ എന്നാൽ വേനൽ, ഫലങ്ങളുടെ കാലം. ശ്ലീഹന്മാരുടെയും രക്തസാക്ഷികളുടെയും വിശുദ്ധരുടെയും സാക്ഷ്യത്തിലൂടെയുള്ള സഭയുടെ വളർച്ചയെയും ഫലപുഷ്ടിയെയുംപറ്റി സഭ ധ്യാനിക്കുന്നു."]],
 esm:[["Season of Elijah–Cross–Moses","Three themes in one season. Elijah, taken up into heaven, recalls the Transfiguration and the forerunner of the Lord's coming; the Exaltation of the Cross (14 September) shows the sign of the Son of Man; and the weeks of Moses look toward the Lord's second coming and the judgement. It is the season of the Church watching for the end of history."],["ഏലിയാ–സ്ലീവാ–മൂശെക്കാലം","ഒരു കാലത്തിൽ മൂന്നു വിഷയങ്ങൾ. സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ട ഏലിയാ രൂപാന്തരീകരണത്തെയും കർത്താവിന്റെ വരവിന്റെ മുന്നോടിയെയും ഓർമിപ്പിക്കുന്നു; സ്ലീവാപ്പെരുന്നാൾ (സെപ്റ്റംബർ 14) മനുഷ്യപുത്രന്റെ അടയാളം കാണിക്കുന്നു; മൂശെയുടെ ആഴ്ചകൾ കർത്താവിന്റെ രണ്ടാം വരവിലേക്കും വിധിയിലേക്കും നോക്കുന്നു. ചരിത്രത്തിന്റെ അന്ത്യത്തിനായി ഉണർന്നിരിക്കുന്ന സഭയുടെ കാലം."]],
 qud:[["Season of the Dedication of the Church (Qudash Edtha)","The last four weeks of the year. The Church contemplates herself as the Bride presented to Christ and as the dwelling of God, and looks to her completion in the heavenly Jerusalem."],["പള്ളിക്കൂദാശക്കാലം (ഖുദാശ് ഏദ്താ)","വർഷത്തിന്റെ അവസാനത്തെ നാലാഴ്ച. ക്രിസ്തുവിനു സമർപ്പിക്കപ്പെട്ട മണവാട്ടിയായും ദൈവത്തിന്റെ വാസസ്ഥലമായും സഭ തന്നെത്തന്നെ ധ്യാനിക്കുന്നു; സ്വർഗീയ ജറുസലേമിലെ തന്റെ പൂർത്തീകരണത്തിലേക്കു നോക്കുന്നു."]],
 adv:[["Advent","Four weeks of joyful waiting for the Lord: for his coming at the end of time, and for the celebration of his birth at Christmas. Colour: violet."],["ആഗമനകാലം","കർത്താവിനായുള്ള സന്തോഷകരമായ കാത്തിരിപ്പിന്റെ നാലാഴ്ച: കാലത്തിന്റെ അന്ത്യത്തിലെ അവിടുത്തെ വരവിനായും ക്രിസ്മസിലെ അവിടുത്തെ ജനനത്തിന്റെ ആഘോഷത്തിനായും. നിറം: വയലറ്റ്."]],
 chr:[["Christmas Season","From the Nativity of the Lord to the Baptism of the Lord: the Word made flesh, the Holy Family, Mary Mother of God, and the Epiphany. Colour: white."],["ക്രിസ്മസ്കാലം","കർത്താവിന്റെ തിരുപ്പിറവിമുതൽ കർത്താവിന്റെ മാമ്മോദീസവരെ: മാംസമായ വചനം, തിരുക്കുടുംബം, ദൈവമാതാവായ മറിയം, ദനഹാ. നിറം: വെള്ള."]],
 ot:[["Ordinary Time","The numbered weeks in which the Church follows Christ's public life and teaching, Sunday by Sunday. Colour: green, the colour of growth."],["ആണ്ടുവട്ടം","ക്രിസ്തുവിന്റെ പരസ്യജീവിതവും പ്രബോധനവും ഞായറാഴ്ചതോറും സഭ പിന്തുടരുന്ന, എണ്ണമിട്ട ആഴ്ചകൾ. നിറം: വളർച്ചയുടെ നിറമായ പച്ച."]],
 lent:[["Lent","Forty days of prayer, fasting and almsgiving, from Ash Wednesday, preparing the catechumens for Baptism and all the faithful for Easter. Colour: violet."],["നോമ്പുകാലം","വിഭൂതി ബുധൻമുതൽ പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും നാൽപതു ദിവസങ്ങൾ; ജ്ഞാനസ്നാനാർഥികളെ മാമ്മോദീസയ്ക്കും എല്ലാ വിശ്വാസികളെയും ഈസ്റ്ററിനും ഒരുക്കുന്നു. നിറം: വയലറ്റ്."]],
 holy:[["Holy Week","From Palm Sunday to the Easter Triduum: the Lord's entry into Jerusalem, the Last Supper, his Passion and death, and the vigil of the Resurrection."],["വിശുദ്ധവാരം","ഓശാന ഞായർമുതൽ ഈസ്റ്റർ ത്രിദിനംവരെ: കർത്താവിന്റെ ജറുസലേം പ്രവേശനം, അന്ത്യത്താഴം, പീഡാസഹനവും മരണവും, ഉയിർപ്പിന്റെ ജാഗരണം."]],
 east:[["Easter Season","Fifty days of Easter joy, from the Resurrection to Pentecost, celebrated as one great Sunday. Colour: white."],["ഈസ്റ്റർകാലം","ഉയിർപ്പുമുതൽ പന്തക്കുസ്താവരെ, ഒരൊറ്റ മഹാ ഞായറായി ആഘോഷിക്കുന്ന ഈസ്റ്റർ സന്തോഷത്തിന്റെ അമ്പതു ദിവസങ്ങൾ. നിറം: വെള്ള."]]
};
var SXL={ta:{sub:["மங்கள வார்த்தை–பிறப்புக் காலம் (சுவாரா–யல்தா)","மீட்பின் அறிவிப்புகளோடு திருவழிபாட்டு ஆண்டு தொடங்குகிறது: சக்கரியாவுக்கு, மரியாவுக்கு, யோசேப்புக்கு. ஏறக்குறைய நான்கு வாரங்கள் மனுவுருவாதலில் நிறைவேறிய கடவுளின் வாக்குறுதிகளைத் திருச்சபை தியானித்துப் பின்னர் ஆண்டவரின் பிறப்பைக் கொண்டாடுகிறது."],den:["திருக்காட்சிக் காலம் (தென்ஹா)","தென்ஹா என்றால் உதயம், வெளிப்பாடு. மூவொரு கடவுள் வெளிப்பட்ட யோர்தான் திருமுழுக்கிலிருந்து தொடங்கி, உலகுக்கு வெளிப்படுத்தப்பட்ட கிறிஸ்துவைத் திருச்சபை தியானிக்கிறது."],fast:["பெருநோன்புக் காலம் (சௌமா ரம்பா)","செபம், நோன்பு, தருமத்தின் ஐம்பது நாள்கள்; பாலைநில நோன்பு முதல் பாடுகள், இறப்பு, அடக்கம் வரை கிறிஸ்துவைப் பின்தொடர்ந்து, புனித வாரத்தோடு நிறைவுபெறுகிறது."],qyam:["உயிர்ப்புக் காலம் (க்யம்தா)","உயிர்ப்பு மகிழ்ச்சியின் ஏழு வாரங்கள். உயிர்த்த ஆண்டவரையும் சீடர்களுக்கு அவர் தோன்றியதையும் திருமுழுக்கின் புதுவாழ்வையும் பெந்தக்கோஸ்து வரை திருச்சபை கொண்டாடுகிறது."],sliha:["திருத்தூதர் காலம் (ஸ்லீஹா)","பெந்தக்கோஸ்து முதல் தூய ஆவியின் வருகையையும் திருத்தூதர்களின் போதனையையும் திருச்சபை நினைவுகூர்கிறது: திருச்சபையின் பிறப்பும் மறைப்பணியும்; நம் திருத்தூதர் தோமாவும் இதில் போற்றப்படுகிறார் (துக்ரானா, ஜூலை 3)."],qaita:["கோடைக் காலம் (கைத்தா)","கைத்தா என்றால் கோடை, கனிகளின் காலம். திருத்தூதர், மறைச்சாட்சிகள், புனிதர்களின் சான்றால் திருச்சபையின் வளர்ச்சியையும் கனிதருதலையும் தியானிக்கிறது."],esm:["ஏலியா–சிலுவை–மோசே காலம்","ஒரே காலத்தில் மூன்று கருப்பொருள்கள்: விண்ணுக்கு எடுக்கப்பட்ட எலியா, சிலுவையின் மகிமை (செப்டம்பர் 14), மோசே வழியாக இறுதித் தீர்ப்பையும் ஆண்டவரின் வருகையையும் நோக்குதல்."],qud:["திருச்சபை அர்ப்பணக் காலம் (குதாஷ் ஏத்தா)","ஆண்டின் கடைசி நான்கு வாரங்கள். கிறிஸ்துவிடம் ஒப்படைக்கப்படும் மணமகளாகவும் கடவுளின் உறைவிடமாகவும் திருச்சபை தன்னைத் தியானித்து, விண்ணக எருசலேமில் தன் நிறைவை நோக்குகிறது."]},
 hi:{sub:["शुभ संदेश–जन्म काल (सुवारा–यल्दा)","धर्मविधिक वर्ष मुक्ति की घोषणाओं से शुरू होता है: ज़करिया, मरियम और योसेफ़ को। लगभग चार सप्ताह कलीसिया देहधारण में पूरी हुई ईश्वर की प्रतिज्ञाओं पर मनन करती है और फिर प्रभु का जन्म मनाती है।"],den:["प्रकटीकरण काल (देन्हा)","देन्हा का अर्थ है उदय या प्रकटीकरण। यर्दन में प्रभु के बपतिस्मा से, जहाँ त्रियेक ईश्वर प्रकट हुआ, कलीसिया संसार पर प्रकट मसीह पर मनन करती है।"],fast:["महा उपवास काल (सौमा रम्बा)","प्रार्थना, उपवास और दान के पचास दिन, मरुस्थल के उपवास से दुःखभोग, मृत्यु और दफ़न तक मसीह के पीछे चलते हुए, पवित्र सप्ताह के साथ पूर्ण।"],qyam:["पुनरुत्थान काल (क्यामथा)","पास्का-आनंद के सात सप्ताह। कलीसिया पुनर्जीवित प्रभु, शिष्यों को उनके दर्शन और बपतिस्मा के नए जीवन को पेंतेकोस्त तक मनाती है।"],sliha:["प्रेरित काल (श्लीहा)","पेंतेकोस्त से कलीसिया पवित्र आत्मा के आगमन और प्रेरितों के प्रचार को याद करती है: कलीसिया का जन्म और मिशन; हमारे प्रेरित थॉमस भी इसमें सम्मानित होते हैं (दुख्राना, 3 जुलाई)।"],qaita:["ग्रीष्म काल (कैथा)","कैथा का अर्थ है ग्रीष्म, फलों का समय। प्रेरितों, शहीदों और संतों की गवाही द्वारा कलीसिया अपनी वृद्धि और फलदायकता पर मनन करती है।"],esm:["एलियाह–क्रूस–मूसा काल","एक काल में तीन विषय: स्वर्ग उठाए गए एलियाह, क्रूस का उत्कर्ष (14 सितंबर), और मूसा के द्वारा अंतिम न्याय और प्रभु के आगमन की ओर दृष्टि।"],qud:["कलीसिया का समर्पण-काल (कूदाश एद्ता)","वर्ष के अंतिम चार सप्ताह। कलीसिया स्वयं पर मसीह को अर्पित दुल्हन और ईश्वर के निवास के रूप में मनन करती है, और स्वर्गीय येरूसालेम में अपनी पूर्णता की ओर देखती है।"]},
 te:{sub:["మంగళవార్త–జనన కాలం (సుబారా–యల్దా)","రక్షణ ప్రకటనలతో ఆరాధనా సంవత్సరం మొదలవుతుంది: జెకర్యాకు, మరియకు, యోసేపుకు. సుమారు నాలుగు వారాలు శరీరధారణలో నెరవేరిన దేవుని వాగ్దానాలను శ్రీసభ ధ్యానించి, తరువాత ప్రభువు జననాన్ని కొనియాడుతుంది."],den:["ప్రత్యక్షత కాలం (దెన్హా)","దెన్హా అంటే ఉదయం, ప్రత్యక్షత. త్రిత్వైక దేవుడు ప్రత్యక్షమైన యొర్దాను జ్ఞానస్నానం నుండి, లోకానికి ప్రత్యక్షమైన క్రీస్తును శ్రీసభ ధ్యానిస్తుంది."],fast:["మహా ఉపవాస కాలం (సౌమా రబ్బా)","ప్రార్థన, ఉపవాసం, దానధర్మాల యాభై రోజులు; ఎడారి ఉపవాసం నుండి శ్రమలు, మరణం, సమాధి వరకు క్రీస్తును అనుసరిస్తూ, పవిత్ర వారంతో ముగుస్తుంది."],qyam:["పునరుత్థాన కాలం (ఖియామ్తా)","పాస్కా ఆనందపు ఏడు వారాలు. పునరుత్థాన ప్రభువునూ, శిష్యులకు ఆయన దర్శనాలనూ, జ్ఞానస్నానపు నూతన జీవితాన్నీ పెంతెకోస్తు వరకు శ్రీసభ కొనియాడుతుంది."],sliha:["అపోస్తలుల కాలం (శ్లీహా)","పెంతెకోస్తు నుండి పవిత్రాత్మ రాకడనూ, అపోస్తలుల బోధనూ శ్రీసభ జ్ఞాపకం చేసుకుంటుంది: శ్రీసభ జననం, ప్రేషిత కార్యం; మన అపోస్తలుడు తోమాసు కూడా ఇందులో గౌరవించబడతారు (దుక్రానా, జూలై 3)."],qaita:["వేసవి కాలం (ఖైతా)","ఖైతా అంటే వేసవి, ఫలాల కాలం. అపోస్తలుల, హతసాక్షుల, పునీతుల సాక్ష్యం ద్వారా శ్రీసభ తన ఎదుగుదలనూ ఫలవంతతనూ ధ్యానిస్తుంది."],esm:["ఏలీయా–సిలువ–మోషే కాలం","ఒకే కాలంలో మూడు విషయాలు: పరలోకానికి కొనిపోబడిన ఏలీయా, సిలువ ఔన్నత్యం (సెప్టెంబరు 14), మోషే ద్వారా అంత్య తీర్పు, ప్రభువు రాకడ వైపు చూపు."],qud:["శ్రీసభ ప్రతిష్ఠ కాలం (ఖూదాశ్ ఏద్తా)","సంవత్సరపు చివరి నాలుగు వారాలు. క్రీస్తుకు అర్పించబడిన వధువుగా, దేవుని నివాసంగా శ్రీసభ తనను తాను ధ్యానించుకుని, పరలోక యెరూషలేములో తన పరిపూర్ణత వైపు చూస్తుంది."]}};
function smcSeason(k){
 var t=parseISO(k);
 for(var i=0;i<70;i++){var x=SMC[iso(t-i*DAY)];if(!x)continue;var s=x.t.join(" ");
  if(/Annunciation|Nativity/.test(s))return "sub";if(/Denha|Epiphany/.test(s))return "den";if(/Great Fast|Passion|Great Saturday|Hosanna|Pesaha/.test(s))return "fast";
  if(/Resurrection|Easter/.test(s))return "qyam";if(/Apostles/.test(s))return "sliha";if(/Kaitha/.test(s))return "qaita";if(/Elijah|Cross|Moses|Transfiguration/.test(s))return "esm";if(/Dedication/.test(s))return "qud";}
 return "";
}

var HOW={
 en:{t:"How to use this page",intro:"Everything is on one page. Here is how to find your way.",
  steps:[["Choose your rite and language","Use the rite box at the top (Syro-Malabar, Syro-Malankara or Latin), then tap your language. The page remembers your choice for next time."],
   ["⌂ Today: come back home","From any page (Saints, Papal documents, Special occasions, or another date), tap ⌂ Today at the top, or the title Daily Word, to return to today's readings."],
   ["Go to any day","Use ‹ and › for the previous or next day, tap 📅 to pick any date, or tap Today. The week strip shows each day with its feast and the saints remembered in your rite; tap a day to open it, and use ‹ › beside the week's name to move by a week."],
   ["Open the three tabs","Word of the day: the day at a glance, the readings, reflection, the Fathers, Church teaching and saints. Preach & teach: choose 1. Homily outline (points and Scripture), 2. Full homily text with a children's homily and a post to share, 3. Prayer meeting, 4. Catechism. Know your liturgy: lessons and words of the liturgy."],
   ["Tap to learn more","Tap the name of the season (just above the day's title) for a short explanation and the meaning of the liturgical colour. In At a glance, tap a saint's name to open that saint's page."],
   ["Saints","The Saints button opens the saints of your rite. Choose a saint from the list, or see the month day by day. Each saint has the life, lessons, stories (marked History, Tradition or Legend), words to remember, a sermon outline and homily, and a prayer. “Feast day in the calendar” takes you to the readings of that day."],
   ["Search","Type a date, a feast, a saint, a Bible book or any word in your language. Saints and special occasions appear first, then the days. Tap a result to open it."],
   ["Read comfortably and share","A− and A+ change the text size. In Preach & teach (2. Full homily text), “Copy post” copies a short message ready for WhatsApp or Telegram."],
   ["Papal documents and Special occasions","Papal documents lists the encyclicals and other documents of the Popes, with links to the latest news, audiences and messages from the Vatican. Special occasions has sermons for sacraments, funerals, jubilees and more."],
   ["Write to us","At the bottom of the page, the buttons for a prayer intention, a suggestion or a comment open Gmail on a computer or your email app on a phone, with the address already filled in. You can also copy the address and write from any email."]],
  bible:"Bible quotations: POC Bible (Malayalam), NRSV (English), Einheitsübersetzung (German), CEI 2008 (Italian), Tiruviviliam CLT (Tamil), Hindi Catholic Bible (Hindi)."},
 ml:{t:"ഈ പേജ് ഉപയോഗിക്കേണ്ട വിധം",intro:"എല്ലാം ഒരു പേജിലാണ്. വഴി കണ്ടെത്താൻ ഇതാ:",
  steps:[["റീത്തും ഭാഷയും തിരഞ്ഞെടുക്കുക","മുകളിലെ റീത്ത് കള്ളിയിൽനിന്നു സീറോ മലബാർ, സീറോ മലങ്കര, ലത്തീൻ ഇവയിലൊന്നു തിരഞ്ഞെടുക്കുക; പിന്നെ ഭാഷയിൽ തൊടുക. അടുത്ത തവണയ്ക്കായി പേജ് നിങ്ങളുടെ തിരഞ്ഞെടുപ്പ് ഓർത്തുവയ്ക്കും."],
   ["⌂ ഇന്ന്: തിരികെ വരാൻ","ഏതു പേജിൽനിന്നും (വിശുദ്ധർ, മാർപാപ്പമാരുടെ രേഖകൾ, വിശേഷാവസരങ്ങൾ, മറ്റൊരു തീയതി) മുകളിലെ “⌂ ഇന്ന്” അല്ലെങ്കിൽ “അനുദിന വചനം” എന്ന തലക്കെട്ട് അമർത്തിയാൽ ഇന്നത്തെ വായനകളിലേക്കു തിരികെയെത്താം."],
   ["ഏതു ദിവസത്തിലേക്കും പോകുക","തലേദിവസത്തിനും പിറ്റേദിവസത്തിനും ‹ › ഉപയോഗിക്കുക; ഏതു തീയതിയും തിരഞ്ഞെടുക്കാൻ 📅 അമർത്തുക; അല്ലെങ്കിൽ “ഇന്ന്” അമർത്തുക. ആഴ്ചയുടെ നിരയിൽ ഓരോ ദിവസവും അതിന്റെ തിരുനാളും നിങ്ങളുടെ റീത്തിൽ ഓർമിക്കുന്ന വിശുദ്ധരും കാണാം; ദിവസം തുറക്കാൻ അതിൽ തൊടുക. ആഴ്ചയുടെ പേരിനിരുവശവുമുള്ള ‹ › ഉപയോഗിച്ച് ഓരോ ആഴ്ചയായി നീങ്ങാം."],
   ["മൂന്നു വിഭാഗങ്ങൾ തുറക്കുക","ഇന്നത്തെ വചനം: ഒറ്റനോട്ടത്തിൽ, വായനകൾ, വിചിന്തനം, സഭാപിതാക്കന്മാർ, സഭാപ്രബോധനം, വിശുദ്ധർ. പ്രസംഗവും പഠനവും: 1. പ്രസംഗരൂപരേഖ (ആശയങ്ങളും തിരുവചനവും), 2. കുട്ടികൾക്കുള്ള പ്രസംഗവും പങ്കുവയ്ക്കാനുള്ള പോസ്റ്റും ഉൾപ്പെടെ പ്രസംഗത്തിന്റെ പൂർണരൂപം, 3. പ്രാർഥനാകൂട്ടായ്മ, 4. മതബോധനം. ആരാധനക്രമം അറിയാൻ: ആരാധനക്രമത്തിലെ പാഠങ്ങളും വാക്കുകളും."],
   ["കൂടുതൽ അറിയാൻ തൊടുക","കാലത്തിന്റെ പേരിൽ (ദിവസത്തിന്റെ തലക്കെട്ടിനു തൊട്ടുമുകളിൽ) തൊട്ടാൽ ചെറിയ വിശദീകരണവും ആരാധനക്രമ നിറത്തിന്റെ അർഥവും കാണാം. “ഒറ്റനോട്ടത്തിൽ” എന്ന ഭാഗത്തുള്ള വിശുദ്ധന്റെ പേരിൽ തൊട്ടാൽ ആ വിശുദ്ധന്റെ പേജ് തുറക്കും."],
   ["വിശുദ്ധർ","“വിശുദ്ധർ” ബട്ടൺ നിങ്ങളുടെ റീത്തിലെ വിശുദ്ധരെ കാണിക്കുന്നു. പട്ടികയിൽനിന്ന് ഒരു വിശുദ്ധനെ തിരഞ്ഞെടുക്കാം, അല്ലെങ്കിൽ മാസം മുഴുവൻ ദിവസംതോറും കാണാം. ഓരോ വിശുദ്ധനും ജീവിതം, പാഠങ്ങൾ, കഥകൾ (ചരിത്രം, പാരമ്പര്യം, ഐതിഹ്യം എന്നു വേർതിരിച്ച്), ഓർമിക്കാൻ ചില വാക്കുകൾ, പ്രസംഗരൂപരേഖയും പ്രസംഗവും, പ്രാർഥന എന്നിവയുണ്ട്. “കലണ്ടറിലെ തിരുനാൾ ദിനം” ആ ദിവസത്തെ വായനകളിലേക്കു കൊണ്ടുപോകും."],
   ["തിരയുക","തിരയൽക്കള്ളിയിൽ തീയതി, തിരുനാൾ, വിശുദ്ധൻ, ബൈബിൾ പുസ്തകം, അല്ലെങ്കിൽ ഏതെങ്കിലും വാക്ക് നിങ്ങളുടെ ഭാഷയിൽ ടൈപ്പ് ചെയ്യുക. ആദ്യം വിശുദ്ധരും വിശേഷാവസരങ്ങളും, തുടർന്നു ദിവസങ്ങളും കാണാം. തുറക്കാൻ ഫലത്തിൽ തൊടുക."],
   ["സുഖമായി വായിക്കുക, പങ്കുവയ്ക്കുക","A−, A+ അക്ഷരവലുപ്പം മാറ്റുന്നു. “പ്രസംഗവും പഠനവും” വിഭാഗത്തിലെ (2. പൂർണരൂപം) “പോസ്റ്റ് പകർത്തുക” വാട്സാപ്പിലോ ടെലിഗ്രാമിലോ അയയ്ക്കാൻ തയ്യാറായ ഒരു ചെറിയ സന്ദേശം പകർത്തുന്നു."],
   ["മാർപാപ്പമാരുടെ രേഖകളും വിശേഷാവസരങ്ങളും","“മാർപാപ്പമാരുടെ രേഖകൾ” ചാക്രികലേഖനങ്ങളും മറ്റു രേഖകളും, വത്തിക്കാനിൽനിന്നുള്ള പുതിയ വാർത്തകളിലേക്കും പ്രഭാഷണങ്ങളിലേക്കും സന്ദേശങ്ങളിലേക്കുമുള്ള ലിങ്കുകളോടൊപ്പം നൽകുന്നു. “വിശേഷാവസരങ്ങൾ” കൂദാശകൾ, മൃതസംസ്കാരം, ജൂബിലി തുടങ്ങിയവയ്ക്കുള്ള പ്രസംഗങ്ങൾ നൽകുന്നു."],
   ["ഞങ്ങൾക്ക് എഴുതുക","പേജിന്റെ ഏറ്റവും താഴെയുള്ള പ്രാർഥനാനിയോഗം, നിർദേശം, അഭിപ്രായം എന്നീ ബട്ടണുകൾ കമ്പ്യൂട്ടറിൽ ജിമെയിലും ഫോണിൽ ഇമെയിൽ ആപ്പും വിലാസം ചേർത്തു തുറക്കുന്നു. വിലാസം പകർത്തി ഏത് ഇമെയിലിൽനിന്നും എഴുതുകയും ചെയ്യാം."]],
  bible:"ബൈബിൾ ഉദ്ധരണികൾ: പി.ഒ.സി. ബൈബിൾ (മലയാളം), NRSV (ഇംഗ്ലീഷ്), ഐൻഹൈറ്റ്സ്യൂബർസെറ്റ്സുങ് (ജർമൻ), CEI 2008 (ഇറ്റാലിയൻ), തിരുവിവിലിയം CLT (തമിഴ്), ഹിന്ദി കത്തോലിക്കാ ബൈബിൾ (ഹിന്ദി)."},
 de:{t:"So benutzen Sie diese Seite",intro:"Alles befindet sich auf einer Seite. So finden Sie sich zurecht.",
  steps:[["Ritus und Sprache wählen","Wählen Sie oben im Ritus-Feld Syro-Malabarisch, Syro-Malankarisch oder Lateinisch und tippen Sie dann auf Ihre Sprache. Die Seite merkt sich Ihre Wahl."],
   ["⌂ Heute: zurück zum Anfang","Von jeder Seite aus (Heilige, Päpstliche Dokumente, Besondere Anlässe oder ein anderes Datum) bringt Sie „⌂ Heute“ oben oder ein Tippen auf den Titel zu den Lesungen von heute zurück."],
   ["Zu jedem Tag gehen","Mit ‹ und › gehen Sie einen Tag zurück oder vor; mit 📅 wählen Sie jedes Datum; „Heute“ bringt Sie zurück. Die Wochenleiste zeigt für jeden Tag das Fest und die Heiligen Ihres Ritus; tippen Sie auf einen Tag, um ihn zu öffnen. Mit ‹ › neben dem Namen der Woche blättern Sie wochenweise."],
   ["Die drei Bereiche öffnen","Wort des Tages: der Tag auf einen Blick, die Lesungen, Betrachtung, Kirchenväter, Lehre der Kirche und Heilige. Predigen & lehren: 1. Predigtgliederung (Punkte und Schrift), 2. Predigt mit Kinderpredigt und einem Text zum Teilen, 3. Gebetskreis, 4. Katechese. Liturgie verstehen: Lektionen und Begriffe der Liturgie."],
   ["Mehr erfahren","Tippen Sie auf den Namen der liturgischen Zeit (über dem Titel des Tages) für eine kurze Erklärung und die Bedeutung der liturgischen Farbe. Unter „Auf einen Blick“ öffnet ein Tippen auf den Namen eines Heiligen dessen Seite."],
   ["Heilige","Die Schaltfläche „Heilige“ zeigt die Heiligen Ihres Ritus. Wählen Sie einen Heiligen aus der Liste oder sehen Sie den Monat Tag für Tag. Zu jedem Heiligen gibt es Leben, Lehren, Erzählungen (gekennzeichnet als Geschichte, Überlieferung oder Legende), Worte zum Merken, eine Predigtgliederung mit Predigt und ein Gebet. „Festtag im Kalender“ führt zu den Lesungen dieses Tages."],
   ["Suchen","Geben Sie ein Datum, ein Fest, einen Heiligen, ein biblisches Buch oder ein Wort in Ihrer Sprache ein. Zuerst erscheinen Heilige und besondere Anlässe, dann die Tage. Tippen Sie auf ein Ergebnis, um es zu öffnen."],
   ["Bequem lesen und teilen","A− und A+ ändern die Schriftgröße. Unter „Predigen & lehren“ (2. Predigt) kopiert „Text kopieren“ eine kurze Nachricht für WhatsApp oder Telegram."],
   ["Päpstliche Dokumente und besondere Anlässe","„Päpstliche Dokumente“ enthält Enzykliken und andere Dokumente der Päpste mit Links zu aktuellen Nachrichten, Audienzen und Botschaften aus dem Vatikan. „Besondere Anlässe“ bietet Predigten für Sakramente, Beerdigungen, Jubiläen und mehr."],
   ["Schreiben Sie uns","Ganz unten öffnen die Schaltflächen für Gebetsanliegen, Vorschlag oder Kommentar am Computer Gmail und am Telefon Ihre E-Mail-App, mit bereits eingetragener Adresse. Sie können die Adresse auch kopieren und von jeder E-Mail aus schreiben."]],
  bible:"Bibelzitate: Einheitsübersetzung (Deutsch)."},
 it:{t:"Come usare questa pagina",intro:"Tutto si trova in una sola pagina. Ecco come orientarsi.",
  steps:[["Scegliete rito e lingua","Nella casella del rito in alto scegliete Siro-malabarese, Siro-malankarese o Latino, poi toccate la vostra lingua. La pagina ricorda la vostra scelta."],
   ["⌂ Oggi: tornare all'inizio","Da qualsiasi pagina (Santi, Documenti pontifici, Occasioni speciali o un'altra data), toccate “⌂ Oggi” in alto, oppure il titolo, per tornare alle letture di oggi."],
   ["Andate a qualsiasi giorno","Con ‹ e › andate al giorno precedente o successivo; con 📅 scegliete qualsiasi data; “Oggi” vi riporta indietro. La striscia della settimana mostra per ogni giorno la festa e i santi ricordati nel vostro rito; toccate un giorno per aprirlo. Con ‹ › accanto al nome della settimana vi spostate di una settimana."],
   ["Aprite le tre sezioni","Parola del giorno: il giorno in breve, le letture, la riflessione, i Padri, l'insegnamento della Chiesa e i santi. Predicare e insegnare: 1. Schema dell'omelia (punti e Scrittura), 2. Omelia completa con omelia per i bambini e un testo da condividere, 3. Gruppo di preghiera, 4. Catechesi. Conoscere la liturgia: lezioni e parole della liturgia."],
   ["Toccate per saperne di più","Toccate il nome del tempo liturgico (sopra il titolo del giorno) per una breve spiegazione e il significato del colore liturgico. In “A colpo d’occhio”, toccate il nome di un santo per aprire la sua pagina."],
   ["Santi","Il pulsante “Santi” mostra i santi del vostro rito. Scegliete un santo dall'elenco, oppure vedete il mese giorno per giorno. Per ogni santo ci sono la vita, gli insegnamenti, i racconti (indicati come Storia, Tradizione o Leggenda), parole da ricordare, uno schema di omelia con l'omelia e una preghiera. “Giorno della festa nel calendario” vi porta alle letture di quel giorno."],
   ["Cercate","Scrivete una data, una festa, un santo, un libro biblico o una parola nella vostra lingua. Prima compaiono i santi e le occasioni speciali, poi i giorni. Toccate un risultato per aprirlo."],
   ["Leggete con comodo e condividete","A− e A+ cambiano la dimensione del testo. In “Predicare e insegnare” (2. Omelia), “Copia il testo” copia un breve messaggio per WhatsApp o Telegram."],
   ["Documenti pontifici e occasioni speciali","“Documenti pontifici” elenca le encicliche e gli altri documenti dei Papi, con collegamenti alle ultime notizie, udienze e messaggi dal Vaticano. “Occasioni speciali” offre omelie per sacramenti, funerali, giubilei e altro."],
   ["Scriveteci","In fondo alla pagina, i pulsanti per un'intenzione di preghiera, un suggerimento o un commento aprono Gmail sul computer o l'app di posta sul telefono, con l'indirizzo già inserito. Potete anche copiare l'indirizzo e scrivere da qualsiasi e-mail."]],

 ta:{t:"இந்தப் பக்கத்தைப் பயன்படுத்தும் முறை",intro:"எல்லாமே ஒரே பக்கத்தில் உள்ளன. வழியைக் கண்டுபிடிக்க இதோ:",
  steps:[["வழிபாட்டு முறையையும் மொழியையும் தேர்ந்தெடுங்கள்","மேலே உள்ள வழிபாட்டு முறைப் பெட்டியில் சீரோ-மலபார், சீரோ-மலங்கரா அல்லது இலத்தீன் என்பதைத் தேர்ந்தெடுத்து, பின்னர் உங்கள் மொழியைத் தொடுங்கள். அடுத்த முறைக்காகப் பக்கம் உங்கள் தேர்வை நினைவில் வைத்துக்கொள்ளும்."],
   ["⌂ இன்று: முதல் பக்கத்துக்குத் திரும்ப","எந்தப் பக்கத்திலிருந்தும் (புனிதர்கள், திருத்தந்தையரின் ஆவணங்கள், சிறப்பு நிகழ்வுகள் அல்லது வேறு தேதி) மேலே உள்ள “⌂ இன்று” அல்லது தலைப்பைத் தொட்டால் இன்றைய வாசகங்களுக்குத் திரும்பலாம்."],
   ["எந்த நாளுக்கும் செல்லுங்கள்","முந்தைய அல்லது அடுத்த நாளுக்கு ‹ › பயன்படுத்துங்கள்; எந்தத் தேதியையும் தேர்ந்தெடுக்க 📅 தொடுங்கள்; அல்லது “இன்று” தொடுங்கள். வாரப் பட்டையில் ஒவ்வொரு நாளும் அதன் திருநாளும் உங்கள் வழிபாட்டு முறையில் நினைவுகூரப்படும் புனிதர்களும் தெரியும்; ஒரு நாளைத் திறக்க அதைத் தொடுங்கள். வாரத்தின் பெயருக்கு அருகிலுள்ள ‹ › மூலம் வாரம் வாரமாகச் செல்லலாம்."],
   ["மூன்று பகுதிகளைத் திறவுங்கள்","இன்றைய இறைவார்த்தை: ஒரே பார்வையில் இன்று, வாசகங்கள், சிந்தனை, திருச்சபைத் தந்தையர், திருச்சபைப் போதனை, புனிதர்கள். மறையுரையும் மறைக்கல்வியும்: 1. மறையுரைக் குறிப்புகள் (கருத்துகளும் இறைவார்த்தையும்), 2. குழந்தைகள் மறையுரையும் பகிர்வதற்கான செய்தியும் கொண்ட முழு மறையுரை, 3. செபக் கூட்டம், 4. மறைக்கல்வி. வழிபாட்டை அறிவோம்: வழிபாட்டின் பாடங்களும் சொற்களும்."],
   ["மேலும் அறியத் தொடுங்கள்","காலத்தின் பெயரைத் (நாளின் தலைப்புக்கு மேலே) தொட்டால் சுருக்கமான விளக்கமும் வழிபாட்டு நிறத்தின் பொருளும் தெரியும். “ஒரே பார்வையில்” பகுதியில் புனிதரின் பெயரைத் தொட்டால் அவரது பக்கம் திறக்கும்."],
   ["புனிதர்கள்","“புனிதர்கள்” பொத்தான் உங்கள் வழிபாட்டு முறையின் புனிதர்களைக் காட்டும். பட்டியலிலிருந்து ஒரு புனிதரைத் தேர்ந்தெடுக்கலாம், அல்லது மாதம் முழுவதையும் நாள்வாரியாகப் பார்க்கலாம். ஒவ்வொரு புனிதருக்கும் வாழ்க்கை, பாடங்கள், கதைகள் (வரலாறு, மரபு, புனைவுக் கதை எனக் குறிக்கப்பட்டவை), நினைவில் கொள்ள வேண்டியவை, மறையுரைக் குறிப்புகளும் மறையுரையும், செபம் ஆகியவை உண்டு. “நாள்காட்டியில் திருநாள்” அந்த நாளின் வாசகங்களுக்கு அழைத்துச் செல்லும்."],
   ["தேடுங்கள்","தேதி, திருநாள், புனிதர், விவிலிய நூல் அல்லது ஏதாவது ஒரு சொல்லை உங்கள் மொழியில் தட்டச்சு செய்யுங்கள். முதலில் புனிதர்களும் சிறப்பு நிகழ்வுகளும், பின்னர் நாள்களும் தோன்றும். திறக்க ஒரு முடிவைத் தொடுங்கள்."],
   ["வசதியாக வாசித்துப் பகிருங்கள்","A−, A+ எழுத்தின் அளவை மாற்றும். “மறையுரையும் மறைக்கல்வியும்” பகுதியில் (2. முழு மறையுரை) “நகலெடு” வாட்ஸ்அப் அல்லது டெலிகிராமுக்கான சிறு செய்தியை நகலெடுக்கும்."],
   ["திருத்தந்தையரின் ஆவணங்களும் சிறப்பு நிகழ்வுகளும்","“திருத்தந்தையரின் ஆவணங்கள்” சுற்றுமடல்களையும் பிற ஆவணங்களையும், வத்திக்கானின் புதிய செய்திகள், உரைகள், செய்திகளுக்கான இணைப்புகளுடன் தரும். “சிறப்பு நிகழ்வுகள்” அருளடையாளங்கள், அடக்கச் சடங்கு, யூபிலி போன்றவற்றுக்கான மறையுரைகளைத் தரும்."],
   ["எங்களுக்கு எழுதுங்கள்","பக்கத்தின் அடியில் உள்ள செபக் கருத்து, ஆலோசனை, கருத்து ஆகிய பொத்தான்கள் கணினியில் ஜிமெயிலையும் கைப்பேசியில் மின்னஞ்சல் செயலியையும் முகவரியுடன் திறக்கும். முகவரியை நகலெடுத்து எந்த மின்னஞ்சலிலிருந்தும் எழுதலாம்."]],
  bible:"விவிலிய மேற்கோள்கள்: திருவிவிலியம் (பொது மொழிபெயர்ப்பு, CLT)."},
 hi:{t:"इस पृष्ठ का उपयोग कैसे करें",intro:"सब कुछ एक ही पृष्ठ पर है। रास्ता ऐसे खोजें:",
  steps:[["अपनी रीति और भाषा चुनें","ऊपर रीति के बॉक्स में सीरो-मलबार, सीरो-मलंकरा या लैटिन चुनें, फिर अपनी भाषा छुएँ। अगली बार के लिए पृष्ठ आपकी पसंद याद रखेगा।"],
   ["⌂ आज: वापस मुख्य पृष्ठ पर","किसी भी पृष्ठ से (संत, संत पापाओं के दस्तावेज़, विशेष अवसर या कोई और तारीख़) ऊपर “⌂ आज” या शीर्षक को छूकर आज के पाठों पर लौटें।"],
   ["किसी भी दिन पर जाएँ","पिछले या अगले दिन के लिए ‹ › का उपयोग करें; कोई भी तारीख़ चुनने के लिए 📅 छुएँ; या “आज” छुएँ। सप्ताह की पट्टी में हर दिन का पर्व और आपकी रीति में स्मरण किए जाने वाले संत दिखते हैं; दिन खोलने के लिए उसे छुएँ। सप्ताह के नाम के पास के ‹ › से एक-एक सप्ताह आगे-पीछे जाएँ।"],
   ["तीन भाग खोलें","आज का वचन: एक नज़र में आज, पाठ, मनन, कलीसिया के आचार्य, कलीसिया की शिक्षा और संत। प्रवचन और शिक्षा: 1. प्रवचन रूपरेखा (बिंदु और धर्मग्रंथ), 2. बच्चों के प्रवचन और साझा करने के संदेश सहित पूरा प्रवचन, 3. प्रार्थना सभा, 4. धर्मशिक्षा। धर्मविधि को जानें: धर्मविधि के पाठ और शब्द।"],
   ["और जानने के लिए छुएँ","ऋतु के नाम (दिन के शीर्षक के ठीक ऊपर) को छूकर छोटी व्याख्या और धर्मविधिक रंग का अर्थ देखें। “एक नज़र में” भाग में किसी संत के नाम को छूकर उनका पृष्ठ खोलें।"],
   ["संत","“संत” बटन आपकी रीति के संतों को दिखाता है। सूची से कोई संत चुनें, या पूरे महीने को दिन-प्रतिदिन देखें। हर संत के लिए जीवन, शिक्षाएँ, कथाएँ (इतिहास, परंपरा या किंवदंती के रूप में चिह्नित), याद रखने योग्य वचन, प्रवचन रूपरेखा और प्रवचन, और प्रार्थना है। “पंचांग में पर्व का दिन” उस दिन के पाठों पर ले जाता है।"],
   ["खोजें","कोई तारीख़, पर्व, संत, बाइबिल ग्रंथ या कोई भी शब्द अपनी भाषा में लिखें। पहले संत और विशेष अवसर, फिर दिन दिखते हैं। खोलने के लिए परिणाम को छुएँ।"],
   ["आराम से पढ़ें और साझा करें","A− और A+ अक्षरों का आकार बदलते हैं। “प्रवचन और शिक्षा” (2. पूरा प्रवचन) में “कॉपी करें” व्हाट्सऐप या टेलीग्राम के लिए एक छोटा संदेश कॉपी करता है।"],
   ["संत पापाओं के दस्तावेज़ और विशेष अवसर","“संत पापाओं के दस्तावेज़” में विश्वपत्र और अन्य दस्तावेज़ हैं, वाटिकन के ताज़ा समाचारों, प्रवचनों और संदेशों की कड़ियों के साथ। “विशेष अवसर” में संस्कारों, अंतिम संस्कार, जयंती आदि के प्रवचन हैं।"],
   ["हमें लिखें","पृष्ठ के सबसे नीचे प्रार्थना-निवेदन, सुझाव और टिप्पणी के बटन कंप्यूटर पर जीमेल और फ़ोन पर ईमेल ऐप, पता भरा हुआ, खोलते हैं। आप पता कॉपी करके किसी भी ईमेल से भी लिख सकते हैं।"]],
  bible:"बाइबिल उद्धरण: हिन्दी काथलिक बाइबिल।"}
};

smc:{
 en:[["Holy Qurbana","Syriac for “offering”. The Eucharistic liturgy of the Syro-Malabar Church, which belongs to the East Syriac tradition received from the Church of the East."],
  ["Raza","“Mystery”. The most solemn form of the Holy Qurbana, celebrated on great feasts."],
  ["Thaksa","“Order”. The liturgical book containing the text of the Holy Qurbana."],
  ["Madbaha","The sanctuary, where the altar stands. It is raised and set apart, a sign of heaven."],
  ["Qestroma","The space between the sanctuary and the nave, a sign of paradise between heaven and earth."],
  ["Hykala","The nave, where the faithful stand. It is a sign of the earth, and of the people of God on pilgrimage."],
  ["Bema","In the ancient East Syriac church, a raised platform in the middle of the nave from which the Word of God was proclaimed."],
  ["Mar Thoma Sleeva","The St Thomas Cross: a cross without the body of Christ, with a dove above it, often standing on a lotus. It proclaims the risen Christ and the gift of the Holy Spirit."],
  ["Anaphora of Mar Addai and Mar Mari","One of the most ancient Eucharistic prayers of the Church, attributed to the apostles of Edessa; the principal anaphora of the Syro-Malabar Qurbana."],
  ["Lakhu Mara","“To you, O Lord”. A hymn of praise to Christ sung near the beginning of the Holy Qurbana."],
  ["Karozutha","A litany proclaimed by the deacon or server, to which the people answer with a short response."],
  ["Onitha","A hymn or antiphon of the liturgy. The “Onitha d'Raze” is sung during the procession with the gifts."],
  ["Dukrana","“Commemoration”. The feast of a saint, usually the day of his or her death. The Dukrana of St Thomas is kept on 3 July."],
  ["Ramsa, Lelya, Sapra","The evening, night and morning prayers of the Liturgy of the Hours in the East Syriac tradition."],
  ["Moonnu Nombu","The three-day fast of the Ninevites, kept from Monday to Wednesday of the third week before the Great Fast (Jonah 3)."],
  ["Pesaha","“Passover”. Maundy Thursday, when the Lord instituted the Holy Qurbana. In Kerala homes the Pesaha appam and paal are blessed and shared."]],
 ml:[["വിശുദ്ധ കുർബാന","“കാഴ്ചവയ്പ്” എന്നർഥമുള്ള സുറിയാനിപദം. പൗരസ്ത്യസുറിയാനി പാരമ്പര്യത്തിൽപ്പെട്ട സീറോ മലബാർ സഭയുടെ ദിവ്യകാരുണ്യ ആരാധനക്രമം."],
  ["റാസ","“രഹസ്യം”. വലിയ തിരുനാളുകളിൽ അർപ്പിക്കുന്ന വിശുദ്ധ കുർബാനയുടെ ഏറ്റവും ആഘോഷമായ രൂപം."],
  ["തക്സ","“ക്രമം”. വിശുദ്ധ കുർബാനയുടെ പാഠമടങ്ങിയ ആരാധനക്രമഗ്രന്ഥം."],
  ["മദ്ബഹാ","ബലിപീഠം സ്ഥിതിചെയ്യുന്ന ശ്രീകോവിൽ. ഉയർത്തി വേർതിരിച്ചിരിക്കുന്ന ഇതു സ്വർഗത്തിന്റെ പ്രതീകമാണ്."],
  ["ഖസ്രോമ","ശ്രീകോവിലിനും ദേവാലയാങ്കണത്തിനും ഇടയിലുള്ള ഭാഗം; സ്വർഗത്തിനും ഭൂമിക്കും ഇടയിലുള്ള പറുദീസായുടെ പ്രതീകം."],
  ["ഹൈക്കല","വിശ്വാസികൾ നിൽക്കുന്ന ദേവാലയാങ്കണം. ഭൂമിയുടെയും തീർഥാടകരായ ദൈവജനത്തിന്റെയും പ്രതീകം."],
  ["ബേമ്മ","പുരാതന പൗരസ്ത്യസുറിയാനി ദേവാലയങ്ങളിൽ ദേവാലയാങ്കണത്തിന്റെ മധ്യത്തിലുണ്ടായിരുന്ന ഉയർന്ന വേദി; അവിടെനിന്നാണു ദൈവവചനം പ്രഘോഷിച്ചിരുന്നത്."],
  ["മാർ തോമാ സ്ലീവാ","ക്രിസ്തുവിന്റെ ശരീരമില്ലാത്ത, മുകളിൽ പ്രാവും പലപ്പോഴും താമരയിൽ നിൽക്കുന്നതുമായ കുരിശ്. ഉത്ഥിതനായ ക്രിസ്തുവിനെയും പരിശുദ്ധാത്മാവിന്റെ ദാനത്തെയും അതു പ്രഘോഷിക്കുന്നു."],
  ["മാർ അദ്ദായിയുടെയും മാർ മാറിയുടെയും അനാഫൊറ","എദേസ്സായിലെ ശ്ലീഹന്മാരുടെ പേരിലുള്ള, സഭയിലെ ഏറ്റവും പുരാതനമായ ദിവ്യകാരുണ്യപ്രാർഥനകളിലൊന്ന്; സീറോ മലബാർ കുർബാനയുടെ പ്രധാന അനാഫൊറ."],
  ["ലാക്കുമാറാ","“കർത്താവേ, അങ്ങേക്ക്”. വിശുദ്ധ കുർബാനയുടെ ആരംഭത്തിൽ ആലപിക്കുന്ന ക്രിസ്തുസ്തുതിഗീതം."],
  ["കാറോസൂസ","ശുശ്രൂഷി പ്രഘോഷിക്കുകയും ജനം ചെറിയ പ്രത്യുത്തരം നൽകുകയും ചെയ്യുന്ന പ്രാർഥനാമാലിക."],
  ["ഓനീസ","ആരാധനക്രമത്തിലെ ഗീതം. കാഴ്ചവസ്തുക്കളുടെ പ്രദക്ഷിണസമയത്ത് “ഓനീസ ദ്റാസേ” (രഹസ്യങ്ങളുടെ ഗീതം) ആലപിക്കുന്നു."],
  ["ദുക്റാന","“ഓർമ”. ഒരു വിശുദ്ധന്റെ തിരുനാൾ, സാധാരണയായി മരണദിവസം. മാർ തോമാശ്ലീഹായുടെ ദുക്റാന ജൂലൈ 3-ന്."],
  ["റംശ, ലെലിയ, സപ്ര","പൗരസ്ത്യസുറിയാനി യാമപ്രാർഥനകളിലെ സന്ധ്യാ, രാത്രി, പ്രഭാത പ്രാർഥനകൾ."],
  ["മൂന്നുനോമ്പ്","നിനിവേക്കാരുടെ മൂന്നു ദിവസത്തെ ഉപവാസം; വലിയ നോമ്പിനു മുമ്പുള്ള മൂന്നാം ആഴ്ചയിലെ തിങ്കൾമുതൽ ബുധൻവരെ (യോനാ 3)."],
  ["പെസഹാ","“കടന്നുപോകൽ”. കർത്താവു വിശുദ്ധ കുർബാന സ്ഥാപിച്ച പെസഹാവ്യാഴം. കേരളത്തിലെ ഭവനങ്ങളിൽ പെസഹാ അപ്പവും പാലും ആശീർവദിച്ചു പങ്കുവയ്ക്കുന്നു."]]},
smk:{
 en:[["Holy Qurbono","The Eucharistic liturgy of the Syro-Malankara Catholic Church, in the West Syriac (Antiochene) tradition."],
  ["Anaphora of St James","The Eucharistic prayer attributed to St James, brother of the Lord and first bishop of Jerusalem; the mother of the West Syriac anaphoras. The Malankara liturgy also has a number of other anaphoras."],
  ["Thronos","“Throne”. The altar, the throne of God, on which the holy Mysteries are offered."],
  ["Madbaho","The sanctuary, separated from the nave by a curtain that is drawn and opened at the great moments of the liturgy."],
  ["Promiun and Sedro","The opening prayer (Promiun) and the long expository prayer (Sedro), said with incense, in the Qurbono and in the Hours."],
  ["Hoosoyo","The service of forgiveness and reconciliation with incense, asking God to accept the prayers of his people."],
  ["Qauma","A unit of prayer beginning with the Trisagion, “Holy are you, O God”, followed by “Kurielaison” and the Lord's Prayer."],
  ["Shehimo","The book of daily prayer for ordinary weekdays. The book for Sundays, feasts and seasons is the Penkitho."],
  ["Qolo","A hymn sung to a set melody. The Shehimo is arranged in Qolos that change through the year."],
  ["Bovutho","Petitionary hymns attributed to St Ephrem, St Jacob of Serugh and St Balai, sung in the Hours."],
  ["Thubden","The diptychs: the solemn commemorations in the anaphora of the living, the saints and the faithful departed."],
  ["Qudos Eetho and Hudos Eetho","The Sanctification and the Renewal of the Church: the two Sundays that open the liturgical year."],
  ["Hasho","The Passion. Hasho Week is Holy Week, from Hosanna Sunday to the Resurrection."],
  ["Qyomtho","The Resurrection of the Lord, and the season of fifty days that follows it."],
  ["Sleebo","The Cross. The season of the Holy Cross closes the liturgical year."],
  ["Reunion of 1930","On 20 September 1930 Archbishop Mar Ivanios and his companions entered full communion with the Catholic Church, keeping their West Syriac liturgy. Since 2005 the Church is a Major Archiepiscopal Church, headed by the Major Archbishop-Catholicos."]],
 ml:[["വിശുദ്ധ കുർബാന (ഖുർബോനോ)","പാശ്ചാത്യസുറിയാനി (അന്ത്യോക്യൻ) പാരമ്പര്യത്തിലുള്ള സീറോ മലങ്കര കത്തോലിക്കാസഭയുടെ ദിവ്യകാരുണ്യ ആരാധനക്രമം."],
  ["മാർ യാക്കോബിന്റെ അനാഫൊറ","കർത്താവിന്റെ സഹോദരനും ജറുസലെമിലെ പ്രഥമ മെത്രാനുമായ വിശുദ്ധ യാക്കോബിന്റെ പേരിലുള്ള ദിവ്യകാരുണ്യപ്രാർഥന; പാശ്ചാത്യസുറിയാനി അനാഫൊറകളുടെ മാതാവ്. മലങ്കര ആരാധനക്രമത്തിൽ മറ്റു പല അനാഫൊറകളുമുണ്ട്."],
  ["ത്രോണോസ്","“സിംഹാസനം”. വിശുദ്ധ രഹസ്യങ്ങൾ അർപ്പിക്കപ്പെടുന്ന ബലിപീഠം; ദൈവത്തിന്റെ സിംഹാസനം."],
  ["മദ്ബഹ","ആരാധനയുടെ പ്രധാന നിമിഷങ്ങളിൽ തുറക്കുകയും അടയ്ക്കുകയും ചെയ്യുന്ന തിരശ്ശീലയാൽ ദേവാലയാങ്കണത്തിൽനിന്നു വേർതിരിക്കപ്പെട്ട ശ്രീകോവിൽ."],
  ["പ്രുമിയോനും സെദറായും","ധൂപത്തോടെ ചൊല്ലുന്ന ആമുഖപ്രാർഥനയും (പ്രുമിയോൻ) വിശദമായ പ്രാർഥനയും (സെദറാ); കുർബാനയിലും യാമപ്രാർഥനകളിലും."],
  ["ഹൂസോയോ","തന്റെ ജനത്തിന്റെ പ്രാർഥനകൾ സ്വീകരിക്കാൻ ദൈവത്തോടപേക്ഷിക്കുന്ന, ധൂപത്തോടെയുള്ള പാപമോചന-അനുരഞ്ജന ശുശ്രൂഷ."],
  ["കൗമ","“ദൈവമേ, നീ പരിശുദ്ധനാകുന്നു” എന്ന ത്രിശുദ്ധകീർത്തനത്തോടെ ആരംഭിച്ച്, “കുറിയേലായിസോൻ”, കർതൃപ്രാർഥന എന്നിവയോടെ തുടരുന്ന പ്രാർഥനാഘടകം."],
  ["ശ്ഹീമോ","സാധാരണ ദിവസങ്ങളിലെ യാമപ്രാർഥനാപുസ്തകം. ഞായറാഴ്ചകൾക്കും തിരുനാളുകൾക്കും കാലങ്ങൾക്കുമുള്ളതു പെങ്കീസാ."],
  ["ഖോലോ","നിശ്ചിത ഈണത്തിൽ ആലപിക്കുന്ന ഗീതം. വർഷത്തിലുടനീളം മാറിവരുന്ന ഖോലോകളായി ശ്ഹീമോ ക്രമീകരിച്ചിരിക്കുന്നു."],
  ["ബോവൂസോ","മാർ അപ്രേം, മാർ യാക്കോബ്, മാർ ബാലായി എന്നിവരുടെ പേരിലുള്ള, യാമപ്രാർഥനകളിൽ ആലപിക്കുന്ന യാചനാഗീതങ്ങൾ."],
  ["തുബ്ദേൻ","അനാഫൊറയിൽ ജീവിച്ചിരിക്കുന്നവരെയും വിശുദ്ധരെയും മരിച്ച വിശ്വാസികളെയും ഓർക്കുന്ന ആഘോഷമായ സ്മരണകൾ."],
  ["കൂദോശ് ഈത്തോയും ഹൂദോശ് ഈത്തോയും","സഭയുടെ വിശുദ്ധീകരണവും നവീകരണവും: ആരാധനാവത്സരം തുറക്കുന്ന രണ്ടു ഞായറാഴ്ചകൾ."],
  ["ഹാശാ","“പീഡാനുഭവം”. ഓശാന ഞായർമുതൽ ഉയിർപ്പുവരെയുള്ള ഹാശാആഴ്ച."],
  ["ക്യംതോ","കർത്താവിന്റെ ഉയിർപ്പും അതിനെത്തുടർന്നുള്ള അമ്പതു ദിവസത്തെ കാലവും."],
  ["സ്ലീബാ","“കുരിശ്”. വിശുദ്ധ കുരിശിന്റെ കാലം ആരാധനാവത്സരം അവസാനിപ്പിക്കുന്നു."],
  ["1930-ലെ പുനരൈക്യം","1930 സെപ്റ്റംബർ 20-ന് മാർ ഈവാനിയോസ് മെത്രാപ്പോലീത്തായും സഹചാരികളും തങ്ങളുടെ പാശ്ചാത്യസുറിയാനി ആരാധനക്രമം കാത്തുകൊണ്ടു കത്തോലിക്കാസഭയുമായി പൂർണ കൂട്ടായ്മയിൽ പ്രവേശിച്ചു. 2005 മുതൽ മേജർ ആർച്ച്ബിഷപ്-കാതോലിക്കോസിന്റെ നേതൃത്വത്തിലുള്ള മേജർ ആർക്കിഎപ്പിസ്കോപ്പൽ സഭയാണിത്."]]},
lat:{
 en:[["Holy Mass","The celebration of the Eucharist in the Roman Rite, in two main parts: the Liturgy of the Word and the Liturgy of the Eucharist."],
  ["Lectionary and cycles","Sunday readings follow a three-year cycle (Years A, B and C, with Matthew, Mark and Luke); weekday first readings follow a two-year cycle (I and II)."],
  ["Responsorial Psalm","The psalm sung or said after the first reading, with a refrain repeated by the people. It is part of the Word of God, not an extra song."],
  ["Gospel Acclamation","The “Alleluia” and verse that welcome the Gospel. In Lent another acclamation replaces the Alleluia."],
  ["Homily","The explanation of the readings and the liturgy, given by a bishop, priest or deacon, applying God's Word to life."],
  ["Universal Prayer","The Prayer of the Faithful, in which the people exercise their baptismal priesthood by praying for the Church, the world, those in need and the local community."],
  ["Eucharistic Prayer","The centre of the Mass: the Preface, the Sanctus, the invocation of the Holy Spirit (epiclesis), the institution narrative and consecration, the memorial, the intercessions and the final doxology answered by the great Amen."],
  ["Liturgical colours","Green for Ordinary Time; violet for Advent and Lent; white (or gold) for Christmas, Easter and feasts of the Lord, Mary and non-martyr saints; red for Palm Sunday, Good Friday, Pentecost, the apostles and martyrs."],
  ["Solemnity, Feast, Memorial","The three ranks of celebration. A solemnity is the highest; a memorial may be obligatory or optional."],
  ["Ordinary Time","The numbered weeks of the year outside the great seasons, when the Church follows the public life and teaching of Christ."],
  ["Easter Triduum","The three holy days from the evening Mass of the Lord's Supper on Holy Thursday to Easter Sunday evening: the summit of the liturgical year."],
  ["Liturgy of the Hours","The Church's daily prayer that sanctifies the hours of the day; Morning Prayer (Lauds) and Evening Prayer (Vespers) are its two hinges."],
  ["Ambo, altar, tabernacle","The ambo is the place of the Word; the altar is the place of the sacrifice and the Lord's table; the tabernacle keeps the Blessed Sacrament for the sick and for adoration."],
  ["Advent wreath","A wreath of evergreen with four candles, lit one by one on the Sundays of Advent, marking the growing light as Christmas approaches."]],
 ml:[["ദിവ്യബലി","റോമൻ റീത്തിലെ ദിവ്യകാരുണ്യ ആഘോഷം; വചനശുശ്രൂഷ, ദിവ്യകാരുണ്യശുശ്രൂഷ എന്നീ രണ്ടു പ്രധാന ഭാഗങ്ങൾ."],
  ["വായനാപുസ്തകവും ചക്രങ്ങളും","ഞായറാഴ്ചകളിലെ വായനകൾ മൂന്നു വർഷത്തെ ചക്രം പിന്തുടരുന്നു (A, B, C വർഷങ്ങൾ: മത്തായി, മർക്കോസ്, ലൂക്കാ); വാരദിവസങ്ങളിലെ ഒന്നാം വായന രണ്ടു വർഷത്തെ ചക്രവും (I, II)."],
  ["പ്രതിവചനസങ്കീർത്തനം","ഒന്നാം വായനയ്ക്കുശേഷം ജനം ആവർത്തിക്കുന്ന പല്ലവിയോടെ ആലപിക്കുന്നതോ ചൊല്ലുന്നതോ ആയ സങ്കീർത്തനം. ഇതു ദൈവവചനത്തിന്റെ ഭാഗമാണ്, ഒരു അധികഗാനമല്ല."],
  ["സുവിശേഷപ്രഘോഷണഗീതം","സുവിശേഷത്തെ സ്വാഗതം ചെയ്യുന്ന “അല്ലേലൂയാ”യും വാക്യവും. നോമ്പുകാലത്ത് അല്ലേലൂയായ്ക്കു പകരം മറ്റൊരു പ്രഘോഷണം."],
  ["വചനസന്ദേശം","മെത്രാനോ വൈദികനോ ഡീക്കനോ നൽകുന്ന, വായനകളെയും ആരാധനക്രമത്തെയും വിശദീകരിച്ചു ദൈവവചനം ജീവിതത്തോടു ബന്ധിപ്പിക്കുന്ന പ്രസംഗം."],
  ["വിശ്വാസികളുടെ പ്രാർഥന","സഭയ്ക്കും ലോകത്തിനും ആവശ്യക്കാർക്കും പ്രാദേശികസമൂഹത്തിനുംവേണ്ടി പ്രാർഥിച്ചുകൊണ്ട് ജനം തങ്ങളുടെ മാമ്മോദീസാപൗരോഹിത്യം നിർവഹിക്കുന്ന സാർവത്രികപ്രാർഥന."],
  ["ദിവ്യകാരുണ്യപ്രാർഥന","ദിവ്യബലിയുടെ കേന്ദ്രം: ആമുഖഗീതം, പരിശുദ്ധൻ, പരിശുദ്ധാത്മാവിനെ വിളിച്ചപേക്ഷിക്കൽ, സ്ഥാപനവിവരണവും കൂദാശയും, സ്മരണ, മധ്യസ്ഥപ്രാർഥനകൾ, മഹത്തായ ആമേനോടെ അവസാനിക്കുന്ന സ്തുതി."],
  ["ആരാധനക്രമനിറങ്ങൾ","സാധാരണകാലത്തിനു പച്ച; ആഗമനകാലത്തിനും നോമ്പുകാലത്തിനും വയലറ്റ്; ക്രിസ്മസ്, ഉയിർപ്പുകാലം, കർത്താവിന്റെയും മറിയത്തിന്റെയും രക്തസാക്ഷികളല്ലാത്ത വിശുദ്ധരുടെയും തിരുനാളുകൾക്കു വെള്ള (അല്ലെങ്കിൽ സ്വർണനിറം); ഓശാന ഞായർ, ദുഃഖവെള്ളി, പന്തക്കുസ്താ, ശ്ലീഹന്മാർ, രക്തസാക്ഷികൾ എന്നിവർക്കു ചുവപ്പ്."],
  ["മഹോത്സവം, തിരുനാൾ, ഓർമ","ആഘോഷങ്ങളുടെ മൂന്നു പദവികൾ. മഹോത്സവമാണ് ഏറ്റവും ഉയർന്നത്; ഓർമ നിർബന്ധിതമോ ഐച്ഛികമോ ആകാം."],
  ["സാധാരണകാലം","പ്രധാന കാലങ്ങൾക്കു പുറത്തുള്ള, എണ്ണമിട്ട ആഴ്ചകൾ; ക്രിസ്തുവിന്റെ പരസ്യജീവിതവും പ്രബോധനവും സഭ പിന്തുടരുന്ന കാലം."],
  ["ഉയിർപ്പിന്റെ ത്രിദിനം","പെസഹാവ്യാഴത്തിലെ കർത്താവിന്റെ അത്താഴത്തിന്റെ സന്ധ്യാബലിമുതൽ ഉയിർപ്പുഞായർ സന്ധ്യവരെയുള്ള മൂന്നു വിശുദ്ധ ദിനങ്ങൾ: ആരാധനാവത്സരത്തിന്റെ ഉച്ചസ്ഥാനം."],
  ["യാമപ്രാർഥനകൾ","ദിവസത്തിലെ യാമങ്ങളെ വിശുദ്ധീകരിക്കുന്ന സഭയുടെ അനുദിനപ്രാർഥന; പ്രഭാതപ്രാർഥനയും സന്ധ്യാപ്രാർഥനയുമാണ് അതിന്റെ രണ്ടു തൂണുകൾ."],
  ["വചനവേദി, ബലിപീഠം, സക്രാരി","വചനവേദി ദൈവവചനത്തിന്റെ ഇടം; ബലിപീഠം ബലിയുടെയും കർത്താവിന്റെ മേശയുടെയും ഇടം; രോഗികൾക്കും ആരാധനയ്ക്കുമായി വിശുദ്ധ കുർബാന സൂക്ഷിക്കുന്നതു സക്രാരിയിൽ."],
  ["ആഗമനകാലറീത്ത്","ആഗമനകാലത്തിലെ ഞായറാഴ്ചകളിൽ ഓരോന്നായി കത്തിക്കുന്ന നാലു തിരികളുള്ള നിത്യഹരിതറീത്ത്; ക്രിസ്മസ് അടുക്കുമ്പോൾ വളരുന്ന വെളിച്ചത്തിന്റെ അടയാളം."]]}

smc:[
 ["Holy Qurbana","Syriac for “offering”; in full, Qurbana Qandisha, the Holy Qurbana. The Eucharistic liturgy of the Syro-Malabar Church, which belongs to the East Syriac tradition received from the Church of the East.",
  "വിശുദ്ധ കുർബാന","“കാഴ്ചവയ്പ്” എന്നർഥമുള്ള സുറിയാനിപദം; പൂർണരൂപം “ഖുർബാന ഖന്ദീശാ”, വിശുദ്ധ കുർബാന. പൗരസ്ത്യസുറിയാനി പാരമ്പര്യത്തിൽപ്പെട്ട സീറോ മലബാർ സഭയുടെ ദിവ്യകാരുണ്യ ആരാധനക്രമം."],
 ["Thronos","“Throne”. The altar table in the Madbaha, on which the Holy Qurbana is offered. It is the throne of the risen Lord and a sign of his empty tomb.",
  "ത്രോണോസ്","“സിംഹാസനം”. മദ്ബഹായിൽ വിശുദ്ധ കുർബാന അർപ്പിക്കുന്ന ബലിപീഠം. ഉത്ഥിതനായ മിശിഹായുടെ സിംഹാസനവും അവിടുത്തെ ശൂന്യമായ കല്ലറയുടെ അടയാളവുമാണിത്."],
 ["Sanctuary veil","The curtain that separates the Madbaha from the rest of the church. It is drawn and opened at set moments, showing that heaven is opened to us through the Qurbana.",
  "മദ്ബഹാവിരി","മദ്ബഹായെ ദേവാലയത്തിന്റെ മറ്റു ഭാഗങ്ങളിൽനിന്നു വേർതിരിക്കുന്ന തിരശ്ശീല. നിശ്ചിത സമയങ്ങളിൽ അതു നീക്കുകയും അടയ്ക്കുകയും ചെയ്യുന്നു; കുർബാനയിലൂടെ സ്വർഗം നമുക്കായി തുറക്കപ്പെടുന്നു എന്നതിന്റെ അടയാളം."],
 ["Kasa and Pilasa","The chalice (Kasa) that holds the wine and the paten (Pilasa) that holds the bread. They are consecrated vessels, set apart for the holy Mysteries.",
  "കാസയും പീലാസയും","വീഞ്ഞു വയ്ക്കുന്ന പാനപാത്രമാണു കാസ; അപ്പം വയ്ക്കുന്ന തളികയാണു പീലാസ. വിശുദ്ധ രഹസ്യങ്ങൾക്കായി വേർതിരിച്ചു കൂദാശ ചെയ്ത പാത്രങ്ങളാണിവ."],
 ["Sosappa","The large veil that covers the gifts on the altar. At the beginning of the Anaphora it is lifted and folded, as the gifts are revealed for the offering.",
  "സോസപ്പ","ബലിപീഠത്തിലെ കാഴ്ചവസ്തുക്കളെ മൂടുന്ന വലിയ വിരി. അനാഫൊറയുടെ ആരംഭത്തിൽ അതു മാറ്റി മടക്കിവയ്ക്കുന്നു; അർപ്പണത്തിനായി കാഴ്ചവസ്തുക്കൾ വെളിപ്പെടുന്നു."],
 ["Incense and censer","Incense rises from the censer as a sign of prayer going up to God (Psalm 141:2) and of the sweet fragrance of Christ's sacrifice. The altar, the gifts, the Gospel and the people are incensed.",
  "ധൂപവും ധൂപക്കുറ്റിയും","ധൂപക്കുറ്റിയിൽനിന്ന് ഉയരുന്ന ധൂപം ദൈവസന്നിധിയിലേക്ക് ഉയരുന്ന പ്രാർഥനയുടെയും (സങ്കീ 141:2) മിശിഹായുടെ ബലിയുടെ സൗരഭ്യത്തിന്റെയും അടയാളമാണ്. ബലിപീഠവും കാഴ്ചവസ്തുക്കളും സുവിശേഷവും ജനവും ധൂപിക്കപ്പെടുന്നു."],
 ["Ewangelion","The book of the Gospels. It rests on the altar beside the cross, is carried in procession and is kissed with reverence, because in it Christ himself speaks.",
  "എവൻഗേലിയോൻ","സുവിശേഷഗ്രന്ഥം. കുരിശിനരികെ ബലിപീഠത്തിൽ വയ്ക്കുകയും പ്രദക്ഷിണമായി സംവഹിക്കുകയും ഭക്തിയോടെ ചുംബിക്കുകയും ചെയ്യുന്നു; അതിൽ മിശിഹാതന്നെ സംസാരിക്കുന്നു."],
 ["Kuthina","The long white tunic worn by the priest, deacon and servers. It recalls the white garment of baptism and the purity needed to stand before God.",
  "കൂത്തീന","വൈദികനും ശെമ്മാശനും ശുശ്രൂഷികളും ധരിക്കുന്ന നീണ്ട വെള്ളക്കുപ്പായം. മാമ്മോദീസായിലെ വെള്ളവസ്ത്രവും ദൈവസന്നിധിയിൽ നിൽക്കാൻ ആവശ്യമായ വിശുദ്ധിയും ഇത് ഓർമിപ്പിക്കുന്നു."],
 ["Urara","The stole. The priest wears it around the neck, hanging in front; the deacon wears it over the left shoulder. It is the sign of ordained ministry.",
  "ഊറാറ","കഴുത്തിലൂടെ മുമ്പിലേക്കു തൂക്കിയാണു വൈദികൻ ഇതു ധരിക്കുന്നത്; ശെമ്മാശൻ ഇടത്തേ തോളിലും. തിരുപ്പട്ടശുശ്രൂഷയുടെ അടയാളമാണിത്."],
 ["Zunara and Zande","The girdle (Zunara) tied around the waist over the Kuthina, and the cuffs (Zande) on the wrists. They speak of readiness for service and of hands set apart for holy work.",
  "സുനാറയും കൈയുറകളും","കൂത്തീനയ്ക്കു മുകളിൽ അരയിൽ കെട്ടുന്ന അരപ്പട്ടയാണു സുനാറ; കൈത്തണ്ടയിൽ അണിയുന്നവയാണു കൈയുറകൾ. ശുശ്രൂഷയ്ക്കുള്ള സന്നദ്ധതയെയും വിശുദ്ധകർമത്തിനായി വേർതിരിച്ച കൈകളെയും അവ സൂചിപ്പിക്കുന്നു."],
 ["Kappa","The cope-like outer vestment worn by the celebrant over the other vestments, in the colour of the day. It is a sign of the love of Christ that covers all.",
  "കാപ്പാ","മറ്റു വസ്ത്രങ്ങൾക്കു മുകളിൽ കാർമികൻ ധരിക്കുന്ന, മേലങ്കിപോലെയുള്ള പുറംവസ്ത്രം. എല്ലാറ്റിനെയും ആവരണം ചെയ്യുന്ന മിശിഹായുടെ സ്നേഹത്തിന്റെ അടയാളം."],
 ["Shammashan","The deacon (Syriac mshamshana, “minister”). He serves at the altar, reads the Apostle, proclaims the Karozutha and calls the people to attention and prayer.",
