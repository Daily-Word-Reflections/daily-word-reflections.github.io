<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily Word: readings, reflections and homily notes for every day, for the Syro-Malabar, Syro-Malankara and Latin rites, in English, Malayalam, Tamil, Hindi, German and Italian.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Daily Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Malayalam:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
/* Layout: a sanctuary-night header band with lamp glow; date bar; three page tabs (Lectern, Homily notes, Calendar page) each with its own content */
:root{
  --bg:#F1F2EE; --paper:#FDFDFB; --ink:#1C2424; --muted:#5B6664; --rule:#DCDFD8;
  --gold:#A9822F; --goldsoft:#E9DDBF; --night:#16182A;
  --maroon:#7E2635; --indigo:#2C4677; --green:#2D6A4E; --accent:var(--maroon); --soft:#ECEEE8;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.06);
  --display:"Cormorant Garamond","Noto Serif Malayalam",Georgia,serif;
  --serif:"Spectral","Noto Serif Malayalam",Georgia,serif;
  --mlserif:"Noto Serif Malayalam","Spectral",serif;
  --sans:"IBM Plex Sans","Noto Sans Malayalam",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101415; --paper:#181E1F; --ink:#E8ECEA; --muted:#9AA5A2; --rule:#2B3434;
  --gold:#D8B865; --goldsoft:#3A3322; --maroon:#E79AA6; --indigo:#A3BAE8; --green:#86C9A5; --soft:#1F2627;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101415; --paper:#181E1F; --ink:#E8ECEA; --muted:#9AA5A2; --rule:#2B3434;
  --gold:#D8B865; --goldsoft:#3A3322; --maroon:#E79AA6; --indigo:#A3BAE8; --green:#86C9A5; --soft:#1F2627;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.7}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:grid;gap:18px}
:lang(ml) .wrap{font-family:var(--mlserif);font-size:16.5px}

/* Header band: always night, with lamp glow */
.band{position:relative;overflow:hidden;border-radius:18px;padding:26px 22px 22px;color:#F4EEDD;
  background:radial-gradient(120% 90% at 85% 0%,rgba(233,196,106,.35),transparent 55%),radial-gradient(80% 70% at 0% 100%,rgba(126,38,53,.55),transparent 60%),linear-gradient(160deg,#1B1D33 0%,#14152A 60%,#221427 100%);
  box-shadow:0 10px 30px rgba(20,16,40,.25)}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 80px);pointer-events:none}
.band .eyebrow{font:600 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#E3C77E;display:flex;align-items:center;gap:10px}
.band .eyebrow::before,.band .eyebrow::after{content:"";height:1px;flex:0 0 28px;background:linear-gradient(90deg,transparent,#E3C77E)}
.band .eyebrow::after{background:linear-gradient(90deg,#E3C77E,transparent)}
.brand{margin:6px 0 2px;font-family:var(--mlserif);font-weight:700;font-size:34px;line-height:1.2;
  background:linear-gradient(180deg,#FFF6DD 0%,#E9C877 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
:lang(en) .brand{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:.01em}
.band .sub{font:14px var(--sans);color:#CFC6B4}
.band .verse-line{margin-top:12px;font-family:var(--display);font-style:italic;font-size:18px;color:#EDE3C8}
:lang(ml) .band .verse-line{font-family:var(--mlserif);font-style:normal;font-size:15px}

/* Controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.seg button{font:600 13.5px var(--sans);border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.seg button:focus-visible,.nav button:focus-visible,.tabs button:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.datebar input{font:600 15px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:7px 10px}
.datebar .dlabel{font:600 15px var(--sans);flex:1;min-width:180px}
.pill{font:600 13px var(--sans);border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{font:600 14px var(--sans);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.note{font:13.5px/1.5 var(--sans);color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 14px}
.note b{color:var(--ink)}

/* Day card */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:24px 22px;display:grid;gap:22px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.season{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.week{font:14px var(--sans);color:var(--muted)}
.dtitle{font-family:var(--display);font-size:32px;line-height:1.2;margin:2px 0 0;font-weight:600;text-wrap:balance}
:lang(ml) .dtitle{font-family:var(--mlserif);font-size:25px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:8px;font:13px var(--sans);color:var(--muted)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--green)}
h3.sh{display:flex;align-items:center;gap:10px;margin:0;font:600 12.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h3.sh::before{content:"✦";font-size:11px}
h3.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldsoft),transparent)}
.readings{display:grid;gap:10px}
.rd{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--rule)}
.rd .lab{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.rd .ref{font:600 16px var(--sans)}
.rd .rt{grid-column:2;font-style:italic;color:var(--muted);font-size:15px}
.grp{font:600 13px var(--sans);color:var(--accent);margin-top:4px}
.alt{font:13.5px/1.5 var(--sans);color:var(--muted)}
blockquote.key{margin:0;padding:18px 20px;border-radius:14px;text-align:center;font-family:var(--display);font-style:italic;font-size:24px;line-height:1.35;
  background:radial-gradient(90% 120% at 50% 0%,var(--goldsoft),transparent 70%);border:1px solid var(--goldsoft)}
:lang(ml) blockquote.key{font-family:var(--mlserif);font-style:normal;font-size:19px}
blockquote.key cite{display:block;font:normal 13px var(--sans);color:var(--muted);margin-top:6px}
.prose{display:grid;gap:12px}
.prose p{margin:0;max-width:68ch}
.prose p:first-child::first-letter{font-family:var(--display);font-size:3.1em;float:left;line-height:.85;padding:6px 8px 0 0;color:var(--accent)}
:lang(ml) .prose p:first-child::first-letter{font-family:inherit;font-size:inherit;float:none;padding:0;color:inherit}
.items{display:grid;gap:12px}
.item{display:grid;gap:3px;padding-left:14px;border-left:2px solid var(--goldsoft)}
.item b{font:600 15px var(--sans);color:var(--ink)}
.item p{margin:0}
.quote .item p{font-style:italic}
:lang(ml) .quote .item p{font-style:normal}
.outline{counter-reset:o;display:grid;gap:12px}
.ol{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ol .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--accent);color:var(--paper)}
.ol .n.g{background:var(--gold)}
.ol b{font:600 15px var(--sans);display:block}
.ol p{margin:2px 0 0}
.prayer{font-style:italic;text-align:center;padding:14px 18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
:lang(ml) .prayer{font-style:normal}
.empty{display:grid;gap:10px;justify-items:start;font:15px/1.6 var(--sans);color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dcell{border:1px solid var(--rule);border-radius:12px;padding:8px 6px;background:var(--bg);display:grid;gap:2px;text-align:center;cursor:pointer;font-family:var(--sans);min-width:0}
.dcell[aria-current="date"]{border-color:var(--gold);background:radial-gradient(100% 100% at 50% 0%,var(--goldsoft),var(--bg))}
.dcell .wd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dcell .dn{font:600 22px/1.1 var(--display)}
.dcell .tt{font-size:10.5px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:600px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}.rd{grid-template-columns:1fr}.rd .rt{grid-column:1}.dtitle{font-size:26px}}
.post{display:grid;gap:10px}
.post pre{white-space:pre-wrap;font:14px/1.55 var(--sans);background:var(--bg);border:1px dashed var(--rule);border-radius:12px;padding:14px;margin:0;max-height:300px;overflow:auto}
.copy{justify-self:start;font:600 14px var(--sans);background:var(--accent);color:var(--paper);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
footer{font:13px/1.55 var(--sans);color:var(--muted);display:grid;gap:6px}
/* v6 additions */
.fs button{min-width:38px}
.search{display:grid;gap:8px}
.search input{padding-left:42px!important;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2718%27 height=%2718%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23A9822F%27 stroke-width=%272.2%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%277%27/%3E%3Cpath d=%27M20 20l-4-4%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:14px center;width:100%;box-sizing:border-box;font:15px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.results{display:grid;gap:6px;max-height:320px;overflow:auto}
.res{text-align:left;font:14px/1.45 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;cursor:pointer}
.res b{display:block;font-weight:600}
.res span{color:var(--muted);font-size:13px}
details.sx summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.sx summary::-webkit-details-marker{display:none}
details.sx summary::after{content:"▾";font-size:12px;color:var(--gold)}
details.sx[open] summary::after{content:"▴"}
details.sx .sxbody{margin-top:8px;font:15px/1.6 var(--serif);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-transform:none;letter-spacing:0}
:lang(ml) details.sx .sxbody{font-family:var(--mlserif)}
.quick{border-radius:16px;padding:16px 18px;display:grid;gap:8px;background:linear-gradient(135deg,var(--goldsoft),transparent 75%);border:1px solid var(--goldsoft)}
.quick .qh{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.quick ul{margin:0;padding-left:20px;display:grid;gap:4px}
.quick .act{font:600 15px var(--sans)}
.question{text-align:center;font-family:var(--display);font-style:italic;font-size:21px;padding:6px 10px}
:lang(ml) .question{font-family:var(--mlserif);font-style:normal;font-size:17px}
.special{font:14.5px/1.55 var(--sans);border-left:4px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 14px}
.placeholder{font:14px/1.55 var(--sans);color:var(--muted);border:1px dashed var(--rule);border-radius:12px;padding:12px 14px}
.reqcard{display:grid;gap:8px;border-radius:16px;padding:16px 18px;background:radial-gradient(100% 120% at 100% 0%,var(--goldsoft),var(--bg) 70%);border:1px solid var(--rule)}
.reqcard b{font:600 16px var(--sans)}
details.about{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px}
details.about summary{cursor:pointer;font:600 14px var(--sans);color:var(--ink)}
details.about p{margin:8px 0 0;font:14px/1.6 var(--sans);color:var(--muted)}
.term{font-family:var(--display);font-size:28px;font-weight:600;margin:0}
:lang(ml) .term{font-family:var(--mlserif);font-size:22px}
</style>

<div class="wrap" id="app" lang="ml">
  <section class="band">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="brand" id="brand"></h1>
    <div class="sub" id="bandsub"></div>
    <div class="verse-line" id="bandverse"></div>
  </section>

  <div class="bar">
    <div class="seg" role="group" aria-label="Rite"><button id="r-smc" data-rite="smc"></button><button id="r-smk" data-rite="smk"></button><button id="r-lat" data-rite="lat"></button><button id="r-docs" data-view="docs"></button></div>
    <div class="seg" role="group" aria-label="Language" id="langseg"></div>
    <div class="seg fs" role="group" aria-label="Text size"><button id="fs-m" aria-label="Smaller text">A−</button><button id="fs-p" aria-label="Larger text">A+</button></div>
  </div>

  <div class="datebar">
    <div class="nav"><button id="prev" aria-label="Previous day">‹</button><button id="next" aria-label="Next day">›</button></div>
    <div class="dlabel" id="dlabel"></div>
    <input type="date" id="dpick" aria-label="Choose date">
    <button class="pill" id="today"></button>
    <button class="pill" id="sample"></button>
  </div>

  <div class="search"><input type="search" id="q" aria-label="Search"><div class="results" id="results" hidden></div></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-lectern" data-tab="lectern"></button>
    <button role="tab" id="t-homily" data-tab="homily"></button>
    <button role="tab" id="t-cal" data-tab="cal"></button>
    <button role="tab" id="t-family" data-tab="family"></button>
    <button role="tab" id="t-lit" data-tab="lit"></button>
  </div>

  <div class="note" id="note"></div>
  <article class="card" id="card"></article>
  <details class="about" id="about"><summary id="about-s"></summary><p id="about-p1"></p><p id="about-p2"></p></details>
  <footer id="foot"></footer>
</div>

<script>
/* Prepared days. Key: ISO date -> rite -> language */
var CONTENT={
"2026-10-18":{
 smc:{
  en:{title:"Mission Sunday",
   readTitle:"Mission Sunday readings",
   readings:[["First Reading","Exodus 3:1–14","God sends Moses"],["Second Reading","Isaiah 61:1–6, 10–11","The Lord has sent me to bring good news"],["Epistle","1 Corinthians 9:13–18","Woe to me if I do not proclaim the Gospel"],["Gospel","Matthew 10:1–15","Jesus sends the twelve apostles"]],
   alt:"The readings of the Second Sunday of Moses may be used instead: Genesis 19:23–29; Malachi 4:1–6; 1 Thessalonians 4:13–18; Luke 21:20–28.",
   verse:"You received without payment; give without payment.",cite:"Matthew 10:8",
   theo:[
    "The first missionary in the Bible is God himself. At the bush he does not say, “Go and find out what is happening to my people.” He says, “I have seen… I have heard… I know their sufferings, and I have come down to deliver them” (Exodus 3:7–8). Mission begins with a God who comes down. Everything the Church does on Mission Sunday is a share in that descent, which reached its fullness when the Word became flesh, and which continues when the Spirit comes upon the anointed one of Isaiah 61 and, through him, upon us.",
    "Notice the order at Horeb. God gives his Name before he gives the task. Moses is not sent with an idea or a programme; he is sent with a Name, “I AM”. The Church still works this way. We do not hand on a philosophy but a Person. As Pope Benedict wrote, being Christian begins not with an ethical choice or a lofty idea but with “the encounter with an event, a person”. Mission without adoration becomes activism. Adoration without mission becomes private piety. Moses had to take off his sandals first and then walk to Egypt.",
    "The second key word is gift. “You received without payment; give without payment.” Paul takes this so seriously that he refuses the support he had every right to (1 Corinthians 9:18). Grace is free; therefore its messengers must be free. The Church's credibility in every age depends on this gratuity: schools, hospitals and missions that give without calculating are the Gospel made visible.",
    "Finally, notice where the Syro-Malabar calendar places this Sunday: in the season of Moses, the last weeks of the liturgical year, when the readings look toward the Lord's Day and the end of history. Mission is urgent because history has a goal. The Church lives between the bush and the Day: called, sent, and waiting for the Lord who will come again."],
   conn:[
    ["The bush and the Name.","Moses receives the Name “I AM WHO I AM” (Exodus 3:14). In John's Gospel Jesus takes that Name on his own lips: “Before Abraham was, I AM” (John 8:58). The God who spoke from the bush now stands in the flesh and sends the Twelve himself."],
    ["Moses was eighty.","He had killed a man, fled, and kept his father-in-law's sheep for forty years (Exodus 2:11–15; 7:7; Acts 7:30). God called a failure, late in life, in the middle of ordinary work. No one is too old, too ordinary or too wounded to be sent."],
    ["Jesus stopped mid-sentence.","Jesus read Isaiah 61 in the synagogue of Nazareth (Luke 4:16–21). He read as far as “the year of the Lord's favour” and closed the scroll before “and the day of vengeance of our God”. The mission he hands on is the year of favour."],
    ["Paul lives Matthew 10:8.","Jesus says, “Give without payment”; Paul answers, “I make the Gospel free of charge” (1 Corinthians 9:18). The Epistle shows the Gospel lived."],
    ["Thomas is on the list.","Matthew 10:3 names him among the first twelve ever sent. Our father in faith was in this Gospel before he was on our shores. And only in his own Gospel does Matthew call himself “the tax collector”: the one who once took money now gives freely."]],
   altar:[
    "When God says, “Take off your sandals, for the place where you stand is holy ground”, every Kerala Christian recognises the gesture: we leave our footwear at the church door. The madbaha is our Horeb. On the altar the fire of the Spirit comes upon bread, and, like the bush, the bread is not consumed but changed: it becomes the Body of Christ.",
    "Paul links mission and altar in one breath: “those who serve at the altar share in what is sacrificed on the altar” (1 Corinthians 9:13). The Qurbana is the burning bush from which we are sent. The Gift we receive there costs us nothing and cost Christ everything; that is exactly why we cannot keep it to ourselves."],
   outline:[
    ["Opening","Ask: “When did God last interrupt your ordinary day?” Moses was simply at work. Tell the story of the bush briefly, and stop on the sandals."],
    ["Point 1 · Mission begins on holy ground","Before Moses does anything, he takes off his sandals and hears a Name. Before we serve, we adore. Link it to the Kerala custom of leaving footwear at the church door. A Church that does not kneel will not be able to go. Illustration: Mother Teresa's Sisters begin every day with an hour of adoration before they go to the poor."],
    ["Point 2 · Anointed for the year of favour","Read Luke 4 alongside Isaiah 61 and show where Jesus closed the scroll. Our mission is good news, not condemnation. Ask: when people meet us, do they meet the year of favour or the day of vengeance?"],
    ["Point 3 · Freely, lightly, now","Jesus sends the Twelve without gold, bag or second tunic; Paul refuses payment. Ask what makes us heavy: comfort, status, the fear of what people will say. Recall St Thomas: “Let us also go, that we may die with him” (John 11:16)."],
    ["Closing image","The bush is still burning: on our altar, in our tabernacle. The God who said to Moses, “Come, I will send you”, says it to this parish today."],
    ["Take-home line","“What I received freely, I will give freely this week.”"]],
   live:[
    ["Your Horeb is your workplace (Exodus 3)","God met Moses in the middle of his job. Once each day this week, stop and ask: “Where is the bush burning here?” Look for God in one person or situation you usually walk past."],
    ["Name the broken-hearted (Isaiah 61)","Write down the name of one real person near you who is poor, captive to something, or mourning. Do one concrete thing for them this week: a visit, a call, help with a hospital stay."],
    ["Give up one right (1 Corinthians 9)","Paul gave up a right he truly had. Give up one of yours for someone else's sake: the last word in an argument, your preferred seat, your evening."],
    ["Peace to this house (Matthew 10)","Before you enter your home each evening, say silently, “Peace to this house.” Mission begins at our own doorstep."]],
   fathers:[
    ["St Ephrem the Syrian","“In your Bread is hidden the Spirit, who is not eaten; in your Wine dwells the Fire, which is not drunk.” (Hymns on Faith 10). Our own Syriac father sees in the Eucharist what Moses saw at Horeb: fire that does not consume."],
    ["St Gregory of Nyssa","In his Life of Moses he reads the bush that burned without being consumed as a figure of the Virgin, who bore the divine fire without being destroyed (Life of Moses II.21). The Mother of the Missionary is the first burning bush."],
    ["St Gregory the Great","Preaching on the sending of the seventy (Luke 10), he laments that the world is full of priests, yet few labourers are found for the harvest, because many accept the office but not the work (Homilies on the Gospels 17)."],
    ["St Ignatius of Antioch","“I am God's wheat, and I am ground by the teeth of wild beasts, that I may be found pure bread of Christ.” (Letter to the Romans 4)."]],
   magis:[
    ["Second Vatican Council, Ad Gentes 2","The pilgrim Church is missionary by her very nature, because she has her origin in the mission of the Son and the mission of the Holy Spirit, according to the plan of the Father."],
    ["St Paul VI, Evangelii Nuntiandi 14","“Evangelizing is in fact the grace and vocation proper to the Church, her deepest identity.”"],
    ["St John Paul II, Redemptoris Missio 2","“Faith is strengthened when it is given to others!”"],
    ["Benedict XVI, Deus Caritas Est 1; Sacramentum Caritatis 84","Christian life begins with “the encounter with an event, a person”. And: “The love that we celebrate in the sacrament is not something we can keep to ourselves.”"],
    ["Pope Francis, Evangelii Gaudium 120","“Every Christian is a missionary to the extent that he or she has encountered the love of God in Christ Jesus.”"],
    ["This year","Read the Holy Father's Message for World Mission Day 2026 (vatican.va) and quote one line from it in the homily."]],
   saints:[
    ["15 October · St Teresa of Ávila","Reformer and Doctor of the Church. Her bookmark prayer is the missionary's courage: “Let nothing disturb you, let nothing frighten you… God alone suffices.”"],
    ["16 October · Blessed Kunjachan (Augustine Thevarparampil)","A priest of the Pala diocese who spent about forty years among the Dalit Christians of Ramapuram, visiting their homes on foot, teaching, and treating them as his own family. A Kerala missionary who never left his parish. Beatified in 2006."],
    ["17 October · St Ignatius of Antioch","On his way to martyrdom he called himself “God's wheat” to become “the pure bread of Christ”. A missionary who became Eucharist."],
    ["18 October · St Luke, Evangelist","The physician who wrote the Gospel and the Acts of the Apostles, the great book of mission. Only Luke records Jesus reading Isaiah 61 at Nazareth."],
    ["22 October · St John Paul II","His memorial falls on the anniversary of the homily that opened his pontificate: “Do not be afraid! Open wide the doors for Christ!”"],
    ["Patron of the missions · St Francis Xavier","Writing from India, he said that many people there were not becoming Christians for one reason only: there was no one to make them Christians."]],
   prayer:"Lord Jesus, you sent your apostles with empty hands and full hearts. Send me today, to the place where I live and work, to give freely what I have freely received. Amen."},
  ml:{title:"മിഷൻ ഞായർ",
   readTitle:"മിഷൻ ഞായറിലെ വായനകൾ",
   readings:[["ഒന്നാം വായന","പുറപ്പാട് 3:1–14","ദൈവം മോശയെ അയയ്ക്കുന്നു"],["രണ്ടാം വായന","ഏശയ്യാ 61:1–6, 10–11","സദ്വാർത്ത അറിയിക്കാൻ കർത്താവ് എന്നെ അയച്ചിരിക്കുന്നു"],["ലേഖനം","1 കോറിന്തോസ് 9:13–18","സുവിശേഷം പ്രസംഗിക്കുന്നില്ലെങ്കിൽ എനിക്കു ദുരിതം"],["സുവിശേഷം","മത്തായി 10:1–15","ഈശോ പന്ത്രണ്ടു ശ്ലീഹന്മാരെ അയയ്ക്കുന്നു"]],
   alt:"പകരം മൂശെക്കാലം രണ്ടാം ഞായറിലെ വായനകളും ഉപയോഗിക്കാം: ഉൽപത്തി 19:23–29; മലാക്കി 4:1–6; 1 തെസലോനിക്കാ 4:13–18; ലൂക്കാ 21:20–28.",
   verse:"ദാനമായി നിങ്ങൾക്കു കിട്ടി; ദാനമായിത്തന്നെ കൊടുക്കുവിൻ.",cite:"മത്തായി 10:8",
   theo:[
    "ബൈബിളിലെ ആദ്യത്തെ മിഷനറി ദൈവംതന്നെയാണ്. മുൾപ്പടർപ്പിൽനിന്ന് അവിടുന്നു പറയുന്നത്, “പോയി എന്റെ ജനത്തിന് എന്തു സംഭവിക്കുന്നു എന്ന് അന്വേഷിക്കുക” എന്നല്ല. അവിടുന്നു പറയുന്നു: “ഞാൻ കണ്ടു… ഞാൻ കേട്ടു… അവരുടെ യാതനകൾ ഞാൻ അറിയുന്നു; അവരെ മോചിപ്പിക്കാൻ ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു” (പുറ 3:7–8). ഇറങ്ങിവരുന്ന ഒരു ദൈവത്തിൽനിന്നാണു ദൗത്യം ആരംഭിക്കുന്നത്. മിഷൻ ഞായറാഴ്ച സഭ ചെയ്യുന്നതെല്ലാം ആ ഇറങ്ങിവരവിലുള്ള പങ്കാളിത്തമാണ്. വചനം മാംസമായപ്പോൾ അതു പൂർണതയിലെത്തി; ഏശയ്യാ 61-ലെ അഭിഷിക്തന്റെമേലും അവനിലൂടെ നമ്മുടെമേലും ആത്മാവ് ഇറങ്ങുമ്പോൾ അതു തുടരുന്നു.",
    "ഹോറെബിലെ ക്രമം ശ്രദ്ധിക്കുക. ദൗത്യം നൽകുന്നതിനു മുമ്പു ദൈവം തന്റെ നാമം നൽകുന്നു. ഒരു ആശയവുമായോ പരിപാടിയുമായോ അല്ല മോശ അയയ്ക്കപ്പെടുന്നത്; “ഞാൻ ആകുന്നവൻ” എന്ന ഒരു നാമവുമായാണ്. സഭ ഇന്നും ഇങ്ങനെതന്നെയാണു പ്രവർത്തിക്കുന്നത്. നാം കൈമാറുന്നത് ഒരു തത്ത്വചിന്തയല്ല, ഒരു വ്യക്തിയെയാണ്. ബെനഡിക്ട് മാർപാപ്പ എഴുതിയതുപോലെ, ക്രൈസ്തവജീവിതം ആരംഭിക്കുന്നത് ഒരു ധാർമികതീരുമാനത്തിൽനിന്നോ ഉന്നതമായ ഒരു ആശയത്തിൽനിന്നോ അല്ല, “ഒരു സംഭവവുമായി, ഒരു വ്യക്തിയുമായുള്ള കണ്ടുമുട്ടലിൽ”നിന്നാണ്. ആരാധനയില്ലാത്ത ദൗത്യം വെറും പ്രവർത്തനമാകും. ദൗത്യമില്ലാത്ത ആരാധന സ്വകാര്യഭക്തിയാകും. മോശ ആദ്യം ചെരുപ്പ് അഴിക്കണമായിരുന്നു; പിന്നെ ഈജിപ്തിലേക്കു നടക്കണമായിരുന്നു.",
    "രണ്ടാമത്തെ താക്കോൽവാക്ക് ദാനമാണ്. “ദാനമായി നിങ്ങൾക്കു കിട്ടി; ദാനമായിത്തന്നെ കൊടുക്കുവിൻ.” തനിക്കു പൂർണ അവകാശമുണ്ടായിരുന്ന സഹായംപോലും നിരസിക്കുംവിധം പൗലോസ് ഇതു ഗൗരവമായി എടുക്കുന്നു (1 കോറി 9:18). കൃപ സൗജന്യമാണ്; അതുകൊണ്ട് അതിന്റെ സന്ദേശവാഹകരും സ്വതന്ത്രരായിരിക്കണം. ഓരോ കാലഘട്ടത്തിലും സഭയുടെ വിശ്വാസ്യത ഈ സൗജന്യതയെ ആശ്രയിച്ചിരിക്കുന്നു: കണക്കുകൂട്ടാതെ നൽകുന്ന വിദ്യാലയങ്ങളും ആശുപത്രികളും മിഷനുകളും ദൃശ്യമാകുന്ന സുവിശേഷമാണ്.",
    "ഒടുവിൽ, സീറോ മലബാർ കലണ്ടർ ഈ ഞായറിനെ എവിടെ വച്ചിരിക്കുന്നു എന്നു ശ്രദ്ധിക്കുക: മൂശെക്കാലത്ത്, ആരാധനാവത്സരത്തിന്റെ അവസാന ആഴ്ചകളിൽ; വായനകൾ കർത്താവിന്റെ ദിനത്തിലേക്കും ചരിത്രത്തിന്റെ അന്ത്യത്തിലേക്കും നോക്കുന്ന കാലം. ചരിത്രത്തിന് ഒരു ലക്ഷ്യമുള്ളതുകൊണ്ടാണു ദൗത്യം അടിയന്തരമായിരിക്കുന്നത്. മുൾപ്പടർപ്പിനും ആ ദിനത്തിനുമിടയിലാണു സഭ ജീവിക്കുന്നത്: വിളിക്കപ്പെട്ട്, അയയ്ക്കപ്പെട്ട്, വീണ്ടും വരാനിരിക്കുന്ന കർത്താവിനെ കാത്തിരുന്ന്."],
   conn:[
    ["മുൾപ്പടർപ്പും തിരുനാമവും.","“ഞാൻ ആകുന്നവൻ ഞാൻ ആകുന്നു” എന്ന നാമം മോശയ്ക്കു ലഭിക്കുന്നു (പുറ 3:14). യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈശോ ആ നാമം സ്വന്തം അധരങ്ങളിൽ എടുക്കുന്നു: “അബ്രാഹം ഉണ്ടാകുന്നതിനുമുമ്പേ ഞാൻ ഉണ്ട്” (യോഹ 8:58). മുൾപ്പടർപ്പിൽനിന്നു സംസാരിച്ച ദൈവം ഇപ്പോൾ മാംസമായി നിന്നു പന്ത്രണ്ടുപേരെ നേരിട്ട് അയയ്ക്കുന്നു."],
    ["മോശയ്ക്ക് എൺപതു വയസ്സായിരുന്നു.","അവൻ ഒരാളെ കൊന്നിരുന്നു, ഓടിപ്പോയിരുന്നു, നാൽപതു വർഷം ഭാര്യാപിതാവിന്റെ ആടുകളെ മേയിച്ചിരുന്നു (പുറ 2:11–15; 7:7; അപ്പ 7:30). ജീവിതത്തിന്റെ വൈകിയ നേരത്ത്, സാധാരണ ജോലിക്കിടയിൽ, പരാജയപ്പെട്ട ഒരു മനുഷ്യനെ ദൈവം വിളിച്ചു. അയയ്ക്കപ്പെടാൻ ആരും അധികം പ്രായമുള്ളവരോ സാധാരണക്കാരോ മുറിവേറ്റവരോ അല്ല."],
    ["ഈശോ വാക്യം പൂർത്തിയാക്കിയില്ല.","നസ്രത്തിലെ സിനഗോഗിൽ ഈശോ ഏശയ്യാ 61 വായിച്ചു (ലൂക്കാ 4:16–21). “കർത്താവിനു സ്വീകാര്യമായ വത്സരം” എന്നുവരെ വായിച്ച്, “നമ്മുടെ ദൈവത്തിന്റെ പ്രതികാരദിനവും” എന്നതിനു മുമ്പ് അവിടുന്നു ചുരുൾ ചുരുട്ടി. അവിടുന്നു കൈമാറുന്ന ദൗത്യം കൃപയുടെ വത്സരമാണ്."],
    ["മത്തായി 10:8 പൗലോസ് ജീവിക്കുന്നു.","“ദാനമായി കൊടുക്കുവിൻ” എന്ന് ഈശോ പറയുന്നു; “സുവിശേഷം ഞാൻ സൗജന്യമായി നൽകുന്നു” എന്നു പൗലോസ് ഉത്തരം നൽകുന്നു (1 കോറി 9:18). ജീവിക്കപ്പെടുന്ന സുവിശേഷം ലേഖനം കാണിച്ചുതരുന്നു."],
    ["ആ പട്ടികയിൽ തോമായുണ്ട്.","ആദ്യമായി അയയ്ക്കപ്പെട്ട പന്ത്രണ്ടുപേരുടെ കൂട്ടത്തിൽ മത്തായി 10:3 അദ്ദേഹത്തിന്റെ പേരു പറയുന്നു. നമ്മുടെ വിശ്വാസപിതാവു നമ്മുടെ തീരത്തെത്തുംമുമ്പേ ഈ സുവിശേഷത്തിലുണ്ടായിരുന്നു. സ്വന്തം സുവിശേഷത്തിൽ മാത്രമാണു മത്തായി തന്നെത്തന്നെ “ചുങ്കക്കാരൻ” എന്നു വിളിക്കുന്നത്: ഒരിക്കൽ പണം പിരിച്ചവൻ ഇപ്പോൾ ദാനമായി നൽകുന്നു."]],
   altar:[
    "“നീ നിൽക്കുന്ന സ്ഥലം പരിശുദ്ധമാകയാൽ ചെരുപ്പ് അഴിച്ചുമാറ്റുക” എന്നു ദൈവം പറയുമ്പോൾ ഓരോ കേരള ക്രൈസ്തവനും ആ ആംഗ്യം തിരിച്ചറിയുന്നു: പള്ളിവാതിൽക്കൽ നാം ചെരുപ്പ് ഊരിവയ്ക്കുന്നു. മദ്ബഹാ നമ്മുടെ ഹോറെബാണ്. ബലിപീഠത്തിൽ ആത്മാവിന്റെ അഗ്നി അപ്പത്തിന്മേൽ ഇറങ്ങുന്നു; മുൾപ്പടർപ്പുപോലെ അപ്പം എരിഞ്ഞുതീരുന്നില്ല, രൂപാന്തരപ്പെടുന്നു: അതു ക്രിസ്തുവിന്റെ ശരീരമാകുന്നു.",
    "ദൗത്യത്തെയും ബലിപീഠത്തെയും പൗലോസ് ഒറ്റശ്വാസത്തിൽ ബന്ധിപ്പിക്കുന്നു: “ബലിപീഠത്തിൽ ശുശ്രൂഷ ചെയ്യുന്നവർ ബലിവസ്തുക്കളിൽ പങ്കുകാരാകുന്നു” (1 കോറി 9:13). നാം അയയ്ക്കപ്പെടുന്ന എരിയുന്ന മുൾപ്പടർപ്പാണു കുർബാന. അവിടെ നാം സ്വീകരിക്കുന്ന ദാനം നമുക്ക് ഒന്നും ചെലവാകാത്തതും ക്രിസ്തുവിന് എല്ലാം ചെലവായതുമാണ്; അതുകൊണ്ടുതന്നെ നമുക്ക് അതു നമ്മിൽ ഒതുക്കിവയ്ക്കാനാവില്ല."],
   outline:[
    ["ആരംഭം","ചോദിക്കുക: “ദൈവം അവസാനമായി നിങ്ങളുടെ സാധാരണ ദിവസത്തിൽ ഇടപെട്ടത് എപ്പോഴാണ്?” മോശ വെറുതെ ജോലിയിലായിരുന്നു. മുൾപ്പടർപ്പിന്റെ കഥ ചുരുക്കി പറയുക; ചെരുപ്പിൽ നിർത്തുക."],
    ["ഒന്നാം ആശയം · ദൗത്യം ആരംഭിക്കുന്നതു വിശുദ്ധഭൂമിയിൽ","എന്തെങ്കിലും ചെയ്യുംമുമ്പു മോശ ചെരുപ്പ് അഴിക്കുന്നു, ഒരു നാമം കേൾക്കുന്നു. ശുശ്രൂഷിക്കുംമുമ്പു നാം ആരാധിക്കുന്നു. പള്ളിവാതിൽക്കൽ ചെരുപ്പ് ഊരിവയ്ക്കുന്ന കേരളീയ ആചാരവുമായി ബന്ധിപ്പിക്കുക. മുട്ടുകുത്താത്ത സഭയ്ക്കു പോകാനാവില്ല. ഉദാഹരണം: മദർ തെരേസയുടെ സന്യാസിനികൾ ദരിദ്രരുടെ അടുത്തേക്കു പോകുംമുമ്പ് എല്ലാ ദിവസവും ഒരു മണിക്കൂർ ആരാധനയോടെ ആരംഭിക്കുന്നു."],
    ["രണ്ടാം ആശയം · കൃപയുടെ വത്സരത്തിനായി അഭിഷിക്തർ","ഏശയ്യാ 61-നോടൊപ്പം ലൂക്കാ 4 വായിക്കുക; ഈശോ ചുരുൾ ചുരുട്ടിയ ഇടം കാണിക്കുക. നമ്മുടെ ദൗത്യം സദ്വാർത്തയാണ്, ശിക്ഷാവിധിയല്ല. ചോദിക്കുക: ആളുകൾ നമ്മെ കണ്ടുമുട്ടുമ്പോൾ കൃപയുടെ വത്സരമാണോ പ്രതികാരദിനമാണോ അവർ കണ്ടുമുട്ടുന്നത്?"],
    ["മൂന്നാം ആശയം · ദാനമായി, ഭാരമില്ലാതെ, ഇപ്പോൾത്തന്നെ","സ്വർണവും സഞ്ചിയും രണ്ടാമതൊരു കുപ്പായവുമില്ലാതെ ഈശോ പന്ത്രണ്ടുപേരെ അയയ്ക്കുന്നു; പൗലോസ് പ്രതിഫലം നിരസിക്കുന്നു. നമ്മെ ഭാരമുള്ളവരാക്കുന്നത് എന്തെന്നു ചോദിക്കുക: സുഖം, സ്ഥാനം, ആളുകൾ എന്തു പറയും എന്ന ഭയം. മാർ തോമായെ ഓർക്കുക: “അവനോടുകൂടെ മരിക്കാൻ നമുക്കും പോകാം” (യോഹ 11:16)."],
    ["സമാപനചിത്രം","മുൾപ്പടർപ്പ് ഇപ്പോഴും എരിയുന്നു: നമ്മുടെ ബലിപീഠത്തിൽ, നമ്മുടെ സക്രാരിയിൽ. “വരൂ, ഞാൻ നിന്നെ അയയ്ക്കാം” എന്നു മോശയോടു പറഞ്ഞ ദൈവം ഇന്ന് ഈ ഇടവകയോടു പറയുന്നു."],
    ["വീട്ടിലേക്ക് ഒരു വാക്യം","“ദാനമായി എനിക്കു ലഭിച്ചതു ഞാൻ ഈ ആഴ്ച ദാനമായി കൊടുക്കും.”"]],
   live:[
    ["നിന്റെ ഹോറെബ് നിന്റെ ജോലിസ്ഥലമാണ് (പുറപ്പാട് 3)","ജോലിക്കിടയിലാണു ദൈവം മോശയെ കണ്ടുമുട്ടിയത്. ഈ ആഴ്ച ദിവസവും ഒരിക്കൽ നിന്നു ചോദിക്കുക: “ഇവിടെ മുൾപ്പടർപ്പ് എവിടെയാണ് എരിയുന്നത്?” സാധാരണ ശ്രദ്ധിക്കാതെ കടന്നുപോകുന്ന ഒരു വ്യക്തിയിലോ സാഹചര്യത്തിലോ ദൈവത്തെ തിരയുക."],
    ["ഹൃദയം തകർന്നവർക്കു പേരു നൽകുക (ഏശയ്യാ 61)","ദരിദ്രനോ, എന്തിനെങ്കിലും അടിമയോ, ദുഃഖിക്കുന്നവനോ ആയ, നിന്റെ അടുത്തുള്ള ഒരു യഥാർഥ വ്യക്തിയുടെ പേര് എഴുതിവയ്ക്കുക. ഈ ആഴ്ച അവർക്കുവേണ്ടി വ്യക്തമായ ഒരു കാര്യം ചെയ്യുക: ഒരു സന്ദർശനം, ഒരു വിളി, ഒരു ആശുപത്രിവാസത്തിൽ സഹായം."],
    ["ഒരു അവകാശം വിട്ടുകൊടുക്കുക (1 കോറിന്തോസ് 9)","തനിക്കു യഥാർഥത്തിൽ ഉണ്ടായിരുന്ന ഒരു അവകാശം പൗലോസ് വിട്ടുകൊടുത്തു. മറ്റൊരാൾക്കുവേണ്ടി നിന്റെ ഒന്നു വിട്ടുകൊടുക്കുക: ഒരു തർക്കത്തിലെ അവസാനവാക്ക്, ഇഷ്ടപ്പെട്ട ഇരിപ്പിടം, നിന്റെ സായാഹ്നം."],
    ["ഈ ഭവനത്തിനു സമാധാനം (മത്തായി 10)","ഓരോ സായാഹ്നത്തിലും വീട്ടിൽ കയറുംമുമ്പു മനസ്സിൽ പറയുക: “ഈ ഭവനത്തിനു സമാധാനം.” ദൗത്യം ആരംഭിക്കുന്നതു സ്വന്തം വാതിൽപ്പടിയിലാണ്."]],
   fathers:[
    ["മാർ അപ്രേം","“നിന്റെ അപ്പത്തിൽ, ഭക്ഷിക്കപ്പെടാത്ത ആത്മാവു മറഞ്ഞിരിക്കുന്നു; നിന്റെ വീഞ്ഞിൽ, പാനംചെയ്യപ്പെടാത്ത അഗ്നി വസിക്കുന്നു” (വിശ്വാസഗീതങ്ങൾ 10). ഹോറെബിൽ മോശ കണ്ടതുതന്നെ, എരിച്ചുകളയാത്ത അഗ്നി, നമ്മുടെ സുറിയാനി പിതാവു ദിവ്യകാരുണ്യത്തിൽ കാണുന്നു."],
    ["നിസ്സായിലെ വിശുദ്ധ ഗ്രിഗറി","എരിഞ്ഞിട്ടും എരിഞ്ഞുതീരാത്ത മുൾപ്പടർപ്പിനെ, ദൈവികാഗ്നി വഹിച്ചിട്ടും നശിക്കാത്ത കന്യകയുടെ പ്രതിരൂപമായി അദ്ദേഹം “മോശയുടെ ജീവിതം” എന്ന കൃതിയിൽ വായിക്കുന്നു (II.21). മിഷനറിയായവന്റെ അമ്മയാണ് ആദ്യത്തെ എരിയുന്ന മുൾപ്പടർപ്പ്."],
    ["മഹാനായ വിശുദ്ധ ഗ്രിഗറി","എഴുപത്തിരണ്ടുപേരെ അയയ്ക്കുന്നതിനെപ്പറ്റി (ലൂക്കാ 10) പ്രസംഗിക്കുമ്പോൾ അദ്ദേഹം വിലപിക്കുന്നു: ലോകം പുരോഹിതന്മാരാൽ നിറഞ്ഞിരിക്കുന്നു; എങ്കിലും കൊയ്ത്തിനു വേലക്കാർ ചുരുക്കം; പലരും സ്ഥാനം സ്വീകരിക്കുന്നു, ജോലി സ്വീകരിക്കുന്നില്ല (സുവിശേഷപ്രസംഗങ്ങൾ 17)."],
    ["അന്ത്യോക്യായിലെ വിശുദ്ധ ഇഗ്നേഷ്യസ്","“ഞാൻ ദൈവത്തിന്റെ ഗോതമ്പാണ്; ക്രിസ്തുവിന്റെ നിർമലമായ അപ്പമായി കാണപ്പെടാൻ വന്യമൃഗങ്ങളുടെ പല്ലുകളാൽ ഞാൻ പൊടിക്കപ്പെടുന്നു” (റോമാക്കാർക്കുള്ള ലേഖനം 4)."]],
   magis:[
    ["രണ്ടാം വത്തിക്കാൻ കൗൺസിൽ, അദ് ജെന്തേസ് 2","തീർഥാടകയായ സഭ സ്വഭാവത്താൽത്തന്നെ പ്രേഷിതയാണ്; കാരണം, പിതാവിന്റെ പദ്ധതിയനുസരിച്ചു പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും ദൗത്യത്തിൽനിന്നാണ് അവൾ ഉത്ഭവിക്കുന്നത്."],
    ["വിശുദ്ധ പോൾ ആറാമൻ, ഏവൻജെലീ നുന്തിയാന്തി 14","“സുവിശേഷവത്കരണം സഭയുടെ സ്വന്തമായ കൃപയും ദൈവവിളിയും അവളുടെ ഏറ്റവും ആഴമേറിയ സ്വത്വവുമാണ്.”"],
    ["വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ, റെദെംപ്തോറിസ് മിസ്സിയോ 2","“വിശ്വാസം മറ്റുള്ളവർക്കു നൽകുമ്പോൾ ശക്തിപ്പെടുന്നു!”"],
    ["ബെനഡിക്ട് പതിനാറാമൻ, ദേവൂസ് കാരിത്താസ് എസ്ത് 1; സാക്രമെന്തും കാരിത്താത്തിസ് 84","ക്രൈസ്തവജീവിതം ആരംഭിക്കുന്നത് “ഒരു സംഭവവുമായി, ഒരു വ്യക്തിയുമായുള്ള കണ്ടുമുട്ടലിൽ”നിന്നാണ്. “കൂദാശയിൽ നാം ആഘോഷിക്കുന്ന സ്നേഹം നമുക്കുവേണ്ടി മാത്രം സൂക്ഷിച്ചുവയ്ക്കാവുന്നതല്ല.”"],
    ["ഫ്രാൻസിസ് മാർപാപ്പ, ഏവൻജെലീ ഗൗദിയും 120","“ക്രിസ്തുവിൽ ദൈവസ്നേഹം കണ്ടുമുട്ടിയിരിക്കുന്ന അളവിൽ ഓരോ ക്രൈസ്തവനും മിഷനറിയാണ്.”"],
    ["ഈ വർഷം","2026-ലെ ലോക മിഷൻ ദിനത്തിനായുള്ള മാർപാപ്പയുടെ സന്ദേശം (vatican.va) വായിച്ച്, അതിൽനിന്ന് ഒരു വരി പ്രസംഗത്തിൽ ഉദ്ധരിക്കുക."]],
   saints:[
    ["ഒക്ടോബർ 15 · ആവിലായിലെ വിശുദ്ധ ത്രേസ്യാ","സഭാനവീകരണക്കാരിയും വേദപാരംഗതയും. അവളുടെ പ്രാർഥന പ്രേഷിതന്റെ ധൈര്യമാണ്: “ഒന്നും നിന്നെ അസ്വസ്ഥനാക്കാതിരിക്കട്ടെ, ഒന്നും നിന്നെ ഭയപ്പെടുത്താതിരിക്കട്ടെ… ദൈവം മാത്രം മതി.”"],
    ["ഒക്ടോബർ 16 · വാഴ്ത്തപ്പെട്ട കുഞ്ഞച്ചൻ (അഗസ്റ്റിൻ തേവർപറമ്പിൽ)","പാലാ രൂപതയിലെ ഒരു വൈദികൻ; ഏകദേശം നാൽപതു വർഷം രാമപുരത്തെ ദളിത് ക്രൈസ്തവരുടെ ഇടയിൽ ചെലവഴിച്ചു; അവരുടെ വീടുകളിൽ നടന്നുചെന്നു, പഠിപ്പിച്ചു, അവരെ സ്വന്തം കുടുംബമായി കരുതി. ഇടവക വിട്ടുപോകാത്ത ഒരു കേരളീയ മിഷനറി. 2006-ൽ വാഴ്ത്തപ്പെട്ടവനായി പ്രഖ്യാപിക്കപ്പെട്ടു."],
    ["ഒക്ടോബർ 17 · അന്ത്യോക്യായിലെ വിശുദ്ധ ഇഗ്നേഷ്യസ്","രക്തസാക്ഷിത്വത്തിലേക്കുള്ള യാത്രയിൽ “ക്രിസ്തുവിന്റെ നിർമലമായ അപ്പം” ആകാനുള്ള “ദൈവത്തിന്റെ ഗോതമ്പ്” എന്നു തന്നെത്തന്നെ വിളിച്ചു. ദിവ്യകാരുണ്യമായിത്തീർന്ന ഒരു പ്രേഷിതൻ."],
    ["ഒക്ടോബർ 18 · സുവിശേഷകനായ വിശുദ്ധ ലൂക്കാ","സുവിശേഷവും, ദൗത്യത്തിന്റെ മഹാഗ്രന്ഥമായ അപ്പസ്തോലപ്രവർത്തനങ്ങളും എഴുതിയ വൈദ്യൻ. നസ്രത്തിൽ ഈശോ ഏശയ്യാ 61 വായിച്ചതു ലൂക്കാ മാത്രമാണു രേഖപ്പെടുത്തുന്നത്."],
    ["ഒക്ടോബർ 22 · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","അദ്ദേഹത്തിന്റെ ഓർമദിനം, തന്റെ മാർപാപ്പാശുശ്രൂഷ ആരംഭിച്ച പ്രസംഗത്തിന്റെ വാർഷികമാണ്: “ഭയപ്പെടേണ്ടാ! ക്രിസ്തുവിനായി വാതിലുകൾ മലർക്കെ തുറക്കുവിൻ!”"],
    ["മിഷനുകളുടെ മധ്യസ്ഥൻ · വിശുദ്ധ ഫ്രാൻസിസ് സേവ്യർ","ഇന്ത്യയിൽനിന്ന് എഴുതിയ കത്തിൽ അദ്ദേഹം പറഞ്ഞു: ഇവിടെ അനേകർ ക്രിസ്ത്യാനികളാകാത്തത് ഒരു കാരണത്താൽ മാത്രമാണ്: അവരെ ക്രിസ്ത്യാനികളാക്കാൻ ആരുമില്ല."]],
   prayer:"ഒഴിഞ്ഞ കൈകളും നിറഞ്ഞ ഹൃദയവുമായി ശ്ലീഹന്മാരെ അയച്ച ഈശോയേ, ഞാൻ ജീവിക്കുകയും ജോലിചെയ്യുകയും ചെയ്യുന്നിടത്തേക്ക് ഇന്ന് എന്നെയും അയയ്ക്കണമേ; ദാനമായി ലഭിച്ചതു ദാനമായി കൊടുക്കാൻ എന്നെ സഹായിക്കണമേ. ആമേൻ."}
 },
 lat:{
  en:{title:"Twenty-ninth Sunday in Ordinary Time · World Mission Sunday",
   readTitle:"Readings of the day",
   readings:[["First Reading","Isaiah 45:1, 4–6","I call you by your name, though you do not know me"],["Responsorial Psalm","Psalm 96:1, 3, 4–5, 7–8, 9–10","Give the Lord glory and honour"],["Second Reading","1 Thessalonians 1:1–5b","Faith, love and hope; the Gospel in power and the Holy Spirit"],["Gospel","Matthew 22:15–21","Render to Caesar, and to God"]],
   alt:"",
   verse:"Give therefore to the emperor the things that are the emperor’s, and to God the things that are God’s.",cite:"Matthew 22:21",
   theo:[
    "The first reading is a statement about who rules history. God names Cyrus, a Persian emperor who did not know him, as his instrument: “I am the Lord, and there is no other… I form light and create darkness” (Isaiah 45:6–7). In a Persian world that tended to see light and darkness as rival powers, the prophet insists that there is one Lord of both. Empires are real, but they are not ultimate. God writes straight even with the crooked lines of politics.",
    "In the Gospel, Jesus refuses both easy answers of his day. He is not a zealot who denies Caesar any claim, nor a collaborator who gives Caesar everything. Earthly authority has its own sphere and its own legitimate demands; the Church teaches that the political community and the Church are independent and autonomous in their own fields (Gaudium et Spes 76). But that sphere has a limit. When Caesar demands what belongs to God, the apostles' answer stands: “We must obey God rather than any human authority” (Acts 5:29; Catechism 2242).",
    "The deepest point is the image. The coin belongs to Caesar because it bears his image; the human person belongs to God because he bears God's (Genesis 1:27). Sin has defaced that image without erasing it, and Christ, “the image of the invisible God” (Colossians 1:15), comes to restore it. This is the root of Christian dignity and of Christian mission: every person we meet is a coin of God's minting, waiting to be returned to its owner.",
    "Paul's first letter shows what this looks like in a community: faith that works, love that labours, hope that endures (1 Thessalonians 1:3), and a Gospel that arrives “in power and in the Holy Spirit and with full conviction”. Mission is not a department of the parish. It is what happens when a community is convinced."],
   conn:[
    ["The only pagan called ‘messiah’.","Cyrus is the one non-Israelite in Scripture called the Lord's anointed (Isaiah 45:1). He freed the captives and ordered the Temple rebuilt (Ezra 1:1–4). The Fathers saw in him a figure of Christ, the true Anointed, who frees us from the deeper exile of sin and raises the true Temple of his Body (John 2:19–21)."],
    ["Called by name before he knew God.","“I call you by your name… though you do not know me” (Isaiah 45:4). Mission is not bringing God to people he has never met. It is telling people about a God who already knows them by name."],
    ["What was written on the coin.","The silver denarius of Tiberius carried his portrait and the words “Son of the divine Augustus”. The coin itself claimed divinity for Caesar. Jesus' answer quietly takes that claim apart: give Caesar his coin, and give God what bears God's image."],
    ["Enemies united by a trap.","The Pharisees, who resented Roman rule, came with the Herodians, who depended on it (Matthew 22:16). And they were the ones carrying a coin with Caesar's image in the Temple courts. Jesus did not have one."],
    ["The oldest page of the New Testament.","1 Thessalonians, written around AD 50, is probably the earliest New Testament writing we have. Its first lines already speak of faith, love and hope, and of a Gospel that comes in the Holy Spirit: the first written page of the New Testament is a missionary letter."],
    ["“The Lord reigns from the tree.”","Some ancient Christian copies read Psalm 96:10 as “The Lord reigns from the wood”, and St Justin Martyr quotes it so (Dialogue with Trypho 73). The Church sings it in the hymn Vexilla Regis. The King of the nations reigns from the Cross."]],
   altar:[
    "At the preparation of the gifts we bring “fruit of the earth and work of human hands”. That is our rendering to God what is God's. He receives it, and gives back himself.",
    "Place the coin and the Host side by side. Both are round; both are stamped. The coin bears the face of an emperor who claimed to be divine; the Host often bears the Cross of the One who is divine and emptied himself. In Communion the image of God in us is restored, and we leave Mass carrying a better image than any coin, sent to show it to the nations."],
   outline:[
    ["Opening","Hold up a coin or a currency note. Ask: “Whose picture is on this? And whose picture is on you?”"],
    ["Point 1 · God writes history through people who do not know him","Tell the story of Cyrus, named in prophecy long before he ruled. Apply: God is at work in our nation, workplace and family, even through those who do not believe. This frees us from fear and from despair about politics."],
    ["Point 2 · The coin made a false claim; you carry a true one","Explain the inscription “Son of the divine Augustus”. Caesar claimed divinity on a coin; God put his image on a person. Every human being, unborn, poor, migrant or enemy, carries that image. That is the foundation of both human dignity and mission."],
    ["Point 3 · Faith that works, love that labours, hope that endures","Use 1 Thessalonians 1:3 as the portrait of a missionary parish. Ask which of the three is weakest in us. Quote St John Paul II: “Faith is strengthened when it is given to others.”"],
    ["Closing image","The round coin and the round Host: one is spent in the market, the other is given at the altar. Whose image will we carry out of the church door?"],
    ["Take-home line","“I belong to God; this week I will give him back something that is his.”"]],
   live:[
    ["God at work through others (Isaiah 45)","Name one person you consider an outsider, even an opponent, through whom God may be doing good. Pray for that person by name each day this week."],
    ["Audit your coins (Matthew 22)","Look honestly at where your time, attention and money went this week. Is Caesar receiving more than God? Give one thing back: the first hour of the day, a fixed tithe, or a screen-free evening for your family."],
    ["See the image (Genesis 1:27)","Each day, choose one person you usually overlook, such as a cleaner, a driver, a beggar or a difficult colleague, and treat them deliberately as the bearer of God's image: greet them by name, thank them, listen."],
    ["A missionary from your home (Psalm 96)","Adopt one missionary for the week. Pray for him or her by name, and give generously to today's mission collection. Mission is also for those who send."]],
   fathers:[
    ["Tertullian","Commenting on this Gospel, he says: give to Caesar the image of Caesar, which is on the coin, and to God the image of God, which is on man; so give Caesar your money, and give God yourself (On Idolatry 15)."],
    ["St Leo the Great","“Christian, recognise your dignity.” Made a sharer in the divine nature, do not return to your former baseness (Sermon 21, on the Nativity). The image on the coin of the soul has been restored."],
    ["St Justin Martyr","Reads Psalm 96 as “The Lord reigns from the wood” and sees in it the Cross by which Christ became King of the nations (Dialogue with Trypho 73)."],
    ["St Ignatius of Antioch","“I am God's wheat, and I am ground by the teeth of wild beasts, that I may be found pure bread of Christ.” He rendered to God not a coin but his life (Letter to the Romans 4)."]],
   magis:[
    ["Gaudium et Spes 76","The Church and the political community are independent and autonomous in their own fields, yet both serve the same human persons; the Church is the sign and safeguard of the transcendence of the person."],
    ["Catechism 2242","The citizen is obliged in conscience not to follow the directives of civil authorities when they are contrary to the moral order or the Gospel. “We must obey God rather than any human authority.”"],
    ["Catechism 1701","It is in Christ, “the image of the invisible God”, that man has been created in the image and likeness of the Creator, and in Christ that image is restored."],
    ["St Paul VI, Evangelii Nuntiandi 14","“Evangelizing is in fact the grace and vocation proper to the Church, her deepest identity.”"],
    ["St John Paul II, Redemptoris Missio 2; Pope Francis, Evangelii Gaudium 120","“Faith is strengthened when it is given to others!” And: “Every Christian is a missionary to the extent that he or she has encountered the love of God in Christ Jesus.”"],
    ["This year","Read the Holy Father's Message for World Mission Day 2026 (vatican.va) and quote one line from it in the homily."]],
   saints:[
    ["17 October · St Ignatius of Antioch","Bishop and martyr; “God's wheat” who became “the pure bread of Christ”."],
    ["18 October · St Luke, Evangelist","His feast falls on this Sunday: the physician who wrote the Gospel and the Acts of the Apostles, the book of the Gospel going out to the nations."],
    ["19 October · Sts John de Brébeuf, Isaac Jogues and companions; St Paul of the Cross","The North American martyrs gave everything to make Christ known. Jogues, his fingers mutilated by torture, was given papal permission to celebrate Mass again, returned to the mission and was killed. Paul of the Cross founded the Passionists to preach Christ crucified."],
    ["22 October · St John Paul II","His memorial falls on the anniversary of the homily that opened his pontificate: “Do not be afraid! Open wide the doors for Christ!”"],
    ["23 October · St John of Capistrano","A Franciscan preacher who crossed Europe proclaiming the Gospel."],
    ["24 October · St Anthony Mary Claret","A weaver who became a missionary archbishop in Cuba and founded the Claretians."]],
   prayer:"Father, you have stamped your image on my life. Let me give back to you what is yours, so that your glory may be seen among the nations. Through Christ our Lord. Amen."},
  ml:{title:"ആണ്ടുവട്ടം ഇരുപത്തൊമ്പതാം ഞായർ · ലോക മിഷൻ ഞായർ",
   readTitle:"ഇന്നത്തെ വായനകൾ",
   readings:[["ഒന്നാം വായന","ഏശയ്യാ 45:1, 4–6","നീ എന്നെ അറിയുന്നില്ലെങ്കിലും ഞാൻ നിന്നെ പേരുചൊല്ലി വിളിക്കുന്നു"],["പ്രതിവചനസങ്കീർത്തനം","സങ്കീർത്തനം 96:1, 3, 4–5, 7–8, 9–10","കർത്താവിനു മഹത്വവും ബഹുമാനവും നൽകുവിൻ"],["രണ്ടാം വായന","1 തെസലോനിക്കാ 1:1–5","വിശ്വാസം, സ്നേഹം, പ്രത്യാശ; ശക്തിയിലും പരിശുദ്ധാത്മാവിലും സുവിശേഷം"],["സുവിശേഷം","മത്തായി 22:15–21","സീസറിനുള്ളതു സീസറിനും ദൈവത്തിനുള്ളതു ദൈവത്തിനും"]],
   alt:"",
   verse:"സീസറിനുള്ളതു സീസറിനും ദൈവത്തിനുള്ളതു ദൈവത്തിനും കൊടുക്കുക.",cite:"മത്തായി 22:21",
   theo:[
    "ചരിത്രം ഭരിക്കുന്നത് ആര് എന്നതിനെപ്പറ്റിയുള്ള ഒരു പ്രഖ്യാപനമാണ് ഒന്നാം വായന. തന്നെ അറിയാത്ത പേർഷ്യൻ ചക്രവർത്തിയായ സൈറസിനെ ദൈവം തന്റെ ഉപകരണമായി പേരുചൊല്ലി വിളിക്കുന്നു: “ഞാനാണു കർത്താവ്; മറ്റൊരുവനില്ല… ഞാൻ വെളിച്ചം രൂപപ്പെടുത്തുന്നു, ഇരുട്ടു സൃഷ്ടിക്കുന്നു” (ഏശ 45:6–7). വെളിച്ചത്തെയും ഇരുട്ടിനെയും പരസ്പരം എതിരിടുന്ന ശക്തികളായി കാണാൻ ചായ്‌വുണ്ടായിരുന്ന ഒരു പേർഷ്യൻ ലോകത്തിൽ, രണ്ടിന്റെയും ഏക കർത്താവിനെ പ്രവാചകൻ ഉറപ്പിച്ചുപറയുന്നു. സാമ്രാജ്യങ്ങൾ യാഥാർഥ്യമാണ്; പക്ഷേ അന്തിമമല്ല. രാഷ്ട്രീയത്തിന്റെ വളഞ്ഞ വരകളിലൂടെയും ദൈവം നേരെ എഴുതുന്നു.",
    "സുവിശേഷത്തിൽ, തന്റെ കാലത്തെ എളുപ്പമുള്ള രണ്ട് ഉത്തരങ്ങളും ഈശോ നിരസിക്കുന്നു. സീസറിന് ഒരു അവകാശവുമില്ലെന്നു പറയുന്ന തീവ്രവാദിയല്ല അവിടുന്ന്; സീസറിന് എല്ലാം കൊടുക്കുന്ന സഹകാരിയുമല്ല. ലൗകികാധികാരത്തിന് അതിന്റേതായ മേഖലയും ന്യായമായ ആവശ്യങ്ങളുമുണ്ട്; രാഷ്ട്രീയസമൂഹവും സഭയും തങ്ങളുടെ മേഖലകളിൽ സ്വതന്ത്രവും സ്വയംഭരണാവകാശമുള്ളവയുമാണെന്നു സഭ പഠിപ്പിക്കുന്നു (ഗൗദിയും എത് സ്പെസ് 76). പക്ഷേ ആ മേഖലയ്ക്ക് ഒരു അതിരുണ്ട്. ദൈവത്തിനുള്ളതു സീസർ ആവശ്യപ്പെടുമ്പോൾ ശ്ലീഹന്മാരുടെ ഉത്തരം നിലനിൽക്കുന്നു: “മനുഷ്യരെക്കാൾ ദൈവത്തെയാണു ഞങ്ങൾ അനുസരിക്കേണ്ടത്” (അപ്പ 5:29; മതബോധനഗ്രന്ഥം 2242).",
    "ഏറ്റവും ആഴമേറിയ കാര്യം ഛായയാണ്. നാണയം സീസറിന്റേതാണ്, കാരണം അതിൽ അവന്റെ ഛായയുണ്ട്; മനുഷ്യൻ ദൈവത്തിന്റേതാണ്, കാരണം അവനിൽ ദൈവത്തിന്റെ ഛായയുണ്ട് (ഉൽപ 1:27). പാപം ആ ഛായയെ വികൃതമാക്കി, മായ്ച്ചുകളഞ്ഞില്ല; “അദൃശ്യനായ ദൈവത്തിന്റെ പ്രതിരൂപമായ” ക്രിസ്തു (കൊളോ 1:15) അതു പുനഃസ്ഥാപിക്കാൻ വരുന്നു. ക്രൈസ്തവ മനുഷ്യാന്തസ്സിന്റെയും ക്രൈസ്തവദൗത്യത്തിന്റെയും വേര് ഇതാണ്: നാം കണ്ടുമുട്ടുന്ന ഓരോ വ്യക്തിയും ദൈവം അടിച്ചിറക്കിയ ഒരു നാണയമാണ്; ഉടമസ്ഥന്റെ അടുത്തേക്കു തിരികെ എത്താൻ കാത്തിരിക്കുന്ന നാണയം.",
    "ഒരു സമൂഹത്തിൽ ഇത് എങ്ങനെയിരിക്കുമെന്നു പൗലോസിന്റെ ആദ്യലേഖനം കാണിക്കുന്നു: പ്രവർത്തിക്കുന്ന വിശ്വാസം, അധ്വാനിക്കുന്ന സ്നേഹം, സഹിച്ചുനിൽക്കുന്ന പ്രത്യാശ (1 തെസ 1:3); “ശക്തിയിലും പരിശുദ്ധാത്മാവിലും പൂർണബോധ്യത്തിലും” എത്തുന്ന സുവിശേഷം. ഇടവകയിലെ ഒരു വകുപ്പല്ല ദൗത്യം. ഒരു സമൂഹം ബോധ്യമുള്ളതാകുമ്പോൾ സംഭവിക്കുന്നതാണത്."],
   conn:[
    ["‘മിശിഹാ’ എന്നു വിളിക്കപ്പെട്ട ഏക വിജാതീയൻ.","കർത്താവിന്റെ അഭിഷിക്തൻ എന്നു തിരുലിഖിതം വിളിക്കുന്ന ഏക ഇസ്രായേല്യനല്ലാത്തവനാണു സൈറസ് (ഏശ 45:1). അവൻ ബന്ദികളെ മോചിപ്പിച്ചു; ദേവാലയം പുനർനിർമിക്കാൻ കൽപിച്ചു (എസ്രാ 1:1–4). പാപത്തിന്റെ ആഴമേറിയ പ്രവാസത്തിൽനിന്നു നമ്മെ മോചിപ്പിക്കുകയും തന്റെ ശരീരമാകുന്ന യഥാർഥ ദേവാലയം ഉയർത്തുകയും ചെയ്യുന്ന (യോഹ 2:19–21) യഥാർഥ അഭിഷിക്തനായ ക്രിസ്തുവിന്റെ പ്രതിരൂപം പിതാക്കന്മാർ അവനിൽ കണ്ടു."],
    ["ദൈവത്തെ അറിയുംമുമ്പേ പേരുചൊല്ലി വിളിക്കപ്പെട്ടവൻ.","“ഞാൻ നിന്നെ പേരുചൊല്ലി വിളിക്കുന്നു. നീ എന്നെ അറിയുന്നില്ലെങ്കിലും ഞാൻ നിന്നെ നിന്റെ പിതൃനാമത്തിലും വിളിക്കുന്നു” (ഏശ 45:4). ദൈവം ഒരിക്കലും കണ്ടുമുട്ടിയിട്ടില്ലാത്ത ആളുകളിലേക്കു ദൈവത്തെ കൊണ്ടുചെല്ലലല്ല ദൗത്യം. അവരെ ഇപ്പോൾത്തന്നെ പേരുചൊല്ലി അറിയുന്ന ഒരു ദൈവത്തെപ്പറ്റി അവരോടു പറയലാണ്."],
    ["നാണയത്തിൽ എഴുതിയിരുന്നത്.","തിബേരിയൂസിന്റെ വെള്ളി ദനാറയിൽ അവന്റെ മുഖവും “ദിവ്യനായ അഗസ്റ്റസിന്റെ പുത്രൻ” എന്ന വാക്കുകളുമുണ്ടായിരുന്നു. നാണയംതന്നെ സീസറിനു ദൈവികത അവകാശപ്പെട്ടു. ഈശോയുടെ ഉത്തരം ആ അവകാശവാദത്തെ നിശ്ശബ്ദമായി തകർക്കുന്നു: സീസറിന് അവന്റെ നാണയം; ദൈവത്തിന്, ദൈവച്ഛായ വഹിക്കുന്നത്."],
    ["ഒരു കെണി ഒന്നിപ്പിച്ച ശത്രുക്കൾ.","റോമൻ ഭരണത്തെ വെറുത്ത ഫരിസേയർ, അതിനെ ആശ്രയിച്ചിരുന്ന ഹേറോദേസ് പക്ഷക്കാരോടൊപ്പം വന്നു (മത്താ 22:16). സീസറിന്റെ ഛായയുള്ള നാണയം ദേവാലയാങ്കണത്തിൽ കൊണ്ടുനടന്നതും അവർതന്നെ. ഈശോയുടെ പക്കൽ അതില്ലായിരുന്നു."],
    ["പുതിയനിയമത്തിലെ ഏറ്റവും പഴയ താൾ.","ഏകദേശം എ.ഡി. 50-ൽ എഴുതിയ 1 തെസലോനിക്കാ ആയിരിക്കാം നമുക്കുള്ള ഏറ്റവും പഴയ പുതിയനിയമരചന. അതിന്റെ ആദ്യവരികൾതന്നെ വിശ്വാസത്തെയും സ്നേഹത്തെയും പ്രത്യാശയെയും, പരിശുദ്ധാത്മാവിൽ എത്തുന്ന സുവിശേഷത്തെയുംപറ്റി സംസാരിക്കുന്നു: പുതിയനിയമത്തിന്റെ എഴുതപ്പെട്ട ആദ്യതാൾ ഒരു പ്രേഷിതലേഖനമാണ്."],
    ["“കർത്താവു മരത്തിൽനിന്നു വാഴുന്നു.”","ചില പുരാതന ക്രൈസ്തവ പ്രതികളിൽ സങ്കീർത്തനം 96:10 “കർത്താവു മരത്തിൽനിന്നു വാഴുന്നു” എന്നായിരുന്നു; വിശുദ്ധ ജസ്റ്റിൻ അങ്ങനെ ഉദ്ധരിക്കുന്നു (ത്രീഫോയുമായുള്ള സംവാദം 73). “വെക്സില്ല റേജിസ്” എന്ന ഗീതത്തിൽ സഭ അതു പാടുന്നു. ജനതകളുടെ രാജാവു കുരിശിൽനിന്നു വാഴുന്നു."]],
   altar:[
    "കാഴ്ചസമർപ്പണത്തിൽ നാം “ഭൂമിയുടെ ഫലവും മനുഷ്യാധ്വാനത്തിന്റെ ഫലവും” കൊണ്ടുവരുന്നു. ദൈവത്തിനുള്ളതു ദൈവത്തിനു കൊടുക്കലാണത്. അവിടുന്ന് അതു സ്വീകരിച്ചു തന്നെത്തന്നെ തിരികെ നൽകുന്നു.",
    "നാണയവും തിരുവോസ്തിയും അടുത്തടുത്തു വച്ചു ചിന്തിക്കുക. രണ്ടും വൃത്താകാരം; രണ്ടിലും മുദ്ര. ദൈവമെന്ന് അവകാശപ്പെട്ട ഒരു ചക്രവർത്തിയുടെ മുഖം നാണയം വഹിക്കുന്നു; ദൈവമായിരുന്നിട്ടും തന്നെത്തന്നെ ശൂന്യനാക്കിയവന്റെ കുരിശ് തിരുവോസ്തി പലപ്പോഴും വഹിക്കുന്നു. ദിവ്യകാരുണ്യസ്വീകരണത്തിൽ നമ്മിലെ ദൈവച്ഛായ പുനഃസ്ഥാപിക്കപ്പെടുന്നു; ഏതു നാണയത്തെക്കാളും ശ്രേഷ്ഠമായ ഛായയുമായി നാം കുർബാന കഴിഞ്ഞു പുറത്തിറങ്ങുന്നു; ജനതകൾക്ക് അതു കാണിച്ചുകൊടുക്കാൻ അയയ്ക്കപ്പെടുന്നു."],
   outline:[
    ["ആരംഭം","ഒരു നാണയമോ കറൻസി നോട്ടോ ഉയർത്തിക്കാണിക്കുക. ചോദിക്കുക: “ഇതിൽ ആരുടെ ചിത്രമാണ്? നിങ്ങളിൽ ആരുടെ ചിത്രമാണ്?”"],
    ["ഒന്നാം ആശയം · തന്നെ അറിയാത്തവരിലൂടെയും ദൈവം ചരിത്രം എഴുതുന്നു","ഭരണത്തിലെത്തുന്നതിനു വളരെ മുമ്പേ പ്രവചനത്തിൽ പേരുചൊല്ലി വിളിക്കപ്പെട്ട സൈറസിന്റെ കഥ പറയുക. പ്രയോഗം: നമ്മുടെ രാജ്യത്തും ജോലിസ്ഥലത്തും കുടുംബത്തിലും, വിശ്വസിക്കാത്തവരിലൂടെപോലും, ദൈവം പ്രവർത്തിക്കുന്നു. രാഷ്ട്രീയത്തെപ്പറ്റിയുള്ള ഭയത്തിൽനിന്നും നിരാശയിൽനിന്നും ഇതു നമ്മെ സ്വതന്ത്രരാക്കുന്നു."],
    ["രണ്ടാം ആശയം · നാണയം വ്യാജമായ അവകാശവാദം വഹിച്ചു; നീ സത്യമായ ഒന്നു വഹിക്കുന്നു","“ദിവ്യനായ അഗസ്റ്റസിന്റെ പുത്രൻ” എന്ന ലിഖിതം വിശദീകരിക്കുക. സീസർ നാണയത്തിൽ ദൈവികത അവകാശപ്പെട്ടു; ദൈവം തന്റെ ഛായ ഒരു വ്യക്തിയിൽ പതിപ്പിച്ചു. ഗർഭസ്ഥശിശുവും ദരിദ്രനും പ്രവാസിയും ശത്രുവും ഉൾപ്പെടെ ഓരോ മനുഷ്യനും ആ ഛായ വഹിക്കുന്നു. മനുഷ്യാന്തസ്സിന്റെയും ദൗത്യത്തിന്റെയും അടിസ്ഥാനം അതാണ്."],
    ["മൂന്നാം ആശയം · പ്രവർത്തിക്കുന്ന വിശ്വാസം, അധ്വാനിക്കുന്ന സ്നേഹം, സഹിക്കുന്ന പ്രത്യാശ","ഒരു പ്രേഷിത ഇടവകയുടെ ചിത്രമായി 1 തെസലോനിക്കാ 1:3 ഉപയോഗിക്കുക. മൂന്നിൽ ഏതാണു നമ്മിൽ ഏറ്റവും ദുർബലം എന്നു ചോദിക്കുക. വിശുദ്ധ ജോൺ പോൾ രണ്ടാമനെ ഉദ്ധരിക്കുക: “വിശ്വാസം മറ്റുള്ളവർക്കു നൽകുമ്പോൾ ശക്തിപ്പെടുന്നു.”"],
    ["സമാപനചിത്രം","വൃത്താകാരമായ നാണയവും വൃത്താകാരമായ തിരുവോസ്തിയും: ഒന്നു ചന്തയിൽ ചെലവാക്കപ്പെടുന്നു, മറ്റേതു ബലിപീഠത്തിൽ നൽകപ്പെടുന്നു. പള്ളിവാതിലിലൂടെ പുറത്തിറങ്ങുമ്പോൾ നാം ആരുടെ ഛായ വഹിക്കും?"],
    ["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഞാൻ ദൈവത്തിന്റേതാണ്; അവിടുത്തേതായ ഒന്ന് ഈ ആഴ്ച ഞാൻ അവിടുത്തേക്കു തിരികെ നൽകും.”"]],
   live:[
    ["മറ്റുള്ളവരിലൂടെ പ്രവർത്തിക്കുന്ന ദൈവം (ഏശയ്യാ 45)","പുറത്തുള്ളവനായി, ഒരുപക്ഷേ എതിരാളിയായിപ്പോലും, നീ കരുതുന്ന ഒരാളുടെ പേരു പറയുക; അവനിലൂടെ ദൈവം നന്മ ചെയ്യുന്നുണ്ടാകാം. ഈ ആഴ്ച ദിവസവും ആ വ്യക്തിക്കുവേണ്ടി പേരെടുത്തു പ്രാർഥിക്കുക."],
    ["നിന്റെ നാണയങ്ങളുടെ കണക്കെടുക്കുക (മത്തായി 22)","ഈ ആഴ്ച നിന്റെ സമയവും ശ്രദ്ധയും പണവും എവിടേക്കു പോയി എന്നു സത്യസന്ധമായി നോക്കുക. ദൈവത്തെക്കാൾ അധികം സീസറിനാണോ ലഭിക്കുന്നത്? ഒന്നു തിരികെ നൽകുക: ദിവസത്തിന്റെ ആദ്യമണിക്കൂർ, നിശ്ചിതമായ ഒരു ദശാംശം, അല്ലെങ്കിൽ കുടുംബത്തിനായി മൊബൈൽ ഇല്ലാത്ത ഒരു സായാഹ്നം."],
    ["ആ ഛായ കാണുക (ഉൽപത്തി 1:27)","ഓരോ ദിവസവും, സാധാരണ ശ്രദ്ധിക്കാതെ പോകുന്ന ഒരാളെ, ഒരു ശുചീകരണത്തൊഴിലാളിയെ, ഡ്രൈവറെ, യാചകനെ, ബുദ്ധിമുട്ടുള്ള ഒരു സഹപ്രവർത്തകനെ, തിരഞ്ഞെടുത്ത്, ദൈവച്ഛായ വഹിക്കുന്നവനായി മനഃപൂർവം പരിഗണിക്കുക: പേരുചൊല്ലി അഭിവാദനം ചെയ്യുക, നന്ദി പറയുക, കേൾക്കുക."],
    ["നിന്റെ വീട്ടിൽനിന്ന് ഒരു മിഷനറി (സങ്കീർത്തനം 96)","ഈ ആഴ്ച ഒരു മിഷനറിയെ ദത്തെടുക്കുക. പേരെടുത്തു പ്രാർഥിക്കുക; ഇന്നത്തെ മിഷൻ സ്തോത്രക്കാഴ്ചയിൽ ഉദാരമായി നൽകുക. ദൗത്യം അയയ്ക്കുന്നവർക്കുമുള്ളതാണ്."]],
   fathers:[
    ["തെർത്തുല്യൻ","ഈ സുവിശേഷം വ്യാഖ്യാനിച്ച് അദ്ദേഹം പറയുന്നു: നാണയത്തിലുള്ള സീസറിന്റെ ഛായ സീസറിനും, മനുഷ്യനിലുള്ള ദൈവത്തിന്റെ ഛായ ദൈവത്തിനും കൊടുക്കുക; അതായതു പണം സീസറിനും നിന്നെത്തന്നെ ദൈവത്തിനും (വിഗ്രഹാരാധനയെപ്പറ്റി 15)."],
    ["മഹാനായ വിശുദ്ധ ലെയോ","“ക്രൈസ്തവാ, നിന്റെ മഹത്വം തിരിച്ചറിയുക.” ദൈവികസ്വഭാവത്തിൽ പങ്കുകാരനാക്കപ്പെട്ട നീ പഴയ അധമാവസ്ഥയിലേക്കു മടങ്ങരുത് (തിരുപ്പിറവിയെപ്പറ്റിയുള്ള പ്രസംഗം 21). ആത്മാവാകുന്ന നാണയത്തിലെ ഛായ പുനഃസ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു."],
    ["വിശുദ്ധ ജസ്റ്റിൻ","സങ്കീർത്തനം 96-നെ “കർത്താവു മരത്തിൽനിന്നു വാഴുന്നു” എന്നു വായിച്ച്, ക്രിസ്തു ജനതകളുടെ രാജാവായ കുരിശിനെ അതിൽ കാണുന്നു (ത്രീഫോയുമായുള്ള സംവാദം 73)."],
    ["അന്ത്യോക്യായിലെ വിശുദ്ധ ഇഗ്നേഷ്യസ്","“ഞാൻ ദൈവത്തിന്റെ ഗോതമ്പാണ്; ക്രിസ്തുവിന്റെ നിർമലമായ അപ്പമായി കാണപ്പെടാൻ വന്യമൃഗങ്ങളുടെ പല്ലുകളാൽ ഞാൻ പൊടിക്കപ്പെടുന്നു.” ദൈവത്തിന് അദ്ദേഹം തിരികെ നൽകിയത് ഒരു നാണയമല്ല, തന്റെ ജീവനാണ് (റോമാക്കാർക്കുള്ള ലേഖനം 4)."]],
   magis:[
    ["ഗൗദിയും എത് സ്പെസ് 76","സഭയും രാഷ്ട്രീയസമൂഹവും തങ്ങളുടെ മേഖലകളിൽ സ്വതന്ത്രവും സ്വയംഭരണാവകാശമുള്ളവയുമാണ്; എങ്കിലും ഇരുവരും ഒരേ മനുഷ്യരെ ശുശ്രൂഷിക്കുന്നു; മനുഷ്യവ്യക്തിയുടെ അതീതസ്വഭാവത്തിന്റെ അടയാളവും സംരക്ഷണവുമാണു സഭ."],
    ["മതബോധനഗ്രന്ഥം 2242","ധാർമികക്രമത്തിനോ സുവിശേഷത്തിനോ വിരുദ്ധമാകുമ്പോൾ ഭരണാധികാരികളുടെ നിർദേശങ്ങൾ പിന്തുടരാതിരിക്കാൻ പൗരൻ മനഃസാക്ഷിയാൽ ബാധ്യസ്ഥനാണ്. “മനുഷ്യരെക്കാൾ ദൈവത്തെയാണു നാം അനുസരിക്കേണ്ടത്.”"],
    ["മതബോധനഗ്രന്ഥം 1701","“അദൃശ്യനായ ദൈവത്തിന്റെ പ്രതിരൂപമായ” ക്രിസ്തുവിലാണു മനുഷ്യൻ സ്രഷ്ടാവിന്റെ ഛായയിലും സാദൃശ്യത്തിലും സൃഷ്ടിക്കപ്പെട്ടത്; ക്രിസ്തുവിലാണ് ആ ഛായ പുനഃസ്ഥാപിക്കപ്പെടുന്നത്."],
    ["വിശുദ്ധ പോൾ ആറാമൻ, ഏവൻജെലീ നുന്തിയാന്തി 14","“സുവിശേഷവത്കരണം സഭയുടെ സ്വന്തമായ കൃപയും ദൈവവിളിയും അവളുടെ ഏറ്റവും ആഴമേറിയ സ്വത്വവുമാണ്.”"],
    ["വി. ജോൺ പോൾ രണ്ടാമൻ, റെദെംപ്തോറിസ് മിസ്സിയോ 2; ഫ്രാൻസിസ് മാർപാപ്പ, ഏവൻജെലീ ഗൗദിയും 120","“വിശ്വാസം മറ്റുള്ളവർക്കു നൽകുമ്പോൾ ശക്തിപ്പെടുന്നു!” “ക്രിസ്തുവിൽ ദൈവസ്നേഹം കണ്ടുമുട്ടിയിരിക്കുന്ന അളവിൽ ഓരോ ക്രൈസ്തവനും മിഷനറിയാണ്.”"],
    ["ഈ വർഷം","2026-ലെ ലോക മിഷൻ ദിനത്തിനായുള്ള മാർപാപ്പയുടെ സന്ദേശം (vatican.va) വായിച്ച്, അതിൽനിന്ന് ഒരു വരി പ്രസംഗത്തിൽ ഉദ്ധരിക്കുക."]],
   saints:[
    ["ഒക്ടോബർ 17 · അന്ത്യോക്യായിലെ വിശുദ്ധ ഇഗ്നേഷ്യസ്","മെത്രാനും രക്തസാക്ഷിയും; “ക്രിസ്തുവിന്റെ നിർമലമായ അപ്പ”മായിത്തീർന്ന “ദൈവത്തിന്റെ ഗോതമ്പ്”."],
    ["ഒക്ടോബർ 18 · സുവിശേഷകനായ വിശുദ്ധ ലൂക്കാ","അദ്ദേഹത്തിന്റെ തിരുനാൾ ഈ ഞായറാഴ്ചയാണ്: സുവിശേഷം ജനതകളിലേക്കു പോകുന്നതിന്റെ ഗ്രന്ഥമായ അപ്പസ്തോലപ്രവർത്തനങ്ങളും സുവിശേഷവും എഴുതിയ വൈദ്യൻ."],
    ["ഒക്ടോബർ 19 · വിശുദ്ധ ജോൺ ദ് ബ്രെബ്യൂഫും ഐസക് ജോഗ്സും സഹചാരികളും; കുരിശിന്റെ വിശുദ്ധ പൗലോസ്","ക്രിസ്തുവിനെ അറിയിക്കാൻ എല്ലാം നൽകിയവരാണു വടക്കേ അമേരിക്കയിലെ രക്തസാക്ഷികൾ. പീഡനത്തിൽ വിരലുകൾ നഷ്ടപ്പെട്ട ജോഗ്സിനു വീണ്ടും കുർബാന അർപ്പിക്കാൻ മാർപാപ്പ അനുവാദം നൽകി; അദ്ദേഹം മിഷനിലേക്കു മടങ്ങി, കൊല്ലപ്പെട്ടു. ക്രൂശിതനായ ക്രിസ്തുവിനെ പ്രസംഗിക്കാൻ കുരിശിന്റെ പൗലോസ് പാഷനിസ്റ്റ് സഭ സ്ഥാപിച്ചു."],
    ["ഒക്ടോബർ 22 · വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ","അദ്ദേഹത്തിന്റെ ഓർമദിനം, മാർപാപ്പാശുശ്രൂഷ ആരംഭിച്ച പ്രസംഗത്തിന്റെ വാർഷികമാണ്: “ഭയപ്പെടേണ്ടാ! ക്രിസ്തുവിനായി വാതിലുകൾ മലർക്കെ തുറക്കുവിൻ!”"],
    ["ഒക്ടോബർ 23 · കപ്പിസ്ത്രാനോയിലെ വിശുദ്ധ ജോൺ","യൂറോപ്പു മുഴുവൻ സഞ്ചരിച്ചു സുവിശേഷം പ്രസംഗിച്ച ഫ്രാൻസിസ്കൻ പ്രഭാഷകൻ."],
    ["ഒക്ടോബർ 24 · വിശുദ്ധ ആന്റണി മേരി ക്ലാരറ്റ്","ക്യൂബയിൽ മിഷനറി ആർച്ച്ബിഷപ്പായിത്തീർന്നു ക്ലരീഷ്യൻ സഭ സ്ഥാപിച്ച ഒരു നെയ്ത്തുകാരൻ."]],
   prayer:"പിതാവേ, എന്റെ ജീവിതത്തിൽ അങ്ങയുടെ ഛായ പതിപ്പിച്ചവനേ, അങ്ങയുടേത് അങ്ങേക്കു തിരികെ നൽകാൻ എന്നെ സഹായിക്കണമേ; അങ്ങനെ ജനതകളുടെ ഇടയിൽ അങ്ങയുടെ മഹത്വം കാണപ്പെടട്ടെ. ഞങ്ങളുടെ കർത്താവായ ഈശോമിശിഹാവഴി. ആമേൻ."}
 }

var EXTRA={
"2026-10-18":{
 smc:{
  en:{quick:["God does not send us with a plan; he sends us with his Name and his fire.","What we received freely at the altar, we cannot keep: it becomes our mission.","Mission begins on holy ground, in adoration, and travels light."],
   action:"Today, give one thing freely to someone who cannot repay you.",
   question:"Where is the bush burning in my ordinary work today?",
   special:"Mission Sunday (World Mission Day). The whole Church prays for missionaries, and the collection supports the Pontifical Mission Societies. This year marks a hundred years since Pope Pius XI instituted World Mission Sunday in 1926. Read the diocesan or Synod circular for the day if one has been issued.",
   illus:["An illustration from Kerala","Blessed Rani Maria, a Syro-Malabar Franciscan Clarist sister from Pulluvazhy near Perumbavoor, went as a missionary to the poor of Madhya Pradesh and was stabbed to death in 1995 for working to free poor and landless people from exploitation. Her murderer later repented, and her mother and sister embraced him as family. Mission does not end with the missionary's death; it ends with the enemy becoming a brother."],
   kids:"Children, Moses took off his sandals because God was there. When we take off our chappals at the church door, we are saying: “Jesus, you are here!” And then Jesus says to us: “Now go, and tell others I love them.”",
   diaspora:"",
   family:{read:"Read together: Matthew 10:7–8.",explain:"Jesus sent his friends to tell everyone that God loves them, and to help the sick. He told them: you got God's love as a free gift, so give it free.",intention:"Tonight we pray for missionaries, especially those from our own parish and family, and for people who have never heard of Jesus.",ask:"Ask at the table: “Who can I help this week without wanting anything back?”"},
   catechism:[["CCC 849–856","The missionary mandate: why the Church is sent to all nations."],["CCC 2104–2105","The duty to share the faith with respect for others' freedom."],["CCC 1396–1397","The Eucharist makes the Church and commits us to the poor."]],
   kidsaint:["Saint Luke (18 October)","Luke was a doctor. He met St Paul and travelled with him on his missionary journeys. He listened carefully to everyone who had known Jesus, and then wrote it all down in his Gospel so that we could know Jesus too. Lesson: use your talents, like Luke used his pen, to tell others about Jesus."],
   term:["Madbaha (മദ്ബഹാ)","From the Syriac word for altar. In our churches it is the sanctuary, raised and separated by a veil, which represents heaven. Like Moses at the bush, we approach it with reverence. In the Syro-Malabar tradition the veil (വിരി) is opened and closed at certain moments of the Qurbana to show that heaven is opened to us in Christ."],
   termMore:["Why is Mission Sunday in the season of Moses?","The Syro-Malabar calendar places the last Sundays of Elijah–Cross–Moses before the Dedication of the Church. These weeks look toward the Lord's second coming and the end of history. Mission Sunday fits there well: the Church is sent precisely because history is moving toward the Day of the Lord."]},
  ml:{quick:["ഒരു പദ്ധതിയുമായല്ല, തന്റെ നാമവും അഗ്നിയുമായാണു ദൈവം നമ്മെ അയയ്ക്കുന്നത്.","ബലിപീഠത്തിങ്കൽ ദാനമായി ലഭിച്ചതു നമുക്കു സൂക്ഷിച്ചുവയ്ക്കാനാവില്ല; അതു നമ്മുടെ ദൗത്യമാകുന്നു.","ദൗത്യം ആരംഭിക്കുന്നതു വിശുദ്ധഭൂമിയിൽ, ആരാധനയിലാണ്; അതു ഭാരമില്ലാതെ യാത്രചെയ്യുന്നു."],
   action:"തിരിച്ചു തരാൻ കഴിയാത്ത ഒരാൾക്ക് ഇന്ന് ഒരു കാര്യം ദാനമായി കൊടുക്കുക.",
   question:"എന്റെ ഇന്നത്തെ സാധാരണ ജോലിയിൽ മുൾപ്പടർപ്പ് എവിടെയാണ് എരിയുന്നത്?",
   special:"മിഷൻ ഞായർ (ലോക മിഷൻ ദിനം). സഭ മുഴുവൻ മിഷനറിമാർക്കുവേണ്ടി പ്രാർഥിക്കുന്നു; സ്തോത്രക്കാഴ്ച പൊന്തിഫിക്കൽ മിഷൻ സൊസൈറ്റികളെ സഹായിക്കുന്നു. 1926-ൽ പതിനൊന്നാം പീയൂസ് മാർപാപ്പ ലോക മിഷൻ ഞായർ ഏർപ്പെടുത്തിയതിന്റെ നൂറാം വർഷമാണിത്. ഈ ദിവസത്തേക്കു രൂപതയുടെയോ സിനഡിന്റെയോ സർക്കുലർ ഉണ്ടെങ്കിൽ അതു വായിക്കുക.",
   illus:["കേരളത്തിൽനിന്ന് ഒരു ഉദാഹരണം","പെരുമ്പാവൂരിനടുത്തു പുല്ലുവഴിയിൽനിന്നുള്ള ഫ്രാൻസിസ്കൻ ക്ലാരിസ്റ്റ് സന്യാസിനിയായ വാഴ്ത്തപ്പെട്ട റാണി മരിയ മധ്യപ്രദേശിലെ ദരിദ്രരുടെ ഇടയിലേക്കു മിഷനറിയായി പോയി; ദരിദ്രരെയും ഭൂമിയില്ലാത്തവരെയും ചൂഷണത്തിൽനിന്നു മോചിപ്പിക്കാൻ പ്രവർത്തിച്ചതിന് 1995-ൽ കുത്തേറ്റു കൊല്ലപ്പെട്ടു. അവളുടെ ഘാതകൻ പിന്നീടു പശ്ചാത്തപിച്ചു; അവളുടെ അമ്മയും സഹോദരിയും അവനെ കുടുംബാംഗമായി സ്വീകരിച്ചു. മിഷനറിയുടെ മരണത്തോടെയല്ല ദൗത്യം അവസാനിക്കുന്നത്; ശത്രു സഹോദരനാകുമ്പോഴാണ്."],
   kids:"കുഞ്ഞുങ്ങളേ, ദൈവം അവിടെയുണ്ടായിരുന്നതുകൊണ്ടാണു മോശ ചെരുപ്പ് ഊരിയത്. പള്ളിവാതിൽക്കൽ നാം ചെരുപ്പ് ഊരിവയ്ക്കുമ്പോൾ നാം പറയുന്നു: “ഈശോയേ, അങ്ങ് ഇവിടെയുണ്ട്!” അപ്പോൾ ഈശോ നമ്മോടു പറയുന്നു: “ഇനി പോയി, ഞാൻ അവരെ സ്നേഹിക്കുന്നു എന്നു മറ്റുള്ളവരോടു പറയുക.”",
   diaspora:"",
   family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 10:7–8.",explain:"ദൈവം എല്ലാവരെയും സ്നേഹിക്കുന്നു എന്ന് എല്ലാവരോടും പറയാനും രോഗികളെ സഹായിക്കാനും ഈശോ തന്റെ സ്നേഹിതരെ അയച്ചു. അവിടുന്ന് അവരോടു പറഞ്ഞു: ദൈവസ്നേഹം നിങ്ങൾക്കു സൗജന്യമായി കിട്ടി; അതുകൊണ്ടു സൗജന്യമായി കൊടുക്കുക.",intention:"ഇന്നു രാത്രി നാം മിഷനറിമാർക്കുവേണ്ടി, പ്രത്യേകിച്ചു നമ്മുടെ ഇടവകയിൽനിന്നും കുടുംബത്തിൽനിന്നുമുള്ളവർക്കുവേണ്ടി, ഈശോയെപ്പറ്റി ഒരിക്കലും കേട്ടിട്ടില്ലാത്തവർക്കുവേണ്ടി പ്രാർഥിക്കുന്നു.",ask:"ഭക്ഷണമേശയിൽ ചോദിക്കുക: “ഒന്നും തിരിച്ചു പ്രതീക്ഷിക്കാതെ ഈ ആഴ്ച ഞാൻ ആരെ സഹായിക്കും?”"},
   catechism:[["മതബോധനഗ്രന്ഥം 849–856","പ്രേഷിതാദേശം: സഭ എല്ലാ ജനതകളിലേക്കും അയയ്ക്കപ്പെടുന്നത് എന്തുകൊണ്ട്."],["മതബോധനഗ്രന്ഥം 2104–2105","മറ്റുള്ളവരുടെ സ്വാതന്ത്ര്യം മാനിച്ചുകൊണ്ടു വിശ്വാസം പങ്കുവയ്ക്കാനുള്ള കടമ."],["മതബോധനഗ്രന്ഥം 1396–1397","ദിവ്യകാരുണ്യം സഭയെ രൂപപ്പെടുത്തുന്നു; ദരിദ്രരോടുള്ള കടമയിലേക്കു നമ്മെ നയിക്കുന്നു."]],
   kidsaint:["വിശുദ്ധ ലൂക്കാ (ഒക്ടോബർ 18)","ലൂക്കാ ഒരു ഡോക്ടറായിരുന്നു. അദ്ദേഹം വിശുദ്ധ പൗലോസിനെ കണ്ടുമുട്ടി, അദ്ദേഹത്തോടൊപ്പം മിഷൻയാത്രകൾ ചെയ്തു. ഈശോയെ അറിയാമായിരുന്ന എല്ലാവരെയും അദ്ദേഹം ശ്രദ്ധയോടെ കേട്ടു; നമുക്കും ഈശോയെ അറിയാൻവേണ്ടി അതെല്ലാം തന്റെ സുവിശേഷത്തിൽ എഴുതിവച്ചു. പാഠം: ലൂക്കാ തന്റെ തൂലിക ഉപയോഗിച്ചതുപോലെ, ഈശോയെപ്പറ്റി മറ്റുള്ളവരോടു പറയാൻ നിന്റെ കഴിവുകൾ ഉപയോഗിക്കുക."],
   term:["മദ്ബഹാ","ബലിപീഠം എന്നർഥമുള്ള സുറിയാനി വാക്കിൽനിന്ന്. നമ്മുടെ പള്ളികളിൽ ഇത്, ഉയർത്തപ്പെട്ടതും വിരികൊണ്ടു വേർതിരിക്കപ്പെട്ടതുമായ, സ്വർഗത്തെ പ്രതിനിധാനം ചെയ്യുന്ന ശ്രീകോവിലാണ്. മുൾപ്പടർപ്പിനരികിലെ മോശയെപ്പോലെ നാം ഭക്ത്യാദരത്തോടെ അതിനെ സമീപിക്കുന്നു. ക്രിസ്തുവിൽ സ്വർഗം നമുക്കായി തുറക്കപ്പെട്ടിരിക്കുന്നു എന്നു കാണിക്കാൻ, സീറോ മലബാർ പാരമ്പര്യത്തിൽ കുർബാനയുടെ ചില നിമിഷങ്ങളിൽ വിരി തുറക്കുകയും അടയ്ക്കുകയും ചെയ്യുന്നു."],
   termMore:["മിഷൻ ഞായർ മൂശെക്കാലത്ത് എന്തുകൊണ്ട്?","പള്ളിക്കൂദാശക്കാലത്തിനു മുമ്പ് ഏലിയാ–സ്ലീവാ–മൂശെക്കാലത്തിന്റെ അവസാന ഞായറാഴ്ചകളാണു സീറോ മലബാർ കലണ്ടർ വയ്ക്കുന്നത്. കർത്താവിന്റെ രണ്ടാം വരവിലേക്കും ചരിത്രത്തിന്റെ അന്ത്യത്തിലേക്കും ഈ ആഴ്ചകൾ നോക്കുന്നു. മിഷൻ ഞായർ അവിടെ നന്നായി ചേരുന്നു: ചരിത്രം കർത്താവിന്റെ ദിനത്തിലേക്കു നീങ്ങുന്നതുകൊണ്ടുതന്നെയാണു സഭ അയയ്ക്കപ്പെടുന്നത്."]}
 },
 lat:{
  en:{quick:["God rules history, even through rulers who do not know him.","The coin bears Caesar's image; you bear God's. Give him what is his: yourself.","Faith that works, love that labours, hope that endures: that is a missionary parish."],
   action:"Today, give God back one thing that is his: an hour, an offering, or your full attention to one person.",
   question:"Whose image is stamped on the way I spend my day?",
   special:"World Mission Sunday. The collection today supports the Pontifical Mission Societies. This year marks a hundred years since Pope Pius XI instituted World Mission Sunday in 1926. Read the Holy Father's Message for the day.",
   illus:["An illustration","A coin found in an old field still shows the emperor's face, though the emperor has been dust for two thousand years. Images outlast their makers. So does the image of God in a human person, however defaced: no sin, poverty or illness can erase it. Every Missionaries of Charity home in Kerala is built on that conviction."],
   kids:"Children, look at a coin. Whose picture is on it? Now look at your friend. Whose picture is in him or her? God's! That is why we must never hurt anyone: everyone carries God's picture.",
   diaspora:"",
   family:{read:"Read together: Matthew 22:19–21.",explain:"People tried to trick Jesus with a coin. Jesus said: the coin has the king's picture, so give it to the king. But you are made in God's picture, so give yourself to God.",intention:"Tonight we pray for missionaries all over the world, and for leaders of our country to be honest and just.",ask:"Ask at the table: “What is one thing I can give back to God this week?”"},
   catechism:[["CCC 1700–1702","The human person is made in the image of God."],["CCC 2238–2242","Duties of citizens, and when we must obey God rather than any human authority."],["CCC 849–856","The Church's missionary mandate."]],
   kidsaint:["Saint Luke (18 October)","Luke was a doctor who travelled with St Paul. He listened carefully to everyone who had known Jesus and wrote a Gospel and the Acts of the Apostles, so that people everywhere could know Jesus. Lesson: use your talents to tell others about Jesus."],
   term:["Preparation of the Gifts","The moment after the Prayer of the Faithful when bread and wine, with the people's offerings, are brought to the altar. The priest blesses God for “fruit of the earth and work of human hands”. It is the Church's way of rendering to God what is God's: our work and our lives, placed on the altar to be united with Christ's sacrifice."],
   termMore:["Why is today's colour green?","Green is the colour of Ordinary Time, the season of growth, when the Church follows Christ's public life Sunday by Sunday. Ordinary here means counted or ordered (from the Latin ordinalis), not plain: the Sundays are numbered."]},
  ml:{quick:["തന്നെ അറിയാത്ത ഭരണാധികാരികളിലൂടെപോലും ദൈവം ചരിത്രം ഭരിക്കുന്നു.","നാണയത്തിൽ സീസറിന്റെ ഛായ; നിന്നിൽ ദൈവത്തിന്റെ ഛായ. അവിടുത്തേത് അവിടുത്തേക്കു കൊടുക്കുക: നിന്നെത്തന്നെ.","പ്രവർത്തിക്കുന്ന വിശ്വാസം, അധ്വാനിക്കുന്ന സ്നേഹം, സഹിക്കുന്ന പ്രത്യാശ: അതാണ് ഒരു പ്രേഷിത ഇടവക."],
   action:"അവിടുത്തേതായ ഒന്ന് ഇന്നു ദൈവത്തിനു തിരികെ നൽകുക: ഒരു മണിക്കൂർ, ഒരു കാഴ്ച, അല്ലെങ്കിൽ ഒരു വ്യക്തിക്കു നിന്റെ മുഴുവൻ ശ്രദ്ധ.",
   question:"ഞാൻ ദിവസം ചെലവഴിക്കുന്ന രീതിയിൽ ആരുടെ ഛായയാണു പതിഞ്ഞിരിക്കുന്നത്?",
   special:"ലോക മിഷൻ ഞായർ. ഇന്നത്തെ സ്തോത്രക്കാഴ്ച പൊന്തിഫിക്കൽ മിഷൻ സൊസൈറ്റികളെ സഹായിക്കുന്നു. 1926-ൽ പതിനൊന്നാം പീയൂസ് മാർപാപ്പ ലോക മിഷൻ ഞായർ ഏർപ്പെടുത്തിയതിന്റെ നൂറാം വർഷമാണിത്. ഈ ദിവസത്തേക്കുള്ള മാർപാപ്പയുടെ സന്ദേശം വായിക്കുക.",
   illus:["ഒരു ഉദാഹരണം","പഴയ ഒരു വയലിൽനിന്നു കണ്ടെടുത്ത നാണയത്തിൽ, രണ്ടായിരം വർഷം മുമ്പു മണ്ണായിത്തീർന്ന ചക്രവർത്തിയുടെ മുഖം ഇപ്പോഴും കാണാം. ഛായകൾ അവയെ ഉണ്ടാക്കിയവരെക്കാൾ നിലനിൽക്കുന്നു. മനുഷ്യവ്യക്തിയിലെ ദൈവച്ഛായയും അങ്ങനെതന്നെ; അതെത്ര വികൃതമായാലും പാപത്തിനോ ദാരിദ്ര്യത്തിനോ രോഗത്തിനോ അതു മായ്ക്കാനാവില്ല. കേരളത്തിലെ ഓരോ മിഷനറീസ് ഓഫ് ചാരിറ്റി ഭവനവും ആ ബോധ്യത്തിന്മേലാണു പണിതിരിക്കുന്നത്."],
   kids:"കുഞ്ഞുങ്ങളേ, ഒരു നാണയം നോക്കൂ. അതിൽ ആരുടെ ചിത്രമാണ്? ഇനി നിന്റെ കൂട്ടുകാരനെ നോക്കൂ. അവനിൽ ആരുടെ ചിത്രമാണ്? ദൈവത്തിന്റേത്! അതുകൊണ്ടാണു നാം ആരെയും വേദനിപ്പിക്കരുതാത്തത്: എല്ലാവരും ദൈവത്തിന്റെ ചിത്രം വഹിക്കുന്നു.",
   diaspora:"",
   family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 22:19–21.",explain:"ഒരു നാണയംകൊണ്ട് ഈശോയെ കുടുക്കാൻ ആളുകൾ ശ്രമിച്ചു. ഈശോ പറഞ്ഞു: നാണയത്തിൽ രാജാവിന്റെ ചിത്രമാണ്; അതു രാജാവിനു കൊടുക്കുക. പക്ഷേ നിങ്ങൾ ദൈവത്തിന്റെ ചിത്രത്തിലാണ് ഉണ്ടാക്കപ്പെട്ടത്; അതുകൊണ്ടു നിങ്ങളെത്തന്നെ ദൈവത്തിനു കൊടുക്കുക.",intention:"ഇന്നു രാത്രി ലോകമെങ്ങുമുള്ള മിഷനറിമാർക്കുവേണ്ടിയും, നമ്മുടെ രാജ്യത്തിന്റെ നേതാക്കൾ സത്യസന്ധരും നീതിമാന്മാരുമായിരിക്കാനും നാം പ്രാർഥിക്കുന്നു.",ask:"ഭക്ഷണമേശയിൽ ചോദിക്കുക: “ഈ ആഴ്ച ദൈവത്തിന് എനിക്കു തിരികെ നൽകാവുന്ന ഒരു കാര്യം എന്താണ്?”"},
   catechism:[["മതബോധനഗ്രന്ഥം 1700–1702","മനുഷ്യവ്യക്തി ദൈവത്തിന്റെ ഛായയിൽ സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 2238–2242","പൗരന്മാരുടെ കടമകൾ; മനുഷ്യരെക്കാൾ ദൈവത്തെ അനുസരിക്കേണ്ടത് എപ്പോൾ."],["മതബോധനഗ്രന്ഥം 849–856","സഭയുടെ പ്രേഷിതാദേശം."]],
   kidsaint:["വിശുദ്ധ ലൂക്കാ (ഒക്ടോബർ 18)","വിശുദ്ധ പൗലോസിനോടൊപ്പം യാത്രചെയ്ത ഒരു ഡോക്ടറായിരുന്നു ലൂക്കാ. ഈശോയെ അറിയാമായിരുന്ന എല്ലാവരെയും അദ്ദേഹം ശ്രദ്ധയോടെ കേട്ടു; എല്ലായിടത്തുമുള്ള ആളുകൾ ഈശോയെ അറിയാൻവേണ്ടി ഒരു സുവിശേഷവും അപ്പസ്തോലപ്രവർത്തനങ്ങളും എഴുതി. പാഠം: ഈശോയെപ്പറ്റി മറ്റുള്ളവരോടു പറയാൻ നിന്റെ കഴിവുകൾ ഉപയോഗിക്കുക."],
   term:["കാഴ്ചസമർപ്പണം","വിശ്വാസികളുടെ പ്രാർഥനയ്ക്കുശേഷം, ജനങ്ങളുടെ കാഴ്ചകളോടൊപ്പം അപ്പവും വീഞ്ഞും ബലിപീഠത്തിലേക്കു കൊണ്ടുവരുന്ന നിമിഷം. “ഭൂമിയുടെ ഫലവും മനുഷ്യാധ്വാനത്തിന്റെ ഫലവും” നൽകിയ ദൈവത്തെ വൈദികൻ സ്തുതിക്കുന്നു. ദൈവത്തിനുള്ളതു ദൈവത്തിനു കൊടുക്കുന്ന സഭയുടെ രീതിയാണിത്: നമ്മുടെ അധ്വാനവും ജീവിതവും ക്രിസ്തുവിന്റെ ബലിയോടു ചേരാൻ ബലിപീഠത്തിൽ വയ്ക്കപ്പെടുന്നു."],
   termMore:["ഇന്നത്തെ നിറം പച്ചയായിരിക്കുന്നത് എന്തുകൊണ്ട്?","ആണ്ടുവട്ടത്തിന്റെ നിറമാണു പച്ച: വളർച്ചയുടെ കാലം; ക്രിസ്തുവിന്റെ പരസ്യജീവിതത്തെ ഞായറാഴ്ചതോറും സഭ പിന്തുടരുന്ന കാലം. ഇംഗ്ലീഷിലെ “Ordinary” എന്ന വാക്കിന് ഇവിടെ “സാധാരണ” എന്നല്ല, “എണ്ണപ്പെട്ട” എന്നാണ് അർഥം (ലത്തീൻ ordinalis): ഞായറാഴ്ചകൾക്ക് എണ്ണമിട്ടിരിക്കുന്നു."]}

  en:{homily:[
   "Dear brothers and sisters, today the whole Church keeps Mission Sunday, and the readings God gives us all speak of being sent. Let me begin with a question: when did God last interrupt your ordinary day?",
   "Moses was not praying when God called him. He was at work, looking after his father-in-law's sheep in the desert. He was eighty years old. Long ago he had killed a man and run away. He was, by every human measure, a failure. And in that ordinary place, a bush began to burn and was not consumed.",
   "Notice what God says first: “Remove the sandals from your feet, for the place on which you are standing is holy ground.” Before God gives Moses a task, he asks for reverence. Before he sends him, he tells him his Name: “I AM WHO I AM.” Mission does not begin with planning; it begins with adoration. Every time we take off our footwear at the door of this church, we repeat Moses' gesture. This madbaha is our Horeb. The fire of the Holy Spirit comes down on this altar, and the bread, like the bush, is not consumed but changed into the Body of Christ.",
   "Then the prophet Isaiah says: “The Spirit of the Lord is upon me, because he has anointed me to bring good news to the poor.” Jesus read these very words in the synagogue at Nazareth. And he stopped reading before the words about the day of vengeance. Our mission is not to condemn. It is to proclaim the year of the Lord's favour.",
   "In the Gospel, Jesus sends the Twelve with nothing: no gold, no bag, no second tunic. And he gives them one rule: “You received without payment; give without payment.” Paul lived it; he preached the Gospel free of charge. Among the names of those first Twelve is Thomas, our father in faith, who later walked all the way to our land with nothing but the Word.",
   "So what does Mission Sunday ask of us? Not that everyone should go to Africa or the North-East, though some of you may be called. It asks that we take off our sandals before God every day, that we look for the broken-hearted near us, and that we give freely what we have freely received. Every Qurbana ends with a sending. Today the God who said to Moses, “Come, I will send you,” says it to this parish. Let us answer like St Thomas: “Let us also go.” Amen."],
  kids:[

   "And God told Moses: “Take off your chappals, this place is holy.” What do we do when we come to church? We take off our chappals! So every time you leave your chappals at the church door, you are doing what Moses did. You are saying: “Jesus, you are here.”",
   "Then God said to Moses: “Go! I am sending you.” And Jesus said the same to his friends: “Go and tell everyone that God loves them.” He said: “You got God's love free, so give it free.”",
   "So this week, here is your mission: do one kind thing for someone without asking for anything back. Share your tiffin, help your friend with homework, help Amma at home. That is how a little missionary works. Can you do it? Let us say together: “Jesus, send me!”"],
