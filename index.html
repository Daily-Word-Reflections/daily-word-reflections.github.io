<body>
<title>Daily Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Malayalam:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
/* Layout: a sanctuary-night header band with lamp glow; date bar; three page tabs (Lectern, Homily notes, Calendar page) each with its own content */
:root{
  --bg:#F1F2EE; --paper:#FDFDFB; --ink:#1C2424; --muted:#5B6664; --rule:#DCDFD8;
  --gold:#A9822F; --goldsoft:#E9DDBF; --night:#16182A;
  --maroon:#7E2635; --indigo:#2C4677; --green:#2D6A4E; --accent:var(--maroon); --soft:#ECEEE8;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.06);
  --display:"Cormorant Garamond","Noto Serif Malayalam",Georgia,serif;
  --serif:"Spectral","Noto Serif Malayalam",Georgia,serif;
  --mlserif:"Noto Serif Malayalam","Spectral",serif;
  --sans:"IBM Plex Sans","Noto Sans Malayalam",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101415; --paper:#181E1F; --ink:#E8ECEA; --muted:#9AA5A2; --rule:#2B3434;
  --gold:#D8B865; --goldsoft:#3A3322; --maroon:#E79AA6; --indigo:#A3BAE8; --green:#86C9A5; --soft:#1F2627;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101415; --paper:#181E1F; --ink:#E8ECEA; --muted:#9AA5A2; --rule:#2B3434;
  --gold:#D8B865; --goldsoft:#3A3322; --maroon:#E79AA6; --indigo:#A3BAE8; --green:#86C9A5; --soft:#1F2627;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.7}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:grid;gap:18px}
:lang(ml) .wrap{font-family:var(--mlserif);font-size:16.5px}

/* Header band: always night, with lamp glow */
.band{position:relative;overflow:hidden;border-radius:18px;padding:26px 22px 22px;color:#F4EEDD;
  background:radial-gradient(120% 90% at 85% 0%,rgba(233,196,106,.35),transparent 55%),radial-gradient(80% 70% at 0% 100%,rgba(126,38,53,.55),transparent 60%),linear-gradient(160deg,#1B1D33 0%,#14152A 60%,#221427 100%);
  box-shadow:0 10px 30px rgba(20,16,40,.25)}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 80px);pointer-events:none}
.band .eyebrow{font:600 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#E3C77E;display:flex;align-items:center;gap:10px}
.band .eyebrow::before,.band .eyebrow::after{content:"";height:1px;flex:0 0 28px;background:linear-gradient(90deg,transparent,#E3C77E)}
.band .eyebrow::after{background:linear-gradient(90deg,#E3C77E,transparent)}
.brand{margin:6px 0 2px;font-family:var(--mlserif);font-weight:700;font-size:34px;line-height:1.2;
  background:linear-gradient(180deg,#FFF6DD 0%,#E9C877 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
:lang(en) .brand{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:.01em}
.band .sub{font:14px var(--sans);color:#CFC6B4}
.band .verse-line{margin-top:12px;font-family:var(--display);font-style:italic;font-size:18px;color:#EDE3C8}
:lang(ml) .band .verse-line{font-family:var(--mlserif);font-style:normal;font-size:15px}

/* Controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.seg button{font:600 13.5px var(--sans);border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.seg button:focus-visible,.nav button:focus-visible,.tabs button:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.datebar input{font:600 15px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:7px 10px}
.datebar .dlabel{font:600 15px var(--sans);flex:1;min-width:180px}
.pill{font:600 13px var(--sans);border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{font:600 14px var(--sans);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.note{font:13.5px/1.5 var(--sans);color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 14px}
.note b{color:var(--ink)}

/* Day card */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:24px 22px;display:grid;gap:22px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.season{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.week{font:14px var(--sans);color:var(--muted)}
.dtitle{font-family:var(--display);font-size:32px;line-height:1.2;margin:2px 0 0;font-weight:600;text-wrap:balance}
:lang(ml) .dtitle{font-family:var(--mlserif);font-size:25px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:8px;font:13px var(--sans);color:var(--muted)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--green)}
h3.sh{display:flex;align-items:center;gap:10px;margin:0;font:600 12.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h3.sh::before{content:"✦";font-size:11px}
h3.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldsoft),transparent)}
.readings{display:grid;gap:10px}
.rd{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--rule)}
.rd .lab{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.rd .ref{font:600 16px var(--sans)}
.rd .rt{grid-column:2;font-style:italic;color:var(--muted);font-size:15px}
.grp{font:600 13px var(--sans);color:var(--accent);margin-top:4px}
.alt{font:13.5px/1.5 var(--sans);color:var(--muted)}
blockquote.key{margin:0;padding:18px 20px;border-radius:14px;text-align:center;font-family:var(--display);font-style:italic;font-size:24px;line-height:1.35;
  background:radial-gradient(90% 120% at 50% 0%,var(--goldsoft),transparent 70%);border:1px solid var(--goldsoft)}
:lang(ml) blockquote.key{font-family:var(--mlserif);font-style:normal;font-size:19px}
blockquote.key cite{display:block;font:normal 13px var(--sans);color:var(--muted);margin-top:6px}
.prose{display:grid;gap:12px}
.prose p{margin:0;max-width:68ch}
.prose p:first-child::first-letter{font-family:var(--display);font-size:3.1em;float:left;line-height:.85;padding:6px 8px 0 0;color:var(--accent)}
:lang(ml) .prose p:first-child::first-letter{font-family:inherit;font-size:inherit;float:none;padding:0;color:inherit}
.items{display:grid;gap:12px}
.item{display:grid;gap:3px;padding-left:14px;border-left:2px solid var(--goldsoft)}
.item b{font:600 15px var(--sans);color:var(--ink)}
.item p{margin:0}
.quote .item p{font-style:italic}
:lang(ml) .quote .item p{font-style:normal}
.outline{counter-reset:o;display:grid;gap:12px}
.ol{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ol .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--accent);color:var(--paper)}
.ol .n.g{background:var(--gold)}
.ol b{font:600 15px var(--sans);display:block}
.ol p{margin:2px 0 0}
.prayer{font-style:italic;text-align:center;padding:14px 18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
:lang(ml) .prayer{font-style:normal}
.empty{display:grid;gap:10px;justify-items:start;font:15px/1.6 var(--sans);color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dcell{border:1px solid var(--rule);border-radius:12px;padding:8px 6px;background:var(--bg);display:grid;gap:2px;text-align:center;cursor:pointer;font-family:var(--sans);min-width:0}
.dcell[aria-current="date"]{border-color:var(--gold);background:radial-gradient(100% 100% at 50% 0%,var(--goldsoft),var(--bg))}
.dcell .wd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dcell .dn{font:600 22px/1.1 var(--display)}
.dcell .tt{font-size:10.5px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:600px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}.rd{grid-template-columns:1fr}.rd .rt{grid-column:1}.dtitle{font-size:26px}}
.post{display:grid;gap:10px}
.post pre{white-space:pre-wrap;font:14px/1.55 var(--sans);background:var(--bg);border:1px dashed var(--rule);border-radius:12px;padding:14px;margin:0;max-height:300px;overflow:auto}
.copy{justify-self:start;font:600 14px var(--sans);background:var(--accent);color:var(--paper);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
footer{font:13px/1.55 var(--sans);color:var(--muted);display:grid;gap:6px}
/* v6 additions */
.fs button{min-width:38px}
.search{display:grid;gap:8px}
.search input{padding-left:42px!important;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2718%27 height=%2718%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23A9822F%27 stroke-width=%272.2%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%277%27/%3E%3Cpath d=%27M20 20l-4-4%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:14px center;width:100%;box-sizing:border-box;font:15px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.results{display:grid;gap:6px;max-height:320px;overflow:auto}
.res{text-align:left;font:14px/1.45 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;cursor:pointer}
.res b{display:block;font-weight:600}
.res span{color:var(--muted);font-size:13px}
details.sx summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.sx summary::-webkit-details-marker{display:none}
details.sx summary::after{content:"▾";font-size:12px;color:var(--gold)}
details.sx[open] summary::after{content:"▴"}
details.sx .sxbody{margin-top:8px;font:15px/1.6 var(--serif);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-transform:none;letter-spacing:0}
:lang(ml) details.sx .sxbody{font-family:var(--mlserif)}
.quick{border-radius:16px;padding:16px 18px;display:grid;gap:8px;background:linear-gradient(135deg,var(--goldsoft),transparent 75%);border:1px solid var(--goldsoft)}
.quick .qh{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.quick ul{margin:0;padding-left:20px;display:grid;gap:4px}
.quick .act{font:600 15px var(--sans)}
.question{text-align:center;font-family:var(--display);font-style:italic;font-size:21px;padding:6px 10px}
:lang(ml) .question{font-family:var(--mlserif);font-style:normal;font-size:17px}
.special{font:14.5px/1.55 var(--sans);border-left:4px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 14px}
.placeholder{font:14px/1.55 var(--sans);color:var(--muted);border:1px dashed var(--rule);border-radius:12px;padding:12px 14px}
.reqcard{display:grid;gap:8px;border-radius:16px;padding:16px 18px;background:radial-gradient(100% 120% at 100% 0%,var(--goldsoft),var(--bg) 70%);border:1px solid var(--rule)}
.reqcard b{font:600 16px var(--sans)}
details.about{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px}
details.about summary{cursor:pointer;font:600 14px var(--sans);color:var(--ink)}
details.about p{margin:8px 0 0;font:14px/1.6 var(--sans);color:var(--muted)}
details.about ol{margin:10px 0 0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
details.about li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;font:14px/1.6 var(--sans);color:var(--muted)}
details.about li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--goldsoft);color:var(--ink);font:600 13px/26px var(--sans);text-align:center}
details.about li b{display:block;color:var(--ink)}
.contact{display:grid;gap:10px;border-radius:16px;padding:18px;background:radial-gradient(100% 120% at 100% 0%,var(--goldsoft),var(--paper) 70%);border:1px solid var(--rule)}
.contact h3{margin:0;font:600 17px var(--sans);color:var(--ink)}
.contact p{margin:0;font:14.5px/1.6 var(--sans);color:var(--muted)}
.contact .btns{display:flex;flex-wrap:wrap;gap:8px}
.contact a{text-decoration:none;font:600 14px var(--sans);padding:9px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.contact a:hover{border-color:var(--gold)}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card>*,.card section,.readings,.rd,.rd>*,.strip,.dcell{min-width:0}
.rd>*{overflow-wrap:anywhere}
.card header{grid-template-columns:minmax(0,1fr)}.picker{min-width:0}
.picker select{flex:1 1 140px;min-width:0;max-width:100%;font:15px var(--sans);padding:9px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.picker button{font:600 18px var(--sans);width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.picker .count{font:13px var(--sans);color:var(--muted)}
.welcome{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,12,20,.62)}
.welcome[hidden]{display:none}
.wbox{width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:20px;padding:24px 20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:var(--sans)}
.wbox h2{margin:0;font:600 28px var(--display)}
.wbox p{margin:0;font:14.5px/1.6 var(--sans);color:var(--muted)}
.wbox .wl{font:600 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wbox .wopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.wbox .wopts button{font:600 15px var(--sans);padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer}
.wbox .wopts button[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.wbox .go{font:600 16px var(--sans);padding:13px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
.term{font-family:var(--display);font-size:28px;font-weight:600;margin:0}
:lang(ml) .term{font-family:var(--mlserif);font-size:22px}
#sample,.empty .pill{display:none!important}
.preview{font:600 14px/1.5 var(--sans);text-align:center;padding:10px 14px;border-radius:12px;background:var(--goldsoft);color:var(--ink)}
</style>

<div class="wrap" id="app" lang="ml">
  <section class="band">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="brand" id="brand"></h1>
    <div class="sub" id="bandsub"></div>
    <div class="verse-line" id="bandverse"></div>
  </section>

  <div class="preview" id="preview">Preview · under preparation. Daily reflections begin with the new liturgical year: Syro-Malankara from 1 November 2026; Syro-Malabar and Latin from 29 November 2026.</div>

  <div class="bar">
    <div class="seg" role="group" aria-label="Rite"><button id="r-smc" data-rite="smc"></button><button id="r-smk" data-rite="smk"></button><button id="r-lat" data-rite="lat"></button><button id="r-docs" data-view="docs"></button><button id="r-occ" data-view="occ"></button></div>
    <div class="seg" role="group" aria-label="Language" id="langseg"></div>
    <div class="seg fs" role="group" aria-label="Text size"><button id="fs-m" aria-label="Smaller text">A−</button><button id="fs-p" aria-label="Larger text">A+</button></div>
  </div>

  <div class="datebar">
    <div class="nav"><button id="prev" aria-label="Previous day">‹</button><button id="next" aria-label="Next day">›</button></div>
    <div class="dlabel" id="dlabel"></div>
    <input type="date" id="dpick" aria-label="Choose date">
    <button class="pill" id="today"></button>
    <button class="pill" id="sample"></button>
  </div>

  <div class="search"><input type="search" id="q" aria-label="Search"><div class="results" id="results" hidden></div></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-lectern" data-tab="lectern"></button>
    <button role="tab" id="t-homily" data-tab="homily"></button>
    <button role="tab" id="t-cal" data-tab="cal"></button>
    <button role="tab" id="t-family" data-tab="family"></button>
    <button role="tab" id="t-lit" data-tab="lit"></button>
  </div>

  <div class="note" id="note"></div>
  <article class="card" id="card"></article>
  <section class="contact" id="contact"></section>
  <details class="about" id="about"><summary id="about-s"></summary><div id="about-b"></div></details>
  <footer id="foot"></footer>
</div>

<script>
var CONTENT={};
var EXTRA={};
/* Papal and Church documents, latest first. [year, pope key, type, Latin title, English title, Malayalam title, English summary, Malayalam summary] */
var POPES={"leo-xiv":["Pope Leo XIV","ലെയോ പതിനാലാമൻ മാർപാപ്പ"],"francesco":["Pope Francis","ഫ്രാൻസിസ് മാർപാപ്പ"],"benedict-xvi":["Benedict XVI","ബെനഡിക്ട് പതിനാറാമൻ"],"john-paul-ii":["St John Paul II","വിശുദ്ധ ജോൺ പോൾ രണ്ടാമൻ"],"paul-vi":["St Paul VI","വിശുദ്ധ പോൾ ആറാമൻ"],"council":["Second Vatican Council","രണ്ടാം വത്തിക്കാൻ കൗൺസിൽ"]};

/* ================= QUDOS EETHO · 1 November 2026 ================= */
put("2026-11-01","en",{title:"Qudos Eetho Sunday · Sanctification of the Church",readTitle:"Readings (Syro-Malankara Sacred Lectionary)",
 readings:[["Evening Gospel","Mark 8:27–30","“You are the Christ”"],["Old Testament","Exodus 10:1–5 (as printed; see note)","The dwelling of God"],["Old Testament","1 Kings 6:1–8","Solomon builds the Temple"],["Old Testament","Ezekiel 10:1–5, 18–22","The glory of the Lord and the Temple"],["Old Testament","Isaiah 6:1–8","“Holy, holy, holy”"],["Catholic Epistle","1 Peter 2:1–12","Living stones, a royal priesthood"],["Epistle of St Paul","Ephesians 2:14–22","Christ the cornerstone; a dwelling place for God"],["Gospel","Matthew 16:13–23","On this rock I will build my Church"]],
 alt:"Beginning of the liturgical year; the season of Annunciation (Suboro) begins. Note: the lectionary prints “Ex 10:1–5”; the setting up of the Tabernacle in Exodus 40:1–5 appears to be intended. Please confirm with the printed lectionary.",
 verse:"And I tell you, you are Peter, and on this rock I will build my church, and the gates of Hades will not prevail against it.",cite:"Matthew 16:18",
 theo:["The Syro-Malankara year does not begin with Christmas or with Advent but with the Church. On Qudos Eetho Sunday we remember that God has sanctified a people for himself and made it his dwelling. Everything that follows in the year, the Annunciation, the Birth of the Lord, his Passion and Resurrection, is celebrated by this Church and for this Church.","The Old Testament readings trace the long story of God's dwelling. Moses sets up the Tabernacle; Solomon builds the Temple; Ezekiel sees the glory of the Lord rise from the Temple and depart because of the people's sins; Isaiah sees the Lord enthroned, hears the seraphim cry “Holy, holy, holy” and is sent. God wants to live among his people, but his presence is holy, and it cannot be taken for granted.","The New Testament shows where that glory finally comes to rest. Christ himself is the cornerstone, and believers become “living stones… built into a spiritual house, to be a holy priesthood” (1 Peter 2:5). In the Gospel, Peter confesses, “You are the Christ, the Son of the living God”, and Jesus answers, “On this rock I will build my church.” The Church is not a human association; it is built by Christ, on the faith of Peter, and the powers of death will not overcome it.","For the Syro-Malankara Catholic Church this Gospel has a special meaning. In 1930 Archbishop Mar Ivanios and his companions, keeping the ancient West Syriac liturgy, entered full communion with the Bishop of Rome, the successor of Peter. Unity with Peter and fidelity to our own Antiochene heritage are not opposed; together they express the one Catholic Church built on the rock."],
 conn:[["The glory leaves and returns.","Ezekiel sees the glory depart from the Temple (10:18) and later return (43:4). John says of Christ: “the Word became flesh and lived among us” (John 1:14), literally “pitched his tent”. The glory has come back to dwell, in Christ and in his Church."],["The song of the seraphim.","The “Holy, holy, holy” Isaiah heard in the Temple (6:3) is the hymn we sing at every Holy Qurbono before the anaphora. Each Sunday the parish joins the seraphim."],["A royal priesthood.","1 Peter 2:9 applies to the baptised the words God spoke at Sinai: “You shall be for me a priestly kingdom and a holy nation” (Exodus 19:6)."],["The keys.","Peter receives the keys (Matthew 16:19) as Eliakim received “the key of the house of David” (Isaiah 22:22): a steward's authority, given for service."]],
 altar:["A church building is consecrated with holy Myron, and its altar becomes the place where heaven touches earth. But the walls are only a sign. At the Holy Qurbono the Church is built: “the Eucharist makes the Church” (Ecclesia de Eucharistia 26). Each time we receive the Body of Christ, we are made more truly the living stones of his house."],
 outline:[["Opening","Ask: why does our liturgical year begin with the Church, and not with Christmas?"],["Point 1 · God wants to dwell among us","From the Tabernacle to the Temple: God's desire is to live with his people. Show the glory departing in Ezekiel: holiness cannot be presumed."],["Point 2 · Living stones","1 Peter 2: each baptised person is a stone in God's house. Ask: what kind of stone am I, supporting or crumbling?"],["Point 3 · On this rock","Peter's confession and Christ's promise. Speak of Mar Ivanios and the reunion of 1930: communion with Peter and fidelity to our Syriac heritage."],["Closing image","The seraphim's “Holy, holy, holy”, which we will sing in a few minutes: heaven's song in a parish church."],["Take-home line","“I am a living stone in God's house this year.”"]],
 live:[["Be a living stone (1 Peter 2:5)","Choose one concrete way to support your parish this year: a ministry, a family unit, or helping someone come back to the Qurbono."],["Pray “Holy, holy, holy” (Isaiah 6:3)","Each morning this week, pray the Trisagion slowly before starting work."],["Pray for unity with Peter (Matthew 16:18)","Pray for the Pope and our Major Archbishop-Catholicos by name this week."]],
 fathers:[["St Augustine","Preaching at the dedication of a church: “This is the house of our prayers, but we ourselves are the house of God.” What was done in building the walls is done in us when we are brought into faith and joined by love (Sermon 336)."],["St Ephrem the Syrian","He calls the Church the new Eden and the place where the Tree of Life, Christ, gives his fruit in the Mysteries (Hymns on Paradise)."]],
 magis:[["Lumen Gentium 6","The Church is called the building of God, the house in which his family dwells, the holy temple, built on Christ the cornerstone and on the foundation of the apostles."],["Orientalium Ecclesiarum 2–3","The particular Churches of East and West are of equal dignity and are entrusted to the pastoral government of the Roman Pontiff, successor of Peter."],["Catechism 756, 881","The Church as temple and living stones; Peter as the rock on which Christ built his Church."]],
 saints:[["This week (as in the lectionary; confirm 2026–27 dates)","Commemoration of Bishop Paulose Mar Philexinos; the 318 Fathers of the Council of Nicaea; the 33 Martyrs of Melitene; All Holy Angels."],["Servant of God Archbishop Mar Ivanios","Founder of the reunion movement (1930) and of the Bethany religious congregations; his cause for canonisation is in progress."]],
 prayer:"Lord Jesus Christ, cornerstone of your Church, sanctify us as living stones of your house. Keep us faithful to Peter's confession and to the faith of our fathers, that with the seraphim we may sing your holiness for ever. Amen."},
 {quick:["Our liturgical year begins with the Church: God's dwelling among his people.","Christ is the cornerstone; every baptised person is a living stone.","“On this rock I will build my Church”: unity with Peter and fidelity to our Syriac heritage go together."],action:"Choose one concrete way to serve your parish this year.",question:"What kind of stone am I in God's house?",
  special:"Qudos Eetho Sunday: beginning of the liturgical year of the Syro-Malankara Catholic Church. The S'himo prayer begins with the First Qolo.",
  illus:["An illustration","When a new church is consecrated in Kerala, the bishop anoints the altar and walls with holy Myron, and people remember that day for generations. Peter tells us that every baptised person has been anointed and built into God's house even more truly."],kids:"",diaspora:"",
  family:{read:"Read together: 1 Peter 2:4–5.",explain:"A church is built with stones. God's Church is built with people! Each of us is a living stone, and Jesus is the most important stone, the cornerstone.",intention:"We pray for our parish and for all who serve in it.",ask:"Ask: “How can our family help our parish this year?”"},
  catechism:[["CCC 751–757","Images of the Church: building, temple, family."],["CCC 880–882","Peter and the college of bishops."]],
  kidsaint:["Servant of God Mar Ivanios","Born in 1882 at Mavelikara, he became a priest, a teacher and a monk, and founded the Bethany communities. In 1930 he led his people into communion with the Pope while keeping their beautiful Syriac Qurbono. Lesson: love your own Church and stay united with the whole Church."],
  term:["Qudos Eetho (കൂദോശ് ഈത്തോ)","Syriac for “the sanctification of the Church”. The Sunday between 30 October and 5 November, which opens the Syro-Malankara liturgical year. The next Sunday is Hudos Eetho, “the renewal of the Church”."],
  termMore:["The seven seasons","The Syro-Malankara year has seven seasons: Annunciation (Suboro), Yaldo–Denho, the Great Fast, Qyomtho (Resurrection), Pentecost, Transfiguration, and the Holy Cross (Sleebo)."]},
 {homily:["Dear brothers and sisters, today a new liturgical year begins, and our Church begins it in a very wise way: not with Christmas, but with the Church herself. Qudos Eetho, the Sanctification of the Church. Before we celebrate the mysteries of Christ, we remember the house in which we celebrate them.","Listen to the long story told in our readings. Moses sets up the Tabernacle; Solomon builds the Temple; Ezekiel sees the glory of the Lord leave the Temple because the people had defiled it; Isaiah sees the Lord on his throne and hears the seraphim cry, “Holy, holy, holy.” God wants to live among his people, but his holiness can never be taken for granted.","Then St Peter tells us where God lives now: in us. “Like living stones, let yourselves be built into a spiritual house.” Every baptised person is a stone in God's house. Some stones carry weight; some stones crumble. This year, what kind of stone will I be?","And in the Gospel Jesus says to Peter: “On this rock I will build my church.” For us Syro-Malankara Catholics these words are dear. In 1930 Mar Ivanios led our forefathers into communion with the successor of Peter, while keeping our ancient Syriac liturgy. Unity with Peter and love for our own tradition are not two loyalties; they are one Catholic faith.","In a few moments we will sing with the seraphim, “Holy, holy, holy.” Heaven's song in our parish church. Let us begin this year as living stones, holy, united and faithful. Amen."],
  kids:["Children, what is a church built with? Stones and bricks! But God's Church is built with people. You are a living stone in God's house!","And the most important stone is Jesus. He holds everything together. Peter said, “You are the Christ,” and Jesus built his Church on Peter's faith.","This year, be a strong stone: come to Holy Qurbono, help in the parish, and be kind. Let's say together: “I am a living stone for Jesus!”"]});

put("2026-11-01","ml",{title:"കൂദോശ് ഈത്തോ ഞായർ · സഭാശുദ്ധീകരണം",readTitle:"വായനകൾ (സീറോ മലങ്കര വിശുദ്ധ വായനാപുസ്തകം)",
 readings:[["സന്ധ്യാസുവിശേഷം","മർക്കോസ് 8:27–30","“നീ ക്രിസ്തുവാണ്”"],["പഴയനിയമം","പുറപ്പാട് 10:1–5 (അച്ചടിച്ചിരിക്കുന്നതുപോലെ; കുറിപ്പു കാണുക)","ദൈവത്തിന്റെ വാസസ്ഥലം"],["പഴയനിയമം","1 രാജാക്കന്മാർ 6:1–8","സോളമൻ ദേവാലയം പണിയുന്നു"],["പഴയനിയമം","എസെക്കിയേൽ 10:1–5, 18–22","കർത്താവിന്റെ മഹത്വവും ദേവാലയവും"],["പഴയനിയമം","ഏശയ്യാ 6:1–8","“പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ”"],["കാതോലിക ലേഖനം","1 പത്രോസ് 2:1–12","ജീവനുള്ള കല്ലുകൾ, രാജകീയ പുരോഹിതഗണം"],["വി. പൗലോസിന്റെ ലേഖനം","എഫേസോസ് 2:14–22","ക്രിസ്തു മൂലക്കല്ല്; ദൈവത്തിന്റെ വാസസ്ഥലം"],["ഏവൻഗേലിയോൻ","മത്തായി 16:13–23","ഈ പാറമേൽ എന്റെ സഭ ഞാൻ സ്ഥാപിക്കും"]],
 alt:"ആരാധനാവത്സരാരംഭം; മംഗളവാർത്താക്കാലം (സൂബോറോ) ആരംഭിക്കുന്നു. കുറിപ്പ്: വായനാപുസ്തകത്തിൽ “പുറ 10:1–5” എന്ന് അച്ചടിച്ചിരിക്കുന്നു; സമാഗമകൂടാരം സ്ഥാപിക്കുന്ന പുറപ്പാട് 40:1–5 ആണ് ഉദ്ദേശിച്ചിരിക്കുന്നതെന്നു തോന്നുന്നു. അച്ചടിച്ച വായനാപുസ്തകവുമായി ഒത്തുനോക്കുക.",
 verse:"ഞാൻ നിന്നോടു പറയുന്നു: നീ പത്രോസാണ്; ഈ പാറമേൽ എന്റെ സഭ ഞാൻ സ്ഥാപിക്കും. നരകകവാടങ്ങൾ അതിനെതിരേ പ്രബലപ്പെടുകയില്ല.",cite:"മത്തായി 16:18",
 theo:["സീറോ മലങ്കര ആരാധനാവത്സരം ആരംഭിക്കുന്നതു ക്രിസ്മസിലോ ആഗമനകാലത്തിലോ അല്ല, സഭയിലാണ്. ദൈവം തനിക്കായി ഒരു ജനത്തെ വിശുദ്ധീകരിച്ചു തന്റെ വാസസ്ഥലമാക്കിയിരിക്കുന്നുവെന്നു കൂദോശ് ഈത്തോ ഞായറാഴ്ച നാം ഓർക്കുന്നു. വർഷത്തിൽ തുടർന്നുവരുന്നതെല്ലാം, മംഗളവാർത്തയും കർത്താവിന്റെ ജനനവും പീഡാസഹനവും ഉത്ഥാനവും, ഈ സഭയാലും ഈ സഭയ്ക്കുവേണ്ടിയുമാണ് ആഘോഷിക്കപ്പെടുന്നത്.","ദൈവവാസത്തിന്റെ നീണ്ട കഥ പഴയനിയമവായനകൾ പിന്തുടരുന്നു. മോശ സമാഗമകൂടാരം സ്ഥാപിക്കുന്നു; സോളമൻ ദേവാലയം പണിയുന്നു; ജനത്തിന്റെ പാപങ്ങൾ നിമിത്തം കർത്താവിന്റെ മഹത്വം ദേവാലയത്തിൽനിന്ന് ഉയർന്നു പുറപ്പെടുന്നത് എസെക്കിയേൽ കാണുന്നു; സിംഹാസനസ്ഥനായ കർത്താവിനെ ഏശയ്യാ കാണുന്നു, “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ” എന്നു സെറാഫുകൾ ഉദ്ഘോഷിക്കുന്നതു കേൾക്കുന്നു, അയയ്ക്കപ്പെടുന്നു. തന്റെ ജനത്തിന്റെ ഇടയിൽ വസിക്കാൻ ദൈവം ആഗ്രഹിക്കുന്നു; പക്ഷേ അവിടുത്തെ സാന്നിധ്യം പരിശുദ്ധമാണ്; അതിനെ നിസ്സാരമായി കാണാനാവില്ല.","ആ മഹത്വം ഒടുവിൽ എവിടെ വസിക്കുന്നുവെന്നു പുതിയനിയമം കാണിക്കുന്നു. ക്രിസ്തുതന്നെയാണു മൂലക്കല്ല്; വിശ്വാസികൾ “ജീവനുള്ള കല്ലുകളായി… ഒരു ആത്മീയഭവനമായി, വിശുദ്ധ പുരോഹിതഗണമായി” പണിയപ്പെടുന്നു (1 പത്രോ 2:5). സുവിശേഷത്തിൽ, “നീ ജീവനുള്ള ദൈവത്തിന്റെ പുത്രനായ ക്രിസ്തുവാണ്” എന്നു പത്രോസ് ഏറ്റുപറയുന്നു; യേശു ഉത്തരം നൽകുന്നു: “ഈ പാറമേൽ എന്റെ സഭ ഞാൻ സ്ഥാപിക്കും.” സഭ ഒരു മാനുഷികസംഘടനയല്ല; പത്രോസിന്റെ വിശ്വാസത്തിന്മേൽ ക്രിസ്തു പണിതതാണ്; മരണത്തിന്റെ ശക്തികൾ അതിനെ കീഴടക്കുകയില്ല.","സീറോ മലങ്കര കത്തോലിക്കാസഭയ്ക്ക് ഈ സുവിശേഷത്തിനു പ്രത്യേക അർഥമുണ്ട്. 1930-ൽ മാർ ഈവാനിയോസ് മെത്രാപ്പോലീത്തായും സഹചാരികളും, പുരാതന അന്ത്യോക്യൻ സുറിയാനി ആരാധനക്രമം കാത്തുകൊണ്ട്, പത്രോസിന്റെ പിൻഗാമിയായ റോമാമെത്രാനുമായി പൂർണ കൂട്ടായ്മയിൽ പ്രവേശിച്ചു. പത്രോസുമായുള്ള ഐക്യവും നമ്മുടെ സ്വന്തം അന്ത്യോക്യൻ പൈതൃകത്തോടുള്ള വിശ്വസ്തതയും പരസ്പരവിരുദ്ധമല്ല; പാറമേൽ പണിതിരിക്കുന്ന ഏക കത്തോലിക്കാസഭയെ അവ ഒന്നിച്ചു പ്രകാശിപ്പിക്കുന്നു."],
 conn:[["മഹത്വം വിട്ടുപോകുന്നു, തിരിച്ചുവരുന്നു.","മഹത്വം ദേവാലയം വിട്ടുപോകുന്നത് (10:18) എസെക്കിയേൽ കാണുന്നു; പിന്നീട് അതു തിരിച്ചുവരുന്നതും (43:4). ക്രിസ്തുവിനെപ്പറ്റി യോഹന്നാൻ പറയുന്നു: “വചനം മാംസമായി നമ്മുടെ ഇടയിൽ വസിച്ചു” (യോഹ 1:14); അക്ഷരാർഥത്തിൽ “കൂടാരമടിച്ചു”. മഹത്വം വസിക്കാൻ തിരിച്ചുവന്നിരിക്കുന്നു: ക്രിസ്തുവിലും അവിടുത്തെ സഭയിലും."],["സെറാഫുകളുടെ ഗീതം.","ദേവാലയത്തിൽ ഏശയ്യാ കേട്ട “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ” (6:3) ഓരോ വിശുദ്ധ കുർബാനയിലും അനാഫൊറയ്ക്കു മുമ്പു നാം പാടുന്ന ഗീതമാണ്. ഓരോ ഞായറാഴ്ചയും ഇടവക സെറാഫുകളോടു ചേരുന്നു."],["രാജകീയ പുരോഹിതഗണം.","സീനായിൽ ദൈവം പറഞ്ഞ “നിങ്ങൾ എനിക്കു പുരോഹിതരാജ്യവും വിശുദ്ധജനവുമായിരിക്കും” (പുറ 19:6) എന്ന വാക്കുകൾ 1 പത്രോസ് 2:9 മാമ്മോദീസ സ്വീകരിച്ചവരെപ്പറ്റി പറയുന്നു."],["താക്കോലുകൾ.","“ദാവീദുഭവനത്തിന്റെ താക്കോൽ” എലിയാക്കിമിനു ലഭിച്ചതുപോലെ (ഏശ 22:22) പത്രോസിനു താക്കോലുകൾ ലഭിക്കുന്നു (മത്താ 16:19): ശുശ്രൂഷയ്ക്കായി നൽകപ്പെട്ട ഒരു കാര്യസ്ഥന്റെ അധികാരം."]],
 altar:["വിശുദ്ധ മൂറോൻകൊണ്ട് ഒരു ദേവാലയം കൂദാശ ചെയ്യപ്പെടുന്നു; അതിന്റെ ബലിപീഠം സ്വർഗം ഭൂമിയെ സ്പർശിക്കുന്ന ഇടമാകുന്നു. പക്ഷേ ഭിത്തികൾ ഒരു അടയാളം മാത്രം. വിശുദ്ധ കുർബാനയിലാണു സഭ പണിയപ്പെടുന്നത്: “ദിവ്യകാരുണ്യം സഭയെ രൂപപ്പെടുത്തുന്നു” (എക്ലേസിയ ദെ എവുക്കരിസ്തിയ 26). ക്രിസ്തുവിന്റെ ശരീരം സ്വീകരിക്കുമ്പോഴെല്ലാം നാം അവിടുത്തെ ഭവനത്തിലെ ജീവനുള്ള കല്ലുകളായി കൂടുതൽ യഥാർഥമായി മാറുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: നമ്മുടെ ആരാധനാവത്സരം ക്രിസ്മസിലല്ലാതെ സഭയിൽ ആരംഭിക്കുന്നത് എന്തുകൊണ്ട്?"],["ഒന്നാം ആശയം · ദൈവം നമ്മുടെ ഇടയിൽ വസിക്കാൻ ആഗ്രഹിക്കുന്നു","സമാഗമകൂടാരംമുതൽ ദേവാലയംവരെ: തന്റെ ജനത്തോടൊപ്പം ജീവിക്കുകയാണു ദൈവത്തിന്റെ ആഗ്രഹം. എസെക്കിയേലിൽ മഹത്വം വിട്ടുപോകുന്നതു കാണിക്കുക: വിശുദ്ധിയെ നിസ്സാരമായി കാണാനാവില്ല."],["രണ്ടാം ആശയം · ജീവനുള്ള കല്ലുകൾ","1 പത്രോസ് 2: മാമ്മോദീസ സ്വീകരിച്ച ഓരോരുത്തരും ദൈവഭവനത്തിലെ ഒരു കല്ലാണ്. ചോദിക്കുക: ഞാൻ എങ്ങനെയുള്ള കല്ലാണ്: താങ്ങുന്നതോ പൊടിഞ്ഞുവീഴുന്നതോ?"],["മൂന്നാം ആശയം · ഈ പാറമേൽ","പത്രോസിന്റെ ഏറ്റുപറച്ചിലും ക്രിസ്തുവിന്റെ വാഗ്ദാനവും. മാർ ഈവാനിയോസിനെയും 1930-ലെ പുനരൈക്യത്തെയുംപറ്റി പറയുക: പത്രോസുമായുള്ള കൂട്ടായ്മയും നമ്മുടെ സുറിയാനി പൈതൃകത്തോടുള്ള വിശ്വസ്തതയും."],["സമാപനചിത്രം","അൽപസമയത്തിനകം നാം പാടാൻ പോകുന്ന സെറാഫുകളുടെ “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ”: ഒരു ഇടവകദേവാലയത്തിൽ സ്വർഗത്തിന്റെ ഗീതം."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഈ വർഷം ഞാൻ ദൈവഭവനത്തിലെ ജീവനുള്ള ഒരു കല്ലാണ്.”"]],
 live:[["ജീവനുള്ള കല്ലാകുക (1 പത്രോസ് 2:5)","ഈ വർഷം നിന്റെ ഇടവകയെ താങ്ങാൻ വ്യക്തമായ ഒരു വഴി തിരഞ്ഞെടുക്കുക: ഒരു ശുശ്രൂഷ, ഒരു കുടുംബയൂണിറ്റ്, അല്ലെങ്കിൽ കുർബാനയിലേക്കു മടങ്ങിവരാൻ ഒരാളെ സഹായിക്കൽ."],["“പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ” പ്രാർഥിക്കുക (ഏശയ്യാ 6:3)","ഈ ആഴ്ച എല്ലാ ദിവസവും രാവിലെ ജോലി തുടങ്ങുംമുമ്പു ത്രിശുദ്ധകീർത്തനം സാവധാനം പ്രാർഥിക്കുക."],["പത്രോസുമായുള്ള ഐക്യത്തിനായി പ്രാർഥിക്കുക (മത്തായി 16:18)","ഈ ആഴ്ച മാർപാപ്പയ്ക്കും നമ്മുടെ മേജർ ആർച്ച്ബിഷപ്-കാതോലിക്കോസിനുംവേണ്ടി പേരെടുത്തു പ്രാർഥിക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","ഒരു ദേവാലയത്തിന്റെ സമർപ്പണദിനത്തിൽ പ്രസംഗിക്കുമ്പോൾ: “ഇതു നമ്മുടെ പ്രാർഥനകളുടെ ഭവനമാണ്; എന്നാൽ നാംതന്നെയാണു ദൈവത്തിന്റെ ഭവനം.” ഭിത്തികൾ പണിതപ്പോൾ സംഭവിച്ചതു വിശ്വാസത്തിലേക്കു കൊണ്ടുവരപ്പെടുകയും സ്നേഹത്താൽ ചേർക്കപ്പെടുകയും ചെയ്യുമ്പോൾ നമ്മിൽ സംഭവിക്കുന്നു (പ്രസംഗം 336)."],["മാർ അപ്രേം","സഭയെ പുതിയ ഏദനായും, ജീവവൃക്ഷമായ ക്രിസ്തു രഹസ്യങ്ങളിൽ തന്റെ ഫലം നൽകുന്ന ഇടമായും അദ്ദേഹം വിളിക്കുന്നു (പറുദീസാഗീതങ്ങൾ)."]],
 magis:[["ലുമെൻ ജെൻസിയും 6","സഭ ദൈവത്തിന്റെ കെട്ടിടമെന്നും, അവിടുത്തെ കുടുംബം വസിക്കുന്ന ഭവനമെന്നും, ക്രിസ്തുവാകുന്ന മൂലക്കല്ലിന്മേലും ശ്ലീഹന്മാരുടെ അടിസ്ഥാനത്തിന്മേലും പണിയപ്പെട്ട വിശുദ്ധ ആലയമെന്നും വിളിക്കപ്പെടുന്നു."],["ഓറിയന്താലിയും എക്ലേസിയാരും 2–3","പൗരസ്ത്യത്തിലെയും പാശ്ചാത്യത്തിലെയും വ്യക്തിസഭകൾ തുല്യമഹത്വമുള്ളവയാണ്; പത്രോസിന്റെ പിൻഗാമിയായ റോമാമാർപാപ്പയുടെ അജപാലനഭരണത്തിന് അവ ഏൽപിക്കപ്പെട്ടിരിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 756, 881","ആലയവും ജീവനുള്ള കല്ലുകളുമായ സഭ; ക്രിസ്തു തന്റെ സഭ പണിത പാറയായ പത്രോസ്."]],
 saints:[["ഈ ആഴ്ച (വായനാപുസ്തകത്തിലെപ്പോലെ; 2026–27 തീയതികൾ ഉറപ്പുവരുത്തുക)","പൗലോസ് മാർ പീലക്സീനോസ് മെത്രാന്റെ ഓർമ; നിഖ്യാ സൂനഹദോസിലെ 318 പിതാക്കന്മാർ; മെലിത്തീനിലെ 33 രക്തസാക്ഷികൾ; എല്ലാ വിശുദ്ധ മാലാഖമാരും."],["ദൈവദാസൻ മാർ ഈവാനിയോസ് മെത്രാപ്പോലീത്താ","പുനരൈക്യപ്രസ്ഥാനത്തിന്റെയും (1930) ബഥനി സന്യാസസമൂഹങ്ങളുടെയും സ്ഥാപകൻ; അദ്ദേഹത്തിന്റെ നാമകരണനടപടികൾ പുരോഗമിക്കുന്നു."]],
 prayer:"അങ്ങയുടെ സഭയുടെ മൂലക്കല്ലായ കർത്താവായ യേശുമിശിഹായേ, അങ്ങയുടെ ഭവനത്തിലെ ജീവനുള്ള കല്ലുകളായി ഞങ്ങളെ വിശുദ്ധീകരിക്കണമേ. പത്രോസിന്റെ ഏറ്റുപറച്ചിലിലും ഞങ്ങളുടെ പിതാക്കന്മാരുടെ വിശ്വാസത്തിലും ഞങ്ങളെ വിശ്വസ്തരായി കാക്കണമേ; സെറാഫുകളോടൊപ്പം എന്നേക്കും അങ്ങയുടെ പരിശുദ്ധി പാടാൻ ഞങ്ങൾക്ക് ഇടയാക്കണമേ. ആമേൻ."},
 {quick:["നമ്മുടെ ആരാധനാവത്സരം സഭയിൽ ആരംഭിക്കുന്നു: തന്റെ ജനത്തിന്റെ ഇടയിലുള്ള ദൈവത്തിന്റെ വാസസ്ഥലം.","ക്രിസ്തുവാണു മൂലക്കല്ല്; മാമ്മോദീസ സ്വീകരിച്ച ഓരോരുത്തരും ജീവനുള്ള കല്ലാണ്.","“ഈ പാറമേൽ എന്റെ സഭ ഞാൻ സ്ഥാപിക്കും”: പത്രോസുമായുള്ള ഐക്യവും നമ്മുടെ സുറിയാനി പൈതൃകത്തോടുള്ള വിശ്വസ്തതയും ഒന്നിച്ചുപോകുന്നു."],action:"ഈ വർഷം നിന്റെ ഇടവകയെ ശുശ്രൂഷിക്കാൻ വ്യക്തമായ ഒരു വഴി തിരഞ്ഞെടുക്കുക.",question:"ദൈവഭവനത്തിൽ ഞാൻ എങ്ങനെയുള്ള കല്ലാണ്?",
  special:"കൂദോശ് ഈത്തോ ഞായർ: സീറോ മലങ്കര കത്തോലിക്കാസഭയുടെ ആരാധനാവത്സരാരംഭം. ശ്ഹീമോ പ്രാർഥന ഒന്നാം ഖോലോയോടെ ആരംഭിക്കുന്നു.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിൽ ഒരു പുതിയ ദേവാലയം കൂദാശ ചെയ്യപ്പെടുമ്പോൾ മെത്രാൻ ബലിപീഠവും ഭിത്തികളും വിശുദ്ധ മൂറോൻകൊണ്ട് അഭിഷേകം ചെയ്യുന്നു; തലമുറകളോളം ആളുകൾ ആ ദിവസം ഓർക്കുന്നു. മാമ്മോദീസ സ്വീകരിച്ച ഓരോരുത്തരും അതിലും യഥാർഥമായി അഭിഷേകം ചെയ്യപ്പെട്ട് ദൈവഭവനമായി പണിയപ്പെട്ടിരിക്കുന്നുവെന്നു പത്രോസ് നമ്മോടു പറയുന്നു."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: 1 പത്രോസ് 2:4–5.",explain:"ഒരു പള്ളി കല്ലുകൾകൊണ്ടാണു പണിയുന്നത്. ദൈവത്തിന്റെ സഭ ആളുകളെക്കൊണ്ടു പണിയപ്പെടുന്നു! നമ്മളോരോരുത്തരും ജീവനുള്ള ഒരു കല്ലാണ്; ഏറ്റവും പ്രധാനപ്പെട്ട കല്ല്, മൂലക്കല്ല്, യേശുവാണ്.",intention:"നമ്മുടെ ഇടവകയ്ക്കും അതിൽ ശുശ്രൂഷ ചെയ്യുന്ന എല്ലാവർക്കുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ വർഷം നമ്മുടെ കുടുംബത്തിന് ഇടവകയെ എങ്ങനെ സഹായിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 751–757","സഭയുടെ പ്രതീകങ്ങൾ: കെട്ടിടം, ആലയം, കുടുംബം."],["മതബോധനഗ്രന്ഥം 880–882","പത്രോസും മെത്രാൻസംഘവും."]],
  kidsaint:["ദൈവദാസൻ മാർ ഈവാനിയോസ്","1882-ൽ മാവേലിക്കരയിൽ ജനിച്ച അദ്ദേഹം വൈദികനും അധ്യാപകനും സന്യാസിയുമായി; ബഥനി സമൂഹങ്ങൾ സ്ഥാപിച്ചു. 1930-ൽ, മനോഹരമായ സുറിയാനി കുർബാന കാത്തുകൊണ്ടുതന്നെ, തന്റെ ജനത്തെ മാർപാപ്പയുമായുള്ള കൂട്ടായ്മയിലേക്കു നയിച്ചു. പാഠം: നിന്റെ സ്വന്തം സഭയെ സ്നേഹിക്കുക; സാർവത്രികസഭയുമായി ഐക്യത്തിൽ നിലനിൽക്കുക."],
  term:["കൂദോശ് ഈത്തോ","“സഭയുടെ വിശുദ്ധീകരണം” എന്നതിന്റെ സുറിയാനിപദം. ഒക്ടോബർ 30-നും നവംബർ 5-നും ഇടയിലുള്ള ഞായറാഴ്ച; സീറോ മലങ്കര ആരാധനാവത്സരം അതോടെ ആരംഭിക്കുന്നു. അടുത്ത ഞായർ “സഭയുടെ നവീകരണം” എന്ന ഹൂദോശ് ഈത്തോ ആണ്."],
  termMore:["ഏഴു കാലങ്ങൾ","സീറോ മലങ്കര വർഷത്തിന് ഏഴു കാലങ്ങളുണ്ട്: മംഗളവാർത്ത (സൂബോറോ), യൽദോ–ദനഹാ, വലിയ നോമ്പ്, ക്യംതോ (ഉയിർപ്പ്), പന്തക്കുസ്താ, രൂപാന്തരീകരണം, സ്ലീബാ."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഇന്ന് ഒരു പുതിയ ആരാധനാവത്സരം ആരംഭിക്കുന്നു; നമ്മുടെ സഭ അതു വളരെ ജ്ഞാനപൂർവം ആരംഭിക്കുന്നു: ക്രിസ്മസിലല്ല, സഭയിൽത്തന്നെ. കൂദോശ് ഈത്തോ, സഭയുടെ വിശുദ്ധീകരണം. ക്രിസ്തുവിന്റെ രഹസ്യങ്ങൾ ആഘോഷിക്കുംമുമ്പ്, അവ ആഘോഷിക്കുന്ന ഭവനത്തെ നാം ഓർക്കുന്നു.","നമ്മുടെ വായനകൾ പറയുന്ന നീണ്ട കഥ കേൾക്കൂ. മോശ സമാഗമകൂടാരം സ്ഥാപിക്കുന്നു; സോളമൻ ദേവാലയം പണിയുന്നു; ജനം അതിനെ അശുദ്ധമാക്കിയതുകൊണ്ടു കർത്താവിന്റെ മഹത്വം ദേവാലയം വിട്ടുപോകുന്നത് എസെക്കിയേൽ കാണുന്നു; സിംഹാസനസ്ഥനായ കർത്താവിനെ ഏശയ്യാ കാണുന്നു, “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ” എന്നു സെറാഫുകൾ ഉദ്ഘോഷിക്കുന്നതു കേൾക്കുന്നു. തന്റെ ജനത്തിന്റെ ഇടയിൽ വസിക്കാൻ ദൈവം ആഗ്രഹിക്കുന്നു; പക്ഷേ അവിടുത്തെ പരിശുദ്ധിയെ ഒരിക്കലും നിസ്സാരമായി കാണാനാവില്ല.","ദൈവം ഇപ്പോൾ എവിടെ വസിക്കുന്നുവെന്നു വിശുദ്ധ പത്രോസ് നമ്മോടു പറയുന്നു: നമ്മിൽ. ജീവനുള്ള കല്ലുകളായി ഒരു ആത്മീയഭവനമായി പണിയപ്പെടുവിൻ. മാമ്മോദീസ സ്വീകരിച്ച ഓരോരുത്തരും ദൈവഭവനത്തിലെ ഒരു കല്ലാണ്. ചില കല്ലുകൾ ഭാരം താങ്ങുന്നു; ചിലതു പൊടിഞ്ഞുവീഴുന്നു. ഈ വർഷം ഞാൻ എങ്ങനെയുള്ള കല്ലായിരിക്കും?","സുവിശേഷത്തിൽ യേശു പത്രോസിനോടു പറയുന്നു: “ഈ പാറമേൽ എന്റെ സഭ ഞാൻ സ്ഥാപിക്കും.” സീറോ മലങ്കര കത്തോലിക്കരായ നമുക്ക് ഈ വാക്കുകൾ പ്രിയപ്പെട്ടതാണ്. 1930-ൽ, നമ്മുടെ പുരാതന സുറിയാനി ആരാധനക്രമം കാത്തുകൊണ്ടുതന്നെ, മാർ ഈവാനിയോസ് നമ്മുടെ പിതാക്കന്മാരെ പത്രോസിന്റെ പിൻഗാമിയുമായുള്ള കൂട്ടായ്മയിലേക്കു നയിച്ചു. പത്രോസുമായുള്ള ഐക്യവും നമ്മുടെ സ്വന്തം പാരമ്പര്യത്തോടുള്ള സ്നേഹവും രണ്ടു വിധേയത്വങ്ങളല്ല; ഏക കത്തോലിക്കാവിശ്വാസമാണ്.","അൽപസമയത്തിനകം നാം സെറാഫുകളോടൊപ്പം പാടും: “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ.” നമ്മുടെ ഇടവകദേവാലയത്തിൽ സ്വർഗത്തിന്റെ ഗീതം. വിശുദ്ധരും ഐക്യമുള്ളവരും വിശ്വസ്തരുമായ ജീവനുള്ള കല്ലുകളായി നമുക്ക് ഈ വർഷം ആരംഭിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഒരു പള്ളി എന്തുകൊണ്ടാണു പണിയുന്നത്? കല്ലും ഇഷ്ടികയുംകൊണ്ട്! പക്ഷേ ദൈവത്തിന്റെ സഭ ആളുകളെക്കൊണ്ടാണു പണിയുന്നത്. നിങ്ങൾ ദൈവഭവനത്തിലെ ജീവനുള്ള ഒരു കല്ലാണ്!","ഏറ്റവും പ്രധാനപ്പെട്ട കല്ല് യേശുവാണ്. അവിടുന്ന് എല്ലാം ചേർത്തുപിടിക്കുന്നു. “നീ ക്രിസ്തുവാണ്” എന്നു പത്രോസ് പറഞ്ഞു; പത്രോസിന്റെ വിശ്വാസത്തിന്മേൽ യേശു തന്റെ സഭ പണിതു.","ഈ വർഷം ബലമുള്ള ഒരു കല്ലാകുക: വിശുദ്ധ കുർബാനയ്ക്കു വരുക, ഇടവകയിൽ സഹായിക്കുക, ദയ കാണിക്കുക. നമുക്ക് ഒന്നിച്ചു പറയാം: “ഞാൻ യേശുവിനുവേണ്ടി ജീവനുള്ള ഒരു കല്ലാണ്!”"]});

put("2026-11-08","en",{title:"Hudos Eetho Sunday · Renewal of the Church",readTitle:"Readings (Syro-Malankara Sacred Lectionary)",
 readings:[["Evening Gospel","Mark 11:15–17","My house shall be a house of prayer"],["Old Testament","Exodus 32:1–14","The golden calf; Moses intercedes"],["Old Testament","1 Kings 8:22–30","Solomon's prayer at the dedication of the Temple"],["Old Testament","Jeremiah 31:10–14, 22–26","The Lord gathers and renews his people"],["Old Testament","Isaiah 55:1–13","Come to the waters"],["Catholic Epistle","Revelation 3:14–22","To the lukewarm Church: I stand at the door and knock"],["Epistle of St Paul","Hebrews 9:1–14","Christ the high priest of the true sanctuary"],["Gospel","John 2:13–22","Destroy this temple, and in three days I will raise it up"]],
 alt:"Second Sunday of the liturgical year. (In the lectionary the Book of Revelation is read in the place of the Catholic Epistle.)",
 verse:"Destroy this temple, and in three days I will raise it up.",cite:"John 2:19",
 theo:["Last Sunday we celebrated the Church as God's holy dwelling. Today, Hudos Eetho, we celebrate her renewal. The two belong together. The Church is holy because Christ sanctifies her, yet she is made of sinners and is always in need of purification. The Second Vatican Council says it plainly: the Church, “holding sinners in her bosom, is at the same time holy and always in need of being purified” (Lumen Gentium 8).","The readings show both the danger and the remedy. At the foot of Sinai the people make a golden calf, worshipping a god they can control. Solomon, dedicating the Temple, admits that “heaven and the highest heaven cannot contain you, much less this house that I have built” (1 Kings 8:27). God's house can never be our possession. The risen Christ says to the Church of Laodicea: “Because you are lukewarm… I am about to spit you out of my mouth” (Revelation 3:16). The danger of a Church is not only sin but comfort.","Jesus enters the Temple with a whip of cords and drives out the traders. His anger is not against worship but against worship turned into business. Then he points to himself: “Destroy this temple, and in three days I will raise it up.” He was speaking of the temple of his body. The true renewal of the Church is always a return to Christ, crucified and risen, whose blood, says Hebrews, purifies “our conscience from dead works to worship the living God” (Hebrews 9:14).","Renewal does not come from outside the Church but from her own sources: the Word, the Mysteries, prayer and repentance. That is why the Lord, after rebuking Laodicea, says: “Listen! I am standing at the door, knocking; if you hear my voice and open the door, I will come in to you and eat with you.”"],
 conn:[["The golden calf and the Lamb.","Israel melted gold to make a god they could see. In Christ, God gives himself visibly, not as gold but as the Lamb whose blood cleanses (Hebrews 9:12)."],["“A house of prayer for all peoples.”","Jesus quotes Isaiah 56:7 and Jeremiah 7:11. The traders filled the Court of the Gentiles, the one place where the nations could pray."],["The Temple of his body.","John 2:21 is fulfilled at the Resurrection; the Church, his Body, becomes the temple where God is worshipped “in spirit and truth” (John 4:23)."],["Come to the waters.","Isaiah 55:1 invites the thirsty to buy “without money”; the free gift of grace flows from the side of Christ, the new Temple (Ezekiel 47:1; John 19:34)."]],
 altar:["“I will come in to you and eat with you” (Revelation 3:20). At every Holy Qurbono the Lord who cleansed the Temple enters his Church and shares his table with us. Renewal begins at the altar, in a worthy and fervent communion, and spreads from there into the parish."],
 outline:[["Opening","Ask: if Jesus walked into our parish today, what would he praise, and what would he overturn?"],["Point 1 · Holy, yet always being purified","Lumen Gentium 8: the Church is holy and always in need of renewal. This is honesty, not shame."],["Point 2 · The two dangers: idols and lukewarmness","The golden calf: a God we control. Laodicea: a Church that is comfortable. Name today's forms of both."],["Point 3 · Renewal is a return to Christ","“Destroy this temple, and in three days I will raise it up.” Renewal comes from the risen Lord, through the Word, the Mysteries and repentance."],["Closing image","The Lord standing at the door and knocking: he wants to come in and eat with us."],["Take-home line","“Lord, renew your Church, and begin with me.”"]],
 live:[["Remove one idol (Exodus 32)","Name one thing that takes God's place in your life, and set a limit to it this week."],["Open the door (Revelation 3:20)","Make a good Confession this month, and prepare well for Holy Qurbono next Sunday."],["Keep the house of prayer (Mark 11:17)","Arrive early for Qurbono and keep silence in church as a sign of reverence."]],
 fathers:[["Origen","Commenting on John 2, he says the temple Jesus will raise is his body, and that the whole Church, as the body of Christ, will be raised and built as a living temple (Commentary on John 10)."],["St John Chrysostom","He warns that the Lord enters each soul as he entered the Temple, and asks whether we have made it a house of prayer or a market (Homilies on John 23)."]],
 magis:[["Lumen Gentium 8","The Church, embracing sinners in her bosom, is at the same time holy and always in need of purification, and follows constantly the path of penance and renewal."],["Unitatis Redintegratio 6","Christ summons the Church to continual reformation, of which she always has need, insofar as she is a human institution."],["Catechism 827","All members of the Church, including her ministers, must acknowledge that they are sinners; the Church therefore gathers sinners and is called to holiness."]],
 saints:[["This week","Consult the 2026–27 lectionary for the commemorations of this week. In the 2025–26 lectionary, St Theodore was remembered on this Sunday."]],
 prayer:"Lord Jesus, you cleansed the Temple and raised up the temple of your body. Purify your Church, free us from idols and lukewarmness, and come in to eat with us at your holy table. Amen."},
 {quick:["The Church is holy and always in need of renewal.","Two dangers: idols we control and comfortable lukewarmness.","Renewal is always a return to the crucified and risen Christ."],action:"Name one idol in your life and set a limit to it this week.",question:"What would Jesus overturn in my life if he walked in today?",
  special:"Hudos Eetho Sunday: the renewal (dedication) of the Church; the second Sunday of the Syro-Malankara liturgical year.",
  illus:["An illustration","An old church in a Kerala town is repainted and repaired every few decades; the building stays the same but is renewed. Every Christian generation must renew the Church in the same way: not by changing the faith, but by returning to its source."],kids:"",diaspora:"",
  family:{read:"Read together: Revelation 3:20.",explain:"Jesus is like a friend standing at our door and knocking. If we open, he comes in and eats with us. We open the door by praying and by coming to Holy Qurbono.",intention:"We pray that our Church may be renewed and that lukewarm hearts may become fervent.",ask:"Ask: “How can we open the door to Jesus this week?”"},
  catechism:[["CCC 821, 827","Renewal and the holiness of the Church."],["CCC 1427–1429","Continual conversion."]],
  kidsaint:["Saint Mother Teresa","She saw how many people were thirsty for love and opened her door to them. She often said Jesus' words on the cross: “I thirst.” Lesson: open your door to Jesus and to people who need you."],
  term:["Hudos Eetho (ഹൂദോശ് ഈത്തോ)","Syriac for “the renewal” or dedication of the Church. The second Sunday of the year, following Qudos Eetho. Together they open the year with the mystery of the Church."],
  termMore:["Why is the Book of Revelation read here?","In the Syro-Malankara lectionary, readings from Revelation can take the place of the Catholic Epistle. The letters to the seven Churches are a fitting word for the renewal of the Church."]},
 {homily:["Dear brothers and sisters, last Sunday we celebrated the Church as God's holy house. Today, Hudos Eetho, we celebrate the renewal of the Church. Both are true at once: the Church is holy because Christ makes her holy, and she is always in need of renewal because she is made of us, sinners.","Our readings show two dangers. At Sinai the people made a golden calf, a god they could see and control. And the risen Lord says to the Church of Laodicea: “Because you are lukewarm, I will spit you out of my mouth.” The danger of the Church is not only sin, but comfort.","Then Jesus enters the Temple and overturns the tables of the traders. He was not against worship; he was against worship turned into business. And he said: “Destroy this temple, and in three days I will raise it up.” He was speaking of his body. Every true renewal of the Church is a return to Christ, crucified and risen.","So where does renewal begin? Not with someone else. With me. With a good Confession, with silence and reverence in church, with a heart that opens when the Lord knocks. “If anyone hears my voice and opens the door, I will come in and eat with him.” In a few moments he will do exactly that at this altar. Amen."],
  kids:["Children, what happens if nobody cleans the house for a long time? Dust everywhere! Jesus once went into the Temple and cleaned it, because people had made it a market.","Our hearts are God's house too. We clean them by saying sorry to Jesus and by praying. Jesus says: “I am standing at your door, knocking.” Shall we open the door to him? Let's say: “Come in, Jesus!”"]});

put("2026-11-08","ml",{title:"ഹൂദോശ് ഈത്തോ ഞായർ · സഭാനവീകരണം",readTitle:"വായനകൾ (സീറോ മലങ്കര വിശുദ്ധ വായനാപുസ്തകം)",
 readings:[["സന്ധ്യാസുവിശേഷം","മർക്കോസ് 11:15–17","എന്റെ ഭവനം പ്രാർഥനാലയം"],["പഴയനിയമം","പുറപ്പാട് 32:1–14","സ്വർണക്കാളക്കുട്ടി; മോശയുടെ മാധ്യസ്ഥ്യം"],["പഴയനിയമം","1 രാജാക്കന്മാർ 8:22–30","ദേവാലയസമർപ്പണത്തിലെ സോളമന്റെ പ്രാർഥന"],["പഴയനിയമം","ജറെമിയാ 31:10–14, 22–26","കർത്താവു തന്റെ ജനത്തെ ഒരുമിച്ചുകൂട്ടി നവീകരിക്കുന്നു"],["പഴയനിയമം","ഏശയ്യാ 55:1–13","ജലാശയത്തിലേക്കു വരുവിൻ"],["കാതോലിക ലേഖനം","വെളിപാട് 3:14–22","മന്ദോഷ്ണയായ സഭയോട്: ഞാൻ വാതിൽക്കൽ മുട്ടുന്നു"],["വി. പൗലോസിന്റെ ലേഖനം","ഹെബ്രായർ 9:1–14","യഥാർഥ ശ്രീകോവിലിലെ പ്രധാനപുരോഹിതനായ ക്രിസ്തു"],["ഏവൻഗേലിയോൻ","യോഹന്നാൻ 2:13–22","ഈ ദേവാലയം നശിപ്പിക്കുക; മൂന്നു ദിവസത്തിനകം ഞാൻ അതു പുനരുദ്ധരിക്കും"]],
 alt:"ആരാധനാവത്സരത്തിലെ രണ്ടാം ഞായർ. (വായനാപുസ്തകത്തിൽ കാതോലിക ലേഖനത്തിന്റെ സ്ഥാനത്തു വെളിപാടുഗ്രന്ഥം വായിക്കുന്നു.)",
 verse:"നിങ്ങൾ ഈ ദേവാലയം നശിപ്പിക്കുക; മൂന്നു ദിവസത്തിനകം ഞാൻ അതു പുനരുദ്ധരിക്കും.",cite:"യോഹന്നാൻ 2:19",
 theo:["കഴിഞ്ഞ ഞായറാഴ്ച ദൈവത്തിന്റെ പരിശുദ്ധ വാസസ്ഥലമായ സഭയെ നാം ആഘോഷിച്ചു. ഇന്നു ഹൂദോശ് ഈത്തോയിൽ സഭയുടെ നവീകരണം ആഘോഷിക്കുന്നു. ഇവ രണ്ടും ഒന്നിച്ചുപോകുന്നു. ക്രിസ്തു വിശുദ്ധീകരിക്കുന്നതുകൊണ്ടു സഭ പരിശുദ്ധയാണ്; എങ്കിലും അവൾ പാപികളാൽ നിർമിതയാണ്; എപ്പോഴും ശുദ്ധീകരണം ആവശ്യമുള്ളവളാണ്. രണ്ടാം വത്തിക്കാൻ കൗൺസിൽ അതു വ്യക്തമായി പറയുന്നു: പാപികളെ തന്റെ മടിയിൽ വഹിക്കുന്ന സഭ ഒരേസമയം പരിശുദ്ധയും എപ്പോഴും ശുദ്ധീകരിക്കപ്പെടേണ്ടവളുമാണ് (ലുമെൻ ജെൻസിയും 8).","അപകടവും പരിഹാരവും വായനകൾ കാണിക്കുന്നു. സീനായുടെ അടിവാരത്തിൽ ജനം ഒരു സ്വർണക്കാളക്കുട്ടിയെ ഉണ്ടാക്കുന്നു; തങ്ങൾക്കു നിയന്ത്രിക്കാവുന്ന ഒരു ദേവനെ ആരാധിക്കുന്നു. ദേവാലയം സമർപ്പിക്കുന്ന സോളമൻ ഏറ്റുപറയുന്നു: “അങ്ങയെ ഉൾക്കൊള്ളാൻ സ്വർഗത്തിനും സ്വർഗാധിസ്വർഗത്തിനും അസാധ്യമെങ്കിൽ ഞാൻ നിർമിച്ച ഈ ഭവനം എത്ര അപര്യാപ്തം!” (1 രാജാ 8:27). ദൈവഭവനം ഒരിക്കലും നമ്മുടെ സ്വത്താകാനാവില്ല. ലവൊദീക്യായിലെ സഭയോട് ഉത്ഥിതനായ ക്രിസ്തു പറയുന്നു: “ചൂടോ തണുപ്പോ ഇല്ലാതെ മന്ദോഷ്ണനാകയാൽ നിന്നെ ഞാൻ എന്റെ വായിൽനിന്നു തുപ്പിക്കളയും” (വെളി 3:16). ഒരു സഭയുടെ അപകടം പാപം മാത്രമല്ല, സുഖലോലുപതയുമാണ്.","ചാട്ടയുമായി യേശു ദേവാലയത്തിൽ പ്രവേശിച്ചു കച്ചവടക്കാരെ പുറത്താക്കുന്നു. അവിടുത്തെ കോപം ആരാധനയ്ക്കെതിരേയല്ല; കച്ചവടമായി മാറിയ ആരാധനയ്ക്കെതിരേയാണ്. പിന്നെ അവിടുന്നു തന്നിലേക്കുതന്നെ ചൂണ്ടിക്കാണിക്കുന്നു: “നിങ്ങൾ ഈ ദേവാലയം നശിപ്പിക്കുക; മൂന്നു ദിവസത്തിനകം ഞാൻ അതു പുനരുദ്ധരിക്കും.” അവൻ പറഞ്ഞത് തന്റെ ശരീരമാകുന്ന ആലയത്തെപ്പറ്റിയാണ്. സഭയുടെ യഥാർഥ നവീകരണം എപ്പോഴും ക്രൂശിതനും ഉത്ഥിതനുമായ ക്രിസ്തുവിലേക്കുള്ള മടക്കമാണ്; ഹെബ്രായലേഖനം പറയുന്നതുപോലെ, അവിടുത്തെ രക്തം ജീവിക്കുന്ന ദൈവത്തെ ശുശ്രൂഷിക്കാൻ നമ്മുടെ അന്തഃകരണത്തെ നിർജീവപ്രവൃത്തികളിൽനിന്നു വിശുദ്ധീകരിക്കുന്നു (ഹെബ്രാ 9:14).","നവീകരണം സഭയ്ക്കു പുറത്തുനിന്നല്ല, അവളുടെ സ്വന്തം ഉറവിടങ്ങളിൽനിന്നാണു വരുന്നത്: വചനം, രഹസ്യങ്ങൾ, പ്രാർഥന, അനുതാപം. അതുകൊണ്ടാണു ലവൊദീക്യായെ ശാസിച്ചശേഷം കർത്താവു പറയുന്നത്: “ആരെങ്കിലും എന്റെ സ്വരം കേട്ടു വാതിൽ തുറന്നുതന്നാൽ ഞാൻ അവന്റെ അടുത്തേക്കു വരും. ഞങ്ങൾ ഒരുമിച്ചു ഭക്ഷിക്കുകയും ചെയ്യും.”"],
 conn:[["സ്വർണക്കാളക്കുട്ടിയും കുഞ്ഞാടും.","കാണാൻ കഴിയുന്ന ഒരു ദേവനെ ഉണ്ടാക്കാൻ ഇസ്രായേൽ സ്വർണം ഉരുക്കി. ക്രിസ്തുവിൽ ദൈവം തന്നെത്തന്നെ ദൃശ്യമായി നൽകുന്നു; സ്വർണമായിട്ടല്ല, രക്തത്താൽ ശുദ്ധീകരിക്കുന്ന കുഞ്ഞാടായി (ഹെബ്രാ 9:12)."],["“എല്ലാ ജനതകൾക്കുമുള്ള പ്രാർഥനാലയം.”","യേശു ഏശയ്യാ 56:7-ഉം ജറെമിയാ 7:11-ഉം ഉദ്ധരിക്കുന്നു. ജനതകൾക്കു പ്രാർഥിക്കാവുന്ന ഏക ഇടമായ വിജാതീയരുടെ അങ്കണമാണു കച്ചവടക്കാർ നിറച്ചിരുന്നത്."],["അവിടുത്തെ ശരീരമാകുന്ന ആലയം.","യോഹന്നാൻ 2:21 ഉത്ഥാനത്തിൽ നിറവേറുന്നു; അവിടുത്തെ ശരീരമായ സഭ, ദൈവം “ആത്മാവിലും സത്യത്തിലും” ആരാധിക്കപ്പെടുന്ന ആലയമാകുന്നു (യോഹ 4:23)."],["ജലാശയത്തിലേക്കു വരുവിൻ.","ദാഹാർത്തരെ “സൗജന്യമായി” വാങ്ങാൻ ഏശയ്യാ 55:1 ക്ഷണിക്കുന്നു; കൃപയുടെ സൗജന്യദാനം പുതിയ ആലയമായ ക്രിസ്തുവിന്റെ പാർശ്വത്തിൽനിന്ന് ഒഴുകുന്നു (എസെ 47:1; യോഹ 19:34)."]],
 altar:["“ഞാൻ അവന്റെ അടുത്തേക്കു വരും; ഞങ്ങൾ ഒരുമിച്ചു ഭക്ഷിക്കുകയും ചെയ്യും” (വെളി 3:20). ദേവാലയം ശുദ്ധീകരിച്ച കർത്താവ് ഓരോ വിശുദ്ധ കുർബാനയിലും തന്റെ സഭയിൽ പ്രവേശിച്ചു തന്റെ മേശ നമ്മുമായി പങ്കുവയ്ക്കുന്നു. നവീകരണം ബലിപീഠത്തിൽ, യോഗ്യവും തീക്ഷ്ണവുമായ ദിവ്യകാരുണ്യസ്വീകരണത്തിൽ, ആരംഭിച്ച് അവിടെനിന്ന് ഇടവകയിലേക്കു വ്യാപിക്കുന്നു."],
 outline:[["ആരംഭം","ചോദിക്കുക: യേശു ഇന്നു നമ്മുടെ ഇടവകയിലേക്കു കടന്നുവന്നാൽ അവിടുന്ന് എന്തിനെ പ്രശംസിക്കും? എന്തിനെ മറിച്ചിടും?"],["ഒന്നാം ആശയം · പരിശുദ്ധ, എങ്കിലും എപ്പോഴും ശുദ്ധീകരിക്കപ്പെടുന്നവൾ","ലുമെൻ ജെൻസിയും 8: സഭ പരിശുദ്ധയും എപ്പോഴും നവീകരണം ആവശ്യമുള്ളവളുമാണ്. ഇതു ലജ്ജയല്ല, സത്യസന്ധതയാണ്."],["രണ്ടാം ആശയം · രണ്ട് അപകടങ്ങൾ: വിഗ്രഹങ്ങളും മന്ദോഷ്ണതയും","സ്വർണക്കാളക്കുട്ടി: നാം നിയന്ത്രിക്കുന്ന ഒരു ദൈവം. ലവൊദീക്യാ: സുഖലോലുപയായ ഒരു സഭ. രണ്ടിന്റെയും ഇന്നത്തെ രൂപങ്ങൾക്കു പേരു പറയുക."],["മൂന്നാം ആശയം · നവീകരണം ക്രിസ്തുവിലേക്കുള്ള മടക്കമാണ്","“ഈ ദേവാലയം നശിപ്പിക്കുക; മൂന്നു ദിവസത്തിനകം ഞാൻ അതു പുനരുദ്ധരിക്കും.” വചനം, രഹസ്യങ്ങൾ, അനുതാപം എന്നിവയിലൂടെ ഉത്ഥിതനായ കർത്താവിൽനിന്നു നവീകരണം വരുന്നു."],["സമാപനചിത്രം","വാതിൽക്കൽ നിന്നു മുട്ടുന്ന കർത്താവ്: അകത്തു വന്നു നമ്മോടൊപ്പം ഭക്ഷിക്കാൻ അവിടുന്ന് ആഗ്രഹിക്കുന്നു."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“കർത്താവേ, അങ്ങയുടെ സഭയെ നവീകരിക്കണമേ; എന്നിൽനിന്ന് ആരംഭിക്കണമേ.”"]],
 live:[["ഒരു വിഗ്രഹം നീക്കുക (പുറപ്പാട് 32)","നിന്റെ ജീവിതത്തിൽ ദൈവത്തിന്റെ സ്ഥാനം കൈയടക്കുന്ന ഒരു കാര്യത്തിനു പേരു പറഞ്ഞ് ഈ ആഴ്ച അതിന് ഒരു പരിധി വയ്ക്കുക."],["വാതിൽ തുറക്കുക (വെളിപാട് 3:20)","ഈ മാസം നല്ല ഒരു കുമ്പസാരം നടത്തുക; അടുത്ത ഞായറാഴ്ചത്തെ വിശുദ്ധ കുർബാനയ്ക്കു നന്നായി ഒരുങ്ങുക."],["പ്രാർഥനാലയം കാക്കുക (മർക്കോസ് 11:17)","ഭക്ത്യാദരത്തിന്റെ അടയാളമായി കുർബാനയ്ക്കു നേരത്തേ എത്തുക; പള്ളിയിൽ നിശ്ശബ്ദത പാലിക്കുക."]],
 fathers:[["ഒരിജൻ","യോഹന്നാൻ 2 വ്യാഖ്യാനിച്ച് അദ്ദേഹം പറയുന്നു: യേശു പുനരുദ്ധരിക്കുന്ന ആലയം അവിടുത്തെ ശരീരമാണ്; ക്രിസ്തുവിന്റെ ശരീരമായ സഭ മുഴുവനും ജീവനുള്ള ഒരു ആലയമായി ഉയിർപ്പിക്കപ്പെടുകയും പണിയപ്പെടുകയും ചെയ്യും (യോഹന്നാന്റെ സുവിശേഷവ്യാഖ്യാനം 10)."],["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","ദേവാലയത്തിൽ പ്രവേശിച്ചതുപോലെ കർത്താവ് ഓരോ ആത്മാവിലും പ്രവേശിക്കുന്നുവെന്നും, നാം അതിനെ പ്രാർഥനാലയമാക്കിയോ ചന്തയാക്കിയോ എന്ന് അവിടുന്നു ചോദിക്കുന്നുവെന്നും അദ്ദേഹം മുന്നറിയിപ്പു നൽകുന്നു (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 23)."]],
 magis:[["ലുമെൻ ജെൻസിയും 8","പാപികളെ തന്റെ മടിയിൽ ആശ്ലേഷിക്കുന്ന സഭ ഒരേസമയം പരിശുദ്ധയും എപ്പോഴും ശുദ്ധീകരണം ആവശ്യമുള്ളവളുമാണ്; അവൾ നിരന്തരം അനുതാപത്തിന്റെയും നവീകരണത്തിന്റെയും പാതയിൽ ചരിക്കുന്നു."],["ഊണിത്താത്തിസ് റെദിന്തെഗ്രാസിയോ 6","മാനുഷികസ്ഥാപനമെന്ന നിലയിൽ സഭയ്ക്ക് എപ്പോഴും ആവശ്യമുള്ള നിരന്തരനവീകരണത്തിലേക്കു ക്രിസ്തു അവളെ വിളിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 827","ശുശ്രൂഷകർ ഉൾപ്പെടെ സഭയിലെ എല്ലാ അംഗങ്ങളും തങ്ങൾ പാപികളാണെന്ന് അംഗീകരിക്കണം; അതുകൊണ്ടു സഭ പാപികളെ ഒരുമിച്ചുകൂട്ടുന്നു; വിശുദ്ധിയിലേക്കു വിളിക്കപ്പെട്ടിരിക്കുന്നു."]],
 saints:[["ഈ ആഴ്ച","ഈ ആഴ്ചയിലെ ഓർമകൾക്ക് 2026–27-ലെ വായനാപുസ്തകം നോക്കുക. 2025–26-ലെ വായനാപുസ്തകത്തിൽ ഈ ഞായറാഴ്ച വിശുദ്ധ തെയദോറിനെ ഓർമിച്ചിരുന്നു."]],
 prayer:"കർത്താവായ യേശുവേ, അങ്ങു ദേവാലയം ശുദ്ധീകരിക്കുകയും അങ്ങയുടെ ശരീരമാകുന്ന ആലയം ഉയിർപ്പിക്കുകയും ചെയ്തു. അങ്ങയുടെ സഭയെ ശുദ്ധീകരിക്കണമേ; വിഗ്രഹങ്ങളിൽനിന്നും മന്ദോഷ്ണതയിൽനിന്നും ഞങ്ങളെ മോചിപ്പിക്കണമേ; അങ്ങയുടെ വിശുദ്ധ മേശയിൽ ഞങ്ങളോടൊപ്പം ഭക്ഷിക്കാൻ എഴുന്നള്ളണമേ. ആമേൻ."},
 {quick:["സഭ പരിശുദ്ധയും എപ്പോഴും നവീകരണം ആവശ്യമുള്ളവളുമാണ്.","രണ്ട് അപകടങ്ങൾ: നാം നിയന്ത്രിക്കുന്ന വിഗ്രഹങ്ങളും സുഖലോലുപമായ മന്ദോഷ്ണതയും.","നവീകരണം എപ്പോഴും ക്രൂശിതനും ഉത്ഥിതനുമായ ക്രിസ്തുവിലേക്കുള്ള മടക്കമാണ്."],action:"നിന്റെ ജീവിതത്തിലെ ഒരു വിഗ്രഹത്തിനു പേരു പറഞ്ഞ് ഈ ആഴ്ച അതിന് ഒരു പരിധി വയ്ക്കുക.",question:"യേശു ഇന്ന് എന്റെ ജീവിതത്തിലേക്കു കടന്നുവന്നാൽ അവിടുന്ന് എന്താണു മറിച്ചിടുക?",
  special:"ഹൂദോശ് ഈത്തോ ഞായർ: സഭയുടെ നവീകരണം (സമർപ്പണം); സീറോ മലങ്കര ആരാധനാവത്സരത്തിലെ രണ്ടാം ഞായർ.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഒരു പട്ടണത്തിലുള്ള പഴയ ഒരു പള്ളി ഏതാനും പതിറ്റാണ്ടുകൾ കൂടുമ്പോൾ ചായം പൂശി അറ്റകുറ്റപ്പണി ചെയ്യുന്നു; കെട്ടിടം അതുതന്നെ, എങ്കിലും നവീകരിക്കപ്പെടുന്നു. ഓരോ ക്രൈസ്തവതലമുറയും അതുപോലെ സഭയെ നവീകരിക്കണം: വിശ്വാസം മാറ്റിക്കൊണ്ടല്ല, അതിന്റെ ഉറവിടത്തിലേക്കു മടങ്ങിക്കൊണ്ട്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: വെളിപാട് 3:20.",explain:"നമ്മുടെ വാതിൽക്കൽ നിന്നു മുട്ടുന്ന ഒരു കൂട്ടുകാരനെപ്പോലെയാണ് യേശു. നാം തുറന്നാൽ അവിടുന്ന് അകത്തുവന്നു നമ്മോടൊപ്പം ഭക്ഷിക്കുന്നു. പ്രാർഥിച്ചും വിശുദ്ധ കുർബാനയ്ക്കു വന്നുമാണു നാം വാതിൽ തുറക്കുന്നത്.",intention:"നമ്മുടെ സഭ നവീകരിക്കപ്പെടാനും മന്ദോഷ്ണമായ ഹൃദയങ്ങൾ തീക്ഷ്ണമാകാനുംവേണ്ടി നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമുക്ക് യേശുവിനായി എങ്ങനെ വാതിൽ തുറക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 821, 827","സഭയുടെ നവീകരണവും പരിശുദ്ധിയും."],["മതബോധനഗ്രന്ഥം 1427–1429","നിരന്തരമാനസാന്തരം."]],
  kidsaint:["വിശുദ്ധ മദർ തെരേസ","എത്രയോ ആളുകൾ സ്നേഹത്തിനായി ദാഹിക്കുന്നുവെന്ന് അവൾ കണ്ടു; അവർക്കായി തന്റെ വാതിൽ തുറന്നു. കുരിശിലെ യേശുവിന്റെ “എനിക്കു ദാഹിക്കുന്നു” എന്ന വാക്കുകൾ അവൾ പലപ്പോഴും പറഞ്ഞു. പാഠം: യേശുവിനും നിന്നെ ആവശ്യമുള്ളവർക്കുമായി നിന്റെ വാതിൽ തുറക്കുക."],
  term:["ഹൂദോശ് ഈത്തോ","സഭയുടെ “നവീകരണം” അഥവാ സമർപ്പണം എന്നതിന്റെ സുറിയാനിപദം. കൂദോശ് ഈത്തോയ്ക്കുശേഷമുള്ള, വർഷത്തിലെ രണ്ടാം ഞായർ. ഇവ രണ്ടും ചേർന്നു സഭയുടെ രഹസ്യത്തോടെ വർഷം തുറക്കുന്നു."],
  termMore:["വെളിപാടുഗ്രന്ഥം ഇവിടെ വായിക്കുന്നത് എന്തുകൊണ്ട്?","സീറോ മലങ്കര വായനാപുസ്തകത്തിൽ കാതോലിക ലേഖനത്തിന്റെ സ്ഥാനത്തു വെളിപാടുഗ്രന്ഥത്തിൽനിന്നുള്ള വായനകൾ വരാം. ഏഴു സഭകൾക്കുള്ള കത്തുകൾ സഭയുടെ നവീകരണത്തിന് ഉചിതമായ ഒരു വചനമാണ്."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, കഴിഞ്ഞ ഞായറാഴ്ച ദൈവത്തിന്റെ പരിശുദ്ധ ഭവനമായ സഭയെ നാം ആഘോഷിച്ചു. ഇന്നു ഹൂദോശ് ഈത്തോയിൽ സഭയുടെ നവീകരണം ആഘോഷിക്കുന്നു. രണ്ടും ഒരേസമയം സത്യമാണ്: ക്രിസ്തു അവളെ പരിശുദ്ധയാക്കുന്നതുകൊണ്ടു സഭ പരിശുദ്ധയാണ്; പാപികളായ നമ്മാൽ നിർമിതയായതുകൊണ്ട് അവൾക്ക് എപ്പോഴും നവീകരണം ആവശ്യമാണ്.","നമ്മുടെ വായനകൾ രണ്ട് അപകടങ്ങൾ കാണിക്കുന്നു. സീനായിൽ ജനം ഒരു സ്വർണക്കാളക്കുട്ടിയെ ഉണ്ടാക്കി; കാണാനും നിയന്ത്രിക്കാനും കഴിയുന്ന ഒരു ദേവൻ. ലവൊദീക്യായിലെ സഭയോട് ഉത്ഥിതനായ കർത്താവു പറയുന്നു: “മന്ദോഷ്ണനാകയാൽ നിന്നെ ഞാൻ എന്റെ വായിൽനിന്നു തുപ്പിക്കളയും.” സഭയുടെ അപകടം പാപം മാത്രമല്ല, സുഖലോലുപതയുമാണ്.","പിന്നെ യേശു ദേവാലയത്തിൽ പ്രവേശിച്ചു കച്ചവടക്കാരുടെ മേശകൾ മറിച്ചിടുന്നു. അവിടുന്ന് ആരാധനയ്ക്കെതിരായിരുന്നില്ല; കച്ചവടമായി മാറിയ ആരാധനയ്ക്കെതിരായിരുന്നു. അവിടുന്നു പറഞ്ഞു: “നിങ്ങൾ ഈ ദേവാലയം നശിപ്പിക്കുക; മൂന്നു ദിവസത്തിനകം ഞാൻ അതു പുനരുദ്ധരിക്കും.” അവൻ പറഞ്ഞത് തന്റെ ശരീരത്തെപ്പറ്റിയാണ്. സഭയുടെ ഓരോ യഥാർഥ നവീകരണവും ക്രൂശിതനും ഉത്ഥിതനുമായ ക്രിസ്തുവിലേക്കുള്ള മടക്കമാണ്.","അപ്പോൾ നവീകരണം എവിടെ ആരംഭിക്കുന്നു? മറ്റാരിലുമല്ല. എന്നിൽ. നല്ല ഒരു കുമ്പസാരത്തിൽ, പള്ളിയിലെ നിശ്ശബ്ദതയിലും ഭക്ത്യാദരത്തിലും, കർത്താവു മുട്ടുമ്പോൾ തുറക്കുന്ന ഒരു ഹൃദയത്തിൽ. “ആരെങ്കിലും എന്റെ സ്വരം കേട്ടു വാതിൽ തുറന്നുതന്നാൽ ഞാൻ അവന്റെ അടുത്തേക്കു വരും. ഞങ്ങൾ ഒരുമിച്ചു ഭക്ഷിക്കുകയും ചെയ്യും.” അൽപസമയത്തിനകം ഈ ബലിപീഠത്തിൽ അവിടുന്നു കൃത്യമായും അതു ചെയ്യും. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, കുറെക്കാലം ആരും വീടു വൃത്തിയാക്കിയില്ലെങ്കിൽ എന്തു സംഭവിക്കും? എല്ലായിടത്തും പൊടി! ആളുകൾ ദേവാലയത്തെ ചന്തയാക്കിയതുകൊണ്ട് ഒരിക്കൽ യേശു അവിടെ ചെന്ന് അതു വൃത്തിയാക്കി.","നമ്മുടെ ഹൃദയങ്ങളും ദൈവത്തിന്റെ ഭവനമാണ്. യേശുവിനോടു സോറി പറഞ്ഞും പ്രാർഥിച്ചുമാണു നാം അവ വൃത്തിയാക്കുന്നത്. യേശു പറയുന്നു: “ഞാൻ നിന്റെ വാതിൽക്കൽ നിന്നു മുട്ടുന്നു.” നമുക്ക് അവിടുത്തേക്കു വാതിൽ തുറക്കാമോ? നമുക്കു പറയാം: “യേശുവേ, അകത്തു വരണമേ!”"]});
})();
