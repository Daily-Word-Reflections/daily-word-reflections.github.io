<title>Daily Word: Catholic daily readings, reflections and homilies in your rite and language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Malayalam:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
/* Layout: a sanctuary-night header band with lamp glow; date bar; three page tabs (Lectern, Homily notes, Calendar page) each with its own content */
:root{
  --bg:#F1F2EE; --paper:#FDFDFB; --ink:#1C2424; --muted:#5B6664; --rule:#DCDFD8;
  --gold:#A9822F; --goldsoft:#E9DDBF; --night:#16182A;
  --maroon:#7E2635; --indigo:#2C4677; --green:#2D6A4E; --accent:var(--maroon); --soft:#ECEEE8;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.06);
  --display:"Cormorant Garamond","Noto Serif Malayalam",Georgia,serif;
  --serif:"Spectral","Noto Serif Malayalam",Georgia,serif;
  --mlserif:"Noto Serif Malayalam","Spectral",serif;
  --sans:"IBM Plex Sans","Noto Sans Malayalam",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101415; --paper:#181E1F; --ink:#E8ECEA; --muted:#9AA5A2; --rule:#2B3434;
  --gold:#D8B865; --goldsoft:#3A3322; --maroon:#E79AA6; --indigo:#A3BAE8; --green:#86C9A5; --soft:#1F2627;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101415; --paper:#181E1F; --ink:#E8ECEA; --muted:#9AA5A2; --rule:#2B3434;
  --gold:#D8B865; --goldsoft:#3A3322; --maroon:#E79AA6; --indigo:#A3BAE8; --green:#86C9A5; --soft:#1F2627;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.7}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:grid;gap:18px}
:lang(ml) .wrap{font-family:var(--mlserif);font-size:16.5px}

/* Header band: always night, with lamp glow */
.band{position:relative;overflow:hidden;border-radius:18px;padding:26px 22px 22px;color:#F4EEDD;
  background:radial-gradient(120% 90% at 85% 0%,rgba(233,196,106,.35),transparent 55%),radial-gradient(80% 70% at 0% 100%,rgba(126,38,53,.55),transparent 60%),linear-gradient(160deg,#1B1D33 0%,#14152A 60%,#221427 100%);
  box-shadow:0 10px 30px rgba(20,16,40,.25)}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 80px);pointer-events:none}
.band .eyebrow{font:600 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#E3C77E;display:flex;align-items:center;gap:10px}
.band .eyebrow::before,.band .eyebrow::after{content:"";height:1px;flex:0 0 28px;background:linear-gradient(90deg,transparent,#E3C77E)}
.band .eyebrow::after{background:linear-gradient(90deg,#E3C77E,transparent)}
.brand{margin:6px 0 2px;font-family:var(--mlserif);font-weight:700;font-size:34px;line-height:1.2;
  background:linear-gradient(180deg,#FFF6DD 0%,#E9C877 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
:lang(en) .brand{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:.01em}
.band .sub{font:14px var(--sans);color:#CFC6B4}
.band .verse-line{margin-top:12px;font-family:var(--display);font-style:italic;font-size:18px;color:#EDE3C8}
:lang(ml) .band .verse-line{font-family:var(--mlserif);font-style:normal;font-size:15px}

/* Controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.seg button{font:600 13.5px var(--sans);border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.ritewrap{display:inline-flex;align-items:center;position:relative;background:var(--accent);border-right:1px solid var(--rule)}
.ritewrap::after{content:"▾";position:absolute;right:12px;pointer-events:none;color:var(--paper);font-size:12px}
.ritewrap.off{background:transparent}.ritewrap.off::after{color:var(--muted)}
.datebar .pill{border-radius:8px}
.seg.ritebar{border:0;border-radius:0;overflow:visible;background:transparent;box-shadow:none;gap:8px}
.seg.ritebar>button,.seg.ritebar>.ritewrap{border:1px solid var(--rule);border-radius:8px;background:var(--paper);box-shadow:var(--shadow)}
.seg.ritebar>.ritewrap{background:var(--accent);border-color:var(--accent);overflow:hidden}
.seg.ritebar>.ritewrap.off{background:var(--paper);border-color:var(--rule)}
.seg.ritebar>button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
#ritesel{appearance:none;-webkit-appearance:none;font:700 13.5px var(--sans);border:0;background:transparent;color:var(--paper);padding:8px 30px 8px 14px;cursor:pointer;max-width:58vw}
.ritewrap.off #ritesel{color:var(--muted)}
#ritesel option{color:#1b1b1b;background:#fff}
#ritesel:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.restday{border:1px dashed var(--rule);border-radius:14px;padding:16px 18px;margin:14px 0;background:var(--paper)}
.restday h3{margin:0 0 6px;font:700 15px var(--sans)}.restday p{margin:0 0 10px;color:var(--muted)}
.slist{list-style:none;padding:0;margin:0;display:grid;gap:10px}.slist li.scard{display:flex;gap:14px;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--card,transparent)}.sdate{min-width:44px;text-align:center;font:600 12px var(--sans);color:var(--muted)}.sdate b{display:block;font:700 22px var(--serif,inherit);color:var(--accent)}.sbody{flex:1;min-width:0}.sbody h4{margin:0 0 4px;font-size:16px}.skid{margin:0 0 6px;font:13px var(--sans);color:var(--muted)}.sdet{margin:2px 0 6px;font-size:14px;line-height:1.5}.sdet i{color:var(--muted)}.sbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sbtns .pill{font-size:13px;padding:6px 12px}.lnk{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}.sbtns .pill.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.slist .sd{min-width:92px;font:600 13px var(--sans);color:var(--muted)}.slist .sd button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.seg button:focus-visible,.nav button:focus-visible,.tabs button:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.datebar input{font:600 15px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:7px 10px}
.datebar{position:relative}
.calpop{position:absolute;z-index:20;top:100%;right:8px;margin-top:6px;width:min(320px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px;box-shadow:var(--shadow);font:14px var(--sans)}
.calpop .ch{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:6px}
.calpop .ch button{border:0;background:none;color:var(--ink);font-size:20px;padding:2px 10px;cursor:pointer}
.calpop .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calpop .cw{color:var(--muted);font-size:12px;padding:4px 0}
.calpop .cw.sun,.calpop .cd.sun{color:#b3261e}
.calpop .cd{border:0;background:none;color:var(--ink);padding:7px 0;border-radius:8px;cursor:pointer;font:inherit;position:relative}
.calpop .cd:hover{background:var(--bg)}
.calpop .cd.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.5}
.calpop .cd.sel{background:var(--ink);color:var(--paper)}
.calpop .cd.tod{outline:1px solid var(--rule)}
.datebar .dlabel{font:600 15px var(--sans);flex:1;min-width:180px}
.pill{font:600 13px var(--sans);border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);overflow-x:auto}
.botnav{margin:18px 0 6px;border-top:1px solid var(--rule)}
.pill.vlink{border-radius:8px}
.popechips{display:flex;flex-wrap:wrap;gap:8px}.popechips button{font:600 13.5px var(--sans);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer}.popechips button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}.popechips button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pmq{margin:6px 0 0;padding-left:22px;line-height:1.7}.pmq li{margin:4px 0}.pmr{margin:4px 0 2px;color:var(--muted)}
.botnav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button{font:600 14px var(--sans);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.note{font:13.5px/1.5 var(--sans);color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 14px}
.note b{color:var(--ink)}

/* Day card */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:24px 22px;display:grid;gap:22px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.season{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.week{font:14px var(--sans);color:var(--muted)}
.dtitle{font-family:var(--display);font-size:32px;line-height:1.2;margin:2px 0 0;font-weight:600;text-wrap:balance}
:lang(ml) .dtitle{font-family:var(--mlserif);font-size:25px;font-weight:700}
.chip{display:inline-flex;align-items:flex-start;gap:8px;font:13px var(--sans);color:var(--muted);line-height:1.4}.chip i{flex:none;margin-top:3px}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--green)}
h3.sh{display:flex;align-items:center;gap:10px;margin:0;font:600 12.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h3.sh::before{content:"✦";font-size:11px}
h3.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldsoft),transparent)}
.readings{display:grid;gap:10px}
.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.shb{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%;color:#fff!important;text-decoration:none}.shb.wa{background:#1FA855}.shb.tg{background:#229ED9}.shb.cp{background:var(--ink);color:var(--paper)!important;border:0;cursor:pointer}.shb:hover{filter:brightness(1.08)}
#sample{display:none!important}.schips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule)}.sclab{font:600 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.schip{font:600 13px var(--sans);padding:5px 10px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--ink);cursor:pointer}.caddr{font:14px var(--sans);margin-top:10px;word-break:break-all}.caddr button{margin-left:6px;font:600 12px var(--sans);padding:4px 10px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:inherit;cursor:pointer}.stcard{display:grid;gap:8px;margin:4px 0 14px;padding:12px;border:1px solid var(--gold);border-radius:12px}.stlink{display:grid;gap:2px;text-align:left;background:none;border:0;padding:6px 0;cursor:pointer;color:inherit;font:inherit}.stlink b{font-size:17px}.stlink span{color:var(--gold);font:600 13px var(--sans)}.ststory h4{margin:14px 0 4px}.sttag{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.fullp .ptxt{width:100%;border:1px solid var(--line,#ddd);border-radius:10px;padding:8px 12px;background:var(--card,transparent)}.fullp .ptxt summary{cursor:pointer;font:600 14px var(--sans);color:var(--gold)}.fullp .pbody p{margin:8px 0 0;line-height:1.75}.fullp .pbody sup{color:var(--gold);font-weight:700;margin-right:2px}.fullp .psrc{font-size:12px;opacity:.75}
.fullp{grid-column:1/-1;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}.fullp summary{cursor:pointer;font:600 13px var(--sans);color:var(--gold);list-style:none}.fullp summary::-webkit-details-marker{display:none}.fullp .fl{display:grid;gap:6px;margin-top:8px}.fullp a{font:500 14px var(--sans);color:var(--ink);text-decoration:none;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}.fullp a:hover{border-color:var(--gold)}.fullp .fln{font:12px var(--sans);color:var(--muted);margin:2px 0 0}
.rd{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--rule)}
.rd .lab{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.rd .ref{font:600 16px var(--sans)}
.rd .rt{grid-column:2;font-style:italic;color:var(--muted);font-size:15px}
.grp{font:600 13px var(--sans);color:var(--accent);margin-top:4px}
.alt{font:13.5px/1.5 var(--sans);color:var(--muted)}
blockquote.key{margin:0;padding:18px 20px;border-radius:14px;text-align:center;font-family:var(--display);font-style:italic;font-size:24px;line-height:1.35;
  background:radial-gradient(90% 120% at 50% 0%,var(--goldsoft),transparent 70%);border:1px solid var(--goldsoft)}
:lang(ml) blockquote.key{font-family:var(--mlserif);font-style:normal;font-size:19px}
blockquote.key cite{display:block;font:normal 13px var(--sans);color:var(--muted);margin-top:6px}
.prose{display:grid;gap:12px}
.prose p{margin:0;max-width:68ch}
.prose p:first-child::first-letter{font-family:var(--display);font-size:3.1em;float:left;line-height:.85;padding:6px 8px 0 0;color:var(--accent)}
:lang(ml) .prose p:first-child::first-letter{font-family:inherit;font-size:inherit;float:none;padding:0;color:inherit}
.items{display:grid;gap:12px}
.item{display:grid;gap:3px;padding-left:14px;border-left:2px solid var(--goldsoft)}
.item b{font:600 15px var(--sans);color:var(--ink)}
.item p{margin:0}
.quote .item p{font-style:italic}
:lang(ml) .quote .item p{font-style:normal}
.outline{counter-reset:o;display:grid;gap:12px}
.ol{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ol .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--accent);color:var(--paper)}
.ol .n.g{background:var(--gold)}
.ol b{font:600 15px var(--sans);display:block}
.ol p{margin:2px 0 0}
.prayer{font-style:italic;text-align:center;padding:14px 18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
:lang(ml) .prayer{font-style:normal}
.empty{display:grid;gap:10px;justify-items:start;font:15px/1.6 var(--sans);color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dcell{border:1px solid var(--rule);border-radius:12px;padding:8px 6px;background:var(--bg);display:grid;gap:2px;text-align:center;cursor:pointer;font-family:var(--sans);min-width:0}
.dcell[aria-current="date"]{border-color:var(--gold);background:radial-gradient(100% 100% at 50% 0%,var(--goldsoft),var(--bg))}
.dcell .wd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dcell .dn{font:600 22px/1.1 var(--display)}
.dcell .tt{font-size:10.5px;line-height:1.3;color:var(--gold);font-weight:600;overflow-wrap:anywhere}
.dcell .ts{font-size:10px;line-height:1.25;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.homebtn{font-weight:600}
.brand{cursor:pointer}
.results .res .kd{font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:6px}

 ta:[["விசுவாசத்தின் ஒன்றிப்பில்","நிசேயா பொதுச்சங்கத்தின் 1700-ஆம் ஆண்டு நிறைவும் நாம் அறிக்கையிடும் விசுவாச அறிக்கையும்."],["நான் உன்னை அன்பு செய்தேன்","ஏழைகள் மீதான அன்பு பற்றி."],["அவர் நம்மை அன்பு செய்தார்","இயேசு கிறிஸ்துவின் இதயத்தின் மனித, இறை அன்பு பற்றி."],["அது நம்பிக்கையே","புனித குழந்தை தெரேசாவின் 150-ஆம் ஆண்டு நிறைவில், கடவுளின் இரக்கமுள்ள அன்பின் மீதான நம்பிக்கை பற்றி."],["கடவுளைப் புகழுங்கள்","இறைவா உமக்கே புகழ் மடலைத் தொடர்ந்து, காலநிலை நெருக்கடி பற்றி."],["பேராவலுடன் விரும்பினேன்","இறைமக்களின் வழிபாட்டு உருவாக்கம் பற்றி."],["அனைவரும் உடன்பிறப்புகள்","உடன்பிறப்பு உணர்வும் சமூக நட்பும் பற்றி."],["தந்தையின் இதயத்தோடு","புனித யோசேப்பு அகில திருஅவையின் பாதுகாவலராக அறிவிக்கப்பட்டதன் 150-ஆம் ஆண்டில் அவரைப் பற்றி."],["அன்பான அமேசான்","அமேசான் பகுதி பற்றிய ஆயர் மாமன்றத்துக்குப் பின்."],["கிறிஸ்து வாழ்கிறார்","இளையோருக்கும் இறைமக்கள் அனைவருக்கும்."],["மகிழ்ந்து களிகூருங்கள்","இன்றைய உலகில் தூய்மைக்கான அழைப்பு பற்றி."],["அன்பின் மகிழ்ச்சி","குடும்பத்தில் அன்பு பற்றி."],["இறைவா உமக்கே புகழ்","நம் பொது இல்லத்தைப் பேணுதல் பற்றி."],["இரக்கத்தின் முகம்","இரக்கத்தின் சிறப்பு யூபிலி ஆண்டை அறிவிக்கும் திருமடல்."],["நற்செய்தியின் மகிழ்ச்சி","இன்றைய உலகில் நற்செய்தி அறிவிப்பு; மறைப்பணித் திருஅவையின் திட்டம்."],["விசுவாசத்தின் ஒளி","விசுவாசம் பற்றி; பதினாறாம் பெனடிக்ட் தொடங்கி பிரான்சிஸ் நிறைவு செய்தது."],["ஆண்டவரின் வார்த்தை","திருஅவையின் வாழ்விலும் பணியிலும் இறைவார்த்தை பற்றி."],["உண்மையில் பிறரன்பு","பிறரன்பிலும் உண்மையிலும் முழுமையான மனித வளர்ச்சி பற்றி."],["எதிர்நோக்கில் மீட்பு","கிறிஸ்தவ எதிர்நோக்கு பற்றி."],["பிறரன்பின் அருளடையாளம்","திருஅவையின் வாழ்வுக்கும் பணிக்கும் ஊற்றும் உச்சியுமான நற்கருணை பற்றி."],["கடவுள் அன்பாய் இருக்கிறார்","கிறிஸ்தவ அன்பு பற்றி."],["நற்கருணையிலிருந்து திருஅவை","திருஅவையோடு உள்ள உறவில் நற்கருணை பற்றி."],["கன்னி மரியாவின் செபமாலை","செபமாலை பற்றி; ஒளியின் மறைபொருள்களை அறிமுகப்படுத்துகிறது."],["புதிய ஆயிரமாண்டின் தொடக்கத்தில்","2000 மாபெரும் யூபிலியின் நிறைவில்: ஆழத்துக்குத் தள்ளிச் செல்லுங்கள் என்ற அழைப்பு."],["ஆசியாவில் திருஅவை","ஆசிய ஆயர் மாமன்றத்துக்குப் பின்; மீட்பராம் இயேசு கிறிஸ்துவும் ஆசியாவில் அவரது பணியும். புதுதில்லியில் கையெழுத்திடப்பட்டது."],["விசுவாசமும் அறிவும்","விசுவாசத்துக்கும் அறிவுக்கும் இடையிலான உறவு பற்றி."],["ஆண்டவரின் நாள்","ஞாயிற்றைப் புனிதமாகக் கடைப்பிடித்தல் பற்றி."],["கிழக்கின் ஒளி","சிரிய மரபுகள் உட்பட கீழைத் திருஅவைகளின் செல்வங்கள் பற்றி."],["வாழ்வின் நற்செய்தி","மனித உயிரின் மதிப்பும் மீற முடியாத தன்மையும் பற்றி."],["மீட்பரின் பணி","திருஅவையின் மறைப்பணிக் கட்டளையின் நிலையான செல்லுபடி பற்றி."],["மீட்பரின் காவலர்","கிறிஸ்துவின் வாழ்விலும் திருஅவையிலும் புனித யோசேப்பு பற்றி."],["கிறிஸ்தவக் குடும்பம்","இன்றைய உலகில் கிறிஸ்தவக் குடும்பத்தின் பங்கு பற்றி."],["இன்றைய உலகில் நற்செய்தி அறிவிப்பு","நற்செய்தி அறிவிப்பே திருஅவையின் ஆழ்ந்த அடையாளம்."],["மனித வாழ்வு பற்றி","பிறப்பு ஒழுங்குமுறை பற்றி."],["மக்களினங்களின் முன்னேற்றம்","மக்களினங்களின் வளர்ச்சி பற்றி."],["மக்களினங்களுக்கு","திருஅவையின் மறைப்பணி பற்றிய ஒழுங்குமுறை ஏடு."],["இறைவார்த்தை","இறைவெளிப்பாடு பற்றிய கோட்பாட்டு அமைப்பு ஏடு."],["மகிழ்ச்சியும் எதிர்நோக்கும்","இன்றைய உலகில் திருஅவை பற்றிய மேய்ப்புப்பணி அமைப்பு ஏடு."],["கீழைத் திருஅவைகள்","கத்தோலிக்கக் கீழைத் திருஅவைகள் பற்றிய ஒழுங்குமுறை ஏடு."],["மக்களினங்களின் ஒளி","திருஅவை பற்றிய கோட்பாட்டு அமைப்பு ஏடு."],["இத்தூய பொதுச்சங்கம்","தூய வழிபாடு பற்றிய அமைப்பு ஏடு."]],
 hi:[["विश्वास की एकता में","निकेया महासभा की 1700वीं वर्षगाँठ और हमारे द्वारा स्वीकार किए जानेवाले धर्मसार पर।"],["मैंने तुझसे प्रेम किया","गरीबों के प्रति प्रेम पर।"],["उसने हमसे प्रेम किया","येसु मसीह के हृदय के मानवीय और ईश्वरीय प्रेम पर।"],["यह भरोसा है","संत तेरेसा की 150वीं वर्षगाँठ पर, ईश्वर के दयालु प्रेम में भरोसे पर।"],["ईश्वर की स्तुति करो","लौदातो सी के बाद, जलवायु संकट पर।"],["मैंने उत्कट इच्छा की","ईश्वर की प्रजा के धर्मविधिक निर्माण पर।"],["सब भाई-बहन","भ्रातृत्व और सामाजिक मित्रता पर।"],["पिता के हृदय से","संत योसेफ़ के सार्वभौमिक कलीसिया के संरक्षक घोषित होने की 150वीं वर्षगाँठ पर।"],["प्रिय अमेज़न","अमेज़न क्षेत्र पर धर्माध्यक्षीय धर्मसभा के बाद।"],["मसीह जीवित हैं","युवाओं और ईश्वर की पूरी प्रजा के लिए।"],["आनंद मनाओ और उल्लसित हो","आज के संसार में पवित्रता की बुलाहट पर।"],["प्रेम का आनंद","परिवार में प्रेम पर।"],["तेरी स्तुति हो","हमारे साझा घर की देखभाल पर।"],["दया का मुख","दया के असाधारण जयंती वर्ष की घोषणा का बुल्ला।"],["सुसमाचार का आनंद","आज के संसार में सुसमाचार की घोषणा; मिशनरी कलीसिया का कार्यक्रम।"],["विश्वास की ज्योति","विश्वास पर; बेनेडिक्ट सोलहवें ने आरंभ किया और फ्रांसिस ने पूरा किया।"],["प्रभु का वचन","कलीसिया के जीवन और मिशन में ईश-वचन पर।"],["सत्य में प्रेम","प्रेम और सत्य में समग्र मानव विकास पर।"],["आशा में मुक्ति","ख्रीस्तीय आशा पर।"],["प्रेम का संस्कार","कलीसिया के जीवन और मिशन के स्रोत और शिखर यूखरिस्त पर।"],["ईश्वर प्रेम है","ख्रीस्तीय प्रेम पर।"],["यूखरिस्त से कलीसिया","कलीसिया के साथ संबंध में यूखरिस्त पर।"],["कुँवारी मरियम की माला","माला पर; ज्योति के रहस्यों का परिचय।"],["नई सहस्राब्दी के आरंभ में","2000 की महान जयंती के समापन पर: गहरे पानी में जाल डालने का आह्वान।"],["एशिया में कलीसिया","एशिया की धर्मसभा के बाद; मुक्तिदाता येसु मसीह और एशिया में उनका मिशन। नई दिल्ली में हस्ताक्षरित।"],["विश्वास और तर्क","विश्वास और तर्क के संबंध पर।"],["प्रभु का दिन","रविवार को पवित्र मानने पर।"],["पूर्व की ज्योति","सीरियाई परंपराओं सहित पूर्वी कलीसियाओं की संपदा पर।"],["जीवन का सुसमाचार","मानव जीवन के मूल्य और अनुल्लंघनीयता पर।"],["मुक्तिदाता का मिशन","कलीसिया के मिशनरी आदेश की स्थायी वैधता पर।"],["मुक्तिदाता के संरक्षक","मसीह और कलीसिया के जीवन में संत योसेफ़ पर।"],["ख्रीस्तीय परिवार","आधुनिक संसार में ख्रीस्तीय परिवार की भूमिका पर।"],["आधुनिक संसार में सुसमाचार-प्रचार","सुसमाचार-प्रचार कलीसिया की गहनतम पहचान।"],["मानव जीवन के विषय में","जन्म-नियमन पर।"],["जातियों का विकास","जातियों के विकास पर।"],["राष्ट्रों के प्रति","कलीसिया की मिशनरी गतिविधि पर आज्ञप्ति।"],["ईश्वर का वचन","ईश्वरीय प्रकाशना पर धर्मसिद्धांतीय संविधान।"],["आनंद और आशा","आधुनिक संसार में कलीसिया पर प्रेरितिक संविधान।"],["पूर्वी कलीसियाएँ","काथलिक पूर्वी कलीसियाओं पर आज्ञप्ति।"],["राष्ट्रों की ज्योति","कलीसिया पर धर्मसिद्धांतीय संविधान।"],["यह पवित्र महासभा","पवित्र धर्मविधि पर संविधान।"]],
 de:[["In der Einheit des Glaubens","Zum 1700. Jahrestag des Konzils von Nizäa und des Glaubensbekenntnisses, das wir bekennen."],["Ich habe dich geliebt","Über die Liebe zu den Armen."],["Er hat uns geliebt","Über die menschliche und göttliche Liebe des Herzens Jesu Christi."],["Es ist das Vertrauen","Über das Vertrauen auf die barmherzige Liebe Gottes, zum 150. Geburtstag der hl. Thérèse."],["Lobt Gott","Über die Klimakrise, im Anschluss an Laudato si'."],["Mit Sehnsucht habe ich verlangt","Über die liturgische Bildung des Volkes Gottes."],["Alle Brüder","Über die Geschwisterlichkeit und die soziale Freundschaft."],["Mit väterlichem Herzen","Über den hl. Josef, 150 Jahre nach seiner Erhebung zum Patron der Weltkirche."],["Geliebtes Amazonien","Nach der Amazonas-Synode."],["Christus lebt","An die jungen Menschen und an das ganze Volk Gottes."],["Freut euch und jubelt","Über den Ruf zur Heiligkeit in der Welt von heute."],["Die Freude der Liebe","Über die Liebe in der Familie."],["Gelobt seist du","Über die Sorge für das gemeinsame Haus."],["Das Antlitz der Barmherzigkeit","Bulle zur Ausrufung des Außerordentlichen Jubiläums der Barmherzigkeit."],["Die Freude des Evangeliums","Über die Verkündigung des Evangeliums in der heutigen Welt; das Programm einer missionarischen Kirche."],["Das Licht des Glaubens","Über den Glauben; von Benedikt XVI. begonnen und von Franziskus vollendet."],["Das Wort des Herrn","Über das Wort Gottes im Leben und in der Sendung der Kirche."],["Die Liebe in der Wahrheit","Über die ganzheitliche Entwicklung des Menschen in Liebe und Wahrheit."],["Auf Hoffnung hin gerettet","Über die christliche Hoffnung."],["Sakrament der Liebe","Über die Eucharistie als Quelle und Höhepunkt von Leben und Sendung der Kirche."],["Gott ist die Liebe","Über die christliche Liebe."],["Die Kirche lebt von der Eucharistie","Über die Eucharistie in ihrer Beziehung zur Kirche."],["Der Rosenkranz der Jungfrau Maria","Über den Rosenkranz; führt die lichtreichen Geheimnisse ein."],["Zu Beginn des neuen Jahrtausends","Zum Abschluss des Großen Jubiläums 2000: der Ruf, hinauszufahren."],["Die Kirche in Asien","Nach der Asien-Synode; über Jesus Christus, den Erlöser, und seine Sendung in Asien. In Neu-Delhi unterzeichnet."],["Glaube und Vernunft","Über das Verhältnis von Glaube und Vernunft."],["Der Tag des Herrn","Über die Heiligung des Sonntags."],["Das Licht des Ostens","Über die Schätze der Ostkirchen, einschließlich der syrischen Traditionen."],["Das Evangelium vom Leben","Über den Wert und die Unantastbarkeit des menschlichen Lebens."],["Die Sendung des Erlösers","Über die fortdauernde Gültigkeit des missionarischen Auftrags der Kirche."],["Der Beschützer des Erlösers","Über den hl. Josef im Leben Christi und der Kirche."],["Die christliche Familie","Über die Aufgaben der christlichen Familie in der Welt von heute."],["Die Evangelisierung in der Welt von heute","Über die Evangelisierung als tiefste Identität der Kirche."],["Über das menschliche Leben","Über die Weitergabe des Lebens."],["Die Entwicklung der Völker","Über die Entwicklung der Völker."],["An die Völker","Dekret über die Missionstätigkeit der Kirche."],["Das Wort Gottes","Dogmatische Konstitution über die göttliche Offenbarung."],["Freude und Hoffnung","Pastoralkonstitution über die Kirche in der Welt von heute."],["Die Ostkirchen","Dekret über die katholischen Ostkirchen."],["Licht der Völker","Dogmatische Konstitution über die Kirche."],["Das Heilige Konzil","Konstitution über die heilige Liturgie."]],
 it:[["Nell'unità della fede","Nel 1700° anniversario del Concilio di Nicea e del Credo che professiamo."],["Ti ho amato","Sull'amore per i poveri."],["Ci ha amati","Sull'amore umano e divino del Cuore di Gesù Cristo."],["È la fiducia","Sulla fiducia nell'amore misericordioso di Dio, nel 150° anniversario di santa Teresa."],["Lodate Dio","Sulla crisi climatica, dopo la Laudato si'."],["Ho tanto desiderato","Sulla formazione liturgica del popolo di Dio."],["Tutti fratelli","Sulla fraternità e l'amicizia sociale."],["Con cuore di padre","Su san Giuseppe, 150 anni dopo la sua proclamazione a Patrono della Chiesa universale."],["Cara Amazzonia","Dopo il Sinodo per la regione amazzonica."],["Cristo vive","Ai giovani e a tutto il popolo di Dio."],["Rallegratevi ed esultate","Sulla chiamata alla santità nel mondo contemporaneo."],["La gioia dell'amore","Sull'amore nella famiglia."],["Laudato si'","Sulla cura della casa comune."],["Il volto della misericordia","Bolla di indizione del Giubileo straordinario della misericordia."],["La gioia del Vangelo","Sull'annuncio del Vangelo nel mondo attuale; il programma di una Chiesa missionaria."],["La luce della fede","Sulla fede; iniziata da Benedetto XVI e completata da Francesco."],["La Parola del Signore","Sulla Parola di Dio nella vita e nella missione della Chiesa."],["La carità nella verità","Sullo sviluppo umano integrale nella carità e nella verità."],["Salvati nella speranza","Sulla speranza cristiana."],["Il sacramento della carità","Sull'Eucaristia fonte e culmine della vita e della missione della Chiesa."],["Dio è amore","Sull'amore cristiano."],["La Chiesa vive dell'Eucaristia","Sull'Eucaristia nel suo rapporto con la Chiesa."],["Il Rosario della Vergine Maria","Sul Rosario; introduce i misteri della luce."],["All'inizio del nuovo millennio","A conclusione del Grande Giubileo del 2000: l'invito a prendere il largo."],["La Chiesa in Asia","Dopo il Sinodo per l'Asia; su Gesù Cristo Salvatore e la sua missione in Asia. Firmata a Nuova Delhi."],["Fede e ragione","Sul rapporto tra fede e ragione."],["Il giorno del Signore","Sulla santificazione della domenica."],["La luce dell'Oriente","Sui tesori delle Chiese orientali, comprese le tradizioni siriache."],["Il Vangelo della vita","Sul valore e l'inviolabilità della vita umana."],["La missione del Redentore","Sulla permanente validità del mandato missionario."],["Il custode del Redentore","Su san Giuseppe nella vita di Cristo e della Chiesa."],["La famiglia cristiana","Sui compiti della famiglia cristiana nel mondo di oggi."],["L'evangelizzazione nel mondo contemporaneo","Sull'evangelizzazione, identità più profonda della Chiesa."],["Sulla vita umana","Sulla regolazione della natalità."],["Lo sviluppo dei popoli","Sullo sviluppo dei popoli."],["Alle genti","Decreto sull'attività missionaria della Chiesa."],["La Parola di Dio","Costituzione dogmatica sulla divina Rivelazione."],["Gioia e speranza","Costituzione pastorale sulla Chiesa nel mondo contemporaneo."],["Le Chiese orientali","Decreto sulle Chiese orientali cattoliche."],["Luce delle genti","Costituzione dogmatica sulla Chiesa."],["Questo santo Concilio","Costituzione sulla sacra liturgia."]]};

o Ksaveri","t":"Padre Myesuiti, mtume wa Mashariki, msimamizi wa misioni"},"img":{"src":"img/saints/francisxavier.jpg","cap":{"en":"St Francis Xavier, Japanese painting, early 17th century, Kobe City Museum, Japan. The saint gazes upward with a burning heart, saying “Satis est, Domine, satis est” (It is enough, Lord). Public domain, via Wikimedia Commons.","ml":"വിശുദ്ധ ഫ്രാൻസിസ് സേവ്യർ: പതിനേഴാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിൽ ജപ്പാനിൽ വരച്ച ചിത്രം; ജപ്പാനിലെ കോബെ സിറ്റി മ്യൂസിയത്തിൽ. ജ്വലിക്കുന്ന ഹൃദയവുമായി മുകളിലേക്കു നോക്കി “മതി കർത്താവേ, മതി” എന്നു പറയുന്ന വിശുദ്ധൻ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"joseph","md":"03-19","en":{"n":"St Joseph, Spouse of the Blessed Virgin Mary","t":"Guardian of the Redeemer, Patron of the Universal Church"},"ml":{"n":"പരിശുദ്ധ കന്യകാമറിയത്തിന്റെ ഭർത്താവായ വിശുദ്ധ യൗസേപ്പ്","t":"രക്ഷകന്റെ കാവൽക്കാരൻ, ആഗോളസഭയുടെ മധ്യസ്ഥൻ"},"ta":{"n":"புனித யோசேப்பு, தூய கன்னி மரியாவின் கணவர்","t":"மீட்பரின் பாதுகாவலர், உலகளாவிய திருச்சபையின் பாதுகாவலர்"},"hi":{"n":"संत योसेफ, धन्य कुँवारी मरियम के पति","t":"मुक्तिदाता के संरक्षक, विश्वव्यापी कलीसिया के संरक्षक"},"kn":{"n":"ಸಂತ ಜೋಸೆಫರು, ಪೂಜ್ಯ ಕನ್ಯಾ ಮರಿಯಳ ಪತಿ","t":"ವಿಮೋಚಕನ ಪಾಲಕರು, ವಿಶ್ವ ಧರ್ಮಸಭೆಯ ಪಾಲಕರು"},"te":{"n":"పునీత యోసేపు, ధన్య కన్య మరియమాత భర్త","t":"విమోచకుని సంరక్షకుడు, విశ్వ శ్రీసభ పాలకుడు"},"de":{"n":"Hl. Josef, Bräutigam der seligen Jungfrau Maria","t":"Beschützer des Erlösers, Patron der Weltkirche"},"it":{"n":"San Giuseppe, sposo della beata Vergine Maria","t":"Custode del Redentore, patrono della Chiesa universale"},"es":{"n":"San José, esposo de la Virgen María","t":"Custodio del Redentor, patrono de la Iglesia universal"},"pt":{"n":"São José, esposo da Virgem Maria","t":"Guardião do Redentor, padroeiro da Igreja universal"},"fr":{"n":"Saint Joseph, époux de la Vierge Marie","t":"Gardien du Rédempteur, patron de l'Église universelle"},"tl":{"n":"San Jose, kabiyak ng Mahal na Birheng Maria","t":"Tagapag-ingat ng Manunubos, patron ng Simbahang pandaigdig"},"sw":{ skari, mmonaki na Askofu wa Tours"},"img":{"src":"img/saints/martintours.jpg","cap":{"en":"El Greco, St Martin and the Beggar, oil on canvas, 1597–1599, National Gallery of Art, Washington. The young soldier cuts his cloak in two for the poor man. Public domain (CC0), via Wikimedia Commons.","ml":"എൽ ഗ്രേക്കോ വരച്ച “വിശുദ്ധ മാർട്ടിനും യാചകനും” (എണ്ണച്ചായാചിത്രം, 1597–1599). വാഷിംഗ്ടണിലെ നാഷണൽ ഗാലറി ഓഫ് ആർട്ടിൽ. യുവ പടയാളി തന്റെ മേലങ്കി രണ്ടായി മുറിച്ച് പാവപ്പെട്ടവനു നൽകുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"josaphat","md":"11-12","en":{"n":"St Josaphat","t":"Eastern Catholic Archbishop of Polotsk, martyr for the unity of the Church"},"ml":{"n":"വിശുദ്ധ ജോസഫാത്ത്","t":"പോളോട്സ്കിലെ പൗരസ്ത്യകത്തോലിക്കാ ആർച്ച്ബിഷപ്പ്, സഭൈക്യത്തിനുവേണ്ടി രക്തസാക്ഷി"},"ta":{"n":"புனித யோசபாத்","t":"போலோட்ஸ்க் கீழைக் கத்தோலிக்கப் பேராயர், திருஅவை ஒன்றிப்புக்கான மறைசாட்சி"},"hi":{"n":"संत योसाफ़ात","t":"पोलोत्स्क के पूर्वी काथलिक महाधर्माध्यक्ष, कलीसिया की एकता के लिए शहीद"},"de":{"n":"Hl. Josaphat","t":"Ostkirchlicher katholischer Erzbischof von Polozk, Märtyrer der Kircheneinheit"},"it":{"n":"San Giosafat","t":"Arcivescovo cattolico orientale di Polotsk, martire dell'unità della Chiesa"},"kn":{"n":"ಸಂತ ಜೊಸಫಾತ್","t":"ಪೊಲೊಟ್ಸ್ಕ್‌ನ ಪೌರಸ್ತ್ಯ ಕಥೋಲಿಕ ಮಹಾಧರ್ಮಾಧ್ಯಕ್ಷರು, ಧರ್ಮಸಭೆಯ ಐಕ್ಯತೆಗಾಗಿ ಹುತಾತ್ಮರು"},"es":{"n":"San Josafat","t":"Arzobispo católico oriental de Pólotsk, mártir por la unidad de la Iglesia"},"pt":{"n":"São Josafat","t":"Arcebispo católico oriental de Polotsk, mártir pela unidade da Igreja"},"fr":{"n":"Saint Josaphat","t":"Archevêque catholique oriental de Polotsk, martyr pour l'unité de l'Église"},"tl":{"n":"San Josafat","t":"Katolikong arsobispo sa Silangan ng Polotsk, martir para sa pagkakaisa ng Simbahan"},"te":{"n":"పునీత జోసఫాత్","t":"పొలోట్స్క్ తూర్పు కతోలిక మహాపీఠాధిపతి, శ్రీసభ ఐక్యత కొరకు వేదసాక్షి"},"sw":{"n":"Mt. Yosafati","t":"Askofu Mkuu Mkatoliki wa Mashariki wa Polotsk, shahidi kwa ajili ya umoja wa Kanisa"},"img":{"src":"img/saints/josaphat.jpg","cap":{"en":"Aleksander Tarasowicz, St Josaphat, martyr, copper engraving, late 17th or early 18th century (detail). Public domain, via Wikimedia Commons.","ml":"അലക്സാണ്ടർ തരസോവിച്ച് തയ്യാറാക്കിയ “രക്തസാക്ഷിയായ വിശുദ്ധ യോസഫാത്ത്” (ചെമ്പുതകിടിലെ കൊത്തുചിത്രം, പതിനേഴാം നൂറ്റാണ്ടിന്റെ അവസാനമോ പതിനെട്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭമോ; ഭാഗം). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"albertgreat","md":"11-15","en":{"n":"St Albert the Great","t":"Dominican bishop, Doctor of the Church, patron of scientists"},"ml":{"n":"മഹാനായ വിശുദ്ധ ആൽബർട്ട്","t":"ഡൊമിനിക്കൻ മെത്രാൻ, വേദപാരംഗതൻ, ശാസ്ത്രജ്ഞരുടെ മധ്യസ്ഥൻ"},"ta":{"n":"புனித பெரிய ஆல்பர்ட்","t":"தொமினிக்கன் ஆயர், மறைவல்லுநர், அறிவியலாளர்களின் பாதுகாவலர்"},"hi":{"n":"संत महान अल्बर्ट","t":"डोमिनिकन धर्माध्यक्ष, कलीसिया के आचार्य, वैज्ञानिकों के संरक्षक"},"de":{"n":"Hl. Albert der Große","t":"Dominikaner, Bischof, Kirchenlehrer, Patron der Naturwissenschaftler"},"it":{"n":"Sant'Alberto Magno","t":"Domenicano, vescovo, dottore della Chiesa, patrono degli scienziati"},"kn":{"n":"ಸಂತ ಮಹಾ ಆಲ್ಬರ್ಟ್","t":"ದೊಮಿನಿಕನ್ ಧರ್ಮಾಧ್ಯಕ್ಷರು, ಧರ್ಮಸಭೆಯ ಪಂಡಿತರು, ವಿಜ್ಞಾನಿಗಳ ಪಾಲಕರು"},"es":{"n":"San Alberto Magno","t":"Obispo dominico, doctor de la Iglesia, patrono de los científicos"},"pt":{"n":"Santo Alberto Magno","t":"Bispo dominicano, doutor da Igreja, padroeiro dos cientistas"},"fr":{"n":"Saint Albert le Grand","t":"Évêque dominicain, docteur de l'Église, patron des scientifiques"},"tl":{"n":"San Alberto Magno","t":"Dominikong obispo, pantas ng Simbahan, patron ng mga siyentipiko"},"te":{"n":"పునీత మహా ఆల్బర్ట్","t":"డొమినికన్ పీఠాధిపతి, శ్రీసభ పండితుడు, శాస్త్రవేత్తల పాలకుడు"},"sw":{"n":"Mt. Alberto Mkuu","t":"Askofu Mdominiko, Mwalimu wa Kanisa, msimamizi wa wanasayansi"},"img":{"src":"img/saints/albertgreat.jpg","cap":{"en":"Tommaso da Modena, Albert the Great, fresco, 1352, from the series of forty famous Dominicans in the chapter house of the former Dominican convent of San Niccolò, Treviso, Italy. Public domain, via Wikimedia Commons.","ml":"തൊമ്മാസോ ദ മോദേന വരച്ച “മഹാനായ വിശുദ്ധ ആൽബർട്ട്” (ചുവർചിത്രം, 1352). ഇറ്റലിയിലെ ത്രെവീസോയിൽ സാൻ നിക്കോളോ ഡൊമിനിക്കൻ ആശ്രമത്തിന്റെ ചാപ്റ്റർ ഹാളിലുള്ള നാല്പതു പ്രശസ്ത ഡൊമിനിക്കൻ സന്യാസികളുടെ ചിത്രപരമ്പരയിൽ ഉൾപ്പെട്ടത്. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"elizabethhungary","md":"11-17","en":{"n":"St Elizabeth of Hungary","t":"Princess, wife, mother and servant of the poor"},"ml":{"n":"ഹംഗറിയിലെ വിശുദ്ധ എലിസബത്ത്","t":"രാജകുമാരി, ഭാര്യ, അമ്മ, ദരിദ്രരുടെ ശുശ്രൂഷക"},"ta":{"n":"ஹங்கேரி புனித எலிசபெத்","t":"இளவரசி, மனைவி, தாய், ஏழைகளின் பணியாளர்"},"hi":{"n":"हंगरी की संत एलिज़ाबेथ","t":"राजकुमारी, पत्नी, माँ और गरीबों की सेविका"},"de":{"n":"Hl. Elisabeth von Thüringen","t":"Königstochter, Ehefrau, Mutter und Dienerin der Armen"},"it":{"n":"Santa Elisabetta d'Ungheria","t":"Principessa, sposa, madre e serva dei poveri"},"kn":{"n":"ಹಂಗೇರಿಯ ಸಂತ ಎಲಿಜಬೆತ್","t":"ರಾಜಕುಮಾರಿ, ಪತ್ನಿ, ತಾಯಿ ಮತ್ತು ಬಡವರ ಸೇವಕಿ"},"es":{"n":"Santa Isabel de Hungría","t":"Princesa, esposa, madre y servidora de los pobres"},"pt":{"n":"Santa Isabel da Hungria","t":"Princesa, esposa, mãe e servidora dos pobres"},"fr":{"n":"Sainte Élisabeth de Hongrie","t":"Princesse, épouse, mère et servante des pauvres"},"tl":{"n":"Santa Isabel ng Hungary","t":"Prinsesa, asawa, ina at lingkod ng mga dukha"},"te":{"n":"హంగేరీ పునీత ఎలిజబెత్","t":"రాకుమారి, భార్య, తల్లి, పేదల సేవకురాలు"},"sw":{"n":"Mt. Elizabeti wa Hungaria","t":"Binti mfalme, mke, mama na mtumishi wa maskini"},"img":{"src":"img/saints/elizabethhungary.jpg","cap":{"en":"Sándor Liezen-Mayer, St Elizabeth of Hungary, oil on canvas, 1882, Hungarian National Gallery, Budapest. Public domain, via Wikimedia Commons.","ml":"ഷാൻഡോർ ലീസൻ-മയർ വരച്ച “ഹംഗറിയിലെ വിശുദ്ധ എലിസബത്ത്” (എണ്ണച്ചായാചിത്രം, 1882). ബുഡാപെസ്റ്റിലെ ഹംഗേറിയൻ ദേശീയ ചിത്രശാലയിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"cecilia","md":"11-22","en":{"n":"St Cecilia","t":"Virgin and martyr of Rome, patron of music"},"ml":{"n":"വിശുദ്ധ സിസിലിയ","t":"റോമിലെ കന്യകയും രക്തസാക്ഷിയും, സംഗീതത്തിന്റെ മധ്യസ്ഥ"},"ta":{"n":"புனித செசிலியா","t":"உரோமையின் கன்னியும் மறைசாட்சியும், இசையின் பாதுகாவலி"},"hi":{"n":"संत सिसिलिया","t":"रोम की कुँवारी और शहीद, संगीत की संरक्षिका"},"de":{"n":"Hl. Cäcilia","t":"Jungfrau und Märtyrin in Rom, Patronin der Kirchenmusik"},"it":{"n":"Santa Cecilia","t":"Vergine e martire romana, patrona della musica"},"kn":{"n":"ಸಂತ ಸಿಸಿಲಿಯಾ","t":"ರೋಮಿನ ಕನ್ಯೆ ಮತ್ತು ಹುತಾತ್ಮೆ, ಸಂಗೀತದ ಪಾಲಕಿ"},"es":{"n":"Santa Cecilia","t":"Virgen y mártir de Roma, patrona de la música"},"pt":{"n":"Santa Cecília","t":"Virgem e mártir de Roma, padroeira da música"},"fr":{"n":"Sainte Cécile","t":"Vierge et martyre de Rome, patronne de la musique"},"tl":{"n":"Santa Cecilia","t":"Birhen at martir ng Roma, patron ng musika"},"te":{"n":"పునీత సిసీలియా","t":"రోమ్ కన్య, వేదసాక్షి, సంగీత పాలకురాలు"},"sw":{"n":"Mt. Sesilia","t":"Bikira na shahidi wa Roma, msimamizi wa muziki"},"img":{"src":"img/saints/cecilia.jpg","cap":{"en":"Raphael, The Ecstasy of St Cecilia, with Sts Paul, John the Evangelist, Augustine and Mary Magdalene, oil (transferred from panel to canvas), 1514, Pinacoteca Nazionale, Bologna, Italy. Public domain, via Wikimedia Commons.","ml":"റാഫേൽ വരച്ച “വിശുദ്ധ സിസിലിയയുടെ ആത്മീയാനന്ദം” (എണ്ണച്ചായാചിത്രം, 1514); വിശുദ്ധ പൗലോസ്, സുവിശേഷകനായ യോഹന്നാൻ, അഗസ്റ്റിൻ, മഗ്ദലനാ മറിയം എന്നിവരോടൊപ്പം. ഇറ്റലിയിലെ ബൊളോഞ്ഞയിലുള്ള ദേശീയ ചിത്രശാലയിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"vietnamesemartyrs","md":"11-24","en":{"n":"Sts Andrew Dũng-Lạc and Companions","t":"Martyrs of Vietnam"},"ml":{"n":"വിശുദ്ധ ആൻഡ്രൂ ഡുങ് ലാക്കും സഹരക്തസാക്ഷികളും","t":"വിയറ്റ്നാമിലെ രക്തസാക്ഷികൾ"},"ta":{"n":"புனித அந்திரேயா துங்-லாக்கும் தோழர்களும்","t":"வியட்நாம் மறைசாட்சிகள்"},"hi":{"n":"संत अन्द्रेयस डुंग-लाक और साथी","t":"वियतनाम के शहीद"},"de":{"n":"Hl. Andreas Dũng-Lạc und Gefährten","t":"Märtyrer in Vietnam"},"it":{"n":"Santi Andrea Dũng-Lạc e compagni","t":"Martiri del Vietnam"},"kn":{"n":"ಸಂತ ಆಂಡ óstol, el primer llamado, hermano de san Pedro"},"pt":{"n":"Santo André, apóstolo","t":"Apóstolo, o primeiro chamado, irmão de São Pedro"},"fr":{"n":"Saint André, apôtre","t":"Apôtre, le premier appelé, frère de saint Pierre"},"tl":{"n":"San Andres, apostol","t":"Apostol, ang unang tinawag, kapatid ni San Pedro"},"te":{"n":"పునీత అంద్రెయ, అపొస్తలుడు","t":"అపొస్తలుడు, మొదట పిలువబడినవాడు, పునీత పేతురు సహోదరుడు"},"sw":{"n":"Mt. Andrea, Mtume","t":"Mtume, Aliyeitwa Kwanza, kaka wa Mt. Petro"},"img":{"src":"img/saints/andrewapostle.jpg","cap":{"en":"El Greco, St Andrew, oil on canvas, c. 1610, Metropolitan Museum of Art, New York. The apostle embraces the cross of his martyrdom. Public domain (CC0), via Wikimedia Commons.","ml":"എൽ ഗ്രേക്കോ വരച്ച “വിശുദ്ധ അന്ത്രയോസ്” (എണ്ണച്ചായാചിത്രം, ഏകദേശം 1610). ന്യൂയോർക്കിലെ മെട്രോപൊളിറ്റൻ മ്യൂസിയം ഓഫ് ആർട്ടിൽ. തന്റെ രക്തസാക്ഷിത്വത്തിന്റെ കുരിശ് ശ്ലീഹാ ആലിംഗനം ചെയ്യുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"zechelizabeth","md":"11-05","rites":["smc","smk"],"en":{"n":"Sts Zechariah and Elizabeth","t":"Parents of John the Baptist"},"ml":{"n":"വിശുദ്ധരായ സഖറിയായും എലിസബത്തും","t":"സ്നാപകയോഹന്നാന്റെ മാതാപിതാക്കൾ"},"ta":{"n":"புனிதர்கள் செக்கரியாவும் எலிசபெத்தும்","t":"திருமுழுக்கு யோவானின் பெற்றோர்"},"hi":{"n":"संत ज़करियस और एलिज़ाबेथ","t":"योहन बपतिस्ता के माता-पिता"},"te":{"n":"పునీత జెకర్యా, ఎలీసబెతు","t":"స్నాపక యోహాను తల్లిదండ్రులు"},"img":{"src":"img/saints/zechelizabeth.jpg","cap":{"en":"Fra Angelico, The Naming of John the Baptist, tempera on panel, c. 1435, Museo di San Marco, Florence, Italy. Zechariah, still unable to speak, writes “His name is John” while Elizabeth holds the child. Public domain, via Wikimedia Commons.","ml":"ഫ്രാ ആഞ്ജലിക്കോ വരച്ച “സ്നാപകയോഹന്നാന്റെ നാമകരണം” (മരപ്പലകയിൽ ടെമ്പെറ, ഏകദേശം 1435). ഇറ്റലിയിലെ ഫ്ലോറൻസിലുള്ള സാൻ മാർക്കോ മ്യൂസിയത്തിൽ. സംസാരശേഷി ഇല്ലാതിരുന്ന സഖറിയാ “അവന്റെ പേര് യോഹന്നാൻ” എന്ന് എഴുതുന്നു; എലിസബത്ത് ശിശുവിനെ എടുത്തിരിക്കുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"thomasindia","md":"11-21","rites":["smc"],"en":{"n":"Entrance of St Thomas the Apostle into India","t":"Commemoration of the arrival of our Father in faith"},"ml":{"n":"മാർത്തോമ്മാശ്ലീഹായുടെ ഭാരതപ്രവേശം","t":"വിശ്വാസത്തിൽ നമ്മുടെ പിതാവിന്റെ ആഗമനത്തിന്റെ ഓർമ"},"ta":{"n":"புனித தோமா திருத்தூதரின் இந்திய வருகை","t":"விசுவாசத்தில் நம் தந்தையின் வருகையின் நினைவு"},"hi":{"n":"संत थोमस प्रेरित का भारत-आगमन","t":"विश्वास में हमारे पिता के आगमन का स्मरण"},"te":{"n":"అపోస్తలుడైన పునీత తోమాసు భారతదేశ ప్రవేశం","t":"విశ్వాసంలో మన తండ్రి రాకడ స్మరణ"},"img":{"src":"img/saints/thomasindia.jpg","cap":{"en":"Konstantinos Tzanes, St Thomas the Apostle enthroned, icon, 17th century, Hellenic Institute of Byzantine and Post-Byzantine Studies, Venice, Italy. Public domain, via Wikimedia Commons.","ml":"കോൺസ്റ്റാന്റിനോസ് ത്സാനെസ് എഴുതിയ “സിംഹാസനസ്ഥനായ മാർ തോമാ ശ്ലീഹാ” (ഐക്കൺ, പതിനേഴാം നൂറ്റാണ്ട്). ഇറ്റലിയിലെ വെനീസിലുള്ള ഹെല്ലനിക് ഇൻസ്റ്റിറ്റ്യൂട്ടിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"presentationmary","md":"11-21","en":{"n":"The Presentation of the Blessed Virgin Mary","t":"Mary given to God in the Temple"},"ml":{"n":"പരിശുദ്ധ കന്യകാമറിയത്തിന്റെ ദേവാലയസമർപ്പണം","t":"ദേവാലയത്തിൽ ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ട മറിയം"},"ta":{"n":"தூய கன்னி மரியா கோவிலில் காணிக்கையாக்கப்படுதல்","t":"கோவிலில் கடவுளுக்கு அர்ப்பணிக்கப்பட்ட மரியா"},"hi":{"n":"धन्य कुँवारी मरियम का मंदिर में समर्पण","t":"मंदिर में ईश्वर को समर्पित मरियम"},"de":{"n":"Gedenktag Unserer Lieben Frau in Jerusalem","t":"Darstellung Marias im Tempel"},"it":{"n":"Presentazione della Beata Vergine Maria","t":"Maria offerta a Dio nel tempio"},"kn":{"n":"ದೇವಾಲಯದಲ್ಲಿ ಧನ್ಯ ಕನ್ಯಾಮರಿಯಳ ಸಮರ್ಪಣೆ","t":"ದೇವಾಲಯದಲ್ಲಿ ದೇವರಿಗೆ ಅರ್ಪಿಸಲ್ಪಟ್ಟ ಮರಿಯ"},"es":{"n":"Presentación de la Virgen María","t":"María entregada a Dios en el templo"},"pt":{"n":"Apresentação de Nossa Senhora","t":"Maria entregue a Deus no templo"},"fr":{"n":"Présentation de la Vierge Marie","t":"Marie offerte à Dieu au Temple"},"tl":{"n":"Pagdadala kay Birheng Maria sa Templo","t":"Si Mariang inihandog sa Diyos sa Templo"},"te":{"n":"దేవాలయంలో మరియమాత సమర్పణ","t":"దేవాలయంలో దేవునికి అర్పించబడిన మరియ"},"sw":{"n":"Bikira Maria Kutolewa Hekaluni","t":"Maria aliyetolewa kwa Mungu Hekaluni"},"img":{"src":"img/saints/presentationmary.jpg","cap":{"en":"Giotto, The Presentation of the Virgin in the Temple, fresco, 1303–1305, Scrovegni Chapel, Padua, Italy. Public domain, via Wikimedia Commons.","ml":"ജോത്തോ വരച്ച “പരിശുദ്ധ കന്യകയെ ദേവാലയത്തിൽ കാഴ്ചവയ്ക്കുന്നു” (ചുവർചിത്രം, 1303–1305). ഇറ്റലിയിലെ പാദുവായിലുള്ള സ്ക്രൊവേഞ്ഞി ചാപ്പലിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"nicaea318","md":"11-03","rites":["smk"],"en":{"n":"The 318 Fathers of Nicaea","t":"Bishops of the First Ecumenical Council (AD 325)"},"ml":{"n":"നിഖ്യായിലെ 318 പിതാക്കന്മാർ","t":"ഒന്നാം സാർവത്രിക സൂനഹദോസിലെ മെത്രാന്മാർ (എ.ഡി. 325)"},"ta":{"n":"நிசேயாவின் 318 தந்தையர்","t":"முதல் பொதுச்சங்கத்தின் ஆயர்கள் (கி.பி. 325)"},"hi":{"n":"निकेया के 318 आचार्य","t":"पहली विश्वव्यापी महासभा के धर्माध्यक्ष (ई. 325)"},"img":{"src":"img/saints/nicaea318.jpg","cap":{"en":"Michael Damaskinos, The First Ecumenical Council of Nicaea, icon, 1591, Heraklion, Crete. Below the fathers lies Arius, whose teaching the council condemned. Public domain, via Wikimedia Commons.","ml":"മിഖായേൽ ദമാസ്കീനോസ് എഴുതിയ “നിഖ്യായിലെ ഒന്നാം സാർവത്രിക സൂനഹദോസ്” (ഐക്കൺ, 1591), ക്രീറ്റിലെ ഹെരാക്ലിയോണിൽ. പിതാക്കന്മാരുടെ താഴെ, സൂനഹദോസ് തള്ളിക്കളഞ്ഞ പഠനത്തിന്റെ ഉപജ്ഞാതാവായ ആര്യൂസ് കിടക്കുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"melitene33","md":"11-07","rites":["smk"],"en":{"n":"The 33 Martyrs of Melitene","t":"Soldier-martyrs of the early Church"},"ml":{"n":"മെലിത്തീനിലെ 33 രക്തസാക്ഷികൾ","t":"ആദിമസഭയിലെ പടയാളി-രക്തസാക്ഷികൾ"},"ta":{"n":"மெலித்தேனின் 33 மறைசாட்சிகள்","t":"தொடக்கத் திருஅவையின் படைவீர மறைசாட்சிகள்"},"hi":{"n":"मेलितेने के 33 शहीद","t":"आरंभिक कलीसिया के सैनिक-शहीद"},"img":{"src":"img/saints/melitene33.jpg","cap":{"en":"The thirty-three holy martyrs of Melitene, Byzantine icon, c. 1050. Public domain, via Wikimedia Commons.","ml":"മെലിത്തേനയിലെ മുപ്പത്തിമൂന്നു വിശുദ്ധ രക്തസാക്ഷികൾ: ബൈസന്റൈൻ ഐക്കൺ (ഏകദേശം 1050). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"theodore","md":"11-09","rites":["smk"],"en":{"n":"St Theodore","t":"Soldier and martyr"},"ml":{"n":"വിശുദ്ധ തെയദോർ","t":"പടയാളിയും രക്തസാക്ഷിയും"},"ta":{"n":"புனித தியோதோர்","t":"படைவீரரும் மறைசாட்சியும்"},"hi":{"n":"संत थियोडोर","t":"सैनिक और शहीद"},"img":{"src":"img/saints/theodore.jpg","cap":{"en":"St Theodore of Amasea (Theodore the Recruit), martyr and soldier, icon attributed to Ioannis Apakas, tempera and gilding on wood, first half of the 17th century, Northern Greece, Pushkin State Museum of Fine Arts, Moscow. Public domain, via Wikimedia Commons.","ml":"അമാസ്യയിലെ വിശുദ്ധ തെയദോർ (പടയാളിയും രക്തസാക്ഷിയും): യോവാന്നിസ് അപ്പാക്കസ് എഴുതിയതെന്നു കരുതുന്ന ഐക്കൺ (മരപ്പലകയിൽ ടെമ്പെറയും സ്വർണ്ണപ്പൂശും, പതിനേഴാം നൂറ്റാണ്ടിന്റെ ആദ്യപകുതി, വടക്കൻ ഗ്രീസ്). മോസ്കോയിലെ പുഷ്കിൻ ദേശീയ ചിത്രകലാ മ്യൂസിയത്തിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"johnalmsgiver","md":"11-12","rites":["smk"],"en":{"n":"St John the Almsgiver","t":"Patriarch of Alexandria, friend of the poor"},"ml":{"n":"കരുണാമയനായ വിശുദ്ധ യോഹന്നാൻ","t":"അലക്സാന്ത്രിയായിലെ പാത്രിയർക്കീസ്, ദരിദ്രരുടെ സുഹൃത്ത്"},"ta":{"n":"இரக்கமுள்ள புனித யோவான்","t":"அலெக்சாந்திரியாவின் முதுபெரும் தந்தை, ஏழைகளின் நண்பர்"},"hi":{"n":"दानशील संत योहन","t":"अलेक्ज़ान्द्रिया के प्राधिधर्माध्यक्ष, गरीबों के मित्र"},"img":{"src":"img/saints/johnalmsgiver.jpg","cap":{"en":"Titian, St John the Almsgiver, oil on canvas, c. 1545, church of San Giovanni Elemosinario, Venice, Italy. Public domain, via Wikimedia Commons.","ml":"റ്റിഷ്യൻ വരച്ച “ദാനശീലനായ വിശുദ്ധ യോഹന്നാൻ” (എണ്ണച്ചായാചിത്രം, ഏകദേശം 1545). ഇറ്റലിയിലെ വെനീസിൽ സാൻ ജൊവാന്നി എലെമൊസിനാരിയോ ദേവാലയത്തിൽ. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"johnchrysostom","md":"11-13","rites":["smk"],"en":{"n":"St John Chrysostom","t":"Archbishop of Constantinople, Doctor of the Church"},"ml":{"n":"വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","t":"കോൺസ്റ്റാന്റിനോപ്പിളിലെ ആർച്ച്ബിഷപ്പ്, വേദപാരംഗതൻ"},"ta":{"n":"புனித யோவான் கிறிசோஸ்தோம்","t":"கான்ஸ்டாண்டிநோபிள் பேராயர், மறைவல்லுநர்"},"hi":{"n":"संत योहन क्रिसोस्तोम","t":"कॉन्स्टेंटिनोपल के महाधर्माध्यक्ष, कलीसिया के आचार्य"},"img":{"src":"img/saints/johnchrysostom.jpg","cap":{"en":"Semyon Spiridonov Kholmogorets, St John Chrysostom with forty scenes from his life, icon, tempera on wood, 1670s–1680s, from the church of St Nicholas Mokry, Yaroslavl, Russia. Public domain, via Wikimedia Commons.","ml":"സെമ്യോൺ സ്പിരിദോനോവ് ഖോൾമൊഗൊറെറ്റ്സ് എഴുതിയ “വിശുദ്ധ ജോൺ ക്രിസോസ്തോം, ജീവിതത്തിലെ നാല്പതു രംഗങ്ങളോടൊപ്പം” (മരപ്പലകയിൽ ടെമ്പെറ, 1670–1680 കാലം). റഷ്യയിലെ യാരോസ്ലാവിലുള്ള വിശുദ്ധ നിക്കോളാസ് മൊക്രി ദേവാലയത്തിൽനിന്ന്. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"philipapostle","md":"11-14","rites":["smk"],"en":{"n":"Mar Philipose Shleeha (St Philip the Apostle)","t":"Apostle, who said: come and see"},"ml":{"n":"മാർ പീലിപ്പോസ് ശ്ലീഹാ","t":"വന്നു കാണുക എന്നു പറഞ്ഞ അപ്പസ്തോലൻ"},"ta":{"n":"மார் பிலிப்போஸ் திருத்தூதர் (புனித பிலிப்பு)","t":"வந்து பாருங்கள் என்ற திருத்தூதர்"},"hi":{"n":"मार फ़िलिपोस श्लीहा (संत फ़िलिप प्रेरित)","t":"आओ और देखो कहनेवाले प्रेरित"},"img":{"src":"img/saints/philipapostle.jpg","cap":{"en":"St Philip the Apostle, Byzantine icon, 10th century, St Catherine's Monastery, Mount Sinai, Egypt. Public domain, via Wikimedia Commons.","ml":"മാർ പീലിപ്പോസ് ശ്ലീഹാ: ഈജിപ്തിലെ സീനായ് മലയിലുള്ള വിശുദ്ധ കത്രീനയുടെ ആശ്രമത്തിലെ ബൈസന്റൈൻ ഐക്കൺ (പത്താം നൂറ്റാണ്ട്). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"matthewapostle","md":"11-16","rites":["smk"],"en":{"n":"Mar Mathai Shleeha (St Matthew the Apostle)","t":"Apostle and Evangelist"},"ml":{"n":"മാർ മത്തായി ശ്ലീഹാ","t":"അപ്പസ്തോലനും സുവിശേഷകനും"},"ta":{"n":"மார் மத்தாய் திருத்தூதர் (புனித மத்தேயு)","t":"திருத்தூதரும் நற்செய்தியாளரும்"},"hi":{"n":"मार मत्ताई श्लीहा (संत मत्ती प्रेरित)","t":"प्रेरित और सुसमाचार-लेखक"},"img":{"src":"img/saints/matthewapostle.jpg","cap":{"en":"Michael Astrapas and Eutychios, St Matthew the Apostle, Byzantine fresco, c. 1295–1317. Public domain, via Wikimedia Commons.","ml":"മിഖായേൽ അസ്ത്രാപാസും എവുതിക്കിയോസും വരച്ച “മാർ മത്തായി ശ്ലീഹാ” (ബൈസന്റൈൻ ചുവർചിത്രം, ഏകദേശം 1295–1317). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"clementfelicity","md":"11-23","rites":["smk"],"en":{"n":"St Clement, Pope, and St Felicity","t":"Martyrs of the Roman Church"},"ml":{"n":"വിശുദ്ധ ക്ലെമന്റ് മാർപാപ്പയും വിശുദ്ധ ഫെലിസിത്താസും","t":"റോമൻ സഭയിലെ രക്തസാക്ഷികൾ"},"ta":{"n":"புனித கிளமெண்ட் திருத்தந்தையும் புனித பெலிசித்தாவும்","t":"உரோமைத் திருஅவையின் மறைசாட்சிகள்"},"hi":{"n":"संत पोप क्लेमेंट और संत फ़ेलिसिटी","t":"रोमी कलीसिया के शहीद"},"img":{"src":"img/saints/clementfelicity.jpg","cap":{"en":"St Clement celebrating Mass, fresco, c. 1100, lower church of the Basilica of San Clemente, Rome. Public domain, via Wikimedia Commons.","ml":"വിശുദ്ധ ക്ലെമന്റ് ദിവ്യബലി അർപ്പിക്കുന്നു: റോമിലെ സാൻ ക്ലെമന്തെ ബസിലിക്കയുടെ അടിയിലുള്ള പഴയ ദേവാലയത്തിലെ ചുവർചിത്രം (ഏകദേശം 1100). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"ambrose","md":"12-07","en":{"n":"St Ambrose","t":"Bishop of Milan, Doctor of the Church"},"ml":{"n":"വിശുദ്ധ അംബ്രോസ്","t":"മിലാനിലെ മെത്രാൻ, സഭയുടെ വേദപാരംഗതൻ"},"ta":{"n":"புனித அம்புரோஸ்","t":"மிலான் ஆயர், திருச்சபையின் மறைவல்லுநர்"},"hi":{"n":"संत अम्ब्रोस","t":"मिलान के धर्माध्यक्ष, कलीसिया के धर्माचार्य"},"de":{"n":"Hl. Ambrosius","t":"Bischof von Mailand, Kirchenlehrer"},"it":{"n":"Sant'Ambrogio","t":"Vescovo di Milano, dottore della Chiesa"},"es":{"n":"San Ambrosio","t":"Obispo de Milán, doctor de la Iglesia"},"pt":{"n":"Santo Ambrósio","t":"Bispo de Milão, Doutor da Igreja"},"te":{"n":"పునీత అంబ్రోస్","t":"మిలాను పీఠాధిపతి, శ్రీసభ వేదపారంగతుడు"},"kn":{"n":"ಸಂತ ಅಂಬ್ರೋಸ್","t":"ಮಿಲಾನಿನ ಧರ್ಮಾಧ್ಯಕ್ಷರು, ಧರ್ಮಸಭೆಯ ಧರ್ಮಪಂಡಿತರು"},"fr":{"n":"Saint Ambroise","t":"Évêque de Milan, docteur de l'Église"},"tl":{"n":"San Ambrosio","t":"Obispo ng Milan, Pantas ng Simbahan"},"sw":{"n":"Mt. Ambrosi","t":"Askofu wa Milano, Mwalimu wa Kanisa"},"img":{"src":"img/saints/ambrose.jpg","cap":{"en":"St Ambrose, mosaic, 5th century, chapel of San Vittore in Ciel d'Oro, Basilica of Sant'Ambrogio, Milan, Italy. Made within a few decades of his death, it may preserve his true likeness. Public domain, via Wikimedia Commons.","ml":"വിശുദ്ധ അംബ്രോസ്: ഇറ്റലിയിലെ മിലാനിൽ സാന്ത് അംബ്രോജോ ബസിലിക്കയുടെ സാൻ വിത്തോറെ ഇൻ ചിയേൽ ദോറോ ചാപ്പലിലുള്ള മൊസൈക് ചിത്രം (അഞ്ചാം നൂറ്റാണ്ട്). അദ്ദേഹത്തിന്റെ മരണത്തിനു ഏതാനും ദശകങ്ങൾക്കകം നിർമ്മിച്ചതിനാൽ യഥാർത്ഥ മുഖച്ഛായ ഇതിൽ ഉണ്ടാകാം. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"juandiego","md":"12-09","rites":["lat"],"en":{"n":"St Juan Diego Cuauhtlatoatzin","t":"Indigenous layman of Mexico, messenger of Our Lady of Guadalupe"},"ml":{"n":"വിശുദ്ധ യുവാൻ ദിയേഗോ","t":"മെക്സിക്കോയിലെ തദ്ദേശീയനായ അൽമായൻ, ഗ്വാദലൂപ്പെ മാതാവിന്റെ സന്ദേശവാഹകൻ"},"ta":{"n":"புனித ஹுவான் தியேகோ குவாவுத்லதோவாட்சின்","t":"மெக்சிகோவின் பூர்வகுடிப் பொதுநிலையினர், குவாதலூப்பே அன்னையின் தூதர்"},"hi":{"n":"संत हुआन दिएगो कुआउत्लातोआत्सिन","t":"मेक्सिको के आदिवासी लोकधर्मी, ग्वादालूपे की माता के संदेशवाहक"},"de":{"n":"Hl. Juan Diego Cuauhtlatoatzin","t":"Indigener Laie aus Mexiko, Bote Unserer Lieben Frau von Guadalupe"},"it":{"n":"San Juan Diego Cuauhtlatoatzin","t":"Laico indigeno del Messico, messaggero della Madonna di Guadalupe"},"es":{"n":"San Juan Diego Cuauhtlatoatzin","t":"Laico indígena de México, mensajero de Nuestra Señora de Guadalupe"},"pt":{"n":"São João Diego Cuauhtlatoatzin","t":"Leigo indígena do México, mensageiro de Nossa Senhora de Guadalupe"},"te":{"n":"పునీత హువాన్ దియేగో కువాట్లాటోఆట్సిన్","t":"మెక్సికో స్థానిక జాతికి చెందిన గృహస్థ విశ్వాసి, గ్వాదలూపే మరియమాత సందేశకుడు"},"kn":{"n":"ಸಂತ ಹುವಾನ್ ದಿಯೇಗೊ ಕುವಾಟ್ಲಾಟೊವಾಟ್ಸಿನ್","t":"ಮೆಕ್ಸಿಕೊದ ಮೂಲನಿವಾಸಿ ಶ್ರೀಸಾಮಾನ್ಯ ವಿಶ್ವಾಸಿ, ಗ್ವಾದಲುಪೆಯ ಮಾತೆಯ ಸಂದೇಶವಾಹಕ"},"fr":{"n":"Saint Juan Diego Cuauhtlatoatzin","t":"Laïc indigène du Mexique, messager de Notre-Dame de Guadalupe"},"tl":{"n":"San Juan Diego Cuauhtlatoatzin","t":"Katutubong layko ng Mehiko, sugo ng Mahal na Birhen ng Guadalupe"},"sw":{"n":"Mt. Juan Diego Cuauhtlatoatzin","t":"Mlei mzawa wa Meksiko, mjumbe wa Bikira Maria wa Guadalupe"},"img":{"src":"img/saints/juandiego.jpg","cap":{"en":"Miguel Cabrera, True Portrait of the Venerable Juan Diego, oil on canvas, 1752, Mexico. Public domain, via Wikimedia Commons.","ml":"മിഗ്വേൽ കബ്രേര വരച്ച “ഹുവാൻ ദിയേഗോയുടെ യഥാർത്ഥ ഛായാചിത്രം” (എണ്ണച്ചായാചിത്രം, 1752, മെക്സിക്കോ). പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"guadalupe","md":"12-12","rites":["lat"],"en":{"n":"Our Lady of Guadalupe","t":"Patroness of the Americas"},"ml":{"n":"ഗ്വാദലൂപ്പെ മാതാവ്","t":"അമേരിക്കകളുടെ മധ്യസ്ഥ"},"ta":{"n":"குவாதலூப்பே அன்னை","t":"அமெரிக்கக் கண்டங்களின் பாதுகாவலி"},"hi":{"n":"ग्वादालूपे की माता मरियम","t":"अमेरिका महाद्वीपों की संरक्षिका"},"de":{"n":"Unsere Liebe Frau von Guadalupe","t":"Patronin Amerikas"},"it":{"n":"Nostra Signora di Guadalupe","t":"Patrona delle Americhe"},"es":{"n":"Nuestra Señora de Guadalupe","t":"Patrona de América"},"pt":{"n":"Nossa Senhora de Guadalupe","t":"Padroeira das Américas"},"te":{"n":"గ్వాదలూపే మరియమాత","t":"అమెరికా ఖండాల పాలకురాలు"},"kn":{"n":"ಗ್ವಾದಲುಪೆಯ ಮಾತೆ","t":"ಅಮೆರಿಕ ಖಂಡಗಳ ಪಾಲಕಿ"},"fr":{"n":"Notre-Dame de Guadalupe","t":"Patronne des Amériques"},"tl":{"n":"Mahal na Birhen ng Guadalupe","t":"Patrona ng Amerika"},"sw":{"n":"Bikira Maria wa Guadalupe","t":"Msimamizi wa Amerika"},"img":{"src":"img/saints/guadalupe.jpg","cap":{"en":"Our Lady of Guadalupe: the image on the tilma of St Juan Diego (1531), venerated in the Basilica of Our Lady of Guadalupe, Mexico City. Public domain, via Wikimedia Commons.","ml":"ഗ്വാദലൂപ്പെ മാതാവ്: വിശുദ്ധ ഹുവാൻ ദിയേഗോയുടെ മേലങ്കിയിൽ (തിൽമ) പതിഞ്ഞ ചിത്രം (1531); മെക്സിക്കോ സിറ്റിയിലെ ഗ്വാദലൂപ്പെ മാതാവിന്റെ ബസിലിക്കയിൽ വണങ്ങപ്പെടുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"lucy","md":"12-13","en":{"n":"St Lucy","t":"Virgin and martyr of Syracuse"},"ml":{"n":"വിശുദ്ധ ലൂസി","t":"സിറാക്കൂസിലെ കന്യകയും രക്തസാക്ഷിയും"},"ta":{"n":"புனித லூசியா","t":"சிரக்கூசா நகரின் கன்னியும் மறைசாட்சியும்"},"hi":{"n":"संत लूसिया","t":"सिराकूसा की कुँवारी और शहीद"},"de":{"n":"Hl. Lucia","t":"Jungfrau und Märtyrin von Syrakus"},"it":{"n":"Santa Lucia","t":"Vergine e martire di Siracusa"},"es":{"n":"Santa Lucía","t":"Virgen y mártir de Siracusa"},"pt":{"n":"Santa Luzia","t":"Virgem e mártir de Siracusa"},"te":{"n":"పునీత లూసియా","t":"సిరక్యూస్‌కు చెందిన కన్య, హతసాక్షి"},"kn":{"n":"ಸಂತ ಲೂಸಿಯ","t":"ಸಿರಾಕ್ಯೂಸಿನ ಕನ್ಯೆ ಮತ್ತು ಹುತಾತ್ಮೆ"},"fr":{"n":"Sainte Lucie","t":"Vierge et martyre de Syracuse"},"tl":{"n":"Santa Lucia","t":"Birhen at martir ng Siracusa"},"sw":{"n":"Mt. Lusia","t":"Bikira na mfiadini wa Sirakusa"},"img":{"src":"img/saints/lucy.jpg","cap":{"en":"Francesco del Cossa, St Lucy, tempera on panel, c. 1473–1474, from the Griffoni Polyptych, National Gallery of Art, Washington. She holds a stem bearing her eyes. Public domain (CC0), via Wikimedia Commons.","ml":"ഫ്രാൻചെസ്കോ ദെൽ കോസ്സ വരച്ച “വിശുദ്ധ ലൂസി” (മരപ്പലകയിൽ ടെമ്പെറ, ഏകദേശം 1473–1474). ഗ്രിഫോണി ബഹുഫലകചിത്രത്തിന്റെ ഭാഗം; വാഷിംഗ്ടണിലെ നാഷണൽ ഗാലറി ഓഫ് ആർട്ടിൽ. തന്റെ കണ്ണുകൾ വഹിക്കുന്ന തണ്ട് അവൾ കൈയിലേന്തിയിരിക്കുന്നു. പകർപ്പവകാശമുക്തമായ ചിത്രം, വിക്കിമീഡിയ കോമൺസിൽനിന്ന്."}}},{"id":"johncross","md":"12-14","en":{"n":"St John of the Cross","t":"Carmelite priest, mystic, Doctor of the Church"},"ml":{"n":"കുരിശിന്റെ വിശുദ്ധ യോഹന്നാൻ","t":"കർമലീത്താ വൈദികൻ, മിസ്റ്റിക്, സഭയുടെ വേദപാരംഗതൻ"},"ta":{"n":"சிலுவையின் புனித யோவான்","t":"கார்மேல் சபைக் குரு, மறைஞானி, திருச்சபையின் மறைவல்லுநர்"},"hi":{"n":"क्रूस के संत योहन","t":"कार्मेल धर्मसंघी पुरोहित, रहस्यदर्शी, कलीसिया के धर्माचार्य"},"de":{"n":"Hl. Johannes vom Kreuz","t":"Karmelitischer Priester, Mystiker, Kirchenlehrer"},"it":{"n":"San Giovanni della Croce","t":"Sacerdote carmelitano, mistico, dottore della
