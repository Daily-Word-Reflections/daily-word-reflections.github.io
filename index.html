  illus:["An illustration","A Kerala teacher in a government school never preached, but her honesty, patience and care for poor students made colleagues ask: “Why are you like this?” She answered simply: “Because of Jesus.” That is lay apostolate."],kids:"",diaspora:"",
  family:{read:"Read together: Matthew 28:16–20.",explain:"Before going back to the Father, Jesus told his friends: “Go and tell everyone about me. I am with you always.” He says this to us too!",intention:"We pray for missionaries and for courage to tell others about Jesus.",ask:"Ask: “How can our family show Jesus' love to our neighbours?”"},
  catechism:[["CCC 849–856","The missionary mandate."],["CCC 897–913","The vocation of the lay faithful."]],
  kidsaint:["St Francis Xavier","A Jesuit missionary who came to India and travelled along the coasts, baptising thousands and teaching children their prayers. He went as far as Japan. Lesson: Jesus sends each of us to share his love."],
  term:["Laity Day","In the 2025–26 lectionary the Fourth Sunday after Qyomtho is Syro-Malankara Catholic Laity Day, when the Church prays for the lay faithful and supports their works."],
  termMore:["The Great Commission","Christ's last command in Matthew (28:18–20): go, make disciples, baptise, teach. It is the charter of the Church's mission."]},
 {homily:["Dear brothers and sisters, the disciples are gathered, frightened and confused, when the risen Jesus stands among them: “Peace be with you. Why are you frightened? Look at my hands and my feet; it is I myself.” He even eats a piece of fish in front of them. The Resurrection is not a ghost story; the Lord is truly alive, body and soul.","Then he opens their minds to understand the Scriptures, and gives them a task: repentance and forgiveness of sins must be proclaimed in his name to all nations. “You are witnesses of these things.” In Matthew he says it on a mountain: “Go therefore and make disciples of all nations… And remember, I am with you always.”","This command is not only for priests and sisters. St Paul says every Christian is “an ambassador for Christ”. Today our Church honours the laity, because most of the world will never hear a sermon from a priest; they will only see Christ in you: in your honesty at work, your patience at home, your kindness to the poor, your courage to say “I am a Christian.”","Job was restored when he prayed for his friends. Solomon received wisdom when he asked. Let us ask the risen Lord for wisdom and courage, and go out from this Qurbono as his witnesses. He has promised: “I am with you always, to the end of the age.” Amen."],
  kids:["Children, before Jesus went back to heaven, he gave his friends a big job: “Go and tell everyone about me!”","And he made a promise: “I will be with you always.” Jesus is with us every day, at school, at home, everywhere.","You can tell others about Jesus by being kind and honest. Let's say: “Jesus, I will be your helper!”"]});

put("2027-04-25","ml",{title:"ക്യംതോയ്ക്കുശേഷമുള്ള നാലാം ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"മത്തായി 28:16–20","പോയി എല്ലാ ജനതകളെയും ശിഷ്യപ്പെടുത്തുവിൻ"],[ML.ot,"പുറപ്പാട് 34:10–17","ദൈവം ഉടമ്പടി നവീകരിക്കുന്നു"],[ML.ot,"ജോബ് 42:7–17","കർത്താവു ജോബിനെ പുനഃസ്ഥാപിക്കുന്നു"],[ML.ot,"1 രാജാക്കന്മാർ 3:4–15","സോളമൻ ജ്ഞാനം ചോദിക്കുന്നു"],[ML.ot,"ഏശയ്യാ 49:8–13","പ്രസാദകാലത്തു ഞാൻ നിനക്ക് ഉത്തരമരുളി"],[ML.ac,"അപ്പ. പ്രവ. 10:34–43","ദൈവത്തിനു പക്ഷപാതമില്ല"],[ML.pa,"2 കോറിന്തോസ് 5:17–21","പുതിയ സൃഷ്ടി; ക്രിസ്തുവിന്റെ സ്ഥാനപതികൾ"],[ML.go,"ലൂക്കാ 24:36–49","നിങ്ങൾ ഇവയ്ക്കു സാക്ഷികളാണ്"]],
 alt:"ക്യംതോക്കാലം. 2025–26-ലെ വായനാപുസ്തകത്തിൽ ഈ ഞായർ സീറോ മലങ്കര കത്തോലിക്കാ അൽമായദിനമായിരുന്നു. ഇന്നു സുവിശേഷകനായ വിശുദ്ധ മർക്കോസിന്റെ തിരുനാളുമാണ്.",
 verse:"യുഗാന്തംവരെ എന്നും ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.",cite:"മത്തായി 28:20",
 theo:["ഉത്ഥിതനായ കർത്താവു ഭയന്ന ശിഷ്യന്മാരുടെ മധ്യേ നിൽക്കുന്നു: “നിങ്ങൾക്കു സമാധാനം!… നിങ്ങൾ അസ്വസ്ഥരാകുന്നതെന്തിന്? നിങ്ങളുടെ മനസ്സിൽ ചോദ്യങ്ങൾ ഉയരുന്നതും എന്തിന്? എന്റെ കൈകളും കാലുകളും കണ്ട് ഇതു ഞാൻ തന്നെയാണെന്നു മനസ്സിലാക്കുവിൻ.” അവരുടെ മുമ്പിൽ അവിടുന്നു ഭക്ഷിക്കുന്നു. പിന്നെ “വിശുദ്ധലിഖിതങ്ങൾ ഗ്രഹിക്കാൻ തക്കവിധം അവരുടെ മനസ്സ് അവൻ തുറന്നു”: മിശിഹാ സഹിക്കുകയും ഉയിർക്കുകയും വേണമായിരുന്നു; “പാപമോചനത്തിനുള്ള അനുതാപം അവന്റെ നാമത്തിൽ ജറുസലെമിൽ ആരംഭിച്ച് എല്ലാ ജനതകളോടും പ്രഘോഷിക്കപ്പെടേണ്ടിയിരിക്കുന്നു. നിങ്ങൾ ഇവയ്ക്കു സാക്ഷികളാണ്.”","സന്ധ്യാസുവിശേഷത്തിൽ ഗലീലിയിലെ ഒരു മലമുകളിൽ ഉത്ഥിതനായ ക്രിസ്തു മഹാനിയോഗം നൽകുന്നു: “സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള എല്ലാ അധികാരവും എനിക്കു നൽകപ്പെട്ടിരിക്കുന്നു. ആകയാൽ, നിങ്ങൾ പോയി എല്ലാ ജനതകളെയും ശിഷ്യപ്പെടുത്തുവിൻ. പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തിൽ അവർക്കു ജ്ഞാനസ്നാനം നൽകുവിൻ. ഞാൻ നിങ്ങളോടു കൽപിച്ചവയെല്ലാം അനുസരിക്കാൻ അവരെ പഠിപ്പിക്കുവിൻ. യുഗാന്തംവരെ എന്നും ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.” സുവിശേഷവത്കരിക്കാനാണു സഭ നിലനിൽക്കുന്നത്.","“സത്യമായും ദൈവത്തിനു പക്ഷപാതമില്ല” എന്നു കൊർണേലിയൂസിന്റെ ഭവനത്തിൽവച്ചു പത്രോസ് കണ്ടെത്തുന്നു: സുവിശേഷം എല്ലാ ജനതകൾക്കുംവേണ്ടിയാണ്. ഓരോ ക്രൈസ്തവനെയും വിശുദ്ധ പൗലോസ് സ്ഥാനപതി എന്നു വിളിക്കുന്നു: ആരെങ്കിലും ക്രിസ്തുവിലാണെങ്കിൽ അവൻ പുതിയ സൃഷ്ടിയാണ്… ദൈവം ഞങ്ങളിലൂടെ ആഹ്വാനം ചെയ്യുന്നതിനാൽ ഞങ്ങൾ ക്രിസ്തുവിന്റെ സ്ഥാനപതികളാണ് (2 കോറി 5:17, 20). അതുകൊണ്ടാണ് ഇന്നു സഭ അൽമായരെ ആദരിക്കുന്നത്: ദൗത്യം വൈദികർക്കും സന്യസ്തർക്കും മാത്രമല്ല, കുടുംബത്തിലും ജോലിസ്ഥലത്തും സമൂഹത്തിലും മാമ്മോദീസ സ്വീകരിച്ച ഓരോരുത്തർക്കുമുള്ളതാണ്.","സുഹൃത്തുക്കൾക്കുവേണ്ടി പ്രാർഥിച്ചപ്പോൾ ജോബിന്റെ ഐശ്വര്യം പുനഃസ്ഥാപിക്കപ്പെട്ടു; ചോദിച്ചപ്പോൾ സോളമനു ജ്ഞാനം ലഭിച്ചു. അവിടുന്ന് എപ്പോഴും നമ്മോടുകൂടെയുണ്ടെന്ന് അറിഞ്ഞുകൊണ്ട്, അവിടുത്തെ സാക്ഷികളാകാനുള്ള ജ്ഞാനവും ധൈര്യവും ഉത്ഥിതനായ കർത്താവിനോടു നമുക്കു ചോദിക്കാം."],
 conn:[["എല്ലാ ജനതകൾക്കും.","“എന്റെ രക്ഷ ലോകാതിർത്തിവരെ എത്തുന്നതിന് ഞാൻ നിന്നെ ലോകത്തിന്റെ പ്രകാശമായി നൽകും” (ഏശ 49:6) എന്നത് ഉത്ഥിതനായ ക്രിസ്തു തന്റെ ശിഷ്യന്മാരെ എല്ലാ ജനതകളിലേക്കും അയയ്ക്കുമ്പോൾ നിറവേറുന്നു (ലൂക്കാ 24:47; മത്താ 28:19)."],["സ്പർശിച്ചു കാണുക.","ഉത്ഥിതശരീരം യഥാർഥമാണ്: കൈകൾ, കാലുകൾ, മീൻ ഭക്ഷിക്കൽ (ലൂക്കാ 24:39–43). ഉയിർപ്പ് ഒരു ദർശനമല്ല."],["പുതിയ സൃഷ്ടി.","2 കോറി 5:17: ഉയിർപ്പുപ്രഭാതത്തിൽ ആരംഭിച്ച പുതിയ സൃഷ്ടി ക്രിസ്തുവിൽ ഓരോ വിശ്വാസിയിലേക്കും എത്തുന്നു."],["സുഹൃത്തുക്കൾക്കുവേണ്ടിയുള്ള പ്രാർഥന.","ജോബ് 42:10: തന്നോടു തെറ്റുചെയ്ത സുഹൃത്തുക്കൾക്കുവേണ്ടി പ്രാർഥിച്ചപ്പോൾ ജോബ് പുനഃസ്ഥാപിക്കപ്പെടുന്നു."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയുടെയും അവസാനം വൈദികൻ നമ്മെ ആശീർവദിച്ച് അയയ്ക്കുന്നു. ആ പറഞ്ഞയയ്ക്കൽ മഹാനിയോഗമാണ്: “ഞാൻ എന്നും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും” എന്ന വാഗ്ദാനത്തോടെ സാക്ഷികളായി നാം ബലിപീഠം വിടുന്നു."],
 outline:[["ആരംഭം","ഭയന്ന ഹൃദയങ്ങൾക്കു സമാധാനം."],["ഒന്നാം ആശയം · യഥാർഥമായ ഉയിർപ്പ്","സ്പർശിച്ചു കാണുക; അവിടുന്ന് അവരോടൊപ്പം ഭക്ഷിക്കുന്നു."],["രണ്ടാം ആശയം · തുറക്കപ്പെട്ട മനസ്സുകൾ","വിശുദ്ധലിഖിതങ്ങളുടെ താക്കോൽ ക്രിസ്തുവാണ്."],["മൂന്നാം ആശയം · പോയി ശിഷ്യപ്പെടുത്തുവിൻ","മഹാനിയോഗം മാമ്മോദീസ സ്വീകരിച്ച എല്ലാവരുടേതുമാണ്: അൽമായദിനം."],["നാലാം ആശയം · ഞാൻ എന്നും നിങ്ങളോടുകൂടെ","സാക്ഷ്യത്തിനുള്ള ധൈര്യം."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“നിങ്ങൾ ഇവയ്ക്കു സാക്ഷികളാണ്.”"]],
 live:[["സ്ഥാനപതിയാകുക (2 കോറി 5:20)","ഈ ആഴ്ച ഒരു സഹപ്രവർത്തകനോടോ അയൽക്കാരനോടോ വിശ്വാസത്തിന്റെയോ പ്രത്യാശയുടെയോ ഒരു വാക്കു പറയുക."],["ഇടവകയിൽ ശുശ്രൂഷ ചെയ്യുക","ഒരു ഇടവകശുശ്രൂഷയ്ക്കോ അൽമായസംഘടനയ്ക്കോ നിന്റെ സമയം നൽകുക."],["മിഷനറിമാർക്കുവേണ്ടി പ്രാർഥിക്കുക","ഉത്തരേന്ത്യയിലും വിദേശത്തും പ്രവർത്തിക്കുന്ന കേരളത്തിൽനിന്നുള്ള വൈദികർക്കും സിസ്റ്റർമാർക്കും അൽമായ മിഷനറിമാർക്കുംവേണ്ടി പ്രാർഥിക്കുക."]],
 fathers:[["മഹാനായ വിശുദ്ധ ലെയോ","ആണികളുടെയും കുന്തത്തിന്റെയും അടയാളങ്ങൾ അവിശ്വസിക്കുന്ന ഹൃദയങ്ങളുടെ മുറിവുകളെ സുഖപ്പെടുത്താനാണു ക്രിസ്തു തന്റെ മുറിവുകൾ അവർക്കു കാണിച്ചത് (സ്വർഗാരോഹണത്തെപ്പറ്റിയുള്ള പ്രസംഗം 73, 2)."],["വിശുദ്ധ ജോൺ ക്രിസോസ്തോം","“ഞാൻ നിങ്ങളോടുകൂടെ മാത്രം” എന്നല്ല, “നിങ്ങൾക്കുശേഷം വിശ്വസിക്കുന്ന എല്ലാവരോടുംകൂടെ” എന്നാണ് അവിടുന്നു പറഞ്ഞത്; എല്ലാ വിശ്വാസികളോടും ഒരു ശരീരത്തോടെന്നപോലെ അവിടുന്നു സംസാരിച്ചു (മത്തായിയെപ്പറ്റിയുള്ള പ്രസംഗങ്ങൾ 90)."]],
 magis:[["അൽമായപ്രേഷിതത്വം (അപ്പോസ്തോലിക്കം അക്തുവോസിത്താത്തെം) 2–3","ക്രൈസ്തവവിളി സ്വഭാവത്താൽത്തന്നെ പ്രേഷിതത്വത്തിലേക്കുള്ള വിളിയാണ്; ക്രിസ്തുവിന്റെ പൗരോഹിത്യ-പ്രവാചക-രാജകീയ ദൗത്യത്തിൽ അൽമായർ പങ്കുചേരുന്നു."],["അൽമായ ക്രൈസ്തവവിശ്വാസികൾ (ക്രിസ്തിഫിദേലെസ് ലായിച്ചി) 15","കുടുംബത്തിലും ജോലിയിലും സമൂഹത്തിലും ഉള്ളിൽനിന്നു ലോകത്തെ വിശുദ്ധീകരിക്കാൻ അൽമായവിശ്വാസികൾ വിളിക്കപ്പെട്ടിരിക്കുന്നു."],["മതബോധനഗ്രന്ഥം 849–856","പ്രേഷിതനിയോഗം: സഭ എല്ലാ ജനതകളിലേക്കും അയയ്ക്കപ്പെട്ടിരിക്കുന്നു."]],
 saints:[["ഈ ആഴ്ച (സ്ഥിരം തീയതികൾ)","ഏപ്രിൽ 25: സുവിശേഷകനായ വിശുദ്ധ മർക്കോസ്. ഏപ്രിൽ 29: സിയന്നായിലെ വിശുദ്ധ കത്രീന. മേയ് 1: തൊഴിലാളിയായ വിശുദ്ധ യൗസേപ്പ്. മേയ് 2: അലക്സാണ്ട്രിയായിലെ വിശുദ്ധ അത്തനാസിയൂസ്."]],
 prayer:"ഉത്ഥിതനായ കർത്താവായ യേശുവേ, അങ്ങു ശിഷ്യന്മാരുടെ മനസ്സുകൾ തുറന്ന് അവരെ എല്ലാ ജനതകളിലേക്കും അയച്ചു. വിശുദ്ധലിഖിതങ്ങളിലേക്കു ഞങ്ങളുടെ മനസ്സുകൾ തുറക്കണമേ; ഞങ്ങളുടെ കുടുംബങ്ങളിലും ജോലിസ്ഥലങ്ങളിലും ഞങ്ങളെ അങ്ങയുടെ സ്ഥാനപതികളാക്കണമേ; “ഞാൻ എന്നും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും” എന്ന അങ്ങയുടെ വാഗ്ദാനത്തിൽ ഞങ്ങളെ വിശ്വസ്തരായി കാക്കണമേ. ആമേൻ."},
 {quick:["ഉത്ഥിതനായ കർത്താവു യഥാർഥമാണ്: “എന്റെ കൈകളും കാലുകളും കാണുവിൻ.”","“പോയി എല്ലാ ജനതകളെയും ശിഷ്യപ്പെടുത്തുവിൻ”: മാമ്മോദീസ സ്വീകരിച്ച ഓരോരുത്തരും അയയ്ക്കപ്പെടുന്നു.","“യുഗാന്തംവരെ എന്നും ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.”"],action:"ഈ ആഴ്ച ഒരു സഹപ്രവർത്തകനോടോ അയൽക്കാരനോടോ വിശ്വാസത്തിന്റെയോ പ്രത്യാശയുടെയോ ഒരു വാക്കു പറയുക.",question:"ഈ ആഴ്ച കർത്താവ് എന്നെ തന്റെ സാക്ഷിയായി എവിടേക്കാണ് അയയ്ക്കുന്നത്?",
  special:"ക്യംതോയ്ക്കുശേഷമുള്ള നാലാം ഞായർ. വിശുദ്ധ മർക്കോസിന്റെ തിരുനാൾ. (2025–26-ൽ അൽമായദിനവുമായിരുന്നു; സ്തോത്രക്കാഴ്ച പരിശോധിക്കുക.)",
  illus:["ഒരു ഉദാഹരണം","ഒരു സർക്കാർ സ്കൂളിലെ ഒരു കേരളീയ അധ്യാപിക ഒരിക്കലും പ്രസംഗിച്ചില്ല; പക്ഷേ അവളുടെ സത്യസന്ധതയും ക്ഷമയും ദരിദ്രവിദ്യാർഥികളോടുള്ള കരുതലും കണ്ട് സഹപ്രവർത്തകർ ചോദിച്ചു: “എന്താണു നീ ഇങ്ങനെ?” അവൾ ലളിതമായി ഉത്തരം നൽകി: “ഈശോ കാരണം.” ഇതാണ് അൽമായപ്രേഷിതത്വം."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: മത്തായി 28:16–20.",explain:"പിതാവിന്റെ അടുത്തേക്കു മടങ്ങിപ്പോകുംമുമ്പ് യേശു കൂട്ടുകാരോടു പറഞ്ഞു: “പോയി എല്ലാവരോടും എന്നെപ്പറ്റി പറയുക. ഞാൻ എന്നും നിങ്ങളോടുകൂടെയുണ്ട്.” അവിടുന്നു നമ്മോടും ഇതു പറയുന്നു!",intention:"മിഷനറിമാർക്കുവേണ്ടിയും യേശുവിനെപ്പറ്റി മറ്റുള്ളവരോടു പറയാനുള്ള ധൈര്യത്തിനുവേണ്ടിയും നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “നമ്മുടെ അയൽക്കാർക്ക് യേശുവിന്റെ സ്നേഹം നമ്മുടെ കുടുംബത്തിന് എങ്ങനെ കാണിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 849–856","പ്രേഷിതനിയോഗം."],["മതബോധനഗ്രന്ഥം 897–913","അൽമായവിശ്വാസികളുടെ ദൈവവിളി."]],
  kidsaint:["വിശുദ്ധ ഫ്രാൻസിസ് സേവ്യർ","ഭാരതത്തിലേക്കു വന്നു തീരപ്രദേശങ്ങളിലൂടെ സഞ്ചരിച്ച്, ആയിരക്കണക്കിനു പേർക്കു മാമ്മോദീസ നൽകി, കുഞ്ഞുങ്ങളെ പ്രാർഥനകൾ പഠിപ്പിച്ച ഈശോസഭാ മിഷനറി. അദ്ദേഹം ജപ്പാൻവരെ പോയി. പാഠം: തന്റെ സ്നേഹം പങ്കുവയ്ക്കാൻ യേശു നമ്മളോരോരുത്തരെയും അയയ്ക്കുന്നു."],
  term:["അൽമായദിനം","2025–26-ലെ വായനാപുസ്തകത്തിൽ ക്യംതോയ്ക്കുശേഷമുള്ള നാലാം ഞായർ സീറോ മലങ്കര കത്തോലിക്കാ അൽമായദിനമാണ്; അന്നു സഭ അൽമായവിശ്വാസികൾക്കുവേണ്ടി പ്രാർഥിക്കുകയും അവരുടെ പ്രവർത്തനങ്ങളെ പിന്തുണയ്ക്കുകയും ചെയ്യുന്നു."],
  termMore:["മഹാനിയോഗം","മത്തായിയിലെ ക്രിസ്തുവിന്റെ അവസാനകല്പന (28:18–20): പോകുവിൻ, ശിഷ്യപ്പെടുത്തുവിൻ, മാമ്മോദീസ നൽകുവിൻ, പഠിപ്പിക്കുവിൻ. സഭയുടെ ദൗത്യത്തിന്റെ അടിസ്ഥാനരേഖയാണിത്."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഭയന്നും ആശയക്കുഴപ്പത്തിലുമായി ശിഷ്യന്മാർ ഒരുമിച്ചുകൂടിയിരിക്കുമ്പോൾ ഉത്ഥിതനായ യേശു അവരുടെ മധ്യേ നിൽക്കുന്നു: “നിങ്ങൾക്കു സമാധാനം! നിങ്ങൾ അസ്വസ്ഥരാകുന്നതെന്തിന്? എന്റെ കൈകളും കാലുകളും കണ്ട് ഇതു ഞാൻ തന്നെയാണെന്നു മനസ്സിലാക്കുവിൻ.” അവരുടെ മുമ്പിൽ അവിടുന്ന് ഒരു കഷണം മീൻപോലും ഭക്ഷിക്കുന്നു. ഉയിർപ്പ് ഒരു പ്രേതകഥയല്ല; കർത്താവു ശരീരത്തിലും ആത്മാവിലും യഥാർഥത്തിൽ ജീവിക്കുന്നു.","പിന്നെ വിശുദ്ധലിഖിതങ്ങൾ ഗ്രഹിക്കാൻ അവരുടെ മനസ്സു തുറന്ന് അവർക്ക് ഒരു ദൗത്യം നൽകുന്നു: അവിടുത്തെ നാമത്തിൽ പാപമോചനത്തിനുള്ള അനുതാപം എല്ലാ ജനതകളോടും പ്രഘോഷിക്കപ്പെടണം. “നിങ്ങൾ ഇവയ്ക്കു സാക്ഷികളാണ്.” മത്തായിയിൽ ഒരു മലമുകളിൽവച്ച് അവിടുന്ന് അതു പറയുന്നു: “നിങ്ങൾ പോയി എല്ലാ ജനതകളെയും ശിഷ്യപ്പെടുത്തുവിൻ… യുഗാന്തംവരെ എന്നും ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.”","ഈ കല്പന വൈദികർക്കും സിസ്റ്റർമാർക്കും മാത്രമുള്ളതല്ല. ഓരോ ക്രൈസ്തവനും “ക്രിസ്തുവിന്റെ സ്ഥാനപതി”യാണെന്നു വിശുദ്ധ പൗലോസ് പറയുന്നു. ഇന്നു നമ്മുടെ സഭ അൽമായരെ ആദരിക്കുന്നു; കാരണം ലോകത്തിൽ ഭൂരിഭാഗവും ഒരിക്കലും ഒരു വൈദികന്റെ പ്രസംഗം കേൾക്കുകയില്ല; നിന്നിൽ മാത്രമേ അവർ ക്രിസ്തുവിനെ കാണൂ: ജോലിസ്ഥലത്തെ നിന്റെ സത്യസന്ധതയിൽ, വീട്ടിലെ നിന്റെ ക്ഷമയിൽ, ദരിദ്രരോടുള്ള നിന്റെ ദയയിൽ, “ഞാൻ ഒരു ക്രിസ്ത്യാനിയാണ്” എന്നു പറയാനുള്ള നിന്റെ ധൈര്യത്തിൽ.","സുഹൃത്തുക്കൾക്കുവേണ്ടി പ്രാർഥിച്ചപ്പോൾ ജോബ് പുനഃസ്ഥാപിക്കപ്പെട്ടു. ചോദിച്ചപ്പോൾ സോളമനു ജ്ഞാനം ലഭിച്ചു. ഉത്ഥിതനായ കർത്താവിനോടു ജ്ഞാനവും ധൈര്യവും നമുക്കു ചോദിക്കാം; ഈ കുർബാനയിൽനിന്ന് അവിടുത്തെ സാക്ഷികളായി നമുക്കു പുറപ്പെടാം. അവിടുന്നു വാഗ്ദാനം ചെയ്തിരിക്കുന്നു: “യുഗാന്തംവരെ എന്നും ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.” ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, സ്വർഗത്തിലേക്കു തിരിച്ചുപോകുംമുമ്പ് യേശു തന്റെ കൂട്ടുകാർക്ക് ഒരു വലിയ ജോലി നൽകി: “പോയി എല്ലാവരോടും എന്നെപ്പറ്റി പറയുക!”","അവിടുന്ന് ഒരു വാഗ്ദാനവും നൽകി: “ഞാൻ എന്നും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.” സ്കൂളിലും വീട്ടിലും എല്ലായിടത്തും എല്ലാ ദിവസവും യേശു നമ്മോടൊപ്പമുണ്ട്.","ദയയുള്ളവനും സത്യസന്ധനുമായിരുന്നുകൊണ്ടു നിനക്കു മറ്റുള്ളവരോട് യേശുവിനെപ്പറ്റി പറയാം. നമുക്കു പറയാം: “യേശുവേ, ഞാൻ അങ്ങയുടെ സഹായിയാകും!”"]});

/* ================= V SUNDAY AFTER QYOMTHO · 2 May 2027 ================= */
put("2027-05-02","en",{title:"Fifth Sunday after Qyomtho",readTitle:EN.rt,
 readings:[[EN.eg,"John 16:12–15","The Spirit of truth will guide you"],[EN.ot,"Deuteronomy 16:10–12","Rejoice before the Lord at the feast of weeks"],[EN.ot,"2 Samuel 5:9–12","David becomes great, for the Lord was with him"],[EN.ot,"Proverbs 10:1–13","Love covers all offences"],[EN.ot,"Isaiah 28:23–29","Wonderful in counsel"],[EN.ac,"Acts 13:44–52","Filled with joy and the Holy Spirit"],[EN.pa,"Colossians 3:1–11","Seek the things that are above"],[EN.go,"John 16:16–24","Your pain will turn into joy"]],
 alt:"Season of Qyomtho. The Ascension of our Lord (Suloko) is on Thursday 6 May: remind the faithful.",
 verse:"So you have pain now; but I will see you again, and your hearts will rejoice, and no one will take your joy from you.",cite:"John 16:22",
 theo:["At the Last Supper Jesus prepares his disciples for his going. “A little while, and you will no longer see me, and again a little while, and you will see me.” They will weep while the world rejoices, “but your pain will turn into joy.” He compares it to a woman in labour: her pain is forgotten in the joy of a child born into the world. The Resurrection is that birth; Christian joy is born through the Cross.","“So you have pain now; but I will see you again, and your hearts will rejoice, and no one will take your joy from you.” This is the joy of Qyomtho: not a mood that changes with circumstances, but a gift no one can take away, because it rests on the risen Christ. Acts shows the first disciples, even when expelled from a city, “filled with joy and with the Holy Spirit”.","Jesus promises the Spirit: “When the Spirit of truth comes, he will guide you into all the truth.” As the Ascension and Pentecost approach, the Church is taught to live not by sight but by the Spirit, who leads her into the fullness of truth. And Jesus teaches us to pray with confidence: “Ask and you will receive, so that your joy may be complete.”","St Paul gives the practical consequence: “If you have been raised with Christ, seek the things that are above… Set your minds on things that are above.” Then he lists what must be put to death and what put on. Proverbs adds: “Hatred stirs up strife, but love covers all offences.” Easter joy shows itself in a changed life."],
 conn:[["The feast of weeks.","Deuteronomy 16:10–12: Israel rejoiced fifty days after Passover; Christians count fifty days from Easter to Pentecost."],["Labour pains and new birth.","Isaiah 26:17–19 and 66:7–14 speak of birth pangs leading to new life; Jesus applies the image to his Passion and Resurrection."],["Joy that cannot be taken.","Acts 13:52: persecution cannot remove the joy of the Spirit."],["Things above.","Colossians 3:1: the risen life orients us towards Christ seated at the right hand of God."]],
 altar:["“I will see you again, and your hearts will rejoice.” Every Holy Qurbono is this seeing again: the risen Lord comes, and our sorrow is turned into joy."],
 outline:[["Opening","What steals our joy?"],["Point 1 · Pain turned into joy","The woman in labour: joy through the Cross."],["Point 2 · Joy no one can take","Easter joy rests on Christ, not circumstances."],["Point 3 · The Spirit of truth","Preparing for the Ascension and Pentecost."],["Point 4 · Seek the things above","A changed life is the sign of Easter joy."],["Take-home line","“No one will take your joy from you.”"]],
 live:[["Count your joys","Each evening this week, thank God for three joys of the day."],["Ask in his name (John 16:24)","Bring one need to the Father with confidence in Jesus' name."],["Come for the Ascension","Attend the Holy Qurbono of the Ascension on Thursday."]],
 fathers:[["St Augustine","That little while seems long to us while it lasts; when it is over we shall know how little it was. Our joy is now in hope, then it will be in reality (Tractates on John 101)."],["St Cyril of Alexandria","The pain of the disciples was turned into joy when they saw the Lord risen; so too for us the sufferings of this world will be followed by the joy that no one can take away (Commentary on John 11)."]],
 magis:[["Evangelii Gaudium 1, 6","The joy of the Gospel fills the hearts of those who encounter Jesus; there are Christians whose lives seem like Lent without Easter."],["Catechism 1829, 1832","Joy is a fruit of charity and of the Holy Spirit."],["Catechism 243, 729","Christ promises the Spirit of truth who will guide the Church into all truth."]],
 saints:[["This week","Thursday 6 May: Suloko, the Ascension of our Lord; Holy Qurbono for the people. The ten days of prayer for the coming of the Spirit begin."]],
 prayer:"Lord Jesus, you promised that our pain would turn into joy and that no one would take it from us. Send us your Spirit of truth, teach us to ask in your name, and set our hearts on the things that are above, where you are seated at the right hand of the Father. Amen."},
 {quick:["“Your pain will turn into joy”: Easter joy is born through the Cross.","No one can take away the joy that rests on the risen Christ.","The Spirit of truth will guide us into all truth."],action:"Each evening this week thank God for three joys of the day.",question:"What steals my joy, and how can Christ give it back?",
  special:"Fifth Sunday after Qyomtho. Announce Suloko (Ascension) on Thursday 6 May.",
  illus:["An illustration","In a Kerala hospital a young mother, exhausted after a long labour, holds her newborn and smiles: “I've forgotten all the pain.” Jesus used exactly this picture for the joy of Easter."],kids:"",diaspora:"",
  family:{read:"Read together: John 16:20–22.",explain:"Jesus told his friends they would be sad when he died, but their sadness would turn into joy when they saw him again. And nobody can take that joy away!",intention:"We pray for people who are sad, that they may find joy in Jesus.",ask:"Ask: “What made each of us happy this week? Let's thank God.”"},
  catechism:[["CCC 1832","The fruits of the Spirit."],["CCC 729","The Spirit of truth."]],
  kidsaint:["St Athanasius (2 May)","A bishop of Alexandria who bravely taught that Jesus is truly God, even when he was sent away from his city five times. Lesson: stay true to Jesus even when it is hard."],
  term:["The fifty days","From Qyomtho to Pentecost the Church keeps fifty days of Easter joy, like Israel's fifty days from Passover to the feast of weeks (Deuteronomy 16:9–12)."],
  termMore:["The Spirit of truth","Jesus' name for the Holy Spirit in John (14:17; 16:13): the Spirit who leads the Church into the fullness of truth."]},
 {homily:["Dear brothers and sisters, at the Last Supper Jesus told his friends: “A little while, and you will no longer see me; and again a little while, and you will see me.” They did not understand. He explained with a picture every mother knows: a woman in labour has pain, but when the child is born she forgets the pain for joy.","That is Easter. The Cross was the labour pain; the Resurrection is the birth of new life. And Jesus promised: “I will see you again, and your hearts will rejoice, and no one will take your joy from you.” Christian joy is not the absence of trouble. It is a joy that rests on the risen Christ, and so no one can take it away.","In Acts the disciples are thrown out of a city, and yet they are “filled with joy and with the Holy Spirit.” Jesus also promises the Spirit of truth to guide us, and invites us to ask in his name, “so that your joy may be complete”. On Thursday we celebrate his Ascension; then we wait for the Spirit.","St Paul tells us how this joy shows: “Seek the things that are above.” Put off anger, lies and impurity; put on compassion and love. As Proverbs says, “love covers all offences.” Let us live this week as people whose joy no one can take away. Amen."],
  kids:["Children, Jesus told his friends: “You will be sad for a little while, but then you will be very happy!”","They were sad when Jesus died, but so happy when they saw him alive again! Jesus said nobody can take that joy away.","When you feel sad, remember Jesus is alive and loves you. Let's say: “Jesus, you are my joy!”"]});

put("2027-05-02","ml",{title:"ക്യംതോയ്ക്കുശേഷമുള്ള അഞ്ചാം ഞായർ",readTitle:ML.rt,
 readings:[[ML.eg,"യോഹന്നാൻ 16:12–15","സത്യാത്മാവു നിങ്ങളെ നയിക്കും"],[ML.ot,"നിയമാവർത്തനം 16:10–12","വാരങ്ങളുടെ തിരുനാളിൽ കർത്താവിന്റെ മുമ്പിൽ സന്തോഷിക്കുവിൻ"],[ML.ot,"2 സാമുവൽ 5:9–12","കർത്താവ് അവനോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ ദാവീദ് വലിയവനായി"],[ML.ot,"സുഭാഷിതങ്ങൾ 10:1–13","സ്നേഹം എല്ലാ അപരാധങ്ങളും പൊറുക്കുന്നു"],[ML.ot,"ഏശയ്യാ 28:23–29","വിസ്മയനീയമായ ഉപദേശം"],[ML.ac,"അപ്പ. പ്രവ. 13:44–52","ആനന്ദത്താലും പരിശുദ്ധാത്മാവിനാലും നിറഞ്ഞവർ"],[ML.pa,"കൊളോസോസ് 3:1–11","ഉന്നതത്തിലുള്ളവ അന്വേഷിക്കുവിൻ"],[ML.go,"യോഹന്നാൻ 16:16–24","നിങ്ങളുടെ ദുഃഖം സന്തോഷമായി മാറും"]],
 alt:"ക്യംതോക്കാലം. നമ്മുടെ കർത്താവിന്റെ സ്വർഗാരോഹണം (സുലൂക്കോ) മേയ് 6 വ്യാഴാഴ്ച: വിശ്വാസികളെ ഓർമിപ്പിക്കുക.",
 verse:"അതുപോലെ ഇപ്പോൾ നിങ്ങളും ദുഃഖിതരാണ്. എന്നാൽ ഞാൻ വീണ്ടും നിങ്ങളെ കാണും. അപ്പോൾ നിങ്ങളുടെ ഹൃദയം സന്തോഷിക്കും. നിങ്ങളുടെ ആ സന്തോഷം ആരും നിങ്ങളിൽനിന്ന് എടുത്തു കളയുകയുമില്ല.",cite:"യോഹന്നാൻ 16:22",
 theo:["അന്ത്യത്താഴവേളയിൽ യേശു തന്റെ പോക്കിനായി ശിഷ്യന്മാരെ ഒരുക്കുന്നു. “അൽപസമയംകൂടി കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണുകയില്ല; വീണ്ടും അൽപസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും.” ലോകം സന്തോഷിക്കുമ്പോൾ അവർ കരയും; “എന്നാൽ, നിങ്ങളുടെ ദുഃഖം സന്തോഷമായി മാറും.” പ്രസവവേദന അനുഭവിക്കുന്ന ഒരു സ്ത്രീയോട് അവിടുന്ന് അതിനെ ഉപമിക്കുന്നു: ലോകത്തിലേക്ക് ഒരു കുഞ്ഞു ജനിക്കുന്നതിന്റെ സന്തോഷത്തിൽ അവൾ വേദന മറക്കുന്നു. ഉയിർപ്പാണ് ആ ജനനം; ക്രൈസ്തവസന്തോഷം കുരിശിലൂടെയാണു ജനിക്കുന്നത്.","“അതുപോലെ ഇപ്പോൾ നിങ്ങളും ദുഃഖിതരാണ്. എന്നാൽ ഞാൻ വീണ്ടും നിങ്ങളെ കാണും. അപ്പോൾ നിങ്ങളുടെ ഹൃദയം സന്തോഷിക്കും. നിങ്ങളുടെ ആ സന്തോഷം ആരും നിങ്ങളിൽനിന്ന് എടുത്തു കളയുകയുമില്ല.” ഇതാണു ക്യംതോയുടെ സന്തോഷം: സാഹചര്യങ്ങൾക്കനുസരിച്ചു മാറുന്ന ഒരു മാനസികാവസ്ഥയല്ല; ഉത്ഥിതനായ ക്രിസ്തുവിൽ അടിസ്ഥാനമിട്ടതിനാൽ ആർക്കും എടുത്തുകളയാനാകാത്ത ഒരു ദാനം. ഒരു നഗരത്തിൽനിന്നു പുറത്താക്കപ്പെട്ടപ്പോഴും “ശിഷ്യന്മാർ ആനന്ദത്താലും പരിശുദ്ധാത്മാവിനാലും നിറഞ്ഞവരായി” എന്ന് അപ്പസ്തോലപ്രവർത്തനങ്ങൾ കാണിക്കുന്നു.","യേശു ആത്മാവിനെ വാഗ്ദാനം ചെയ്യുന്നു: “സത്യാത്മാവു വരുമ്പോൾ നിങ്ങളെ സത്യത്തിന്റെ പൂർണതയിലേക്കു നയിക്കും.” സ്വർഗാരോഹണവും പന്തക്കുസ്തായും അടുക്കുമ്പോൾ, കാഴ്ചയാലല്ല, സത്യത്തിന്റെ പൂർണതയിലേക്കു നയിക്കുന്ന ആത്മാവിനാൽ ജീവിക്കാൻ സഭ പഠിപ്പിക്കപ്പെടുന്നു. ആത്മവിശ്വാസത്തോടെ പ്രാർഥിക്കാനും യേശു നമ്മെ പഠിപ്പിക്കുന്നു: “ചോദിക്കുവിൻ, നിങ്ങൾക്കു ലഭിക്കും; അതുമൂലം നിങ്ങളുടെ സന്തോഷം പൂർണമാവുകയും ചെയ്യും.”","പ്രായോഗികമായ ഫലം വിശുദ്ധ പൗലോസ് പറയുന്നു: നിങ്ങൾ ക്രിസ്തുവിനോടൊപ്പം ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നുവെങ്കിൽ ഉന്നതത്തിലുള്ളവ അന്വേഷിക്കുവിൻ… ഉന്നതത്തിലുള്ളവയിൽ മനസ്സുറപ്പിക്കുവിൻ (കൊളോ 3:1–2). പിന്നെ നശിപ്പിക്കേണ്ടവയും ധരിക്കേണ്ടവയും അദ്ദേഹം എണ്ണിപ്പറയുന്നു. സുഭാഷിതങ്ങൾ കൂട്ടിച്ചേർക്കുന്നു: “വിദ്വേഷം കലഹം ഇളക്കിവിടുന്നു; സ്നേഹമോ എല്ലാ അപരാധങ്ങളും പൊറുക്കുന്നു.” ഉയിർപ്പിന്റെ സന്തോഷം മാറിയ ഒരു ജീവിതത്തിൽ പ്രകടമാകുന്നു."],
 conn:[["വാരങ്ങളുടെ തിരുനാൾ.","നിയമാവർത്തനം 16:10–12: പെസഹായ്ക്ക് അമ്പതു ദിവസത്തിനുശേഷം ഇസ്രായേൽ സന്തോഷിച്ചു; ഉയിർപ്പുമുതൽ പന്തക്കുസ്താവരെ ക്രൈസ്തവർ അമ്പതു ദിവസം എണ്ണുന്നു."],["പ്രസവവേദനയും പുതുജനനവും.","പുതുജീവനിലേക്കു നയിക്കുന്ന പ്രസവവേദനയെപ്പറ്റി ഏശയ്യാ 26:17–19-ഉം 66:7–14-ഉം പറയുന്നു; യേശു ആ ചിത്രം തന്റെ പീഡാനുഭവത്തിനും ഉയിർപ്പിനും ബാധകമാക്കുന്നു."],["എടുത്തുകളയാനാകാത്ത സന്തോഷം.","അപ്പ 13:52: പീഡനത്തിന് ആത്മാവിന്റെ സന്തോഷം നീക്കാനാവില്ല."],["ഉന്നതത്തിലുള്ളവ.","കൊളോസോസ് 3:1: ഉയിർപ്പിക്കപ്പെട്ട ജീവിതം ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഉപവിഷ്ടനായിരിക്കുന്ന ക്രിസ്തുവിലേക്കു നമ്മെ തിരിക്കുന്നു."]],
 altar:["“ഞാൻ വീണ്ടും നിങ്ങളെ കാണും. അപ്പോൾ നിങ്ങളുടെ ഹൃദയം സന്തോഷിക്കും.” ഓരോ വിശുദ്ധ കുർബാനയും ഈ വീണ്ടും കാണലാണ്: ഉത്ഥിതനായ കർത്താവു വരുന്നു; നമ്മുടെ ദുഃഖം സന്തോഷമായി മാറുന്നു."],
 outline:[["ആരംഭം","എന്താണു നമ്മുടെ സന്തോഷം കവർന്നെടുക്കുന്നത്?"],["ഒന്നാം ആശയം · സന്തോഷമായി മാറുന്ന ദുഃഖം","പ്രസവവേദനയനുഭവിക്കുന്ന സ്ത്രീ: കുരിശിലൂടെയുള്ള സന്തോഷം."],["രണ്ടാം ആശയം · ആർക്കും എടുക്കാനാവാത്ത സന്തോഷം","ഉയിർപ്പിന്റെ സന്തോഷം സാഹചര്യങ്ങളിലല്ല, ക്രിസ്തുവിലാണ് അടിസ്ഥാനമിട്ടിരിക്കുന്നത്."],["മൂന്നാം ആശയം · സത്യാത്മാവ്","സ്വർഗാരോഹണത്തിനും പന്തക്കുസ്തായ്ക്കുമുള്ള ഒരുക്കം."],["നാലാം ആശയം · ഉന്നതത്തിലുള്ളവ അന്വേഷിക്കുക","മാറിയ ജീവിതമാണ് ഉയിർപ്പിന്റെ സന്തോഷത്തിന്റെ അടയാളം."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“നിങ്ങളുടെ ആ സന്തോഷം ആരും നിങ്ങളിൽനിന്ന് എടുത്തു കളയുകയില്ല.”"]],
 live:[["സന്തോഷങ്ങൾ എണ്ണുക","ഈ ആഴ്ച എല്ലാ സന്ധ്യയിലും ആ ദിവസത്തെ മൂന്നു സന്തോഷങ്ങൾക്കായി ദൈവത്തിനു നന്ദി പറയുക."],["അവിടുത്തെ നാമത്തിൽ ചോദിക്കുക (യോഹ 16:24)","യേശുവിന്റെ നാമത്തിൽ ആത്മവിശ്വാസത്തോടെ ഒരു ആവശ്യം പിതാവിന്റെ അടുത്തു കൊണ്ടുവരുക."],["സ്വർഗാരോഹണത്തിനു വരുക","വ്യാഴാഴ്ചത്തെ സ്വർഗാരോഹണത്തിന്റെ വിശുദ്ധ കുർബാനയിൽ പങ്കെടുക്കുക."]],
 fathers:[["വിശുദ്ധ അഗസ്റ്റിൻ","ആ അൽപസമയം നീണ്ടുനിൽക്കുമ്പോൾ നമുക്കു ദീർഘമായി തോന്നും; അതു കഴിയുമ്പോൾ അത് എത്ര ചെറുതായിരുന്നുവെന്നു നാം അറിയും. നമ്മുടെ സന്തോഷം ഇപ്പോൾ പ്രത്യാശയിലാണ്; അന്നു യാഥാർഥ്യത്തിലായിരിക്കും (യോഹന്നാനെപ്പറ്റിയുള്ള പ്രബന്ധങ്ങൾ 101)."],["അലക്സാണ്ട്രിയായിലെ വിശുദ്ധ സിറിൽ","ഉത്ഥിതനായ കർത്താവിനെ കണ്ടപ്പോൾ ശിഷ്യന്മാരുടെ ദുഃഖം സന്തോഷമായി മാറി; അതുപോലെ നമുക്കും ഈ ലോകത്തിലെ സഹനങ്ങൾക്കുശേഷം ആർക്കും എടുത്തുകളയാനാകാത്ത സന്തോഷം വരും (യോഹന്നാൻ സുവിശേഷവ്യാഖ്യാനം 11)."]],
 magis:[["സുവിശേഷത്തിന്റെ ആനന്ദം (എവാഞ്ചേലി ഗൗദിയും) 1, 6","യേശുവിനെ കണ്ടുമുട്ടുന്നവരുടെ ഹൃദയങ്ങളെ സുവിശേഷത്തിന്റെ ആനന്ദം നിറയ്ക്കുന്നു; ഉയിർപ്പില്ലാത്ത നോമ്പുകാലംപോലെ ജീവിക്കുന്ന ക്രൈസ്തവരുണ്ട്."],["മതബോധനഗ്രന്ഥം 1829, 1832","സന്തോഷം ഉപവിയുടെയും പരിശുദ്ധാത്മാവിന്റെയും ഫലമാണ്."],["മതബോധനഗ്രന്ഥം 243, 729","സഭയെ സത്യത്തിന്റെ പൂർണതയിലേക്കു നയിക്കുന്ന സത്യാത്മാവിനെ ക്രിസ്തു വാഗ്ദാനം ചെയ്യുന്നു."]],
 saints:[["ഈ ആഴ്ച","മേയ് 6 വ്യാഴം: സുലൂക്കോ, നമ്മുടെ കർത്താവിന്റെ സ്വർഗാരോഹണം; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. ആത്മാവിന്റെ ആഗമനത്തിനായുള്ള പത്തു ദിവസത്തെ പ്രാർഥന ആരംഭിക്കുന്നു."]],
 prayer:"കർത്താവായ യേശുവേ, ഞങ്ങളുടെ ദുഃഖം സന്തോഷമായി മാറുമെന്നും അത് ആരും ഞങ്ങളിൽനിന്ന് എടുത്തുകളയുകയില്ലെന്നും അങ്ങു വാഗ്ദാനം ചെയ്തു. അങ്ങയുടെ സത്യാത്മാവിനെ ഞങ്ങളിലേക്ക് അയയ്ക്കണമേ; അങ്ങയുടെ നാമത്തിൽ ചോദിക്കാൻ ഞങ്ങളെ പഠിപ്പിക്കണമേ; പിതാവിന്റെ വലത്തുഭാഗത്ത് അങ്ങ് ഉപവിഷ്ടനായിരിക്കുന്ന ഉന്നതത്തിലുള്ളവയിൽ ഞങ്ങളുടെ ഹൃദയങ്ങൾ ഉറപ്പിക്കണമേ. ആമേൻ."},
 {quick:["“നിങ്ങളുടെ ദുഃഖം സന്തോഷമായി മാറും”: ഉയിർപ്പിന്റെ സന്തോഷം കുരിശിലൂടെ ജനിക്കുന്നു.","ഉത്ഥിതനായ ക്രിസ്തുവിൽ അടിസ്ഥാനമിട്ട സന്തോഷം ആർക്കും എടുത്തുകളയാനാവില്ല.","സത്യാത്മാവു നമ്മെ സത്യത്തിന്റെ പൂർണതയിലേക്കു നയിക്കും."],action:"ഈ ആഴ്ച എല്ലാ സന്ധ്യയിലും ആ ദിവസത്തെ മൂന്നു സന്തോഷങ്ങൾക്കായി ദൈവത്തിനു നന്ദി പറയുക.",question:"എന്താണ് എന്റെ സന്തോഷം കവരുന്നത്? ക്രിസ്തുവിന് അത് എങ്ങനെ തിരികെ നൽകാനാകും?",
  special:"ക്യംതോയ്ക്കുശേഷമുള്ള അഞ്ചാം ഞായർ. മേയ് 6 വ്യാഴാഴ്ചത്തെ സുലൂക്കോ (സ്വർഗാരോഹണം) അറിയിക്കുക.",
  illus:["ഒരു ഉദാഹരണം","കേരളത്തിലെ ഒരു ആശുപത്രിയിൽ, നീണ്ട പ്രസവവേദനയ്ക്കുശേഷം തളർന്ന ഒരു യുവ അമ്മ തന്റെ നവജാതശിശുവിനെ കൈയിലെടുത്തു പുഞ്ചിരിക്കുന്നു: “എല്ലാ വേദനയും ഞാൻ മറന്നു.” ഉയിർപ്പിന്റെ സന്തോഷത്തിനായി യേശു ഉപയോഗിച്ചതു കൃത്യമായും ഈ ചിത്രമാണ്."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: യോഹന്നാൻ 16:20–22.",explain:"താൻ മരിക്കുമ്പോൾ കൂട്ടുകാർ ദുഃഖിതരാകുമെന്നും, തന്നെ വീണ്ടും കാണുമ്പോൾ അവരുടെ ദുഃഖം സന്തോഷമായി മാറുമെന്നും യേശു പറഞ്ഞു. ആ സന്തോഷം ആർക്കും എടുത്തുകളയാനാവില്ല!",intention:"ദുഃഖിതർ യേശുവിൽ സന്തോഷം കണ്ടെത്താൻ നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ ആഴ്ച നമ്മളോരോരുത്തരെയും സന്തോഷിപ്പിച്ചത് എന്താണ്? ദൈവത്തിനു നന്ദി പറയാം.”"},
  catechism:[["മതബോധനഗ്രന്ഥം 1832","ആത്മാവിന്റെ ഫലങ്ങൾ."],["മതബോധനഗ്രന്ഥം 729","സത്യാത്മാവ്."]],
  kidsaint:["വിശുദ്ധ അത്തനാസിയൂസ് (മേയ് 2)","അഞ്ചു പ്രാവശ്യം തന്റെ നഗരത്തിൽനിന്നു പുറത്താക്കപ്പെട്ടിട്ടും, യേശു യഥാർഥ ദൈവമാണെന്നു ധൈര്യപൂർവം പഠിപ്പിച്ച അലക്സാണ്ട്രിയായിലെ മെത്രാൻ. പാഠം: പ്രയാസമുള്ളപ്പോഴും യേശുവിനോടു വിശ്വസ്തനായിരിക്കുക."],
  term:["അമ്പതു ദിവസങ്ങൾ","പെസഹാമുതൽ വാരങ്ങളുടെ തിരുനാൾവരെയുള്ള ഇസ്രായേലിന്റെ അമ്പതു ദിവസങ്ങൾപോലെ (നിയ 16:9–12), ക്യംതോമുതൽ പന്തക്കുസ്താവരെ സഭ ഉയിർപ്പിന്റെ സന്തോഷത്തിന്റെ അമ്പതു ദിവസങ്ങൾ ആചരിക്കുന്നു."],
  termMore:["സത്യാത്മാവ്","യോഹന്നാനിൽ (14:17; 16:13) പരിശുദ്ധാത്മാവിന് യേശു നൽകുന്ന പേര്: സഭയെ സത്യത്തിന്റെ പൂർണതയിലേക്കു നയിക്കുന്ന ആത്മാവ്."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, അന്ത്യത്താഴവേളയിൽ യേശു തന്റെ കൂട്ടുകാരോടു പറഞ്ഞു: “അൽപസമയംകൂടി കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണുകയില്ല; വീണ്ടും അൽപസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും.” അവർക്കു മനസ്സിലായില്ല. ഓരോ അമ്മയ്ക്കും അറിയാവുന്ന ഒരു ചിത്രംകൊണ്ട് അവിടുന്നു വിശദീകരിച്ചു: പ്രസവിക്കുന്ന സ്ത്രീക്കു വേദനയുണ്ട്; പക്ഷേ കുഞ്ഞു ജനിക്കുമ്പോൾ സന്തോഷത്താൽ അവൾ വേദന മറക്കുന്നു.","അതാണ് ഉയിർപ്പ്. കുരിശായിരുന്നു പ്രസവവേദന; ഉയിർപ്പു പുതുജീവന്റെ ജനനമാണ്. യേശു വാഗ്ദാനം ചെയ്തു: “ഞാൻ വീണ്ടും നിങ്ങളെ കാണും. അപ്പോൾ നിങ്ങളുടെ ഹൃദയം സന്തോഷിക്കും. നിങ്ങളുടെ ആ സന്തോഷം ആരും നിങ്ങളിൽനിന്ന് എടുത്തു കളയുകയുമില്ല.” ക്രൈസ്തവസന്തോഷം പ്രശ്നങ്ങളുടെ അഭാവമല്ല. ഉത്ഥിതനായ ക്രിസ്തുവിൽ അടിസ്ഥാനമിട്ട സന്തോഷമാണ്; അതുകൊണ്ട് ആർക്കും അത് എടുത്തുകളയാനാവില്ല.","അപ്പസ്തോലപ്രവർത്തനങ്ങളിൽ ശിഷ്യന്മാർ ഒരു നഗരത്തിൽനിന്നു പുറത്താക്കപ്പെടുന്നു; എന്നിട്ടും അവർ “ആനന്ദത്താലും പരിശുദ്ധാത്മാവിനാലും നിറഞ്ഞവരായി.” നമ്മെ നയിക്കാൻ സത്യാത്മാവിനെയും യേശു വാഗ്ദാനം ചെയ്യുന്നു; “നിങ്ങളുടെ സന്തോഷം പൂർണമാകാൻ” തന്റെ നാമത്തിൽ ചോദിക്കാൻ ക്ഷണിക്കുന്നു. വ്യാഴാഴ്ച നാം അവിടുത്തെ സ്വർഗാരോഹണം ആഘോഷിക്കുന്നു; പിന്നെ ആത്മാവിനായി കാത്തിരിക്കുന്നു.","ഈ സന്തോഷം എങ്ങനെ പ്രകടമാകുമെന്നു വിശുദ്ധ പൗലോസ് പറയുന്നു: “ഉന്നതത്തിലുള്ളവ അന്വേഷിക്കുവിൻ.” കോപവും നുണയും അശുദ്ധിയും ഉപേക്ഷിക്കുക; കരുണയും സ്നേഹവും ധരിക്കുക. സുഭാഷിതങ്ങൾ പറയുന്നതുപോലെ, “സ്നേഹമോ എല്ലാ അപരാധങ്ങളും പൊറുക്കുന്നു.” ആർക്കും എടുത്തുകളയാനാകാത്ത സന്തോഷമുള്ളവരായി ഈ ആഴ്ച നമുക്കു ജീവിക്കാം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, യേശു തന്റെ കൂട്ടുകാരോടു പറഞ്ഞു: “കുറച്ചുസമയം നിങ്ങൾ ദുഃഖിതരാകും; പക്ഷേ പിന്നെ നിങ്ങൾ വളരെ സന്തോഷിക്കും!”","യേശു മരിച്ചപ്പോൾ അവർ ദുഃഖിതരായി; പക്ഷേ അവിടുത്തെ വീണ്ടും ജീവനോടെ കണ്ടപ്പോൾ എത്ര സന്തോഷിച്ചു! ആ സന്തോഷം ആർക്കും എടുത്തുകളയാനാവില്ലെന്ന് യേശു പറഞ്ഞു.","നിനക്കു സങ്കടം തോന്നുമ്പോൾ യേശു ജീവിക്കുന്നുവെന്നും നിന്നെ സ്നേഹിക്കുന്നുവെന്നും ഓർക്കുക. നമുക്കു പറയാം: “യേശുവേ, അങ്ങാണ് എന്റെ സന്തോഷം!”"]});

/* ================= SULOKO · ASCENSION · 6 May 2027 ================= */
put("2027-05-06","en",{title:"Suloko · The Ascension of our Lord",readTitle:EN.rt,
 readings:[[EN.eg,"Mark 16:14–20","Go into all the world"],[EN.ot,"Deuteronomy 10:1–5","The tablets placed in the ark"],[EN.ot,"2 Kings 2:9–15","Elijah taken up; Elisha takes his mantle"],[EN.ot,"Jeremiah 31:31–34","I will write my law on their hearts"],[EN.ot,"Isaiah 49:1–7","A light to the nations"],[EN.ac,"Acts 1:6–11","He was lifted up, and a cloud took him"],[EN.pa,"Ephesians 4:7–16","He ascended and gave gifts"],[EN.go,"Luke 24:50–53","He blessed them and was carried up into heaven"]],
 alt:"Suloko, the Ascension of our Lord: Holy Qurbono for the people. Ten days of prayer for the coming of the Holy Spirit follow; according to the lectionary, marriages are not celebrated in these days.",
 verse:"While he was blessing them, he withdrew from them and was carried up into heaven.",cite:"Luke 24:51",
 theo:["Forty days after his Resurrection, Jesus leads his disciples out to Bethany, “and, lifting up his hands, he blessed them. While he was blessing them, he withdrew from them and was carried up into heaven.” The last earthly sight of Jesus is of hands raised in blessing. He goes, but he does not stop blessing his Church.","The Ascension is not Jesus leaving us; it is our humanity entering heaven. The Son of God, who took our flesh, now takes it to the right hand of the Father. St Mark says: “he was taken up into heaven and sat down at the right hand of God.” Where the Head has gone, the body hopes to follow. Our true home is with him.","The angels ask the disciples: “Men of Galilee, why do you stand looking up toward heaven? This Jesus… will come in the same way as you saw him go.” The Ascension is not a time for gazing at the sky but for mission: “Go into all the world and proclaim the good news to the whole creation… And they went out and proclaimed the good news everywhere, while the Lord worked with them.”","As Elijah was taken up and Elisha received his mantle and spirit, so Christ ascends and pours out his Spirit on his Church. Jeremiah's promise will be fulfilled at Pentecost: “I will put my law within them, and I will write it on their hearts.” Like the disciples, who “returned to Jerusalem with great joy and were continually in the temple blessing God”, we now enter ten days of prayer for the Spirit."],
 conn:[["Elijah's mantle.","2 Kings 2:13–15: Elisha takes the mantle of the ascended Elijah and receives his spirit: a figure of the Church receiving Christ's Spirit."],["The ark and the law.","Deuteronomy 10:1–5: the tablets placed in the ark; Jeremiah 31:33: the law written on hearts by the Spirit."],["Gifts from on high.","Ephesians 4:8–11: the ascended Christ gives apostles, prophets, evangelists, pastors and teachers to build up his body."],["A light to the nations.","Isaiah 49:6 and Acts 1:8: the mission goes to the ends of the earth."]],
 altar:["At every Holy Qurbono we are invited: “Lift up your hearts”, and we answer, “They are with the Lord.” The ascended Christ, seated at the Father's right hand, comes down to us on the altar, and lifts us up to him."],
 outline:[["Opening","Hands raised in blessing: the last sight of Jesus."],["Point 1 · Our humanity in heaven","Where the Head has gone, the body will follow."],["Point 2 · Why stand looking up?","Ascension leads to mission."],["Point 3 · Elijah's mantle","The Spirit given to the Church."],["Point 4 · Ten days of prayer","With Mary and the apostles, waiting for Pentecost."],["Take-home line","“Lift up your hearts.”"]],
 live:[["Keep the ten days","Pray each day until Pentecost: “Come, Holy Spirit.”"],["Go and tell (Mark 16:15)","Share the Good News with one person this week, in word or deed."],["Lift up your heart","At the Qurbono, really lift up your heart to the Lord at “Lift up your hearts”."]],
 fathers:[["St Leo the Great","“Christ's Ascension is our elevation; where the glory of the Head has gone before, there the hope of the body is called to follow” (Sermon 73 on the Ascension, 4)."],["St Augustine","“Today our Lord Jesus Christ ascended into heaven; let our hearts ascend with him… He did not leave heaven when he came down to us; nor did he withdraw from us when he went up again into heaven” (Sermon on the Ascension, Mai 98)."]],
 magis:[["Catechism 659–667","Christ's Ascension marks the definitive entrance of Jesus' humanity into God's heavenly domain; he precedes us so that we might live in hope of following."],["Catechism 1137–1139","The heavenly liturgy: the ascended Christ is the high priest of the true sanctuary."],["Catechism 2623","The disciples, with Mary, persevered in prayer awaiting the Spirit."]],
 saints:[["The coming days","Sunday 9 May: VI Sunday after Qyomtho. Sunday 16 May: Pentecost."]],
 prayer:"Lord Jesus Christ, ascended into heaven, you raised your hands to bless your disciples and took our humanity to the Father's right hand. Bless us from heaven, lift up our hearts to you, send us to proclaim your Gospel, and pour out your Spirit on your Church. Amen."},
 {quick:["Jesus ascends with hands raised in blessing.","Our humanity has entered heaven: where the Head is, the body hopes to follow.","Not gazing upwards, but going out: the Ascension leads to mission."],action:"Pray every day until Pentecost: “Come, Holy Spirit.”",question:"Is my heart lifted up to the Lord, or only looking at earthly things?",
  special:"Suloko, the Ascension of our Lord: day of obligation; Holy Qurbono for the people. Ten days of prayer until Pentecost (no marriage celebrations, as in the lectionary).",
  illus:["An illustration","When a Kerala father leaves for work abroad, the family gathers at the door and he raises his hand to bless the children before the car leaves. They remember that blessing for months. Jesus left his disciples with his hands raised in blessing, and he has never lowered them."],kids:"",diaspora:"",
  family:{read:"Read together: Luke 24:50–53.",explain:"Forty days after Easter, Jesus blessed his friends and went up to heaven. He is with God the Father, and he still blesses us. He promised to send the Holy Spirit.",intention:"We pray for families separated by work abroad, and for the coming of the Holy Spirit.",ask:"Ask: “How can we pray together for the Holy Spirit these ten days?”"},
  catechism:[["CCC 659–667","The Ascension."],["CCC 2623","Prayer awaiting the Spirit."]],
  kidsaint:["The prophet Elisha","When his teacher Elijah was taken up to heaven, Elisha picked up his cloak and received his spirit to carry on God's work. Lesson: when Jesus went to heaven, he gave us his Spirit to continue his work."],
  term:["Suloko (സുലൂക്കോ)","Syriac for “ascension”: the feast of the Ascension of our Lord, forty days after Qyomtho, always on a Thursday."],
  termMore:["The ten days","Between the Ascension and Pentecost the Church prays, like the apostles with Mary in the upper room (Acts 1:14), for the coming of the Holy Spirit."]},
 {homily:["Dear brothers and sisters, forty days after Easter Jesus leads his disciples out to Bethany. He lifts up his hands and blesses them, and while he is blessing them he is carried up into heaven. The last picture the disciples have of Jesus is of hands raised in blessing. He has never lowered them.","The Ascension does not mean that Jesus has gone far away. It means that our human nature, which he took from Mary, now sits at the right hand of the Father. Where he, our Head, has gone, we, his body, hope to follow. Heaven is our home.","But the angels say: “Men of Galilee, why do you stand looking up toward heaven?” The Ascension is not a time for gazing at the sky; it is a time for mission. Jesus said: “Go into all the world and proclaim the good news.” And they went out and preached everywhere, and the Lord worked with them.","Elijah was taken up, and Elisha received his mantle and his spirit. Jesus ascends, and he will send his Spirit upon us at Pentecost. Like the apostles with Mary, let us spend these ten days in prayer: Come, Holy Spirit. And at every Qurbono, when we hear “Lift up your hearts,” let us truly lift them up to him. Amen."],
  kids:["Children, today Jesus went up to heaven! He took his friends to a hill, raised his hands and blessed them, and then went up into the sky until a cloud hid him.","Jesus is now with God the Father, but he still blesses us and loves us. And he promised to send the Holy Spirit to help us.","For the next ten days, let's pray every day: “Come, Holy Spirit!”"]});

put("2027-05-06","ml",{title:"സുലൂക്കോ · നമ്മുടെ കർത്താവിന്റെ സ്വർഗാരോഹണം",readTitle:ML.rt,
 readings:[[ML.eg,"മർക്കോസ് 16:14–20","ലോകമെങ്ങും പോകുവിൻ"],[ML.ot,"നിയമാവർത്തനം 10:1–5","പലകകൾ പേടകത്തിൽ വയ്ക്കുന്നു"],[ML.ot,"2 രാജാക്കന്മാർ 2:9–15","ഏലിയാ എടുക്കപ്പെടുന്നു; എലീഷാ അവന്റെ മേലങ്കി എടുക്കുന്നു"],[ML.ot,"ജറെമിയാ 31:31–34","എന്റെ നിയമം ഞാൻ അവരുടെ ഹൃദയത്തിൽ എഴുതും"],[ML.ot,"ഏശയ്യാ 49:1–7","ജനതകൾക്കു പ്രകാശം"],[ML.ac,"അപ്പ. പ്രവ. 1:6–11","അവൻ ഉന്നതങ്ങളിലേക്കു സംവഹിക്കപ്പെട്ടു; ഒരു മേഘം അവനെ മറച്ചു"],[ML.pa,"എഫേസോസ് 4:7–16","അവിടുന്ന് ആരോഹണം ചെയ്തു ദാനങ്ങൾ നൽകി"],[ML.go,"ലൂക്കാ 24:50–53","അവരെ അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കേ അവിടുന്നു സ്വർഗത്തിലേക്കു സംവഹിക്കപ്പെട്ടു"]],
 alt:"സുലൂക്കോ, നമ്മുടെ കർത്താവിന്റെ സ്വർഗാരോഹണം: ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. പരിശുദ്ധാത്മാവിന്റെ ആഗമനത്തിനായുള്ള പത്തു ദിവസത്തെ പ്രാർഥന തുടരുന്നു; വായനാപുസ്തകമനുസരിച്ച് ഈ ദിവസങ്ങളിൽ വിവാഹങ്ങൾ നടത്താറില്ല.",
 verse:"അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കേ അവൻ അവരിൽനിന്നു മറയുകയും സ്വർഗത്തിലേക്കു സംവഹിക്കപ്പെടുകയും ചെയ്തു.",cite:"ലൂക്കാ 24:51",
 theo:["ഉയിർപ്പിനു നാൽപതു ദിവസത്തിനുശേഷം യേശു ശിഷ്യന്മാരെ ബഥാനിയാവരെ കൂട്ടിക്കൊണ്ടുപോയി; “കൈകൾ ഉയർത്തി അവരെ അനുഗ്രഹിച്ചു. അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കേ അവൻ അവരിൽനിന്നു മറയുകയും സ്വർഗത്തിലേക്കു സംവഹിക്കപ്പെടുകയും ചെയ്തു.” യേശുവിനെപ്പറ്റിയുള്ള അവസാനത്തെ ഭൗമികദൃശ്യം അനുഗ്രഹിക്കാൻ ഉയർത്തിയ കരങ്ങളാണ്. അവിടുന്നു പോകുന്നു; പക്ഷേ തന്റെ സഭയെ അനുഗ്രഹിക്കുന്നതു നിർത്തുന്നില്ല.","സ്വർഗാരോഹണം യേശു നമ്മെ വിട്ടുപോകലല്ല; നമ്മുടെ മനുഷ്യത്വം സ്വർഗത്തിൽ പ്രവേശിക്കലാണ്. നമ്മുടെ ശരീരം സ്വീകരിച്ച ദൈവപുത്രൻ ഇപ്പോൾ അതിനെ പിതാവിന്റെ വലത്തുഭാഗത്തേക്കു കൊണ്ടുപോകുന്നു. വിശുദ്ധ മർക്കോസ് പറയുന്നു: “സ്വർഗത്തിലേക്കു സംവഹിക്കപ്പെട്ടു. അവൻ ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഉപവിഷ്ടനായി.” ശിരസ്സു പോയിടത്തേക്കു പിന്തുടരാൻ ശരീരം പ്രത്യാശിക്കുന്നു. നമ്മുടെ യഥാർഥ ഭവനം അവിടുത്തോടൊപ്പമാണ്.","ദൂതന്മാർ ശിഷ്യന്മാരോടു ചോദിക്കുന്നു: “അല്ലയോ ഗലീലിയരേ, നിങ്ങൾ ആകാശത്തിലേക്കു നോക്കിനിൽക്കുന്നതെന്ത്? നിങ്ങളിൽനിന്നു സ്വർഗത്തിലേക്ക് സംവഹിക്കപ്പെട്ട യേശു, സ്വർഗത്തിലേക്കു പോകുന്നതായി നിങ്ങൾ കണ്ടതുപോലെതന്നെ തിരിച്ചുവരും.” സ്വർഗാരോഹണം ആകാശത്തിലേക്കു നോക്കിനിൽക്കാനുള്ള സമയമല്ല, ദൗത്യത്തിനുള്ളതാണ്: “നിങ്ങൾ ലോകമെങ്ങും പോയി, എല്ലാ സൃഷ്ടികളോടും സുവിശേഷം പ്രസംഗിക്കുവിൻ… അവർ എല്ലായിടത്തും പോയി പ്രസംഗിച്ചു. കർത്താവ് അവരോടുകൂടെ പ്രവർത്തിക്കുകയും… ചെയ്തിരുന്നു.”","ഏലിയാ എടുക്കപ്പെടുകയും എലീഷാ അവന്റെ മേലങ്കിയും ആത്മാവും സ്വീകരിക്കുകയും ചെയ്തതുപോലെ, ക്രിസ്തു ആരോഹണം ചെയ്തു തന്റെ ആത്മാവിനെ സഭയുടെമേൽ വർഷിക്കുന്നു. ജറെമിയായുടെ വാഗ്ദാനം പന്തക്കുസ്തായിൽ നിറവേറും: “ഞാൻ എന്റെ നിയമം അവരുടെ ഉള്ളിൽ നിക്ഷേപിക്കും; അവരുടെ ഹൃദയത്തിൽ എഴുതും.” “അത്യന്തം ആനന്ദത്തോടെ ജറുസലെമിലേക്കു മടങ്ങിയ” ശിഷ്യന്മാരെപ്പോലെ, ആത്മാവിനായുള്ള പത്തു ദിവസത്തെ പ്രാർഥനയിലേക്കു നാം പ്രവേശിക്കുന്നു."],
 conn:[["ഏലിയായുടെ മേലങ്കി.","2 രാജാ 2:13–15: ആരോഹണം ചെയ്ത ഏലിയായുടെ മേലങ്കി എടുത്ത് എലീഷാ അവന്റെ ആത്മാവു സ്വീകരിക്കുന്നു: ക്രിസ്തുവിന്റെ ആത്മാവിനെ സ്വീകരിക്കുന്ന സഭയുടെ പ്രതീകം."],["പേടകവും നിയമവും.","നിയ 10:1–5: പലകകൾ പേടകത്തിൽ വയ്ക്കുന്നു; ജറെ 31:33: ആത്മാവു ഹൃദയങ്ങളിൽ എഴുതുന്ന നിയമം."],["ഉന്നതത്തിൽനിന്നുള്ള ദാനങ്ങൾ.","എഫേ 4:8–11: തന്റെ ശരീരം പടുത്തുയർത്താൻ ആരോഹണം ചെയ്ത ക്രിസ്തു ശ്ലീഹന്മാരെയും പ്രവാചകന്മാരെയും സുവിശേഷകരെയും ഇടയന്മാരെയും അധ്യാപകരെയും നൽകുന്നു."],["ജനതകൾക്കു പ്രകാശം.","ഏശ 49:6-ഉം അപ്പ 1:8-ഉം: ദൗത്യം ഭൂമിയുടെ അതിർത്തികൾവരെ പോകുന്നു."]],
 altar:["ഓരോ വിശുദ്ധ കുർബാനയിലും നാം ക്ഷണിക്കപ്പെടുന്നു: “ഹൃദയങ്ങൾ ഉയർത്തുവിൻ”; നാം ഉത്തരം നൽകുന്നു: “കർത്താവിങ്കലേക്ക്.” പിതാവിന്റെ വലത്തുഭാഗത്ത് ഉപവിഷ്ടനായ, ആരോഹണം ചെയ്ത ക്രിസ്തു ബലിപീഠത്തിൽ നമ്മിലേക്ക് ഇറങ്ങിവരുന്നു; നമ്മെ തന്നിലേക്ക് ഉയർത്തുന്നു."],
 outline:[["ആരംഭം","അനുഗ്രഹിക്കാൻ ഉയർത്തിയ കരങ്ങൾ: യേശുവിന്റെ അവസാനദൃശ്യം."],["ഒന്നാം ആശയം · സ്വർഗത്തിൽ നമ്മുടെ മനുഷ്യത്വം","ശിരസ്സു പോയിടത്തേക്കു ശരീരം പിന്തുടരും."],["രണ്ടാം ആശയം · എന്തിനു മുകളിലേക്കു നോക്കിനിൽക്കുന്നു?","സ്വർഗാരോഹണം ദൗത്യത്തിലേക്കു നയിക്കുന്നു."],["മൂന്നാം ആശയം · ഏലിയായുടെ മേലങ്കി","സഭയ്ക്കു നൽകപ്പെടുന്ന ആത്മാവ്."],["നാലാം ആശയം · പത്തു ദിവസത്തെ പ്രാർഥന","പന്തക്കുസ്തായ്ക്കായി മറിയത്തോടും ശ്ലീഹന്മാരോടുമൊപ്പം കാത്തിരിക്കുക."],["വീട്ടിലേക്ക് ഒരു വാക്യം","“ഹൃദയങ്ങൾ ഉയർത്തുവിൻ.”"]],
 live:[["പത്തു ദിവസം ആചരിക്കുക","പന്തക്കുസ്താവരെ എല്ലാ ദിവസവും പ്രാർഥിക്കുക: “പരിശുദ്ധാത്മാവേ, എഴുന്നള്ളിവരണമേ.”"],["പോയി പറയുക (മർക്കോ 16:15)","ഈ ആഴ്ച വാക്കാലോ പ്രവൃത്തിയാലോ ഒരാളുമായി സുവിശേഷം പങ്കുവയ്ക്കുക."],["നിന്റെ ഹൃദയം ഉയർത്തുക","കുർബാനയിൽ “ഹൃദയങ്ങൾ ഉയർത്തുവിൻ” എന്നു കേൾക്കുമ്പോൾ യഥാർഥത്തിൽ നിന്റെ ഹൃദയം കർത്താവിലേക്ക് ഉയർത്തുക."]],
 fathers:[["മഹാനായ വിശുദ്ധ ലെയോ","ക്രിസ്തുവിന്റെ സ്വർഗാരോഹണം നമ്മുടെ ഉയർച്ചയാണ്; ശിരസ്സിന്റെ മഹത്വം മുമ്പേ പോയിടത്തേക്കു ശരീരത്തിന്റെ പ്രത്യാശ പിന്തുടരാൻ വിളിക്കപ്പെടുന്നു (സ്വർഗാരോഹണത്തെപ്പറ്റിയുള്ള പ്രസംഗം 73, 4)."],["വിശുദ്ധ അഗസ്റ്റിൻ","ഇന്നു നമ്മുടെ കർത്താവായ യേശുക്രിസ്തു സ്വർഗത്തിലേക്ക് ആരോഹണം ചെയ്തു; നമ്മുടെ ഹൃദയങ്ങളും അവിടുത്തോടൊപ്പം ആരോഹണം ചെയ്യട്ടെ… നമ്മിലേക്ക് ഇറങ്ങിവന്നപ്പോൾ അവിടുന്നു സ്വർഗം വിട്ടില്ല; വീണ്ടും സ്വർഗത്തിലേക്കു കയറിയപ്പോൾ നമ്മിൽനിന്നു പിൻവാങ്ങിയുമില്ല (സ്വർഗാരോഹണപ്രസംഗം)."]],
 magis:[["മതബോധനഗ്രന്ഥം 659–667","യേശുവിന്റെ മനുഷ്യത്വം ദൈവത്തിന്റെ സ്വർഗീയമണ്ഡലത്തിലേക്കു നിശ്ചിതമായി പ്രവേശിക്കുന്നതിനെ ക്രിസ്തുവിന്റെ സ്വർഗാരോഹണം കുറിക്കുന്നു; അവിടുത്തെ പിന്തുടരാമെന്ന പ്രത്യാശയിൽ നാം ജീവിക്കാൻ അവിടുന്നു നമുക്കു മുമ്പേ പോകുന്നു."],["മതബോധനഗ്രന്ഥം 1137–1139","സ്വർഗീയ ആരാധന: ആരോഹണം ചെയ്ത ക്രിസ്തുവാണ് യഥാർഥ ശ്രീകോവിലിലെ പ്രധാനപുരോഹിതൻ."],["മതബോധനഗ്രന്ഥം 2623","ശിഷ്യന്മാർ മറിയത്തോടൊപ്പം ആത്മാവിനായി കാത്തിരുന്നു പ്രാർഥനയിൽ നിലനിന്നു."]],
 saints:[["വരുംദിവസങ്ങൾ","മേയ് 9 ഞായർ: ക്യംതോയ്ക്കുശേഷമുള്ള ആറാം ഞായർ. മേയ് 16 ഞായർ: പന്തക്കുസ്താ."]],
 prayer:"സ്വർഗത്തിലേക്ക് ആരോഹണം ചെയ്ത കർത്താവായ യേശുമിശിഹായേ, ശിഷ്യന്മാരെ അനുഗ്രഹിക്കാൻ അങ്ങു കരങ്ങൾ ഉയർത്തി; ഞങ്ങളുടെ മനുഷ്യത്വം പിതാവിന്റെ വലത്തുഭാഗത്തേക്കു കൊണ്ടുപോയി. സ്വർഗത്തിൽനിന്നു ഞങ്ങളെ അനുഗ്രഹിക്കണമേ; ഞങ്ങളുടെ ഹൃദയങ്ങൾ അങ്ങയിലേക്ക് ഉയർത്തണമേ; അങ്ങയുടെ സുവിശേഷം പ്രഘോഷിക്കാൻ ഞങ്ങളെ അയയ്ക്കണമേ; അങ്ങയുടെ സഭയുടെമേൽ അങ്ങയുടെ ആത്മാവിനെ വർഷിക്കണമേ. ആമേൻ."},
 {quick:["അനുഗ്രഹിക്കാൻ ഉയർത്തിയ കരങ്ങളോടെ യേശു ആരോഹണം ചെയ്യുന്നു.","നമ്മുടെ മനുഷ്യത്വം സ്വർഗത്തിൽ പ്രവേശിച്ചു: ശിരസ്സുള്ളിടത്തു ശരീരവും എത്തുമെന്നു പ്രത്യാശിക്കുന്നു.","മുകളിലേക്കു നോക്കിനിൽക്കലല്ല, പുറപ്പെടലാണ്: സ്വർഗാരോഹണം ദൗത്യത്തിലേക്കു നയിക്കുന്നു."],action:"പന്തക്കുസ്താവരെ എല്ലാ ദിവസവും പ്രാർഥിക്കുക: “പരിശുദ്ധാത്മാവേ, എഴുന്നള്ളിവരണമേ.”",question:"എന്റെ ഹൃദയം കർത്താവിലേക്ക് ഉയർത്തപ്പെട്ടിരിക്കുന്നുവോ, അതോ ഭൗമികകാര്യങ്ങളിലേക്കു മാത്രം നോക്കുന്നുവോ?",
  special:"സുലൂക്കോ, നമ്മുടെ കർത്താവിന്റെ സ്വർഗാരോഹണം: കടമുള്ള ദിവസം; ജനങ്ങൾക്കുവേണ്ടിയുള്ള വിശുദ്ധ കുർബാന. പന്തക്കുസ്താവരെ പത്തു ദിവസത്തെ പ്രാർഥന (വായനാപുസ്തകത്തിലെപ്പോലെ വിവാഹാഘോഷങ്ങളില്ല).",
  illus:["ഒരു ഉദാഹരണം","ഒരു കേരളീയപിതാവു വിദേശത്തു ജോലിക്കു പോകുമ്പോൾ കുടുംബം വാതിൽക്കൽ ഒരുമിച്ചുകൂടുന്നു; കാർ പുറപ്പെടുംമുമ്പ് അദ്ദേഹം കൈയുയർത്തി മക്കളെ ആശീർവദിക്കുന്നു. ആ ആശീർവാദം മാസങ്ങളോളം അവർ ഓർക്കുന്നു. അനുഗ്രഹിക്കാൻ ഉയർത്തിയ കരങ്ങളോടെയാണ് യേശു ശിഷ്യന്മാരെ വിട്ടുപോയത്; അവിടുന്ന് അവ ഒരിക്കലും താഴ്ത്തിയിട്ടില്ല."],kids:"",diaspora:"",
  family:{read:"ഒന്നിച്ചു വായിക്കുക: ലൂക്കാ 24:50–53.",explain:"ഈസ്റ്ററിനു നാൽപതു ദിവസത്തിനുശേഷം യേശു തന്റെ കൂട്ടുകാരെ അനുഗ്രഹിച്ചു സ്വർഗത്തിലേക്കു പോയി. അവിടുന്നു പിതാവായ ദൈവത്തോടൊപ്പമാണ്; ഇപ്പോഴും നമ്മെ അനുഗ്രഹിക്കുന്നു. പരിശുദ്ധാത്മാവിനെ അയയ്ക്കുമെന്ന് അവിടുന്നു വാഗ്ദാനം ചെയ്തു.",intention:"വിദേശജോലി മൂലം വേർപിരിഞ്ഞിരിക്കുന്ന കുടുംബങ്ങൾക്കുവേണ്ടിയും പരിശുദ്ധാത്മാവിന്റെ ആഗമനത്തിനുവേണ്ടിയും നാം പ്രാർഥിക്കുന്നു.",ask:"ചോദിക്കുക: “ഈ പത്തു ദിവസം പരിശുദ്ധാത്മാവിനായി നമുക്ക് എങ്ങനെ ഒന്നിച്ചു പ്രാർഥിക്കാം?”"},
  catechism:[["മതബോധനഗ്രന്ഥം 659–667","സ്വർഗാരോഹണം."],["മതബോധനഗ്രന്ഥം 2623","ആത്മാവിനായി കാത്തിരുന്നുള്ള പ്രാർഥന."]],
  kidsaint:["എലീഷാ പ്രവാചകൻ","തന്റെ ഗുരുവായ ഏലിയാ സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ടപ്പോൾ എലീഷാ അവന്റെ മേലങ്കി എടുത്ത്, ദൈവത്തിന്റെ ജോലി തുടരാൻ അവന്റെ ആത്മാവു സ്വീകരിച്ചു. പാഠം: യേശു സ്വർഗത്തിലേക്കു പോയപ്പോൾ തന്റെ ജോലി തുടരാൻ തന്റെ ആത്മാവിനെ നമുക്കു നൽകി."],
  term:["സുലൂക്കോ","“ആരോഹണം” എന്നതിന്റെ സുറിയാനിപദം: ക്യംതോയ്ക്കു നാൽപതു ദിവസത്തിനുശേഷം, എപ്പോഴും വ്യാഴാഴ്ച, ആഘോഷിക്കുന്ന നമ്മുടെ കർത്താവിന്റെ സ്വർഗാരോഹണത്തിരുനാൾ."],
  termMore:["പത്തു ദിവസങ്ങൾ","സ്വർഗാരോഹണത്തിനും പന്തക്കുസ്തായ്ക്കുമിടയിൽ, മാളികമുറിയിൽ മറിയത്തോടൊപ്പമായിരുന്ന ശ്ലീഹന്മാരെപ്പോലെ (അപ്പ 1:14), പരിശുദ്ധാത്മാവിന്റെ ആഗമനത്തിനായി സഭ പ്രാർഥിക്കുന്നു."]},
 {homily:["പ്രിയ സഹോദരീസഹോദരന്മാരേ, ഉയിർപ്പിനു നാൽപതു ദിവസത്തിനുശേഷം യേശു ശിഷ്യന്മാരെ ബഥാനിയായിലേക്കു കൂട്ടിക്കൊണ്ടുപോകുന്നു. അവിടുന്നു കരങ്ങൾ ഉയർത്തി അവരെ അനുഗ്രഹിക്കുന്നു; അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കേ സ്വർഗത്തിലേക്കു സംവഹിക്കപ്പെടുന്നു. ശിഷ്യന്മാർക്ക് യേശുവിനെപ്പറ്റിയുള്ള അവസാനചിത്രം അനുഗ്രഹിക്കാൻ ഉയർത്തിയ കരങ്ങളാണ്. അവിടുന്ന് അവ ഒരിക്കലും താഴ്ത്തിയിട്ടില്ല.","സ്വർഗാരോഹണം എന്നാൽ യേശു വളരെ ദൂരെ പോയി എന്നല്ല. മറിയത്തിൽനിന്ന് അവിടുന്നു സ്വീകരിച്ച നമ്മുടെ മനുഷ്യപ്രകൃതി ഇപ്പോൾ പിതാവിന്റെ വലത്തുഭാഗത്ത് ഉപവിഷ്ടമായിരിക്കുന്നു എന്നാണ്. നമ്മുടെ ശിരസ്സായ അവിടുന്നു പോയിടത്തേക്ക് അവിടുത്തെ ശരീരമായ നാമും പിന്തുടരുമെന്നു പ്രത്യാശിക്കുന്നു. സ്വർഗമാണു നമ്മുടെ ഭവനം.","പക്ഷേ ദൂതന്മാർ പറയുന്നു: “അല്ലയോ ഗലീലിയരേ, നിങ്ങൾ ആകാശത്തിലേക്കു നോക്കിനിൽക്കുന്നതെന്ത്?” സ്വർഗാരോഹണം ആകാശത്തിലേക്കു നോക്കിനിൽക്കാനുള്ള സമയമല്ല; ദൗത്യത്തിനുള്ള സമയമാണ്. യേശു പറഞ്ഞു: “നിങ്ങൾ ലോകമെങ്ങും പോയി, എല്ലാ സൃഷ്ടികളോടും സുവിശേഷം പ്രസംഗിക്കുവിൻ.” അവർ എല്ലായിടത്തും പോയി പ്രസംഗിച്ചു; കർത്താവ് അവരോടുകൂടെ പ്രവർത്തിച്ചു.","ഏലിയാ എടുക്കപ്പെട്ടു; എലീഷാ അവന്റെ മേലങ്കിയും ആത്മാവും സ്വീകരിച്ചു. യേശു ആരോഹണം ചെയ്യുന്നു; പന്തക്കുസ്തായിൽ അവിടുന്നു തന്റെ ആത്മാവിനെ നമ്മുടെമേൽ അയയ്ക്കും. മറിയത്തോടൊപ്പമുള്ള ശ്ലീഹന്മാരെപ്പോലെ ഈ പത്തു ദിവസം നമുക്കു പ്രാർഥനയിൽ ചെലവഴിക്കാം: പരിശുദ്ധാത്മാവേ, എഴുന്നള്ളിവരണമേ. ഓരോ കുർബാനയിലും “ഹൃദയങ്ങൾ ഉയർത്തുവിൻ” എന്നു കേൾക്കുമ്പോൾ നമുക്ക് അവ യഥാർഥത്തിൽ അവിടുത്തേക്ക് ഉയർത്താം. ആമേൻ."],
  kids:["കുഞ്ഞുങ്ങളേ, ഇന്ന് യേശു സ്വർഗത്തിലേക്കു കയറിപ്പോയി! അവിടുന്നു കൂട്ടുകാരെ ഒരു കുന്നിലേക്കു കൊണ്ടുപോയി, കൈകൾ ഉയർത്തി അവരെ അനുഗ്രഹിച്ചു; പിന്നെ ഒരു മേഘം മറയ്ക്കുന്നതുവരെ ആകാശത്തിലേക്ക് ഉയർന്നു.","യേശു ഇപ്പോൾ പിതാവായ ദൈവത്തോടൊപ്പമാണ്; പക്ഷേ ഇപ്പോഴും നമ്മെ അനുഗ്രഹിക്കുകയും സ്നേഹിക്കുകയും ചെയ്യുന്നു. നമ്മെ സഹായിക്കാൻ പരിശുദ്ധാത്മാവിനെ അയയ്ക്കുമെന്ന് അവിടുന്നു വാഗ്ദാനം ചെയ്തു.","അടുത്ത പത്തു ദിവസം നമുക്ക് എല്ലാ ദിവസവും പ്രാർഥിക്കാം: “പരിശുദ്ധാത്മാവേ, എഴുന്നള്ളിവരണമേ!”"]});
})();

"2026-01-05":{"t":["Second Monday of Nativity"],"g":[{"h":"","r":[["1 Jn 5:1-5","Those who believe in Jesus are sons of God"],["Jn 5:19-23","The Son who does the works of the Father SEASON OF EPIPHANY (DENHA) The Syriac word Denaha has several meanings like dawn, manifestation, epiphany and revelation. In the season of epiphany we commemorate, the manifestation that began during the Baptism of Jesus at river Jordan. Jesus reveals Himself to the world, and the Father and the Holy Spirit give witness to it. “This is my beloved Son, with whom I am well pleased” (Mt. 3:17). The Mystery of Holy Trinity is revealed at the baptism of Jesus Christ. The Lord's Epiphany that is celebrated on 6th January, is called “feast of pindikuthi” in the northern region of Kerala and “feast of rakkuli” in the southern region. The expression, “the feast of pindikuthi” is derived from the practice of lighting wicks around the stem of plantain tree, by making procession around it shouting el payya (God is Light), to honour and praise Christ who is ‘the Light of the world'. The other name, ‘rakkuli' is derived from the practice of taking bath (ritual bath) in the nearby river or pond, on the eve of this feast, by our ancestors as reminder of the Baptism of Jesus Christ at river Jordan. It was completely a religious rite."]]},{"h":"All the readings of this season of Epiphany that commemorate the","r":[]},{"h":"public life of Christ, lead us to the personality of Christ. The election","r":[]},{"h":"of the apostles, as an important event of the public life, is also a","r":[]},{"h":"subject matter of meditation of the season of Epiphany. During this","r":[]},{"h":"season the Church teaches us that Christ, the Lamb of God who takes","r":[]},{"h":"away the sin, has come to find the sinners and, the salvation and the","r":[]},{"h":"forgiveness of sin are through Christ, the Son of God. Through the","r":[]},{"h":"readings of this season, we receive the knowledge and experience that","r":[]},{"h":"Jesus is the Fulfilment of the law, the Bread of life and the Merciful","r":[]},{"h":"and Good shepherd who send the apostles to the sheep who have no","r":[]},{"h":"shepherds.","r":[]},{"h":"On the Fridays of this season, the Church commemorates the","r":[]},{"h":"saints who have witnessed Jesus Christ and His redemptive Mysteries","r":[]},{"h":"through their lives. On the first Friday of this season, the Church","r":[]},{"h":"commemorates St. John the Baptist, who experienced the glory of","r":[]},{"h":"Jesus, even when he was in the maternal womb and who received the","r":[]},{"h":"testimony of the glory of revelation from heaven at the Baptism of","r":[]},{"h":"Jesus. On the following Fridays, the Church remembers the saints who","r":[]},{"h":"bore great witness to the life of Jesus Christ: Saint Peter and Saint","r":[]},{"h":"Paul, the Evangelists, Saint Stephan, the Greek and the Syriac Fathers","r":[]},{"h":"of the Church, the Patron saint of the parish. The last Friday of the","r":[]},{"h":"season of Epiphany is the Day of remembrance of All the Departed","r":[]},{"h":"Souls who are in the hope of Resurrection.","r":[]},{"h":"Since there should be seven weeks for the season of Great Fast","r":[]},{"h":"before the Feast of Easter, the number of the weeks in the season","r":[]},{"h":"of Epiphany may be differed. Another particularity of this season is","r":[]},{"h":"the observance of the Three Days Fast, the Rogation of Ninivites; the","r":[]},{"h":"Three Days Fast start eighteen days before the beginning of Great Fast","r":[]},{"h":"which is filled with the grace of repentance.","r":[]},{"h":"Together with the commemoration of Baptism of Jesus, this season","r":[]},{"h":"reminds each Christian to think deeply about his or her reception","r":[]},{"h":"of Baptism that made him/her the ‘son/daughter of God' and the","r":[]},{"h":"responsibilities taken up through it. Thus, the season of Epiphany is","r":[]},{"h":"the time to make attempt to love Jesus passionately by knowing Him,","r":[]},{"h":"by living in Him and by bearing witness to Him.","r":[]}]},

"2026-02-14":{"t":["Sixth Saturday of Denha"],"g":[{"h":"","r":[["Rev 7:11-17","He will guide them to springs of the water of life"],["Jn 7:32-39","Jesus the rivers of living water SEASON OF THE GREAT FAST (SAUMA RAMBA) The Passion, Death and Resurrection (The Paschal Mystery) that culminates the salvation event, take place at the end of Jesus' public life. The seven weeks between the Season of Epiphany and the Feast of"]]},{"h":"Easter are set aside for prayer, penance and fasting.","r":[]},{"h":"The base for the season known as the Great Fast, is the ‘forty days","r":[]},{"h":"fast' of Jesus. We normally call this season as ‘fifty days fast'. It is","r":[]},{"h":"known as ‘fifty days fast' may be from the practice of the observance","r":[]},{"h":"of this fast from the Pethurtha Sunday to the Easter Sunday by the St.","r":[]},{"h":"Thomas Christians. The Syriac term pethurtha signifies ‘to put an end'","r":[]},{"h":"and ‘turning back'. What is meant by this term is to indicate that the","r":[]},{"h":"days of sumptuous food and celebrations are over.","r":[]},{"h":"It is on the Wednesday of fourth week that we commemorate the","r":[]},{"h":"half of the Great Fast. This Wednesday particularly reminds us to","r":[]},{"h":"find solutions for the drawbacks of our life, to get identified with the","r":[]},{"h":"Paschal Mystery of Jesus and to live more faithfully in the grace of","r":[]},{"h":"fasting.","r":[]},{"h":"This season teaches us that the craze for material wealth causes sin.","r":[]},{"h":"The wealth which is God's gift is to be properly used and to be shared","r":[]},{"h":"with others. The salvation experience is received through repentance,","r":[]},{"h":"prayer, fasting and acts of charity. This season also gives us the inner","r":[]},{"h":"vision that we become the true disciples when we accept God as the","r":[]},{"h":"wealth, like the apostles who followed Jesus renouncing everything.","r":[]},{"h":"Salvation is received only when we confess sin. Those who throw","r":[]},{"h":"away the dirty mantle of sin can follow Christ. The Church teaches","r":[]},{"h":"that our sanctification is God's will and our sanctification is possible","r":[]},{"h":"only through Jesus Christ who offered His life – the Body and Blood –","r":[]},{"h":"for us to the Father.","r":[]},{"h":"Our body tempts us to do the undesired evil, but to live without","r":[]},{"h":"sinning is a great suffering. The season of Great Fast demands us to","r":[]},{"h":"suffer for the sanctification of our whole life. The sufferings that we","r":[]},{"h":"face and the sacrifices we do help us to grow in faith and to get united","r":[]},{"h":"with Christ. The Church teaches us that only when we stay together","r":[]},{"h":"faithfully to the sufferings of Christ, we can enter into the joy and","r":[]},{"h":"peace of the Resurrection of Christ.","r":[]}]},

"2026-05-23":{"t":["Seventh Saturday of Resurrection"],"g":[{"h":"","r":[["2 Cor 1: 17-22","Jesus Christ has given us His Spirit"],["Lk 11:5-13","The Holy Spirit will be given to those who ask SEASON OF THE APOSTLES (ŠLEEHE) The seven weeks from the feast of Pentecost are known as the season of the Apostles. During this season, Church invites our attention to the gift of Holy Spirit, the gifts and fruits of the Holy Spirit. The feast of Pentecost has an inevitable relation with the salvation history. In the Old Testament we read that the Israelites had celebrated the feast of Pentecost in connection with harvesting season. The term pentecost means fifty – feast on the fiftieth day. It was also the feast of offering of first fruits in connection with harvesting. But later on, this feast turned out to be the commemoration of Israelites becoming God's people by His covenant. In the New Testament, a ‘new' meaning was given to this feast. It is on the fiftieth day after the Resurrection, the Holy Spirit descended on the Apostles. It was on that day the ‘Church – Ecclesia' was officially inaugurated. It is after the Pentecost that the apostles who were filled with the Holy Spirit, went to the extremities of the world with the message of the New Covenant and laid foundations to different church communities. The Syriac term sleeha means ‘one who is sent'. This liturgical season reminds us the fact that all those who have received"]]},{"h":"Baptism and Anointing are ‘apostles', ‘who are sent'.","r":[]},{"h":"The first Friday of this season is called ‘Golden Friday'. The cure","r":[]},{"h":"that the paralytic received in the Name Jesus, is a guarantee that","r":[]},{"h":"whatever we ask in the Name of Jesus, will be granted.","r":[]},{"h":"It is the responsibility of God's people to proclaim the message of","r":[]},{"h":"salvation to the entire world by being filled with the Holy Spirit. This","r":[]},{"h":"season inspires us to be missionaries like the apostles. The declaration","r":[]},{"h":"of St. Thomas, the Apostle, who is sent by Christ, ‘Let us go and die","r":[]},{"h":"with Him' is an invitation to all of us who are believers. This season","r":[]},{"h":"reveals the God who protects those who are sent.","r":[]},{"h":"It reminds the responsibility to live a life, centred on Word of God,","r":[]},{"h":"by those who are sent to proclaim the Good News. It also emphasises","r":[]},{"h":"the necessity to bear witness fearlessly to God who is the Word. It is","r":[]},{"h":"when a grain of wheat falls to the ground and dies, it will produce","r":[]},{"h":"fruit. Therefore, Jesus reminds us to do the mission courageously and","r":[]},{"h":"that we gain eternal life through the suffering. The primary mission","r":[]},{"h":"of all the Christians is to give witness to Christ in any situations.","r":[]},{"h":"The Holy Spirit, the Helper sent by the Father, lives in all the","r":[]},{"h":"baptised individuals and showers His graces and fruits. The assistance","r":[]},{"h":"of the Holy Spirit is essential to remember all that is taught by Christ","r":[]},{"h":"and to obey His commandments in every moment of life. This season","r":[]},{"h":"reminds also that if we lose God's Spirit by sinning, the consequence","r":[]},{"h":"will be utter destruction.","r":[]},{"h":"We shall partake in the communion and unity of the apostles who","r":[]},{"h":"established new ecclesial communities with the message of the Master","r":[]},{"h":"by travelling all over the world. Holding fast the truth that we are the","r":[]},{"h":"temple of the Holy Spirit and with His continuous assistance, let us","r":[]},{"h":"proclaim Christ as the Apostles did.","r":[]}]},

"2026-07-11":{"t":["Seventh Saturday of the Apostles"],"g":[{"h":"","r":[["Rom 14:13-19","The Kingdom of God is the joy in the"]]},{"h":"Holy Spirit","r":[["Jn 16:16-24","Happiness that cannot be taken away"]]},{"h":"Saint Benedict of Nursia","r":[["Gen 17:1-8","Covenant with Abraham"],["Wis 9:1-12","Pray for wisdom"],["Rom 8:12-17","You will die if you live according to the flesh"],["Mt 5:1-12","Beatitudes SEASON OF SUMMER (KAITHA) The liturgical Season of Summer starts by commemorating the Twelve Apostles of our Lord. This season that lasts ordinarily for seven weeks is called the Season of Summer (season of harvesting, fruits, etc.) The term khaitha' means ‘summer'. Harvesting and the storing of the fruits are normally done in the season of summer. The liturgical season of Khaitha is a time that commemorates and celebrates the growth of the Church as well as the harvesting of spiritual fruits. Ordinarily, it has seven weeks. This season reminds us that the Church, that is rooted and extended to the far corners of the world by the missionary activities of the apostles and martyrs, started harvesting the fruits of sanctity and martyrdom. This season that connects the Seasons of Apostles and Elia-Sleeva Moses reminds us the activities of the Church and the necessity of being prepared to the second coming of the Saviour. The first Sunday of this season is the Feast of Twelve Apostles. This feast is also called Noosardel or ‘Feast of God'. On the Fridays of this season, the saints and martyrs who have made to grow the Church, watering with their own blood and witnessed Christ courageously, are remembered. Thus, the Church remembers: on the first Friday,"]]},{"h":"St. Jacob of Nisibis who sacrificed his life for the Lord Christ; on the","r":[]},{"h":"second Friday Mar Mari who was the disciple of Mar Addai and the","r":[]},{"h":"founder of Persian Church; on the fifth Friday St. Shmoni and her","r":[]},{"h":"seven Sons (2 Mac 7); and on the sixth Sunday Patriarch St. Simon","r":[]},{"h":"Barsabe (AD 323-341) who is reported to be the author of Lakumara","r":[]},{"h":"(the Hymn ‘Lord of all') and his fellow martyrs. The Church invites the","r":[]},{"h":"faithful to imitate their exemplary life.","r":[]},{"h":"It is when we stay united to the Christ that the Church can grow","r":[]},{"h":"and yield fruits. The Lord patiently awaits for the fruits of goodness","r":[]},{"h":"from the children of the Church. The readings of this season give","r":[]},{"h":"warning about the tragedies if we do not produce good fruits. Even","r":[]},{"h":"when the forces of darkness attack the Church – the arc of salvation,","r":[]},{"h":"Christ, the bridegroom of the Church, will lead her to the heavenly","r":[]},{"h":"Jerusalem. Therefore, this season gives us the hope that those who","r":[]},{"h":"take refuge in the Church need not be fearful. The world and all in it","r":[]},{"h":"will be destroyed; but the real treasure that is the faith in the Lord,","r":[]},{"h":"will last forever. Therefore, the season of Khaitha teaches to store","r":[]},{"h":"treasures in heaven without being trapped in the worldliness.","r":[]}]},

"2026-08-29":{"t":["The Seventh Saturday of Kaitha"],"g":[{"h":"","r":[["Philem 1:8-20","Accept him as I am"],["Mt 10:5-15","Reward in the kingdom of heaven for those who receive the disciples"]]},{"h":"Saint Euphrasia","r":[["Gen 12:1-4","God calls Abraham"],["Sir 2:1-6","Trust in the Lord"],["1 Thess 4:1-8","Life pleasing to God"],["Mk 10:35-45","The first among you must be the servant of all SEASONS OF ELIJAH-CROSS-MOSES (Ēliya-Sleeva-Mušae) The season of Elijah-Cross-Moses indicates the victory of the Cross and the second coming of the Lord. The feast of the Exaltation of the Holy Cross celebrated on the 14th of September is the focal point of this season. The first ecclesial community believed that before the second coming of Christ, Elijah would come (Mal 4:5) and will argue with the son of destruction and convince the world about his fault. This belief was grown because of the reality that Elijah was present with the Lord at the time of transfiguration. The Lord's transfiguration is the symbol of Lord's second coming. At the time of transfiguration, Moses also was with the Lord; that might be the reason that this liturgical season developed centring around the Cross. The Sunday after 14th September is considered as first Sunday of Sleeva. Till then the readings of the season of Elijah is continued. When the feast of the Exaltation of the Holy Cross falls on a Sunday, that will be the first Sunday of Sleeva. There was the belief in the first ecclesial community, what Jesus told about the sign that would appear in the sky before the second coming of Christ (Mt. 24:30), is the Cross. Therefore, the strength and the victory of the Cross are commemorated in this season. The prayers and hymns of this season include the apparition of Cross to the emperor Constantine, consequent victory and the finding of the Cross by the queen Helena, the mother of Constantine. Like Moses who showed the way to the Israelites, extending his staff on the Red sea, Christ saved the humanity by showing the way to the paradise through the Cross. During this season the Church invites us to prepare for the second coming of the Lord by assimilating the prophets of the true God and the commands and messages given through them by God, and by producing the fruits of repentance and conversion. The mother Church gives us the warning that you will perish unless you walk in the way of repentance abstaining from all evils, in the conviction that the desires of body are against the spirit. Since the day of the Lord is imminent, the Church invites us to attain the eternal life like the prudent virgins, ministering him vigilantly, and through attentiveness, faithfulness, prudence, equanimity, diligent service and continuous prayer. The bronze serpent that was raised by Moses in the Old Testament, is symbol of Jesus who was raise on the Cross to share the salvation. One who takes pride in the Name of the Lord, takes pride in the Cross, the sign of salvation, and in the sufferings. This season reminds us that all those who follow Him, who has died on the Cross and ascended into the glory of resurrection, have to bear the Cross. The readings of this season give us the conviction that it is inevitable to go through the suffering and death in order to enter into the glory. The manifestation of the glory of Christ, who has fulfilled God's will by accepting suffering and death, happened on the Cross. The Lord who will appear as the Judge at the end of the world, is the one who has seated at the right side of the Glory through His Death, Resurrection and Ascension. This season inspires the faithful to suffer with Christ who was raised by God, because He emptied himself even unto death on the Cross, in humility, to enter into glory. Death and final judgments are the themes of this Season of Moses. Jesus gives the consolation words that ‘the one who endures to the end, will be saved'. The Church teaches: bear fruits, enduring faith is fruitful, confront sufferings with faith to receive consolation and joy."]]}]},

var SX={
 sub:[["Season of Annunciation–Nativity (Subara–Yalda)","The liturgical year begins with the announcements of salvation: to Zechariah, to Mary, to Joseph. For about four weeks the Church meditates on God's promises fulfilled in the Incarnation, and then celebrates the birth of the Lord. A 25-day fast prepares for Christmas."],["മംഗളവാർത്ത–പിറവിക്കാലം (സൂബാറ–യൽദാ)","രക്ഷയുടെ മംഗളവാർത്തകളോടെ ആരാധനാവത്സരം ആരംഭിക്കുന്നു: സഖറിയായ്ക്കും മറിയത്തിനും ജോസഫിനും. ഏകദേശം നാലാഴ്ച, മനുഷ്യാവതാരത്തിൽ നിറവേറിയ ദൈവവാഗ്ദാനങ്ങളെപ്പറ്റി സഭ ധ്യാനിക്കുന്നു; പിന്നെ കർത്താവിന്റെ ജനനം ആഘോഷിക്കുന്നു. ഇരുപത്തഞ്ചു നോമ്പ് ക്രിസ്മസിന് ഒരുക്കുന്നു."]],
 den:[["Season of Epiphany (Denha)","Denha means the rising, or manifestation. Beginning with the Baptism of the Lord in the Jordan, where the Trinity is revealed, the Church contemplates Christ made known to the world. Its Fridays commemorate saints and the departed, the witnesses through whom Christ continues to be manifested."],["ദനഹാക്കാലം","ദനഹാ എന്നാൽ ഉദയം, പ്രത്യക്ഷീകരണം. പരിശുദ്ധ ത്രിത്വം വെളിപ്പെട്ട ജോർദാനിലെ മാമ്മോദീസയോടെ ആരംഭിച്ച്, ലോകത്തിനു വെളിപ്പെടുത്തപ്പെട്ട ക്രിസ്തുവിനെ സഭ ധ്യാനിക്കുന്നു. ഈ കാലത്തെ വെള്ളിയാഴ്ചകളിൽ, ക്രിസ്തു തുടർന്നും വെളിപ്പെടുന്ന സാക്ഷികളായ വിശുദ്ധരെയും മരിച്ചവരെയും ഓർക്കുന്നു."]],
 fast:[["Season of the Great Fast (Sauma Ramba)","Fifty days of prayer, fasting and almsgiving, beginning on the Monday of Ash Monday (Vibhoodi), following Christ through his fast in the desert to his Passion, death and burial. It ends with Holy Week: Hosanna Sunday, Pesaha, Good Friday and the Great Saturday."],["വലിയ നോമ്പുകാലം (സൗമാ റമ്പാ)","വിഭൂതിത്തിങ്കളാഴ്ച ആരംഭിക്കുന്ന പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും അമ്പതു ദിവസങ്ങൾ; മരുഭൂമിയിലെ ഉപവാസംമുതൽ പീഡാസഹനവും മരണവും സംസ്കാരവുംവരെ ക്രിസ്തുവിനെ പിന്തുടരുന്നു. ഓശാന ഞായർ, പെസഹാ, ദുഃഖവെള്ളി, വലിയ ശനി എന്നിവയുള്ള വിശുദ്ധവാരത്തോടെ അത് അവസാനിക്കുന്നു."]],
 qyam:[["Season of the Resurrection (Qyamtha)","Seven weeks of Easter joy. The Church celebrates the risen Lord, his appearances to the disciples, and the new life of Baptism, until the feast of Pentecost."],["ഉയിർപ്പുകാലം (ക്യംതാ)","ഈസ്റ്റർ സന്തോഷത്തിന്റെ ഏഴ് ആഴ്ചകൾ. ഉത്ഥിതനായ കർത്താവിനെയും ശിഷ്യർക്കുള്ള അവിടുത്തെ പ്രത്യക്ഷീകരണങ്ങളെയും മാമ്മോദീസയിലെ പുതുജീവനെയും പന്തക്കുസ്താവരെ സഭ ആഘോഷിക്കുന്നു."]],
 sliha:[["Season of the Apostles (Sliha)","From Pentecost, the Church remembers the coming of the Holy Spirit and the preaching of the apostles. It is the season of the Church's birth and mission, and our own apostle Thomas is honoured within it (Dukhrana, 3 July)."],["ശ്ലീഹാക്കാലം","പന്തക്കുസ്താമുതൽ, പരിശുദ്ധാത്മാവിന്റെ ആഗമനവും ശ്ലീഹന്മാരുടെ പ്രസംഗവും സഭ ഓർക്കുന്നു. സഭയുടെ ജനനത്തിന്റെയും ദൗത്യത്തിന്റെയും കാലം; നമ്മുടെ ശ്ലീഹായായ മാർ തോമായുടെ ദുക്റാനയും (ജൂലൈ 3) ഇതിനോടു ചേർന്നു വരുന്നു."]],
 qaita:[["Season of Summer (Kaitha)","Kaitha means summer, the season of fruit. The Church meditates on her growth and fruitfulness through the witness of the apostles, martyrs and saints."],["കൈത്താക്കാലം","കൈത്താ എന്നാൽ വേനൽ, ഫലങ്ങളുടെ കാലം. ശ്ലീഹന്മാരുടെയും രക്തസാക്ഷികളുടെയും വിശുദ്ധരുടെയും സാക്ഷ്യത്തിലൂടെയുള്ള സഭയുടെ വളർച്ചയെയും ഫലപുഷ്ടിയെയുംപറ്റി സഭ ധ്യാനിക്കുന്നു."]],
 esm:[["Season of Elijah–Cross–Moses","Three themes in one season. Elijah, taken up into heaven, recalls the Transfiguration and the forerunner of the Lord's coming; the Exaltation of the Cross (14 September) shows the sign of the Son of Man; and the weeks of Moses look toward the Lord's second coming and the judgement. It is the season of the Church watching for the end of history."],["ഏലിയാ–സ്ലീവാ–മൂശെക്കാലം","ഒരു കാലത്തിൽ മൂന്നു വിഷയങ്ങൾ. സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ട ഏലിയാ രൂപാന്തരീകരണത്തെയും കർത്താവിന്റെ വരവിന്റെ മുന്നോടിയെയും ഓർമിപ്പിക്കുന്നു; സ്ലീവാപ്പെരുന്നാൾ (സെപ്റ്റംബർ 14) മനുഷ്യപുത്രന്റെ അടയാളം കാണിക്കുന്നു; മൂശെയുടെ ആഴ്ചകൾ കർത്താവിന്റെ രണ്ടാം വരവിലേക്കും വിധിയിലേക്കും നോക്കുന്നു. ചരിത്രത്തിന്റെ അന്ത്യത്തിനായി ഉണർന്നിരിക്കുന്ന സഭയുടെ കാലം."]],
 qud:[["Season of the Dedication of the Church (Qudash Edtha)","The last four weeks of the year. The Church contemplates herself as the Bride presented to Christ and as the dwelling of God, and looks to her completion in the heavenly Jerusalem."],["പള്ളിക്കൂദാശക്കാലം (ഖുദാശ് ഏദ്താ)","വർഷത്തിന്റെ അവസാനത്തെ നാലാഴ്ച. ക്രിസ്തുവിനു സമർപ്പിക്കപ്പെട്ട മണവാട്ടിയായും ദൈവത്തിന്റെ വാസസ്ഥലമായും സഭ തന്നെത്തന്നെ ധ്യാനിക്കുന്നു; സ്വർഗീയ ജറുസലേമിലെ തന്റെ പൂർത്തീകരണത്തിലേക്കു നോക്കുന്നു."]],
 adv:[["Advent","Four weeks of joyful waiting for the Lord: for his coming at the end of time, and for the celebration of his birth at Christmas. Colour: violet."],["ആഗമനകാലം","കർത്താവിനായുള്ള സന്തോഷകരമായ കാത്തിരിപ്പിന്റെ നാലാഴ്ച: കാലത്തിന്റെ അന്ത്യത്തിലെ അവിടുത്തെ വരവിനായും ക്രിസ്മസിലെ അവിടുത്തെ ജനനത്തിന്റെ ആഘോഷത്തിനായും. നിറം: വയലറ്റ്."]],
 chr:[["Christmas Season","From the Nativity of the Lord to the Baptism of the Lord: the Word made flesh, the Holy Family, Mary Mother of God, and the Epiphany. Colour: white."],["ക്രിസ്മസ്കാലം","കർത്താവിന്റെ തിരുപ്പിറവിമുതൽ കർത്താവിന്റെ മാമ്മോദീസവരെ: മാംസമായ വചനം, തിരുക്കുടുംബം, ദൈവമാതാവായ മറിയം, ദനഹാ. നിറം: വെള്ള."]],
 ot:[["Ordinary Time","The numbered weeks in which the Church follows Christ's public life and teaching, Sunday by Sunday. Colour: green, the colour of growth."],["ആണ്ടുവട്ടം","ക്രിസ്തുവിന്റെ പരസ്യജീവിതവും പ്രബോധനവും ഞായറാഴ്ചതോറും സഭ പിന്തുടരുന്ന, എണ്ണമിട്ട ആഴ്ചകൾ. നിറം: വളർച്ചയുടെ നിറമായ പച്ച."]],
 lent:[["Lent","Forty days of prayer, fasting and almsgiving, from Ash Wednesday, preparing the catechumens for Baptism and all the faithful for Easter. Colour: violet."],["നോമ്പുകാലം","വിഭൂതി ബുധൻമുതൽ പ്രാർഥനയുടെയും ഉപവാസത്തിന്റെയും ദാനധർമത്തിന്റെയും നാൽപതു ദിവസങ്ങൾ; ജ്ഞാനസ്നാനാർഥികളെ മാമ്മോദീസയ്ക്കും എല്ലാ വിശ്വാസികളെയും ഈസ്റ്ററിനും ഒരുക്കുന്നു. നിറം: വയലറ്റ്."]],
 holy:[["Holy Week","From Palm Sunday to the Easter Triduum: the Lord's entry into Jerusalem, the Last Supper, his Passion and death, and the vigil of the Resurrection."],["വിശുദ്ധവാരം","ഓശാന ഞായർമുതൽ ഈസ്റ്റർ ത്രിദിനംവരെ: കർത്താവിന്റെ ജറുസലേം പ്രവേശനം, അന്ത്യത്താഴം, പീഡാസഹനവും മരണവും, ഉയിർപ്പിന്റെ ജാഗരണം."]],
 east:[["Easter Season","Fifty days of Easter joy, from the Resurrection to Pentecost, celebrated as one great Sunday. Colour: white."],["ഈസ്റ്റർകാലം","ഉയിർപ്പുമുതൽ പന്തക്കുസ്താവരെ, ഒരൊറ്റ മഹാ ഞായറായി ആഘോഷിക്കുന്ന ഈസ്റ്റർ സന്തോഷത്തിന്റെ അമ്പതു ദിവസങ്ങൾ. നിറം: വെള്ള."]]
